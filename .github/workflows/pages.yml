# Les pages de `web/` sont fabriquées depuis `outils/gabarit/` puis versionnées,
# car Cloudflare les sert sans étape de construction. Le risque tenait à l'oubli :
# un module modifié, une reconstruction sautée, et les visiteurs recevaient
# l'ancienne page. Ce workflow retire l'oubli de l'équation.
#
# Sur une poussée, il reconstruit et valide lui-même le résultat : une retouche
# du gabarit faite depuis un téléphone ou une session distante suffit, la page
# suit. Le commit qui en résulte réveille à son tour le déploiement Cloudflare.
#
# La poussée est faite avec le jeton de l'action, qui ne redéclenche aucun
# workflow : la reconstruction ne peut donc pas s'appeler en boucle.
#
# Sur une pull request, il se contente de signaler l'écart — la branche peut
# venir d'une bifurcation, où l'action n'a pas le droit d'écrire.
name: Pages

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Reconstruire les pages
        run: npm run construire

      # Contrôle le JavaScript de toutes les pages construites, analysé en
      # module ES : plus sévère qu'un `<script>` classique, elle refuse les
      # redéclarations — la collision que l'espace de noms unique rend possible.
      - name: Contrôler la syntaxe des pages
        run: node outils/controle.js

      # `CARTE.md` est une sortie de construction au même titre que `web/`, et
      # `npm run verifie` contrôle les deux. Ce workflow n'en regardait qu'une :
      # un index en retard passait donc les contrôles, restait en retard sur
      # `main`, et ne se découvrait qu'au prochain `npm run verifie` de
      # quelqu'un — qui échouait alors sur un fichier qu'il n'avait pas touché.
      - name: Valider la reconstruction
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain web CARTE.md)" ]; then
            echo 'Pages déjà à jour.'
            exit 0
          fi
          echo 'Pages reconstruites :'
          git status --porcelain web CARTE.md
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web CARTE.md
          git commit -m 'Reconstruit les pages depuis le gabarit'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Signaler un retard des pages
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain web CARTE.md)" ]; then
            echo 'Les pages versionnées sont en retard sur outils/gabarit/ :'
            git status --porcelain web CARTE.md
            echo
            echo 'Lancez « npm run construire » et validez le résultat.'
            exit 1
          fi
          echo 'Pages à jour : web/ et CARTE.md correspondent bien à outils/gabarit/.'

      # Toute phrase affichée doit exister en anglais : le contrôle relève les
      # chaînes visibles du gabarit et les cherche dans `outils/anglais/`. Placé
      # après la validation, il ne retient pas la reconstruction des pages — il
      # signale seulement la traduction manquante.
      - name: Contrôler les traductions
        run: node outils/traductions.js

      # Les contrôles qui précèdent lisent les sources ; aucun n'ouvre une page.
      # Ceux-ci la chargent dans Chromium comme un visiteur — recherche, fiche,
      # bascule de langue, rendu SVG, écran de téléphone — et échouent sur une
      # erreur JavaScript ou un appel à un tiers. Placés en dernier, eux non
      # plus ne retiennent pas la reconstruction.
      - name: Installer Chromium pour les essais
        run: npx playwright install --with-deps chromium

      - name: Essayer les pages dans un navigateur
        run: npm run navigateur

      # Trace, captures et état de la page de chaque essai raté : de quoi voir
      # ce qui a cassé sans le rejouer (`npx playwright show-trace`).
      - name: Garder les traces des essais ratés
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: essais-navigateur
          path: test-results/
          retention-days: 7
