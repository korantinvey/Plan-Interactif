# Les pages de `web/` se construisent depuis `outils/gabarit/` — chez
# Cloudflare au déploiement (`wrangler.jsonc` `build`), ici pour les contrôler.
# Elles ne sont plus versionnées : ce workflow ne les valide donc plus, il
# s'assure qu'elles se construisent, que leur syntaxe tient et que leur anglais
# est complet. Une page qui ne se construit pas échouerait de toute façon au
# déploiement ; mieux vaut le voir ici, sur la branche, qu'en production.
#
# Reste `CARTE.md`, l'index des sources, qui est versionné parce qu'on le lit
# sans rien construire. Sur une poussée, il est refait et validé s'il était en
# retard ; la poussée se fait avec le jeton de l'action, qui ne redéclenche
# aucun workflow. Sur une pull request, l'écart est seulement signalé — la
# branche peut venir d'une bifurcation, où l'action n'a pas le droit d'écrire.
name: Pages

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Construire les pages
        run: npm run construire

      # Le JavaScript de toutes les pages construites, analysé en module ES :
      # plus sévère qu'un `<script>` classique, il refuse les redéclarations —
      # la collision que l'espace de noms unique rend possible.
      - name: Contrôler la syntaxe des pages
        run: node outils/controle.js

      # Toute phrase affichée doit exister en anglais : le contrôle relève les
      # chaînes visibles du gabarit et les cherche dans `outils/anglais/`.
      - name: Contrôler les traductions
        run: node outils/traductions.js

      - name: Valider l'index des sources
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain CARTE.md)" ]; then
            echo 'CARTE.md déjà à jour.'
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CARTE.md
          git commit -m "Refait l'index des sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Signaler un index en retard
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain CARTE.md)" ]; then
            echo 'CARTE.md est en retard sur ses sources : lancez « npm run construire » et validez-le.'
            exit 1
          fi
          echo 'CARTE.md à jour.'
