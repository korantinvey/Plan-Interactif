# Relit chaque pull request et commente ce qu'elle y trouve.
#
# Les contrôles mécaniques du dépôt tiennent déjà beaucoup : `Pages` reconstruit
# les pages, analyse le JavaScript de tout ce qui est servi et refuse une phrase
# affichée sans traduction. Restait ce qu'aucun script ne sait voir, et qui se
# paie après la fusion — un effet CSS ajouté au plan mais jamais rejoué dans le
# rendu WebGL, donc invisible pour qui regarde ; une migration datée d'avant la
# dernière de `main`, qui fait échouer le déploiement sur `main` ; un fichier
# fabriqué corrigé en direct, que la construction suivante efface. Chacun de ces
# trois-là est déjà arrivé.
#
# Ce que la relecture cherche vit dans `.claude/skills/relecture/SKILL.md`, et
# non dans ce fichier : la même liste sert aux sessions qui relisent à la main,
# et une liste tenue à deux endroits finit par dire deux choses.
#
# Elle propose, elle ne pousse pas. Les outils accordés ci-dessous ne savent que
# lire le dépôt et écrire des commentaires — ni édition, ni commit, ni poussée —
# et le jeton n'a que `contents: read`. Ce qu'il faut corriger se corrige à la
# main, ou dans une session, jamais par cette tâche.
#
# Deux authentifications possibles, et une seule suffit. `CLAUDE_CODE_OAUTH_TOKEN`
# fait consommer un abonnement Claude, `ANTHROPIC_API_KEY` facture à l'appel. Le
# premier est préféré : il ne coûte rien de plus que ce qui est déjà payé, et
# `/install-github-app` le fabrique et le pose tout seul. Les deux entrées sont
# passées à l'action, celle qui reste vide valant absente — c'est déjà ce qu'elle
# voit quand un workflow n'en déclare qu'une.
#
# Dernier point, qui se découvre mal : l'action refuse de tourner quand ce
# fichier diffère de la version portée par `main`, pour qu'une pull request ne
# le réécrive pas afin de détourner le jeton. Une retouche d'ici ne s'essaie
# donc pas sur sa propre pull request — la tâche s'arrête en vert, en le disant
# dans son journal, et ne vaut qu'après la fusion. On la relance alors depuis
# l'onglet « Actions » pour la voir enfin partir.
name: Relecture

on:
  pull_request:
    types: [opened, synchronize]
    # Une pull request qui ne porte que des fichiers fabriqués n'a rien à relire
    # — typiquement le commit que `Pages` ajoute quand `web/` était en retard :
    # une ligne de gabarit en réécrit un millier, recopiées quatre fois. Le
    # filtre ne retire que les pull requests faites *uniquement* de ces
    # fichiers ; dès qu'une source bouge aussi, la relecture a lieu.
    paths-ignore:
      - 'web/**'
      - 'CARTE.md'
      - 'outils/tpl-multi.html'

# Une poussée de plus rend la relecture précédente caduque : on l'interrompt,
# plutôt que de payer un avis sur du code qui n'est plus là.
concurrency:
  group: relecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relire:
    runs-on: ubuntu-latest
    # Une branche venue d'une bifurcation n'a pas accès aux secrets du dépôt :
    # la tâche échouerait sans rien dire d'utile. On s'abstient.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      JETON: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLE: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # Sans aucun des deux secrets, la tâche s'arrête en vert au lieu de rougir à
      # chaque pull request : un garde-fou absent n'est pas un défaut du code relu.
      # Le journal nomme la voie retenue, seul endroit où cela se lit après coup.
      - name: Vérifier qu'une authentification est posée
        id: acces
        run: |
          if [ -n "$JETON" ]; then
            echo 'Authentification par abonnement (CLAUDE_CODE_OAUTH_TOKEN).'
            echo 'posee=oui' >> "$GITHUB_OUTPUT"
          elif [ -n "$CLE" ]; then
            echo 'Authentification par clé API (ANTHROPIC_API_KEY).'
            echo 'posee=oui' >> "$GITHUB_OUTPUT"
          else
            echo 'Aucune authentification posée : relecture ignorée.'
            echo 'Posez CLAUDE_CODE_OAUTH_TOKEN (claude setup-token, ou'
            echo '/install-github-app) ou ANTHROPIC_API_KEY dans'
            echo 'Settings → Secrets and variables → Actions.'
            echo 'posee=non' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.acces.outputs.posee == 'oui'
        with:
          # Tout l'historique : comparer l'horodatage d'une migration à la
          # dernière de `main` demande de connaître `main`, qu'un clone
          # superficiel ne rapporte pas.
          fetch-depth: 0

      # L'heure d'avant, à deux minutes près, pour reconnaître plus bas un avis
      # posé par cette exécution d'un avis laissé par la précédente — que
      # `--edit-last` réécrit parfois, ce qui déplace sa date.
      - name: Relever l'heure d'avant la relecture
        id: avant
        if: steps.acces.outputs.posee == 'oui'
        run: echo "instant=$(date -u -d '-2 minutes' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Ce que cette poussée apporte de relisible. Une poussée qui ne fait que
      # refusionner `main` et reconstruire les pages ne change aucune source :
      # la relecture n'a alors rien de neuf à dire, et se taire est sa bonne
      # réponse — le garde-fou plus bas ne doit pas le lui reprocher. C'est ce
      # que dit déjà `paths-ignore`, qui ne sait le dire que pour une pull
      # request entière, jamais pour une poussée dans une pull request qui
      # porte des sources par ailleurs.
      - name: Voir si cette poussée apporte des sources à relire
        id: neuf
        if: steps.acces.outputs.posee == 'oui'
        env:
          ACTION: ${{ github.event.action }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.event.after }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$ACTION" != "synchronize" ] || [ -z "$AVANT" ]; then
            echo "Pull request ouverte : tout son diff est à relire."
            echo 'relisible=oui' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Le commit d'avant peut manquer au clone — une branche réécrite, un
          # historique élagué. On ne conclut alors rien, et l'on relit.
          if ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            echo "Le commit précédent n'est pas dans ce clone : on relit."
            echo 'relisible=oui' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Le diff de la pull request, et non celui de la poussée : fusionner
          # la base change le second de fond en comble sans rien changer au
          # premier, qui est ce que la relecture lit. Les entêtes de morceau
          # sont retirées avant de comparer — quarante lignes venues de la base
          # plus haut dans le fichier décalent les numéros sans rien changer à
          # ce qu'il y a à relire.
          empreinte() {
            git diff "$BASE...$1" -- . ':!web' ':!CARTE.md' ':!outils/tpl-multi.html' \
              | { grep -E '^(diff --git|[-+])' || true; } \
              | { grep -vE '^(\+\+\+|---)' || true; } \
              | sha1sum | cut -d' ' -f1
          }
          if [ "$(empreinte "$AVANT")" = "$(empreinte "$APRES")" ]; then
            echo "Cette poussée ne change rien au diff relisible de la pull"
            echo "request — fichiers fabriqués, fusion de la base. La relecture"
            echo "tourne quand même, mais son silence ne sera pas tenu pour une"
            echo "panne : elle a déjà tout dit sur ce diff-là."
            echo 'relisible=non' >> "$GITHUB_OUTPUT"
          else
            echo "Le diff relisible a changé : relecture pleine."
            echo 'relisible=oui' >> "$GITHUB_OUTPUT"
          fi

      # Une relecture qui n'aboutit pas ne rougit pas la pull request. C'est le
      # même raisonnement que la garde plus haut, poussé jusqu'au bout : un
      # garde-fou en panne n'est pas un défaut du code relu, et une croix rouge
      # posée sur chaque pull request du dépôt n'apprend qu'une chose, à ne plus
      # regarder les croix rouges. La panne se lit à l'étape suivante, qui la
      # nomme et l'affiche en avertissement.
      - uses: anthropics/claude-code-action@v1
        id: relire
        if: steps.acces.outputs.posee == 'oui'
        continue-on-error: true
        # Une relecture aboutie prend cinq minutes ; passé le triple, elle
        # tourne pour rien. Sans cette borne elle tenait le runner sans rien
        # dire — et faute de journal avant la fin, une tâche en cours ne se
        # distingue pas d'une tâche partie en boucle. La borne la fait échouer,
        # donc parler : l'étape de diagnostic la nomme.
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # L'action refuse d'être déclenchée par un robot, pour qu'un robot ne
          # l'appelle pas en boucle. Or les pull requests de ce dépôt sont
          # ouvertes depuis une session, donc signées `claude[bot]` : sans cette
          # ligne la relecture ne se lançait que sur celles ouvertes à la main,
          # ce qui ne s'est vu qu'en lisant le journal d'une tâche rouge. On
          # nomme ce seul robot plutôt que `*`, qui ferait relire les pull
          # requests de n'importe quel automate. Aucune boucle à craindre : la
          # tâche ne part qu'à l'ouverture et à la poussée, jamais sur un
          # commentaire, et la relecture ne sait que commenter.
          allowed_bots: claude
          prompt: |
            DÉPÔT : ${{ github.repository }}
            PULL REQUEST : ${{ github.event.pull_request.number }}
            BRANCHE DE BASE : ${{ github.event.pull_request.base.ref }}

            La branche de la pull request est déjà là, dans le répertoire courant.
            Tout l'historique est là aussi : `origin/${{ github.event.pull_request.base.ref }}`
            se lit directement, ce qu'il faut pour comparer l'horodatage d'une
            migration ajoutée à la dernière que la base porte déjà.

            Lis d'abord `.claude/skills/relecture/SKILL.md` : il dit ce que ce
            dépôt paie cher et ce que ses contrôles mécaniques voient déjà — ne
            signale pas ce qu'ils voient. Lis ensuite `CLAUDE.md` pour les
            conventions, et sers-toi de `CARTE.md`, qui donne les numéros de
            ligne, plutôt que d'ouvrir les gros modules en entier.

            Relis le diff de la pull request, puis écris en français accentué.
            Lis-le sans les fichiers fabriqués, qui recopient les sources en
            quatre exemplaires et noieraient le reste :

                git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- . ':!web' ':!CARTE.md' ':!outils/tpl-multi.html'

            Poste un commentaire général avec
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file <fichier>`,
            et sans `--edit-last` si la commande échoue faute d'un avis
            précédent : une pull request reprise cinq fois n'a pas à porter cinq
            avis dont quatre périmés. Dedans : ce que tu as
            regardé en une phrase, puis ce que tu as trouvé, du plus grave au
            plus léger, chaque point nommant le fichier, la ligne, le cas où ça
            casse et la correction. Utilise
            `mcp__github_inline_comment__create_inline_comment` (avec
            `confirmed: true`) pour ce qui se montre mieux posé sur la ligne
            même.

            Ne dis que ce dont tu es sûr, et dis-le comme incertain quand il
            l'est : trois remarques justes valent mieux que douze dont la
            moitié sont des suppositions. Si tu ne trouves rien, dis-le en une
            ligne en nommant ce que tu as vérifié — c'est une information, pas
            un silence. Tout passe par les commentaires GitHub : ne rends rien
            en simple message.
          # Lire le dépôt et commenter, rien d'autre : ni `Edit`, ni `Write`,
          # ni `git commit`, ni `git push`. La relecture propose.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(sed -n:*)"

      # L'action cache la sortie du modèle — un journal de tâche est public, et
      # elle peut y verser ce qu'ont rendu les outils. Le revers : une relecture
      # qui meurt sur sa première demande ne dit pas pourquoi, et le mode
      # débogage de GitHub n'y change rien, contrairement à ce que son message
      # laisse croire. Deux heures se sont perdues là.
      #
      # On ne relève donc du compte-rendu que son dernier message : ce qu'il dit
      # de la tâche elle-même, et rien de ce qu'elle a lu ni écrit. Ce message
      # porte deux choses. Ce que la relecture a coûté — durée, nombre
      # d'échanges, jetons lus et écrits, dont ceux servis par le cache —, relevé
      # à chaque exécution, parce qu'une dépense qu'on ne voit pas ne se juge
      # pas. Et la raison d'un échec, quand il y en a un.
      - name: Dire ce que la relecture a coûté, et pourquoi elle a échoué
        id: rapport
        if: always() && steps.relire.outcome != 'skipped'
        env:
          COMPTE_RENDU: ${{ steps.relire.outputs.execution_file }}
          ISSUE: ${{ steps.relire.outcome }}
        run: |
          if [ "$ISSUE" = "failure" ]; then
            echo "::warning::La relecture n'a pas abouti ; sa raison suit."
          fi
          if [ -z "$COMPTE_RENDU" ] || [ ! -f "$COMPTE_RENDU" ]; then
            echo "Aucun compte-rendu : la tâche s'est arrêtée avant d'en écrire un."
            exit 0
          fi
          python3 - "$COMPTE_RENDU" "$ISSUE" <<'PY'
          import json, os, sys
          brut = open(sys.argv[1], encoding="utf-8").read().strip()
          echoue = sys.argv[2] == "failure"
          try:
              messages = json.loads(brut)
              if isinstance(messages, dict):
                  messages = [messages]
          except json.JSONDecodeError:
              # Le compte-rendu est parfois écrit un message par ligne.
              messages = [json.loads(l) for l in brut.splitlines() if l.strip()]

          # Une relecture arrêtée avant d'avoir commencé — l'action refuse de
          # tourner quand ce workflow diffère de celui de `main` — ne laisse
          # aucun message `result`. C'est ce qui distingue « elle n'a rien dit »
          # de « elle n'a pas parlé », et l'étape suivante en a besoin.
          eu_lieu = False
          for m in messages:
              if not (isinstance(m, dict) and m.get("type") == "result"):
                  continue
              eu_lieu = True
              duree = m.get("duration_ms")
              if duree is not None:
                  print("durée     :", round(duree / 1000), "s")
              print("échanges  :", m.get("num_turns"))
              refus = m.get("permission_denials_count")
              if refus:
                  print("refusés   :", refus, "appels d'outil")
              cout = m.get("total_cost_usd")
              if cout is not None:
                  print("coût      :", f"{cout:.4f} USD" if cout else "0 (abonnement)")
              for modele, u in (m.get("modelUsage") or {}).items():
                  lus = (u.get("inputTokens") or 0)
                  caches = (u.get("cacheReadInputTokens") or 0) + (u.get("cacheCreationInputTokens") or 0)
                  ecrits = (u.get("outputTokens") or 0)
                  print(f"{modele} : {lus + caches} jetons lus dont {caches} de cache, {ecrits} écrits")
              if echoue:
                  print("sous-type :", m.get("subtype"))
                  print("en erreur :", m.get("is_error"))
                  raison = m.get("result") or m.get("error") or ""
                  print("raison    :", str(raison)[:2000] if raison else "(aucune)")

          sortie = os.environ.get("GITHUB_OUTPUT")
          if sortie:
              with open(sortie, "a", encoding="utf-8") as f:
                  f.write("eu_lieu=%s\n" % ("oui" if eu_lieu else "non"))
          if not eu_lieu:
              print("Aucun message de fin : la relecture ne s'est pas tenue.")
          PY

      # Une relecture muette et une relecture satisfaite ont exactement la même
      # tête sur la pull request : la tâche sort verte dans les deux cas. C'est
      # arrivé sur un diff de 71 000 lignes — elle a tourné deux minutes
      # quarante, s'est vu refuser dix de ses propres appels d'outil, puis a
      # rendu son avis en message simple, que l'action assainit et jette. Vu de
      # la pull request : rien, et rien ne disait que c'était rien.
      #
      # On regarde donc si un avis a bien été posé depuis le début de la tâche,
      # et on le dit sur la pull request quand il n'y en a pas.
      #
      # Trois réserves, et chacune est une fausse alerte déjà posée pour de
      # bon. Cette étape ne parle que d'une relecture qui s'est réellement
      # tenue — celle qu'arrête la garde d'identité du workflow n'a rien à
      # dire, et se plaindre de son silence revient à commenter chaque pull
      # request qui touche à ce fichier, la première ayant été la sienne. Elle
      # ne parle que d'une poussée qui apportait des sources : sur une
      # reconstruction des pages, la relecture rend son avis en vingt secondes
      # sans rien poster, et c'est juste. Et en cas de doute, une requête qui
      # échoue, elle se tait : une fausse alerte vaut moins que le silence
      # qu'elle dénonce.
      - name: Dire si la relecture n'a rien posé
        if: always() && steps.relire.outcome == 'success' && steps.rapport.outputs.eu_lieu == 'oui' && steps.neuf.outputs.relisible == 'oui'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DEPUIS: ${{ steps.avant.outputs.instant }}
          EXECUTION: ${{ github.run_id }}
        run: |
          # `--paginate` rend un nombre par page : on les additionne. Une
          # requête en échec rend 1, soit « un avis a été posé » — le doute se
          # tranche du côté qui ne dit rien.
          filtre=".[] | select(.user.login == \"claude[bot]\") | select(.updated_at > \"$DEPUIS\")"
          compte() {
            pages="$(gh api "repos/$DEPOT/$1/$PR/comments" --paginate \
                       --jq "[$filtre] | length" 2>/dev/null)" || { echo 1; return; }
            printf '%s\n' "$pages" | awk '{t += $1} END {print t + 0}'
          }
          generaux="$(compte issues)"
          enligne="$(compte pulls)"
          if [ "${generaux:-1}" -gt 0 ] || [ "${enligne:-1}" -gt 0 ]; then
            echo "Avis posé : $generaux commentaire(s), $enligne annotation(s)."
            exit 0
          fi
          echo "::warning::La relecture a abouti sans rien poster ; on le dit sur la pull request."
          {
            echo "La relecture a tourné jusqu'au bout **sans rien écrire ici**."
            echo "Ne lisez donc pas ce silence comme un « rien à signaler » :"
            echo "ce diff n'a pas été relu."
            echo
            echo "[Le journal de la tâche]($GITHUB_SERVER_URL/$DEPOT/actions/runs/$EXECUTION)"
            echo "dit ce qu'elle a coûté et combien de ses appels d'outil ont été"
            echo "refusés. Un diff très large en fait refuser beaucoup : il se"
            echo "relit alors par domaine, en plusieurs fois."
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > "$RUNNER_TEMP/muette.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/muette.md"
