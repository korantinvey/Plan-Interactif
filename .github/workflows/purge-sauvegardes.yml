# Ponctuel : efface les sauvegardes en clair déposées avant leur chiffrement.
#
# Le dépôt est public, et ces artefacts se téléchargeaient par tout compte
# GitHub. Ce workflow ne vit que le temps de tourner une fois, sur la branche
# qui chiffre les sauvegardes suivantes ; il en est retiré aussitôt après.
name: Purge des sauvegardes en clair

on:
  push:
    branches: [claude/bold-feynman-cid7rx]
    paths: [.github/workflows/purge-sauvegardes.yml]

permissions:
  actions: write

jobs:
  purger:
    runs-on: ubuntu-latest
    steps:
      - name: Effacer les artefacts sauvegarde-*
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("sauvegarde-")) | .id')
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && n=$((n+1))
          done
          echo "Sauvegardes effacées : $n"
          reste=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("sauvegarde-"))] | length' | paste -sd+ | bc)
          echo "Il en reste : $reste"
          [ "$reste" = "0" ]
