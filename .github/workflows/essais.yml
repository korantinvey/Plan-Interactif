# Les essais, en deux niveaux : la base sur chaque pull request, le reste sur
# `main` et chaque nuit.
#
# `Pages` reconstruit les pages et contrôle leur syntaxe ; rien ne vérifiait
# qu'elles marchent. Ce workflow lance ce qu'un contributeur lance chez lui :
# la relecture ESLint, le cliquet des types, le typage des fonctions Supabase, les
# douze cas du moteur de la journée organisée,
# puis le plan dans un vrai navigateur — ouvert, cherché, lu en fiche, en
# anglais, sur téléphone (`outils/essais/navigateur/`).
#
# Pourquoi deux niveaux. Tous les essais du navigateur sur chaque branche
# faisaient attendre cinq à dix minutes le moindre correctif. Sur leurs quatre
# premiers jours, près de quatre cents exécutions, ils n'ont rougi que deux fois,
# et deux fois par lenteur, jamais sur un vrai défaut. Ce qui protège vraiment
# coûte peu : chaque page s'ouvre sans erreur, le parcours du visiteur tient,
# rien d'étranger ne s'exécute. Ces essais-là portent l'étiquette `@base` et
# bloquent la pull request. Les scènes d'interface fines (bulle de la visite,
# Échap sur deux fenêtres, borne, boîte à outils du dessin) se rejouent
# après la fusion et chaque nuit, en tranches parallèles : un défaut s'y voit
# le jour même, sans que chaque branche paie pour lui.
#
# Les essais du navigateur ne parlent jamais au réseau : les données du plan
# sont servies depuis `outils/donnees/plans.json`. Une panne de la production ne peut
# donc pas faire rougir ce workflow, ni ce workflow peser sur la production.
name: Essais

on:
  # Une branche n'est éprouvée qu'une fois sa pull request ouverte : la poussée
  # et la pull request lançaient sinon deux fois les mêmes essais sur le même
  # commit.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: essais-${{ github.ref }}
  # Une pull request poussée à nouveau rend l'exécution d'avant inutile. Sur
  # `main` en revanche, chaque fusion mérite son passage complet : annuler
  # laissait les fusions rapprochées sans essai complet.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  essais:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # Les essais portent sur ce que la construction produit, pas sur ce qui
      # est versionné : une page en retard sur son gabarit serait sinon éprouvée
      # à la place de la bonne.
      - name: Construire les pages
        run: npm run construire

      - name: Relecture par ESLint
        run: npm run lint

      - name: Types (cliquet de outils/controles/types-acceptes.json)
        run: npm run types

      - name: Portes et boucles d'imports (cliquet de outils/controles/portes-acceptees.json)
        run: npm run portes

      - name: Le guide ne cite que ce qui existe (CLAUDE.md)
        run: npm run guide

      - name: Moteur de la journée organisée
        run: npm run essais

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Le plan dans le navigateur, essais de base
        run: npm run navigateur-base

      - name: Garder la trace d'un échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-du-navigateur-base
          path: test-results/
          retention-days: 7

  # Le reste des essais du navigateur, hors pull request. Quatre tranches en
  # parallèle : le dépôt est public, les minutes ne coûtent rien, et l'attente
  # est celle de la tranche la plus longue.
  complet:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tranche: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Construire les pages
        run: npm run construire

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Le plan dans le navigateur, tranche ${{ matrix.tranche }} sur 4
        run: npx playwright test --grep-invert @base --shard=${{ matrix.tranche }}/4

      - name: Garder la trace d'un échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-du-navigateur-${{ matrix.tranche }}
          path: test-results/
          retention-days: 7

  # Le typage des fonctions Supabase ne tournait que dans `Supabase`, donc sur
  # `main` seule, au moment de déployer : une branche pouvait arriver verte avec
  # une fonction qui ne type pas, et l'on ne l'apprenait qu'une fois fusionnée.
  # Le voici sur chaque branche, à part des essais : il n'a besoin ni des pages
  # construites ni des dépendances npm, et tourne pendant qu'eux s'installent.
  fonctions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Typage des fonctions Supabase
        run: npm run typage
