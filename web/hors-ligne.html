<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifeste.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBF8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171B1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan">
<script>
/* Le manifeste retenu à l'installation doit porter le salon qu'on regarde,
   sans quoi l'application rouvrirait le salon par défaut. Le relais complète
   le manifeste avec l'adresse demandée ici ; elle est reconstruite et non
   recopiée, pour que rien d'autre que le salon n'y entre — ni jeton de
   courriel, ni ancre, ni paramètre de passage. */
{
  /* Bloc fermé : les modules d'une page sont soudés dans un espace de noms
     unique, où deux noms identiques se marchent dessus. Ces deux-là n'ont
     rien à y faire. */
  const lienManifeste = document.querySelector('link[rel="manifest"]');
  const salon = new URLSearchParams(location.search).get("plan");
  if (lienManifeste && salon){
    lienManifeste.href = "manifeste.webmanifest?depart=" +
      encodeURIComponent(location.pathname + "?plan=" + salon);
  }
}
/* Le service de second plan s'inscrit une fois la page chargée : inscrit
   plus tôt, son téléchargement disputerait la bande passante à l'appel qui
   ramène le plan — celui que le visiteur attend. Un refus n'est pas une
   panne : sans lui la page marche comme avant, en ligne seulement. */
if ("serviceWorker" in navigator){
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
<title>Hors ligne — Plan interactif</title>
<meta name="robots" content="noindex">

<style>
/* Aucune police distante, aucune feuille de style tierce : cette page-ci
   s'affiche précisément quand rien ne peut plus être téléchargé. Elle ne
   dépend donc que d'elle-même, et des polices déjà présentes sur l'appareil. */
:root{ --ground:#E9EAE4; --surface:#FBFBF8; --line:#D2D5CB;
  --ink:#15181A; --ink-3:#7C8285; --accent:#2F49D1; --accent-ink:#FFFFFF }
@media (prefers-color-scheme: dark){
  :root{ --ground:#0E1113; --surface:#171B1E; --line:#2A3034;
    --ink:#EDEFEC; --ink-3:#767D80; --accent:#7A8CFF; --accent-ink:#0E1113 }
}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--ground);color:var(--ink-3);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;
  display:grid;place-items:center;padding:24px}
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:28px 26px;max-width:380px;text-align:center}
h1{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 8px}
p{margin:0 0 18px}
button{font:inherit;font-weight:500;cursor:pointer;padding:9px 18px;border:0;border-radius:6px;
  background:var(--accent);color:var(--accent-ink)}
</style>

<div class="bloc">
  <h1>Plan hors ligne</h1>
  <!-- Ce que le visiteur peut faire, et non ce qui a échoué : il est devant un
       stand, pas devant un journal d'erreurs. Un plan déjà ouvert une fois
       reste consultable — c'est la première chose à lui dire. -->
  <p>Le réseau est injoignable. Les plans déjà consultés sur cet appareil
  restent disponibles : rouvrez-les depuis leur adresse habituelle.</p>
  <button id="reessaie" type="button">Réessayer</button>
</div>

<script>
document.getElementById("reessaie").addEventListener("click", () => location.reload());
/* Le réseau revient rarement pendant qu'on regarde cette page, mais quand il
   revient il n'y a plus rien à demander : on repart tout seul. */
addEventListener("online", () => location.reload());
</script>

</body>
</html>
