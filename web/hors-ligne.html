<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* ============================================================
   La langue de la page — le français d'origine, l'anglais sur demande
   ============================================================ */
/*
 * Toutes les pages sont écrites en français, et le restent dans le code : une
 * phrase se lit là où elle s'affiche, et c'est elle qui sert de clé au
 * dictionnaire anglais (`outils/anglais/`). La version anglaise ne réécrit donc
 * aucun module. Elle se pose par-dessus la page déjà rendue, et suit ce que la
 * page écrit ensuite.
 *
 * Pourquoi par-dessus plutôt qu'à la source : les pages s'écrivent de mille
 * façons — `textContent`, un gabarit passé à `innerHTML`, un `title` posé à la
 * volée — et une douzaine de sessions les retouchent en même temps. Envelopper
 * chaque chaîne dans un appel aurait réécrit des milliers de lignes que
 * d'autres étaient en train de modifier, et chaque phrase nouvelle aurait dû
 * se souvenir de l'appel. Ici, une phrase nouvelle n'a besoin que de sa
 * traduction : `npm run verifie` refuse celle qui n'en a pas.
 *
 * Ce script est posé en tête de page, avant le balisage : la page n'existe pas
 * encore en français sous les yeux du visiteur quand la version anglaise est
 * demandée — l'observateur voit chaque élément à mesure que le navigateur le
 * lit. En français, rien n'est observé : la langue d'origine ne coûte rien.
 *
 * Ce qui ne se traduit pas : ce que la page écrit mais que l'exploitant ou le
 * visiteur tape — un éditeur, un champ de saisie, une zone de texte — et tout
 * ce qu'un attribut `translate="no"` écarte. Les noms d'exposants n'y sont pas
 * écartés un à un : une clé du dictionnaire est une phrase entière, et une
 * enseigne ne tombe pas sur « Calculer un itinéraire ».
 */
/* La page appelle `traduit` pour les rares noms qu'elle mesure ou compare — le
   type d'un repère. Un repli est posé avant tout le reste : si le moteur venait
   à tomber, la page resterait en français plutôt que de tomber avec lui. */
window.traduit = String;
window.LANGUE = { code: "fr", traduit: String, enAnglais: () => null,
  bascule() {}, ajoute() {}, protege() {}, donnees() {}, manques: () => null };

(function () {
  "use strict";

  const CLE = "plan-langue";
  const LANGUES = ["fr", "en"];
  /* Le dictionnaire voyage en texte et ne se lit qu'au premier besoin : un
     visiteur qui reste en français n'a pas à payer l'analyse de centaines
     d'entrées qu'il ne lira jamais. */
  const SOURCE = "{\"Plan\":\"Map\",\"au\":\"to\",\"{n} Ko\":\"{n} KB\",\"Essayer\":\"Try it\",\"Plan indisponible : {raison}\":\"Map unavailable: {raison}\",\"{n} j\":\"{n} d\",\"Ligne\":\"Line\",\"Hors ligne — Plan interactif\":\"Offline — Interactive map\",\"Plan hors ligne\":\"Map offline\",\"Le réseau est injoignable. Les plans déjà consultés sur cet appareil restent disponibles : rouvrez-les depuis leur adresse habituelle.\":\"The network cannot be reached. Maps already viewed on this device are still available: reopen them from their usual address.\",\"Plan interactif\":\"Interactive map\",\"ou\":\"or\",\"{n} m\":\"{n} m\",\"≥ {distance}\":\"≥ {distance}\",\"Adresse\":\"Address\",\"plan\":\"base map\",\"Réessayer\":\"Try again\",\"{quoi} : {detail}\":\"{quoi}: {detail}\"}";
  const racine = document.documentElement;

  /* ------------------------------------------------------------------
     Quelle langue

     L'adresse d'abord : un lien `?lang=en` est ce qu'on imprime sur une
     affiche pour les visiteurs étrangers, ou ce qu'on envoie à un exposant qui
     ne lit pas le français, et il doit valoir sur n'importe quel appareil.
     Puis le choix déjà fait sur cet appareil. Et à la première visite, la
     langue du navigateur : le français pour qui le lit, l'anglais pour les
     autres — un visiteur allemand ou japonais lit plus souvent l'anglais que
     le français.
     ------------------------------------------------------------------ */
  function langueDemandee() {
    try {
      const l = new URLSearchParams(location.search).get("lang");
      if (LANGUES.includes(l)) return l;
    } catch (e) {}
    try {
      const l = localStorage.getItem(CLE);
      if (LANGUES.includes(l)) return l;
    } catch (e) {}
    const prefs = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || "fr"];
    for (const p of prefs) {
      const l = String(p).slice(0, 2).toLowerCase();
      if (LANGUES.includes(l)) return l;
    }
    return "en";
  }

  let courante = langueDemandee();

  /* ------------------------------------------------------------------
     Le dictionnaire

     Une clé sans accolades est une phrase exacte. Une clé à accolades est un
     modèle : « {n} exposants retenus » accepte n'importe quel nombre à la
     place de {n}, « Retirer le critère {critere} » n'importe quel texte. Ce
     qui remplit l'accolade est traduit à son tour s'il est lui-même une clé —
     « Échec : {raison} » traduit la raison quand elle est connue — et un
     nombre y change d'écriture : « 1 234,5 » devient « 1,234.5 ».
     ------------------------------------------------------------------ */
  const ESPACES = /[\s\u00A0\u202F\u2009]+/g;
  const normalise = (s) => String(s).replace(ESPACES, " ").trim();
  const LETTRE = /[A-Za-zÀ-ÖØ-öø-ÿ]/;

  let EXACT = null;       // Map : phrase → traduction
  let MODELES = null;     // modèles rangés par leurs deux premiers et derniers signes
  let PLURIELS = null;    // Map : modèle dépouillé de ses pluriels → sa forme au pluriel
  const MEMO = new Map();
  /* Les noms que rien ne traduit, en minuscules : ceux des exposants. Une
     enseigne est un nom propre, et elle tombe parfois sur un mot du
     dictionnaire ou du calendrier — « Mars », « Accueil », « Café ». Elle doit
     rester telle que l'exposant l'a écrite, seule ou citée dans une phrase. */
  const PROTEGES = new Set();
  /* Les traductions qui viennent des données et non du dictionnaire : le
     libellé anglais qu'un exploitant a donné à une zone, celui qu'une source
     tient pour une catégorie. Rangées par origine, pour qu'une origine se
     remplace en entier — un libellé anglais effacé ne doit pas survivre dans
     la page — et consultées avant le dictionnaire : un nom choisi pour ce
     salon l'emporte sur la traduction générale d'un mot. */
  const DONNEES = new Map();   // origine → Map : phrase → traduction

  function prepare() {
    if (EXACT) return;
    EXACT = new Map();
    MODELES = { debut: new Map(), fin: new Map(), libres: [] };
    PLURIELS = new Map();
    ajouteEntrees(typeof SOURCE === "string" ? JSON.parse(SOURCE) : SOURCE);
  }

  function ajouteEntrees(table) {
    for (const cleBrute of Object.keys(table)) {
      const fr = normalise(cleBrute), en = table[cleBrute];
      if (!fr || typeof en !== "string") continue;
      /* Une phrase identique dans les deux langues n'a rien à faire ; un modèle
         identique, si : « {n} km » réécrit encore son nombre. */
      if (fr.indexOf("{") < 0) { if (en !== cleBrute) EXACT.set(fr, en); continue; }
      rangeModele(fr, en);
    }
    MEMO.clear();
  }

  const NUMERIQUE = /^n\d?$/;
  const sansPluriel = (fr) => fr.replace(/([A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF])[sx](?=[\s.,;:!?)\u00BB]|$)/g, "$1");
  function rangeModele(fr, en) {
    const noms = [];
    let statique = 0;
    const motif = fr.split(/(\{[^{}]+\})/).map((morceau) => {
      const m = /^\{([^{}]+)\}$/.exec(morceau);
      if (!m) {
        statique += morceau.length;
        return morceau.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\s+");
      }
      noms.push(m[1]);
      return NUMERIQUE.test(m[1]) ? "(-?\\d[\\d\\s\\u00A0\\u202F]*(?:[.,]\\d+)?)" : "(.+?)";
    }).join("");
    const modele = { re: new RegExp("^" + motif + "$"), noms, en, statique, fr };
    /* Le français met zéro au singulier, l'anglais au pluriel : « 0 fiche
       ouverte », « 0 records opened ». Chaque modèle chiffré se range sous sa
       forme dépouillée de ses « s » et de ses « x » ; la plus longue des deux
       formes qui s'y retrouvent est le pluriel. */
    if (noms.some((n) => NUMERIQUE.test(n))) {
      const r = sansPluriel(fr), deja = PLURIELS.get(r);
      if (!deja || fr.length > deja.fr.length) PLURIELS.set(r, { fr, en });
    }
    const debut = /^[^{]{2}/.test(fr) ? fr.slice(0, 2) : null;
    const fin = /[^}]{2}$/.test(fr) ? fr.slice(-2) : null;
    if (debut) ajouteA(MODELES.debut, debut, modele);
    else if (fin) ajouteA(MODELES.fin, fin, modele);
    else MODELES.libres.push(modele);
  }
  function ajouteA(table, cle, modele) {
    const l = table.get(cle);
    if (!l) { table.set(cle, [modele]); return; }
    l.push(modele);
    // le modèle le plus précis d'abord : « Plan indisponible : {raison} » avant « Plan {nom} »
    l.sort((a, b) => b.statique - a.statique);
  }

  /** Un nombre écrit à la française, réécrit à l'anglaise. */
  function nombreEn(s) {
    const brut = s.replace(/[\s\u00A0\u202F]/g, "").replace(",", ".");
    const v = Number(brut);
    if (!isFinite(v)) return s;
    const decimales = (brut.split(".")[1] || "").length;
    return v.toLocaleString("en-GB", { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
  }

  /* ------------------------------------------------------------------
     Les dates et les heures

     Elles ne passent pas par le dictionnaire : « lundi 14 septembre »,
     « 10h30 – 11h15 » s'écrivent avec des nombres qui changent à chaque
     conférence. Une chaîne faite seulement de jours, de mois, d'heures, de
     nombres et de séparateurs se réécrit mot à mot — l'ordre britannique est
     celui du français, « Monday 14 September ». Au moindre autre mot, on n'y
     touche pas : ce n'est plus une date, c'est une phrase, et elle a sa clé.
     ------------------------------------------------------------------ */
  const JOURS = { lundi: "Monday", mardi: "Tuesday", mercredi: "Wednesday", jeudi: "Thursday",
    vendredi: "Friday", samedi: "Saturday", dimanche: "Sunday",
    "lun.": "Mon", "mar.": "Tue", "mer.": "Wed", "jeu.": "Thu", "ven.": "Fri", "sam.": "Sat", "dim.": "Sun",
    lun: "Mon", mar: "Tue", mer: "Wed", jeu: "Thu", ven: "Fri", sam: "Sat", dim: "Sun" };
  const MOIS = { janvier: "January", "février": "February", mars: "March", avril: "April", mai: "May",
    juin: "June", juillet: "July", "août": "August", septembre: "September", octobre: "October",
    novembre: "November", "décembre": "December",
    "janv.": "Jan", "févr.": "Feb", "avr.": "Apr", "juil.": "Jul", "sept.": "Sep", "oct.": "Oct",
    "nov.": "Nov", "déc.": "Dec" };
  const LIENS = { "à": "at", au: "to", du: "from", et: "and" };
  const UNITES = new Set(["h", "min", "km", "m"]);
  const PEUT_ETRE_DATE = /\d|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|janv|févr|mars|avril|mai|juin|juil|août|sept|oct|nov|déc/i;
  const MORCEAUX_DATE = /(\d{1,2})h(\d{2})?(?![\dA-Za-zÀ-ÿ])|(\d+)(er)?(?![\dA-Za-zÀ-ÿ])|([A-Za-zÀ-ÿ]+\.?)|([^\dA-Za-zÀ-ÿ]+)/g;

  function dateEn(t) {
    if (!PEUT_ETRE_DATE.test(t)) return null;
    let change = false, ok = true;
    const sortie = t.replace(MORCEAUX_DATE, (m, h, min, nb, er, mot, sep) => {
      if (h !== undefined) { change = true; return h + ":" + (min || "00"); }
      if (nb !== undefined) {
        if (er) { change = true; return nb === "1" ? "1st" : nb; }
        return nb;
      }
      if (mot !== undefined) {
        const k = mot.toLowerCase();
        const j = JOURS[k] || MOIS[k];
        if (j) { change = true; return j; }
        // « du 12 au 14 septembre » : un mot de liaison ne suffit pas à faire une date
        if (LIENS[k]) return LIENS[k];
        // les unités d'une durée s'écrivent pareil : « 1 h 30 min » n'est pas une heure
        if (UNITES.has(k)) return mot;
        ok = false;
        return mot;
      }
      if (/[^\s·–—\-,:/()]/.test(sep)) ok = false;
      return sep;
    });
    return ok && change ? sortie : null;
  }

  /* ------------------------------------------------------------------
     Traduire une chaîne
     ------------------------------------------------------------------ */
  /**
   * La traduction d'une chaîne déjà normalisée, ou `null`.
   *
   * `mode` dit ce qu'on accepte :
   *   (rien)      la meilleure traduction, fût-elle partielle : ce qui ne se
   *               traduit pas — une salle, un nom — reste tel quel ;
   *   "complete"  une découpe dont tous les morceaux se traduisent, ou rien ;
   *   "entiere"   la chaîne d'un seul tenant — une clé, un modèle, une date.
   */
  function cherche(t, profondeur, mode) {
    if (PROTEGES.size && PROTEGES.has(t.toLowerCase())) return null;
    for (const table of DONNEES.values()) {
      const v = table.get(t);
      if (v !== undefined) return v;
    }
    const deja = EXACT.get(t);
    if (deja !== undefined) return deja;
    // « aucune valeur relevée » vient souvent en minuscule d'une phrase qui la précède
    const premiere = t[0], autre = premiere === premiere.toUpperCase()
      ? premiere.toLowerCase() : premiere.toUpperCase();
    if (autre !== premiere) {
      const v = EXACT.get(autre + t.slice(1));
      if (v !== undefined) return premiere === premiere.toLowerCase() ? v[0].toLowerCase() + v.slice(1) : v[0].toUpperCase() + v.slice(1);
    }
    const d = dateEn(t);
    if (d) return d;
    if (profondeur > 2) return null;
    const candidats = [].concat(MODELES.debut.get(t.slice(0, 2)) || [],
      MODELES.fin.get(t.slice(-2)) || [], MODELES.libres);
    for (const m of candidats) {
      const r = m.re.exec(t);
      if (!r) continue;
      let en = m.en, avale = false;
      if (m.noms.some((nom, i) => NUMERIQUE.test(nom) &&
          Number(r[i + 1].replace(/[\s\u00A0\u202F]/g, "").replace(",", ".")) === 0)) {
        const pluriel = PLURIELS.get(sansPluriel(m.fr));
        if (pluriel && pluriel.fr !== m.fr) en = pluriel.en;
      }
      m.noms.forEach((nom, i) => {
        const brut = r[i + 1];
        /* Ce qui remplit une accolade se traduit en entier ou pas du tout.
           « Sauvegarde restaurée : {pavillons}. » attrapait « 2 pavillons —
           1 pavillon du fichier ne concerne pas ce salon », dont la moitié
           se traduisait : le modèle passait pour bon, et l'autre moitié
           restait en français. */
        let v = NUMERIQUE.test(nom) ? nombreEn(brut) : cherche(normalise(brut), profondeur + 1, "complete");
        /* Une accolade qui a avalé un assemblage — « 2 pavillons, 3 calques —
           1 pavillon du fichier… » — sans savoir le traduire laisserait tout ce
           morceau en français : le modèle ne convenait pas, on laisse les
           découpes plus bas tenter leur chance. */
        if (v === null) { v = brut; if (/ [·—|] |[.!?] [A-ZÀ-Ö]/.test(brut)) avale = true; }
        en = en.split("{" + nom + "}").join(v);
      });
      if (!avale) return en;
    }
    // un nombre seul, écrit à la française
    if (/^-?\d{1,3}([\u00A0\u202F ]\d{3})+(,\d+)?$|^-?\d+,\d+$/.test(t)) return nombreEn(t);
    if (mode === "entiere") return null;
    const complete = mode === "complete";
    const sansLettre = (x) => !LETTRE.test(x);

    /* Des phrases mises bout à bout : « Prenez l'escalier « Nord » : vous
       arrivez dans le pavillon 7.2. » suivie ou non de « Comptez 1 min. ».
       Avant les séparateurs : une phrase porte ses virgules, et c'est entière
       qu'elle est une clé — « 2 pavillons, 1 320 emplacements. » coupée à la
       virgule ne se retrouvait plus. */
    const bornes = [0];
    let fin;
    FIN_DE_PHRASE.lastIndex = 0;
    while ((fin = FIN_DE_PHRASE.exec(t))) {
      const suite = fin.index + fin[0].length;
      // « lun. 14 » n'est pas deux phrases : un nombre ne coupe qu'après plusieurs mots
      if (/\d/.test(t[suite]) && t.slice(bornes[bornes.length - 1], fin.index).indexOf(" ") < 0) continue;
      bornes.push(suite);
    }
    const nb = bornes.length;
    if (nb > 1) {
      const morceau = (i, j) => t.slice(bornes[i], j < nb ? bornes[j] : t.length).trim();
      let traduites = 0, vraies = 0;
      const sortie = [];
      for (let i = 0; i < nb;) {
        /* La plus longue suite de phrases qui soit une clé d'abord. Une aide
           de deux phrases est une seule clé, suivie d'une troisième ajoutée
           selon le cas : coupée phrase à phrase, la première tombait sur un
           modèle accommodant qui traduisait « Par défaut » et laissait le
           reste en français. */
        let j = i === 0 ? nb - 1 : nb, v = null;
        for (; j > i + 1; j--) if ((v = cherche(morceau(i, j), profondeur + 1, "entiere")) !== null) break;
        if (v === null) { j = i + 1; v = cherche(morceau(i, j), profondeur + 1, mode); }
        if (v !== null) vraies++;
        if (v !== null || sansLettre(morceau(i, j))) traduites += j - i;
        sortie.push(v === null ? morceau(i, j) : v);
        i = j;
      }
      if (vraies && (!complete || traduites === nb)) return sortie.join(" ");
    }

    /* Des morceaux mis bout à bout : « lun. 14 · 10h30 · Agora », « 404 résultats
       · tous pavillons ». La page les assemble de ce qu'elle a sous la main, et
       l'assemblage entier n'est une clé nulle part. Chaque morceau se traduit
       pour lui-même ; ce qui ne se traduit pas — une salle, un nom — reste tel
       quel. */
    for (const sep of SEPARATEURS) {
      if (t.indexOf(sep) < 0) continue;
      let traduits = 0;
      const parts = t.split(sep);
      const morceaux = parts.map((m) => {
        const v = m.trim() ? cherche(m.trim(), profondeur + 1, mode) : null;
        if (v === null) { if (sansLettre(m)) traduits++; return m; }
        traduits++;
        return m.replace(m.trim(), v);
      });
      /* La virgule sépare aussi bien une liste — « Raison sociale, Code postal »
         — que les membres d'une phrase qu'aucune clé ne connaît. Dans ce
         second cas, traduire le seul morceau qui tombe sur une clé ferait une
         phrase à moitié anglaise : une liste se reconnaît à ce que la plupart
         de ses éléments se traduisent. */
      const assez = complete ? traduits === parts.length
        : sep === ", " ? traduits * 2 >= parts.length : traduits;
      if (assez && morceaux.some((m, i) => m !== parts[i])) return morceaux.join(sep);
    }
    return null;
  }
  const SEPARATEURS = [" · ", " — ", " | ", ", "];
  /* Sans « lookbehind » : Safari ne le lit que depuis la 16.4, et une
     expression qu'il ne sait pas lire fait tomber le script entier — la page
     avec lui, puisqu'elle appelle `traduit`. */
  const FIN_DE_PHRASE = /[.!?\u2026\u00BB)]\s+(?=[A-Z0-9\u00C0-\u00D6\u00D8-\u00DE\u00AB])/g;

  /** La traduction d'un texte tel qu'il est dans la page, blancs d'autour gardés. */
  function traduitBrut(brut) {
    if (!brut || !LETTRE.test(brut) && !/\d[\u00A0\u202F ]\d|\d,\d/.test(brut)) return null;
    let v = MEMO.get(brut);
    if (v !== undefined) return v;
    prepare();
    const t = normalise(brut);
    let en = t ? cherche(t, 0) : null;
    /* Un nom resté tel quel dans une phrase traduite garde ses guillemets
       français : « Oui », « Vrai » au milieu d'une phrase anglaise. */
    if (en !== null) en = en.replace(/\u00AB\s*/g, "“").replace(/\s*\u00BB/g, "”");
    /* Le blanc qui précède un deux-points français ne se garde pas en anglais :
       « effacée</b> : visites » deviendrait « erased : visits ». */
    const avant = en !== null && /^[:;!?]/.test(en) ? "" : brut.match(/^\s*/)[0];
    v = en === null ? null : avant + en + brut.match(/\s*$/)[0];
    if (MEMO.size > 4000) MEMO.clear();
    MEMO.set(brut, v);
    return v;
  }

  /* ------------------------------------------------------------------
     La page

     Chaque nœud traduit garde sa version française et celle qu'on a écrite :
     revenir au français, c'est remettre la première là où la seconde est
     encore en place. Si la page a réécrit le nœud entre-temps, c'est sa
     nouvelle version qui fait foi, et on la traduit à son tour.
     ------------------------------------------------------------------ */
  const ATTRIBUTS = ["title", "placeholder", "aria-label", "alt", "label", "data-vide", "value"];
  const TEXTES = new WeakMap();     // Text → { fr, en }
  const ATTRS = new WeakMap();      // Element → { attribut: { fr, en } }
  const EXCLUS = "script,style,textarea,noscript,template,code,pre,[translate=\"no\"]," +
    "[contenteditable]:not([contenteditable=\"false\"])";
  /* Un éditeur garde ses attributs à traduire : son contenu est ce que tape
     l'exploitant, mais l'invite qu'il affiche vide (`data-vide`) et son
     `aria-label` sont bien de la page. */
  const EXCLUS_ATTRIBUTS = "script,style,noscript,template,[translate=\"no\"]";

  const exclu = (n) => {
    const e = n && (n.nodeType === 1 ? n : n.parentElement);
    return Boolean(e && e.closest(EXCLUS));
  };
  const excluAttributs = (el) => Boolean(el.closest(EXCLUS_ATTRIBUTS) ||
    (el.parentElement && el.parentElement.closest(EXCLUS)));

  function traduitTexte(n) {
    const v = n.nodeValue;
    const memo = TEXTES.get(n);
    if (memo && memo.en === v) return;
    const en = traduitBrut(v);
    if (en === null || en === v) {
      if (memo) TEXTES.delete(n);
      if (MANQUES && en === null) releveManque(v, n.parentElement);
      return;
    }
    TEXTES.set(n, { fr: v, en });
    n.nodeValue = en;
  }

  function traduitAttribut(el, nom) {
    if (nom === "value" && !(el.tagName === "INPUT" && /^(button|submit|reset)$/i.test(el.type))) return;
    const v = el.getAttribute(nom);
    if (v === null) return;
    let memo = ATTRS.get(el);
    if (memo && memo[nom] && memo[nom].en === v) return;
    const en = traduitBrut(v);
    if (en === null || en === v) {
      if (memo) delete memo[nom];
      if (MANQUES && en === null) releveManque(v, el, nom);
      return;
    }
    if (!memo) ATTRS.set(el, memo = {});
    memo[nom] = { fr: v, en };
    el.setAttribute(nom, en);
  }

  function traduitElement(el) {
    for (const nom of ATTRIBUTS) if (el.hasAttribute(nom)) traduitAttribut(el, nom);
  }

  /* Pendant la lecture du document, le dernier texte d'un élément encore
     ouvert peut n'être qu'un début : le navigateur y ajoutera la suite. Le
     traduire maintenant, c'est coller cette suite derrière une traduction. On
     attend donc qu'il ait un voisin, ou que la page soit lue. */
  const enAttente = new Set();
  const peutEtreIncomplet = (n) => document.readyState === "loading" &&
    !n.nextSibling && !(n.parentNode && n.parentNode.nextSibling);

  function parcourt(noeud) {
    if (noeud.nodeType === 3) {
      if (peutEtreIncomplet(noeud)) enAttente.add(noeud); else traduitTexte(noeud);
      return;
    }
    if (noeud.nodeType !== 1 && noeud.nodeType !== 9 && noeud.nodeType !== 11) return;
    if (noeud.nodeType === 1) {
      if (noeud.matches(EXCLUS)) { if (!noeud.matches(EXCLUS_ATTRIBUTS)) traduitElement(noeud); return; }
      traduitElement(noeud);
    }
    const marcheur = document.createTreeWalker(noeud, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => {
        if (n.nodeType !== 1 || !n.matches(EXCLUS)) return NodeFilter.FILTER_ACCEPT;
        if (!n.matches(EXCLUS_ATTRIBUTS)) traduitElement(n);
        return NodeFilter.FILTER_REJECT;
      },
    });
    let n;
    while ((n = marcheur.nextNode())) {
      if (n.nodeType === 3) {
        if (peutEtreIncomplet(n)) enAttente.add(n); else traduitTexte(n);
      } else traduitElement(n);
    }
  }

  function repasseAttente() {
    for (const n of enAttente) {
      if (!peutEtreIncomplet(n)) { enAttente.delete(n); if (n.isConnected && !exclu(n)) traduitTexte(n); }
    }
  }

  function surMutations(liste) {
    for (const r of liste) {
      if (r.type === "childList") {
        if (!r.addedNodes.length || exclu(r.target)) continue;
        r.addedNodes.forEach(parcourt);
      } else if (r.type === "characterData") {
        if (!exclu(r.target)) traduitTexte(r.target);
      } else if (!excluAttributs(r.target)) {
        traduitAttribut(r.target, r.attributeName);
      }
    }
    if (enAttente.size) repasseAttente();
  }

  const observateur = new MutationObserver(surMutations);
  const observe = () => observateur.observe(racine, {
    subtree: true, childList: true, characterData: true,
    attributes: true, attributeFilter: ATTRIBUTS,
  });

  /* Traduire avant de mesurer.

     L'observateur passe après le code qui écrit, pas pendant : entre les deux,
     la page peut mesurer ce qu'elle vient de poser — la fiche range son logo
     d'après la largeur des pastilles, un cartouche se centre sur sa propre
     largeur. Elle mesurerait le français, puis l'anglais prendrait sa place
     avec une autre largeur. Toute mesure commence donc par vider ce que
     l'observateur n'a pas encore vu. Une file vide ne coûte qu'un appel ; et
     rien de cela n'est posé tant que la page reste en français. */
  let mesuresBranchees = false;
  function brancheMesures() {
    if (mesuresBranchees) return;
    mesuresBranchees = true;
    const vide = () => {
      if (courante !== "en") return;
      const r = observateur.takeRecords();
      if (r.length) surMutations(r);
    };
    const methode = (proto, nom) => {
      const f = proto && proto[nom];
      if (typeof f !== "function") return;
      proto[nom] = function () { vide(); return f.apply(this, arguments); };
    };
    const lecture = (proto, nom) => {
      const d = proto && Object.getOwnPropertyDescriptor(proto, nom);
      if (!d || !d.get) return;
      Object.defineProperty(proto, nom, Object.assign({}, d, { get() { vide(); return d.get.call(this); } }));
    };
    methode(Element.prototype, "getBoundingClientRect");
    methode(Element.prototype, "getClientRects");
    if (window.SVGGraphicsElement) methode(SVGGraphicsElement.prototype, "getBBox");
    if (window.SVGTextContentElement) methode(SVGTextContentElement.prototype, "getComputedTextLength");
    ["offsetWidth", "offsetHeight", "offsetLeft", "offsetTop"].forEach((n) => lecture(HTMLElement.prototype, n));
    ["scrollWidth", "scrollHeight", "clientWidth", "clientHeight"].forEach((n) => lecture(Element.prototype, n));
  }

  /** Remet le français partout où la traduction est encore en place. */
  function restaure() {
    const marcheur = document.createTreeWalker(racine, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let n = racine;
    do {
      if (n.nodeType === 3) {
        const memo = TEXTES.get(n);
        if (memo) { if (n.nodeValue === memo.en) n.nodeValue = memo.fr; TEXTES.delete(n); }
      } else {
        const memo = ATTRS.get(n);
        if (memo) {
          for (const nom of Object.keys(memo)) if (n.getAttribute(nom) === memo[nom].en) n.setAttribute(nom, memo[nom].fr);
          ATTRS.delete(n);
        }
      }
    } while ((n = marcheur.nextNode()));
  }

  /* ------------------------------------------------------------------
     Ce qui manque encore — pour qui traduit

     `?lang=en&manques` relève, pendant qu'on parcourt la page, les textes
     restés en français. `LANGUE.manques()` les rend, du plus fréquent au plus
     rare. Le relevé ne sert qu'à celui qui complète le dictionnaire : un
     visiteur n'en paie jamais le coût.
     ------------------------------------------------------------------ */
  let MANQUES = null;
  try { if (/[?&]manques\b/.test(location.search)) MANQUES = new Map(); } catch (e) {}
  const MOTS_FRANCAIS = /(^|[\s'’(«])(le|la|les|des|du|de|un|une|et|ou|pour|sur|dans|avec|sans|pas|ne|est|sont|au|aux|ce|cette|ces|qui|que|son|sa|ses|par|vous|votre|vos|plus|tout|tous|aucun|aucune)(?=[\s'’),.:;!?»]|$)|[àâçéèêëîïôûùüÿœ]/i;
  function releveManque(v, el, attribut) {
    const t = normalise(v);
    if (!t || !LETTRE.test(t) || !MOTS_FRANCAIS.test(t)) return;
    // une enseigne s'écrit souvent en capitales, et n'a pas à se traduire
    if (t === t.toUpperCase()) return;
    if (el && el.closest && el.closest("#stands,#labels,#zones,.cal")) return;
    const k = (attribut ? "@" + attribut + " " : "") + t;
    const e = MANQUES.get(k);
    const classe = el && el.getAttribute ? el.getAttribute("class") : "";
    if (e) e.n++;
    else MANQUES.set(k, { n: 1, ou: el ? (el.id ? "#" + el.id : classe ? "." + classe.split(" ")[0] : el.tagName) : "" });
  }

  /* ------------------------------------------------------------------
     Passer de l'une à l'autre
     ------------------------------------------------------------------ */
  function applique(langue, premiere) {
    courante = langue;
    racine.lang = langue;
    if (langue === "en") {
      prepare();
      brancheMesures();
      parcourt(document);
      observe();
      if (premiere && document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          repasseAttente();
          enAttente.forEach((n) => { if (n.isConnected && !exclu(n)) traduitTexte(n); });
          enAttente.clear();
        }, { once: true });
      }
    } else if (!premiere) {
      observateur.disconnect();
      enAttente.clear();
      restaure();
    }
    majBascules();
    if (!premiere) dispatchEvent(new CustomEvent("langue", { detail: { langue } }));
  }

  /**
   * Change la langue de la page, sans la recharger. Le choix se retient sur
   * l'appareil ; l'adresse ne change que si elle en portait déjà un — sans
   * quoi elle l'emporterait au prochain chargement sur ce qu'on vient de
   * choisir.
   */
  function bascule(langue) {
    const l = LANGUES.includes(langue) ? langue : (courante === "fr" ? "en" : "fr");
    if (l === courante) return;
    try { localStorage.setItem(CLE, l); } catch (e) {}
    try {
      const u = new URL(location.href);
      if (u.searchParams.has("lang")) {
        u.searchParams.set("lang", l);
        history.replaceState(history.state, "", u);
      }
    } catch (e) {}
    applique(l, false);
  }

  /* Le bouton de bascule est le même partout : il montre le drapeau de la
     langue vers laquelle il mène. Deux lettres, « EN », ne se comprenaient pas
     d'un coup d'œil ; un drapeau, si, même de qui ne lit ni l'une ni l'autre.
     Celui du Royaume-Uni pour l'anglais, puisque c'est l'anglais britannique
     qu'on écrit. Il est dessiné et non tiré des emojis : Windows n'a pas
     d'emoji de drapeau, et y afficherait « GB » en toutes lettres.

     Les tailles sont posées sur le dessin même : le bouton vit dans des pages
     aux feuilles de style différentes, dont certaines fixent la taille de tout
     `svg` d'un bouton pour ses pictogrammes. Un élément `data-langue` suffit,
     où qu'il soit ; il est tenu hors traduction, puisqu'il parle déjà la bonne. */
  const HABIT_DRAPEAU = 'aria-hidden="true" focusable="false" style="display:block;width:20px;' +
    'height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)"';
  const DRAPEAUX = {
    en: '<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" ' + HABIT_DRAPEAU + '>' +
      '<rect width="60" height="30" fill="#012169"/>' +
      '<path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/>' +
      '<path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/>' +
      '<path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/>' +
      '<path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg>',
    fr: '<svg viewBox="0 0 3 2" preserveAspectRatio="none" ' + HABIT_DRAPEAU + '>' +
      '<rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/>' +
      '<rect x="2" width="1" height="2" fill="#EF4135"/></svg>',
  };
  function majBascules() {
    document.querySelectorAll("[data-langue]").forEach((b) => {
      const vers = courante === "fr" ? "en" : "fr";
      b.setAttribute("translate", "no");
      b.setAttribute("lang", vers);
      if (b.dataset.drapeau !== vers) { b.innerHTML = DRAPEAUX[vers]; b.dataset.drapeau = vers; }
      const dit = vers === "en" ? "English version" : "Version française";
      b.title = dit;
      b.setAttribute("aria-label", dit);
    });
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-langue]");
    if (b) { e.preventDefault(); bascule(); }
  });
  document.addEventListener("DOMContentLoaded", majBascules, { once: true });

  window.LANGUE = {
    get code() { return courante; },
    bascule,
    /** La traduction d'une phrase dans la langue de la page. */
    traduit: (fr) => courante === "en" ? (traduitBrut(String(fr)) ?? String(fr)) : String(fr),
    /** La traduction anglaise, quelle que soit la langue de la page, ou `null`. */
    enAnglais: (fr) => traduitBrut(String(fr)),
    /**
     * Des noms à ne jamais traduire — ceux des exposants, que la page reçoit
     * après s'être affichée. Ce qui en était déjà traduit revient à l'original.
     */
    protege(noms) {
      let neuf = false;
      for (const n of noms || []) {
        const k = normalise(n || "").toLowerCase();
        if (k && !PROTEGES.has(k)) { PROTEGES.add(k); neuf = true; }
      }
      if (!neuf) return;
      MEMO.clear();
      if (courante === "en") { restaure(); parcourt(document); }
    },
    /**
     * Les traductions d'une origine de données, qui remplacent celles qu'elle
     * avait données : `donnees("zones", { "Agora": "Agora stage" })`.
     */
    donnees(origine, table) {
      const t = new Map();
      for (const fr of Object.keys(table || {})) {
        const k = normalise(fr), en = normalise(table[fr] || "");
        if (k && en && en !== k) t.set(k, en);
      }
      const avant = DONNEES.get(origine);
      if (!t.size && !avant) return;
      if (t.size) DONNEES.set(origine, t); else DONNEES.delete(origine);
      MEMO.clear();
      if (courante === "en") { restaure(); parcourt(document); }
    },
    /** Des entrées de plus — celles d'un salon, par exemple. */
    ajoute(table) {
      prepare();
      ajouteEntrees(table || {});
      if (courante === "en") parcourt(document);
    },
    manques: () => MANQUES ? [...MANQUES].sort((a, b) => b[1].n - a[1].n)
      .map(([t, e]) => e.n + " × " + t + (e.ou ? "   (" + e.ou + ")" : "")) : null,
  };
  window.traduit = window.LANGUE.traduit;

  applique(courante, true);
})();
</script>
<link rel="icon" href="icone-onglet.svg" type="image/svg+xml">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBF8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171B1E">
<title>Hors ligne — Plan interactif</title>
<meta name="robots" content="noindex">

<style>
/* Aucune police distante, aucune feuille de style tierce : cette page-ci
   s'affiche précisément quand rien ne peut plus être téléchargé. Elle ne
   dépend donc que d'elle-même, et des polices déjà présentes sur l'appareil. */
:root{ --ground:#E9EAE4; --surface:#FBFBF8; --line:#D2D5CB;
  --ink:#15181A; --ink-3:#7C8285; --accent:#2F49D1; --accent-ink:#FFFFFF }
@media (prefers-color-scheme: dark){
  :root{ --ground:#0E1113; --surface:#171B1E; --line:#2A3034;
    --ink:#EDEFEC; --ink-3:#767D80; --accent:#7A8CFF; --accent-ink:#0E1113 }
}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--ground);color:var(--ink-3);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;
  display:grid;place-items:center;padding:24px}
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:28px 26px;max-width:380px;text-align:center}
h1{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 8px}
p{margin:0 0 18px}
button{font:inherit;font-weight:500;cursor:pointer;padding:9px 18px;border:0;border-radius:6px;
  background:var(--accent);color:var(--accent-ink)}
/* La langue se reprend ici aussi : cette page ne connaît que ce que
   l'appareil a retenu, et un visiteur arrivé sans réseau n'a pas encore vu le
   bouton du plan. */
.bloc{position:relative}
button.langue{position:absolute;top:10px;right:10px;padding:5px 6px;line-height:0;
  background:none;border:1px solid var(--line)}
</style>

<div class="bloc">
  <button class="langue" type="button" data-langue></button>
  <h1>Plan hors ligne</h1>
  <!-- Ce que le visiteur peut faire, et non ce qui a échoué : il est devant un
       stand, pas devant un journal d'erreurs. Un plan déjà ouvert une fois
       reste consultable — c'est la première chose à lui dire. -->
  <p>Le réseau est injoignable. Les plans déjà consultés sur cet appareil
  restent disponibles : rouvrez-les depuis leur adresse habituelle.</p>
  <button id="reessaie" type="button">Réessayer</button>
</div>

<script>
document.getElementById("reessaie").addEventListener("click", () => location.reload());
/* Le réseau revient rarement pendant qu'on regarde cette page, mais quand il
   revient il n'y a plus rien à demander : on repart tout seul. */
addEventListener("online", () => location.reload());
</script>

</body>
</html>
