<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport d'utilisation</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="config.js"></script>

<link rel="stylesheet" href="console.css">

<div class="page">
  <header class="topbar">
    <h1>Utilisation</h1>
    <select id="choixEvt" aria-label="Événement"></select>
    <span class="periode">
      <select id="choixPeriode" aria-label="Période"></select>
    </span>
    <span class="statut" id="statut" role="status" aria-live="polite"></span>
    <div class="droite">
      <a class="btn petit" id="lienConsole" href="admin-plans">Console</a>
      <button class="btn petit" id="btnRecharger">Actualiser</button>
      <button class="btn petit" id="btnTheme" aria-label="Thème">◐</button>
    </div>
  </header>

  <main class="fiche" id="rapport"></main>
</div>
<div class="modale" id="modale">
  <div class="mfen" role="dialog" aria-modal="true">
    <header><h3 id="mTitre"></h3><button id="mFermer" aria-label="Fermer">&times;</button></header>
    <div class="mcorps" id="mCorps"></div>
    <footer id="mPied"></footer>
  </div>
</div>

<script>
/* ============================================================
   Socle commun de la console et du rapport — accès au projet
   Tout passe par l'API REST de Supabase. La clé publique et l'adresse du
   projet sont demandées au premier lancement puis conservées sur le poste :
   elles n'ont pas à vivre dans le dépôt, et changent selon l'environnement.
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CLE_CFG = "console-config";
const CLE_SESSION = "console-session";

let CFG = null, SESSION = null;
try { CFG = JSON.parse(localStorage.getItem(CLE_CFG) || "null"); } catch (e) {}
try { SESSION = JSON.parse(localStorage.getItem(CLE_SESSION) || "null"); } catch (e) {}
if (window.PLAN_CONFIG && !CFG) CFG = window.PLAN_CONFIG;

/* ------------------------------------------------------------------
   Appels
   ------------------------------------------------------------------ */
function entetes(json) {
  const h = { "apikey": CFG.anonKey };
  if (SESSION?.access_token) h["Authorization"] = "Bearer " + SESSION.access_token;
  if (json) h["Content-Type"] = "application/json";
  return h;
}

async function rest(chemin, options = {}) {
  const r = await fetch(CFG.url + "/rest/v1/" + chemin, {
    ...options,
    headers: { ...entetes(!!options.body), ...(options.headers || {}) },
  });
  if (r.status === 401 || r.status === 403) {
    deconnecte("Session expirée, reconnectez-vous.");
    throw new Error("Non autorisé.");
  }
  const txt = await r.text();
  let corps = null;
  try { corps = txt ? JSON.parse(txt) : null; } catch (e) { corps = { message: txt }; }
  if (!r.ok) {
    const d = [corps?.message, corps?.details, corps?.hint].filter(Boolean).join(" — ");
    throw new Error(d || "Erreur " + r.status + " sur " + chemin);
  }
  return corps;
}

/* ------------------------------------------------------------------
   Fenêtres
   ------------------------------------------------------------------ */
// Une fenêtre de réglage doit rafraîchir son résumé en se fermant, et elle se
// ferme de quatre façons : le bouton, la croix, l'arrière-plan, la touche
// Échap. D'où un rappel porté par la fermeture plutôt que par le bouton.
let apresModale = null;

function ouvreModale(titre, remplit, boutons, apres) {
  apresModale = apres || null;
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplit($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach((b) => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action && b.action() === false) return; fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
const fermeModale = () => {
  $("modale").classList.remove("open");
  const f = apresModale;
  apresModale = null;
  if (f) f();
};
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", (e) => { if (e.target === $("modale")) fermeModale(); });
addEventListener("keydown", (e) => { if (e.key === "Escape") fermeModale(); });

function demande(titre, libelle, valeur, suite) {
  let champ;
  ouvreModale(titre, (corps) => {
    const l = document.createElement("label");
    l.innerHTML = "<span></span><input>";
    l.querySelector("span").textContent = libelle;
    champ = l.querySelector("input");
    champ.value = valeur || "";
    corps.appendChild(l);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const v = champ.value.trim();
        if (v) { fermeModale(); suite(v); }
      }
    };
  }, [{ libelle: "Annuler" },
      { libelle: "Valider", genre: "primaire",
        action: () => { const v = champ.value.trim(); if (!v) return false; suite(v); } }]);
}

function confirme(titre, message, libelleOui, action) {
  ouvreModale(titre, (corps) => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [{ libelle: "Annuler" }, { libelle: libelleOui, genre: "danger", action }]);
}

/* ------------------------------------------------------------------
   Configuration et connexion
   ------------------------------------------------------------------ */
function ecranConfig() {
  let url, cle;
  ouvreModale("Connexion au projet", (corps) => {
    const p = document.createElement("p");
    p.innerHTML = "L'adresse de l'<strong>API</strong> du projet, en " +
      "<code>.supabase.co</code> — pas celle du tableau de bord. La clé publique " +
      "est faite pour circuler côté navigateur : c'est son rôle. Ne mettez jamais " +
      "ici la clé de service.";
    const l1 = document.createElement("label");
    l1.innerHTML = "<span>Adresse du projet</span><input placeholder='https://xxxx.supabase.co'>";
    const l2 = document.createElement("label");
    l2.innerHTML = "<span>Clé publique (anon)</span><input placeholder='eyJhbGciOi…'>";
    corps.append(p, l1, l2);
    url = l1.querySelector("input");
    cle = l2.querySelector("input");
    url.value = CFG?.url || "";
    cle.value = CFG?.anonKey || "";
    p.hidden = !!(CFG?.url && CFG?.anonKey);
    setTimeout(() => url.focus(), 30);
  }, [{ libelle: "Valider", genre: "primaire", action: () => {
    const u = url.value.trim().replace(/\/+$/, ""), k = cle.value.trim();
    if (!u || !k) return false;
    CFG = { url: u, anonKey: k };
    localStorage.setItem(CLE_CFG, JSON.stringify(CFG));
    ecranConnexion();
  } }]);
}

/**
 * L'adresse du tableau de bord et celle de l'API se ressemblent assez pour
 * qu'on les confonde. On accepte les deux formes et on retient la bonne.
 *   tableau de bord : https://supabase.com/dashboard/project/<ref>
 *   API             : https://<ref>.supabase.co
 * Écrit sans expression régulière : la lecture y gagne, et le fichier ne
 * dépend d'aucun échappement.
 */
function normaliseUrl(saisie) {
  let u = String(saisie || "").trim();
  while (u.length && u[u.length - 1] === "/") u = u.slice(0, -1);
  if (!u) return "";

  const marque = "supabase.com/dashboard/project/";
  const i = u.toLowerCase().indexOf(marque);
  if (i >= 0) {
    const ref = u.slice(i + marque.length).split("/")[0].split("?")[0];
    if (ref) return "https://" + ref + ".supabase.co";
  }

  // la seule référence du projet, sans point ni protocole
  if (u.indexOf(".") < 0 && u.indexOf(":") < 0) return "https://" + u + ".supabase.co";

  if (u.slice(0, 4).toLowerCase() !== "http") u = "https://" + u;
  return u;
}

function ecranConnexion(message) {
  let mail, mdp, msg;
  ouvreModale("Connexion", (corps) => {
    const l1 = document.createElement("label");
    l1.innerHTML = "<span>Adresse e-mail</span><input type='email' autocomplete='username'>";
    const l2 = document.createElement("label");
    l2.innerHTML = "<span>Mot de passe</span><input type='password' autocomplete='current-password'>";
    msg = document.createElement("p");
    msg.style.color = "var(--rouge)";
    if (message) msg.textContent = message;
    corps.append(l1, l2, msg);
    mail = l1.querySelector("input");
    mdp = l2.querySelector("input");
    setTimeout(() => mail.focus(), 30);
    mdp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); tente(); } };
    const info = document.createElement("p");
    info.className = "aide";
    info.style.marginTop = "-4px";
    info.textContent = "Projet : " + (CFG?.url || "non configuré");
    corps.appendChild(info);
  }, [{ libelle: "Changer de projet", action: () => { ecranConfig(); } },
      { libelle: "Se connecter", genre: "primaire", action: () => { tente(); return false; } }]);

  async function tente() {
    msg.textContent = "Connexion…";
    msg.style.color = "var(--ink-3)";
    try {
      const url = CFG.url;
      const r = await fetch(url + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ email: mail.value.trim(), password: mdp.value }),
      });
      // Une réponse vide ne doit pas ressortir en « Unexpected end of JSON
      // input » : on lit le texte, puis on tente de l'interpréter.
      const txt = await r.text();
      let j = {};
      try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { msg: txt.slice(0, 120) }; }
      if (!r.ok) {
        throw new Error((j.error_description || j.msg || "Identifiants refusés.") +
          " (HTTP " + r.status + ")");
      }
      if (!j.access_token) {
        throw new Error("Réponse inattendue de " + url + " — HTTP " + r.status +
          (txt ? "" : ", corps vide") + ". Vérifiez l'adresse du projet.");
      }
      SESSION = j;
      localStorage.setItem(CLE_SESSION, JSON.stringify(SESSION));
      fermeModale();
      demarre();
    } catch (e) {
      msg.style.color = "var(--rouge)";
      msg.textContent = e.message;
    }
  }
}

/**
 * Fin de session. Ce qu'il faut effacer à l'écran dépend de la page : la
 * console vide sa liste d'événements, le rapport ses chiffres. Chacune le dit
 * en définissant `videEcran`.
 */
function deconnecte(message) {
  SESSION = null;
  // un stockage refusé ne doit pas priver l'exploitant de l'écran de connexion
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
  if (typeof videEcran === "function") videEcran();
  ecranConnexion(message);
}

/* Le message va dans la barre du haut, qui existe toujours, et en écho dans
   la fiche quand elle est ouverte. Une erreur avalée est pire qu'une erreur. */
let effaceur;
function signale(txt, erreur) {
  const s = $("statut");
  if (s) {
    s.className = "statut " + (erreur ? "err" : "ok");
    s.textContent = txt;
    clearTimeout(effaceur);
    if (!erreur) effaceur = setTimeout(() => { s.textContent = ""; s.className = "statut"; }, 6000);
  }
  const m = $("msgSync");
  if (m) { m.className = erreur ? "err" : "ok"; m.textContent = txt; }
  if (erreur) console.error("[console]", txt);
}

/* ------------------------------------------------------------------
   Briques d'affichage
   ------------------------------------------------------------------ */
const bloc = (titre) => {
  const d = document.createElement("div");
  d.className = "bloc";
  const t = document.createElement("span");
  t.className = "eyebrow";
  t.textContent = titre;
  d.appendChild(t);
  return d;
};
const grille = () => { const d = document.createElement("div"); d.className = "grille"; return d; };

/** Adresse de base des pages, déduite de celle de la console. */
const BASE_PAGES = location.origin + location.pathname.replace(/[^/]*$/, "");

/* ------------------------------------------------------------------
   Thème
   ------------------------------------------------------------------ */
const CLE_THEME = "console-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sombre = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = sombre ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(CLE_THEME, next); } catch (e) {}
};

/* ============================================================
   Rapport d'utilisation

   Un salon se juge sur ce qu'il a servi. La console dit ce que le plan
   contient ; cette page dit ce qu'on en a fait — combien sont venus, ce
   qu'ils ont cherché, quelles fiches ils ont ouvertes et par quel chemin.

   Tout le calcul est fait par la base, en un appel : rapatrier les gestes
   pour les compter ici reviendrait à télécharger un salon entier.
   ============================================================ */
const CLE_EVT = "rapport-evenement";

let EVTS = [], selection = null, RAPPORT = null, periode = "30";

/* Les périodes proposées. La valeur est un nombre de jours, ou « tout » : on
   ne demande pas à un organisateur de saisir deux dates pour lire son salon. */
const PERIODES = [
  ["7", "7 derniers jours"],
  ["30", "30 derniers jours"],
  ["90", "90 derniers jours"],
  ["tout", "Depuis le début"],
];

/* Par quel chemin une fiche s'est ouverte. L'ordre est celui de la lecture,
   et la liste reste affichée en entier même à zéro : « aucun clic sur un
   logo » se lit alors comme un renseignement — aucun logo n'a été posé — et
   non comme un canal oublié. */
const CANAUX_STAND = [
  ["recherche", "Recherche"],
  ["plan", "Clic sur le plan"],
  ["image", "Clic sur un logo ou une image"],
  ["conference", "Nom cité par une conférence"],
  ["liste", "Liste du pavillon"],
  ["parcours", "Programme de visite"],
  ["lien", "Lien direct"],
];
const CANAUX_CONF = [
  ["salle", "Programme d'une salle"],
  ["exposant", "Fiche d'un exposant"],
  ["parcours", "Programme de visite"],
];
const AUTRE = ["autre", "Autre"];

const nb = (n) => Number(n || 0).toLocaleString("fr-FR");
const courant = () => EVTS.find((e) => e.id === selection);

/* ------------------------------------------------------------------
   Données
   ------------------------------------------------------------------ */
async function chargeEvenements() {
  EVTS = await rest("evenement?select=id,nom,slug,etat&order=nom.asc");
  const voulu = new URLSearchParams(location.search).get("plan");
  let garde = null;
  try { garde = localStorage.getItem(CLE_EVT); } catch (e) {}
  selection = (voulu && EVTS.find((e) => e.slug === voulu)?.id) ||
    (EVTS.some((e) => e.id === garde) ? garde : null) || EVTS[0]?.id || null;
}

/** Le début de la période, à minuit : un rapport se lit en jours entiers. */
function debutPeriode() {
  if (periode === "tout") return null;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (Number(periode) - 1));
  return d.toISOString();
}

async function chargeRapport() {
  if (!selection) { RAPPORT = null; return; }
  RAPPORT = await rest("rpc/rapport_utilisation", {
    method: "POST",
    body: JSON.stringify({ p_evenement: selection, p_debut: debutPeriode(), p_fin: null }),
  });
}

/* ------------------------------------------------------------------
   Rendu
   ------------------------------------------------------------------ */
function chiffre(hote, valeur, libelle, sous, fort) {
  const d = document.createElement("div");
  d.className = "chiffre" + (fort ? " fort" : "");
  d.innerHTML = '<span class="n"></span><span class="l"></span>' +
    (sous ? '<span class="s"></span>' : "");
  d.querySelector(".n").textContent = nb(valeur);
  d.querySelector(".l").textContent = libelle;
  if (sous) d.querySelector(".s").textContent = sous;
  hote.appendChild(d);
  return d;
}

/**
 * Une barre par canal, mise à l'échelle du plus fort.
 *
 * Rapporter la longueur au total plutôt qu'au maximum écraserait tout dès
 * qu'un canal domine — et il en domine toujours un. Le pourcentage, lui, se
 * lit bien sur le total : c'est la part qu'on cite.
 */
function barres(hote, canaux, total, connus) {
  const lignes = connus.map(([cle, lib]) => [cle, lib, canaux[cle] || 0]);
  // un canal inconnu de cette page — ajouté depuis, ou hors vocabulaire —
  // vaut mieux affiché sous son nom brut que passé sous silence
  Object.keys(canaux).forEach((cle) => {
    if (!connus.some((c) => c[0] === cle)) {
      lignes.push([cle, cle === AUTRE[0] ? AUTRE[1] : cle, canaux[cle]]);
    }
  });
  const max = Math.max(1, ...lignes.map((l) => l[2]));
  const box = document.createElement("div");
  box.className = "barres";
  lignes.forEach(([cle, lib, n]) => {
    const d = document.createElement("div");
    d.className = "barre";
    d.innerHTML = '<span class="l"></span><span class="j"><span></span></span>' +
      '<span class="v"></span>';
    d.querySelector(".l").textContent = lib;
    d.querySelector(".j > span").style.width = (n / max * 100).toFixed(1) + "%";
    d.querySelector(".v").innerHTML = esc(nb(n)) +
      (total ? '<span class="pc">' + Math.round(n / total * 100) + " %</span>" : "");
    box.appendChild(d);
  });
  hote.appendChild(box);
}

/** Les jours, en bâtons. Un salon dure trois jours : le pic se voit d'un œil. */
function jours(hote, liste) {
  if (!liste.length) return;
  const max = Math.max(1, ...liste.map((j) => j.visites));
  const box = document.createElement("div");
  box.className = "jours";
  liste.forEach((j) => {
    const d = document.createElement("div");
    d.className = "jour-bat";
    d.innerHTML = '<span class="b"></span><span class="d"></span>';
    d.querySelector(".b").style.height = Math.max(2, j.visites / max * 100) + "%";
    // « 14/03 » suffit : l'année est celle de la période demandée
    const [an, mois, jour] = String(j.j).split("-");
    d.querySelector(".d").textContent = jour + "/" + mois;
    d.title = jour + "/" + mois + "/" + an + " · " + nb(j.visites) + " visite" +
      (j.visites > 1 ? "s" : "") + ", " + nb(j.visiteurs) + " visiteur" +
      (j.visiteurs > 1 ? "s" : "");
    box.appendChild(d);
  });
  hote.appendChild(box);
}

function dessineRapport() {
  const f = $("rapport");
  f.innerHTML = "";
  if (!SESSION) { f.innerHTML = '<div class="vide">Connectez-vous pour lire le rapport.</div>'; return; }
  if (!EVTS.length) {
    f.innerHTML = '<div class="vide">Aucun événement.<br>Créez-en un depuis la console.</div>';
    return;
  }
  const e = courant();
  const r = RAPPORT;
  if (!e || !r) { f.innerHTML = '<div class="vide">Chargement…</div>'; return; }

  const entete = document.createElement("div");
  entete.className = "entete";
  entete.innerHTML = '<div><span class="eyebrow">Utilisation</span><h2></h2>' +
    '<span class="etat ' + e.etat + '">' +
    (e.etat === "publie" ? "Publié" : "Brouillon") + '</span></div>' +
    '<div class="droite"><a class="btn petit" id="lienPublic" target="_blank" rel="noopener">Voir le plan</a></div>';
  entete.querySelector("h2").textContent = e.nom;
  f.appendChild(entete);
  $("lienPublic").href = BASE_PAGES + "plan?plan=" + encodeURIComponent(e.slug || "");

  /* Rien à montrer se dit de deux façons, et ce n'est pas la même nouvelle :
     la mesure n'a jamais rien reçu, ou la période choisie est vide. */
  if (!r.depuis) {
    const v = document.createElement("div");
    v.className = "vide";
    v.innerHTML = "Aucune mesure pour cet événement.<br>" +
      (e.etat === "publie"
        ? "Les visites sont comptées dès la première ouverture du plan public."
        : "L'événement est en brouillon : son plan n'est pas encore servi aux visiteurs.");
    f.appendChild(v);
    return;
  }

  const b1 = bloc("Fréquentation");
  const g1 = document.createElement("div");
  g1.className = "chiffres";
  chiffre(g1, r.visites, "Visites",
    "Une ouverture du plan. Revenir plus tard en fait une seconde.", true);
  chiffre(g1, r.visiteurs, "Visiteurs uniques",
    "Navigateurs distincts sur la période.", true);
  chiffre(g1, r.recherches, "Recherches", "Mots-clés saisis, doublons écartés.");
  chiffre(g1, r.itineraires, "Itinéraires calculés", "Trajets distincts demandés.");
  chiffre(g1, r.parcours, "Programmes de visite",
    nb(r.parcours_gestes) + " ajout" + (r.parcours_gestes > 1 ? "s" : "") +
    " ou retrait" + (r.parcours_gestes > 1 ? "s" : "") + " au total.");
  b1.appendChild(g1);
  f.appendChild(b1);

  const b2 = bloc("Fiches exposants ouvertes");
  const g2 = document.createElement("div");
  g2.className = "chiffres seul";
  chiffre(g2, r.stands.total, "Ouvertures", "Toutes provenances confondues.", true);
  b2.appendChild(g2);
  const t2 = document.createElement("p");
  t2.className = "eyebrow";
  t2.style.margin = "16px 0 10px";
  t2.textContent = "Par canal";
  b2.appendChild(t2);
  barres(b2, r.stands.canaux || {}, r.stands.total, CANAUX_STAND);
  f.appendChild(b2);

  const b3 = bloc("Fiches conférences ouvertes");
  const g3 = document.createElement("div");
  g3.className = "chiffres seul";
  chiffre(g3, r.conferences.total, "Ouvertures", "Toutes provenances confondues.", true);
  b3.appendChild(g3);
  const t3 = document.createElement("p");
  t3.className = "eyebrow";
  t3.style.margin = "16px 0 10px";
  t3.textContent = "Par canal";
  b3.appendChild(t3);
  barres(b3, r.conferences.canaux || {}, r.conferences.total, CANAUX_CONF);
  const a3 = document.createElement("p");
  a3.className = "astuce";
  a3.style.marginTop = "12px";
  a3.textContent = "Une conférence s'ouvre depuis le programme de la salle qui " +
    "l'accueille, depuis la fiche de l'exposant qui la tient, ou depuis le " +
    "programme de visite. Elle n'a ni recherche ni forme propre sur le plan.";
  b3.appendChild(a3);
  f.appendChild(b3);

  const b4 = bloc("Jour par jour");
  jours(b4, r.jours || []);
  const a4 = document.createElement("p");
  a4.className = "astuce";
  a4.style.marginTop = "10px";
  /* La date d'ouverture se lit dans le fuseau du salon, comme les bâtons :
     les deux dans le fuseau du lecteur ne se recouperaient pas. */
  a4.textContent = "Visites par jour, dans le fuseau du salon (" + (r.fuseau || "UTC") +
    "). Mesure ouverte depuis le " +
    new Date(r.depuis).toLocaleDateString("fr-FR",
      { dateStyle: "long", timeZone: r.fuseau || "UTC" }) + ".";
  b4.appendChild(a4);
  f.appendChild(b4);
}

function dessineBarre() {
  const s = $("choixEvt");
  s.innerHTML = EVTS.map((e) =>
    '<option value="' + esc(e.id) + '"' + (e.id === selection ? " selected" : "") +
    '>' + esc(e.nom) + (e.etat === "publie" ? "" : " · brouillon") + '</option>').join("");
  s.hidden = !EVTS.length;
  const p = $("choixPeriode");
  if (!p.options.length) {
    p.innerHTML = PERIODES.map((x) =>
      '<option value="' + x[0] + '">' + x[1] + '</option>').join("");
  }
  p.value = periode;
}

/* ------------------------------------------------------------------
   Chargement et démarrage
   ------------------------------------------------------------------ */
let _occupe = false;
async function rafraichit() {
  if (_occupe) return;
  _occupe = true;
  $("btnRecharger").disabled = true;
  try {
    await chargeRapport();
    signale("");
  } catch (e) {
    RAPPORT = null;
    signale(e.message, true);
  } finally {
    _occupe = false;
    $("btnRecharger").disabled = false;
    dessineBarre();
    dessineRapport();
  }
}

/** Fin de session : la console vide sa liste, le rapport vide ses chiffres. */
function videEcran() {
  EVTS = []; RAPPORT = null; selection = null;
  dessineBarre();
  dessineRapport();
}

$("choixEvt").onchange = (e) => {
  selection = e.target.value;
  try { localStorage.setItem(CLE_EVT, selection); } catch (err) {}
  rafraichit();
};
$("choixPeriode").onchange = (e) => { periode = e.target.value; rafraichit(); };
$("btnRecharger").onclick = () => rafraichit();

async function demarre() {
  try {
    await chargeEvenements();
    dessineBarre();
    await rafraichit();
  } catch (e) {
    $("rapport").innerHTML = '<div class="vide"></div>';
    $("rapport").querySelector(".vide").textContent = "Chargement impossible : " + e.message;
  }
}

if (!CFG) ecranConfig();
else if (!SESSION) ecranConnexion();
else demarre();
</script>
