<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(
  /[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
);
const CLE_CFG = "console-config";
const CLE_SESSION = "console-session";
let CFG = null, SESSION = null;
try {
  CFG = JSON.parse(localStorage.getItem(CLE_CFG) || "null");
} catch (e) {
}
try {
  SESSION = JSON.parse(localStorage.getItem(CLE_SESSION) || "null");
} catch (e) {
}
if (window.PLAN_CONFIG && !CFG) CFG = window.PLAN_CONFIG;
function entetes(json) {
  const h = { "apikey": CFG.anonKey };
  if (SESSION?.access_token) h["Authorization"] = "Bearer " + SESSION.access_token;
  if (json) h["Content-Type"] = "application/json";
  return h;
}
function contenuJeton(jeton) {
  try {
    const p = String(jeton || "").split(".")[1];
    if (!p) return null;
    return JSON.parse(atob(p.replace(/-/g, "+").replace(/_/g, "/")));
  } catch (e) {
    return null;
  }
}
function resteJeton() {
  const exp = contenuJeton(SESSION?.access_token)?.exp;
  return typeof exp === "number" ? exp - Date.now() / 1e3 : Infinity;
}
let renouvellement = null;
function renouvelle() {
  if (!SESSION?.refresh_token) return Promise.resolve(false);
  if (!renouvellement) {
    renouvellement = (async () => {
      try {
        const r = await fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: SESSION.refresh_token })
        });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.access_token) return false;
        SESSION = j;
        try {
          localStorage.setItem(CLE_SESSION, JSON.stringify(SESSION));
        } catch (e) {
        }
        return true;
      } catch (e) {
        return false;
      } finally {
        renouvellement = null;
      }
    })();
  }
  return renouvellement;
}
async function appel(url, options = {}) {
  const envoie = () => fetch(url, {
    ...options,
    headers: { ...entetes(!!options.body), ...options.headers || {} }
  });
  if (SESSION?.access_token && resteJeton() < 60) await renouvelle();
  const r = await envoie();
  if (r.status !== 401 || !SESSION?.refresh_token) return r;
  return await renouvelle() ? envoie() : r;
}
async function rest(chemin, options = {}) {
  const r = await appel(CFG.url + "/rest/v1/" + chemin, options);
  if (r.status === 401 || r.status === 403) {
    deconnecte("Session expirée, reconnectez-vous.");
    throw new Error("Non autorisé.");
  }
  const txt = await r.text();
  let corps = null;
  try {
    corps = txt ? JSON.parse(txt) : null;
  } catch (e) {
    corps = { message: txt };
  }
  if (!r.ok) {
    const d = [corps?.message, corps?.details, corps?.hint].filter(Boolean).join(" — ");
    throw new Error(d || "Erreur " + r.status + " sur " + chemin);
  }
  return corps;
}
let apresModale = null;
function verseModale() {
  const f = apresModale;
  apresModale = null;
  if (f) f();
}
function ouvreModale(titre, remplit, boutons, apres) {
  verseModale();
  modaleVerrou = false;
  apresModale = apres || null;
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplit($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach((b) => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => {
      if (b.action && b.action() === false) return;
      fermeModale();
    };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
let modaleVerrou = false;
const verrouilleModale = (oui) => {
  modaleVerrou = !!oui;
};
const fermeModale = () => {
  modaleVerrou = false;
  $("modale").classList.remove("open");
  verseModale();
};
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", (e) => {
  if (e.target === $("modale") && !modaleVerrou) fermeModale();
});
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !modaleVerrou) fermeModale();
});
function gardeLaPlace(redessine) {
  const haut = $("mCorps").scrollTop;
  return () => {
    redessine();
    $("mCorps").scrollTop = haut;
  };
}
function demande(titre, libelle, valeur, suite) {
  let champ;
  ouvreModale(titre, (corps) => {
    const l = document.createElement("label");
    l.innerHTML = "<span></span><input>";
    l.querySelector("span").textContent = libelle;
    champ = l.querySelector("input");
    champ.value = valeur || "";
    corps.appendChild(l);

      nomFichierExport(e, jours2)
    );
    const s = lignes.length > 1 ? "s" : "";
    signale(nb(lignes.length) + " exposant" + s + " exporté" + s + " (" + libellePeriode(jours2) + ").");
  } catch (err) {
    signale(err.message, true);
  } finally {
    _export = false;
    if (bouton) {
      bouton.disabled = false;
      bouton.textContent = libelle;
    }
  }
}
const CLE_EVT = "rapport-evenement";
let EVTS = [], selection = null, RAPPORT = null, periode = "30";
const PERIODES = [
  ["7", "7 derniers jours"],
  ["30", "30 derniers jours"],
  ["90", "90 derniers jours"],
  ["tout", "Depuis le début"]
];
const JETONS_GARDES_JOURS = 400;
const CANAUX_CONF = [
  ["salle", "Programme d'une salle"],
  ["exposant", "Fiche d'un exposant"],
  ["parcours", "Programme de visite"]
];
const SUPPORTS = [
  ["web", "Navigateur", "Le plan ouvert dans un onglet."],
  ["integre", "Cadre sur un site", "Encadré dans la page d'un site ou d'une application tierce."],
  ["pwa", "Écran d'accueil", "Installé sur l'appareil, lancé hors du navigateur."],
  ["appli", "Application", "Servi par une coque déposée sur une boutique."],
  ["", "Non précisé", "Compté avant que la porte d'accès ne le soit."]
];
const courant = () => EVTS.find((e) => e.id === selection);
async function chargeEvenements() {
  EVTS = await rest("evenement?select=id,nom,slug,etat&order=nom.asc");
  const voulu = new URLSearchParams(location.search).get("plan");
  let garde = null;
  try {
    garde = localStorage.getItem(CLE_EVT);
  } catch (e) {
  }
  selection = voulu && EVTS.find((e) => e.slug === voulu)?.id || (EVTS.some((e) => e.id === garde) ? garde : null) || EVTS[0]?.id || null;
}
const joursPeriode = () => periode === "tout" ? null : Number(periode);
async function chargeRapport() {
  if (!selection) {
    RAPPORT = null;
    return;
  }
  RAPPORT = await rest("rpc/rapport_utilisation", {
    method: "POST",
    body: JSON.stringify({ p_evenement: selection, p_jours: joursPeriode() })
  });
}
function chiffre(hote, valeur, libelle, sous, fort) {
  const d = document.createElement("div");
  d.className = "chiffre" + (fort ? " fort" : "");
  d.innerHTML = '<span class="n"></span><span class="l"></span>' + (sous ? '<span class="s"></span>' : "");
  d.querySelector(".n").textContent = nb(valeur);
  d.querySelector(".l").textContent = libelle;
  if (sous) d.querySelector(".s").textContent = sous;
  hote.appendChild(d);
  return d;
}
function barres(hote, canaux, total, connus) {
  const lignes = connus.map(([cle, lib]) => [cle, lib, canaux[cle] || 0]);
  Object.keys(canaux).forEach((cle) => {
    if (!connus.some((c) => c[0] === cle)) {
      lignes.push([cle, cle === AUTRE[0] ? AUTRE[1] : cle, canaux[cle]]);
    }
  });
  const max = Math.max(1, ...lignes.map((l) => l[2]));
  const box = document.createElement("div");
  box.className = "barres";
  lignes.forEach(([cle, lib, n]) => {
    const d = document.createElement("div");
    d.className = "barre";
    d.innerHTML = '<span class="l"></span><span class="j"><span></span></span><span class="v"></span>';
    d.querySelector(".l").textContent = lib;
    d.querySelector(".j > span").style.width = (n / max * 100).toFixed(1) + "%";
    d.querySelector(".v").innerHTML = esc(nb(n)) + (total ? '<span class="pc">' + Math.round(n / total * 100) + " %</span>" : "");
    box.appendChild(d);
  });
  hote.appendChild(box);
}
function portes(hote, liste) {
  const compte = (p) => p.visites || p.visiteurs || p.fiches;
  const vues = SUPPORTS.map(([cle]) => (liste || []).find((p) => p.support === cle)).filter((p) => p && compte(p));
  (liste || []).forEach((p) => {
    if (compte(p) && !SUPPORTS.some((x) => x[0] === p.support)) vues.push(p);
  });
  if (!vues.length) return;
  const phare = vues.reduce((a, p) => p.support && (!a || p.visites > a.visites) ? p : a, null);
  const box = document.createElement("div");
  box.className = "chiffres";
  vues.forEach((p) => {
    const su = SUPPORTS.find((x) => x[0] === p.support);
    const s = [];
    s.push(nb(p.visiteurs) + " visiteur" + (p.visiteurs > 1 ? "s" : ""));
    if (p.volatils) s.push("dont " + nb(p.volatils) + " au stockage refusé");
    s.push(nb(p.fiches) + " fiche" + (p.fiches > 1 ? "s" : "") + " ouverte" + (p.fiches > 1 ? "s" : ""));
    chiffre(
      box,
      p.visites,
      (su ? su[1] : p.support) + " · visites",
      s.join(" · "),
      vues.length > 1 && p === phare
    );
  });
  hote.appendChild(box);
  const l = document.createElement("div");
  l.className = "legende";
  vues.forEach((p) => {
    const su = SUPPORTS.find((x) => x[0] === p.support);
    if (!su) return;
    const d = document.createElement("p");
    d.className = "astuce";
    d.textContent = su[1] + " — " + su[2];
    l.appendChild(d);
  });
  if (l.children.length) hote.appendChild(l);
}
function jours(hote, liste) {
  if (!liste.length) return;
  const max = Math.max(1, ...liste.map((j) => j.visites));
  const box = document.createElement("div");
  box.className = "jours";
  liste.forEach((j) => {
    const d = document.createElement("div");
    d.className = "jour-bat";
    d.innerHTML = '<span class="b"></span><span class="d"></span>';
    d.querySelector(".b").style.height = Math.max(2, j.visites / max * 100) + "%";
    const [an, mois, jour] = String(j.j).split("-");
    d.querySelector(".d").textContent = jour + "/" + mois;
    d.title = jour + "/" + mois + "/" + an + " · " + nb(j.visites) + " visite" + (j.visites > 1 ? "s" : "") + ", " + nb(j.visiteurs) + " visiteur" + (j.visiteurs > 1 ? "s" : "");
    box.appendChild(d);
  });
  hote.appendChild(box);
}
function dessineRapport() {
  const f = $("rapport");
  f.innerHTML = "";
  if (!SESSION) {
    f.innerHTML = '<div class="vide">Connectez-vous pour lire le rapport.</div>';
    return;
  }
  if (!EVTS.length) {
    f.innerHTML = '<div class="vide">Aucun événement.<br>Créez-en un depuis la console.</div>';
    return;
  }
  const e = courant();
  const r = RAPPORT;
  if (!e || !r) {
    f.innerHTML = '<div class="vide">Chargement…</div>';
    return;
  }
  const entete = document.createElement("div");
  entete.className = "entete";
  entete.innerHTML = '<div><span class="eyebrow">Utilisation</span><h2></h2><span class="etat ' + e.etat + '">' + (e.etat === "publie" ? "Publié" : "Brouillon") + '</span></div><div class="droite"><a class="btn petit" id="lienPublic" target="_blank" rel="noopener">Voir le plan</a></div>';
  entete.querySelector("h2").textContent = e.nom;
  f.appendChild(entete);
  $("lienPublic").href = BASE_PAGES + "plan?plan=" + encodeURIComponent(e.slug || "");
  if (!r.depuis) {
    const v = document.createElement("div");
    v.className = "vide";
    v.innerHTML = "Aucune mesure pour cet événement.<br>" + (e.etat === "publie" ? "Les visites sont comptées dès la première ouverture du plan public." : "L'événement est en brouillon : son plan n'est pas encore servi aux visiteurs.");
    f.appendChild(v);
    return;
  }
  const b1 = bloc("Fréquentation");
  const g1 = document.createElement("div");
  g1.className = "chiffres";
  chiffre(
    g1,
    r.visites,
    "Visites",
    "Une ouverture du plan. Revenir plus tard en fait une seconde.",
    true
  );
  const horizon = new Date(Date.now() - JETONS_GARDES_JOURS * 864e5);
  const debut = periode === "tout" ? new Date(r.depuis) : new Date(Date.now() - Number(periode) * 864e5);
  chiffre(
    g1,
    r.visiteurs,
    "Visiteurs uniques",
    "Navigateurs distincts sur la période." + (r.visiteurs_volatils ? " Dont " + nb(r.visiteurs_volatils) + " au stockage refusé, recomptés à chaque ouverture." : "") + (debut < horizon ? " Jetons effacés au bout de " + JETONS_GARDES_JOURS + " jours : les visiteurs plus anciens n'y sont plus." : ""),
    true
  );
  chiffre(g1, r.recherches, "Recherches", "Mots-clés saisis, doublons écartés.");
  chiffre(g1, r.itineraires, "Itinéraires calculés", "Trajets distincts demandés.");
  chiffre(
    g1,
    r.parcours,
    "Programmes de visite",
    nb(r.parcours_gestes) + " ajout" + (r.parcours_gestes > 1 ? "s" : "") + " ou retrait" + (r.parcours_gestes > 1 ? "s" : "") + " au total."
  );
  chiffre(
    g1,
    r.partages,
    "Parcours partagés",
    r.partages_repris ? r.partages_repris > 1 ? nb(r.partages_repris) + " étapes reprises par ceux qui les ont reçus." : nb(r.partages_repris) + " étape reprise par qui l'a reçue." : "Aucune étape reprise pour l'instant."
  );
  b1.appendChild(g1);
  f.appendChild(b1);
  const b2 = bloc("Par moyen d'accès");
  portes(b2, r.supports);
  const a2 = document.createElement("p");
  a2.className = "astuce";
  a2.style.marginTop = "12px";
  const portesVues = (r.supports || []).filter((x) => x.support);
  a2.textContent = (r.supports || []).length > 1 ? "Les visites ne se comparent pas d'une porte à l'autre : rouvrir une application en ouvre une à chaque fois, un cadre en ouvre une par page du site qui le porte. Et la somme des visiteurs dépasse le total ci-dessus — un navigateur, une application et un cadre posé sur un site tiers ne partagent aucun jeton, le même visiteur y compte une fois par porte et une seule au total." : portesVues.length ? "Tout est passé par la même porte sur cette période." : "La porte d'accès n'était pas encore comptée sur cette période.";
  b2.appendChild(a2);
  f.appendChild(b2);
  const b3 = bloc("Fiches exposants ouvertes");
  const g3 = document.createElement("div");
  g3.className = "chiffres seul";
  chiffre(g3, r.stands.total, "Ouvertures", "Toutes provenances confondues.", true);
  b3.appendChild(g3);
  const t3 = document.createElement("p");
  t3.className = "eyebrow";
  t3.style.margin = "16px 0 10px";
  t3.textContent = "Par canal";
  b3.appendChild(t3);
  barres(b3, r.stands.canaux || {}, r.stands.total, CANAUX_STAND);
  f.appendChild(b3);
  const b4 = bloc("Fiches conférences ouvertes");
  const g4 = document.createElement("div");
  g4.className = "chiffres seul";
  chiffre(g4, r.conferences.total, "Ouvertures", "Toutes provenances confondues.", true);
  b4.appendChild(g4);
  const t4 = document.createElement("p");
  t4.className = "eyebrow";
  t4.style.margin = "16px 0 10px";
  t4.textContent = "Par canal";
  b4.appendChild(t4);
  barres(b4, r.conferences.canaux || {}, r.conferences.total, CANAUX_CONF);
  const a4 = document.createElement("p");
  a4.className = "astuce";
  a4.style.marginTop = "12px";
  a4.textContent = "Une conférence s'ouvre depuis le programme de la salle qui l'accueille, depuis la fiche de l'exposant qui la tient, ou depuis le programme de visite. Elle n'a ni recherche ni forme propre sur le plan.";
  b4.appendChild(a4);
  f.appendChild(b4);
  const b5 = bloc("Jour par jour");
  jours(b5, r.jours || []);
  const a5 = document.createElement("p");
  a5.className = "astuce";
  a5.style.marginTop = "10px";
  a5.textContent = "Visites par jour, dans le fuseau du salon (" + (r.fuseau || "UTC") + "). Mesure ouverte depuis le " + new Date(r.depuis).toLocaleDateString(
    "fr-FR",
    { dateStyle: "long", timeZone: r.fuseau || "UTC" }
  ) + ".";
  b5.appendChild(a5);
  f.appendChild(b5);
}
function dessineBarre() {
  const s = $("choixEvt");
  s.innerHTML = EVTS.map((e2) => '<option value="' + esc(e2.id) + '"' + (e2.id === selection ? " selected" : "") + ">" + esc(e2.nom) + (e2.etat === "publie" ? "" : " · brouillon") + "</option>").join("");
  s.hidden = !EVTS.length;
  const e = EVTS.find((x) => x.id === selection);
  $("lienConsole").href = "admin-plans" + (e?.slug ? "?plan=" + encodeURIComponent(e.slug) : "");
  const p = $("choixPeriode");
  if (!p.options.length) {
    p.innerHTML = PERIODES.map((x) => '<option value="' + x[0] + '">' + x[1] + "</option>").join("");
  }
  p.value = periode;
  $("btnExcel").disabled = !(SESSION && selection);
}
let _occupe = false;
async function rafraichit() {
  if (_occupe) return;
  _occupe = true;
  $("btnRecharger").disabled = true;
  try {
    await chargeRapport();
    signale("");
  } catch (e) {
    RAPPORT = null;
    signale(e.message, true);
  } finally {
    _occupe = false;
    $("btnRecharger").disabled = false;
    dessineBarre();
    dessineRapport();
  }
}
function videEcran() {
  EVTS = [];
  RAPPORT = null;
  selection = null;
  dessineBarre();
  dessineRapport();
}
$("choixEvt").onchange = (e) => {
  selection = e.target.value;
  try {
    localStorage.setItem(CLE_EVT, selection);
  } catch (err) {
  }
  rafraichit();
};
$("choixPeriode").onchange = (e) => {
  periode = e.target.value;
  rafraichit();
};
$("btnRecharger").onclick = () => rafraichit();
$("btnExcel").onclick = (ev) => exporteExposants(ev.currentTarget, joursPeriode());
async function demarre() {
  try {
    await chargeEvenements();
    dessineBarre();
    await rafraichit();
  } catch (e) {
    $("rapport").innerHTML = '<div class="vide"></div>';
    $("rapport").querySelector(".vide").textContent = "Chargement impossible : " + e.message;
  }
}
if (!CFG) ecranConfig();
else if (!SESSION) ecranConnexion();
else demarre();
</script>
