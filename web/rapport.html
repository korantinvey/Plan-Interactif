   Compte
   ------------------------------------------------------------------ */
/**
 * Les initiales de l'adresse : « korantin.vey@… » donne « KV », « alexandra@… »
 * donne « AL ». Le profil porte bien un nom, mais il arrive après le premier
 * dessin de la barre, et parfois pas du tout — l'adresse, elle, est dans le
 * jeton qu'on tient déjà.
 */
function initialesDe(mail) {
  const local = String(mail || "").split("@")[0];
  const mots = local.split(/[.\-_+]+/).filter(Boolean);
  if (mots.length >= 2) return (mots[0][0] + mots[1][0]).toUpperCase();
  return (local.slice(0, 2) || "··").toUpperCase();
}

/* Le panneau se remplit à l'ouverture, jamais au chargement : la session peut
   arriver après — on vient de se connecter — et l'ouverture est le seul moment
   où l'on est sûr d'avoir quelque chose de juste à montrer. */
const menuCompte = document.querySelector("details.menu.compte");
if (menuCompte) {
  menuCompte.addEventListener("toggle", () => {
    if (!menuCompte.open) return;
    const mail = contenuJeton(SESSION?.access_token)?.email || "";
    $("initiales").textContent = mail ? initialesDe(mail) : "··";
    $("compteMail").textContent = mail || "session inconnue";
    // le libellé annonce où l'on va, pas où l'on est
    $("btnTheme").textContent = themeSombre() ? "Thème clair" : "Thème sombre";
  });
  $("btnSortir").onclick = () => {
    menuCompte.open = false;
    deconnecte();
  };
}

/* ============================================================
   Classeur — écrire un vrai fichier Excel, sans bibliothèque

   L'organisateur veut rendre des comptes à ses exposants, et il le fait dans
   un tableur : c'est là qu'il trie, filtre, et colle la ligne d'un exposant
   dans le courriel qu'il lui envoie. Un CSV l'aurait servi à moitié — Excel y
   devine le séparateur de travers une fois sur deux, selon la langue du poste,
   et un nombre s'y lit comme du texte.

   Pourquoi rien n'est chargé d'ailleurs : la console est servie telle quelle
   par Cloudflare, sans étape de construction ; une dépendance ajoutée ici
   serait un script tiers de plus dans une page d'administration. Or un `.xlsx`
   est une archive ZIP de quelques fichiers XML, et une archive sans
   compression n'a besoin que d'un CRC32. Cela tient en deux cents lignes,
   qu'on relit, plutôt qu'en trois cents kilo-octets qu'on ne relit pas.

   Ce qu'il sait faire, et rien de plus : une feuille, une ligne d'en-têtes en
   gras et figée, des colonnes larges à la demande, du texte et des nombres.
   ============================================================ */

/**
 * CRC32, table précalculée.
 *
 * Le calcul bit à bit suffirait, mais l'archive fait le mégaoctet sur un gros
 * salon : huit millions de tours de boucle se sentent sur un poste modeste, et
 * la table les divise par huit pour deux cent cinquante-six entiers.
 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/**
 * Une archive ZIP, entrées rangées sans compression.
 *
 * Déflater économiserait les trois quarts du fichier — un classeur XML se
 * comprime très bien — mais demanderait `CompressionStream`, donc un chemin de
 * repli pour les navigateurs qui ne l'ont pas, donc deux codes à maintenir
 * pour un fichier qu'on ouvre et qu'on jette. Un mégaoctet enregistré depuis
 * la console de son propre salon ne coûte rien à personne.
 */
function archiveZip(fichiers){
  const enc = new TextEncoder();
  const d = new Date();
  const heureDos = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dateDos = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

  const p16 = (t, n) => t.push(n & 255, (n >> 8) & 255);
  const p32 = (t, n) => t.push(n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255);

  const morceaux = [], index = [];
  let pos = 0;
  for (const f of fichiers){
    const nom = enc.encode(f.nom), data = enc.encode(f.texte);
    const somme = crc32(data);
    const tete = [];
    p32(tete, 0x04034b50);
    p16(tete, 20);            // version minimale : rangé sans compression
    p16(tete, 0x0800);        // noms en UTF-8
    p16(tete, 0);             // méthode : rangé
    p16(tete, heureDos); p16(tete, dateDos);
    p32(tete, somme); p32(tete, data.length); p32(tete, data.length);
    p16(tete, nom.length); p16(tete, 0);
    morceaux.push(new Uint8Array(tete), nom, data);
    index.push({ nom: nom, somme: somme, taille: data.length, pos: pos });
    pos += tete.length + nom.length + data.length;
  }

  const centre = [];
  for (const e of index){
    p32(centre, 0x02014b50);
    p16(centre, 20); p16(centre, 20);
    p16(centre, 0x0800); p16(centre, 0);
    p16(centre, heureDos); p16(centre, dateDos);
    p32(centre, e.somme); p32(centre, e.taille); p32(centre, e.taille);
    p16(centre, e.nom.length); p16(centre, 0); p16(centre, 0);
    p16(centre, 0); p16(centre, 0); p32(centre, 0);
    p32(centre, e.pos);
    centre.push(...e.nom);
  }
  const fin = [];
  p32(fin, 0x06054b50);
  p16(fin, 0); p16(fin, 0);
  p16(fin, index.length); p16(fin, index.length);
  p32(fin, centre.length); p32(fin, pos);
  p16(fin, 0);

  morceaux.push(new Uint8Array(centre), new Uint8Array(fin));
  return new Blob(morceaux, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* ------------------------------------------------------------------
   Le classeur
   ------------------------------------------------------------------ */
/* Un nom d'exposant vient d'un fournisseur, et rien n'y interdit un caractère
   de commande. XML 1.0 les refuse : Excel n'ouvrirait pas le fichier, et
   l'erreur ne dirait pas pourquoi. On les retire avant d'échapper le reste. */
const texteXml = (v) => esc(String(v == null ? "" : v).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ""));

/** « A », « B », … « AA » : la référence d'une colonne, à partir de 1. */
function colonneXl(n){
  let s = "";
  while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
  return s;
}

/* Le squelette d'un classeur d'une feuille. Rien n'y varie que la feuille
   elle-même : ces quatre parties sont les mêmes d'un export à l'autre. */
const XL_DECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
const XL_NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const XL_NS_REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const XL_PARTS = (feuille, titre) => [
  { nom: "[Content_Types].xml", texte: XL_DECL +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>' },
  { nom: "_rels/.rels", texte: XL_DECL +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + XL_NS_REL + '/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>' },
  { nom: "xl/workbook.xml", texte: XL_DECL +
    '<workbook xmlns="' + XL_NS + '" xmlns:r="' + XL_NS_REL + '">' +
    '<sheets><sheet name="' + texteXml(titre) + '" sheetId="1" r:id="rId1"/></sheets>' +
    '</workbook>' },
  { nom: "xl/_rels/workbook.xml.rels", texte: XL_DECL +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + XL_NS_REL + '/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="' + XL_NS_REL + '/styles" Target="styles.xml"/>' +
    '</Relationships>' },
  /* Deux styles : ordinaire, et gras pour la ligne d'en-têtes. Les listes de
     polices, remplissages et bordures ne servent à rien ici, mais Excel refuse
     un classeur dont la feuille de styles n'en porte aucune. */
  { nom: "xl/styles.xml", texte: XL_DECL +
    '<styleSheet xmlns="' + XL_NS + '">' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>' },
  { nom: "xl/worksheets/sheet1.xml", texte: feuille },
];

/**
 * Une feuille, à partir de colonnes et de lignes.
 *
 *   colonnes : [{ titre, largeur }]  — la largeur est en caractères
 *   lignes   : [[valeur, …]]         — nombre ou texte, dans l'ordre des colonnes
 *
 * Les textes sont écrits en clair dans la cellule plutôt que renvoyés à une
 * table de chaînes partagées : celle-ci économiserait la place sur des valeurs
 * répétées, et il n'y en a pas ici — un nom d'exposant ne paraît qu'une fois.
 *
 * Une cellule vide est omise, pas écrite vide : c'est ce qu'attend le format,
 * et cela retire un tiers du fichier sur un salon où la plupart des canaux
 * sont à zéro.
 */
function feuilleXl(colonnes, lignes){
  const derniere = colonneXl(colonnes.length);
  const cellule = (col, rang, v, style) => {
    if (v === "" || v == null) return "";
    const r = ' r="' + colonneXl(col) + rang + '"' + (style ? ' s="' + style + '"' : "");
    return typeof v === "number" && isFinite(v)
      ? "<c" + r + "><v>" + v + "</v></c>"
      : '<c' + r + ' t="inlineStr"><is><t xml:space="preserve">' + texteXml(v) + "</t></is></c>";
  };
  const corps = [
    "<row r=\"1\">" + colonnes.map((c, i) => cellule(i + 1, 1, c.titre, 1)).join("") + "</row>",
  ];
  lignes.forEach((l, i) => {
    corps.push('<row r="' + (i + 2) + '">' +
      colonnes.map((c, j) => cellule(j + 1, i + 2, l[j])).join("") + "</row>");
  });
  const etendue = "A1:" + derniere + (lignes.length + 1);
  return XL_DECL +
    '<worksheet xmlns="' + XL_NS + '">' +
    '<dimension ref="' + etendue + '"/>' +
    /* L'en-tête reste à l'écran : un salon aligne neuf cents lignes, et sans
       cela on ne sait plus au bout de trente ce que compte la colonne G. */
    '<sheetViews><sheetView workbookViewId="0">' +
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
    "</sheetView></sheetViews>" +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    "<cols>" + colonnes.map((c, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' +
      (c.largeur || 12) + '" customWidth="1"/>').join("") + "</cols>" +
    "<sheetData>" + corps.join("") + "</sheetData>" +
    // les filtres posés d'avance : c'est le premier geste de qui reçoit ce fichier
    '<autoFilter ref="' + etendue + '"/>' +
    "</worksheet>";
}

/** Le classeur complet, prêt à enregistrer. */
const classeurXl = (titre, colonnes, lignes) =>
  archiveZip(XL_PARTS(feuilleXl(colonnes, lignes), titre));

/**
 * Proposer un fichier à l'enregistrement.
 *
 * L'adresse temporaire est révoquée après coup : sans cela le classeur — un
 * mégaoctet — resterait en mémoire tant que l'onglet vit, et la console reste
 * ouverte la journée. Le délai laisse au navigateur le temps de lire l'adresse
 * avant qu'elle ne disparaisse.
 */
function enregistreFichier(blob, nom){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* ============================================================
   Export par exposant — une ligne par stand, une colonne par provenance

   Les chiffres du rapport disent ce qu'a fait le salon ; celui-ci dit ce qu'a
   recueilli chaque exposant. C'est le tableau qu'on n'affiche nulle part —
   neuf cents lignes sur quinze colonnes ne se lisent pas dans une page — et
   qu'on donne à trier, filtrer et découper dans un tableur. C'est aussi ce
   qu'un organisateur recolle dans le courriel qu'il envoie à son exposant.

   Le module vit à part parce que deux écrans l'ouvrent : la console, où il est
   une action du salon ouvert, et le rapport, où il suit la période affichée.
   Recopié dans les deux, il aurait divergé — et ces deux boutons doivent
   rendre le même fichier.

   Les chiffres sont ceux de la carte de chaleur, au sens strict : même
   fonction, `audience_cibles`, même balayage du même compteur. Elle ne peint
   qu'un nombre par stand, le tableur en aligne quinze colonnes — c'est à quoi
   sert « p_complet » — mais aucun des deux ne recalcule ce que l'autre a déjà
   compté.
   ============================================================ */
const nb = (n) => Number(n || 0).toLocaleString("fr-FR");

/* Par quel chemin une fiche s'est ouverte. L'ordre est celui de la lecture, et
   la liste sert aussi bien aux barres du rapport qu'aux colonnes du classeur :
   les deux nomment les mêmes canaux, il n'y a pas deux vocabulaires. */
const CANAUX_STAND = [
  ["recherche", "Recherche"],
  ["plan", "Clic sur le plan"],
  ["image", "Clic sur un logo ou une image"],
  ["conference", "Nom cité par une conférence"],
  ["liste", "Liste du pavillon"],
  ["parcours", "Programme de visite"],
  ["suggestion", "Proposé pour compléter une visite"],
  ["lien", "Lien direct"],
];
const AUTRE = ["autre", "Autre"];

/*
 * Deux nombres par geste, et non un : « combien de fois » et « combien de qui ».
 *
 * C'est la colonne de gauche qu'on lisait jusqu'ici, et elle se comprenait de
 * travers. « 240 » sur la ligne d'un exposant se lit « 240 personnes sont
 * venues me voir » ; c'étaient 240 ouvertures de fiche, le même visiteur qui
 * rouvre cinq fois pesant cinq. Les deux ensemble se lisent enfin : un stand
 * ouvert 240 fois par 8 personnes et un stand ouvert 240 fois par 200 ne
 * racontent pas la même chose, et aucun des deux nombres seul ne les distingue.
 */
const COL_TETE = [
  { titre: "Emplacement", largeur: 14, lit: (r) => r.code || "" },
  { titre: "Exposant", largeur: 38, lit: (r) => r.nom || "" },
  { titre: "Fiches ouvertes", largeur: 16, lit: (r) => Number(r.n) || 0 },
];
const COL_TETE_V = [
  { titre: "Visiteurs uniques", largeur: 18, lit: (r) => Number(r.v) || 0 },
];
const COL_PIED = [
  { titre: "Itinéraires calculés", largeur: 20, lit: (r) => Number(r.itineraires) || 0 },
  { titre: "Ajouts au programme de visite", largeur: 29, lit: (r) => Number(r.parcours) || 0 },
  /* Dont ceux venus de la suggestion — une colonne à part et non une part du
     total : c'est le seul chiffre qui dise si proposer un exposant de plus a
     servi, et le déduire de la colonne d'à côté demanderait de savoir qu'il en
     fait partie. */
  { titre: "Ajouts depuis une suggestion", largeur: 27,
    lit: (r) => Number(r.suggestions) || 0 },
  /* Et ceux repris du parcours de quelqu'un d'autre, pour la même raison :
     c'est un exposant qu'on s'est transmis, pas un exposant qu'on a trouvé. */
  { titre: "Ajouts depuis un parcours reçu", largeur: 29,
    lit: (r) => Number(r.partages) || 0 },
  { titre: "Total interactions", largeur: 18,
    lit: (r) => (Number(r.n) || 0) + (Number(r.itineraires) || 0) + (Number(r.parcours) || 0) },
];
/* Les mêmes en visiteurs, intercalées chacune après la sienne : c'est côte à
   côte que l'écart se voit. « Total interactions » n'a pas de jumelle — une
   somme de gestes ne se convertit pas en personnes, et additionner trois
   cardinaux qui se recouvrent ne donnerait aucun nombre réel. */
const COL_PIED_V = {
  "Itinéraires calculés":
    { titre: "Visiteurs ayant demandé la route", largeur: 31,
      lit: (r) => Number(r.v_itineraires) || 0 },
  "Ajouts au programme de visite":
    { titre: "Visiteurs l'ayant mis à leur programme", largeur: 36,
      lit: (r) => Number(r.v_parcours) || 0 },
  "Ajouts depuis une suggestion":
    { titre: "Visiteurs venus d'une suggestion", largeur: 31,
      lit: (r) => Number(r.v_suggestions) || 0 },
  "Ajouts depuis un parcours reçu":
    { titre: "Visiteurs venus d'un parcours reçu", largeur: 33,
      lit: (r) => Number(r.v_partages) || 0 },
};

/**
 * Les colonnes, canaux compris.
 *
 * Les canaux connus paraissent tous, même vides — une colonne « clic sur un
 * logo » à zéro renseigne, elle dit qu'aucun logo n'a été posé — et dans le
 * même ordre qu'à l'écran. Un canal inconnu de cette page, ajouté depuis, prend
 * la suite sous son nom brut plutôt que de disparaître de la somme.
 *
 * `presence` dit si les visiteurs uniques sont enregistrés pour ce salon. Faux,
 * les colonnes de visiteurs ne paraissent pas du tout — plutôt qu'une colonne
 * de zéros, qui se lirait « personne n'est venu » là où il faut lire « on ne
 * comptait pas encore les personnes ». Un classeur voyage seul, souvent jusqu'à
 * l'exposant : il ne peut pas porter de note de bas de page.
 */
function colonnesExport(lignes, presence) {
  const canaux = CANAUX_STAND.concat([AUTRE]);
  const inconnus = new Set();
  lignes.forEach((r) => Object.keys(r.canaux || {}).forEach((c) => {
    if (!canaux.some((x) => x[0] === c)) inconnus.add(c);
  }));
  [...inconnus].sort().forEach((c) => canaux.push([c, c]));
  const bas = (lib) => lib.charAt(0).toLowerCase() + lib.slice(1);
  const large = (lib, marge) => Math.min(38, Math.max(15, lib.length + marge));
  return COL_TETE.concat(
    presence ? COL_TETE_V : [],
    canaux.reduce((cols, [cle, lib]) => {
      cols.push({
        titre: "Ouvertures · " + bas(lib), largeur: large(lib, 13),
        lit: (r) => (r.canaux || {})[cle] || 0,
      });
      if (presence) {
        cols.push({
          titre: "Visiteurs · " + bas(lib), largeur: large(lib, 13),
          lit: (r) => (r.v_canaux || {})[cle] || 0,
        });
      }
      return cols;
    }, []),
    COL_PIED.reduce((cols, c) => {
      cols.push(c);
      if (presence && COL_PIED_V[c.titre]) cols.push(COL_PIED_V[c.titre]);
      return cols;
    }, []));
}

/** La période en toutes lettres, depuis le nombre de jours demandé. */
const libellePeriode = (jours) =>
  jours ? jours + " derniers jours" : "depuis le début";

/* Le nom porte le salon et la période : deux exports de suite dans le même
   dossier ne doivent ni se recouvrir ni se confondre une fois détachés de la
   page qui les a produits. */
function nomFichierExport(e, jours) {
  return ("utilisation-" + (e?.slug || "salon") +
    "-" + (jours ? jours + "j" : "tout") +
    "-" + new Date().toISOString().slice(0, 10) + ".xlsx")
    .replace(/[^A-Za-z0-9._-]+/g, "-");
}

/* Le nom de la feuille redit la période : le fichier voyage seul, souvent
   jusqu'à l'exposant, et rien d'autre à l'intérieur ne dirait ce qu'il couvre.
   Excel refuse au-delà de trente et un caractères, et refuse `[]:*?/\`. */
const nomFeuilleExport = (jours) =>
  ("Exposants (" + libellePeriode(jours) + ")")
    .replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31);

/**
 * Fabriquer le classeur, et le proposer à l'enregistrement.
 *
 * Le bouton et la période viennent de l'appelant : la console n'a pas de
 * sélecteur de période — elle exporte tout — quand le rapport suit celle qu'il
 * affiche. Le reste est identique, et c'est bien l'objet de ce module.
 *
 * Il se charge au clic, jamais à l'ouverture de la page : c'est un appel de
 * plusieurs centaines de kilo-octets, et la plupart des visites n'en veulent
 * pas.
 */
let _export = false;
async function exporteExposants(bouton, jours) {
  if (_export || !selection) return;
  const e = courant(), libelle = bouton ? bouton.textContent : "";
  _export = true;
  if (bouton) { bouton.disabled = true; bouton.textContent = "Préparation…"; }
  /* Dit tout de suite, car le menu d'où part souvent ce clic se referme
     aussitôt : sans cela rien ne bougerait à l'écran pendant l'appel. */
  signale("Préparation du classeur…");
  try {
    const r = await rest("rpc/audience_cibles", {
      method: "POST",
      body: JSON.stringify({
        p_evenement: selection,
        p_jours: jours || null,
        p_genre: "fiche_stand",
        p_complet: true,
      }),
    });
    const lignes = (r && r.cibles) || [];
    /* Aucun exposant n'est un renseignement, pas une panne : le salon n'a
       jamais été synchronisé, et c'est ce qu'il faut dire. */
    if (!lignes.length) {
      signale("Aucun exposant à exporter : ce salon n'a pas encore été synchronisé.", true);
      return;
    }
    /* `v_depuis` est nul tant qu'aucune présence n'a été enregistrée — un
       salon mesuré avant qu'on ne compte les visiteurs uniques. Les colonnes
       correspondantes sont alors retirées plutôt que remplies de zéros. */
    const cols = colonnesExport(lignes, !!(r && r.v_depuis));
    /* Le classeur quitte la page : la version anglaise ne le voit pas passer.
       Ses intitulés partent donc dans la langue de l'écran, traduits ici. */
    const intitules = cols.map((c) => ({ ...c, titre: traduit(c.titre) }));
    enregistreFichier(
      classeurXl(traduit(nomFeuilleExport(jours)), intitules,
        lignes.map((r2) => cols.map((c) => c.lit(r2)))),
      nomFichierExport(e, jours));
    const s = lignes.length > 1 ? "s" : "";
    signale(nb(lignes.length) + " exposant" + s + " exporté" + s +
            " (" + libellePeriode(jours) + ").");
  } catch (err) {
    signale(err.message, true);
  } finally {
    _export = false;
    if (bouton) { bouton.disabled = false; bouton.textContent = libelle; }
  }
}

/* ============================================================
   Rapport d'utilisation

   Un salon se juge sur ce qu'il a servi. La console dit ce que le plan
   contient ; cette page dit ce qu'on en a fait — combien sont venus, ce
   qu'ils ont cherché, quelles fiches ils ont ouvertes et par quel chemin.

   Tout le calcul est fait par la base, en un appel : rapatrier les gestes
   pour les compter ici reviendrait à télécharger un salon entier.
   ============================================================ */
const CLE_EVT = "rapport-evenement";

let EVTS = [], selection = null, RAPPORT = null, periode = "30";

/* Les périodes proposées. La valeur est un nombre de jours, ou « tout » : on
   ne demande pas à un organisateur de saisir deux dates pour lire son salon. */
const PERIODES = [
  ["7", "7 derniers jours"],
  ["30", "30 derniers jours"],
  ["90", "90 derniers jours"],
  ["tout", "Depuis le début"],
];

/* L'âge auquel la base efface les jetons de visiteur : le défaut de
   `purge_presences`, que la notice du plan annonce aussi. Les trois vont
   ensemble, et un seul changé ferait mentir les deux autres. */
const JETONS_GARDES_JOURS = 400;

/* Les canaux d'une fiche exposant — `CANAUX_STAND`, `AUTRE` — et le formatage
   des nombres viennent du module d'export : les barres d'ici et les colonnes du
   classeur nomment les mêmes provenances, et il n'y a pas deux vocabulaires.
   Ceux d'une conférence ne servent qu'ici, le classeur ne les aligne pas. */
const CANAUX_CONF = [
  ["salle", "Programme d'une salle"],
  ["exposant", "Fiche d'un exposant"],
  ["parcours", "Programme de visite"],
];

/* Les portes par lesquelles on atteint le plan, dans l'ordre où on les lit, et
   ce que chacune veut dire pour un organisateur qui ne connaît pas le mot que
   la base emploie. La chaîne vide est ce qui a été compté avant que la porte ne
   le soit : elle reste nommée, sans quoi un salon d'avant paraîtrait vide. */
const SUPPORTS = [
  ["web", "Navigateur", "Le plan ouvert dans un onglet."],
  ["integre", "Cadre sur un site", "Encadré dans la page d'un site ou d'une application tierce."],
  ["pwa", "Écran d'accueil", "Installé sur l'appareil, lancé hors du navigateur."],
  ["appli", "Application", "Servi par une coque déposée sur une boutique."],
  ["", "Non précisé", "Compté avant que la porte d'accès ne le soit."],
];

const courant = () => EVTS.find((e) => e.id === selection);

/* ------------------------------------------------------------------
   Données
   ------------------------------------------------------------------ */
async function chargeEvenements() {
  EVTS = await rest("evenement?select=id,nom,slug,etat&order=nom.asc");
  const voulu = new URLSearchParams(location.search).get("plan");
  let garde = null;
  try { garde = localStorage.getItem(CLE_EVT); } catch (e) {}
  selection = (voulu && EVTS.find((e) => e.slug === voulu)?.id) ||
    (EVTS.some((e) => e.id === garde) ? garde : null) || EVTS[0]?.id || null;
}

/**
 * La période, en nombre de jours.
 *
 * La page ne calcule plus de date : elle disait « minuit », mais minuit chez le
 * lecteur — et un salon parisien lu depuis Montréal ne se découpait pas au même
 * endroit que la carte de chaleur, qui compte dans le fuseau du salon. Le
 * nombre de jours part tel quel, la base tranche, et les trois écrans tombent
 * sur la même journée.
 */
const joursPeriode = () => periode === "tout" ? null : Number(periode);

async function chargeRapport() {
  if (!selection) { RAPPORT = null; return; }
  RAPPORT = await rest("rpc/rapport_utilisation", {
    method: "POST",
    body: JSON.stringify({ p_evenement: selection, p_jours: joursPeriode() }),
  });
}

/* ------------------------------------------------------------------
   Rendu
   ------------------------------------------------------------------ */
function chiffre(hote, valeur, libelle, sous, fort) {
  const d = document.createElement("div");
  d.className = "chiffre" + (fort ? " fort" : "");
  d.innerHTML = '<span class="n"></span><span class="l"></span>' +
    (sous ? '<span class="s"></span>' : "");
  d.querySelector(".n").textContent = nb(valeur);
  d.querySelector(".l").textContent = libelle;
  if (sous) d.querySelector(".s").textContent = sous;
  hote.appendChild(d);
  return d;
}

/**
 * Une barre par canal, mise à l'échelle du plus fort.
 *
 * Rapporter la longueur au total plutôt qu'au maximum écraserait tout dès
 * qu'un canal domine — et il en domine toujours un. Le pourcentage, lui, se
 * lit bien sur le total : c'est la part qu'on cite.
 */
function barres(hote, canaux, total, connus) {
  const lignes = connus.map(([cle, lib]) => [cle, lib, canaux[cle] || 0]);
  // un canal inconnu de cette page — ajouté depuis, ou hors vocabulaire —
  // vaut mieux affiché sous son nom brut que passé sous silence
  Object.keys(canaux).forEach((cle) => {
    if (!connus.some((c) => c[0] === cle)) {
      lignes.push([cle, cle === AUTRE[0] ? AUTRE[1] : cle, canaux[cle]]);
    }
  });
  const max = Math.max(1, ...lignes.map((l) => l[2]));
  const box = document.createElement("div");
  box.className = "barres";
  lignes.forEach(([cle, lib, n]) => {
    const d = document.createElement("div");
    d.className = "barre";
    d.innerHTML = '<span class="l"></span><span class="j"><span></span></span>' +
      '<span class="v"></span>';
    d.querySelector(".l").textContent = lib;
    d.querySelector(".j > span").style.width = (n / max * 100).toFixed(1) + "%";
    d.querySelector(".v").innerHTML = esc(nb(n)) +
      (total ? '<span class="pc">' + Math.round(n / total * 100) + " %</span>" : "");
    box.appendChild(d);
  });
  hote.appendChild(box);
}

/**
 * Une carte par porte d'accès.
 *
 * Des cartes et non des barres, alors que les canaux d'une fiche s'affichent en
 * barres : une barre compare, et ces chiffres-là ne se comparent pas. Un
 * lancement depuis l'écran d'accueil ouvre une visite à chaque fois qu'on
 * rouvre l'application, un cadre en ouvre une par page du site qui le porte, un
 * onglet laissé deux heures n'en ouvre qu'une. Les mettre côte à côte à la même
 * échelle ferait lire un écart d'usage là où il n'y a qu'un écart de définition.
 * Chaque porte se lit donc dans son ordre de grandeur, avec ses trois chiffres.
 *
 * Une porte sans rien n'est pas affichée : quatre cartes dont trois à zéro
 * disent moins bien « tout est passé par le navigateur » qu'une carte seule.
 */
function portes(hote, liste) {
  const compte = (p) => p.visites || p.visiteurs || p.fiches;
  /* L'ordre est celui du vocabulaire, non celui des volumes, alors que la base
     rend la porte la plus fréquentée d'abord. Deux raisons : des cartes qui
     changent de place d'une période à l'autre se relisent à chaque fois, et
     « non précisé » — l'historique d'avant cette mesure — passerait devant les
     vraies portes tant qu'il pèse plus lourd qu'elles. Il vient donc en
     dernier, où on le lit pour ce qu'il est. */
  const vues = SUPPORTS
    .map(([cle]) => (liste || []).find((p) => p.support === cle))
    .filter((p) => p && compte(p));
  // une porte que cette page ne connaît pas — ajoutée depuis — vaut mieux
  // affichée sous son nom brut que passée sous silence
  (liste || []).forEach((p) => {
    if (compte(p) && !SUPPORTS.some((x) => x[0] === p.support)) vues.push(p);
  });
  if (!vues.length) return;
  /* La porte la plus fréquentée prend l'accent, et « non précisé » n'y a pas
     droit : ce n'est pas une porte, c'est ce qu'on ne savait pas encore. */
  const phare = vues.reduce((a, p) =>
    p.support && (!a || p.visites > a.visites) ? p : a, null);
  const box = document.createElement("div");
  box.className = "chiffres";
  vues.forEach((p) => {
    const su = SUPPORTS.find((x) => x[0] === p.support);
    const s = [];
    s.push(nb(p.visiteurs) + " visiteur" + (p.visiteurs > 1 ? "s" : ""));
    if (p.volatils) s.push("dont " + nb(p.volatils) + " au stockage refusé");
    s.push(nb(p.fiches) + " fiche" + (p.fiches > 1 ? "s" : "") + " ouverte" +
      (p.fiches > 1 ? "s" : ""));
    chiffre(box, p.visites, (su ? su[1] : p.support) + " · visites",
      s.join(" · "), vues.length > 1 && p === phare);
  });
  hote.appendChild(box);
  // la phrase de chaque porte vient sous les cartes : la carte porte le
  // chiffre, la légende porte ce qu'il désigne
  const l = document.createElement("div");
  l.className = "legende";
  vues.forEach((p) => {
    const su = SUPPORTS.find((x) => x[0] === p.support);
    if (!su) return;
    const d = document.createElement("p");
    d.className = "astuce";
    d.textContent = su[1] + " — " + su[2];
    l.appendChild(d);
  });
  // une porte inconnue n'a pas de phrase : la légende peut rester vide
  if (l.children.length) hote.appendChild(l);
}

/** Les jours, en bâtons. Un salon dure trois jours : le pic se voit d'un œil. */
function jours(hote, liste) {
  if (!liste.length) return;
  const max = Math.max(1, ...liste.map((j) => j.visites));
  const box = document.createElement("div");
  box.className = "jours";
  liste.forEach((j) => {
    const d = document.createElement("div");
    d.className = "jour-bat";
    d.innerHTML = '<span class="b"></span><span class="d"></span>';
    d.querySelector(".b").style.height = Math.max(2, j.visites / max * 100) + "%";
    // « 14/03 » suffit : l'année est celle de la période demandée
    const [an, mois, jour] = String(j.j).split("-");
    d.querySelector(".d").textContent = jour + "/" + mois;
    d.title = jour + "/" + mois + "/" + an + " · " + nb(j.visites) + " visite" +
      (j.visites > 1 ? "s" : "") + ", " + nb(j.visiteurs) + " visiteur" +
      (j.visiteurs > 1 ? "s" : "");
    box.appendChild(d);
  });
  hote.appendChild(box);
}

function dessineRapport() {
  const f = $("rapport");
  f.innerHTML = "";
  if (!SESSION) { f.innerHTML = '<div class="vide">Connectez-vous pour lire le rapport.</div>'; return; }
  if (!EVTS.length) {
    f.innerHTML = '<div class="vide">Aucun événement.<br>Créez-en un depuis la console.</div>';
    return;
  }
  const e = courant();
  const r = RAPPORT;
  if (!e || !r) { f.innerHTML = '<div class="vide">Chargement…</div>'; return; }

  const entete = document.createElement("div");
  entete.className = "entete";
  entete.innerHTML = '<div><span class="eyebrow">Utilisation</span><h2></h2>' +
    '<span class="etat ' + e.etat + '">' +
    (e.etat === "publie" ? "Publié" : "Brouillon") + '</span></div>' +
    '<div class="droite"><a class="btn petit" id="lienPublic" target="_blank" rel="noopener">Voir le plan</a></div>';
  entete.querySelector("h2").textContent = e.nom;
  f.appendChild(entete);
  $("lienPublic").href = BASE_PAGES + "plan?plan=" + encodeURIComponent(e.slug || "");

  /* Rien à montrer se dit de deux façons, et ce n'est pas la même nouvelle :
     la mesure n'a jamais rien reçu, ou la période choisie est vide. */
  if (!r.depuis) {
    const v = document.createElement("div");
    v.className = "vide";
    v.innerHTML = "Aucune mesure pour cet événement.<br>" +
      (e.etat === "publie"
        ? "Les visites sont comptées dès la première ouverture du plan public."
        : "L'événement est en brouillon : son plan n'est pas encore servi aux visiteurs.");
    f.appendChild(v);
    return;
  }

  const b1 = bloc("Fréquentation");
  const g1 = document.createElement("div");
  g1.className = "chiffres";
  chiffre(g1, r.visites, "Visites",
    "Une ouverture du plan. Revenir plus tard en fait une seconde.", true);
  /* Les jetons volatils viennent à côté du chiffre, jamais en déduction : ces
     visiteurs ont bien ouvert le plan, on sait seulement qu'ils y sont peut-être
     comptés plusieurs fois. Le rapport signale ce qu'il ne peut pas corriger. */
  /* Les jetons ne se gardent que quatre cents jours, puis la base les efface
     (`purge_presences`) : les visites d'avant restent comptées, leurs visiteurs
     non. Sur une période qui remonte plus loin, le chiffre est donc partiel, et
     le rapport le dit plutôt que de laisser lire une audience en chute. */
  const horizon = new Date(Date.now() - JETONS_GARDES_JOURS * 864e5);
  const debut = periode === "tout" ? new Date(r.depuis)
    : new Date(Date.now() - Number(periode) * 864e5);
  chiffre(g1, r.visiteurs, "Visiteurs uniques",
    "Navigateurs distincts sur la période." +
    (r.visiteurs_volatils
      ? " Dont " + nb(r.visiteurs_volatils) +
        " au stockage refusé, recomptés à chaque ouverture."
      : "") +
    (debut < horizon
      ? " Jetons effacés au bout de " + JETONS_GARDES_JOURS +
        " jours : les visiteurs plus anciens n'y sont plus."
      : ""), true);
  chiffre(g1, r.recherches, "Recherches", "Mots-clés saisis, doublons écartés.");
  chiffre(g1, r.itineraires, "Itinéraires calculés", "Trajets distincts demandés.");
  chiffre(g1, r.parcours, "Programmes de visite",
    nb(r.parcours_gestes) + " ajout" + (r.parcours_gestes > 1 ? "s" : "") +
    " ou retrait" + (r.parcours_gestes > 1 ? "s" : "") + " au total.");
  /* Le partage se lit en deux temps, et le second est le seul qui tranche : un
     parcours envoyé que personne n'ouvre n'a rien changé au salon. D'où le
     nombre d'étapes reprises en sous-titre, plutôt qu'un envoi seul. */
  chiffre(g1, r.partages, "Parcours partagés",
    r.partages_repris
      ? nb(r.partages_repris) + " étape" + (r.partages_repris > 1 ? "s" : "") +
        " reprise" + (r.partages_repris > 1 ? "s" : "") + " par ceux qui les ont reçus."
      : "Aucune étape reprise pour l'instant.");
  b1.appendChild(g1);
  f.appendChild(b1);

  const b2 = bloc("Par moyen d'accès");
  portes(b2, r.supports);
  const a2 = document.createElement("p");
  a2.className = "astuce";
  a2.style.marginTop = "12px";
  /* Deux mises en garde dès qu'il y a plusieurs portes, et les deux sont des
     propriétés du comptage, non des approximations : une visite ne veut pas dire
     la même chose d'une porte à l'autre, et deux portes ne partagent aucun jeton
     de visiteur. Sans elles, un organisateur additionne les cartes, tombe sur
     plus que le total affiché plus haut, et conclut que le rapport se trompe.

     Une seule porte se dit en une ligne — mais pas la même selon qu'on sache
     laquelle : « non précisé » n'est pas une porte, c'est un salon mesuré avant
     qu'on ne compte les portes, et le lui faire dire serait un contresens. */
  const portesVues = (r.supports || []).filter((x) => x.support);
  a2.textContent = (r.supports || []).length > 1
    ? "Les visites ne se comparent pas d'une porte à l'autre : rouvrir une " +
      "application en ouvre une à chaque fois, un cadre en ouvre une par page " +
      "du site qui le porte. Et la somme des visiteurs dépasse le total " +
      "ci-dessus — un navigateur, une application et un cadre posé sur un site " +
      "tiers ne partagent aucun jeton, le même visiteur y compte une fois par " +
      "porte et une seule au total."
    : portesVues.length
      ? "Tout est passé par la même porte sur cette période."
      : "La porte d'accès n'était pas encore comptée sur cette période.";
  b2.appendChild(a2);
  f.appendChild(b2);

  const b3 = bloc("Fiches exposants ouvertes");
  const g3 = document.createElement("div");
  g3.className = "chiffres seul";
  chiffre(g3, r.stands.total, "Ouvertures", "Toutes provenances confondues.", true);
  b3.appendChild(g3);
  const t3 = document.createElement("p");
  t3.className = "eyebrow";
  t3.style.margin = "16px 0 10px";
  t3.textContent = "Par canal";
  b3.appendChild(t3);
  barres(b3, r.stands.canaux || {}, r.stands.total, CANAUX_STAND);
  f.appendChild(b3);

  const b4 = bloc("Fiches conférences ouvertes");
  const g4 = document.createElement("div");
  g4.className = "chiffres seul";
  chiffre(g4, r.conferences.total, "Ouvertures", "Toutes provenances confondues.", true);
  b4.appendChild(g4);
  const t4 = document.createElement("p");
  t4.className = "eyebrow";
  t4.style.margin = "16px 0 10px";
  t4.textContent = "Par canal";
  b4.appendChild(t4);
  barres(b4, r.conferences.canaux || {}, r.conferences.total, CANAUX_CONF);
  const a4 = document.createElement("p");
  a4.className = "astuce";
  a4.style.marginTop = "12px";
  a4.textContent = "Une conférence s'ouvre depuis le programme de la salle qui " +
    "l'accueille, depuis la fiche de l'exposant qui la tient, ou depuis le " +
    "programme de visite. Elle n'a ni recherche ni forme propre sur le plan.";
  b4.appendChild(a4);
  f.appendChild(b4);

  const b5 = bloc("Jour par jour");
  jours(b5, r.jours || []);
  const a5 = document.createElement("p");
  a5.className = "astuce";
  a5.style.marginTop = "10px";
  /* La date d'ouverture se lit dans le fuseau du salon, comme les bâtons :
     les deux dans le fuseau du lecteur ne se recouperaient pas. */
  a5.textContent = "Visites par jour, dans le fuseau du salon (" + (r.fuseau || "UTC") +
    "). Mesure ouverte depuis le " +
    new Date(r.depuis).toLocaleDateString("fr-FR",
      { dateStyle: "long", timeZone: r.fuseau || "UTC" }) + ".";
  b5.appendChild(a5);
  f.appendChild(b5);
}

function dessineBarre() {
  const s = $("choixEvt");
  s.innerHTML = EVTS.map((e) =>
    '<option value="' + esc(e.id) + '"' + (e.id === selection ? " selected" : "") +
    '>' + esc(e.nom) + (e.etat === "publie" ? "" : " · brouillon") + '</option>').join("");
  s.hidden = !EVTS.length;
  /* Le retour à la console rapporte le salon qu'on lisait : elle le rouvre au
     lieu de retomber sur le premier de la liste. */
  const e = EVTS.find((x) => x.id === selection);
  $("lienConsole").href = "admin-plans" + (e?.slug ? "?plan=" + encodeURIComponent(e.slug) : "");
  const p = $("choixPeriode");
  if (!p.options.length) {
    p.innerHTML = PERIODES.map((x) =>
      '<option value="' + x[0] + '">' + x[1] + '</option>').join("");
  }
  p.value = periode;
  $("btnExcel").disabled = !(SESSION && selection);
}

/* ------------------------------------------------------------------
   Chargement et démarrage
   ------------------------------------------------------------------ */
let _occupe = false;
async function rafraichit() {
  if (_occupe) return;
  _occupe = true;
  $("btnRecharger").disabled = true;
  try {
    await chargeRapport();
    signale("");
  } catch (e) {
    RAPPORT = null;
    signale(e.message, true);
  } finally {
    _occupe = false;
    $("btnRecharger").disabled = false;
    dessineBarre();
    dessineRapport();
  }
}

/** Fin de session : la console vide sa liste, le rapport vide ses chiffres. */
function videEcran() {
  EVTS = []; RAPPORT = null; selection = null;
  dessineBarre();
  dessineRapport();
}

$("choixEvt").onchange = (e) => {
  selection = e.target.value;
  try { localStorage.setItem(CLE_EVT, selection); } catch (err) {}
  rafraichit();
};
$("choixPeriode").onchange = (e) => { periode = e.target.value; rafraichit(); };
$("btnRecharger").onclick = () => rafraichit();
// ici l'export suit la période affichée ; dans la console, il prend tout
$("btnExcel").onclick = (ev) => exporteExposants(ev.currentTarget, joursPeriode());

async function demarre() {
  try {
    await chargeEvenements();
    dessineBarre();
    await rafraichit();
  } catch (e) {
    $("rapport").innerHTML = '<div class="vide"></div>';
    $("rapport").querySelector(".vide").textContent = "Chargement impossible : " + e.message;
  }
}

if (!CFG) ecranConfig();
else if (!SESSION) ecranConnexion();
else demarre();
</script>
