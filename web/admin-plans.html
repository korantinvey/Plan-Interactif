 * lire — tant qu'une synchronisation a eu lieu, faute de quoi rien n'a encore
 * été lu et la forme reprend ses droits.
 */
function valeurApercu(bloc, cle) {
  /* La cible porte le nom de la clé, pour un champ propre au salon comme pour
     les autres. */
  const ligne = LIGNES_FICHE.stand.find((l) => l.cle === cle);
  const duPlan = cle.indexOf(PREFIXE_PERSO) !== 0 && !(ligne && ligne.cible);
  if (duPlan) return { valeur: EXEMPLES_FICHE[cle] || "", faute: "sans valeur" };

  let brut = exempleCible(bloc, cle);
  // le code postal rejoint l'adresse sur la même ligne, comme sur une enveloppe
  if (cle === "adresse") {
    brut = [brut, exempleCible(bloc, "codePostal")].filter(Boolean).join(" ");
  }
  if (brut) return { valeur: brut, faute: "" };
  if ((bloc.champs || {})[cle] === "") {
    return { valeur: "", faute: "aucun champ associé" };
  }
  return bloc.detecteLe
    ? { valeur: "", faute: "vide sur les fiches lues" }
    : { valeur: EXEMPLES_FICHE[cle] || "", faute: "pas encore synchronisé" };
}

/**
 * La fiche telle que le visiteur la recevra.
 *
 * Le balisage reprend celui du plan — même en-tête, mêmes champs, même
 * `eyebrow` sur les intitulés — parce qu'un aperçu qui ne ressemble pas à ce
 * qu'il annonce ne sert qu'à se rassurer.
 */
function dessineApercu(hote, e, src, cles) {
  const bloc = correspondance(e, src);
  const regle = (e.fiche || {}).stand || {};
  const parait = (cle) => regle[cle] !== false;
  hote.textContent = "";

  const tete = document.createElement("div");
  tete.className = "af-hd";
  const nom = exempleCible(bloc, "nom") || EXEMPLES_FICHE.nom;
  tete.innerHTML = '<div class="af-bads"><span class="af-bad mono"></span>' +
    '<span class="af-bad neuf">Nouveau</span></div>' +
    '<h4></h4><p class="af-code"></p>';
  tete.querySelector(".af-bad").textContent = "Stand";
  // la pastille ne paraît que là où le salon distingue ses nouveaux venus
  tete.querySelector(".neuf").hidden = !parait("nouveau") ||
    !champsLus(bloc, "nouveau").length;
  tete.querySelector("h4").textContent = nom;
  tete.querySelector(".af-code").textContent = "Pavillon 1" +
    (parait("code") ? " · " + EXEMPLES_FICHE.code : "");
  hote.appendChild(tete);

  const corps = document.createElement("div");
  corps.className = "af-bd";
  cles.forEach((cle) => {
    if (!parait(cle)) return;
    const { valeur, faute } = valeurApercu(bloc, cle);
    const f = document.createElement("div");
    f.className = "af-champ";
    f.innerHTML = '<span class="eyebrow"></span><span class="v"></span>';
    const l = LIGNES_FICHE.stand.find((x) => x.cle === cle);
    f.querySelector(".eyebrow").textContent = (l && l.surFiche) || libelleCorps(e, cle);
    const v = f.querySelector(".v");
    if (!valeur) {
      /* Rien à montrer : le dire plutôt que de sauter la ligne, sans quoi on
         croirait le champ retiré de la fiche. */
      v.className = "v af-vide";
      v.textContent = faute;
    } else {
      /* Le point-virgule sépare les valeurs d'un champ à choix : la fiche les
         montre l'une sous l'autre, l'aperçu aussi. */
      const l = separeValeurs(valeur);
      l.forEach((x) => {
        const s = document.createElement("span");
        s.className = "ligne";
        s.textContent = x;
        v.appendChild(s);
      });
    }
    corps.appendChild(f);
  });
  if (!corps.children.length) {
    const p = document.createElement("p");
    p.className = "af-vide";
    p.textContent = "Aucun champ affiché : la fiche se réduira à son en-tête.";
    corps.appendChild(p);
  }
  hote.appendChild(corps);
}

/**
 * Le panneau de l'ordre d'affichage.
 *
 * Deux façons de déplacer un champ, et il en faut deux : la poignée, qu'on
 * attrape pour traverser la liste d'un geste, et les flèches, qui restent le
 * seul chemin au clavier — et le seul au doigt, le glisser-déposer du
 * navigateur ignorant le tactile.
 *
 * La liste se redessine sur place plutôt que de rouvrir la fenêtre : remonter
 * un champ de six rangs demande six clics, et rouvrir à chacun d'eux
 * ramènerait l'onglet en tête et la fenêtre en haut. Le bouton qu'on vient
 * d'actionner reprend le focus, pour que le clic suivant tombe au même
 * endroit.
 */
function panneauOrdre(e, src) {
  const hote = document.createElement("div");
  let ordre = ordreEffectif(e, clesCorps(e, src));

  const aide = document.createElement("p");
  aide.className = "aide";
  aide.textContent = "L'ordre dans lequel la fiche déroule ses champs, de haut " +
    "en bas : ce que le visiteur vient lire en premier n'est pas le même d'un " +
    "salon à l'autre. Attrapez une ligne par sa poignée, ou servez-vous des " +
    "flèches. L'en-tête — l'enseigne, le pavillon, le numéro de stand — et le " +
    "volet des conférences n'en font pas partie : ils ne se déplacent pas.";
  hote.appendChild(aide);

  const deux = document.createElement("div");
  deux.className = "ordre-deux";
  hote.appendChild(deux);

  const liste = document.createElement("div");
  liste.className = "ordre-liste";
  deux.appendChild(liste);

  /* L'aperçu se colle en haut : la liste est plus longue que lui, et le
     laisser défiler reviendrait à ranger des champs sans plus rien voir de ce
     qu'on range. */
  const cadre = document.createElement("div");
  cadre.className = "apercu-cadre";
  cadre.innerHTML = '<span class="eyebrow">Aperçu</span>' +
    '<div class="apercu-fiche"></div><p class="aide"></p>';
  /* L'habillage de la fiche — onze modèles — se choisit plan par plan, dans le
     panneau d'apparence du plan lui-même : la console n'en a ni le réglage ni
     la feuille de style. L'aperçu montre donc l'ordre, pas le modèle, et le
     dit plutôt que de laisser croire que le salon aura celui-ci. */
  cadre.querySelector("p").textContent = "Les valeurs viennent du relevé de la " +
    "dernière synchronisation. Sur téléphone, les champs qui tiennent en un " +
    "mot se rangent deux par deux. Le modèle de fiche, lui, se choisit depuis " +
    "le plan — engrenage, « Apparence » — où ses vignettes reprennent ces " +
    "champs dans cet ordre.";
  const apercu = cadre.querySelector(".apercu-fiche");
  deux.appendChild(cadre);

  /** Enregistre l'ordre courant, et reprend ce qui l'est vraiment si on refuse. */
  const enregistre = async (focus) => {
    await ecritFiche(e, { ordre: ordre.slice() });
    ordre = ordreEffectif(e, clesCorps(e, src));
    rendu(focus);
  };

  /* Le rang se relit dans la liste plutôt que de venir du dessin : un glissé
     l'a peut-être changé depuis, et l'enregistrement qui suit n'a pas encore
     rendu la main. */
  const deplace = (cle, pas) => {
    const i = ordre.indexOf(cle);
    if (i < 0 || i + pas < 0 || i + pas >= ordre.length) return;
    ordre = ordre.slice();
    ordre.splice(i + pas, 0, ordre.splice(i, 1)[0]);
    const focus = { cle, sens: pas < 0 ? 0 : 1 };
    rendu(focus);
    enregistre(focus);
  };

  /* Le rang est écrit sur chaque ligne : pendant le glissé il change à chaque
     ligne franchie, et le laisser mentir jusqu'au lâcher ferait douter de ce
     qu'on est en train de faire. Les flèches de bout de liste suivent, sans
     quoi la première garderait un « monter » actif au milieu de la liste. */
  const renumerote = () => {
    const n = liste.children.length;
    [...liste.children].forEach((d, i) => {
      d.querySelector(".rang").textContent = String(i + 1);
      const b = d.querySelectorAll("button");
      b[0].disabled = i === 0;
      b[1].disabled = i === n - 1;
    });
    // l'aperçu suit le glissé plutôt que d'attendre le lâcher : c'est lui
    // qu'on regarde en déplaçant, pas la liste
    dessineApercu(apercu, e, src, [...liste.children].map((d) => d.dataset.cle));
  };

  /**
   * La ligne devant laquelle déposer, d'après la hauteur du pointeur.
   *
   * On compare au milieu de chaque ligne, et non à son bord : le bord ferait
   * basculer l'insertion dès qu'on l'effleure, et la liste tremblerait sous le
   * curseur au lieu de suivre. « null » veut dire la fin de la liste.
   */
  const voisinApres = (y) => [...liste.querySelectorAll(".ordre-ligne:not(.tire)")]
    .find((d) => {
      const r = d.getBoundingClientRect();
      return y < r.top + r.height / 2;
    }) || null;

  liste.addEventListener("dragover", (ev) => {
    const tire = liste.querySelector(".tire");
    if (!tire) return;
    // sans quoi le navigateur refuse le dépôt et rejoue l'animation de retour
    ev.preventDefault();
    const apres = voisinApres(ev.clientY);
    if (apres === tire.nextSibling || apres === tire) return;
    liste.insertBefore(tire, apres);
    renumerote();
  });

  const rendu = (focus) => {
    liste.textContent = "";
    ordre.forEach((cle, i) => {
      const d = document.createElement("div");
      d.className = "ordre-ligne";
      d.dataset.cle = cle;
      d.draggable = true;
      d.innerHTML = '<span class="poignee" aria-hidden="true">⠿</span>' +
        '<span class="rang"></span><span class="lib"></span>' +
        '<span class="etiq"></span>' +
        '<button type="button" class="outil">▲</button>' +
        '<button type="button" class="outil">▼</button>';
      d.querySelector(".rang").textContent = String(i + 1);
      const libelle = libelleCorps(e, cle);
      d.querySelector(".lib").textContent = libelle;
      /* Deux champs peuvent porter le même intitulé — un salon qui s'ajoute sa
         « Ville » à côté de celle de la fiche société — et rien d'autre ici ne
         les distinguerait. */
      if (cle.indexOf(PREFIXE_PERSO) === 0) {
        d.querySelector(".etiq").textContent = "propre au salon";
      }
      /* Un champ masqué garde sa place : le remonter aujourd'hui pour
         l'afficher demain doit rester possible, et le retirer d'ici ferait
         sauter un rang sans qu'on sache lequel ni pourquoi. */
      if (((e.fiche || {}).stand || {})[cle] === false) {
        d.classList.add("source-inerte");
        d.title = "Masqué : ce champ ne paraît pas sur la fiche.";
      }
      const b = d.querySelectorAll("button");
      // l'état des deux flèches en bout de liste est posé par « renumerote »
      [["Monter", -1], ["Descendre", 1]].forEach(([titre, pas], n) => {
        b[n].title = titre;
        b[n].setAttribute("aria-label", titre + " " + libelle);
        b[n].onclick = () => deplace(cle, pas);
      });

      d.ondragstart = (ev) => {
        /* Firefox n'ouvre pas de glissé sans donnée transportée, et le texte
           déposé ailleurs vaut mieux que la clé technique. */
        ev.dataTransfer.setData("text/plain", libelle);
        ev.dataTransfer.effectAllowed = "move";
        // la classe se pose au tour suivant : posée tout de suite, elle
        // entrerait dans l'image que le navigateur vient de prendre de la ligne
        setTimeout(() => d.classList.add("tire"), 0);
      };
      d.ondragend = () => {
        d.classList.remove("tire");
        const suite = [...liste.children].map((x) => x.dataset.cle);
        // un glissé qui n'a rien déplacé n'a rien à enregistrer
        if (suite.join("|") === ordre.join("|")) return;
        ordre = suite;
        enregistre();
      };
      liste.appendChild(d);
    });
    renumerote();

    if (focus) {
      const b = liste.querySelector('.ordre-ligne[data-cle="' + focus.cle +
        '"] button:nth-of-type(' + (focus.sens + 1) + ')');
      if (b && !b.disabled) b.focus();
    }
  };

  /* On revient ici après avoir coché ou décoché dans l'onglet Stand : l'aperçu
     doit s'en apercevoir, sans quoi il montrerait un champ qu'on vient de
     retirer. */
  hote.rafraichit = () => {
    ordre = ordreEffectif(e, clesCorps(e, src));
    rendu();
  };

  rendu();
  return hote;
}

/**
 * Une ligne du bloc « Données » : ce dont il s'agit, ce que cela vaut, et de
 * quoi le changer. Les trois colonnes sont les mêmes d'une ligne à l'autre —
 * c'est cet alignement qui fait retrouver la ligne qu'on cherche.
 */
function ligneOutil(titre, valeur, controles) {
  const d = document.createElement("div");
  d.className = "reglage-ligne";
  d.innerHTML = '<span class="rt"></span><span class="rv">' + valeur +
                '</span><span class="act"></span>';
  d.querySelector(".rt").textContent = titre;
  const a = d.querySelector(".act");
  controles.forEach((c) => a.appendChild(c));
  return d;
}

/**
 * Une ligne dont le détail s'ouvre en fenêtre : quatre listes déroulantes et
 * neuf cases à cocher rendaient la fiche illisible alors qu'on n'y touche
 * qu'une fois par salon. Ici, seul le résumé reste.
 */
function ligneReglage(titre, resume, ouvre) {
  const b = document.createElement("button");
  b.className = "btn petit";
  b.textContent = "Modifier";
  const d = ligneOutil(titre, "", [b]);
  const v = d.querySelector(".rv");
  const maj = () => { v.textContent = resume(); };
  maj();
  b.onclick = () => ouvre(maj);
  return d;
}

function ouvreProvenance(apres) {
  ouvreModale("Provenance des données", (corps) => {
    const e = courant();
    const g = grille();
    DOMAINES.forEach(([dom, lib, offerts, aide]) => {
      const l = ligneSource(dom, lib, offerts, aide);
      if (source(e, dom) === "aucun") l.classList.add("source-inerte");
      g.appendChild(l);
    });
    corps.appendChild(g);
    const note = document.createElement("p");
    note.className = "aide";
    note.textContent = "Les identifiants d'événement se saisissent dans " +
      "« Sources de données », au menu Actions de la fiche.";
    corps.appendChild(note);
  }, [{ libelle: "Terminé", genre: "primaire" }], apres);
}

/**
 * Fenêtre des raccordements, un onglet par fournisseur. Chaque onglet dit
 * aussi ce qu'il alimente : un identifiant saisi sans qu'aucun domaine ne
 * s'en serve ne produirait rien, et c'est le genre d'oubli qu'on ne voit pas.
 */
function ouvreSources(apres) {
  ouvreModale("Sources de données", (corps) => {
    const e = courant();
    const barre = document.createElement("div");
    barre.className = "onglets";
    const boutons = [], panneaux = [];

    FOURNISSEURS_CONF.forEach((f, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = f.nom;
      b.setAttribute("aria-pressed", String(i === 0));
      barre.appendChild(b);
      boutons.push(b);

      const pan = document.createElement("div");
      pan.hidden = i > 0;
      const g = grille();
      f.champs.forEach((c) => {
        g.appendChild(c.dansCles
          ? champCle(c.dansCles, c.libelle, c.aide, c.forme, c.exemple)
          : champ(c.colonne, c.libelle, c.aide, 'spellcheck="false"'));
      });
      pan.appendChild(g);

      const sert = DOMAINES.filter(([d]) => source(e, d) === f.cle).map(([, lib]) => lib);
      const note = document.createElement("p");
      note.className = "aide";
      note.textContent = sert.length
        ? "Alimente : " + sert.join(", ") + "."
        : "Aucun domaine n'utilise cette source pour le moment.";
      pan.appendChild(note);
      panneaux.push(pan);

      b.onclick = () => {
        boutons.forEach((x, k) => x.setAttribute("aria-pressed", String(k === i)));
        panneaux.forEach((x, k) => { x.hidden = k !== i; });
      };
    });

    corps.appendChild(barre);
    panneaux.forEach((x) => corps.appendChild(x));
  }, [{ libelle: "Terminé", genre: "primaire" }], apres);
}

/**
 * Salles de conférence et zones organisateur.
 *
 * Une salle Eventmaker s'appelle « Agora (P160) ». Le code entre parenthèses
 * est un emplacement du plan, et la synchronisation retrouve la zone qui le
 * contient — dix fois sur onze. Le reste se désigne ici, à la main : un code
 * absent du plan ne se devine pas.
 *
 * Un rattachement manuel est marqué comme tel et n'est plus jamais écrasé par
 * la synchronisation, qui continue pourtant de proposer ce qu'elle trouve.
 */
async function ouvreSalles(apres) {
  const e = courant();
  const salles = JSON.parse(JSON.stringify(e.salles || {}));
  const ids = Object.keys(salles);

  // les zones du plan, pour les proposer au choix
  let zones = [];
  try {
    const pl = await rest("plan?select=id&evenement_id=eq." + e.id);
    if (pl.length) {
      const inst = await rest("instantane?select=charge&plan_id=in.(" +
        pl.map((x) => x.id).join(",") + ")");
      /* Les noms saisis à la main vivent sur l'événement, pas dans
         l'instantané : ils s'appliquent à la lecture — c'est ce que fait
         plan-public pour le visiteur. Sans cela, une zone fraîchement
         baptisée depuis le plan se proposerait encore « Zone sans nom »,
         et le rattachement se choisirait à l'aveugle. On relit la colonne
         plutôt que de se fier à la liste chargée au démarrage : le
         renommage a pu survenir depuis, depuis un autre poste. */
      let noms = e.zones || {};
      try {
        const frais = await rest("evenement?select=zones&id=eq." + e.id);
        if (frais.length) { noms = frais[0].zones || {}; e.zones = noms; }
      } catch (err) { /* la liste chargée fera l'affaire */ }
      zones = inst.flatMap((i) => (i.charge?.zones || [])
        .map((z) => ({ id: z.id, nom: noms[z.id] || z.nom })));
    }
  } catch (err) { signale(err.message, true); }
  const parZone = Object.fromEntries(zones.map((z) => [z.id, z]));
  const nomZone = (id) => {
    const z = parZone[id];
    if (!z) return id ? id + " (absente du plan)" : "";
    /* La surface de la zone ne distingue rien qu'un nom ne dise mieux, et
       n'intéresse pas plus ici qu'ailleurs : la zone se nomme, un point. */
    return z.nom || "Zone sans nom";
  };

  ouvreModale("Salles de conférence", (corps) => {
    if (!ids.length) {
      const p = document.createElement("p");
      p.textContent = "Aucune salle connue. Synchronisez l'événement avec " +
        "Conférences réglé sur Eventmaker.";
      corps.appendChild(p);
      return;
    }

    const t = document.createElement("table");
    t.className = "salles";
    t.innerHTML = "<thead><tr><th>Salle</th><th>Code</th><th>Zone organisateur</th></tr></thead>";
    const corpsT = document.createElement("tbody");

    ids.sort((a, b) => String(salles[a].nom || "").localeCompare(String(salles[b].nom || ""), "fr"))
      .forEach((id) => {
        const s = salles[id];
        const tr = document.createElement("tr");
        tr.innerHTML = "<td class=\"n\"></td><td class=\"c\"></td><td></td>";
        tr.querySelector(".n").textContent = s.nom || id;
        tr.querySelector(".c").textContent = s.code || "—";

        const sel = document.createElement("select");
        sel.innerHTML = '<option value="">— non située —</option>' +
          zones.map((z) => '<option value="' + z.id + '">' + esc(nomZone(z.id)) + '</option>').join("");
        sel.value = s.zone || "";
        tr.lastElementChild.appendChild(sel);

        const etat = document.createElement("span");
        etat.className = "etat-salle";
        const dis = () => {
          etat.textContent = !s.zone
            ? (s.auto ? "proposition ignorée" : "à situer")
            : s.manuel ? "choisi à la main"
            : "trouvé automatiquement";
          etat.dataset.genre = !s.zone ? "manque" : s.manuel ? "manuel" : "auto";
          tr.dataset.etat = etat.dataset.genre;
        };
        dis();
        tr.lastElementChild.appendChild(etat);

        sel.onchange = () => {
          s.zone = sel.value || null;
          // ne redevient automatique que si l'on retrouve exactement la
          // proposition de la synchronisation
          s.manuel = Boolean(s.zone) && s.zone !== s.auto;
          dis();
        };
        corpsT.appendChild(tr);
      });

    t.appendChild(corpsT);
    corps.appendChild(t);

    const note = document.createElement("p");
    note.className = "aide";
    const situees = ids.filter((i) => salles[i].zone).length;
    note.textContent = situees + " salle" + (situees > 1 ? "s" : "") + " sur " + ids.length +
      " située" + (situees > 1 ? "s" : "") + ". Un rattachement choisi à la main " +
      "n'est plus modifié par les synchronisations suivantes.";
    corps.appendChild(note);
  }, [
    { libelle: "Annuler" },
    { libelle: "Enregistrer", genre: "primaire", action: () => {
      majEvenement(e.id, { salles })
        .then(() => { e.salles = salles; signale("Rattachements enregistrés."); })
        .catch((err) => signale(err.message, true));
    } },
  ], apres);
}

/**
 * Un cadre de la fenêtre : ce dont il parle, et de qui cela vient.
 *
 * L'en-tête nomme le fournisseur plutôt que de le laisser deviner : c'est la
 * question qu'on se pose devant une ligne mal réglée — « ce champ, je le
 * cherche chez qui ? »
 */
function cadreFiche(def, contenus) {
  const e = courant();
  const src = source(e, def.domaine);
  const d = document.createElement("div");
  d.className = "cadre";
  d.innerHTML = '<div class="cadre-hd"><span class="eyebrow"></span>' +
                '<span class="prov"></span></div>' +
                '<p class="aide"></p>';
  d.querySelector(".eyebrow").textContent = def.titre;
  const prov = d.querySelector(".prov");
  prov.textContent = FOURNISSEURS[src] || src;
  prov.dataset.src = src;
  if (def.aide) d.querySelector(".aide").textContent = def.aide;
  else d.querySelector(".aide").remove();
  contenus.filter(Boolean).forEach((c) => d.appendChild(c));
  return d;
}

/**
 * Fenêtre de la fiche détail : ce qu'elle montre, et ce qui l'alimente.
 *
 * Deux onglets, parce que les deux types n'ont presque rien en commun : un
 * stand tire son contenu d'une fiche d'exposant, une zone organisateur n'a que
 * son programme. Côte à côte, les deux listes se lisaient comme une seule.
 *
 * Sur la ligne, la case et la liste déroulante vont ensemble : décider qu'un
 * champ paraît et décider d'où il vient sont la même question, posée deux fois
 * si on les sépare. Décocher retire la liste sans effacer le réglage.
 */
function ouvreFiche(apres) {
  const e = courant();
  const src = source(e, "stands");
  const bloc = correspondance(e, src);
  const mappable = src !== "aucun";

  /* Une ligne réservée à un autre fournisseur n'a rien à faire ici : le champ
     qu'elle propose n'existe pas de ce côté, et la case masquerait un champ
     que la fiche n'affiche de toute façon pas. */
  const lignes = (type) => LIGNES_FICHE[type].filter((l) => !l.source || l.source === src);

  ouvreModale("Fiche détail", (corps) => {
    const barre = document.createElement("div");
    barre.className = "onglets";
    const boutons = [], panneaux = [];

    /* Un onglet de la fenêtre : son bouton, son panneau, et la bascule qui les
       relie. Les trois ne se remplissent pas de la même façon — l'un d'eux
       s'arrête plus tôt — d'où la fabrique à part. */
    const ongletFiche = (titre) => {
      const i = boutons.length;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = titre;
      b.setAttribute("aria-pressed", String(i === 0));
      b.onclick = () => {
        boutons.forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
        panneaux.forEach((x, j) => { x.hidden = j !== i; });
        /* Un panneau qui dépend des autres se refait en reparaissant : l'aperçu
           de l'ordre montre les champs cochés dans l'onglet Stand, qui ont pu
           changer pendant qu'il était caché. */
        const pan = panneaux[i].firstChild;
        if (pan && pan.rafraichit) pan.rafraichit();
      };
      barre.appendChild(b);
      boutons.push(b);
      const pan = document.createElement("div");
      pan.hidden = i > 0;
      panneaux.push(pan);
      return pan;
    };

    [["stand", "Stand"], ["zone", "Zone organisateur"]].forEach(([type, titre]) => {
      const pan = ongletFiche(titre);

      /* Une zone n'a pas de fiche d'exposant derrière elle : rien à associer,
         donc pas de tableau — la liste de cases suffit, et c'est celle que la
         fenêtre montrait déjà. */
      if (type === "zone" || !mappable) {
        const cases = document.createElement("div");
        cases.className = "colonne-cases";
        const inertes = FICHE_INERTE[type] || [];
        lignes(type).filter((l) => l.cle).forEach((l) => {
          const c = caseFiche(type, l.cle, l.libelle, l.aide);
          if (inertes.indexOf(l.cle) >= 0) c.classList.add("source-inerte");
          cases.appendChild(c);
        });
        if (type === "zone") {
          pan.appendChild(cadreFiche(
            { titre: "La zone organisateur", domaine: "conferences",
              aide: "Une zone n'a pas de fiche d'exposant : son programme est " +
                "tout ce qu'elle montre." },
            [cases]));
        } else {
          pan.appendChild(cases);
          const p = document.createElement("p");
          p.className = "aide";
          p.textContent = "Aucune source d'exposants : il n'y a pas de champ " +
            "d'origine à associer. Choisissez-en une dans « Provenance des données ».";
          pan.appendChild(p);
        }
        return;
      }

      CADRES_FICHE.forEach((def) => {
        const duCadre = lignes("stand").filter((l) => (l.groupe || "exposant") === def.cle);
        /* Le rattachement rejoint le cadre de l'exposant : ces champs sont lus
           sur sa fiche comme les autres, ils n'en sortent simplement rien
           d'affichable. */
        const rattachement = def.cle !== "exposant" ? null
          : (LIGNES_RATTACHEMENT[src] || []);
        pan.appendChild(cadreFiche(def, [
          tableauChamps(duCadre, type, src, true, def.cle === "exposant"),
          rattachement && rattachement.length ? sousTitre("Ce qui ne s'affiche pas") : null,
          rattachement && rattachement.length
            ? tableauChamps(rattachement, type, src, false) : null,
        ]));
      });

      /* Les champs que ce salon s'est ajoutés, dans un cadre à eux : ils ne
         viennent pas d'une liste que le code tient, et ce sont les seuls
         qu'on puisse renommer ou retirer. */
      const redessine = () => ouvreFiche(apres);
      const perso = lignesPerso(e, redessine);
      pan.appendChild(cadreFiche(
        { titre: "Champs propres à ce salon", domaine: "stands",
          aide: "Un champ que ce salon est seul à tenir. Il se règle comme les " +
            "autres — un champ d'origine, une case pour l'afficher, une case " +
            "pour en faire un critère de recherche — et n'existe que pour cet " +
            "événement. Un champ à choix multiple se sépare tout seul : la " +
            "source joint ses valeurs par un point-virgule, et chacune compte " +
            "pour elle-même." },
        [
          perso.length ? tableauChamps(perso, type, src, true, true) : null,
          (() => {
            const pied = document.createElement("div");
            pied.className = "pied-perso";
            const b = document.createElement("button");
            b.type = "button";
            b.className = "btn petit";
            b.textContent = "Ajouter un champ";
            b.onclick = () => ajouteChampPerso(redessine);
            pied.appendChild(b);
            if (!perso.length) {
              const p = document.createElement("span");
              p.className = "aide";
              p.textContent = "Aucun champ propre à ce salon pour le moment.";
              pied.appendChild(p);
            }
            return pied;
          })(),
        ]));
    });

    /* L'ordre de lecture a son onglet : il porte sur la fiche entière et non
       sur l'un de ses cadres, et le chercher au bas de quarante lignes de
       réglages revenait à ne pas le trouver. Il vient après les deux autres —
       on ne range les champs qu'une fois qu'on sait lesquels paraissent. */
    ongletFiche("Ordre d'affichage").appendChild(panneauOrdre(e, src));

    corps.appendChild(barre);
    panneaux.forEach((x) => corps.appendChild(x));

    const note = document.createElement("p");
    note.className = "aide";
    note.textContent = mappable
      ? (bloc.detecteLe
        ? "Les champs proposés viennent du relevé de la dernière " +
          "synchronisation, le " + new Date(bloc.detecteLe).toLocaleString("fr-FR",
            { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) +
          ". Un champ choisi à la main n'est plus jamais reproposé, et le " +
          "réglage prend effet à la synchronisation suivante."
        : "Les champs d'origine se relèvent à la synchronisation : lancez-en " +
          "une pour qu'ils soient proposés ici.")
      : "Le nom et le pavillon sont toujours affichés : sans eux la fiche ne " +
        "désigne plus rien.";
    corps.appendChild(note);
  }, [{ libelle: "Terminé", genre: "primaire" }], apres);
}

const sousTitre = (txt) => {
  const s = document.createElement("span");
  s.className = "eyebrow sous-titre";
  s.textContent = txt;
  return s;
};

/**
 * Le tableau d'un groupe de lignes.
 *
 * `avecCases` distingue ce que la fiche montre — une case décide de son
 * affichage — de ce qui ne s'affiche jamais mais décide du reste : le numéro
 * de stand par lequel une fiche retrouve son emplacement, l'exclusion du
 * catalogue. Les seconds n'ont rien à cocher.
 */
function tableauChamps(lignes, type, src, avecCases, avecCriteres) {
  const t = document.createElement("table");
  t.className = "champs";
  t.innerHTML = "<thead><tr>" + (avecCases ? "<th>Afficher</th>" : "") +
    "<th>Sur la fiche</th><th>Champ d'origine</th>" +
    (avecCriteres ? "<th>Critère</th>" : "") + "</tr></thead>";
  const tb = document.createElement("tbody");

  /* Une ligne peut n'avoir pas de case à elle et suivre celle d'une autre :
     le code postal tient sur la ligne de l'adresse, et disparaît avec elle.
     Elles s'inscrivent ici, et la case du chef de file les entraîne. */
  const suiveurs = {};
  const affiche = (cle) => !(((courant().fiche || {})[type] || {})[cle] === false);

  lignes.forEach((l) => {
    const tr = document.createElement("tr");
    tr.innerHTML = (avecCases ? '<td class="montre"></td>' : "") +
      '<td class="n"><span class="lib"></span><span class="aide"></span></td>' +
      '<td class="orig"></td>' + (avecCriteres ? '<td class="critere"></td>' : "");
    tr.querySelector(".lib").textContent = l.libelle;
    if (l.aide) tr.querySelector(".aide").textContent = l.aide;

    /* Renommer et retirer vivent à côté de l'intitulé : c'est de lui qu'ils
       parlent, et un champ créé à la main est le seul à en avoir. */
    (l.outils || []).forEach((o) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "outil" + (o.genre ? " " + o.genre : "");
      b.title = o.titre;
      b.setAttribute("aria-label", o.titre + " " + l.libelle);
      b.textContent = o.texte;
      b.onclick = o.action;
      // dans l'intitulé et non après lui : ils tiennent sur sa ligne
      tr.querySelector(".lib").appendChild(b);
    });

    /* Le champ d'origine d'abord : c'est lui que la case va montrer ou
       cacher, il doit donc exister avant elle. */
    const cellule = tr.querySelector("td.orig");
    let choix = null;
    if (l.cible) {
      choix = champOrigine(src, l.cible, (genre) => { tr.dataset.etat = genre; },
        l.ouiNon);
      cellule.appendChild(choix.hote);
    } else {
      const fixe = document.createElement("span");
      fixe.className = "etat-salle";
      fixe.dataset.genre = "libre";
      // le programme change de fournisseur d'un salon à l'autre : sa mention
      // se calcule, elle ne s'écrit pas
      fixe.textContent = (typeof l.fixe === "function" ? l.fixe(courant()) : l.fixe) ||
        "sans champ à régler";
      cellule.appendChild(fixe);
    }

    /* Un champ que la fiche ne montre pas n'a pas de source à choisir : la
       liste disparaît plutôt que de rester là, grisée, à occuper une ligne
       pour rien. Le réglage, lui, n'est pas effacé — il revient tel quel en
       recochant.

       Sauf s'il sert de critère de recherche : il est alors lu sans paraître,
       et cacher son origine reviendrait à en interdire le réglage. */
    let montreOn = true, critereOn = criteres(courant())[l.cle] === true;
    const bascule = (montre) => {
      if (montre !== undefined) montreOn = montre;
      const sert = montreOn || critereOn;
      tr.classList.toggle("source-inerte", !sert);
      if (!choix) return;
      choix.hote.hidden = !sert;
      // la barre de couleur dit d'où vient un champ : sans champ, elle ne dit
      // plus rien
      if (sert) choix.dis(); else delete tr.dataset.etat;
    };

    /* La case du critère ne décide pas de l'affichage mais de la recherche :
       un champ peut filtrer sans paraître sur la fiche — un code interne, une
       famille de produits — et l'inverse est vrai tout autant. */
    if (avecCriteres && l.critere && l.cle) {
      const cc = tr.querySelector(".critere");
      cc.appendChild(caseCritere(l.cle, (on) => {
        critereOn = on;
        bascule();
      }));
      /* En colonne empilée — un téléphone — les en-têtes du tableau
         disparaissent : la case dirait « oui » à une question qu'on ne lit
         plus. L'étiquette ne paraît que là. */
      const etiq = document.createElement("span");
      etiq.className = "etiq";
      etiq.textContent = "Critère de recherche";
      cc.appendChild(etiq);
    }

    if (avecCases) {
      const c = tr.querySelector(".montre");
      if (!l.cle) {
        // rien à décider ici : la case mentirait en laissant croire au choix
        const tj = document.createElement("span");
        tj.className = "etat-salle";
        tj.dataset.genre = "libre";
        tj.textContent = l.montre || "toujours";
        c.appendChild(tj);
        if (l.suit) {
          (suiveurs[l.suit] = suiveurs[l.suit] || []).push(bascule);
          bascule(affiche(l.suit));
        }
      } else {
        c.appendChild(caseFiche(type, l.cle, "", null, (montre) => {
          bascule(montre);
          (suiveurs[l.cle] || []).forEach((f) => f(montre));
        }));
      }
    }
    tb.appendChild(tr);
  });

  t.appendChild(tb);
  return t;
}

/* ------------------------------------------------------------------
   Correspondance des champs d'origine

   Les champs d'exposant ne portent pas le même nom d'un salon à l'autre :
   « x_Catalogue_RaisonSociale » ici, autre chose ailleurs, et côté Eventmaker
   ce sont des champs de fiche nommés par l'organisateur. Écrits dans la
   synchronisation, ils condamnaient un salon nommé autrement à un déploiement.

   La liste des champs disponibles vient de la synchronisation, qui les relève
   en lisant les fiches — il n'y a rien à demander de plus, et rien à détecter
   à part.
   ------------------------------------------------------------------ */

/* Deux valeurs qui ne sont pas des noms de champ : « rien de réglé », qui
   laisse jouer le champ par défaut, et « ne rien lire », qui est un choix.
   La seconde s'enregistre en chaîne vide ; l'absence, elle, veut dire la
   première. Le « = » de tête les met hors d'atteinte d'un nom de champ. */
const DEFAUT_CHAMP = "=defaut";
const AUCUN_CHAMP = "=aucun";

/* Une cible peut lire plusieurs champs — le premier renseigné l'emporte, sauf
   la nomenclature où ils se cumulent. La liste déroulante n'a qu'une valeur
   par ligne : on la compose en les joignant, aucun nom de champ ne portant de
   barre verticale. */
const encode = (v) => v === undefined || v === null ? DEFAUT_CHAMP
  : ([].concat(v).filter(Boolean).join("|") || AUCUN_CHAMP);
const decode = (v) => v === DEFAUT_CHAMP ? undefined
  : v === AUCUN_CHAMP ? ""
  : v.indexOf("|") >= 0 ? v.split("|") : v;

/** Le bloc de correspondance d'un fournisseur, jamais nul. */
const correspondance = (e, src) => (e.correspondances || {})[src] || {};

// le préfixe dit l'origine, que le groupe annonce déjà
const sansPrefixe = (cle) => String(cle).replace(/^[a-z]+:/, "");
const courte = (v) => {
  const t = String(v || "").trim();
  return t.length > 34 ? t.slice(0, 32) + "…" : t;
};

/**
 * L'intitulé d'un champ dans la liste déroulante.
 *
 * Trois choses, dans cet ordre : le nom technique, parce que c'est lui qu'on
 * retrouvera dans l'API ; son libellé quand le schéma en donne un de
 * différent ; et une valeur telle qu'elle a été lue. C'est cette dernière qui
 * fait choisir — « x_Catalogue_RaisonSociale » et « x_Catalogue_Enseigne » ne
 * se distinguent que par ce qu'elles contiennent, et les champs personnalisés
 * d'un salon portent des noms que personne ne reconnaît de mémoire.
 */
function intitule(d) {
  const technique = sansPrefixe(d.cle);
  const lib = d.libelle && d.libelle !== technique ? technique + " — " + d.libelle : technique;
  return lib + "  ·  " + (d.exemple ? courte(d.exemple) : "(vide sur les fiches lues)");
}

/**
 * L'intitulé d'une cible qui lit plusieurs champs à la suite — « address »,
 * puis « address_2 » quand le premier est vide. L'exemple est celui du premier
 * champ qui en porte un : c'est la valeur que la fiche montrera le plus
 * souvent.
 */
function intituleSuite(v, detectes) {
  const parts = v.split("|");
  const d = parts.map((c) => detectes.find((x) => x.cle === c)).find((x) => x && x.exemple);
  return parts.map(sansPrefixe).join(", puis ") + (d ? "  ·  " + courte(d.exemple) : "");
}

/**
 * Les valeurs d'un champ à choix, une par entrée, points-virgules défaits.
 *
 * Ni Klipso ni Eventmaker ne rendent une liste : ils joignent les valeurs
 * d'un champ à choix multiple dans une seule chaîne — « Nouveaux exposants;
 * Exposants internationaux ». Prise entière, elle ferait une valeur à cocher
 * de plus par combinaison, et aucune ne désignerait ce que l'exploitant vise.
 */
const separeValeurs = (v) => [].concat(v)
  .filter((x) => x !== null && x !== undefined)
  .flatMap((x) => String(x).split(";"))
  .map((x) => x.trim()).filter(Boolean);

/**
 * La liste déroulante des champs d'origine d'une cible, et ce qu'elle vaut.
 *
 * Le réglage s'enregistre à chaque changement, comme les cases de la même
 * fenêtre : une fenêtre où la moitié des gestes se valide et l'autre pas
 * serait un piège.
 */
function champOrigine(src, cible, apres, ouiNon) {
  const e = courant();
  const bloc = correspondance(e, src);
  const detectes = bloc.detectes || [];
  const defauts = bloc.defauts || null;
  const propose = bloc.propose || null;
  const regle = (bloc.champs || {})[cible];

  /* Rien de réglé et une proposition sous la main : c'est elle qu'on montre.
     Elle ne s'enregistre pas pour autant — elle décrit ce que la
     synchronisation ferait de toute façon, et l'enregistrer ne changerait
     rien qu'en apparence. */
  const propose1 = propose ? encode(propose[cible] || []) : null;
  const choisi = regle !== undefined ? encode(regle)
    : propose1 !== null ? propose1 : DEFAUT_CHAMP;
  const parDefaut = defauts ? ([].concat(defauts[cible] || []))[0] : null;
  // « proposé » et « choisi à la main » ne se distinguent que par là : le
  // relever une fois pour toutes le figerait au premier état affiché
  let reglee = regle !== undefined;

  const hote = document.createElement("div");
  const sel = document.createElement("select");
  const opt = (v, txt, dans) => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = txt;
    (dans || sel).appendChild(o);
  };
  opt(DEFAUT_CHAMP, parDefaut ? "Par défaut — " + parDefaut
    : defauts ? "Par défaut — aucun champ" : "Par défaut");
  opt(AUCUN_CHAMP, "Aucun — laisser vide");
  // une cible qui lit plusieurs champs à la suite ne se dit pas dans une liste
  // de champs uniques : elle a son entrée à elle
  const suites = {};
  [choisi, propose1].forEach((v) => {
    if (!v || v.indexOf("|") < 0 || suites[v]) return;
    suites[v] = true;
    opt(v, intituleSuite(v, detectes));
  });
  /* Les champs se rangent par origine — personnalisés d'abord, ce sont eux qui
     diffèrent d'un salon à l'autre — sans quoi deux cents entrées se lisent
     comme une seule. */
  const groupes = {};
  detectes.forEach((d) => {
    const g = d.groupe || "Champs";
    if (!groupes[g]) {
      groupes[g] = document.createElement("optgroup");
      groupes[g].label = g;
      sel.appendChild(groupes[g]);
    }
    opt(d.cle, intitule(d), groupes[g]);
  });
  /* Un champ réglé que le dernier relevé ne connaît pas reste proposé : mieux
     vaut le montrer signalé que le remplacer en silence — il peut n'être
     renseigné sur aucune des fiches lues, et rester le bon. */
  if (choisi !== DEFAUT_CHAMP && choisi !== AUCUN_CHAMP && !suites[choisi] &&
      !detectes.some((d) => d.cle === choisi)) {
    opt(choisi, choisi + " (absent du dernier relevé)");
  }
  sel.value = choisi;
  hote.appendChild(sel);

  const etat = document.createElement("span");
  etat.className = "etat-salle";
  hote.appendChild(etat);

  /* Une cible vide n'appelle pas toujours au secours. Certaines n'ont aucun
     champ d'origine d'office — Klipso ne porte ni adresse ni réseaux sociaux —
     et rester vides est leur état normal ; seules celles dont le champ habituel
     a disparu méritent le rouge. */
  const sansDefaut = defauts !== null && !([].concat(defauts[cible] || [])).length;
  const dis = () => {
    const v = sel.value;
    const vide = v === AUCUN_CHAMP;
    const suggere = propose1 !== null && v === propose1 && !reglee;
    const genre = vide ? (sansDefaut || !propose1 ? "libre" : "manque")
      : v === DEFAUT_CHAMP || suggere ? "auto" : "manuel";
    etat.textContent = vide
      ? (sansDefaut ? "sans champ d'origine connu"
        : propose1 ? "champ habituel introuvable : à désigner" : "laissé vide")
      : v === DEFAUT_CHAMP ? "champ par défaut"
      : suggere ? "proposé d'après le dernier relevé" : "choisi à la main";
    etat.dataset.genre = genre;
    if (apres) apres(genre);
  };
  dis();

  /* Le champ retenu et les valeurs qui le font compter vivent dans le même
     bloc : c'est un seul réglage en deux temps, et il s'enregistre d'un coup. */
  const enregistre = async (part) => {
    const e2 = courant();
    const avant = e2.correspondances;
    const corr = { ...(e2.correspondances || {}) };
    corr[src] = { ...(corr[src] || {}), ...part };
    e2.correspondances = corr;
    try { await majEvenement(e2.id, { correspondances: corr }); }
    catch (err) { e2.correspondances = avant; signale(err.message, true); }
  };

  sel.onchange = () => {
    const champs = { ...(correspondance(courant(), src).champs || {}) };
    const v = decode(sel.value);
    reglee = v !== undefined;
    if (v === undefined) delete champs[cible]; else champs[cible] = v;
    /* Les valeurs retenues appartenaient au champ précédent : les garder
       désignerait des valeurs que le nouveau ne porte pas. */
    const valeurs = { ...(correspondance(courant(), src).valeurs || {}) };
    delete valeurs[cible];
    enregistre({ champs, valeurs });
    dis();
    majValeurs();
  };

  /* ---- les valeurs qui valent oui ----

     Un champ à choix ne répond pas par oui ou non : « anciennete » vaut
     « Nouveau Client », « Client N-1 » ou « Retour », et c'est à l'exploitant
     de dire lesquelles comptent — un salon signalera les retours, un autre
     non. Les valeurs proposées sont celles que la synchronisation a vues sur
     ce champ ; un champ de texte libre n'en a pas, et retombe alors sur le
     oui/non usuel. */
  const zoneValeurs = document.createElement("div");
  zoneValeurs.className = "valeurs";
  if (ouiNon) hote.appendChild(zoneValeurs);

  function majValeurs() {
    if (!ouiNon) return;
    zoneValeurs.innerHTML = "";
    // sans champ désigné, il n'y a pas de valeur à qualifier
    if (sel.value === DEFAUT_CHAMP || sel.value === AUCUN_CHAMP) {
      zoneValeurs.hidden = true;
      return;
    }
    zoneValeurs.hidden = false;

    /* Séparées ici aussi, et pas seulement au relevé : un salon réglé avant ce
       découpage porte encore des valeurs entières, et n'attend pas la
       prochaine synchronisation pour se laisser cocher. */
    const retenues = separeValeurs(
      (correspondance(courant(), src).valeurs || {})[cible] || []);
    const d = detectes.find((x) => x.cle === sel.value);
    const relevees = separeValeurs((d && d.valeurs) || []);
    /* Les valeurs déjà retenues restent proposées même si le relevé ne les
       connaît pas : saisies à la main, ou relevées avant que la
       synchronisation ne garde les valeurs distinctes. Les effacer d'un
       affichage reviendrait à les effacer tout court. */
    const offertes = [...relevees];
    retenues.forEach((v) => { if (offertes.indexOf(v) < 0) offertes.push(v); });

    const dit = document.createElement("span");
    dit.className = "mini";
    zoneValeurs.appendChild(dit);
    /* Un champ dont on connaît un exemple mais aucune valeur vient d'un relevé
       plus vieux que la façon de les garder : le dire avec sa date épargne
       d'attendre une liste qu'une synchronisation lancée depuis remplirait. */
    const dateReleve = bloc.detecteLe
      ? new Date(bloc.detecteLe).toLocaleString("fr-FR",
        { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })
      : null;
    const rappel = () => {
      dit.textContent = retenues.length
        ? "vaut oui quand la valeur est :"
        : offertes.length
          ? "aucune valeur retenue : rien ne sera signalé"
          : "valeurs inconnues" + (dateReleve ? " au relevé du " + dateReleve : "") +
            " : la prochaine synchronisation les relèvera, ou saisissez-en une ici";
      dit.dataset.genre = retenues.length ? "" : "manque";
    };
    rappel();

    const puce = (v) => {
      const l = document.createElement("label");
      l.className = "puce";
      l.innerHTML = '<input type="checkbox"><span></span>';
      l.querySelector("span").textContent = v;
      const i = l.querySelector("input");
      i.checked = retenues.indexOf(v) >= 0;
      i.onchange = () => {
        const k = retenues.indexOf(v);
        if (i.checked && k < 0) retenues.push(v);
        if (!i.checked && k >= 0) retenues.splice(k, 1);
        const valeurs = { ...(correspondance(courant(), src).valeurs || {}) };
        if (retenues.length) valeurs[cible] = [...retenues]; else delete valeurs[cible];
        enregistre({ valeurs });
        rappel();
      };
      zoneValeurs.appendChild(l);
      return l;
    };
    offertes.forEach(puce);

    /* De quoi désigner une valeur que le relevé ignore. Il n'en a pas toujours
       une liste : un salon synchronisé avant que la synchronisation ne les
       garde n'en a aucune, et un champ de texte libre non plus. Attendre le
       prochain passage pour régler la fiche serait une attente de trop. */
    const ajout = document.createElement("input");
    ajout.type = "text";
    ajout.className = "ajout-valeur";
    ajout.placeholder = "autre valeur…";
    ajout.spellcheck = false;
    ajout.onkeydown = (ev) => {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      /* Une saisie recopiée depuis une fiche porte parfois la chaîne entière :
         elle vaut alors autant de valeurs qu'elle en joint. */
      const saisies = separeValeurs(ajout.value)
        .filter((v) => offertes.indexOf(v) < 0);
      ajout.value = "";
      if (!saisies.length) return;
      saisies.forEach((v) => {
        retenues.push(v);
        offertes.push(v);
        const l = puce(v);
        l.querySelector("input").checked = true;
      });
      const valeurs = { ...(correspondance(courant(), src).valeurs || {}) };
      valeurs[cible] = [...retenues];
      enregistre({ valeurs });
      zoneValeurs.appendChild(ajout);
      rappel();
    };
    zoneValeurs.appendChild(ajout);
  }
  majValeurs();

  return { hote, sel, dis };
}


function majLiens(e) {
  const q = "?plan=" + encodeURIComponent(e.slug || "");
  const pub = $("lienPublic"), adm = $("lienAdmin");
  if (pub) {
    pub.href = BASE_PAGES + "plan" + q;
    // un brouillon n'est pas servi aux visiteurs : le dire plutôt que
    // laisser cliquer vers une page qui répondra « introuvable »
    const brouillon = e.etat !== "publie";
    pub.classList.toggle("inactif", brouillon);
    pub.title = brouillon
      ? "L'événement est en brouillon : le plan public n'est pas encore servi."
      : "Ouvrir le plan tel que le voient les visiteurs";
  }
  if (adm) {
    adm.href = BASE_PAGES + "plan-admin" + q;
    adm.title = "Ouvrir le plan avec les calques et les outils de dessin" +
      (e.etat !== "publie" ? " — accessible même en brouillon" : "");
  }
  // le rapport reste dans l'onglet : c'est une autre page de la console, pas
  // une sortie vers le plan
  const rap = $("lienRapport");
  if (rap) {
    rap.href = BASE_PAGES + "rapport" + q;
    rap.title = "Visites, recherches et fiches ouvertes";
  }
}

function majIntegration() {
  const e = courant(), t = $("fragment");
  if (!e || !t) return;
  t.value = '<iframe src="' + BASE_PAGES + 'plan?plan=' + (e.slug || "evenement") +
    '" style="width:100%;height:80vh;border:0" title="Plan du salon" loading="lazy"></iframe>';
}

function majMsgSync(e) {
  const m = $("msgSync");
  if (!m) return;
  if (e.derniere_err) { m.className = "err"; m.textContent = "Dernière erreur : " + e.derniere_err; return; }
  m.className = "";
  // la ligne s'intitule déjà « Synchronisation » : le mot n'a pas à revenir
  m.textContent = e.derniere_sync
    ? "Dernière : " +
      new Date(e.derniere_sync).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })
    : "Jamais synchronisé.";
}

/* ------------------------------------------------------------------
   Synchronisation
   ------------------------------------------------------------------ */
async function synchronise(e) {
  const b = $("btnSync");
  b.disabled = true;
  const zone = $("avancement");
  let maj = null, enCours = null;
  signale("Synchronisation en cours…");
  try {
    const j = await fluxFonction("sync-evenement", { evenementId: e.id }, (o) => {
      if (o.etapes && zone) maj = barreAvancement(zone, o.etapes);
      else if (o.etape && maj) {
        if (o.etat === "encours") enCours = o.etape;
        maj(o.etape, o.etat, o.info);
      }
    });
    if (!j) throw new Error("Synchronisation interrompue avant la fin.");
    const pav = j.pavillons || [];
    const total = pav.reduce((a, p) => a + (p.stands || 0), 0);
    /* Combien de stands ont trouvé leur fiche chez le fournisseur d'exposants.
       C'est le chiffre qui dit si l'appariement tient : il ne paraît que quand
       les exposants viennent d'ailleurs que du plan, seul cas où il existe.
       « Apparié » n'est pas « nommé » — une fiche trouvée mais exclue du
       catalogue laisse le stand sans nom, et compte quand même ici. */
    const app = pav.some((p) => p.apparies !== undefined)
      ? ", " + pav.reduce((a, p) => a + (p.apparies || 0), 0) + " appariés"
      : "";
    // sans libellés, la nomenclature s'affiche en codes : le dire tout de
    // suite plutôt que de laisser découvrir des « FEP26_NOM10201 » sur le plan
    const n = j.nomenclature || {};
    const suite = n.erreur
      ? " Nomenclature en codes : " + n.erreur
      : n.libelles ? " " + n.libelles + " libellés de nomenclature." : "";
    signale(pav.length + " pavillon" + (pav.length > 1 ? "s" : "") + ", " +
      total + " emplacements" + app + "." + suite, !!n.erreur);
    await charge();
  } catch (err) {
    // marquer l'étape où l'on s'est arrêté vaut mieux qu'une barre figée
    if (maj && enCours) maj(enCours, "echec", err.message);
    signale(err.message, true);
  } finally {
    if ($("btnSync")) $("btnSync").disabled = false;
  }
}

function dupliquer(e) {
  demande("Dupliquer l'événement", "Nom de la copie", e.nom + " — copie", async (nom) => {
    try {
      // l'édition suivante a ses propres identifiants Klipso : on ne recopie
      // ni l'identifiant d'événement, ni les pavillons
      await rest("evenement", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({
          nom, slug: slugifie(nom), instance: e.instance,
          rythme_min: e.rythme_min, etat: "brouillon",
        }),
      });
      await charge();
    } catch (err) { signale(err.message, true); }
  });
}

/* ------------------------------------------------------------------
   Barre du haut
   ------------------------------------------------------------------ */
$("btnNouveau").onclick = () =>
  demande("Nouvel événement", "Nom de l'événement", "", async (nom) => {
    signale("Création…");
    try {
      const rep = await rest("evenement", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({
          nom, slug: slugifie(nom) || "evenement", instance: "", etat: "brouillon",
        }),
      });
      const cree = Array.isArray(rep) ? rep[0] : rep;
      if (cree?.id) selection = cree.id;
      await charge();
      signale("Événement créé.");
    } catch (err) { signale(err.message, true); }
  });

/* Rechargement à la demande : la console ne surveille pas la base, et une
   synchronisation lancée ailleurs ne se voit pas toute seule. */
$("btnRecharger").onclick = async () => {
  const b = $("btnRecharger");
  if (b.disabled) return;
  b.disabled = true;
  b.classList.add("occupe");
  try {
    const avant = PLANS;
    PLANS = {};
    await charge();
    signale("Données rechargées.");
    void avant;
  } catch (e) {
    signale(e.message, true);
  } finally {
    b.disabled = false;
    b.classList.remove("occupe");
  }
};

/* Un relevé de ce que la console a en main — les salons et leurs pavillons —
   copié dans le presse-papiers. Rien ne s'enregistre : cela sert à joindre un
   état à un signalement, pas à sauvegarder quoi que ce soit. */
$("btnExport").onclick = (ev) => {
  const b = ev.currentTarget;
  const txt = JSON.stringify({ evenements: EVTS, plans: PLANS }, null, 2);
  navigator.clipboard?.writeText(txt).then(
    () => { b.textContent = "Copié"; setTimeout(() => b.textContent = "Copier les données (JSON)", 1700); },
    () => { b.textContent = "Échec de la copie"; });
};
/* La console n'a pas de sélecteur de période : elle exporte tout l'historique.
   Celui qui veut découper regarde le rapport, qui offre le même bouton sous la
   période affichée. */
$("btnExcel").onclick = (ev) => exporteExposants(ev.currentTarget, null);
$("btnProjet").onclick = () => ecranConfig();




/* ------------------------------------------------------------------
   Comptes et accès

   Deux écrans plutôt qu'un. Le premier est un annuaire : une ligne par
   personne, ce qu'il faut pour la reconnaître, et rien de plus — on y cherche
   quelqu'un, on n'y règle rien. Le second est sa fiche, où tout se modifie.

   Les réglages tenaient d'abord dans la liste elle-même. À quatre comptes la
   fenêtre faisait trois écrans de haut, et l'on y perdait de vue celui qu'on
   était venu chercher.

   Créer un compte, envoyer son invitation ou le supprimer demande la clé de
   service : tout passe donc par la fonction `comptes`, jamais par la table.
   ------------------------------------------------------------------ */
let MOI = null;
let COMPTES = [];

/** Le rôle du compte connecté. Il décide de ce que la console propose ; ce
 *  qu'elle obtient, c'est la base qui le décide. */
async function litMonProfil() {
  const id = idCompte();
  MOI = null;
  if (!id) return;
  const r = await rest("profil?select=id,nom,prenom,email,role&id=eq." + encodeURIComponent(id));
  MOI = (Array.isArray(r) ? r[0] : null) || null;
}

const NOM_ROLE = { admin: "Administrateur", organisateur: "Organisateur" };

/** L'adresse où retomber après avoir cliqué le lien reçu par courriel. */
const RETOUR_MDP = () => PAGE_MDP;

async function litComptes() {
  const r = await fonction("comptes", { action: "liste" });
  COMPTES = r.profils || [];
  return COMPTES;
}

/* Un message qui vit dans la fenêtre plutôt que dans la barre du haut, restée
   derrière le voile. Rendu avec le reste, il survit au redessin — sans quoi un
   enregistrement réussi effacerait sa propre confirmation. */
function ligneMessage(corps, id, mot) {
  const p = document.createElement("p");
  p.id = id;
  p.className = "aide" + (mot.erreur ? " alerte" : "");
  p.textContent = mot.texte;
  corps.appendChild(p);
}

/* Les salons cochés. Un administrateur les a tous par définition : lui en
   cocher serait laisser croire qu'on peut lui en retirer. */
function casesSalons(role, choisis) {
  const zone = document.createElement("div");
  zone.className = "valeurs";
  const note = (texte) => {
    const p = document.createElement("p");
    p.className = "aide";
    p.textContent = texte;
    zone.appendChild(p);
  };
  if (role === "admin") { note("Tous les salons, y compris ceux créés plus tard."); return zone; }
  if (!EVTS.length) { note("Aucun salon à affecter pour l'instant."); return zone; }
  EVTS.forEach((e) => {
    const l = document.createElement("label");
    l.className = "puce";
    l.innerHTML = "<input type='checkbox'><span></span>";
    l.querySelector("span").textContent = e.nom;
    const c = l.querySelector("input");
    c.value = e.id;
    c.checked = choisis.includes(e.id);
    zone.appendChild(l);
  });
  return zone;
}

const cochés = (zone) =>
  Array.from(zone.querySelectorAll("input:checked")).map((c) => c.value);

/* ------------------------------------------------------------------
   L'annuaire
   ------------------------------------------------------------------ */
function ouvreComptes(message) {
  let hote = null;
  let mot = { texte: message || "Chargement…", erreur: !!(message && message.erreur) };

  function ligne(c) {
    const tr = document.createElement("tr");
    // une invitation jamais ouverte se signale en bord de ligne : c'est ce qui
    // distingue un compte créé d'un compte qui sert
    tr.dataset.actif = c.actif ? "oui" : "non";

    const tdNom = document.createElement("td");
    tdNom.className = "n";
    tdNom.textContent = c.nom || "—";
    const tdPrenom = document.createElement("td");
    tdPrenom.textContent = c.prenom || "—";
    const tdMail = document.createElement("td");
    tdMail.className = "mail";
    tdMail.textContent = c.email;

    const tdRole = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "prov";
    badge.textContent = NOM_ROLE[c.role] || c.role;
    tdRole.appendChild(badge);
    if (!c.actif) {
      const att = document.createElement("span");
      att.className = "prov";
      att.dataset.src = "aucun";
      att.textContent = "En attente";
      tdRole.appendChild(att);
    }
    if (c.id === MOI?.id) {
      const vous = document.createElement("span");
      vous.className = "prov";
      vous.dataset.src = "aucun";
      vous.textContent = "Vous";
      tdRole.appendChild(vous);
    }

    const tdAct = document.createElement("td");
    tdAct.className = "act";
    const bt = document.createElement("button");
    bt.className = "btn petit";
    bt.textContent = "Modifier";
    bt.onclick = () => ouvreFicheCompte(c);
    tdAct.appendChild(bt);

    tr.append(tdNom, tdPrenom, tdMail, tdRole, tdAct);
    return tr;
  }

  function rendu(corps) {
    corps.innerHTML = "";
    if (COMPTES.length) {
      // le tableau garde ses colonnes sur écran étroit plutôt que de les
      // écraser : il défile, la fenêtre non
      const cadre = document.createElement("div");
      cadre.className = "table-defile";
      const t = document.createElement("table");
      t.className = "comptes";
      t.innerHTML = "<thead><tr><th>Nom</th><th>Prénom</th><th>E-mail</th>" +
        "<th>Profil</th><th></th></tr></thead><tbody></tbody>";
      const tb = t.querySelector("tbody");
      COMPTES.forEach((c) => tb.appendChild(ligne(c)));
      cadre.appendChild(t);
      corps.appendChild(cadre);
    }
    ligneMessage(corps, "comptesMsg", mot);
  }

  ouvreModale("Comptes et accès", (corps) => {
    hote = corps;
    rendu(corps);
    litComptes()
      .then(() => {
        mot = { texte: COMPTES.length ? "" : "Aucun compte.", erreur: false };
        if (hote) rendu(hote);
      })
      .catch((e) => {
        mot = { texte: e.message, erreur: true };
        if (hote) rendu(hote);
      });
  }, [{ libelle: "Fermer" },
      { libelle: "Inviter quelqu'un", genre: "primaire",
        // la fenêtre est remplacée par la fiche, elle ne doit pas se refermer
        action: () => { ouvreFicheCompte(null); return false; } }],
     () => { hote = null; });
}

/* ------------------------------------------------------------------
   La fiche d'une personne — la même pour l'inviter et pour la modifier
   ------------------------------------------------------------------ */
function ouvreFicheCompte(c) {
  const neuf = !c;
  const moi = !neuf && c.id === MOI?.id;
  let mot = { texte: "", erreur: false };
  let cMail, cNom, cPrenom, selRole, zone;
  let surSuppression = false;

  const dis = (texte, erreur) => {
    mot = { texte, erreur: !!erreur };
    const p = $("ficheMsg");
    if (p) { p.textContent = texte; p.className = "aide" + (erreur ? " alerte" : ""); }
  };

  /** Retour à l'annuaire, qui recharge : ce qu'on vient d'écrire doit s'y voir. */
  const retour = (message) => ouvreComptes(message);

  const champs = () => ({
    nom: cNom.value,
    prenom: cPrenom.value,
    role: selRole.value,
    evenements: selRole.value === "admin" ? [] : cochés(zone),
  });

  async function enregistre() {
    dis("Enregistrement…");
    try {
      await fonction("comptes", { action: "maj", id: c.id, ...champs() });
      retour("Compte enregistré.");
    } catch (e) { dis(e.message, true); }
  }

  async function invite() {
    const email = cMail.value.trim();
    if (email.indexOf("@") < 1) return dis("Adresse incomplète.", true);
    dis("Envoi de l'invitation…");
    try {
      await fonction("comptes",
        { action: "invite", email, ...champs(), retour: RETOUR_MDP() });
      retour("Invitation envoyée à " + email + ".");
    } catch (e) { dis(e.message, true); }
  }

  async function envoieLien() {
    dis("Envoi…");
    try {
      await fonction("comptes", { action: "relance", id: c.id, retour: RETOUR_MDP() });
      dis("Lien envoyé à " + c.email + ".");
    } catch (e) { dis(e.message, true); }
  }

  async function supprime() {
    /* La fenêtre est déjà celle qui est ouverte : une demande de confirmation
       la remplacerait. On confirme donc sur place, au second clic. */
    if (!surSuppression) {
      surSuppression = true;
      dis("Cliquez à nouveau sur « Supprimer » pour confirmer.", true);
      setTimeout(() => { if (surSuppression) { surSuppression = false; dis(""); } }, 5000);
      return;
    }
    surSuppression = false;
    dis("Suppression…");
    try {
      await fonction("comptes", { action: "supprime", id: c.id });
      retour("Compte supprimé.");
    } catch (e) { dis(e.message, true); }
  }

  const boutons = [{ libelle: "Retour", action: () => { retour(); return false; } }];
  if (neuf) {
    boutons.push({ libelle: "Envoyer l'invitation", genre: "primaire",
                   action: () => { invite(); return false; } });
  } else {
    if (!moi) {
      boutons.push({ libelle: "Supprimer", genre: "danger",
                     action: () => { supprime(); return false; } });
    }
    boutons.push({ libelle: "Envoyer un lien de mot de passe",
                   action: () => { envoieLien(); return false; } });
    boutons.push({ libelle: "Enregistrer", genre: "primaire",
                   action: () => { enregistre(); return false; } });
  }

  ouvreModale(neuf ? "Inviter quelqu'un" : "Modifier le compte", (corps) => {
    const cadre = document.createElement("div");
    cadre.className = "cadre compte";

    if (neuf) {
      const aide = document.createElement("p");
      aide.className = "aide";
      aide.textContent = "Le compte est créé sans mot de passe : l'invité en " +
        "reçoit un lien par courriel, et le choisit lui-même.";
      cadre.appendChild(aide);
    }

    const g = grille();
    const lMail = document.createElement("label");
    lMail.innerHTML = "<span>Adresse e-mail</span><input type='email'>";
    cMail = lMail.querySelector("input");
    if (!neuf) {
      cMail.value = c.email;
      /* L'adresse est l'identité du compte auprès du service d'authentification :
         la changer ici la désaccorderait de celle qui ouvre la session. */
      cMail.readOnly = true;
      const note = document.createElement("span");
      note.className = "aide";
      note.textContent = "L'adresse ne se change pas : c'est elle qui ouvre la session.";
      lMail.appendChild(note);
    }
    const lNom = document.createElement("label");
    lNom.innerHTML = "<span>Nom</span><input autocomplete='family-name'>";
    cNom = lNom.querySelector("input");
    if (!neuf) cNom.value = c.nom || "";
    const lPrenom = document.createElement("label");
    lPrenom.innerHTML = "<span>Prénom</span><input autocomplete='given-name'>";
    cPrenom = lPrenom.querySelector("input");
    if (!neuf) cPrenom.value = c.prenom || "";
    const lRole = document.createElement("label");
    lRole.innerHTML = "<span>Profil</span><select>" +
      "<option value='organisateur'>Organisateur</option>" +
      "<option value='admin'>Administrateur</option></select>";
    selRole = lRole.querySelector("select");
    selRole.value = neuf ? "organisateur" : c.role;
    // se retirer soi-même l'administration fermerait la porte de l'intérieur
    selRole.disabled = moi;
    if (moi) {
      const note = document.createElement("span");
      note.className = "aide";
      note.textContent = "Vous ne pouvez pas retirer votre propre rôle.";
      lRole.appendChild(note);
    }
    g.append(lMail, lNom, lPrenom, lRole);
    cadre.appendChild(g);

    const titre = document.createElement("span");
    titre.className = "eyebrow sous-titre";
    titre.textContent = "Salons";
    cadre.appendChild(titre);
    zone = casesSalons(selRole.value, neuf ? [] : (c.evenements || []));
    cadre.appendChild(zone);
    // changer de profil change ce qu'il y a à cocher : la liste suit sans
    // qu'on ait à refermer la fenêtre
    selRole.onchange = () => {
      const neuve = casesSalons(selRole.value, cochés(zone));
      zone.replaceWith(neuve);
      zone = neuve;
    };

    corps.appendChild(cadre);
    ligneMessage(corps, "ficheMsg", mot);
    setTimeout(() => (neuf ? cMail : cNom).focus(), 40);
  }, boutons);
}

$("btnComptes").onclick = () => ouvreComptes();

/* ------------------------------------------------------------------
   Rendu et démarrage
   ------------------------------------------------------------------ */
/** Fin de session : la console n'a plus d'événements à montrer. */
function videEcran() {
  EVTS = []; selection = null; MOI = null;
  dessine();
}

function dessine() {
  // les comptes et la création d'un salon sont le fait de l'administrateur ;
  // un organisateur reçoit ses salons, il ne s'en donne pas
  const patron = MOI?.role === "admin";
  $("btnComptes").hidden = !patron;
  $("btnNouveau").hidden = !patron;
  dessineChoix();
  majBarre();
  dessineFiche();
  majAdresse();
}

async function demarre() {
  try {
    await charge();
  } catch (e) {
    $("fiche").innerHTML = '<div class="vide"></div>';
    $("fiche").querySelector(".vide").textContent = "Chargement impossible : " + e.message;
  }
}

if (!CFG) ecranConfig();
else if (!SESSION) ecranConnexion();
else demarre();
</script>
