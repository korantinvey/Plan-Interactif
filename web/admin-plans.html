<title>Console des plans de salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#E9EAE4; --surface:#FBFBF8; --surface-2:#F1F2EC; --surface-3:#E4E6DE;
  --line:#D2D5CB; --line-strong:#B4B9AC;
  --ink:#15181A; --ink-2:#4A4F52; --ink-3:#7C8285;
  --accent:#2F49D1; --accent-soft:#DCE1FA;
  --vert:#17876B; --vert-soft:#D8EDE6;
  --ambre:#C98A06; --ambre-soft:#F7EAC6;
  --rouge:#C2372B; --rouge-soft:#F6DDDA;
  --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px -12px rgba(20,24,26,.18);
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --surface-3:#272D31;
    --line:#2A3034; --line-strong:#3B4348;
    --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
    --accent:#7A8CFF; --accent-soft:#232C55;
    --vert:#3FBF9B; --vert-soft:#12332B;
    --ambre:#F0B429; --ambre-soft:#3A2F12;
    --rouge:#FF8B7E; --rouge-soft:#3B1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --surface-3:#272D31;
  --line:#2A3034; --line-strong:#3B4348;
  --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
  --accent:#7A8CFF; --accent-soft:#232C55;
  --vert:#3FBF9B; --vert-soft:#12332B;
  --ambre:#F0B429; --ambre-soft:#3A2F12;
  --rouge:#FF8B7E; --rouge-soft:#3B1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;
  height:100vh;min-height:600px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 18px;height:58px;
  background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.topbar h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;
  letter-spacing:-.02em;white-space:nowrap}
.topbar .sous{font-size:12px;color:var(--ink-3);white-space:nowrap}
.topbar .droite{margin-left:auto;display:flex;gap:7px;align-items:center}

.btn{padding:8px 14px;border-radius:var(--radius);font-size:13.5px;font-weight:500;
  border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primaire{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primaire:hover{filter:brightness(1.08)}
.btn.danger{color:var(--rouge);border-color:var(--line)}
.btn.danger:hover{background:var(--rouge-soft);border-color:var(--rouge)}
.btn.petit{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.lien{font-size:12.5px;color:var(--ink-3);text-decoration:underline}
.lien:hover{color:var(--ink)}

/* ---------- colonne des événements ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.rail header{padding:13px 16px 11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.rail .liste{overflow-y:auto;flex:1;min-height:0}
.evt{display:block;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line)}
.evt:hover{background:var(--surface-2)}
.evt[aria-current="true"]{background:var(--accent-soft)}
.evt .nom{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.evt .meta{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.vide{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.6}

.etat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:2px 7px;border-radius:999px;letter-spacing:.02em;
  background:var(--surface-3);color:var(--ink-2)}
.etat.publie{background:var(--vert-soft);color:var(--vert)}
.etat.brouillon{background:var(--ambre-soft);color:var(--ambre)}
.etat::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}

/* ---------- panneau de droite ---------- */
.fiche{overflow-y:auto;padding:22px 26px 60px}
.fiche .entete{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.fiche h2{font-family:"Archivo",sans-serif;font-size:21px;letter-spacing:-.02em;margin:2px 0 5px}
.fiche .entete .droite{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}

.bloc{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:16px 18px;margin-bottom:14px}
.bloc > .eyebrow{display:block;margin-bottom:12px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
label input,label select,label textarea{padding:8px 10px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);width:100%}
label input:focus,label select:focus,label textarea:focus{border-color:var(--accent);
  background:var(--surface);outline:none}
label .aide{font-size:11px;color:var(--ink-3);line-height:1.45}
label.large{grid-column:1/-1}
textarea{resize:vertical;min-height:72px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding:0 10px 7px;font-family:"Archivo",sans-serif}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
tr.eteint td{opacity:.45}
.coche{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

.astuce{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0}
.astuce code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--surface-2);padding:1px 5px;border-radius:3px}
.etat-ligne{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);
  margin-top:10px;flex-wrap:wrap}
.etat-ligne .err{color:var(--rouge)}
.etat-ligne .ok{color:var(--vert)}

.integration{display:flex;gap:8px;align-items:flex-start}
.integration textarea{flex:1;min-height:60px}

/* ---------- fenêtres ---------- */
.modale{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:none;
  place-items:center;padding:20px}
.modale.open{display:grid}
.mfen{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.6);width:min(440px,100%);max-height:84vh;
  display:flex;flex-direction:column;overflow:hidden}
.mfen header{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.mfen h3{font-family:"Archivo",sans-serif;font-size:16px;margin:0;letter-spacing:-.01em}
.mfen header button{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 5px}
.mcorps{padding:15px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.mcorps p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mfen footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;
  border-top:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .rail{border-right:none;border-bottom:1px solid var(--line);max-height:190px}
  .fiche{padding:16px}
  .topbar .sous{display:none}
}
</style>

<div class="app">
  <header class="topbar">
    <h1>Console des plans</h1>
    <span class="sous" id="sousTitre"></span>
    <div class="droite">
      <button class="btn petit" id="btnImport">Importer</button>
      <button class="btn petit" id="btnExport">Exporter</button>
      <button class="btn petit" id="btnTheme" aria-label="Thème">◐</button>
    </div>
  </header>

  <aside class="rail">
    <header>
      <span class="eyebrow">Événements</span>
      <button class="btn petit primaire" id="btnNouveau">Nouveau</button>
    </header>
    <div class="liste" id="listeEvts"></div>
  </aside>

  <main class="fiche" id="fiche"></main>
</div>

<div class="modale" id="modale">
  <div class="mfen" role="dialog" aria-modal="true">
    <header><h3 id="mTitre"></h3><button id="mFermer" aria-label="Fermer">&times;</button></header>
    <div class="mcorps" id="mCorps"></div>
    <footer id="mPied"></footer>
  </div>
</div>

<script>
/* Sans viewport, un mobile rend la page dans un viewport virtuel de 980 px. */
if (!document.querySelector('meta[name="viewport"]')){
  const mv = document.createElement("meta");
  mv.name = "viewport";
  mv.content = "width=device-width, initial-scale=1";
  document.head.appendChild(mv);
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ============================================================
   Modèle
   Une ligne = un futur enregistrement. Les noms de champs sont ceux
   que porteront les tables : evenement, plan, et la configuration
   d'apparence rattachée au couple événement / plan.
   ============================================================ */
const CLE = "console-plans";
const RYTHMES = [[0, "Manuel uniquement"], [15, "Toutes les 15 minutes"],
                 [60, "Toutes les heures"], [360, "Toutes les 6 heures"],
                 [1440, "Une fois par jour"]];

let DONNEES = { evenements: [], version: 1 };
try {
  const lu = JSON.parse(localStorage.getItem(CLE) || "null");
  if (lu && Array.isArray(lu.evenements)) DONNEES = lu;
} catch (e) {}

let selection = DONNEES.evenements.length ? DONNEES.evenements[0].id : null;

const enregistre = () => { try { localStorage.setItem(CLE, JSON.stringify(DONNEES)); } catch (e) {} };
const nouvelId = () => "e" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
const trouve = id => DONNEES.evenements.find(e => e.id === id);
const courant = () => trouve(selection);

function slugifie(t){
  return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
}

function nouvelEvenement(nom){
  const e = {
    id: nouvelId(),
    nom: nom,
    slug: slugifie(nom),
    instance: "",
    eventId: "",
    proxy: "",
    rythmeMin: 60,
    etat: "brouillon",
    plans: [],            // { idPlan, libelle, hall, publie, stands, zones }
    derniereSync: null,
    creeLe: new Date().toISOString(),
  };
  DONNEES.evenements.unshift(e);
  selection = e.id;
  enregistre();
  dessine();
}

/* ============================================================
   Fenêtres
   ============================================================ */
function ouvreModale(titre, remplit, boutons){
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplit($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach(b => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action && b.action() === false) return; fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
const fermeModale = () => $("modale").classList.remove("open");
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", e => { if (e.target === $("modale")) fermeModale(); });
addEventListener("keydown", e => { if (e.key === "Escape") fermeModale(); });

function demande(titre, libelle, valeur, suite){
  let champ;
  ouvreModale(titre, corps => {
    const l = document.createElement("label");
    l.innerHTML = "<span></span><input>";
    l.querySelector("span").textContent = libelle;
    champ = l.querySelector("input");
    champ.value = valeur || "";
    corps.appendChild(l);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = ev => { if (ev.key === "Enter"){ ev.preventDefault();
      const v = champ.value.trim(); if (v){ fermeModale(); suite(v); } } };
  }, [{ libelle: "Annuler" },
      { libelle: "Valider", genre: "primaire",
        action: () => { const v = champ.value.trim(); if (!v) return false; suite(v); } }]);
}

function confirme(titre, message, libelleOui, action){
  ouvreModale(titre, corps => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [{ libelle: "Annuler" }, { libelle: libelleOui, genre: "danger", action: action }]);
}

/* ============================================================
   Colonne de gauche
   ============================================================ */
function dessineRail(){
  const box = $("listeEvts");
  if (!DONNEES.evenements.length){
    box.innerHTML = '<div class="vide">Aucun événement.<br>Créez-en un pour commencer.</div>';
    return;
  }
  box.innerHTML = DONNEES.evenements.map(e => {
    const publies = e.plans.filter(p => p.publie).length;
    return '<button class="evt" data-id="' + e.id + '" aria-current="' + (e.id === selection) + '">' +
      '<span class="nom">' + esc(e.nom) + '</span>' +
      '<span class="meta"><span class="etat ' + e.etat + '">' +
      (e.etat === "publie" ? "Publié" : "Brouillon") + '</span>' +
      '<span>' + (e.plans.length ? publies + "/" + e.plans.length + " pavillons" : "aucun pavillon") +
      '</span></span></button>';
  }).join("");
  box.querySelectorAll(".evt").forEach(b =>
    b.onclick = () => { selection = b.dataset.id; dessine(); });
}

/* ============================================================
   Fiche
   ============================================================ */
function champ(cle, libelle, aide, attrs){
  const e = courant();
  const l = document.createElement("label");
  l.innerHTML = '<span></span><input ' + (attrs || "") + '>' +
                (aide ? '<span class="aide"></span>' : "");
  l.querySelector("span").textContent = libelle;
  if (aide) l.querySelector(".aide").textContent = aide;
  const i = l.querySelector("input");
  i.value = e[cle] == null ? "" : e[cle];
  i.oninput = () => {
    e[cle] = i.value;
    if (cle === "nom" && !e.slugModifie) { e.slug = slugifie(i.value); dessine(); }
    else { enregistre(); if (cle === "nom") dessineRail(); }
  };
  if (cle === "slug") i.oninput = () => { e.slug = slugifie(i.value); e.slugModifie = true; enregistre(); majIntegration(); };
  return l;
}

function dessineFiche(){
  const e = courant();
  const f = $("fiche");
  if (!e){
    f.innerHTML = '<div class="vide">Sélectionnez un événement à gauche,<br>' +
                  'ou créez-en un nouveau.</div>';
    return;
  }
  f.innerHTML = "";

  /* --- en-tête --- */
  const entete = document.createElement("div");
  entete.className = "entete";
  entete.innerHTML = '<div><span class="eyebrow">Événement</span><h2></h2>' +
    '<span class="etat ' + e.etat + '">' + (e.etat === "publie" ? "Publié" : "Brouillon") + '</span></div>' +
    '<div class="droite">' +
    '<button class="btn petit" id="btnEtat"></button>' +
    '<button class="btn petit" id="btnDupliquer">Dupliquer</button>' +
    '<button class="btn petit danger" id="btnSupprimer">Supprimer</button></div>';
  entete.querySelector("h2").textContent = e.nom;
  f.appendChild(entete);
  $("btnEtat").textContent = e.etat === "publie" ? "Repasser en brouillon" : "Publier";
  $("btnEtat").onclick = () => {
    e.etat = e.etat === "publie" ? "brouillon" : "publie";
    enregistre(); dessine();
  };
  $("btnDupliquer").onclick = () => dupliquer(e);
  $("btnSupprimer").onclick = () => confirme("Supprimer l’événement ?",
    "« " + e.nom + " » et sa configuration seront définitivement perdus.",
    "Supprimer", () => {
      DONNEES.evenements = DONNEES.evenements.filter(x => x.id !== e.id);
      selection = DONNEES.evenements.length ? DONNEES.evenements[0].id : null;
      enregistre(); dessine();
    });

  /* --- identité --- */
  const b1 = bloc("Identité");
  const g1 = grille();
  g1.appendChild(champ("nom", "Nom de l’événement"));
  g1.appendChild(champ("slug", "Identifiant d’URL", "Sert d’adresse publique du plan."));
  b1.appendChild(g1);
  f.appendChild(b1);

  /* --- source Klipso --- */
  const b2 = bloc("Source des données");
  const g2 = grille();
  g2.appendChild(champ("instance", "Instance", "Le sous-domaine Klipso, par exemple infoprodigital."));
  g2.appendChild(champ("eventId", "Identifiant d’événement",
    "Le GUID transmis dans l’en-tête X-GAIA-EventId.", 'spellcheck="false"'));
  const lp = champ("proxy", "Proxy de synchronisation",
    "La clé API vit sur ce serveur, jamais dans la page.");
  lp.className = "large";
  g2.appendChild(lp);
  const lr = document.createElement("label");
  lr.innerHTML = '<span>Rythme de rafraîchissement</span><select>' +
    RYTHMES.map(r => '<option value="' + r[0] + '"' + (e.rythmeMin === r[0] ? " selected" : "") +
                     '>' + r[1] + '</option>').join("") + '</select>';
  lr.querySelector("select").onchange = ev => { e.rythmeMin = +ev.target.value; enregistre(); };
  g2.appendChild(lr);
  b2.appendChild(g2);

  const ligne = document.createElement("div");
  ligne.className = "etat-ligne";
  ligne.innerHTML = '<button class="btn petit" id="btnSync">Synchroniser maintenant</button>' +
    '<span id="msgSync"></span>';
  b2.appendChild(ligne);
  f.appendChild(b2);
  $("btnSync").onclick = () => synchronise(e);
  majMsgSync(e);

  /* --- pavillons --- */
  const b3 = bloc("Pavillons");
  if (!e.plans.length){
    const p = document.createElement("p");
    p.className = "astuce";
    p.textContent = "Aucun pavillon connu. Lancez une synchronisation pour les récupérer depuis la source.";
    b3.appendChild(p);
  } else {
    const t = document.createElement("table");
    t.innerHTML = "<thead><tr><th>Publier</th><th>Pavillon</th><th>Hall</th>" +
      "<th>Emplacements</th><th>Zones</th></tr></thead><tbody></tbody>";
    const tb = t.querySelector("tbody");
    e.plans.forEach(p => {
      const tr = document.createElement("tr");
      if (!p.publie) tr.className = "eteint";
      tr.innerHTML = '<td><label class="coche"><input type="checkbox"' +
        (p.publie ? " checked" : "") + '></label></td>' +
        '<td class="nomplan"></td><td class="mono hall"></td>' +
        '<td class="num">' + (p.stands == null ? "—" : p.stands) + '</td>' +
        '<td class="num">' + (p.zones == null ? "—" : p.zones) + '</td>';
      tr.querySelector(".nomplan").textContent = p.libelle;
      tr.querySelector(".hall").textContent = p.hall || "—";
      tr.querySelector("input").onchange = ev => {
        p.publie = ev.target.checked; enregistre(); dessine();
      };
      tb.appendChild(tr);
    });
    b3.appendChild(t);
  }
  f.appendChild(b3);

  /* --- intégration --- */
  const b4 = bloc("Intégration");
  b4.innerHTML += '<p class="astuce">Collez ce fragment dans la page du salon. ' +
    'Le plan s’adapte à la largeur disponible.</p>';
  const zone = document.createElement("div");
  zone.className = "integration";
  zone.style.marginTop = "10px";
  zone.innerHTML = '<textarea id="fragment" readonly></textarea>' +
    '<button class="btn petit" id="btnCopier">Copier</button>';
  b4.appendChild(zone);
  f.appendChild(b4);
  majIntegration();
  $("btnCopier").onclick = ev => {
    const t = $("fragment");
    t.select();
    navigator.clipboard && navigator.clipboard.writeText(t.value).then(
      () => { ev.target.textContent = "Copié"; setTimeout(() => ev.target.textContent = "Copier", 1600); },
      () => { ev.target.textContent = "Échec"; });
  };
}

function bloc(titre){
  const d = document.createElement("div");
  d.className = "bloc";
  const t = document.createElement("span");
  t.className = "eyebrow";
  t.textContent = titre;
  d.appendChild(t);
  return d;
}
function grille(){
  const d = document.createElement("div");
  d.className = "grille";
  return d;
}

function majIntegration(){
  const e = courant(), t = $("fragment");
  if (!e || !t) return;
  const base = e.proxy ? e.proxy.replace(/\/functions\/v1\/.*$/, "") : "https://votre-domaine.fr";
  t.value = '<iframe src="' + base + '/plan/' + (e.slug || "evenement") +
            '" style="width:100%;height:80vh;border:0" title="Plan du salon" loading="lazy"></iframe>';
}

function majMsgSync(e){
  const m = $("msgSync");
  if (!m) return;
  if (!e.derniereSync){ m.textContent = "Jamais synchronisé."; return; }
  m.textContent = "Dernière synchronisation : " +
    new Date(e.derniereSync).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
}

/* ============================================================
   Synchronisation
   Le navigateur ne peut pas appeler GAIA directement : la requête part
   vers le proxy, qui détient la clé et relaie côté serveur.
   ============================================================ */
async function synchronise(e){
  const m = $("msgSync"), b = $("btnSync");
  if (!e.proxy){
    m.className = "err";
    m.textContent = "Renseignez d’abord l’adresse du proxy.";
    return;
  }
  b.disabled = true;
  m.className = "";
  m.textContent = "Interrogation de la source…";
  try {
    const r = await fetch(e.proxy, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "plans", eventId: e.eventId }),
    });
    if (!r.ok) throw new Error("Le proxy a répondu " + r.status + ".");
    const j = await r.json();
    const plans = (j.plans || j.data || []).map(p => ({
      idPlan: p.Id || p.idPlan,
      libelle: (p.Libelle || p.libelle || "").replace(/^SMCL\d*_/, ""),
      hall: p.HallExp || p.hall || "",
      stands: p.stands == null ? null : p.stands,
      zones: p.zones == null ? null : p.zones,
      publie: true,
    }));
    if (!plans.length) throw new Error("Aucun pavillon retourné pour cet identifiant.");
    // on conserve le choix de publication déjà fait
    const ancien = {};
    e.plans.forEach(p => { ancien[p.idPlan] = p.publie; });
    plans.forEach(p => { if (ancien[p.idPlan] !== undefined) p.publie = ancien[p.idPlan]; });
    e.plans = plans;
    e.derniereSync = new Date().toISOString();
    enregistre(); dessine();
    $("msgSync").className = "ok";
    $("msgSync").textContent = plans.length + " pavillon" + (plans.length > 1 ? "s" : "") + " récupéré" +
      (plans.length > 1 ? "s" : "") + ".";
  } catch (err) {
    m.className = "err";
    m.textContent = /Failed to fetch|NetworkError/i.test(err.message)
      ? "Proxy injoignable. Vérifiez l’adresse et les en-têtes CORS."
      : err.message;
  } finally {
    if ($("btnSync")) $("btnSync").disabled = false;
  }
}

function dupliquer(e){
  demande("Dupliquer l’événement", "Nom de la copie", e.nom + " — copie", nom => {
    const c = JSON.parse(JSON.stringify(e));
    c.id = nouvelId();
    c.nom = nom;
    c.slug = slugifie(nom);
    c.slugModifie = false;
    c.etat = "brouillon";
    c.eventId = "";            // l'édition suivante a son propre identifiant
    c.derniereSync = null;
    c.plans = [];              // la géométrie sera reprise à la synchronisation
    c.creeLe = new Date().toISOString();
    DONNEES.evenements.unshift(c);
    selection = c.id;
    enregistre(); dessine();
  });
}

/* ============================================================
   Sauvegarde et reprise
   ============================================================ */
$("btnExport").onclick = ev => {
  const txt = JSON.stringify(DONNEES, null, 2);
  navigator.clipboard && navigator.clipboard.writeText(txt).then(
    () => { ev.target.textContent = "Copié"; setTimeout(() => ev.target.textContent = "Exporter", 1700); },
    () => { ev.target.textContent = "Échec"; });
};
$("btnImport").onclick = () => {
  let zone;
  ouvreModale("Importer une configuration", corps => {
    const p = document.createElement("p");
    p.textContent = "Collez le JSON exporté. Les événements portant le même identifiant seront remplacés.";
    zone = document.createElement("textarea");
    zone.placeholder = '{ "evenements": [ … ] }';
    zone.style.minHeight = "150px";
    corps.appendChild(p); corps.appendChild(zone);
  }, [{ libelle: "Annuler" }, { libelle: "Importer", genre: "primaire", action: () => {
    let lu;
    try { lu = JSON.parse(zone.value); }
    catch (e) { zone.style.borderColor = "var(--rouge)"; return false; }
    const liste = Array.isArray(lu) ? lu : (lu.evenements || []);
    if (!liste.length){ zone.style.borderColor = "var(--rouge)"; return false; }
    liste.forEach(n => {
      const i = DONNEES.evenements.findIndex(x => x.id === n.id);
      if (i >= 0) DONNEES.evenements[i] = n; else DONNEES.evenements.push(n);
    });
    if (!selection) selection = DONNEES.evenements[0].id;
    enregistre(); dessine();
  } }]);
};

$("btnNouveau").onclick = () =>
  demande("Nouvel événement", "Nom de l’événement", "", nom => nouvelEvenement(nom));

/* thème */
const CLE_THEME = "console-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sombre = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = sombre ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(CLE_THEME, next); } catch (e) {}
};

/* ============================================================
   Rendu
   ============================================================ */
function dessine(){
  const n = DONNEES.evenements.length;
  const p = DONNEES.evenements.filter(e => e.etat === "publie").length;
  $("sousTitre").textContent = n
    ? n + (n > 1 ? " événements" : " événement") + " · " + p + " publié" + (p > 1 ? "s" : "")
    : "";
  dessineRail();
  dessineFiche();
}

dessine();
