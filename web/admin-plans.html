<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="config.js"></script>

<link rel="stylesheet" href="console.css">

<div class="app">
  <header class="topbar">
    <h1>Console des plans</h1>
    <!-- Le salon se choisit ici, comme sur la page de rapport. La liste ne
         porte que les salons auxquels le compte a droit : c'est la base qui la
         borne — `acces_salon()` — et non cette page, qui ne fait qu'afficher
         ce qu'elle reçoit. -->
    <select id="choixEvt" aria-label="Salon"></select>
    <span class="etat" id="etatEvt" hidden></span>
    <button class="icone" id="btnRecharger" title="Recharger depuis le serveur" aria-label="Recharger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <!-- Créer un salon est le fait de l'administrateur : le bouton part caché
         et ne paraît qu'une fois le profil lu. -->
    <button class="btn petit primaire" id="btnNouveau" hidden>Nouveau</button>
    <span class="statut" id="statut" role="status" aria-live="polite"></span>
    <!-- Tout ce qui commande vit dans cette barre, salon et console mêlés :
         une seconde rangée de boutons en tête de fiche faisait deux endroits
         où chercher, et deux lignes là où une suffit. Les deux sorties vers le
         plan restent à découvert — ce sont elles qu'on vient chercher — et le
         reste se déplie. -->
    <div class="droite">
      <a class="btn petit" id="lienPublic" target="_blank" rel="noopener" hidden>Plan public<span class="ext" aria-hidden="true">↗</span></a>
      <a class="btn petit" id="lienAdmin" target="_blank" rel="noopener" hidden>Administration<span class="ext" aria-hidden="true">↗</span></a>
      <details class="menu">
        <summary class="btn petit">Actions</summary>
        <div class="menu-pan">
          <a class="mitem" id="lienRapport" data-portee="salon">Rapport d'utilisation</a>
          <button class="mitem" id="btnExcel" data-portee="salon" title="Un classeur : une ligne par exposant, une colonne par provenance, depuis le début">Export Excel des exposants</button>
          <button class="mitem" id="btnSources" data-portee="salon">Sources de données</button>
          <button class="mitem" id="btnEtat" data-portee="salon"></button>
          <button class="mitem" id="btnDupliquer" data-portee="salon">Dupliquer l'événement</button>
          <button class="mitem danger" id="btnSupprimer" data-portee="salon">Supprimer l'événement</button>
          <hr id="sepActions">
          <button class="mitem" id="btnComptes" hidden>Comptes et accès</button>
          <button class="mitem" id="btnProjet">Adresse du projet…</button>
          <button class="mitem" id="btnExport">Copier les données (JSON)</button>
        </div>
      </details>
      <!-- Le compte, sous les initiales de son adresse. Le thème y descend :
           il se règle une fois, et occupait la barre en permanence pour cela.
           La sortie, elle, n'avait aucun bouton — on fermait l'onglet, et la
           session restait ouverte sur le poste. -->
      <details class="menu compte">
        <summary class="avatar" id="btnCompte" title="Compte" aria-label="Compte"><span id="initiales">··</span></summary>
        <div class="menu-pan">
          <div class="mtete">
            <span class="eyebrow">Connecté</span>
            <span id="compteMail">—</span>
          </div>
          <hr>
          <button class="mitem" id="btnTheme">Thème sombre</button>
          <button class="mitem danger" id="btnSortir">Se déconnecter</button>
        </div>
      </details>
    </div>
  </header>

  <main class="fiche" id="fiche"></main>
</div>
<div class="modale" id="modale">
  <div class="mfen" role="dialog" aria-modal="true">
    <header><h3 id="mTitre"></h3><button id="mFermer" aria-label="Fermer">&times;</button></header>
    <div class="mcorps" id="mCorps"></div>
    <footer id="mPied"></footer>
  </div>
</div>

<script>
/* ============================================================
   Socle commun de la console et du rapport — accès au projet
   Tout passe par l'API REST de Supabase. La clé publique et l'adresse du
   projet sont demandées au premier lancement puis conservées sur le poste :
   elles n'ont pas à vivre dans le dépôt, et changent selon l'environnement.
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CLE_CFG = "console-config";
const CLE_SESSION = "console-session";

let CFG = null, SESSION = null;
try { CFG = JSON.parse(localStorage.getItem(CLE_CFG) || "null"); } catch (e) {}
try { SESSION = JSON.parse(localStorage.getItem(CLE_SESSION) || "null"); } catch (e) {}
if (window.PLAN_CONFIG && !CFG) CFG = window.PLAN_CONFIG;

/* ------------------------------------------------------------------
   Appels

   Un jeton d'accès ne vaut qu'une heure ; la console, elle, reste ouverte la
   journée. Celui que la connexion posait périmait donc sur place, et tout ce
   qui partait ensuite revenait refusé : la table déconnectait sans prévenir,
   et les fonctions n'affichaient qu'« Erreur 401 » — au milieu d'une
   invitation, le mot ne dit rien de ce qu'il faut faire. Le jeton de
   renouvellement arrivait pourtant avec lui à la connexion, et dormait.
   ------------------------------------------------------------------ */
function entetes(json) {
  const h = { "apikey": CFG.anonKey };
  if (SESSION?.access_token) h["Authorization"] = "Bearer " + SESSION.access_token;
  if (json) h["Content-Type"] = "application/json";
  return h;
}

/** La charge utile d'un jeton. Elle se lit sans le serveur — seule la
 *  signature demande sa clé, et c'est lui qui la vérifiera à chaque appel. */
function contenuJeton(jeton) {
  try {
    const p = String(jeton || "").split(".")[1];
    if (!p) return null;
    return JSON.parse(atob(p.replace(/-/g, "+").replace(/_/g, "/")));
  } catch (e) { return null; }
}

/** Secondes restantes au jeton. Illisible, on le suppose bon : le serveur
 *  tranchera, et son refus déclenchera le renouvellement. */
function resteJeton() {
  const exp = contenuJeton(SESSION?.access_token)?.exp;
  return typeof exp === "number" ? exp - Date.now() / 1000 : Infinity;
}

/* Un renouvellement à la fois. La console lance ses appels de front — le
   profil, les salons, les plans — et un jeton de renouvellement ne sert qu'une
   fois : trois échanges simultanés en perdraient deux, et la session avec. */
let renouvellement = null;

function renouvelle() {
  if (!SESSION?.refresh_token) return Promise.resolve(false);
  if (!renouvellement) {
    renouvellement = (async () => {
      try {
        const r = await fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: SESSION.refresh_token }),
        });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.access_token) return false;
        SESSION = j;
        // un stockage refusé ne doit pas coûter la session en cours
        try { localStorage.setItem(CLE_SESSION, JSON.stringify(SESSION)); } catch (e) {}
        return true;
      } catch (e) {
        // une coupure du réseau n'est pas une session finie : on ne déconnecte pas
        return false;
      } finally {
        renouvellement = null;
      }
    })();
  }
  return renouvellement;
}

/**
 * Un appel au projet, jeton frais en main : échangé avant de partir s'il
 * touche à sa fin, échangé puis l'appel refait s'il est refusé malgré tout.
 *
 * Le 403 reste où il est : c'est un droit qui manque, pas un jeton qui se
 * périme, et le renouveler ne le donnerait pas.
 */
async function appel(url, options = {}) {
  const envoie = () => fetch(url, {
    ...options,
    headers: { ...entetes(!!options.body), ...(options.headers || {}) },
  });
  if (SESSION?.access_token && resteJeton() < 60) await renouvelle();
  const r = await envoie();
  if (r.status !== 401 || !SESSION?.refresh_token) return r;
  return (await renouvelle()) ? envoie() : r;
}

async function rest(chemin, options = {}) {
  const r = await appel(CFG.url + "/rest/v1/" + chemin, options);
  if (r.status === 401 || r.status === 403) {
    deconnecte("Session expirée, reconnectez-vous.");
    throw new Error("Non autorisé.");
  }
  const txt = await r.text();
  let corps = null;
  try { corps = txt ? JSON.parse(txt) : null; } catch (e) { corps = { message: txt }; }
  if (!r.ok) {
    const d = [corps?.message, corps?.details, corps?.hint].filter(Boolean).join(" — ");
    throw new Error(d || "Erreur " + r.status + " sur " + chemin);
  }
  return corps;
}

/* ------------------------------------------------------------------
   Fenêtres
   ------------------------------------------------------------------ */
// Une fenêtre de réglage doit rafraîchir son résumé en se fermant, et elle se
// ferme de quatre façons : le bouton, la croix, l'arrière-plan, la touche
// Échap. D'où un rappel porté par la fermeture plutôt que par le bouton.
let apresModale = null;

/* Le rappel ne joue qu'une fois, et il joue toujours : une fenêtre remplacée
   par une autre — « Inviter quelqu'un » qui pose la fiche par-dessus la liste —
   n'est pas fermée, mais ce qu'elle tenait doit quand même être rendu. Écraser
   le rappel au lieu de le jouer laissait `hote` pointer sur un corps de fenêtre
   déjà réemployé, et la liste des comptes, en arrivant, effaçait le formulaire
   d'invitation en cours de saisie. */
function verseModale() {
  const f = apresModale;
  apresModale = null;
  if (f) f();
}

function ouvreModale(titre, remplit, boutons, apres) {
  verseModale();
  modaleVerrou = false;
  apresModale = apres || null;
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplit($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach((b) => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action && b.action() === false) return; fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
/* Une fenêtre qui rend compte d'un travail en cours ne se ferme pas d'un clic
   à côté ni d'une touche Échap : la synchronisation, elle, continuerait sans
   personne pour la suivre, et son compte rendu serait perdu. Verrouillée, elle
   ne cède qu'à la croix et au bouton — deux gestes qu'on ne fait pas par
   mégarde. */
let modaleVerrou = false;
const verrouilleModale = (oui) => { modaleVerrou = !!oui; };

const fermeModale = () => {
  modaleVerrou = false;
  $("modale").classList.remove("open");
  verseModale();
};
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", (e) => {
  if (e.target === $("modale") && !modaleVerrou) fermeModale();
});
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !modaleVerrou) fermeModale();
});

function demande(titre, libelle, valeur, suite) {
  let champ;
  ouvreModale(titre, (corps) => {
    const l = document.createElement("label");
    l.innerHTML = "<span></span><input>";
    l.querySelector("span").textContent = libelle;
    champ = l.querySelector("input");
    champ.value = valeur || "";
    corps.appendChild(l);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const v = champ.value.trim();
        if (v) { fermeModale(); suite(v); }
      }
    };
  }, [{ libelle: "Annuler" },
      { libelle: "Valider", genre: "primaire",
        action: () => { const v = champ.value.trim(); if (!v) return false; suite(v); } }]);
}

function confirme(titre, message, libelleOui, action) {
  ouvreModale(titre, (corps) => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [{ libelle: "Annuler" }, { libelle: libelleOui, genre: "danger", action }]);
}

/* ------------------------------------------------------------------
   Configuration et connexion
   ------------------------------------------------------------------ */
function ecranConfig() {
  let url, cle;
  ouvreModale("Connexion au projet", (corps) => {
    const p = document.createElement("p");
    p.innerHTML = "L'adresse de l'<strong>API</strong> du projet, en " +
      "<code>.supabase.co</code> — pas celle du tableau de bord. La clé publique " +
      "est faite pour circuler côté navigateur : c'est son rôle. Ne mettez jamais " +
      "ici la clé de service.";
    const l1 = document.createElement("label");
    l1.innerHTML = "<span>Adresse du projet</span><input placeholder='https://xxxx.supabase.co'>";
    const l2 = document.createElement("label");
    l2.innerHTML = "<span>Clé publique (anon)</span><input placeholder='eyJhbGciOi…'>";
    corps.append(p, l1, l2);
    url = l1.querySelector("input");
    cle = l2.querySelector("input");
    url.value = CFG?.url || "";
    cle.value = CFG?.anonKey || "";
    p.hidden = !!(CFG?.url && CFG?.anonKey);
    setTimeout(() => url.focus(), 30);
  }, [{ libelle: "Valider", genre: "primaire", action: () => {
    const u = url.value.trim().replace(/\/+$/, ""), k = cle.value.trim();
    if (!u || !k) return false;
    CFG = { url: u, anonKey: k };
    localStorage.setItem(CLE_CFG, JSON.stringify(CFG));
    ecranConnexion();
  } }]);
}

/**
 * L'adresse du tableau de bord et celle de l'API se ressemblent assez pour
 * qu'on les confonde. On accepte les deux formes et on retient la bonne.
 *   tableau de bord : https://supabase.com/dashboard/project/<ref>
 *   API             : https://<ref>.supabase.co
 * Écrit sans expression régulière : la lecture y gagne, et le fichier ne
 * dépend d'aucun échappement.
 */
function normaliseUrl(saisie) {
  let u = String(saisie || "").trim();
  while (u.length && u[u.length - 1] === "/") u = u.slice(0, -1);
  if (!u) return "";

  const marque = "supabase.com/dashboard/project/";
  const i = u.toLowerCase().indexOf(marque);
  if (i >= 0) {
    const ref = u.slice(i + marque.length).split("/")[0].split("?")[0];
    if (ref) return "https://" + ref + ".supabase.co";
  }

  // la seule référence du projet, sans point ni protocole
  if (u.indexOf(".") < 0 && u.indexOf(":") < 0) return "https://" + u + ".supabase.co";

  if (u.slice(0, 4).toLowerCase() !== "http") u = "https://" + u;
  return u;
}

function ecranConnexion(message) {
  let mail, mdp, msg;
  ouvreModale("Connexion", (corps) => {
    const l1 = document.createElement("label");
    l1.innerHTML = "<span>Adresse e-mail</span><input type='email' autocomplete='username'>";
    const l2 = document.createElement("label");
    l2.innerHTML = "<span>Mot de passe</span><input type='password' autocomplete='current-password'>";
    msg = document.createElement("p");
    msg.style.color = "var(--rouge)";
    if (message) msg.textContent = message;
    corps.append(l1, l2, msg);
    mail = l1.querySelector("input");
    mdp = l2.querySelector("input");
    setTimeout(() => mail.focus(), 30);
    mdp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); tente(); } };
    const info = document.createElement("p");
    info.className = "aide";
    info.style.marginTop = "-4px";
    info.textContent = "Projet : " + (CFG?.url || "non configuré");
    corps.appendChild(info);
  }, [{ libelle: "Changer de projet", action: () => { ecranConfig(); } },
      { libelle: "Mot de passe oublié", action: () => { location.href = PAGE_MDP; } },
      { libelle: "Se connecter", genre: "primaire", action: () => { tente(); return false; } }]);

  async function tente() {
    msg.textContent = "Connexion…";
    msg.style.color = "var(--ink-3)";
    try {
      const url = CFG.url;
      const r = await fetch(url + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ email: mail.value.trim(), password: mdp.value }),
      });
      // Une réponse vide ne doit pas ressortir en « Unexpected end of JSON
      // input » : on lit le texte, puis on tente de l'interpréter.
      const txt = await r.text();
      let j = {};
      try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { msg: txt.slice(0, 120) }; }
      if (!r.ok) {
        throw new Error((j.error_description || j.msg || "Identifiants refusés.") +
          " (HTTP " + r.status + ")");
      }
      if (!j.access_token) {
        throw new Error("Réponse inattendue de " + url + " — HTTP " + r.status +
          (txt ? "" : ", corps vide") + ". Vérifiez l'adresse du projet.");
      }
      SESSION = j;
      localStorage.setItem(CLE_SESSION, JSON.stringify(SESSION));
      fermeModale();
      demarre();
    } catch (e) {
      msg.style.color = "var(--rouge)";
      msg.textContent = e.message;
    }
  }
}

/**
 * Fin de session. Ce qu'il faut effacer à l'écran dépend de la page : la
 * console vide sa liste d'événements, le rapport ses chiffres. Chacune le dit
 * en définissant `videEcran`.
 */
function deconnecte(message) {
  SESSION = null;
  // un stockage refusé ne doit pas priver l'exploitant de l'écran de connexion
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
  if (typeof videEcran === "function") videEcran();
  ecranConnexion(message);
}

/* Le message va dans la barre du haut, qui existe toujours, et en écho dans
   la fiche quand elle est ouverte. Une erreur avalée est pire qu'une erreur. */
let effaceur;
function signale(txt, erreur) {
  const s = $("statut");
  if (s) {
    s.className = "statut " + (erreur ? "err" : "ok");
    s.textContent = txt;
    clearTimeout(effaceur);
    if (!erreur) effaceur = setTimeout(() => { s.textContent = ""; s.className = "statut"; }, 6000);
  }
  const m = $("msgSync");
  if (m) { m.className = erreur ? "err" : "ok"; m.textContent = txt; }
  if (erreur) console.error("[console]", txt);
}

/* ------------------------------------------------------------------
   Briques d'affichage
   ------------------------------------------------------------------ */
/**
 * Un bloc de la fiche : son intitulé, et à droite ce qui se compte sans le lire
 * — « 1 pavillon · 1 publié ». La note est facultative ; les blocs qui n'ont
 * rien à compter n'en portent pas.
 */
const bloc = (titre, note) => {
  const d = document.createElement("div");
  d.className = "bloc";
  const h = document.createElement("div");
  h.className = "bloc-hd";
  const t = document.createElement("span");
  t.className = "eyebrow";
  t.textContent = titre;
  h.appendChild(t);
  if (note) {
    const n = document.createElement("span");
    n.className = "note";
    n.textContent = note;
    h.appendChild(n);
  }
  d.appendChild(h);
  return d;
};
const grille = () => { const d = document.createElement("div"); d.className = "grille"; return d; };

/* Un menu déplié se referme sur un clic ailleurs et sur Échap : sans cela il
   resterait ouvert au-dessus de la fiche, et rien ne dirait comment le fermer. */
document.addEventListener("click", (ev) => {
  document.querySelectorAll("details.menu[open]").forEach((d) => {
    if (!d.contains(ev.target) || ev.target.closest(".menu-pan")) d.open = false;
  });
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  document.querySelectorAll("details.menu[open]").forEach((d) => d.open = false);
});

/** Adresse de base des pages, déduite de celle de la console. */
const BASE_PAGES = location.origin + location.pathname.replace(/[^/]*$/, "");

/* La page qui pose un mot de passe, qu'on y arrive par une invitation, par un
   oubli, ou depuis un écran de connexion. Elle est servie sans extension par
   Cloudflare, comme les autres. */
const PAGE_MDP = BASE_PAGES + "motdepasse";

/* Même repli que sur la racine, pour le cas où le « Site URL » du projet
   désigne la console : un jeton de mot de passe n'a rien à faire ici, et
   l'écran de connexion serait une impasse pour celui qui l'apporte. */
(() => {
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const type = h.get("type") || q.get("type") || "";
  const jeton = (h.get("access_token") || q.get("token_hash") || q.get("token")) &&
    (type === "recovery" || type === "invite" || type === "signup");
  if (jeton || h.get("error_description") || q.get("error_description")) {
    location.replace(PAGE_MDP + location.search + location.hash);
  }
})();

/**
 * L'identifiant du compte connecté, lu dans le jeton.
 *
 * Il y est déjà — c'est le champ `sub` — et le demander au serveur coûterait
 * un aller-retour à chaque chargement pour une donnée que le navigateur tient
 * en main.
 */
const idCompte = () => contenuJeton(SESSION?.access_token)?.sub || null;

/* ------------------------------------------------------------------
   Thème
   ------------------------------------------------------------------ */
const CLE_THEME = "console-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}

/* Sans réglage enregistré, le thème est celui du système : c'est lui qu'il
   faut interroger pour savoir vers quoi bascule le bouton. */
const themeSombre = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  return cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};

$("btnTheme").onclick = () => {
  const next = themeSombre() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(CLE_THEME, next); } catch (e) {}
};

/* ------------------------------------------------------------------
   Compte
   ------------------------------------------------------------------ */
/**
 * Les initiales de l'adresse : « korantin.vey@… » donne « KV », « alexandra@… »
 * donne « AL ». Le profil porte bien un nom, mais il arrive après le premier
 * dessin de la barre, et parfois pas du tout — l'adresse, elle, est dans le
 * jeton qu'on tient déjà.
 */
function initialesDe(mail) {
  const local = String(mail || "").split("@")[0];
  const mots = local.split(/[.\-_+]+/).filter(Boolean);
  if (mots.length >= 2) return (mots[0][0] + mots[1][0]).toUpperCase();
  return (local.slice(0, 2) || "··").toUpperCase();
}

/* Le panneau se remplit à l'ouverture, jamais au chargement : la session peut
   arriver après — on vient de se connecter — et l'ouverture est le seul moment
   où l'on est sûr d'avoir quelque chose de juste à montrer. */
const menuCompte = document.querySelector("details.menu.compte");
if (menuCompte) {
  menuCompte.addEventListener("toggle", () => {
    if (!menuCompte.open) return;
    const mail = contenuJeton(SESSION?.access_token)?.email || "";
    $("initiales").textContent = mail ? initialesDe(mail) : "··";
    $("compteMail").textContent = mail || "session inconnue";
    // le libellé annonce où l'on va, pas où l'on est
    $("btnTheme").textContent = themeSombre() ? "Thème clair" : "Thème sombre";
  });
  $("btnSortir").onclick = () => {
    menuCompte.open = false;
    deconnecte();
  };
}

/* ============================================================
   Classeur — écrire un vrai fichier Excel, sans bibliothèque

   L'organisateur veut rendre des comptes à ses exposants, et il le fait dans
   un tableur : c'est là qu'il trie, filtre, et colle la ligne d'un exposant
   dans le courriel qu'il lui envoie. Un CSV l'aurait servi à moitié — Excel y
   devine le séparateur de travers une fois sur deux, selon la langue du poste,
   et un nombre s'y lit comme du texte.

   Pourquoi rien n'est chargé d'ailleurs : la console est servie telle quelle
   par Cloudflare, sans étape de construction ; une dépendance ajoutée ici
   serait un script tiers de plus dans une page d'administration. Or un `.xlsx`
   est une archive ZIP de quelques fichiers XML, et une archive sans
   compression n'a besoin que d'un CRC32. Cela tient en deux cents lignes,
   qu'on relit, plutôt qu'en trois cents kilo-octets qu'on ne relit pas.

   Ce qu'il sait faire, et rien de plus : une feuille, une ligne d'en-têtes en
   gras et figée, des colonnes larges à la demande, du texte et des nombres.
   ============================================================ */

/**
 * CRC32, table précalculée.
 *
 * Le calcul bit à bit suffirait, mais l'archive fait le mégaoctet sur un gros
 * salon : huit millions de tours de boucle se sentent sur un poste modeste, et
 * la table les divise par huit pour deux cent cinquante-six entiers.
 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/**
 * Une archive ZIP, entrées rangées sans compression.
 *
 * Déflater économiserait les trois quarts du fichier — un classeur XML se
 * comprime très bien — mais demanderait `CompressionStream`, donc un chemin de
 * repli pour les navigateurs qui ne l'ont pas, donc deux codes à maintenir
 * pour un fichier qu'on ouvre et qu'on jette. Un mégaoctet enregistré depuis
 * la console de son propre salon ne coûte rien à personne.
 */
function archiveZip(fichiers){
  const enc = new TextEncoder();
  const d = new Date();
  const heureDos = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dateDos = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

  const p16 = (t, n) => t.push(n & 255, (n >> 8) & 255);
  const p32 = (t, n) => t.push(n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255);

  const morceaux = [], index = [];
  let pos = 0;
  for (const f of fichiers){
    const nom = enc.encode(f.nom), data = enc.encode(f.texte);
    const somme = crc32(data);
    const tete = [];
    p32(tete, 0x04034b50);
    p16(tete, 20);            // version minimale : rangé sans compression
    p16(tete, 0x0800);        // noms en UTF-8
    p16(tete, 0);             // méthode : rangé
    p16(tete, heureDos); p16(tete, dateDos);
    p32(tete, somme); p32(tete, data.length); p32(tete, data.length);
    p16(tete, nom.length); p16(tete, 0);
    morceaux.push(new Uint8Array(tete), nom, data);
    index.push({ nom: nom, somme: somme, taille: data.length, pos: pos });
    pos += tete.length + nom.length + data.length;
  }

  const centre = [];
  for (const e of index){
    p32(centre, 0x02014b50);
    p16(centre, 20); p16(centre, 20);
    p16(centre, 0x0800); p16(centre, 0);
    p16(centre, heureDos); p16(centre, dateDos);
    p32(centre, e.somme); p32(centre, e.taille); p32(centre, e.taille);
    p16(centre, e.nom.length); p16(centre, 0); p16(centre, 0);
    p16(centre, 0); p16(centre, 0); p32(centre, 0);
    p32(centre, e.pos);
    centre.push(...e.nom);
  }
  const fin = [];
  p32(fin, 0x06054b50);
  p16(fin, 0); p16(fin, 0);
  p16(fin, index.length); p16(fin, index.length);
  p32(fin, centre.length); p32(fin, pos);
  p16(fin, 0);

  morceaux.push(new Uint8Array(centre), new Uint8Array(fin));
  return new Blob(morceaux, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* ------------------------------------------------------------------
   Le classeur
   ------------------------------------------------------------------ */
/* Un nom d'exposant vient d'un fournisseur, et rien n'y interdit un caractère
   de commande. XML 1.0 les refuse : Excel n'ouvrirait pas le fichier, et
   l'erreur ne dirait pas pourquoi. On les retire avant d'échapper le reste. */
const texteXml = (v) => esc(String(v == null ? "" : v).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ""));

/** « A », « B », … « AA » : la référence d'une colonne, à partir de 1. */
function colonneXl(n){
  let s = "";
  while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
  return s;
}

/* Le squelette d'un classeur d'une feuille. Rien n'y varie que la feuille
   elle-même : ces quatre parties sont les mêmes d'un export à l'autre. */
const XL_DECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
const XL_NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const XL_NS_REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const XL_PARTS = (feuille, titre) => [
  { nom: "[Content_Types].xml", texte: XL_DECL +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>' },
  { nom: "_rels/.rels", texte: XL_DECL +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + XL_NS_REL + '/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>' },
  { nom: "xl/workbook.xml", texte: XL_DECL +
    '<workbook xmlns="' + XL_NS + '" xmlns:r="' + XL_NS_REL + '">' +
    '<sheets><sheet name="' + texteXml(titre) + '" sheetId="1" r:id="rId1"/></sheets>' +
    '</workbook>' },
  { nom: "xl/_rels/workbook.xml.rels", texte: XL_DECL +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + XL_NS_REL + '/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="' + XL_NS_REL + '/styles" Target="styles.xml"/>' +
    '</Relationships>' },
  /* Deux styles : ordinaire, et gras pour la ligne d'en-têtes. Les listes de
     polices, remplissages et bordures ne servent à rien ici, mais Excel refuse
     un classeur dont la feuille de styles n'en porte aucune. */
  { nom: "xl/styles.xml", texte: XL_DECL +
    '<styleSheet xmlns="' + XL_NS + '">' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>' },
  { nom: "xl/worksheets/sheet1.xml", texte: feuille },
];

/**
 * Une feuille, à partir de colonnes et de lignes.
 *
 *   colonnes : [{ titre, largeur }]  — la largeur est en caractères
 *   lignes   : [[valeur, …]]         — nombre ou texte, dans l'ordre des colonnes
 *
 * Les textes sont écrits en clair dans la cellule plutôt que renvoyés à une
 * table de chaînes partagées : celle-ci économiserait la place sur des valeurs
 * répétées, et il n'y en a pas ici — un nom d'exposant ne paraît qu'une fois.
 *
 * Une cellule vide est omise, pas écrite vide : c'est ce qu'attend le format,
 * et cela retire un tiers du fichier sur un salon où la plupart des canaux
 * sont à zéro.
 */
function feuilleXl(colonnes, lignes){
  const derniere = colonneXl(colonnes.length);
  const cellule = (col, rang, v, style) => {
    if (v === "" || v == null) return "";
    const r = ' r="' + colonneXl(col) + rang + '"' + (style ? ' s="' + style + '"' : "");
    return typeof v === "number" && isFinite(v)
      ? "<c" + r + "><v>" + v + "</v></c>"
      : '<c' + r + ' t="inlineStr"><is><t xml:space="preserve">' + texteXml(v) + "</t></is></c>";
  };
  const corps = [
    "<row r=\"1\">" + colonnes.map((c, i) => cellule(i + 1, 1, c.titre, 1)).join("") + "</row>",
  ];
  lignes.forEach((l, i) => {
    corps.push('<row r="' + (i + 2) + '">' +
      colonnes.map((c, j) => cellule(j + 1, i + 2, l[j])).join("") + "</row>");
  });
  const etendue = "A1:" + derniere + (lignes.length + 1);
  return XL_DECL +
    '<worksheet xmlns="' + XL_NS + '">' +
    '<dimension ref="' + etendue + '"/>' +
    /* L'en-tête reste à l'écran : un salon aligne neuf cents lignes, et sans
       cela on ne sait plus au bout de trente ce que compte la colonne G. */
    '<sheetViews><sheetView workbookViewId="0">' +
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
    "</sheetView></sheetViews>" +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    "<cols>" + colonnes.map((c, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' +
      (c.largeur || 12) + '" customWidth="1"/>').join("") + "</cols>" +
    "<sheetData>" + corps.join("") + "</sheetData>" +
    // les filtres posés d'avance : c'est le premier geste de qui reçoit ce fichier
    '<autoFilter ref="' + etendue + '"/>' +
    "</worksheet>";
}

/** Le classeur complet, prêt à enregistrer. */
const classeurXl = (titre, colonnes, lignes) =>
  archiveZip(XL_PARTS(feuilleXl(colonnes, lignes), titre));

/**
 * Proposer un fichier à l'enregistrement.
 *
 * L'adresse temporaire est révoquée après coup : sans cela le classeur — un
 * mégaoctet — resterait en mémoire tant que l'onglet vit, et la console reste
 * ouverte la journée. Le délai laisse au navigateur le temps de lire l'adresse
 * avant qu'elle ne disparaisse.
 */
function enregistreFichier(blob, nom){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* ============================================================
   Export par exposant — une ligne par stand, une colonne par provenance

   Les chiffres du rapport disent ce qu'a fait le salon ; celui-ci dit ce qu'a
   recueilli chaque exposant. C'est le tableau qu'on n'affiche nulle part —
   neuf cents lignes sur quinze colonnes ne se lisent pas dans une page — et
   qu'on donne à trier, filtrer et découper dans un tableur. C'est aussi ce
   qu'un organisateur recolle dans le courriel qu'il envoie à son exposant.

   Le module vit à part parce que deux écrans l'ouvrent : la console, où il est
   une action du salon ouvert, et le rapport, où il suit la période affichée.
   Recopié dans les deux, il aurait divergé — et ces deux boutons doivent
   rendre le même fichier.

   Les chiffres sont ceux de la carte de chaleur, au sens strict : même
   fonction, `audience_cibles`, même balayage du même compteur. Elle ne peint
   qu'un nombre par stand, le tableur en aligne quinze colonnes — c'est à quoi
   sert « p_complet » — mais aucun des deux ne recalcule ce que l'autre a déjà
   compté.
   ============================================================ */
const nb = (n) => Number(n || 0).toLocaleString("fr-FR");

/* Par quel chemin une fiche s'est ouverte. L'ordre est celui de la lecture, et
   la liste sert aussi bien aux barres du rapport qu'aux colonnes du classeur :
   les deux nomment les mêmes canaux, il n'y a pas deux vocabulaires. */
const CANAUX_STAND = [
  ["recherche", "Recherche"],
  ["plan", "Clic sur le plan"],
  ["image", "Clic sur un logo ou une image"],
  ["conference", "Nom cité par une conférence"],
  ["liste", "Liste du pavillon"],
  ["parcours", "Programme de visite"],
  ["suggestion", "Proposé pour compléter une visite"],
  ["lien", "Lien direct"],
];
const AUTRE = ["autre", "Autre"];

/** Ce qui encadre le détail par canal. */
const COL_TETE = [
  { titre: "Emplacement", largeur: 14, lit: (r) => r.code || "" },
  { titre: "Exposant", largeur: 38, lit: (r) => r.nom || "" },
  { titre: "Fiches ouvertes", largeur: 16, lit: (r) => Number(r.n) || 0 },
];
const COL_PIED = [
  { titre: "Itinéraires calculés", largeur: 20, lit: (r) => Number(r.itineraires) || 0 },
  { titre: "Ajouts au programme de visite", largeur: 29, lit: (r) => Number(r.parcours) || 0 },
  /* Dont ceux venus de la suggestion — une colonne à part et non une part du
     total : c'est le seul chiffre qui dise si proposer un exposant de plus a
     servi, et le déduire de la colonne d'à côté demanderait de savoir qu'il en
     fait partie. */
  { titre: "Ajouts depuis une suggestion", largeur: 27,
    lit: (r) => Number(r.suggestions) || 0 },
  { titre: "Total interactions", largeur: 18,
    lit: (r) => (Number(r.n) || 0) + (Number(r.itineraires) || 0) + (Number(r.parcours) || 0) },
];

/**
 * Les colonnes, canaux compris.
 *
 * Les canaux connus paraissent tous, même vides — une colonne « clic sur un
 * logo » à zéro renseigne, elle dit qu'aucun logo n'a été posé — et dans le
 * même ordre qu'à l'écran. Un canal inconnu de cette page, ajouté depuis, prend
 * la suite sous son nom brut plutôt que de disparaître de la somme.
 */
function colonnesExport(lignes) {
  const canaux = CANAUX_STAND.concat([AUTRE]);
  const inconnus = new Set();
  lignes.forEach((r) => Object.keys(r.canaux || {}).forEach((c) => {
    if (!canaux.some((x) => x[0] === c)) inconnus.add(c);
  }));
  [...inconnus].sort().forEach((c) => canaux.push([c, c]));
  return COL_TETE.concat(
    canaux.map(([cle, lib]) => ({
      titre: "Ouvertures · " + lib.charAt(0).toLowerCase() + lib.slice(1),
      largeur: Math.min(36, Math.max(15, lib.length + 13)),
      lit: (r) => (r.canaux || {})[cle] || 0,
    })),
    COL_PIED);
}

/** La période en toutes lettres, depuis le nombre de jours demandé. */
const libellePeriode = (jours) =>
  jours ? jours + " derniers jours" : "depuis le début";

/* Le nom porte le salon et la période : deux exports de suite dans le même
   dossier ne doivent ni se recouvrir ni se confondre une fois détachés de la
   page qui les a produits. */
function nomFichierExport(e, jours) {
  return ("utilisation-" + (e?.slug || "salon") +
    "-" + (jours ? jours + "j" : "tout") +
    "-" + new Date().toISOString().slice(0, 10) + ".xlsx")
    .replace(/[^A-Za-z0-9._-]+/g, "-");
}

/* Le nom de la feuille redit la période : le fichier voyage seul, souvent
   jusqu'à l'exposant, et rien d'autre à l'intérieur ne dirait ce qu'il couvre.
   Excel refuse au-delà de trente et un caractères, et refuse `[]:*?/\`. */
const nomFeuilleExport = (jours) =>
  ("Exposants (" + libellePeriode(jours) + ")")
    .replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31);

/**
 * Fabriquer le classeur, et le proposer à l'enregistrement.
 *
 * Le bouton et la période viennent de l'appelant : la console n'a pas de
 * sélecteur de période — elle exporte tout — quand le rapport suit celle qu'il
 * affiche. Le reste est identique, et c'est bien l'objet de ce module.
 *
 * Il se charge au clic, jamais à l'ouverture de la page : c'est un appel de
 * plusieurs centaines de kilo-octets, et la plupart des visites n'en veulent
 * pas.
 */
let _export = false;
async function exporteExposants(bouton, jours) {
  if (_export || !selection) return;
  const e = courant(), libelle = bouton ? bouton.textContent : "";
  _export = true;
  if (bouton) { bouton.disabled = true; bouton.textContent = "Préparation…"; }
  /* Dit tout de suite, car le menu d'où part souvent ce clic se referme
     aussitôt : sans cela rien ne bougerait à l'écran pendant l'appel. */
  signale("Préparation du classeur…");
  try {
    const r = await rest("rpc/audience_cibles", {
      method: "POST",
      body: JSON.stringify({
        p_evenement: selection,
        p_jours: jours || null,
        p_genre: "fiche_stand",
        p_complet: true,
      }),
    });
    const lignes = (r && r.cibles) || [];
    /* Aucun exposant n'est un renseignement, pas une panne : le salon n'a
       jamais été synchronisé, et c'est ce qu'il faut dire. */
    if (!lignes.length) {
      signale("Aucun exposant à exporter : ce salon n'a pas encore été synchronisé.", true);
      return;
    }
    const cols = colonnesExport(lignes);
    enregistreFichier(
      classeurXl(nomFeuilleExport(jours), cols, lignes.map((r2) => cols.map((c) => c.lit(r2)))),
      nomFichierExport(e, jours));
    const s = lignes.length > 1 ? "s" : "";
    signale(nb(lignes.length) + " exposant" + s + " exporté" + s +
            " (" + libellePeriode(jours) + ").");
  } catch (err) {
    signale(err.message, true);
  } finally {
    _export = false;
    if (bouton) { bouton.disabled = false; bouton.textContent = libelle; }
  }
}

const RYTHMES = [[0, "Manuel uniquement"], [15, "Toutes les 15 minutes"],
                 [60, "Toutes les heures"], [360, "Toutes les 6 heures"],
                 [1440, "Une fois par jour"]];

let EVTS = [], selection = null, PLANS = {};


/**
 * Ce qu'il faut dire d'une fonction qui refuse.
 *
 * Deux refus portent le même numéro sans venir du même endroit. La fonction
 * s'explique dans `erreur` ; la passerelle, elle, écarte les jetons qu'elle
 * juge périmés avant même de l'appeler, et nomme son champ autrement. Faute de
 * lire les deux, un « Erreur 401 » nu tenait lieu d'explication — et la
 * session, elle, restait ouverte sur un jeton qui ne valait plus rien.
 */
async function refus(r) {
  const j = await r.json().catch(() => ({}));
  /* Le jeton a déjà été renouvelé puis réessayé par `appel` : un 401 qui
     arrive jusqu'ici est une session bel et bien finie. */
  if (r.status === 401) {
    deconnecte("Session expirée, reconnectez-vous.");
    return "Session expirée.";
  }
  return j.erreur || j.message || j.msg || "Erreur " + r.status;
}

/**
 * Appel d'une fonction qui rend compte au fil de l'eau.
 *
 * La réponse est un flux de lignes JSON plutôt qu'un objet unique : une
 * synchronisation dure trop longtemps pour qu'un message figé dise où l'on en
 * est. On lit ligne à ligne, on prévient l'appelant de chacune, et on renvoie
 * la dernière — celle qui porte le résultat.
 */
async function fluxFonction(nom, corps, surLigne, trace) {
  const dit = trace || (() => {});
  const url = CFG.url + "/functions/v1/" + nom;
  dit({ evt: "appel", url });
  const r = await appel(url, { method: "POST", body: JSON.stringify(corps) });
  /* Ce que le serveur a répondu, et surtout par quel chemin : un flux retenu
     par un relais et un serveur lent se ressemblent trait pour trait de
     l'extérieur. Les en-têtes qui les distinguent — l'encodage surtout — ne se
     lisent d'une autre origine que si la fonction les expose, ce qu'elle
     fait. */
  dit({
    evt: "reponse", statut: r.status,
    entetes: ["content-type", "content-encoding", "cache-control",
              "x-accel-buffering", "date"]
      .reduce((o, c) => ({ ...o, [c]: r.headers.get(c) }), {}),
  });
  // un refus arrive avant le flux, sous forme d'objet unique
  if (!r.ok || !r.body) throw new Error(await refus(r));

  const lecteur = r.body.getReader();
  const dec = new TextDecoder();
  const FIN = String.fromCharCode(10);
  let reste = "", dernier = null;
  for (;;) {
    const { done, value } = await lecteur.read();
    if (done) { dit({ evt: "flux-fini" }); break; }
    /* Le poids de chaque tronçon, et l'instant où il arrive. C'est là que se
       lit un tampon : une synchronisation servie au fil de l'eau rend des
       dizaines de tronçons étalés sur une minute, une réponse retenue n'en
       rend qu'un, à la fin. */
    dit({ evt: "troncon", octets: value.length });
    reste += dec.decode(value, { stream: true });
    let i;
    while ((i = reste.indexOf(FIN)) >= 0) {
      const ligne = reste.slice(0, i).trim();
      reste = reste.slice(i + 1);
      // le remplissage du flux est un commentaire : deux points en tête
      if (!ligne || ligne[0] === ":") continue;
      /* On accepte les deux habillages. Les pages et les fonctions ne se
         déploient pas ensemble — Cloudflare suit le dépôt, Supabase a son
         propre workflow — et pendant quelques minutes une page neuve parle à
         l'ancienne fonction, ou l'inverse. */
      const utile = ligne.slice(0, 5) === "data:" ? ligne.slice(5).trim() : ligne;
      if (!utile) continue;
      let o;
      try { o = JSON.parse(utile); } catch (e) { continue; }
      dit({ evt: "ligne", ligne: o });
      if (o.erreur) throw new Error(o.erreur);
      surLigne(o);
      if (o.ok) dernier = o;
    }
  }
  return dernier;
}

/**
 * La fenêtre qui rend compte d'une synchronisation.
 *
 * Elle montre trois choses, et pas une de plus : où l'on en est dans
 * l'ensemble, où l'on en est dans l'étape qui tourne, et ce qui a été compté.
 * La barre du haut est jalonnée d'une étape à l'autre — un jalon par étape,
 * régulièrement espacés — parce qu'une barre nue dit qu'on attend sans dire
 * quoi ; la sous-barre suit les éléments de l'étape en cours ; le tableau en
 * dessous garde les chiffres, qui sont ce qu'on vient vérifier.
 *
 * Les jalons sont à intervalle égal, et leur part n'est pas chiffrée. Posés à
 * la part que le nombre d'éléments valait à chaque étape, ils tombaient à des
 * endroits — 46 %, 57 % — qui donnaient à lire une précision qui n'existe pas :
 * ce sont des estimations, pas une promesse de durée. Une étape vaut une
 * étape ; ce qui se compte vraiment se compte dans l'étape, sur la sous-barre
 * et dans le tableau.
 *
 * Les étapes sont annoncées par le serveur, non devinées ici : lui seul sait
 * ce qu'il va réellement faire. Le poids qu'il leur donne — leur nombre
 * d'éléments, estimé d'après la dernière synchronisation puis corrigé — ne
 * décide plus de la largeur d'un segment ; il sert de repère à l'avancement
 * d'une étape dont on ignore le total, et un poids nul dit qu'elle n'est pas
 * reprise du tout.
 *
 * La fenêtre ne se ferme pas d'elle-même : le bilan est ce qu'on vient y lire,
 * et il arrive à la dernière ligne.
 */
function fenetreAvancement(titre, etiquette) {
  let etapes = [], vivante = true, plafond = 0, annoncees = false;
  const compte = new Map();
  let rail, noms, pctTxt, quoi, compteTxt, sous, sousJauge, dl, bilan, ecarte, chrono;
  const nb = (n) => Math.round(Number(n) || 0).toLocaleString("fr-FR");

  /* Le temps écoulé depuis le clic, affiché en clair.

     Une attente ne se raconte pas : « c'est long » ne dit pas si l'on a
     patienté six secondes ou soixante, et c'est pourtant là-dessus que se
     tranche un serveur lent d'une réponse retenue en chemin. Le chronomètre
     rend cette différence lisible sans ouvrir le journal. */
  const duree = (ms) => {
    const s = Math.floor(ms / 1000);
    return s < 60 ? s + " s"
      : Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s";
  };

  /* Le journal de la synchronisation, du clic à la dernière ligne.

     Il ne garde pas seulement ce que le serveur a dit, mais quand chaque chose
     est arrivée et en combien de tronçons : c'est la seule façon de
     distinguer, après coup, un serveur lent d'un relais qui retient. Il sert
     donc au diagnostic d'un défaut d'affichage autant qu'à celui d'une
     synchronisation ratée.

     Il vit dans la page et nulle part ailleurs : on ne l'envoie à personne, on
     le télécharge. */
  const t0 = performance.now();
  const horloge = setInterval(() => {
    if (chrono) chrono.textContent = duree(performance.now() - t0);
  }, 500);
  const journal = {
    salon: etiquette || titre,
    ouvertLe: new Date().toISOString(),
    page: location.href,
    navigateur: navigator.userAgent,
    lignes: [],
  };
  const trace = (o) => {
    journal.lignes.push({ ms: Math.round(performance.now() - t0), ...o });
    /* La réponse reçue mérite d'être dite : tant qu'on lit « Connexion au
       serveur… », on ne sait pas si c'est le réseau, la fonction ou un tampon
       qui fait attendre. Ce message-là tranche entre le premier et les deux
       autres. */
    if (o.evt === "reponse" && quoi && !annoncees) {
      quoi.textContent = "Réponse reçue — en attente de la première étape…";
    }
  };

  function telechargeJournal() {
    const nomFichier = "synchro-" +
      String(etiquette || "salon").toLowerCase().normalize("NFD")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" +
      new Date().toISOString().slice(0, 19).replace(/[:T-]/g, "") + ".json";
    const lien = document.createElement("a");
    lien.href = URL.createObjectURL(
      new Blob([JSON.stringify(journal, null, 2)], { type: "application/json" }));
    lien.download = nomFichier;
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    // révoquer tout de suite annulerait le téléchargement en cours
    setTimeout(() => URL.revokeObjectURL(lien.href), 10000);
  }

  ouvreModale(titre, (c) => {
    const d = document.createElement("div");
    d.className = "sync";
    d.innerHTML =
      '<div class="sync-tete"><span class="eyebrow">Avancement</span>' +
        '<span class="sync-chrono mono">0 s</span>' +
        '<span class="sync-pct mono">0 %</span></div>' +
      '<div class="sync-noms"></div>' +
      '<div class="sync-rail"><span class="sync-depart"></span></div>' +
      '<p class="sync-ecarte" hidden></p>' +
      '<div class="sync-cours"><span class="sync-quoi"></span>' +
        '<span class="sync-compte mono"></span></div>' +
      '<div class="sync-sous" data-etat="battant"><span></span></div>' +
      '<dl class="sync-chiffres"></dl>' +
      '<p class="sync-bilan"></p>';
    c.appendChild(d);
    rail = d.querySelector(".sync-rail");
    noms = d.querySelector(".sync-noms");
    pctTxt = d.querySelector(".sync-pct");
    quoi = d.querySelector(".sync-quoi");
    compteTxt = d.querySelector(".sync-compte");
    sous = d.querySelector(".sync-sous");
    sousJauge = sous.querySelector("span");
    dl = d.querySelector(".sync-chiffres");
    bilan = d.querySelector(".sync-bilan");
    ecarte = d.querySelector(".sync-ecarte");
    chrono = d.querySelector(".sync-chrono");
    quoi.textContent = "Connexion au serveur…";
  }, [
    /* Le journal se télécharge aussi pendant que ça tourne, et pas seulement
       à la fin : une synchronisation qui reste muette est justement celle dont
       on voudrait le relevé, et attendre une fin qui ne vient pas le rendrait
       inatteignable. */
    { libelle: "Journal", action: () => { telechargeJournal(); return false; } },
    { libelle: "Fermer", genre: "primaire" },
  ], () => { vivante = false; clearInterval(horloge); });
  verrouilleModale(true);

  // Les étapes qui ont un segment : celles que la synchronisation reprend.
  const vues = () => etapes.filter((e) => e.poids > 0);

  /* Un segment par étape, tous de même largeur, et un jalon au bout de chacun.
     Une étape non reprise n'a pas de segment : elle en occuperait un sans
     jamais rien y faire avancer. Elle est nommée sous la barre, pour qu'on la
     sache écartée et non oubliée. */
  function construitRail() {
    if (!rail) return;
    rail.innerHTML = '<span class="sync-depart"></span>';
    noms.innerHTML = "";
    vues().forEach((e) => {
      e.seg = document.createElement("div");
      e.seg.className = "sync-seg";
      e.seg.innerHTML =
        '<span class="sync-piste"><span></span></span><span class="sync-point"></span>';
      rail.appendChild(e.seg);

      e.nom = document.createElement("div");
      e.nom.className = "sync-nom";
      e.nom.textContent = e.libelle;
      e.nom.title = e.libelle + (e.source && e.source !== "aucun" ? " — " + e.source : "");
      noms.appendChild(e.nom);
    });
    const hors = etapes.filter((e) => e.poids <= 0);
    ecarte.hidden = !hors.length;
    ecarte.textContent = hors.length
      ? "Non repris : " + hors.map((e) => e.libelle + (e.det ? " (" + e.det + ")" : "")).join(" · ")
      : "";
  }

  function rafraichit() {
    if (!rail) return;
    vues().forEach((e) => {
      if (!e.seg) return;
      e.seg.dataset.etat = e.etat;
      e.nom.dataset.etat = e.etat;
      e.seg.querySelector(".sync-piste > span").style.width =
        Math.round(e.frac * 100) + "%";
    });
    /* Le pourcentage et le remplissage disent la même chose, et c'est la
       condition pour qu'on les croie : les segments étant égaux, la part faite
       est la moyenne de ce que chaque étape a avancé. */
    const l = vues();
    const p = l.reduce((a, e) => a + e.frac, 0) / (l.length || 1) * 100;
    plafond = Math.max(plafond, Math.min(100, p));
    pctTxt.textContent = Math.round(plafond) + " %";
    /* Tant qu'aucune étape n'a bougé, le curseur se tient au point de départ.
       Une barre entièrement grise et un écran figé se ressemblent trop : c'est
       ce point allumé, avec le chronomètre et la sous-barre qui bat, qui dit
       qu'on attend le serveur et non qu'on a planté. */
    rail.dataset.etat = l.some((e) => e.etat !== "attente") ? "" : "connexion";
  }

  return {
    /** Le relevé de ce que le flux a rendu, et de quand. */
    trace,

    /**
     * La liste des étapes. `pressenties` distingue celle que la console a
     * devinée pour ne pas ouvrir sur une barre vide de celle que le serveur
     * annonce, qui seule fait foi et remplace la première.
     */
    ouvre(liste, pressenties) {
      etapes = liste.map((e) => ({
        cle: e.cle, libelle: e.libelle, source: e.source,
        poids: Math.max(0, Number(e.poids ?? 1) || 0), frac: 0, etat: "attente", det: "",
      }));
      if (!pressenties) annoncees = true;
      construitRail();
      rafraichit();
    },

    /** Une ligne du flux qui parle d'une étape : son état, son poids, son avancement. */
    pas(o) {
      const e = etapes.find((x) => x.cle === o.etape);
      if (!e) return;
      let refaire = false;
      if (o.poids !== undefined) {
        e.poids = Math.max(0, Number(o.poids) || 0);
        refaire = true;
      }
      if (o.info !== undefined) e.det = String(o.info);
      if (o.fait !== undefined) {
        /* Sans total connu — les catégories Eventmaker ne disent pas combien
           de fiches elles portent — l'estimation d'après la dernière
           synchronisation tient lieu de repère. Plafonnée, elle ne prétend
           jamais avoir fini. */
        const f = o.total
          ? Math.min(1, o.fait / o.total)
          : Math.min(0.95, e.poids ? o.fait / e.poids : 0);
        e.frac = Math.max(e.frac, f);
      }
      if (o.etat) {
        e.etat = o.etat;
        if (o.etat === "fait") e.frac = 1;
        if (o.etat === "ignoree") {
          e.frac = 1;
          if (e.poids > 0) { e.poids = 0; refaire = true; }
        }
      }
      if (o.etat === "encours" && quoi) {
        quoi.textContent = e.libelle + " · " + (o.detail || e.det || "en cours");
        const u = o.unite ? " " + o.unite : "";
        /* Un pavillon entamé compte pour le premier, pas pour zéro : la part
           est fractionnaire — c'est elle qui remplit la sous-barre — mais le
           décompte se lit en éléments entiers. */
        compteTxt.textContent = o.fait === undefined ? ""
          : o.total ? Math.ceil(o.fait).toLocaleString("fr-FR") + " / " + nb(o.total) + u
          : o.fait ? nb(o.fait) + u : "";
        const bat = o.fait !== undefined && !o.total;
        sous.dataset.etat = bat ? "battant" : "chiffre";
        sousJauge.style.width = bat ? "100%"
          : Math.round((o.total ? Math.min(1, o.fait / o.total) : 0) * 100) + "%";
      }
      if (refaire) construitRail();
      rafraichit();
    },

    /** Les compteurs, qui s'écrasent par leur nom et ne font qu'une ligne chacun. */
    chiffres(o) {
      Object.entries(o || {}).forEach(([k, v]) => compte.set(k, v));
      if (!dl) return;
      dl.innerHTML = "";
      compte.forEach((v, k) => {
        const l = document.createElement("div");
        l.innerHTML = "<dt></dt><dd></dd>";
        l.querySelector("dt").textContent = k;
        l.querySelector("dd").textContent = nb(v);
        dl.appendChild(l);
      });
    },

    /**
     * Le mot de la fin, et la fenêtre rendue à qui voudra la fermer.
     *
     * Trois fins, et non deux : une synchronisation peut aboutir en laissant
     * un défaut derrière elle — une nomenclature restée en codes — et la dire
     * « interrompue » serait faux, la taire le serait autant.
     *   "ok"     tout est passé
     *   "alerte" c'est fait, mais quelque chose est à regarder
     *   "echec"  on s'est arrêté en chemin
     */
    fini(message, issue) {
      // ne déverrouiller que si c'est toujours cette fenêtre-ci qui est ouverte :
      // une autre a pu prendre sa place pendant que la synchronisation tournait
      if (vivante) verrouilleModale(false);
      clearInterval(horloge);
      if (chrono) chrono.textContent = duree(performance.now() - t0);
      trace({ evt: "fin", issue: issue || "ok", message });
      if (!bilan) return;
      const panne = issue === "echec";
      bilan.className = "sync-bilan " + (issue || "ok");
      bilan.textContent = message;
      /* Sur échec la sous-barre s'efface au lieu de se figer : battante, elle
         restait pleine et se lisait comme une étape réussie, quand le jalon
         rouge au-dessus disait le contraire. Ce qu'elle comptait est de toute
         façon resté dans le tableau. */
      sous.hidden = panne;
      sous.dataset.etat = "fini";
      quoi.textContent = panne ? "Interrompu" : "Terminé";
      compteTxt.textContent = "";
      if (!panne) {
        sousJauge.style.width = "100%";
        plafond = 100;
        pctTxt.textContent = "100 %";
      }
    },
  };
}

async function fonction(nom, corps) {
  const r = await appel(CFG.url + "/functions/v1/" + nom, {
    method: "POST",
    body: JSON.stringify(corps),
  });
  if (!r.ok) throw new Error(await refus(r));
  return await r.json().catch(() => ({}));
}



/* ------------------------------------------------------------------
   Données
   ------------------------------------------------------------------ */
const slugifie = (t) => String(t).toLowerCase().normalize("NFD")
  .replace(/\p{Diacritic}/gu, "").replace(/[^a-z0-9]+/g, "-")
  .replace(/^-|-$/g, "").slice(0, 40);

const courant = () => EVTS.find((e) => e.id === selection);

async function charge() {
  // le rôle avant les salons : c'est lui qui dit ce que la console propose,
  // et la liste des salons n'est déjà plus la même d'un profil à l'autre
  await litMonProfil();
  /* La base ne renvoie que les salons du compte : un organisateur n'en reçoit
     que les siens, un administrateur les reçoit tous. Le tri par date de
     modification met en tête celui qu'on vient de toucher. */
  EVTS = await rest("evenement?select=*&order=modifie_le.desc");
  if (!EVTS.some((e) => e.id === selection)) {
    selection = (selonAdresse() || EVTS[0])?.id ?? null;
  }
  if (selection) await chargePlans(selection);
  dessine();
}

async function chargePlans(id) {
  PLANS[id] = await rest("plan?evenement_id=eq." + id +
    "&select=id,id_klipso,libelle,hall,publie,nb_stands,nb_zones&order=libelle.asc");
}

async function majEvenement(id, champs) {
  await rest("evenement?id=eq." + id, {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({ ...champs, modifie_le: new Date().toISOString() }),
  });
}

/* ------------------------------------------------------------------
   Choix du salon

   La console n'affiche qu'un salon à la fois : la liste de tous les autres
   tenait une colonne entière de l'écran pour un choix qu'on fait une fois en
   arrivant. Elle se replie donc dans la barre du haut, comme sur la page de
   rapport, et la fiche prend toute la largeur.

   Ce que la liste porte ne se décide pas ici : la base ne renvoie que les
   salons auxquels le compte a droit.
   ------------------------------------------------------------------ */
/** Le salon nommé dans l'adresse, s'il fait partie de ceux qu'on peut ouvrir. */
function selonAdresse() {
  const slug = new URLSearchParams(location.search).get("plan");
  return slug ? EVTS.find((e) => e.slug === slug) || null : null;
}

/* Le salon ouvert tient dans l'adresse : on revient sur la console par un
   signet ou par le bouton « Console » du rapport, et on retrouve le sien
   plutôt que le premier de la liste. */
function majAdresse() {
  const e = courant();
  const url = new URL(location.href);
  if (e?.slug) url.searchParams.set("plan", e.slug);
  else url.searchParams.delete("plan");
  history.replaceState(null, "", url);
}

/**
 * Ce que la barre du haut dit du salon ouvert, et ce qu'elle en commande.
 *
 * Ces boutons vivaient en tête de fiche, sur une seconde rangée. Ils décrivent
 * pourtant le même salon que la liste déroulante voisine : les réunir fait un
 * seul endroit où commander, et une ligne au lieu de deux.
 */
function majBarre() {
  const e = courant();
  const badge = $("etatEvt");
  badge.hidden = !e;
  if (e) {
    badge.className = "etat " + e.etat;
    badge.textContent = e.etat === "publie" ? "Publié" : "Brouillon";
  }
  // sans salon ouvert, les commandes qui le visent n'ont pas d'objet ; celles
  // de la console — les comptes, le projet — restent, elles, atteignables
  document.querySelectorAll('.menu-pan [data-portee="salon"]').forEach((b) => {
    b.hidden = !e;
  });
  $("sepActions").hidden = !e;
  $("lienPublic").hidden = !e;
  $("lienAdmin").hidden = !e;
  if (!e) return;

  majLiens(e);
  $("btnEtat").textContent = e.etat === "publie" ? "Repasser en brouillon" : "Publier l'événement";
  $("btnEtat").onclick = async () => {
    e.etat = e.etat === "publie" ? "brouillon" : "publie";
    try { await majEvenement(e.id, { etat: e.etat }); dessine(); }
    catch (err) { signale(err.message, true); }
  };
  $("btnSources").onclick = () => ouvreSources(() => dessine());
  // dupliquer, c'est créer un salon : réservé à l'administrateur, comme
  // « Nouveau ». La base le refuserait de toute façon, mais un bouton qui
  // n'aboutit jamais est un bouton de trop.
  $("btnDupliquer").hidden = MOI?.role !== "admin";
  $("btnDupliquer").onclick = () => dupliquer(e);
  $("btnSupprimer").onclick = () => confirme("Supprimer l'événement ?",
    "« " + e.nom + " », ses pavillons, son apparence et ses dessins seront " +
    "définitivement perdus.", "Supprimer", async () => {
      try {
        await rest("evenement?id=eq." + e.id, { method: "DELETE" });
        selection = null;
        await charge();
      } catch (err) { signale(err.message, true); }
    });
}

function dessineChoix() {
  const sel = $("choixEvt");
  // rien à choisir : la liste vide n'aurait rien à dire que la fiche ne dise
  sel.hidden = !EVTS.length;
  if (!EVTS.length) { sel.innerHTML = ""; return; }
  /* Un brouillon se signale dans la liste : c'est le seul état dont on doive
     se souvenir avant même d'ouvrir la fiche — son plan public ne répond pas. */
  sel.innerHTML = EVTS.map((e) =>
    '<option value="' + e.id + '"' + (e.id === selection ? " selected" : "") + '>' +
    esc(e.nom) + (e.etat === "publie" ? "" : " · brouillon") + '</option>').join("");
  sel.onchange = async () => {
    selection = sel.value;
    if (!PLANS[selection]) await chargePlans(selection);
    dessine();
  };
}

/* ------------------------------------------------------------------
   Fiche
   ------------------------------------------------------------------ */
function champ(cle, libelle, aide, attrs) {
  const e = courant();
  const l = document.createElement("label");
  l.innerHTML = '<span></span><input ' + (attrs || "") + '>' + (aide ? '<span class="aide"></span>' : "");
  l.querySelector("span").textContent = libelle;
  if (aide) l.querySelector(".aide").textContent = aide;
  const i = l.querySelector("input");
  i.value = e[cle] == null ? "" : e[cle];
  let attente;
  i.oninput = () => {
    e[cle] = i.value;
    if (cle === "slug") e.slug = slugifie(i.value);
    clearTimeout(attente);
    attente = setTimeout(async () => {
      try {
        await majEvenement(e.id, { [cle]: e[cle] });
        if (cle === "nom") dessineChoix();
        if (cle === "slug") { i.value = e.slug; majIntegration(); majAdresse(); }
      } catch (err) { signale(err.message, true); }
    }, 500);
  };
  return l;
}


/* ------------------------------------------------------------------
   Icône de l'onglet

   Les paliers de réduction, du plus généreux au plus maigre : on descend tant
   que le résultat dépasse le poids retenu. Cent vingt-huit pixels suffisent
   partout — l'onglet en montre seize, la barre des favoris trente-deux, le
   raccourci d'un écran d'accueil rarement plus de cent vingt.

   Le poids se compte en caractères du data-URI, non en octets du fichier
   d'origine : c'est lui qui part avec le plan, chez chaque visiteur, et il
   pèse un tiers de plus que l'image — quatre caractères de base64 pour trois
   octets, d'où le diviseur de l'affichage.
   ------------------------------------------------------------------ */
const PALIERS_ICONE = [128, 96, 64, 48];
const POIDS_ICONE = 22000;

/**
 * L'icône, redessinée en png quel que soit le fichier déposé.
 *
 * Le png et non le webp, à l'inverse du logo d'une zone : le second pèse moins,
 * mais l'avantage ne se voit pas sur une image de cette taille, et le premier
 * est le seul format que tous les navigateurs acceptent dans « link rel=icon ».
 * Le svg passe par le même canevas et en ressort matriciel — c'est voulu : il
 * porte du script, et les pages du plan ne reconnaissent à l'affichage que les
 * formats qu'on fabrique ici.
 *
 * Les proportions sont gardées : un logo large écrasé dans un carré ne se
 * reconnaît plus, et le navigateur sait loger une image qui n'est pas carrée.
 */
function reduitIcone(fichier) {
  return new Promise((tenu, rompu) => {
    if (!fichier || String(fichier.type).indexOf("image/") !== 0) {
      return rompu(new Error("ce fichier n'est pas une image"));
    }
    const fr = new FileReader();
    fr.onerror = () => rompu(new Error("fichier illisible"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rompu(new Error("image illisible"));
      img.onload = () => {
        // un svg sans dimensions intrinsèques se dessine à rien : on lui en prête
        const l0 = img.naturalWidth || 128, h0 = img.naturalHeight || 128;
        for (const max of PALIERS_ICONE) {
          const k = Math.min(1, max / Math.max(l0, h0));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(l0 * k));
          c.height = Math.max(1, Math.round(h0 * k));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          const src = c.toDataURL("image/png");
          if (src.length <= POIDS_ICONE) return tenu(src);
        }
        rompu(new Error("image trop lourde, même réduite — une icône, pas une photo"));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(fichier);
  });
}

/**
 * Le champ de l'icône : la choisir, la voir, la retirer.
 *
 * Il s'écrit au moment du choix, et non à la sortie de la fiche comme les
 * champs de texte voisins : déposer une image est déjà un geste achevé, et
 * rien ne s'y saisit à moitié. Le retrait part de même, et rend l'onglet à
 * l'icône du navigateur.
 *
 * La vignette est aussi la cible du glisser-déposer — c'est le geste qu'on
 * fait devant elle, et il évite la boîte de dialogue du système.
 */
function champFavicon() {
  const e = courant();
  const l = document.createElement("div");
  l.className = "champ-fic";
  l.innerHTML = '<span></span>' +
    '<div class="iconeZ"><div class="vue"></div>' +
    '<div class="actes"><button type="button" class="btn petit"></button>' +
    '<button type="button" class="btn petit oter">Retirer</button>' +
    '<span class="dit"></span></div>' +
    '<input type="file" accept="image/*" hidden></div>' +
    '<span class="aide"></span>';
  l.querySelector("span").textContent = "Icône de l'onglet";
  l.querySelector(".aide").textContent =
    "Elle paraît dans l'onglet du plan public comme dans celui de " +
    "l'administration, à côté du nom du salon. Réduite puis enregistrée avec " +
    "l'événement, elle part avec le plan sans dépendre d'un fichier hébergé " +
    "ailleurs. Un carré se reconnaît mieux à seize pixels qu'un logo en " +
    "longueur. Glissez-la sur la vignette, ou choisissez-la.";

  const vue = l.querySelector(".vue");
  const choisir = l.querySelector(".actes button");
  const oter = l.querySelector(".oter");
  const dit = l.querySelector(".dit");
  const fichier = l.querySelector("input");

  const peint = (mot) => {
    vue.innerHTML = e.favicon ? '<img alt="">' : '<span>Aucune</span>';
    if (e.favicon) vue.querySelector("img").src = e.favicon;
    choisir.textContent = e.favicon ? "Remplacer…" : "Choisir un fichier…";
    oter.hidden = !e.favicon;
    dit.dataset.mal = "false";
    dit.textContent = mot !== undefined ? mot
      : e.favicon ? Math.round(e.favicon.length / 1365) + " Ko" : "";
  };

  const ecrit = async (src) => {
    const avant = e.favicon;
    e.favicon = src;
    peint(src ? "Enregistrement…" : "Retrait…");
    try {
      await majEvenement(e.id, { favicon: src || null });
      peint();
    } catch (err) {
      // l'écran doit montrer ce que la base tient, pas ce qu'on a tenté
      e.favicon = avant;
      peint();
      signale(err.message, true);
    }
  };

  const prend = (f) => {
    if (!f) return;
    peint("Lecture…");
    reduitIcone(f).then(ecrit).catch((err) => {
      dit.textContent = "Échec : " + err.message;
      dit.dataset.mal = "true";
    });
  };

  choisir.onclick = () => fichier.click();
  fichier.onchange = () => { prend(fichier.files[0]); fichier.value = ""; };
  oter.onclick = () => ecrit("");
  vue.addEventListener("dragover", (ev) => {
    ev.preventDefault();
    vue.dataset.survol = "1";
  });
  vue.addEventListener("dragleave", () => { delete vue.dataset.survol; });
  vue.addEventListener("drop", (ev) => {
    ev.preventDefault();
    delete vue.dataset.survol;
    prend(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]);
  });

  peint();
  return l;
}

function dessineFiche() {
  const e = courant();
  const f = $("fiche");
  if (!SESSION) { f.innerHTML = '<div class="vide">Connectez-vous pour accéder aux événements.</div>'; return; }
  if (!e) {
    /* Un organisateur sans salon n'a rien à créer et rien à choisir : lui
       proposer « Nouveau » l'enverrait contre un refus de la base. Ce qui lui
       manque, c'est une affectation, et c'est cela qu'on lui dit. */
    f.innerHTML = '<div class="vide"></div>';
    f.querySelector(".vide").innerHTML = MOI?.role === "admin"
      ? "Aucun salon pour l'instant.<br>Créez-en un avec « Nouveau »."
      : "Aucun salon ne vous a été affecté.<br>" +
        "Demandez l'accès à l'administrateur du projet.";
    return;
  }
  f.innerHTML = "";

  const b1 = bloc("Identité");
  const g1 = grille();
  g1.appendChild(champ("nom", "Nom de l'événement"));
  g1.appendChild(champ("slug", "Identifiant d'URL", "Sert d'adresse publique du plan."));
  g1.appendChild(champFavicon());
  b1.appendChild(g1);
  f.appendChild(b1);

  /* D'où viennent les données, ce qu'on en montre, et à quelle fraîcheur : la
     synchronisation tenait un bloc à elle pour une liste déroulante et un
     bouton, et la question qu'elle répond est celle des lignes voisines. */
  const bd = bloc("Données");
  bd.appendChild(ligneReglage("Provenance des données", () => resumeProvenance(e),
    ouvreProvenance));
  bd.appendChild(ligneReglage("Fiche détail", () => resumeFiche(e), ouvreFiche));

  const rythme = document.createElement("select");
  rythme.setAttribute("aria-label", "Rythme de rafraîchissement");
  rythme.innerHTML = RYTHMES.map((r) => '<option value="' + r[0] + '"' +
    (e.rythme_min === r[0] ? " selected" : "") + '>' + r[1] + '</option>').join("");
  rythme.onchange = async (ev) => {
    e.rythme_min = +ev.target.value;
    try { await majEvenement(e.id, { rythme_min: e.rythme_min }); }
    catch (err) { signale(err.message, true); }
  };
  const bsync = document.createElement("button");
  bsync.className = "btn petit";
  bsync.id = "btnSync";
  bsync.textContent = "Synchroniser maintenant";
  bd.appendChild(ligneOutil("Synchronisation", '<span id="msgSync"></span>', [rythme, bsync]));

  f.appendChild(bd);
  majMsgSync(e);
  $("btnSync").onclick = () => synchronise(e);

  /* --- pavillons --- */
  const plans = PLANS[e.id] || [];
  const publies = plans.filter((p) => p.publie).length;
  const b3 = bloc("Pavillons", plans.length
    ? plans.length + " pavillon" + (plans.length > 1 ? "s" : "") + " · " +
      publies + " publié" + (publies > 1 ? "s" : "")
    : "");
  if (!plans.length) {
    const p = document.createElement("p");
    p.className = "astuce";
    p.textContent = "Aucun pavillon connu. Lancez une synchronisation pour les récupérer.";
    b3.appendChild(p);
  } else {
    const t = document.createElement("table");
    // nommé pour qu'un écran étroit le fasse défiler seul, sans emporter la fiche
    t.className = "pavillons";
    t.innerHTML = "<thead><tr><th>Publier</th><th>Pavillon</th><th>Hall</th>" +
      '<th class="num">Emplacements</th><th class="num">Zones</th></tr></thead><tbody></tbody>';
    const tb = t.querySelector("tbody");
    plans.forEach((p) => {
      const tr = document.createElement("tr");
      if (!p.publie) tr.className = "eteint";
      tr.innerHTML = '<td><label class="coche"><input type="checkbox"' +
        (p.publie ? " checked" : "") + '></label></td>' +
        '<td class="nomplan"></td><td class="mono hall"></td>' +
        '<td class="num">' + (p.nb_stands ?? "—") + '</td>' +
        '<td class="num">' + (p.nb_zones ?? "—") + '</td>';
      tr.querySelector(".nomplan").textContent = p.libelle;
      tr.querySelector(".hall").textContent = p.hall || "—";
      tr.querySelector("input").onchange = async (ev) => {
        p.publie = ev.target.checked;
        try {
          await rest("plan?id=eq." + p.id, {
            method: "PATCH",
            headers: { "Prefer": "return=minimal" },
            body: JSON.stringify({ publie: p.publie }),
          });
          dessine();
        } catch (err) { signale(err.message, true); }
      };
      tb.appendChild(tr);
    });
    b3.appendChild(t);
  }
  f.appendChild(b3);

  const b4 = bloc("Intégration");
  const astuce = document.createElement("p");
  astuce.className = "astuce";
  astuce.textContent = "Collez ce fragment dans la page du salon.";
  b4.appendChild(astuce);
  const zone = document.createElement("div");
  zone.className = "integration";
  zone.style.marginTop = "10px";
  zone.innerHTML = '<textarea id="fragment" readonly></textarea>' +
    '<button class="btn petit" id="btnCopier">Copier</button>';
  b4.appendChild(zone);
  f.appendChild(b4);
  majIntegration();
  $("btnCopier").onclick = (ev) => {
    navigator.clipboard?.writeText($("fragment").value).then(
      () => { ev.target.textContent = "Copié"; setTimeout(() => ev.target.textContent = "Copier", 1600); },
      () => { ev.target.textContent = "Échec"; });
  };
}

/* ============================================================
   Provenance des données
   Un domaine, un fournisseur. La liste des fournisseurs diffère par domaine :
   la géométrie du plan ne vient que de Klipso, le reste pourra venir
   d'ailleurs. La clé d'identification reste celle de l'événement.
   ============================================================ */
const DOMAINES = [
  ["plan",        "Plan",        ["klipso"],
   "La géométrie des pavillons et des calques."],
  ["stands",      "Exposants",   ["klipso", "eventmaker"],
   "Les sociétés rattachées aux emplacements. La géométrie et les zones restent au plan."],
  ["conferences", "Conférences", ["aucun", "klipso", "eventmaker"],
   "Aucune synchronisation ne les reprend encore."],
  ["produits",    "Produits",    ["aucun", "klipso", "eventmaker"],
   "Aucune synchronisation ne les reprend encore."],
];
const FOURNISSEURS = {
  aucun: "Non synchronisé", klipso: "Klipso", eventmaker: "Eventmaker",
};

/* Un domaine que rien ne reprend vaut mieux « non synchronisé » qu'un
   fournisseur choisi par défaut : celui-ci laisserait croire à une reprise. */
const DEFAUT_DOMAINE = {
  plan: "klipso", stands: "klipso", conferences: "aucun", produits: "aucun",
};

/* Chaque fournisseur désigne l'événement à sa façon. Klipso n'est pas dans
   cette liste : son identité tient dans « Instance » et « Identifiant
   d'événement », déjà saisis plus haut dans la fiche. */
/**
 * Les réglages de raccordement, fournisseur par fournisseur.
 *
 * C'est cette liste qui décide des onglets de la fenêtre « Sources de
 * données » : brancher un outil de plus revient à y ajouter une entrée, sans
 * toucher au reste.
 *
 * Un champ vit soit dans une colonne de l'événement — c'est le cas de Klipso,
 * dont l'instance et l'identifiant précèdent le modèle multi-fournisseurs —
 * soit dans la colonne « cles », indexée par fournisseur.
 */
const FOURNISSEURS_CONF = [
  {
    cle: "klipso",
    nom: "Klipso",
    champs: [
      { colonne: "instance", libelle: "Instance", aide: "Le sous-domaine Klipso." },
      { colonne: "event_id", libelle: "Identifiant d'événement",
        aide: "Le GUID transmis dans l'en-tête X-GAIA-EventId." },
    ],
  },
  {
    cle: "eventmaker",
    nom: "Eventmaker",
    champs: [
      { dansCles: "eventmaker", libelle: "Identifiant de l'événement",
        aide: "Vingt-quatre caractères, visibles dans l'adresse de l'événement sur app.eventmaker.io.",
        forme: /^[0-9a-f]{24}$/i, exemple: "69ef6fb4406b394eda9b8a3e" },
    ],
  },
];

/** Un fournisseur est-il retenu quelque part ? */
const fournisseurUtilise = (e, cle) =>
  DOMAINES.some(([d]) => ((e.sources || {})[d] || {}).fournisseur === cle);

/** Le fournisseur retenu pour un domaine, défaut compris. */
const source = (e, dom) =>
  ((e.sources || {})[dom] || {}).fournisseur || DEFAUT_DOMAINE[dom] || "klipso";

/** Champ de clé. Il n'est pas caché quand le fournisseur n'est pas encore
 *  retenu : on saisit souvent l'identifiant avant de basculer la source. */
function champCle(cle, libelle, aide, forme, exemple) {
  const e = courant();
  const l = document.createElement("label");
  l.innerHTML = '<span></span><input spellcheck="false"><span class="aide"></span>';
  l.querySelector("span").textContent = libelle;
  const i = l.querySelector("input"), a = l.querySelector(".aide");
  i.value = (e.cles || {})[cle] || "";
  i.placeholder = exemple;
  if (!fournisseurUtilise(e, cle)) l.classList.add("source-inerte");

  const dit = () => {
    const v = i.value.trim();
    a.textContent = v && forme && !forme.test(v)
      ? "Format inattendu — un identifiant ressemble à « " + exemple + " »."
      : aide;
    a.classList.toggle("alerte", Boolean(v && forme && !forme.test(v)));
  };
  dit();

  let attente;
  i.oninput = () => {
    dit();
    clearTimeout(attente);
    attente = setTimeout(async () => {
      e.cles = { ...(e.cles || {}) };
      const v = i.value.trim();
      if (v) e.cles[cle] = v; else delete e.cles[cle];
      try { await majEvenement(e.id, { cles: e.cles }); }
      catch (err) { signale(err.message, true); }
    }, 500);
  };
  return l;
}

/** Une ligne de provenance, enregistrée à chaque modification. */
function ligneSource(dom, libelle, offerts, aide) {
  const e = courant();
