<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console des plans de salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="config.js"></script>

<link rel="stylesheet" href="console.css">

<div class="app">
  <header class="topbar">
    <h1>Console des plans</h1>

    <div class="droite">

    <header>
      <span class="eyebrow">Événements</span>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>

    <div class="mcorps" id="mCorps"></div>
    <footer id="mPied"></footer>
  </div>
</div>

<script>
/* ============================================================
   Socle commun de la console et du rapport — accès au projet
   Tout passe par l'API REST de Supabase. La clé publique et l'adresse du
   projet sont demandées au premier lancement puis conservées sur le poste :
   elles n'ont pas à vivre dans le dépôt, et changent selon l'environnement.
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CLE_CFG = "console-config";
const CLE_SESSION = "console-session";

let CFG = null, SESSION = null;
try { CFG = JSON.parse(localStorage.getItem(CLE_CFG) || "null"); } catch (e) {}
try { SESSION = JSON.parse(localStorage.getItem(CLE_SESSION) || "null"); } catch (e) {}
if (window.PLAN_CONFIG && !CFG) CFG = window.PLAN_CONFIG;

/* ------------------------------------------------------------------
   Appels
   ------------------------------------------------------------------ */
function entetes(json) {
  const h = { "apikey": CFG.anonKey };
  if (SESSION?.access_token) h["Authorization"] = "Bearer " + SESSION.access_token;
  if (json) h["Content-Type"] = "application/json";
  return h;
}

async function rest(chemin, options = {}) {
  const r = await fetch(CFG.url + "/rest/v1/" + chemin, {
    ...options,
    headers: { ...entetes(!!options.body), ...(options.headers || {}) },
  });
  if (r.status === 401 || r.status === 403) {
    deconnecte("Session expirée, reconnectez-vous.");
    throw new Error("Non autorisé.");
  }
  const txt = await r.text();
  let corps = null;
  try { corps = txt ? JSON.parse(txt) : null; } catch (e) { corps = { message: txt }; }
  if (!r.ok) {
    const d = [corps?.message, corps?.details, corps?.hint].filter(Boolean).join(" — ");
    throw new Error(d || "Erreur " + r.status + " sur " + chemin);
  }
  return corps;
}

/* ------------------------------------------------------------------
   Fenêtres
   ------------------------------------------------------------------ */
// Une fenêtre de réglage doit rafraîchir son résumé en se fermant, et elle se
// ferme de quatre façons : le bouton, la croix, l'arrière-plan, la touche
// Échap. D'où un rappel porté par la fermeture plutôt que par le bouton.
let apresModale = null;

function ouvreModale(titre, remplit, boutons, apres) {
  apresModale = apres || null;
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplit($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach((b) => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action && b.action() === false) return; fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
const fermeModale = () => {
  $("modale").classList.remove("open");
  const f = apresModale;
  apresModale = null;
  if (f) f();
};
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", (e) => { if (e.target === $("modale")) fermeModale(); });
addEventListener("keydown", (e) => { if (e.key === "Escape") fermeModale(); });

function demande(titre, libelle, valeur, suite) {
  let champ;
  ouvreModale(titre, (corps) => {
    const l = document.createElement("label");
    l.innerHTML = "<span></span><input>";
    l.querySelector("span").textContent = libelle;
    champ = l.querySelector("input");
    champ.value = valeur || "";
    corps.appendChild(l);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const v = champ.value.trim();
        if (v) { fermeModale(); suite(v); }
      }
    };
  }, [{ libelle: "Annuler" },
      { libelle: "Valider", genre: "primaire",
        action: () => { const v = champ.value.trim(); if (!v) return false; suite(v); } }]);
}

function confirme(titre, message, libelleOui, action) {
  ouvreModale(titre, (corps) => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [{ libelle: "Annuler" }, { libelle: libelleOui, genre: "danger", action }]);
}

/* ------------------------------------------------------------------
   Configuration et connexion
   ------------------------------------------------------------------ */
function ecranConfig() {
  let url, cle;
  ouvreModale("Connexion au projet", (corps) => {
    const p = document.createElement("p");
    p.innerHTML = "L'adresse de l'<strong>API</strong> du projet, en " +
      "<code>.supabase.co</code> — pas celle du tableau de bord. La clé publique " +
      "est faite pour circuler côté navigateur : c'est son rôle. Ne mettez jamais " +
      "ici la clé de service.";
    const l1 = document.createElement("label");
    l1.innerHTML = "<span>Adresse du projet</span><input placeholder='https://xxxx.supabase.co'>";
    const l2 = document.createElement("label");
    l2.innerHTML = "<span>Clé publique (anon)</span><input placeholder='eyJhbGciOi…'>";
    corps.append(p, l1, l2);
    url = l1.querySelector("input");
    cle = l2.querySelector("input");
    url.value = CFG?.url || "";
    cle.value = CFG?.anonKey || "";
    p.hidden = !!(CFG?.url && CFG?.anonKey);
    setTimeout(() => url.focus(), 30);
  }, [{ libelle: "Valider", genre: "primaire", action: () => {
    const u = url.value.trim().replace(/\/+$/, ""), k = cle.value.trim();
    if (!u || !k) return false;
    CFG = { url: u, anonKey: k };
    localStorage.setItem(CLE_CFG, JSON.stringify(CFG));
    ecranConnexion();
  } }]);
}

/**
 * L'adresse du tableau de bord et celle de l'API se ressemblent assez pour
 * qu'on les confonde. On accepte les deux formes et on retient la bonne.
 *   tableau de bord : https://supabase.com/dashboard/project/<ref>
 *   API             : https://<ref>.supabase.co
 * Écrit sans expression régulière : la lecture y gagne, et le fichier ne
 * dépend d'aucun échappement.
 */
function normaliseUrl(saisie) {
  let u = String(saisie || "").trim();
  while (u.length && u[u.length - 1] === "/") u = u.slice(0, -1);
  if (!u) return "";

  const marque = "supabase.com/dashboard/project/";
  const i = u.toLowerCase().indexOf(marque);
  if (i >= 0) {
    const ref = u.slice(i + marque.length).split("/")[0].split("?")[0];
    if (ref) return "https://" + ref + ".supabase.co";
  }

  // la seule référence du projet, sans point ni protocole
  if (u.indexOf(".") < 0 && u.indexOf(":") < 0) return "https://" + u + ".supabase.co";

  if (u.slice(0, 4).toLowerCase() !== "http") u = "https://" + u;
  return u;
}

function ecranConnexion(message) {
  let mail, mdp, msg;
  ouvreModale("Connexion", (corps) => {
    const l1 = document.createElement("label");
    l1.innerHTML = "<span>Adresse e-mail</span><input type='email' autocomplete='username'>";
    const l2 = document.createElement("label");
    l2.innerHTML = "<span>Mot de passe</span><input type='password' autocomplete='current-password'>";
    msg = document.createElement("p");
    msg.style.color = "var(--rouge)";
    if (message) msg.textContent = message;
    corps.append(l1, l2, msg);
    mail = l1.querySelector("input");
    mdp = l2.querySelector("input");
    setTimeout(() => mail.focus(), 30);
    mdp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); tente(); } };
    const info = document.createElement("p");
    info.className = "aide";
    info.style.marginTop = "-4px";
    info.textContent = "Projet : " + (CFG?.url || "non configuré");
    corps.appendChild(info);
  }, [{ libelle: "Changer de projet", action: () => { ecranConfig(); } },
      { libelle: "Se connecter", genre: "primaire", action: () => { tente(); return false; } }]);

  async function tente() {
    msg.textContent = "Connexion…";
    msg.style.color = "var(--ink-3)";
    try {
      const url = CFG.url;
      const r = await fetch(url + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ email: mail.value.trim(), password: mdp.value }),
      });
      // Une réponse vide ne doit pas ressortir en « Unexpected end of JSON
      // input » : on lit le texte, puis on tente de l'interpréter.
      const txt = await r.text();
      let j = {};
      try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { msg: txt.slice(0, 120) }; }
      if (!r.ok) {
        throw new Error((j.error_description || j.msg || "Identifiants refusés.") +
          " (HTTP " + r.status + ")");
      }
      if (!j.access_token) {
        throw new Error("Réponse inattendue de " + url + " — HTTP " + r.status +
          (txt ? "" : ", corps vide") + ". Vérifiez l'adresse du projet.");
      }
      SESSION = j;
      localStorage.setItem(CLE_SESSION, JSON.stringify(SESSION));
      fermeModale();
      demarre();
    } catch (e) {
      msg.style.color = "var(--rouge)";
      msg.textContent = e.message;
    }
  }
}

/**
 * Fin de session. Ce qu'il faut effacer à l'écran dépend de la page : la
 * console vide sa liste d'événements, le rapport ses chiffres. Chacune le dit
 * en définissant `videEcran`.
 */
function deconnecte(message) {
  SESSION = null;
  localStorage.removeItem(CLE_SESSION);
  if (typeof videEcran === "function") videEcran();
  ecranConnexion(message);
}

/* Le message va dans la barre du haut, qui existe toujours, et en écho dans
   la fiche quand elle est ouverte. Une erreur avalée est pire qu'une erreur. */
let effaceur;
function signale(txt, erreur) {
  const s = $("statut");
  if (s) {
    s.className = "statut " + (erreur ? "err" : "ok");
    s.textContent = txt;
    clearTimeout(effaceur);
    if (!erreur) effaceur = setTimeout(() => { s.textContent = ""; s.className = "statut"; }, 6000);
  }
  const m = $("msgSync");
  if (m) { m.className = erreur ? "err" : "ok"; m.textContent = txt; }
  if (erreur) console.error("[console]", txt);
}

/* ------------------------------------------------------------------
   Briques d'affichage
   ------------------------------------------------------------------ */
const bloc = (titre) => {
  const d = document.createElement("div");
  d.className = "bloc";
  const t = document.createElement("span");
  t.className = "eyebrow";
  t.textContent = titre;
  d.appendChild(t);
  return d;
};
const grille = () => { const d = document.createElement("div"); d.className = "grille"; return d; };

/** Adresse de base des pages, déduite de celle de la console. */
const BASE_PAGES = location.origin + location.pathname.replace(/[^/]*$/, "");

/* ------------------------------------------------------------------
   Thème
   ------------------------------------------------------------------ */
const CLE_THEME = "console-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sombre = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = sombre ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(CLE_THEME, next); } catch (e) {}
};

const RYTHMES = [[0, "Manuel uniquement"], [15, "Toutes les 15 minutes"],
                 [60, "Toutes les heures"], [360, "Toutes les 6 heures"],
                 [1440, "Une fois par jour"]];

let EVTS = [], selection = null, PLANS = {};


/**
 * Appel d'une fonction qui rend compte au fil de l'eau.
 *
 * La réponse est un flux de lignes JSON plutôt qu'un objet unique : une
 * synchronisation dure trop longtemps pour qu'un message figé dise où l'on en
 * est. On lit ligne à ligne, on prévient l'appelant de chacune, et on renvoie
 * la dernière — celle qui porte le résultat.
 */
async function fluxFonction(nom, corps, surLigne) {
  const r = await fetch(CFG.url + "/functions/v1/" + nom, {
    method: "POST",
    headers: entetes(true),
    body: JSON.stringify(corps),
  });
  // un refus arrive avant le flux, sous forme d'objet unique
  if (!r.ok || !r.body) {
    const j = await r.json().catch(() => ({}));
    throw new Error(j.erreur || "Erreur " + r.status);
  }

  const lecteur = r.body.getReader();
  const dec = new TextDecoder();
  const FIN = String.fromCharCode(10);
  let reste = "", dernier = null;
  for (;;) {
    const { done, value } = await lecteur.read();
    if (done) break;
    reste += dec.decode(value, { stream: true });
    let i;
    while ((i = reste.indexOf(FIN)) >= 0) {
      const ligne = reste.slice(0, i).trim();
      reste = reste.slice(i + 1);
      if (!ligne) continue;
      let o;
      try { o = JSON.parse(ligne); } catch (e) { continue; }
      if (o.erreur) throw new Error(o.erreur);
      surLigne(o);
      if (o.ok) dernier = o;
    }
  }
  return dernier;
}

/**
 * Barre d'avancement à étapes. Les étapes sont annoncées par le serveur, non
 * devinées ici : lui seul sait ce qu'il va réellement faire.
 */
function barreAvancement(hote, etapes) {
  hote.innerHTML = "";
  const b = document.createElement("div");
  b.className = "avance";
  etapes.forEach((e) => {
    const d = document.createElement("div");
    d.className = "pas";
    d.dataset.cle = e.cle;
    d.dataset.etat = "attente";
    d.innerHTML = '<span class="jauge"></span><span class="lib"></span><span class="det"></span>';
    d.querySelector(".lib").textContent = e.libelle;
    if (e.source && e.source !== "klipso") d.querySelector(".det").textContent = e.source;
    b.appendChild(d);
  });
  hote.appendChild(b);
  return (cle, etat, info) => {
    const d = b.querySelector('.pas[data-cle="' + CSS.escape(cle) + '"]');
    if (!d) return;
    d.dataset.etat = etat;
    if (info !== undefined) d.querySelector(".det").textContent = info;
  };
}

async function fonction(nom, corps) {
  const r = await fetch(CFG.url + "/functions/v1/" + nom, {
    method: "POST",
    headers: entetes(true),
    body: JSON.stringify(corps),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erreur || "Erreur " + r.status);
  return j;
}



/* ------------------------------------------------------------------
   Données
   ------------------------------------------------------------------ */
const slugifie = (t) => String(t).toLowerCase().normalize("NFD")
  .replace(/\p{Diacritic}/gu, "").replace(/[^a-z0-9]+/g, "-")
  .replace(/^-|-$/g, "").slice(0, 40);

const courant = () => EVTS.find((e) => e.id === selection);

async function charge() {
  EVTS = await rest("evenement?select=*&order=modifie_le.desc");
  if (!EVTS.some((e) => e.id === selection)) selection = EVTS[0]?.id ?? null;
  if (selection) await chargePlans(selection);
  dessine();
}

async function chargePlans(id) {
  PLANS[id] = await rest("plan?evenement_id=eq." + id +
    "&select=id,id_klipso,libelle,hall,publie,nb_stands,nb_zones&order=libelle.asc");
}

async function majEvenement(id, champs) {
  await rest("evenement?id=eq." + id, {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({ ...champs, modifie_le: new Date().toISOString() }),
  });
}

/* ------------------------------------------------------------------
   Colonne de gauche
   ------------------------------------------------------------------ */
function dessineRail() {
  const box = $("listeEvts");
  if (!EVTS.length) {
    box.innerHTML = '<div class="vide">Aucun événement.<br>Créez-en un pour commencer.</div>';
    return;
  }
  box.innerHTML = EVTS.map((e) => {
    const p = PLANS[e.id] || [];
    const publies = p.filter((x) => x.publie).length;
    return '<button class="evt" data-id="' + e.id + '" aria-current="' + (e.id === selection) + '">' +
      '<span class="nom">' + esc(e.nom) + '</span>' +
      '<span class="meta"><span class="etat ' + e.etat + '">' +
      (e.etat === "publie" ? "Publié" : "Brouillon") + '</span>' +
      '<span>' + (p.length ? publies + "/" + p.length + " pavillons" : "—") +
      '</span></span></button>';
  }).join("");
  box.querySelectorAll(".evt").forEach((b) => b.onclick = async () => {
    selection = b.dataset.id;
    if (!PLANS[selection]) await chargePlans(selection);
    dessine();
  });
}

/* ------------------------------------------------------------------
   Fiche
   ------------------------------------------------------------------ */
function champ(cle, libelle, aide, attrs) {
  const e = courant();
  const l = document.createElement("label");
  l.innerHTML = '<span></span><input ' + (attrs || "") + '>' + (aide ? '<span class="aide"></span>' : "");
  l.querySelector("span").textContent = libelle;
  if (aide) l.querySelector(".aide").textContent = aide;
  const i = l.querySelector("input");
  i.value = e[cle] == null ? "" : e[cle];
  let attente;
  i.oninput = () => {
    e[cle] = i.value;
    if (cle === "slug") e.slug = slugifie(i.value);
    clearTimeout(attente);
    attente = setTimeout(async () => {
      try {
        await majEvenement(e.id, { [cle]: e[cle] });
        if (cle === "nom") dessineRail();
        if (cle === "slug") { i.value = e.slug; majIntegration(); }
      } catch (err) { signale(err.message, true); }
    }, 500);
  };
  return l;
}


function dessineFiche() {
  const e = courant();
  const f = $("fiche");
  if (!SESSION) { f.innerHTML = '<div class="vide">Connectez-vous pour accéder aux événements.</div>'; return; }
  if (!e) {
    f.innerHTML = '<div class="vide">Sélectionnez un événement à gauche,<br>ou créez-en un nouveau.</div>';
    return;
  }
  f.innerHTML = "";

  const entete = document.createElement("div");
  entete.className = "entete";
  entete.innerHTML = '<div><span class="eyebrow">Événement</span><h2></h2>' +
    '<span class="etat ' + e.etat + '">' + (e.etat === "publie" ? "Publié" : "Brouillon") + '</span></div>' +
    '<div class="droite">' +
    '<a class="btn petit" id="lienPublic" target="_blank" rel="noopener">Plan public</a>' +
    '<a class="btn petit" id="lienAdmin" target="_blank" rel="noopener">Plan · administration</a>' +
    '<a class="btn petit" id="lienRapport">Utilisation</a>' +
    '<button class="btn petit" id="btnSources">Sources de données</button>' +
    '<button class="btn petit" id="btnEtat"></button>' +
    '<button class="btn petit" id="btnDupliquer">Dupliquer</button>' +
    '<button class="btn petit danger" id="btnSupprimer">Supprimer</button></div>';
  entete.querySelector("h2").textContent = e.nom;
  f.appendChild(entete);

  majLiens(e);
  $("btnEtat").textContent = e.etat === "publie" ? "Repasser en brouillon" : "Publier";
  $("btnEtat").onclick = async () => {
    e.etat = e.etat === "publie" ? "brouillon" : "publie";
    try { await majEvenement(e.id, { etat: e.etat }); dessine(); }
    catch (err) { signale(err.message, true); }
  };
  $("btnSources").onclick = () => ouvreSources(() => dessine());
  $("btnDupliquer").onclick = () => dupliquer(e);
  $("btnSupprimer").onclick = () => confirme("Supprimer l'événement ?",
    "« " + e.nom + " », ses pavillons, son apparence et ses dessins seront " +
    "définitivement perdus.", "Supprimer", async () => {
      try {
        await rest("evenement?id=eq." + e.id, { method: "DELETE" });
        selection = null;
        await charge();
      } catch (err) { signale(err.message, true); }
    });

  const b1 = bloc("Identité");
  const g1 = grille();
  g1.appendChild(champ("nom", "Nom de l'événement"));
  g1.appendChild(champ("slug", "Identifiant d'URL", "Sert d'adresse publique du plan."));
  b1.appendChild(g1);
  f.appendChild(b1);

  const b2 = bloc("Synchronisation");
  const g2 = grille();
  const lr = document.createElement("label");
  lr.innerHTML = '<span>Rythme de rafraîchissement</span><select>' +
    RYTHMES.map((r) => '<option value="' + r[0] + '"' +
      (e.rythme_min === r[0] ? " selected" : "") + '>' + r[1] + '</option>').join("") + '</select>';
  lr.querySelector("select").onchange = async (ev) => {
    e.rythme_min = +ev.target.value;
    try { await majEvenement(e.id, { rythme_min: e.rythme_min }); }
    catch (err) { signale(err.message, true); }
  };
  g2.appendChild(lr);
  b2.appendChild(g2);

  const ligne = document.createElement("div");
  ligne.className = "etat-ligne";
  ligne.innerHTML = '<button class="btn petit" id="btnSync">Synchroniser maintenant</button>' +
    '<span id="msgSync"></span>';
  b2.appendChild(ligne);
  const zoneAv = document.createElement("div");
  zoneAv.id = "avancement";
  b2.appendChild(zoneAv);
  f.appendChild(b2);
  $("btnSync").onclick = () => synchronise(e);

  const br = bloc("Réglages");
  br.appendChild(ligneReglage("Provenance des données", () => resumeProvenance(e),
    ouvreProvenance));
  br.appendChild(ligneReglage("Fiche détail", () => resumeFiche(e), ouvreFiche));
  br.appendChild(ligneReglage("Salles de conférence", () => resumeSalles(e), ouvreSalles));
  f.appendChild(br);
  majMsgSync(e);

  /* --- pavillons --- */
  const plans = PLANS[e.id] || [];
  const b3 = bloc("Pavillons");
  if (!plans.length) {
    const p = document.createElement("p");
    p.className = "astuce";
    p.textContent = "Aucun pavillon connu. Lancez une synchronisation pour les récupérer.";
    b3.appendChild(p);
  } else {
    const t = document.createElement("table");
    // nommé pour qu'un écran étroit le fasse défiler seul, sans emporter la fiche
    t.className = "pavillons";
    t.innerHTML = "<thead><tr><th>Publier</th><th>Pavillon</th><th>Hall</th>" +
      "<th>Emplacements</th><th>Zones</th></tr></thead><tbody></tbody>";
    const tb = t.querySelector("tbody");
    plans.forEach((p) => {
      const tr = document.createElement("tr");
      if (!p.publie) tr.className = "eteint";
      tr.innerHTML = '<td><label class="coche"><input type="checkbox"' +
        (p.publie ? " checked" : "") + '></label></td>' +
        '<td class="nomplan"></td><td class="mono hall"></td>' +
        '<td class="num">' + (p.nb_stands ?? "—") + '</td>' +
        '<td class="num">' + (p.nb_zones ?? "—") + '</td>';
      tr.querySelector(".nomplan").textContent = p.libelle;
      tr.querySelector(".hall").textContent = p.hall || "—";
      tr.querySelector("input").onchange = async (ev) => {
        p.publie = ev.target.checked;
        try {
          await rest("plan?id=eq." + p.id, {
            method: "PATCH",
            headers: { "Prefer": "return=minimal" },
            body: JSON.stringify({ publie: p.publie }),
          });
          dessine();
        } catch (err) { signale(err.message, true); }
      };
      tb.appendChild(tr);
    });
    b3.appendChild(t);
  }
  f.appendChild(b3);

  const b4 = bloc("Intégration");
  const astuce = document.createElement("p");
  astuce.className = "astuce";
  astuce.textContent = "Collez ce fragment dans la page du salon.";
  b4.appendChild(astuce);
  const zone = document.createElement("div");
  zone.className = "integration";
  zone.style.marginTop = "10px";
  zone.innerHTML = '<textarea id="fragment" readonly></textarea>' +
    '<button class="btn petit" id="btnCopier">Copier</button>';
  b4.appendChild(zone);
  f.appendChild(b4);
  majIntegration();
  $("btnCopier").onclick = (ev) => {
    navigator.clipboard?.writeText($("fragment").value).then(
      () => { ev.target.textContent = "Copié"; setTimeout(() => ev.target.textContent = "Copier", 1600); },
      () => { ev.target.textContent = "Échec"; });
  };
}

/* ============================================================
   Provenance des données
   Un domaine, un fournisseur. La liste des fournisseurs diffère par domaine :
   la géométrie du plan ne vient que de Klipso, le reste pourra venir
   d'ailleurs. La clé d'identification reste celle de l'événement.
   ============================================================ */
const DOMAINES = [
  ["plan",        "Plan",        ["klipso"],
   "La géométrie des pavillons et des calques."],
  ["stands",      "Exposants",   ["klipso", "eventmaker"],
   "Les sociétés rattachées aux emplacements. La géométrie et les zones restent au plan."],
  ["conferences", "Conférences", ["aucun", "klipso", "eventmaker"],
   "Aucune synchronisation ne les reprend encore."],
  ["produits",    "Produits",    ["aucun", "klipso", "eventmaker"],
   "Aucune synchronisation ne les reprend encore."],
];
const FOURNISSEURS = {
  aucun: "Non synchronisé", klipso: "Klipso", eventmaker: "Eventmaker",
};

/* Un domaine que rien ne reprend vaut mieux « non synchronisé » qu'un
   fournisseur choisi par défaut : celui-ci laisserait croire à une reprise. */
const DEFAUT_DOMAINE = {
  plan: "klipso", stands: "klipso", conferences: "aucun", produits: "aucun",
};

/* Chaque fournisseur désigne l'événement à sa façon. Klipso n'est pas dans
   cette liste : son identité tient dans « Instance » et « Identifiant
   d'événement », déjà saisis plus haut dans la fiche. */
/**
 * Les réglages de raccordement, fournisseur par fournisseur.
 *
 * C'est cette liste qui décide des onglets de la fenêtre « Sources de
 * données » : brancher un outil de plus revient à y ajouter une entrée, sans
 * toucher au reste.
 *
 * Un champ vit soit dans une colonne de l'événement — c'est le cas de Klipso,
 * dont l'instance et l'identifiant précèdent le modèle multi-fournisseurs —
 * soit dans la colonne « cles », indexée par fournisseur.
 */
const FOURNISSEURS_CONF = [
  {
    cle: "klipso",
    nom: "Klipso",
    champs: [
      { colonne: "instance", libelle: "Instance", aide: "Le sous-domaine Klipso." },
      { colonne: "event_id", libelle: "Identifiant d'événement",
        aide: "Le GUID transmis dans l'en-tête X-GAIA-EventId." },
    ],
  },
  {
    cle: "eventmaker",
    nom: "Eventmaker",
    champs: [
      { dansCles: "eventmaker", libelle: "Identifiant de l'événement",
        aide: "Vingt-quatre caractères, visibles dans l'adresse de l'événement sur app.eventmaker.io.",
        forme: /^[0-9a-f]{24}$/i, exemple: "69ef6fb4406b394eda9b8a3e" },
    ],
  },
];

/** Un fournisseur est-il retenu quelque part ? */
const fournisseurUtilise = (e, cle) =>
  DOMAINES.some(([d]) => ((e.sources || {})[d] || {}).fournisseur === cle);

/** Le fournisseur retenu pour un domaine, défaut compris. */
const source = (e, dom) =>
  ((e.sources || {})[dom] || {}).fournisseur || DEFAUT_DOMAINE[dom] || "klipso";

/** Champ de clé. Il n'est pas caché quand le fournisseur n'est pas encore
 *  retenu : on saisit souvent l'identifiant avant de basculer la source. */
function champCle(cle, libelle, aide, forme, exemple) {
  const e = courant();
  const l = document.createElement("label");
  l.innerHTML = '<span></span><input spellcheck="false"><span class="aide"></span>';
  l.querySelector("span").textContent = libelle;
  const i = l.querySelector("input"), a = l.querySelector(".aide");
  i.value = (e.cles || {})[cle] || "";
  i.placeholder = exemple;
  if (!fournisseurUtilise(e, cle)) l.classList.add("source-inerte");

  const dit = () => {
    const v = i.value.trim();
    a.textContent = v && forme && !forme.test(v)
      ? "Format inattendu — un identifiant ressemble à « " + exemple + " »."
      : aide;
    a.classList.toggle("alerte", Boolean(v && forme && !forme.test(v)));
  };
  dit();

  let attente;
  i.oninput = () => {
    dit();
    clearTimeout(attente);
    attente = setTimeout(async () => {
      e.cles = { ...(e.cles || {}) };
      const v = i.value.trim();
      if (v) e.cles[cle] = v; else delete e.cles[cle];
      try { await majEvenement(e.id, { cles: e.cles }); }
      catch (err) { signale(err.message, true); }
    }, 500);
  };
  return l;
}

/** Une ligne de provenance, enregistrée à chaque modification. */
function ligneSource(dom, libelle, offerts, aide) {
  const e = courant();
  const src = (e.sources && e.sources[dom]) || {};
  const choisi = src.fournisseur || DEFAUT_DOMAINE[dom] || "klipso";
  const l = document.createElement("label");
  l.innerHTML = '<span></span><select>' +
    offerts.map((k) => '<option value="' + k + '"' +
      (choisi === k ? " selected" : "") + '>' +
      FOURNISSEURS[k] + '</option>').join("") +
    '</select><span class="aide"></span>';
  l.querySelector("span").textContent = libelle;
  l.querySelector(".aide").textContent = aide;
  l.querySelector("select").onchange = async (ev) => {
    e.sources = { ...(e.sources || {}) };
    e.sources[dom] = { fournisseur: ev.target.value };
    try { await majEvenement(e.id, { sources: e.sources }); }
    catch (err) { signale(err.message, true); }
  };
  return l;
}

/* ============================================================
   Contenu de la fiche détail
   Deux décisions par ligne, et elles vont ensemble : ce que la fiche montre —
   l'état de commercialisation d'un stand n'a rien à faire sur le site du
   salon — et le champ d'origine qui l'alimente, dont le nom change d'un salon
   à l'autre. Les régler dans deux fenêtres séparées revenait à faire deux fois
   le tour de la même liste.

   Le réglage vit à côté de l'événement, et non dans le navigateur de celui qui
   l'a fait — sinon le visiteur n'en verrait rien.
   ============================================================ */

/**
 * Une ligne de la fiche.
 *
 *   cle     nomme le réglage d'affichage. Absente, la ligne ne se masque pas.
 *   cible   nomme le champ d'origine à associer. Absente, rien n'est à régler :
 *           la valeur vient du plan, pas d'une fiche d'exposant.
 *   fixe    dit d'où vient la valeur quand il n'y a pas de champ à choisir.
 */
const LIGNES_FICHE = {
  stand: [
    { cible: "nom", libelle: "Enseigne",
      aide: "Le titre de la fiche : toujours affiché." },
    { cle: "raison", cible: "raison", libelle: "Raison sociale",
      aide: "Quand elle diffère de l'enseigne." },
    { cle: "code", libelle: "Numéro de stand", fixe: "allée et numéro du plan",
      aide: "Affiché à côté du pavillon." },
    { cle: "niveaux", libelle: "Niveaux", fixe: "nombre de niveaux du plan",
      aide: "Seulement au-delà d'un niveau." },
    { cle: "adresse", cible: "adresse", libelle: "Adresse" },
    { cible: "codePostal", libelle: "Code postal", montre: "avec l'adresse",
      suit: "adresse",
      aide: "Rejoint l'adresse sur la même ligne, comme sur une enveloppe." },
    { cle: "ville", cible: "ville", libelle: "Ville" },
    { cle: "pays", cible: "pays", libelle: "Pays" },
    { cle: "telephone", cible: "telephone", libelle: "Téléphone société" },
    { cle: "site", cible: "site", libelle: "Site web" },
    { cle: "facebook", cible: "facebook", libelle: "Facebook" },
    { cle: "linkedin", cible: "linkedin", libelle: "LinkedIn" },
    { cle: "instagram", cible: "instagram", libelle: "Instagram" },
    { cle: "nomenclature", cible: "nomenclature", libelle: "Nomenclature",
      aide: "Les rubriques du catalogue. Plusieurs champs se cumulent." },
    { cle: "conferences", libelle: "Conférences", fixe: "programme du salon",
      aide: "Les conférences tenues par l'exposant, où qu'elles se tiennent." },
  ],
  zone: [
    { cle: "conferences", libelle: "Conférences",
      aide: "Le programme tenu dans la zone, par ordre chronologique." },
  ],
};

/**
 * Ce qui ne paraît jamais sur la fiche, mais décide de ce qu'elle contient.
 *
 * Les deux premières lignes sont les plus lourdes de conséquences de toute la
 * fenêtre : c'est par elles qu'une fiche Eventmaker retrouve son emplacement
 * sur le plan. Mal réglées, aucun exposant n'apparaît. Klipso n'a ni l'une ni
 * l'autre à régler — le numéro se compose de l'allée et du numéro portés par
 * l'emplacement, le dossier est une clé du modèle.
 */
const LIGNES_RATTACHEMENT = {
  klipso: [
    { cible: "exclu", libelle: "Exclu de la liste",
      aide: "Une valeur vraie retire l'exposant du plan public, quel que soit le reste." },
  ],
  eventmaker: [
    /* « Numéro de stand » figure déjà plus haut, mais ce n'est pas le même :
       celui-là est affiché et vient du plan, celui-ci est lu sur la fiche de
       l'exposant pour l'y rattacher. Le libellé doit dire lequel des deux. */
    { cible: "stand", libelle: "Numéro de stand de l'exposant",
      aide: "Le numéro tel que sa fiche le porte, comparé à celui du plan, " +
        "mise en forme ignorée. Mal réglé, aucun exposant n'apparaît." },
    { cible: "dossier", libelle: "Identifiant de dossier",
      aide: "Le dossier Klipso recopié sur la fiche : le rattachement le plus sûr." },
    { cible: "exclu", libelle: "Exclu de la liste",
      aide: "Une valeur vraie retire l'exposant du plan public, quel que soit le reste." },
  ],
};

/* Ce qui se règle mais que rien n'alimente : à montrer en retrait plutôt qu'à
   taire, sans quoi on croirait le champ déjà repris. */
const FICHE_INERTE = {};

/** Ce qu'on lit sans ouvrir : les exceptions, pas la liste complète. */
function resumeProvenance(e) {
  const s = e.sources || {};
  const autres = DOMAINES
    .filter(([d]) => ((s[d] || {}).fournisseur || DEFAUT_DOMAINE[d] || "klipso") !==
      (DEFAUT_DOMAINE[d] || "klipso"))
    .map(([d, lib]) => lib + " : " +
      (FOURNISSEURS[s[d].fournisseur] || s[d].fournisseur));
  // une source retenue sans son identifiant ne peut rien lire : le dire ici
  // plutôt que d'attendre l'échec de la synchronisation
  const manque = FOURNISSEURS_CONF
    .filter((f) => fournisseurUtilise(e, f.cle) && f.champs.some((c) =>
      c.dansCles ? !(e.cles || {})[c.dansCles] : !e[c.colonne]))
    .map((f) => f.nom);
  if (manque.length) autres.push("raccordement " + manque.join(", ") + " incomplet");
  return autres.length ? autres.join(" · ") : "Klipso pour tout";
}

function resumeSalles(e) {
  const s = e.salles || {};
  const ids = Object.keys(s);
  if (!ids.length) return "Aucune salle connue";
  const situees = ids.filter((i) => s[i].zone).length;
  const manuelles = ids.filter((i) => s[i].manuel).length;
  return situees + " / " + ids.length + " situées" +
    (manuelles ? " · " + manuelles + " à la main" : "") +
    (situees < ids.length ? " · " + (ids.length - situees) + " à situer" : "");
}

function resumeFiche(e) {
  const parts = [];
  // « Conférences » figure des deux côtés : sans le type devant, on ne saurait
  // pas laquelle est masquée.
  [["stand", "Stand"], ["zone", "Zone"]].forEach(([type, court]) => {
    const r = (e.fiche && e.fiche[type]) || {};
    const caches = LIGNES_FICHE[type]
      .filter((l) => l.cle && r[l.cle] === false).map((l) => l.libelle);
    if (caches.length) parts.push(court + " : " + caches.join(", "));
  });

  /* La correspondance tient dans le même réglage : la dire ici évite d'ouvrir
     la fenêtre pour savoir si elle a été touchée. */
  const src = source(e, "stands");
  const bloc = correspondance(e, src);
  const associes = Object.keys(bloc.champs || {}).length;
  const mots = [parts.length ? "Masqué — " + parts.join(" · ") : "Tout affiché"];
  if (src !== "aucun") {
    mots.push(associes
      ? associes + " champ" + (associes > 1 ? "s" : "") + " associé" +
        (associes > 1 ? "s" : "") + " à la main"
      : bloc.detecteLe ? "champs d'origine proposés" : "champs d'origine non relevés");
  }
  return mots.join(" · ");
}

/**
 * Une case à cocher. Un champ non réglé est affiché : ajouter un champ plus
 * tard ne doit pas le faire disparaître des salons déjà réglés.
 *
 * `apres` sert aux lignes où la case commande autre chose qu'elle-même — le
 * champ d'origine se grise quand le champ ne paraît plus.
 */
function caseFiche(type, cle, libelle, aide, apres) {
  const e = courant();
  const regle = (e.fiche && e.fiche[type]) || {};
  const l = document.createElement("label");
  l.className = "case";
  l.innerHTML = '<input type="checkbox"><span></span>' +
                (aide ? '<span class="aide"></span>' : "");
  l.querySelector("span").textContent = libelle;
  if (aide) l.querySelector(".aide").textContent = aide;
  const i = l.querySelector("input");
  i.checked = regle[cle] !== false;
  if (!libelle) i.setAttribute("aria-label", "Afficher ce champ sur la fiche");
  if (apres) apres(i.checked);
  i.onchange = async () => {
    e.fiche = { ...(e.fiche || {}) };
    e.fiche[type] = { ...(e.fiche[type] || {}), [cle]: i.checked };
    if (apres) apres(i.checked);
    try { await majEvenement(e.id, { fiche: e.fiche }); }
    catch (err) {
      signale(err.message, true);
      i.checked = !i.checked;
      if (apres) apres(i.checked);
    }
  };
  return l;
}

/**
 * Une ligne de réglage : ce qu'il vaut, et de quoi l'ouvrir. Le détail tient
 * dans une fenêtre — quatre listes déroulantes et neuf cases à cocher rendaient
 * la fiche illisible alors qu'on n'y touche qu'une fois par salon.
 */
function ligneReglage(titre, resume, ouvre) {
  const d = document.createElement("div");
  d.className = "reglage-ligne";
  d.innerHTML = '<span class="rt"></span><span class="rv"></span>' +
                '<button class="btn petit">Modifier</button>';
  d.querySelector(".rt").textContent = titre;
  const v = d.querySelector(".rv");
  const maj = () => { v.textContent = resume(); };
  maj();
  d.querySelector("button").onclick = () => ouvre(maj);
  return d;
}

function ouvreProvenance(apres) {
  ouvreModale("Provenance des données", (corps) => {
    const e = courant();
    const g = grille();
    DOMAINES.forEach(([dom, lib, offerts, aide]) => {
      const l = ligneSource(dom, lib, offerts, aide);
      if (source(e, dom) === "aucun") l.classList.add("source-inerte");
      g.appendChild(l);
    });
    corps.appendChild(g);
    const note = document.createElement("p");
    note.className = "aide";
    note.textContent = "Les identifiants d'événement se saisissent dans " +
      "« Sources de données », en haut de la fiche.";
    corps.appendChild(note);
  }, [{ libelle: "Terminé", genre: "primaire" }], apres);
}

/**
 * Fenêtre des raccordements, un onglet par fournisseur. Chaque onglet dit
 * aussi ce qu'il alimente : un identifiant saisi sans qu'aucun domaine ne
 * s'en serve ne produirait rien, et c'est le genre d'oubli qu'on ne voit pas.
 */
function ouvreSources(apres) {
  ouvreModale("Sources de données", (corps) => {
    const e = courant();
    const barre = document.createElement("div");
    barre.className = "onglets";
    const boutons = [], panneaux = [];

    FOURNISSEURS_CONF.forEach((f, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = f.nom;
      b.setAttribute("aria-pressed", String(i === 0));
      barre.appendChild(b);
      boutons.push(b);

      const pan = document.createElement("div");
      pan.hidden = i > 0;
      const g = grille();
      f.champs.forEach((c) => {
        g.appendChild(c.dansCles
          ? champCle(c.dansCles, c.libelle, c.aide, c.forme, c.exemple)
          : champ(c.colonne, c.libelle, c.aide, 'spellcheck="false"'));
      });
      pan.appendChild(g);

      const sert = DOMAINES.filter(([d]) => source(e, d) === f.cle).map(([, lib]) => lib);
      const note = document.createElement("p");
      note.className = "aide";
      note.textContent = sert.length
        ? "Alimente : " + sert.join(", ") + "."
        : "Aucun domaine n'utilise cette source pour le moment.";
      pan.appendChild(note);
      panneaux.push(pan);

      b.onclick = () => {
        boutons.forEach((x, k) => x.setAttribute("aria-pressed", String(k === i)));
        panneaux.forEach((x, k) => { x.hidden = k !== i; });
      };
    });

    corps.appendChild(barre);
    panneaux.forEach((x) => corps.appendChild(x));
  }, [{ libelle: "Terminé", genre: "primaire" }], apres);
}

/**
 * Salles de conférence et zones organisateur.
 *
 * Une salle Eventmaker s'appelle « Agora (P160) ». Le code entre parenthèses
 * est un emplacement du plan, et la synchronisation retrouve la zone qui le
 * contient — dix fois sur onze. Le reste se désigne ici, à la main : un code
 * absent du plan ne se devine pas.
 *
 * Un rattachement manuel est marqué comme tel et n'est plus jamais écrasé par
 * la synchronisation, qui continue pourtant de proposer ce qu'elle trouve.
 */
async function ouvreSalles(apres) {
  const e = courant();
  const salles = JSON.parse(JSON.stringify(e.salles || {}));
  const ids = Object.keys(salles);

  // les zones du plan, pour les proposer au choix
  let zones = [];
  try {
    const pl = await rest("plan?select=id&evenement_id=eq." + e.id);
    if (pl.length) {
      const inst = await rest("instantane?select=charge&plan_id=in.(" +
        pl.map((x) => x.id).join(",") + ")");
      zones = inst.flatMap((i) => (i.charge?.zones || [])
        .map((z) => ({ id: z.id, nom: z.nom, m2: z.m2 })));
    }
  } catch (err) { signale(err.message, true); }
  const parZone = Object.fromEntries(zones.map((z) => [z.id, z]));
  const nomZone = (id) => {
    const z = parZone[id];
    if (!z) return id ? id + " (absente du plan)" : "";
    return (z.nom || "Zone sans nom") + (z.m2 ? " · " + Math.round(z.m2) + " m²" : "");
  };

  ouvreModale("Salles de conférence", (corps) => {
    if (!ids.length) {
      const p = document.createElement("p");
      p.textContent = "Aucune salle connue. Synchronisez l'événement avec " +
        "Conférences réglé sur Eventmaker.";
      corps.appendChild(p);
      return;
    }

    const t = document.createElement("table");
    t.className = "salles";
    t.innerHTML = "<thead><tr><th>Salle</th><th>Code</th><th>Zone organisateur</th></tr></thead>";
    const corpsT = document.createElement("tbody");

    ids.sort((a, b) => String(salles[a].nom || "").localeCompare(String(salles[b].nom || ""), "fr"))
      .forEach((id) => {
        const s = salles[id];
        const tr = document.createElement("tr");
        tr.innerHTML = "<td class=\"n\"></td><td class=\"c\"></td><td></td>";
        tr.querySelector(".n").textContent = s.nom || id;
        tr.querySelector(".c").textContent = s.code || "—";

        const sel = document.createElement("select");
        sel.innerHTML = '<option value="">— non située —</option>' +
          zones.map((z) => '<option value="' + z.id + '">' + esc(nomZone(z.id)) + '</option>').join("");
        sel.value = s.zone || "";
        tr.lastElementChild.appendChild(sel);

        const etat = document.createElement("span");
        etat.className = "etat-salle";
        const dis = () => {
          etat.textContent = !s.zone
            ? (s.auto ? "proposition ignorée" : "à situer")
            : s.manuel ? "choisi à la main"
            : "trouvé automatiquement";
          etat.dataset.genre = !s.zone ? "manque" : s.manuel ? "manuel" : "auto";
          tr.dataset.etat = etat.dataset.genre;
        };
        dis();
        tr.lastElementChild.appendChild(etat);

        sel.onchange = () => {
          s.zone = sel.value || null;
          // ne redevient automatique que si l'on retrouve exactement la
          // proposition de la synchronisation
          s.manuel = Boolean(s.zone) && s.zone !== s.auto;
          dis();
        };
        corpsT.appendChild(tr);
      });

    t.appendChild(corpsT);
    corps.appendChild(t);

    const note = document.createElement("p");
    note.className = "aide";
    const situees = ids.filter((i) => salles[i].zone).length;
    note.textContent = situees + " salle" + (situees > 1 ? "s" : "") + " sur " + ids.length +
      " située" + (situees > 1 ? "s" : "") + ". Un rattachement choisi à la main " +
      "n'est plus modifié par les synchronisations suivantes.";
    corps.appendChild(note);
  }, [
    { libelle: "Annuler" },
    { libelle: "Enregistrer", genre: "primaire", action: () => {
      majEvenement(e.id, { salles })
        .then(() => { e.salles = salles; signale("Rattachements enregistrés."); })
        .catch((err) => signale(err.message, true));
    } },
  ], apres);
}

/**
 * Fenêtre de la fiche détail : ce qu'elle montre, et ce qui l'alimente.
 *
 * Deux onglets, parce que les deux types n'ont presque rien en commun : un
 * stand tire son contenu d'une fiche d'exposant, une zone organisateur n'a que
 * son programme. Côte à côte, les deux listes se lisaient comme une seule.
 *
 * Côté stand, la case et la liste déroulante vont ensemble sur la même ligne :
 * décider qu'un champ paraît et décider d'où il vient sont la même question,
 * posée deux fois si on les sépare. Décocher n'efface pas le champ associé —
 * on le retrouve tel quel en recochant.
 */
function ouvreFiche(apres) {
  const e = courant();
  const src = source(e, "stands");
  const bloc = correspondance(e, src);
  const mappable = src !== "aucun";

  ouvreModale("Fiche détail", (corps) => {
    const barre = document.createElement("div");
    barre.className = "onglets";
    const boutons = [], panneaux = [];

    [["stand", "Stand"], ["zone", "Zone organisateur"]].forEach(([type, titre], i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = titre;
      b.setAttribute("aria-pressed", String(i === 0));
      barre.appendChild(b);
      boutons.push(b);

      const pan = document.createElement("div");
      pan.hidden = i > 0;
      panneaux.push(pan);
      /* Une zone n'a pas de fiche d'exposant derrière elle : rien à associer,
         donc pas de tableau — la liste de cases suffit, et c'est celle que la
         fenêtre montrait déjà. */
      if (type === "zone" || !mappable) {
        pan.className = "colonne-cases";
        const inertes = FICHE_INERTE[type] || [];
        LIGNES_FICHE[type].filter((l) => l.cle).forEach((l) => {
          const c = caseFiche(type, l.cle, l.libelle, l.aide);
          if (inertes.indexOf(l.cle) >= 0) c.classList.add("source-inerte");
          pan.appendChild(c);
        });
        if (type === "stand" && !mappable) {
          const p = document.createElement("p");
          p.className = "aide";
          p.textContent = "Aucune source d'exposants : il n'y a pas de champ " +
            "d'origine à associer. Choisissez-en une dans « Provenance des données ».";
          pan.appendChild(p);
        }
        return;
      }

      pan.appendChild(tableauChamps(LIGNES_FICHE.stand, type, src, true));
      const t2 = document.createElement("span");
      t2.className = "eyebrow";
      t2.style.display = "block";
      t2.style.margin = "18px 0 8px";
      t2.textContent = "Ce qui ne s'affiche pas";
      pan.appendChild(t2);
      pan.appendChild(tableauChamps(LIGNES_RATTACHEMENT[src] || [], type, src, false));
    });

    corps.appendChild(barre);
    panneaux.forEach((x) => corps.appendChild(x));

    const note = document.createElement("p");
    note.className = "aide";
    note.textContent = mappable
      ? (bloc.detecteLe
        ? "Les champs proposés viennent du relevé de la dernière " +
          "synchronisation, le " + new Date(bloc.detecteLe).toLocaleString("fr-FR",
            { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) +
          ". Un champ choisi à la main n'est plus jamais reproposé, et le " +
          "réglage prend effet à la synchronisation suivante."
        : "Les champs d'origine se relèvent à la synchronisation : lancez-en " +
          "une pour qu'ils soient proposés ici.")
      : "Le nom et le pavillon sont toujours affichés : sans eux la fiche ne " +
        "désigne plus rien.";
    corps.appendChild(note);
  }, [{ libelle: "Terminé", genre: "primaire" }], apres);
}

/**
 * Le tableau d'un groupe de lignes.
 *
 * `avecCases` distingue ce que la fiche montre — une case décide de son
 * affichage — de ce qui ne s'affiche jamais mais décide du reste : le numéro
 * de stand par lequel une fiche retrouve son emplacement, l'exclusion du
 * catalogue. Les seconds n'ont rien à cocher.
 */
function tableauChamps(lignes, type, src, avecCases) {
  const t = document.createElement("table");
  t.className = "champs";
  t.innerHTML = "<thead><tr>" + (avecCases ? "<th>Afficher</th>" : "") +
    "<th>Sur la fiche</th><th>Champ d'origine</th></tr></thead>";
  const tb = document.createElement("tbody");

  /* Une ligne peut n'avoir pas de case à elle et suivre celle d'une autre :
     le code postal tient sur la ligne de l'adresse, et disparaît avec elle.
     Elles s'inscrivent ici, et la case du chef de file les entraîne. */
  const suiveurs = {};
  const affiche = (cle) => !(((courant().fiche || {})[type] || {})[cle] === false);

  lignes.forEach((l) => {
    const tr = document.createElement("tr");
    tr.innerHTML = (avecCases ? '<td class="montre"></td>' : "") +
      '<td class="n"><span class="lib"></span><span class="aide"></span></td>' +
      "<td></td>";
    tr.querySelector(".lib").textContent = l.libelle;
    if (l.aide) tr.querySelector(".aide").textContent = l.aide;

    /* Le champ d'origine d'abord : c'est lui que la case va montrer ou
       cacher, il doit donc exister avant elle. */
    const cellule = tr.lastElementChild;
    let choix = null;
    if (l.cible) {
      choix = champOrigine(src, l.cible, (genre) => { tr.dataset.etat = genre; });
      cellule.appendChild(choix.hote);
    } else {
      const fixe = document.createElement("span");
      fixe.className = "etat-salle";
      fixe.dataset.genre = "libre";
      fixe.textContent = l.fixe || "sans champ à régler";
      cellule.appendChild(fixe);
    }

    /* Un champ que la fiche ne montre pas n'a pas de source à choisir : la
       liste disparaît plutôt que de rester là, grisée, à occuper une ligne
       pour rien. Le réglage, lui, n'est pas effacé — il revient tel quel en
       recochant. */
    const bascule = (montre) => {
      tr.classList.toggle("source-inerte", !montre);
      if (!choix) return;
      choix.hote.hidden = !montre;
      // la barre de couleur dit d'où vient un champ : sans champ, elle ne dit
      // plus rien
      if (montre) choix.dis(); else delete tr.dataset.etat;
    };

    if (avecCases) {
      const c = tr.querySelector(".montre");
      if (!l.cle) {
        // rien à décider ici : la case mentirait en laissant croire au choix
        const tj = document.createElement("span");
        tj.className = "etat-salle";
        tj.dataset.genre = "libre";
        tj.textContent = l.montre || "toujours";
        c.appendChild(tj);
        if (l.suit) {
          (suiveurs[l.suit] = suiveurs[l.suit] || []).push(bascule);
          bascule(affiche(l.suit));
        }
      } else {
        c.appendChild(caseFiche(type, l.cle, "", null, (montre) => {
          bascule(montre);
          (suiveurs[l.cle] || []).forEach((f) => f(montre));
        }));
      }
    }
    tb.appendChild(tr);
  });

  t.appendChild(tb);
  return t;
}

/* ------------------------------------------------------------------
   Correspondance des champs d'origine

   Les champs d'exposant ne portent pas le même nom d'un salon à l'autre :
   « x_Catalogue_RaisonSociale » ici, autre chose ailleurs, et côté Eventmaker
   ce sont des champs de fiche nommés par l'organisateur. Écrits dans la
   synchronisation, ils condamnaient un salon nommé autrement à un déploiement.

   La liste des champs disponibles vient de la synchronisation, qui les relève
   en lisant les fiches — il n'y a rien à demander de plus, et rien à détecter
   à part.
   ------------------------------------------------------------------ */

/* Deux valeurs qui ne sont pas des noms de champ : « rien de réglé », qui
   laisse jouer le champ par défaut, et « ne rien lire », qui est un choix.
   La seconde s'enregistre en chaîne vide ; l'absence, elle, veut dire la
   première. Le « = » de tête les met hors d'atteinte d'un nom de champ. */
const DEFAUT_CHAMP = "=defaut";
const AUCUN_CHAMP = "=aucun";

/* Une cible peut lire plusieurs champs — le premier renseigné l'emporte, sauf
   la nomenclature où ils se cumulent. La liste déroulante n'a qu'une valeur
   par ligne : on la compose en les joignant, aucun nom de champ ne portant de
   barre verticale. */
const encode = (v) => v === undefined || v === null ? DEFAUT_CHAMP
  : ([].concat(v).filter(Boolean).join("|") || AUCUN_CHAMP);
const decode = (v) => v === DEFAUT_CHAMP ? undefined
  : v === AUCUN_CHAMP ? ""
  : v.indexOf("|") >= 0 ? v.split("|") : v;

/** Le bloc de correspondance d'un fournisseur, jamais nul. */
const correspondance = (e, src) => (e.correspondances || {})[src] || {};

// le préfixe dit l'origine, que le groupe annonce déjà
const sansPrefixe = (cle) => String(cle).replace(/^[a-z]+:/, "");
const courte = (v) => {
  const t = String(v || "").trim();
  return t.length > 34 ? t.slice(0, 32) + "…" : t;
};

/**
 * L'intitulé d'un champ dans la liste déroulante.
 *
 * Trois choses, dans cet ordre : le nom technique, parce que c'est lui qu'on
 * retrouvera dans l'API ; son libellé quand le schéma en donne un de
 * différent ; et une valeur telle qu'elle a été lue. C'est cette dernière qui
 * fait choisir — « x_Catalogue_RaisonSociale » et « x_Catalogue_Enseigne » ne
 * se distinguent que par ce qu'elles contiennent, et les champs personnalisés
 * d'un salon portent des noms que personne ne reconnaît de mémoire.
 */
function intitule(d) {
  const technique = sansPrefixe(d.cle);
  const lib = d.libelle && d.libelle !== technique ? technique + " — " + d.libelle : technique;
  return lib + "  ·  " + (d.exemple ? courte(d.exemple) : "(vide sur les fiches lues)");
}

/**
 * L'intitulé d'une cible qui lit plusieurs champs à la suite — « address »,
 * puis « address_2 » quand le premier est vide. L'exemple est celui du premier
 * champ qui en porte un : c'est la valeur que la fiche montrera le plus
 * souvent.
 */
function intituleSuite(v, detectes) {
  const parts = v.split("|");
  const d = parts.map((c) => detectes.find((x) => x.cle === c)).find((x) => x && x.exemple);
  return parts.map(sansPrefixe).join(", puis ") + (d ? "  ·  " + courte(d.exemple) : "");
}

/**
 * La liste déroulante des champs d'origine d'une cible, et ce qu'elle vaut.
 *
 * Le réglage s'enregistre à chaque changement, comme les cases de la même
 * fenêtre : une fenêtre où la moitié des gestes se valide et l'autre pas
 * serait un piège.
 */
function champOrigine(src, cible, apres) {
  const e = courant();
  const bloc = correspondance(e, src);
  const detectes = bloc.detectes || [];
  const defauts = bloc.defauts || null;
  const propose = bloc.propose || null;
  const regle = (bloc.champs || {})[cible];

  /* Rien de réglé et une proposition sous la main : c'est elle qu'on montre.
     Elle ne s'enregistre pas pour autant — elle décrit ce que la
     synchronisation ferait de toute façon, et l'enregistrer ne changerait
     rien qu'en apparence. */
  const propose1 = propose ? encode(propose[cible] || []) : null;
  const choisi = regle !== undefined ? encode(regle)
    : propose1 !== null ? propose1 : DEFAUT_CHAMP;
  const parDefaut = defauts ? ([].concat(defauts[cible] || []))[0] : null;
  // « proposé » et « choisi à la main » ne se distinguent que par là : le
  // relever une fois pour toutes le figerait au premier état affiché
  let reglee = regle !== undefined;

  const hote = document.createElement("div");
  const sel = document.createElement("select");
  const opt = (v, txt, dans) => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = txt;
    (dans || sel).appendChild(o);
  };
  opt(DEFAUT_CHAMP, parDefaut ? "Par défaut — " + parDefaut
    : defauts ? "Par défaut — aucun champ" : "Par défaut");
  opt(AUCUN_CHAMP, "Aucun — laisser vide");
  // une cible qui lit plusieurs champs à la suite ne se dit pas dans une liste
  // de champs uniques : elle a son entrée à elle
  const suites = {};
  [choisi, propose1].forEach((v) => {
    if (!v || v.indexOf("|") < 0 || suites[v]) return;
    suites[v] = true;
    opt(v, intituleSuite(v, detectes));
  });
  /* Les champs se rangent par origine — personnalisés d'abord, ce sont eux qui
     diffèrent d'un salon à l'autre — sans quoi deux cents entrées se lisent
     comme une seule. */
  const groupes = {};
  detectes.forEach((d) => {
    const g = d.groupe || "Champs";
    if (!groupes[g]) {
      groupes[g] = document.createElement("optgroup");
      groupes[g].label = g;
      sel.appendChild(groupes[g]);
    }
    opt(d.cle, intitule(d), groupes[g]);
  });
  /* Un champ réglé que le dernier relevé ne connaît pas reste proposé : mieux
     vaut le montrer signalé que le remplacer en silence — il peut n'être
     renseigné sur aucune des fiches lues, et rester le bon. */
  if (choisi !== DEFAUT_CHAMP && choisi !== AUCUN_CHAMP && !suites[choisi] &&
      !detectes.some((d) => d.cle === choisi)) {
    opt(choisi, choisi + " (absent du dernier relevé)");
  }
  sel.value = choisi;
  hote.appendChild(sel);

  const etat = document.createElement("span");
  etat.className = "etat-salle";
  hote.appendChild(etat);

  /* Une cible vide n'appelle pas toujours au secours. Certaines n'ont aucun
     champ d'origine d'office — Klipso ne porte ni adresse ni réseaux sociaux —
     et rester vides est leur état normal ; seules celles dont le champ habituel
     a disparu méritent le rouge. */
  const sansDefaut = defauts !== null && !([].concat(defauts[cible] || [])).length;
  const dis = () => {
    const v = sel.value;
    const vide = v === AUCUN_CHAMP;
    const suggere = propose1 !== null && v === propose1 && !reglee;
    const genre = vide ? (sansDefaut || !propose1 ? "libre" : "manque")
      : v === DEFAUT_CHAMP || suggere ? "auto" : "manuel";
    etat.textContent = vide
      ? (sansDefaut ? "sans champ d'origine connu"
        : propose1 ? "champ habituel introuvable : à désigner" : "laissé vide")
      : v === DEFAUT_CHAMP ? "champ par défaut"
      : suggere ? "proposé d'après le dernier relevé" : "choisi à la main";
    etat.dataset.genre = genre;
    if (apres) apres(genre);
  };
  dis();

  sel.onchange = async () => {
    const e2 = courant();
    const avant = e2.correspondances;
    const corr = { ...(e2.correspondances || {}) };
    const champs = { ...((corr[src] || {}).champs || {}) };
    const v = decode(sel.value);
    reglee = v !== undefined;
    if (v === undefined) delete champs[cible]; else champs[cible] = v;
    corr[src] = { ...(corr[src] || {}), champs };
    e2.correspondances = corr;
    dis();
    try { await majEvenement(e2.id, { correspondances: corr }); }
    catch (err) { e2.correspondances = avant; signale(err.message, true); }
  };
  return { hote, sel, dis };
}


function majLiens(e) {
  const q = "?plan=" + encodeURIComponent(e.slug || "");
  const pub = $("lienPublic"), adm = $("lienAdmin");
  if (pub) {
    pub.href = BASE_PAGES + "plan" + q;
    // un brouillon n'est pas servi aux visiteurs : le dire plutôt que
    // laisser cliquer vers une page qui répondra « introuvable »
    const brouillon = e.etat !== "publie";
    pub.classList.toggle("inactif", brouillon);
    pub.title = brouillon
      ? "L'événement est en brouillon : le plan public n'est pas encore servi."
      : "Ouvrir le plan tel que le voient les visiteurs";
  }
  if (adm) {
    adm.href = BASE_PAGES + "plan-admin" + q;
    adm.title = "Ouvrir le plan avec les calques et les outils de dessin" +
      (e.etat !== "publie" ? " — accessible même en brouillon" : "");
  }
  // le rapport reste dans l'onglet : c'est une autre page de la console, pas
  // une sortie vers le plan
  const rap = $("lienRapport");
  if (rap) {
    rap.href = BASE_PAGES + "rapport" + q;
    rap.title = "Visites, recherches et fiches ouvertes";
  }
}

function majIntegration() {
  const e = courant(), t = $("fragment");
  if (!e || !t) return;
  t.value = '<iframe src="' + BASE_PAGES + 'plan?plan=' + (e.slug || "evenement") +
    '" style="width:100%;height:80vh;border:0" title="Plan du salon" loading="lazy"></iframe>';
}

function majMsgSync(e) {
  const m = $("msgSync");
  if (!m) return;
  if (e.derniere_err) { m.className = "err"; m.textContent = "Dernière erreur : " + e.derniere_err; return; }
  m.className = "";
  m.textContent = e.derniere_sync
    ? "Dernière synchronisation : " +
      new Date(e.derniere_sync).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })
    : "Jamais synchronisé.";
}

/* ------------------------------------------------------------------
   Synchronisation
   ------------------------------------------------------------------ */
async function synchronise(e) {
  const b = $("btnSync");
  b.disabled = true;
  const zone = $("avancement");
  let maj = null, enCours = null;
  signale("Synchronisation en cours…");
  try {
    const j = await fluxFonction("sync-evenement", { evenementId: e.id }, (o) => {
      if (o.etapes && zone) maj = barreAvancement(zone, o.etapes);
      else if (o.etape && maj) {
        if (o.etat === "encours") enCours = o.etape;
        maj(o.etape, o.etat, o.info);
      }
    });
    if (!j) throw new Error("Synchronisation interrompue avant la fin.");
    const pav = j.pavillons || [];
    const total = pav.reduce((a, p) => a + (p.stands || 0), 0);
    /* Combien de stands ont trouvé leur fiche chez le fournisseur d'exposants.
       C'est le chiffre qui dit si l'appariement tient : il ne paraît que quand
       les exposants viennent d'ailleurs que du plan, seul cas où il existe.
       « Apparié » n'est pas « nommé » — une fiche trouvée mais exclue du
       catalogue laisse le stand sans nom, et compte quand même ici. */
    const app = pav.some((p) => p.apparies !== undefined)
      ? ", " + pav.reduce((a, p) => a + (p.apparies || 0), 0) + " appariés"
      : "";
    // sans libellés, la nomenclature s'affiche en codes : le dire tout de
    // suite plutôt que de laisser découvrir des « FEP26_NOM10201 » sur le plan
    const n = j.nomenclature || {};
    const suite = n.erreur
      ? " Nomenclature en codes : " + n.erreur
      : n.libelles ? " " + n.libelles + " libellés de nomenclature." : "";
    signale(pav.length + " pavillon" + (pav.length > 1 ? "s" : "") + ", " +
      total + " emplacements" + app + "." + suite, !!n.erreur);
    await charge();
  } catch (err) {
    // marquer l'étape où l'on s'est arrêté vaut mieux qu'une barre figée
    if (maj && enCours) maj(enCours, "echec", err.message);
    signale(err.message, true);
  } finally {
    if ($("btnSync")) $("btnSync").disabled = false;
  }
}

function dupliquer(e) {
  demande("Dupliquer l'événement", "Nom de la copie", e.nom + " — copie", async (nom) => {
    try {
      // l'édition suivante a ses propres identifiants Klipso : on ne recopie
      // ni l'identifiant d'événement, ni les pavillons
      await rest("evenement", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({
          nom, slug: slugifie(nom), instance: e.instance,
          rythme_min: e.rythme_min, etat: "brouillon",
        }),
      });
      await charge();
    } catch (err) { signale(err.message, true); }
  });
}

   ------------------------------------------------------------------ */
$("btnNouveau").onclick = () =>
  demande("Nouvel événement", "Nom de l'événement", "", async (nom) => {
    signale("Création…");
    try {
      const rep = await rest("evenement", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({
          nom, slug: slugifie(nom) || "evenement", instance: "", etat: "brouillon",
        }),
      });
      const cree = Array.isArray(rep) ? rep[0] : rep;
      if (cree?.id) selection = cree.id;
      await charge();
      signale("Événement créé.");
    } catch (err) { signale(err.message, true); }
  });

/* Rechargement à la demande : la console ne surveille pas la base, et une
   synchronisation lancée ailleurs ne se voit pas toute seule. */
$("btnRecharger").onclick = async () => {
  const b = $("btnRecharger");
  if (b.disabled) return;
  b.disabled = true;
  b.classList.add("occupe");
  try {
    const avant = PLANS;
    PLANS = {};
    await charge();
    signale("Données rechargées.");
    void avant;
  } catch (e) {
    signale(e.message, true);
  } finally {
    b.disabled = false;
    b.classList.remove("occupe");
  }
};

$("btnExport").onclick = (ev) => {
  const txt = JSON.stringify({ evenements: EVTS, plans: PLANS }, null, 2);
  navigator.clipboard?.writeText(txt).then(
    () => { ev.target.textContent = "Copié"; setTimeout(() => ev.target.textContent = "Exporter", 1700); },
    () => { ev.target.textContent = "Échec"; });
};
$("btnImport").onclick = () => ecranConfig();
$("btnImport").textContent = "Projet";


/* ------------------------------------------------------------------
   Rendu et démarrage
   ------------------------------------------------------------------ */
/** Fin de session : la console n'a plus d'événements à montrer. */
function videEcran() {
  EVTS = []; selection = null;
  dessine();
}

function dessine() {
  const n = EVTS.length;
  const p = EVTS.filter((e) => e.etat === "publie").length;
  $("sousTitre").textContent = n
    ? n + (n > 1 ? " événements" : " événement") + " · " + p + " publié" + (p > 1 ? "s" : "")
    : "";
  dessineRail();
  dessineFiche();
}

async function demarre() {
  try {
    await charge();
  } catch (e) {
    $("fiche").innerHTML = '<div class="vide"></div>';
    $("fiche").querySelector(".vide").textContent = "Chargement impossible : " + e.message;
  }
}

if (!CFG) ecranConfig();
else if (!SESSION) ecranConnexion();
else demarre();
</script>
