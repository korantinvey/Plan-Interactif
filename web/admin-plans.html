  if (p) return p;
  p = marqueRecadree(src).catch(() => src);
  MARQUES_RECADREES.set(src, p);
  return p;
}
async function marqueRecadree(src) {
  let octets = null;
  try {
    const r = await fetch(src, { mode: "cors", credentials: "omit" });
    if (r.ok) octets = await r.blob();
  } catch (e) {
  }
  if (!octets) return src;
  const adresse = URL.createObjectURL(octets);
  const im = await imageChargee(adresse);
  if (!im) return src;
  const boite = await boiteMarque(octets, im);
  if (!boite) return adresse;
  const toile = await toileMarque(octets, im, boite);
  const b = toile && await new Promise((f) => toile.toBlob(f, "image/webp"));
  if (!b) return adresse;
  URL.revokeObjectURL(adresse);
  return URL.createObjectURL(b);
}
const imageChargee = (src) => new Promise((fin) => {
  const im = new Image();
  im.onload = () => fin(im);
  im.onerror = () => fin(null);
  im.src = src;
});
const vignetteMarque = async (octets, w, h, coupe) => {
  try {
    const opts = { resizeWidth: w, resizeHeight: h, resizeQuality: coupe ? "high" : "low" };
    return coupe ? await createImageBitmap(octets, coupe.x, coupe.y, coupe.w, coupe.h, opts) : await createImageBitmap(octets, opts);
  } catch (e) {
    return null;
  }
};
const MARQUE_ANALYSE = 256, MARQUE_SORTIE = 900;
const VIGNETTE_SORTIE = 600;
async function boiteMarque(octets, im) {
  const w = im.naturalWidth, h = im.naturalHeight;
  if (!w || !h) return null;
  const k = Math.min(1, MARQUE_ANALYSE / Math.max(w, h));
  const aw = Math.max(1, Math.round(w * k)), ah = Math.max(1, Math.round(h * k));
  const analyse = document.createElement("canvas");
  analyse.width = aw;
  analyse.height = ah;
  const cx = analyse.getContext("2d", { willReadFrequently: true });
  const vue = await vignetteMarque(octets, aw, ah) || im;
  cx.drawImage(vue, 0, 0, aw, ah);
  if (vue !== im) vue.close();
  const d = cx.getImageData(0, 0, aw, ah).data;
  const px = (x, y) => (y * aw + x) * 4;
  const coins = [px(0, 0), px(aw - 1, 0), px(0, ah - 1), px(aw - 1, ah - 1)];
  const transparent = d[coins[0] + 3] < 16;
  const ecart = (i, j) => Math.abs(d[i] - d[j]) + Math.abs(d[i + 1] - d[j + 1]) + Math.abs(d[i + 2] - d[j + 2]);
  const fond = transparent ? (i) => d[i + 3] < 16 : (i) => d[i + 3] >= 16 && ecart(i, coins[0]) < 48;
  if (!coins.every(fond)) return null;
  let x0 = aw, y0 = ah, x1 = -1, y1 = -1;
  for (let y = 0; y < ah; y++) {
    for (let x = 0; x < aw; x++) {
      if (fond(px(x, y))) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return null;
  let gx = Math.max(0, Math.floor((x0 - 1) / k)), gy = Math.max(0, Math.floor((y0 - 1) / k));
  let dx = Math.min(w, Math.ceil((x1 + 2) / k)), dy = Math.min(h, Math.ceil((y1 + 2) / k));
  if (!transparent) {
    const marge = Math.round(0.12 * Math.min(dx - gx, dy - gy));
    gx = Math.max(0, gx - marge);
    gy = Math.max(0, gy - marge);
    dx = Math.min(w, dx + marge);
    dy = Math.min(h, dy + marge);
  }
  const cw = dx - gx, ch = dy - gy;
  if (cw > 0.9 * w && ch > 0.9 * h) return null;
  return { x: gx, y: gy, w: cw, h: ch };
}
async function toileMarque(octets, im, b, cote) {
  const r = Math.min(1, (cote || MARQUE_SORTIE) / Math.max(b.w, b.h));
  const sortie = document.createElement("canvas");
  sortie.width = Math.max(1, Math.round(b.w * r));
  sortie.height = Math.max(1, Math.round(b.h * r));
  const sx = sortie.getContext("2d");
  sx.imageSmoothingQuality = "high";
  const part = await vignetteMarque(octets, sortie.width, sortie.height, b);
  if (part) {
    sx.drawImage(part, 0, 0, sortie.width, sortie.height);
    part.close();
  } else sx.drawImage(im, b.x, b.y, b.w, b.h, 0, 0, sortie.width, sortie.height);
  return sortie;
}
async function vignetteDeLogo(source) {
  let octets = null;
  try {
    const r = await fetch(source, { mode: "cors", credentials: "omit" });
    if (r.ok) octets = await r.blob();
  } catch (e) {
  }
  if (!octets) return null;
  const adresse = URL.createObjectURL(octets);
  try {
    const im = await imageChargee(adresse);
    if (!im || !im.naturalWidth) return null;
    const boite = await boiteMarque(octets, im);
    const toile = await toileMarque(
      octets,
      im,
      boite || { x: 0, y: 0, w: im.naturalWidth, h: im.naturalHeight },
      VIGNETTE_SORTIE
    );
    if (!toile) return null;
    const b = await new Promise((f) => toile.toBlob(f, "image/webp"));
    if (!b) return null;
    const tampon = new Uint8Array(await b.arrayBuffer());
    let brut = "";
    for (let i = 0; i < tampon.length; i += 8192) {
      brut += String.fromCharCode.apply(null, tampon.subarray(i, i + 8192));
    }
    return { source, image: btoa(brut), largeur: toile.width, hauteur: toile.height };
  } catch (e) {
    return null;
  } finally {
    URL.revokeObjectURL(adresse);
  }
}
