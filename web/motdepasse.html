\":\"Checking the link…\",\"Nouveau mot de passe\":\"New password\",\"Huit caractères au moins.\":\"At least eight characters.\",\"Confirmation\":\"Confirm\",\"Recevoir un lien\":\"Get a link\",\"Ouvrir la console\":\"Open the console\",\"Les deux saisies diffèrent.\":\"The two entries don't match.\",\"Refusé (HTTP {code})\":\"Refused (HTTP {code})\",\"Mot de passe enregistré.\":\"Password saved.\",\"Envoi refusé.\":\"Sending refused.\",\"Si un compte porte cette adresse, un lien vient de partir. Le message peut mettre une minute, et finir dans les indésirables.\":\"If an account uses this address, a link has just been sent. The message may take a minute, and may end up in spam.\",\"Indiquez votre adresse : vous recevrez un lien pour choisir un nouveau mot de passe.\":\"Enter your address: you will receive a link to choose a new password.\",\"Bienvenue\":\"Welcome\",\"Choisissez le mot de passe qui ouvrira votre console.\":\"Choose the password that will open your console.\",\"Choisissez votre nouveau mot de passe.\":\"Choose your new password.\",\"Ce site n'est pas relié à un projet : ouvrez d'abord la console.\":\"This site is not linked to a project: open the console first.\",\"Ce lien n'est plus valable.\":\"This link is no longer valid.\",\"{n} conférences\":\"{n} conferences\",\"Zones organisateur\":\"Organiser areas\",\"Événement introuvable.\":\"Event not found.\",\"Dans {n} min\":\"In {n} min\",\"Application\":\"App\",\"Oui\":\"Yes\",\"Non\":\"No\",\"oui\":\"yes\",\"non\":\"no\",\"Réseaux sociaux\":\"Social media\",\"Coordonnées\":\"Contact details\",\"Localisation\":\"Location\",\"Activité\":\"Business\",\"Activités\":\"Activities\",\"Secteur d'activité\":\"Business sector\",\"Département\":\"Department\",\"Région\":\"Region\",\"Pavillon {n}\":\"Hall {n}\",\"Hall {n}\":\"Hall {n}\",\"Afrique du Sud\":\"South Africa\",\"Algérie\":\"Algeria\",\"Allemagne\":\"Germany\",\"Andorre\":\"Andorra\",\"Arabie saoudite\":\"Saudi Arabia\",\"Argentine\":\"Argentina\",\"  halls.\",\"Le dessin de ce pavillon est absent : lancez une synchronisation.\":\"This hall has no drawing: run a synchronisation.\",\"{quoi} : {detail}\":\"{quoi}: {detail}\",\"Lecture du pavillon\":\"Reading the hall\",\"Lecture des pavillons\":\"Reading the halls\",\"Lecture du dessin du pavillon\":\"Reading the hall drawing\",\"Lecture de l'apparence du pavillon\":\"Reading the hall appearance\",\"Lecture de l'apparence\":\"Reading the appearance\",\"Lecture des calques\":\"Reading the layers\",\"Lecture des calques de dessin\":\"Reading the drawing layers\",\"Lecture des instantanés\":\"Reading the snapshots\",\"Écriture du pavillon « {pavillon} »\":\"Saving hall “{pavillon}”\",\"Écriture du calque « {calque} »\":\"Saving layer “{calque}”\",\"Écriture de l'emprise du pavillon\":\"Saving the hall extent\",\"Écriture de l'instantané du pavillon\":\"Saving the hall snapshot\",\"Écriture des cibles de mesure\":\"Saving the measurement targets\",\"Écriture des salles du programme\":\"Saving the programme rooms\",\"Écriture du relevé des champs\":\"Saving the field survey\",\"Écriture des catégories reconnues\":\"Saving the recognised categories\",\"Écriture du fuseau du salon\":\"Saving the show time zone\",\"Écriture de la date de synchronisation\":\"Saving the synchronisation date\",\"la base n'a rien rendu\":\"the database returned nothing\"}";
  const racine = document.documentElement;

  const CHEMIN_SALON = /^\/plan-([a-z0-9][a-z0-9-]{0,63})$/;
  function cleDesLangues() {
    let salon = "";
    try {
      salon = new URLSearchParams(location.search).get("plan") ||
        (CHEMIN_SALON.exec(location.pathname) || [])[1] ||
        "";
    } catch (e) {}
    return "plan-langues:" + (racine.dataset.role === "admin" ? "admin@" : "") + salon;
  }
  let ANGLAIS = true;
  try { if (localStorage.getItem(cleDesLangues()) === "fr") ANGLAIS = false; } catch (e) {}

  function langueDemandee() {
    if (!ANGLAIS) return "fr";
    try {
      const l = new URLSearchParams(location.search).get("lang");
      if (LANGUES.includes(l)) return l;
    } catch (e) {}
    try {
      const l = localStorage.getItem(CLE);
      if (LANGUES.includes(l)) return l;
    } catch (e) {}
    const prefs = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || "fr"];
    for (const p of prefs) {
      const l = String(p).slice(0, 2).toLowerCase();
      if (LANGUES.includes(l)) return l;
    }
    return "en";
  }

  let courante = langueDemandee();

  const ESPACES = /[\s\u00A0\u202F\u2009]+/g;
  const normalise = (s) => String(s).replace(ESPACES, " ").trim();
  const LETTRE = /[A-Za-zÀ-ÖØ-öø-ÿ]/;

  let EXACT = null;
  let MODELES = null;
  let PLURIELS = null;
  const MEMO = new Map();
  const PROTEGES = new Set();
  const DONNEES = new Map();

  function prepare() {
    if (EXACT) return;
    EXACT = new Map();
    MODELES = { debut: new Map(), fin: new Map(), libres: [] };
    PLURIELS = new Map();
    ajouteEntrees(typeof SOURCE === "string" ? JSON.parse(SOURCE) : SOURCE);
  }

  function ajouteEntrees(table) {
    for (const cleBrute of Object.keys(table)) {
      const fr = normalise(cleBrute), en = table[cleBrute];
      if (!fr || typeof en !== "string") continue;
      if (fr.indexOf("{") < 0) { if (en !== cleBrute) EXACT.set(fr, en); continue; }
      rangeModele(fr, en);
    }
    MEMO.clear();
  }

  const NUMERIQUE = /^n\d?$/;
  const sansPluriel = (fr) => fr.replace(/([A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF])[sx](?=[\s.,;:!?)\u00BB]|$)/g, "$1");
  function rangeModele(fr, en) {
    const noms = [];
    let statique = 0;
    const motif = fr.split(/(\{[^{}]+\})/).map((morceau) => {
      const m = /^\{([^{}]+)\}$/.exec(morceau);
      if (!m) {
        statique += morceau.length;
        return morceau.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\s+");
      }
      noms.push(m[1]);
      return NUMERIQUE.test(m[1]) ? "(-?\\d[\\d\\s\\u00A0\\u202F]*(?:[.,]\\d+)?)" : "(.+?)";
    }).join("");
    const modele = { re: new RegExp("^" + motif + "$"), noms, en, statique, fr };
    if (noms.some((n) => NUMERIQUE.test(n))) {
      const r = sansPluriel(fr), deja = PLURIELS.get(r);
      if (!deja || fr.length > deja.fr.length) PLURIELS.set(r, { fr, en });
    }
    const debut = /^[^{]{2}/.test(fr) ? fr.slice(0, 2) : null;
    const fin = /[^}]{2}$/.test(fr) ? fr.slice(-2) : null;
    if (debut) ajouteA(MODELES.debut, debut, modele);
    else if (fin) ajouteA(MODELES.fin, fin, modele);
    else MODELES.libres.push(modele);
  }
  function ajouteA(table, cle, modele) {
    const l = table.get(cle);
    if (!l) { table.set(cle, [modele]); return; }
    l.push(modele);
    l.sort((a, b) => b.statique - a.statique);
  }

  function nombreEn(s) {
    const brut = s.replace(/[\s\u00A0\u202F]/g, "").replace(",", ".");
    const v = Number(brut);
    if (!isFinite(v)) return s;
    const decimales = (brut.split(".")[1] || "").length;
    return v.toLocaleString("en-GB", { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
  }

  const JOURS = { lundi: "Monday", mardi: "Tuesday", mercredi: "Wednesday", jeudi: "Thursday",
    vendredi: "Friday", samedi: "Saturday", dimanche: "Sunday",
    "lun.": "Mon", "mar.": "Tue", "mer.": "Wed", "jeu.": "Thu", "ven.": "Fri", "sam.": "Sat", "dim.": "Sun",
    lun: "Mon", mar: "Tue", mer: "Wed", jeu: "Thu", ven: "Fri", sam: "Sat", dim: "Sun" };
  const MOIS = { janvier: "January", "février": "February", mars: "March", avril: "April", mai: "May",
    juin: "June", juillet: "July", "août": "August", septembre: "September", octobre: "October",
    novembre: "November", "décembre": "December",
    "janv.": "Jan", "févr.": "Feb", "avr.": "Apr", "juil.": "Jul", "sept.": "Sep", "oct.": "Oct",
    "nov.": "Nov", "déc.": "Dec" };
  const LIENS = { "à": "at", au: "to", du: "from", et: "and" };
  const UNITES = new Set(["h", "min", "km", "m"]);
  const PEUT_ETRE_DATE = /\d|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|janv|févr|mars|avril|mai|juin|juil|août|sept|oct|nov|déc/i;
  const MORCEAUX_DATE = /(\d{1,2})h(\d{2})?(?![\dA-Za-zÀ-ÿ])|(\d+)(er)?(?![\dA-Za-zÀ-ÿ])|([A-Za-zÀ-ÿ]+\.?)|([^\dA-Za-zÀ-ÿ]+)/g;

  function dateEn(t) {
    if (!PEUT_ETRE_DATE.test(t)) return null;
    let change = false, ok = true;
    const sortie = t.replace(MORCEAUX_DATE, (m, h, min, nb, er, mot, sep) => {
      if (h !== undefined) { change = true; return h + ":" + (min || "00"); }
      if (nb !== undefined) {
        if (er) { change = true; return nb === "1" ? "1st" : nb; }
        return nb;
      }
      if (mot !== undefined) {
        const k = mot.toLowerCase();
        const j = JOURS[k] || MOIS[k];
        if (j) { change = true; return j; }
        if (LIENS[k]) return LIENS[k];
        if (UNITES.has(k)) return mot;
        ok = false;
        return mot;
      }
      if (/[^\s·–—\-,:/()]/.test(sep)) ok = false;
      return sep;
    });
    return ok && change ? sortie : null;
  }

  function cherche(t, profondeur, mode) {
    if (PROTEGES.size && PROTEGES.has(t.toLowerCase())) return null;
    for (const table of DONNEES.values()) {
      const v = table.get(t);
      if (v !== undefined) return v;
    }
    const deja = EXACT.get(t);
    if (deja !== undefined) return deja;
    const premiere = t[0], autre = premiere === premiere.toUpperCase()
      ? premiere.toLowerCase() : premiere.toUpperCase();
    if (autre !== premiere) {
      const v = EXACT.get(autre + t.slice(1));
      if (v !== undefined) return premiere === premiere.toLowerCase() ? v[0].toLowerCase() + v.slice(1) : v[0].toUpperCase() + v.slice(1);
    }
    const d = dateEn(t);
    if (d) return d;
    if (profondeur > 2) return null;
    const candidats = [].concat(MODELES.debut.get(t.slice(0, 2)) || [],
      MODELES.fin.get(t.slice(-2)) || [], MODELES.libres);
    for (const m of candidats) {
      const r = m.re.exec(t);
      if (!r) continue;
      let en = m.en, avale = false;
      if (m.noms.some((nom, i) => NUMERIQUE.test(nom) &&
          Number(r[i + 1].replace(/[\s\u00A0\u202F]/g, "").replace(",", ".")) === 0)) {
        const pluriel = PLURIELS.get(sansPluriel(m.fr));
        if (pluriel && pluriel.fr !== m.fr) en = pluriel.en;
      }
      m.noms.forEach((nom, i) => {
        const brut = r[i + 1];
        let v = NUMERIQUE.test(nom) ? nombreEn(brut) : cherche(normalise(brut), profondeur + 1, "complete");
        if (v === null) { v = brut; if (/ [·—|] |[.!?] [A-ZÀ-Ö]/.test(brut)) avale = true; }
        en = en.split("{" + nom + "}").join(v);
      });
      if (!avale) return en;
    }
    if (/^-?\d{1,3}([\u00A0\u202F ]\d{3})+(,\d+)?$|^-?\d+,\d+$/.test(t)) return nombreEn(t);
    if (mode === "entiere") return null;
    const complete = mode === "complete";
    const sansLettre = (x) => !LETTRE.test(x);

    const bornes = [0];
    let fin;
    FIN_DE_PHRASE.lastIndex = 0;
    while ((fin = FIN_DE_PHRASE.exec(t))) {
      const suite = fin.index + fin[0].length;
      if (/\d/.test(t[suite]) && t.slice(bornes[bornes.length - 1], fin.index).indexOf(" ") < 0) continue;
      bornes.push(suite);
    }
    const nb = bornes.length;
    if (nb > 1) {
      const morceau = (i, j) => t.slice(bornes[i], j < nb ? bornes[j] : t.length).trim();
      let traduites = 0, vraies = 0;
      const sortie = [];
      for (let i = 0; i < nb;) {
        let j = i === 0 ? nb - 1 : nb, v = null;
        for (; j > i + 1; j--) if ((v = cherche(morceau(i, j), profondeur + 1, "entiere")) !== null) break;
        if (v === null) { j = i + 1; v = cherche(morceau(i, j), profondeur + 1, mode); }
        if (v !== null) vraies++;
        if (v !== null || sansLettre(morceau(i, j))) traduites += j - i;
        sortie.push(v === null ? morceau(i, j) : v);
        i = j;
      }
      if (vraies && (!complete || traduites === nb)) return sortie.join(" ");
    }

    for (const sep of SEPARATEURS) {
      if (t.indexOf(sep) < 0) continue;
      let traduits = 0;
      const parts = t.split(sep);
      const morceaux = parts.map((m) => {
        const v = m.trim() ? cherche(m.trim(), profondeur + 1, mode) : null;
        if (v === null) { if (sansLettre(m)) traduits++; return m; }
        traduits++;
        return m.replace(m.trim(), v);
      });
      const assez = complete ? traduits === parts.length
        : sep === ", " ? traduits * 2 >= parts.length : traduits;
      if (assez && morceaux.some((m, i) => m !== parts[i])) return morceaux.join(sep);
    }
    return null;
  }
  const SEPARATEURS = [" · ", " — ", " | ", ", "];
  const FIN_DE_PHRASE = /[.!?\u2026\u00BB)]\s+(?=[A-Z0-9\u00C0-\u00D6\u00D8-\u00DE\u00AB])/g;

  function traduitBrut(brut) {
    if (!brut || !LETTRE.test(brut) && !/\d[\u00A0\u202F ]\d|\d,\d/.test(brut)) return null;
    let v = MEMO.get(brut);
    if (v !== undefined) return v;
    prepare();
    const t = normalise(brut);
    let en = t ? cherche(t, 0) : null;
    if (en !== null) en = en.replace(/\u00AB\s*/g, "“").replace(/\s*\u00BB/g, "”");
    const avant = en !== null && /^[:;!?]/.test(en) ? "" : brut.match(/^\s*/)[0];
    v = en === null ? null : avant + en + brut.match(/\s*$/)[0];
    if (MEMO.size > 4000) MEMO.clear();
    MEMO.set(brut, v);
    return v;
  }

  const ATTRIBUTS = ["title", "placeholder", "aria-label", "alt", "label", "data-vide", "value"];
  const TEXTES = new WeakMap();
  const ATTRS = new WeakMap();
  const EXCLUS = "script,style,textarea,noscript,template,code,pre,[translate=\"no\"]," +
    "[contenteditable]:not([contenteditable=\"false\"])";
  const EXCLUS_ATTRIBUTS = "script,style,noscript,template,[translate=\"no\"]";

  const exclu = (n) => {
    const e = n && (n.nodeType === 1 ? n : n.parentElement);
    return Boolean(e && e.closest(EXCLUS));
  };
  const excluAttributs = (el) => Boolean(el.closest(EXCLUS_ATTRIBUTS) ||
    (el.parentElement && el.parentElement.closest(EXCLUS)));

  function traduitTexte(n) {
    const v = n.nodeValue;
    const memo = TEXTES.get(n);
    if (memo && memo.en === v) return;
    const en = traduitBrut(v);
    if (en === null || en === v) {
      if (memo) TEXTES.delete(n);
      if (MANQUES && en === null) releveManque(v, n.parentElement);
      return;
    }
    TEXTES.set(n, { fr: v, en });
    n.nodeValue = en;
  }

  function traduitAttribut(el, nom) {
    if (nom === "value" && !(el.tagName === "INPUT" && /^(button|submit|reset)$/i.test(el.type))) return;
    const v = el.getAttribute(nom);
    if (v === null) return;
    let memo = ATTRS.get(el);
    if (memo && memo[nom] && memo[nom].en === v) return;
    const en = traduitBrut(v);
    if (en === null || en === v) {
      if (memo) delete memo[nom];
      if (MANQUES && en === null) releveManque(v, el, nom);
      return;
    }
    if (!memo) ATTRS.set(el, memo = {});
    memo[nom] = { fr: v, en };
    el.setAttribute(nom, en);
  }

  function traduitElement(el) {
    for (const nom of ATTRIBUTS) if (el.hasAttribute(nom)) traduitAttribut(el, nom);
  }

  const enAttente = new Set();
  const peutEtreIncomplet = (n) => document.readyState === "loading" &&
    !n.nextSibling && !(n.parentNode && n.parentNode.nextSibling);

  function parcourt(noeud) {
    if (noeud.nodeType === 3) {
      if (peutEtreIncomplet(noeud)) enAttente.add(noeud); else traduitTexte(noeud);
      return;
    }
    if (noeud.nodeType !== 1 && noeud.nodeType !== 9 && noeud.nodeType !== 11) return;
    if (noeud.nodeType === 1) {
      if (noeud.matches(EXCLUS)) { if (!noeud.matches(EXCLUS_ATTRIBUTS)) traduitElement(noeud); return; }
      traduitElement(noeud);
    }
    const marcheur = document.createTreeWalker(noeud, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => {
        if (n.nodeType !== 1 || !n.matches(EXCLUS)) return NodeFilter.FILTER_ACCEPT;
        if (!n.matches(EXCLUS_ATTRIBUTS)) traduitElement(n);
        return NodeFilter.FILTER_REJECT;
      },
    });
    let n;
    while ((n = marcheur.nextNode())) {
      if (n.nodeType === 3) {
        if (peutEtreIncomplet(n)) enAttente.add(n); else traduitTexte(n);
      } else traduitElement(n);
    }
  }

  function repasseAttente() {
    for (const n of enAttente) {
      if (!peutEtreIncomplet(n)) { enAttente.delete(n); if (n.isConnected && !exclu(n)) traduitTexte(n); }
    }
  }

  function surMutations(liste) {
    for (const r of liste) {
      if (r.type === "childList") {
        if (!r.addedNodes.length || exclu(r.target)) continue;
        r.addedNodes.forEach(parcourt);
      } else if (r.type === "characterData") {
        if (!exclu(r.target)) traduitTexte(r.target);
      } else if (!excluAttributs(r.target)) {
        traduitAttribut(r.target, r.attributeName);
      }
    }
    if (enAttente.size) repasseAttente();
  }

  const observateur = new MutationObserver(surMutations);
  const observe = () => observateur.observe(racine, {
    subtree: true, childList: true, characterData: true,
    attributes: true, attributeFilter: ATTRIBUTS,
  });

  let mesuresBranchees = false;
  function brancheMesures() {
    if (mesuresBranchees) return;
    mesuresBranchees = true;
    const vide = () => {
      if (courante !== "en") return;
      const r = observateur.takeRecords();
      if (r.length) surMutations(r);
    };
    const methode = (proto, nom) => {
      const f = proto && proto[nom];
      if (typeof f !== "function") return;
      proto[nom] = function () { vide(); return f.apply(this, arguments); };
    };
    const lecture = (proto, nom) => {
      const d = proto && Object.getOwnPropertyDescriptor(proto, nom);
      if (!d || !d.get) return;
      Object.defineProperty(proto, nom, Object.assign({}, d, { get() { vide(); return d.get.call(this); } }));
    };
    methode(Element.prototype, "getBoundingClientRect");
    methode(Element.prototype, "getClientRects");
    if (window.SVGGraphicsElement) methode(SVGGraphicsElement.prototype, "getBBox");
    if (window.SVGTextContentElement) methode(SVGTextContentElement.prototype, "getComputedTextLength");
    ["offsetWidth", "offsetHeight", "offsetLeft", "offsetTop"].forEach((n) => lecture(HTMLElement.prototype, n));
    ["scrollWidth", "scrollHeight", "clientWidth", "clientHeight"].forEach((n) => lecture(Element.prototype, n));
  }

  function restaure() {
    const marcheur = document.createTreeWalker(racine, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let n = racine;
    do {
      if (n.nodeType === 3) {
        const memo = TEXTES.get(n);
        if (memo) { if (n.nodeValue === memo.en) n.nodeValue = memo.fr; TEXTES.delete(n); }
      } else {
        const memo = ATTRS.get(n);
        if (memo) {
          for (const nom of Object.keys(memo)) if (n.getAttribute(nom) === memo[nom].en) n.setAttribute(nom, memo[nom].fr);
          ATTRS.delete(n);
        }
      }
    } while ((n = marcheur.nextNode()));

  let MANQUES = null;
  try { if (/[?&]manques\b/.test(location.search)) MANQUES = new Map(); } catch (e) {}
  const MOTS_FRANCAIS = /(^|[\s'’(«])(le|la|les|des|du|de|un|une|et|ou|pour|sur|dans|avec|sans|pas|ne|est|sont|au|aux|ce|cette|ces|qui|que|son|sa|ses|par|vous|votre|vos|plus|tout|tous|aucun|aucune)(?=[\s'’),.:;!?»]|$)|[àâçéèêëîïôûùüÿœ]/i;
  function releveManque(v, el, attribut) {
    const t = normalise(v);
    if (!t || !LETTRE.test(t) || !MOTS_FRANCAIS.test(t)) return;
    if (t === t.toUpperCase()) return;
    if (el && el.closest && el.closest("#stands,#labels,#zones,.cal")) return;
    const k = (attribut ? "@" + attribut + " " : "") + t;
    const e = MANQUES.get(k);
    const classe = el && el.getAttribute ? el.getAttribute("class") : "";
    if (e) e.n++;
    else MANQUES.set(k, { n: 1, ou: el ? (el.id ? "#" + el.id : classe ? "." + classe.split(" ")[0] : el.tagName) : "" });
  }

  function applique(langue, premiere) {
    courante = langue;
    racine.lang = langue;
    if (langue === "en") {
      prepare();
      brancheMesures();
      parcourt(document);
      observe();
      if (premiere && document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          repasseAttente();
          enAttente.forEach((n) => { if (n.isConnected && !exclu(n)) traduitTexte(n); });
          enAttente.clear();
        }, { once: true });
      }
    } else if (!premiere) {
      observateur.disconnect();
      enAttente.clear();
      restaure();
    }
    majBascules();
    if (!premiere) dispatchEvent(new CustomEvent("langue", { detail: { langue } }));
  }

  function bascule(langue) {
    const l = LANGUES.includes(langue) ? langue : (courante === "fr" ? "en" : "fr");
    if (l === courante || (l === "en" && !ANGLAIS)) return;
    try { localStorage.setItem(CLE, l); } catch (e) {}
    try {
      const u = new URL(location.href);
      if (u.searchParams.has("lang")) {
        u.searchParams.set("lang", l);
        history.replaceState(history.state, "", u);
      }
    } catch (e) {}
    applique(l, false);
  }

  const HABIT_DRAPEAU = 'aria-hidden="true" focusable="false" style="display:block;width:20px;' +
    'height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)"';
  const DRAPEAUX = {
    en: '<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" ' + HABIT_DRAPEAU + '>' +
      '<rect width="60" height="30" fill="#012169"/>' +
      '<path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/>' +
      '<path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/>' +
      '<path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/>' +
      '<path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg>',
    fr: '<svg viewBox="0 0 3 2" preserveAspectRatio="none" ' + HABIT_DRAPEAU + '>' +
      '<rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/>' +
      '<rect x="2" width="1" height="2" fill="#EF4135"/></svg>',
  };
  function majBascules() {
    document.querySelectorAll("[data-langue]").forEach((b) => {
      b.hidden = !ANGLAIS;
      if (!ANGLAIS) return;
      const vers = courante === "fr" ? "en" : "fr";
      b.setAttribute("translate", "no");
      b.setAttribute("lang", vers);
      if (b.dataset.drapeau !== vers) { b.innerHTML = DRAPEAUX[vers]; b.dataset.drapeau = vers; }
      const dit = vers === "en" ? "English version" : "Version française";
      b.title = dit;
      b.setAttribute("aria-label", dit);
    });
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-langue]");
    if (b) { e.preventDefault(); if (ANGLAIS) bascule(); }
  });
  document.addEventListener("DOMContentLoaded", majBascules, { once: true });

  window.LANGUE = {
    get code() { return courante; },
    bascule,
    offre(anglais) {
      const ouvert = anglais !== false;
      try {
        const cle = cleDesLangues(), avant = localStorage.getItem(cle);
        if (ouvert) { if (avant !== null) localStorage.removeItem(cle); }
        else if (avant !== "fr") localStorage.setItem(cle, "fr");
      } catch (e) {}
      if (ouvert === ANGLAIS) return;
      ANGLAIS = ouvert;
      const voulue = ouvert ? langueDemandee() : "fr";
      if (voulue !== courante) applique(voulue, false);
      else majBascules();
    },
    traduit: (fr) => courante === "en" ? (traduitBrut(String(fr)) ?? String(fr)) : String(fr),
    enAnglais: (fr) => traduitBrut(String(fr)),
    protege(noms) {
      let neuf = false;
      for (const n of noms || []) {
        const k = normalise(n || "").toLowerCase();
        if (k && !PROTEGES.has(k)) { PROTEGES.add(k); neuf = true; }
      }
      if (!neuf) return;
      MEMO.clear();
      if (courante === "en") { restaure(); parcourt(document); }
    },
    donnees(origine, table) {
      const t = new Map();
      for (const fr of Object.keys(table || {})) {
        const k = normalise(fr), en = normalise(table[fr] || "");
        if (k && en && en !== k) t.set(k, en);
      }
      const avant = DONNEES.get(origine);
      if (!t.size && !avant) return;
      if (t.size) DONNEES.set(origine, t); else DONNEES.delete(origine);
      MEMO.clear();
      if (courante === "en") { restaure(); parcourt(document); }
    },
    ajoute(table) {
      prepare();
      ajouteEntrees(table || {});
      if (courante === "en") parcourt(document);
    },
    manques: () => MANQUES ? [...MANQUES].sort((a, b) => b[1].n - a[1].n)
      .map(([t, e]) => e.n + " × " + t + (e.ou ? "   (" + e.ou + ")" : "")) : null,
  };
  window.traduit = window.LANGUE.traduit;

  applique(courante, true);
})();

.carte .msg{margin:14px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.carte .msg.err{color:var(--rouge)}
.carte .msg.ok{color:var(--vert)}
.carte{position:relative}
.carte .langue{position:absolute;top:14px;right:14px}
</style>

<div class="seule">
  <div class="carte">
    <button class="icone langue" type="button" data-langue></button>
    <span class="marqueE2M"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#071f3a"/><rect x="48" y="0" width="4" height="100" fill="#1b5b84"/><rect x="0" y="48" width="100" height="4" fill="#1b5b84"/><circle cx="92" cy="50" r="5" fill="#ff4d6d"/><rect x="17" y="17" width="66" height="66" rx="14" fill="#35c2ff"/><path d="M61.832 60L58.031 60L58.031 43.977L64.118 43.977L66.054 51.114Q66.171 51.487 66.334 52.128Q66.497 52.770 66.660 53.469Q66.824 54.169 66.940 54.729L67.127 54.729Q67.220 54.286 67.360 53.668Q67.500 53.050 67.663 52.362Q67.827 51.673 67.966 51.090L69.926 43.977L75.850 43.977L75.850 60L71.792 60L71.792 53.166Q71.792 52.163 71.803 51.137Q71.815 50.111 71.838 49.271Q71.862 48.431 71.862 48.058L71.675 48.058Q71.605 48.408 71.453 49.073Q71.302 49.738 71.127 50.449Q70.952 51.160 70.812 51.673L68.480 60L65.121 60L62.765 51.673Q62.649 51.207 62.485 50.554Q62.322 49.901 62.171 49.224Q62.019 48.548 61.902 48.082L61.716 48.082Q61.739 48.688 61.762 49.563Q61.786 50.437 61.809 51.382Q61.832 52.327 61.832 53.166" fill="#071f3a"/><path d="M37.585 60L24.197 60L24.197 43.977L37.421 43.977L37.421 47.242L28.372 47.242L28.372 50.251L36.278 50.251L36.278 53.446L28.372 53.446L28.372 56.735L37.585 56.735" fill="#071f3a"/><rect x="39" y="38" width="17.1" height="28" rx="5" fill="#071f3a"/><path d="M53.685 60L41.370 60L41.370 59.044Q41.370 58.017 41.767 57.155Q42.163 56.292 42.840 55.545Q43.516 54.799 44.344 54.111Q45.172 53.423 46.012 52.793Q46.968 52.093 47.808 51.440Q48.647 50.787 49.172 50.064Q49.697 49.341 49.697 48.455Q49.697 47.988 49.475 47.557Q49.254 47.125 48.776 46.845Q48.297 46.566 47.504 46.566Q46.711 46.566 46.175 46.857Q45.638 47.149 45.359 47.662Q45.079 48.175 45.079 48.875L45.079 49.574L41.534 49.574Q41.510 49.434 41.499 49.259Q41.487 49.085 41.487 48.851Q41.487 47.172 42.257 46.029Q43.026 44.886 44.437 44.292Q45.848 43.697 47.808 43.697Q49.300 43.697 50.385 44.093Q51.469 44.490 52.169 45.166Q52.869 45.843 53.207 46.694Q53.545 47.545 53.545 48.455Q53.545 49.551 53.149 50.437Q52.752 51.324 52.052 52.105Q51.353 52.886 50.420 53.598Q49.487 54.309 48.414 55.032Q47.878 55.405 47.446 55.720Q47.015 56.035 46.758 56.268Q46.501 56.501 46.385 56.688L53.685 56.688" fill="#ff4d6d"/></svg></span>
    <h1 id="titre">Mot de passe</h1>
    <p class="intro" id="intro">Vérification du lien…</p>

    <div id="formMdp" hidden>
      <label><span>Nouveau mot de passe</span>
        <input id="mdp1" type="password" autocomplete="new-password">
        <span class="aide">Huit caractères au moins.</span></label>
      <label><span>Confirmation</span>
        <input id="mdp2" type="password" autocomplete="new-password"></label>
      <div class="pied"><button class="btn primaire" id="poser">Enregistrer</button></div>
    </div>

    <div id="formMail" hidden>
      <label><span>Adresse e-mail</span>
        <input id="mail" type="email" autocomplete="username"></label>
      <div class="pied"><button class="btn primaire" id="envoyer">Recevoir un lien</button></div>
    </div>

    <p class="msg" id="msg"></p>
    <div class="pied" id="apres" hidden>
      <a class="btn" id="versConsole" href="admin-plans">Ouvrir la console</a>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const CFG = (() => {
  try {
    const local = JSON.parse(localStorage.getItem("console-config") || "null");
    if (local?.url && local?.anonKey) return local;
  } catch (e) {}
  return window.PLAN_CONFIG || null;
})();

const dit = (texte, genre) => {
  $("msg").textContent = texte || "";
  $("msg").className = "msg" + (genre ? " " + genre : "");
};

function fragment() {
  const h = (location.hash || "").replace(/^#/, "");
  return new URLSearchParams(h);
}

function garde(session) {
  try { localStorage.setItem("console-session", JSON.stringify(session)); } catch (e) {}
}

async function lit(reponse) {
  const txt = await reponse.text();
  let j = {};
  try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { msg: txt.slice(0, 160) }; }
  return j;
}

let JETON = null;

$("poser").onclick = async () => {
  const a = $("mdp1").value, b = $("mdp2").value;
  if (a.length < 8) return dit("Huit caractères au moins.", "err");
  if (a !== b) return dit("Les deux saisies diffèrent.", "err");
  dit("Enregistrement…");
  $("poser").disabled = true;
  try {
    const r = await fetch(CFG.url + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "apikey": CFG.anonKey,
        "Authorization": "Bearer " + JETON,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ password: a }),
    });
    const j = await lit(r);
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Refusé (HTTP " + r.status + ")");
    $("formMdp").hidden = true;
    $("apres").hidden = false;
    dit("Mot de passe enregistré.", "ok");
  } catch (e) {
    $("poser").disabled = false;
    dit(e.message, "err");
  }
};

$("envoyer").onclick = async () => {
  const adresse = $("mail").value.trim();
  if (adresse.indexOf("@") < 1) return dit("Adresse incomplète.", "err");
  dit("Envoi…");
  $("envoyer").disabled = true;
  try {
    const r = await fetch(CFG.url + "/auth/v1/recover", {
      method: "POST",
      headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
      body: JSON.stringify({
        email: adresse,
        redirect_to: location.origin + location.pathname,
      }),
    });
    const j = await lit(r);
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Envoi refusé.");
    dit("Si un compte porte cette adresse, un lien vient de partir. " +
        "Le message peut mettre une minute, et finir dans les indésirables.", "ok");
  } catch (e) {
    dit(e.message, "err");
  } finally {
    $("envoyer").disabled = false;
  }
};

function demandeLien(message, genre) {
  $("titre").textContent = "Mot de passe oublié";
  $("intro").textContent = "Indiquez votre adresse : vous recevrez un lien pour " +
    "choisir un nouveau mot de passe.";
  $("formMail").hidden = false;
  if (message) dit(message, genre || "err");
  setTimeout(() => $("mail").focus(), 40);
}

function ouvreSaisie(invitation) {
  $("titre").textContent = invitation ? "Bienvenue" : "Nouveau mot de passe";
  $("intro").textContent = invitation
    ? "Choisissez le mot de passe qui ouvrira votre console."
    : "Choisissez votre nouveau mot de passe.";
  $("formMdp").hidden = false;
  setTimeout(() => $("mdp1").focus(), 40);
}

(async () => {
  if (!CFG?.url || !CFG?.anonKey) {
    $("intro").textContent = "";
    return dit("Ce site n'est pas relié à un projet : ouvrez d'abord la console.", "err");
  }

  const f = fragment();
  const q = new URLSearchParams(location.search);

  const souci = f.get("error_description") || q.get("error_description");
  if (souci) {
    $("intro").textContent = "";
    return demandeLien(decodeURIComponent(souci.replace(/\+/g, " ")));
  }

  const type = f.get("type") || q.get("type") || "";

  if (f.get("access_token")) {
    JETON = f.get("access_token");
    garde({ access_token: JETON, refresh_token: f.get("refresh_token") || null });
    history.replaceState(null, "", location.pathname);
    $("intro").textContent = "";
    return ouvreSaisie(type === "invite");
  }

  const hache = q.get("token_hash") || q.get("token");
  if (hache) {
    try {
      const r = await fetch(CFG.url + "/auth/v1/verify", {
        method: "POST",
        headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ type: type || "recovery", token_hash: hache }),
      });
      const j = await lit(r);
      if (!r.ok || !j.access_token) {
        throw new Error(j.error_description || j.msg || "Ce lien n'est plus valable.");
      }
      JETON = j.access_token;
      garde(j);
      history.replaceState(null, "", location.pathname);
      $("intro").textContent = "";
      return ouvreSaisie(type === "invite");
    } catch (e) {
      $("intro").textContent = "";
      return demandeLien(e.message);
    }
  }

  $("intro").textContent = "";
  demandeLien();
})();
</script>
