/* ============================================================
   Le tiroir de la liste — écrans étroits

   Côte à côte, plan et liste ne tiennent pas sur un téléphone. La liste se
   replie donc en tiroir : seules la recherche et le compteur dépassent, le
   reste se hisse d'une pression ou d'un glissement. Choisir un résultat le
   referme — c'est le plan qu'on voulait voir, et la fiche s'ouvre par-dessus.
   ============================================================ */
/* La mesure du tiroir appartient à ce module, mais les bandes qui dépassent —
   les secteurs, les critères retenus — paraissent et disparaissent ailleurs :
   on leur laisse de quoi la redemander. */
let mesureTiroir = () => {};

(function tiroirListe(){
  const tiroir = $("side"), prise = $("poignee");
  if (!tiroir || !prise) return;
  const etroit = ETROIT;

  /* La hauteur repliée ne peut pas être une constante : elle dépend de la
     police servie, du retour à la ligne des puces, de la longueur du nom de
     pavillon dans le compteur. On la mesure, et on la redonne au CSS, qui s'en
     sert aussi pour poser les commandes du plan au-dessus du tiroir. */
  function mesure(){
    if (!etroit()) return;
    const part = s => { const n = tiroir.querySelector(s); return n ? n.offsetHeight : 0; };
    const h = prise.offsetHeight + part(".search") + part(".secteurs") +
              part(".actifs") + part(".count");
    if (h > 0) document.documentElement.style.setProperty("--replie", h + "px");
  }

  /* Trois crans, du plus bas au plus haut. Le milieu est le cran utile : la
     liste se lit sans que le plan disparaisse. */
  const CRANS = ["replie", "demi", "plein"];
  const cran = () => tiroir.dataset.cran || "replie";
  function pose(nom){
    tiroir.dataset.cran = nom;
    prise.setAttribute("aria-expanded", nom === "replie" ? "false" : "true");
  }
  const replie = () => pose("replie");
  /* Une pression fait le tour des crans : on les atteint tous sans rien
     connaître du glissement, et on revient au plan par la même touche. */
  const bascule = () => pose(CRANS[(CRANS.indexOf(cran()) + 1) % CRANS.length]);

  const replieePx = () =>
    parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--replie")) || 164;

  /* Hauteur visible du tiroir à un cran donné, en pixels. Le milieu suit la
     règle du CSS — 46 % de la hauteur d'écran. */
  function hauteur(nom){
    if (nom === "plein") return tiroir.offsetHeight;
    if (nom === "demi")  return Math.round(innerHeight * .46);
    return replieePx();
  }

  /* --- le glissement ------------------------------------------------------
     Le doigt mène le tiroir entre le cran le plus bas et le plus haut, puis on
     s'accroche au cran le plus proche de l'endroit où il a lâché. Un seuil de
     distance ne suffirait plus : avec trois crans, c'est la position d'arrivée
     qui décide, pas la longueur du geste. */
  let depart = null, aGlisse = false;

  prise.addEventListener("pointerdown", e => {
    if (!etroit()) return;
    depart = { y: e.clientY, vu: hauteur(cran()) };
    aGlisse = false;
    tiroir.classList.add("glisse");
    prise.setPointerCapture(e.pointerId);
  });

  /** Hauteur visible pendant le geste, bornée aux deux crans extrêmes. */
  const suit = e =>
    Math.min(hauteur("plein"), Math.max(hauteur("replie"), depart.vu - (e.clientY - depart.y)));

  prise.addEventListener("pointermove", e => {
    if (!depart) return;
    if (Math.abs(e.clientY - depart.y) > 6) aGlisse = true;
    tiroir.style.transform = "translateY(" + (tiroir.offsetHeight - suit(e)) + "px)";
  });

  function relache(e){
    if (!depart) return;
    const vu = suit(e);
    tiroir.classList.remove("glisse");
    tiroir.style.transform = "";
    if (aGlisse){
      let choix = CRANS[0], ecart = Infinity;
      for (const c of CRANS){
        const d = Math.abs(hauteur(c) - vu);
        if (d < ecart){ ecart = d; choix = c; }
      }
      pose(choix);
    }
    depart = null;
  }
  prise.addEventListener("pointerup", relache);
  prise.addEventListener("pointercancel", relache);

  /* Une pression bascule. Le clic sert aussi le clavier — la poignée est un
     bouton — mais il suit tout glissement : on l'ignore dans ce cas. */
  prise.addEventListener("click", () => {
    if (aGlisse){ aGlisse = false; return; }
    bascule();
  });

  /* Chercher, c'est vouloir la liste ; choisir, c'est vouloir le plan. Au cran
     plein pour la recherche : le clavier va manger le bas de l'écran, autant
     que la liste occupe tout ce qui reste. */
  $("q").addEventListener("focus", () => { if (etroit()) pose("plein"); });
  $("list").addEventListener("click", () => { if (etroit()) replie(); });

  /* La fiche occupe le bas de l'écran quand elle s'ouvre — depuis la liste
     comme depuis le plan ; le parcours prend la même bande. Le tiroir se
     retire sous eux plutôt que de lutter pour la même place. */
  const bandes = [$("detail"), $("parcours")].filter(Boolean);
  const guette = new MutationObserver(() => {
    if (etroit() && bandes.some(n => n.classList.contains("open"))) replie();
  });
  bandes.forEach(n => guette.observe(n, { attributes: true, attributeFilter: ["class"] }));
  addEventListener("keydown", e => { if (e.key === "Escape" && etroit()) replie(); });

  /* Au retour vers un grand écran, la liste reprend sa colonne : ni classe
     d'ouverture ni transformation résiduelle, qui s'y appliqueraient encore. */
  addEventListener("resize", () => {
    if (!etroit()){ tiroir.style.transform = ""; replie(); }
    else mesure();
  });

  mesureTiroir = mesure;
  mesure();
  // les polices arrivent après le premier calcul et changent la hauteur mesurée
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesure);
  addEventListener("load", mesure);
})();

/* thème */
const CLE_THEME = "plan-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sombre = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = sombre ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(CLE_THEME, next); } catch (e) {}
};

/* ============================================================
   9. Apparence des calques
   Les réglages vivent dans CONF, partagés par les trois pavillons :
   changer la couleur du bâtiment une fois vaut pour tous.
   ============================================================ */
const DEFAUTS = { "INFOPRO_FIL_JAUNE": { rempli: true } };
let CONF = JSON.parse(JSON.stringify(DEFAUTS));

/* Un rangement par salon, et non plus un seul pour tous.
   Les calques sortent tous du même bureau d'études : « Batiment », « RIA »,
   « Caniveaux » et leurs sous-calques portent les mêmes noms d'un salon à
   l'autre. Rangés sous ce seul nom, les réglages suivaient l'exploitant :
   masquer une gaine chez l'un la masquait chez le suivant, sans que rien ne
   l'annonce dans son panneau — et la publication emportait le mélange en
   base. Le salon ouvert nomme donc sa clé. */
const cleConf = d => "plan-conf:" +
  ((d && d.slug) || SLUG || (d && d.evenement) || "sans-salon");
let CLE_CONF = cleConf(null);

/** Ouvre les réglages du salon qu'on vient de charger. */
function ouvreConf(d){
  CLE_CONF = cleConf(d);
  CONF = JSON.parse(JSON.stringify(DEFAUTS));
  try { Object.assign(CONF, JSON.parse(localStorage.getItem(CLE_CONF) || "{}")); } catch (e) {}
  /* L'ancien rangement commun ne peut que rejouer le mélange, et la base fait
     foi de toute façon : on le retire plutôt que de le laisser traîner. */
  try { localStorage.removeItem("plan-conf"); } catch (e) {}
}

/**
 * Les réglages qui parlent du salon ouvert : ceux de ses calques et de leurs
 * sous-calques, plus les réglages généraux — commandes, couches de données,
 * étiquettes. Tout le reste vient d'un salon voisin ouvert sur le même poste,
 * et ne désigne rien ici.
 *
 * Le filtre s'applique aux deux bouts : ce qu'on lit de la base, et ce qu'on y
 * renvoie. Un enregistrement déjà mélangé se nettoie donc à la publication
 * suivante, sans qu'il faille y toucher à la main.
 */
function reglagesDuSalon(source){
  const calques = new Set((DATA?.plans || []).flatMap(p => (p.fond || []).map(c => c.cle)));
  const sortie = {};
  Object.keys(source || {}).forEach(k => {
    if (k.indexOf("_pile:") === 0) return;          // rangé par pavillon, à part
    const general = k[0] === "_" || k.indexOf("data:") === 0 ||
                    k === "labStand" || k === "labZone" || k === "selection" ||
                    k === "parcours";
    /* Une couleur de secteur nomme un secteur de ce salon-ci : elle se retient
       comme un calque, au nom près. Celle d'un salon voisin ne désigne rien
       ici, et n'a rien à faire dans ce qu'on publie. */
    const dUnSecteur = k.indexOf("secteur:") === 0 && SECTEURS.has(k.slice(8));
    /* « calque/sous-calque », mais l'un comme l'autre peut porter une barre
       oblique : on retient la clé dès qu'une de ses têtes nomme un calque. */
    const dUnCalque = calques.has(k) ||
      k.split("/").some((_, i, t) => i && calques.has(t.slice(0, i).join("/")));
    if (general || dUnCalque || dUnSecteur) sortie[k] = source[k];
  });
  return sortie;
}

const conf = c => (CONF[c] = CONF[c] || {});
const jeton = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888888";
const sousCle = (cle, id) => cle + "/" + id;

function styleFond(cle){
  const c = conf(cle);
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  if (!g) return;
  g.style.display = c.visible === false ? "none" : "";
  g.querySelectorAll("g[data-s]").forEach(sub => {
    const sc = CONF[sousCle(cle, sub.id)] || {};
    const src = sub.dataset.s || "";
    const noir = !src || src === "rgb(0,0,0)";
    sub.style.display = sc.visible === false ? "none" : "";
    sub.style.color = sc.couleur || c.couleur || (noir ? "" : src);
    const rempli = sc.rempli !== undefined ? sc.rempli : c.rempli;
    if (rempli){
      sub.setAttribute("fill", "currentColor");
      sub.setAttribute("stroke", "none");
    } else {
      sub.setAttribute("fill", sub.dataset.f || "none");
      sub.setAttribute("stroke", "currentColor");
    }
  });
}
function sousCalques(cle){
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  return g ? [...g.querySelectorAll("g[data-s]")].map(s => ({ id: s.id, src: s.dataset.s })) : [];
}

const racine = document.documentElement;

/* Les couches de données n'ont pas de SVG propre : leur visibilité joue sur
   l'affichage du groupe, leur couleur sur une variable CSS. */
function styleDataGroupe(nom, on){
  $(nom).style.display = on ? "" : "none";
  // le liseré du parcours est tracé hors des couches : il ne suit pas tout seul
  if (nom === "stands" || nom === "zones") marqueParcours();
}

function appliqueCouleursData(){
  const pose = (v, n) => v ? racine.style.setProperty(n, v) : racine.style.removeProperty(n);
  pose(conf("data:stands").couleur, "--c-stand");
  pose(conf("data:zones").couleur, "--c-zone");
  const general = conf("data:labels").couleur;
  pose(conf("labStand").couleur || general, "--c-lab-stand");
  pose(conf("labZone").couleur || general, "--c-lab-zone");
  /* Un stand sélectionné prend deux couleurs — l'aplat et son liseré — et
     l'exploitant n'en règle qu'une : celle qu'il voit. Le liseré s'en déduit,
     sans quoi il faudrait accorder deux nuanciers à la main pour que le second
     reste visible sur le premier. */
  const sel = conf("selection").couleur;
  pose(sel, "--c-sel");
  pose(sel && ecarte(sel), "--c-sel-trait");
  /* Le parcours n'a qu'un liseré, sans aplat : il double le contour d'un stand
     qui garde par ailleurs sa teinte. Une seule couleur suffit donc, et elle
     se règle à part de la sélection — les deux marques se croisent sur le même
     plan, et se confondraient si l'exploitant ne pouvait les écarter. */
  pose(conf("parcours").couleur, "--c-parc");
}

function styleData(cle){
  racine.classList.toggle(cle === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                          conf(cle).visible === false);
  appliqueCouleursData();
}

function appliqueApparence(){
  P().fond.forEach(f => {
    // Un calque absent de la configuration est montré. La règle disait
    // l'inverse — masquer tout ce qui n'était pas explicitement marqué visible
    // — et convenait aux données figées, qui portaient ce drapeau. La charge
    // utile servie par l'API n'en porte pas : tout le fond de plan
    // disparaissait, sans que rien ne le signale.
    if (CONF[f.cle] === undefined && f.visible === false) conf(f.cle).visible = false;
    styleFond(f.cle);
  });
  ["zones", "stands", "labels"].forEach(n =>
    styleDataGroupe(n, conf("data:" + n).visible !== false));
  ["labStand", "labZone"].forEach(k =>
    racine.classList.toggle(k === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                            conf(k).visible === false));
  appliqueCouleursData();
  appliqueCommandes();
  appliqueSecteurs();
}

/**
 * Les commandes posées sur le plan, montrées ou non.
 *
 * Le pincement rend les boutons de zoom superflus sur un écran tactile, mais
 * il demande deux doigts : dans une allée de salon, sac à la main, on n'en a
 * souvent qu'un. L'échelle, elle, sert à qui mesure une distance et encombre
 * qui ne la lit pas. Ni l'un ni l'autre ne se tranche par une règle générale :
 * cela dépend du public et du terrain, donc cela revient à l'exploitant.
 *
 * Le parcours de visite se range ici pour la même raison : il vaut pour un
 * salon qu'on parcourt une journée durant, moins pour une exposition d'une
 * heure. Le retirer ne touche pas aux listes déjà constituées sur les
 * téléphones — il masque ce qui y mène, et le réglage peut se rouvrir.
 *
 * Montrées par défaut : un réglage absent ne doit rien retirer à un salon déjà
 * en place.
 *
 * « classe » marque celles dont le retrait déborde de leur propre coin : elle
 * est posée sur la racine, d'où la feuille de style tire le reste.
 */
const COMMANDES = [
  { cle: "_zoom",     sel: ".zoombar",     libelle: "Afficher les icônes de zoom",
    /* L'échelle s'écartait de la marge pour laisser passer les boutons de
       zoom. Sans eux, ce décalage n'a plus d'objet et laisse un vide. */
    classe: "sans-zoom" },
  { cle: "_echelle",  sel: ".scalebar",    libelle: "Afficher l'échelle" },
  { cle: "_parcours", sel: "#btnParcours", libelle: "Proposer le parcours de visite",
    // les signets des fiches et du programme suivent le bouton de la barre
    classe: "sans-parcours" },
  /* L'itinéraire se calcule sur ce que les données disent du hall : les
     emplacements, et les obstacles que l'exploitant a bien voulu dessiner.
     Sur un plan resté nu, le trajet reste juste mais n'évite que les stands —
     à lui de juger si cela suffit à son salon. */
  { cle: "_itineraire", sel: "#btnItineraire", libelle: "Proposer le calcul d'itinéraire",
    // le bouton « Itinéraire » des fiches suit celui de la barre
    classe: "sans-itineraire" },
];

function appliqueCommandes(){
  COMMANDES.forEach(c => {
    const retire = conf(c.cle).visible === false;
    const n = document.querySelector(c.sel);
    if (n) n.hidden = retire;
    if (c.classe) racine.classList.toggle(c.classe, retire);
  });
  // un tiroir ouvert sur une fonction qu'on vient de retirer n'aurait plus de
  // bouton pour se refermer
  if (conf("_parcours").visible === false) fermeParcours();
  if (conf("_itineraire").visible === false) fermeItineraire();
}

/**
 * Combien de temps on passe sur un stand.
 *
 * Ce n'est pas un réglage d'affichage : c'est ce qui décide combien de
 * visites tiennent entre deux conférences quand le visiteur demande qu'on
 * organise sa journée. Le mettre trop bas remplit un programme intenable ;
 * trop haut, il laisse des stands de côté sans raison.
 *
 * Vingt minutes est ce qu'on observe sur un salon professionnel — le temps
 * d'une poignée de main, d'une démonstration et d'une carte de visite. Un
 * salon grand public tourne plus vite, un salon d'affaires beaucoup moins :
 * cela ne se devine pas depuis le plan, d'où le réglage.
 */
const VISITE_DEFAUT = 20;      // minutes
const VISITE_MIN = 5, VISITE_MAX = 120;
function minutesVisite(){
  const v = Math.round(+(CONF["_visite"] || {}).minutes);
  return v >= VISITE_MIN && v <= VISITE_MAX ? v : VISITE_DEFAUT;
}

/**
 * Réglages généraux du plan.
 *
 * Ils ne portent sur aucun calque : dans la pile ils alourdissaient une liste
 * déjà longue, et se lisaient comme une couche de plus. Une fenêtre à part les
 * range, et laisse la place à celles qui viendront.
 */
function ouvreReglages(){
  ouvreModale("Réglages du plan", corps => {
    const p = document.createElement("p");
    p.textContent = "Ce que les visiteurs voient sur le plan. " +
      "Publiez la configuration pour que le changement leur parvienne.";
    corps.appendChild(p);

    const bloc = document.createElement("div");
    bloc.className = "reglages";
    COMMANDES.forEach(cmd => {
      const l = document.createElement("label");
      l.innerHTML = '<input type="checkbox"><span></span>';
      l.querySelector("span").textContent = cmd.libelle;
      const c = l.querySelector("input");
      c.checked = conf(cmd.cle).visible !== false;
      c.onchange = e => {
        conf(cmd.cle).visible = e.target.checked;
        enregistreConf(); appliqueCommandes();
        // la couleur du parcours vit dans la pile : elle suit le réglage
        if (ADMIN) construitPanneau();
      };
      bloc.appendChild(l);
    });

    /* Le coloriage par secteur reste hors de COMMANDES : celles-ci montrent ou
       retirent une commande du plan, celui-ci change ce que le plan donne à
       voir. Il ne s'offre que sur un salon sectorisé — ailleurs la case
       promettrait des couleurs qu'aucune donnée ne porte. */
    if (SECTEURS.size){
      const l = document.createElement("label");
      l.innerHTML = '<input type="checkbox"><span></span>';
      l.querySelector("span").textContent = "Montrer les secteurs — couleurs et filtre";
      const c = l.querySelector("input");
      c.checked = conf("_secteurs").visible !== false;
      c.onchange = e => {
        conf("_secteurs").visible = e.target.checked;
        enregistreConf(); appliqueSecteurs(); appliqueFiltre();
        // les couleurs des secteurs vivent dans la pile : elles suivent
        if (ADMIN) construitPanneau();
      };
      bloc.appendChild(l);
    }

    corps.appendChild(bloc);

    const duree = document.createElement("div");
    duree.className = "reglage-nb";
    duree.innerHTML = '<label><span class="l"></span>' +
      '<input type="number" min="' + VISITE_MIN + '" max="' + VISITE_MAX + '" step="5">' +
      '<span class="u">min</span></label><span class="aide"></span>';
    duree.querySelector(".l").textContent = "Temps de visite par stand";
    duree.querySelector(".aide").textContent =
      "Sert à organiser la journée d'un visiteur depuis son parcours : c'est ce " +
      "qui décide combien de stands tiennent entre deux conférences.";
    const n = duree.querySelector("input");
    n.value = minutesVisite();
    /* Un champ vidé le temps de retaper ne doit rien écrire : on ne retient
       que ce qui tient dans les bornes, et le champ se remet d'aplomb quand
       on le quitte. */
    n.oninput = e => {
      const v = Math.round(+e.target.value);
      if (v >= VISITE_MIN && v <= VISITE_MAX){ conf("_visite").minutes = v; enregistreConf(); }
    };
    n.onblur = () => { n.value = minutesVisite(); };
    corps.appendChild(duree);
  }, [{ libelle: "Fermer" }]);
}

/** Les réglages d'apparence vivent sur le poste tant qu'ils ne sont pas
 *  remontés vers la base. */
const enregistreConf = () => {
  try { localStorage.setItem(CLE_CONF, JSON.stringify(CONF)); } catch (e) {}
};

/** Une couleur Klipso « rgb(r,g,b) » vers la notation attendue par le
 *  sélecteur de couleur. */
const rgbHex = (s) => {
  const m = String(s || "").match(/\d+/g);
  if (!m || m.length < 3) return null;
  return "#" + m.slice(0, 3)
    .map((n) => Math.max(0, Math.min(255, +n)).toString(16).padStart(2, "0")).join("");
};

const hexa = (v) => "#" + v.map(c => c.toString(16).padStart(2, "0")).join("");

/** Luminance relative d'un triplet, au sens du calcul de contraste : 0 pour le
 *  noir, 1 pour le blanc, en passant par la courbe de l'œil. */
const luminance = (v) => [0.2126, 0.7152, 0.0722].reduce((a, poids, i) => {
  const s = v[i] / 255;
  return a + poids * (s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4));
}, 0);

/**
 * Écarte une couleur vers le noir ou vers le blanc, du côté où le contraste
 * gagne le plus. Le liseré d'une sélection se déduit ainsi de son aplat et
 * reste lisible dessus, quel que soit le ton choisi.
 *
 * Le sens ne se devine pas à la clarté seule : un bleu franc et un orange sont
 * tous deux à mi-hauteur, et pourtant l'un gagne à s'éclaircir quand l'autre
 * gagne à s'assombrir. On calcule les deux et on garde le meilleur.
 */
const ecarte = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return hex;
  const n = parseInt(m[1], 16), v = [n >> 16 & 255, n >> 8 & 255, n & 255];
  /* 0,7 plutôt qu'une demi-teinte : le liseré borde l'aplat, mais le numéro du
     stand s'écrit dessus dans la même couleur, et un rapport de contraste de
     trois pour un ne se lit pas en petit. */
  const vers = (but) => v.map(c => Math.round(c + (but - c) * 0.7));
  const base = luminance(v) + 0.05;
  const contraste = (w) => { const a = luminance(w) + 0.05; return a > base ? a / base : base / a; };
  const sombre = vers(0), clair = vers(255);
  return hexa(contraste(sombre) >= contraste(clair) ? sombre : clair);
};

/** Nom lisible d'un sous-calque : « 4-PORTE-SECU » devient « Porte secu ». */
const joli = (id) => String(id)
  .replace(/^[0-9]+-/, "").replace(/[_-]+/g, " ").toLowerCase()
  .replace(/^./, (c) => c.toUpperCase());

/* ============================================================
   10. Mode administration
   Il n'existe que dans la page dédiée, et seulement une fois l'utilisateur
   authentifié. La page publique ne l'active jamais et retire ses commandes
   du document. Un raccourci clavier ne serait pas une frontière.
   ============================================================ */
let ADMIN = false;

/**
 * Page publique : les commandes d'administration sont neutralisées.
 * On les masque et on les vide plutôt que de les supprimer — le montage du
 * plan y touche encore, et ADMIN restant faux, rien ne peut les activer.
 */
function retireAdmin(){
  ["btnLayers", "btnReglages"].forEach(id => { const b = $(id); if (b) b.remove(); });
  ["panel", "outils", "elemSel"].forEach(id => {
    const e = $(id);
    if (!e) return;
    e.hidden = true;
    e.classList.remove("open");
    e.setAttribute("aria-hidden", "true");
    if (id !== "outils") e.innerHTML = "";
  });
}

/** Ouvre le mode administration, une fois l'identité vérifiée. */
function activeAdmin(){
  if (ADMIN) return;
  ADMIN = true;
  // l'outil de départ est la sélection : les dessins deviennent cliquables
  racine.classList.add("mode-edition");
  const b = $("btnLayers");
  if (b){
    b.hidden = false;
    b.onclick = () => {
      const o = $("panel").classList.toggle("open");
      b.setAttribute("aria-pressed", o);
    };
  }
  const r = $("btnReglages");
  if (r){ r.hidden = false; r.onclick = ouvreReglages; }
  const barre = document.createElement("div");
  barre.className = "adminbar";
  /* Copier et importer une configuration servaient à la transporter d'un poste
     à l'autre, faute de mieux. Maintenant qu'elle se publie, ils n'ajoutent
     qu'un chemin de plus pour arriver au même endroit. */
  barre.innerHTML = '<button class="reset fort" id="pousseConf">Pousser la configuration</button>' +
                    '<button class="reset" id="razConf">Rétablir les valeurs d\'origine</button>';
  $("panel").appendChild(barre);
  $("razConf").onclick = () => {
    CONF = JSON.parse(JSON.stringify(DEFAUTS));
    try { localStorage.removeItem(CLE_CONF); } catch (e) {}
    appliqueApparence(); construitPanneau();
  };
  $("pousseConf").onclick = e => pousseConfiguration(e.target);
  /* Le plan a pu être monté avant que l'identité soit vérifiée : une page à
     données figées démarre sans rien attendre. Le panneau des calques n'a
     alors pas été construit — montePlan() n'en bâtit qu'en administration —
     et les dessins ne sont pas cliquables. C'est à cela que sert ce drapeau,
     qui jusqu'ici ne servait à rien. */
  if (MONTE){ dessineDessins(); construitPanneau(); }
  majAttente();
}


/* ============================================================
   Renommer une zone organisateur
   Une zone tire son nom de Klipso, ou des textes posés sur le plan. Quand ni
   l'un ni l'autre ne donne rien — les vingt-deux zones de Franchise Expo
   s'affichent « Zone sans nom » — il faut pouvoir le saisir.

   Le nom est enregistré sur l'événement, pas dans le navigateur : c'est le
   visiteur qui doit le lire. Et il s'applique à la lecture, si bien qu'il
   paraît sans attendre la prochaine synchronisation.
   ============================================================ */
function renommeZone(o){
  let champ;
  ouvreModale("Renommer la zone", corps => {
    const l = document.createElement("label");
    l.innerHTML = "<span>Nom de la zone</span><input>";
    champ = l.querySelector("input");
    champ.value = (DATA.nomsZones || {})[o.id] || o.nom || "";
    champ.placeholder = "Agora, Halte-garderie, Pitch Retail…";
    corps.appendChild(l);
    const aide = document.createElement("p");
    aide.className = "aide";
    aide.textContent = "Laissez vide pour revenir au nom d'origine, s'il y en a un.";
    corps.appendChild(aide);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); enregistreNomZone(o, champ.value); fermeModale(); }
    };
  }, [
    { libelle: "Annuler" },
    { libelle: "Enregistrer", genre: "primaire",
      action: () => enregistreNomZone(o, champ.value) },
  ]);
}

async function enregistreNomZone(o, valeur){
  const nom = String(valeur || "").trim();

  let cfg = null, ses = null;
  try {
    cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    ses = JSON.parse(localStorage.getItem("console-session") || "null");
  } catch (e) {}
  if (!cfg?.url || !ses?.access_token){
    annonce("Session absente : reconnectez-vous pour renommer.", true);
    return;
  }

  try {
    /* Les noms tiennent dans une seule colonne : l'enregistrement la réécrit
       entière. La renvoyer telle que la page l'avait chargée effacerait tout
       renommage survenu depuis — d'un autre poste, ou d'un onglet resté
       ouvert. On repart donc de ce que la base contient à l'instant, et on
       n'y touche que la zone concernée. */
    const enBase = await fetch(cfg.url + "/rest/v1/evenement?select=zones&slug=eq." +
      encodeURIComponent(DATA.slug), {
      headers: { "apikey": cfg.anonKey, "Authorization": "Bearer " + ses.access_token },
    }).then(r => r.ok ? r.json() : []).catch(() => []);
    const noms = { ...(enBase[0]?.zones || DATA.nomsZones || {}) };
    if (nom) noms[o.id] = nom; else delete noms[o.id];

    const r = await fetch(cfg.url + "/rest/v1/evenement?slug=eq." + encodeURIComponent(DATA.slug), {
      method: "PATCH",
      headers: {
        "apikey": cfg.anonKey,
        "Authorization": "Bearer " + ses.access_token,
        "Content-Type": "application/json",
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({ zones: noms, modifie_le: new Date().toISOString() }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120));

    DATA.nomsZones = noms;
    // le nom d'origine n'est pas perdu : on le garde pour pouvoir y revenir
    if (o.origine === undefined) o.origine = o.nom;
    o.nom = nom || o.origine || null;
    libelles(); liste();
    ouvre(o, null);
  } catch (e) {
    annonce("Renommage impossible : " + e.message, true);
  }
}

/* ============================================================
   11. Calques de dessin
   Des calques créés par l'exploitant, propres à un pavillon, sur lesquels
   il trace rectangles, polygones, lignes et textes. Le tracé est enregistré
   en mètres dans le repère du plan : il suit le zoom comme le reste.
   ============================================================ */
const CLE_DESSINS = "plan-dessins";
let DESSINS = {};
try { DESSINS = JSON.parse(localStorage.getItem(CLE_DESSINS) || "{}"); } catch (e) {}

/* Ce qui n'est pas encore parti en base.
   Les dessins vivent à deux endroits : la base, qui fait foi pour les
   visiteurs, et le poste, où l'exploitant travaille. Au chargement, la base
   écrasait le poste sans rien demander — un calque tracé puis non publié
   disparaissait au premier rechargement, alors qu'il était encore dans le
   stockage local. Il ne se perdait pas : il devenait invisible, puis
   l'enregistrement suivant l'effaçait pour de bon.

   On retient donc, pavillon par pavillon, qu'un dessin a bougé depuis la
   dernière publication. Ce travail-là l'emporte sur la base tant qu'il n'y est
   pas parti — lui seul n'existe nulle part ailleurs. */
const CLE_ATTENTE = "plan-dessins-attente";
let ATTENTE = {};
try { ATTENTE = JSON.parse(localStorage.getItem(CLE_ATTENTE) || "{}"); } catch (e) {}

/** Le pavillon a-t-il des dessins que la base ne connaît pas encore ? */
const enAttente = (id) => ATTENTE[id] === true;

function marqueAttente(id, oui){
  if (oui) ATTENTE[id] = true; else delete ATTENTE[id];
  try { localStorage.setItem(CLE_ATTENTE, JSON.stringify(ATTENTE)); } catch (e) {}
  majAttente();
}

/** Les calques de dessin du pavillon courant. Ceux du service ont été repris
 *  au chargement ; il ne reste qu'à ouvrir la liste si elle manque. */
const mesCalques = () => (DESSINS[P().id] = DESSINS[P().id] || []);
const enregistreDessins = () => {
  /* Les repères et les formes dessinées entrent dans le calcul d'itinéraire :
     la grille de marche qui les ignore n'a plus cours, et l'annuaire des
     passages non plus. On attend la fin du geste — dessiner en referait une à
     chaque image, ce qui serait insoutenable. */
  oublieGrilles();
  oublieLiaisons();
  rafraichitApercu();
  /* Le geste vient d'écarter le poste de ce que la base contient : c'est vrai
     dès la première forme tracée, et non au moment où l'on pense à publier. */
  marqueAttente(P().id, true);
  try { localStorage.setItem(CLE_DESSINS, JSON.stringify(DESSINS)); }
  catch (e) {
    // les images sont encodées dans le document : le quota se remplit vite
    if ($("outilsAide")) $("outilsAide").textContent =
      "Mémoire du navigateur pleine : allégez ou supprimez une image.";
  }
};

let calqueActif = null;   // id du calque en cours d'édition
let outil = "main";
let enCours = null;       // tracé en construction

/* Historique des dessins. L'instantané ne copie que les calques et leurs
   tableaux de formes : les formes elles-mêmes, images comprises, sont
   partagées par référence — mémoriser reste donc quasi gratuit. */
const HIST = [], REFAIRE = [];
const instantane = () => mesCalques().map(c => Object.assign({}, c, { formes: c.formes.slice() }));
function memorise(){
  HIST.push(instantane());
  if (HIST.length > 50) HIST.shift();
  REFAIRE.length = 0;
}
function restaure(source, autre){
  if (!source.length) return false;
  autre.push(instantane());
  DESSINS[P().id] = source.pop();
  if (calqueActif && !trouveCalque(calqueActif)) activeCalque(null);
  enregistreDessins(); dessineDessins();
  if (ADMIN) construitPanneau();
  return true;
}
function annule(){
  // pendant un tracé, on retire le dernier sommet plutôt que l'action entière
  if (enCours && enCours.pts.length > 1){
    enCours.pts.pop();
    apercu(cheminForme({ t: "ligne", pts: enCours.pts }));
    aide();
    return;
  }
  if (enCours){ termineTrace(false); return; }
  if (!restaure(HIST, REFAIRE)) $("outilsAide").textContent = "Rien à annuler.";
}
function refais(){ restaure(REFAIRE, HIST); }

const trouveCalque = id => mesCalques().find(c => c.id === id);
const nouvelId = () => "d" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

/* --- rendu --- */
function cheminForme(f){
  if (f.t === "rect" || f.t === "image"){
    const [a, b] = f.pts;
    const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
    const w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    return "M" + x + " " + y + "h" + w + "v" + h + "h" + (-w) + "Z";
  }
  const d = "M" + f.pts.map(p => p[0] + " " + p[1]).join("L");
  return f.t === "ligne" ? d : d + "Z";
}
function dessineDessins(){
  const c = $("couches");
  c.querySelectorAll(".dcal").forEach(g => g.remove());
  for (const cal of mesCalques()){
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const role = roleIti(cal);
    g.setAttribute("class", "dcal" + (cal.rempli ? " plein" : "") +
                            (role ? " role " + role : "") +
                            (cal.id === calqueActif && ADMIN ? " editable" : ""));
    g.dataset.dcal = cal.id;
    g.style.color = cal.couleur || "var(--accent)";
    g.style.display = cal.visible === false ? "none" : "";
    g.innerHTML = cal.formes.map(f => f.t === "image"
      // Le clic sur le plan cherche l'ancêtre porteur d'un data-id : une image
      // liée à un stand ouvre donc sa fiche sans code supplémentaire. C'est
      // ainsi qu'on pose le logo d'un exposant sur son emplacement.
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") +
        (f.stand && parId.has(f.stand) ? " lie" : "") + '" data-f="' + f.id + '"' +
        (f.stand && parId.has(f.stand) ? ' data-id="' + esc(f.stand) + '"' : "") +
        '><image href="' + f.src + '" x="' + f.pts[0][0] +
        '" y="' + f.pts[0][1] + '" width="' + (f.pts[1][0] - f.pts[0][0]) +
        '" height="' + (f.pts[1][1] - f.pts[0][1]) +
        '" preserveAspectRatio="xMidYMid meet"/></g>'
      : f.t === "repere"
      ? traceRepere(f)
      : f.t === "texte"
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id + '"><text x="' + f.pts[0][0] + '" y="' + f.pts[0][1] +
        '" font-size="' + (f.taille || 2) + '">' + esc(f.txt) + '</text></g>'
      : '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id +
        '"><path d="' + cheminForme(f) + '"/></g>').join("");
    c.appendChild(g);
  }
  ordonneDom();
  cartouchePoi();
}

/* --- conversion écran → repère du plan --- */
function versPlan(clientX, clientY){
  const r = svg.getBoundingClientRect();
  return [ +(view.x + (clientX - r.left) / r.width * view.w).toFixed(2),
           +(view.y + (clientY - r.top) / r.height * view.h).toFixed(2) ];
}

function apercu(d){
  let el = $("apercu");
  if (!d){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.id = "apercu";
    svg.appendChild(el);
  }
  el.setAttribute("d", d);
}

function ajouteForme(f){
  const c = trouveCalque(calqueActif);
  if (!c) return;
  memorise();
  f.id = nouvelId();
  c.formes.push(f);
  enregistreDessins();
  dessineDessins();
  aide();
  return f.id;
}

/** Le pictogramme que suggère un libellé, s'il en existe un. */
const pictoDe = (txt) => PICTO_MOTS[String(txt || "").trim().toLowerCase()] || null;

/**
 * Ce qu'un repère est, et ce qu'il s'appelle.
 *
 * Les deux se confondaient : le pictogramme était deviné depuis le libellé, si
 * bien qu'un repère nommé « Entrée Nord » n'était plus une entrée — ni pour le
 * dessin, ni pour l'itinéraire, ni pour la liste des départs. Un hall qui
 * nomme ses portes perdait donc ce qui les rendait utiles, et il n'y avait pas
 * moyen de nommer deux escaliers sans les déclasser tous les deux.
 *
 * Le type et le libellé sont donc deux choses. Le type porte les propriétés —
 * le pictogramme, l'obstacle en fauteuil, la qualité de porte par où passe un
 * trajet entre pavillons — et se choisit dans une liste. Le libellé ne sert
 * qu'à distinguer un exemplaire d'un autre, et s'écrit librement.
 *
 * Un repère posé avant cette séparation n'a que son libellé : on continue de
 * le deviner pour lui, et son plan s'affiche comme il le faisait. Le type
 * s'écrit dès qu'on y touche.
 */
const TYPES_REPERE = [
  { v: "",             nom: "Sans pictogramme" },
  { v: "entree",       nom: "Entrée/Sortie" },
  { v: "wc",           nom: "WC" },
  { v: "accueil",      nom: "Accueil" },
  { v: "info",         nom: "Information" },
  { v: "restauration", nom: "Restauration" },
  { v: "cafe",         nom: "Café" },
  { v: "vestiaire",    nom: "Vestiaire" },
  { v: "ascenseur",    nom: "Ascenseur" },
  { v: "escalier",     nom: "Escalier" },
  { v: "escalator",    nom: "Escalator" },
  { v: "secours",      nom: "Secours" },
  { v: "pmr",          nom: "Accessibilité" },
  { v: "parking",      nom: "Parking" },
  { v: "distributeur", nom: "Distributeur" },
  { v: "reunion",      nom: "Salle de réunion" },
];
const nomTypeRepere = (v) => (TYPES_REPERE.find(t => t.v === v) || TYPES_REPERE[0]).nom;

/* « Entrée » et « Sortie » ont longtemps fait deux pictogrammes ; ils n'en font
   plus qu'un, une porte de hall étant les deux à la fois. */
const PICTO_ALIAS = { sortie: "entree" };

/**
 * Le type d'un repère : celui qu'on lui a donné, ou celui que son libellé
 * laisse deviner s'il est d'avant la séparation. Une chaîne vide est un choix
 * — « sans pictogramme » — et non une absence : elle ne se redevine pas.
 */
function pictoForme(f){
  const p = f.picto === undefined ? pictoDe(f.txt) : f.picto;
  return PICTO_ALIAS[p] || p;
}

/* Taille de naissance d'un repère, en mètres. Un texte libre en fait deux ;
   un repère doit se repérer de loin, sans qu'on le cherche. */
const TAILLE_REPERE = 4;

/**
 * Un repère : une pastille dans la couleur du calque, son libellé dedans.
 *
 * La largeur suit le texte, mesurée dans la police de rendu — une pastille
 * taillée au jugé serait trop courte sur « Restauration » et trop longue sur
 * « WC ». Tout est en mètres, comme le reste du plan : le repère grandit donc
 * avec le zoom, à l'inverse d'une épingle d'interface.
 */
function traceRepere(f){
  const t = f.taille || 2;
  /* Le repère répond au clic comme un stand : le plan ne montre plus que le
     pictogramme, et c'est la fiche qui dit son nom. Le rôle et le libellé
     partent avec lui, pour qui lit le plan au clavier ou à la synthèse
     vocale. */
  const dit = String(f.txt || "").trim();
  const type = pictoForme(f);
  const nom = dit || (type ? nomTypeRepere(type) : "Repère");
  const tete = '<g class="forme repere' + (f.id === formeSel ? " pick" : "") +
               '" data-f="' + f.id + '" data-poi="' + esc(f.id) +
               '" tabindex="0" role="button" aria-label="' +
               esc(nom + (type && dit ? " — " + nomTypeRepere(type) : "")) + '">';

  /* Un pictogramme se pose dans un <svg> imbriqué : il porte sa propre grille,
     et le navigateur se charge du cadrage — plus sûr qu'une transformation
     calculée à la main. */
  const g = PICTOS[type];
  if (g){
    /* La pastille ne porte que le pictogramme.
     *
     * Le libellé s'écrivait à côté dès qu'il disait autre chose que lui —
     * « Entrée Nord » avait besoin de son nord. Mais un nom écrit à la taille
     * du plan ne se lit qu'en zoomant, et la pastille s'allongeait de tout ce
     * texte en travers de l'allée qu'elle désigne. Le pictogramme dit ce que
     * c'est, ce qui est la question qu'on se pose de loin ; le nom se demande
     * de près, et c'est la fiche qui le donne. Le cartouche des points
     * d'intérêt, lui, continue de les nommer tous.
     */
    const cote = t * 2.4, m = cote * .15, k = cote - 2 * m;
    const x = f.pts[0][0] - cote / 2, y = f.pts[0][1] - cote / 2;
    return tete +
      '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + cote.toFixed(2) +
      '" height="' + cote.toFixed(2) + '" rx="' + (cote * .2).toFixed(2) + '"/>' +
      '<svg class="glyphe" x="' + (x + m).toFixed(2) + '" y="' + (y + m).toFixed(2) +
      '" width="' + k.toFixed(2) + '" height="' + k.toFixed(2) +
      '" viewBox="' + g.vb + '">' + g.d + '</svg></g>';
  }

  /* Sans pictogramme, le libellé est tout ce que le repère a à montrer : le
     retirer laisserait une pastille muette. */
  const l = largeur(nom, P_NOM) * t;
  const w = l + t * 1.1, ht = t * 1.65;
  const x = f.pts[0][0] - w / 2, y = f.pts[0][1] - ht / 2;
  return tete +
    '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) +
    '" height="' + ht.toFixed(2) + '" rx="' + (ht / 2).toFixed(2) + '"/>' +
    '<text x="' + f.pts[0][0] + '" y="' + (f.pts[0][1] + t * .35).toFixed(2) +
    '" font-size="' + t.toFixed(2) + '">' + esc(nom) + '</text></g>';
}

/**
 * Cartouche des points d'intérêt.
 *
 * Les repères posés sur un plan se répètent — plusieurs sanitaires, plusieurs
 * entrées — et se cherchent à l'œil. Le cartouche les récapitule par libellé ;
 * en choisir un met en avant tous ceux qui le portent, où qu'ils soient.
 */
let poiChoisi = null;

function cartouchePoi(){
  const z = $("poi");
  if (!z) return;
  const parNom = new Map();
  for (const cal of mesCalques()){
    if (cal.visible === false) continue;
    for (const f of cal.formes){
      if (f.t !== "repere" || !f.txt) continue;
      const cle = f.txt.trim();
      if (!parNom.has(cle)) parNom.set(cle, { n: 0, picto: pictoForme(f) });
      parNom.get(cle).n++;
    }
  }
  z.hidden = parNom.size === 0;
  if (z.hidden){ poiChoisi = null; eclairePoi(); mesureCartouche(); return; }

  z.innerHTML = "";
  [...parNom.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "fr"))
    .forEach(([nom, o]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "poiBtn";
      b.setAttribute("aria-pressed", nom === poiChoisi);
      const g = PICTOS[o.picto];
      // largeur et hauteur en attributs : un <svg> sans dimension explicite
      // s'étale à la place disponible, et le cartouche y perdait sa mise en page
      b.innerHTML = (g
        ? '<svg class="poiPicto" width="17" height="17" viewBox="' + g.vb +
          '" aria-hidden="true">' + g.d + '</svg>'
        : "") + '<span></span>' + (o.n > 1 ? '<i>' + o.n + '</i>' : "");
      b.querySelector("span").textContent = nom;
      b.onclick = () => {
        const choisit = poiChoisi !== nom;
        poiChoisi = choisit ? nom : null;
        /* Les repères d'un même type sont dispersés dans le hall. Les mettre
           en avant sans reculer ne montrerait que ceux déjà à l'écran, et
           l'exploitant conclurait qu'il n'y en a pas d'autres. On revient donc
           sur le plan entier, où ils se comptent d'un coup d'œil. */
        if (choisit) fit();
        cartouchePoi();
      };
      z.appendChild(b);
    });
  eclairePoi();
  mesureCartouche();
}

/**
 * La fiche d'un repère.
 *
 * Le plan ne montre plus que le pictogramme ; le nom n'est pas perdu pour
 * autant, il est ce que le clic donne — comme une forme de stand donne la
 * fiche de son exposant. On y lit ce que le repère est, comment il s'appelle,
 * et, quand c'est un passage, ce qu'il dessert : un escalier qui monte à deux
 * étages le dit ici, et nulle part ailleurs.
 *
 * La fiche est celle des stands, remplie autrement : elle partage la même
 * bande que le parcours et l'itinéraire, et deux fiches ouvertes en même
 * temps ne se liraient pas.
 */
function ouvrePoi(id, rect){
  const cible = formeParId(id);
  if (!cible || cible.f.t !== "repere") return;
  const f = cible.f, p = P();
  fermeParcours(); fermeItineraire();

  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  const noeudPoi = $("couches").querySelector('.repere[data-poi="' + CSS.escape(id) + '"]');
  if (noeudPoi) noeudPoi.classList.add("sel");

  const type = pictoForme(f);
  const dit = String(f.txt || "").trim();
  $("dKind").hidden = false;
  $("dKind").textContent = type ? nomTypeRepere(type) : "Repère";
  $("dName").textContent = dit || (type ? nomTypeRepere(type) : "Repère");
  $("dCode").textContent = p.libelle;
  $("dNeuf").hidden = true;
  $("dPartage").hidden = true;
  /* Un repère ne se retient pas dans un parcours : on ne visite pas un
     escalier, on le prend. */
  const sig = $("dMarque");
  sig.hidden = true;
  delete sig.dataset.mg; delete sig.dataset.mi;
  if ($("dRen")) $("dRen").hidden = true;
  $("dOnglets").hidden = true;
  $("detail").classList.remove("deux");
  onglet("detail");

  /* Ce qu'un passage dessert, avec le temps qu'il demande : c'est ce qui
     distingue deux escaliers voisins, et ce qu'un visiteur cherche à savoir
     avant de s'y engager. */
  const liens = typeLiaison(f) ? liensDe(f) : [];
  const dessert = liens.length
    ? '<div class="field"><span class="eyebrow">Mène à</span><span class="v">' +
      liens.map(x => '<span class="ligne">' +
        esc(x.o.p.libelle + " · " + nomRepere(x.o.f)) + " — " +
        esc(ecritMinutes(x.min == null ? typeLiaison(f).min : x.min)) +
        '</span>').join("") + "</span></div>"
    : "";

  $("dBody").innerHTML = '<div class="cInfos" id="dPaneInfos">' + dessert + "</div>" +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  $("dGo").onclick = () => centrePoint(f.pts[0]);
  // « j'y vais » : l'arrivée est ce repère, le départ reste à dire
  $("dItin").onclick = () => versItineraireDe(pointRepere(f, p));

  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  anime(rect, 1);
}

/**
 * Hauteur du cartouche, donnée au CSS.
 *
 * Sur un écran étroit le cartouche est assez large pour recouvrir l'échelle,
 * qui vit dans le même coin bas. Le commentaire de la feuille de style
 * affirmait qu'il « se retire de l'échelle » : c'était vrai sur un grand
 * écran, où il n'atteignait pas la marge gauche. À 412 pixels il la traverse.
 * L'échelle se pose donc au-dessus de lui, d'après sa hauteur réelle — nulle
 * quand il est absent, auquel cas rien ne bouge.
 */
function mesureCartouche(){
  const z = $("poi");
  const h = z && !z.hidden ? z.offsetHeight + 8 : 0;
  document.documentElement.style.setProperty("--cartouche", h + "px");
}

/** Met en avant les repères du type choisi. */
function eclairePoi(){
  $("couches").querySelectorAll(".dcal .repere").forEach(g => {
    const f = formeParId(g.dataset.f);
    const on = poiChoisi && f && String(f.f.txt || "").trim() === poiChoisi;
    g.classList.toggle("phare", !!on);
  });
  racine.classList.toggle("poi-actif", !!poiChoisi);
}

/* Un bref halo, réservé à l'image posée automatiquement : sans lui on la
   cherche, et on croit qu'il reste un bouton à valider. */
function signale(id){
  const g = $("couches").querySelector('.forme[data-f="' + CSS.escape(id) + '"]');
  if (!g || REDUIT) return;
  g.classList.add("neuve");
  setTimeout(() => g.classList.remove("neuve"), 1300);
}

/* --- import d'image ---
   L'image est réduite et convertie en data-URI : une page publiée ne peut
   charger aucune ressource externe, tout doit vivre dans le document.   */
let imageEnAttente = null;
const MAX_PX = 1400;

/* On ne refuse plus une image faute de calque actif : on en ouvre un. */
function calquePourImage(){
  if (calqueActif && trouveCalque(calqueActif)) return trouveCalque(calqueActif);
  const l = mesCalques();
  if (l.length){ activeCalque(l[l.length - 1].id); return trouveCalque(calqueActif); }
  memorise();
  const c = { id: nouvelId(), nom: "Images", couleur: "#2F49D1",
              rempli: false, visible: true, formes: [] };
  l.push(c); enregistreDessins(); construitPanneau(); activeCalque(c.id);
  return c;
}

/* Pose l'image autour d'un point, à une taille lisible au zoom courant.
   Plus besoin de tracer un cadre : on ajuste ensuite si besoin. */
function poseImage(centre){
  if (!imageEnAttente) return;
  calquePourImage();
  const l = Math.max(4, view.w * .28);
  const ht = l / imageEnAttente.ratio;
  const c = centre || [view.x + view.w / 2, view.y + view.h / 2];
  const id = ajouteForme({ t: "image", src: imageEnAttente.src,
    pts: [[+(c[0] - l / 2).toFixed(2), +(c[1] - ht / 2).toFixed(2)],
          [+(c[0] + l / 2).toFixed(2), +(c[1] + ht / 2).toFixed(2)]] });
  signale(id);   // l'emplacement n'a pas été choisi : il faut le montrer
  $("outilsAide").textContent = "Image posée au centre de la vue. Glissez sur le plan pour en poser une autre.";
}

function importeImage(fichier, centre){
  if (!fichier || fichier.type.indexOf("image/") !== 0) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const type = fichier.type === "image/jpeg" ? "image/jpeg" : "image/webp";
      imageEnAttente = { src: c.toDataURL(type, .85), ratio: img.width / img.height };
      const v = $("vignette");
      v.innerHTML = '<img alt=""><span></span>';
      v.querySelector("img").src = imageEnAttente.src;
      v.querySelector("span").textContent =
        Math.round(imageEnAttente.src.length / 1365) + " Ko";
      v.dataset.prete = "1";
      choisitOutil("image");
      poseImage(centre);
    };
    img.onerror = () => { $("outilsAide").textContent = "Image illisible."; };
    img.src = fr.result;
  };
  fr.readAsDataURL(fichier);
}

$("fichierImage").onchange = e => { importeImage(e.target.files[0]); e.target.value = ""; };
$("choisirImage").onclick = () => $("fichierImage").click();

/* glisser-déposer sur le plan, et collage clavier : deux chemins qui ne
   dépendent pas de la boîte de dialogue système */
svg.addEventListener("dragover", e => { if (ADMIN) e.preventDefault(); });
svg.addEventListener("drop", e => {
  if (!ADMIN) return;
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) importeImage(f, versPlan(e.clientX, e.clientY));
});
addEventListener("paste", e => {
  if (!ADMIN) return;
  const it = [...(e.clipboardData ? e.clipboardData.items : [])]
    .find(x => x.type.indexOf("image/") === 0);
  if (it) importeImage(it.getAsFile());
});

/* --- gestion du geste de dessin ; renvoie true si l'événement est consommé --- */
function dessinPointerDown(e){
  if (editionPointerDown(e)) return true;
  if (!ADMIN || !calqueActif || outil === "main") return false;
  // sans cela le navigateur démarre une sélection de texte et le
  // relâchement du pointeur ne revient jamais
  e.preventDefault();
  if (outil === "rect" || outil === "image"){
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  }
  const p = versPlan(e.clientX, e.clientY);
  if (outil === "texte"){
    const txt = $("texteADessiner").value.trim();
    if (!txt){ $("texteADessiner").focus(); return true; }
    ajouteForme({ t: "texte", pts: [p], txt: txt, taille: 2 });
    return true;
  }
  if (outil === "repere"){
    const type = $("repereType").value;
    /* Le libellé peut rester vide quand le pictogramme se suffit : c'est le
       cas ordinaire d'un WC. Sans type ni libellé, en revanche, il n'y aurait
       rien à poser. */
    const txt = $("repereTexte").value.trim() || (type ? nomTypeRepere(type) : "");
    if (!txt){ $("repereTexte").focus(); return true; }
    // un repère se lit de loin : il naît deux fois plus grand qu'un texte
    ajouteForme({ t: "repere", pts: [p], txt: txt, picto: type, taille: TAILLE_REPERE });
    return true;
  }
  if (outil === "rect"){ enCours = { t: "rect", pts: [p, p] }; return true; }
  if (outil === "image"){
    if (!imageEnAttente){ $("outilsAide").textContent = "Choisissez d’abord une image."; return true; }
    enCours = { t: "image", pts: [p, p] };
    return true;
  }
  // polygone et ligne : un clic par sommet
  if (!enCours) enCours = { t: outil, pts: [p] };
  else enCours.pts.push(p);
  apercu(cheminForme({ ...enCours, t: "ligne" }));
  aide();
  return true;
}
function dessinPointerMove(e){
  if (editionPointerMove(e)) return true;
  if (!enCours) return false;
  const p = versPlan(e.clientX, e.clientY);
  if (enCours.t === "rect" || enCours.t === "image"){
    enCours.pts[1] = p;
    if (enCours.t === "image"){    // on respecte les proportions de l'image
      const l = enCours.pts[1][0] - enCours.pts[0][0];
      enCours.pts[1][1] = +(enCours.pts[0][1] + Math.abs(l) / imageEnAttente.ratio).toFixed(2);
    }
    apercu(cheminForme(enCours));
  } else {
    apercu(cheminForme({ t: "ligne", pts: [...enCours.pts, p] }));
  }
  return true;
}
function dessinPointerUp(e){
  if (editionPointerUp(e)) return true;
  if (!enCours) return false;
  if (e && e.pointerId != null){
    try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  if (enCours.t === "rect" || enCours.t === "image"){
    const a = enCours.pts[0], b = enCours.pts[1];
    if (Math.abs(b[0] - a[0]) > .3 && Math.abs(b[1] - a[1]) > .3){
      if (enCours.t === "image"){
        enCours.pts = [[Math.min(a[0], b[0]), Math.min(a[1], b[1])],
                       [Math.max(a[0], b[0]), Math.max(a[1], b[1])]];
        enCours.src = imageEnAttente.src;
      }
      ajouteForme(enCours);
    }
    enCours = null; apercu(null);
  }
  return true;   // polygone et ligne restent ouverts jusqu'à Entrée
}
function termineTrace(valider){
  if (!enCours) return;
  const mini = enCours.t === "ligne" ? 2 : 3;
  if (valider && enCours.pts.length >= mini) ajouteForme(enCours);
  enCours = null; apercu(null); aide();
}

function aide(){
  if (!$("outilsAide")) return;
  const t = { main: formeSel ? "Glissez pour déplacer, les carrés pour redimensionner."
                             : "Cliquez une forme pour la modifier.",
              rect: "Cliquez-glissez pour tracer un rectangle.",
              poly: "Un clic par sommet, Entrée pour fermer, Échap pour annuler.",
              ligne: "Un clic par point, Entrée pour terminer, Échap pour annuler.",
              texte: "Saisissez le texte, puis cliquez à l'emplacement voulu.",
              repere: "Choisissez ou saisissez un libellé, puis cliquez à l'emplacement.",
              image: imageEnAttente ? "Glissez sur le plan pour poser une autre copie."
                                    : "Choisissez une image, ou déposez le fichier sur le plan.",
              _: "" };
  const n = enCours ? " (" + enCours.pts.length + " point" + (enCours.pts.length > 1 ? "s" : "") + ")" : "";
  $("outilsAide").textContent = t[outil] + n;
}

/* --- suppression au clic en mode sélection --- */
function choisitOutil(o){
  termineTrace(false);
  outil = o;
  const b = $("outils");
  b.querySelectorAll(".outilsBtns button")
    .forEach(x => x.setAttribute("aria-pressed", x.dataset.o === outil));
  if (o !== "main") formeSel = null;
  dessinePoignees(); majElement();
  b.classList.toggle("mode-image", o === "image");
  b.classList.toggle("mode-texte", o === "texte");
  b.classList.toggle("mode-repere", o === "repere");
  racine.classList.toggle("mode-edition", ADMIN && o === "main");
  if (o === "texte") $("texteADessiner").focus();
  if (o === "repere") $("repereTexte").focus();
  aide();
}
$("outils").querySelectorAll(".outilsBtns button")
  .forEach(b => b.onclick = () => choisitOutil(b.dataset.o));
$("annuleDernier").onclick = annule;
$("fermeOutils").onclick = () => { if (calqueActif) activeCalque(calqueActif); };
$("renommeOutils").onclick = () => {
  const c = trouveCalque(calqueActif);
  if (c) renommeCalque(c);
};
/* Le type décide de ce que le repère est ; le libellé, de ce qu'il s'appelle.
   Poser un WC ne demande donc rien d'autre que de choisir « WC » — le libellé
   ne sert qu'à distinguer deux exemplaires, « Entrée Nord » de « Entrée Sud ». */
$("repereType").innerHTML =
  TYPES_REPERE.map(t => '<option value="' + esc(t.v) + '">' + esc(t.nom) + '</option>').join("");
$("repereType").onchange = () => $("repereTexte").focus();

$("elemSupprimer").onclick = supprimeForme;
$("elemTexte").oninput = appliqueTexte;
$("elemTaille").oninput = appliqueTexte;
$("elemPicto").onchange = appliquePicto;
/* La liste des passages revient à « Relier à… » dès que le choix est fait :
   c'est une action, pas un réglage — on en pose plusieurs à la suite. */
$("elemLienAjout").onchange = (e) => {
  const id = e.target.value;
  e.target.value = "";
  if (id) changeLien(id, true);
};
// on valide la liaison à la sortie du champ, pas à chaque frappe : une saisie
// partielle ne désigne aucun stand et effacerait le lien
$("elemStand").onchange = appliqueLiaison;
$("elemStand").onblur = appliqueLiaison;

function activeCalque(id){
  calqueActif = calqueActif === id ? null : id;
  formeSel = null;
  termineTrace(false);
  const c = trouveCalque(calqueActif);
  { const o = $("outils"); if (o) o.classList.toggle("open", !!c); }
  if (c && $("outilsCalque")) $("outilsCalque").textContent = "Dessin · " + c.nom;
  montreRoleIti(c);
  rafraichitApercu();
  dessineDessins();   // la couche active redevient cliquable
  dessinePoignees(); majElement();
  document.querySelectorAll("#pile .calq").forEach(d => {
    const actif = d.dataset.dcal === calqueActif;
    d.classList.toggle("actif", actif);
    const cr = d.querySelector(".ren");
    if (cr) cr.setAttribute("aria-pressed", actif);
  });
  aide();
}

/* ------------------------------------------------------------
   Le rôle du calque dans les itinéraires
   ------------------------------------------------------------ */
/** Ce que le rôle change, en une phrase — sans quoi on le règle au hasard. */
const AIDE_ROLE = {
  "": "Ce calque n'entre pas dans le calcul des trajets.",
  obstacle: "Ce qui est dessiné ici barre le passage à tout le monde : " +
    "entourez les sanitaires, les locaux, les réserves. C'est le plus court chemin — " +
    "quelques rectangles au lieu de toutes les allées.",
  pmr: "Ce qui est dessiné ici n'est contourné qu'en itinéraire accessible : " +
    "pentes, emmarchements, estrades.",
  circulation: "Les trajets ne sortiront plus de ce qui est dessiné ici, et il faudra " +
    "donc tracer toutes les allées. Faites-les telles qu'elles sont : le dégagement " +
    "au bord est retiré tout seul.",
};

function montreRoleIti(c){
  const sel = $("roleIti");
  if (!sel) return;
  // la liste se remplit au premier passage : les rôles vivent dans un module
  // assemblé après celui-ci
  if (!sel.options.length)
    sel.innerHTML = ROLES_ITI.map(r =>
      '<option value="' + r.v + '">' + esc(r.nom) + '</option>').join("");
  const r = c ? roleIti(c) : "";
  sel.value = r;
  $("roleAide").textContent = AIDE_ROLE[r] || "";
}

$("roleIti").onchange = e => {
  const c = trouveCalque(calqueActif);
  if (!c) return;
  const v = e.target.value;
  const cle = cleRoleIti(c.id);
  if (v) conf(cle).role = v; else delete CONF[cle];
  enregistreConf();
  oublieGrilles();
  montreRoleIti(c);
  dessineDessins();
  construitPanneau();
  rafraichitApercu();
  // le trajet affiché doit obéir sur-le-champ : c'est le seul retour visible
  relance();
};

$("voirNappe").onchange = e => { voirNappe = e.target.checked; rafraichitApercu(); };

function creeCalque(){
  demandeNom("Nouveau calque", "Calque " + (mesCalques().length + 1), nom => {
    memorise();
    const c = { id: nouvelId(), nom: nom, couleur: "#2F49D1",
                rempli: false, visible: true, formes: [] };
    mesCalques().push(c);
    enregistreDessins();
    construitPanneau();
    activeCalque(c.id);
  });
}

/* saisie du nom dans une fenêtre : plus visible qu'un double-clic */
function demandeNom(titre, valeur, suite){
  let champ;
  ouvreModale(titre, corps => {
    champ = document.createElement("input");
    champ.className = "nomcalque";
    champ.value = valeur;
    champ.setAttribute("aria-label", "Nom du calque");
    corps.appendChild(champ);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); valide(); }
    };
  }, [
    { libelle: "Annuler" },
    { libelle: "Valider", action: () => suite((champ.value || valeur).trim() || valeur) },
  ]);
  function valide(){ const v = (champ.value || valeur).trim() || valeur; fermeModale(); suite(v); }
}

function renommeCalque(c, apres){
  demandeNom("Renommer le calque", c.nom, nom => {
    memorise();
    c.nom = nom;
    enregistreDessins();
    construitPanneau();
    if (calqueActif === c.id) $("outilsCalque").textContent = "Dessin · " + c.nom;
    if (apres) apres();
  });
}


/* ============================================================
   Édition des formes existantes
   En mode Sélection : un clic choisit, un glisser déplace, les poignées
   redimensionnent ou déplacent les sommets. Les poignées sont recalculées
   à chaque changement de vue pour garder une taille constante à l'écran.
   ============================================================ */
let formeSel = null;
let geste = null;

function formeParId(id){
  for (const c of mesCalques()){
    const f = c.formes.find(x => x.id === id);
    if (f) return { c: c, f: f };
  }
  return null;
}

function boite(f){
  const xs = f.pts.map(p => p[0]), ys = f.pts.map(p => p[1]);
  return [Math.min.apply(null, xs), Math.min.apply(null, ys),
          Math.max.apply(null, xs), Math.max.apply(null, ys)];
}

/* Le curseur annonce ce que fera la poignée. Sur un rectangle les coins
   sont diagonaux ; sur un polygone chaque sommet se déplace librement. */
function curseurPoignee(f, i){
  if (f.t === "rect" || f.t === "image") return ["nwse-resize", "nesw-resize", "nwse-resize", "nesw-resize"][i];
  return "move";
}

function poignees(f){
  if (f.t === "rect" || f.t === "image"){
    const b = boite(f);
    return [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
  }
  if (f.t === "texte") return [f.pts[0]];
  return f.pts;
}

function dessinePoignees(){
  let g = $("poignees");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "poignees";
    svg.appendChild(g);
  }
  const cible = formeSel && formeParId(formeSel);
  if (!cible || !ADMIN || outil !== "main" || !calqueActif){ g.innerHTML = ""; return; }
  const f = cible.f;
  const r = svg.getBoundingClientRect();
  const t = Math.max(.15, view.w / (r.width || 1) * 5);   // demi-côté, en mètres
  const b = boite(f);
  const marge = t;
  g.innerHTML =
    '<rect class="cadreSel" x="' + (b[0] - marge) + '" y="' + (b[1] - marge) +
    '" width="' + (b[2] - b[0] + 2 * marge) + '" height="' + (b[3] - b[1] + 2 * marge) + '"/>' +
    poignees(f).map((p, i) =>
      '<rect class="pgn" data-i="' + i + '" style="cursor:' + curseurPoignee(f, i) + '"' +
      ' x="' + (p[0] - t) + '" y="' + (p[1] - t) +
      '" width="' + (2 * t) + '" height="' + (2 * t) + '"/>').join("");
}

function choisitForme(id){
  formeSel = id;
  // on bascule la classe plutôt que de tout retracer : inutile de réanalyser
  // les images à chaque changement de sélection
  $("couches").querySelectorAll(".dcal .forme")
    .forEach(g => g.classList.toggle("pick", g.dataset.f === id));
  dessinePoignees();
  majElement();
}

/* --- panneau de la forme choisie --- */
function majElement(){
  const z = $("elemSel");
  if (!z) return;
  const cible = formeSel && formeParId(formeSel);
  if (!cible || outil !== "main"){ z.hidden = true; return; }
  z.hidden = false;
  const f = cible.f;
  const NOMS = { rect: "Rectangle", poly: "Polygone", ligne: "Ligne",
                 texte: "Texte", image: "Image", repere: "Repère" };
  $("elemType").textContent = NOMS[f.t] || f.t;
  // un repère porte lui aussi un libellé et une taille
  const estTexte = f.t === "texte" || f.t === "repere";
  $("elemTexte").hidden = !estTexte;
  $("elemTailleBloc").hidden = !estTexte;
  if (estTexte){
    $("elemTexte").value = f.txt || "";
    $("elemTaille").value = f.taille || 2;
  }

  /* Le type d'un repère se change après coup : une porte mal typée ne se voit
     qu'en essayant un trajet, et il serait absurde de la redessiner pour
     cela. Un repère d'avant la séparation du type et du libellé n'en porte
     pas : la liste s'ouvre sur celui que son libellé laisse deviner, et le
     choix s'écrit dès qu'on y touche. */
  const cp = $("elemPicto");
  if (cp){
    const estRepere = f.t === "repere";
    cp.hidden = !estRepere;
    if (estRepere){
      if (!cp.options.length)
        cp.innerHTML = TYPES_REPERE
          .map(t => '<option value="' + esc(t.v) + '">' + esc(t.nom) + '</option>').join("");
      cp.value = pictoForme(f) || "";
    }
  }

  majLiens(f.t === "repere" ? f : null);

  /* Une image peut désigner un stand : le logo d'un exposant posé sur son
     emplacement ouvre sa fiche au clic. */
  const estImage = f.t === "image";
  const ch = $("elemStand");
  if (ch){
    ch.hidden = !estImage;
    if (estImage){
      remplitListeStands();
      const s = f.stand && parId.get(f.stand);
      ch.value = s ? etiquetteStand(s) : "";
    }
  }
}

/* ------------------------------------------------------------
   Ce qu'un passage rejoint
   ------------------------------------------------------------ */
/**
 * Les passages qu'un repère peut rejoindre.
 *
 * Ceux des autres plans, et eux seuls : relier deux escaliers du même hall ne
 * décrirait rien qu'une allée ne dise déjà, et deux portes d'un même pavillon
 * feraient un raccourci que personne ne peut emprunter. Ce qui reste est
 * exactement ce dont on a besoin — le palier à l'étage, la porte d'en face.
 *
 * Un repère en relie autant qu'il en dessert : la liste reste ouverte tant
 * qu'il demeure des passages à joindre, parce qu'un escalier de
 * rez-de-chaussée monte au premier comme au second.
 */
function candidatsLiaison(f){
  const an = annuaireLiaisons();
  const deja = an.vers.get(f.id) || new Map();
  const ici = P().id;
  const out = [];
  an.par.forEach((o, id) => {
    if (id === f.id || deja.has(id) || o.p.id === ici) return;
    out.push(o);
  });
  return out.sort((a, b) => a.p.i - b.p.i ||
    COLLATION.compare(nomRepere(a.f), nomRepere(b.f)));
}

/**
 * Écrire une liaison sur les deux repères qu'elle joint.
 *
 * Un passage n'a pas de sens : on descend l'escalier qu'on a monté. Il
 * s'écrit donc des deux côtés, et le second vit dans un autre plan — hors de
 * l'historique d'annulation, qui ne connaît que le plan ouvert. Le calcul lit
 * de toute façon l'union des deux écritures : une annulation qui ne défait
 * qu'un côté laisse le passage en place plutôt qu'un lien boiteux.
 */
function ecritDesDeuxCotes(idAutre, change){
  const cible = formeSel && formeParId(formeSel);
  const autre = annuaireLiaisons().par.get(idAutre);
  if (!cible || !autre || !typeLiaison(cible.f)) return;
  memorise();
  ecritLiens(cible.f, change(lienEcrits(cible.f), idAutre));
  ecritLiens(autre.f, change(lienEcrits(autre.f), cible.f.id));
  enregistreDessins();
  majElement();
}

/** Poser ou retirer un passage. */
function changeLien(idAutre, ajoute){
  ecritDesDeuxCotes(idAutre, (l, id) => {
    const reste = l.filter(x => x.id !== id);
    if (ajoute) reste.push({ id: id, min: null });
    return reste;
  });
}

/**
 * Fixer le temps d'un passage, ou le rendre à celui de son type.
 *
 * Il se règle par couple, et non par repère : le même escalier met une minute
 * au premier étage et davantage au second, et c'est bien deux passages
 * distincts qu'on a déclarés. Le champ vide n'est pas zéro — c'est « le temps
 * ordinaire de ce type de passage », celui qu'affiche son invite.
 */
function changeDureeLien(idAutre, txt){
  const brut = String(txt == null ? "" : txt).trim();
  const v = brut === "" ? null : Math.max(0, Math.min(120, Math.round(+brut) || 0));
  ecritDesDeuxCotes(idAutre, (l, id) => {
    const x = l.find(y => y.id === id);
    if (x) x.min = v; else l.push({ id: id, min: v });
    return l;
  });
}

/**
 * Le panneau des passages du repère choisi.
 *
 * Il n'apparaît que pour ce qui est un passage — une porte, un escalier, un
 * escalator, un ascenseur. Sur un WC il n'aurait rien à relier, et proposer
 * de le faire inviterait à des trajets qui traversent les murs.
 */
function majLiens(f){
  const z = $("elemLiens");
  if (!z) return;
  const t = f && typeLiaison(f);
  z.hidden = !t;
  if (!t) return;

  const liste = $("elemLiensListe");
  liste.innerHTML = "";
  const liens = liensDe(f);
  liens.forEach(x => {
    const d = document.createElement("div");
    d.className = "lien";
    d.innerHTML = '<span></span><input class="lienMin" type="number" min="0" max="120" ' +
      'step="1" title="Temps de passage, en minutes"><b>min</b>' +
      '<button class="btnSup" title="Retirer ce passage">&times;</button>';
    d.querySelector("span").textContent = x.o.p.libelle + " · " + nomRepere(x.o.f) +
      (x.o.visible ? "" : " (calque masqué)");
    const ch = d.querySelector(".lienMin");
    ch.value = x.min == null ? "" : x.min;
    ch.placeholder = t.min;
    ch.onchange = () => changeDureeLien(x.o.f.id, ch.value);
    d.querySelector("button").onclick = () => changeLien(x.o.f.id, false);
    liste.appendChild(d);
  });

  const sel = $("elemLienAjout");
  const dispo = candidatsLiaison(f);
  sel.innerHTML = '<option value="">' +
    (dispo.length ? "Relier à…" : "Aucun autre passage sur les autres plans") + "</option>" +
    dispo.map(o => '<option value="' + esc(o.f.id) + '">' + esc(o.p.libelle) + " · " +
      esc(nomRepere(o.f)) + " (" + esc(nomTypeRepere(pictoForme(o.f))) + ")</option>").join("");
  sel.disabled = !dispo.length;

  $("elemLienAide").textContent = liens.length
    ? "Un trajet qui arrive ici continue de l'autre côté. Le temps de chaque " +
      "passage s'ajoute à celui de la marche ; laissé vide, il vaut " +
      ecritMinutes(t.min) + "."
    : "Reliez ce " + t.nom + " à ce qu'il dessert sur les autres plans — un escalier " +
      "monte souvent à deux étages, et chacun est un passage — et les itinéraires " +
      "enchaîneront les plans au lieu de s'arrêter là.";
}

/** « G55 — SMC2 », ou le seul des deux qui existe. */
const etiquetteStand = (s) =>
  [s.code, s.nom].filter(Boolean).join(" — ") || s.id;

/** La liste de choix suit le pavillon courant : un stand d'un autre pavillon
 *  ne pourrait pas porter une image posée ici. */
function remplitListeStands(){
  const l = $("listeStands");
  if (!l) return;
  l.innerHTML = P().stands
    .filter(s => s.code || s.nom)
    .map(s => '<option value="' + esc(etiquetteStand(s)) + '">').join("");
}

/** Retrouve le stand désigné par ce qui a été saisi. */
function standSaisi(txt){
  const v = String(txt || "").trim().toLowerCase();
  if (!v) return null;
  const st = P().stands;
  return st.find(s => etiquetteStand(s).toLowerCase() === v)
      || st.find(s => String(s.code || "").toLowerCase() === v)
      || st.find(s => String(s.nom || "").toLowerCase() === v)
      || null;
}

function appliqueLiaison(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "image") return;
  const ch = $("elemStand");
  const s = standSaisi(ch.value);
  memorise();
  if (s){ cible.f.stand = s.id; ch.value = etiquetteStand(s); }
  else { delete cible.f.stand; ch.value = ""; }
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

function appliqueTexte(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || (cible.f.t !== "texte" && cible.f.t !== "repere")) return;
  memorise();
  cible.f.txt = $("elemTexte").value;
  cible.f.taille = Math.max(.3, Math.min(30, +$("elemTaille").value || 2));
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

/** Changer ce qu'un repère est : son pictogramme suit, et avec lui ce qu'il
 *  vaut pour l'itinéraire — une porte, un escalier à contourner en fauteuil. */
function appliquePicto(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "repere") return;
  memorise();
  cible.f.picto = $("elemPicto").value;
  /* Un repère qui cesse d'être un passage garde ses liaisons écrites : elles
     ne désignent plus rien, et l'annuaire les ignore déjà — mais les retirer
     ici punirait une fausse manœuvre d'une perte qu'on ne peut pas défaire. */
  enregistreDessins();
  /* Le pavage des allées tient compte des escaliers et des escalators : en
     désigner un, ou cesser de le faire, change les trajets accessibles. */
  oublieGrilles();
  /* Devenir un escalier, ou cesser de l'être, ouvre ou ferme le panneau des
     passages : le panneau se relit donc, comme après tout changement de ce
     qu'un repère est. */
  dessineDessins(); dessinePoignees(); majElement();
}

function supprimeForme(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible) return;
  memorise();
  cible.c.formes = cible.c.formes.filter(x => x.id !== formeSel);
  formeSel = null;
  enregistreDessins(); dessineDessins(); dessinePoignees(); majElement();
}

/* --- gestes d'édition ; renvoient true si l'événement est consommé --- */
function editionPointerDown(e){
  if (!ADMIN || outil !== "main") return false;
  const p = versPlan(e.clientX, e.clientY);

  const pgn = e.target.closest(".pgn");
  if (pgn && formeSel){
    const cible = formeParId(formeSel);
    if (cible){
      memorise();
      geste = { type: "poignee", i: +pgn.dataset.i, depart: p,
                pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = curseurPoignee(cible.f, geste.i);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      return true;
    }
  }

  const g = e.target.closest(".dcal .forme");
  if (g){
    const id = g.dataset.f;
    const cible = formeParId(id);
    const sienne = cible && cible.c.id === calqueActif;

    /* Une image liée à un stand ouvre sa fiche, comme pour un visiteur — sauf
       sur le calque qu'on est en train de modifier, où le clic sert à la
       déplacer. Le calque actif est donc l'atelier, les autres la vitrine. */
    if (!sienne && g.dataset.id) return false;

    // cliquer une forme d'un autre calque l'ouvre : c'est le geste qu'on
    // attend, plutôt que de devoir d'abord le désigner dans le panneau
    if (!sienne) activeCalque(cible.c.id);
    if (id !== formeSel) choisitForme(id);
    if (cible){
      memorise();
      geste = { type: "deplace", depart: p, pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = "move";
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    }
    return true;
  }

  if (formeSel){ choisitForme(null); return true; }
  return false;    // rien sous le pointeur : on laisse le déplacement de la vue
}

function editionPointerMove(e){
  if (!geste) return false;
  const p = versPlan(e.clientX, e.clientY);
  const dx = p[0] - geste.depart[0], dy = p[1] - geste.depart[1];
  const f = geste.f;

  if (geste.type === "deplace"){
    f.pts = geste.pts.map(q => [+(q[0] + dx).toFixed(2), +(q[1] + dy).toFixed(2)]);
  } else if (f.t === "rect" || f.t === "image"){
    // la poignée opposée reste fixe ; l'image garde ses proportions
    const b = [Math.min(geste.pts[0][0], geste.pts[1][0]), Math.min(geste.pts[0][1], geste.pts[1][1]),
               Math.max(geste.pts[0][0], geste.pts[1][0]), Math.max(geste.pts[0][1], geste.pts[1][1])];
    const coins = [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
    const fixe = coins[(geste.i + 2) % 4];
    let mx = coins[geste.i][0] + dx, my = coins[geste.i][1] + dy;
    if (f.t === "image" && f.pts.length === 2){
      const ratio = (b[2] - b[0]) / Math.max(.01, b[3] - b[1]);
      const l = Math.abs(mx - fixe[0]);
      my = fixe[1] + Math.sign(my - fixe[1] || 1) * (l / ratio);
    }
    f.pts = [[+Math.min(fixe[0], mx).toFixed(2), +Math.min(fixe[1], my).toFixed(2)],
             [+Math.max(fixe[0], mx).toFixed(2), +Math.max(fixe[1], my).toFixed(2)]];
  } else {
    const q = geste.pts.map(x => x.slice());
    q[geste.i] = [+(q[geste.i][0] + dx).toFixed(2), +(q[geste.i][1] + dy).toFixed(2)];
    f.pts = q;
  }
  dessineDessins(); dessinePoignees();
  return true;
}

function editionPointerUp(e){
  if (!geste) return false;
  geste = null;
  svg.style.cursor = "";
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  enregistreDessins();
  return true;
}

/* ============================================================
   Pile des calques
   Habillage Klipso, zones, stands, textes et calques de dessin vivent dans
   un seul empilement : n'importe lequel peut se glisser entre deux autres.
   L'ordre de la liste est l'ordre de tracé — le premier est derrière.
   ============================================================ */
const clePile = () => "_pile:" + P().id;

function entrees(){
  const e = [];
  P().fond.forEach(f => e.push({ k: "fond:" + f.cle, t: "fond", nom: f.nom, ref: f }));
  e.push({ k: "data:zones",  t: "data", nom: "Zones organisateur", ref: "zones" });
  e.push({ k: "data:stands", t: "data", nom: "Stands",             ref: "stands" });
  e.push({ k: "data:labels", t: "data", nom: "Textes",             ref: "labels" });
  mesCalques().forEach(c => e.push({ k: "dessin:" + c.id, t: "dessin", nom: c.nom, ref: c }));
  return e;
}

/* ordre effectif : celui qui a été choisi, complété par les nouveautés */
function pile(){
  const enregistre = CONF[clePile()];
  const e = entrees();
  const defaut = e.map(x => x.k);
  if (!Array.isArray(enregistre)) return e;
  const rang = x => {
    const i = enregistre.indexOf(x.k);
    return i >= 0 ? i : 10000 + defaut.indexOf(x.k);   // les nouvelles couches à la fin
  };
  return e.slice().sort((a, b) => rang(a) - rang(b));
}

function groupe(k){
  const c = $("couches");
  if (k.indexOf("fond:") === 0)   return c.querySelector('.cal[data-cle="' + CSS.escape(k.slice(5)) + '"]');
  if (k.indexOf("dessin:") === 0) return c.querySelector('.dcal[data-dcal="' + CSS.escape(k.slice(7)) + '"]');
  return $(k.slice(5));
}

/* déplacer les nœuds plutôt que tout reconstruire : réordonner est instantané */
function ordonneDom(){
  const c = $("couches");
  pile().forEach(x => { const g = groupe(x.k); if (g) c.appendChild(g); });
}

function deplaceCouche(k, dir){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k), j = i + dir;
  if (i < 0 || j < 0 || j >= liste.length) return;
  liste[i] = liste[j]; liste[j] = k;
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom();
  construitPanneau();
}

/* ============================================================
   Panneau : une seule liste, tous types confondus
   ============================================================ */
function construitPanneau(){
  const hote = $("pile");
  hote.innerHTML = "";
  const reorg = document.createElement("button");
  reorg.className = "reorg";
  reorg.textContent = "⇅ Réorganiser les calques";
  reorg.onclick = ouvreOrdre;
  hote.appendChild(reorg);
  const liste = pile().slice().reverse();   // premier plan en tête

  liste.forEach((x, i) => {
    const d = document.createElement("div");
    d.className = "calq" + (x.t === "dessin" ? " perso" : "") +
                  (x.t === "dessin" && x.ref.id === calqueActif ? " actif" : "");
    if (x.t === "dessin") d.dataset.dcal = x.ref.id;

    const c = x.t === "dessin" ? x.ref : conf(x.t === "fond" ? x.k.slice(5) : x.k);
