<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
window.__plan = fetch("/api/plan?slug=" + encodeURIComponent(
  new URLSearchParams(location.search).get("plan") || "smcl-2026"));
</script>
<title>Plan du salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="config.js"></script>

<style>
:root{
  --ground:#E9EAE4; --surface:#FBFBF8; --surface-2:#F1F2EC;
  --line:#D2D5CB; --line-strong:#B4B9AC;
  --ink:#15181A; --ink-2:#4A4F52; --ink-3:#7C8285;
  --accent:#2F49D1; --accent-soft:#DCE1FA; --accent-ink:#FFFFFF;
  --zone:#C98A06; --zone-soft:#F7EAC6;
  --stand:#FFFFFF; --stand-line:#9AA095; --libre:#E3E5DD;
  /* Un secteur n'a qu'une teinte : la saturation et la clarté viennent du
     thème, sans quoi le libellé du stand — écrit à l'encre du texte —
     deviendrait illisible sur l'un des deux. */
  --sect-s:58%; --sect-l:87%; --sect-dot-l:40%;
  --plan-line:#A8AEA1; --plan-ink:#8A9082;
  --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px -12px rgba(20,24,26,.18);
  --radius:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427;
    --line:#2A3034; --line-strong:#3B4348;
    --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
    --accent:#7A8CFF; --accent-soft:#232C55; --accent-ink:#0E1113;
    --zone:#F0B429; --zone-soft:#3A2F12;
    --stand:#252C30; --stand-line:#4C555A; --libre:#1C2124;
    --sect-s:32%; --sect-l:26%; --sect-dot-l:64%;
    --plan-line:#3E474C; --plan-ink:#5A6469;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427;
  --line:#2A3034; --line-strong:#3B4348;
  --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
  --accent:#7A8CFF; --accent-soft:#232C55; --accent-ink:#0E1113;
  --zone:#F0B429; --zone-soft:#3A2F12;
  --stand:#252C30; --stand-line:#4C555A; --libre:#1C2124;
  --sect-s:32%; --sect-l:26%; --sect-dot-l:64%;
  --plan-line:#3E474C; --plan-ink:#5A6469;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
input,textarea,.detail-bd{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:none;border:none}
/* « hidden » ne masque rien tant qu'une règle d'auteur pose un display : la
   nôtre l'emporte sur la feuille du navigateur, et l'élément reste peint. La
   pastille « Nouvel exposant » paraissait ainsi sur toutes les fiches, la
   condition qui la pilote n'ayant jamais eu le dernier mot. On tranche ici
   plutôt qu'un sélecteur à la fois, comme il avait fallu le faire pour les
   onglets. */
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* `100vh` vaut, sur un navigateur mobile, la hauteur barre d'outils masquée :
   le bas de la page tombe sous l'écran, et tout ce qui s'y ancre — cartouche
   des points d'intérêt, boutons de zoom, échelle — descend avec lui. Le tiroir,
   lui, est `position:fixed` et se cale sur le bas réellement visible. Les deux
   se manquaient de la hauteur exacte de la barre du navigateur, si bien que le
   cartouche recouvrait la recherche et que le bouton « ajuster » passait
   dessous. `100dvh` suit cette barre et remet tout le monde d'accord. */
.app{user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:330px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh;min-height:560px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;height:60px;
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand h1.attente{color:var(--ink-3)}
.brand .sub{color:var(--ink-3);font-size:12px;white-space:nowrap}
.stats{display:flex;gap:18px;margin-left:auto;font-size:12px;color:var(--ink-3)}
@media (max-width:1150px){.stats{display:none}}
.stats b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.2}
.halls{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--radius)}
.halls button{padding:5px 13px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.halls button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.halls button .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-left:6px}
.row .hall{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  padding:1px 5px;border-radius:3px;background:var(--surface-2);color:var(--ink-3);margin-left:6px;vertical-align:1px}
.tools{display:flex;gap:6px}
.iconbtn{position:relative;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-2);background:var(--surface)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.iconbtn svg{width:15px;height:15px}

.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* La poignée du tiroir : sur écran étroit la liste se hisse par-dessus le
   plan, et cette barre est la prise qu'on saisit. Sur grand écran la liste a
   sa colonne, il n'y a pas de tiroir, donc pas de prise. */
.poignee{display:none}
.search{padding:14px 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
/* La recherche prend la place, le bouton des critères ce qu'il faut : sur un
   téléphone les deux tiennent sur la même ligne, et le tiroir replié ne perd
   pas une ligne de plus. */
.search-field{position:relative;flex:1;min-width:0}
.crit-btn{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;width:34px;height:34px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-2);color:var(--ink-2)}
.crit-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.crit-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--ink)}
.crit-btn svg{width:15px;height:15px}
.crit-btn .compteur{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;
  padding:0 3px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:10px;font-weight:600;line-height:15px;text-align:center}
/* Les critères retenus. Même bande que les secteurs — une ligne qui défile à
   l'étroit, plusieurs qui se replient au large — mais elle ne paraît que
   lorsqu'il y a quelque chose à montrer. */
.actifs{display:flex;flex-wrap:wrap;gap:6px;padding:9px 16px;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.actifs::-webkit-scrollbar{display:none}
.actifs .actif{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  max-width:100%;padding:4px 8px 4px 10px;font-size:12px;color:var(--ink);
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px}
.actifs .actif .k{color:var(--ink-3);font-size:11px;flex:0 0 auto}
.actifs .actif .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actifs .actif .v:empty{display:none}
.actifs .actif .x{color:var(--ink-3);font-size:13px;line-height:1;flex:0 0 auto}
.actifs .actif:hover .x{color:var(--ink)}
.actifs .vider{background:var(--surface-2);border-color:transparent;color:var(--ink-3)}
.actifs .vider:hover{border-color:var(--line-strong);color:var(--ink)}
.search-field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.search input{width:100%;padding:9px 10px 9px 32px;background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--radius)}
.search input:focus{border-color:var(--accent);background:var(--surface);outline:none}
/* Les secteurs : une bande qui sert de légende et de filtre. Dans sa colonne
   elle se replie sur plusieurs lignes — une légende ne se lit que d'un coup
   d'œil, et un secteur caché hors du cadre ne se devine pas. */
.secteurs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.secteurs::-webkit-scrollbar{display:none}
.secteurs .chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:5px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap;
  background:var(--surface-2);border:1px solid transparent;border-radius:999px}
.secteurs .chip:hover{border-color:var(--line-strong)}
.secteurs .chip[aria-pressed="true"]{background:var(--accent-soft);
  border-color:var(--accent);color:var(--ink)}
/* La pastille montre la couleur du stand, la choisie comme l'automatique. Un
   liseré la borde : une couleur pâle, choisie pour un aplat, disparaîtrait
   sinon sur le fond clair du tiroir. */
.secteurs .chip i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  border:1px solid var(--line-strong);
  background:var(--sect-c,hsl(var(--sect-h) 60% var(--sect-dot-l)))}
/* Sans coloriage du plan, la pastille promettrait une couleur qu'on n'y
   trouve pas : le filtre reste, le repère de couleur s'efface. */
.sans-secteurs .secteurs .chip i{display:none}
.count{padding:9px 16px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;width:100%;text-align:left;
  padding:9px 16px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row .code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;padding:3px 0;
  text-align:center;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-2)}
.row[aria-current="true"] .code{border-color:var(--accent);color:var(--accent)}
.row.l .code{opacity:.5}
/* Le second bloc d'une ligne doit pouvoir rétrécir sous la largeur de son
   texte : sans cela il s'étire à la taille du nom, et l'ellipse annoncée plus
   bas ne se déclenche jamais — le nom se coupait net au bord de l'écran. */
.row>span{min-width:0}
/* `overflow` ne s'applique pas à une boîte en ligne : tant que ces deux-là
   étaient de simples `span`, l'ellipse annoncée ici ne se déclenchait jamais
   et les noms longs se coupaient net. Les passer en bloc la rend effective —
   le retour à la ligne qui les séparait devient alors inutile. */
.row .nm{display:block;font-weight:500;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px}

.stage{position:relative;overflow:hidden;background:var(--ground)}
/* Le plan lui-même, et lui seul : « .stage svg » atteignait aussi les <svg>
   imbriqués des pictogrammes de repère, qu'il étirait à la taille de la scène
   — la pastille se voyait, son glyphe partait hors du cadre, et le repère
   n'était plus qu'un carré de couleur. Un <svg> imbriqué tient ses dimensions
   de ses attributs, qu'aucune valeur CSS ne sait rendre après coup : il faut
   donc que la règle ne le touche pas. */
.stage > svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage svg.dragging{cursor:grabbing}

/* Chaque sous-calque garde sa teinte Klipso, portée par `color` ; les tracés
   noirs d'origine héritent de la couleur du thème et suivent clair / sombre. */
#couches .cal{color:var(--plan-line)}
#couches .cal path,#couches .cal polyline,#couches .cal circle{stroke-width:.7;vector-effect:non-scaling-stroke}
/* Le groupe d'un calque porte stroke: currentColor pour ses tracés. Un texte
   en hérite aussi, avec l'épaisseur par défaut d'une unité — soit un mètre ici,
   trois fois la hauteur des glyphes : les mots devenaient des taches. Un texte
   se peint, il ne se contourne pas. */
#couches .cal text{fill:currentColor;stroke:none;font-family:"Instrument Sans",sans-serif}

/* Une zone se peignait à 22 % de la couleur choisie, quand un stand la prend
   telle quelle : le nuancier annonçait un ocre franc et le plan rendait un
   beige. La moitié rapproche les deux sans écraser le nom posé par-dessus, qui
   se lit sur le fond de la zone. */
/* Une image liée à un stand s'ouvre au clic comme le stand lui-même. */
/* Les calques de dessin laissent passer le clic vers le plan. Une image liée à
   un stand est l'exception : elle doit s'ouvrir comme lui, y compris sur la
   page publique où le mode édition n'existe pas. */
.dcal .forme.lie{cursor:pointer;pointer-events:auto}
.dcal .forme.lie image{pointer-events:all}
.zone path{fill:var(--c-zone,var(--zone));fill-opacity:.5;
  stroke:var(--c-zone,var(--zone));stroke-width:1.2;
  vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
.stand path{fill:var(--c-stand,var(--stand));stroke:var(--stand-line);
  stroke-width:1;vector-effect:non-scaling-stroke}
/* La teinte du secteur est posée sur le groupe par la page. La règle vient
   avant le survol et la sélection, à spécificité égale, pour leur laisser la
   main : un stand qu'on désigne doit se voir plus que son secteur. */
.stand[data-sect] path{fill:var(--sect-c,hsl(var(--sect-h) var(--sect-s) var(--sect-l)))}
/* Les deux liserés que le plan pose sur un stand — celui de la sélection,
   celui du parcours — se tracent dans « #marques », un calque à part posé
   au-dessus des couches, et non sur le stand lui-même : une cloison mitoyenne
   appartient aux deux stands qu'elle sépare, et le second tracé y effaçait le
   liseré du premier. Le calque ne reçoit aucun clic — c'est le stand qu'on
   désigne, pas sa marque.

   Le parcours reste le plus discret des deux : ce qu'on a retenu doit se
   retrouver sur le plan sans le relire, sans pour autant se confondre avec ce
   qu'on vient de désigner. Une zone y entre par ses conférences. */
#marques{pointer-events:none}
#marques path{fill:none;stroke-dasharray:none;vector-effect:non-scaling-stroke}
#marques .parc{stroke:var(--c-parc,var(--accent));stroke-width:2}
#marques .sel{stroke:var(--c-sel-trait,var(--accent));stroke-width:3}
/* le trait discontinu est ce qui distingue une zone d'un stand : sa sélection
   le garde */
#marques .sel.zn{stroke-dasharray:5 4}
html.sans-parcours #marques .parc{display:none}
.stand:hover path,.zone:hover path{fill:var(--accent-soft)}
/* La sélection ne tient pas dans une seule couleur : un aplat, et le liseré
   qui le borde. L'exploitant n'en choisit qu'une — l'aplat, celle qu'on voit —
   et « appliqueCouleursData » en tire le liseré, assez écarté pour se lire
   par-dessus. Sans réglage, l'accent d'origine.

   Seul l'aplat se pose ici : le liseré monte dans « #marques », hors d'atteinte
   des stands voisins. */
.stand.sel path,.zone.sel path{fill:var(--c-sel,var(--accent-soft))}
.stand,.zone{cursor:pointer}
.dim{opacity:.22}

/* le contour de focus par défaut dessine un gros rectangle noir autour du
   groupe SVG : on le remplace par un renforcement du tracé du stand */
.stage > svg{-webkit-tap-highlight-color:transparent}
.stand:focus,.zone:focus{outline:none}
.stand:focus-visible,.zone:focus-visible{outline:none}
.stand:focus-visible path,.zone:focus-visible path{stroke:var(--accent);stroke-width:3}

#labels text{pointer-events:none;text-anchor:middle;fill:var(--c-lab-stand,var(--ink-2));
  font-family:"IBM Plex Mono",monospace;font-weight:500}
#labels text.nm{font-family:"Instrument Sans",sans-serif;font-weight:600;fill:var(--c-lab-stand,var(--ink))}
#labels text.zn{font-family:"Instrument Sans",sans-serif;font-weight:600;fill:var(--c-lab-zone,var(--zone))}
/* La couleur d'un élément sélectionné se règle depuis la pile ; le numéro du
   stand, écrit par-dessus l'aplat, suit le liseré qui en est tiré. */
#labels text.sel{fill:var(--c-sel-trait,var(--accent));font-weight:700}
/* Le compte des sociétés hébergées, à côté du numéro. Il reprend l'accent de
   la page, comme la pastille des nouveaux venus sur la fiche : c'est une
   distinction, pas une alerte, et le plan a déjà le langage des zones. */
#labels .coexPast{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;
  vector-effect:non-scaling-stroke;pointer-events:none}
/* Un stand sélectionné se remplit de cette même teinte douce : la pastille y
   fondait dans le fond. Elle prend alors celui de la page, et son trait la
   tient. Ce trait et le nombre suivent la sélection : sur un salon qui a
   choisi sa couleur, l'accent d'origine détonnerait au milieu du stand. */
#labels .coexPast.sel{fill:var(--surface);stroke:var(--c-sel-trait,var(--accent))}
#labels text.coexN{fill:var(--accent);font-weight:700}
#labels text.coexN.sel{fill:var(--c-sel-trait,var(--accent))}
/* Le réglage qui masque les libellés de stand emporte la pastille : elle en
   fait partie, et la laisser flotter seule ne se comprendrait pas. */
.sans-lab-stand #labels text:not(.zn),.sans-lab-stand #labels .coexPast{display:none}
.sans-lab-zone #labels text.zn{display:none}

/* --- calques de dessin --- */
.dcal{pointer-events:none}
.dcal path{fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;stroke-linecap:round}
.dcal.plein path{fill:currentColor;fill-opacity:.25}
.dcal text{fill:currentColor;font-family:"Instrument Sans",sans-serif;font-weight:600;text-anchor:middle}
.dcal.editable{pointer-events:auto}
/* En mode sélection, tous les calques de dessin répondent, pas seulement celui
   qu'on modifie : cliquer une forme d'un autre calque l'active. Sans cela, une
   image posée sur un calque inactif restait sourde et rien ne le disait. */
html.mode-edition .dcal{pointer-events:auto}
html.mode-edition .dcal path,html.mode-edition .dcal image,
html.mode-edition .dcal text,html.mode-edition .dcal rect{pointer-events:all}
/* une forme en contour seul doit rester attrapable par son intérieur */
.dcal.editable path,.dcal.editable image,.dcal.editable text{pointer-events:all}
.dcal .forme{cursor:pointer}
.dcal.editable .forme.pick{cursor:move}
@keyframes halo{0%{opacity:.15}35%{opacity:1}100%{opacity:1}}
/* Une forme déclarée infranchissable pour les PMR ne change rien pour le
   visiteur — c'est le trajet qui en tient compte, pas le dessin. L'exploitant,
   lui, doit la reconnaître pendant qu'il édite, sans quoi il la coche deux
   fois ou l'oublie. */
/* Un calque qui porte un rôle ne change rien pour le visiteur — c'est le
   trajet qui en tient compte, pas le dessin. L'exploitant, lui, doit le
   reconnaître pendant qu'il édite, sans quoi il le règle deux fois. */
html.mode-edition .dcal.role path{stroke-dasharray:5 3}
html.mode-edition .dcal.circulation path{stroke-dasharray:none;fill:currentColor;
  fill-opacity:.12}
.dcal .forme.neuve{animation:halo .5s ease-out 2}
.dcal .forme.neuve path,.dcal .forme.neuve image,.dcal .forme.neuve text{
  outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dcal .forme.neuve{animation:none}}

#apercu{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-dasharray:6 4;pointer-events:none}

.outils{position:absolute;top:12px;left:12px;z-index:6;display:none;flex-direction:column;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:10px 12px;width:212px}
.outils.open{display:flex}
.outilsTete{display:flex;align-items:center;justify-content:space-between;gap:8px}
.outilsActs{display:flex;align-items:center;gap:2px}
.outilsTete button{color:var(--ink-3);font-size:17px;line-height:1;padding:0 3px}
#renommeOutils{font-size:12px}
.outilsTete button:hover{color:var(--ink)}
.outilsBtns{display:flex;gap:4px}
.outilsBtns button{flex:1;height:28px;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-2);font-size:13px;display:grid;place-items:center}
.outilsBtns button:hover{border-color:var(--line-strong);color:var(--ink)}
.outilsBtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.outils input{width:100%;padding:6px 8px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.outils input:focus{border-color:var(--accent);outline:none}
.outils .choix{display:none;width:100%;padding:7px;border:1px solid var(--accent);
  border-radius:var(--radius);font-size:12.5px;color:var(--accent);background:var(--surface)}
.outils .choix:hover{background:var(--accent);color:#fff}
.outils.mode-image .choix{display:block}
.outils #texteADessiner{display:none}
.outils.mode-texte #texteADessiner{display:block}
#vignette{display:none;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.outils.mode-image #vignette[data-prete]{display:flex}
#vignette img{width:40px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
.dcal image{pointer-events:none}
.dcal.editable image{pointer-events:auto}
.elem{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;
  border-top:1px solid var(--line)}
.elem[hidden]{display:none}
/* Un repère matérialise ce que le plan ne nomme pas : sanitaires, entrées,
   accueil. Une pastille dans la couleur du calque, un libellé court dedans. */
#repereType,#repereTexte{display:none}
.outils.mode-repere #repereType,.outils.mode-repere #repereTexte{display:block}
#repereType,#repereTexte,#elemPicto{width:100%;padding:6px 8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px}
#elemPicto[hidden]{display:none}
.dcal .repere > rect{fill:currentColor;stroke:none}
.dcal .repere .glyphe path{fill:var(--surface);stroke:none}
.dcal .repere text{fill:var(--surface);font-weight:700;text-anchor:middle}
/* Un repère se lit de loin par son pictogramme, et s'ouvre au clic pour dire
   son nom : sa pastille répond donc au pointeur, sur un calque qui, lui,
   n'y répond pas. */
.dcal .repere{pointer-events:auto;cursor:pointer}
.dcal .repere *{pointer-events:all}
/* Le repère ouvert se marque comme le fait le cartouche : un liseré clair
   autour de la pastille. Le contour du navigateur, lui, est retiré — il
   dessine un carré noir autour d'un groupe SVG, à côté de la forme qu'il
   entoure — et remplacé au clavier par le même liseré, en encre. */
.dcal .repere.sel > rect{stroke:var(--surface);stroke-width:.6;paint-order:stroke}
.dcal .repere:focus{outline:none}
.dcal .repere:focus-visible > rect{stroke:var(--ink);stroke-width:.5;paint-order:stroke}
/* Ce qu'un passage rejoint sur un autre plan : un escalier son palier à
   l'étage, une porte celle du hall d'en face. La liste se lit d'un coup
   d'œil, chaque ligne se retire d'une croix. */
.elemLiens{display:flex;flex-direction:column;gap:5px}
.elemLiens[hidden]{display:none}
.elemLiens select{width:100%;padding:6px 8px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.elemLiens select:focus{border-color:var(--accent);outline:none}
.elemLiens i{font-style:normal;font-size:11px;line-height:1.4;color:var(--ink-3)}
.elemLiens i:empty{display:none}
.lienListe{display:flex;flex-direction:column;gap:4px}
.lienListe:empty{display:none}
.lienListe .lien{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  padding:4px 4px 4px 7px;background:var(--surface-2);border-radius:var(--radius);
  border-left:2px solid var(--accent)}
.lienListe .lien span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Le temps du passage : un champ étroit, son unité collée, et l'invite qui
   montre le temps ordinaire du type — vide ne veut pas dire zéro. */
.elem .lienListe .lien input{width:44px;flex:none;padding:2px 4px;font-size:11.5px;
  text-align:right;background:var(--surface);border:1px solid var(--line)}
.lienListe .lien b{font-weight:400;font-size:10.5px;color:var(--ink-3)}
.elemTete{display:flex;align-items:center;justify-content:space-between}
.elemChamp{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
.elemChamp input{flex:1;min-width:0}
.elemChamp[hidden]{display:none}
/* Le rôle du calque dans les itinéraires : on le règle là où l'on dessine,
   puisque c'est en dessinant qu'on le décide. */
.outilsRole{display:flex;flex-direction:column;gap:3px}
.outilsRole select{width:100%;padding:6px 8px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.outilsRole select:focus{border-color:var(--accent);outline:none}
.outilsRole i{font-style:normal;font-size:11px;line-height:1.4;color:var(--ink-3)}
.outilsRole i:empty{display:none}
.outilsVoir{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);
  cursor:pointer}
.outils .outilsVoir input{width:14px;height:14px;flex:none;padding:0;accent-color:var(--accent)}
#nappe{pointer-events:none;image-rendering:pixelated;opacity:.55}
.calq .rle{font-style:normal;font-size:10px;padding:1px 5px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.btnSup{color:var(--ink-3);font-size:13px;line-height:1;padding:1px 3px}
.btnSup:hover{color:#C2372B}
.elem input{width:100%;padding:6px 8px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.elem input:focus{border-color:var(--accent);outline:none}

#poignees{pointer-events:none}
#poignees .cadreSel{fill:none;stroke:var(--accent);stroke-width:1;
  stroke-dasharray:5 4;vector-effect:non-scaling-stroke;opacity:.8}
#poignees .pgn{fill:var(--surface);stroke:var(--accent);stroke-width:1.6;
  vector-effect:non-scaling-stroke;pointer-events:auto}
#poignees .pgn:hover{fill:var(--accent-soft)}
.outilsPied{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-3)}
.calq .mv{width:15px;height:18px;border:none;color:var(--ink-3);font-size:11px;line-height:1;padding:0}
.calq .mv:hover{color:var(--ink)}
.calq .mv[disabled]{opacity:.25;cursor:default}
.calq .ren{width:18px;height:18px;border:none;color:var(--ink-3);font-size:11px;line-height:1}
.calq .ren:hover{color:var(--accent)}
.calq .ren[aria-pressed="true"]{color:var(--accent)}
.mcorps input.nomcalque{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-2);color:var(--ink)}
.mcorps input.nomcalque:focus{border-color:var(--accent);outline:none}
.calq .sup{width:18px;height:18px;border:none;color:var(--ink-3);font-size:14px;line-height:1}
.calq .sup:hover{color:#C2372B}
.calq.perso label span{font-weight:600}
.calq .renom{width:100%;font-size:12.5px;padding:2px 5px;border:1px solid var(--accent);
  border-radius:3px;background:var(--surface-2);color:var(--ink)}
.calq.actif{background:var(--accent-soft);border-radius:3px;margin:0 -4px;padding:2px 4px}
.panel .ajout{width:100%;margin-top:6px;padding:6px;border:1px dashed var(--line-strong);
  border-radius:var(--radius);font-size:12px;color:var(--ink-2)}
.panel .ajout:hover{border-color:var(--accent);color:var(--accent)}

/* Ces deux-là déclarent « display:flex », qui l'emporte sur la règle du
   navigateur masquant un élément porteur de « hidden » : sans ces lignes,
   l'attribut ne masque rien. Le piège s'est déjà refermé une fois sur la barre
   de zoom, et il vaut pour tout ce qui se cache par attribut dans cette page. */
.zoombar[hidden],.scalebar[hidden]{display:none}
.zoombar{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.zoombar button{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.zoombar button+button{border-top:1px solid var(--line)}
.zoombar button:hover{color:var(--ink);background:var(--surface-2)}
.zoombar svg{width:14px;height:14px}
/* Cartouche des points d'intérêt, au bas du plan. Il ne paraît que s'il y a
   des repères, et se retire de l'échelle pour ne pas la masquer. */
/* Centré par des marges automatiques, et non par « left:50% » : un élément
   absolu ancré au milieu ne peut s'étendre que vers la droite, si bien que sa
   largeur était plafonnée à la moitié de l'écran. Le cartouche passait à la
   ligne pour deux pixels manquants, et le « max-width » annoncé plus bas ne
   servait à rien. Ancré des deux côtés, il dispose enfin de toute la largeur. */
.poi{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;bottom:16px;z-index:12;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(760px,72%);
  padding:7px 9px;background:var(--surface);border:1px solid var(--line);
  /* le rayon commun vaut 3 px : des angles presque vifs autour de pastilles
     entièrement rondes, et posés sur un tiroir aux coins adoucis */
  border-radius:12px;box-shadow:var(--shadow)}
.poi[hidden]{display:none}
.poiBtn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  font-size:12px;cursor:pointer}
.poiBtn:hover{border-color:var(--line-strong);color:var(--ink)}
.poiBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.poiBtn i{font-style:normal;font-size:10.5px;opacity:.7}
/* « .stage svg » impose 100 % à tout SVG du plan : il faut une règle plus
   précise pour que le pictogramme du cartouche garde sa taille. */
.poi .poiPicto{width:17px;height:17px;flex:none}
.poi .poiPicto path{fill:currentColor}
/* Mise en avant : tout le plan s'efface sauf les repères retenus, qui gagnent
   un liseré et un halo battant. Faire pulser le repère lui-même le rendait
   invisible une fois sur deux — c'est l'inverse de l'effet recherché. */
html.poi-actif #stands,html.poi-actif #zones,html.poi-actif #labels,
html.poi-actif #couches .cal,
html.poi-actif .dcal .forme:not(.phare){opacity:.55}
.dcal .repere.phare > rect{stroke:var(--surface);stroke-width:.5;paint-order:stroke}
.dcal .repere.phare{animation:pulsePoi 1.4s ease-in-out infinite}
@keyframes pulsePoi{
  0%,100%{filter:drop-shadow(0 0 .3px var(--accent))}
  50%{filter:drop-shadow(0 0 2.4px var(--accent))}
}
@media (prefers-reduced-motion:reduce){
  .dcal .repere.phare{animation:none;filter:drop-shadow(0 0 1.6px var(--accent))}
}
@media (max-width:760px){.poi{max-width:88%;bottom:12px}}

.scalebar{position:absolute;left:60px;bottom:18px;font-size:11px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;gap:7px}
.scalebar i{display:block;height:6px;border:1px solid var(--ink-3);border-top:none}

.detail{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--surface);
  border-left:1px solid var(--line);transform:translateX(100%);display:flex;flex-direction:column;z-index:4;
  box-shadow:-16px 0 40px -26px rgba(10,14,18,.55);will-change:transform,opacity}
.detail.open{transform:none}
.detail-hd{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative}
/* Un crayon accolé au nom : c'est la marque du renommage partout dans la
   page — sur un calque de dessin comme sur une zone. */
.crayon{border:none;background:none;color:var(--ink-3);font-size:14px;line-height:1;
  padding:2px 4px;border-radius:var(--radius);vertical-align:middle;cursor:pointer}
.crayon:hover{color:var(--accent);background:var(--surface-2)}
.detail-hd .crayon{margin-left:6px}
.detail-hd .close{position:absolute;top:14px;right:14px;color:var(--ink-3);font-size:18px;line-height:1;padding:4px}
.detail-hd h2{font-family:"Archivo",sans-serif;font-size:19px;letter-spacing:-.02em;margin:8px 0 6px;
  text-wrap:balance;padding-right:26px}
.badge{display:inline-flex;gap:6px;font-size:11px;padding:3px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
/* Un nouvel exposant se signale à côté de son emplacement. La pastille reprend
   l'accent de la page plutôt qu'une couleur à elle : c'est une distinction, pas
   une alerte, et une teinte de plus ferait un troisième langage sur le plan
   après celui des zones. Le texte est de la fonte du corps — un numéro de stand
   se lit en mono, une mention se lit comme une phrase. */
.badge.neuf{background:var(--accent-soft);color:var(--accent);font-family:inherit;
  font-weight:600;margin-left:6px}
/* Le retour vers la liste des sociétés d'un stand partagé. Une pastille et non
   un bouton d'action : elle dit d'abord un fait — on en regarde une parmi
   plusieurs — et le clic n'est que la suite logique. */
.badge.part{font-family:inherit;margin-left:6px;cursor:pointer;
  border:1px solid var(--line-strong)}
.badge.part:hover{color:var(--ink);border-color:var(--ink-3)}
/* Les sociétés d'un stand partagé, dans la fenêtre de choix. Un rang par
   société — jusqu'à une douzaine sur les plus peuplés — et rien d'autre que
   leur nom : celle qui loue le stand vient en tête, ce qui la dit assez. */
.expos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.expos button{display:flex;width:100%;align-items:baseline;gap:9px;text-align:left;
  padding:9px 11px;border:1px solid transparent;border-radius:5px;
  background:var(--surface-2);font-size:13.5px;color:var(--ink)}
.expos button:hover{border-color:var(--line-strong)}
.expos .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-bd{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:15px}
/* Les deux moitiés de la fiche — ce qu'est l'exposant, ce qu'il anime — ne
   sont des blocs que là où elles se rangent côte à côte. Partout ailleurs
   elles s'effacent, et leurs champs se suivent comme s'ils étaient seuls. */
.cInfos,.cConf{display:contents}
/* Deux onglets quand la fiche est trop étroite pour tout montrer d'un coup :
   ce qu'est l'exposant, puis ce qu'il anime. Ils ne paraissent que s'il y a
   les deux, et s'effacent dès que la fiche s'élargit — deux colonnes disent
   alors la même chose sans faire choisir. */
/* Deux libellés posés côte à côte ne se donnaient pas pour un bouton : on les
   lisait comme un titre, et le programme restait derrière un onglet que
   personne n'appuyait. D'où l'interrupteur — une piste creuse, la moitié
   active en relief — que tout le monde reconnaît, et le nombre en pastille
   d'accent qui dit qu'il y a quelque chose à voir de ce côté. */
.onglets{display:flex;gap:3px;margin:12px 18px 0;padding:3px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px}
.onglets[hidden]{display:none}
.ong{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.ong:hover{color:var(--ink)}
.ong[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);
  box-shadow:0 2px 10px -4px var(--accent)}
/* La pastille est pleine, pas teintée : c'est elle qui doit attraper l'œil
   depuis l'onglet qu'on ne regarde pas. Sur l'onglet actif, où elle se
   poserait sur son propre aplat, elle s'inverse. */
.ong .n{min-width:19px;padding:1px 6px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-align:center}
.ong[aria-selected="true"] .n{background:var(--accent-ink);color:var(--accent)}
@media (max-width:1099.98px){
  /* le trait de l'en-tête passerait juste au-dessus des onglets */
  .detail.deux .detail-hd{border-bottom:none}
  .detail.deux[data-onglet="prog"] .cInfos{display:none}
  .detail.deux:not([data-onglet="prog"]) .cConf{display:none}
  /* l'onglet nomme déjà le programme, le libellé du champ ferait doublon */
  .detail.deux[data-onglet="prog"] .cConf > .field > .eyebrow{display:none}
}
/* Un exposant qui tient cinq conférences repoussait son adresse et ses
   contacts loin sous la ligne de flottaison. Quand il en tient, la fiche
   s'élargit et les met en regard : l'exposant à gauche, son programme à
   droite. Elle n'y consent qu'au-delà de 1100 px — plus étroite, elle
   mangerait le plan qu'elle sert, et les onglets prennent le relais. */
@media (min-width:1100px){
  .onglets{display:none}
  .detail.deux{width:min(640px,56vw)}
  .detail.deux .detail-bd{display:grid;align-content:start;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px 20px}
  .detail.deux .cInfos{grid-column:1;display:flex;flex-direction:column;gap:15px}
  .detail.deux .cConf{grid-column:2;display:flex;flex-direction:column}
  .detail.deux .acts{grid-column:1/-1}
}
.field{display:flex;flex-direction:column;gap:3px}
.field .v{font-size:14px;line-height:1.45}
.field .v a{color:var(--accent)}
/* Une valeur multiple s'écrit en lignes. Les pastilles convenaient à des codes
   de trois caractères ; les libellés sont des phrases. */
.field .v .ligne{display:block}
.field .v .ligne + .ligne{margin-top:3px}
/* Programme d'une zone : une vignette par conférence, l'heure d'abord puisque
   c'est par elle qu'on se repère, et un filet de la couleur de son type. */
.prog{display:flex;flex-direction:column;gap:7px;margin-top:2px}
/* Le jour reste collé en haut pendant qu'on parcourt le programme : une zone
   en aligne parfois vingt-trois sur trois jours, et savoir lequel on lit
   compte autant que l'heure. */
/* Le fond doit couvrir aussi la marge haute du conteneur — seize pixels —
   sans quoi la vignette suivante transparaît au-dessus du libellé collé. */
.prog .jour{position:sticky;top:-16px;z-index:1;
  margin:4px 0 3px;padding:16px 0 6px;background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line-strong)}
.prog .jour:first-child{margin-top:-10px}
.prog .conf{display:flex;flex-direction:column;gap:2px;padding:7px 9px;width:100%;
  text-align:left;background:var(--surface-2);border:none;
  border-radius:var(--radius);border-left:2px solid var(--tc,var(--line-strong));
  cursor:pointer;transition:background .15s}
.prog .conf:hover{background:var(--line)}
.prog .conf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* le type d'une conférence, dans sa couleur Eventmaker */
.conf-type{display:inline-block;margin-bottom:4px;padding:3px 9px;border-radius:999px;
  font-size:11px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--tc,var(--ink-2));border:1px solid var(--tc,var(--line))}
.prog .h{font-size:11.5px;font-weight:600;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace}
.prog .t{font-size:13px;line-height:1.35;color:var(--ink)}
.prog .ty{font-size:11px;color:var(--ink-3)}
/* Les exposants qui tiennent une conférence. Le nom d'abord, son emplacement
   au bout : c'est un rang qu'on lit, puis qu'on suit jusqu'à la fiche. */
.expos{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.expo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  width:100%;padding:7px 9px;text-align:left;background:var(--surface-2);
  border-radius:var(--radius);transition:background .15s}
button.expo:hover{background:var(--line)}
.expo .n{font-size:13px;line-height:1.35;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.expo .c{flex:none;font-size:11px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace}
/* Un stand hors du plan se lit, mais ne mène nulle part : rien ne doit le
   faire passer pour un bouton. */
.expo.statique{background:none;padding:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:var(--radius);font-size:12.5px;font-weight:500;border:1px solid var(--line)}
.btn:hover{border-color:var(--line-strong)}

/* ------------------------------------------------------------
   Parcours de visite

   Le visiteur retient des exposants et des conférences en circulant, puis
   relit sa liste sur place. La marque est la même partout — un signet creux
   tant que la chose n'y est pas, plein dès qu'elle y entre — pour qu'on la
   reconnaisse aussi bien dans le programme d'une zone que sur une fiche.
   ------------------------------------------------------------ */
.marque{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3);display:grid;place-items:center;background:var(--surface)}
.marque svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.marque:hover{border-color:var(--line-strong);color:var(--ink)}
.marque[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.marque[aria-pressed="true"] svg{fill:currentColor}
.btn.parc{display:inline-flex;align-items:center;gap:7px}
.btn.parc svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.btn.parc[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.parc[aria-pressed="true"] svg{fill:currentColor}
/* Dans une fenêtre modale, les champs n'ont pas l'écartement que leur donne le
   corps de la fiche : le bouton se collerait au dernier paragraphe. */
.mcorps .acts{margin-top:13px}
/* La vignette d'une conférence garde toute la largeur qu'elle peut : le
   signet se pose à côté, hors du bouton — un bouton n'en contient pas un autre. */
.confRang{display:flex;align-items:center;gap:6px}
.confRang .conf{flex:1;min-width:0}

/* Le nombre porté par le bouton de la barre : sans lui, rien ne dirait qu'un
   parcours a été commencé lors d'une visite précédente. */
.compteur{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;display:grid;place-items:center;line-height:1;
  border:1.5px solid var(--surface)}
.compteur[hidden]{display:none}

/* Le tiroir occupe la place de la fiche — à droite sur grand écran, en bas sur
   téléphone : c'est le même geste, regarder une liste à côté du plan. Les deux
   ne s'ouvrent jamais ensemble, ils se disputeraient la même bande. */
.parcours{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--surface);
  border-left:1px solid var(--line);transform:translateX(100%);display:flex;flex-direction:column;
  z-index:4;box-shadow:-16px 0 40px -26px rgba(10,14,18,.55);
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
.parcours.open{transform:none}
.parcours .detail-hd h2{margin:0 0 4px}
.pCorps{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.pPied{padding:10px 18px 14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.pPied[hidden]{display:none}
.pPied .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 12px;font-size:13px}
.pPied .btn svg{width:15px;height:15px;flex:none}
/* Organiser sa journée n'est pas une action de rangement comme les autres :
   c'est ce pour quoi la liste a été faite, et le bouton le dit. */
.pPied .jOrg{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pPied .jOrg:hover{border-color:var(--accent)}
.pPied .jOrg[disabled]{opacity:.45;background:var(--surface-2);border-color:var(--line);
  color:var(--ink-3);cursor:default}
.pPied .vider{font-size:12px;color:var(--ink-3);text-decoration:underline}
.pPied .vider:hover{color:#C2372B}
/* Revenir en arrière n'efface rien : le rouge du survol s'y lirait comme une
   menace sur la liste qu'on retrouve. */
.pPied .vider.retour:hover{color:var(--ink)}
.pGroupe{display:flex;flex-direction:column;gap:7px}
/* Le jour sépare les conférences comme il le fait dans le programme d'une
   zone : sans lui, « 10h30 » ne dit pas de quelle matinée il parle. */
.pGroupe .jour{margin:5px 0 1px;padding-bottom:5px;font-size:13.5px;font-weight:600;
  color:var(--ink);border-bottom:1px solid var(--line-strong)}
.pRang{display:flex;align-items:center;gap:6px}
.pRang .pOuvre{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;
  padding:8px 10px;background:var(--surface-2);border-radius:var(--radius);
  border-left:2px solid var(--tc,var(--line-strong));transition:background .15s}
.pRang .pOuvre:hover{background:var(--line)}
.pRang .pt{font-size:13px;line-height:1.35;color:var(--ink)}
.pRang .ps{font-size:11.5px;color:var(--ink-3)}
.pRang .pOte{width:28px;height:28px;flex:none;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3);font-size:15px;line-height:1}
.pRang .pOte:hover{border-color:#C2372B;color:#C2372B}
.pVide{font-size:13px;color:var(--ink-3);line-height:1.6}
/* ------------------------------------------------------------
   La journée organisée

   Le même tiroir, une autre vue : la liste qu'on a composée devient un
   déroulé d'heures. Les deux ne s'affichent jamais ensemble — c'est la même
   journée, lue avant puis après le calcul.
   ------------------------------------------------------------ */
.jBilan{display:flex;flex-direction:column;gap:2px;padding:11px 12px;
  background:var(--accent-soft);border-radius:var(--radius)}
.jBilan b{font-family:"Archivo",sans-serif;font-size:20px;letter-spacing:-.02em}
.jBilan span{font-size:12.5px;color:var(--ink-2)}
.jFil{display:flex;flex-direction:column;gap:3px}
.jRang{display:flex;gap:9px;align-items:flex-start}
/* L'heure tient une colonne à elle : alignée à droite, les minutes se lisent
   les unes sous les autres et la journée se parcourt d'un regard. */
.jH{flex:none;width:38px;padding-top:9px;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
/* Ce qui relie deux arrêts — la marche, l'attente, le changement de pavillon
   — n'est pas un arrêt : le trait pointillé le dit sans un mot de plus. */
.jRang.lien .jH{padding-top:1px}
.jL{flex:1;min-width:0;margin-left:8px;padding:1px 0 5px 14px;
  border-left:1px dashed var(--line-strong);
  font-size:11.5px;color:var(--ink-3);line-height:1.5}
.jArret{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;
  padding:8px 10px;background:var(--surface-2);border-radius:var(--radius);
  border-left:2px solid var(--tc,var(--accent));transition:background .15s}
.jArret:hover{background:var(--line)}
/* Le rang de l'arrêt, le même que la pastille posée sur le plan : c'est par
   lui qu'on passe de la liste au trait, et du trait à la liste. */
.jN{flex:none;width:20px;height:20px;border-radius:999px;background:var(--accent);
  color:#fff;font-size:10.5px;font-weight:600;font-family:"IBM Plex Mono",monospace;
  display:grid;place-items:center;line-height:1}
.jArret.conf .jN{background:var(--surface);color:var(--accent);
  box-shadow:inset 0 0 0 1.5px var(--accent)}
/* Un rendez-vous qu'on n'atteint pas garde sa place et son heure, mais cesse
   de se donner pour acquis : c'est au visiteur d'arbitrer. */
.jArret.tard{border-left-color:#C2372B}
.jArret.tard .jS{color:#C2372B}
.jTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.jT{font-size:13px;line-height:1.35;color:var(--ink)}
.jS{font-size:11.5px;color:var(--ink-3)}
.jD{flex:none;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
/* Ce qui n'a pas trouvé sa place dans la journée : on le montre plutôt que de
   le laisser disparaître sans un mot. */
.jReste{display:flex;flex-direction:column;gap:7px}
.jReste .pRang .pOuvre{opacity:.72}

/* Les trois questions posées avant le calcul. Elles tiennent dans la fenêtre
   modale, où rien d'autre ne se règle par un champ. */
.jForm{display:flex;flex-direction:column;gap:12px;margin-top:13px}
.jForm label{display:flex;flex-direction:column;gap:4px}
.jForm select,.jForm input{width:100%;padding:8px 9px;font-size:13.5px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink)}
.jForm select:focus,.jForm input:focus{border-color:var(--accent);outline:none}
.jSansPorte{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* Le signet rejoint la croix en haut de la fiche : il porte sur la fiche
   entière, et non sur ce qui suit les champs comme « Centrer sur le plan ». */
.hdActs{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px}
.hdActs .close{position:static;top:auto;right:auto}
.hdActs .marque{width:28px;height:28px}
.hdActs .marque[hidden]{display:none}

/* ------------------------------------------------------------
   Itinéraire : le tiroir, et le trait sur le plan
   ------------------------------------------------------------ */
/* Troisième occupant de la même bande que la fiche et le parcours — à droite
   au large, en bas sur téléphone. Les trois ne s'ouvrent jamais ensemble. */
.itineraire{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--surface);
  border-left:1px solid var(--line);transform:translateX(100%);display:flex;flex-direction:column;
  z-index:4;box-shadow:-16px 0 40px -26px rgba(10,14,18,.55);
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
.itineraire.open{transform:none}
.itineraire .detail-hd h2{margin:0 0 4px}
.iCorps{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
/* Le champ de départ, l'inversion, le champ d'arrivée : trois lignes d'une
   même grille, la flèche à cheval sur les deux champs qu'elle échange. */
.iChamps{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:end}
/* Le champ porte sa liste : elle se déroule sous lui, et non sous les deux.
   Posée en dessous du bloc, elle paraissait appartenir à l'arrivée alors qu'on
   tapait le départ. */
.iChamp{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.iChamp input{width:100%;padding:8px 36px 8px 9px;font-size:13.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.iChamp input:focus{border-color:var(--accent);outline:none}
/* Le viseur vit au bord du champ qu'il remplit : c'est la même action que la
   saisie, dite autrement. */
.iVise{position:absolute;right:3px;bottom:3px;width:28px;height:28px;display:grid;
  place-items:center;border-radius:var(--radius);color:var(--ink-3)}
.iVise:hover{color:var(--ink);background:var(--line)}
.iVise[aria-pressed="true"]{color:#fff;background:var(--accent)}
.iVise svg{width:15px;height:15px}
.iEchange{grid-column:2;grid-row:1/3;align-self:center;width:34px;height:34px;
  display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3)}
.iEchange:hover{border-color:var(--line-strong);color:var(--ink)}
.iEchange svg{width:15px;height:15px}
/* La liste sert les deux champs à tour de rôle : elle se déplace dans celui
   qu'on remplit plutôt que d'exister en double. */
.iSugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;
  display:flex;flex-direction:column;gap:2px;max-height:210px;overflow-y:auto;
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px;
  background:var(--surface);box-shadow:var(--shadow)}
.iSugg[hidden]{display:none}
.iSug{display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 8px;
  border-radius:var(--radius);width:100%}
.iSug:hover,.iSug.vis{background:var(--line)}
.iSug .n{font-size:13px;color:var(--ink);line-height:1.3}
.iSug .s{font-size:11.5px;color:var(--ink-3)}
/* Un repère n'est pas un exposant : le liseré le dit sans un mot de plus. */
.iSug.rep{border-left:2px solid var(--accent)}
.iRien{margin:0;padding:6px 8px;font-size:12.5px;color:var(--ink-3)}
.iPmr{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);
  line-height:1.45;cursor:pointer}
.iPmr input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent)}
.iPmr b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.iResultat{display:flex;flex-direction:column;gap:12px}
.iBilan{display:flex;flex-direction:column;gap:2px;padding:11px 12px;
  background:var(--accent-soft);border-radius:var(--radius)}
.iBilan b{font-family:"Archivo",sans-serif;font-size:20px;letter-spacing:-.02em}
.iBilan span{font-size:12.5px;color:var(--ink-2)}
.iNote{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.iAlerte{margin:0;font-size:12.5px;line-height:1.6;color:#C2372B}
.iEtapes{display:flex;flex-direction:column;gap:7px}
.iEtape{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--surface-2);
  border-radius:var(--radius);border-left:2px solid var(--accent)}
.iEtape.transfert{border-left-style:dashed;border-left-color:var(--line-strong)}
/* Une étape qui se déroule dans un pavillon qu'on ne regarde pas s'y rend
   d'un clic : c'est un bouton, mais il garde l'aspect des autres étapes —
   c'est la même liste, et seul le survol le distingue. */
.iEtape.ailleurs{width:100%;text-align:left}
.iEtape.ailleurs:hover{background:var(--accent-soft)}
.iEtape .t{font-size:13px;color:var(--ink)}
.iEtape .s{font-size:11.5px;color:var(--ink-3)}

/* Pendant la visée, le plan devient une liste de choix : le curseur le dit à
   la souris, le bandeau le dit à tout le monde. */
.viseur{position:absolute;top:12px;left:0;right:0;margin-inline:auto;width:fit-content;
  max-width:92%;z-index:14;display:flex;align-items:center;gap:12px;
  padding:7px 12px 7px 14px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:999px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink)}
.viseur[hidden]{display:none}
.viseur button{font-size:12px;color:var(--accent);text-decoration:underline;padding:2px}
html.vise-plan #plan{cursor:crosshair}

/* Le tracé. Son épaisseur est donnée en pixels et ne suit pas le zoom : un
   trait qui grossit avec le plan finit par masquer les stands qu'il longe,
   et disparaît quand on recule pour voir le trajet entier. */
#itin{pointer-events:none}
#itin path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#itin .iHalo{stroke:var(--surface);stroke-width:8;opacity:.9}
#itin .iTrait{stroke:var(--accent);stroke-width:3.5}
/* Des pointillés qui défilent : ils disent le sens du trajet, ce qu'un trait
   plein ne fait pas, et sans ajouter de flèches qui se chevaucheraient dans
   les virages. */
#itin .iSens{stroke:var(--accent-ink);stroke-width:1.6;stroke-dasharray:1 11;opacity:.85;
  animation:defile 1.1s linear infinite}
@keyframes defile{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){#itin .iSens{animation:none}}
#itin .iBout{fill:var(--accent);stroke:var(--surface);stroke-width:2.5;
  vector-effect:non-scaling-stroke}
#itin .iBout.fin{fill:var(--surface);stroke:var(--accent)}
/* La pastille d'une conférence se distingue de celle d'un stand : l'heure y
   est imposée, et c'est autour d'elle que le reste de la journée s'est rangé. */
#itin .iBout.conf{fill:var(--surface);stroke-width:3.5}
#itin .iNum{fill:var(--surface);text-anchor:middle;dominant-baseline:central;
  font-family:"IBM Plex Mono",monospace;font-weight:600}
#itin .iNum.conf{fill:var(--accent)}
/* Comme le parcours et les icônes de zoom : ce que l'exploitant retire doit
   disparaître partout, y compris le bouton posé sur les fiches. Organiser sa
   journée, c'est calculer un itinéraire : sans le moteur, le bouton du
   parcours n'aurait rien à quoi s'adresser. */
html.sans-itineraire .btn.itin,html.sans-itineraire #btnJournee{display:none}

/* L'exploitant peut retirer le parcours : il disparaît alors partout à la
   fois — la barre du haut, les fiches, le programme d'une zone — sans quoi il
   resterait des signets sans destination. Ce que le visiteur avait retenu
   n'est pas effacé pour autant : le réglage peut se rouvrir. */
html.sans-parcours .marque,html.sans-parcours .btn.parc{display:none}
/* « .iconbtn » déclare « display:grid » : sans cette règle, « hidden » n'y
   masquerait rien — le même piège que la barre de zoom et l'échelle. */
.iconbtn[hidden]{display:none}

.panel{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;z-index:3;display:none;
  max-height:min(74vh,600px);overflow-y:auto}
.panel.open{display:block}
.panel .eyebrow{display:block;margin-bottom:8px}
/* Ce qui n'appartient pas à la pile s'en détache par un trait, comme la barre
   d'administration au bas du panneau. Le libellé n'a pas de case à cocher
   devant lui, et rien à ouvrir : le curseur ne promet donc rien. */
.apart{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.apart .calq label{cursor:default}
.calq.sous{padding-left:15px}
.calq.sous label{font-size:12px;color:var(--ink-2)}
.calq.sous .cc,.calq.sous .fillbtn{transform:scale(.88)}
.calq{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:2px 0}
.calq label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-width:0}
.calq label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Réglages généraux, dans leur fenêtre : une case à cocher par ligne, avec de
   quoi viser au doigt sans effleurer la voisine. */
/* Un réglage qui se chiffre, sous ceux qui se cochent : même famille, autre
   geste. L'unité est écrite à côté du champ plutôt que dans son libellé, où
   elle se lirait comme faisant partie de la question. */
.reglage-nb{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:5px}
.reglage-nb label{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink)}
.reglage-nb .l{flex:1;min-width:0}
.reglage-nb input{width:74px;padding:6px 8px;font-size:13.5px;text-align:right;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink);font-family:"IBM Plex Mono",monospace}
.reglage-nb input:focus{border-color:var(--accent);outline:none}
.reglage-nb .u{flex:none;font-size:12.5px;color:var(--ink-3)}
.reglage-nb .aide{font-size:12px;color:var(--ink-3);line-height:1.5}
.reglages{margin-top:10px}
.reglages label{display:flex;align-items:center;gap:9px;font-size:14px;
  cursor:pointer;padding:7px 0}
.reglages input{width:16px;height:16px;flex:none;accent-color:var(--accent)}
.cc{width:24px;height:18px;padding:0;border:1px solid var(--line-strong);border-radius:3px;
  background:none;cursor:pointer;flex:none}
.cc::-webkit-color-swatch-wrapper{padding:1px}
.cc::-webkit-color-swatch{border:none;border-radius:2px}
.calq .opts{display:flex;align-items:center;gap:6px}
.fillbtn{width:20px;height:18px;border:1px solid var(--line-strong);border-radius:3px;
  color:var(--ink-3);display:grid;place-items:center;padding:0}
.fillbtn:hover{border-color:var(--ink-2);color:var(--ink-2)}
.fillbtn svg{width:11px;height:11px;display:block}
.fillbtn svg rect{fill:none;stroke:currentColor;stroke-width:1.5}
.fillbtn[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink)}
.fillbtn[aria-pressed="true"] svg rect{fill:currentColor}
.modale{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:none;
  place-items:center;padding:20px}
.modale.open{display:grid}
.mfen{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.6);width:min(430px,100%);max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden}
.mfen header{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.mfen h2{font-family:"Archivo",sans-serif;font-size:16px;margin:0;letter-spacing:-.01em}
.mfen header button{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}
.mfen header button:hover{color:var(--ink)}
.mcorps{padding:12px 14px;overflow-y:auto;flex:1}
.mcorps p{margin:0 0 4px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mfen footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;
  border-top:1px solid var(--line)}
.mfen footer .btn.danger{background:#C2372B;border-color:#C2372B;color:#fff}
.mfen footer .btn.danger:hover{filter:brightness(1.1)}

/* Le panneau des critères. Chaque groupe porte son intitulé et ses valeurs en
   puces : elles se touchent du pouce, se lisent d'un coup d'œil, et portent le
   nombre de fiches qu'elles retiennent — sans lui, on coche à l'aveugle. */
.grp-crit{padding:0;border-top:1px solid var(--line)}
.grp-crit:first-child{border-top:none}
/* Le titre est la prise : replié, un critère tient sur une ligne, et la
   fenêtre montre tous les critères plutôt qu'un seul déplié. */
.grp-crit > summary{display:flex;align-items:center;gap:9px;padding:11px 2px;
  cursor:pointer;list-style:none}
.grp-crit > summary::-webkit-details-marker{display:none}
.grp-crit > summary::after{content:"";width:7px;height:7px;margin-left:auto;
  border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.grp-crit[open] > summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.grp-crit > summary .t{font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2)}
.grp-crit > summary .r{font-size:11.5px;color:var(--ink-3)}
.grp-crit > summary .r[data-on="true"]{color:var(--accent);font-weight:600}
.grp-crit > *:last-child{margin-bottom:10px}
.grp-crit .tamis{width:100%;margin-bottom:8px;padding:6px 10px;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.grp-crit .tamis:focus{border-color:var(--accent);background:var(--surface);outline:none}
/* Un critère à cent valeurs ne pousse pas le pied de la fenêtre hors de vue :
   il défile dans son propre cadre, et le tamis au-dessus le raccourcit. */
.puces-crit{display:flex;flex-wrap:wrap;gap:6px;max-height:38dvh;overflow-y:auto}
.puce-crit{display:inline-flex;align-items:center;gap:6px;max-width:100%;
  padding:6px 10px;font-size:12.5px;color:var(--ink-2);text-align:left;
  background:var(--surface-2);border:1px solid transparent;border-radius:999px}
.puce-crit:hover{border-color:var(--line-strong)}
.puce-crit[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--ink);font-weight:600}
.puce-crit .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce-crit .n{font-size:11px;color:var(--ink-3);flex:0 0 auto}
.puce-crit[aria-pressed="true"] .n{color:var(--accent)}
.puces-crit .aucune{font-size:12px;color:var(--ink-3)}
.compte-crit{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3)}

/* liste réordonnable : le premier rang est le plus en avant */
.ordre{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ordre li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  padding:7px 9px;border:1px solid transparent;border-radius:4px;background:var(--surface-2);
  font-size:13px;cursor:grab}
.ordre li:hover{border-color:var(--line-strong)}
.ordre li.drag{opacity:.4}
.ordre li.avant{box-shadow:inset 0 2px 0 var(--accent)}
.ordre li.apres{box-shadow:inset 0 -2px 0 var(--accent)}
.ordre .poignee{color:var(--ink-3);font-size:13px;line-height:1;cursor:grab}
.ordre .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordre .genre{font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;
  border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:6px}
.ordre .bouts{display:flex;gap:2px}
.ordre .bouts button{width:22px;height:20px;border:1px solid var(--line);border-radius:3px;
  color:var(--ink-3);font-size:11px;line-height:1}
.ordre .bouts button:hover{border-color:var(--accent);color:var(--accent)}
.reorg{width:100%;margin-bottom:8px;padding:6px;border:1px solid var(--line);
  border-radius:var(--radius);font-size:12px;color:var(--ink-2)}
.reorg:hover{border-color:var(--accent);color:var(--accent)}

.importzone{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.importzone textarea{width:100%;height:76px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  padding:6px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface-2);color:var(--ink);resize:vertical}
.importzone textarea:focus{border-color:var(--accent);outline:none}
.importzone .rangee{display:flex;gap:10px}
.adminbar{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--line)}
.panel .reset{font-size:12px;color:var(--ink-3);text-decoration:underline}
/* Publier n'est pas un réglage parmi d'autres : c'est le geste qui rend le
   travail visible aux visiteurs. Il se distingue des liens qui l'entourent. */
.panel .reset.fort{display:block;width:100%;margin-bottom:8px;padding:7px 10px;
  text-decoration:none;text-align:center;color:#fff;background:var(--accent);
  border-radius:var(--radius);font-weight:500}
.panel .reset.fort:hover{opacity:.9;color:#fff}
.panel .reset:hover{color:var(--ink)}

.voile{position:fixed;inset:0;background:rgba(8,10,12,.55);z-index:14;
  opacity:0;pointer-events:none;transition:opacity .2s;display:none}

@media (max-width:900px){
  /* `1fr` ne borne pas : un élément de grille garde `min-width:auto`, et la
     barre de titre — nom de l'événement et pavillons, tous en `nowrap` —
     imposait sa largeur incompressible à toute la colonne. Sur un écran de
     412 px la page s'étalait sur 579, et le plan sortait par la droite.
     `minmax(0,1fr)` autorise la colonne à rétrécir ; encore faut-il que son
     contenu l'accepte, d'où les `min-width:0` qui suivent. */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar,.brand{min-width:0}
  .topbar{gap:10px}
  .brand h1{overflow:hidden;text-overflow:ellipsis}
  /* Les pavillons défilent latéralement plutôt que de pousser les murs. C'est
     donc à eux de céder la place en premier : ils restent atteignables au
     doigt, là où un titre tronqué à trois lettres ne se retrouve pas. */
  .brand{flex:0 1 auto;max-width:40%}
  .halls{flex:1 1 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .halls::-webkit-scrollbar{display:none}
  .stats,.brand .sub{display:none}

  /* Le plan est ce qu'on vient voir : il prend toute la hauteur restante, et
     la liste se replie en tiroir posé par-dessus. Elle occupait auparavant une
     bande figée de 216 px dont la recherche et le compteur mangeaient la plus
     grande part : il restait 71 px de liste — une ligne et demie pour cinq
     cents résultats. */
  /* Trois crans plutôt que deux. Le cran du milieu est celui qui sert le
     plus : on lit la liste sans perdre le plan de vue, et c'est là qu'on
     répond à « qu'y a-t-il près de l'entrée ». Tout ou rien obligeait à
     choisir entre les deux. */
  .side{
    position:fixed;left:0;right:0;bottom:0;z-index:12;
    height:82vh;height:82dvh;
    border-right:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    transform:translateY(calc(100% - var(--replie,164px)));
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .side[data-cran="demi"]{transform:translateY(calc(100% - 46dvh))}
  .side[data-cran="plein"]{transform:translateY(0)}
  /* Pendant le geste c'est la main qui mène, pas la transition. */
  .side.glisse{transition:none}

  /* En tiroir, la hauteur se paie sur le plan : les bandes redeviennent une
     seule ligne qui défile, et ce qu'elles montrent déborde par le côté. */
  .secteurs,.actifs{flex-wrap:nowrap;overflow-x:auto}
  /* Le panneau des critères s'ouvre en bas, à portée du pouce, et non centré
     sur un écran qu'il occuperait tout entier. */
  .modale{padding:0;place-items:end stretch}
  .mfen{width:100%;max-height:88dvh;border-radius:14px 14px 0 0;border-bottom:none}
  /* Au pouce, une puce se vise : elle gagne la hauteur que la souris n'exige pas. */
  .puce-crit{padding:8px 12px}
  .grp-crit > summary{padding:13px 2px}

  .poignee{display:block;width:100%;padding:10px 0 6px;background:transparent;
    touch-action:none;cursor:grab}
  .poignee::before{content:"";display:block;width:38px;height:4px;margin:0 auto;
    border-radius:999px;background:var(--line-strong)}

  /* Les commandes du plan se posent au-dessus du tiroir replié : ancrées en
     bas comme elles l'étaient, il les recouvrait. */
  .zoombar{bottom:calc(var(--replie,150px) + 14px)}
  /* L'échelle passe au-dessus du cartouche, qui sur un écran étroit est assez
     large pour la traverser. Sa hauteur est mesurée, et vaut zéro en l'absence
     de repères : l'échelle reprend alors sa place. */
  .scalebar{bottom:calc(var(--replie,164px) + var(--cartouche,0px) + 18px)}
  /* sans les boutons de zoom à contourner, l'échelle retrouve la marge */
  .sans-zoom .scalebar{left:14px}
  .poi{bottom:calc(var(--replie,150px) + 12px)}
  .panel{top:auto;bottom:calc(var(--replie,150px) + 12px);right:12px}

  /* La fiche devient un tiroir elle aussi. En fenêtre centrée sur voile, elle
     masquait le plan au moment précis où l'on venait d'y désigner un stand :
     on perdait de vue ce qu'on regardait. Posée en bas, elle laisse le plan
     visible et manipulable derrière — c'est pour cela qu'il n'y a plus de
     voile, qui interceptait aussi les gestes. */
  .voile{display:none}
  .detail{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:56dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    /* au-dessus du tiroir de la liste, qui se replie quand elle s'ouvre */
    z-index:13;
    transform:translateY(100%);opacity:1;pointer-events:none;
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .detail.open{transform:translateY(0);pointer-events:auto}
  .detail-hd{padding:16px 16px 13px}
  .onglets{margin:10px 16px 0}
  .detail-hd h2{font-size:17px;margin:6px 0 5px}
  /* seul le corps défile : le nom et le code restent sous les yeux */
  .detail-bd{padding:14px 16px 18px;overflow-y:auto}
  /* La fiche n'a plus qu'une demi-hauteur d'écran : elle se resserre. Les
     champs qui tiennent en un mot — niveaux, ville, pays, téléphone, réseaux —
     se rangent deux par deux au lieu d'empiler autant de lignes qu'il faut
     faire défiler une à une ; l'adresse, le site et le programme gardent la
     largeur entière. */
  .detail-bd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px 14px;align-content:start}
  .detail-bd .field,.detail-bd .acts{grid-column:1/-1;min-width:0}
  .detail-bd .field.court{grid-column:auto}
  /* Une adresse web n'a pas de césure naturelle : sans cela elle déborde de
     sa colonne au lieu de revenir à la ligne. */
  .field .v{font-size:13.5px;overflow-wrap:anywhere}
  /* Le libellé du jour se colle en haut du corps, dont la marge vaut ici
     quatorze pixels et non seize. */
  .prog{gap:6px}
  .prog .jour{top:-14px;padding-top:14px}
  /* Une vignette tenait trois lignes pour deux informations utiles : l'heure
     et le type partagent la première, le titre prend la seconde. */
  .prog .conf{flex-flow:row wrap;align-items:baseline;column-gap:8px;padding:6px 8px}
  .prog .conf .ty{order:1}
  .prog .conf .t{order:2;flex:0 0 100%}

  /* Le parcours suit la fiche : même bande basse, même glissement. Il monte
     un peu plus haut — c'est une liste qu'on parcourt, pas une fiche qu'on
     lit — sans masquer le plan pour autant. */
  .parcours{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:68dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    z-index:13;
    transform:translateY(100%);pointer-events:none;
  }
  .parcours.open{transform:translateY(0);pointer-events:auto}
  .pCorps{padding:14px 16px}
  .pPied{padding:10px 16px 18px}

  /* L'itinéraire suit les deux autres, en un peu plus haut : deux champs, un
     clavier qui monte, et le résultat qui doit rester lisible au-dessus. */
  .itineraire{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:76dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    z-index:13;
    transform:translateY(100%);pointer-events:none;
  }
  .itineraire.open{transform:translateY(0);pointer-events:auto}
  .iCorps{padding:14px 16px}
  .iSugg{max-height:160px}
}

/* Le fond de plan arrive après les stands : un fondu vaut mieux qu'une
   apparition brutale sous le curseur. */
#couches .cal{animation:parait .25s ease-out}
@keyframes parait{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#couches .cal{animation:none}}
