<script data-api="/api/plan" data-slug="smcl-2026">
/* Sans viewport, un mobile rend la page dans un viewport virtuel de 980 px :
   les requêtes média ne se déclenchent pas et tout est réduit à la loupe. */
if (!document.querySelector('meta[name="viewport"]')){
  const mv = document.createElement("meta");
  mv.name = "viewport";
  mv.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}

const $ = id => document.getElementById(id);
const svg = $("plan");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Deux origines possibles pour les données : figées dans la page, ou
   servies par l'API. La page est la même, seul le démarrage diffère. */
const API = document.currentScript?.dataset.api || "";
const SLUG = new URLSearchParams(location.search).get("plan") || document.currentScript?.dataset.slug || "";

let DATA = null, TOUS = [], parId = new Map(), CONFS = new Map(), EXPOSANTS = new Map();
/* Les sociétés hébergées sur le stand d'un autre. Elles n'ont ni forme ni
   identifiant — c'est le stand de leur hôte qu'on va voir — et ne peuvent donc
   pas vivre dans « TOUS », que la carte indexe. Elles ont leur liste, que la
   recherche seule consulte. */
let HEBERGES = [];
/* `q` est ce que le visiteur a tapé, `qn` la forme sur laquelle on compare —
   rognée et abaissée. La normaliser une fois par frappe plutôt qu'une fois
   par objet, c'est la même chose en mille fois moins.

   `selSoc` dit laquelle des sociétés d'un stand partagé est ouverte : -1 le
   titulaire, sinon le rang de l'hébergé. Sans lui, la liste marquerait comme
   courants tous les rangs d'un même stand. */
const state = { q: "", qn: "", sel: null, selSoc: -1, plan: 0, secteurs: new Set(),
                /* Les critères retenus : une clé de champ, les valeurs cochées.
                   Un critère sans valeur cochée n'existe pas — il sort de la
                   table plutôt que d'y rester comme un filtre qui ne filtre
                   rien. */
                crit: new Map() };
const P = () => DATA.plans[state.plan];
let view, emp;

/* ============================================================
   1. Index global — la recherche porte sur tous les pavillons
   ============================================================ */
function indexe(d){
  DATA = d;
  DATA.plans.forEach((p, i) => {
    p.i = i;
    p.court = String(p.libelle).replace(/^Pavillons*/i, "");
    p.zones = p.zones || [];
    p.stands = p.stands || [];
    p.fond = p.fond || [];
    p.conferences = p.conferences || [];
    // le programme d'une zone se lit d'un coup, et il est déjà chronologique
    p.parZone = new Map();
    p.conferences.forEach(c => {
      if (!c.zone) return;
      if (!p.parZone.has(c.zone)) p.parZone.set(c.zone, []);
      p.parZone.get(c.zone).push(c);
    });
    /* Une conférence tient aussi à l'exposant qui l'anime, dont le stand peut
       être ailleurs que sa salle — et qui reste son seul point d'accroche quand
       la salle n'est rattachée à aucune zone. */
    p.parStand = new Map();
    p.conferences.forEach(c => {
      (c.exposants || []).forEach(e => {
        if (!e || !e.stand) return;
        if (!p.parStand.has(e.stand)) p.parStand.set(e.stand, []);
        p.parStand.get(e.stand).push(c);
      });
    });
    [p.parZone, p.parStand].forEach(m => m.forEach(l => l.sort((a, b) =>
      String(a.debutLocal || a.debut || "").localeCompare(String(b.debutLocal || b.debut || "")))));
    p.zones.forEach(z => { z.kind = "zone"; z.p = i; });
    /* Ce sur quoi porte la recherche, assemblé et abaissé ici une fois pour
       toutes. Chaque frappe balaie tout le salon — un millier d'objets — et
       reconstruisait jusqu'ici la même chaîne pour chacun d'eux. */
    p.stands.forEach(s => {
      s.kind = "stand"; s.p = i;
      /* Les champs retenus comme critères entrent aussi dans la recherche
         plein texte : un exploitant qui désigne « Gamme de produits » comme
         critère veut qu'on trouve « bio » en le tapant, pas seulement en
         dépliant un filtre. */
      s.rech = ((s.nom || "") + " " + (s.code || "") + " " + (s.plan || "") +
                " " + (s.sect || "") + " " + texteCriteres(s)).toLowerCase();
    });
  });
  /* Les secteurs se relèvent avant les réglages, et non après : c'est la liste
     des secteurs de ce salon qui dit lesquelles de leurs couleurs, rangées
     dans la configuration, parlent bien de lui. */
  indexeSecteurs();

  /* L'habillage choisi par l'exploitant vient du service et l'emporte sur ce
     que garde le poste : c'est lui que les visiteurs doivent voir, et un
     téléphone n'a rien dans son stockage local. Le poste ne sert plus que de
     cache, et de refuge si un enregistrement a échoué — celui de ce salon-ci,
     que la clé de rangement désigne maintenant. */
  ouvreConf(d);
  DATA.plans.forEach(p => {
    const a = p.apparence || {};
    // un enregistrement d'avant le cloisonnement porte les calques d'autres
    // salons : ils ne désignent rien ici, et fausseraient la publication
    if (a.reglages && Object.keys(a.reglages).length)
      Object.assign(CONF, reglagesDuSalon(a.reglages));
    if (Array.isArray(a.pile) && a.pile.length) CONF["_pile:" + p.id] = a.pile;
    /* Les dessins de la base font foi, jusqu'à l'effacement d'un calque retiré
       ailleurs — sauf sur ce qui n'a pas encore été publié depuis ce poste :
       cela n'existe nulle part ailleurs, et l'écraser le perdait. Une page à
       données figées n'en porte pas du tout : on n'y touche à rien. */
    if (Array.isArray(p.dessins) && !(ADMIN && enAttente(p.id))){
      DESSINS[p.id] = p.dessins.map(c => ({ ...c, formes: (c.formes || []).slice() }));
    }
  });
  /* Les dessins viennent de changer sous les pieds du calcul d'itinéraire :
     ce qu'il en avait retenu — les allées, les passages d'un plan à l'autre —
     ne décrit plus rien. */
  oublieGrilles();
  oublieLiaisons();

  TOUS = DATA.plans.flatMap(p => [...p.zones, ...p.stands]);
  parId = new Map(TOUS.map(o => [o.id, o]));
  /* Un rang de recherche par société hébergée. Il emprunte à son hôte tout ce
     qui décrit l'emplacement — identifiant, numéro, pavillon, surface — et n'a
     en propre que son nom et son rang, par lequel la fiche la retrouvera. */
  HEBERGES = DATA.plans.flatMap((p, i) => p.stands.flatMap(s =>
    (s.coex || []).map((x, k) => {
      /* Les champs qui servent de critères sont ceux de la société, pas de son
         hôte : une hébergée a sa ville, ses rubriques, ses champs propres, et
         un filtre doit la retenir pour ce qu'elle est. */
      const h = {
        kind: "coex", id: s.id, i: k, p: i, code: s.code, m2: s.m2, angles: s.angles,
        sect: s.sect, nom: x.nom, plan: x.plan, ville: x.ville, pays: x.pays,
        nomencl: x.nomencl, themes: x.themes, perso: x.perso, neuf: x.neuf,
      };
      h.rech = ((x.nom || "") + " " + (s.code || "") + " " + (x.plan || "") +
                " " + (s.sect || "") + " " + texteCriteres(h)).toLowerCase();
      return h;
    })));
  indexeCriteres();
  /* Le programme d'une zone se lit pavillon par pavillon, mais un parcours de
     visite mêle les trois : la conférence retenue hier peut se tenir ailleurs
     que là où l'on se trouve. L'index des conférences est donc global, comme
     celui des stands. */
  CONFS = new Map();
  DATA.plans.forEach(p => p.conferences.forEach(c => CONFS.set(String(c.id), c)));
  /* Une même conférence est remontée dans chaque pavillon qui la porte, et
     chacun n'y cite que les exposants qu'il héberge : leur liste complète se
     recompose ici, sinon la fiche n'afficherait que ceux du dernier pavillon
     lu. */
  EXPOSANTS = new Map();
  DATA.plans.forEach(p => p.conferences.forEach(c => {
    const k = String(c.id);
    if (!EXPOSANTS.has(k)) EXPOSANTS.set(k, []);
    const l = EXPOSANTS.get(k);
    (c.exposants || []).forEach(e => {
      if (e && e.stand && !l.some(x => x.stand === e.stand)) l.push(e);
    });
  }));

  const nom = DATA.evenement || "Plan du salon";
  $("titre").textContent = nom;
  $("titre").classList.remove("attente");   // ce n'est plus un intitulé d'attente
  // l'onglet porte le nom de l'événement chargé, pas celui du premier salon
  document.title = (document.documentElement.dataset.role === "admin"
    ? "Administration — " : "") + nom;
  $("sub").textContent = DATA.plans.length + (DATA.plans.length > 1 ? " pavillons" : " pavillon");
  $("nStands").textContent = TOUS.filter(o => o.kind === "stand").length;
  $("nExpo").textContent = TOUS.filter(o => o.kind === "stand" && o.nom).length +
    HEBERGES.filter(o => o.nom).length;
  $("nZones").textContent = TOUS.filter(o => o.kind === "zone").length;
  chargeParcours();
}

/* ============================================================
   2. Mesure de texte — largeur réelle dans la police de rendu
   ============================================================ */
const _cvs = document.createElement("canvas").getContext("2d");
const _lg = new Map();
function largeur(txt, police){
  const k = police[0] + police[1] + "|" + txt;
  let v = _lg.get(k);
  if (v === undefined){
    _cvs.font = police[0] + " 100px " + police[1];
    v = _cvs.measureText(txt).width / 100;
    if (!(v > 0)) v = txt.length * .55;
    _lg.set(k, v);
  }
  return v;
}
/* Comparer deux noms selon les règles du français demande un comparateur.
   `localeCompare` avec des options en rebâtit un à chaque appel : sur les
   milliers de comparaisons d'un tri, c'est lui qu'on paie, pas le tri. */
const COLLATION = new Intl.Collator("fr", { numeric: true });

const P_NOM = ["600", '"Instrument Sans", sans-serif'];
const P_CODE = ["500", '"IBM Plex Mono", monospace'];

function decoupe(txt, n){
  if (n === 1) return [txt];
  const mots = txt.split(/\s+/);
  if (mots.length < n) return null;
  const cible = Math.ceil(txt.length / n);
  const out = [""];
  for (const m of mots){
    const cur = out[out.length - 1];
    if (cur && (cur + " " + m).length > cible && out.length < n) out.push(m);
    else out[out.length - 1] = cur ? cur + " " + m : m;
  }
  return out.length === n ? out : null;
}
function habille(txt, w, h, maxPolice, police){
  let best = null;
  for (let n = 1; n <= 3; n++){
    const lignes = decoupe(txt, n);
    if (!lignes) continue;
    const plusLarge = Math.max(...lignes.map(l => largeur(l, police)));
    const f = Math.min(w / plusLarge, h / (lignes.length * 1.18), maxPolice);
    if (!best || f > best.f) best = { f, lignes };
  }
  return best;
}
function lignesSvg(lignes, f, x, yCentre, cls){
  const dep = yCentre - ((lignes.length - 1) * f * 1.18) / 2 + f * .33;
  return lignes.map((t, i) =>
    '<text class="' + cls + '" x="' + x + '" y="' + (dep + i * f * 1.18).toFixed(2) +
    '" font-size="' + f.toFixed(2) + '">' + esc(t) + '</text>').join("");
}

/**
 * La ligne du numéro de stand, et le compte des sociétés qu'il héberge.
 *
 * Un stand partagé garde le nom de son titulaire — c'est le sien, c'est lui
 * qui loue l'emplacement — et une pastille dit combien d'autres l'y
 * accompagnent : « +2 » sous « Airbnb » en annonce deux de plus, que la fiche
 * nomme. Le nombre est celui des hébergés, pas le total : c'est ce que « + »
 * veut dire partout ailleurs.
 *
 * Le couple reste centré sur l'ancre, la pastille poussant le numéro vers la
 * gauche : déborder à droite mènerait sur la cloison du voisin. Faute de
 * place, le numéro reste seul — une pastille hors du stand désignerait
 * quelqu'un d'autre.
 */
function ligneCode(s, xc, yBase, f, wMax, cls){
  const texte = (x, c, txt) =>
    '<text class="' + c + '" x="' + x.toFixed(2) + '" y="' + yBase.toFixed(2) +
    '" font-size="' + f.toFixed(2) + '">' + esc(txt) + '</text>';
  const n = (s.coex || []).length;
  const wCode = largeur(s.code, P_CODE) * f;
  const compte = "+" + n;
  const marge = f * .34, ecart = f * .42;
  const wPast = largeur(compte, P_CODE) * f + marge * 2;
  if (!n || wCode + ecart + wPast > wMax) return texte(xc, cls, s.code);
  const g = xc - (wCode + ecart + wPast) / 2;
  const xp = g + wCode + ecart, hp = f * 1.16;
  return texte(g + wCode / 2, cls, s.code) +
    '<rect class="coexPast' + (cls ? " " + cls : "") + '" x="' + xp.toFixed(2) +
    '" y="' + (yBase - f * .84).toFixed(2) +
    '" width="' + wPast.toFixed(2) + '" height="' + hp.toFixed(2) +
    '" rx="' + (hp / 2).toFixed(2) + '"/>' +
    /* Le nombre porte lui aussi la marque de la sélection : c'est elle qui
       décide de sa couleur, comme pour le numéro du stand. */
    texte(xp + wPast / 2, "coexN" + cls, compte);
}

/* ============================================================
   3. Rendu du pavillon courant
   ============================================================ */
/* Les calques d'habillage sont recréés à l'arrivée sur un pavillon ; ensuite
   ordonneDom() ne fait que déplacer les nœuds, ce qui rend le réordonnancement
   instantané malgré le poids du fond de plan. */
function monteHabillage(){
  const c = $("couches");
  c.querySelectorAll(".cal").forEach(g => g.remove());
  P().fond.forEach(f => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "cal");
    g.dataset.cle = f.cle;
    g.innerHTML = f.svg || "";
    c.appendChild(g);
  });
}

/* Le panneau des calques ne peut se construire qu'une fois le plan monté.
   L'identité de l'exploitant, elle, peut être vérifiée avant ou après :
   ce drapeau permet aux deux ordres d'arrivée d'aboutir. */
let MONTE = false;

function montePlan(){
  const p = P();
  $("zones").innerHTML = p.zones.map(z =>
    '<g class="zone" data-id="' + z.id + '" tabindex="0" role="button" aria-label="' +
    esc(z.nom || "zone") + '"><path d="' + z.d + '"/></g>').join("");
  $("stands").innerHTML = p.stands.map(s =>
    '<g class="stand" data-id="' + s.id + '" tabindex="0" role="button" aria-label="' +
    esc(s.nom || ("Stand " + (s.code || ""))) + '"><path d="' + s.d + '"/></g>').join("");
  emp = p.emprise;
  calqueActif = null;
  HIST.length = REFAIRE.length = 0;
  { const o = $("outils"); if (o) o.classList.remove("open"); }
  monteHabillage();
  dessineDessins();          // crée les calques de dessin puis ordonne la pile
  appliqueApparence();
  marqueParcours();
  // le trajet vit hors des calques : il survit au montage, mais son tronçon
  // n'est pas celui du pavillon qu'on vient d'ouvrir
  dessineItineraire();
  rafraichitApercu();
  MONTE = true;
  if (ADMIN) construitPanneau();
  onglets();
}

function onglets(){
  $("halls").innerHTML = DATA.plans.map((p, i) =>
    '<button data-p="' + i + '" aria-pressed="' + (i === state.plan) + '">' +
    esc(p.libelle) + '<span class="n">' + p.stands.length + '</span></button>').join("");
  $("halls").querySelectorAll("button").forEach(b => b.onclick = () => changePlan(+b.dataset.p));
}

function changePlan(i){
  if (i === state.plan) return;
  state.plan = i;
  ferme();
  montePlan(); fit(); liste();
  chargeFond(i);
}

/* ============================================================
   4. Libellés — le nom de l'exposant prime sur le numéro
   ============================================================ */
/* Où écrire le nom, et de quelle place on dispose.
   Sur une forme découpée — un L, un U, un stand à redent — le centre de la
   boîte englobante tombe hors de la forme et cette boîte promet une largeur
   qui n'existe pas. La synchronisation calcule alors un ancrage intérieur et
   la place réellement libre autour de lui ; un rectangle n'en a pas besoin. */
const ancre = o => o.lc || o.c;
const place = o => o.lb || o.bb;

function libelles(){
  const l = $("labels"), p = P();
  const r = svg.getBoundingClientRect();
  const pxParM = (r.width || 1) / view.w;
  const dansVue = o => o.c[0] > view.x - 25 && o.c[0] < view.x + view.w + 25 &&
                       o.c[1] > view.y - 25 && o.c[1] < view.y + view.h + 25;
  let out = "";

  for (const z of p.zones){
    const sel = z.id === state.sel;
    if (!z.nom || (!sel && (!visibleSurPlan(z) || !dansVue(z)))) continue;
    const pz = place(z), az = ancre(z);
    const a = habille(z.nom, pz[0] * .88, pz[1] * .7, 3.4, P_NOM);
    if (!a || (!sel && a.f * pxParM < 6.5)) continue;
    out += lignesSvg(a.lignes, a.f, az[0], az[1], "zn" + (sel ? " sel" : ""));
  }

  for (const s of p.stands){
    const sel = s.id === state.sel;
    if (!sel && (!visibleSurPlan(s) || !dansVue(s))) continue;
    /* Le stand garde le nom de son titulaire, quelle que soit la fiche
       ouverte : c'est lui qui loue l'emplacement, et c'est ce nom-là qui est
       peint sur la cloison. Les sociétés qu'il héberge se comptent à côté. */
    if (!s.code && !s.nom) continue;
    const ps = place(s), as = ancre(s);
    const w = ps[0], h = ps[1];

    const nom = s.nom ? habille(s.nom, w * .9, h * .62, 2.4, P_NOM) : null;
    const nomLisible = nom && (sel || nom.f * pxParM >= 4.5);
    const maxCode = s.nom ? Math.min(nom ? nom.f * .78 : 1.2, h * .22) : h * .34;
    const fc = s.code ? Math.min(maxCode, (w * .9) / largeur(s.code, P_CODE), 1.9) : 0;
    const codeLisible = fc && (sel || fc * pxParM >= (nomLisible ? 5 : 6));
    if (!codeLisible && !nomLisible) continue;

    const c = sel ? " sel" : "";
    const hNom = nomLisible ? nom.lignes.length * nom.f * 1.18 : 0;
    const hCode = codeLisible ? fc * 1.25 : 0;
    let y = as[1] - (hNom + hCode) / 2;
    if (nomLisible){ out += lignesSvg(nom.lignes, nom.f, as[0], y + hNom / 2, "nm" + c); y += hNom; }
    if (codeLisible)
      out += ligneCode(s, as[0], y + fc * .92, fc, w * .9, c);
  }
  l.innerHTML = out;
}

/* ============================================================
   5. Recherche et secteurs — sans mot-clé ni secteur retenu on reste sur le
      pavillon affiché, dès qu'on filtre on balaie les trois

   On ne cherche qu'un exposant. Les zones organisateur — restauration,
   accueil, animations — ne se retiennent pas par leur nom : on les repère
   sur le plan à leur forme et à leur couleur, et le tiroir des calques les
   montre ou les cache. Elles ne paraissent donc plus dans la liste, ni sous
   mot-clé ni sans. Sur le plan, rien ne change : elles gardent leur libellé,
   leur fiche et leur programme.
   ============================================================ */
/* Les secteurs, et la teinte de chacun.

   Les teintes tournent sur une roue plutôt que de se tirer d'une palette
   nommée : un salon découpe en cinq secteurs, un autre en dix-huit, et une
   palette finie redonnerait deux fois la même couleur sans qu'on l'ait voulu.
   L'ordre est celui des noms, jamais celui des stands : le même secteur garde
   sa couleur d'un pavillon à l'autre, et d'une synchronisation à la suivante. */
const TEINTES = [212, 28, 145, 340, 262, 42, 190, 8, 100, 310, 172, 62];
let SECTEURS = new Map();

function indexeSecteurs(){
  const noms = [...new Set(DATA.plans.flatMap(p => p.stands.map(s => s.sect)))]
    .filter(Boolean).sort(COLLATION.compare);
  SECTEURS = new Map(noms.map((n, i) => [n, TEINTES[i % TEINTES.length]]));
}

/**
 * Les secteurs se montrent-ils ?
 *
 * Un salon qui ne sectorise pas n'a rien à montrer ; ailleurs c'est un réglage,
 * car un plan déjà réglé au blanc ou à la couleur maison de l'exploitant ne
 * doit pas se retrouver bariolé sans qu'il l'ait demandé.
 */
const secteursMontres = () => SECTEURS.size > 0 && conf("_secteurs").visible !== false;

/* La configuration voyage par la base et finit dans un attribut de style : on
   n'accepte d'elle que la forme hexadécimale, celle que rend le sélecteur. */
const couleurConf = v => /^#[0-9A-Fa-f]{3,8}$/.test(String(v || "")) ? String(v) : null;

/** Une teinte du cercle chromatique en hexadécimal, pour un sélecteur de
 *  couleur — qui ne connaît que cette notation. */
function hslHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 *
    (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return "#" + [f(0), f(8), f(4)]
    .map(v => v.toString(16).padStart(2, "0")).join("");
}

/**
 * La couleur d'un secteur, telle que le plan la montre.
 *
 * Celle que l'exploitant a choisie s'il l'a fait ; sinon la teinte automatique,
 * résolue dans le thème courant — c'est bien la couleur qu'on voit à l'écran
 * que le sélecteur doit présenter, et non celle d'un thème qu'on ne regarde
 * pas.
 */
function couleurSecteur(nom){
  return couleurConf(conf("secteur:" + nom).couleur) ||
    hslHex(SECTEURS.get(nom) || 0,
           parseFloat(jeton("--sect-s")) || 58, parseFloat(jeton("--sect-l")) || 87);
}

/* La bande des secteurs : légende du plan à gauche, filtre de la liste à
   droite, et c'est la même chose. Elle ne paraît que si le salon sectorise —
   ailleurs elle prendrait la place de deux lignes de résultats pour ne rien
   dire. */
function chipsSecteurs(){
  const b = $("secteurs");
  b.hidden = !secteursMontres();
  if (b.hidden) return;
  b.innerHTML = [...SECTEURS].map(([nom, h]) => {
    const c = couleurConf(conf("secteur:" + nom).couleur);
    return '<button class="chip" type="button" data-s="' + esc(nom) + '" aria-pressed="' +
      state.secteurs.has(nom) + '" style="--sect-h:' + h + (c ? ";--sect-c:" + c : "") +
      '"><i></i>' + esc(nom) + '</button>';
  }).join("");
  b.querySelectorAll(".chip").forEach(x => x.onclick = () => {
    const n = x.dataset.s;
    if (state.secteurs.has(n)) state.secteurs.delete(n); else state.secteurs.add(n);
    x.setAttribute("aria-pressed", state.secteurs.has(n));
    appliqueFiltre();
  });
}

/**
 * La teinte du secteur, posée sur le groupe du stand plutôt que sur son tracé :
 * la feuille de style la lit de là, et garde la main sur le survol et la
 * sélection, qui doivent l'emporter sur elle.
 */
function coloreSecteurs(){
  const on = secteursMontres();
  racine.classList.toggle("sans-secteurs", !on);
  document.querySelectorAll("#stands g").forEach(g => {
    const o = parId.get(g.dataset.id);
    const nom = on && o ? o.sect : null;
    const h = nom ? SECTEURS.get(nom) : undefined;
    if (h === undefined){
      g.removeAttribute("data-sect");
      g.style.removeProperty("--sect-h");
      g.style.removeProperty("--sect-c");
    } else {
      g.setAttribute("data-sect", "");
      g.style.setProperty("--sect-h", h);
      /* Une couleur choisie remplace la teinte au lieu de s'y ajouter : elle
         vaut pour les deux thèmes, comme celle des autres couches, et ne se
         laisse donc pas ternir par la clarté du thème courant. */
      const c = couleurConf(conf("secteur:" + nom).couleur);
      if (c) g.style.setProperty("--sect-c", c);
      else g.style.removeProperty("--sect-c");
    }
  });
}

/** La légende, les couleurs et le filtre suivent le même réglage : retirés du
 *  plan, ils ne doivent pas laisser derrière eux un filtre invisible qui
 *  continuerait de retrancher des stands de la liste. */
function appliqueSecteurs(){
  if (!secteursMontres()) state.secteurs.clear();
  chipsSecteurs();
  coloreSecteurs();
  // la bande fait partie de ce qui dépasse du tiroir replié : sa hauteur
  // change, et les commandes du plan se posent dessus
  mesureTiroir();
}

/**
 * Ce que la liste retient : une société répond pour elle-même, jamais pour son
 * voisin. Un secteur retenu porte, comme un mot-clé, sur tout le salon — un
 * exposant du secteur cherché peut être dans un autre pavillon que celui qu'on
 * regarde — et les deux se cumulent : le mot-clé cherche dans les secteurs
 * retenus, et non à côté d'eux.
 */
/* ------------------------------------------------------------
   Les critères de recherche

   Chercher par mot-clé suppose de savoir quoi taper. Un visiteur qui veut
   « les enseignes de restauration présentes en Auvergne-Rhône-Alpes » ne sait
   pas sous quel intitulé le salon range cela — mais l'exploitant, lui, le
   sait : il désigne depuis la console les champs qui font des critères, et
   c'est de la donnée elle-même que les valeurs proposées sont tirées.

   Rien n'est offert d'office. Un plan qui déplierait douze filtres sur un
   téléphone n'aurait plus de plan : les critères tiennent derrière un seul
   bouton, et ce qui est retenu se relit d'un coup d'œil sous la recherche.
   ------------------------------------------------------------ */
const PREFIXE_PERSO = "perso:";

/* Ce qu'un critère lit sur une fiche. Les champs propres au salon vivent dans
   « perso » ; les autres sont posés à plat, chacun sous le nom que la
   synchronisation lui donne — ce ne sont pas les mêmes que les cibles de la
   console, d'où cette table. */
const LECTURE_CRITERE = {
  ville: o => [o.ville],
  pays: o => [o.pays],
  nomenclature: o => o.nomencl,
  thematiques: o => o.themes,
  // un oui/non n'a qu'une valeur à cocher : le champ lui-même
  nouveau: o => o.neuf ? ["Oui"] : [],
};
const OUI_NON = { nouveau: true };
const LIBELLE_CRITERE = {
  ville: "Ville", pays: "Pays", nomenclature: "Nomenclature",
  thematiques: "Thématiques", nouveau: "Nouvel exposant",
};

/** Les champs retenus comme critères, dans l'ordre où la console les range. */
function clesCriteres(){
  const r = (DATA && DATA.fiche && DATA.fiche.criteres) || {};
  return Object.keys(r).filter(k => r[k] === true);
}

/** L'intitulé d'un critère : celui du salon pour un champ qu'il s'est ajouté. */
function libelleCritere(cle){
  if (cle.indexOf(PREFIXE_PERSO) !== 0) return LIBELLE_CRITERE[cle] || cle;
  const c = ((DATA && DATA.fiche && DATA.fiche.perso) || [])
    .find(x => x && PREFIXE_PERSO + x.cle === cle);
  return (c && c.libelle) || cle.slice(PREFIXE_PERSO.length);
}

/** Les valeurs d'une fiche pour un critère, toujours une liste de textes. */
function valeursCritere(o, cle){
  const brut = cle.indexOf(PREFIXE_PERSO) === 0
    ? (o.perso || {})[cle.slice(PREFIXE_PERSO.length)]
    : (LECTURE_CRITERE[cle] ? LECTURE_CRITERE[cle](o) : null);
  if (brut === null || brut === undefined || brut === "") return [];
  /* Une liste peut porter des trous — une société hébergée sans ville en a un
     là où les autres ont la leur — et « undefined » deviendrait une valeur à
     cocher si on la traduisait en texte avant de l'écarter. */
  return [].concat(brut).filter(v => v !== null && v !== undefined)
    .map(v => String(v).trim()).filter(Boolean);
}

/** Tout ce qu'une fiche porte de critères, pour la recherche plein texte. */
function texteCriteres(o){
  return clesCriteres().flatMap(c => valeursCritere(o, c)).join(" ");
}

/**
 * Les critères et leurs valeurs, relevés dans le salon entier.
 *
 * Les valeurs viennent des fiches, jamais d'une liste tenue à part : un filtre
 * qui proposerait une ville où personne n'expose ne rendrait que des listes
 * vides. Elles sont comptées, et rangées de la plus portée à la moins portée —
 * c'est l'ordre dans lequel on les cherche.
 */
let CRITERES = [];
function indexeCriteres(){
  const fiches = TOUS.filter(o => o.kind === "stand").concat(HEBERGES);
  CRITERES = clesCriteres().map(cle => {
    const n = new Map();
    fiches.forEach(o => valeursCritere(o, cle)
      .forEach(v => n.set(v, (n.get(v) || 0) + 1)));
    return {
      cle, libelle: libelleCritere(cle), ouiNon: OUI_NON[cle] === true,
      valeurs: [...n].sort((a, b) => (b[1] - a[1]) || COLLATION.compare(a[0], b[0]))
        .map(([v, k]) => ({ v, n: k })),
    };
  // un critère que rien ne renseigne ne s'offre pas : il ne rendrait rien
  }).filter(c => c.valeurs.length);
  /* Un critère retenu avant un rechargement peut avoir disparu du réglage, ou
     n'avoir plus aucune valeur : il resterait sinon à retrancher des fiches
     sans que rien ne le montre. */
  [...state.crit.keys()].forEach(k => {
    if (!CRITERES.some(c => c.cle === k)) state.crit.delete(k);
  });
  majCriteres();
}

/** Ce que la liste retient d'un critère : une valeur cochée suffit. */
function dansCriteres(o){
  for (const [cle, choisies] of state.crit){
    const v = valeursCritere(o, cle);
    if (!v.some(x => choisies.has(x))) return false;
  }
  return true;
}

const critereActif = (cle, v) => state.crit.has(cle) && state.crit.get(cle).has(v);

function basculeCritere(cle, v){
  const l = state.crit.get(cle) || new Set();
  if (l.has(v)) l.delete(v); else l.add(v);
  if (l.size) state.crit.set(cle, l); else state.crit.delete(cle);
  majCriteres();
  appliqueFiltre();
}

function videCriteres(){
  state.crit.clear();
  majCriteres();
  appliqueFiltre();
}

/** Le nombre de valeurs retenues, tous critères confondus. */
const nCriteres = () => [...state.crit.values()].reduce((a, l) => a + l.size, 0);

/**
 * La barre : le bouton qui ouvre les critères, et ce qui est retenu.
 *
 * Les valeurs retenues restent sous les yeux, chacune sur une puce qui la
 * retire d'une pression. Sans elles, on ne saurait plus pourquoi la liste est
 * si courte — et sur un téléphone, le panneau qui les porte est fermé.
 */
function majCriteres(){
  const btn = $("btnFiltres"), barre = $("actifs");
  if (!btn || !barre) return;
  btn.hidden = !CRITERES.length;
  const n = nCriteres();
  const jeton = $("nFiltres");
  jeton.hidden = !n;
  jeton.textContent = n;
  btn.setAttribute("aria-pressed", String(n > 0));

  barre.hidden = !n;
  barre.innerHTML = "";
  if (!n) { mesureTiroir(); return; }
  state.crit.forEach((valeurs, cle) => {
    const lib = libelleCritere(cle);
    valeurs.forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "actif";
      b.title = "Retirer ce critère";
      b.innerHTML = '<span class="k"></span><span class="v"></span>' +
        '<span class="x" aria-hidden="true">×</span>';
      b.querySelector(".k").textContent = lib;
      b.querySelector(".v").textContent = OUI_NON[cle] ? "" : v;
      b.setAttribute("aria-label", "Retirer le critère " + lib + " " + v);
      b.onclick = () => basculeCritere(cle, v);
      barre.appendChild(b);
    });
  });
  if (n > 1){
    const t = document.createElement("button");
    t.type = "button";
    t.className = "actif vider";
    t.textContent = "Tout effacer";
    t.onclick = videCriteres;
    barre.appendChild(t);
  }
  // la barre fait partie de ce qui dépasse du tiroir replié : sa hauteur change
  mesureTiroir();
}

/* Au-delà d'une douzaine de valeurs, on ne les parcourt plus des yeux : une
   ligne de saisie les tamise sur place. */
const VALEURS_TAMIS = 12;

/**
 * Le panneau des critères.
 *
 * Une fenêtre plutôt qu'un dépliant sous la recherche : sur un téléphone elle
 * occupe l'écran qu'il faut sans pousser la liste hors de vue, et le pouce y
 * atteint tout. Chaque groupe se replie une fois choisi — on ne règle pas
 * douze critères d'affilée — et le pied dit combien de fiches restent.
 */
function ouvreCriteres(){
  ouvreModale("Critères de recherche", corps => {
    const compte = document.createElement("p");
    compte.className = "compte-crit";
    const dis = () => {
      const n = TOUS.concat(HEBERGES).filter(o => o.kind !== "zone" && visible(o)).length;
      compte.textContent = n + (n > 1 ? " exposants retenus" : " exposant retenu");
    };

    CRITERES.forEach(c => {
      /* Un critère replié par défaut, sauf s'il est le seul et qu'il tient à
         l'écran : cent trente-neuf rubriques dépliées d'office repoussaient
         les autres critères et le pied de la fenêtre hors de vue, sur
         téléphone comme ailleurs. Le titre dit ce qui est retenu dedans, de
         sorte qu'un critère replié ne cache jamais un choix fait. */
      const g = document.createElement("details");
      g.className = "grp-crit";
      g.open = CRITERES.length === 1 && c.valeurs.length <= VALEURS_TAMIS;
      const h = document.createElement("summary");
      h.innerHTML = '<span class="t"></span><span class="r"></span>';
      h.querySelector(".t").textContent = c.libelle;
      const retenu = h.querySelector(".r");
      const disRetenu = () => {
        const n = (state.crit.get(c.cle) || new Set()).size;
        retenu.textContent = !n ? c.ouiNon ? "" : c.valeurs.length + " valeurs"
          : c.ouiNon ? "retenu" : n + " retenue" + (n > 1 ? "s" : "");
        retenu.dataset.on = String(n > 0);
      };
      disRetenu();
      g.appendChild(h);

      const puces = document.createElement("div");
      puces.className = "puces-crit";

      /* Un oui/non n'a pas de valeurs à choisir : il est lui-même la valeur,
         et deux puces « oui » et « non » diraient deux fois la même chose. */
      const offertes = c.ouiNon ? [c.valeurs[0]] : c.valeurs;

      const dessine = (tamis) => {
        puces.innerHTML = "";
        const t = (tamis || "").trim().toLowerCase();
        const vues = t ? offertes.filter(x => x.v.toLowerCase().includes(t)) : offertes;
        if (!vues.length){
          const vide = document.createElement("span");
          vide.className = "aucune";
          vide.textContent = "Aucune valeur ne correspond.";
          puces.appendChild(vide);
          return;
        }
        vues.forEach(x => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "puce-crit";
          b.setAttribute("aria-pressed", String(critereActif(c.cle, x.v)));
          b.innerHTML = '<span class="l"></span><span class="n"></span>';
          b.querySelector(".l").textContent = c.ouiNon ? c.libelle : x.v;
          b.querySelector(".n").textContent = x.n;
          b.onclick = () => {
            basculeCritere(c.cle, x.v);
            b.setAttribute("aria-pressed", String(critereActif(c.cle, x.v)));
            disRetenu();
            dis();
          };
          puces.appendChild(b);
        });
      };

      if (!c.ouiNon && offertes.length > VALEURS_TAMIS){
        const ch = document.createElement("input");
        ch.type = "search";
        ch.className = "tamis";
        ch.placeholder = "Filtrer " + c.libelle.toLowerCase() + "…";
        ch.autocomplete = "off";
        ch.oninput = () => dessine(ch.value);
        g.appendChild(ch);
      }
      dessine("");
      g.appendChild(puces);
      corps.appendChild(g);
    });

    dis();
    corps.appendChild(compte);
  }, [
    { libelle: "Tout effacer", action: videCriteres },
    { libelle: "Voir les résultats", genre: "primaire" },
  ]);
}

const dansSecteurs = o => !state.secteurs.size || state.secteurs.has(o.sect);

const filtre = () => Boolean(state.qn) || state.secteurs.size > 0 || state.crit.size > 0;

function visible(o){
  if (!filtre()) return true;
  if (o.kind === "zone") return false;
  return dansSecteurs(o) && dansCriteres(o) &&
    (!state.qn || (o.rech || "").includes(state.qn));
}

/* Les stands qu'une société hébergée éclaire. Le plan doit rester allumé sur
   le stand où l'on va la trouver, alors qu'il porte le nom d'un autre : c'est
   le seul endroit où une enseigne répond pour son hôte. Le relevé se refait à
   chaque changement de filtre, et non à chaque stand dessiné. */
let HOTES = new Set();
const releveHotes = () => {
  HOTES = new Set(HEBERGES.filter(visible).map(x => x.id));
};

/**
 * Ce que le plan garde allumé : ce que la liste retient, plus les stands qui
 * hébergent une société retenue.
 */
function visibleSurPlan(o){
  return visible(o) || (filtre() && o.kind === "stand" && HOTES.has(o.id));
}

function appliqueFiltre(){
  releveHotes();
  document.querySelectorAll("#stands g, #zones g").forEach(g => {
    const o = parId.get(g.dataset.id);
    g.classList.toggle("dim", !!o && !visibleSurPlan(o));
  });
  libelles(); liste();
}

function liste(){
  const box = $("list");
  const q = state.qn;
  // un secteur ou un critère retenu déborde le pavillon affiché, comme un mot-clé
  const tout = filtre();
  /* Les sociétés hébergées ne rejoignent la liste que sur recherche ou sur
     critère : on les y trouve par ce qu'elles portent, et un secteur n'est
     porté que par l'emplacement. Sans rien de tout cela, la liste est le
     sommaire des emplacements — et son compte, celui qu'annonce l'en-tête. */
  const portee = q || state.crit.size ? TOUS.concat(HEBERGES) : tout ? TOUS : P().stands;
  const vus = portee.filter(visible).sort((a, b) =>
    (a.p - b.p) ||
    ((a.nom ? 0 : 1) - (b.nom ? 0 : 1)) ||
    COLLATION.compare(String(a.nom || a.code || ""), String(b.nom || b.code || "")));

  $("countTxt").textContent = vus.length + (vus.length > 1 ? " résultats" : " résultat") +
    (tout ? " · tous pavillons" : " · " + P().libelle);

  box.innerHTML = vus.length ? vus.slice(0, 500).map(o => {
    const heberge = o.kind === "coex";
    /* Une société hébergée n'a pas de surface à elle : elle occupe celle d'un
       autre, et la lui prêter la dirait plus grande qu'elle n'est. Son numéro
       de stand et son nom la désignent, cela suffit. */
    const sous = heberge ? ""
      : o.m2 + " m²" + (o.angles ? " · " + o.angles + " angle" + (o.angles > 1 ? "s" : "") : "");
    const badge = o.p !== state.plan
      ? '<span class="hall">' + esc(DATA.plans[o.p].court) + '</span>' : "";
    const rang = heberge ? o.i : -1;
    return '<button class="row" data-id="' + o.id + '" data-soc="' + rang +
      '" aria-current="' + (state.sel === o.id && state.selSoc === rang) + '">' +
      '<span class="code">' + esc(o.code || "—") + '</span>' +
      '<span><span class="nm">' + esc(o.nom || o.plan || ("Stand " + (o.code || "")).trim()) + '</span>' +
      '<span class="s">' + sous + badge + '</span></span></button>';
  }).join("")
    : '<div class="empty">Aucun résultat dans les ' + DATA.plans.length + ' pavillons.</div>';
  /* Le canal dit d'où vient l'ouverture : la même liste sert de résultat de
     recherche quand un mot-clé est saisi, et de sommaire du pavillon sinon.

     Un rang part avec l'identifiant, et la fiche s'ouvre droit sur la société
     du rang cliqué : la liste vient de la nommer, redemander laquelle on veut
     serait une question dont on a déjà la réponse. */
  box.querySelectorAll(".row").forEach(b => b.onclick =
    () => select(b.dataset.id, true, q ? "recherche" : "liste", Number(b.dataset.soc)));
}

/* ============================================================
   6. Vue
   ============================================================ */
const appliqueVue = () => {
  svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
  if (typeof dessinePoignees === "function") dessinePoignees();
  // le trait de l'itinéraire garde son épaisseur ; ses pastilles, non
  if (typeof rafraichitBouts === "function") rafraichitBouts();
};
/* Rafraîchir la vue coûte deux choses de nature très différente. Poser le
   « viewBox » est immédiat. Recalculer les libellés parcourt les cinq cents
   objets du pavillon et mesure chaque texte pour décider s'il tient et s'il
   reste lisible : près de six millisecondes sur un poste de bureau, bien
   davantage sur un téléphone, là où une image n'en a que seize.

   Pendant un geste on ne fait donc que le premier, et une seule fois par
   image — un écran tactile échantillonne souvent deux fois plus vite qu'il
   n'affiche, et le travail était fait deux fois pour rien. Les libellés
   attendent : leur taille étant exprimée en mètres, ils grandissent avec le
   plan sans qu'on y touche. Seul leur tri par lisibilité patiente, jusqu'à la
   fin du geste ou une pause de la main. */
let imageDemandee = null, libellesEnAttente = null;

/** Pendant un geste : le strict nécessaire, une fois par image. */
function rafraichitVue(){
  if (!imageDemandee){
    imageDemandee = requestAnimationFrame(() => {
      imageDemandee = null;
      appliqueVue(); echelle();
    });
  }
  clearTimeout(libellesEnAttente);
  libellesEnAttente = setTimeout(() => { libellesEnAttente = null; libelles(); }, 150);
}

/** À la fin d'un geste, ou pour un saut de vue : tout, sans attendre. */
function poseVue(){
  if (imageDemandee){ cancelAnimationFrame(imageDemandee); imageDemandee = null; }
  clearTimeout(libellesEnAttente); libellesEnAttente = null;
  appliqueVue(); echelle(); libelles();
}

/**
 * Hauteur, en pixels, de ce que le tiroir ou la fiche cachent en bas du plan.
 *
 * Le cadre du plan occupe tout l'écran sur mobile, mais on n'en voit pas tout :
 * cadrer sur le cadre entier pousse une partie du plan sous le tiroir. Toute
 * mise en vue passe donc par cette mesure — l'ajustement comme le centrage sur
 * un stand, y compris celui déclenché par le cartouche des points d'intérêt.
 *
 * On raisonne sur les hauteurs au repos, jamais sur la position d'un élément en
 * cours de glissement : `offsetHeight` ignore la transformation, et la fiche
 * qui s'ouvre replie le tiroir sous elle.
 */
function masque(){
  if (!ETROIT()) return 0;
  const r = svg.getBoundingClientRect();
  const fiche = $("detail"), tiroir = $("side");
  const ficheOuverte = !!fiche && fiche.classList.contains("open");
  let bas = ficheOuverte ? fiche.offsetHeight : 0;
  /* L'itinéraire occupe la même bande, et c'est en l'ouvrant qu'on demande à
     cadrer sur le trajet : l'oublier ici reviendrait à le tracer sous lui. */
  const iti = $("itineraire");
  if (iti && iti.classList.contains("open")) bas = Math.max(bas, iti.offsetHeight);
  if (tiroir){
    bas = Math.max(bas, ficheOuverte
      ? parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--replie")) || 164
      : r.bottom - tiroir.getBoundingClientRect().top);
  }
  // au-delà, il ne resterait plus assez de plan pour que le cadrage ait un sens
  return Math.max(0, Math.min(r.height * .6, bas));
}

function fit(){
  const r = svg.getBoundingClientRect();
  const cache = masque();
  const hUtile = Math.max(60, r.height - cache);
  const w = emp.x1 - emp.x0, h = emp.y1 - emp.y0;
  const k = Math.max(w / (r.width || 1), h / hUtile);
  view = { x: emp.x0 + w / 2 - (k * r.width) / 2,
           // le plan se centre dans la bande visible, pas dans le cadre entier
           y: emp.y0 + h / 2 - (k * r.height) / 2 + (k * cache) / 2,
           w: k * r.width, h: k * r.height };
  poseVue();
}
function zoom(f, cx, cy){
  const nw = Math.min((emp.x1 - emp.x0) * 2.5, Math.max(6, view.w * f)), k = nw / view.w;
  view = { x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k, w: nw, h: view.h * k };
  rafraichitVue();
}
function echelle(){
  const r = svg.getBoundingClientRect();
  const mParPx = view.w / (r.width || 1);
  const pas = [1, 2, 5, 10, 20, 50, 100, 200].find(p => p >= mParPx * 90) || 200;
  $("scaleBar").style.width = (pas / mParPx) + "px";
  $("scaleTxt").textContent = pas + " m";
}

/* ============================================================
   7. Sélection et fiche
   ============================================================ */
const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null;
/** Écran étroit : la liste et la fiche sont des tiroirs, pas des panneaux. */
const ETROIT = () => matchMedia("(max-width:900px)").matches;

function anime(rect, sens){
  const p = $("detail");
  if (anim){ anim.cancel(); anim = null; }
  /* Sur mobile la fiche glisse depuis le bas : une mise à l'échelle depuis la
     forme cliquée se battrait avec ce glissement. La transition CSS suffit. */
  if (REDUIT || !rect || ETROIT()){ if (sens < 0) p.classList.remove("open"); return; }
  const b = p.getBoundingClientRect();
  p.style.transformOrigin = (rect.left + rect.width / 2 - b.left) + "px " +
                            (rect.top + rect.height / 2 - b.top) + "px";
  const seed = { transform: "scale(" + Math.max(.05, rect.width / b.width) + "," +
                            Math.max(.03, rect.height / b.height) + ")", opacity: 0 };
  const plein = { transform: "none", opacity: 1 };
  anim = p.animate(sens > 0 ? [seed, plein] : [plein, seed],
    { duration: sens > 0 ? 340 : 200,
      easing: sens > 0 ? "cubic-bezier(.16,.84,.3,1)" : "cubic-bezier(.4,0,.75,.2)" });
  if (sens < 0) anim.finished.then(() => p.classList.remove("open"), () => {});
}
const noeud = id => svg.querySelector('[data-id="' + CSS.escape(id) + '"]');

/* Deux façons d'atteindre un stand depuis le plan : sa forme, ou le logo que
   l'exploitant a posé dessus. Seule la seconde porte un identifiant de forme
   dessinée — c'est ce qui les sépare. */
const canalPlan = (cible) => cible && cible.dataset.f ? "image" : "plan";

/**
 * `iSoc` désigne la société qu'on vient voir sur un stand partagé. Absent, la
 * fiche demandera laquelle : c'est le cas d'un clic sur le plan, où l'on a
 * désigné une forme et non un nom. La liste, elle, le passe — elle vient de
 * nommer celle qu'on a choisie.
 */
function select(id, recentrer, canal, iSoc){
  const o = parId.get(id);
  if (!o) return;
  if (o.p !== state.plan){          // l'objet vit dans un autre pavillon
    state.plan = o.p; montePlan(); fit();
  }
  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  state.sel = id;
  state.selSoc = iSoc === undefined ? -1 : iSoc;
  const n = noeud(id); if (n) n.classList.add("sel");
  dessineMarques();
  if (recentrer && !ETROIT()) centre(o);
  liste(); libelles();
  ouvre(o, n ? n.getBoundingClientRect() : null, canal, iSoc);
  /* Sur mobile on ne cadre qu'une fois la fiche ouverte : c'est elle qui
     décide de la hauteur masquée, et la mesurer avant reviendrait à cadrer
     sur une géométrie déjà périmée. Sur grand écran l'ordre inverse tient,
     car l'animation de la fiche part de la forme telle qu'elle est cadrée. */
  if (recentrer && ETROIT()) centre(o);
}
const centre = (o) => centrePoint(o.c);

/* Un repère n'est pas un objet du plan et n'a pas de centre à lui : il n'a
   qu'un point. C'est tout ce qu'il faut pour cadrer. */
function centrePoint(xy){
  const w = Math.min(view.w, 55), h = w * (view.h / view.w);
  /* Centrer au milieu du cadre placerait la cible derrière le tiroir ou la
     fiche. On la remonte au milieu de ce qui reste visible — d'après la
     hauteur réellement masquée, et non une proportion supposée. */
  const r = svg.getBoundingClientRect();
  const decale = r.height ? (h * masque()) / (2 * r.height) : 0;
  view = { x: xy[0] - w / 2, y: xy[1] - h / 2 + decale, w: w, h: h };
  poseVue();
}
/**
 * Un champ paraît-il sur la fiche ? L'exploitant en décide depuis la console.
 * Une entrée absente vaut « affiché », pour qu'un champ ajouté plus tard ne
 * disparaisse pas des salons déjà réglés.
 */
function montre(type, cle){
  const r = DATA && DATA.fiche && DATA.fiche[type];
  return !r || r[cle] !== false;
}

/**
 * Le programme d'une zone, en vignettes chronologiques.
 *
 * L'heure vient d'Eventmaker sous sa forme locale — « 03/14/2026 10:30 » — ce
 * qui évite de deviner le fuseau du salon depuis le navigateur d'un visiteur
 * qui peut être ailleurs. On la relit telle quelle plutôt que d'en faire une
 * date, dont le rendu dépendrait justement du fuseau.
 */
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
              "août", "septembre", "octobre", "novembre", "décembre"];

/**
 * L'heure d'une conférence, dans le fuseau du salon.
 *
 * Eventmaker donne deux formes. « 03/14/2026 10:30 » est l'heure locale du
 * salon : on la relit telle quelle, c'est la seule qui ne demande rien. La
 * forme ISO, elle, porte un décalage — souvent Z — qu'il faut ramener au
 * fuseau de l'événement, sans quoi un visiteur d'un autre pays lirait des
 * horaires faux.
 */
function momentLocal(v, fuseau){
  const t = String(v || "");
  const m = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/.exec(t);
  if (m){
    return { jour: +m[2], mois: +m[1], an: +m[3], h: m[4].padStart(2, "0"), min: m[5],
             cle: m[3] + m[1] + m[2] };
  }
  const d = new Date(t);
  if (isNaN(d)) return null;
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", {
      timeZone: fuseau || undefined, year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(d).map(x => [x.type, x.value]));
    return { jour: +p.day, mois: +p.month, an: +p.year,
             h: String(p.hour).padStart(2, "0"), min: p.minute,
             cle: p.year + p.month + p.day };
  } catch (e) {
    return null;   // fuseau inconnu : mieux vaut taire l'heure que la fausser
  }
}

/** Le programme d'une zone, ou celui d'un exposant : la même liste, rendue. */
function programme(l, titre){
  l = l || [];
  if (!l.length) return "";
  let out = '<div class="field"><span class="eyebrow">' + esc(titre || "Programme") +
    '</span><div class="prog">';
  let jourCourant = null;
  for (const c of l){
    const fz = DATA.fuseau;
    const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
    const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);
    if (d && d.cle !== jourCourant){
      jourCourant = d.cle;
      const dt = new Date(d.an, d.mois - 1, d.jour);
      out += '<div class="jour">' + esc(JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1]) + '</div>';
    }
    const heure = d ? d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "") : "";
    /* Le signet se pose à côté de la vignette et non dedans : un bouton n'en
       contient pas un autre, et l'appui doit choisir entre lire et retenir. */
    out += '<div class="confRang">' +
      '<button type="button" class="conf" data-conf="' + esc(c.id) + '"' +
      (c.couleur ? ' style="--tc:' + esc(c.couleur) + '"' : "") + '>' +
      (heure ? '<span class="h">' + esc(heure) + '</span>' : "") +
      '<span class="t">' + esc(c.nom) + '</span>' +
      (c.type ? '<span class="ty">' + esc(c.type) + '</span>' : "") +
      '</button>' + signetParcours("conf", c.id) + '</div>';
  }
  return out + '</div></div>';
}

/** Une date écrite en toutes lettres : « samedi 14 mars 2026 ». */
function jourLong(d){
  if (!d) return "";
  const dt = new Date(d.an, d.mois - 1, d.jour);
  return JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1] + " " + d.an;
}

/**
 * La fiche d'une conférence. Le programme d'une zone ne montre que l'essentiel
 * — l'heure et le titre — parce qu'il en aligne parfois vingt ; le reste,
 * description comprise, tient ici.
 */
function ficheConf(id, canal){
  // l'index est global : une conférence retenue peut se tenir dans un autre
  // pavillon que celui qu'on regarde
  const c = CONFS.get(String(id));
  if (!c) return;
  mesure("fiche_conf", canal, String(id));
  const fz = DATA.fuseau;
  const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
  const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);

  ouvreModale(c.nom, corps => {
    const bloc = (l, v, cls) => {
      if (!v) return;
      const w = document.createElement("div");
      w.className = "field" + (cls ? " " + cls : "");
      w.innerHTML = '<span class="eyebrow"></span><span class="v"></span>';
      w.querySelector(".eyebrow").textContent = l;
      w.querySelector(".v").textContent = v;
      corps.appendChild(w);
    };
    if (c.type){
      const t = document.createElement("div");
      t.className = "conf-type";
      if (c.couleur) t.style.setProperty("--tc", c.couleur);
      t.textContent = c.type;
      corps.appendChild(t);
    }
    bloc("Quand", d
      ? jourLong(d) + " · " + d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "")
      : "");
    bloc("Où", c.salle);
    /* Qui la tient, et où le trouver : le numéro de stand situe l'exposant et
       sa fiche s'ouvre d'un appui — c'est souvent pour lui qu'on lisait le
       programme. Ils peuvent être plusieurs, y compris depuis deux pavillons,
       d'où la liste plutôt qu'une ligne. */
    const tenue = (EXPOSANTS.get(String(id)) || [])
      .map(e => ({ e: e, o: parId.get(e.stand) }))
      .filter(x => x.o || x.e.nom);
    if (tenue.length){
      const w = document.createElement("div");
      w.className = "field";
      w.innerHTML = '<span class="eyebrow"></span><div class="expos"></div>';
      w.querySelector(".eyebrow").textContent = "Organisée par";
      const hote = w.querySelector(".expos");
      tenue.forEach(x => {
        const o = x.o;
        const code = o && montre("stand", "code") && o.code ? o.code : "";
        // le pavillon n'apprend rien tant que c'est celui qu'on regarde
        const ou = [o && o.p !== state.plan ? DATA.plans[o.p].libelle : "", code]
          .filter(Boolean).join(" · ");
        // un stand absent du plan — filtré, ou d'un pavillon non publié — se
        // lit quand même, il ne se clique pas
        const el = document.createElement(o ? "button" : "div");
        el.className = "expo" + (o ? "" : " statique");
        if (o) el.type = "button";
        el.innerHTML = '<span class="n"></span><span class="c"></span>';
        el.querySelector(".n").textContent =
          (o && (o.nom || o.plan)) || x.e.nom || ("Stand " + code).trim();
        el.querySelector(".c").textContent = ou;
        /* La fiche de l'exposant prend la place de celle de la conférence, et
           le plan se recentre sur son stand — au besoin en changeant de
           pavillon, ce dont `select` se charge. */
        if (o) el.onclick = () => { fermeModale(); select(o.id, true, "conference"); };
        hote.appendChild(el);
      });
      corps.appendChild(w);
    }
    bloc("Thématique", c.theme);
    bloc("Présentation", c.texte, "large");
    const acts = document.createElement("div");
    acts.className = "acts";
    acts.innerHTML = boutonParcours("conf", c.id);
    /* « Où » nomme la salle ; encore faut-il la trouver. La zone qui l'abrite
       est le seul point du plan que la conférence désigne — et elle peut se
       tenir dans un autre pavillon que celui qu'on regarde. */
    if (c.zone && parId.has(String(c.zone))){
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = "Situer sur le plan";
      b.onclick = () => { fermeModale(); select(String(c.zone), true); };
      acts.appendChild(b);
    }
    corps.appendChild(acts);
    brancheParcours(corps);
  }, [{ libelle: "Fermer", genre: "primaire" }]);
}

/**
 * Une adresse en lien cliquable, affichée sans son protocole.
 *
 * Les champs de réseaux sociaux sont saisis à la main : tantôt une adresse
 * complète, tantôt un simple nom de compte. On complète ce qui manque plutôt
 * que d'afficher un lien mort.
 */
function lien(v){
  let u = String(v == null ? "" : v).trim().replace(/\\/g, "");
  if (!u) return "";
  if (!/^https?:/i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' +
         esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, "")) + '</a>';
}

/* Un appui tactile produit, quelque trois cents millisecondes plus tard, un
   clic de compatibilité aux mêmes coordonnées. La fiche venant d'apparaître
   sous le doigt, ce clic fantôme la refermait aussitôt — d'où l'impression
   d'un double clic — ou suivait un lien qu'elle contient. On la rend
   insensible le temps qu'il passe, et seulement après un appui : à la souris,
   rien ne justifierait ce temps mort. */
let dernierAppuiTactile = false;
let degel = null;

function ecarteClicFantome(){
  if (!dernierAppuiTactile) return;
  const zones = [$("detail"), $("voile"), $("modale")].filter(Boolean);
  zones.forEach(z => { z.style.pointerEvents = "none"; });
  clearTimeout(degel);
  degel = setTimeout(() => zones.forEach(z => { z.style.pointerEvents = ""; }), 450);
}

/** Le nom sous lequel une société se présente sur un stand. */
const nomSociete = (x) => x.nom || x.plan || "Sans nom";

/**
 * Les sociétés d'un stand, celle qui le loue en tête.
 *
 * Elle est le stand lui-même : c'est son dossier qui l'a désignée à la
 * synchronisation, et ses champs sont posés à plat sur lui. Les autres vivent
 * dans « coex », dans l'ordre où la source les a rendues.
 *
 * Le rang les distingue, la liste ne le dit pas : qui loue et qui est hébergé
 * relève du contrat entre l'organisateur et ses exposants. Un visiteur cherche
 * une enseigne, pas sa place dans un bail.
 */
function societes(o){
  return [{ soc: o, i: -1 }].concat((o.coex || []).map((x, i) => ({ soc: x, i: i })));
}

/**
 * Le choix, quand plusieurs sociétés se partagent un stand.
 *
 * Ouvrir d'office la fiche du titulaire donnerait le stand à lui seul,
 * alors qu'un stand de restauration en héberge jusqu'à onze. On demande donc
 * qui l'on vient voir, plutôt que de le supposer.
 */
function choisitExposant(o, rect, canal){
  const tous = societes(o);
  ouvreModale(("Stand " + (o.code || "")).trim(), corps => {
    const p = document.createElement("p");
    p.textContent = tous.length + " sociétés occupent ce stand.";
    const ul = document.createElement("ul");
    ul.className = "expos";
    tous.forEach(x => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const n = document.createElement("span");
      n.className = "nom";
      n.textContent = nomSociete(x.soc);
      b.appendChild(n);
      b.onclick = () => {
        fermeModale();
        // la liste marque la société ouverte, d'où qu'on l'ait choisie ; le
        // plan, lui, ne bouge pas — il nomme le titulaire quoi qu'on lise
        state.selSoc = x.i; liste();
        ouvre(o, rect, canal, x.i);
      };
      li.appendChild(b);
      ul.appendChild(li);
    });
    corps.appendChild(p); corps.appendChild(ul);
  }, [{ libelle: "Fermer" }]);
  ecarteClicFantome();
}

/**
 * La fiche d'un stand ou d'une zone.
 *
 * `iSoc` désigne la société regardée sur un stand partagé : absent, on demande
 * laquelle ; -1, le titulaire ; sinon le rang du co-exposant. L'emplacement,
 * lui, ne change pas — c'est le même stand qu'on regarde par deux entrées.
 */
function ouvre(o, rect, canal, iSoc){
  const zone = o.kind === "zone";
  const heberges = (!zone && o.coex) || [];
  if (heberges.length && iSoc === undefined){ choisitExposant(o, rect, canal); return; }
  /* Un stand sans co-exposant n'a pas de rang à passer : il n'en a qu'un, et
     c'est le titulaire. Le ramener ici évite d'avoir à distinguer « absent »
     de « titulaire » dans tout ce qui suit. */
  const iS = iSoc === undefined ? -1 : iSoc;
  /* La société affichée. Le titulaire porte ses champs à plat sur le stand :
     c'est le stand lui-même qui fait office de fiche. */
  const soc = iS >= 0 ? heberges[iS] : o;
  // la fiche, le parcours et l'itinéraire se partagent la même bande, à
  // droite comme en bas
  fermeParcours(); fermeItineraire();
  const t = zone ? "zone" : "stand";
  const ok = (cle, v) => montre(t, cle) ? v : "";
  // « Zone organisateur » n'apprenait rien : la forme et la couleur le disent
  $("dKind").textContent = zone ? "" : "Stand";
  $("dKind").hidden = zone;
  const titre = soc.nom || soc.plan ||
    (zone ? "Zone sans nom" : ("Stand " + (o.code || "")).trim());
  $("dName").textContent = titre;
  const pl = DATA.plans[o.p] || P();
  $("dCode").textContent = pl.libelle +
    (ok("code", o.code) ? " · " + o.code : "");
  /* De quoi revenir au choix sans refermer la fiche : sur un stand partagé, on
     compare souvent deux enseignes voisines. */
  const part = $("dPartage");
  part.hidden = !heberges.length;
  if (heberges.length){
    part.textContent = (heberges.length + 1) + " exposants ici";
    part.onclick = () => choisitExposant(o, null, canal);
  }
  /* La pastille des nouveaux venus. Elle ne paraît que si la synchronisation
     l'a posée — le champ qui la porte n'existe pas sur tous les salons — et
     que l'exploitant la laisse voir. Une zone organisateur n'est jamais
     nouvelle : elle n'est pas un exposant. */
  $("dNeuf").hidden = zone || !soc.neuf || !montre("stand", "nouveau");
  /* La classe « court » marque les champs qui tiennent en un mot : sur mobile
     ils se rangent deux par deux au lieu d'allonger la fiche d'autant de
     lignes. */
  const f = (l, v, cls) => v ? '<div class="field' + (cls ? " " + cls : "") +
                          '"><span class="eyebrow">' + l +
                          '</span><span class="v">' + v + '</span></div>' : "";
  // sur une zone, le programme qu'elle accueille ; sur un stand, les
  // conférences que son exposant tient, où qu'elles se tiennent
  /* Le programme est rattaché au stand par le dossier de son titulaire : la
     source ne dit pas quelle conférence revient à une société hébergée, et la
     lui prêter serait une invention. */
  const sien = (!zone && iS < 0 && pl.parStand && pl.parStand.get(o.id)) || [];
  const confs = ok("conferences", zone
    ? programme(P().parZone && P().parZone.get(o.id))
    : programme(sien, "Conférences"));
  // ni la surface, ni les angles ouverts, ni l'état de commercialisation
  // n'apprennent quoi que ce soit au visiteur
  const infos =
    // la raison sociale n'apprend rien quand elle est déjà le titre
    ok("raison", !zone && soc.plan && soc.plan !== titre ? f("Raison sociale", esc(soc.plan)) : "") +
    /* Le secteur décrit l'emplacement, pas son occupant : il reste au stand,
       quelle que soit la société qu'on y regarde. Son libellé est résolu à la
       synchronisation, la page l'affiche tel quel. */
    ok("secteur", f("Secteur", o.sect ? esc(o.sect) : "")) +
    ok("adresse", f("Adresse", soc.adr ? esc(soc.adr) : "")) +
    /* Les quatre champs courts se suivent : sur mobile ils s'apparient deux
       par deux, et un ordre entrecoupé y laisserait des demi-lignes vides. */
    ok("ville", f("Ville", soc.ville ? esc(soc.ville) : "", "court")) +
    ok("pays", f("Pays", soc.pays ? esc(soc.pays) : "", "court")) +
    /* Les niveaux décrivent l'emplacement, pas son occupant : ils restent au
       stand, quelle que soit la société qu'on y regarde. */
    ok("niveaux", f("Niveaux", o.niveaux > 1 ? String(o.niveaux) : "", "court")) +
    // le téléphone reste appelable d'un mobile, où le plan est le plus consulté
    ok("telephone", f("Téléphone", soc.tel
      ? '<a href="tel:' + esc(String(soc.tel).replace(/[^+\d]/g, "")) + '">' + esc(soc.tel) + '</a>'
      : "", "court")) +
    ok("site", f("Site web", lien(soc.site))) +
    ok("facebook", f("Facebook", lien(soc.fb))) +
    ok("linkedin", f("LinkedIn", lien(soc.li))) +
    ok("instagram", f("Instagram", lien(soc.ig))) +
    // le libellé est résolu à la synchronisation : la page l'affiche tel quel
    ok("nomenclature", soc.nomencl && soc.nomencl.length
      ? f("Nomenclature", soc.nomencl
          .map(n => '<span class="ligne">' + esc(String(n)) + '</span>').join(""))
      : "") +
    /* Les thématiques disent ce que l'exposant vient faire là, quand la
       nomenclature dit ce qu'il vend : elles se suivent, et un salon qui n'en
       tient pas ne reçoit pas la clé du tout. */
    ok("thematiques", soc.themes && soc.themes.length
      ? f("Thématiques", soc.themes
          .map(n => '<span class="ligne">' + esc(String(n)) + '</span>').join(""))
      : "") +
    /* Les champs que ce salon-ci s'est ajoutés, dans l'ordre où la console les
       range, et après ce que toutes les fiches ont en commun : ils lui sont
       propres, ils ne passent pas devant l'adresse. */
    ((!zone && DATA.fiche && DATA.fiche.perso) || []).map(c => {
      const v = ((soc.perso || {})[c.cle]);
      if (v === undefined || v === null || v === "") return "";
      const l = [].concat(v).map(String).filter(Boolean);
      if (!l.length) return "";
      return ok(PREFIXE_PERSO + c.cle, f(esc(c.libelle), l.length > 1
        ? l.map(x => '<span class="ligne">' + esc(x) + '</span>').join("")
        : esc(l[0])));
    }).join("");
  /* Un stand se lit dans cet ordre : qui est l'exposant, puis ce qu'il
     anime — ses conférences peuvent être nombreuses, et repoussaient
     l'adresse et les contacts hors de l'écran. Une zone, elle, n'a rien à
     dire d'autre que son programme : il reste en tête. */
  const bloc2 = (cls, id, h) =>
    '<div class="' + cls + '" id="' + id + '" role="tabpanel">' + h + '</div>';
  /* Ce qu'est l'exposant et ce qu'il anime se partagent la fiche dès qu'il y
     a les deux — un stand sans conférence n'a rien à mettre en face, une zone
     n'a pas de fiche. La largeur décide ensuite de la forme : deux colonnes
     au large, deux onglets à l'étroit. */
  const partage = !zone && !!confs && !!infos;
  $("detail").classList.toggle("deux", partage);
  $("dOnglets").hidden = !partage;
  $("dOngNb").textContent = partage && sien.length ? sien.length : "";
  // une fiche s'ouvre sur le détail : c'est ce qu'on est venu y lire
  onglet("detail");
  $("dBody").innerHTML = (zone
      ? bloc2("cConf", "dPaneConf", confs) + bloc2("cInfos", "dPaneInfos", infos)
      : bloc2("cInfos", "dPaneInfos", infos) + bloc2("cConf", "dPaneConf", confs)) +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  /* Une conférence ouverte d'ici vient soit du programme d'une salle, soit
     de la fiche de l'exposant qui la tient : ce n'est pas le même chemin. */
  const canalConf = zone ? "salle" : "exposant";
  $("dBody").querySelectorAll("[data-conf]").forEach(b =>
    b.onclick = () => ficheConf(b.dataset.conf, canalConf));
  /* Le signet du parcours vit en haut, à côté de la croix : retenir un
     exposant porte sur la fiche entière. Une zone organisateur ne se retient
     pas elle-même — ce sont ses conférences qu'on ajoute, chacune à son heure. */
  const sig = $("dMarque");
  sig.hidden = zone;
  if (zone) { delete sig.dataset.mg; delete sig.dataset.mi; }
  else { sig.dataset.mg = "stand"; sig.dataset.mi = o.id; }
  // un seul branchement pour le signet de tête et ceux du programme
  brancheParcours($("detail"));
  $("dGo").onclick = () => centre(o);
  // « j'y vais » : l'arrivée est celle qu'on lit, le départ reste à dire
  $("dItin").onclick = () => versItineraire(o);
  // le crayon vit dans l'en-tête, à côté du nom, et non parmi les actions
  const cr = $("dRen");
  if (cr){
    cr.hidden = !(ADMIN && zone);
    cr.onclick = () => renommeZone(o);
  }
  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  anime(rect, 1);
  // une zone organisateur n'est pas un exposant : elle ne compte pas ici
  if (!zone) mesure("fiche_stand", canal, o.id);
}

/* ============================================================
   8. Interactions du plan
   ============================================================ */
let drag = null;

/* ------------------------------------------------------------------
   Pincement à deux doigts.

   Le plan interdit au navigateur de gérer le toucher — « touch-action: none »
   — parce qu'il déplace la vue lui-même. Il lui revient donc aussi de gérer le
   pincement, sinon il n'existe pas : c'est ce qui manquait sur téléphone.

   On garde le point du plan qui était sous le milieu des deux doigts, et on
   le maintient dessous. L'écartement donne l'échelle, le déplacement du milieu
   donne la translation : les deux gestes se font d'un seul mouvement, comme on
   s'y attend.
   ------------------------------------------------------------------ */
const doigts = new Map();
let pince = null;

const milieu = () => {
  const l = [...doigts.values()];
  return { x: (l[0].x + l[1].x) / 2, y: (l[0].y + l[1].y) / 2,
           d: Math.hypot(l[0].x - l[1].x, l[0].y - l[1].y) };
};

function commencePince(){
  const m = milieu();
  const r = svg.getBoundingClientRect();
  pince = {
    d: Math.max(1, m.d),
    w: view.w, h: view.h,
    // le point du plan sous le milieu, celui qui ne doit pas bouger
    ancre: [view.x + (m.x - r.left) / r.width * view.w,
            view.y + (m.y - r.top) / r.height * view.h],
  };
  drag = null;
  svg.classList.remove("dragging");
}

function suitPince(){
  const m = milieu();
  const r = svg.getBoundingClientRect();
  const large = emp ? (emp.x1 - emp.x0) * 2.5 : pince.w * 8;
  const nw = Math.min(large, Math.max(6, pince.w * pince.d / Math.max(1, m.d)));
  const nh = pince.h * (nw / pince.w);
  view = {
    x: pince.ancre[0] - (m.x - r.left) / r.width * nw,
    y: pince.ancre[1] - (m.y - r.top) / r.height * nh,
    w: nw, h: nh,
  };
  rafraichitVue();
}

svg.addEventListener("pointerdown", e => {
  dernierAppuiTactile = e.pointerType === "touch" || e.pointerType === "pen";
  /* Un « pointerup » se perd parfois — la main sort de l'écran, le navigateur
     passe la main à un geste système. Le doigt restait alors inscrit, et
     l'appui suivant passait pour le second d'un pincement : plus rien ne
     répondait. Le premier doigt d'un geste ouvre donc une table vierge. */
  if (e.isPrimary) doigts.clear();
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 2){ commencePince(); return; }
  if (doigts.size > 2) return;
  if (dessinPointerDown(e)) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, bouge: false,
           cible: e.target.closest("[data-id],[data-poi]") };
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (doigts.has(e.pointerId)) doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pince && doigts.size >= 2){ e.preventDefault(); suitPince(); return; }
  if (dessinPointerMove(e)) return;
  if (!drag) return;
  const r = svg.getBoundingClientRect(), k = view.w / r.width;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.bouge = true;
  view.x = drag.vx - dx; view.y = drag.vy - dy; rafraichitVue();
});
/* La capture de pointeur redirige le clic vers le <svg> : on retient la cible
   au pointerdown et on tranche au pointerup. */
svg.addEventListener("pointerup", e => {
  doigts.delete(e.pointerId);
  // un doigt levé met fin au pincement ; celui qui reste ne reprend pas la
  // main sur le déplacement, sans quoi la vue sauterait
  if (pince){ if (doigts.size < 2){ pince = null; drag = null; poseVue(); } return; }
  if (dessinPointerUp(e)) return;
  const d = drag; drag = null; svg.classList.remove("dragging");
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  if (d && d.bouge){ poseVue(); return; }
  if (!d) return;
  /* Une visée d'itinéraire en cours prend le clic avant la fiche : c'est un
     point qu'on désigne, pas un exposant qu'on veut lire. */
  if (d.cible){
    /* Un repère n'est pas un objet du plan : il n'a pas de fiche d'exposant,
       mais il a un nom, et c'est ce qu'on vient lui demander. */
    if (!d.cible.dataset.id){
      if (visePoi(d.cible.dataset.poi)) return;
      ouvrePoi(d.cible.dataset.poi, d.cible.getBoundingClientRect());
      return;
    }
    if (viseItineraire(d.cible.dataset.id)) return;
    select(d.cible.dataset.id, false, canalPlan(d.cible));
  } else { ferme(); finVisee(); }
});
svg.addEventListener("pointercancel", e => {
  doigts.delete(e.pointerId);
  if (doigts.size < 2) pince = null;
  drag = null;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoom(e.deltaY > 0 ? 1.18 : .85,
       view.x + (e.clientX - r.left) / r.width * view.w,
       view.y + (e.clientY - r.top) / r.height * view.h);
}, { passive: false });
svg.addEventListener("keydown", e => {
  const g = e.target.closest("[data-id],[data-poi]");
  if (g && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    // le plan se parcourt aussi au clavier : la visée doit y répondre pareil
    if (!g.dataset.id){
      if (!visePoi(g.dataset.poi)) ouvrePoi(g.dataset.poi, g.getBoundingClientRect());
      return;
    }
    if (!viseItineraire(g.dataset.id)) select(g.dataset.id, false, canalPlan(g));
  }
});
document.addEventListener("keydown", e => {
  const saisie = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (ADMIN && !saisie && (e.ctrlKey || e.metaKey)){
    const t = e.key.toLowerCase();
    if (t === "z" && !e.shiftKey){ e.preventDefault(); annule(); return; }
    if (t === "y" || (t === "z" && e.shiftKey)){ e.preventDefault(); refais(); return; }
  }
  if (ADMIN && !saisie && (e.key === "Delete" || e.key === "Backspace") && formeSel){
    e.preventDefault(); supprimeForme(); return;
  }
  if (e.key === "Escape"){
    if (enCours){ termineTrace(false); return; }
    if (formeSel){ choisitForme(null); return; }
    if (calqueActif){ activeCalque(calqueActif); return; }
    ferme();
    if ($("panel")) $("panel").classList.remove("open");
  }
  if (e.key === "Enter" && e.target.id !== "q" && e.target.id !== "texteADessiner") termineTrace(true);
});
