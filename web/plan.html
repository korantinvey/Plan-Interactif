 *  même repère, les deux pictogrammes n'en faisant plus qu'un. */
function portesDe(p){
  return reperesDe(p).filter(f => pictoForme(f) === "entree");
}

/** Le meilleur tronçon entre un point et l'une des portes du pavillon. */
function versPorte(p, pmr, xy, entrant, chez){
  const portes = portesDe(p);
  if (!portes.length) return null;
  /* Le plus court se juge à l'arrivée, pas à vol d'oiseau : une porte proche
     peut être derrière une rangée de stands. On ne calcule cependant pas
     douze trajets pour rien — les quatre plus proches suffisent à trancher. */
  const proches = portes
    .map(f => ({ f: f, d: Math.hypot(f.pts[0][0] - xy[0], f.pts[0][1] - xy[1]) }))
    .sort((a, b) => a.d - b.d).slice(0, 4);
  let mieux = null;
  for (const q of proches){
    const t = entrant ? troncon(p, pmr, q.f.pts[0], xy, null, chez)
                      : troncon(p, pmr, xy, q.f.pts[0], chez, null);
    if (t && (!mieux || t.m < mieux.m)) mieux = t;
  }
  return mieux;
}

/* ------------------------------------------------------------
   Les liaisons — ce qui relie un plan à un autre
   ------------------------------------------------------------ */
/**
 * Un salon ne tient pas dans un plan.
 *
 * Un hall a deux niveaux, et le premier étage est un plan à part ; deux halls
 * voisins communiquent par une porte, et chacun est un plan. Dans les deux
 * cas le calcul s'arrêtait au bord : le trajet se coupait, et le visiteur
 * lisait « rejoignez le pavillon 7.2 » sans savoir par où. C'était honnête —
 * les données ne disent rien de ce qui relie deux plans — mais cela laissait
 * le visiteur seul à l'endroit précis où il hésite.
 *
 * Ce que les données ne disent pas, l'exploitant le sait : cet escalier-ci
 * monte à celui-là, cette porte-ci donne sur celle-là. Il le déclare donc,
 * d'un repère à l'autre, et le calcul enchaîne alors les plans comme il
 * enchaîne les allées — on marche jusqu'à l'escalier, on le prend, on repart
 * de son jumeau à l'étage.
 *
 * Seuls les repères qui sont un passage peuvent en porter une : une porte, un
 * escalier, un escalator, un ascenseur. Un WC ne relie rien, et pouvoir le
 * relier ne ferait qu'ouvrir la porte aux erreurs de saisie.
 */
const TYPES_LIAISON = {
  /* Le coût est en mètres, l'unité de la recherche : ce que l'on accepte de
     marcher en plus pour éviter ce passage. Une porte ne se paie presque
     rien ; un ascenseur s'attend, et deux étages à pied lui restent parfois
     préférables. La durée, elle, s'ajoute à celle de la marche. */
  entree:    { nom: "porte",     art: "la porte",     accessible: true,  cout: 15, min: 1 },
  escalier:  { nom: "escalier",  art: "l'escalier",   accessible: false, cout: 30, min: 1 },
  escalator: { nom: "escalator", art: "l'escalator",  accessible: false, cout: 25, min: 1 },
  /* Le seul passage vertical qu'un fauteuil emprunte : sans lui, un étage
     relié par ses seuls escaliers est simplement hors d'atteinte. */
  ascenseur: { nom: "ascenseur", art: "l'ascenseur",  accessible: true,  cout: 45, min: 2 },
};

/** Ce qu'un repère vaut comme passage, ou rien s'il n'en est pas un. */
const typeLiaison = (f) =>
  f && f.t === "repere" ? TYPES_LIAISON[pictoForme(f)] || null : null;

/** Le nom sous lequel un repère se cherche des yeux : son libellé, et à
 *  défaut le nom de ce qu'il est — une pastille de WC sans libellé s'appelle
 *  « WC », et non rien. */
const nomRepere = (f) => String(f.txt || "").trim() ||
  nomTypeRepere(pictoForme(f));

/**
 * L'annuaire des passages : chacun d'eux, et ceux qu'il rejoint.
 *
 * Une liaison s'écrit des deux côtés — on la pose d'un repère, elle apparaît
 * sur l'autre — mais on lit l'union plutôt que l'intersection : une seule des
 * deux écritures suffit à la déclarer. Un dessin repris d'un salon précédent,
 * un côté effacé par mégarde, et le passage existe toujours dans le hall :
 * le refuser au visiteur au nom d'une écriture manquante serait le punir d'un
 * détail qu'il ne voit pas.
 *
 * Les repères des calques masqués figurent dans l'annuaire — l'administration
 * doit pouvoir nommer ce qu'elle relie — mais pas dans le calcul, qui s'en
 * tient à ce que le visiteur voit.
 */
let LIAISONS = null;
function oublieLiaisons(){ LIAISONS = null; }

/**
 * Ce qu'un repère déclare rejoindre, tel qu'on le relit.
 *
 * Un repère en relie autant qu'il en dessert : l'escalier du rez-de-chaussée
 * monte au premier et au second, et ce sont deux passages, chacun avec son
 * temps. La liaison s'est d'abord écrite comme un simple identifiant ; elle
 * porte maintenant sa durée, et les deux formes se lisent — un plan
 * enregistré avant n'a rien à reprendre et retombe sur le temps ordinaire de
 * son type.
 */
function lienEcrits(f){
  return ((f && f.liens) || []).map(l => typeof l === "string"
    ? { id: l, min: null }
    : { id: l && l.id, min: l && l.min == null ? null : +l.min })
    .filter(l => l.id);
}

/* On réécrit la forme courte quand aucune durée n'est fixée : un plan qui ne
   s'en sert pas garde un enregistrement inchangé. */
function ecritLiens(f, l){
  if (!l.length) delete f.liens;
  else f.liens = l.map(x => x.min == null ? x.id : { id: x.id, min: x.min });
}

function annuaireLiaisons(){
  if (LIAISONS) return LIAISONS;
  const par = new Map();      // id du repère → { f, p, visible }
  for (const p of (DATA && DATA.plans) || []){
    for (const c of calquesDe(p)){
      for (const f of c.formes || []){
        if (typeLiaison(f)) par.set(f.id, { f: f, p: p, visible: c.visible !== false });
      }
    }
  }
  // id → (id rejoint → temps déclaré, ou rien), dans les deux sens
  const vers = new Map();
  const relie = (a, b, min) => {
    if (a === b || !par.has(a) || !par.has(b)) return;
    if (!vers.has(a)) vers.set(a, new Map());
    const m = vers.get(a);
    /* Les deux côtés portent la même durée, écrite d'un seul geste. S'ils
       divergent — une annulation qui n'a défait qu'un côté — on garde la plus
       longue : un passage annoncé trop court se paie sur place. */
    const vu = m.get(b);
    m.set(b, min == null ? (vu == null ? null : vu)
                         : (vu == null ? min : Math.max(vu, min)));
  };
  par.forEach((o, id) => lienEcrits(o.f).forEach(l => {
    relie(id, l.id, l.min); relie(l.id, id, l.min);
  }));
  LIAISONS = { par: par, vers: vers };
  return LIAISONS;
}

/** Ce qu'un repère rejoint, du point de vue de l'administration : les deux
 *  sens confondus, calques masqués compris, chacun avec son temps déclaré. */
function liensDe(f){
  const an = annuaireLiaisons();
  const out = [];
  (an.vers.get(f.id) || new Map()).forEach((min, id) => {
    const o = an.par.get(id);
    if (o) out.push({ o: o, min: min });
  });
  return out;
}

/**
 * Ce que coûte un passage dans la recherche, en mètres.
 *
 * Le forfait de son type, augmenté de ce que le temps déclaré ajoute au temps
 * ordinaire, converti en mètres au pas de marche. Un ascenseur déclaré à cinq
 * minutes devient donc aussi cher qu'un long détour, et le trajet préfère
 * l'escalier — ce qui est exactement ce qu'on veut dire en le déclarant. Le
 * prix reste positif : un passage annoncé instantané ne doit pas devenir un
 * raccourci qu'on emprunte pour rien.
 */
function coutLiaison(t, min, pmr){
  const sup = (min == null ? 0 : min - t.min) * (pmr ? ALLURE_PMR : ALLURE) * 60;
  return Math.max(5, t.cout + sup);
}

/** Un passage praticable : montré au visiteur, relié à un autre, et permis
 *  dans ce mode — un escalier n'en est pas un pour un fauteuil. */
function passagePraticable(an, id, pmr){
  const o = an.par.get(id);
  if (!o || !o.visible || !an.vers.has(id)) return null;
  const t = typeLiaison(o.f);
  return pmr && !t.accessible ? null : o;
}

/** Les passages praticables d'un plan. */
function passagesDe(p, pmr){
  const an = annuaireLiaisons(), l = [];
  an.par.forEach((o, id) => {
    if (o.p.i === p.i && passagePraticable(an, id, pmr)) l.push(o.f);
  });
  return l;
}

/** Par où l'on quitte un plan : ses portes, et les passages déclarés — un
 *  étage se quitte par son escalier, et non par la porte du hall d'en bas. */
function sortiesDe(p, pmr){
  const l = portesDe(p);
  for (const f of passagesDe(p, pmr)) if (l.indexOf(f) < 0) l.push(f);
  return l;
}

/** Les couples de plans qu'un passage joint directement, pour qui n'a besoin
 *  que de savoir s'ils le sont. */
function plansRelies(pmr){
  const an = annuaireLiaisons(), out = new Set();
  an.vers.forEach((suite, id) => {
    const o = passagePraticable(an, id, pmr);
    if (!o) return;
    suite.forEach((min, idv) => {
      const v = passagePraticable(an, idv, pmr);
      if (v) out.add(o.p.i + "|" + v.p.i);
    });
  });
  return out;
}

/* ------------------------------------------------------------
   Le chemin qui passe d'un plan à l'autre
   ------------------------------------------------------------ */
/**
 * La distance de marche depuis un point vers tout le reste du pavillon.
 *
 * Un balayage en largeur, comme pour la journée : chercher un A* par couple
 * de passages coûterait davantage pour un chiffre qu'on ne fait que comparer.
 * Le tracé montré au visiteur, lui, reste celui de `troncon`.
 */
const BALAYAGES = new Map();
function balayage(p, pmr, xy, chez){
  const cle = p.id + (pmr ? "|pmr" : "") + "|" + xy[0].toFixed(2) + "," + xy[1].toFixed(2);
  const garde = BALAYAGES.get(cle);
  if (garde) return garde;
  const g = grille(p, pmr);
  /* On ne sort pas d'un emplacement en traversant son voisin : l'accroche s'en
     tient à l'emprise du sien, quand on sait laquelle c'est. */
  const c = accroche(g, xy, chez);
  const b = { g: g, d: c >= 0 ? distancesDepuis(g, c) : null };
  BALAYAGES.set(cle, b);
  return b;
}

/** Rend -1 quand aucune allée ne mène au point demandé. */
function distanceDepuis(bal, xy, chez){
  if (!bal.d) return -1;
  const c = accroche(bal.g, xy, chez);
  if (c < 0) return -1;
  return bal.d[c] >= 0 ? bal.d[c] * PAS_GRILLE : -1;
}

/* Ce qu'on s'autorise de balayages pour un trajet. Chacun parcourt un
   pavillon entier case par case — quelques dizaines de millisecondes, plus
   sur un téléphone. Une vingtaine couvre tout salon réel ; la borne n'est là
   que pour l'exploitant qui relierait tout à tout, et le trajet reste alors
   le meilleur de ceux qu'on a eu le temps d'examiner. */
const LIMITE_BALAYAGES = 20;

/**
 * Le chemin le plus court d'un point à un autre, passages compris.
 *
 * Dijkstra sur un graphe minuscule : les deux bouts du trajet et les passages
 * praticables. Une arête de marche coûte les mètres d'allée qui séparent deux
 * points d'un même plan ; une arête de passage coûte le forfait de son type.
 * Les distances de marche ne se calculent qu'au moment où un nœud est retenu,
 * et jamais deux fois : un salon dont les plans ne se relient pas ne fait
 * donc qu'un balayage avant de rendre les armes.
 *
 * Rend la suite des sauts, ou rien si les liaisons déclarées ne mènent pas de
 * l'un à l'autre.
 */
function cheminLiaisons(a, b, pmr){
  const an = annuaireLiaisons();
  if (!an.vers.size) return null;

  /* Les deux bouts du trajet peuvent être des emplacements : ils gardent leur
     emprise et leur objet, dont dépendent l'accroche à l'allée et l'amorce. Un
     passage, lui, n'est qu'un point. */
  const noeuds = [{ ip: a.p, xy: a.xy.slice(), d: a.d, obj: a.obj },
                  { ip: b.p, xy: b.xy.slice(), d: b.d, obj: b.obj }];
  const rang = new Map();
  /* Un escalier ne relie rien pour un fauteuil : le mode accessible retire le
     passage du graphe plutôt que de le pénaliser, faute de quoi il finirait
     par le proposer là où il n'y a rien d'autre. */
  an.par.forEach((o, id) => {
    if (!passagePraticable(an, id, pmr)) return;
    rang.set(id, noeuds.length);
    noeuds.push({ ip: o.p.i, xy: o.f.pts[0].slice(), id: id, f: o.f, t: typeLiaison(o.f) });
  });
  if (noeuds.length < 4) return null;   // il faut au moins les deux bouts d'un passage

  const n = noeuds.length;
  const D = new Float64Array(n).fill(Infinity);
  const vient = new Array(n).fill(null);
  const vu = new Uint8Array(n);
  D[0] = 0;
  let balayages = 0;

  for (;;){
    let u = -1;
    for (let i = 0; i < n; i++) if (!vu[i] && D[i] < Infinity && (u < 0 || D[i] < D[u])) u = i;
    if (u < 0 || u === 1) break;        // plus rien à ouvrir, ou l'arrivée est arrêtée
    vu[u] = 1;

    /* Emprunter le passage : son prix est celui du passage, et non d'un
       chemin — on ne marche pas dans un escalier, on le monte. */
    const suite = noeuds[u].id ? an.vers.get(noeuds[u].id) : null;
    if (suite) suite.forEach((dit, idv) => {
      const v = rang.get(idv);
      /* Un passage joint deux plans. Deux repères du même plan reliés l'un à
         l'autre — ce que l'administration ne propose pas, mais qu'une reprise
         de données peut porter — feraient un raccourci que personne ne peut
         emprunter : on l'ignore plutôt que de tracer un trajet impossible. */
      if (v === undefined || vu[v] || noeuds[v].ip === noeuds[u].ip) return;
      /* Le temps du passage est celui fixé pour ce couple-ci, et à défaut
         celui de son type : le même escalier met une minute au premier étage
         et davantage au second. */
      const min = dit == null ? noeuds[u].t.min : dit;
      const d = D[u] + coutLiaison(noeuds[u].t, dit, pmr);
      if (d < D[v]){ D[v] = d; vient[v] = { de: u, genre: "liaison", min: min }; }
    });

    /* Marcher dans le plan où l'on se trouve. */
    const p = DATA.plans[noeuds[u].ip];
    if (!p || balayages >= LIMITE_BALAYAGES) continue;
    balayages++;
    const bal = balayage(p, pmr, noeuds[u].xy, noeuds[u].d);
    for (let v = 0; v < n; v++){
      if (v === u || vu[v] || noeuds[v].ip !== noeuds[u].ip) continue;
      const m = distanceDepuis(bal, noeuds[v].xy, noeuds[v].d);
      if (m < 0) continue;
      const d = D[u] + m;
      if (d < D[v]){ D[v] = d; vient[v] = { de: u, genre: "marche" }; }
    }
  }

  if (!isFinite(D[1])) return null;
  const sauts = [];
  for (let i = 1; i !== 0; ){
    const e = vient[i];
    if (!e) return null;
    sauts.unshift({ a: noeuds[e.de], b: noeuds[i], genre: e.genre, min: e.min });
    i = e.de;
  }
  return sauts;
}

/**
 * Le trajet que décrit une suite de sauts : les allées qu'on marche, les
 * passages qu'on emprunte.
 *
 * Un tronçon qui ne se trace pas ne fait pas échouer le trajet : la suite est
 * juste, et mieux vaut un plan où un morceau manque qu'un « aucun chemin »
 * qui serait faux.
 */
function routeParLiaisons(sauts, pmr){
  const etapes = [], avertis = [];
  let minutes = 0, liaisons = 0;
  for (const s of sauts){
    if (s.genre === "liaison"){
      liaisons++;
      minutes += s.min;
      etapes.push({ genre: "liaison", type: pictoForme(s.a.f), p: s.a.ip, pVers: s.b.ip,
                    min: s.min, nom: nomRepere(s.a.f), nomVers: nomRepere(s.b.f),
                    de: DATA.plans[s.a.ip].libelle, vers: DATA.plans[s.b.ip].libelle });
      continue;
    }
    /* Deux points confondus — le départ posé sur l'escalier lui-même : il n'y
       a pas d'allée entre eux, et une étape de zéro mètre n'apprend rien. */
    if (Math.hypot(s.b.xy[0] - s.a.xy[0], s.b.xy[1] - s.a.xy[1]) < .5) continue;
    const p = DATA.plans[s.a.ip];
    const t = troncon(p, pmr, s.a.xy, s.b.xy, s.a.obj, s.b.obj);
    if (t) etapes.push(t);
    else avertis.push("Le chemin dans le " + p.libelle + " n'a pas pu être tracé : " +
                      "cette partie du trajet manque à l'écran.");
  }
  return { etapes: etapes, avertis: avertis, liaisons: liaisons, minutes: minutes,
           partiel: !!avertis.length,
           m: etapes.reduce((s, e) => s + (e.m || 0), 0) };
}

/**
 * Le trajet d'un point à un autre, quel que soit le nombre de plans traversés.
 *
 * Trois cas, dans cet ordre. Le même plan, et c'est un tronçon. Des plans que
 * des passages relient, et c'est la suite de sauts. Des plans que rien ne
 * relie — aucune liaison déclarée, ou aucune praticable en fauteuil — et l'on
 * retombe sur ce qu'on savait faire avant : sortir par la porte la plus
 * proche, dire « rejoignez le pavillon 7.2 », reprendre à l'entrée de
 * l'autre. Le trajet est alors coupé, et il le dit.
 */
function routeEntre(a, b, pmr){
  if (a.p === b.p){
    const t = troncon(DATA.plans[a.p], pmr, a.xy, b.xy, a.obj, b.obj);
    if (t) return { etapes: [t], m: t.m };
  }

  /* Un plan peut aussi se rejoindre lui-même par un autre — deux moitiés d'un
     hall que seule une passerelle relie : la recherche par liaisons a donc
     lieu même quand le départ et l'arrivée partagent leur plan. */
  const sauts = cheminLiaisons(a, b, pmr);
  if (sauts) return routeParLiaisons(sauts, pmr);
  if (a.p === b.p) return { etapes: [], m: 0, sansChemin: true };

  const pa = DATA.plans[a.p], pb = DATA.plans[b.p];
  const t1 = versPorte(pa, pmr, a.xy, false, a.obj);
  const t2 = versPorte(pb, pmr, b.xy, true, b.obj);
  const etapes = [];
  const avertis = [];
  if (t1) etapes.push(t1);
  else avertis.push("La sortie du " + pa.libelle + " n'est pas repérée sur le plan : " +
                    "cette partie du trajet n'est pas tracée.");
  etapes.push({ genre: "transfert", de: pa.libelle, vers: pb.libelle });
  if (t2) etapes.push(t2);
  else avertis.push("L'entrée du " + pb.libelle + " n'est pas repérée sur le plan : " +
                    "cette partie du trajet n'est pas tracée.");
  /* Sans repère d'entrée ni de sortie, il ne reste que « changez de pavillon » :
     mieux vaut le dire que d'annoncer un trajet de zéro mètre. */
  return { etapes: etapes, avertis: avertis, coupe: true,
           partiel: !t1 || !t2, aucunTrace: !t1 && !t2,
           m: etapes.reduce((s, e) => s + (e.m || 0), 0) };
}

/**
 * Le trajet demandé dans le tiroir.
 *
 * Dans un même pavillon il n'y a qu'un tronçon. D'un plan à l'autre, tout
 * dépend de ce que l'exploitant a relié : les passages déclarés enchaînent
 * les plans sans rupture, leur absence laisse le trajet coupé à la porte.
 */
function calculeRoute(){
  const a = ITI.a, b = ITI.b, pmr = ITI.pmr;
  if (!a || !b) return null;
  if (a.cle === b.cle) return { pmr: pmr, etapes: [], m: 0, memePoint: true };
  const r = routeEntre(a, b, pmr);
  r.pmr = pmr;
  return r;
}

/* ------------------------------------------------------------
   Voir ce qui est praticable
   ------------------------------------------------------------ */
/**
 * Dessiner la circulation sans la voir revient à parier.
 *
 * L'exploitant trace une allée, puis une autre, et ne saura qu'elles ne se
 * touchent pas qu'en essayant un trajet qui échoue — sans savoir où. Cette
 * teinte est la grille elle-même, telle que le calcul la voit : ce qui n'est
 * pas coloré n'est pas praticable, et une allée dessinée qui reste blanche est
 * une allée trop étroite ou détachée du reste.
 *
 * Réservée à l'administration : c'est un outil de mise au point, pas une
 * couche de plan.
 */
let voirNappe = false;

function couleurNappe(){
  const h = String(jeton("--accent")).trim();
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h);
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [47, 73, 209];
}

function rafraichitApercu(){
  const vieux = $("nappe");
  if (!voirNappe || !ADMIN || !DATA){ if (vieux) vieux.remove(); return; }
  const p = P();
  const g = grille(p, ITI.pmr);
  const cv = document.createElement("canvas");
  cv.width = g.w; cv.height = g.h;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(g.w, g.h);
  const d = img.data, c = couleurNappe();
  for (let i = 0; i < g.nappe.length; i++){
    if (!g.nappe[i]) continue;
    const k = i * 4;
    d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 150;
  }
  ctx.putImageData(img, 0, 0);

  const el = vieux || document.createElementNS("http://www.w3.org/2000/svg", "image");
  el.id = "nappe";
  el.setAttribute("x", g.x0);
  el.setAttribute("y", g.y0);
  el.setAttribute("width", g.w * PAS_GRILLE);
  el.setAttribute("height", g.h * PAS_GRILLE);
  el.setAttribute("preserveAspectRatio", "none");
  el.setAttribute("href", cv.toDataURL());
  if (!vieux) svg.insertBefore(el, svg.querySelector("#itin, #apercu, #poignees"));
}

/* ------------------------------------------------------------
   Le tracé sur le plan
   ------------------------------------------------------------ */
/**
 * Ce que le plan montre en ce moment.
 *
 * Deux calculs y prétendent — l'itinéraire d'un point à un autre, et la
 * journée organisée depuis le parcours — et ils empruntent le même trait :
 * deux tracés superposés ne se liraient plus. Le dernier calculé prend donc
 * la place, et l'autre disparaît du plan sans être oublié pour autant.
 */
let TRACE = null;

const marchesIci = () => (TRACE ? TRACE.etapes : [])
  .filter(e => e.genre === "marche" && e.p === state.plan);

/** Rayon des pastilles de départ et d'arrivée : constant à l'écran, donc
 *  exprimé en mètres d'après le zoom du moment. */
function rayonBout(){
  const r = svg.getBoundingClientRect();
  return Math.max(.4, view.w / (r.width || 1) * 6);
}

function dessineItineraire(){
  let g = $("itin");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "itin";
    // au-dessus des calques, sous les poignées d'édition et l'aperçu de tracé
    svg.insertBefore(g, svg.querySelector("#apercu, #poignees"));
  }
  const marches = marchesIci();
  if (!marches.length){ g.innerHTML = ""; return; }

  const r = rayonBout();
  let out = "";
  marches.forEach(e => {
    const d = "M" + e.pts.map(q => q[0].toFixed(2) + " " + q[1].toFixed(2)).join("L");
    out += '<path class="iHalo" d="' + d + '"/><path class="iTrait" d="' + d +
           '"/><path class="iSens" d="' + d + '"/>';
  });
  /* Une journée repasse par les mêmes allées et se recoupe : sans le rang de
     chaque arrêt, le trait ne dit plus dans quel sens on le suit. Un trajet
     d'un point à un autre n'a que deux bouts, et un chiffre y serait du
     bruit — il garde ses deux pastilles nues. */
  const arrets = (TRACE.arrets || []).filter(a => a.p === state.plan);
  if (arrets.length){
    const rr = (r * 1.5).toFixed(2);
    arrets.forEach(a => {
      /* Le point de départ n'est pas un arrêt : on n'y visite rien, et lui
         donner un rang décalerait tous les autres d'une unité. */
      out += '<circle class="iBout' + (a.conf ? " conf" : "") + '" cx="' + a.xy[0] +
             '" cy="' + a.xy[1] + '" r="' + (a.n ? rr : r.toFixed(2)) + '"/>';
      if (a.n) out += '<text class="iNum' + (a.conf ? " conf" : "") + '" x="' + a.xy[0] +
             '" y="' + a.xy[1] + '" font-size="' + (r * 1.6).toFixed(2) + '">' + a.n + '</text>';
    });
  } else {
    const pd = marches[0].pts[0];
    const pa = marches[marches.length - 1].pts[marches[marches.length - 1].pts.length - 1];
    out += '<circle class="iBout" cx="' + pd[0] + '" cy="' + pd[1] + '" r="' + r.toFixed(2) + '"/>' +
           '<circle class="iBout fin" cx="' + pa[0] + '" cy="' + pa[1] + '" r="' + r.toFixed(2) + '"/>';
  }
  g.innerHTML = out;
}

/** Le zoom change : seules les pastilles ont besoin d'être reprises, le trait
 *  garde son épaisseur à l'écran par la feuille de style. */
function rafraichitBouts(){
  const g = $("itin");
  if (!g || !g.firstChild || !view) return;
  const r = rayonBout();
  /* Les pastilles d'une journée portent un chiffre et sont donc plus larges ;
     celle du départ, qui n'en porte pas, garde la taille ordinaire. */
  const numerotees = !!g.querySelector(".iNum");
  const rr = (numerotees ? r * 1.5 : r).toFixed(2);
  const arrets = (TRACE && TRACE.arrets || []).filter(a => a.p === state.plan);
  g.querySelectorAll(".iBout").forEach((c, i) =>
    c.setAttribute("r", numerotees && arrets[i] && !arrets[i].n ? r.toFixed(2) : rr));
  g.querySelectorAll(".iNum").forEach(t => t.setAttribute("font-size", (r * 1.6).toFixed(2)));
}

/** Cadre la vue sur le tracé du pavillon affiché. */
function cadreItineraire(){
  const marches = marchesIci();
  if (!marches.length || !view) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  marches.forEach(e => e.pts.forEach(q => {
    x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]);
    y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
  }));
  const r = svg.getBoundingClientRect();
  const cache = masque();
  const hUtile = Math.max(60, r.height - cache);
  const marge = 8;
  const w = Math.max(12, x1 - x0 + 2 * marge), h = Math.max(12, y1 - y0 + 2 * marge);
  const k = Math.max(w / (r.width || 1), h / hUtile);
  view = { x: (x0 + x1) / 2 - (k * r.width) / 2,
           y: (y0 + y1) / 2 - (k * r.height) / 2 + (k * cache) / 2,
           w: k * r.width, h: k * r.height };
  poseVue();
}

/* ------------------------------------------------------------
   Le tiroir
   ------------------------------------------------------------ */
const champIti = (r) => r === "a" ? $("iDepart") : $("iArrivee");
let champSugg = null;   // le champ auquel appartiennent les suggestions
let survolSugg = -1;    // la suggestion mise en avant au clavier

function ecritDistance(m){
  return m < 950 ? Math.round(m / 5) * 5 + " m"
                 : (m / 1000).toFixed(1).replace(".", ",") + " km";
}
/* Les minutes d'un passage s'ajoutent à celles de la marche : monter un
   étage prend le temps de le monter, attendre un ascenseur celui de
   l'attendre, et un trajet qui les tairait promettrait ce qu'il ne tient
   pas. */
function ecritDuree(m, pmr, passages){
  const min = Math.max(1, Math.round(m / ((pmr ? ALLURE_PMR : ALLURE) * 60)) + (passages || 0));
  return "≈ " + min + " min";
}

function fermeSugg(){
  champSugg = null; survolSugg = -1;
  const z = $("iSugg");
  z.hidden = true; z.innerHTML = "";
  [$("iDepart"), $("iArrivee")].forEach(c => c.setAttribute("aria-expanded", "false"));
}

function montreSugg(r){
  champSugg = r;
  survolSugg = -1;
  const z = $("iSugg");
  // une seule liste, déplacée dans le champ qu'on remplit
  const hote = champIti(r).parentNode;
  if (z.parentNode !== hote) hote.appendChild(z);
  const l = candidats(champIti(r).value);
  if (!l.length){
    z.innerHTML = '<p class="iRien"></p>';
    z.querySelector(".iRien").textContent = champIti(r).value.trim()
      ? "Aucun stand, zone ni repère ne porte ce nom."
      : "Tapez le nom ou le numéro d'un stand.";
  } else {
    z.innerHTML = "";
    l.forEach((pt, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "iSug" + (pt.genre === "repere" ? " rep" : "");
      b.setAttribute("role", "option");
      b.dataset.i = i;
      b.innerHTML = '<span class="n"></span><span class="s"></span>';
      b.querySelector(".n").textContent = pt.nom;
      b.querySelector(".s").textContent = pt.detail;
      b.onclick = () => choisitPoint(r, pt);
      z.appendChild(b);
    });
  }
  z.hidden = false;
  champIti(r).setAttribute("aria-expanded", "true");
}

function choisitPoint(r, pt){
  ITI[r] = pt;
  champIti(r).value = pt.nom;
  fermeSugg();
  relance();
}

/** Une saisie abandonnée sans choix : on tranche pour elle si c'est possible,
 *  on oublie le point sinon — mieux vaut un champ vide qu'un trajet faux. */
function valideSaisie(r){
  const v = champIti(r).value.trim();
  if (!v){ if (ITI[r]){ ITI[r] = null; relance(); } return; }
  if (ITI[r] && ITI[r].nom === v) return;
  const pt = pointSaisi(v);
  ITI[r] = pt;
  if (pt) champIti(r).value = pt.nom;
  relance();
}

function effaceItineraire(){
  ITI.a = ITI.b = null;
  ROUTE = TRACE = null;
  visee = null;
  bandeauVisee();
  $("iDepart").value = $("iArrivee").value = "";
  fermeSugg();
  dessineItineraire();
  montreResultat();
}

/**
 * Le calcul passe par un temps mort volontaire.
 *
 * Pavage du hall, A* et lissage tiennent en quelques dizaines de
 * millisecondes sur un poste, davantage sur un téléphone de salon. Les
 * enchaîner dans la foulée du clic figerait le bouton sans rien dire ; on
 * affiche d'abord, on calcule ensuite.
 */
let attente = null, _dernierTrajet = "";
function relance(){
  clearTimeout(attente);
  if (!ITI.a || !ITI.b){
    ROUTE = TRACE = null;
    dessineItineraire();
    montreResultat();
    return;
  }
  montreResultat("calcul");
  /* Un calcul, ce sont deux points et une option d'accessibilité. Corriger une
     lettre du champ d'arrivée relance le même trajet : il ne compte qu'une
     fois. */
  const empreinte = ITI.a.cle + ">" + ITI.b.cle + (ITI.pmr ? " pmr" : "");
  if (empreinte !== _dernierTrajet){ _dernierTrajet = empreinte; mesure("itineraire"); }
  attente = setTimeout(() => {
    attente = null;
    try {
      ROUTE = calculeRoute();
    } catch (e){
      console.warn("Itinéraire :", e);
      ROUTE = { pmr: ITI.pmr, etapes: [], m: 0, panne: true };
    }
    // demander un itinéraire, c'est renoncer à voir la journée sur le plan
    TRACE = ROUTE;
    /* Le trajet commence dans le pavillon du départ : c'est celui qu'il faut
       montrer, même si l'on regardait ailleurs en le demandant. */
    const premier = ROUTE.etapes.find(e => e.genre === "marche");
    if (premier && premier.p !== state.plan) changePlan(premier.p);
    dessineItineraire();
    montreResultat();
    if (premier) cadreItineraire();
  }, 30);
}

/**
 * Ce qu'une étape de passage dit au visiteur.
 *
 * Une porte se franchit d'un pavillon à l'autre et se nomme des deux côtés :
 * savoir par où l'on sort ne suffit pas, il faut savoir par où l'on entre. Un
 * escalier porte le plus souvent le même nom en haut et en bas — le répéter
 * ferait douter qu'on soit au bon endroit, on ne le redit donc que lorsqu'il
 * change.
 */
function phraseLiaison(e){
  const t = TYPES_LIAISON[e.type] || TYPES_LIAISON.entree;
  /* Le temps du passage se dit là où il se passe : c'est le seul endroit du
     trajet dont les mètres ne rendent pas compte. */
  const duree = e.min ? " Comptez " + ecritMinutes(e.min) + "." : "";
  if (e.type === "entree")
    return { t: "Changement de pavillon",
             s: "Sortez du " + e.de + " par « " + e.nom + " », puis entrez dans le " +
                e.vers + " par « " + e.nomVers + " »." + duree };
  return { t: t.nom[0].toUpperCase() + t.nom.slice(1) + " · " + e.nom,
           s: "Prenez " + t.art + " « " + e.nom + " » : vous arrivez dans le " + e.vers +
              (e.nomVers !== e.nom ? ", « " + e.nomVers + " »" : "") + "." + duree };
}

function montreResultat(etat){
  const z = $("iResultat"), badge = $("iResume");
  z.innerHTML = "";
  const dit = (cls, txt) => {
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = txt;
    z.appendChild(p);
    return p;
  };

  if (etat === "calcul"){ badge.textContent = "calcul…"; dit("iNote", "Recherche du chemin…"); return; }
  if (!ITI.a || !ITI.b){
    badge.textContent = "à définir";
    dit("iNote", "Choisissez un départ et une arrivée. Sans localisation, c'est " +
                 "vous qui dites d'où vous partez — l'entrée du hall, ou le stand " +
                 "devant lequel vous êtes.");
    return;
  }
  if (!ROUTE) return;

  if (ROUTE.memePoint){ badge.textContent = "—"; dit("iNote", "Vous y êtes déjà."); return; }
  if (ROUTE.panne){ badge.textContent = "—"; dit("iAlerte", "Le calcul n'a pas abouti sur cet appareil."); return; }
  if (ROUTE.sansChemin){
    badge.textContent = "—";
    dit("iAlerte", ROUTE.pmr
      ? "Aucun chemin accessible ne relie ces deux points : les passages disponibles " +
        "sont trop étroits, ou coupés par un escalier. Décochez l'option pour voir le " +
        "trajet ordinaire."
      : "Aucun chemin ne relie ces deux points sur ce plan.");
    return;
  }

  if (ROUTE.aucunTrace){
    badge.textContent = "non tracé";
  } else {
    /* Ce qui sépare deux pavillons que rien ne relie ne figure sur aucun plan
       — ni passerelle, ni allée extérieure : la distance annoncée est alors
       celle des seuls tronçons tracés, et elle le dit. Un trajet qui emprunte
       des passages déclarés, lui, est complet d'un bout à l'autre ; il ne lui
       manque que les mètres de l'escalier, comptés en minutes. */
    badge.textContent = (ROUTE.coupe ? "≥ " : "") + ecritDistance(ROUTE.m) +
      " · " + ecritDuree(ROUTE.m, ROUTE.pmr, ROUTE.minutes);
    const bilan = document.createElement("div");
    bilan.className = "iBilan";
    bilan.innerHTML = '<b></b><span></span>';
    bilan.querySelector("b").textContent = (ROUTE.coupe ? "au moins " : "") + ecritDistance(ROUTE.m);
    bilan.querySelector("span").textContent =
      ecritDuree(ROUTE.m, ROUTE.pmr, ROUTE.minutes) +
      (ROUTE.pmr ? " · itinéraire accessible" : " de marche") +
      (ROUTE.coupe ? " · hors trajet entre pavillons"
                   : ROUTE.liaisons ? " · " + ROUTE.liaisons + " passage" +
                                      (ROUTE.liaisons > 1 ? "s" : "")
                   : "");
    z.appendChild(bilan);
  }

  /* Un trajet en plusieurs morceaux se lit comme une suite : où l'on marche,
     par où l'on passe. Un tronçon unique n'a rien à énumérer — le trait sur le
     plan le dit mieux qu'une ligne de texte. */
  if (ROUTE.etapes.length > 1){
    const l = document.createElement("div");
    l.className = "iEtapes";
    ROUTE.etapes.forEach(e => {
      const passage = e.genre === "transfert" || e.genre === "liaison";
      /* Le trajet traverse des plans qu'on ne regarde pas : chaque étape de
         marche ouvre le sien. Sans cela, le visiteur lit « 80 m dans le
         pavillon 7.2 » et n'a aucun moyen de voir lesquels. */
      const ailleurs = e.genre === "marche" && e.p !== state.plan;
      const d = document.createElement(ailleurs ? "button" : "div");
      if (ailleurs){
        d.type = "button";
        d.onclick = () => {
          changePlan(e.p);
          dessineItineraire();
          cadreItineraire();
          montreResultat();
        };
      }
      d.className = "iEtape" + (passage ? " transfert" : "") + (ailleurs ? " ailleurs" : "");
      d.innerHTML = '<span class="t"></span><span class="s"></span>';
      const dit2 = (t, s) => {
        d.querySelector(".t").textContent = t;
        d.querySelector(".s").textContent = s;
      };
      if (e.genre === "transfert"){
        dit2("Changement de pavillon",
             "Sortez du " + e.de + ", rejoignez le " + e.vers + ".");
      } else if (e.genre === "liaison"){
        const p = phraseLiaison(e);
        dit2(p.t, p.s);
      } else {
        dit2(DATA.plans[e.p].libelle,
             ecritDistance(e.m) + " dans le pavillon" +
             (e.p === state.plan ? " · tracé à l'écran" : " · voir"));
      }
      l.appendChild(d);
    });
    z.appendChild(l);
    (ROUTE.avertis || []).forEach(t => dit("iAlerte", t));
  }

  // rien de tracé dans ce pavillon : il n'y a rien à cadrer
  if (marchesIci().length){
    const acts = document.createElement("div");
    acts.className = "acts";
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "Cadrer sur le trajet";
    b.onclick = cadreItineraire;
    acts.appendChild(b);
    z.appendChild(acts);
  }
}

/* ------------------------------------------------------------
   Désigner un point sur le plan
   ------------------------------------------------------------ */
/**
 * Taper un nom suppose qu'on le connaisse. Or on voit souvent sa destination
 * avant de savoir comment elle s'appelle — « le grand stand à l'angle, là ».
 * Le viseur laisse la désigner du doigt : le clic suivant sur le plan remplit
 * le champ au lieu d'ouvrir une fiche.
 *
 * Sur un téléphone le tiroir couvre les deux tiers de l'écran : viser
 * demanderait de choisir un stand qu'on ne voit pas. Il s'efface donc le temps
 * de la visée, et revient dès qu'elle aboutit — le bandeau, lui, reste, sans
 * quoi on ne saurait plus ce qu'on est en train de choisir.
 */
let visee = null;

function bandeauVisee(){
  const b = $("viseur");
  if (b){
    b.hidden = !visee;
    if (visee) $("viseurTxt").textContent =
      "Touchez " + (visee === "a" ? "votre point de départ" : "votre arrivée") + " sur le plan.";
  }
  racine.classList.toggle("vise-plan", !!visee);
  $("iViseA").setAttribute("aria-pressed", String(visee === "a"));
  $("iViseB").setAttribute("aria-pressed", String(visee === "b"));
}

function armeVisee(r){
  visee = visee === r ? null : r;
  fermeSugg();
  if (visee && ETROIT()) fermeItineraire();
  bandeauVisee();
}

/** Fin de la visée, quelle qu'en soit la raison. */
function finVisee(){
  if (!visee) return;
  const rouvre = ETROIT();
  visee = null;
  bandeauVisee();
  if (rouvre) ouvreItineraire();
}

/**
 * Un clic sur le plan pendant une visée. Rend « vrai » s'il a servi à choisir,
 * auquel cas la fiche ne doit pas s'ouvrir par-dessus.
 */
function viseItineraire(id){
  const o = parId.get(id);
  return o ? visePoint(pointObjet(o)) : false;
}

/** Viser un repère : le geste est le même, le point vient d'ailleurs. */
function visePoi(id){
  if (!visee) return false;
  const cible = formeParId(id);
  return cible && cible.f.t === "repere" ? visePoint(pointRepere(cible.f, P())) : false;
}

function visePoint(pt){
  if (!visee) return false;
  const r = visee;
  ITI[r] = pt;
  champIti(r).value = ITI[r].nom;
  /* Deux points à désigner, deux gestes : tant que l'autre champ est vide, on
     enchaîne plutôt que de faire rouvrir le tiroir pour le refermer aussitôt. */
  const autre = r === "a" ? "b" : "a";
  if (!ITI[autre]){ visee = autre; bandeauVisee(); relance(); return true; }
  finVisee();
  relance();
  return true;
}

$("iViseA").onclick = () => armeVisee("a");
$("iViseB").onclick = () => armeVisee("b");
$("viseurStop").onclick = finVisee;

/* ------------------------------------------------------------
   Ouverture, fermeture, branchements
   ------------------------------------------------------------ */
function ouvreItineraire(){
  // fiche, parcours et itinéraire se partagent la même bande
  if ($("detail").classList.contains("open")) ferme();
  fermeParcours();
  /* Rouvrir le tiroir, c'est renoncer à viser : sur un téléphone il recouvre
     le plan qu'on visait. On ne passe pas par finVisee(), qui rouvrirait ce
     tiroir déjà en train de s'ouvrir. */
  visee = null;
  bandeauVisee();
  /* La journée organisée a pu prendre le trait entre-temps : le tiroir le
     reprend en s'ouvrant, sinon son bilan parlerait d'un trajet et le plan en
     montrerait un autre. */
  if (ROUTE && TRACE !== ROUTE){ TRACE = ROUTE; dessineItineraire(); }
  $("itineraire").classList.add("open");
  $("btnItineraire").setAttribute("aria-pressed", "true");
  montreResultat();
}
function fermeItineraire(){
  const t = $("itineraire");
  if (!t || !t.classList.contains("open")) return;
  t.classList.remove("open");
  $("btnItineraire").setAttribute("aria-pressed", "false");
  fermeSugg();
}

/** Depuis une fiche : « j'y vais ». L'arrivée est connue, le départ reste à
 *  dire — c'est lui qu'on met sous le curseur. */
const versItineraire = (o) => versItineraireDe(pointObjet(o));

/** Le même geste depuis un repère, qui n'est pas un objet du plan. */
function versItineraireDe(pt){
  ITI.b = pt;
  $("iArrivee").value = ITI.b.nom;
  if (ITI.a && ITI.a.cle === ITI.b.cle){ ITI.a = null; $("iDepart").value = ""; }
  ouvreItineraire();
  if (ITI.a) relance();
  else { montreResultat(); $("iDepart").focus(); }
}

["a", "b"].forEach(r => {
  const c = champIti(r);
  c.addEventListener("input", () => montreSugg(r));
  // revenir au clavier, c'est renoncer au doigt
  c.addEventListener("focus", () => { visee = null; bandeauVisee(); montreSugg(r); });
  c.addEventListener("blur", () => { if (champSugg === r) fermeSugg(); valideSaisie(r); });
  c.addEventListener("keydown", e => {
    const z = $("iSugg");
    const opts = z.hidden ? [] : [...z.querySelectorAll(".iSug")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      if (!opts.length) return;
      e.preventDefault();
      survolSugg = (survolSugg + (e.key === "ArrowDown" ? 1 : opts.length - 1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.classList.toggle("vis", i === survolSugg));
      opts[survolSugg].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter"){
      e.preventDefault();
      if (opts[survolSugg]) opts[survolSugg].click();
      else { fermeSugg(); valideSaisie(r); }
    } else if (e.key === "Escape" && !z.hidden){
      e.stopPropagation();
      fermeSugg();
    }
  });
});
/* Le clic sur une suggestion arrive après le « blur » du champ : sans cela, la
   liste se referme sous le doigt et le clic tombe dans le vide. */
$("iSugg").addEventListener("pointerdown", e => e.preventDefault());

$("iEchange").onclick = () => {
  const a = ITI.a;
  ITI.a = ITI.b; ITI.b = a;
  $("iDepart").value = ITI.a ? ITI.a.nom : "";
  $("iArrivee").value = ITI.b ? ITI.b.nom : "";
  relance();
};

$("iPmr").checked = ITI.pmr;
$("iPmr").onchange = e => {
  ITI.pmr = e.target.checked;
  // celui qui en a besoin en a besoin à chaque visite
  try { localStorage.setItem(CLE_PMR, ITI.pmr ? "1" : "0"); } catch (err) {}
  relance();
};

/* Tout le calcul repose sur le canevas : c'est lui qui remplit les contours et
   les épaissit. Sur un navigateur qui ignore Path2D, mieux vaut retirer la
   fonction que d'ouvrir un tiroir qui ne répondrait jamais. */
if (typeof Path2D === "undefined"){
  $("btnItineraire").hidden = true;
  racine.classList.add("sans-itineraire");
}

$("btnItineraire").onclick = () =>
  $("itineraire").classList.contains("open") ? fermeItineraire() : ouvreItineraire();
$("closeItineraire").onclick = fermeItineraire;
$("videItineraire").onclick = effaceItineraire;

addEventListener("keydown", e => {
  if (e.key !== "Escape" || $("modale").classList.contains("open")) return;
  if (visee){ e.stopPropagation(); finVisee(); return; }
  if ($("iSugg").hidden) fermeItineraire();
});
/* ============================================================
   11 ter. Organiser sa journée
   ============================================================ */
/**
 * Le parcours dit ce qu'on veut voir. Il ne dit ni dans quel ordre, ni si la
 * journée y suffit — et c'est pourtant là que tout se joue : douze stands
 * retenus au hasard des allées, deux conférences à heure fixe, et un visiteur
 * qui repart en ayant traversé quatre fois le même hall sans voir la moitié
 * de sa liste.
 *
 * On lui demande donc une seule chose — à quelle heure il arrive — et on
 * range le reste : les conférences sont des rendez-vous qu'on ne déplace pas,
 * les stands se glissent entre elles, et l'ordre retenu est celui qui fait le
 * moins de chemin. Le temps passé sur un stand ne se devine pas depuis le
 * plan ; c'est l'exploitant qui le fixe, salon par salon.
 *
 * Ce qu'on rend n'est pas une promesse : une conversation s'éternise, une
 * conférence commence en retard, et l'heure de seize heures ne vaudra plus
 * rien à quatorze. C'est un ordre de visite, avec des heures qui disent ce
 * qui tient et ce qui ne tient pas.
 */

/**
 * Ce que coûte un changement de pavillon.
 *
 * Les données ne disent rien de ce qui relie deux halls — ni passerelle, ni
 * allée extérieure, ni distance — et l'itinéraire s'y coupe franchement
 * plutôt que d'inventer un tracé. Ordonner une journée demande pourtant un
 * prix : sans lui, l'algorithme ferait l'aller-retour entre deux pavillons
 * comme il change d'allée, et rendrait un programme absurde.
 *
 * Ce forfait n'est donc pas une mesure, c'est une dissuasion : plus cher que
 * n'importe quel détour à l'intérieur d'un seul hall, ce qui suffit à
 * regrouper les visites pavillon par pavillon. Il ne compte jamais dans la
 * distance annoncée — celle-ci ne porte que ce qui est tracé, et le dit.
 */
const TRANSFERT_M = 300;     // pour ordonner, jamais pour annoncer
const LIAISON_M = 60;        // quand un passage déclaré joint les deux plans
const TRANSFERT_MIN = 5;     // ce qu'on réserve dans l'horaire

/* L'heure d'arrivée d'une visite à l'autre : celui qui vient deux jours de
   suite vient rarement à deux heures différentes. */
const CLE_ARRIVEE = "plan-journee-arrivee";

let JOURNEE = null;      // la dernière journée calculée
let vueJournee = false;  // le tiroir montre-t-il la journée ou la liste ?

/* ------------------------------------------------------------
   Les heures
   ------------------------------------------------------------ */
const minutesDe = (d) => d ? (+d.h) * 60 + (+d.min) : null;
const finInstant = (c) => momentLocal(c.finLocal, DATA.fuseau) || momentLocal(c.fin, DATA.fuseau);

function ecritHeure(m){
  // une journée qui déborde sur la nuit repasse par zéro plutôt que d'écrire 26h
  const t = ((Math.round(m) % 1440) + 1440) % 1440;
  return String(Math.floor(t / 60)).padStart(2, "0") + "h" + String(t % 60).padStart(2, "0");
}
function ecritMinutes(m){
  const t = Math.max(1, Math.round(m));
  if (t < 60) return t + " min";
  const h = Math.floor(t / 60), r = t % 60;
  return h + " h" + (r ? " " + r + " min" : "");
}

/** Les jours où le salon a un programme, dans l'ordre. */
function joursSalon(){
  const vus = new Map();
  CONFS.forEach(c => {
    const d = instantConf(c);
    if (d && !vus.has(d.cle)) vus.set(d.cle, { cle: d.cle, nom: jourCourt(d) });
  });
  return [...vus.values()].sort((a, b) => a.cle.localeCompare(b.cle));
}

/** Le jour sur lequel la fenêtre s'ouvre : celui de la première conférence
 *  retenue, à défaut le premier du salon. */
function jourPropose(){
  const d = PARCOURS.confs.map(id => CONFS.get(id)).filter(Boolean)
    .map(instantConf).filter(Boolean)
    .sort((a, b) => a.cle.localeCompare(b.cle))[0];
  if (d) return d.cle;
  const j = joursSalon();
  return j.length ? j[0].cle : "";
}

/* ------------------------------------------------------------
   Les points de la journée
   ------------------------------------------------------------ */
/** Là où se tient une conférence : sa zone, qui est un objet du plan. Une
 *  conférence qui n'en a pas garde son heure et sa place dans la journée —
 *  on ne sait simplement pas y mener. */
function pointConf(c){
  const z = c.zone && parId.get(String(c.zone));
  return z ? pointObjet(z) : null;
}

/**
 * Les départs qu'on propose : les portes, et rien d'autre.
 *
 * La liste offrait tous les repères du salon, entrées en tête. On y lisait
 * donc « Escalier », « WC », « Distributeur » — des endroits par lesquels on
 * ne commence pas sa journée, et qui repoussaient les portes hors de l'écran
 * sur un téléphone. La question posée est « par où vous entrez » : seules les
 * portes y répondent.
 *
 * Un hall en a plusieurs, souvent nommées pareil : on les numérote alors, à
 * défaut de pouvoir les distinguer autrement. Les renommer — « Entrée Nord »
 * — reste le vrai remède, et il appartient à l'exploitant.
 */
function departsProposes(){
  const l = [];
  DATA.plans.forEach(p => portesDe(p).forEach(f => l.push(pointRepere(f, p))));
  const vus = new Map();
  l.forEach(pt => vus.set(pt.nom, (vus.get(pt.nom) || 0) + 1));
  const rang = new Map();
  l.forEach(pt => {
    if (vus.get(pt.nom) < 2) return;
    const n = (rang.get(pt.nom) || 0) + 1;
    rang.set(pt.nom, n);
    pt.nom = pt.nom + " " + n;
  });
  return l.slice(0, 20);
}

/**
 * De chaque arrêt à tous les autres.
 *
 * Un balayage en largeur par arrêt, et non un A* par paire : vingt arrêts
 * font quatre cents paires, et le hall entier coûte moins cher à balayer
 * qu'un seul chemin à chercher. La longueur obtenue est celle des allées,
 * sans prix du virage ni du bord — de quoi comparer deux ordres de visite,
 * ce qu'on lui demande. Le tracé montré au visiteur reste celui de `troncon`.
 */
function matriceJournee(pts, pmr){
  const n = pts.length;
  const D = [];
  for (let i = 0; i < n; i++) D.push(new Float64Array(n));
  /* Un arrêt qu'aucune allée n'atteint — un stand enclavé, un repère posé
     dans un mur — ne doit pas sortir de la journée pour autant : on retombe
     sur la distance à vol d'oiseau, majorée du détour qu'une allée impose. */
  const volDoiseau = (a, b) => Math.hypot(a.xy[0] - b.xy[0], a.xy[1] - b.xy[1]) * 1.3;

  const parPlan = new Map();
  pts.forEach((pt, i) => {
    if (!pt) return;
    if (!parPlan.has(pt.p)) parPlan.set(pt.p, []);
    parPlan.get(pt.p).push(i);
  });

  /* Ce qui sépare un arrêt de la sortie la plus proche de son plan : c'est
     par là que passe tout trajet vers un autre — la porte du hall, ou
     l'escalier qui monte à l'étage. */
  const auxPortes = new Float64Array(n);
  const relies = plansRelies(pmr);

  parPlan.forEach((idx, ip) => {
    const p = DATA.plans[ip];
    const g = grille(p, pmr);
    // l'emprise de l'arrêt : on n'accroche pas une allée à travers un voisin
    const cases = idx.map(i => accroche(g, pts[i].xy, pts[i].d));
    const portes = sortiesDe(p, pmr).map(f => accroche(g, f.pts[0]))
      .filter(c => c >= 0 && g.nappe[c]);
    idx.forEach((i, k) => {
      const d = distancesDepuis(g, cases[k]);
      idx.forEach((j, l) => {
        if (j === i) return;
        const c = cases[l];
        D[i][j] = (c >= 0 && d[c] >= 0) ? d[c] * PAS_GRILLE : volDoiseau(pts[i], pts[j]);
      });
      let mieux = -1;
      portes.forEach(c => { if (d[c] >= 0 && (mieux < 0 || d[c] < mieux)) mieux = d[c]; });
      auxPortes[i] = mieux >= 0 ? mieux * PAS_GRILLE : 0;
    });
  });

  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
    if (i === j || !pts[i] || !pts[j] || pts[i].p === pts[j].p) continue;
    /* Deux plans qu'un passage joint ne sont pas deux pavillons éloignés : le
       premier étage se rejoint par son escalier, et l'ordre de visite doit
       pouvoir y monter puis redescendre sans que le calcul le lui compte
       comme une traversée du salon. */
    const forfait = relies.has(pts[i].p + "|" + pts[j].p) ? LIAISON_M : TRANSFERT_M;
    D[i][j] = auxPortes[i] + forfait + auxPortes[j];
  }
  return D;
}

/* ------------------------------------------------------------
   L'ordre de visite
   ------------------------------------------------------------ */
/**
 * Ranger les stands entre les conférences.
 *
 * Le problème est celui du voyageur de commerce, avec des rendez-vous en
 * plus : l'ordre exact demanderait d'essayer toutes les permutations, et
 * vingt stands en font deux milliards de milliards. On construit donc au plus
 * juste — à chaque tour, le stand dont l'insertion coûte le moins, là où elle
 * tient — puis on reprend l'ensemble par deux mouvements qui rattrapent
 * l'essentiel : retourner un morceau de créneau, et déplacer un arrêt
 * ailleurs.
 *
 * Reste à dire ce que « coûter » veut dire, et c'est là que la première
 * version se trompait. Elle ne comptait que les mètres. Or un créneau qui se
 * termine sur une conférence dure ce qu'il dure, qu'on le remplisse ou non :
 * y glisser un stand ne coûtait donc rien de plus qu'ailleurs en distance, et
 * le calcul les entassait après la dernière conférence, où chaque insertion
 * se payait au plus court. Le visiteur se retrouvait avec deux heures
 * trente-neuf à patienter devant une salle, et six stands à voir ensuite.
 *
 * Compter le temps mort comme la marche — une minute d'attente valant une
 * minute de marche — rapprochait du but sans y être : dans un créneau qui a
 * du mou, les minutes de marche se retranchent exactement aux minutes
 * d'attente, et la distance s'annule. Le coût d'une insertion valait alors
 * « moins une visite », quel que soit le détour : tous les candidats faisaient
 * match nul et c'est le premier rencontré qui l'emportait. Les creux se
 * remplissaient, mais l'ordre à l'intérieur ne devait plus rien au chemin.
 *
 * On sépare donc les deux questions, parce que ce sont deux questions :
 *
 *   Ce qui pèse d'abord, c'est ce qui tombe après le dernier rendez-vous. Un
 *   créneau borné dure ce qu'il dure ; tout ce qu'on n'y met pas s'ajoute à
 *   la fin de la journée et rallonge l'attente d'autant. Un stand posé dans
 *   le créneau ouvert coûte donc le temps de sa visite, converti en mètres.
 *
 *   Ce qui départage ensuite, c'est la distance, et elle seule — un créneau
 *   borné ne coûte plus que ses mètres, l'attente n'y étant que ce qui reste.
 *
 * Le forfait n'est pas infranchissable, et c'est voulu : traverser deux
 * pavillons pour combler vingt minutes de creux n'a rien d'un progrès. Il
 * vaut ce que vaut la visite qu'on déplace, et un détour plus cher qu'elle
 * l'emporte.
 *
 * Un stand qui ne tient nulle part reste dehors et se dit : mieux vaut une
 * liste courte et vraie qu'un programme intenable.
 */
function rangeJournee(creneaux, restants, dist, tempsCreneau, penaliteTardive){
  const distanceCreneau = (c) => {
    let m = 0, prec = c.de;
    for (const s of c.stands){ m += dist(prec, s); prec = s; }
    return m + dist(prec, c.vers);
  };

  /**
   * Ce qu'un créneau coûte, en mètres.
   *
   * Le dernier n'a pas de fin : ce qu'on y met retarde la journée d'autant,
   * et chaque stand y porte le forfait. Les autres butent sur une conférence
   * et ne coûtent que leur chemin — ce qu'ils ne remplissent pas se passe à
   * patienter, ce dont le forfait rend déjà compte de l'autre côté. Un
   * créneau qui déborde vaut l'infini plutôt qu'un refus à part : un
   * rendez-vous manqué n'est pas un arrangement cher, c'en est un impossible.
   */
  const coutCreneau = (c) => {
    const m = distanceCreneau(c);
    if (c.tMax === null) return m + penaliteTardive * c.stands.length;
    return c.t0 + tempsCreneau(c, m) > c.tMax ? Infinity : m;
  };

  while (restants.length){
    let choix = null;
    for (const c of creneaux){
      const base = coutCreneau(c);
      // un créneau déjà intenable ne se répare pas en le chargeant davantage
      if (!isFinite(base)) continue;
      for (const s of restants){
        for (let k = 0; k <= c.stands.length; k++){
          c.stands.splice(k, 0, s);
          const cout = coutCreneau(c) - base;
          c.stands.splice(k, 1);
          if (isFinite(cout) && (!choix || cout < choix.cout)) choix = { cout: cout, c: c, k: k, s: s };
        }
      }
    }
    if (!choix) break;
    choix.c.stands.splice(choix.k, 0, choix.s);
    restants.splice(restants.indexOf(choix.s), 1);
  }

  /* Les deux reprises. Chacune se juge sur le coût entier des créneaux
     touchés, et non sur les seules arêtes déplacées : c'est l'attente qui
     l'impose, elle ne se lit pas sur une arête. */
  for (let tour = 0; tour < 30; tour++){
    let gagne = false;

    for (const c of creneaux){
      for (let i = 0; i < c.stands.length - 1; i++){
        for (let j = i + 1; j < c.stands.length; j++){
          const avant = coutCreneau(c);
          const copie = c.stands.slice();
          c.stands.splice(i, j - i + 1, ...c.stands.slice(i, j + 1).reverse());
          if (coutCreneau(c) < avant - 1e-9) gagne = true; else c.stands = copie;
        }
      }
    }

    for (const c of creneaux){
      for (let i = 0; i < c.stands.length; i++){
        const s = c.stands[i];
        /* Un déplacement ne touche que deux créneaux — celui qu'on quitte et
           celui qu'on rejoint : les autres n'ont pas à être recomptés. */
        const avantC = coutCreneau(c);
        c.stands.splice(i, 1);
        const apresC = coutCreneau(c);
        let mieux = null;
        for (const d of creneaux){
          const avant = d === c ? avantC : avantC + coutCreneau(d);
          for (let k = 0; k <= d.stands.length; k++){
            d.stands.splice(k, 0, s);
            const t = d === c ? coutCreneau(d) : coutCreneau(d) + apresC;
            d.stands.splice(k, 1);
            if (t < avant - 1e-9 && (!mieux || t - avant < mieux.gain))
              mieux = { gain: t - avant, d: d, k: k };
          }
        }
        if (mieux){ mieux.d.stands.splice(mieux.k, 0, s); gagne = true; }
        else c.stands.splice(i, 0, s);
      }
    }

    if (!gagne) break;
  }
}

/* ------------------------------------------------------------
   La journée, calculée
   ------------------------------------------------------------ */
/**
 * Ce que le visiteur a demandé : une heure d'arrivée, un jour, un point de
 * départ. Ce qu'on lui rend : un déroulé, un tracé, et la liste franche de ce
 * qui n'a pas trouvé sa place.
 */
function calculeJournee(choix){
  const pmr = ITI.pmr;
  const tv = minutesVisite();
  const allure = pmr ? ALLURE_PMR : ALLURE;
  const enMinutes = (m) => m / (allure * 60);

  const stands = PARCOURS.stands.map(id => parId.get(id)).filter(Boolean);
  const horsJour = [], passees = [], sansLieu = [], chevauchent = [];

  const retenues = PARCOURS.confs.map(id => CONFS.get(id)).filter(Boolean)
    .map(c => ({ c: c, d: instantConf(c), f: finInstant(c) }))
    .sort((a, b) => (minutesDe(a.d) || 0) - (minutesDe(b.d) || 0));

  const rdv = [];
  let finPrec = -Infinity;
  retenues.forEach(x => {
    if (!x.d || (choix.jour && x.d.cle !== choix.jour)){ horsJour.push(x.c); return; }
    const t0 = minutesDe(x.d);
    /* Une conférence commencée avant l'arrivée n'est plus un rendez-vous :
       on ne la fait pas manquer, on la dit manquée. */
    if (t0 < choix.arrivee){ passees.push(x.c); return; }
    /* Deux conférences qui se recouvrent ne se suivent pas : on ne peut pas
       assister aux deux, et les enchaîner ferait une journée qui remonte le
       temps. On garde celle qui commence la première — retenue plus tôt dans
       la liste, elle est aussi celle qu'on peut encore attraper — et on dit
       l'autre plutôt que de la programmer pour rien. */
    if (t0 < finPrec){ chevauchent.push(x.c); return; }
    const pt = pointConf(x.c);
    if (!pt) sansLieu.push(x.c);
    /* Sans heure de fin, on compte une heure : enchaîner aussitôt ferait un
       programme faux, et attendre la journée entière un programme vide. */
    const t1 = x.f ? Math.max(t0 + 5, minutesDe(x.f)) : t0 + 60;
    rdv.push({ c: x.c, pt: pt, t0: t0, t1: t1 });
    finPrec = t1;
  });

  /* Les points, dans un seul tableau : le départ, les stands, les salles.
     C'est leur rang qui sert d'identité partout ensuite. */
  const PTS = [];
  const iDepart = choix.depart ? PTS.push(choix.depart) - 1 : -1;
  const iStands = stands.map(o => PTS.push(pointObjet(o)) - 1);
  rdv.forEach(r => { r.i = PTS.push(r.pt) - 1; });

  const D = matriceJournee(PTS, pmr);
  /* Un bout de trajet dont on ignore un des deux bouts ne coûte rien : le
     départ « peu importe » et une salle non située ne sont pas des détours,
     ce sont des trous. */
  const dist = (a, b) => (a < 0 || b < 0 || !PTS[a] || !PTS[b]) ? 0 : D[a][b];
  const tempsCreneau = (c, m) => enMinutes(m) + c.stands.length * tv;

  /* Les intervalles entre rendez-vous, c'est là qu'on range les stands. Une
     conférence dont la salle n'est située nulle part borne l'heure sans borner
     le lieu : on ne sait pas s'en approcher, et on repart d'où l'on était. */
  const creneaux = [];
  let de = iDepart, t0 = choix.arrivee;
  rdv.forEach(r => {
    creneaux.push({ de: de, t0: t0, vers: r.pt ? r.i : -1, tMax: r.t0, stands: [] });
    if (r.pt) de = r.i;
    t0 = r.t1;
  });
  creneaux.push({ de: de, t0: t0, vers: -1, tMax: null, stands: [] });

  /* Ce que coûte un stand renvoyé après le dernier rendez-vous : sa visite
     entière, comptée en mètres au pas de marche. C'est exactement ce qu'elle
     ajoute à la fin de la journée — et ce qu'un creux plus tôt aurait absorbé
     sans rien coûter. */
  const restants = iStands.slice();
  rangeJournee(creneaux, restants, dist, tempsCreneau, allure * 60 * tv);

  /* L'ordre est arrêté : on le déroule en heures et en tronçons. Les mètres
     annoncés sont ceux du tracé, pas ceux de la matrice — c'est le trait que
     le visiteur suivra. */
  const etapes = [], arrets = [], trace = [], retards = [];
  let t = choix.arrivee, m = 0, coupe = false, rang = 0;

  /**
   * D'un arrêt au suivant.
   *
   * C'est le même calcul que le trajet d'un point à un autre, et pour la même
   * raison : un escalier déclaré fait continuer la journée à l'étage au lieu
   * de la couper au bord du plan. Un trajet en plusieurs morceaux donne
   * plusieurs lignes dans le déroulé — on marche, on prend l'escalier, on
   * marche encore — car c'est bien ce que le visiteur fera.
   */
  const rejoint = (a, b) => {
    if (a < 0 || b < 0 || !PTS[a] || !PTS[b]) return;
    const r = routeEntre(PTS[a], PTS[b], pmr);
    if (r.coupe) coupe = true;
    for (const e of r.etapes){
      trace.push(e);
      if (e.genre === "marche"){
        etapes.push({ genre: "marche", m: e.m, min: enMinutes(e.m), trace: true });
        t += enMinutes(e.m);
        m += e.m;
      } else if (e.genre === "liaison"){
        /* Le temps du passage est celui que l'exploitant a fixé pour ce
           couple-là : la journée le réserve dans l'horaire, comme elle
           réserve le temps de marche. */
        etapes.push(e);
        t += e.min || 0;
      } else {
        etapes.push({ genre: "transfert", de: e.de, vers: e.vers, min: TRANSFERT_MIN });
        t += TRANSFERT_MIN;
      }
    }
    /* Rien de tracé alors que les deux arrêts partagent leur plan : un stand
       enclavé, une allée introuvable. La matrice, elle, a une distance — celle
       qui a servi à ranger la journée — et l'annoncer vaut mieux que de
       laisser croire à un pas de porte. Entre deux plans elle porterait le
       forfait de dissuasion, qui n'a jamais sa place dans les mètres
       annoncés : on n'ajoute alors rien. */
    if (PTS[a].p === PTS[b].p && !r.etapes.some(e => e.genre === "marche")){
      const l = dist(a, b);
      etapes.push({ genre: "marche", m: l, min: enMinutes(l), trace: false });
      t += enMinutes(l);
      m += l;
    }
  };

  const pose = (i, conf) => {
    rang++;
    if (PTS[i]) arrets.push({ p: PTS[i].p, xy: PTS[i].xy, n: String(rang), conf: !!conf });
    return rang;
  };

  if (iDepart >= 0){
    arrets.push({ p: PTS[iDepart].p, xy: PTS[iDepart].xy, n: "", depart: true });
    etapes.push({ genre: "depart", nom: choix.depart.nom, detail: choix.depart.detail, t: t });
  }

  let ou = iDepart;
  creneaux.forEach((c, k) => {
    c.stands.forEach(s => {
      rejoint(ou, s);
      const n = pose(s, false);
      etapes.push({ genre: "stand", n: n, o: parId.get(PTS[s].id), pt: PTS[s], t0: t, t1: t + tv });
      t += tv;
      ou = s;
    });
    const r = rdv[k];
    if (!r) return;
    rejoint(ou, r.i);
    const arrive = t;                       // l'heure qu'il serait vraiment
    if (arrive > r.t0 + 1) retards.push({ c: r.c, min: arrive - r.t0 });
    /* Un creux avant le premier rendez-vous n'est pas de même nature que les
       autres : ceux du milieu de journée sont pris entre deux choses fixes,
       celui-là ne tient qu'à l'heure qu'on a dite en arrivant. Le visiteur
       peut donc s'en débarrasser tout seul, et c'est la seule chose utile à
       lui dire — le total, lui, ne changera pas d'un pouce. */
    else if (arrive < r.t0) etapes.push({ genre: "attente", min: r.t0 - arrive,
                                          premier: k === 0 });
    const n = pose(r.i, true);
    /* Le retard voyage avec la conférence : la ligne garde l'heure du
       programme — c'est elle qui est affichée partout ailleurs — et dit à
       côté celle où l'on y serait vraiment. Une alerte en bas de tiroir se
       lit trop tard pour la ligne qu'elle concerne. */
    etapes.push({ genre: "conf", n: n, c: r.c, pt: r.pt, t0: r.t0, t1: r.t1,
                  retard: Math.max(0, arrive - r.t0) });
    /* La conférence garde ses heures — ce sont celles du programme — mais
       l'horloge du visiteur, elle, ne remonte pas : arriver après la fin
       d'une séance n'est pas y assister, et la suite de la journée part de
       l'heure qu'il est, non de celle qu'on aurait aimé. */
    t = Math.max(arrive, r.t1);
    /* Une conférence dont la salle n'est rattachée à aucune zone ne dit pas
       où l'on se trouve après elle : on repart du dernier endroit connu,
       sans quoi le trajet suivant — un changement de pavillon, souvent —
       disparaîtrait du déroulé sans un mot. */
    if (r.pt) ou = r.i;
  });

  return {
    jour: choix.jour, jourNom: choix.jourNom, arrivee: choix.arrivee, fin: t,
    pmr: pmr, tv: tv, etapes: etapes, arrets: arrets, trace: trace, m: m, coupe: coupe,
    nArrets: rang,
    /* De quoi expliquer un creux plutôt que de le laisser sans réponse : ce
       qu'on attend en tout, et ce qui reste programmé après le dernier
       rendez-vous — les deux ensemble disent si l'attente était évitable. */
    attente: etapes.reduce((a, e) => a + (e.genre === "attente" ? e.min : 0), 0),
    tardifs: creneaux[creneaux.length - 1].stands.length,
    restants: restants.map(i => parId.get(PTS[i].id)).filter(Boolean),
    horsJour: horsJour, passees: passees, sansLieu: sansLieu, retards: retards,
    chevauchent: chevauchent,
  };
}

/* ------------------------------------------------------------
   Ce que la journée montre
   ------------------------------------------------------------ */
function rangJournee(hote, heure, dedans, classe){
  const d = document.createElement("div");
  d.className = "jRang" + (classe ? " " + classe : "");
  const h = document.createElement("span");
  h.className = "jH";
  h.textContent = heure || "";
  d.appendChild(h);
  d.appendChild(dedans);
  hote.appendChild(d);
  return d;
}

function lienJournee(hote, texte){
  const s = document.createElement("span");
  s.className = "jL";
  s.textContent = texte;
  rangJournee(hote, "", s, "lien");
}

function arretJournee(hote, e){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "jArret" + (e.genre === "conf" ? " conf" : "");
  b.innerHTML = '<span class="jN"></span><span class="jTxt"><span class="jT"></span>' +
                '<span class="jS"></span></span><span class="jD"></span>';
  b.querySelector(".jN").textContent = e.n;
  b.querySelector(".jD").textContent = ecritMinutes(e.t1 - e.t0);
  if (e.genre === "conf"){
    if (e.c.couleur) b.style.setProperty("--tc", e.c.couleur);
    b.querySelector(".jT").textContent = e.c.nom;
    b.querySelector(".jS").textContent =
      ([e.c.salle, e.pt ? e.pt.detail : ""].filter(Boolean).join(" · ") ||
       "Salle non située sur le plan") +
      (e.retard > 1 ? " · vous y seriez à " + ecritHeure(e.t0 + e.retard) : "");
    if (e.retard > 1) b.classList.add("tard");
    b.onclick = () => ficheConf(e.c.id, "parcours");
  } else {
    b.querySelector(".jT").textContent = e.pt.nom;
    b.querySelector(".jS").textContent = e.pt.detail;
    b.onclick = () => { if (e.o) select(e.o.id, true, "parcours"); };
  }
  rangJournee(hote, ecritHeure(e.t0), b);
}

function remplitJournee(){
  const hote = $("jCorps");
  hote.innerHTML = "";
  const j = JOURNEE;
  if (!j) return;

  /* Les notes et les alertes sont celles de l'itinéraire, classes comprises :
     c'est la même voix qui parle du même calcul, à deux endroits du tiroir. */
  const dit = (cls, txt) => {
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = txt;
    hote.appendChild(p);
    return p;
  };

  if (j.perime) dit("iAlerte", "Votre parcours a changé depuis ce calcul : " +
    "reprenez-le pour que la journée en tienne compte.");

  const bilan = document.createElement("div");
  bilan.className = "jBilan";
  bilan.innerHTML = '<b></b><span></span>';
  bilan.querySelector("b").textContent = ecritHeure(j.arrivee) + " – " + ecritHeure(j.fin);
  bilan.querySelector("span").textContent =
    [j.nArrets + (j.nArrets > 1 ? " arrêts" : " arrêt"),
     (j.coupe ? "au moins " : "") + ecritDistance(j.m) + " de marche",
     j.pmr ? "itinéraire accessible" : ""].filter(Boolean).join(" · ");
  hote.appendChild(bilan);

  const fil = document.createElement("div");
  fil.className = "jFil";
  hote.appendChild(fil);

  j.etapes.forEach(e => {
    if (e.genre === "depart"){
      const s = document.createElement("span");
      s.className = "jL";
      s.textContent = "Départ : " + e.nom;
      rangJournee(fil, ecritHeure(e.t), s, "lien");
    } else if (e.genre === "marche"){
      lienJournee(fil, ecritDistance(e.m) + " · " + ecritMinutes(e.min) + " de marche" +
        (e.trace ? "" : " (non tracé)"));
    } else if (e.genre === "liaison"){
      lienJournee(fil, phraseLiaison(e).s);
    } else if (e.genre === "transfert"){
      lienJournee(fil, "Rejoignez le " + e.vers + " · comptez " + ecritMinutes(e.min) +
        ", ce trajet n'est pas sur le plan");
    } else if (e.genre === "attente"){
      lienJournee(fil, ecritMinutes(e.min) + " sur place avant le début" +
        (e.premier && e.min >= 15
          ? " — en arrivant à " + ecritHeure(j.arrivee + e.min) + ", vous ne perdriez rien"
          : ""));
    } else {
      arretJournee(fil, e);
    }
  });

  /* Ce qui n'entre pas dans la journée se dit, et se dit précisément : un
     rang laissé de côté sans un mot passerait pour un oubli du calcul. Ces
     listes empruntent leurs rangs au parcours — même vignette, même croix :
     ce sont les mêmes choses, vues d'ailleurs. */
  const groupe = (titre, liste, rendu) => {
    if (!liste.length) return;
    const g = document.createElement("div");
    g.className = "pGroupe jReste";
    g.innerHTML = '<span class="eyebrow"></span>';
    g.querySelector(".eyebrow").textContent = titre;
    liste.forEach(x => rangParcours(g, rendu(x)));
    hote.appendChild(g);
  };

  /* Un rendez-vous qu'on n'atteint pas ne se raye pas tout seul : le visiteur
     décidera ce qu'il sacrifie, pas nous. */
  j.retards.forEach(r => dit("iAlerte", "« " + r.c.nom + " » : au mieux, vous y " +
    "arriveriez " + ecritMinutes(r.min) + " après le début — le trajet n'y suffit " +
    "pas. Arrivez plus tôt, ou retirez ce qui la précède."));

  /* En l'état cette liste reste vide : la journée n'a pas d'heure de fin, si
     bien qu'un stand refusé entre deux conférences finit toujours par tenir
     après la dernière. C'est le garde-fou de la contrainte horaire — le jour
     où l'on demandera aussi à quelle heure le visiteur repart, c'est ici
     qu'il lira ce qui n'y tient pas, plutôt que de recompter ses stands. */
  groupe("Restés de côté", j.restants, o => ({
    genre: "stand", id: o.id, dessus: false,
    titre: o.nom || o.plan || ("Stand " + (o.code || "")).trim(),
    detail: DATA.plans[o.p].libelle + (o.code ? " · " + o.code : ""),
    ouvre: () => select(o.id, true, "parcours"),
  }));

  groupe("Un autre jour", j.horsJour, c => ({
    genre: "conf", id: c.id, couleur: c.couleur, dessus: true,
    titre: c.nom, detail: jourCourt(instantConf(c)) || "date inconnue",
    ouvre: () => ficheConf(c.id, "parcours"),
  }));

  groupe("En même temps qu'une autre", j.chevauchent, c => ({
    genre: "conf", id: c.id, couleur: c.couleur, dessus: true,
    titre: c.nom,
    detail: (instantConf(c) ? instantConf(c).h + "h" + instantConf(c).min : "") +
            (c.salle ? " · " + c.salle : ""),
    ouvre: () => ficheConf(c.id, "parcours"),
  }));

  groupe("Déjà commencées à votre arrivée", j.passees, c => ({
    genre: "conf", id: c.id, couleur: c.couleur, dessus: true,
    titre: c.nom,
    detail: (instantConf(c) ? instantConf(c).h + "h" + instantConf(c).min : "") +
            (c.salle ? " · " + c.salle : ""),
    ouvre: () => ficheConf(c.id, "parcours"),
  }));

  if (j.sansLieu.length) dit("iNote", j.sansLieu.length > 1
    ? "Certaines conférences retenues ne sont rattachées à aucune zone du plan : " +
      "elles gardent leur heure, mais le trajet ne peut pas y mener."
    : "« " + j.sansLieu[0].nom + " » n'est rattachée à aucune zone du plan : elle " +
      "garde son heure, mais le trajet ne peut pas y mener.");

  /* Une demi-heure à patienter se remarque, et sans un mot elle passe pour une
     étourderie du calcul. On dit donc d'où elle vient — il n'y avait plus rien
     à voir, ou l'avancer coûtait plus de marche qu'elle ne fait gagner — et ce
     qui la comblerait. */
  if (j.attente >= 30) dit("iNote", "Il reste " + ecritMinutes(j.attente) +
    " d'attente dans cette journée. " + (j.tardifs
      ? "Avancer ce qui suit la dernière conférence demanderait un détour plus " +
        "long que le temps gagné."
      : "Votre parcours ne contient plus rien à visiter d'ici là : ajoutez des " +
        "exposants pour la combler."));

  dit("iNote", "Comptez " + ecritMinutes(j.tv) + " par stand. Les heures sont " +
    "indicatives : elles supposent qu'on ne s'attarde pas, et ne tiennent compte " +
    "ni des files ni des pauses.");
}

/* ------------------------------------------------------------
   Les deux vues du tiroir
   ------------------------------------------------------------ */
/** Le tiroir montre la liste ou la journée, jamais les deux : c'est la même
 *  journée, lue avant puis après le calcul. */
function appliqueVueParcours(){
  const sur = vueJournee && !!JOURNEE;
  $("pCorps").hidden = sur;
  $("pPied").hidden = sur;
  $("jCorps").hidden = !sur;
  $("jPied").hidden = !sur;
  $("pEyebrow").textContent = sur ? "Ma journée" : "Mon parcours";
  $("pTitre").textContent = sur ? (JOURNEE.jourNom || "Journée organisée") : "Parcours de visite";
  if (sur){
    $("pResume").textContent = ecritHeure(JOURNEE.arrivee) + " – " + ecritHeure(JOURNEE.fin);
    remplitJournee();
    traceJournee();
  } else {
    rafraichitParcours();
  }
}

/**
 * La journée reprend le trait du plan.
 *
 * L'itinéraire d'un point à un autre y prétend aussi, et le visiteur passe de
 * l'un à l'autre : chacun se redonne le trait en revenant, plutôt que de
 * laisser à l'écran le tracé de son voisin. L'objet dessiné est retenu tel
 * quel — c'est à lui qu'on reconnaît, ailleurs, que le trait est celui de la
 * journée et non d'un trajet demandé à côté.
 */
function traceJournee(){
  if (!JOURNEE) return;
  JOURNEE.dessin = JOURNEE.dessin || { etapes: JOURNEE.trace, arrets: JOURNEE.arrets };
  if (TRACE === JOURNEE.dessin) return;
  TRACE = JOURNEE.dessin;
  dessineItineraire();
}

function montreJournee(){
  vueJournee = true;
  appliqueVueParcours();
  /* La journée commence dans le pavillon du premier arrêt : c'est celui qu'il
     faut montrer, même si l'on regardait ailleurs en la demandant. */
  const premier = JOURNEE.trace.find(e => e.genre === "marche");
  if (premier && premier.p !== state.plan) changePlan(premier.p);
  traceJournee();
  if (premier) cadreItineraire();
}

/** Le parcours a changé : la journée calculée ne lui correspond plus. On ne
 *  la refait pas dans le dos du visiteur — on le lui dit. */
function perimeJournee(){
  if (!JOURNEE || JOURNEE.perime) return;
  JOURNEE.perime = true;
  if (vueJournee) remplitJournee();
}

/* ------------------------------------------------------------
   La question posée avant le calcul
   ------------------------------------------------------------ */
function ouvreOrganisation(){
  const jours = joursSalon();
  const propose = jourPropose();
  let arrivee = "09:00";
  try { arrivee = localStorage.getItem(CLE_ARRIVEE) || arrivee; } catch (e) {}
  const departs = departsProposes();

  let champHeure = null, champJour = null, champDepart = null;

  ouvreModale("Organiser ma journée", corps => {
    const p = document.createElement("p");
    p.textContent = "On place d'abord les conférences que vous avez retenues — " +
      "elles ne se déplacent pas — puis on glisse les stands entre elles, dans " +
      "l'ordre qui fait le moins de chemin.";
    corps.appendChild(p);

    const form = document.createElement("div");
    form.className = "jForm";

    const bloc = (libelle, champ) => {
      const l = document.createElement("label");
      const e = document.createElement("span");
      e.className = "eyebrow";
      e.textContent = libelle;
      l.appendChild(e);
      l.appendChild(champ);
      form.appendChild(l);
      return champ;
    };

    champHeure = document.createElement("input");
    champHeure.type = "time";
    champHeure.value = arrivee;
    bloc("Heure d'arrivée", champHeure);

    if (jours.length > 1){
      champJour = document.createElement("select");
      jours.forEach(j => {
        const o = document.createElement("option");
        o.value = j.cle;
        o.textContent = j.nom;
        if (j.cle === propose) o.selected = true;
        champJour.appendChild(o);
      });
      bloc("Jour de visite", champJour);
    }

    if (departs.length){
      champDepart = document.createElement("select");
      const vide = document.createElement("option");
      vide.value = "";
      vide.textContent = "Peu importe";
      champDepart.appendChild(vide);
      departs.forEach((pt, i) => {
        const o = document.createElement("option");
        o.value = String(i);
        // le pavillon en second, et seulement s'il y en a plusieurs : sur un
        // salon d'un seul hall, il répétait son nom à chaque ligne
        o.textContent = pt.nom + (DATA.plans.length > 1 ? " — " + pt.detail : "");
        if (i === 0) o.selected = true;
        champDepart.appendChild(o);
      });
      bloc("Par où vous entrez", champDepart);
    } else {
      /* Aucune porte marquée sur le plan : la question ne se pose pas, et son
         absence se remarquerait plus que sa réponse. On dit d'où l'on partira
         plutôt que de laisser croire à un oubli — et l'exploitant qui lit son
         propre plan y reconnaît ce qu'il lui reste à poser. */
      const n = document.createElement("p");
      n.className = "jSansPorte";
      n.textContent = "Aucune entrée n'est repérée sur ce plan : la journée " +
        "commencera au premier exposant de votre liste.";
      form.appendChild(n);
    }

    corps.appendChild(form);
  }, [
    { libelle: "Annuler" },
    { libelle: "Organiser", action: () => {
      const v = /^(\d{1,2}):(\d{2})$/.exec(champHeure.value || "");
      // une heure illisible vaut mieux corrigée que refusée : le champ natif
      // ne rend rien sur les navigateurs qui l'ignorent
      const min = v ? Math.min(1439, +v[1] * 60 + +v[2]) : 9 * 60;
      try { localStorage.setItem(CLE_ARRIVEE, ecritHeure(min).replace("h", ":")); } catch (e) {}
      const cle = champJour ? champJour.value : (jours.length ? jours[0].cle : "");
      const j = jours.find(x => x.cle === cle);
      const id = champDepart ? champDepart.value : "";
      lanceJournee({
        arrivee: min, jour: cle, jourNom: j ? j.nom : "",
        depart: id === "" ? null : departs[+id],
      });
    } },
  ]);
}

/**
 * Le calcul passe par un temps mort volontaire, comme celui de l'itinéraire :
 * une matrice, une insertion et une vingtaine de tronçons tiennent en une
 * fraction de seconde sur un poste, davantage sur un téléphone de salon. On
 * annonce d'abord, on calcule ensuite.
 */
function lanceJournee(choix){
  vueJournee = true;
  JOURNEE = null;
  $("pCorps").hidden = $("pPied").hidden = true;
  $("jCorps").hidden = $("jPied").hidden = false;
  $("pEyebrow").textContent = "Ma journée";
  $("pTitre").textContent = choix.jourNom || "Journée organisée";
  $("pResume").textContent = "calcul…";
  $("jCorps").innerHTML = '<p class="iNote">Recherche du meilleur ordre de visite…</p>';
  /* Organiser une journée, c'est calculer une vingtaine d'itinéraires : cela
     se compte avec eux, faute d'un genre à soi en base. */
  mesure("itineraire");
  setTimeout(() => {
    try {
      JOURNEE = calculeJournee(choix);
    } catch (e){
      console.warn("Journée :", e);
      $("pResume").textContent = "—";
      $("jCorps").innerHTML = '<p class="iAlerte"></p>';
      $("jCorps").querySelector(".iAlerte").textContent =
        "Le calcul de la journée n'a pas abouti sur cet appareil. " +
        "Votre parcours, lui, est intact.";
      return;
    }
    montreJournee();
  }, 30);
}
