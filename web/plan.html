$("btnJournee").onclick = ouvreOrganisation;
$("jRefaire").onclick = ouvreOrganisation;
$("jRetour").onclick = () => { vueJournee = false; appliqueVueParcours(); };

/* ============================================================
   13. Mesure d'utilisation

   L'organisateur paie le plan et ne sait pas s'il sert. Ce module compte les
   gestes — une visite, une recherche, une fiche ouverte et par quel chemin —
   et les pousse par paquets vers la fonction `mesure`. Le rapport se lit
   depuis la console, sur sa page dédiée.

   Trois choses qu'il ne fait pas, et c'est ce qui permet de le laisser tourner
   sans bandeau de consentement : il ne pose pas de cookie, il n'envoie ni
   adresse ni agent utilisateur — le serveur ne les enregistre pas davantage —
   et le jeton de visiteur est tiré au hasard par le navigateur, propre à cet
   événement. Il ne suit personne d'un salon à l'autre, encore moins ailleurs.

   Il se tait complètement dans deux cas : la page à données figées, qui n'a
   aucune API à appeler, et la page d'administration, où ce qu'on mesurerait
   serait l'exploitant en train de préparer son salon.
   ============================================================ */
const MESURE_API = API ? API.replace(/[^/]*$/, "mesure") : "";
const MESURE_ACTIVE = !!(MESURE_API && SLUG &&
  document.documentElement.dataset.role !== "admin");

/** Un jeton de quelques caractères, tiré du générateur du navigateur. */
function jetonMesure(){
  const t = new Uint8Array(9);
  (crypto && crypto.getRandomValues ? crypto : { getRandomValues: a => {
    for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  } }).getRandomValues(t);
  return Array.from(t, o => o.toString(36).padStart(2, "0")).join("");
}

/**
 * Le jeton retenu, ou un jeton volatil si le stockage est refusé.
 *
 * En navigation privée, ou stockage plein, l'écriture lève. On ne renonce pas
 * à mesurer pour autant : le visiteur comptera pour un de plus, ce qui vaut
 * mieux que de ne pas le compter du tout.
 *
 * Le casier est nommé plutôt que passé : quand le navigateur refuse le
 * stockage de site — cookies bloqués — c'est la simple lecture de
 * `localStorage` qui lève, et l'évaluer à l'appel plaçait cette lecture hors
 * du `try`. L'exception remontait alors au corps de la page, dans le script
 * qui porte tout le plan : plus rien ne s'affichait, pour une mesure.
 */
function jetonRetenu(cle, casier){
  try {
    const ou = window[casier];
    const v = ou.getItem(cle);
    if (v) return v;
    const n = jetonMesure();
    ou.setItem(cle, n);
    return n;
  } catch (e) {
    return jetonMesure();
  }
}

/* Le jeton de visiteur est rangé sous le nom de l'événement : deux salons
   ouverts sur le même téléphone n'ont pas le même, et aucun ne vaut comme
   identifiant hors d'ici. Ce qui distinguait deux venues du même navigateur
   ne se transmet plus : le serveur ne le lisait pas, et une visite se compte
   déjà par le geste qui porte ce nom. */
const MESURE_VISITEUR = MESURE_ACTIVE
  ? jetonRetenu("plan-visiteur:" + SLUG, "localStorage") : "";

/* Un geste ne vaut pas un aller-retour réseau : on accumule, et on envoie
   quand le paquet est plein, quand la main s'arrête, ou quand la page part.

   Trente secondes et non quatre : à quatre, chaque fiche ouverte au fil d'une
   visite partait dans son propre paquet, et un visiteur produisait une
   quinzaine de requêtes — de loin le premier poste d'appels du système, devant
   le plan lui-même. Rien ne se perd pour autant, le départ de la page vidant
   ce qui reste. */
const MESURE_PAQUET = 20;
const MESURE_DELAI = 30000;
let _gestes = [], _envoiDiffere = null;

function envoieMesures(dernier){
  clearTimeout(_envoiDiffere);
  _envoiDiffere = null;
  if (!_gestes.length) return;
  const charge = JSON.stringify({
    slug: SLUG, visiteur: MESURE_VISITEUR,
    gestes: _gestes.splice(0, _gestes.length),
  });
  /* Au départ de la page, `fetch` est coupé net par le navigateur : le paquet
     se perdrait, et avec lui les derniers gestes — souvent les plus parlants.
     `sendBeacon` est fait pour cela, il survit à la fermeture de l'onglet. */
  try {
    if (dernier && navigator.sendBeacon &&
        navigator.sendBeacon(MESURE_API, charge)) return;
  } catch (e) {}
  fetch(MESURE_API, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: charge, keepalive: true,
    // la mesure ne doit jamais gêner la visite : une panne se tait
  }).catch(() => {});
}

/**
 * Retenir un geste, et ce qu'il désignait s'il désignait quelque chose.
 *
 *   mesure("fiche_stand", "plan", o.id)   une fiche d'exposant, ouverte du plan
 *   mesure("recherche")                   une recherche menée à son terme
 *
 * Le vocabulaire est celui des compteurs ; le serveur écarte ce qu'il ne
 * connaît pas plutôt que de l'enregistrer sous un nom approximatif, et une
 * cible que l'événement ne porte pas est écartée de même.
 */
function mesure(genre, canal, cible){
  if (!MESURE_ACTIVE) return;
  const g = { genre: genre };
  if (canal) g.canal = canal;
  if (cible) g.cible = cible;
  _gestes.push(g);
  if (_gestes.length >= MESURE_PAQUET) return envoieMesures();
  clearTimeout(_envoiDiffere);
  _envoiDiffere = setTimeout(() => envoieMesures(), MESURE_DELAI);
}

if (MESURE_ACTIVE){
  /* Une visite par session d'onglet. Rouvrir le plan après l'avoir fermé en
     fait une seconde ; naviguer dedans pendant deux heures, une seule. */
  const CLE_VUE = "plan-visite:" + SLUG;
  let dejaVue = false;
  try { dejaVue = !!sessionStorage.getItem(CLE_VUE); } catch (e) {}
  if (!dejaVue){
    try { sessionStorage.setItem(CLE_VUE, "1"); } catch (e) {}
    mesure("visite");
  }

  /* `pagehide` est le seul événement sur lequel on puisse compter partout :
     sur mobile, une page mise en arrière-plan n'est jamais « déchargée », elle
     est gelée puis jetée sans prévenir. */
  addEventListener("pagehide", () => envoieMesures(true));
  addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") envoieMesures(true);
  });
}
/* ============================================================
   12. Démarrage
   ============================================================ */
/* ------------------------------------------------------------------
   Démarrage : données figées si elles sont dans la page, sinon appel
   à l'API. Une panne du réseau doit se voir, pas laisser un écran vide.
   ------------------------------------------------------------------ */
function demarre(d){
  indexe(d);
  montePlan();
  fit();
  liste();
  // le plan chargé, le bouton peut dire ce qui reste à publier
  majAttente();
  // le plan est manipulable : le fond peut arriver derrière
  chargeFond(state.plan);
  const v = decodeURIComponent((location.hash || "").slice(1)).toLowerCase();
  if (v && v !== "admin"){
    const cible = TOUS.find(o => String(o.code || "").toLowerCase() === v);
    if (cible) setTimeout(() => select(cible.id, true, "lien"), 80);
  }
}

function annonce(txt, erreur){
  const l = $("list");
  l.innerHTML = '<div class="empty"></div>';
  l.querySelector(".empty").textContent = txt;
  if (erreur) l.querySelector(".empty").style.color = "var(--rouge, #C2372B)";
  $("countTxt").textContent = erreur ? "Indisponible" : "Chargement…";
  // plus rien n'arrivera : le titre neutre est définitif, il cesse d'attendre
  if (erreur) $("titre").classList.remove("attente");
}

/**
 * En-têtes de l'appel. En administration on présente sa session : c'est elle
 * qui donne accès aux événements encore en brouillon. Ils sont lus à chaque
 * appel, pas au démarrage : la session n'existe qu'une fois l'identité vérifiée.
 */
function entetesApi(){
  const e = {};
  if (document.documentElement.dataset.role !== "admin") return e;
  try {
    const cfg = JSON.parse(localStorage.getItem("console-config") || "null")
                || window.PLAN_CONFIG || null;
    const ses = JSON.parse(localStorage.getItem("console-session") || "null");
    if (cfg?.anonKey && ses?.access_token){
      e["apikey"] = cfg.anonKey;
      e["Authorization"] = "Bearer " + ses.access_token;
    }
  } catch (err) {}
  return e;
}

/**
 * Le fond d'un pavillon : cinquante fois le poids des stands, et purement
 * décoratif. On le charge après coup, une seule fois par pavillon, et on
 * l'injecte s'il concerne encore celui qu'on regarde. Son adresse porte une
 * empreinte de ce qu'il contient : le navigateur le garde indéfiniment, et ne
 * le redemande que lorsque le dessin servi n'est plus le même.
 */
const _fonds = new Map();
function chargeFond(i){
  const p = DATA?.plans?.[i];
  if (!p || !API) return Promise.resolve();
  if (p.fond.length === 0 || p.fond.every(c => c.svg !== undefined)) return Promise.resolve();
  if (_fonds.has(p.id)) return _fonds.get(p.id);

  /* La version vient du service, qui la calcule sur ce qu'il servira vraiment :
     l'empreinte des dessins, sa façon de les découper, et — pour un visiteur,
     seul à recevoir un fond découpé — ce que l'apparence en montre. Tant
     qu'elle ne bouge pas, il n'y a rien à retélécharger ; dès qu'elle bouge,
     le navigateur ne peut pas resservir l'ancien. Un salon servi par une
     version antérieure du service n'en porte pas : on retombe alors sur
     l'horodatage de synchronisation, qui était la règle jusqu'ici. */
  const q = API + "?slug=" + encodeURIComponent(SLUG) +
            "&fond=" + encodeURIComponent(p.id) +
            "&v=" + encodeURIComponent(p.versionFond || DATA.genereLe || "0");
  const promesse = fetch(q, { headers: entetesApi() })
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(d => {
      const par = new Map((d.calques || []).map(c => [c.cle, c.svg]));
      p.fond.forEach(c => { c.svg = par.get(c.cle) || ""; });
      // le pavillon a pu changer pendant le chargement
      if (state.plan === i){ monteHabillage(); ordonneDom(); appliqueApparence(); }
    })
    .catch(e => {
      _fonds.delete(p.id);          // une panne réseau ne doit pas être définitive
      console.warn("Fond de plan indisponible :", e.message);
    });
  _fonds.set(p.id, promesse);
  return promesse;
}

function charge(){
  annonce("Chargement du plan…");
  const entetes = entetesApi();
  // La demande a pu partir dès l'en-tête de la page, avant même que le reste
  // soit lu : on la récupère plutôt que d'en lancer une seconde. En
  // administration elle n'existe pas — il faut y présenter sa session.
  const depart = (!entetes.Authorization && window.__plan) || fetch(
    API + "?slug=" + encodeURIComponent(SLUG),
    // un brouillon ne doit pas rester dans le cache du navigateur
    { headers: entetes, cache: entetes.Authorization ? "no-store" : "default" });
  window.__plan = null;
  return depart
    .then(r => {
      // session périmée : on repasse par l'écran de connexion plutôt que
      // d'afficher une erreur dans laquelle l'exploitant ne peut rien faire
      if (r.status === 401 && typeof ecranAcces === "function"){
        try { localStorage.removeItem("console-session"); } catch (e) {}
        ecranAcces("Session expirée, reconnectez-vous.");
        return Promise.reject(new Error("Session expirée."));
      }
      return r.ok ? r.json()
                  : r.json().then(j => Promise.reject(new Error(j.erreur || ("HTTP " + r.status))));
    })
    .then(d => {
      if (!d.plans?.length) throw new Error("Aucun pavillon : lancez une synchronisation depuis la console.");
      demarre(d);
    })
    .catch(e => annonce("Plan indisponible : " + e.message, true));
}

const fige = document.getElementById("data").textContent.trim();
if (fige && fige.indexOf("__DATA__") < 0) demarre(JSON.parse(fige));
else if (!API) annonce("Aucune source de données configurée.", true);
// en administration, on attend la session : sans elle les brouillons sont invisibles
else if (document.documentElement.dataset.role === "admin") annonce("Vérification de l'identité…");
else charge();

// les mesures de texte dépendent des polices : on retrace une fois chargées
// les polices peuvent arriver avant les données : on ne retrace que si
// quelque chose est déjà affiché
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { if (DATA && view){ _lg.clear(); libelles(); } });

addEventListener("resize", () => { if (DATA && view) fit(); });


retireAdmin();
</script>
