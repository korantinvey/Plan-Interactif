     ici et hors de la liste — les cinq cents logos d'un salon comme Franchise
     Expo pèsent soixante-dix mégaoctets, quand une fiche n'en charge qu'un. */
  poseMarque(ok("logo", zone ? imageSure(o.logo) : adresseImage(soc.logo)));
  const pl = DATA.plans[o.p] || P();
  poseCode(pl, ok("code", o.code) ? String(o.code) : "",
           !zone && o.code ? String(o.code) : "", !zone ? o.hall : "");
  /* De quoi revenir au choix sans refermer la fiche : sur un stand partagé, on
     compare souvent deux enseignes voisines. */
  const part = $("dPartage");
  part.hidden = !plusieurs;
  if (plusieurs){
    part.textContent = (heberges.length + 1) + " exposants ici";
    part.onclick = () => choisitExposant(o, null, canal, false);
  }
  /* La pastille des nouveaux venus. Elle ne paraît que si la synchronisation
     l'a posée — le champ qui la porte n'existe pas sur tous les salons — et
     que l'exploitant la laisse voir. Une zone organisateur n'est jamais
     nouvelle : elle n'est pas un exposant. */
  $("dNeuf").hidden = zone || !soc.neuf || !montre("stand", "nouveau");
  /* La classe « court » marque les champs qui tiennent en un mot : sur mobile
     ils se rangent deux par deux au lieu d'allonger la fiche d'autant de
     lignes. */
  const f = (l, v, cls) => v ? '<div class="field' + (cls ? " " + cls : "") +
                          '"><span class="eyebrow">' + l +
                          '</span><span class="v">' + v + '</span></div>' : "";
  // sur une zone, le programme qu'elle accueille ; sur un stand, les
  // conférences que son exposant tient, où qu'elles se tiennent
  /* Le programme est rattaché au stand par le dossier de son titulaire : la
     source ne dit pas quelle conférence revient à une société hébergée, et la
     lui prêter serait une invention. */
  const sien = (!zone && iS < 0 && pl.parStand && pl.parStand.get(o.id)) || [];
  const confs = ok("conferences", zone
    ? programme(P().parZone && P().parZone.get(o.id))
    : programme(sien, "Conférences"));
  /* Le corps de la fiche, champ par champ sous sa clé plutôt que d'un seul
     tenant : l'ordre de lecture n'est pas le même d'un salon à l'autre — ici
     la nomenclature prime, là l'adresse — et c'est l'exploitant qui le règle
     depuis la console. Le rangement vient après, une fois tout écrit.

     Ni la surface, ni les angles ouverts, ni l'état de commercialisation
     n'apprennent quoi que ce soit au visiteur : ils n'y figurent pas. */
  const corps = {};
  // la raison sociale n'apprend rien quand elle est déjà le titre
  corps.raison = ok("raison", !zone && soc.plan && soc.plan !== titre
    ? f(LIBELLE_CORPS.raison, esc(soc.plan)) : "");
  /* Le secteur décrit l'emplacement, pas son occupant : il reste au stand,
     quelle que soit la société qu'on y regarde. Son libellé est résolu à la
     synchronisation, la page l'affiche tel quel. */
  corps.secteur = ok("secteur", f(LIBELLE_CORPS.secteur, o.sect ? esc(o.sect) : ""));
  corps.adresse = ok("adresse", f(LIBELLE_CORPS.adresse, soc.adr ? esc(soc.adr) : ""));
  /* Les champs courts s'apparient deux par deux sur mobile : l'ordre réglé
     décide donc aussi de qui se retrouve à côté de qui, et un champ long
     glissé au milieu d'eux y laisse une demi-ligne vide. */
  corps.ville = ok("ville", f(LIBELLE_CORPS.ville, soc.ville ? esc(soc.ville) : "", "court"));
  corps.pays = ok("pays", f(LIBELLE_CORPS.pays, soc.pays ? esc(soc.pays) : "", "court"));
  /* Les niveaux décrivent l'emplacement, pas son occupant : ils restent au
     stand, quelle que soit la société qu'on y regarde. */
  corps.niveaux = ok("niveaux", f(LIBELLE_CORPS.niveaux, o.niveaux > 1 ? String(o.niveaux) : "", "court"));
  // le téléphone reste appelable d'un mobile, où le plan est le plus consulté
  corps.telephone = ok("telephone", f(LIBELLE_CORPS.telephone, soc.tel
    ? '<a href="tel:' + esc(String(soc.tel).replace(/[^+\d]/g, "")) + '">' + esc(soc.tel) + '</a>'
    : "", "court"));
  corps.site = ok("site", f(LIBELLE_CORPS.site, lien(soc.site)));
  corps.facebook = ok("facebook", f(LIBELLE_CORPS.facebook, lien(soc.fb)));
  corps.linkedin = ok("linkedin", f(LIBELLE_CORPS.linkedin, lien(soc.li)));
  corps.instagram = ok("instagram", f(LIBELLE_CORPS.instagram, lien(soc.ig)));
  // le libellé est résolu à la synchronisation : la page l'affiche tel quel
  corps.nomenclature = ok("nomenclature", soc.nomencl && soc.nomencl.length
    ? f(LIBELLE_CORPS.nomenclature, soc.nomencl
        .map(n => '<span class="ligne">' + esc(String(n)) + '</span>').join(""))
    : "");
  /* Les thématiques disent ce que l'exposant vient faire là, quand la
     nomenclature dit ce qu'il vend ; un salon qui n'en tient pas ne reçoit pas
     la clé du tout.

     Chacune mène aux exposants qui la partagent — mais seulement là où
     l'exploitant en a fait un critère : ailleurs, rien ne saurait dresser la
     liste promise, et une thématique qui ne mène nulle part vaut mieux en
     texte qu'en lien mort. */
  corps.thematiques = ok("thematiques", soc.themes && soc.themes.length
    ? f(LIBELLE_CORPS.thematiques, soc.themes
        .map(n => themeFiltrable(n)
          ? '<button type="button" class="ligne theme" data-t="' +
            esc(String(n)) + '">' + esc(String(n)) + '</button>'
          : '<span class="ligne">' + esc(String(n)) + '</span>').join(""))
    : "");
  /* Les champs que ce salon-ci s'est ajoutés : l'ordre par défaut les range
     derrière ce que toutes les fiches ont en commun — ils lui sont propres,
     ils ne passent pas d'office devant l'adresse — sans empêcher l'exploitant
     de les faire remonter. */
  const perso = (!zone && DATA.fiche && DATA.fiche.perso) || [];
  perso.forEach(c => {
    const v = (soc.perso || {})[c.cle];
    if (v === undefined || v === null || v === "") return;
    // le point-virgule sépare les valeurs d'un champ à choix : la fiche les
    // montre l'une sous l'autre plutôt qu'en une ligne à rallonge
    const l = separeValeurs(v);
    if (!l.length) return;
    corps[PREFIXE_PERSO + c.cle] = ok(PREFIXE_PERSO + c.cle,
      f(esc(c.libelle), l.length > 1
        ? l.map(x => '<span class="ligne">' + esc(x) + '</span>').join("")
        : esc(l[0])));
  });
  /* Ce que l'exploitant a écrit sur une zone, depuis les réglages du plan.
     C'est tout ce qu'une zone a en propre : Klipso ne lui donne qu'un nom et
     un contour, et le reste de ce corps décrit un exposant qu'elle n'a pas.

     La description porte du balisage, puisqu'elle s'écrit dans un éditeur :
     elle est relue avant d'être posée dans la fiche. Le libellé du champ ne
     paraît qu'avec lui — une zone sans description n'a pas à annoncer qu'elle
     n'en a pas. */
  corps.description = zone
    ? ok("description", o.description
        ? f(LIBELLE_CORPS.description,
            '<div class="riche">' + assainitRiche(o.description) + '</div>')
        : "")
    : "";
  corps.lien = zone ? ok("lien", f(LIBELLE_CORPS.lien, lien(o.lien))) : "";
  /* Une zone ne se range pas dans l'ordre réglé pour les fiches : celui-ci
     range des champs d'exposant, qu'elle n'a pas, et les deux siens se lisent
     dans le seul ordre qui leur convienne — ce qu'elle est, puis où en savoir
     plus. */
  const infos = zone
    ? corps.description + corps.lien
    : ordreCorps(perso.map(c => PREFIXE_PERSO + c.cle))
        .map(c => corps[c] || "").join("");
  /* Un stand se lit dans cet ordre : qui est l'exposant, puis ce qu'il
     anime — ses conférences peuvent être nombreuses, et repoussaient
     l'adresse et les contacts hors de l'écran. Une zone se présente d'abord —
     ce qu'on y trouve — et déroule son programme ensuite. */
  const bloc2 = (cls, id, h) =>
    '<div class="' + cls + '" id="' + id + '" role="tabpanel">' + h + '</div>';
  /* Ce qu'est l'exposant et ce qu'il anime se partagent la fiche dès qu'il y
     a les deux — un stand sans conférence n'a rien à mettre en face, une zone
     n'a pas de fiche. La largeur décide ensuite de la forme : deux colonnes
     au large, deux onglets à l'étroit. */
  const partage = !zone && !!confs && !!infos;
  $("detail").classList.toggle("deux", partage);
  $("dOnglets").hidden = !partage;
  $("dOngNb").textContent = partage && sien.length ? sien.length : "";
  // une fiche s'ouvre sur le détail : c'est ce qu'on est venu y lire
  onglet("detail");
  $("dBody").innerHTML = bloc2("cInfos", "dPaneInfos", infos) +
    bloc2("cConf", "dPaneConf", confs) +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  /* Une conférence ouverte d'ici vient soit du programme d'une salle, soit
     de la fiche de l'exposant qui la tient : ce n'est pas le même chemin. */
  const canalConf = zone ? "salle" : "exposant";
  $("dBody").querySelectorAll("[data-conf]").forEach(b =>
    b.onclick = () => ficheConf(b.dataset.conf, canalConf));
  /* Le signet du parcours vit en haut, à côté de la croix : retenir un
     exposant porte sur la fiche entière. Une zone organisateur ne se retient
     pas elle-même — ce sont ses conférences qu'on ajoute, chacune à son heure. */
  const sig = $("dMarque");
  sig.hidden = zone;
  if (zone) { delete sig.dataset.mg; delete sig.dataset.mi; }
  else { sig.dataset.mg = "stand"; sig.dataset.mi = o.id; }
  // un seul branchement pour le signet de tête et ceux du programme
  brancheParcours($("detail"));
  /* Une thématique lue sur une fiche est une porte vers les autres exposants
     qui la partagent : c'est le chemin qu'on prend quand on a trouvé à peu
     près ce qu'on cherchait, et qu'on veut voir le reste. */
  $("dBody").querySelectorAll(".theme").forEach(b =>
    b.onclick = () => filtreTheme(b.dataset.t));
  $("dGo").onclick = () => centre(o);
  // « j'y vais » : l'arrivée est celle qu'on lit, le départ reste à dire
  $("dItin").onclick = () => versItineraire(o);
  // le crayon vit dans l'en-tête, à côté du nom, et non parmi les actions
  const cr = $("dRen");
  if (cr){
    cr.hidden = !(ADMIN && zone);
    cr.onclick = () => ficheZone(o);
  }
  /* Une zone technique — réserve, quai de livraison — n'apprend rien au
     visiteur. L'exploitant l'éteint d'ici, et la pastille dit l'état avant
     d'être un bouton : elle ne paraît qu'en administration, seule vue où une
     zone éteinte soit encore là. */
  const vis = $("dVis");
  if (vis){
    vis.hidden = !(ADMIN && zone);
    if (!vis.hidden){
      const affichee = !o.masquee;
      vis.textContent = "Affiché : " + (affichee ? "oui" : "non");
      vis.setAttribute("aria-pressed", affichee ? "true" : "false");
      vis.title = affichee
        ? "Retirer cette zone du plan public"
        : "Remettre cette zone sur le plan public";
      vis.onclick = () => basculeAffichageZone(o);
    }
  }
  /* La marque se range une fois l'en-tête entièrement écrit : c'est la largeur
     des pastilles qui décide de la sienne, et elles viennent d'être posées.
     Une image encore en vol se rangera à son tour, à son « load ». */
  rangeMarque();
  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  /* Le plan vient sur l'emplacement maintenant, et non avant d'ouvrir : la
     fiche est posée, et sa largeur — une ou deux colonnes, on ne le sait
     qu'après l'avoir remplie — dit enfin au cadrage ce qu'elle couvre. Un seul
     ordre pour les deux écrans, là où il en fallait un par écran. */
  if (recentrer) centre(o);
  anime(rectVisee(depuis), 1);
  // une zone organisateur n'est pas un exposant : elle ne compte pas ici
  if (!zone) mesure("fiche_stand", canal, o.id);
}

/* Les onglets ne font que choisir ce qu'on regarde : la fiche est construite
   entière, et la bascule ne relit rien. */

/* ============================================================
   8. Interactions du plan
   ============================================================ */
let drag = null;

/* ------------------------------------------------------------------
   Pincement à deux doigts.

   Le plan interdit au navigateur de gérer le toucher — « touch-action: none »
   — parce qu'il déplace la vue lui-même. Il lui revient donc aussi de gérer le
   pincement, sinon il n'existe pas : c'est ce qui manquait sur téléphone.

   On garde le point du plan qui était sous le milieu des deux doigts, et on
   le maintient dessous. L'écartement donne l'échelle, le déplacement du milieu
   donne la translation : les deux gestes se font d'un seul mouvement, comme on
   s'y attend.
   ------------------------------------------------------------------ */
const doigts = new Map();
let pince = null;

const milieu = () => {
  const l = [...doigts.values()];
  return { x: (l[0].x + l[1].x) / 2, y: (l[0].y + l[1].y) / 2,
           d: Math.hypot(l[0].x - l[1].x, l[0].y - l[1].y) };
};

function commencePince(){
  const m = milieu();
  const r = cadrePlan();
  pince = {
    d: Math.max(1, m.d),
    w: view.w, h: view.h,
    // le point du plan sous le milieu, celui qui ne doit pas bouger
    ancre: [view.x + (m.x - r.left) / r.width * view.w,
            view.y + (m.y - r.top) / r.height * view.h],
  };
  drag = null;
  svg.classList.remove("dragging");
}

function suitPince(){
  const m = milieu();
  const r = cadrePlan();
  // le pincement change l'échelle : mêmes économies que la molette
  figeTextes();
  const large = emp ? (emp.x1 - emp.x0) * 2.5 : pince.w * 8;
  const nw = Math.min(large, Math.max(6, pince.w * pince.d / Math.max(1, m.d)));
  const nh = pince.h * (nw / pince.w);
  view = {
    x: pince.ancre[0] - (m.x - r.left) / r.width * nw,
    y: pince.ancre[1] - (m.y - r.top) / r.height * nh,
    w: nw, h: nh,
  };
  rafraichitVue();
}

svg.addEventListener("pointerdown", e => {
  dernierAppuiTactile = e.pointerType === "touch" || e.pointerType === "pen";
  // la main posée l'emporte sur la molette : un glissement qui finissait sa
  // course tirerait la vue sous le doigt qui vient de la saisir
  stoppeZoom();
  /* Un « pointerup » se perd parfois — la main sort de l'écran, le navigateur
     passe la main à un geste système. Le doigt restait alors inscrit, et
     l'appui suivant passait pour le second d'un pincement : plus rien ne
     répondait. Le premier doigt d'un geste ouvre donc une table vierge. */
  if (e.isPrimary) doigts.clear();
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 2){ commencePince(); return; }
  if (doigts.size > 2) return;
  /* Placer un libellé passe avant tout le reste : le geste vise un nom, pas
     l'emplacement qui est dessous ni la vue qu'on déplacerait. */
  if (libellePointerDown(e)) return;
  if (dessinPointerDown(e)) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, bouge: false,
           cible: e.target.closest("[data-id],[data-poi]") };
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (doigts.has(e.pointerId)) doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pince && doigts.size >= 2){ e.preventDefault(); suitPince(); return; }
  if (libellePointerMove(e)) return;
  if (dessinPointerMove(e)) return;
  if (!drag) return;
  const r = cadrePlan(), k = view.w / r.width;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.bouge = true;
  view.x = drag.vx - dx; view.y = drag.vy - dy; rafraichitVue();
});
/* La capture de pointeur redirige le clic vers le <svg> : on retient la cible
   au pointerdown et on tranche au pointerup. */
svg.addEventListener("pointerup", e => {
  doigts.delete(e.pointerId);
  // un doigt levé met fin au pincement ; celui qui reste ne reprend pas la
  // main sur le déplacement, sans quoi la vue sauterait
  if (pince){ if (doigts.size < 2){ pince = null; drag = null; poseVue(); } return; }
  if (libellePointerUp(e)) return;
  if (dessinPointerUp(e)) return;
  const d = drag; drag = null; svg.classList.remove("dragging");
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  if (d && d.bouge){ poseVue(); return; }
  if (!d) return;
  /* Le clic dit ce qu'on regarde maintenant : il lève donc la mise en avant
     du cartouche, sauf s'il porte justement sur ce qu'elle éclaire. */
  oublieChoixPoi(d.cible);
  /* Une visée d'itinéraire en cours prend le clic avant la fiche : c'est un
     point qu'on désigne, pas un exposant qu'on veut lire. */
  if (d.cible){
    /* Un repère n'est pas un objet du plan : il n'a pas de fiche d'exposant,
       mais il a un nom, et c'est ce qu'on vient lui demander. */
    if (!d.cible.dataset.id){
      if (visePoi(d.cible.dataset.poi)) return;
      ouvrePoi(d.cible.dataset.poi, d.cible);
      return;
    }
    if (viseItineraire(d.cible.dataset.id)) return;
    select(d.cible.dataset.id, false, canalPlan(d.cible), rangSociete(d.cible));
  } else { ferme(); finVisee(); }
});
svg.addEventListener("pointercancel", e => {
  doigts.delete(e.pointerId);
  if (doigts.size < 2) pince = null;
  glisseLib = null;
  drag = null;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cadrePlan();
  /* Les navigateurs ne comptent pas dans la même unité — pixels, lignes ou
     pages — et un pavé tactile envoie des dixièmes de cran là où une molette
     en envoie un entier. On ramène tout en pixels, puis on en fait un facteur
     exponentiel : deux petits mouvements valent alors exactement un grand,
     et un tour de molette garde les dix-huit pour cent qu'il avait. */
  const px = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? r.height : 1);
  zoom(Math.exp(Math.max(-400, Math.min(400, px)) / 600),
       (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
}, { passive: false });
svg.addEventListener("keydown", e => {
  const g = e.target.closest("[data-id],[data-poi]");
  if (g && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    // le plan se parcourt aussi au clavier : la visée et la mise en avant
    // doivent y répondre pareil
    oublieChoixPoi(g);
    if (!g.dataset.id){
      if (!visePoi(g.dataset.poi)) ouvrePoi(g.dataset.poi, g);
      return;
    }
    if (!viseItineraire(g.dataset.id))
      select(g.dataset.id, false, canalPlan(g), rangSociete(g));
  }
});
document.addEventListener("keydown", e => {
  const saisie = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (ADMIN && !saisie && (e.ctrlKey || e.metaKey)){
    const t = e.key.toLowerCase();
    if (t === "z" && !e.shiftKey){ e.preventDefault(); annule(); return; }
    if (t === "y" || (t === "z" && e.shiftKey)){ e.preventDefault(); refais(); return; }
    /* Répéter plutôt que redessiner : c'est ainsi qu'une rangée de stands
       identiques se déroule, la copie prenant la place de la sélection. */
    if (t === "d" && formeSel){ e.preventDefault(); dupliqueForme(); return; }
  }
  if (ADMIN && !saisie && (e.key === "Delete" || e.key === "Backspace") && formeSel){
    e.preventDefault(); supprimeForme(); return;
  }
  /* Le clavier ajuste au quart de mètre ce que la main pose approximativement,
     et au mètre touche majuscule tenue : c'est la finition d'un placement,
     après le glisser qui l'a amené à peu près là. */
  if (PLACE_LIBELLES && libSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseLibelle(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                  e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  /* Une forme choisie se règle du même pas : l'aimant l'a posée contre sa
     voisine, le clavier lui donne l'allée qui les sépare. */
  if (ADMIN && formeSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseForme(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  if (e.key === "Escape"){
    if (PLACE_LIBELLES){ modePlacementLibelles(false); return; }
    if (enCours){ termineTrace(false); return; }
    if (formeSel){ choisitForme(null); return; }
    if (calqueActif){ activeCalque(calqueActif); return; }
    ferme();
    if ($("panel")) $("panel").classList.remove("open");
  }
  /* Entrée ferme le tracé, et s'arrête là : le bouton qui garde le focus — un
     outil de la palette, « Annuler » — s'activerait sinon dans la foulée, et
     défairait la forme à l'instant posée. */
  if (e.key === "Enter" && !saisie && enCours){ e.preventDefault(); termineTrace(true); }
});

/* ============================================================
   Le tiroir de la liste — écrans étroits

   Côte à côte, plan et liste ne tiennent pas sur un téléphone. La liste se
   replie donc en tiroir : seules la recherche et le compteur dépassent, le
   reste se hisse d'une pression ou d'un glissement. Choisir un résultat le
   referme — c'est le plan qu'on voulait voir, et la fiche s'ouvre par-dessus.
   ============================================================ */
/* La mesure du tiroir appartient à ce module, mais les bandes qui dépassent —
   les secteurs, les critères retenus — paraissent et disparaissent ailleurs :
   on leur laisse de quoi la redemander. */
let mesureTiroir = () => {};
/* De même, une thématique retenue depuis une fiche doit faire monter le tiroir :
   sur téléphone la liste qui vient de changer est sous le plan. */
let montreTiroir = () => {};

(function tiroirListe(){
  const tiroir = $("side"), prise = $("poignee");
  if (!tiroir || !prise) return;
  const etroit = ETROIT;

  /* La hauteur repliée ne peut pas être une constante : elle dépend de la
     police servie, du retour à la ligne des puces, de la longueur du nom de
     pavillon dans le compteur. On la mesure, et on la redonne au CSS, qui s'en
     sert aussi pour poser les commandes du plan au-dessus du tiroir. */
  function mesure(){
    if (!etroit()) return;
    const part = s => { const n = tiroir.querySelector(s); return n ? n.offsetHeight : 0; };
    const h = prise.offsetHeight + part(".search") + part(".actifs") +
              part(".count");
    if (h > 0) document.documentElement.style.setProperty("--replie", h + "px");
  }

  /* Trois crans, du plus bas au plus haut. Le milieu est le cran utile : la
     liste se lit sans que le plan disparaisse. */
  const CRANS = ["replie", "demi", "plein"];
  const cran = () => tiroir.dataset.cran || "replie";
  function pose(nom){
    tiroir.dataset.cran = nom;
    annonce(nom);
    prise.setAttribute("aria-expanded", nom === "replie" ? "false" : "true");
  }

  /* Ce qui flotte au-dessus du plan — le cartouche des points d'intérêt, les
     commandes de zoom, l'échelle — est ancré sur la hauteur repliée du tiroir.
     Le tiroir qui monte passe donc dessous sans les déplacer, et ils restaient
     à désigner un plan qu'on ne voyait plus. Le cran vit sur la racine pour que
     la feuille de style les atteigne depuis l'autre bout de la page. */
  const annonce = nom => { document.documentElement.dataset.tiroir = nom; };
  const replie = () => pose("replie");
  /* Une pression fait le tour des crans : on les atteint tous sans rien
     connaître du glissement, et on revient au plan par la même touche. */
  const bascule = () => pose(CRANS[(CRANS.indexOf(cran()) + 1) % CRANS.length]);

  const replieePx = () =>
    parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--replie")) || 164;

  /* Hauteur visible du tiroir à un cran donné, en pixels. Le milieu suit la
     règle du CSS — 46 % de la hauteur d'écran. */
  function hauteur(nom){
    if (nom === "plein") return tiroir.offsetHeight;
    if (nom === "demi")  return Math.round(innerHeight * .46);
    return replieePx();
  }

  /* --- le glissement ------------------------------------------------------
     Le doigt mène le tiroir entre le cran le plus bas et le plus haut, puis on
     s'accroche au cran le plus proche de l'endroit où il a lâché. Un seuil de
     distance ne suffirait plus : avec trois crans, c'est la position d'arrivée
     qui décide, pas la longueur du geste. */
  let depart = null, aGlisse = false;

  prise.addEventListener("pointerdown", e => {
    if (!etroit()) return;
    depart = { y: e.clientY, vu: hauteur(cran()) };
    aGlisse = false;
    tiroir.classList.add("glisse");
    prise.setPointerCapture(e.pointerId);
  });

  /** Hauteur visible pendant le geste, bornée aux deux crans extrêmes. */
  const suit = e =>
    Math.min(hauteur("plein"), Math.max(hauteur("replie"), depart.vu - (e.clientY - depart.y)));

  /** Le cran dont la hauteur visible est la plus proche de celle atteinte. */
  function proche(vu){
    let choix = CRANS[0], ecart = Infinity;
    for (const c of CRANS){
      const d = Math.abs(hauteur(c) - vu);
      if (d < ecart){ ecart = d; choix = c; }
    }
    return choix;
  }

  prise.addEventListener("pointermove", e => {
    if (!depart) return;
    if (Math.abs(e.clientY - depart.y) > 6) aGlisse = true;
    const vu = suit(e);
    tiroir.style.transform = "translateY(" + (tiroir.offsetHeight - vu) + "px)";
    /* Le doigt tient encore le tiroir : ce qui flotte s'efface au cran où il
       s'arrêterait, sans attendre qu'il lâche. */
    annonce(proche(vu));
  });

  function relache(e){
    if (!depart) return;
    const vu = suit(e);
    tiroir.classList.remove("glisse");
    tiroir.style.transform = "";
    // un geste avorté laisse le cran d'avant, que le glissement avait annoncé
    pose(aGlisse ? proche(vu) : cran());
    depart = null;
  }
  prise.addEventListener("pointerup", relache);
  prise.addEventListener("pointercancel", relache);

  /* Une pression bascule. Le clic sert aussi le clavier — la poignée est un
     bouton — mais il suit tout glissement : on l'ignore dans ce cas. */
  prise.addEventListener("click", () => {
    if (aGlisse){ aGlisse = false; return; }
    bascule();
  });

  /* Chercher, c'est vouloir la liste ; choisir, c'est vouloir le plan. Au cran
     plein pour la recherche : le clavier va manger le bas de l'écran, autant
     que la liste occupe tout ce qui reste. */
  $("q").addEventListener("focus", () => { if (etroit()) pose("plein"); });
  $("list").addEventListener("click", () => { if (etroit()) replie(); });

  /* La fiche occupe le bas de l'écran quand elle s'ouvre — depuis la liste
     comme depuis le plan ; le parcours prend la même bande. Le tiroir se
     retire sous eux plutôt que de lutter pour la même place. */
  const bandes = [$("detail"), $("parcours")].filter(Boolean);
  const guette = new MutationObserver(() => {
    if (etroit() && bandes.some(n => n.classList.contains("open"))) replie();
  });
  bandes.forEach(n => guette.observe(n, { attributes: true, attributeFilter: ["class"] }));
  addEventListener("keydown", e => { if (e.key === "Escape" && etroit()) replie(); });

  /* Au retour vers un grand écran, la liste reprend sa colonne : ni classe
     d'ouverture ni transformation résiduelle, qui s'y appliqueraient encore. */
  addEventListener("resize", () => {
    if (!etroit()){ tiroir.style.transform = ""; replie(); }
    else mesure();
  });

  mesureTiroir = mesure;
  /* Le cran du milieu, pas le plein écran : on vient de retenir une
     thématique depuis le plan, et on veut voir la liste sans perdre de vue
     l'endroit d'où l'on part. */
  montreTiroir = () => { if (etroit() && cran() === "replie") pose("demi"); };
  mesure();
  // les polices arrivent après le premier calcul et changent la hauteur mesurée
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesure);
  addEventListener("load", mesure);
})();

/* thème */
const CLE_THEME = "plan-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sombre = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = sombre ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(CLE_THEME, next); } catch (e) {}
  /* La couleur principale a deux versions, une par fond : celle du thème
     qu'on vient de quitter s'éteindrait sur celui qu'on ouvre. */
  appliqueAccent();
};

/* ============================================================
   9. Apparence des calques
   Les réglages vivent dans CONF, partagés par les trois pavillons :
   changer la couleur du bâtiment une fois vaut pour tous.
   ============================================================ */
const DEFAUTS = { "INFOPRO_FIL_JAUNE": { rempli: true } };
let CONF = JSON.parse(JSON.stringify(DEFAUTS));

/* Un rangement par salon, et non plus un seul pour tous.
   Les calques sortent tous du même bureau d'études : « Batiment », « RIA »,
   « Caniveaux » et leurs sous-calques portent les mêmes noms d'un salon à
   l'autre. Rangés sous ce seul nom, les réglages suivaient l'exploitant :
   masquer une gaine chez l'un la masquait chez le suivant, sans que rien ne
   l'annonce dans son panneau — et la publication emportait le mélange en
   base. Le salon ouvert nomme donc sa clé. */
const cleConf = d => "plan-conf:" +
  ((d && d.slug) || SLUG || (d && d.evenement) || "sans-salon");
let CLE_CONF = cleConf(null);

/** Ouvre les réglages du salon qu'on vient de charger. */
function ouvreConf(d){
  CLE_CONF = cleConf(d);
  CONF = JSON.parse(JSON.stringify(DEFAUTS));
  try { Object.assign(CONF, JSON.parse(localStorage.getItem(CLE_CONF) || "{}")); } catch (e) {}
  /* L'ancien rangement commun ne peut que rejouer le mélange, et la base fait
     foi de toute façon : on le retire plutôt que de le laisser traîner. */
  try { localStorage.removeItem("plan-conf"); } catch (e) {}
}

/**
 * Les réglages qui parlent du salon ouvert : ceux de ses calques et de leurs
 * sous-calques, plus les réglages généraux — commandes, couches de données,
 * étiquettes. Tout le reste vient d'un salon voisin ouvert sur le même poste,
 * et ne désigne rien ici.
 *
 * Le filtre s'applique aux deux bouts : ce qu'on lit de la base, et ce qu'on y
 * renvoie. Un enregistrement déjà mélangé se nettoie donc à la publication
 * suivante, sans qu'il faille y toucher à la main.
 */
function reglagesDuSalon(source){
  const calques = new Set((DATA?.plans || []).flatMap(p => (p.fond || []).map(c => c.cle)));
  const sortie = {};
  Object.keys(source || {}).forEach(k => {
    if (k.indexOf("_pile:") === 0) return;          // rangé par pavillon, à part
    const general = k[0] === "_" || k.indexOf("data:") === 0 ||
                    k === "labStand" || k === "labZone" || k === "selection" ||
                    k === "parcours" || k === "poi";
    /* Une couleur de secteur nomme un secteur de ce salon-ci : elle se retient
       comme un calque, au nom près. Celle d'un salon voisin ne désigne rien
       ici, et n'a rien à faire dans ce qu'on publie. */
    const dUnSecteur = k.indexOf("secteur:") === 0 && SECTEURS.has(k.slice(8));
    /* « calque/sous-calque », mais l'un comme l'autre peut porter une barre
       oblique : on retient la clé dès qu'une de ses têtes nomme un calque. */
    const dUnCalque = calques.has(k) ||
      k.split("/").some((_, i, t) => i && calques.has(t.slice(0, i).join("/")));
    if (general || dUnCalque || dUnSecteur) sortie[k] = source[k];
  });
  return sortie;
}

const conf = c => (CONF[c] = CONF[c] || {});
const jeton = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888888";
const sousCle = (cle, id) => cle + "/" + id;

function styleFond(cle){
  const c = conf(cle);
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  if (!g) return;
  g.style.display = c.visible === false ? "none" : "";
  g.querySelectorAll("g[data-s]").forEach(sub => {
    const sc = CONF[sousCle(cle, sub.id)] || {};
    const src = sub.dataset.s || "";
    const noir = !src || src === "rgb(0,0,0)";
    sub.style.display = sc.visible === false ? "none" : "";
    sub.style.color = sc.couleur || c.couleur || (noir ? "" : src);
    const rempli = sc.rempli !== undefined ? sc.rempli : c.rempli;
    if (rempli){
      sub.setAttribute("fill", "currentColor");
      sub.setAttribute("stroke", "none");
    } else {
      sub.setAttribute("fill", sub.dataset.f || "none");
      sub.setAttribute("stroke", "currentColor");
    }
  });
}
function sousCalques(cle){
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  return g ? [...g.querySelectorAll("g[data-s]")].map(s => ({ id: s.id, src: s.dataset.s })) : [];
}

const racine = document.documentElement;

/* Les couches de données n'ont pas de SVG propre : leur visibilité joue sur
   l'affichage du groupe, leur couleur sur une variable CSS. */
function styleDataGroupe(nom, on){
  $(nom).style.display = on ? "" : "none";
  // le liseré du parcours est tracé hors des couches : il ne suit pas tout seul
  if (nom === "stands" || nom === "zones") marqueParcours();
}

function appliqueCouleursData(){
  const pose = (v, n) => v ? racine.style.setProperty(n, v) : racine.style.removeProperty(n);
  pose(conf("data:stands").couleur, "--c-stand");
  pose(conf("data:zones").couleur, "--c-zone");
  const general = conf("data:labels").couleur;
  pose(conf("labStand").couleur || general, "--c-lab-stand");
  pose(conf("labZone").couleur || general, "--c-lab-zone");
  /* Un stand sélectionné prend deux couleurs — l'aplat et son liseré — et
     l'exploitant n'en règle qu'une : celle qu'il voit. Le liseré s'en déduit,
     sans quoi il faudrait accorder deux nuanciers à la main pour que le second
     reste visible sur le premier. */
  const sel = conf("selection").couleur;
  pose(sel, "--c-sel");
  pose(sel && ecarte(sel), "--c-sel-trait");
  /* Le parcours n'a qu'un liseré, sans aplat : il double le contour d'un stand
     qui garde par ailleurs sa teinte. Une seule couleur suffit donc, et elle
     se règle à part de la sélection — les deux marques se croisent sur le même
     plan, et se confondraient si l'exploitant ne pouvait les écarter. */
  pose(conf("parcours").couleur, "--c-parc");
  /* Les points d'intérêt. Une seule couleur pour le cartouche et pour ce
     qu'il met en avant : ce sont les deux bouts du même geste — on touche
     « Restauration » en bas de l'écran, et les restaurations s'allument sur le
     plan. Deux teintes n'auraient fait que rompre le lien.

     L'encre du bouton retenu s'en déduit, comme celle des boutons d'accent :
     du blanc sur un bleu, du noir sur un or. */
  const poi = conf("poi").couleur;
  pose(poi, "--c-poi");
  pose(poi && trio(poi) && (luminance(trio(poi)) > 0.42 ? "#0E1113" : "#FFFFFF"),
       "--c-poi-ink");
}

function styleData(cle){
  racine.classList.toggle(cle === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                          conf(cle).visible === false);
  appliqueCouleursData();
}

function appliqueApparence(){
  P().fond.forEach(f => {
    // Un calque absent de la configuration est montré. La règle disait
    // l'inverse — masquer tout ce qui n'était pas explicitement marqué visible
    // — et convenait aux données figées, qui portaient ce drapeau. La charge
    // utile servie par l'API n'en porte pas : tout le fond de plan
    // disparaissait, sans que rien ne le signale.
    if (CONF[f.cle] === undefined && f.visible === false) conf(f.cle).visible = false;
    styleFond(f.cle);
  });
  ["zones", "stands", "labels"].forEach(n =>
    styleDataGroupe(n, conf("data:" + n).visible !== false));
  ["labStand", "labZone"].forEach(k =>
    racine.classList.toggle(k === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                            conf(k).visible === false));
  appliqueCouleursData();
  appliqueCommandes();
  appliqueSecteurs();
  appliqueAccent();
  appliqueFond();
  appliqueModele();
}

/**
 * Les commandes posées sur le plan, montrées ou non.
 *
 * Le pincement rend les boutons de zoom superflus sur un écran tactile, mais
 * il demande deux doigts : dans une allée de salon, sac à la main, on n'en a
 * souvent qu'un. L'échelle, elle, sert à qui mesure une distance et encombre
 * qui ne la lit pas. Ni l'un ni l'autre ne se tranche par une règle générale :
 * cela dépend du public et du terrain, donc cela revient à l'exploitant.
 *
 * Le parcours de visite se range ici pour la même raison : il vaut pour un
 * salon qu'on parcourt une journée durant, moins pour une exposition d'une
 * heure. Le retirer ne touche pas aux listes déjà constituées sur les
 * téléphones — il masque ce qui y mène, et le réglage peut se rouvrir.
 *
 * Montrées par défaut : un réglage absent ne doit rien retirer à un salon déjà
 * en place.
 *
 * « classe » marque celles dont le retrait déborde de leur propre coin : elle
 * est posée sur la racine, d'où la feuille de style tire le reste.
 */
const COMMANDES = [
  { cle: "_zoom",     sel: ".zoombar",     libelle: "Afficher les icônes de zoom",
    /* L'échelle s'écartait de la marge pour laisser passer les boutons de
       zoom. Sans eux, ce décalage n'a plus d'objet et laisse un vide. */
    classe: "sans-zoom" },
  { cle: "_echelle",  sel: ".scalebar",    libelle: "Afficher l'échelle" },
  { cle: "_parcours", sel: "#btnParcours", libelle: "Proposer le parcours de visite",
    // les signets des fiches et du programme suivent le bouton de la barre
    classe: "sans-parcours" },
  /* L'itinéraire se calcule sur ce que les données disent du hall : les
     emplacements, et les obstacles que l'exploitant a bien voulu dessiner.
     Sur un plan resté nu, le trajet reste juste mais n'évite que les stands —
     à lui de juger si cela suffit à son salon. */
  { cle: "_itineraire", sel: "#btnItineraire", libelle: "Proposer le calcul d'itinéraire",
    // le bouton « Itinéraire » des fiches suit celui de la barre
    classe: "sans-itineraire" },
];

function appliqueCommandes(){
  COMMANDES.forEach(c => {
    const retire = conf(c.cle).visible === false;
    const n = document.querySelector(c.sel);
    if (n) n.hidden = retire;
    if (c.classe) racine.classList.toggle(c.classe, retire);
  });
  // un tiroir ouvert sur une fonction qu'on vient de retirer n'aurait plus de
  // bouton pour se refermer
  if (conf("_parcours").visible === false) fermeParcours();
  if (conf("_itineraire").visible === false) fermeItineraire();
}

/**
 * Ce que la recherche a le droit de remonter.
 *
 * Le champ de recherche balaie tout ce que le salon porte, et cela ne convient
 * pas à tous les salons. Un congrès dont le programme compte trois cents
 * sessions les voit répondre au premier mot courant venu, et noyer les stands
 * qu'on était venu chercher ; un salon de trente exposants veut au contraire
 * qu'un mot ramène tout ce qui s'y rapporte. Rien dans les données ne dit
 * lequel des deux on administre — d'où le réglage, sorte par sorte.
 *
 * Il ne touche qu'à la recherche. Sans mot-clé ni critère, la liste n'est pas
 * un résultat mais le sommaire des emplacements du pavillon : l'y soumettre
 * aurait laissé une colonne blanche à qui décoche « Stands ».
 *
 * Chaque sorte dit aussi ce qu'elle alimente — « Produits » et « Points
 * d'intérêt » ne se devinent pas depuis leur intitulé — et, quand rien ne
 * l'alimente, pourquoi sa case ne répond pas.
 */
const SORTES_RECHERCHE = [
  { cle: "stands", libelle: "Stands et exposants",
    aide: "Le nom d'une enseigne, son numéro d'emplacement, son secteur, " +
      "ses thématiques, et les sociétés hébergées sur un stand partagé.",
    dispo: () => TOUS.some(o => o.kind === "stand"),
    absent: "Ce salon ne porte aucun emplacement." },
  { cle: "zones", libelle: "Zones organisateur",
    aide: "Accueil, restauration, village start-up — les endroits que le " +
      "salon fournit avec son plan.",
    dispo: () => TOUS.some(o => o.kind === "zone"),
    absent: "Ce salon ne porte aucune zone organisateur." },
  { cle: "conferences", libelle: "Conférences",
    aide: "Le titre d'une session, sa salle, son thème, et l'exposant qui " +
      "la tient — souvent le seul nom dont on se souvienne.",
    dispo: () => CONFERENCES.length > 0,
    absent: "Le programme n'est pas synchronisé : sa source se règle depuis " +
      "la console, dans « Source des données »." },
  /* Les produits se règlent déjà dans la console — « Produits », source au
     choix — mais la synchronisation les annonce « pas encore repris » et le
     plan n'en reçoit aucun. La case garde son rang, éteinte : l'exploitant qui
     a réglé cette source doit lire ici pourquoi la recherche n'en remonte
     rien, plutôt que de chercher une case absente. Elle s'allumera le jour où
     la synchronisation les rapportera. */
  { cle: "produits", libelle: "Produits",
    aide: "Ce que les exposants présentent, nommé produit par produit.",
    dispo: () => (DATA?.plans || []).some(p => (p.produits || []).length),
    absent: "Les produits ne sont pas encore repris par la synchronisation, " +
      "quelle que soit la source réglée dans la console." },
  { cle: "poi", libelle: "Points d'intérêt",
    aide: "Les repères posés sur le plan : entrées, WC, escaliers, parkings, " +
      "vestiaires. Le cartouche du bas les récapitule de son côté, que cette " +
      "case soit cochée ou non.",
    dispo: () => reperesCherchables().length > 0,
    absent: "Aucun repère n'est posé sur les plans de ce salon : ils se " +
      "dessinent depuis la boîte à outils." },
];

/** Une sorte remonte-t-elle dans la recherche ? Oui par défaut : un réglage
 *  absent ne doit rien retirer à un salon déjà en place. */
const chercheSorte = (cle) => conf("_rech")[cle] !== false;

/** Le volet « Recherche » : les sortes d'éléments que le champ remonte. */
function voletRecherche(hote){
  const p = document.createElement("p");
  p.textContent = "Ce que le champ de recherche remonte. Le sommaire du " +
    "pavillon n'en dépend pas : sans mot-clé, la liste reste celle de ses " +
    "emplacements. Publiez la configuration pour que le changement parvienne " +
    "aux visiteurs.";
  hote.appendChild(p);

  const bloc = document.createElement("div");
  bloc.className = "reglages";
  SORTES_RECHERCHE.forEach(s => {
    const dispo = s.dispo();
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent = s.libelle;
    if (!dispo) l.classList.add("eteint");
    const c = l.querySelector("input");
    c.checked = chercheSorte(s.cle);
    /* Éteinte, et non décochée : la case montre ce qui est réglé, et le
       réglage vaudra le jour où quelque chose l'alimentera. La décocher
       d'office effacerait un choix que l'exploitant a fait. */
    c.disabled = !dispo;
    c.onchange = e => {
      conf("_rech")[s.cle] = e.target.checked;
      enregistreConf();
      /* La liste affichée derrière la fenêtre est peut-être un résultat de
         recherche : elle obéit sur-le-champ, c'est le seul retour visible. */
      liste();
    };
    bloc.appendChild(l);

    const aide = document.createElement("p");
    aide.className = "aideR";
    aide.textContent = dispo ? s.aide : s.absent;
    bloc.appendChild(aide);
  });
  hote.appendChild(bloc);
}

/**
 * Combien de temps on passe sur un stand.
 *
 * Ce n'est pas un réglage d'affichage : c'est ce qui décide combien de
 * visites tiennent entre deux conférences quand le visiteur demande qu'on
 * organise sa journée. Le mettre trop bas remplit un programme intenable ;
 * trop haut, il laisse des stands de côté sans raison.
 *
 * Vingt minutes est ce qu'on observe sur un salon professionnel — le temps
 * d'une poignée de main, d'une démonstration et d'une carte de visite. Un
 * salon grand public tourne plus vite, un salon d'affaires beaucoup moins :
 * cela ne se devine pas depuis le plan, d'où le réglage.
 */
const VISITE_DEFAUT = 20;      // minutes
const VISITE_MIN = 5, VISITE_MAX = 120;
function minutesVisite(){
  const v = Math.round(+(CONF["_visite"] || {}).minutes);
  return v >= VISITE_MIN && v <= VISITE_MAX ? v : VISITE_DEFAUT;
}

/** Ce salon héberge-t-il des sociétés sur le stand d'une autre ? La question
 *  se pose sur les trois pavillons : un seul stand partagé suffit. */
const salonPartage = () => (DATA?.plans || [])
  .some(p => (p.stands || []).some(s => (s.coex || []).length));

/* ------------------------------------------------------------
   Couleur principale et modèle de fiche

   Deux réglages d'apparence qui ne portent sur aucun calque : la teinte dont
   le plan se sert partout — sélection, liens, boutons pleins — et l'habillage
   de la fiche détail. Ils vivent dans CONF sous une clé préfixée, donc ils
   partent aux visiteurs avec le reste de la configuration.
   ------------------------------------------------------------ */

/** Les trois composantes d'une couleur écrite « #rrggbb ». */
const trio = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
};

/** Deux couleurs mêlées, `t` disant combien on va de la première vers la
 *  seconde. Sert à décliner l'accent sans demander cinq teintes à
 *  l'exploitant : il en choisit une, le reste s'en déduit. */
const melange = (a, b, t) => {
  const x = trio(a), y = trio(b);
  return x && y ? hexa(x.map((c, i) => Math.round(c + (y[i] - c) * t))) : a;
};

/** Le thème effectivement peint : celui qu'on a choisi, sinon celui du
 *  système. La couleur principale s'y adapte — un bleu d'imprimerie s'éteint
 *  sur un fond noir, et le même ton ne peut pas servir des deux côtés. */
const themeSombre = () => {
  const t = racine.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};

/**
 * Pose la couleur principale et ses déclinaisons sur la racine.
 *
 * L'exploitant n'en règle qu'une, celle qu'il voit : l'aplat doux des
 * pastilles, l'encre qui s'écrit sur un bouton plein et les deux nuances dont
 * les modèles de fiche composent leurs fonds s'en déduisent. Sans réglage, on
 * retire les variables plutôt que d'en réécrire : la feuille de style reprend
 * la main, et avec elle le bleu d'origine — qui a déjà ses deux versions.
 */
function appliqueAccent(){
  const noms = ["--accent", "--accent-base", "--accent-soft", "--accent-ink",
                "--accent-clair", "--accent-fort"];
  const choisie = trio(conf("_accent").couleur) ? conf("_accent").couleur : null;
  if (!choisie){ noms.forEach(n => racine.style.removeProperty(n)); return; }
  const sombre = themeSombre();
  /* Sur fond sombre, un ton franc s'éteint : on l'éclaircit d'un tiers, comme
     le thème le fait de son propre bleu. */
  const base = sombre ? melange(choisie, "#FFFFFF", 0.34) : choisie;
  const pose = (n, v) => racine.style.setProperty(n, v);
  pose("--accent", base);
  pose("--accent-base", base);
  pose("--accent-soft", melange(base, sombre ? "#0E1113" : "#FFFFFF", sombre ? 0.76 : 0.86));
  // le texte d'un bouton plein : noir sur un jaune, blanc sur un bleu
  pose("--accent-ink", luminance(trio(base)) > 0.42 ? "#0E1113" : "#FFFFFF");
  pose("--accent-clair", melange(base, "#FFFFFF", 0.34));
  pose("--accent-fort", melange(base, "#000000", 0.42));
}
/* Le thème peut basculer sans qu'on rouvre les réglages : la couleur suit. */
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", appliqueAccent); } catch (e) {}

/**
 * Le fond du plan — le gris qui entoure le bâtiment.
 *
 * Il ne se déduit de rien : c'est un aplat que rien ne recouvre, et l'accent
 * n'a pas à le teinter. Contrairement à l'accent, la teinte choisie ne
 * s'éclaircit pas sur fond sombre : un exploitant qui pose l'ivoire de sa
 * charte veut cet ivoire-là, pas un ton recalculé. Sans réglage, on retire le
 * jeton plutôt que d'en écrire un — la feuille de style reprend la main, avec
 * le gris de chaque thème.
 */
function appliqueFond(){
  const v = conf("_fond").couleur;
  if (trio(v)) racine.style.setProperty("--c-fond", v);
  else racine.style.removeProperty("--c-fond");
}

/* Les habillages du plan. Chacun tient en cinq pièces — le bandeau du haut,
   la liste des exposants, la fiche détail, le parcours de visite et
   l'itinéraire — taillées dans la même police et les mêmes couleurs : on ne
   choisit pas l'allure de l'une sans choisir celle des autres, sous peine de
   cinq salons côte à côte. Les trois dernières occupent d'ailleurs la même
   bande de l'écran, et s'ouvrent l'une depuis l'autre. Le premier modèle n'a
   de classe nulle part : c'est le plan tel que la feuille de style le dessine,
   et le point de départ de tous les autres. */
const MODELES = [
  { cle: "sobre", nom: "Sobre",
    resume: "Le rendu d'origine : un seul rythme, de la liste à la fiche." },
  { cle: "grille", nom: "Grille",
    resume: "Encre pleine, numéro en filigrane, filets francs jusque dans la liste." },
  { cle: "console", nom: "Console",
    resume: "Chasse fixe et invites de commande, sur un phosphore à la couleur du salon." },
  { cle: "billet", nom: "Billet",
    resume: "Bandeau d'accent sur la recherche, numéros comptables, lignes perforées." },
  { cle: "magazine", nom: "Magazine",
    resume: "Serif à fort contraste et italiques : le catalogue et son sommaire." },
  { cle: "brut", nom: "Brut",
    resume: "Trait épais, ombre dure, aplat franc. Papier et noir dans les deux thèmes." },
  { cle: "verre", nom: "Verre",
    resume: "Un bloc de la couleur du salon, champs et lignes en carreaux translucides." },
  { cle: "kraft", nom: "Kraft",
    resume: "Carton et machine à écrire, « nouvel exposant » tamponné de travers." },
  { cle: "signal", nom: "Signalétique",
    resume: "Aplat, flèche et capitales : un stand se lit comme une direction de hall." },
  { cle: "chrono", nom: "Chronologie",
    resume: "Le programme en ligne de temps, et la liste égrenée le long du même rail." },
  { cle: "nu", nom: "Nu",
    resume: "Ni cadre ni libellés : la hiérarchie typographique seule." },
];
const modeleRetenu = () => {
  const c = (CONF["_fiche"] || {}).modele;
  return MODELES.some(m => m.cle === c) ? c : "sobre";
};

/* La police des libellés du plan, modèle par modèle.

   Un modèle est un accord typographique, et le plan en fait partie : un salon
   habillé en « Kraft » gardait ses enseignes composées en grotesque au milieu
   de son carton, et le « Magazine » son sommaire en serif à côté d'un plan
   qui n'en avait rien. Chaque ligne reprend donc la police que le modèle pose
   déjà sur le nom et sur le numéro de ses lignes de liste — celui du plan est
   le même nom, écrit sur la cloison plutôt que dans la marge.

   Les onze sont nommés, y compris ceux qui gardent le rendu d'origine : c'est
   la table qu'on relit pour vérifier qu'un modèle dit la même chose des deux
   côtés, et un modèle absent s'y verrait comme un oubli plutôt que comme un
   choix. */
const P_SANS = '"Instrument Sans", "Segoe UI", system-ui, sans-serif',
      P_CHASSE = '"IBM Plex Mono", monospace',
      P_GROTESQUE = '"Archivo", sans-serif', P_SERIF = '"Fraunces", Georgia, serif',
      P_MACHINE = '"Courier Prime", monospace';
const POLICES_LIBELLE = {
  sobre:    { nom: ["600", P_SANS],      code: ["500", P_CHASSE] },
  grille:   { nom: ["600", P_GROTESQUE], code: ["600", P_CHASSE] },
  console:  { nom: ["500", P_CHASSE],    code: ["500", P_CHASSE] },
  billet:   { nom: ["600", P_SANS],      code: ["600", P_CHASSE] },
  magazine: { nom: ["600", P_SERIF],     code: ["600", P_SERIF] },
  brut:     { nom: ["700", P_SANS],      code: ["700", P_CHASSE] },
  verre:    { nom: ["600", P_SANS],      code: ["500", P_CHASSE] },
  kraft:    { nom: ["700", P_MACHINE],   code: ["700", P_MACHINE] },
  signal:   { nom: ["700", P_SANS],      code: ["600", P_CHASSE] },
  chrono:   { nom: ["600", P_SANS],      code: ["500", P_CHASSE] },
  nu:       { nom: ["600", P_SANS],      code: ["500", P_CHASSE] },
};

/**
 * Pose la police du modèle sur les libellés du plan.
 *
 * Elle s'écrit à deux endroits qui doivent s'accorder : la feuille de style,
 * qui dessine, lit ces variables ; `habille` et `largeur`, qui taillent le
 * nom à la place dont il dispose, mesurent P_NOM et P_CODE. Les séparer
 * donnerait un nom calculé pour une police et rendu dans une autre — plus
 * large que son stand, ou perdu au milieu.
 *
 * Le tracé ne se refait qu'au changement, et qu'une fois le pavillon monté :
 * la fonction est aussi appelée à l'ouverture d'un salon, où elle précède le
 * premier dessin plutôt que d'avoir à le reprendre. La liste en est, parce
 * que la case du numéro se taille elle aussi sur P_CODE.
 */
function posePoliceLibelles(cle){
  const p = POLICES_LIBELLE[cle] || POLICES_LIBELLE.sobre;
  const change = P_NOM !== p.nom || P_CODE !== p.code;
  P_NOM = p.nom; P_CODE = p.code;
  racine.style.setProperty("--police-lab-nom", p.nom[1]);
  racine.style.setProperty("--graisse-lab-nom", p.nom[0]);
  racine.style.setProperty("--police-lab-code", p.code[1]);
  racine.style.setProperty("--graisse-lab-code", p.code[0]);
  // les repères et les stands tracés à la main portent leur libellé dans leur
  // propre forme : ils se retracent, ils ne se restylent pas
  if (change && MONTE){ dessineDessins(); libelles(); liste(); }
}

/**
 * Pose l'habillage retenu sur les cinq pièces de l'écran : la fiche détail, le
 * parcours de visite, l'itinéraire, la liste des exposants et le bandeau du
 * haut. Un seul geste pour tous — le modèle est un accord, et l'exploitant qui
 * choisit « Kraft » choisit le carton partout.
 *
 * Les trois tiroirs de droite portent le même préfixe : ils sont bâtis des
 * mêmes pièces — en-tête, pastilles, boutons — et un modèle écrit une fois
 * les habille tous les trois. La liste garde le sien, elle n'a ni en-tête ni
 * pastille et se dessine autrement ; le bandeau aussi, qui n'a ni l'une ni
 * l'autre et traverse l'écran de part en part.
 *
 * Une seule classe à la fois par panneau : les modèles se recouvrent, et deux
 * ensemble ne veulent rien dire.
 */
function appliqueModele(){
  const cle = modeleRetenu();
  const pose = (el, prefixe) => el && MODELES.forEach(m =>
    el.classList.toggle(prefixe + m.cle, m.cle === cle));
  ["detail", "parcours", "itineraire"].forEach(id => pose($(id), "modele-"));
  pose($("side"), "liste-");
  pose($("bandeau"), "bandeau-");
  posePoliceLibelles(cle);
}

/* ------------------------------------------------------------------
   L'exposant des aperçus

   Les onze vignettes montrent la même liste et la même fiche sous onze
   habillages : c'est en les comparant à elles-mêmes qu'on choisit. Mais elles
   ne peuvent pas être inventées — un salon qui a retiré l'adresse et remonté
   sa nomenclature choisirait son modèle sur des champs qu'il n'affiche pas,
   dans un ordre qui n'est pas le sien.

   Les vignettes portent donc les champs retenus, dans l'ordre réglé depuis la
   console, et les valeurs d'un vrai stand — et, à côté, les voisins de
   sommaire de ce stand, tels que la liste les rangerait.
   ------------------------------------------------------------------ */

/* Comment lire chaque champ du corps sur un stand. Les mêmes sources que la
   fiche : ce que le plan porte reste au stand, le reste vient de la société. */
const LECTURE_CORPS = {
  raison: o => o.plan && o.plan !== o.nom ? o.plan : "",
  secteur: o => o.sect,
  adresse: o => o.adr,
  ville: o => o.ville,
  pays: o => o.pays,
  niveaux: o => o.niveaux > 1 ? String(o.niveaux) : "",
  telephone: o => o.tel,
  site: o => o.site,
  facebook: o => o.fb,
  linkedin: o => o.li,
  instagram: o => o.ig,
  nomenclature: o => o.nomencl,
  thematiques: o => o.themes,
};

/* Les champs qui tiennent en un mot s'apparient deux par deux sur écran
   étroit : la vignette le montre, comme la fiche le fait. */
const COURTS_CORPS = ["ville", "pays", "niveaux", "telephone"];

/* De quoi remplir un champ qu'aucun stand ne renseigne. Le taire ferait
   choisir un modèle sur une fiche plus courte que la vraie, et laisserait
   croire le champ retiré. */
const EXEMPLES_CORPS = {
  nom: "Ateliers Ligneron", code: "D14", pavillon: "Pavillon 2",
  raison: "Ligneron & Fils SARL", secteur: "Aménagement & second œuvre",
  adresse: "8 rue de la Filature", ville: "Nantes", pays: "France",
  niveaux: "2", telephone: "02 40 00 00 00", site: "ateliers-ligneron.fr",
  facebook: "facebook.com/ligneron", linkedin: "linkedin.com/company/ligneron",
  instagram: "instagram.com/ligneron",
  nomenclature: "Menuiserie;Agencement de boutique",
  thematiques: "Réemploi;Bois de pays",
};

/* De quoi peupler la liste d'un salon dont aucun stand n'est encore connu.
   Une liste vide ne dirait rien d'un habillage : c'est sur des lignes qui se
   suivent que se voit un filet, un pointillé ou un rail. */
const EXEMPLES_LISTE = [
  ["B07", "Atelier du Marais"], ["C02", "Bois & Compagnie"],
  ["D14", "Ateliers Ligneron"], ["D22", "Duchêne Agencement"],
  ["E05", "Fonderie de l'Ouest"], ["E18", "Granit Armor"],
  ["F03", "Habitat Lumière"], ["F11", "Menuiseries Rocher"],
];

/** Ce qu'un stand porte pour un champ du corps, en une chaîne. */
function texteCorps(o, cle){
  if (cle.indexOf(PREFIXE_PERSO) === 0){
    return separeValeurs((o.perso || {})[cle.slice(PREFIXE_PERSO.length)]).join(";");
  }
  const l = LECTURE_CORPS[cle];
  return l ? separeValeurs(l(o)).join(";") : "";
}

/**
 * Le stand qui remplit le mieux les champs retenus.
 *
 * Le premier venu n'irait pas : il peut n'avoir ni adresse, ni thématique, ni
 * nomenclature — c'est-à-dire rien de ce que les modèles habillent — et on
 * choisirait un habillage sur une fiche vide.
 */
function standApercu(cles){
  let mieux = null, pavillon = "", hall = "", score = 0, neuf = false;
  Object.values(DATA.plans || {}).forEach(pl => (pl.stands || []).forEach(o => {
    if (!o.nom) return;
    neuf = neuf || Boolean(o.neuf);
    const n = cles.reduce((s, c) => s + (texteCorps(o, c) ? 1 : 0), 0);
    if (n > score){
      score = n; mieux = o;
      // le hall tient au stand, pas au pavillon : un plan peut en couvrir deux
      pavillon = pl.libelle || ""; hall = o.hall || "";
    }
  }));
  return { stand: mieux, pavillon, hall, neuf };
}

/**
 * Les lignes de la liste d'aperçu : le stand de la fiche et ses voisins de
 * sommaire, dans l'ordre où la liste les range.
 *
 * Le stand de la fiche est marqué courant, et non le premier venu : les
 * modèles habillent la ligne ouverte plus que les autres — un négatif, un
 * curseur, un point allumé — et c'est celle-là qu'on veut voir en regard de la
 * fiche qui la déplie.
 */
function lignesApercu(stand){
  const pl = stand && DATA.plans ? DATA.plans[stand.p] : null;
  const voisins = ((pl && pl.stands) || []).filter(o => o.nom)
    .sort((a, b) => COLLATION.compare(String(a.nom), String(b.nom)));
  /* Une liste de deux lignes ne montre pas un habillage : sans assez de
     voisins, on prend les exemples plutôt qu'une vignette à moitié vide. */
  if (voisins.length < 4){
    return EXEMPLES_LISTE.map(([code, nom], i) =>
      ({ code, nom, courant: i === 2 }));
  }
  /* Le stand retenu, avec ce qui le précède et ce qui le suit : la vignette
     montre huit lignes, et la sienne ne doit être ni la première ni la
     dernière — un filet de séparation se lit entre deux voisines. */
  const i = Math.max(0, voisins.indexOf(stand));
  const debut = Math.min(Math.max(0, i - 2), Math.max(0, voisins.length - 8));
  return voisins.slice(debut, debut + 8).map(o =>
    ({ code: codeCase(o), nom: o.nom, courant: o === stand }));
}

/**
 * Ce que les onze vignettes montrent : relevé une fois, elles s'en partagent.
 *
 * Un champ propre au salon qu'aucun stand ne renseigne n'a pas d'exemple à
 * prêter — le code ne connaît pas son sujet — d'où la mention en clair plutôt
 * qu'une valeur inventée qui passerait pour une vraie.
 */
function contenuApercu(){
  const persos = (DATA.fiche && DATA.fiche.perso) || [];
  const cles = ordreCorps(persos.map(c => PREFIXE_PERSO + c.cle))
    .filter(c => montre("stand", c));
  const { stand, pavillon, hall, neuf } = standApercu(cles);
  const vals = {};
  cles.forEach(c => {
    vals[c] = (stand && texteCorps(stand, c)) || EXEMPLES_CORPS[c] ||
      (c.indexOf(PREFIXE_PERSO) === 0 ? "Valeur d'exemple" : "");
  });
  return {
    cles: cles.filter(c => vals[c]), vals,
    nom: (stand && stand.nom) || EXEMPLES_CORPS.nom,
    code: (stand && stand.code) || EXEMPLES_CORPS.code,
    pavillon: pavillon || EXEMPLES_CORPS.pavillon,
    /* Le hall ne se supplée pas : tous les salons n'en portent pas, et un
       exemple inventé ferait choisir un habillage sur une pastille plus longue
       que la vraie. Il ne paraît donc que coché et renseigné. */
    hall: montre("stand", "hall") ? hall : "",
    /* La pastille ne paraît que là où le salon distingue ses nouveaux venus :
       le réglage seul la ferait voir sur des salons dont aucune fiche ne porte
       le champ, et plusieurs modèles l'habillent — on choisirait sur une
       marque qu'on n'aura jamais. */
    neuf: neuf && montre("stand", "nouveau"),
    lignes: lignesApercu(stand),
    /* Le compteur du pavillon, tel que la liste l'écrit : c'est une ligne de
       texte que plusieurs modèles habillent — capitales, chasse fixe,
       italique — et la taire priverait la vignette de sa tête. */
    compte: (() => {
      const pl = stand && DATA.plans ? DATA.plans[stand.p] : null;
      const n = ((pl && pl.stands) || []).length || EXEMPLES_LISTE.length;
      return n + (n > 1 ? " résultats" : " résultat") + " · " +
        ((pl && pl.libelle) || pavillon || EXEMPLES_CORPS.pavillon);
    })(),
  };
}

function apercuFiche(cle, vu){
  const d = document.createElement("div");
  d.className = "apercu modele-" + cle;
  // l'aperçu se regarde, il ne se manipule pas
  d.inert = true;
  const champ = (l, v, c) => '<div class="field' + (c ? " " + c : "") + '">' +
    '<span class="eyebrow">' + esc(l) + '</span><span class="v">' + v + '</span></div>';
  /* Une adresse web s'affiche en lien sur la fiche : la vignette le montre
     aussi, plusieurs modèles n'habillant que les liens. */
  const LIENS = ["site", "facebook", "linkedin", "instagram"];
  const corps = vu.cles.map(c => {
    const l = separeValeurs(vu.vals[c]);
    const v = l.length > 1
      ? l.map(x => '<span class="ligne">' + esc(x) + '</span>').join("")
      : LIENS.indexOf(c) >= 0 ? '<a href="#">' + esc(l[0]) + '</a>' : esc(l[0]);
    return champ(libelleCorps(c), v, COURTS_CORPS.indexOf(c) >= 0 ? "court" : "");
  }).join("");
  /* Le programme reste celui de l'exemple, quand tout le reste vient du salon :
     le stand qui remplit le mieux la fiche ne tient pas forcément de
     conférence, et le modèle qui déroule une ligne de temps n'aurait rien à
     montrer. */
  const confs = montre("stand", "conferences")
    ? '<div class="field prog-bloc"><span class="eyebrow">Conférences</span><div class="prog">' +
        '<div class="confRang"><span class="conf"><span class="h">10h30 – 11h15</span>' +
        '<span class="t">Le bois de pays dans la commande publique</span>' +
        '<span class="ty">Table ronde</span></span></div>' +
        '<div class="confRang"><span class="conf"><span class="h">16h00 – 16h45</span>' +
        '<span class="t">Agencer une boutique en réemploi</span>' +
        '<span class="ty">Démonstration</span></span></div>' +
      '</div></div>'
    : "";
  const code = montre("stand", "code") ? vu.code : "";
  d.innerHTML =
    '<div class="detail-hd" data-code="' + esc(code) + '">' +
      /* Des balises neutres plutôt que des boutons : l'aperçu vit dans un
         bouton — celui qui choisit le modèle — et un bouton n'en contient pas
         un autre. Les classes suffisent à l'habillage. */
      '<div class="hdActs"><span class="marque">' +
      '<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>' +
      '</span><span class="close">&times;</span></div>' +
      '<div class="hdTete"><span class="eyebrow">Stand</span>' +
        (vu.neuf ? '<span class="badge neuf">Nouvel exposant</span>' : "") +
      '</div>' +
      '<div class="hdNom"><h2>' + esc(vu.nom) + '</h2></div>' +
      '<div class="hdBadges">' +
        '<span class="badge code">' +
        esc([vu.pavillon, vu.hall, code].filter(Boolean).join(" · ")) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="detail-bd">' + corps + confs +
      '<div class="acts"><span class="btn">Centrer sur le plan</span>' +
      '<span class="btn itin">Itinéraire</span></div>' +
    '</div>';
  return d;
}

/**
 * L'autre moitié de la vignette : la liste des exposants sous le même
 * habillage.
 *
 * Des balises neutres, comme pour la fiche : l'aperçu vit dans le bouton qui
 * choisit le modèle, et celui-ci ne peut contenir ni bouton ni champ de
 * saisie. Les classes sont celles du vrai panneau — c'est la même feuille de
 * style qui l'habille, à la réduction près.
 */
function apercuListe(cle, vu){
  const d = document.createElement("div");
  d.className = "apercu-liste liste-" + cle;
  // l'aperçu se regarde, il ne se manipule pas
  d.inert = true;
  const lignes = vu.lignes.map(l =>
    '<span class="row" data-sorte="stand" aria-current="' + (l.courant ? "true" : "false") + '">' +
    '<span class="code">' + esc(l.code) + '</span>' +
    '<span><span class="nm">' + esc(l.nom) + '</span><span class="s"></span></span></span>').join("");
  d.innerHTML =
    '<div class="search"><div class="search-field">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<span class="champ">Exposant, stand…</span>' +
    '</div></div>' +
    '<div class="count"><span>' + esc(vu.compte) + '</span></div>' +
    '<div class="list">' + lignes + '</div>';
  return d;
}

/** Les deux moitiés d'un habillage, dans l'ordre de l'écran : la liste, puis
 *  la fiche qu'on ouvre depuis elle. C'est leur accord qu'on choisit. */
function apercuDuo(cle, vu){
  const d = document.createElement("div");
  d.className = "duo";
  d.appendChild(apercuListe(cle, vu));
  d.appendChild(apercuFiche(cle, vu));
  return d;
}

/**
 * Réglages généraux du plan.
 *
 * Ils ne portent sur aucun calque : dans la pile ils alourdissaient une liste
 * déjà longue, et se lisaient comme une couche de plus. Une fenêtre à part les
 * range, et laisse la place à celles qui viendront.
 *
 * Deux volets : ce que le plan montre, et de quoi il a l'air. Le second est
 * une planche d'aperçus — empilé sous le premier, il l'aurait poussé hors de
 * l'écran.
 */
/**
 * Passer d'un volet à l'autre sans que la fenêtre saute.
 *
 * Les volets n'ont pas la même hauteur — trois cases d'un côté, une planche
 * d'aperçus de l'autre — et la fenêtre en changeait d'un coup. Son haut est
 * déjà tenu par la feuille de style, qui l'accroche en haut plutôt que de la
 * centrer ; reste sa hauteur, qui se rend d'un pas à l'autre au lieu d'y
 * sauter.
 *
 * Les deux hauteurs se mesurent de part et d'autre du changement — « auto » ne
 * s'interpole pas, il faut donc deux nombres — et l'animation est posée sur la
 * fenêtre elle-même : le corps défile déjà pour son compte, il absorbe sans
 * broncher d'être quelques dizaines de pixels trop court le temps du geste.
 */
function glisseFenetre(change){
  const fen = $("modale").querySelector(".mfen");
  if (!fen || REDUIT){ change(); return; }
  const avant = fen.offsetHeight;
  change();
  const apres = fen.offsetHeight;
  if (avant === apres) return;
  fen.animate([{ height: avant + "px" }, { height: apres + "px" }],
              { duration: 190, easing: "ease-out" });
}

function ouvreReglages(ouvrir){
  ouvreModale("Réglages du plan", corps => {
    const barre = document.createElement("div");
    barre.className = "ongReg";
    corps.appendChild(barre);
    const boutons = [], volets = [];
    /* Le volet à ouvrir peut être nommé : la remise à zéro des compteurs passe
       par une fenêtre de confirmation, qui prend la place de celle-ci, et
       « Annuler » doit ramener là d'où l'on vient plutôt qu'au premier onglet.
       Un nom, et rien d'autre : branchée telle quelle sur un bouton, la
       fonction recevrait l'événement de clic, qui ne désigne aucun volet et
       les fermait tous. */
    const nomme = typeof ouvrir === "string" && ouvrir ? ouvrir : null;
    /* Six onglets ne tiennent pas sur un téléphone : la barre y défile. Celui
       qu'on vient de retenir se ramène donc sous les yeux — sans lui, « Mesure »
       restait à moitié coupé après le clic, et la fenêtre ouverte droit sur lui
       ne montrait pas où l'on était. « nearest » et non « center » : la fenêtre
       défile aussi pour son compte, et le centrage la remontait d'un cran.

       À l'image suivante, et non tout de suite : le corps de la fenêtre est
       rempli avant qu'elle ne s'ouvre, et un élément en « display:none » n'a
       aucune position à ramener. */
    const ramene = (b) => requestAnimationFrame(() =>
      b.scrollIntoView({ block: "nearest", inline: "nearest" }));
    const volet = (titre) => {
      const i = boutons.length;
      const actif = nomme ? titre === nomme : i === 0;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = titre;
      b.setAttribute("aria-pressed", String(actif));
      b.onclick = () => {
        // une fiche de zone laissée dans l'onglet d'à côté s'enregistre en le quittant
        verseFicheZone();
        glisseFenetre(() => {
          boutons.forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
          volets.forEach((x, j) => { x.hidden = j !== i; });
        });
        ramene(b);
      };
      barre.appendChild(b);
      boutons.push(b);
      const v = document.createElement("div");
      v.className = "voletReg";
      v.hidden = !actif;
      corps.appendChild(v);
      volets.push(v);
      return v;
    };
    voletPlan(volet("Plan"));
    /* « Recherche » suit « Plan » : les deux parlent de ce que le visiteur
       obtient, quand « Apparence » ne parle que de l'allure. */
    voletRecherche(volet("Recherche"));
    /* La suggestion suit la recherche pour la même raison : elle parle de ce
       que le visiteur obtient, et elle se lit dans la foulée des critères,
       qu'elle emprunte. */
    voletSuggestion(volet(NOM_VOLET_SUGGESTION));
    voletApparence(volet("Apparence"));
    /* Les zones n'ont d'onglet que là où il y en a : sur un salon qui n'en
       compte aucune, il n'ouvrirait que sur une liste vide. */
    if (TOUS.some(z => z.kind === "zone")) voletZones(volet("Zones"));
    /* La mesure a son volet à elle, et en dernier. Elle ne parle ni de ce que
       les visiteurs voient ni de l'allure du plan, et ce qu'on y trouve — un
       effacement sans retour — n'a rien à faire au milieu de cases à cocher. */
    voletMesure(volet(NOM_VOLET_MESURE));
    /* Un nom qui ne désigne aucun volet — un onglet retiré depuis, un salon
       sans zones — laisserait la fenêtre sur rien : on retombe sur le premier
       plutôt que sur le vide. */
    const actif = boutons.find(b => b.getAttribute("aria-pressed") === "true");
    if (actif) ramene(actif); else boutons[0].onclick();
  }, [{ libelle: "Fermer" }], "large");
}

/**
 * Les zones organisateur, l'une après l'autre.
 *
 * Une zone se reprend jusqu'ici depuis sa forme sur le plan : encore
 * faut-il la retrouver, et rien ne distingue de loin une réserve d'une agora.
 * L'exploitant qui remplit les fiches d'un salon les veut en liste, et passe
 * de l'une à l'autre sans refermer.
 *
 * D'où les deux volets : la liste à gauche, la fiche de celle qu'on a choisie
 * à droite. Chaque rang dit ce qu'il en est déjà — une fiche écrite, une zone
 * retirée du plan public — pour qu'on voie d'un coup d'œil ce qui reste à
 * faire.
 */
function voletZones(hote){
  const p = document.createElement("p");
  p.textContent = "Ce que le visiteur lit sur une zone organisateur. La source " +
    "n'en donne que le contour et parfois un nom : le reste s'écrit ici, et " +
    "paraît sans attendre la prochaine synchronisation.";
  hote.appendChild(p);

  /* Sans nom, une zone ne se distingue pas de la suivante : celles qui en ont
     un se lisent dans l'ordre alphabétique, les autres attendent à la fin —
     c'est là qu'est le travail. */
  const zones = TOUS.filter(z => z.kind === "zone").slice().sort((a, b) =>
    (a.nom ? 0 : 1) - (b.nom ? 0 : 1) ||
    String(a.nom || "").localeCompare(String(b.nom || ""), "fr") ||
    String(a.id).localeCompare(String(b.id)));

  const grille = document.createElement("div");
  grille.className = "zonesReg";
  const colonne = document.createElement("div");
  colonne.className = "listeZ";
  const detail = document.createElement("div");
  detail.className = "detailZ";
  grille.appendChild(colonne);
  grille.appendChild(detail);
  hote.appendChild(grille);

  const rangs = new Map();
  /* Ce qu'un rang dit de sa zone. Réécrit après chaque enregistrement : le nom
     vient d'y changer, et la fiche d'y apparaître. */
  const ecritRang = (z) => {
    const b = rangs.get(z.id);
    if (!b) return;
    b.innerHTML = "";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = z.nom || "Zone sans nom";
    b.appendChild(n);
    const dit = [];
    if (z.description || z.lien || z.logo) dit.push("fiche");
    if (z.masquee) dit.push("masquée");
    if (dit.length){
      const e = document.createElement("span");
      e.className = "etat";
      e.textContent = dit.join(" · ");
      b.appendChild(e);
    }
  };

  const choisit = (z) => {
    // ce qu'on quitte part maintenant : la fiche qu'on ouvre prend sa place
    verseFicheZone();
    rangs.forEach((b, id) => b.setAttribute("aria-pressed", String(id === z.id)));
    detail.innerHTML = "";
    ficheZoneEnPlace(detail, z, () => ecritRang(z));
  };

  zones.forEach(z => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => choisit(z);
    colonne.appendChild(b);
    rangs.set(z.id, b);
    ecritRang(z);
  });

  // une liste dont rien n'est choisi n'a que du vide en face d'elle
  choisit(zones[0]);
}

/**
 * La fiche d'une zone, posée dans les réglages plutôt que dans une fenêtre.
 *
 * Elle n'a pas de bouton : on remplit les zones l'une après l'autre, et un
 * bouton par fiche ferait dix validations pour un même travail. Elle part donc
 * quand on la quitte — pour une autre zone, un autre onglet, ou la sortie — et
 * la ligne d'état dit ce qu'il en est advenu tant qu'on la voit encore.
 */
function ficheZoneEnPlace(hote, o, apres){
  const ou = document.createElement("p");
  ou.className = "ouZ";
  ou.textContent = [(DATA.plans[o.p] || {}).libelle,
    o.masquee ? "retirée du plan public" : ""].filter(Boolean).join(" · ");
  hote.appendChild(ou);

  const valeurs = champsZone(hote, o);

  const etat = document.createElement("p");
  etat.className = "etatZ seul";
  etat.textContent = "Ce que vous écrivez est enregistré en quittant la fiche.";
  hote.appendChild(etat);
  suitFicheZone(o, valeurs, etat, apres);
}

/** Ce que les visiteurs voient sur le plan : les commandes, les secteurs, et
 *  le temps qu'on passe sur un stand. */
function voletPlan(hote){
  const p = document.createElement("p");
  p.textContent = "Ce que les visiteurs voient sur le plan. " +
    "Publiez la configuration pour que le changement leur parvienne.";
  hote.appendChild(p);

  const bloc = document.createElement("div");
  bloc.className = "reglages";
  COMMANDES.forEach(cmd => {
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent = cmd.libelle;
    const c = l.querySelector("input");
    c.checked = conf(cmd.cle).visible !== false;
    c.onchange = e => {
      conf(cmd.cle).visible = e.target.checked;
      enregistreConf(); appliqueCommandes();
      // la couleur du parcours vit dans la pile : elle suit le réglage
      if (ADMIN) construitPanneau();
    };
    bloc.appendChild(l);
  });

  /* Le coloriage par secteur reste hors de COMMANDES : celles-ci montrent ou
     retirent une commande du plan, celui-ci change ce que le plan donne à
     voir. Il ne s'offre que sur un salon sectorisé — ailleurs la case
     promettrait des couleurs qu'aucune donnée ne porte. */
  if (SECTEURS.size){
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent = "Montrer les secteurs — couleurs et filtre";
    const c = l.querySelector("input");
    c.checked = conf("_secteurs").visible !== false;
    c.onchange = e => {
      conf("_secteurs").visible = e.target.checked;
      enregistreConf(); appliqueSecteurs(); appliqueFiltre();
      // les couleurs des secteurs vivent dans la pile : elles suivent
      if (ADMIN) construitPanneau();
    };
    bloc.appendChild(l);
  }

  /* Sur quoi l'itinéraire se règle. Le hall d'un seul tenant se traverse
     mieux d'équerre, le hall arrondi mieux allée par allée, et le plan seul
     dit lequel des deux il est — d'où la case, plutôt qu'une règle qu'on
     aurait devinée de loin. */
  {
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent =
      "Suivre les allées une à une — pour un hall arrondi ou aux rangées désaccordées";
    const c = l.querySelector("input");
    c.checked = conf("_guidage").allees === true;
    c.onchange = e => {
      conf("_guidage").allees = e.target.checked;
      enregistreConf();
      // le trait affiché a été calculé avec l'autre réglage : il se refait
      if (typeof relance === "function") relance();
    };
    bloc.appendChild(l);
  }

  /* Les stands partagés, comme les secteurs, ne se règlent que là où il y en
     a : sur un salon d'un exposant par emplacement, ces deux cases ne
     promettraient qu'un plan déjà tel quel. */
  if (salonPartage()){
    [{ cle: "_coexNombre",
       libelle: "Compter les co-exposants sur le plan",
       // le compte fait partie du libellé du stand : il se redessine avec lui
       apres: () => libelles() },
     { cle: "_coexChoix",
       libelle: "Afficher la liste des co-exposants au clic sur le stand" }
    ].forEach(r => {
      const l = document.createElement("label");
      l.innerHTML = '<input type="checkbox"><span></span>';
      l.querySelector("span").textContent = r.libelle;
      const c = l.querySelector("input");
      c.checked = conf(r.cle).visible !== false;
      c.onchange = e => {
        conf(r.cle).visible = e.target.checked;
        enregistreConf();
        if (r.apres) r.apres();
      };
      bloc.appendChild(l);
    });
  }

  hote.appendChild(bloc);

  const duree = document.createElement("div");
  duree.className = "reglage-nb";
  duree.innerHTML = '<label><span class="l"></span>' +
    '<input type="number" min="' + VISITE_MIN + '" max="' + VISITE_MAX + '" step="5">' +
    '<span class="u">min</span></label><span class="aide"></span>';
  duree.querySelector(".l").textContent = "Temps de visite par stand";
  duree.querySelector(".aide").textContent =
    "Sert à organiser la journée d'un visiteur depuis son parcours : c'est ce " +
    "qui décide combien de stands tiennent entre deux conférences.";
  const n = duree.querySelector("input");
  n.value = minutesVisite();
  /* Un champ vidé le temps de retaper ne doit rien écrire : on ne retient
     que ce qui tient dans les bornes, et le champ se remet d'aplomb quand
     on le quitte. */
  n.oninput = e => {
    const v = Math.round(+e.target.value);
