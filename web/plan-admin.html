/* --- gestion du geste de dessin ; renvoie true si l'événement est consommé --- */
function dessinPointerDown(e){
  if (editionPointerDown(e)) return true;
  if (!ADMIN || !calqueActif || outil === "main") return false;
  // sans cela le navigateur démarre une sélection de texte et le
  // relâchement du pointeur ne revient jamais
  e.preventDefault();
  if (outil === "rect" || outil === "image" || outil === "stand"){
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  }
  /* Le contour de hall garde son propre redressement : deux aimantations qui
     tirent le même point chacune de son côté ne se corrigeraient pas, elles
     se disputeraient. */
  const brut = versPlan(e.clientX, e.clientY);
  const p = outil === "contour" ? brut : aimante(brut, { alt: e.altKey });
  if (outil === "texte"){
    const txt = $("texteADessiner").value.trim();
    if (!txt){ $("texteADessiner").focus(); return true; }
    ajouteForme({ t: "texte", pts: [p], txt: txt, taille: 2 });
    return true;
  }
  if (outil === "repere"){
    const type = $("repereType").value;
    /* Le libellé peut rester vide quand le pictogramme se suffit : c'est le
       cas ordinaire d'un WC. Sans type ni libellé, en revanche, il n'y aurait
       rien à poser. */
    const txt = $("repereTexte").value.trim() || (type ? nomTypeRepere(type) : "");
    if (!txt){ $("repereTexte").focus(); return true; }
    // un repère se lit de loin : il naît deux fois plus grand qu'un texte
    ajouteForme({ t: "repere", pts: [p], txt: txt, picto: type, taille: TAILLE_REPERE });
    return true;
  }
  if (outil === "rect"){ enCours = { t: "rect", pts: [p, p] }; return true; }
  /* Un stand dessiné ne vaut que par la société qu'il désigne : sans elle on
     poserait un rectangle muet, invisible pour le visiteur puisqu'il n'ouvre
     aucune fiche. On demande donc l'exposant avant le tracé, comme on demande
     son libellé à un repère. */
  if (outil === "stand"){
    const l = societeSaisie($("standSoc").value);
    if (!l){
      $("outilsAide").textContent = "Choisissez d'abord l'exposant à matérialiser.";
      $("standSoc").focus(); $("standSoc").select();
      return true;
    }
    enCours = { t: "stand", pts: [p, p], stand: l.o.id, soc: l.i };
    return true;
  }
  if (outil === "image"){
    if (!imageEnAttente){ $("outilsAide").textContent = "Choisissez d’abord une image."; return true; }
    enCours = { t: "image", pts: [p, p] };
    return true;
  }
  /* Le contour est un polygone, tracé la main tenue : chaque sommet est
     redressé sur celui d'avant, et revenir sur le premier referme la
     silhouette — c'est le geste que l'on cherche en arrivant là. */
  if (outil === "contour"){
    if (!enCours) enCours = { t: "poly", pts: [p] };
    else {
      const g = {};
      const q = redresseTrace(p, enCours.pts, g);
      if (fermeIci(q, enCours.pts) || fermeIci(p, enCours.pts)){ termineTrace(true); return true; }
      enCours.pts.push(q);
    }
    apercuGuide(null);
    apercu(cheminForme({ t: "ligne", pts: enCours.pts }));
    aide();
    return true;
  }
  // polygone et ligne : un clic par sommet
  if (!enCours) enCours = { t: outil, pts: [p] };
  else enCours.pts.push(p);
  apercu(cheminForme({ ...enCours, t: "ligne" }));
  aide();
  return true;
}
function dessinPointerMove(e){
  if (editionPointerMove(e)) return true;
  if (!enCours){
    /* Sans tracé commencé on ne consomme rien — la vue doit rester déplaçable
       — mais on montre déjà ce que l'outil pourrait viser : c'est en
       approchant du stand voisin qu'on veut savoir si son coin se saisit. */
    if (ADMIN && calqueActif && outil !== "main" && outil !== "contour")
      montreAimants([versPlan(e.clientX, e.clientY)], { alt: e.altKey });
    return false;
  }
  const brut = versPlan(e.clientX, e.clientY);
  const p = outil === "contour" ? brut : aimante(brut, { alt: e.altKey });
  if (estCadre(enCours)){
    enCours.pts[1] = p;
    if (enCours.t === "image"){    // on respecte les proportions de l'image
      const l = enCours.pts[1][0] - enCours.pts[0][0];
      enCours.pts[1][1] = +(enCours.pts[0][1] + Math.abs(l) / imageEnAttente.ratio).toFixed(2);
    }
    apercu(cheminForme(enCours));
    montreCote(coteCadre(enCours.pts[0], enCours.pts[1]), enCours.pts[1]);
  } else {
    let q = p;
    if (outil === "contour"){
      const g = {};
      q = redresseTrace(p, enCours.pts, g);
      // de retour sur le premier sommet : montrer la boucle telle qu'elle
      // se fermerait, plutôt qu'un segment qui passe à côté
      if (fermeIci(q, enCours.pts) || fermeIci(p, enCours.pts)){ q = enCours.pts[0]; g.q = null; }
      traceGuide(g, q);
    }
    apercu(cheminForme({ t: "ligne", pts: [...enCours.pts, q] }));
    /* Sur un tracé, la cote est celle du segment qu'on est en train de poser :
       c'est la longueur du mur, ou du côté, qu'on cherche à faire juste. */
    const b = enCours.pts[enCours.pts.length - 1];
    montreCote(ecritMetres(Math.hypot(q[0] - b[0], q[1] - b[1])) + " m", q);
  }
  return true;
}
function dessinPointerUp(e){
  if (editionPointerUp(e)) return true;
  if (!enCours) return false;
  if (e && e.pointerId != null){
    try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  if (estCadre(enCours)){
    const tracee = () => Math.abs(enCours.pts[1][0] - enCours.pts[0][0]) > .3 &&
                         Math.abs(enCours.pts[1][1] - enCours.pts[0][1]) > .3;
    /* Un clic sans glisser n'est pas un geste manqué : c'est la demande de
       reposer la taille précédente, une fois qu'on l'a trouvée. Le coin
       cliqué, que l'aimant vient de poser juste, en devient l'origine. */
    if (!tracee()) reprendTaille(enCours);
    const pose = tracee() ? enCours : null;
    if (pose){
      const a = pose.pts[0], b = pose.pts[1];
      if (pose.t === "image"){
        pose.pts = [[Math.min(a[0], b[0]), Math.min(a[1], b[1])],
                    [Math.max(a[0], b[0]), Math.max(a[1], b[1])]];
        pose.src = imageEnAttente.src;
      }
      retientTaille(pose);
      ajouteForme(pose);
    }
    enCours = null; apercu(null); apercuGuide(null); montreCote(null);
    /* Le curseur n'a pas bougé : les points d'accrochage se recentrent sur
       lui, plutôt que de rester autour du coin d'où partait le tracé. */
    montreAimants(e ? [versPlan(e.clientX, e.clientY)] : null, { alt: e && e.altKey });
    /* Un stand loué à cinq se découpe en cinq : on enchaîne, et le champ redit
       lequel vient d'être posé plutôt que de se vider en silence. Le reste
       reprend la palette, qui annonce alors la taille qu'un clic reposerait —
       appelée avant, elle aurait décrit un tracé qui n'existe plus. */
    if (pose && pose.t === "stand") enchaineStand(pose); else aide();
  }
  return true;   // polygone et ligne restent ouverts jusqu'à Entrée
}
function termineTrace(valider){
  if (!enCours) return;
  const mini = enCours.t === "ligne" ? 2 : 3;
  // l'arrondi se lit à la validation : on peut le régler le tracé commencé
  if (outil === "contour" && rayonContour() > 0) enCours.r = rayonContour();
  if (valider && enCours.pts.length >= mini) ajouteForme(enCours);
  enCours = null; apercu(null); apercuGuide(null); montreCote(null);
  montreAimants(null); aide();
}

function aide(){
  if (!$("outilsAide")) return;
  const t = { main: formeSel ? "Glissez pour déplacer, les carrés pour redimensionner."
                             : "Cliquez une forme de ce calque pour la modifier.",
              rect: "Cliquez-glissez pour tracer un rectangle.",
              poly: "Un clic par sommet, Entrée pour fermer, Échap pour annuler.",
              contour: "Un clic par angle du hall. Revenez sur le premier point, " +
                       "ou Entrée, pour fermer le contour.",
              ligne: "Un clic par point, Entrée pour terminer, Échap pour annuler.",
              texte: "Saisissez le texte, puis cliquez à l'emplacement voulu.",
              repere: "Choisissez ou saisissez un libellé, puis cliquez à l'emplacement.",
              stand: "Choisissez l'exposant, puis cliquez-glissez sur sa part du stand.",
              image: imageEnAttente ? "Glissez sur le plan pour poser une autre copie."
                                    : "Choisissez une image, ou déposez le fichier sur le plan.",
              _: "" };
  const n = enCours ? " (" + enCours.pts.length + " point" + (enCours.pts.length > 1 ? "s" : "") + ")" : "";
  /* Ce qu'un simple clic reposerait, dit avec ses mesures : une taille qu'on
     ne voit pas annoncée est une taille qu'on retrace à la main. */
  const d = DERNIERE[outil];
  const bis = d && !enCours
    ? " Un clic simple repose " + ecritMetres(d[0]) + " × " + ecritMetres(d[1]) + " m." : "";
  $("outilsAide").textContent = t[outil] + n + bis;
}

/* Un calque de rôle décrit le terrain, pas ce qu'on montre : l'éteindre le
   retire de l'écran sans le retirer du calcul. C'est ce qu'on attend d'un mur,

const AIDE_ROLE_MASQUE = " Masquer le calque ne change rien au calcul : " +

function montreRoleIti(c){

/* saisie du nom dans une fenêtre : plus visible qu'un double-clic */
function demandeNom(titre, valeur, suite){

/* ============================================================
   Édition des formes existantes
   En mode Sélection : un clic choisit, un glisser déplace, les poignées
   redimensionnent ou déplacent les sommets. Les poignées sont recalculées
   à chaque changement de vue pour garder une taille constante à l'écran.
   ============================================================ */
let formeSel = null;
let geste = null;

function formeParId(id){
  for (const c of mesCalques()){
    const f = c.formes.find(x => x.id === id);
    if (f) return { c: c, f: f };
  }
  return null;
}

function boite(f){
  const xs = f.pts.map(p => p[0]), ys = f.pts.map(p => p[1]);
  return [Math.min.apply(null, xs), Math.min.apply(null, ys),
          Math.max.apply(null, xs), Math.max.apply(null, ys)];
}

/* Le curseur annonce ce que fera la poignée. Sur un rectangle les coins
   sont diagonaux ; sur un polygone chaque sommet se déplace librement. */
function curseurPoignee(f, i){
  if (estCadre(f)) return ["nwse-resize", "nesw-resize", "nwse-resize", "nesw-resize"][i];
  return "move";
}

function poignees(f){
  if (estCadre(f)){
    const b = boite(f);
    return [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
  }
  if (f.t === "texte") return [f.pts[0]];
  return f.pts;
}

function dessinePoignees(){
  let g = $("poignees");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "poignees";
    svg.appendChild(g);
  }
  const cible = formeSel && formeParId(formeSel);
  if (!cible || !ADMIN || outil !== "main" || !calqueActif){ g.innerHTML = ""; return; }
  const f = cible.f;
  const r = svg.getBoundingClientRect();
  const t = Math.max(.15, view.w / (r.width || 1) * 5);   // demi-côté, en mètres
  const b = boite(f);
  const marge = t;
  g.innerHTML =
    '<rect class="cadreSel" x="' + (b[0] - marge) + '" y="' + (b[1] - marge) +
    '" width="' + (b[2] - b[0] + 2 * marge) + '" height="' + (b[3] - b[1] + 2 * marge) + '"/>' +
    poignees(f).map((p, i) =>
      '<rect class="pgn" data-i="' + i + '" style="cursor:' + curseurPoignee(f, i) + '"' +
      ' x="' + (p[0] - t) + '" y="' + (p[1] - t) +
      '" width="' + (2 * t) + '" height="' + (2 * t) + '"/>').join("");
}

function choisitForme(id){
  formeSel = id;
  // on bascule la classe plutôt que de tout retracer : inutile de réanalyser
  // les images à chaque changement de sélection
  $("couches").querySelectorAll(".dcal .forme")
    .forEach(g => g.classList.toggle("pick", g.dataset.f === id));
  dessinePoignees();
  majElement();
}

/* --- panneau de la forme choisie --- */
function majElement(){
  const z = $("elemSel");
  if (!z) return;
  const cible = formeSel && formeParId(formeSel);
  if (!cible || outil !== "main"){ z.hidden = true; return; }
  z.hidden = false;
  const f = cible.f;
  const NOMS = { rect: "Rectangle", poly: "Polygone", ligne: "Ligne",
                 texte: "Texte", image: "Image", repere: "Repère",
                 stand: "Stand dessiné" };
  $("elemType").textContent = NOMS[f.t] || f.t;
  /* La largeur et la hauteur en toutes lettres : c'est là qu'on rattrape un
     cadre tracé à peu près, et qu'on en obtient deux fois le même. */
  ecritDimensions(f);
  // un repère porte lui aussi un libellé et une taille
  const estTexte = f.t === "texte" || f.t === "repere";
  $("elemTexte").hidden = !estTexte;
  $("elemTailleBloc").hidden = !estTexte;
  if (estTexte){
    $("elemTexte").value = f.txt || "";
    $("elemTaille").value = f.taille || 2;
  }

  /* L'arrondi se règle après coup, et sur n'importe quel tracé : un contour
     posé d'équerre s'adoucit sans être redessiné, et un rectangle de réserve
     se fond dans un plan aux angles ronds. Il ne déplace aucun sommet — le
     calcul d'itinéraire, qui les lit, ne bouge pas d'un pouce. */
  const arrondissable = f.t === "poly" || f.t === "rect" || f.t === "ligne" ||
                        f.t === "stand";
  const br = $("elemRayonBloc");
  if (br){
    br.hidden = !arrondissable;
    if (arrondissable) $("elemRayon").value = f.r || 0;
  }

  /* Le type d'un repère se change après coup : une porte mal typée ne se voit
     qu'en essayant un trajet, et il serait absurde de la redessiner pour
     cela. Un repère d'avant la séparation du type et du libellé n'en porte
     pas : la liste s'ouvre sur celui que son libellé laisse deviner, et le
     choix s'écrit dès qu'on y touche. */
  const cp = $("elemPicto");
  if (cp){
    const estRepere = f.t === "repere";
    cp.hidden = !estRepere;
    if (estRepere){
      if (!cp.options.length)
        cp.innerHTML = TYPES_REPERE
          .map(t => '<option value="' + esc(t.v) + '">' + esc(t.nom) + '</option>').join("");
      cp.value = pictoForme(f) || "";
    }
  }

  majLiens(f.t === "repere" ? f : null);

  /* Une image peut désigner un stand : le logo d'un exposant posé sur son
     emplacement ouvre sa fiche au clic. */
  const estImage = f.t === "image";
  const ch = $("elemStand");
  if (ch){
    ch.hidden = !estImage;
    if (estImage){
      remplitListeStands();
      const s = f.stand && parId.get(f.stand);
      ch.value = s ? etiquetteStand(s) : "";
    }
  }

  /* Un stand dessiné, lui, désigne une société et non un emplacement : c'est
     tout l'objet du découpage, deux enseignes se partageant le même numéro. */
  const cs = $("elemSoc");
  if (cs){
    const estStandDessine = f.t === "stand";
    cs.hidden = !estStandDessine;
    if (estStandDessine){
      remplitListeSocietes();
      const l = societeDeForme(f);
      cs.value = l ? etiquetteSociete(l.o.code, nomSurLePlan(l.soc)) : "";
    }
  }
}

/* ------------------------------------------------------------
   Ce qu'un passage rejoint
   ------------------------------------------------------------ */
/**
 * Les passages qu'un repère peut rejoindre.
 *
 * Ceux des autres plans, et eux seuls : relier deux escaliers du même hall ne
 * décrirait rien qu'une allée ne dise déjà, et deux portes d'un même pavillon
 * feraient un raccourci que personne ne peut emprunter. Ce qui reste est
 * exactement ce dont on a besoin — le palier à l'étage, la porte d'en face.
 *
 * Un repère en relie autant qu'il en dessert : la liste reste ouverte tant
 * qu'il demeure des passages à joindre, parce qu'un escalier de
 * rez-de-chaussée monte au premier comme au second.
 */
function candidatsLiaison(f){
  const an = annuaireLiaisons();
  const deja = an.vers.get(f.id) || new Map();
  const ici = P().id;
  const out = [];
  an.par.forEach((o, id) => {
    if (id === f.id || deja.has(id) || o.p.id === ici) return;
    out.push(o);
  });
  return out.sort((a, b) => a.p.i - b.p.i ||
    COLLATION.compare(nomRepere(a.f), nomRepere(b.f)));
}

/**
 * Écrire une liaison sur les deux repères qu'elle joint.
 *
 * Un passage n'a pas de sens : on descend l'escalier qu'on a monté. Il
 * s'écrit donc des deux côtés, et le second vit dans un autre plan — hors de
 * l'historique d'annulation, qui ne connaît que le plan ouvert. Le calcul lit
 * de toute façon l'union des deux écritures : une annulation qui ne défait
 * qu'un côté laisse le passage en place plutôt qu'un lien boiteux.
 */
function ecritDesDeuxCotes(idAutre, change){
  const cible = formeSel && formeParId(formeSel);
  const autre = annuaireLiaisons().par.get(idAutre);
  if (!cible || !autre || !typeLiaison(cible.f)) return;
  memorise();
  ecritLiens(cible.f, change(lienEcrits(cible.f), idAutre));
  ecritLiens(autre.f, change(lienEcrits(autre.f), cible.f.id));
  enregistreDessins();
  majElement();
}

/** Poser ou retirer un passage. */
function changeLien(idAutre, ajoute){
  ecritDesDeuxCotes(idAutre, (l, id) => {
    const reste = l.filter(x => x.id !== id);
    if (ajoute) reste.push({ id: id, min: null });
    return reste;
  });
}

/**
 * Fixer le temps d'un passage, ou le rendre à celui de son type.
 *
 * Il se règle par couple, et non par repère : le même escalier met une minute
 * au premier étage et davantage au second, et c'est bien deux passages
 * distincts qu'on a déclarés. Le champ vide n'est pas zéro — c'est « le temps
 * ordinaire de ce type de passage », celui qu'affiche son invite.
 */
function changeDureeLien(idAutre, txt){
  const brut = String(txt == null ? "" : txt).trim();
  const v = brut === "" ? null : Math.max(0, Math.min(120, Math.round(+brut) || 0));
  ecritDesDeuxCotes(idAutre, (l, id) => {
    const x = l.find(y => y.id === id);
    if (x) x.min = v; else l.push({ id: id, min: v });
    return l;
  });
}

/**
 * Le panneau des passages du repère choisi.
 *
 * Il n'apparaît que pour ce qui est un passage — une porte, un escalier, un
 * escalator, un ascenseur. Sur un WC il n'aurait rien à relier, et proposer
 * de le faire inviterait à des trajets qui traversent les murs.
 */
function majLiens(f){
  const z = $("elemLiens");
  if (!z) return;
  const t = f && typeLiaison(f);
  z.hidden = !t;
  if (!t) return;

  const liste = $("elemLiensListe");
  liste.innerHTML = "";
  const liens = liensDe(f);
  liens.forEach(x => {
    const d = document.createElement("div");
    d.className = "lien";
    d.innerHTML = '<span></span><input class="lienMin" type="number" min="0" max="120" ' +
      'step="1" title="Temps de passage, en minutes"><b>min</b>' +
      '<button class="btnSup" title="Retirer ce passage">&times;</button>';
    d.querySelector("span").textContent = x.o.p.libelle + " · " + nomRepere(x.o.f) +
      (x.o.visible ? "" : " (calque masqué)");
    const ch = d.querySelector(".lienMin");
    ch.value = x.min == null ? "" : x.min;
    ch.placeholder = t.min;
    ch.onchange = () => changeDureeLien(x.o.f.id, ch.value);
    d.querySelector("button").onclick = () => changeLien(x.o.f.id, false);
    liste.appendChild(d);
  });

  const sel = $("elemLienAjout");
  const dispo = candidatsLiaison(f);
  sel.innerHTML = '<option value="">' +
    (dispo.length ? "Relier à…" : "Aucun autre passage sur les autres plans") + "</option>" +
    dispo.map(o => '<option value="' + esc(o.f.id) + '">' + esc(o.p.libelle) + " · " +
      esc(nomRepere(o.f)) + " (" + esc(nomTypeRepere(pictoForme(o.f))) + ")</option>").join("");
  sel.disabled = !dispo.length;

  $("elemLienAide").textContent = liens.length
    ? "Un trajet qui arrive ici continue de l'autre côté. Le temps de chaque " +
      "passage s'ajoute à celui de la marche ; laissé vide, il vaut " +
      ecritMinutes(t.min) + "."
    : "Reliez ce " + t.nom + " à ce qu'il dessert sur les autres plans — un escalier " +
      "monte souvent à deux étages, et chacun est un passage — et les itinéraires " +
      "enchaîneront les plans au lieu de s'arrêter là.";
}

/** « G55 — SMC2 », ou le seul des deux qui existe. */
const etiquetteStand = (s) =>
  [s.code, s.nom].filter(Boolean).join(" — ") || s.id;

/** La liste de choix suit le pavillon courant : un stand d'un autre pavillon
 *  ne pourrait pas porter une image posée ici. */
function remplitListeStands(){
  const l = $("listeStands");
  if (!l) return;
  l.innerHTML = P().stands
    .filter(s => s.code || s.nom)
    .map(s => '<option value="' + esc(etiquetteStand(s)) + '">').join("");
}

/** Retrouve le stand désigné par ce qui a été saisi. */
function standSaisi(txt){
  const v = String(txt || "").trim().toLowerCase();
  if (!v) return null;
  const st = P().stands;
  return st.find(s => etiquetteStand(s).toLowerCase() === v)
      || st.find(s => String(s.code || "").toLowerCase() === v)
      || st.find(s => String(s.nom || "").toLowerCase() === v)
      || null;
}

function appliqueLiaison(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "image") return;
  const ch = $("elemStand");
  const s = standSaisi(ch.value);
  memorise();
  if (s){ cible.f.stand = s.id; ch.value = etiquetteStand(s); }
  else { delete cible.f.stand; ch.value = ""; }
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

/**
 * Rattacher un stand dessiné à une société, ou l'en détacher.
 *
 * Détaché, il reste sur le plan — il a été tracé, on ne l'efface pas dans le
 * dos de qui vient de mal saisir un nom — mais il n'ouvre plus rien et perd
 * son libellé : le plan dit ainsi qu'il attend encore son exposant.
 */
function appliqueSociete(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "stand") return;
  const ch = $("elemSoc");
  const l = societeSaisie(ch.value);
  memorise();
  if (l){
    cible.f.stand = l.o.id; cible.f.soc = l.i;
    ch.value = etiquetteSociete(l.o.code, nomSurLePlan(l.soc));
  } else {
    delete cible.f.stand; delete cible.f.soc;
    ch.value = "";
  }
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

function appliqueTexte(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || (cible.f.t !== "texte" && cible.f.t !== "repere")) return;
  memorise();
  cible.f.txt = $("elemTexte").value;
  cible.f.taille = Math.max(.3, Math.min(30, +$("elemTaille").value || 2));
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

/** L'arrondi des coins de la forme choisie. */
function appliqueRayon(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible) return;
  memorise();
  cible.f.r = Math.max(0, Math.min(10, +$("elemRayon").value || 0));
  enregistreDessins(); dessineDessins();
}

/** Changer ce qu'un repère est : son pictogramme suit, et avec lui ce qu'il
 *  vaut pour l'itinéraire — une porte, un escalier à contourner en fauteuil. */
function appliquePicto(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "repere") return;
  memorise();
  cible.f.picto = $("elemPicto").value;
  /* Un repère qui cesse d'être un passage garde ses liaisons écrites : elles
     ne désignent plus rien, et l'annuaire les ignore déjà — mais les retirer
     ici punirait une fausse manœuvre d'une perte qu'on ne peut pas défaire. */
  enregistreDessins();
  /* Le pavage des allées tient compte des escaliers et des escalators : en
     désigner un, ou cesser de le faire, change les trajets accessibles. */
  oublieGrilles();
  /* Devenir un escalier, ou cesser de l'être, ouvre ou ferme le panneau des
     passages : le panneau se relit donc, comme après tout changement de ce
     qu'un repère est. */
  dessineDessins(); dessinePoignees(); majElement();
}

function supprimeForme(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible) return;
  memorise();
  cible.c.formes = cible.c.formes.filter(x => x.id !== formeSel);
  formeSel = null;
  enregistreDessins(); dessineDessins(); dessinePoignees(); majElement();
}

/* --- gestes d'édition ; renvoient true si l'événement est consommé --- */
function editionPointerDown(e){
  if (!ADMIN || outil !== "main") return false;
  const p = versPlan(e.clientX, e.clientY);

  const pgn = e.target.closest(".pgn");
  if (pgn && formeSel){
    const cible = formeParId(formeSel);
    if (cible){
      memorise();
      geste = { type: "poignee", i: +pgn.dataset.i, depart: p,
                pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = curseurPoignee(cible.f, geste.i);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      return true;
    }
  }

  const g = e.target.closest(".dcal .forme");
  if (g){
    const id = g.dataset.f;
    const cible = formeParId(id);
    const sienne = cible && cible.c.id === calqueActif;

    /* Seul le calque ouvert par l'exploitant se laisse retoucher. Une forme
       d'un autre calque n'est ni sélectionnée ni déplacée : trop de dessins
       partaient à la dérive sur un clic destiné à la vue. Pour la reprendre,
       il faut ouvrir son calque depuis le panneau. Une image liée à un stand
       reste l'exception : elle ouvre sa fiche, comme pour un visiteur ; le
       reste laisse passer le geste vers le plan, qui se déplace. */
    if (!sienne) return false;

    if (id !== formeSel) choisitForme(id);
    if (cible){
      memorise();
      geste = { type: "deplace", depart: p, pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = "move";
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    }
    return true;
  }

  if (formeSel){ choisitForme(null); return true; }
  return false;    // rien sous le pointeur : on laisse le déplacement de la vue
}

function editionPointerMove(e){
  if (!geste) return false;
  const p = versPlan(e.clientX, e.clientY);
  let dx = p[0] - geste.depart[0], dy = p[1] - geste.depart[1];
  const f = geste.f;
  // une forme ne s'accroche pas à elle-même : elle ne bougerait plus
  const acc = { alt: e.altKey, sauf: f.id };

  if (geste.type === "deplace"){
    /* Le déplacement s'accroche par ses quatre coins, et retient la plus
       petite correction : glisser un stand contre son voisin le range par
       celui de ses bords qui arrive le premier. */
    const c = correction(coinsGeste(geste.pts, estCadre(f)).map(q => [q[0] + dx, q[1] + dy]), acc);
    dx += c[0]; dy += c[1];
    f.pts = geste.pts.map(q => [+(q[0] + dx).toFixed(2), +(q[1] + dy).toFixed(2)]);
  } else if (estCadre(f)){
    // la poignée opposée reste fixe ; l'image garde ses proportions
    const b = [Math.min(geste.pts[0][0], geste.pts[1][0]), Math.min(geste.pts[0][1], geste.pts[1][1]),
               Math.max(geste.pts[0][0], geste.pts[1][0]), Math.max(geste.pts[0][1], geste.pts[1][1])];
    const coins = [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
    const fixe = coins[(geste.i + 2) % 4];
    let mx = coins[geste.i][0] + dx, my = coins[geste.i][1] + dy;
    if (f.t === "image" && f.pts.length === 2){
      /* Seule la largeur s'accroche : la hauteur est commandée par les
         proportions de l'image, et un aimant qui la tirerait les casserait. */
      acc.axes = "x";
      mx += correction([[mx, my]], acc)[0];
      const ratio = (b[2] - b[0]) / Math.max(.01, b[3] - b[1]);
      const l = Math.abs(mx - fixe[0]);
      my = fixe[1] + Math.sign(my - fixe[1] || 1) * (l / ratio);
    } else {
      const c = correction([[mx, my]], acc);
      mx += c[0]; my += c[1];
    }
    f.pts = [[+Math.min(fixe[0], mx).toFixed(2), +Math.min(fixe[1], my).toFixed(2)],
             [+Math.max(fixe[0], mx).toFixed(2), +Math.max(fixe[1], my).toFixed(2)]];
  } else {
    const q = geste.pts.map(x => x.slice());
    q[geste.i] = aimante([+(q[geste.i][0] + dx).toFixed(2), +(q[geste.i][1] + dy).toFixed(2)], acc);
    f.pts = q;
  }
  dessineDessins(); dessinePoignees();
  /* La cote et les champs suivent le geste : c'est en le retenant qu'on
     s'arrête sur douze mètres, pas en le vérifiant après coup. */
  if (estCadre(f)){
    const b = boite(f);
    montreCote(coteCadre([b[0], b[1]], [b[2], b[3]]), [b[2], b[3]]);
  }
  ecritDimensions(f);
  return true;
}

function editionPointerUp(e){
  if (!geste) return false;
  const f = geste.f;
  geste = null;
  svg.style.cursor = "";
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  apercuGuide(null); montreCote(null); montreAimants(null);
  retientTaille(f);
  enregistreDessins();
  return true;
}

/* ============================================================
   11 quater. Dessiner juste — cote, aimants, répétition
   ============================================================
   Un geste à main levée donne des stands de 3,47 × 2,08 m : la main sait
   viser un endroit, pas une dimension. Trois secours, qui se complètent.
   La cote dit ce qu'on trace pendant qu'on le trace. Les aimants accrochent
   le geste à la géométrie déjà posée, qui elle est juste au centimètre. Et
   la répétition redonne une taille trouvée au lieu de la faire retrouver.
   ============================================================ */

/* --- ce que le geste mesure --- */

/** Un nombre de mètres écrit en français, sans zéros inutiles : « 12 », « 6,5 ». */
const ecritMetres = (v) =>
  (Math.round(Math.abs(v) * 100) / 100).toFixed(2).replace(/\.?0+$/, "").replace(".", ",");

/** « 12 × 6 m » — ce que deux coins opposés mesurent. */
const coteCadre = (a, b) =>
  ecritMetres(b[0] - a[0]) + " × " + ecritMetres(b[1] - a[1]) + " m";

/**
 * La cote du geste en cours, écrite sur le plan près du point qu'on déplace.
 *
 * Sur le plan, et non dans la palette : l'œil suit la forme qu'il trace, et
 * une taille qu'il faut aller chercher du regard ne corrige rien — on s'en
 * aperçoit une fois le stand posé, ce qui est trop tard. Le texte est
 * dimensionné en mètres, comme les poignées : il garde donc sa taille à
 * l'écran quel que soit le zoom.
 */
function montreCote(txt, p){
  let el = $("cote");
  if (!txt || !p){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "text");
    el.id = "cote";
    svg.appendChild(el);
  }
  const r = svg.getBoundingClientRect();
  const u = view.w / (r.width || 1);          // un pixel d'écran, en mètres
  el.setAttribute("font-size", +(13 * u).toFixed(3));
  el.setAttribute("x", +(p[0] + 12 * u).toFixed(2));
  el.setAttribute("y", +(p[1] - 12 * u).toFixed(2));
  el.textContent = txt;
}

/* ------------------------------------------------------------
   Les aimants
   ------------------------------------------------------------
   Un plan de salon n'est pas quadrillé : il est fait d'emplacements dont on
   connaît les coins au centimètre, tenus par la synchronisation. C'est donc
   à eux que le geste s'accroche, et non à une grille qu'on aurait inventée —
   s'aligner sur une grille reviendrait ici à manquer le seul repère qui
   existe vraiment. S'y ajoutent les formes déjà dessinées : un stand loué à
   cinq se découpe en cinq parts qui se touchent, et la deuxième part doit
   pouvoir se poser contre la première.
   ------------------------------------------------------------ */

const aimantsActifs = () => !$("aimants") || $("aimants").checked;

/** Les abscisses — ou les ordonnées — distinctes d'un relevé. Une rangée de
 *  stands partage les siennes : les dédoubler allège d'autant le balayage. */
const axesDe = (pts, i) => [...new Set(pts.map(q => q[i]))];

/** Les points d'un contour qui servent d'aimant : ses sommets, et son centre.
 *  Le centre parce qu'un logo se pose au milieu de l'emplacement qu'il
 *  désigne, et que viser ce milieu à l'œil ne donne jamais deux fois le même. */
function pointsAimants(pts){
  if (!pts.length) return pts;
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const cx = +((Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2).toFixed(2);
  const cy = +((Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2).toFixed(2);
  return pts.concat([[cx, cy]]);
}

/**
 * Les sommets des emplacements et des zones du pavillon.
 *
 * Ils ne bougent qu'à la synchronisation, laquelle recharge la page : on les
 * relève une fois par pavillon et on n'y revient pas.
 */
const AIMANTS_FOND = new Map();
function aimantsDuPlan(){
  const p = P();
  let a = AIMANTS_FOND.get(p.id);
  if (a) return a;
  const pts = [], emprises = [];
  const releve = (o) => {
    const s = sommets(o);
    if (!s.length) return;
    pts.push(...pointsAimants(s));
    const xs = s.map(q => q[0]), ys = s.map(q => q[1]);
    emprises.push([Math.min.apply(null, xs), Math.min.apply(null, ys),
                   Math.max.apply(null, xs), Math.max.apply(null, ys)]);
  };
  for (const o of p.stands) releve(o);
  for (const o of p.zones) releve(o);
  a = { pts: pts, xs: axesDe(pts, 0), ys: axesDe(pts, 1), emprises: emprises };
  AIMANTS_FOND.set(p.id, a);
  return a;
}

/* ------------------------------------------------------------
   La grille propre à chaque emplacement
   ------------------------------------------------------------
   Une grille par stand, née de son propre coin — et non une trame unique
   posée sur le pavillon. Deux stands voisins que le relevé ne pose pas au
   même centimètre ont donc chacun la sienne, ce qui est exactement ce qu'on
   veut : on découpe un stand par rapport à lui-même, on ne l'aligne pas sur
   une origine qui ne veut rien dire pour lui.
   ------------------------------------------------------------ */

/** Le pas demandé, en mètres. */
const pasAimant = () => {
  const v = parseFloat($("aimantPas") ? $("aimantPas").value : "");
  return isFinite(v) && v > 0 ? v : .5;
};

/** Une coordonnée ramenée sur les crans d'une emprise. Le bord est un cran
 *  comme un autre : une largeur qui n'est pas un multiple du pas garde son
 *  coin plutôt que de voir sa grille déborder. */
const cale = (v, a, b, s) =>
  +Math.max(a, Math.min(b, a + Math.round((v - a) / s) * s)).toFixed(2);

/** L'emprise sous le geste tient la grille qui compte : hors d'un stand, il
 *  n'y a rien à caler dessus. La marge laisse accrocher depuis le bord. */
const sousLeGeste = (c, e, tol) =>
  c[0] >= e[0] - tol && c[0] <= e[2] + tol && c[1] >= e[1] - tol && c[1] <= e[3] + tol;

/**
 * Le meilleur cran de grille pour un axe, parmi les points du geste.
 *
 * Par axe, et non par point : au pas de soixante-quinze centimètres, une
 * abscisse peut tomber à un doigt d'un cran quand l'ordonnée en est loin.
 * Exiger les deux à la fois ne rattraperait alors ni l'une ni l'autre, là où
 * chacune séparément range ce qu'elle peut.
 */
function cranGrille(coins, i, tol){
  const s = pasAimant();
  let m = null;
  for (const c of coins)
    for (const e of aimantsDuPlan().emprises){
      if (!sousLeGeste(c, e, tol)) continue;
      const v = cale(c[i], e[i], e[i + 2], s);
      const d = Math.abs(v - c[i]);
      if (d < tol && (!m || d < m.d)) m = { d: d, v: v, dep: c[i] };
    }
  return m;
}

/* Les formes dessinées, elles, changent à chaque geste. Le relevé se refait
   donc dès qu'un dessin est enregistré — c'est-à-dire entre deux gestes, et
   jamais pendant l'un d'eux. */
let AIMANTS_DES = null, AIMANTS_SAUF = null, AIMANTS_PLAN = null;
const oublieAimants = () => { AIMANTS_DES = null; };

function aimantsDessines(sauf){
  if (AIMANTS_DES && AIMANTS_SAUF === sauf && AIMANTS_PLAN === P().id) return AIMANTS_DES;
  const pts = [];
  for (const c of mesCalques()){
    if (c.visible === false) continue;
    for (const f of c.formes){
      /* Une forme ne s'accroche pas à elle-même : ses propres bords la
         retiendraient sur place à chaque tentative de la déplacer. */
      if (f.id === sauf || f.t === "texte") continue;
      if (estCadre(f)){
        const b = boite(f);
        pts.push(...pointsAimants([[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]]));
      } else pts.push(...pointsAimants(f.pts));
    }
  }
  AIMANTS_SAUF = sauf;
  AIMANTS_PLAN = P().id;
  AIMANTS_DES = { pts: pts, xs: axesDe(pts, 0), ys: axesDe(pts, 1) };
  return AIMANTS_DES;
}

/** Les points d'un geste autorisés à s'accrocher : les quatre coins d'un
 *  cadre et son centre, les sommets d'un tracé — sa boîte au-delà d'une
 *  douzaine, où balayer chaque sommet ne changerait plus rien qu'au temps de
 *  calcul. Le centre parce qu'une image se pose au milieu d'un stand, et que
 *  c'est alors centre contre centre qu'il faut l'accrocher. */
function coinsGeste(pts, cadre){
  if (!cadre && pts.length <= 12) return pointsAimants(pts);
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min.apply(null, xs), y0 = Math.min.apply(null, ys);
  const x1 = Math.max.apply(null, xs), y1 = Math.max.apply(null, ys);
  return pointsAimants([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
}

/**
 * Les points auxquels le geste pourrait s'accrocher, montrés autour de lui.
 *
 * Autour de lui, et non tous : un pavillon en compte plusieurs milliers, et
 * les semer sur le plan reviendrait à le recouvrir d'un semis illisible qui
 * n'apprendrait rien. À portée du geste, en revanche, ils disent exactement
 * ce que la main peut viser — et pourquoi elle vient d'être corrigée.
 *
 * Ils s'affichent aussi à vide, tant qu'un outil de tracé est choisi : c'est
 * en approchant du stand voisin qu'on veut savoir si son coin est saisissable,
 * pas une fois le rectangle commencé.
 */
const PORTEE_VUE = 120;    // en pixels d'écran autour du geste
let AIMANTS_VUS = "";      // ce qui est déjà à l'écran, pour ne pas le refaire
function montreAimants(coins, opts){
  const o = opts || {};
  let g = $("aimantsVus");
  const efface = () => { if (g) g.remove(); AIMANTS_VUS = ""; };
  if (!coins || !coins.length || !aimantsActifs() || o.alt){ efface(); return; }
  const r = svg.getBoundingClientRect();
  const u = view.w / (r.width || 1);        // un pixel d'écran, en mètres
  /* Une portée comptée en pixels et non en mètres : ce qu'on montre, c'est le
     voisinage du curseur tel qu'on le voit, et il doit rester le même qu'on
     travaille sur un hall entier ou sur un stand. */
  const portee = u * PORTEE_VUE;
  const jeux = [aimantsDuPlan(), aimantsDessines(o.sauf || null)];
  const vus = new Map();
  for (const c of coins)
    for (const jeu of jeux)
      for (const q of jeu.pts){
        if (Math.abs(q[0] - c[0]) > portee || Math.abs(q[1] - c[1]) > portee) continue;
        const cle = q[0] + "," + q[1];
        if (!vus.has(cle)) vus.set(cle, q);
      }

  /* Les crans de la grille, eux, ne se montrent qu'à quelques pas : au pas de
     vingt-cinq centimètres, un stand entier en porte plus d'un millier, et
     couvrir le plan de points reviendrait à n'en montrer aucun. */
  const pas = pasAimant();
  const pg = Math.min(portee, pas * 8);
  const grille = new Map();
  for (const c of coins)
    for (const e of aimantsDuPlan().emprises){
      if (!sousLeGeste(c, e, pg)) continue;
      const de = (v, a, b) => [Math.max(a, a + Math.ceil((v - pg - a) / pas) * pas),
                               Math.min(b, v + pg)];
      const [x0, x1] = de(c[0], e[0], e[2]), [y0, y1] = de(c[1], e[1], e[3]);
      for (let x = x0; x <= x1 + 1e-6; x += pas)
        for (let y = y0; y <= y1 + 1e-6; y += pas){
          const q = [+x.toFixed(2), +y.toFixed(2)];
          const cle = q[0] + "," + q[1];
          if (!vus.has(cle) && !grille.has(cle)) grille.set(cle, q);
        }
    }

  if (!vus.size && !grille.size){ efface(); return; }
  /* Le curseur bouge à chaque image, le voisinage presque jamais : sans cette
     comparaison, on reconstruirait cent cercles soixante fois par seconde
     pour redessiner exactement les mêmes. */
  const rayon = +(u * 3).toFixed(3);          // constant à l'écran, lui aussi
  // le zoom entre dans la comparaison : les mêmes points s'y redessinent
  const cle = rayon + "|" + [...vus.keys()].join(";") + "|" + [...grille.keys()].join(";");
  if (g && cle === AIMANTS_VUS) return;
  AIMANTS_VUS = cle;
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "aimantsVus";
    svg.appendChild(g);
  }
  /* Le plafond n'est qu'un garde-fou. Les crans passent derrière les sommets,
     et plus discrets qu'eux : un coin de stand reste l'accrochage franc, un
     cran n'est qu'une graduation. */
  const cercle = (q, cl) => '<circle' + cl + ' cx="' + q[0] + '" cy="' + q[1] +
                            '" r="' + (cl ? +(rayon * .62).toFixed(3) : rayon) + '"/>';
  g.innerHTML = [...grille.values()].slice(0, 600).map(q => cercle(q, ' class="cran"')).join("") +
                [...vus.values()].slice(0, 400).map(q => cercle(q, "")).join("");
}

/** Le meilleur sommet à portée d'un des points du geste. */
function meilleurSommet(coins, jeux, tol){
  let m = null;
  for (const c of coins)
    for (const jeu of jeux)
      for (const q of jeu.pts){
        // le rejet par la boîte évite une racine carrée par emplacement
        if (Math.abs(q[0] - c[0]) > tol || Math.abs(q[1] - c[1]) > tol) continue;
        const d = Math.hypot(q[0] - c[0], q[1] - c[1]);
        if (!m || d < m.d) m = { d: d, dx: q[0] - c[0], dy: q[1] - c[1], q: q };
      }
  return m;
}

/** La petite croix qui dit quel point a pris. */
const croixAimant = (q, tol) => {
  const r = +(tol * .7).toFixed(2);
  return "M" + (q[0] - r) + " " + q[1] + "h" + (2 * r) +
         "M" + q[0] + " " + (q[1] - r) + "v" + (2 * r);
};

/**
 * Ce que le geste doit corriger pour tomber juste, et le repère qui l'explique.
 *
 * Trois degrés, dans cet ordre. Un sommet d'abord — un coin d'emplacement, un
 * centre : il prend les deux coordonnées d'un coup, et c'est l'accrochage le
 * plus franc. La grille propre de l'emplacement ensuite, pour tout ce qui se
 * pose *dans* un stand plutôt qu'à ses angles. Les axes enfin, chacun pour
 * son compte : c'est ce qui range une rangée de stands dont aucun coin ne se
 * touche.
 *
 * `coins` porte les points du geste qui ont le droit de s'accrocher : un
 * tracé n'en a qu'un, celui qu'on déplace ; une forme entière offre les
 * quatre coins de sa boîte et son centre, et retient la plus petite
 * correction. `axes` vaut « x » quand la hauteur est commandée d'ailleurs —
 * les proportions d'une image — et que l'accrochage ne doit toucher qu'à la
 * largeur.
 */
function correction(coins, opts){
  const o = opts || {};
  montreAimants(coins, o);
  if (!aimantsActifs() || o.alt){ apercuGuide(null); return [0, 0]; }
  const tol = toleranceTrace();
  const jeux = [aimantsDuPlan(), aimantsDessines(o.sauf || null)];
  const seulX = o.axes === "x";

  /* Un sommet passe avant tout : c'est l'accrochage franc, celui qui pose un
     coin sur un coin. La grille et les alignements se disputent le reste, axe
     par axe. */
  const pris = meilleurSommet(coins, jeux, tol);
  if (pris){
    apercuGuide(croixAimant(pris.q, tol));
    // une image ne corrige que sa largeur : sa hauteur suit ses proportions
    return [pris.dx, seulX ? 0 : pris.dy];
  }

  const axe = (i) => {
    let d = 0, ec = tol, v = null;
    for (const c of coins)
      for (const jeu of jeux)
        for (const x of (i ? jeu.ys : jeu.xs)){
          const e = Math.abs(x - c[i]);
          if (e < ec){ ec = e; d = x - c[i]; v = x; }
        }
    // le cran de la grille de l'emplacement où l'on se trouve, s'il fait mieux
    const g = cranGrille(coins, i, tol);
    if (g && g.d < ec){ d = g.v - g.dep; v = g.v; }
    return [d, v];
  };
  const ax = axe(0), ay = seulX ? [0, null] : axe(1);
  /* Le trait qui traverse la vue dit sur quoi le bord vient de s'aligner :
     sans lui, l'accrochage passe pour une main qui a tremblé. */
  const g = (ax[1] == null ? "" : "M" + ax[1] + " " + view.y + "v" + view.h) +
            (ay[1] == null ? "" : "M" + view.x + " " + ay[1] + "h" + view.w);
  apercuGuide(g || null);
  return [ax[0], ay[0]];
}

/** Un point du geste, accroché. */
function aimante(p, opts){
  const [dx, dy] = correction([p], opts);
  return dx || dy ? [+(p[0] + dx).toFixed(2), +(p[1] + dy).toFixed(2)] : p;
}

/* ------------------------------------------------------------
   Reposer la même taille
   ------------------------------------------------------------ */

/* La dernière taille tracée, par outil. Un salon aligne des emplacements
   identiques, et retracer vingt fois le même rectangle à la main est le plus
   sûr moyen d'en obtenir vingt qui diffèrent tous. */
const DERNIERE = {};

function retientTaille(f){
  if (!estCadre(f)) return;
  const b = boite(f);
  DERNIERE[f.t] = [+(b[2] - b[0]).toFixed(2), +(b[3] - b[1]).toFixed(2)];
}

/**
 * Le cadre qu'un clic sans glisser demande : la dernière taille tracée,
 * posée depuis le point cliqué.
 *
 * Depuis le coin, et non autour du point : c'est ce coin que l'aimant vient
 * de poser sur celui d'un emplacement, et une taille reprise à partir de là
 * range le stand suivant contre le précédent sans qu'on ait rien à viser.
 */
function reprendTaille(f){
  const t = DERNIERE[f.t];
  if (!t) return false;
  const a = f.pts[0];
  let l = t[0], h = t[1];
  /* Une autre image n'a pas les proportions de la précédente. On garde la
     largeur — c'est elle qu'on voulait identique d'un logo à l'autre — et la
     hauteur suit. */
  if (f.t === "image" && imageEnAttente) h = +(l / imageEnAttente.ratio).toFixed(2);
  f.pts = [a.slice(), [+(a[0] + l).toFixed(2), +(a[1] + h).toFixed(2)]];
  return true;
}

/**
 * La copie de la forme choisie, posée contre elle.
 *
 * Contre elle, et non décalée en biais comme le ferait un logiciel de dessin :
 * ce qu'on répète ici, ce sont des emplacements mitoyens, et un Ctrl+D répété
 * doit dérouler la rangée. Ce qui n'a pas de largeur — un repère, un texte —
 * se décale d'un mètre, faute de mieux.
 */
function dupliqueForme(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.c.id !== calqueActif) return;
  const f = cible.f;
  const b = boite(f);
  const dx = Math.max(1, +(b[2] - b[0]).toFixed(2));
  /* Copie de surface : `pts` est refait, `liens` retiré, et tout le reste —
     le libellé, la société, la source d'une image — se partage sans se
     recopier. Une image dupliquée ne pèse donc rien de plus. */
  const copie = Object.assign({}, f, {
    pts: f.pts.map(q => [+(q[0] + dx).toFixed(2), q[1]]) });
  /* Les passages se déclarent des deux côtés : recopiés d'un seul, ils
     désigneraient un repère qui ne les connaît pas. La copie naît donc sans
     liaison — c'est un lieu de plus, et non le même. */
  delete copie.liens;
  const id = ajouteForme(copie);
  if (!id) return;
  choisitForme(id);
  retientTaille(copie);
  signale(id);          // posée à côté, elle se confondrait avec sa voisine
}

/** Le clavier ajuste au quart de mètre ce que la main a posé à peu près, et
 *  au mètre touche majuscule tenue : le pas des libellés, pour n'avoir qu'une
 *  convention à retenir. */
function pousseForme(dx, dy){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.c.id !== calqueActif) return;
  memorise();
  cible.f.pts = cible.f.pts.map(q => [+(q[0] + dx).toFixed(2), +(q[1] + dy).toFixed(2)]);
  enregistreDessins(); dessineDessins(); dessinePoignees();
  ecritDimensions(cible.f);
}

/* ------------------------------------------------------------
   La taille au clavier
   ------------------------------------------------------------ */

/** Ce que les deux champs disent de la forme choisie. On n'écrit que ce qui
 *  change : réécrire un champ qu'on est en train de remplir y replacerait le
 *  curseur à la fin, au milieu de la frappe. */
function ecritDimensions(f){
  const z = $("elemDim");
  if (!z) return;
  z.hidden = !f || !estCadre(f);
  if (z.hidden) return;
  const b = boite(f);
  const met = (id, v) => { const c = $(id); if (+c.value !== v) c.value = v; };
  met("elemLargeur", +(b[2] - b[0]).toFixed(2));
  met("elemHauteur", +(b[3] - b[1]).toFixed(2));
}

/**
 * La taille exacte de la forme choisie.
 *
 * Le coin supérieur gauche ne bouge pas : on corrige une dimension, on ne
 * déplace pas ce qui était déjà bien placé. Une image garde ses proportions,
 * et c'est la largeur qui commande — d'un logo à l'autre, c'est elle qu'on
 * veut identique.
 */
function appliqueDimension(quoi){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || !estCadre(cible.f)) return;
  const f = cible.f, b = boite(f);
  let l = +$("elemLargeur").value, h = +$("elemHauteur").value;
  // un champ vidé, ou en cours de frappe, n'est pas une taille
  if (!(l > 0) || !(h > 0)) return;
  if (f.t === "image"){
    const ratio = (b[2] - b[0]) / Math.max(.01, b[3] - b[1]);
    if (quoi === "h") l = +(h * ratio).toFixed(2);
    else h = +(l / ratio).toFixed(2);
  }
  memorise();
  f.pts = [[b[0], b[1]], [+(b[0] + l).toFixed(2), +(b[1] + h).toFixed(2)]];
  retientTaille(f);
  enregistreDessins(); dessineDessins(); dessinePoignees();
  ecritDimensions(f);
}

/* ============================================================
   Pile des calques
   Habillage Klipso, zones, stands, textes et calques de dessin vivent dans
   un seul empilement : n'importe lequel peut se glisser entre deux autres.
   L'ordre de la liste est l'ordre de tracé — le premier est derrière.
   ============================================================ */
const clePile = () => "_pile:" + P().id;

function entrees(){
  const e = [];
  P().fond.forEach(f => e.push({ k: "fond:" + f.cle, t: "fond", nom: f.nom, ref: f }));
  e.push({ k: "data:zones",  t: "data", nom: "Zones organisateur", ref: "zones" });
  e.push({ k: "data:stands", t: "data", nom: "Stands",             ref: "stands" });
  e.push({ k: "data:labels", t: "data", nom: "Textes",             ref: "labels" });
  mesCalques().forEach(c => e.push({ k: "dessin:" + c.id, t: "dessin", nom: c.nom, ref: c }));
  return e;
}

/* ordre effectif : celui qui a été choisi, complété par les nouveautés */
function pile(){
  const enregistre = CONF[clePile()];
  const e = entrees();
  const defaut = e.map(x => x.k);
  if (!Array.isArray(enregistre)) return e;
  const rang = x => {
    const i = enregistre.indexOf(x.k);
    return i >= 0 ? i : 10000 + defaut.indexOf(x.k);   // les nouvelles couches à la fin
  };
  return e.slice().sort((a, b) => rang(a) - rang(b));
}

function groupe(k){
  const c = $("couches");
  if (k.indexOf("fond:") === 0)   return c.querySelector('.cal[data-cle="' + CSS.escape(k.slice(5)) + '"]');
  if (k.indexOf("dessin:") === 0) return c.querySelector('.dcal[data-dcal="' + CSS.escape(k.slice(7)) + '"]');
  return $(k.slice(5));
}

/* déplacer les nœuds plutôt que tout reconstruire : réordonner est instantané */
function ordonneDom(){
  const c = $("couches");
  pile().forEach(x => { const g = groupe(x.k); if (g) c.appendChild(g); });
}

function deplaceCouche(k, dir){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k), j = i + dir;
  if (i < 0 || j < 0 || j >= liste.length) return;
  liste[i] = liste[j]; liste[j] = k;
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom();
  construitPanneau();
}

/* ============================================================
   Panneau : une seule liste, tous types confondus
   ============================================================ */
function construitPanneau(){
  const hote = $("pile");
  hote.innerHTML = "";
  const reorg = document.createElement("button");
  reorg.className = "reorg";
  reorg.textContent = "⇅ Réorganiser les calques";
  reorg.onclick = ouvreOrdre;
  hote.appendChild(reorg);
  const liste = pile().slice().reverse();   // premier plan en tête

  liste.forEach((x, i) => {
    const d = document.createElement("div");
    d.className = "calq" + (x.t === "dessin" ? " perso" : "") +
                  (x.t === "dessin" && x.ref.id === calqueActif ? " actif" : "");
    if (x.t === "dessin") d.dataset.dcal = x.ref.id;

    const c = x.t === "dessin" ? x.ref : conf(x.t === "fond" ? x.k.slice(5) : x.k);
    const coche = c.visible === false ? "" : " checked";
    d.innerHTML = '<label><input type="checkbox"' + coche + '><span></span></label>' +
      '<span class="opts">' +
      (x.t === "data" ? "" : '<button class="fillbtn" title="Contour seul ou surface remplie"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.2"/></svg></button>') +
      '<input type="color" class="cc">' +
      (x.t === "dessin" ? '<button class="ren" title="Dessiner sur ce calque">&#9998;</button>' +
                          '<button class="sup" title="Supprimer le calque">&times;</button>' : "") +
      '</span>';

    const nom = d.querySelector("label span");
    nom.textContent = x.nom;

    /* Un calque qui sert aux itinéraires ne se distingue pas à l'écran : le
       rappeler ici évite de le chercher, ou de l'oublier. La coche d'à côté
       n'éteint que l'affichage — le calcul, lui, continue d'en tenir compte,
       et rien d'autre ne le dirait. */
    if (x.t === "dessin" && roleIti(x.ref)){
      const b = document.createElement("i");
      b.className = "rle";
      b.textContent = nomRoleIti(roleIti(x.ref));
      b.title = "Ce calque compte dans les itinéraires, même masqué.";
      nom.after(b);
    }

    /* visibilité */
    d.querySelector('input[type="checkbox"]').onchange = ev => {
      const on = ev.target.checked;
      if (x.t === "dessin"){ x.ref.visible = on; enregistreDessins(); dessineDessins(); }
      else { c.visible = on; enregistreConf();
             x.t === "fond" ? styleFond(x.k.slice(5)) : styleDataGroupe(x.k.slice(5), on); }
    };

    /* couleur */
    const cc = d.querySelector(".cc");
    cc.value = (x.t === "dessin" ? x.ref.couleur : c.couleur) || defautCouleur(x);
    cc.oninput = ev => {
      if (x.t === "dessin"){ x.ref.couleur = ev.target.value; enregistreDessins(); dessineDessins(); }
      else { c.couleur = ev.target.value; enregistreConf();
             x.t === "fond" ? styleFond(x.k.slice(5)) : appliqueCouleursData(); }
    };

    /* trait ou aplat */
    const fb = d.querySelector(".fillbtn");
    if (fb){
      fb.setAttribute("aria-pressed", !!c.rempli);
      fb.onclick = () => {
        c.rempli = !c.rempli;
        fb.setAttribute("aria-pressed", !!c.rempli);
        if (x.t === "dessin"){ enregistreDessins(); dessineDessins(); }
        else { enregistreConf(); styleFond(x.k.slice(5)); }
      };
    }

    /* propre aux calques de dessin */
    if (x.t === "dessin"){
      nom.title = "Cliquez pour dessiner dessus";
      // Le crayon ouvre les outils de dessin sur ce calque. Le renommage vit
      // dans la fenêtre de réorganisation, où l'on voit tous les calques.
      const cr = d.querySelector(".ren");
      cr.setAttribute("aria-pressed", x.ref.id === calqueActif);
      cr.onclick = ev => { ev.stopPropagation(); activeCalque(x.ref.id); };
      d.querySelector("label").onclick = ev => {
        if (ev.target.tagName !== "INPUT"){ ev.preventDefault(); activeCalque(x.ref.id); }
      };
      d.querySelector(".sup").onclick = () => {
        const n = x.ref.formes.length;
        confirme("Supprimer le calque ?",
          "« " + x.ref.nom + " » et " +
          (n ? "ses " + n + " forme" + (n > 1 ? "s" : "") : "son contenu") +
          " seront définitivement perdus.",
          "Supprimer", () => {
            memorise();
            DESSINS[P().id] = mesCalques().filter(y => y.id !== x.ref.id);
            if (calqueActif === x.ref.id) activeCalque(null);
            enregistreDessins(); dessineDessins(); construitPanneau();
          });
      };
    }

    hote.appendChild(d);

    /* sous-calques de l'habillage : couleur et visibilité, pas d'ordre */
    if (x.t === "fond"){
      const sous = sousCalques(x.k.slice(5));
      if (sous.length > 1) sous.forEach(sc =>
        rangSous(hote, sousCle(x.k.slice(5), sc.id), joli(sc.id),
                 () => rgbHex(sc.src) || jeton("--plan-line"), () => styleFond(x.k.slice(5))));
    }
    /* Les couleurs des secteurs se règlent sous la couche Stands : c'est elle
       qu'elles repeignent, et il n'y a pas de couche par secteur. Elles ne
       paraissent que si le salon sectorise et que le plan les montre — sans
       quoi ce serait une couleur qui ne peint rien. */
    if (x.k === "data:stands" && secteursMontres())
      SECTEURS.forEach((h, nom) => rangSecteur(hote, nom));
    /* les deux couleurs de texte se règlent sous la couche Textes, et avec
       elles le placement à la main de chaque libellé */
    if (x.k === "data:labels"){
      rangSous(hote, "labStand", "Textes des stands", () => jeton("--ink"), () => styleData("labStand"));
      rangSous(hote, "labZone", "Textes des zones", () => jeton("--zone"), () => styleData("labZone"));
      rangPlacement(hote);
    }
  });

  const plus = document.createElement("button");
  plus.className = "ajout";
  plus.textContent = "+ Nouveau calque de dessin";
  plus.onclick = creeCalque;
  hote.appendChild(plus);

  sectionSelection(hote);

  /* Réglages généraux — ils ne portent sur aucun calque, d'où le trait qui les
     sépare de la pile. Comme le reste de CONF, ils partent aux visiteurs à la
     publication : c'est bien l'exploitant qui décide de ce qu'ils voient. */
  /* Les réglages généraux vivent dans leur propre fenêtre, ouverte par
     l'engrenage : ici ils allongeaient une pile déjà longue et se lisaient
     comme une couche de plus. */
}

/* ============================================================
   Repères
   Ce que le plan pose sur un stand sans que les données le disent : la
   couleur qu'il prend au moment où on le touche, et le liseré de ce qu'un
   visiteur a retenu. Ce ne sont pas des calques : rien ne s'y dessine, rien
   ne s'y masque, et le rang n'y veut rien dire. Rangées dans la pile, les
   lignes se lisaient pourtant comme des couches de plus, entre celles qu'on
   empile vraiment. Un trait les en sépare, un titre les nomme.

   La sélection n'a qu'une couleur à régler, l'aplat : le liseré qui le borde
   s'en déduit, et « appliqueCouleursData » s'en charge. Le parcours n'a que
   son liseré, et il se règle à part — les deux marques se croisent sur le
   même plan, souvent sur le même stand, et l'accent d'origine les confond.
   ============================================================ */
function sectionSelection(hote){
  const bloc = document.createElement("div");
  bloc.className = "apart";
  const titre = document.createElement("span");
  titre.className = "eyebrow";
  titre.textContent = "Repères";
  bloc.appendChild(titre);

  const c = conf("selection");
  bloc.appendChild(ligneCouleur("Élément sélectionné", c.couleur || jeton("--accent-soft"),
    (v) => { c.couleur = v; enregistreConf(); appliqueCouleursData(); }));

  /* Le parcours retiré, sa couleur ne règle plus rien : la ligne s'efface avec
     lui, et revient si l'exploitant le rouvre. */
  if (conf("_parcours").visible !== false){
    const p = conf("parcours");
    bloc.appendChild(ligneCouleur("Parcours de visite", p.couleur || jeton("--accent"),
      (v) => { p.couleur = v; enregistreConf(); appliqueCouleursData(); }));
  }
  hote.appendChild(bloc);
}

/* Une ligne qui n'a qu'une couleur à régler : ni visibilité, ni remplissage,
   ni rang. C'est le cas de tout ce qui n'est pas un calque — la sélection, un
   secteur — et qui n'a donc rien à masquer ni à empiler. */
function ligneCouleur(libelle, valeur, applique){
  const d = document.createElement("div");
  d.className = "calq";
  d.innerHTML = '<label><span></span></label>' +
                '<span class="opts"><input type="color" class="cc"></span>';
  d.querySelector("label span").textContent = libelle;
  const cc = d.querySelector(".cc");
  cc.value = valeur;
  cc.oninput = (e) => applique(e.target.value);
  return d;
}

/**
 * La couleur d'un secteur.
 *
 * Le sélecteur part de ce que le plan montre — la couleur choisie, ou la teinte
 * automatique résolue dans le thème courant — de sorte qu'on retouche ce qu'on
 * voit plutôt que de partir du noir. Elle vaut ensuite pour les deux thèmes,
 * comme celle des autres couches.
 */
function rangSecteur(hote, nom){
  const c = conf("secteur:" + nom);
  const d = ligneCouleur(nom, couleurSecteur(nom), (v) => {
    c.couleur = v;
    enregistreConf();
    appliqueSecteurs();
  });
  d.classList.add("sous");
  hote.appendChild(d);
}

/* ligne secondaire : visibilité et couleur seulement */
function rangSous(hote, cle, libelle, defaut, applique){
  const c = conf(cle);
  const d = document.createElement("div");
  d.className = "calq sous";
  d.innerHTML = '<label><input type="checkbox"' + (c.visible === false ? "" : " checked") +
    '><span></span></label><span class="opts">' +
    '<button class="fillbtn" title="Contour seul ou surface remplie"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.2"/></svg></button>' +
    '<input type="color" class="cc"></span>';
  d.querySelector("label span").textContent = libelle;
  d.querySelector('input[type="checkbox"]').onchange = e => {
    c.visible = e.target.checked; enregistreConf(); applique();
  };
  const cc = d.querySelector(".cc");
  cc.value = c.couleur || defaut();
  cc.oninput = e => { c.couleur = e.target.value; enregistreConf(); applique(); };
  const fb = d.querySelector(".fillbtn");
  fb.setAttribute("aria-pressed", !!c.rempli);
  fb.onclick = () => { c.rempli = !c.rempli; fb.setAttribute("aria-pressed", !!c.rempli);
                       enregistreConf(); applique(); };
  hote.appendChild(d);
}

/**
 * La case qui ouvre le placement des libellés à la main.
 *
 * Elle vit sous la couche des textes parce que c'est elle qu'on retouche, à
 * côté de sa couleur et de sa visibilité. Ce n'est pas un réglage du salon
 * mais un mode de travail : elle ne se retient pas, et se relève décochée à
 * chaque ouverture du panneau.
 */
function rangPlacement(hote){
  const d = document.createElement("div");
  d.className = "calq sous";
  d.innerHTML = '<label><input type="checkbox"><span></span></label>';
  d.querySelector("label span").textContent = "Placer les libellés à la main";
  const c = d.querySelector("input");
  c.checked = PLACE_LIBELLES;
  c.onchange = e => modePlacementLibelles(e.target.checked);
  hote.appendChild(d);
}

function defautCouleur(x){
  if (x.t === "dessin") return "#2F49D1";
  if (x.t === "fond") return jeton("--plan-line");
  return jeton(x.k === "data:zones" ? "--zone" : x.k === "data:stands" ? "--stand" : "--ink");
}

/* ============================================================
   Pousser la configuration
   Les couleurs, la visibilité, l'ordre des calques et les dessins vivaient
   dans le navigateur de celui qui les réglait. Un visiteur ne voyait donc
   rien, et l'exploitant retrouvait un plan nu depuis un autre poste ou depuis
   son téléphone.

   Un bouton les envoie en base, d'où le service les rend à tout le monde.
   Explicite plutôt qu'automatique : régler une couleur au sélecteur produit
   une rafale d'événements, et l'exploitant doit pouvoir essayer sans publier.
   ============================================================ */

/* Ce qui reste à publier, dit par le bouton lui-même.
   Un dessin s'enregistre sur le poste au fil du geste, ce qui donne le
   sentiment qu'il est à l'abri : rien ne distinguait alors un travail publié
   d'un travail qui n'avait jamais quitté ce navigateur. Le bouton porte donc
   la marque tant qu'un pavillon a de l'avance sur la base. */
const LIBELLE_POUSSE = "Pousser la configuration";

/* Pendant la publication le bouton raconte où elle en est : la marque ne doit
   pas lui reprendre la parole à chaque pavillon qui vient de partir. */
let publication = false;

function majAttente(){
  const b = $("pousseConf");
  if (!b || publication) return;
  const reste = (DATA?.plans || []).some(p => enAttente(p.id));
  b.textContent = reste ? LIBELLE_POUSSE + " •" : LIBELLE_POUSSE;
  b.title = reste
    ? "Des dessins ne sont enregistrés que sur ce poste : publiez-les."
    : "";
}

/** Session et projet, tels que la console les a laissés sur le poste. */
function accesBase(){
  try {
    const cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    const ses = JSON.parse(localStorage.getItem("console-session") || "null");
    if (cfg?.url && cfg?.anonKey && ses?.access_token) return { cfg, ses };
  } catch (e) {}
  return null;
}

async function base(acces, chemin, options = {}){
  const r = await fetch(acces.cfg.url + "/rest/v1/" + chemin, {
    ...options,
    headers: {
      "apikey": acces.cfg.anonKey,
      "Authorization": "Bearer " + acces.ses.access_token,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  const txt = await r.text();
  if (!r.ok) throw new Error("HTTP " + r.status + " · " + txt.slice(0, 160));
  return txt ? JSON.parse(txt) : null;
}

/** Les réglages d'apparence de ce salon : sans les ordres de pile, qui sont
 *  par pavillon, et sans ceux d'un salon voisin, qui n'ont rien à faire dans
 *  son enregistrement — c'est par là qu'ils s'y installaient. */
function reglagesSeuls(){
  return reglagesDuSalon(CONF);
}

async function pousseConfiguration(bouton){
  const acces = accesBase();
  if (!acces){
    annonce("Session absente : reconnectez-vous pour publier.", true);
    return;
  }
  const dit = (t) => { if (bouton) bouton.textContent = t; };
  publication = true;
  dit("Publication…");

  try {
    /* Le plan connaît les pavillons par leur identifiant Klipso ; la base par
       le sien. Une seule requête suffit à faire le lien. */
    const evt = await base(acces,
      "evenement?select=id&slug=eq." + encodeURIComponent(DATA.slug));
    if (!evt.length) throw new Error("Événement introuvable.");
    const plans = await base(acces,
      "plan?select=id,id_klipso&evenement_id=eq." + evt[0].id);
    const parKlipso = Object.fromEntries(plans.map(p => [p.id_klipso, p.id]));

    const reglages = reglagesSeuls();
    let calques = 0;

    for (const p of DATA.plans){
      const planId = parKlipso[p.id];
      if (!planId) continue;

      await base(acces, "apparence?on_conflict=plan_id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([{
          plan_id: planId,
          pile: CONF["_pile:" + p.id] || [],
          reglages: reglages,
          modifie_le: new Date().toISOString(),
        }]),
      });

      const liste = DESSINS[p.id] || [];
      if (liste.length){
        await base(acces, "calque_dessin?on_conflict=plan_id,cle", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(liste.map((c, i) => ({
            plan_id: planId, cle: c.id, nom: c.nom || "Calque",
            couleur: c.couleur || "#2F49D1", rempli: !!c.rempli,
            visible: c.visible !== false, rang: i,
            formes: c.formes || [], modifie_le: new Date().toISOString(),
          }))),
        });
        calques += liste.length;
      }

      /* Ce qui a disparu de la page disparaît de la base. On retire après
         avoir écrit, jamais avant : un échec en cours de route laisse alors
         l'ancienne version en place plutôt qu'un plan vide. */
      const gardes = liste.map(c => '"' + String(c.id).replace(/"/g, "") + '"').join(",");
      await base(acces,
        "calque_dessin?plan_id=eq." + planId +
        (gardes ? "&cle=not.in.(" + encodeURIComponent(gardes) + ")" : ""),
        { method: "DELETE", headers: { "Prefer": "return=minimal" } });

      /* Ce pavillon est en base : le poste ne le devance plus, et le
         chargement suivant peut reprendre ce que la base en dit. On le note
         pavillon par pavillon — un échec à mi-parcours laisse marqués ceux qui
         n'y sont pas encore passés. */
      marqueAttente(p.id, false);
    }

    dit("Configuration publiée");
    annonce("Configuration publiée : " + DATA.plans.length +
      (DATA.plans.length > 1 ? " pavillons" : " pavillon") +
      (calques ? ", " + calques + " calque" + (calques > 1 ? "s" : "") + " de dessin" : "") + ".");
  } catch (e) {
    dit("Publication impossible");
    annonce("Publication impossible : " + e.message, true);
  }
  setTimeout(() => { publication = false; majAttente(); }, 2600);
}

/* ============================================================
   Fenêtres modales : confirmation et réorganisation des calques
   ============================================================ */
/**
 * Une fenêtre par-dessus le plan.
 *
 * `genre` la range autrement : « cote » la pose à gauche et retire le voile,
 * pour une fenêtre dont on regarde l'effet sur le plan pendant qu'on s'en sert.
 * Sans lui, elle est au milieu, sur fond grisé — ce qu'il faut quand elle
 * demande une réponse avant de rendre la main.
 */
function ouvreModale(titre, remplitCorps, boutons, genre){
  if (genre) $("modale").dataset.genre = genre;
  else delete $("modale").dataset.genre;
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplitCorps($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach(b => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action) b.action(); if (b.ferme !== false) fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
function fermeModale(){ $("modale").classList.remove("open"); }
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", e => { if (e.target === $("modale")) fermeModale(); });
addEventListener("keydown", e => {
  if (e.key === "Escape" && $("modale").classList.contains("open")) fermeModale();
});

function confirme(titre, message, libelleOui, action){
  ouvreModale(titre, corps => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [
    { libelle: "Annuler" },
    { libelle: libelleOui, genre: "danger", action: action },
  ]);
}

/* ------------------------------------------------------------
   Réorganisation : le premier rang de la liste est le calque le
   plus en avant, comme dans n'importe quel gestionnaire de calques.
   ------------------------------------------------------------ */
const GENRE = { fond: "plan", data: "données", dessin: "dessin" };
let tireK = null;

function deplaceVers(k, cible, apres){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k);
  if (i < 0) return;
  liste.splice(i, 1);
  let j = liste.indexOf(cible);
  if (j < 0) j = liste.length - 1;
  liste.splice(apres ? j + 1 : j, 0, k);
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom(); construitPanneau(); remplitOrdre();
}
function versExtremite(k, devant){
  const liste = pile().map(x => x.k).filter(x => x !== k);
  devant ? liste.push(k) : liste.unshift(k);   // fin de tableau = premier plan
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom(); construitPanneau(); remplitOrdre();
}

function remplitOrdre(hote){
  const ul = hote || $("mCorps").querySelector(".ordre");
  if (!ul) return;
  ul.innerHTML = "";
  // affichage du premier plan vers l'arrière-plan
  pile().slice().reverse().forEach(x => {
    const li = document.createElement("li");
    li.draggable = true;
    li.dataset.k = x.k;
    li.innerHTML = '<span class="poignee" aria-hidden="true">&#8942;&#8942;</span>' +
      '<span class="nom"></span>' +
      '<span class="bouts">' +
      // seul un calque de dessin nous appartient : les autres portent le nom
      // que Klipso leur donne, et le renommer ici mentirait sur leur origine
      (x.t === "dessin"
        ? '<button class="crayon" data-ren="1" title="Renommer">&#9998;</button>' : "") +
      '<button data-h="1" title="Mettre au premier plan">&#8607;</button>' +
      '<button data-h="0" title="Mettre à l’arrière-plan">&#8609;</button></span>';
    const nom = li.querySelector(".nom");
    nom.textContent = x.nom;
    const g = document.createElement("span");
    g.className = "genre"; g.textContent = GENRE[x.t];
    nom.appendChild(g);

    li.querySelectorAll(".bouts button[data-h]").forEach(b =>
      b.onclick = ev => { ev.stopPropagation(); versExtremite(x.k, b.dataset.h === "1"); });
    const cr = li.querySelector("[data-ren]");
    if (cr){
      cr.onclick = ev => {
        ev.stopPropagation();
        // la fenêtre de renommage remplace celle-ci, puis on revient
        renommeCalque(x.ref, () => ouvreOrdre());
      };
    }

    li.ondragstart = ev => { tireK = x.k; li.classList.add("drag");
                             ev.dataTransfer.effectAllowed = "move";
                             try { ev.dataTransfer.setData("text/plain", x.k); } catch (e) {} };
    li.ondragend = () => { tireK = null; li.classList.remove("drag");
                           ul.querySelectorAll("li").forEach(n => n.classList.remove("avant", "apres")); };
    li.ondragover = ev => {
      if (!tireK || tireK === x.k) return;
      ev.preventDefault();
      const r = li.getBoundingClientRect();
      const bas = ev.clientY > r.top + r.height / 2;
      li.classList.toggle("apres", bas);
      li.classList.toggle("avant", !bas);
    };
    li.ondragleave = () => li.classList.remove("avant", "apres");
    li.ondrop = ev => {
      if (!tireK || tireK === x.k) return;
      ev.preventDefault();
      const r = li.getBoundingClientRect();
      const bas = ev.clientY > r.top + r.height / 2;
      // la liste est inversée : « en dessous » à l'écran = plus en arrière
      deplaceVers(tireK, x.k, !bas);
      tireK = null;
    };
    ul.appendChild(li);
  });
}

function ouvreOrdre(){
  ouvreModale("Ordre des calques", corps => {
    const p = document.createElement("p");
    p.textContent = "Glissez pour réordonner. Le premier de la liste est au premier plan.";
    const ul = document.createElement("ul");
    ul.className = "ordre";
    corps.appendChild(p); corps.appendChild(ul);
    remplitOrdre(ul);
  }, [{ libelle: "Terminé" }]);
}

/* ============================================================
   11 bis. Parcours de visite
   ============================================================ */
/**
 * Un visiteur arrive avec trois heures et deux cents exposants devant lui. Il
 * repère de quoi remplir sa journée depuis chez lui, puis vient relire sa
 * liste sur place, entre deux allées.
 *
 * Cette liste vit dans son navigateur, et nulle part ailleurs : le plan n'a
 * pas de comptes, et demander une inscription pour retenir trois stands ferait
 * fuir tout le monde. Elle est rangée par événement — un même téléphone peut
 * ouvrir plusieurs salons — et ne retient que des identifiants : les libellés
 * sont relus dans les données à chaque affichage, si bien qu'un exposant
 * renommé entre deux visites s'affiche sous son nouveau nom.
 */
let PARCOURS = { stands: [], confs: [] };

/* Le nom de l'événement sert de repli pour la page à données figées, qui n'a
   pas de « slug » : sans lui, deux démonstrations partageraient la même liste. */
const cleParcours = () =>
  "plan-parcours:" + (SLUG || (DATA && DATA.evenement) || "");

const casierParcours = genre => genre === "conf" ? PARCOURS.confs : PARCOURS.stands;
const dansParcours = (genre, id) => casierParcours(genre).indexOf(String(id)) >= 0;

function chargeParcours(){
  try {
    const b = JSON.parse(localStorage.getItem(cleParcours()) || "null") || {};
    PARCOURS = {
      stands: Array.isArray(b.stands) ? b.stands.map(String) : [],
      confs:  Array.isArray(b.confs)  ? b.confs.map(String)  : [],
    };
  } catch (e) {
    PARCOURS = { stands: [], confs: [] };   // stockage refusé ou contenu illisible
  }
  /* Un stand démonté ou une conférence annulée entre deux visites laisserait
     un rang mort, qu'on ne saurait ni ouvrir ni comprendre. On ne garde que ce
     que les données connaissent encore. */
  PARCOURS.stands = PARCOURS.stands.filter(id => parId.has(id));
  PARCOURS.confs = PARCOURS.confs.filter(id => CONFS.has(id));
  rafraichitParcours();
}

function enregistreParcours(){
  // navigation privée, stockage plein : la visite continue sans le parcours
  try { localStorage.setItem(cleParcours(), JSON.stringify(PARCOURS)); } catch (e) {}
}

function basculeParcours(genre, id){
  const l = casierParcours(genre), k = String(id), i = l.indexOf(k);
  // l'ordre d'ajout est celui du parcours : on ajoute donc à la fin
  if (i < 0) l.push(k); else l.splice(i, 1);
  enregistreParcours();
  rafraichitParcours();
  /* Retirer un rang est une édition autant qu'en ajouter : c'est le même
     visiteur en train de composer sa journée. */
  mesure("parcours");
}

/* ------------------------------------------------------------
   La marque, partout la même
   ------------------------------------------------------------ */
const SIGNET = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>';

/** Le signet nu, tel qu'il se pose à côté d'une conférence du programme. */
function signetParcours(genre, id){
  return '<button type="button" class="marque" data-mg="' + genre +
         '" data-mi="' + esc(id) + '"></button>';
}

/** Le même geste, en toutes lettres : sur une fiche, la place ne manque pas. */
function boutonParcours(genre, id){
  return '<button type="button" class="btn parc" data-mg="' + genre +
         '" data-mi="' + esc(id) + '">' + SIGNET + '<span class="l"></span></button>';
}

function rafraichitMarque(el){
  const dedans = dansParcours(el.dataset.mg, el.dataset.mi);
  el.setAttribute("aria-pressed", dedans);
  const dit = dedans ? "Retirer de mon parcours" : "Ajouter à mon parcours";
  el.title = dit;
  el.setAttribute("aria-label", dit);
  const l = el.querySelector(".l");
  if (l) l.textContent = dedans ? "Dans mon parcours" : "Ajouter à mon parcours";
  if (!el.querySelector("svg")) el.insertAdjacentHTML("afterbegin", SIGNET);
}

/** Rend vivantes les marques d'un fragment qu'on vient d'écrire. */
function brancheParcours(hote){
  hote.querySelectorAll("[data-mg]").forEach(el => {
    rafraichitMarque(el);
    el.onclick = ev => {
      ev.stopPropagation();
      basculeParcours(el.dataset.mg, el.dataset.mi);
    };
  });
}

/* ------------------------------------------------------------
   Ce que le parcours change à l'écran
   ------------------------------------------------------------ */
/**
 * Les liserés du plan.
 *
 * Deux marques se posent sur un stand sans que les données le disent : celle
 * de la sélection, et celle du parcours. Ni l'une ni l'autre ne se peint sur
 * le stand lui-même — elles se recopient dans un calque à part, posé au-dessus
 * des couches.
 *
 * Portées par le stand, elles disparaissaient le long des cloisons mitoyennes :
 * deux stands voisins partagent le même segment, et celui que le plan trace en
 * second y repassait son propre contour par-dessus le liseré du premier. Un
 * stand pris au milieu d'un îlot n'était alors cerné que sur ses côtés libres.
 * Une zone est logée à la même enseigne, et plus mal encore : les stands se
 * tracent après elle et recouvrent tout ce qui passe sous eux.
 *
 * Recopier le tracé plus haut règle la question sans toucher à l'ordre des
 * couches, que l'exploitant règle. L'aplat de la sélection, lui, reste sur le
 * stand : c'est une couleur de surface, elle n'a rien à gagner à monter.
 */
function calqueMarques(){
  let g = $("marques");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "marques";
    // au-dessus des couches, sous le trajet et les poignées d'édition
    svg.insertBefore(g, svg.querySelector("#itin, #apercu, #poignees"));
  }
  return g;
}

/**
 * Le calque se relit dans le plan plutôt qu'il ne se tient à jour : les deux
 * marques changent par des chemins sans rapport — un signet, un clic, un
 * changement de pavillon — et une seule lecture les remet d'accord.
 */
function dessineMarques(){
  /* Les liserés vivent hors des couches : rien ne les masquerait avec elles.
     Une couche de données retirée par l'exploitant doit pourtant emporter les
     marques de ce qu'elle portait, sans quoi le plan garderait des contours
