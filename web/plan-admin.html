 *  cadre et son centre, les sommets d'un tracé — sa boîte au-delà d'une
 *  douzaine, où balayer chaque sommet ne changerait plus rien qu'au temps de
 *  calcul. Le centre parce qu'une image se pose au milieu d'un stand, et que
 *  c'est alors centre contre centre qu'il faut l'accrocher. */
function coinsGeste(pts, cadre){
  if (!cadre && pts.length <= 12) return pointsAimants(pts);
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min.apply(null, xs), y0 = Math.min.apply(null, ys);
  const x1 = Math.max.apply(null, xs), y1 = Math.max.apply(null, ys);
  return pointsAimants([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
}

/**
 * Les points auxquels le geste pourrait s'accrocher, montrés autour de lui.
 *
 * Autour de lui, et non tous : un pavillon en compte plusieurs milliers, et
 * les semer sur le plan reviendrait à le recouvrir d'un semis illisible qui
 * n'apprendrait rien. À portée du geste, en revanche, ils disent exactement
 * ce que la main peut viser — et pourquoi elle vient d'être corrigée.
 *
 * Ils s'affichent aussi à vide, tant qu'un outil de tracé est choisi : c'est
 * en approchant du stand voisin qu'on veut savoir si son coin est saisissable,
 * pas une fois le rectangle commencé.
 */
const PORTEE_VUE = 120;    // en pixels d'écran autour du geste
let AIMANTS_VUS = "";      // ce qui est déjà à l'écran, pour ne pas le refaire
function montreAimants(coins, opts){
  const o = opts || {};
  let g = $("aimantsVus");
  const efface = () => { if (g) g.remove(); AIMANTS_VUS = ""; };
  if (!coins || !coins.length || !aimantsActifs() || o.alt){ efface(); return; }
  const r = cadrePlan();
  const u = view.w / (r.width || 1);        // un pixel d'écran, en mètres
  /* Une portée comptée en pixels et non en mètres : ce qu'on montre, c'est le
     voisinage du curseur tel qu'on le voit, et il doit rester le même qu'on
     travaille sur un hall entier ou sur un stand. */
  const portee = u * PORTEE_VUE;
  const jeux = [aimantsDuPlan(), aimantsDessines(o.sauf || null)];
  const vus = new Map();
  for (const c of coins)
    for (const jeu of jeux)
      for (const q of jeu.pts){
        if (Math.abs(q[0] - c[0]) > portee || Math.abs(q[1] - c[1]) > portee) continue;
        const cle = q[0] + "," + q[1];
        if (!vus.has(cle)) vus.set(cle, q);
      }

  /* Les crans de la grille, eux, ne se montrent qu'à quelques pas : au pas de
     vingt-cinq centimètres, un stand entier en porte plus d'un millier, et
     couvrir le plan de points reviendrait à n'en montrer aucun. */
  const pas = pasAimant();
  const pg = Math.min(portee, pas * 8);
  const grille = new Map();
  for (const c of coins)
    for (const e of aimantsDuPlan().emprises){
      if (!sousLeGeste(c, e, pg)) continue;
      const de = (v, a, b) => [Math.max(a, a + Math.ceil((v - pg - a) / pas) * pas),
                               Math.min(b, v + pg)];
      const [x0, x1] = de(c[0], e[0], e[2]), [y0, y1] = de(c[1], e[1], e[3]);
      for (let x = x0; x <= x1 + 1e-6; x += pas)
        for (let y = y0; y <= y1 + 1e-6; y += pas){
          const q = [+x.toFixed(2), +y.toFixed(2)];
          const cle = q[0] + "," + q[1];
          if (!vus.has(cle) && !grille.has(cle)) grille.set(cle, q);
        }
    }

  if (!vus.size && !grille.size){ efface(); return; }
  /* Le curseur bouge à chaque image, le voisinage presque jamais : sans cette
     comparaison, on reconstruirait cent cercles soixante fois par seconde
     pour redessiner exactement les mêmes. */
  const rayon = +(u * 3).toFixed(3);          // constant à l'écran, lui aussi
  // le zoom entre dans la comparaison : les mêmes points s'y redessinent
  const cle = rayon + "|" + [...vus.keys()].join(";") + "|" + [...grille.keys()].join(";");
  if (g && cle === AIMANTS_VUS) return;
  AIMANTS_VUS = cle;
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "aimantsVus";
    svg.appendChild(g);
  }
  /* Le plafond n'est qu'un garde-fou. Les crans passent derrière les sommets,
     et plus discrets qu'eux : un coin de stand reste l'accrochage franc, un
     cran n'est qu'une graduation. */
  const cercle = (q, cl) => '<circle' + cl + ' cx="' + q[0] + '" cy="' + q[1] +
                            '" r="' + (cl ? +(rayon * .62).toFixed(3) : rayon) + '"/>';
  g.innerHTML = [...grille.values()].slice(0, 600).map(q => cercle(q, ' class="cran"')).join("") +
                [...vus.values()].slice(0, 400).map(q => cercle(q, "")).join("");
}

/** Le meilleur sommet à portée d'un des points du geste. */
function meilleurSommet(coins, jeux, tol){
  let m = null;
  for (const c of coins)
    for (const jeu of jeux)
      for (const q of jeu.pts){
        // le rejet par la boîte évite une racine carrée par emplacement
        if (Math.abs(q[0] - c[0]) > tol || Math.abs(q[1] - c[1]) > tol) continue;
        const d = Math.hypot(q[0] - c[0], q[1] - c[1]);
        if (!m || d < m.d) m = { d: d, dx: q[0] - c[0], dy: q[1] - c[1], q: q };
      }
  return m;
}

/** La petite croix qui dit quel point a pris. */
const croixAimant = (q, tol) => {
  const r = +(tol * .7).toFixed(2);
  return "M" + (q[0] - r) + " " + q[1] + "h" + (2 * r) +
         "M" + q[0] + " " + (q[1] - r) + "v" + (2 * r);
};

/**
 * Ce que le geste doit corriger pour tomber juste, et le repère qui l'explique.
 *
 * Trois degrés, dans cet ordre. Un sommet d'abord — un coin d'emplacement, un
 * centre : il prend les deux coordonnées d'un coup, et c'est l'accrochage le
 * plus franc. La grille propre de l'emplacement ensuite, pour tout ce qui se
 * pose *dans* un stand plutôt qu'à ses angles. Les axes enfin, chacun pour
 * son compte : c'est ce qui range une rangée de stands dont aucun coin ne se
 * touche.
 *
 * `coins` porte les points du geste qui ont le droit de s'accrocher : un
 * tracé n'en a qu'un, celui qu'on déplace ; une forme entière offre les
 * quatre coins de sa boîte et son centre, et retient la plus petite
 * correction. `axes` vaut « x » quand la hauteur est commandée d'ailleurs —
 * les proportions d'une image — et que l'accrochage ne doit toucher qu'à la
 * largeur.
 */
function correction(coins, opts){
  const o = opts || {};
  montreAimants(coins, o);
  if (!aimantsActifs() || o.alt){ apercuGuide(null); return [0, 0]; }
  const tol = toleranceTrace();
  const jeux = [aimantsDuPlan(), aimantsDessines(o.sauf || null)];
  const seulX = o.axes === "x";

  /* Un sommet passe avant tout : c'est l'accrochage franc, celui qui pose un
     coin sur un coin. La grille et les alignements se disputent le reste, axe
     par axe. */
  const pris = meilleurSommet(coins, jeux, tol);
  if (pris){
    apercuGuide(croixAimant(pris.q, tol));
    // une image ne corrige que sa largeur : sa hauteur suit ses proportions
    return [pris.dx, seulX ? 0 : pris.dy];
  }

  const axe = (i) => {
    let d = 0, ec = tol, v = null;
    for (const c of coins)
      for (const jeu of jeux)
        for (const x of (i ? jeu.ys : jeu.xs)){
          const e = Math.abs(x - c[i]);
          if (e < ec){ ec = e; d = x - c[i]; v = x; }
        }
    // le cran de la grille de l'emplacement où l'on se trouve, s'il fait mieux
    const g = cranGrille(coins, i, tol);
    if (g && g.d < ec){ d = g.v - g.dep; v = g.v; }
    return [d, v];
  };
  const ax = axe(0), ay = seulX ? [0, null] : axe(1);
  /* Le trait qui traverse la vue dit sur quoi le bord vient de s'aligner :
     sans lui, l'accrochage passe pour une main qui a tremblé. */
  const g = (ax[1] == null ? "" : "M" + ax[1] + " " + view.y + "v" + view.h) +
            (ay[1] == null ? "" : "M" + view.x + " " + ay[1] + "h" + view.w);
  apercuGuide(g || null);
  return [ax[0], ay[0]];
}

/** Un point du geste, accroché. */
function aimante(p, opts){
  const [dx, dy] = correction([p], opts);
  return dx || dy ? [+(p[0] + dx).toFixed(2), +(p[1] + dy).toFixed(2)] : p;
}

/* ------------------------------------------------------------
   Reposer la même taille
   ------------------------------------------------------------ */

/* La dernière taille tracée, par outil. Un salon aligne des emplacements
   identiques, et retracer vingt fois le même rectangle à la main est le plus
   sûr moyen d'en obtenir vingt qui diffèrent tous. */
const DERNIERE = {};

function retientTaille(f){
  if (!estCadre(f)) return;
  const b = boite(f);
  DERNIERE[f.t] = [+(b[2] - b[0]).toFixed(2), +(b[3] - b[1]).toFixed(2)];
}

/**
 * Le cadre qu'un clic sans glisser demande : la dernière taille tracée,
 * posée depuis le point cliqué.
 *
 * Depuis le coin, et non autour du point : c'est ce coin que l'aimant vient
 * de poser sur celui d'un emplacement, et une taille reprise à partir de là
 * range le stand suivant contre le précédent sans qu'on ait rien à viser.
 */
function reprendTaille(f){
  const t = DERNIERE[f.t];
  if (!t) return false;
  const a = f.pts[0];
  let l = t[0], h = t[1];
  /* Une autre image n'a pas les proportions de la précédente. On garde la
     largeur — c'est elle qu'on voulait identique d'un logo à l'autre — et la
     hauteur suit. */
  if (f.t === "image" && imageEnAttente) h = +(l / imageEnAttente.ratio).toFixed(2);
  f.pts = [a.slice(), [+(a[0] + l).toFixed(2), +(a[1] + h).toFixed(2)]];
  return true;
}

/**
 * La copie de la forme choisie, posée contre elle.
 *
 * Contre elle, et non décalée en biais comme le ferait un logiciel de dessin :
 * ce qu'on répète ici, ce sont des emplacements mitoyens, et un Ctrl+D répété
 * doit dérouler la rangée. Ce qui n'a pas de largeur — un repère, un texte —
 * se décale d'un mètre, faute de mieux.
 */
function dupliqueForme(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.c.id !== calqueActif) return;
  const f = cible.f;
  const b = boite(f);
  const dx = Math.max(1, +(b[2] - b[0]).toFixed(2));
  /* Copie de surface : `pts` est refait, `liens` retiré, et tout le reste —
     le libellé, la société, la source d'une image — se partage sans se
     recopier. Une image dupliquée ne pèse donc rien de plus. */
  const copie = Object.assign({}, f, {
    pts: f.pts.map(q => [+(q[0] + dx).toFixed(2), q[1]]) });
  /* Les passages se déclarent des deux côtés : recopiés d'un seul, ils
     désigneraient un repère qui ne les connaît pas. La copie naît donc sans
     liaison — c'est un lieu de plus, et non le même. */
  delete copie.liens;
  const id = ajouteForme(copie);
  if (!id) return;
  choisitForme(id);
  retientTaille(copie);
  signale(id);          // posée à côté, elle se confondrait avec sa voisine
}

/** Le clavier ajuste au quart de mètre ce que la main a posé à peu près, et
 *  au mètre touche majuscule tenue : le pas des libellés, pour n'avoir qu'une
 *  convention à retenir. */
function pousseForme(dx, dy){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.c.id !== calqueActif) return;
  memorise();
  cible.f.pts = cible.f.pts.map(q => [+(q[0] + dx).toFixed(2), +(q[1] + dy).toFixed(2)]);
  enregistreDessins(); dessineDessins(); dessinePoignees();
  ecritDimensions(cible.f);
}

/* ------------------------------------------------------------
   La taille au clavier
   ------------------------------------------------------------ */

/** Ce que les deux champs disent de la forme choisie. On n'écrit que ce qui
 *  change : réécrire un champ qu'on est en train de remplir y replacerait le
 *  curseur à la fin, au milieu de la frappe. */
function ecritDimensions(f){
  const z = $("elemDim");
  if (!z) return;
  z.hidden = !f || !estCadre(f);
  if (z.hidden) return;
  const b = boite(f);
  const met = (id, v) => { const c = $(id); if (+c.value !== v) c.value = v; };
  met("elemLargeur", +(b[2] - b[0]).toFixed(2));
  met("elemHauteur", +(b[3] - b[1]).toFixed(2));
}

/**
 * La taille exacte de la forme choisie.
 *
 * Le coin supérieur gauche ne bouge pas : on corrige une dimension, on ne
 * déplace pas ce qui était déjà bien placé. Une image garde ses proportions,
 * et c'est la largeur qui commande — d'un logo à l'autre, c'est elle qu'on
 * veut identique.
 */
function appliqueDimension(quoi){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || !estCadre(cible.f)) return;
  const f = cible.f, b = boite(f);
  let l = +$("elemLargeur").value, h = +$("elemHauteur").value;
  // un champ vidé, ou en cours de frappe, n'est pas une taille
  if (!(l > 0) || !(h > 0)) return;
  if (f.t === "image"){
    const ratio = (b[2] - b[0]) / Math.max(.01, b[3] - b[1]);
    if (quoi === "h") l = +(h * ratio).toFixed(2);
    else h = +(l / ratio).toFixed(2);
  }
  memorise();
  f.pts = [[b[0], b[1]], [+(b[0] + l).toFixed(2), +(b[1] + h).toFixed(2)]];
  retientTaille(f);
  enregistreDessins(); dessineDessins(); dessinePoignees();
  ecritDimensions(f);
}

/* ============================================================
   Pile des calques
   Habillage Klipso, zones, stands, textes et calques de dessin vivent dans
   un seul empilement : n'importe lequel peut se glisser entre deux autres.
   L'ordre de la liste est l'ordre de tracé — le premier est derrière.
   ============================================================ */
const clePile = () => "_pile:" + P().id;

function entrees(){
  const e = [];
  P().fond.forEach(f => e.push({ k: "fond:" + f.cle, t: "fond", nom: f.nom, ref: f }));
  e.push({ k: "data:zones",  t: "data", nom: "Zones organisateur", ref: "zones" });
  e.push({ k: "data:stands", t: "data", nom: "Stands",             ref: "stands" });
  e.push({ k: "data:labels", t: "data", nom: "Textes",             ref: "labels" });
  mesCalques().forEach(c => e.push({ k: "dessin:" + c.id, t: "dessin", nom: c.nom, ref: c }));
  return e;
}

/* ordre effectif : celui qui a été choisi, complété par les nouveautés */
function pile(){
  const enregistre = CONF[clePile()];
  const e = entrees();
  const defaut = e.map(x => x.k);
  if (!Array.isArray(enregistre)) return e;
  const rang = x => {
    const i = enregistre.indexOf(x.k);
    return i >= 0 ? i : 10000 + defaut.indexOf(x.k);   // les nouvelles couches à la fin
  };
  return e.slice().sort((a, b) => rang(a) - rang(b));
}

function groupe(k){
  const c = $("couches");
  if (k.indexOf("fond:") === 0)   return c.querySelector('.cal[data-cle="' + CSS.escape(k.slice(5)) + '"]');
  if (k.indexOf("dessin:") === 0) return c.querySelector('.dcal[data-dcal="' + CSS.escape(k.slice(7)) + '"]');
  return $(k.slice(5));
}

/* déplacer les nœuds plutôt que tout reconstruire : réordonner est instantané */
function ordonneDom(){
  const c = $("couches");
  pile().forEach(x => { const g = groupe(x.k); if (g) c.appendChild(g); });
}

function deplaceCouche(k, dir){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k), j = i + dir;
  if (i < 0 || j < 0 || j >= liste.length) return;
  liste[i] = liste[j]; liste[j] = k;
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom();
  construitPanneau();
}

/* ============================================================
   Panneau : une seule liste, tous types confondus

   Deux natures s'y mêlent pourtant, et rien ne les distinguait : ce que le
   salon fournit — habillage Klipso, zones, stands, textes — et ce que
   l'exploitant a dessiné lui-même. Les premières se refont à chaque
   synchronisation, les secondes sont son travail : on ne les supprime pas du
   même cœur léger. Un intertitre ouvre donc chaque suite d'une même nature.
   Il suit l'ordre plutôt qu'il ne l'impose — un calque de dessin glissé sous
   les stands reste où on l'a mis, et gagne son propre intertitre là.
   ============================================================ */
const NATURES = { salon: "Issus du salon", dessin: "Ajoutés à la main" };
const nature = x => x.t === "dessin" ? "dessin" : "salon";

/* Le bouton d'ajout ferme la suite des calques dessinés plutôt que le panneau :
   c'est un de ces calques-là qu'il crée, et au bas de la pile il paraissait
   valoir pour tout ce qui le précédait, couches du salon comprises. Restent les
   plans sans aucun dessin : là il n'a pas de suite à fermer, et revient en fin
   de liste — la seule place qui reste. */
function boutonAjout(hote){
  const plus = document.createElement("button");
  plus.className = "ajout";
  plus.textContent = "+ Nouveau calque de dessin";
  plus.onclick = creeCalque;
  hote.appendChild(plus);
}

/* Le cadenas d'un calque de dessin : un interrupteur, donc « aria-pressed »
   plutôt que deux boutons qui se remplacent. Son intitulé dit ce que le clic
   fera, et non l'état où l'on est — c'est ce qu'on cherche en le survolant. */
function boutonVerrou(c){
  const ferme = verrouille(c);
  return '<button class="verr" aria-pressed="' + ferme + '" title="' +
    (ferme ? "Déverrouiller le calque"
           : "Verrouiller le calque : ni dessin, ni suppression") +
    '">' + pictoVerrou(ferme) + '</button>';
}

function intertitre(hote, cle){
  const t = document.createElement("span");
  t.className = "eyebrow secpile";
  t.textContent = NATURES[cle];
  hote.appendChild(t);
}

function construitPanneau(){
  const hote = $("pile");
  hote.innerHTML = "";
  const reorg = document.createElement("button");
  reorg.className = "reorg";
  reorg.textContent = "⇅ Réorganiser les calques";
  reorg.onclick = ouvreOrdre;
  hote.appendChild(reorg);
  const liste = pile().slice().reverse();   // premier plan en tête

  /* Un intertitre ne vaut que s'il sépare : tant que le salon n'a pas de
     calque dessiné, la pile est d'une seule nature et se passe de titre. */
  const melange = liste.some(x => nature(x) === "dessin") &&
                  liste.some(x => nature(x) === "salon");
  const dernierDessin = liste.reduce((r, x, i) => nature(x) === "dessin" ? i : r, -1);
  let natureCourante = null;

  liste.forEach((x, i) => {
    if (melange && nature(x) !== natureCourante){
      natureCourante = nature(x);
      intertitre(hote, natureCourante);
    }
    const d = document.createElement("div");
    d.className = "calq" + (x.t === "dessin" ? " perso" : "") +
                  (x.t === "dessin" && x.ref.id === calqueActif ? " actif" : "");
    if (x.t === "dessin") d.dataset.dcal = x.ref.id;

    const c = x.t === "dessin" ? x.ref : conf(x.t === "fond" ? x.k.slice(5) : x.k);
    const coche = c.visible === false ? "" : " checked";
    d.innerHTML = '<label><input type="checkbox"' + coche + '><span></span></label>' +
      '<span class="opts">' +
      (x.t === "data" ? "" : '<button class="fillbtn" title="Contour seul ou surface remplie"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.2"/></svg></button>') +
      /* avant la pastille, et non après comme le crayon d'un calque de dessin :
         les couleurs des couches de données forment une colonne, et un bouton
         glissé entre elles la romprait */
      (x.k === "data:labels" ? '<button class="ren rlib" title="Placer les libellés à la main">&#9998;</button>' : "") +
      '<input type="color" class="cc">' +
      /* Le cadenas précède le crayon et la croix : c'est eux qu'il éteint, et
         on lit la ligne de gauche à droite — ce qui protège avant ce qui
         modifie. */
      (x.t === "dessin" ? boutonVerrou(x.ref) +
                          '<button class="ren" title="Dessiner sur ce calque">&#9998;</button>' +
                          '<button class="sup" title="Supprimer le calque">&times;</button>' : "") +
      '</span>';

    const nom = d.querySelector("label span");
    nom.textContent = x.nom;

    /* Un calque qui sert aux itinéraires ne se distingue pas à l'écran : le
       rappeler ici évite de le chercher, ou de l'oublier. La coche d'à côté
       n'éteint que l'affichage — le calcul, lui, continue d'en tenir compte,
       et rien d'autre ne le dirait. */
    if (x.t === "dessin" && roleIti(x.ref)){
      const b = document.createElement("i");
      b.className = "rle";
      b.textContent = nomRoleIti(roleIti(x.ref));
      b.title = "Ce calque compte dans les itinéraires, même masqué.";
      nom.after(b);
    }

    /* visibilité */
    d.querySelector('input[type="checkbox"]').onchange = ev => {
      const on = ev.target.checked;
      if (x.t === "dessin"){ x.ref.visible = on; enregistreDessins(); dessineDessins(); }
      else { c.visible = on; enregistreConf();
             x.t === "fond" ? styleFond(x.k.slice(5)) : styleDataGroupe(x.k.slice(5), on); }
    };

    /* couleur */
    const cc = d.querySelector(".cc");
    cc.value = (x.t === "dessin" ? x.ref.couleur : c.couleur) || defautCouleur(x);
    cc.oninput = ev => {
      if (x.t === "dessin"){ x.ref.couleur = ev.target.value; enregistreDessins(); dessineDessins(); }
      else { c.couleur = ev.target.value; enregistreConf();
             x.t === "fond" ? styleFond(x.k.slice(5)) : appliqueCouleursData(); }
    };

    /* trait ou aplat */
    const fb = d.querySelector(".fillbtn");
    if (fb){
      fb.setAttribute("aria-pressed", !!c.rempli);
      fb.onclick = () => {
        c.rempli = !c.rempli;
        fb.setAttribute("aria-pressed", !!c.rempli);
        if (x.t === "dessin"){ enregistreDessins(); dessineDessins(); }
        else { enregistreConf(); styleFond(x.k.slice(5)); }
      };
    }

    /* propre aux calques de dessin */
    if (x.t === "dessin"){
      const vr = verrouille(x.ref);
      nom.title = vr ? "Calque verrouillé : ouvrez son cadenas pour y dessiner."
                     : "Cliquez pour dessiner dessus";
      d.querySelector(".verr").onclick = ev => { ev.stopPropagation(); basculeVerrou(x.ref); };
      // Le crayon ouvre les outils de dessin sur ce calque. Le renommage vit
      // dans la fenêtre de réorganisation, où l'on voit tous les calques.
      const cr = d.querySelector(".ren");
      cr.setAttribute("aria-pressed", x.ref.id === calqueActif);
      cr.onclick = ev => { ev.stopPropagation(); activeCalque(x.ref.id); };
      d.querySelector("label").onclick = ev => {
        if (ev.target.tagName !== "INPUT"){ ev.preventDefault(); activeCalque(x.ref.id); }
      };
      /* Verrouillé, le calque n'ouvre plus ses outils et ne se supprime plus :
         les deux boutons s'éteignent, plutôt que de mener à un refus qu'il
         faudrait expliquer une fois le geste fait. */
      [cr, d.querySelector(".sup")].forEach(b => {
        b.disabled = vr;
        if (vr) b.title = "Calque verrouillé";
      });
      d.querySelector(".sup").onclick = () => {
        const n = x.ref.formes.length;
        confirme("Supprimer le calque ?",
          "« " + x.ref.nom + " » et " +
          (n ? "ses " + n + " forme" + (n > 1 ? "s" : "") : "son contenu") +
          " seront définitivement perdus.",
          "Supprimer", () => {
            memorise();
            DESSINS[P().id] = mesCalques().filter(y => y.id !== x.ref.id);
            if (calqueActif === x.ref.id) activeCalque(null);
            enregistreDessins(); dessineDessins(); construitPanneau();
          });
      };
    }

    /* Le crayon des textes ouvre le placement des libellés à la main, comme
       celui d'un calque de dessin ouvre ses outils : deux façons de retoucher
       ce qu'une couche pose sur le plan, donc le même bouton au même endroit.
       Une case à cocher le disait aussi, mais en ligne séparée sous la couche,
       où elle se lisait comme un réglage du salon — alors que c'est un mode de
       travail, qui ne se retient pas d'une visite à l'autre. */
    if (x.k === "data:labels"){
      const cr = d.querySelector(".rlib");
      cr.setAttribute("aria-pressed", PLACE_LIBELLES);
      cr.onclick = ev => { ev.stopPropagation(); modePlacementLibelles(!PLACE_LIBELLES); };
    }

    hote.appendChild(d);

    /* sous-calques de l'habillage : couleur et visibilité, pas d'ordre */
    if (x.t === "fond"){
      const sous = sousCalques(x.k.slice(5));
      if (sous.length > 1) sous.forEach(sc =>
        rangSous(hote, sousCle(x.k.slice(5), sc.id), joli(sc.id),
                 () => rgbHex(sc.src) || jeton("--plan-line"), () => styleFond(x.k.slice(5))));
    }
    /* La carte de chaleur se range sous la couche Stands : c'est elle qu'elle
       repeint. Elle n'a pas de couleur à régler — les siennes sortent des
       chiffres — et elle ne se publie pas.

       Avant les secteurs, et non après : ceux-ci sont une légende, longue de
       vingt lignes sur un salon qui sectorise finement, et l'interrupteur s'y
       perdait — sur SIMI il tombait hors de l'écran, à croire qu'il manquait.
       Une commande ne se range pas au bout d'une liste de couleurs. */
    if (x.k === "data:stands" && ADMIN) rangChaleur(hote);
    /* Les couleurs des secteurs se règlent au même endroit : c'est la même
       couche qu'elles repeignent, et il n'y a pas de couche par secteur. Elles
       ne paraissent que si le salon sectorise et que le plan les montre — sans
       quoi ce serait une couleur qui ne peint rien. */
    if (x.k === "data:stands" && secteursMontres())
      SECTEURS.forEach((h, nom) => rangSecteur(hote, nom));
    /* les deux couleurs de texte se règlent sous la couche Textes */
    if (x.k === "data:labels"){
      rangSous(hote, "labStand", "Textes des stands", () => jeton("--ink"), () => styleData("labStand"));
      rangSous(hote, "labZone", "Textes des zones", () => jeton("--zone"), () => styleData("labZone"));
    }

    if (i === dernierDessin) boutonAjout(hote);
  });

  if (dernierDessin < 0) boutonAjout(hote);

  sectionSelection(hote);
  sectionFond(hote);

  /* Réglages généraux — ils ne portent sur aucun calque, d'où le trait qui les
     sépare de la pile. Comme le reste de CONF, ils partent aux visiteurs à la
     publication : c'est bien l'exploitant qui décide de ce qu'ils voient. */
  /* Les réglages généraux vivent dans leur propre fenêtre, ouverte par
     l'engrenage : ici ils allongeaient une pile déjà longue et se lisaient
     comme une couche de plus. */
}

/* ============================================================
   Repères
   Ce que le plan pose sur un stand sans que les données le disent : la
   couleur qu'il prend au moment où on le touche, et le liseré de ce qu'un
   visiteur a retenu. Ce ne sont pas des calques : rien ne s'y dessine, rien
   ne s'y masque, et le rang n'y veut rien dire. Rangées dans la pile, les
   lignes se lisaient pourtant comme des couches de plus, entre celles qu'on
   empile vraiment. Un trait les en sépare, un titre les nomme.

   La sélection n'a qu'une couleur à régler, l'aplat : le liseré qui le borde
   s'en déduit, et « appliqueCouleursData » s'en charge. Le parcours n'a que
   son liseré, et il se règle à part — les deux marques se croisent sur le
   même plan, souvent sur le même stand, et l'accent d'origine les confond.
   Les points d'intérêt s'y ajoutent pour la même raison : leur mise en avant
   passe par-dessus tout le reste, y compris un stand déjà sélectionné.
   ============================================================ */
function sectionSelection(hote){
  const bloc = document.createElement("div");
  bloc.className = "apart";
  const titre = document.createElement("span");
  titre.className = "eyebrow";
  titre.textContent = "Repères";
  bloc.appendChild(titre);

  const c = conf("selection");
  bloc.appendChild(ligneCouleur("Élément sélectionné", c.couleur || jeton("--accent-soft"),
    (v) => { c.couleur = v; enregistreConf(); appliqueCouleursData(); }));

  /* Le parcours retiré, sa couleur ne règle plus rien : la ligne s'efface avec
     lui, et revient si l'exploitant le rouvre. */
  if (conf("_parcours").visible !== false){
    const p = conf("parcours");
    bloc.appendChild(ligneCouleur("Parcours de visite", p.couleur || jeton("--accent"),
      (v) => { p.couleur = v; enregistreConf(); appliqueCouleursData(); }));
  }

  /* Les points d'intérêt, comme les deux autres : une marque que le plan pose
     par-dessus ce qu'il montre, et non une couche. Une seule couleur pour les
     deux bouts du geste — la pastille retenue dans le cartouche, et le contour
     comme le texte de ce qu'elle allume — sans quoi on cherche laquelle des
     deux on vient de toucher.

     La ligne suit le cartouche : un plan sans repère ni zone typée n'en montre
     pas, et la couleur ne peindrait rien. */
  if ($("poi") && !$("poi").hidden){
    const i = conf("poi");
    bloc.appendChild(ligneCouleur("Points d'intérêt", i.couleur || jeton("--accent"),
      (v) => { i.couleur = v; enregistreConf(); appliqueCouleursData(); }));
  }
  hote.appendChild(bloc);
}

/* ============================================================
   Fond du plan
   Le gris qui entoure le bâtiment n'est ni un calque ni un repère : rien ne
   s'y dessine, et il ne marque aucun stand. C'est l'aplat sur lequel tout le
   reste se pose, et le seul que le plan imposait — d'où sa place ici, au bas
   du panneau, juste avant la publication qui l'emporte chez les visiteurs.

   Un nuancier plutôt qu'un simple sélecteur, comme pour la couleur
   principale : on cherche la teinte d'un salon, pas une nuance à
   l'hexadécimal près. Les tons proposés sont tous clairs — le plan se dessine
   à l'encre sombre sur des stands blancs, et un fond soutenu les efface. À
   qui tient une charte plus tranchée, la dernière pastille ouvre le nuancier
   du système.
   ============================================================ */
const FONDS = [
  ["#FFFFFF", "Blanc"], ["#FAF7F0", "Ivoire"], ["#F1F0EA", "Coquille"],
  ["#E3E7EA", "Gris perle"], ["#E4EDE6", "Vert d'eau"], ["#E3EAF6", "Bleu pâle"],
  ["#F5E9DB", "Sable"],
];

function sectionFond(hote){
  const bloc = document.createElement("div");
  bloc.className = "apart fondp";
  bloc.innerHTML = '<div class="tete"><span class="eyebrow">Fond du plan</span>' +
    '<button type="button" class="reset">Couleur d\'origine</button></div>' +
    '<div class="nuancier"></div>';
  const nuancier = bloc.querySelector(".nuancier");
  const c = conf("_fond");

  /* La pastille retenue se cerne, et le retour à l'origine ne s'offre que s'il
     y a quelque chose à défaire : proposé sur un plan resté gris, il annonce
     un réglage là où il n'y en a pas. */
  const majPastilles = () => {
    const v = (c.couleur || "").toLowerCase();
    nuancier.querySelectorAll("button[data-ton]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.ton.toLowerCase() === v)));
    bloc.querySelector(".reset").hidden = !v;
    const libre = nuancier.querySelector(".perso input");
    if (libre) libre.value = c.couleur || jeton("--ground") || "#E9EAE4";
  };
  const choisit = (v) => { c.couleur = v; enregistreConf(); appliqueFond(); majPastilles(); };

  FONDS.forEach(([ton, nom]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.ton = ton;
    b.style.background = ton;
    b.title = nom + " · " + ton;
    b.setAttribute("aria-label", nom);
    b.onclick = () => choisit(ton);
    nuancier.appendChild(b);
  });
  /* Le sélecteur du système envoie une rafale d'événements pendant qu'on
     glisse : on suit, c'est le seul moyen de voir le fond s'installer sous le
     plan pendant qu'on le cherche. Rien ne part en base pour autant — la
     publication reste un geste à part. */
  const libre = document.createElement("label");
  libre.className = "perso";
  libre.title = "Couleur libre";
  libre.innerHTML = '<input type="color"><span></span>';
  libre.querySelector("input").oninput = e => choisit(e.target.value);
  nuancier.appendChild(libre);

  bloc.querySelector(".reset").onclick = () => {
    delete c.couleur;
    enregistreConf(); appliqueFond(); majPastilles();
  };
  hote.appendChild(bloc);
  majPastilles();
}

/* Une ligne qui n'a qu'une couleur à régler : ni visibilité, ni remplissage,
   ni rang. C'est le cas de tout ce qui n'est pas un calque — la sélection, un
   secteur — et qui n'a donc rien à masquer ni à empiler. */
function ligneCouleur(libelle, valeur, applique){
  const d = document.createElement("div");
  d.className = "calq";
  d.innerHTML = '<label><span></span></label>' +
                '<span class="opts"><input type="color" class="cc"></span>';
  d.querySelector("label span").textContent = libelle;
  const cc = d.querySelector(".cc");
  cc.value = valeur;
  cc.oninput = (e) => applique(e.target.value);
  return d;
}

/**
 * La couleur d'un secteur.
 *
 * Le sélecteur part de ce que le plan montre — la couleur choisie, ou la teinte
 * automatique résolue dans le thème courant — de sorte qu'on retouche ce qu'on
 * voit plutôt que de partir du noir. Elle vaut ensuite pour les deux thèmes,
 * comme celle des autres couches.
 */
function rangSecteur(hote, nom){
  const c = conf("secteur:" + nom);
  const d = ligneCouleur(nom, couleurSecteur(nom), (v) => {
    c.couleur = v;
    enregistreConf();
    appliqueSecteurs();
  });
  d.classList.add("sous");
  hote.appendChild(d);
}

/* ligne secondaire : visibilité et couleur seulement */
function rangSous(hote, cle, libelle, defaut, applique){
  const c = conf(cle);
  const d = document.createElement("div");
  d.className = "calq sous";
  d.innerHTML = '<label><input type="checkbox"' + (c.visible === false ? "" : " checked") +
    '><span></span></label><span class="opts">' +
    '<button class="fillbtn" title="Contour seul ou surface remplie"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.2"/></svg></button>' +
    '<input type="color" class="cc"></span>';
  d.querySelector("label span").textContent = libelle;
  d.querySelector('input[type="checkbox"]').onchange = e => {
    c.visible = e.target.checked; enregistreConf(); applique();
  };
  const cc = d.querySelector(".cc");
  cc.value = c.couleur || defaut();
  cc.oninput = e => { c.couleur = e.target.value; enregistreConf(); applique(); };
  const fb = d.querySelector(".fillbtn");
  fb.setAttribute("aria-pressed", !!c.rempli);
  fb.onclick = () => { c.rempli = !c.rempli; fb.setAttribute("aria-pressed", !!c.rempli);
                       enregistreConf(); applique(); };
  hote.appendChild(d);
}

function defautCouleur(x){
  if (x.t === "dessin") return "#2F49D1";
  if (x.t === "fond") return jeton("--plan-line");
  return jeton(x.k === "data:zones" ? "--zone" : x.k === "data:stands" ? "--stand" : "--ink");
}
/* ============================================================
   Enregistrer la configuration
   Les couleurs, la visibilité, l'ordre des calques et les dessins vivaient
   dans le navigateur de celui qui les réglait. Un visiteur ne voyait donc
   rien, et l'exploitant retrouvait un plan nu depuis un autre poste ou depuis
   son téléphone.

   Ils partent maintenant en base d'eux-mêmes, dès que la main s'arrête, et le
   service les rend à tout le monde. Un bouton les y envoyait sur demande —
   explicite, pour laisser essayer sans publier. En pratique l'exploitant
   réglait, fermait l'onglet, et perdait tout : le stockage local ne survit ni
   au changement de poste ni au nettoyage du navigateur, et rien dans l'écran
   ne l'annonçait. Ce qu'il restait à éviter — la rafale d'événements d'un
   sélecteur de couleur tiré à la souris — se règle par un temps de repos, pas
   par un clic.

   Le bouton reste, dans un autre rôle : il dit où en est l'enregistrement, et
   rattrape un envoi qui a échoué.
   ============================================================ */

/* Le libellé d'avant l'enregistrement automatique. Il ne sert plus que sans
   session — page publique, page à données figées — où rien ne part tout seul. */
const LIBELLE_POUSSE = "Pousser la configuration";

/* Temps de repos avant l'envoi. Assez long pour qu'une couleur tirée à la
   souris ne s'écrive pas cent fois, assez court pour qu'un onglet fermé juste
   après un réglage ne le perde pas. */
const REPOS = 1200;

/* Après un échec — réseau coupé, service en panne — on retente de loin en
   loin plutôt que d'insister : le travail est sur le poste, il attend. */
const REPOS_ECHEC = 20000;

/* Le relais garde le plan public dix minutes, et sert encore l'ancienne copie
   le temps de refaire la nouvelle : la base avait la configuration, les
   visiteurs pas encore. On lui demande donc d'oublier, au même endroit que
   celui où il sert le plan — déduit de son adresse plutôt qu'écrit deux fois. */
const OUBLI = API ? API.replace(/\/[^/]*$/, "/oublie") : "";

let minuteur = null;      // envoi programmé, pas encore parti
let publication = false;  // envoi en cours
let rejoue = false;       // une modification est arrivée pendant l'envoi
let souci = "";           // la dernière erreur, dite par l'infobulle

/* Ce que le bouton raconte, quand il y a quelque chose à raconter :
   « envoi » et « echec » durent le temps qu'ils durent, le reste se déduit. */
let etatEnvoi = "";

/* Les réglages d'apparence sont d'un seul tenant, là où les dessins se notent
   pavillon par pavillon (ATTENTE). On compte donc les modifications, et ce que
   la base en a reçu : une retouche arrivée pendant l'envoi garde ainsi son
   tour, sans qu'un drapeau à deux états l'avale. */
let revision = 0;
let revisionEnvoyee = 0;

/** Session et projet, tels que la console les a laissés sur le poste. */
function accesBase(){
  try {
    const cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    const ses = JSON.parse(localStorage.getItem("console-session") || "null");
    if (cfg?.url && cfg?.anonKey && ses?.access_token) return { cfg, ses };
  } catch (e) {}
  return null;
}

/** L'enregistrement automatique demande l'administration, un plan chargé et une
 *  session : la page publique et celle à données figées n'ont ni la première ni
 *  la dernière, et l'identité est vérifiée avant que le plan arrive. */
const autoDispo = () => ADMIN && !!DATA?.plans?.length && !!accesBase();

/** Reste-t-il quelque chose qui ne soit que sur ce poste ? */
const enRetard = () => revision !== revisionEnvoyee ||
  (DATA?.plans || []).some(p => enAttente(p.id));

/* Ce que dit le bouton dans chaque état, et son infobulle. */
const DITS = {
  manuel:  [LIBELLE_POUSSE, ""],
  attente: ["Enregistrement…", "Des réglages ne sont encore que sur ce poste."],
  envoi:   ["Enregistrement…", "Les réglages partent vers la base."],
  fait:    ["Configuration enregistrée", "Les visiteurs voient ces réglages."],
  echec:   ["Enregistrer — réessayer", ""],
};

/** Où en est l'enregistrement, du point de vue du bouton. */
const etatCourant = () => etatEnvoi || (!autoDispo() ? "manuel"
  : enRetard() ? "attente" : "fait");

/**
 * Ce que le bouton dit de l'enregistrement.
 *
 * Un dessin s'enregistre sur le poste au fil du geste, ce qui donne le
 * sentiment qu'il est à l'abri : rien ne distinguait un travail publié d'un
 * travail qui n'avait jamais quitté ce navigateur. Le bouton porte donc l'état
 * en clair, et non plus une simple marque.
 */
function majAttente(){
  const b = $("pousseConf");
  if (!b) return;
  const e = etatCourant();
  b.textContent = DITS[e][0];
  b.title = e === "echec" ? "Enregistrement impossible : " + souci : DITS[e][1];
  b.dataset.etat = e;
}

/** Passe dans un état, et le fait dire par le bouton. */
function ditEtat(e, detail){
  etatEnvoi = e;
  if (detail) souci = detail;
  majAttente();
}

/** Programme un envoi, en remplaçant celui qui attendait. */
function programmeEnvoi(delai, etiquette){
  if (minuteur) clearTimeout(minuteur);
  minuteur = null;
  if (!autoDispo()){ majAttente(); return; }
  minuteur = setTimeout(envoie, delai);
  ditEtat(etiquette || "");
}

/**
 * Une modification vient d'être posée sur le poste : elle part en base dès que
 * la main s'arrête. Appelée par les deux enregistrements locaux —
 * `enregistreConf` pour l'apparence, `enregistreDessins` pour les calques —
 * c'est le seul point d'entrée de l'enregistrement automatique.
 */
function programmePublication(){
  revision++;
  programmeEnvoi(REPOS);
}

/** Au chargement : ce qu'une session précédente n'a pas réussi à envoyer part
 *  de lui-même, sans attendre qu'on pense à cliquer. */
function rattrapeRetard(){
  if (enRetard()) programmeEnvoi(REPOS); else majAttente();
}

/** L'envoi programmé, quand son temps de repos est écoulé. */
function envoie(){
  if (minuteur) clearTimeout(minuteur);
  minuteur = null;
  if (!autoDispo()) return;
  // un envoi est déjà en cours : il reprendra la main en finissant
  if (publication){ rejoue = true; return; }
  if (enRetard()) pousseConfiguration(true);
  else majAttente();
}

/* Un onglet qu'on ferme ne laisse pas le temps de repos s'écouler : ce qui
   attendait part tout de suite. Le navigateur n'en garantit pas l'arrivée —
   d'où la copie sur le poste, et le rattrapage au chargement suivant. */
const presse = () => { if (minuteur) envoie(); };
/* Sur le document, où l'événement naît : écouté sur la fenêtre, il n'y arrivait
   que par remontée, et un onglet masqué trop tôt n'aurait rien envoyé. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") presse();
});
addEventListener("pagehide", presse);

/* ------------------------------------------------------------
   Le jeton, et son renouvellement

   Un jeton d'accès Supabase vit une heure. Personne ne travaille une heure sur
   un plan : on l'ouvre le matin, on y revient dans la journée. Passé ce délai
   la base refusait tout, et chaque appelant le disait à sa façon — le bouton
   d'enregistrement tournait en rond sur son « réessayer », la carte de chaleur
   et le classement de la suggestion rendaient un « JWT expired » brut à qui
   n'avait rien demandé. La session était pourtant récupérable : la console
   range à côté du jeton qui expire celui qui permet d'en obtenir un neuf.

   L'échange se fait donc ici, au seul endroit par lequel passent tous les
   appels à la base, comme la console le fait du sien.
   ------------------------------------------------------------ */
const RESTE_JETON = 60;   // secondes en deçà desquelles on échange avant de partir

/** Ce qu'il reste à un jeton. Illisible, on le suppose bon : le serveur
 *  tranchera, et son refus déclenchera l'échange. */
function resteSession(jeton){
  try {
    const p = String(jeton || "").split(".")[1];
    const exp = p && JSON.parse(atob(p.replace(/-/g, "+").replace(/_/g, "/"))).exp;
    return typeof exp === "number" ? exp - Date.now() / 1000 : Infinity;
  } catch (e) { return Infinity; }
}

/* Un échange à la fois : un jeton de renouvellement ne sert qu'une fois, et la
   publication écrit pavillon par pavillon — trois échanges lancés de front en
   perdraient deux, et la session avec. */
let echange = null;

/** Échange le jeton de renouvellement contre une session neuve, rangée là où
 *  la console la range : c'est le même casier, et les deux pages doivent y
 *  lire la même chose. Rend la session, ou rien si elle est bel et bien finie. */
function renouvelleSession(acces){
  if (!acces.ses.refresh_token) return Promise.resolve(null);
  if (!echange){
    echange = (async () => {
      try {
        const r = await fetch(acces.cfg.url + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          headers: { "apikey": acces.cfg.anonKey, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: acces.ses.refresh_token }),
        });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.access_token) return null;
        // un stockage refusé ne doit pas coûter la session en cours
        try { localStorage.setItem("console-session", JSON.stringify(j)); } catch (e) {}
        return j;
      } catch (e) {
        // une coupure du réseau n'est pas une session finie : on ne déconnecte pas
        return null;
      } finally { echange = null; }
    })();
  }
  return echange;
}

async function base(acces, chemin, options = {}){
  const envoie = () => fetch(acces.cfg.url + "/rest/v1/" + chemin, {
    ...options,
    headers: {
      "apikey": acces.cfg.anonKey,
      "Authorization": "Bearer " + acces.ses.access_token,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  /* La session neuve est reposée dans « acces », que l'appelant garde d'une
     écriture à l'autre : les pavillons suivants partent avec le jeton frais, et
     la purge du cache aussi. */
  const echangeContre = async () => {
    const neuve = await renouvelleSession(acces);
    if (neuve) acces.ses = neuve;
    return !!neuve;
  };

  if (resteSession(acces.ses.access_token) < RESTE_JETON) await echangeContre();
  let r = await envoie();
  /* Et refusé malgré tout — une horloge en retard, un jeton révoqué ailleurs —
     on échange puis on refait l'appel. Le 403 reste où il est : c'est un droit
     qui manque, pas un jeton qui se périme, et le renouveler ne le donnerait
     pas. */
  if (r.status === 401 && await echangeContre()) r = await envoie();

  const txt = await r.text();
  /* Une session que même l'échange ne rattrape plus se dit en toutes lettres :
     le corps de la réponse parle de JWT, ce qui ne veut rien dire pour qui
     voulait seulement enregistrer son plan. */
  if (r.status === 401) throw new Error("session expirée, reconnectez-vous");
  if (!r.ok) throw new Error("HTTP " + r.status + " · " + txt.slice(0, 160));
  return txt ? JSON.parse(txt) : null;
}

/* Le plan connaît les pavillons par leur identifiant Klipso ; la base par le
   sien. Le lien ne change pas d'un envoi à l'autre : le redemander à chaque
   retouche ferait deux requêtes pour rien. On le reprend tant qu'il nomme tous
   les pavillons ouverts — une synchronisation a pu en ajouter un. */
let _ids = null;
async function identifiants(acces){
  const attendus = (DATA?.plans || []).map(p => p.id);
  if (_ids && _ids.slug === DATA.slug && attendus.every(id => _ids.par[id])) return _ids.par;
  const evt = await base(acces,
    "evenement?select=id&slug=eq." + encodeURIComponent(DATA.slug));
  if (!evt.length) throw new Error("Événement introuvable.");
  const plans = await base(acces,
    "plan?select=id,id_klipso&evenement_id=eq." + evt[0].id);
  _ids = { slug: DATA.slug, par: Object.fromEntries(plans.map(p => [p.id_klipso, p.id])) };
  return _ids.par;
}

/** Les réglages d'apparence de ce salon : sans les ordres de pile, qui sont
 *  par pavillon, et sans ceux d'un salon voisin, qui n'ont rien à faire dans
 *  son enregistrement — c'est par là qu'ils s'y installaient. */
function reglagesSeuls(){
  return reglagesDuSalon(CONF);
}

/**
 * Demande au relais d'oublier le plan public de ce salon.
 *
 * Sans réponse attendue : un relais absent — page servie autrement, essai en
 * local — ou muet ne remet pas en cause un enregistrement qui, lui, a abouti.
 * Et ce n'est qu'un cache : au pire les visiteurs attendent le délai d'avant.
 */
function oublieCache(acces){
  if (!OUBLI || !DATA?.slug) return;
  fetch(OUBLI + "?slug=" + encodeURIComponent(DATA.slug), {
    method: "POST",
    headers: {
      "apikey": acces.cfg.anonKey,
      "Authorization": "Bearer " + acces.ses.access_token,
    },
  }).catch(() => {});
}

/**
 * Envoie la configuration en base.
 *
 * `auto` distingue l'envoi programmé du clic : l'un se tait et n'écrit que ce
 * qui a bougé, l'autre parle dans la liste et réécrit tout — c'est le geste de
 * réparation, celui qui remet en base un pavillon qu'un échec y aurait laissé
 * en retard.
 */
async function pousseConfiguration(auto){
  if (publication){ rejoue = true; return; }
  const acces = accesBase();
  if (!acces){
    const dit = "Session absente : reconnectez-vous pour enregistrer.";
    if (auto) ditEtat("echec", dit); else annonce(dit, true);
    return;
  }
  /* Ce que l'envoi aura mis en base s'il aboutit. Relevé avant d'écrire : une
     retouche arrivée entre-temps garde son tour, et repartira ensuite. */
  const cible = revision;
  publication = true;
  rejoue = false;
  ditEtat("envoi");

  try {
    const parKlipso = await identifiants(acces);
    const reglages = reglagesSeuls();
    let calques = 0;
    /* Un pavillon de la page que la base ne nomme pas garde sa marque d'attente,
       et la relancerait indéfiniment : on le compte pour le dire en finissant. */
    let inconnus = 0;

    for (const p of DATA.plans){
      const planId = parKlipso[p.id];
      if (!planId){ inconnus++; continue; }

      await base(acces, "apparence?on_conflict=plan_id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([{
          plan_id: planId,
          pile: CONF["_pile:" + p.id] || [],
          reglages: reglages,
          modifie_le: new Date().toISOString(),
        }]),
      });

      /* Les dessins d'un pavillon qui n'a pas bougé sont déjà en base : les
         réécrire à chaque couleur changée ferait passer des mégaoctets pour
         rien. Le clic, lui, les réécrit tous — c'est ce qu'on lui demande. */
      if (!auto || enAttente(p.id)){
        /* La marque du pavillon, telle qu'elle est en commençant : on ne
           l'effacera que si le geste suivant ne l'a pas relevée entre-temps. */
        const marque = ATTENTE[p.id];
        const liste = DESSINS[p.id] || [];
        if (liste.length){
          await base(acces, "calque_dessin?on_conflict=plan_id,cle", {
            method: "POST",
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(liste.map((c, i) => ({
              plan_id: planId, cle: c.id, nom: c.nom || "Calque",
              couleur: c.couleur || "#2F49D1", rempli: !!c.rempli,
              visible: c.visible !== false, rang: i,
              formes: c.formes || [], modifie_le: new Date().toISOString(),
            }))),
          });
          calques += liste.length;
        }

        /* Ce qui a disparu de la page disparaît de la base. On retire après
           avoir écrit, jamais avant : un échec en cours de route laisse alors
           l'ancienne version en place plutôt qu'un plan vide. */
        const gardes = liste.map(c => '"' + String(c.id).replace(/"/g, "") + '"').join(",");
        await base(acces,
          "calque_dessin?plan_id=eq." + planId +
          (gardes ? "&cle=not.in.(" + encodeURIComponent(gardes) + ")" : ""),
          { method: "DELETE", headers: { "Prefer": "return=minimal" } });

        /* Ce pavillon est en base : le poste ne le devance plus, et le
           chargement suivant peut reprendre ce que la base en dit. On le note
           pavillon par pavillon — un échec à mi-parcours laisse marqués ceux
           qui n'y sont pas encore passés. Et seulement si rien n'a été tracé
           pendant l'envoi : ce trait-là n'existe nulle part ailleurs. */
        if (ATTENTE[p.id] === marque) marqueAttente(p.id, false);
      }
    }

    revisionEnvoyee = cible;
    publication = false;
    /* La base a la configuration ; le relais garde encore l'ancienne version du
       plan public. On le lui dit tout de suite, sans quoi l'administration et le
       plan public ne montreraient pas la même chose — et c'est le plan public
       qui compte. Avant de signaler un pavillon manquant : ce qui est écrit est
       écrit, et doit partir aux visiteurs. */
    oublieCache(acces);
    if (inconnus) throw new Error(inconnus +
      (inconnus > 1 ? " pavillons sont absents" : " pavillon est absent") +
      " de la base : lancez une synchronisation depuis la console.");
    ditEtat("");
    if (!auto) annonce("Configuration enregistrée : " + DATA.plans.length +
      (DATA.plans.length > 1 ? " pavillons" : " pavillon") +
      (calques ? ", " + calques + " calque" + (calques > 1 ? "s" : "") + " de dessin" : "") + ".");
    /* Une retouche arrivée pendant l'envoi part à son tour. On s'en remet au
       compteur, et non aux marques d'attente : celles d'un pavillon qu'on vient
       de sauter tourneraient en rond. */
    if (rejoue || revision !== revisionEnvoyee) programmeEnvoi(REPOS);
  } catch (e) {
    publication = false;
    if (!auto) annonce("Enregistrement impossible : " + e.message, true);
    /* Rien n'est perdu : le poste garde sa copie et la marque d'attente. On
       retente de loin en loin, et le bouton dit pourquoi en attendant. L'état se
       pose avant d'être programmé : une session expirée ne reprogramme rien, et
       le bouton resterait à annoncer un envoi qui ne reviendra pas. */
    ditEtat("echec", e.message);
    programmeEnvoi(REPOS_ECHEC, "echec");
  }
}

/* ============================================================
   Fenêtres modales : confirmation et réorganisation des calques
   ============================================================ */
/**
 * Une fenêtre par-dessus le plan.
 *
 * `genre` la range autrement : « cote » la pose à gauche et retire le voile,
 * pour une fenêtre dont on regarde l'effet sur le plan pendant qu'on s'en sert.
 * Sans lui, elle est au milieu, sur fond grisé — ce qu'il faut quand elle
 * demande une réponse avant de rendre la main.
 */
/* Ce qu'une fenêtre laisse en train de se faire.
 *
 * Une saisie qui n'a pas de bouton d'enregistrement — on ne « valide » pas une
 * fiche qu'on est en train d'écrire, on la quitte — doit partir avec la fenêtre
 * quelle que soit la porte : la croix, le pied, le voile, « Échap », ou une
 * autre fenêtre qui prend la place. Toutes passent par ici ; le crochet est
 * posé par qui remplit la fenêtre, et ne joue qu'une fois. */
let avantFermeture = null;

function verseModale(){
  const f = avantFermeture;
  avantFermeture = null;
  if (f) f();
}

function ouvreModale(titre, remplitCorps, boutons, genre){
  verseModale();
  if (genre) $("modale").dataset.genre = genre;
  else delete $("modale").dataset.genre;
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplitCorps($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach(b => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action) b.action(); if (b.ferme !== false) fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
function fermeModale(){ verseModale(); $("modale").classList.remove("open"); }
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", e => { if (e.target === $("modale")) fermeModale(); });
addEventListener("keydown", e => {
  if (e.key === "Escape" && $("modale").classList.contains("open")) fermeModale();
});

function confirme(titre, message, libelleOui, action){
  ouvreModale(titre, corps => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [
    { libelle: "Annuler" },
    { libelle: libelleOui, genre: "danger", action: action },
  ]);
}

/* ------------------------------------------------------------
   Réorganisation : le premier rang de la liste est le calque le
   plus en avant, comme dans n'importe quel gestionnaire de calques.
   ------------------------------------------------------------ */
const GENRE = { fond: "plan", data: "données", dessin: "dessin" };
let tireK = null;

function deplaceVers(k, cible, apres){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k);
  if (i < 0) return;
  liste.splice(i, 1);
  let j = liste.indexOf(cible);
  if (j < 0) j = liste.length - 1;
  liste.splice(apres ? j + 1 : j, 0, k);
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom(); construitPanneau(); remplitOrdre();
}
function versExtremite(k, devant){
  const liste = pile().map(x => x.k).filter(x => x !== k);
  devant ? liste.push(k) : liste.unshift(k);   // fin de tableau = premier plan
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom(); construitPanneau(); remplitOrdre();
}

function remplitOrdre(hote){
  const ul = hote || $("mCorps").querySelector(".ordre");
  if (!ul) return;
  ul.innerHTML = "";
  // affichage du premier plan vers l'arrière-plan
  pile().slice().reverse().forEach(x => {
    const li = document.createElement("li");
    li.draggable = true;
    li.dataset.k = x.k;
    li.innerHTML = '<span class="poignee" aria-hidden="true">&#8942;&#8942;</span>' +
      '<span class="nom"></span>' +
      '<span class="bouts">' +
      // seul un calque de dessin nous appartient : les autres portent le nom
      // que Klipso leur donne, et le renommer ici mentirait sur leur origine
      /* Verrouillé, il ne se renomme pas non plus : le cadenas prend la place
         du crayon, et dit d'un coup d'œil lesquels sont protégés — c'est ici,
         la liste complète sous les yeux, qu'on s'en aperçoit le mieux. Le rang,
         lui, reste libre : il ne touche pas au dessin, et se reprend d'un
         geste. */
      (x.t === "dessin"
        ? (verrouille(x.ref)
            ? '<span class="verrou" title="Calque verrouillé : ouvrez son cadenas dans la pile pour le renommer">' +
              pictoVerrou(true) + '</span>'
            : '<button class="crayon" data-ren="1" title="Renommer">&#9998;</button>') : "") +
      '<button data-h="1" title="Mettre au premier plan">&#8607;</button>' +
      '<button data-h="0" title="Mettre à l’arrière-plan">&#8609;</button></span>';
    const nom = li.querySelector(".nom");
    nom.textContent = x.nom;
    const g = document.createElement("span");
    g.className = "genre"; g.textContent = GENRE[x.t];
    nom.appendChild(g);

    li.querySelectorAll(".bouts button[data-h]").forEach(b =>
      b.onclick = ev => { ev.stopPropagation(); versExtremite(x.k, b.dataset.h === "1"); });
    const cr = li.querySelector("[data-ren]");
    if (cr){
      cr.onclick = ev => {
        ev.stopPropagation();
        // la fenêtre de renommage remplace celle-ci, puis on revient
        renommeCalque(x.ref, () => ouvreOrdre());
      };
    }

    li.ondragstart = ev => { tireK = x.k; li.classList.add("drag");
                             ev.dataTransfer.effectAllowed = "move";
                             try { ev.dataTransfer.setData("text/plain", x.k); } catch (e) {} };
    li.ondragend = () => { tireK = null; li.classList.remove("drag");
                           ul.querySelectorAll("li").forEach(n => n.classList.remove("avant", "apres")); };
    li.ondragover = ev => {
      if (!tireK || tireK === x.k) return;
      ev.preventDefault();
      const r = li.getBoundingClientRect();
      const bas = ev.clientY > r.top + r.height / 2;
      li.classList.toggle("apres", bas);
      li.classList.toggle("avant", !bas);
    };
    li.ondragleave = () => li.classList.remove("avant", "apres");
    li.ondrop = ev => {
      if (!tireK || tireK === x.k) return;
      ev.preventDefault();
      const r = li.getBoundingClientRect();
      const bas = ev.clientY > r.top + r.height / 2;
      // la liste est inversée : « en dessous » à l'écran = plus en arrière
      deplaceVers(tireK, x.k, !bas);
      tireK = null;
    };
    ul.appendChild(li);
  });
}

function ouvreOrdre(){
  ouvreModale("Ordre des calques", corps => {
    const p = document.createElement("p");
    p.textContent = "Glissez pour réordonner. Le premier de la liste est au premier plan.";
    const ul = document.createElement("ul");
    ul.className = "ordre";
    corps.appendChild(p); corps.appendChild(ul);
    remplitOrdre(ul);
  }, [{ libelle: "Terminé" }]);
}

/* ============================================================
   11 bis. Parcours de visite
   ============================================================ */
/**
 * Un visiteur arrive avec trois heures et deux cents exposants devant lui. Il
 * repère de quoi remplir sa journée depuis chez lui, puis vient relire sa
 * liste sur place, entre deux allées.
 *
 * Cette liste vit dans son navigateur, et nulle part ailleurs : le plan n'a
 * pas de comptes, et demander une inscription pour retenir trois stands ferait
 * fuir tout le monde. Elle est rangée par événement — un même téléphone peut
 * ouvrir plusieurs salons — et ne retient que des identifiants : les libellés
 * sont relus dans les données à chaque affichage, si bien qu'un exposant
 * renommé entre deux visites s'affiche sous son nouveau nom.
 */
let PARCOURS = { stands: [], confs: [] };

/* Le nom de l'événement sert de repli pour la page à données figées, qui n'a
   pas de « slug » : sans lui, deux démonstrations partageraient la même liste. */
const cleParcours = () =>
  "plan-parcours:" + (SLUG || (DATA && DATA.evenement) || "");

const casierParcours = genre => genre === "conf" ? PARCOURS.confs : PARCOURS.stands;
const dansParcours = (genre, id) => casierParcours(genre).indexOf(String(id)) >= 0;

function chargeParcours(){
  try {
    const b = JSON.parse(localStorage.getItem(cleParcours()) || "null") || {};
    PARCOURS = {
      stands: Array.isArray(b.stands) ? b.stands.map(String) : [],
      confs:  Array.isArray(b.confs)  ? b.confs.map(String)  : [],
    };
  } catch (e) {
    PARCOURS = { stands: [], confs: [] };   // stockage refusé ou contenu illisible
  }
  /* Un stand démonté ou une conférence annulée entre deux visites laisserait
     un rang mort, qu'on ne saurait ni ouvrir ni comprendre. On ne garde que ce
     que les données connaissent encore. */
  PARCOURS.stands = PARCOURS.stands.filter(id => parId.has(id));
  PARCOURS.confs = PARCOURS.confs.filter(id => CONFS.has(id));
  rafraichitParcours();
}

function enregistreParcours(){
  // navigation privée, stockage plein : la visite continue sans le parcours
  try { localStorage.setItem(cleParcours(), JSON.stringify(PARCOURS)); } catch (e) {}
}

function basculeParcours(genre, id){
  const l = casierParcours(genre), k = String(id), i = l.indexOf(k);
  // l'ordre d'ajout est celui du parcours : on ajoute donc à la fin
  if (i < 0) l.push(k); else l.splice(i, 1);
  enregistreParcours();
  rafraichitParcours();
  /* Retirer un rang est une édition autant qu'en ajouter : c'est le même
     visiteur en train de composer sa journée, et le total des gestes les
     compte tous les deux.

     Ce qu'on rattache à l'exposant, en revanche, c'est le seul ajout : « huit
     visiteurs m'ont mis à leur programme » se comprend, « huit m'y ont mis ou
     retiré » ne veut rien dire. */
  mesure("parcours", "", i < 0 ? k : "",
         genre === "conf" ? "fiche_conf" : "fiche_stand");
}

/* ------------------------------------------------------------
   La marque, partout la même
   ------------------------------------------------------------ */
const SIGNET = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>';

/** Le signet nu, tel qu'il se pose à côté d'une conférence du programme. */
function signetParcours(genre, id){
  return '<button type="button" class="marque" data-mg="' + genre +
         '" data-mi="' + esc(id) + '"></button>';
}

/** Le même geste, en toutes lettres : sur une fiche, la place ne manque pas. */
function boutonParcours(genre, id){
  return '<button type="button" class="btn parc" data-mg="' + genre +
         '" data-mi="' + esc(id) + '">' + SIGNET + '<span class="l"></span></button>';
}

function rafraichitMarque(el){
  const dedans = dansParcours(el.dataset.mg, el.dataset.mi);
  el.setAttribute("aria-pressed", dedans);
  const dit = dedans ? "Retirer de mon parcours" : "Ajouter à mon parcours";
  el.title = dit;
  el.setAttribute("aria-label", dit);
  const l = el.querySelector(".l");
  if (l) l.textContent = dedans ? "Dans mon parcours" : "Ajouter à mon parcours";
  if (!el.querySelector("svg")) el.insertAdjacentHTML("afterbegin", SIGNET);
}

/** Rend vivantes les marques d'un fragment qu'on vient d'écrire. */
function brancheParcours(hote){
  hote.querySelectorAll("[data-mg]").forEach(el => {
    rafraichitMarque(el);
    el.onclick = ev => {
      ev.stopPropagation();
      basculeParcours(el.dataset.mg, el.dataset.mi);
    };
  });
}

/* ------------------------------------------------------------
   Ce que le parcours change à l'écran
   ------------------------------------------------------------ */
/**
 * Les liserés du plan.
 *
 * Deux marques se posent sur un stand sans que les données le disent : celle
 * de la sélection, et celle du parcours. Ni l'une ni l'autre ne se peint sur
 * le stand lui-même — elles se recopient dans un calque à part, posé au-dessus
 * des couches.
 *
 * Portées par le stand, elles disparaissaient le long des cloisons mitoyennes :
 * deux stands voisins partagent le même segment, et celui que le plan trace en
 * second y repassait son propre contour par-dessus le liseré du premier. Un
 * stand pris au milieu d'un îlot n'était alors cerné que sur ses côtés libres.
 * Une zone est logée à la même enseigne, et plus mal encore : les stands se
 * tracent après elle et recouvrent tout ce qui passe sous eux.
 *
 * Recopier le tracé plus haut règle la question sans toucher à l'ordre des
 * couches, que l'exploitant règle. L'aplat de la sélection, lui, reste sur le
 * stand : c'est une couleur de surface, elle n'a rien à gagner à monter.
 */
function calqueMarques(){
  let g = $("marques");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "marques";
    // au-dessus des couches, sous le trajet et les poignées d'édition
    svg.insertBefore(g, svg.querySelector("#itin, #apercu, #poignees"));
  }
  return g;
}

/**
 * Le calque se relit dans le plan plutôt qu'il ne se tient à jour : les deux
 * marques changent par des chemins sans rapport — un signet, un clic, un
 * changement de pavillon — et une seule lecture les remet d'accord.
 */
function dessineMarques(){
  /* Les liserés vivent hors des couches : rien ne les masquerait avec elles.
     Une couche de données retirée par l'exploitant doit pourtant emporter les
     marques de ce qu'elle portait, sans quoi le plan garderait des contours
     sans stands. */
  const montree = n => { const g = $(n); return !g || g.style.display !== "none"; };
  const vu = { stands: montree("stands"), zones: montree("zones") };
  let parc = "", sel = "";
  document.querySelectorAll("#stands > g, #zones > g").forEach(g => {
    if (!vu[g.parentNode.id]) return;
    const p = g.querySelector("path");
    if (!p) return;
    /* Une zone garde son trait discontinu jusque dans sa sélection — c'est ce
       qui la distingue d'un stand. Le parcours, lui, se veut continu partout :
       il dit qu'on a retenu l'endroit, pas ce qu'il est. */
    const d = ' d="' + p.getAttribute("d") + '"/>';
    if (g.classList.contains("enparcours")) parc += '<path class="parc"' + d;
    if (g.classList.contains("sel"))
      sel += '<path class="sel' + (g.parentNode.id === "zones" ? " zn" : "") + '"' + d;
  });
  // la sélection en dernier : c'est elle qu'on vient de désigner
  calqueMarques().innerHTML = parc + sel;
}

/**
 * Ce qu'un visiteur a retenu, marqué sur le plan.
 *
 * Une zone y entre par les conférences qu'elle abrite : c'est là qu'il faudra
 * se rendre à l'heure dite, la conférence n'ayant pas de forme propre.
 */
function marqueParcours(){
  if (!DATA) return;
  const zones = new Set();
  PARCOURS.confs.forEach(id => {
    const c = CONFS.get(id);
    if (c && c.zone) zones.add(String(c.zone));
  });
  document.querySelectorAll("#stands > g, #zones > g").forEach(g => {
    g.classList.toggle("enparcours",
      PARCOURS.stands.indexOf(g.dataset.id) >= 0 || zones.has(g.dataset.id));
  });
  dessineMarques();
}

function rafraichitParcours(){
  const n = PARCOURS.stands.length + PARCOURS.confs.length;
  const c = $("nParcours");
  if (c){ c.textContent = n; c.hidden = n === 0; }
  /* Rien à organiser tant que rien n'est retenu : le bouton reste, éteint,
     plutôt que d'apparaître au premier signet — sa présence dit ce à quoi la
     liste servira. */
  const org = $("btnJournee");
  if (org) org.disabled = n === 0;
  /* Une journée calculée sur une autre liste ne vaut plus : on ne la refait
     pas dans le dos du visiteur, on le lui dit. */
  perimeJournee();
  marqueParcours();
  /* Une même conférence se voit à deux endroits — le programme de sa zone et
     sa propre fiche — et le tiroir en montre une troisième. Toutes les marques
     affichées doivent dire la même chose, d'où qu'on ait touché. */
  document.querySelectorAll("[data-mg]").forEach(rafraichitMarque);
  if ($("parcours").classList.contains("open")) remplitParcours();
}

/* ------------------------------------------------------------
   Le tiroir
   ------------------------------------------------------------ */
/** De quoi ranger deux conférences dans l'ordre où on les vivra. */
function instantConf(c){
  const fz = DATA.fuseau;
  return momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
}
const cleTemps = c => {
  const d = instantConf(c);
  // sans heure lisible, la conférence se range en fin de liste plutôt que de
  // s'intercaler n'importe où
  return d ? d.cle + d.h + d.min : "999999999999";
};
const jourCourt = d => d
  ? JOURS[new Date(d.an, d.mois - 1, d.jour).getDay()] + " " + d.jour + " " + MOIS[d.mois - 1]
  : "";

function rangParcours(hote, r){
  const d = document.createElement("div");
  d.className = "pRang";
  d.innerHTML = '<button type="button" class="pOuvre">' +
    (r.dessus ? '<span class="ps"></span><span class="pt"></span>'
              : '<span class="pt"></span><span class="ps"></span>') +
    '</button><button type="button" class="pOte" title="Retirer du parcours" ' +
    'aria-label="Retirer du parcours">&times;</button>';
  d.querySelector(".pt").textContent = r.titre;
  d.querySelector(".ps").textContent = r.detail || "";
  if (r.couleur) d.querySelector(".pOuvre").style.setProperty("--tc", r.couleur);
  d.querySelector(".pOuvre").onclick = r.ouvre;
  d.querySelector(".pOte").onclick = () => basculeParcours(r.genre, r.id);
  hote.appendChild(d);
}

function groupeParcours(hote, titre){
  const g = document.createElement("div");
  g.className = "pGroupe";
  g.innerHTML = '<span class="eyebrow"></span>';
  g.querySelector(".eyebrow").textContent = titre;
  hote.appendChild(g);
  return g;
}

function remplitParcours(){
  const hote = $("pCorps");
  hote.innerHTML = "";
  const stands = PARCOURS.stands.map(id => parId.get(id)).filter(Boolean);
  const confs = PARCOURS.confs.map(id => CONFS.get(id)).filter(Boolean)
    .sort((a, b) => cleTemps(a).localeCompare(cleTemps(b)));

  const pluriel = (n, mot) => n + " " + mot + (n > 1 ? "s" : "");
  $("pResume").textContent = stands.length + confs.length
    ? [stands.length ? pluriel(stands.length, "exposant") : "",
       confs.length ? pluriel(confs.length, "conférence") : ""].filter(Boolean).join(" · ")
    : "rien pour l'instant";
  $("videParcours").hidden = !(stands.length + confs.length);

  if (!stands.length && !confs.length){
    const v = document.createElement("p");
    v.className = "pVide";
    v.textContent = "Ouvrez la fiche d'un exposant, ou le programme d'une zone, " +
      "et touchez le signet pour l'ajouter ici. Votre parcours reste sur cet " +
      "appareil et vous y retrouverez tout à votre prochaine visite.";
    hote.appendChild(v);
    return;
  }

  /* Les conférences d'abord : elles ont une heure, et c'est autour d'elles que
     le reste de la journée se range. */
  if (confs.length){
    const g = groupeParcours(hote, "Conférences");
    let jour = null;
    confs.forEach(c => {
      const d = instantConf(c);
      const f = momentLocal(c.finLocal, DATA.fuseau) || momentLocal(c.fin, DATA.fuseau);
      if (d && d.cle !== jour){
        jour = d.cle;
        const t = document.createElement("div");
        t.className = "jour";
        t.textContent = jourCourt(d);
        g.appendChild(t);
      }
      rangParcours(g, {
        genre: "conf", id: c.id, couleur: c.couleur, dessus: true,
        titre: c.nom,
        detail: (d ? d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "") : "") +
                (c.salle ? " · " + c.salle : ""),
        ouvre: () => ficheConf(c.id, "parcours"),
      });
    });
  }

  if (stands.length){
    const g = groupeParcours(hote, "Exposants");
    stands.forEach(o => rangParcours(g, {
      genre: "stand", id: o.id, dessus: false,
      titre: o.nom || o.plan || ("Stand " + (o.code || "")).trim(),
      detail: DATA.plans[o.p].libelle + (o.code ? " · " + o.code : ""),
      // choisir un rang, c'est vouloir le voir sur le plan : la fiche s'ouvre
      // et le tiroir se retire, puisqu'ils occupent la même bande
      ouvre: () => select(o.id, true, "parcours"),
    }));
  }

  /* Et, au bas de ce qu'on a retenu, ce qui pourrait le compléter : la
     proposition vient après la liste parce qu'elle en découle. */
  poseSuggestion(hote);
}

function ouvreParcours(){
  // la fiche et l'itinéraire occupent la même bande : ils cèdent la place
  // plutôt que de s'y superposer
  if ($("detail").classList.contains("open")) ferme();
  fermeItineraire();
  remplitParcours();
  /* Le tiroir se rouvre sur ce qu'on y regardait : consulter une fiche depuis
     la journée organisée ne doit pas la faire disparaître. */
  appliqueVueParcours();
  $("parcours").classList.add("open");
  $("btnParcours").setAttribute("aria-pressed", "true");
}
function fermeParcours(){
  const t = $("parcours");
  if (!t || !t.classList.contains("open")) return;
  t.classList.remove("open");
  $("btnParcours").setAttribute("aria-pressed", "false");
}

$("btnParcours").onclick = () =>
  $("parcours").classList.contains("open") ? fermeParcours() : ouvreParcours();
$("closeParcours").onclick = fermeParcours;
$("videParcours").onclick = () => confirme("Vider le parcours",
  "Les exposants et les conférences retenus seront oubliés. Ils ne sont " +
  "enregistrés que sur cet appareil : rien ne permettra de les retrouver.",
  "Vider",
  () => {
    PARCOURS = { stands: [], confs: [] };
    /* La journée n'était que cette liste, mise en heures : elle s'en va avec
       elle, et son tracé avec elle — mais pas un itinéraire demandé à côté,
       qui ne doit rien au parcours. */
    if (JOURNEE && TRACE === JOURNEE.dessin){
      TRACE = null;
      dessineItineraire();
    }
    JOURNEE = null; vueJournee = false;
    /* Les propositions écartées l'ont été sur cette liste-là : une liste vidée
       repart de zéro, les refus avec elle. */
    SUGG_ECARTES.clear();
    enregistreParcours();
    appliqueVueParcours();
  });

/* Échap ferme d'abord ce qui est au-dessus : une fenêtre modale se referme sur
   le tiroir, pas avec lui. */
addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modale").classList.contains("open")) fermeParcours();
});
/* ============================================================
   11 ter. Itinéraire — d'un point du salon à un autre
   ============================================================ */
/**
 * Un visiteur cherche le G77 ; il est devant le E10 et n'a aucune idée du
 * chemin. Son téléphone ne l'aidera pas : sous une charpente métallique le
 * GPS ne situe rien, et poser des balises dans les allées demanderait un
 * budget et une pose que personne n'a. On ne lui demande donc pas où il est —
 * il désigne son départ comme il désigne son arrivée, dans la même liste que
 * la recherche.
 *
 * Reste à trouver le chemin. Les données ne décrivent aucune allée : elles ne
 * donnent que des emplacements. L'allée, c'est ce qui reste — le vide entre
 * les stands. On la calcule donc en creux : le hall est pavé de cases d'un
 * demi-mètre, on noircit ce que les stands occupent, et on cherche la suite
 * de cases blanches la plus courte entre deux points.
 *
 * Ce détour par la grille a un mérite qui vaut à lui seul le calcul : le mode
 * PMR y devient presque gratuit. Un escalier, une pente, un passage trop
 * étroit se noircissent comme un stand, et la même recherche rend un autre
 * chemin — ou dit franchement qu'il n'y en a pas.
 */

/* Un demi-mètre par case : plus fin, la grille d'un pavillon dépasse le
   million de cases pour un tracé qui ne change plus ; plus grossier, une
   allée de deux mètres se referme. */
const PAS_GRILLE = .5;

/* Ce qu'on écarte des stands. Le chemin est calculé pour un point sans
   épaisseur : on épaissit donc les obstacles de la moitié du passage
   nécessaire. Quatre-vingt-dix centimètres pour un marcheur ; un mètre
   quarante en mode accessible, la largeur qu'exige un fauteuil roulant pour
   circuler et se croiser. Un couloir plus étroit disparaît de la grille, et
   le trajet passe ailleurs — c'est l'essentiel de ce que « PMR » change. */
const DEGAGEMENT = .45;
const DEGAGEMENT_PMR = .70;

/* Allure de salon, arrêts non compris : on marche moins vite entre deux
   allées pleines que sur un trottoir. */
const ALLURE = 1.1;        // m/s
const ALLURE_PMR = .8;

/**
 * Ce que coûte un virage, en cases.
 *
 * Entre deux points d'une allée, une grille offre des milliers de chemins de
 * même longueur : tout escalier de marches horizontales et verticales vaut la
 * diagonale qu'il approche. Sans prix du virage, A* en choisit un au hasard,
 * et le trajet traverse l'allée en biais au lieu de la suivre. À quatre cases
 * — deux mètres — un crochet ne se justifie plus que s'il fait gagner
 * davantage, et les tronçons redeviennent de longues lignes droites.
 */
const TOURNANT = 4;

/**
 * De quoi préférer le milieu de l'allée à ses bords.
 *
 * La pénalité s'éteint à deux mètres du mur le plus proche : au-delà — dans
 * une aire dégagée, une entrée, un carrefour — aucun « milieu » n'a de sens,
 * et vouloir le tenir ferait faire des détours pour rien.
 */
const PORTEE_CENTRE = 4;   // cases
/* Deux plutôt qu'une demie. Le prix du virage est de quatre cases : passer du
   bord au milieu en coûte deux, et il faut donc que la traversée se rembourse
   sur une longueur raisonnable d'allée. À une demie, l'écart entre le bord et
   le milieu valait un quart de case, soit seize mètres de ligne droite avant
   d'être rentable — le trait longeait les stands d'un bout à l'autre du hall.
   À deux, quatre mètres suffisent. */
const POIDS_CENTRE = 2;

/* ------------------------------------------------------------
   L'enveloppe du hall
   ------------------------------------------------------------ */
/**
 * L'emprise d'un pavillon est une boîte : elle déborde d'une douzaine de
 * mètres autour des stands, et rien n'y empêcherait un trajet de contourner
 * le hall par l'extérieur — derrière les stands de périphérie, là où il n'y a
 * que le mur. On borne donc la marche à l'enveloppe convexe des emplacements
 * eux-mêmes : les stands du pourtour en dessinent le bord, et on ne passe
 * plus derrière eux.
 *
 * Le fond de plan porterait les vrais murs, mais mêlés aux cotes, aux
 * hachures et au mobilier : les lire découperait le hall en morceaux au lieu
 * de le fermer.
 */
function sommets(o){
  const n = String(o.d).match(/-?\d*\.?\d+/g) || [];
  const l = [];
  for (let i = 0; i + 1 < n.length; i += 2) l.push([+n[i], +n[i + 1]]);
  return l;
}

/** Enveloppe convexe, parcours monotone d'Andrew. */
const ENVELOPPES = new Map();
function enveloppe(p){
  const garde = ENVELOPPES.get(p.id);
  if (garde) return garde;
  const pts = [];
  for (const o of p.stands) pts.push(...sommets(o));
  for (const o of p.zones) pts.push(...sommets(o));
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cote = (suite) => {
    const r = [];
    for (const q of suite){
      while (r.length > 1){
        const a = r[r.length - 2], b = r[r.length - 1];
        if ((b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]) > 0) break;
        r.pop();
      }
      r.push(q);
    }
    r.pop();
    return r;
  };
  let bord = pts.length < 3 ? [] : cote(pts).concat(cote(pts.slice().reverse()));
  /* Un pavillon sans emplacement — cela existe, le temps d'une première
     synchronisation — n'a pas d'enveloppe : on retombe sur son emprise, à
     défaut de mieux. */
  if (bord.length < 3){
    const e = p.emprise;
    bord = [[e.x0, e.y0], [e.x1, e.y0], [e.x1, e.y1], [e.x0, e.y1]];
  }
  const t = new Path2D();
  bord.forEach((q, i) => i ? t.lineTo(q[0], q[1]) : t.moveTo(q[0], q[1]));
  t.closePath();
  ENVELOPPES.set(p.id, t);
  return t;
}
