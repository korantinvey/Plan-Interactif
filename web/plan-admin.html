$("btnJournee").onclick = ouvreOrganisation;
$("jRefaire").onclick = ouvreOrganisation;
$("jRetour").onclick = () => { vueJournee = false; appliqueVueParcours(); };

/* ============================================================
   13. Mesure d'utilisation

   L'organisateur paie le plan et ne sait pas s'il sert. Ce module compte les
   gestes — une visite, une recherche, une fiche ouverte et par quel chemin —
   et les pousse par paquets vers la fonction `mesure`. Le rapport se lit
   depuis la console, sur sa page dédiée.

   Trois choses qu'il ne fait pas, et c'est ce qui permet de le laisser tourner
   sans bandeau de consentement : il ne pose pas de cookie, il n'envoie ni
   adresse ni agent utilisateur — le serveur ne les enregistre pas davantage —
   et le jeton de visiteur est tiré au hasard par le navigateur, propre à cet
   événement. Il ne suit personne d'un salon à l'autre, encore moins ailleurs.

   Il se tait complètement dans deux cas : la page à données figées, qui n'a
   aucune API à appeler, et la page d'administration, où ce qu'on mesurerait
   serait l'exploitant en train de préparer son salon.
   ============================================================ */
const MESURE_API = API ? API.replace(/[^/]*$/, "mesure") : "";
const MESURE_ACTIVE = !!(MESURE_API && SLUG &&
  document.documentElement.dataset.role !== "admin");

/** Un jeton de quelques caractères, tiré du générateur du navigateur. */
function jetonMesure(){
  const t = new Uint8Array(9);
  (crypto && crypto.getRandomValues ? crypto : { getRandomValues: a => {
    for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  } }).getRandomValues(t);
  return Array.from(t, o => o.toString(36).padStart(2, "0")).join("");
}

/**
 * Le jeton retenu, ou un jeton volatil si le stockage est refusé.
 *
 * En navigation privée, ou stockage plein, l'écriture lève. On ne renonce pas
 * à mesurer pour autant : le visiteur comptera pour un de plus, ce qui vaut
 * mieux que de ne pas le compter du tout.
 *
 * Le casier est nommé plutôt que passé : quand le navigateur refuse le
 * stockage de site — cookies bloqués — c'est la simple lecture de
 * `localStorage` qui lève, et l'évaluer à l'appel plaçait cette lecture hors
 * du `try`. L'exception remontait alors au corps de la page, dans le script
 * qui porte tout le plan : plus rien ne s'affichait, pour une mesure.
 */
function jetonRetenu(cle, casier){
  try {
    const ou = window[casier];
    const v = ou.getItem(cle);
    if (v) return v;
    const n = jetonMesure();
    ou.setItem(cle, n);
    return n;
  } catch (e) {
    return jetonMesure();
  }
}

/* Le jeton de visiteur est rangé sous le nom de l'événement : deux salons
   ouverts sur le même téléphone n'ont pas le même, et aucun ne vaut comme
   identifiant hors d'ici. Ce qui distinguait deux venues du même navigateur
   ne se transmet plus : le serveur ne le lisait pas, et une visite se compte
   déjà par le geste qui porte ce nom. */
const MESURE_VISITEUR = MESURE_ACTIVE
  ? jetonRetenu("plan-visiteur:" + SLUG, "localStorage") : "";

/* Un geste ne vaut pas un aller-retour réseau : on accumule, et on envoie
   quand le paquet est plein, quand la main s'arrête, ou quand la page part.

   Trente secondes et non quatre : à quatre, chaque fiche ouverte au fil d'une
   visite partait dans son propre paquet, et un visiteur produisait une
   quinzaine de requêtes — de loin le premier poste d'appels du système, devant
   le plan lui-même. Rien ne se perd pour autant, le départ de la page vidant
   ce qui reste. */
const MESURE_PAQUET = 20;
const MESURE_DELAI = 30000;
let _gestes = [], _envoiDiffere = null;

function envoieMesures(dernier){
  clearTimeout(_envoiDiffere);
  _envoiDiffere = null;
  if (!_gestes.length) return;
  const charge = JSON.stringify({
    slug: SLUG, visiteur: MESURE_VISITEUR,
    gestes: _gestes.splice(0, _gestes.length),
  });
  /* Au départ de la page, `fetch` est coupé net par le navigateur : le paquet
     se perdrait, et avec lui les derniers gestes — souvent les plus parlants.
     `sendBeacon` est fait pour cela, il survit à la fermeture de l'onglet. */
  try {
    if (dernier && navigator.sendBeacon &&
        navigator.sendBeacon(MESURE_API, charge)) return;
  } catch (e) {}
  fetch(MESURE_API, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: charge, keepalive: true,
    // la mesure ne doit jamais gêner la visite : une panne se tait
  }).catch(() => {});
}

/**
 * Retenir un geste, et ce qu'il désignait s'il désignait quelque chose.
 *
 *   mesure("fiche_stand", "plan", o.id)   une fiche d'exposant, ouverte du plan
 *   mesure("recherche")                   une recherche menée à son terme
 *   mesure("itineraire", "", o.id, "fiche_stand")   la route jusqu'à ce stand
 *
 * `objet` dit ce que la cible désigne, et ne se donne que là où le genre ne le
 * dit pas déjà : une fiche ouverte désigne l'objet qui porte son nom, un
 * itinéraire ou un ajout au programme peut viser un stand comme une
 * conférence. Le serveur le déduit du genre quand il manque.
 *
 * Le vocabulaire est celui des compteurs ; le serveur écarte ce qu'il ne
 * connaît pas plutôt que de l'enregistrer sous un nom approximatif, et une
 * cible que l'événement ne porte pas est écartée de même.
 */
function mesure(genre, canal, cible, objet){
  if (!MESURE_ACTIVE) return;
  const g = { genre: genre };
  if (canal) g.canal = canal;
  if (cible) g.cible = cible;
  if (cible && objet) g.objet = objet;
  _gestes.push(g);
  if (_gestes.length >= MESURE_PAQUET) return envoieMesures();
  clearTimeout(_envoiDiffere);
  _envoiDiffere = setTimeout(() => envoieMesures(), MESURE_DELAI);
}

if (MESURE_ACTIVE){
  /* Une visite par session d'onglet. Rouvrir le plan après l'avoir fermé en
     fait une seconde ; naviguer dedans pendant deux heures, une seule. */
  const CLE_VUE = "plan-visite:" + SLUG;
  let dejaVue = false;
  try { dejaVue = !!sessionStorage.getItem(CLE_VUE); } catch (e) {}
  if (!dejaVue){
    try { sessionStorage.setItem(CLE_VUE, "1"); } catch (e) {}
    mesure("visite");
  }

  /* `pagehide` est le seul événement sur lequel on puisse compter partout :
     sur mobile, une page mise en arrière-plan n'est jamais « déchargée », elle
     est gelée puis jetée sans prévenir. */
  addEventListener("pagehide", () => envoieMesures(true));
  addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") envoieMesures(true);
  });
}

/* ============================================================
   14. Les compteurs d'usage, vus du plan — carte de chaleur, remise à zéro

   Le rapport d'utilisation dit combien de fiches ont été ouvertes ; il ne dit
   pas lesquelles. C'est pourtant l'autre moitié de la question, et la seule
   qui se reporte sur le plan de l'année suivante : quel emplacement a retenu,
   quelle travée personne n'a regardée. Les compteurs le savent — une ligne par
   (stand, jour, canal) — mais neuf cents lignes de tableau ne se lisent pas.
   Sur le plan, si : c'est justement la forme que l'organisateur connaît.

   Elle ne vit qu'en administration. La fréquentation est une donnée
   d'exploitation, et la base la borne au compte qui a accès au salon —
   `audience_cibles` est en « security invoker », la page n'y ajoute rien.

   Ce qu'elle montre, et ce qu'elle ne montre pas : des consultations de fiche,
   pas des visiteurs uniques — les compter demanderait de retenir les paires
   (stand, visiteur), soit le volume que les compteurs ont précisément
   supprimé. Les zones organisateur n'y figurent pas : la page ne les compte
   pas davantage, une zone n'est pas un exposant.
   ============================================================ */
const CHAL_PERIODES = [["7", "7 j"], ["30", "30 j"], ["90", "90 j"], ["tout", "Tout"]];

/* Ce que la base a rendu pour la période en cours, et si l'on peint. Le second
   drapeau dit aussi quand *cesser* de peindre : sans lui, la page publique
   balaierait ses neuf cents stands à chaque montage pour n'y rien retirer. */
let CHALEUR = null, chalOuvert = false, chalPose = false, chalJours = "30";
/* Replié ou non — retenu d'une lecture à l'autre : qui a replié le cartouche
   une fois travaille au plan, et n'a pas à le replier à chaque ouverture. */
let chalReduit = false;

const nbChal = (n) => Number(n || 0).toLocaleString("fr-FR");

/**
 * La rampe d'une caméra thermique : bleu, cyan, vert, jaune, orange, rouge.
 *
 * C'est le langage que tout le monde a déjà vu, et il se lit sans légende :
 * personne n'a besoin qu'on lui dise que le rouge est chaud. On y perd ce que
 * gagnait une rampe monochrome — la clarté n'avance plus d'un bout à l'autre,
 * le jaune du milieu paraît plus vif que le rouge du bout, et le rang ne se
 * lit plus en noir et blanc. Le cartouche porte donc les nombres, et le survol
 * d'un stand donne le sien.
 *
 * Elle ne suit pas le thème : une image thermique est la même de jour comme de
 * nuit. C'est ce qui oblige à reprendre l'encre des libellés — voir
 * « mode-chaleur » dans la feuille de style.
 */
const THERMIQUE = ["#2B54D6", "#1F7DE8", "#16C4D8", "#2FCE71", "#93D82B",
                   "#F0DC14", "#F79328", "#E22319"];

function tonChaleur(t){
  const u = Math.max(0, Math.min(1, t)) * (THERMIQUE.length - 1);
  const i = Math.min(Math.floor(u), THERMIQUE.length - 2), f = u - i;
  const a = THERMIQUE[i], b = THERMIQUE[i + 1];
  const voie = (n) => Math.round(parseInt(a.slice(n, n + 2), 16) * (1 - f) +
                                 parseInt(b.slice(n, n + 2), 16) * f);
  return "#" + [voie(1), voie(3), voie(5)]
    .map(v => v.toString(16).padStart(2, "0")).join("");
}

/**
 * Le niveau d'un stand sur l'échelle.
 *
 * Rapportée au maximum, elle n'aurait rien montré : sur un salon la fiche la
 * plus ouverte l'est dix à cent fois plus que la médiane, et tout le reste du
 * plan serait resté du même bleu. Le logarithme rend ces écarts lisibles sans
 * changer l'ordre. Il compresse, donc il faut le dire : le cartouche porte les
 * nombres aux bornes et au milieu de la bande, et non des pourcentages.
 *
 * « rangChaleur » plus bas est une rangée du panneau, pas un rang sur cette
 * échelle : d'où ce nom-ci.
 */
const niveauChaleur = (n, max) => max > 0 ? Math.log1p(n) / Math.log1p(max) : 0;

/** L'inverse : le nombre de consultations qu'une position de la bande vaut. */
const valeurChaleur = (u, max) => Math.round(Math.expm1(u * Math.log1p(max)));

/* ------------------------------------------------------------------
   Lecture
   ------------------------------------------------------------------ */
/**
 * Les compteurs du salon ouvert, pour la période retenue.
 *
 * Le plan connaît son salon par son slug, la base par son identifiant : le
 * premier appel fait le lien, comme la publication de la configuration. On le
 * retient — il ne change pas tant qu'on regarde le même salon.
 */
let _evtChaleur = null;
async function chargeChaleur(){
  const acces = accesBase();
  if (!acces) throw new Error("session absente, reconnectez-vous");
  if (!_evtChaleur){
    const evt = await base(acces,
      "evenement?select=id&slug=eq." + encodeURIComponent(DATA.slug));
    if (!evt.length) throw new Error("événement introuvable");
    _evtChaleur = evt[0].id;
  }
  const r = await base(acces, "rpc/audience_cibles", {
    method: "POST",
    body: JSON.stringify({
      p_evenement: _evtChaleur,
      p_jours: chalJours === "tout" ? null : Number(chalJours),
      p_genre: "fiche_stand",
    }),
  });
  const cibles = r?.cibles || [];
  const par = new Map(cibles.map(c => [c.id, Number(c.n) || 0]));
  CHALEUR = {
    par: par,
    max: cibles.length ? Number(cibles[0].n) || 0 : 0,
    total: Number(r?.total) || 0,
    depuis: r?.depuis || null,
    cibles: cibles,
  };
}

/* ------------------------------------------------------------------
   Le plan
   ------------------------------------------------------------------ */
/**
 * La teinte posée sur le groupe du stand, comme celle du secteur : la feuille
 * de style la lit de là et garde la main sur le survol et la sélection, qui
 * doivent l'emporter. Les stands dessinés à la main la reçoivent aussi — ils
 * découpent un emplacement, et un découpage resté blanc trouerait la carte.
 *
 * Appelée depuis `coloreSecteurs`, seul endroit que traversent tous les
 * chemins qui rebâtissent les stands : changement de pavillon, montage du
 * fond, rafraîchissement des découpages.
 */
function coloreChaleur(){
  const on = chalOuvert && CHALEUR;
  if (!on && !chalPose) return;      // rien n'a jamais été peint : rien à effacer
  chalPose = !!on;
  /* L'encre des libellés ne peut plus venir du thème dès que les stands
     prennent la température : la feuille de style s'en charge, à ce drapeau. */
  racine.classList.toggle("mode-chaleur", !!on);
  document.querySelectorAll("#stands g, #couches .dcal .sdes[data-id]").forEach(g => {
    const titre = g.querySelector(":scope > title.chal");
    if (!on){
      g.removeAttribute("data-chaleur");
      g.style.removeProperty("--chal-c");
      if (titre) titre.remove();
      return;
    }
    const n = CHALEUR.par.get(g.dataset.id) || 0;
    g.setAttribute("data-chaleur", "");
    g.style.setProperty("--chal-c", tonChaleur(niveauChaleur(n, CHALEUR.max)));
    /* Le chiffre derrière la couleur, à portée de curseur. Une carte de chaleur
       se lit de loin mais se vérifie de près, et l'exploitant qui prépare une
       relance a besoin du nombre, pas de la nuance. */
    const t = titre || g.insertBefore(
      document.createElementNS("http://www.w3.org/2000/svg", "title"), g.firstChild);
    t.setAttribute("class", "chal");
    const o = parId.get(g.dataset.id);
    t.textContent = (o && (o.nom || o.code) ? (o.code ? o.code + " — " : "") +
      (o.nom || "emplacement") + " · " : "") +
      nbChal(n) + (n > 1 ? " consultations" : " consultation");
  });
}

/* ------------------------------------------------------------------
   Le cartouche
   ------------------------------------------------------------------ */
/** Construit une fois, à la première ouverture : la page publique n'en a pas. */
function cartoucheChaleur(){
  let c = $("chaleur");
  if (c) return c;
  c = document.createElement("div");
  c.className = "chalbar";
  c.id = "chaleur";
  c.hidden = true;
  c.innerHTML =
    '<div class="chalTete"><span class="eyebrow">Fréquentation par stand</span>' +
    '<button type="button" id="chalReduit" aria-expanded="true">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
    '</button></div>' +
    '<div class="chalPer" id="chalPer" role="group" aria-label="Période"></div>' +
    '<div class="chalEch" id="chalEch" hidden><i></i>' +
    '<div class="bornes"><span>0</span><span></span><span></span></div></div>' +
    '<p class="chalEtat" id="chalEtat"></p>' +
    '<ol class="chalTop" id="chalTop"></ol>';
  $("stage").appendChild(c);

  $("chalReduit").onclick = () => replieChaleur(!chalReduit);
  const per = $("chalPer");
  CHAL_PERIODES.forEach(([cle, lib]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = lib;
    b.dataset.per = cle;
    b.setAttribute("aria-pressed", String(cle === chalJours));
    b.onclick = () => {
      if (chalJours === cle) return;
      chalJours = cle;
      per.querySelectorAll("button").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.per === chalJours)));
      rafraichitChaleur();
    };
    per.appendChild(b);
  });
  replieChaleur(chalReduit);
  return c;
}

/**
 * Replier le cartouche sur sa légende — et non le fermer.
 *
 * Une croix se lit « fermer », et celle-ci éteignait la carte en même temps
 * que le cartouche : on masquait la légende pour mieux voir le plan, et le
 * plan repartait tout blanc. Les deux gestes n'en faisaient qu'un, ce qui
 * n'est vrai d'aucun des deux.
 *
 * Ils se séparent donc. Le chevron replie ; le bouton de la barre éteint la
 * lecture. Et ce qu'on garde en repliant, c'est l'échelle : sur une rampe
 * thermique la couleur ne dit pas seule ce qu'elle vaut, et une carte sans
 * légende n'est plus qu'un coloriage.
 */
/**
 * La hauteur du cartouche, rendue à la feuille de style.
 *
 * L'interrupteur du calque vit dans la pile, en haut à droite ; le cartouche
 * se lit en bas du même bord. Sans cette mesure il recouvrait la pile au
 * moment précis où l'on venait d'y cocher la case, et la liste des calques
 * disparaissait sous ce qu'elle venait d'allumer. La pile s'arrête donc où le
 * cartouche commence — c'est déjà ce que fait l'échelle avec le cartouche des
 * repères, et par le même chemin.
 */
function mesureCartoucheChaleur(){
  const c = $("chaleur");
  const h = c && !c.hidden ? c.offsetHeight + 12 : 0;
  racine.style.setProperty("--chalh", h + "px");
}

function replieChaleur(v){
  chalReduit = v;
  const c = $("chaleur"), b = $("chalReduit");
  if (!c || !b) return;
  c.classList.toggle("reduit", v);
  b.setAttribute("aria-expanded", String(!v));
  b.title = v ? "Déployer le cartouche" : "Replier sur la légende";
  b.setAttribute("aria-label", b.title);
  mesureCartoucheChaleur();
}

function ecritEtatChaleur(txt, erreur){
  const p = $("chalEtat");
  if (!p) return;
  p.textContent = txt;
  p.classList.toggle("err", !!erreur);
}

/** La bande de couleurs, et les nombres qu'elle vaut. */
function dessineEchelleChaleur(){
  const e = $("chalEch");
  e.hidden = CHALEUR.max <= 0;
  if (e.hidden) return;
  // les arrêts de la rampe, tous : en échantillonner cinq raterait le vert
  const arrets = THERMIQUE.join(",");
  e.querySelector("i").style.background = "linear-gradient(90deg," + arrets + ")";
  const b = e.querySelectorAll(".bornes span");
  b[1].textContent = nbChal(valeurChaleur(.5, CHALEUR.max));
  b[2].textContent = nbChal(CHALEUR.max);
}

/**
 * Le palmarès, sous la bande.
 *
 * La couleur répond à « où » ; elle répond mal à « lesquels » — dix stands
 * voisins tous rouges se ressemblent, et le premier ne se distingue pas du
 * dixième. Le rang le dit, et le clic y mène : c'est de là qu'on part pour
 * rappeler un exposant ou relouer l'emplacement d'à côté.
 */
function dessineTopChaleur(){
  const ol = $("chalTop");
  ol.innerHTML = "";
  CHALEUR.cibles.slice(0, 10).forEach((c, i) => {
    const o = parId.get(c.id);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="rang"></span><span class="code"></span>' +
                  '<span class="nom"></span><span class="n"></span>';
    b.querySelector(".rang").textContent = (i + 1) + ".";
    b.querySelector(".code").textContent = c.code || "";
    b.querySelector(".nom").textContent = c.nom || "Sans nom";
    b.querySelector(".n").textContent = nbChal(c.n);
    /* Une cible que le salon ne porte plus — stand retiré depuis, exposant
       parti — garde ses consultations mais n'a plus de forme à montrer. On la
       laisse au palmarès, la taire fausserait le total, et on retire le clic
       plutôt que de le laisser ne rien faire. */
    if (o){
      b.title = "Voir sur le plan";
      b.onclick = () => select(c.id, true);
    } else {
      b.disabled = true;
      b.title = "Cet emplacement n'est plus au plan.";
    }
    li.appendChild(b);
    ol.appendChild(li);
  });
}

/** Ce que la période a donné, en une phrase. */
function phraseChaleur(){
  const quand = chalJours === "tout" ? "depuis le début"
              : "sur les " + chalJours + " derniers jours";
  if (!CHALEUR.total){
    return CHALEUR.depuis
      ? "Aucune fiche ouverte " + quand + "."
      : "Aucune consultation de fiche enregistrée pour ce salon : " +
        "les compteurs par stand n'ont encore rien reçu.";
  }
  return nbChal(CHALEUR.total) + " fiche" + (CHALEUR.total > 1 ? "s" : "") +
    " d'exposant ouverte" + (CHALEUR.total > 1 ? "s" : "") + " " + quand + ", " +
    "sur " + nbChal(CHALEUR.par.size) + " emplacement" + (CHALEUR.par.size > 1 ? "s" : "") +
    ". Consultations, non visiteurs uniques ; les zones organisateur ne sont pas comptées." +
    (CHALEUR.depuis ? " Comptage par stand depuis le " +
      new Date(CHALEUR.depuis + "T00:00:00").toLocaleDateString("fr-FR") + "." : "");
}

async function rafraichitChaleur(){
  ecritEtatChaleur("Lecture des compteurs…");
  try {
    await chargeChaleur();
  } catch (e) {
    CHALEUR = null;
    coloreChaleur();
    $("chalEch").hidden = true;
    $("chalTop").innerHTML = "";
    ecritEtatChaleur("Fréquentation indisponible : " + e.message, true);
    mesureCartoucheChaleur();
    return;
  }
  coloreChaleur();
  dessineEchelleChaleur();
  dessineTopChaleur();
  ecritEtatChaleur(phraseChaleur());
  // la phrase et le palmarès viennent de changer de hauteur
  mesureCartoucheChaleur();
}

/* ------------------------------------------------------------------
   Ouverture et fermeture
   ------------------------------------------------------------------ */
/**
 * Allumer ou éteindre la lecture.
 *
 * La garde sur ADMIN n'est pas une ceinture de plus : c'est elle qui répond de
 * la promesse faite au panneau — ce calque ne part jamais chez les visiteurs.
 * Il ne se publie pas parce qu'il n'existe pas dans CONF, et il ne s'allume pas
 * hors de l'administration parce qu'ici on refuse de l'allumer. La page
 * publique appelle bien « coloreChaleur » comme les autres, à chaque montage :
 * elle n'y trouve rien à peindre, et c'est tout ce qu'elle en verra.
 */
function montreChaleur(v){
  if (v && !ADMIN) return;
  if (v === chalOuvert) return;
  chalOuvert = v;
  /* La case du panneau n'est pas toujours celle qu'on vient de cocher : le
     mode peut s'ouvrir au démarrage, ou depuis un autre chemin. On la remet
     d'accord plutôt que de rebâtir la pile, qui perdrait le défilement et le
     focus au moment même où l'on s'en sert. */
  const b = document.querySelector("#pile .chalCase");
  if (b) b.checked = v;
  if (!v){
    const c = $("chaleur");
    if (c) c.hidden = true;
    coloreChaleur();
    mesureCartoucheChaleur();
    return;
  }
  cartoucheChaleur().hidden = false;
  mesureCartoucheChaleur();
  rafraichitChaleur();
}

/* La hauteur disponible change avec la fenêtre, et le cartouche se replie tout
   seul sur ce qui reste : la pile doit suivre. */
addEventListener("resize", mesureCartoucheChaleur);

/**
 * Le rang du panneau des calques, sous la couche « Stands ».
 *
 * Sous elle parce que c'est elle qu'il repeint — c'est déjà la place des
 * couleurs de secteur, et pour la même raison. Et sans sélecteur de couleur,
 * seul de toute la pile : les siennes ne se choisissent pas, elles sortent des
 * chiffres et se refont à chaque changement de période. Une pastille le dit,
 * et dit l'autre chose qu'on ne devinerait pas — que ce calque reste sur ce
 * poste, quoi qu'on publie.
 */
function rangChaleur(hote){
  const d = document.createElement("div");
  d.className = "calq sous";
  d.innerHTML = '<label><input type="checkbox" class="chalCase"><span></span></label>';
  const nom = d.querySelector("label span");
  nom.textContent = "Carte de chaleur";
  const p = document.createElement("i");
  p.className = "rle";
  p.textContent = "non publié";
  p.title = "Une lecture pour l'exploitant : ce calque ne part jamais sur le plan public, " +
            "et la publication de la configuration ne l'emporte pas.";
  nom.after(p);
  const c = d.querySelector("input");
  c.checked = chalOuvert;
  c.onchange = (e) => montreChaleur(e.target.checked);
  hote.appendChild(d);
}

/* ============================================================
   Remise à zéro des compteurs

   La recette d'un plan se fait sur le plan : on ouvre des fiches, on cherche
   une enseigne, on calcule un itinéraire — et sur la page publique, la seule
   qui mesure. Ces gestes sont ceux de l'exploitant, et ils comptent comme ceux
   d'un visiteur : rien ne les en distingue à l'écriture, puisque la page
   publique ne regarde aucune session. C'est ce qui lui permet de ne poser ni
   cookie ni identité, et c'est pourquoi le premier chiffre d'un salon est
   toujours faux.

   On ne peut pas deviner quand la recette s'arrête : la veille de l'ouverture,
   rien ne dit au système que les visites qui suivent sont les vraies. C'est
   donc un geste, et un geste qu'on protège — il n'y a pas de sauvegarde
   derrière, et personne ne se relit deux fois avant de cliquer « Oui ».
   ============================================================ */
const NOM_VOLET_MESURE = "Mesure";
const MOT_RAZ = "réinitialiser";

/* Le mot se compare sans ses accents : on demande une intention, pas une
   disposition de clavier. Tout le reste — la casse, les espaces autour —
   tombe de même. */
const aplati = (t) => String(t || "").trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/** Le volet « Mesure » des réglages : ce que comptent les compteurs, et le
 *  seul chemin pour les effacer. */
function voletMesure(hote){
  const p = document.createElement("p");
  p.textContent = "Le plan compte ce qu'on en fait : visites, recherches, " +
    "itinéraires, et les fiches ouvertes stand par stand. Ces chiffres " +
    "nourrissent le rapport d'utilisation et la carte de chaleur.";
  hote.appendChild(p);

  const q = document.createElement("p");
  q.textContent = "La recette gonfle ces compteurs — les fiches qu'on ouvre " +
    "pour vérifier le plan sont comptées comme des visites, la page publique " +
    "ne sachant pas qui la regarde. Remettez-les à zéro le jour où le salon " +
    "ouvre, pour que le premier chiffre soit le bon.";
  hote.appendChild(q);

  const acts = document.createElement("div");
  acts.className = "acts";
  const b = document.createElement("button");
  b.type = "button";
  b.className = "btn danger";
  b.textContent = "Réinitialiser les compteurs…";
  b.onclick = ouvreRemiseAZero;
  acts.appendChild(b);
  hote.appendChild(acts);
}

/** L'identifiant du salon en base, retrouvé depuis son slug et retenu. */
async function evenementCourant(acces){
  if (_evtChaleur) return _evtChaleur;
  const evt = await base(acces,
    "evenement?select=id&slug=eq." + encodeURIComponent(DATA.slug));
  if (!evt.length) throw new Error("événement introuvable");
  _evtChaleur = evt[0].id;
  return _evtChaleur;
}

/**
 * La fenêtre de confirmation.
 *
 * Elle fait trois choses, et la troisième est la moins évidente. Elle dit ce
 * qui part et ce qui reste. Elle demande d'écrire le mot en toutes lettres —
 * un bouton rouge se clique par réflexe, une phrase se tape en connaissance de
 * cause. Et elle va chercher les chiffres en cours avant de laisser faire :
 * cela met un nombre sur ce qu'on s'apprête à perdre, et cela prouve au
 * passage que la base répond, plutôt que de le découvrir après avoir tapé.
 */
function ouvreRemiseAZero(){
  let tally = null;

  ouvreModale("Réinitialiser les compteurs", corps => {
    const perd = document.createElement("p");
    perd.innerHTML = "<b>Toute la mesure de ce salon sera effacée</b> : visites, " +
      "visiteurs, recherches, itinéraires, programmes de visite, et les " +
      "consultations de chaque stand. Le rapport d'utilisation et la carte de " +
      "chaleur repartent de zéro, pour tous les comptes.";
    corps.appendChild(perd);

    const garde = document.createElement("p");
    garde.textContent = "Le plan lui-même n'est pas touché : emplacements, " +
      "exposants, dessins, calques et réglages restent tels quels.";
    corps.appendChild(garde);

    const jamais = document.createElement("p");
    jamais.className = "alerte";
    jamais.textContent = "Cette action est irréversible. Aucune sauvegarde n'est " +
      "conservée : ces chiffres ne pourront pas être retrouvés.";
    corps.appendChild(jamais);

    const etat = document.createElement("p");
    etat.className = "etatRaz";
    etat.textContent = "Lecture des compteurs en cours…";
    corps.appendChild(etat);

    const l = document.createElement("label");
    l.className = "razMot";
    l.innerHTML = '<span></span><input type="text" class="nomcalque" ' +
      'autocomplete="off" autocapitalize="none" spellcheck="false">';
    l.querySelector("span").textContent =
      "Pour confirmer, tapez « " + MOT_RAZ + " » :";
    corps.appendChild(l);

    const saisie = l.querySelector("input");
    const bouton = () => $("mPied").querySelector(".danger");
    const relit = () => {
      const b = bouton();
      if (b) b.disabled = aplati(saisie.value) !== aplati(MOT_RAZ) || !tally;
    };
    saisie.oninput = relit;
    saisie.onkeydown = (e) => {
      const b = bouton();
      if (e.key === "Enter" && b && !b.disabled){ e.preventDefault(); b.click(); }
    };

    /* Les chiffres en cours. Tant qu'ils ne sont pas là, le bouton reste
       fermé : on ne détruit pas ce qu'on n'a pas pu lire. */
    (async () => {
      const acces = accesBase();
      if (!acces) throw new Error("session absente, reconnectez-vous");
      const evt = await evenementCourant(acces);
      return base(acces, "rpc/rapport_utilisation", {
        method: "POST",
        // sans période : ce qu'on s'apprête à effacer, c'est tout l'historique
        body: JSON.stringify({ p_evenement: evt }),
      });
    })().then(r => {
      tally = r || {};
      const n = (v) => nbChal(v);
      etat.textContent = tally.depuis
        ? "À effacer : " + n(tally.visites) + " visite" + (tally.visites > 1 ? "s" : "") +
          ", " + n(tally.visiteurs) + " visiteur" + (tally.visiteurs > 1 ? "s" : "") +
          ", " + n(tally.recherches) + " recherche" + (tally.recherches > 1 ? "s" : "") +
          ", " + n(tally.stands && tally.stands.total) + " fiche" +
          ((tally.stands && tally.stands.total) > 1 ? "s" : "") + " d'exposant, " +
          "mesurés depuis le " +
          new Date(tally.depuis).toLocaleDateString("fr-FR") + "."
        : "Ce salon n'a encore aucune mesure : il n'y a rien à effacer.";
      relit();
    }).catch(e => {
      etat.textContent = "Compteurs illisibles : " + e.message +
        " — la remise à zéro échouerait de même.";
      etat.classList.add("err");
    });

    setTimeout(() => saisie.focus(), 60);
  }, [
    // revenir d'où l'on vient : la fenêtre des réglages a été remplacée
    { libelle: "Annuler", action: () => ouvreReglages(NOM_VOLET_MESURE) },
    { libelle: "Réinitialiser", genre: "danger", ferme: false, action: lanceRemiseAZero },
  ]);

  const b = $("mPied").querySelector(".danger");
  if (b) b.disabled = true;
}

/** L'effacement lui-même, et le compte rendu de ce qui est parti. */
async function lanceRemiseAZero(){
  const b = $("mPied").querySelector(".danger");
  const etat = $("mCorps").querySelector(".etatRaz");
  if (b){ b.disabled = true; b.textContent = "Effacement…"; }
  try {
    const acces = accesBase();
    if (!acces) throw new Error("session absente, reconnectez-vous");
    const evt = await evenementCourant(acces);
    const r = await base(acces, "rpc/reinitialise_compteurs", {
      method: "POST", body: JSON.stringify({ p_evenement: evt }),
    });
    const n = Number(r?.compteurs || 0) + Number(r?.cibles || 0) +
              Number(r?.visiteurs || 0) + Number(r?.journal || 0);

    /* La carte est peut-être ouverte derrière : elle montrerait des couleurs
       qui ne reposent plus sur rien. */
    if (chalOuvert) rafraichitChaleur();

    $("mCorps").innerHTML = "";
    const p = document.createElement("p");
    p.textContent = n
      ? "Compteurs remis à zéro : " + nbChal(n) + " ligne" + (n > 1 ? "s" : "") +
        " effacée" + (n > 1 ? "s" : "") + ". Le salon repart de zéro."
      : "Il n'y avait aucune mesure à effacer.";
    $("mCorps").appendChild(p);
    $("mPied").innerHTML = "";
    const f = document.createElement("button");
    f.className = "btn";
    f.textContent = "Fermer";
    f.onclick = fermeModale;
    $("mPied").appendChild(f);
  } catch (e) {
    if (etat){
      etat.textContent = "Remise à zéro impossible : " + e.message;
      etat.classList.add("err");
    }
    if (b){ b.disabled = false; b.textContent = "Réinitialiser"; }
  }
}
/* ============================================================
   15. La suggestion — un exposant de plus, pour compléter la visite

   Un visiteur qui retient quatre enseignes du même secteur ne compose pas une
   liste au hasard : il cherche quelque chose, et sa liste le dit avant lui. Le
   tiroir du parcours lui propose alors un exposant de plus, pris dans ce qui
   revient déjà — le plus consulté du salon sur ce critère, ou celui que
   l'organisateur a désigné.

   Rien ne quitte l'appareil pour autant : le rapprochement se fait sur la
   liste qu'il a sous les yeux, avec des tables préparées en administration et
   publiées comme le reste des réglages. Le plan ne demande rien au serveur, et
   ne lui apprend pas ce que le visiteur retient.

   D'où la forme de ces tables. Les compteurs d'usage ne sont lisibles que d'un
   compte qui a accès au salon — `audience_cibles` est en « security invoker »,
   et le plan public n'y entrera jamais. Le classement est donc relevé en
   administration, réduit à ce que la suggestion en fera — les trois exposants
   les plus consultés de chaque valeur — et c'est ce relevé qui part aux
   visiteurs. Publier le classement entier aurait dit à tout le monde quel
   stand personne n'ouvre ; trois noms par valeur ne disent que ce qu'ils
   proposent.
   ============================================================ */
const NOM_VOLET_SUGGESTION = "Suggestion";

/* Trois exposants du même critère : deux sont une coïncidence, quatre une
   habitude. C'est le seuil qu'on propose, pas celui qu'on impose. */
const SUGG_SEUIL_DEFAUT = 3, SUGG_SEUIL_MIN = 2, SUGG_SEUIL_MAX = 12;

/* Combien de noms on retient par valeur. Un seul suffirait si le visiteur ne
   l'avait jamais dans sa liste — mais c'est précisément le plus consulté du
   secteur, donc souvent le premier qu'il a retenu. Trois laissent de quoi
   proposer quand même, sans publier un classement. */
const SUGG_CHAMPIONS = 3;

/* Ce que le visiteur a écarté d'un revers de main, le temps de cette page.
   En mémoire et non dans son stockage : un refus porte sur l'instant — la
   liste qu'il avait alors, l'exposant qu'on lui mettait sous les yeux — et le
   retenir d'une visite à l'autre condamnerait un exposant sans raison. */
const SUGG_ECARTES = new Set();

/* ------------------------------------------------------------
   Le réglage
   ------------------------------------------------------------ */
const reglageSugg = () => conf("_suggestion");

function seuilSugg(){
  const v = Math.round(+reglageSugg().seuil);
  return v >= SUGG_SEUIL_MIN && v <= SUGG_SEUIL_MAX ? v : SUGG_SEUIL_DEFAUT;
}

/** Le critère sur lequel on rapproche, s'il désigne encore quelque chose. Un
 *  champ décoché dans la console, ou des secteurs éteints depuis, ne le font
 *  pas : la suggestion se tait plutôt que de rapprocher sur du vide. */
function critereSugg(){
  const cle = reglageSugg().critere;
  return cle && clesCriteres().indexOf(cle) >= 0 ? cle : null;
}

/* ------------------------------------------------------------
   Ce que le salon porte, vu du critère

   Un relevé par valeur, en un seul passage. Interroger chaque valeur à son
   tour rebalayait les neuf cents stands autant de fois qu'un salon range de
   villes — et c'est le rangement par ville qui en compte le plus.
   ------------------------------------------------------------ */
function indexSugg(cle){
  const par = new Map();
  TOUS.forEach(o => {
    // sans nom, un emplacement n'a personne à proposer
    if (o.kind !== "stand" || !o.nom) return;
    /* Dédoublonné par fiche : une liste à choix multiple peut porter deux fois
       la même valeur, et l'exposant compterait deux fois dans la sienne. */
    new Set(valeursCritere(o, cle)).forEach(v => {
      if (!par.has(v)) par.set(v, []);
      par.get(v).push(o);
    });
  });
  return par;
}

/**
 * Les valeurs sur lesquelles une suggestion peut tomber, de la plus portée à
 * la moins portée.
 *
 * Deux exposants ne suffisent pas, même au seuil le plus bas : il faudrait que
 * le visiteur les retienne tous les deux pour l'atteindre, et il ne resterait
 * alors personne à proposer. On s'arrête donc à trois — ce qui écarte du même
 * coup la longue traîne des valeurs qu'un seul exposant porte, et garde la
 * liste des réglages lisible sur un salon rangé par ville.
 */
function valeursSugg(cle){
  return [...indexSugg(cle)]
    .filter(([, l]) => l.length >= 3)
    .sort((a, b) => (b[1].length - a[1].length) || COLLATION.compare(a[0], b[0]))
    .map(([v, l]) => ({ v, expos: l }));
}

/* ------------------------------------------------------------
   Côté visiteur
   ------------------------------------------------------------ */
/**
 * Ce qu'on propose, et pourquoi — ou rien.
 *
 * La valeur qui revient le plus l'emporte, et l'on descend jusqu'à en trouver
 * une qui ait encore quelqu'un à proposer : un visiteur qui a déjà retenu les
 * trois enseignes que le relevé connaît pour son secteur n'en est pas quitte
 * pour autant — le deuxième secteur de sa liste prend le relais, s'il atteint
 * lui aussi le seuil.
 */
function suggestionCourante(){
  const r = reglageSugg();
  if (r.active !== true) return null;
  // le parcours retiré, il n'y a plus de tiroir où poser la proposition
  if (conf("_parcours").visible === false) return null;
  const cle = critereSugg();
  if (!cle) return null;

  const seuil = seuilSugg();
  const retenus = PARCOURS.stands.map(id => parId.get(id)).filter(Boolean);
  if (retenus.length < seuil) return null;

  const compte = new Map();
  retenus.forEach(o => new Set(valeursCritere(o, cle))
    .forEach(v => compte.set(v, (compte.get(v) || 0) + 1)));

  const fortes = [...compte].filter(([, n]) => n >= seuil)
    .sort((a, b) => (b[1] - a[1]) || COLLATION.compare(a[0], b[0]));
  for (const [v, n] of fortes){
    const o = exposantPropose(cle, v);
    if (o) return { cle: cle, valeur: v, n: n, o: o };
  }
  return null;
}

/**
 * L'exposant que cette valeur appelle, s'il en reste un.
 *
 * Les deux provenances rendent la même chose — des identifiants, dans l'ordre
 * où on les proposera — et se lisent donc pareil. Ce qui les sépare est en
 * amont : l'une est relevée dans les compteurs, l'autre écrite à la main.
 */
function exposantPropose(cle, v){
  const r = reglageSugg();
  const pris = new Set(PARCOURS.stands.map(String));
  const ids = r.source === "fixe"
    ? [(r.fixes || {})[v]]
    : ((r.auto || {})[v] || []);
  for (const id of ids){
    const o = id ? parId.get(String(id)) : null;
    /* Déjà dans la liste, il ne la compléterait pas ; démonté depuis le
       relevé, il n'est plus nulle part ; écarté, on vient de le dire. */
    if (o && o.kind === "stand" && o.nom &&
        !pris.has(String(o.id)) && !SUGG_ECARTES.has(String(o.id))) return o;
  }
  return null;
}

/** « Agroalimentaire », ou l'intitulé du champ quand la valeur ne dit rien
 *  d'elle-même : un oui/non ne se coche que sous le nom de sa question. */
const nomValeurSugg = (cle, v) => OUI_NON[cle] ? libelleCritere(cle) : v;

/**
 * La carte, au bas du tiroir du parcours.
 *
 * Elle dit d'abord pourquoi elle est là. Une proposition qui tombe sans motif
 * se lit comme de la réclame ; la même, précédée de ce qu'on vient de retenir
 * quatre fois, se lit comme une suite.
 */
function poseSuggestion(hote){
  const s = suggestionCourante();
  if (!s) return;

  const d = document.createElement("div");
  d.className = "pSugg";
  d.innerHTML = '<div class="sTete"><span class="eyebrow">Pour compléter votre visite</span>' +
    '<button type="button" class="sEcarte" title="Ne plus me proposer celui-ci" ' +
    'aria-label="Ne plus me proposer celui-ci">&times;</button></div>' +
    '<p class="sMotif"></p>' +
    '<div class="pRang"><button type="button" class="pOuvre">' +
    '<span class="pt"></span><span class="ps"></span></button>' +
    signetParcours("stand", s.o.id) + "</div>";

  d.querySelector(".sMotif").textContent =
    "« " + nomValeurSugg(s.cle, s.valeur) + " » revient " + s.n +
    " fois dans votre liste" +
    (OUI_NON[s.cle] ? "" : " (" + libelleCritere(s.cle).toLowerCase() + ")") + ".";

  const o = s.o;
  d.querySelector(".pt").textContent = o.nom;
  d.querySelector(".ps").textContent =
    DATA.plans[o.p].libelle + (o.code ? " · " + o.code : "");
  /* Aller le voir, c'est vouloir le voir sur le plan : la fiche s'ouvre et le
     tiroir se retire, comme pour un rang du parcours. */
  d.querySelector(".pOuvre").onclick = () => select(o.id, true, "parcours");
  d.querySelector(".sEcarte").onclick = () => {
    SUGG_ECARTES.add(String(o.id));
    remplitParcours();
  };
  hote.appendChild(d);
  // le signet vit comme les autres : il ajoute, il compte, et il se retourne
  brancheParcours(d);
}

/* ------------------------------------------------------------
   Côté administration
   ------------------------------------------------------------ */
/**
 * Le classement d'activité, relevé dans les compteurs et réduit par valeur.
 *
 * `audience_cibles` rend les cibles consultées, de la plus ouverte à la moins
 * ouverte, et seulement celles que quelqu'un a ouvertes : un salon qui n'a pas
 * encore ouvert rend une liste vide, et la suggestion se tait plutôt que de
 * proposer au hasard un exposant qu'elle annonce comme le plus consulté.
 */
async function relevePalmares(cle){
  const acces = accesBase();
  if (!acces) throw new Error("session absente, reconnectez-vous");
  const evt = await evenementCourant(acces);
  const r = await base(acces, "rpc/audience_cibles", {
    method: "POST",
    body: JSON.stringify({ p_evenement: evt, p_jours: null, p_genre: "fiche_stand" }),
  });
  const rang = new Map(((r && r.cibles) || []).map((c, i) => [String(c.id), i]));
  const auto = {};
  valeursSugg(cle).forEach(({ v, expos }) => {
    const l = expos.filter(o => rang.has(String(o.id)))
      .sort((a, b) => rang.get(String(a.id)) - rang.get(String(b.id)))
      .slice(0, SUGG_CHAMPIONS).map(o => String(o.id));
    if (l.length) auto[v] = l;
  });
  return auto;
}

/** « G55 — SMC2 », pour une liste de choix. */
const etiquetteSugg = (o) => [o.code, o.nom].filter(Boolean).join(" — ") || o.id;

/**
 * Le volet « Suggestion » des réglages.
 *
 * Le corps se redessine à chaque choix plutôt que de tout montrer d'avance :
 * le classement et la liste des exposants choisis à la main ne se lisent pas
 * ensemble — ils répondent à la même question, et la seconde réponse qu'on ne
 * suit pas se lit comme un réglage oublié.
 */
function voletSuggestion(hote){
  const p = document.createElement("p");
  p.textContent = "Un exposant de plus, proposé au bas du parcours de visite " +
    "quand plusieurs de ceux qu'un visiteur a retenus se ressemblent. Le " +
    "rapprochement se fait sur son appareil, à partir de tables préparées " +
    "ici : rien de ce qu'il retient ne remonte jamais.";
  hote.appendChild(p);

  if (conf("_parcours").visible === false){
    const a = document.createElement("p");
    a.className = "alerte";
    a.textContent = "Le parcours de visite est retiré de ce plan, dans " +
      "l'onglet « Plan » : sans lui, il n'y a ni liste à compléter ni tiroir " +
      "où poser la proposition.";
    hote.appendChild(a);
  }

  const cles = clesCriteres();
  if (!cles.length){
    const a = document.createElement("p");
    a.className = "alerte";
    a.textContent = "Aucun critère n'est réglé sur ce salon : le " +
      "rapprochement n'a rien sur quoi se faire. Les champs qui font des " +
      "critères se désignent dans la console, sur la fiche du salon ; le " +
      "secteur en est un dès que « Montrer les secteurs » est coché.";
    hote.appendChild(a);
    return;
  }

  const r = reglageSugg();

  const bloc = document.createElement("div");
  bloc.className = "reglages";
  const l = document.createElement("label");
  l.innerHTML = '<input type="checkbox"><span></span>';
  l.querySelector("span").textContent = "Proposer un exposant pour compléter le parcours";
  const marche = l.querySelector("input");
  marche.checked = r.active === true;
  bloc.appendChild(l);
  hote.appendChild(bloc);

  const corps = document.createElement("div");
  corps.className = "voletSugg";
  hote.appendChild(corps);

  marche.onchange = e => {
    r.active = e.target.checked;
    enregistreConf();
    glisseFenetre(dessine);
    // le tiroir ouvert derrière la fenêtre obéit sur-le-champ
    rafraichitParcours();
  };

  /* Ce qui se lit sous la case, et qui dépend de tout ce qui précède : le
     critère décide des valeurs, la provenance décide de ce qu'on en montre. */
  function dessine(){
    corps.innerHTML = "";
    if (r.active !== true) return;
    /* Un salon qui vient d'allumer la suggestion n'a pas de critère retenu : le
       premier de la liste est celui que la console range en tête, et le plus
       large — le secteur quand il y en a un. Retenu pour de bon, et non le
       temps d'afficher la liste : c'est déjà celui sur lequel les visiteurs
       seront rapprochés. */
    if (!critereSugg()){ r.critere = cles[0]; enregistreConf(); }

    const crit = champZone(corps, "Critère de rapprochement",
      document.createElement("select"),
      "Ce que plusieurs exposants d'une même liste doivent avoir en commun " +
      "pour qu'on en propose un de plus. Ce sont les critères de recherche du " +
      "salon, ceux-là mêmes que le visiteur peut cocher.");
    crit.innerHTML = cles.map(c =>
      '<option value="' + esc(c) + '">' + esc(libelleCritere(c)) + "</option>").join("");
    crit.value = r.critere;
    crit.onchange = e => {
      r.critere = e.target.value;
      /* Les tables sont rangées par valeur, et les valeurs d'un autre champ ne
         désignent rien ici : les garder aurait laissé un réglage invisible
         décider de ce qu'on propose. */
      delete r.fixes; delete r.auto; delete r.releve;
      enregistreConf();
      glisseFenetre(dessine);
      rafraichitParcours();
    };

    const seuil = document.createElement("div");
    seuil.className = "reglage-nb";
    seuil.innerHTML = '<label><span class="l"></span>' +
      '<input type="number" min="' + SUGG_SEUIL_MIN + '" max="' + SUGG_SEUIL_MAX + '" step="1">' +
      '<span class="u">exposants</span></label><span class="aide"></span>';
    seuil.querySelector(".l").textContent = "Déclencher à partir de";
    seuil.querySelector(".aide").textContent =
      "Combien d'exposants d'une même valeur doivent figurer dans le parcours " +
      "avant qu'on en propose un autre. Plus bas, la proposition arrive tôt et " +
      "au jugé ; plus haut, elle se fait attendre.";
    const nb = seuil.querySelector("input");
    nb.value = seuilSugg();
    /* Un champ vidé le temps de retaper ne doit rien écrire : on ne retient
       que ce qui tient dans les bornes, et le champ se remet d'aplomb quand on
       le quitte — comme le temps de visite, dans l'onglet « Plan ». */
    nb.oninput = e => {
      const v = Math.round(+e.target.value);
      if (v >= SUGG_SEUIL_MIN && v <= SUGG_SEUIL_MAX){
        r.seuil = v; enregistreConf(); rafraichitParcours();
      }
    };
    nb.onblur = () => { nb.value = seuilSugg(); };
    corps.appendChild(seuil);

    const source = champZone(corps, "Exposant proposé",
      document.createElement("select"),
      "D'où vient le nom qu'on met sous les yeux du visiteur.");
    source.innerHTML =
      '<option value="activite">Le plus consulté du salon, dans cette valeur</option>' +
      '<option value="fixe">Un exposant choisi, un par valeur</option>';
    source.value = r.source === "fixe" ? "fixe" : "activite";
    source.onchange = e => {
      r.source = e.target.value;
      enregistreConf();
      glisseFenetre(dessine);
      rafraichitParcours();
    };

    if (r.source === "fixe") choixFixes(corps); else palmaresEnPlace(corps);
  }

  /* --- la provenance « le plus consulté » --- */
  function palmaresEnPlace(hote2){
    const cle = r.critere;
    const valeurs = valeursSugg(cle);
    const bloc2 = document.createElement("div");
    bloc2.className = "champZ";
    bloc2.innerHTML = '<span class="tZ">Classement</span>' +
      '<p class="aideZ">Relevé dans les compteurs d\'usage, sur toute la vie ' +
      'du salon. Il ne part aux visiteurs que réduit à ce qu\'il en faut — les ' +
      'trois exposants les plus consultés de chaque valeur — et jamais entier : ' +
      'le classement d\'un salon ne regarde que son organisateur.</p>' +
      '<p class="etatZ"></p><div class="acts"></div><div class="suggVals"></div>';
    hote2.appendChild(bloc2);
    const etat = bloc2.querySelector(".etatZ");
    const liste = bloc2.querySelector(".suggVals");

    const ecrit = () => {
      const auto = r.auto || {};
      const n = Object.keys(auto).length;
      etat.dataset.mal = "false";
      etat.textContent = r.releve
        ? n + (n > 1 ? " valeurs ont" : " valeur a") + " un exposant à proposer, " +
          "sur " + valeurs.length + " · relevé le " +
          new Date(r.releve).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" })
        : "Aucun relevé pour l'instant : la suggestion se tait tant qu'elle " +
          "n'a pas de classement.";
      liste.innerHTML = "";
      valeurs.forEach(({ v, expos }) => {
        const ids = auto[v] || [];
        const chef = ids.length ? parId.get(String(ids[0])) : null;
        const rang = document.createElement("div");
        rang.className = "rang";
        rang.innerHTML = '<span class="nV"></span><span class="vV"></span>' +
          '<span class="cV"></span>';
        rang.querySelector(".nV").textContent = nomValeurSugg(cle, v);
        rang.querySelector(".vV").textContent = chef
          ? chef.nom : "personne n'a encore été consulté ici";
        if (!chef) rang.querySelector(".vV").classList.add("rien");
        rang.querySelector(".cV").textContent = expos.length + " exposants";
        liste.appendChild(rang);
      });
    };

    const acts = bloc2.querySelector(".acts");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.textContent = "Relever le classement";
    acts.appendChild(b);

    const releve = (dire) => {
      b.disabled = true;
      if (dire){ etat.dataset.mal = "false"; etat.textContent = "Lecture des compteurs…"; }
      return relevePalmares(cle).then(auto => {
        /* On n'écrit que si quelque chose a bougé : ce volet se relève à chaque
           ouverture, et republier un relevé identique ferait repartir la
           configuration entière pour rien. */
        if (JSON.stringify(auto) !== JSON.stringify(r.auto || {}) || !r.releve){
          r.auto = auto;
          r.releve = new Date().toISOString();
          enregistreConf();
          rafraichitParcours();
        }
        b.disabled = false;
        glisseFenetre(ecrit);
      }).catch(e => {
        b.disabled = false;
        /* Un relevé qui échoue ne retire rien : le précédent reste en place et
           continue de servir, on dit seulement qu'il n'a pas été rafraîchi. */
        ecrit();
        etat.dataset.mal = "true";
        etat.textContent = "Classement non rafraîchi : " + e.message;
      });
    };

    b.onclick = () => releve(true);
    ecrit();
    /* Et d'office en arrivant : un classement qu'il faut penser à rafraîchir
       est un classement périmé le jour du salon. */
    releve(false);
  }

  /* --- la provenance « un exposant choisi » --- */
  function choixFixes(hote2){
    const cle = r.critere;
    const valeurs = valeursSugg(cle);
    const bloc2 = document.createElement("div");
    bloc2.className = "champZ";
    bloc2.innerHTML = '<span class="tZ">Un exposant par valeur</span>' +
      '<p class="aideZ">Chaque liste ne propose que les exposants qui portent ' +
      'cette valeur : ce qu\'on met sous les yeux du visiteur doit ressembler ' +
      'à ce qu\'il a retenu. Une valeur laissée vide ne propose rien, et le ' +
      'plan passe à la suivante.</p><div class="suggVals"></div>';
    hote2.appendChild(bloc2);
    const liste = bloc2.querySelector(".suggVals");

    /* Ce que le volet ne montre plus ne doit plus décider de rien : un exposant
       désigné puis démonté, une valeur retombée sous les trois exposants qu'il
       lui faut. L'un s'afficherait « aucun » pendant que le réglage continue de
       le nommer, l'autre proposerait sans que rien ne le dise ici. On les
       retire pour de bon, en une fois. */
    let perimes = false;
    Object.keys(r.fixes || {}).forEach(v => {
      if (!valeurs.some(x => x.v === v)){ delete r.fixes[v]; perimes = true; }
    });

    valeurs.forEach(({ v, expos }) => {
      const rang = document.createElement("div");
      rang.className = "rang";
      rang.innerHTML = '<span class="nV"></span><select></select>' +
        '<span class="cV"></span>';
      rang.querySelector(".nV").textContent = nomValeurSugg(cle, v);
      rang.querySelector(".cV").textContent = expos.length + " exposants";
      const s = rang.querySelector("select");
      s.innerHTML = '<option value="">— aucun —</option>' +
        expos.slice().sort((a, b) => COLLATION.compare(String(a.nom), String(b.nom)))
          .map(o => '<option value="' + esc(o.id) + '">' +
                    esc(etiquetteSugg(o)) + "</option>").join("");
      const garde = String((r.fixes || {})[v] || "");
      s.value = garde;
      if (garde && s.value !== garde){ delete r.fixes[v]; perimes = true; }
      s.onchange = e => {
        const f = r.fixes || (r.fixes = {});
        if (e.target.value) f[v] = e.target.value; else delete f[v];
        enregistreConf();
        rafraichitParcours();
      };
      liste.appendChild(rang);
    });

    if (perimes){ enregistreConf(); rafraichitParcours(); }
  }

  dessine();
}
/* ============================================================
   12. Démarrage
   ============================================================ */
/* ------------------------------------------------------------------
   Démarrage : données figées si elles sont dans la page, sinon appel
   à l'API. Une panne du réseau doit se voir, pas laisser un écran vide.
   ------------------------------------------------------------------ */
function demarre(d){
  indexe(d);
  montePlan();
  fit();
  liste();
  // le plan chargé, le bouton peut dire où en est l'enregistrement
  majAttente();
  /* Et ce qu'une session précédente n'a pas réussi à enregistrer — onglet fermé
     trop vite, réseau coupé — repart de lui-même : c'est la seule occasion de
     le rattraper, personne ne viendra cliquer pour lui. */
  rattrapeRetard();
  // le plan est manipulable : le fond peut arriver derrière
  chargeFond(state.plan);
  const v = decodeURIComponent((location.hash || "").slice(1)).toLowerCase();
  if (v && v !== "admin"){
    const cible = TOUS.find(o => String(o.code || "").toLowerCase() === v);
    if (cible) setTimeout(() => select(cible.id, true, "lien"), 80);
  }
}

function annonce(txt, erreur){
  const l = $("list");
  l.innerHTML = '<div class="empty"></div>';
  l.querySelector(".empty").textContent = txt;
  if (erreur) l.querySelector(".empty").style.color = "var(--rouge, #C2372B)";
  /* La ligne du compte se tait hors recherche ; l'état du chargement y passe
     quand même, c'est là qu'on le lit. */
  $("count").hidden = false;
  $("countTxt").textContent = erreur ? "Indisponible" : "Chargement…";
  // plus rien n'arrivera : le titre neutre est définitif, il cesse d'attendre
  if (erreur) $("titre").classList.remove("attente");
}

/**
 * En-têtes de l'appel. En administration on présente sa session : c'est elle
 * qui donne accès aux événements encore en brouillon. Ils sont lus à chaque
 * appel, pas au démarrage : la session n'existe qu'une fois l'identité vérifiée.
 */
function entetesApi(){
  const e = {};
  if (document.documentElement.dataset.role !== "admin") return e;
  try {
    const cfg = JSON.parse(localStorage.getItem("console-config") || "null")
                || window.PLAN_CONFIG || null;
    const ses = JSON.parse(localStorage.getItem("console-session") || "null");
    if (cfg?.anonKey && ses?.access_token){
      e["apikey"] = cfg.anonKey;
      e["Authorization"] = "Bearer " + ses.access_token;
    }
  } catch (err) {}
  return e;
}

/**
 * Le fond d'un pavillon : cinquante fois le poids des stands, et purement
 * décoratif. On le charge après coup, une seule fois par pavillon, et on
 * l'injecte s'il concerne encore celui qu'on regarde. Son adresse porte une
 * empreinte de ce qu'il contient : le navigateur le garde indéfiniment, et ne
 * le redemande que lorsque le dessin servi n'est plus le même.
 */
const _fonds = new Map();
function chargeFond(i){
  const p = DATA?.plans?.[i];
  if (!p || !API) return Promise.resolve();
  if (p.fond.length === 0 || p.fond.every(c => c.svg !== undefined)) return Promise.resolve();
  if (_fonds.has(p.id)) return _fonds.get(p.id);

  /* La version vient du service, qui la calcule sur ce qu'il servira vraiment :
     l'empreinte des dessins, sa façon de les découper, et — pour un visiteur,
     seul à recevoir un fond découpé — ce que l'apparence en montre. Tant
     qu'elle ne bouge pas, il n'y a rien à retélécharger ; dès qu'elle bouge,
     le navigateur ne peut pas resservir l'ancien. Un salon servi par une
     version antérieure du service n'en porte pas : on retombe alors sur
     l'horodatage de synchronisation, qui était la règle jusqu'ici. */
  const q = API + "?slug=" + encodeURIComponent(SLUG) +
            "&fond=" + encodeURIComponent(p.id) +
            "&v=" + encodeURIComponent(p.versionFond || DATA.genereLe || "0");
  const promesse = fetch(q, { headers: entetesApi() })
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(d => {
      const par = new Map((d.calques || []).map(c => [c.cle, c.svg]));
      p.fond.forEach(c => { c.svg = par.get(c.cle) || ""; });
      // le pavillon a pu changer pendant le chargement
      if (state.plan === i){ monteHabillage(); ordonneDom(); appliqueApparence(); }
    })
    .catch(e => {
      _fonds.delete(p.id);          // une panne réseau ne doit pas être définitive
      console.warn("Fond de plan indisponible :", e.message);
    });
  _fonds.set(p.id, promesse);
  return promesse;
}

function charge(){
  annonce("Chargement du plan…");
  const entetes = entetesApi();
  // La demande a pu partir dès l'en-tête de la page, avant même que le reste
  // soit lu : on la récupère plutôt que d'en lancer une seconde. En
  // administration elle n'existe pas — il faut y présenter sa session.
  const depart = (!entetes.Authorization && window.__plan) || fetch(
    API + "?slug=" + encodeURIComponent(SLUG),
    // un brouillon ne doit pas rester dans le cache du navigateur
    { headers: entetes, cache: entetes.Authorization ? "no-store" : "default" });
  window.__plan = null;
  return depart
    .then(r => {
      // session périmée : on repasse par l'écran de connexion plutôt que
      // d'afficher une erreur dans laquelle l'exploitant ne peut rien faire
      if (r.status === 401 && typeof ecranAcces === "function"){
        try { localStorage.removeItem("console-session"); } catch (e) {}
        ecranAcces("Session expirée, reconnectez-vous.");
        return Promise.reject(new Error("Session expirée."));
      }
      return r.ok ? r.json()
                  : r.json().then(j => Promise.reject(new Error(j.erreur || ("HTTP " + r.status))));
    })
    .then(d => {
      if (!d.plans?.length) throw new Error("Aucun pavillon : lancez une synchronisation depuis la console.");
      demarre(d);
    })
    .catch(e => annonce("Plan indisponible : " + e.message, true));
}

const fige = document.getElementById("data").textContent.trim();
if (fige && fige.indexOf("__DATA__") < 0) demarre(JSON.parse(fige));
else if (!API) annonce("Aucune source de données configurée.", true);
// en administration, on attend la session : sans elle les brouillons sont invisibles
else if (document.documentElement.dataset.role === "admin") annonce("Vérification de l'identité…");
else charge();

// les mesures de texte dépendent des polices : on retrace une fois chargées
// les polices peuvent arriver avant les données : on ne retrace que si
// quelque chose est déjà affiché
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { if (DATA && view){ _lg.clear(); libelles(); } });

addEventListener("resize", () => { if (DATA && view) fit(); });



/* ============================================================
   Accès à l'administration du plan
   Cette page n'existe que pour l'exploitant. On réutilise la session ouverte
   dans la console : même projet, même compte, mêmes clés locales.
   ============================================================ */
const CLE_CFG_A = "console-config";
const CLE_SESSION_A = "console-session";

function litLocal(cle){
  try { return JSON.parse(localStorage.getItem(cle) || "null"); } catch (e) { return null; }
}

/** Réglage du poste s'il existe, configuration livrée sinon. */
function configuration(){
  return litLocal(CLE_CFG_A) || window.PLAN_CONFIG || null;
}

function normaliseUrlA(saisie){
  let u = String(saisie || "").trim();
  while (u.length && u[u.length - 1] === "/") u = u.slice(0, -1);
  if (!u) return "";
  const marque = "supabase.com/dashboard/project/";
  const i = u.toLowerCase().indexOf(marque);
  if (i >= 0){
    const ref = u.slice(i + marque.length).split("/")[0].split("?")[0];
    if (ref) return "https://" + ref + ".supabase.co";
  }
  if (u.indexOf(".") < 0 && u.indexOf(":") < 0) return "https://" + u + ".supabase.co";
  if (u.slice(0, 4).toLowerCase() !== "http") u = "https://" + u;
  return u;
}

/** Le jeton est-il encore valable ? On le vérifie auprès du serveur. */
async function sessionValide(cfg, session){
  if (!cfg?.url || !cfg?.anonKey || !session?.access_token) return false;
  try {
    const r = await fetch(cfg.url + "/auth/v1/user", {
      headers: { "apikey": cfg.anonKey, "Authorization": "Bearer " + session.access_token },
    });
    return r.ok;
  } catch (e) { return false; }
}

function ecranAcces(message){
  const cfg = configuration() || {};
  const voile = document.createElement("div");
  voile.className = "modale open";
  voile.id = "acces";
  voile.innerHTML =
    '<div class="mfen" role="dialog" aria-modal="true">' +
    '<header><h2>Administration du plan</h2></header>' +
    '<div class="mcorps">' +
    '<p class="astuce" id="accesMsg"></p>' +
    '<label><span>Adresse du projet</span><input id="aUrl" placeholder="https://xxxx.supabase.co"></label>' +
    '<label><span>Clé publique (anon)</span><input id="aCle" placeholder="eyJhbGciOi…"></label>' +
    '<label><span>Adresse e-mail</span><input id="aMail" type="email" autocomplete="username"></label>' +
    '<label><span>Mot de passe</span><input id="aMdp" type="password" autocomplete="current-password"></label>' +
    '</div>' +
    '<footer><a class="btn" id="aPublic">Voir le plan public</a>' +
    '<a class="btn" id="aOubli" href="motdepasse">Mot de passe oublié</a>' +
    '<button class="btn primaire" id="aOk">Se connecter</button></footer></div>';
  document.body.appendChild(voile);

  $("aUrl").value = cfg.url || "";
  $("aCle").value = cfg.anonKey || "";
  // la configuration est livrée avec les pages : on ne la redemande pas
  if (cfg.url && cfg.anonKey){
    $("aUrl").closest("label").hidden = true;
    $("aCle").closest("label").hidden = true;
  }
  $("accesMsg").textContent = message || "Cette page est réservée à l'exploitant.";
  $("aPublic").href = "plan" + location.search;
  setTimeout(() => ($("aUrl").value ? $("aMail") : $("aUrl")).focus(), 40);

  const tente = async () => {
    const url = normaliseUrlA($("aUrl").value);
    const anonKey = $("aCle").value.trim();
    $("aUrl").value = url;
    if (!url || !anonKey){ $("accesMsg").textContent = "Adresse et clé publique sont nécessaires."; return; }
    $("accesMsg").textContent = "Connexion…";
    try {
      const r = await fetch(url + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("aMail").value.trim(), password: $("aMdp").value }),
      });
      // Une réponse vide ne doit pas ressortir en « Unexpected end of JSON
      // input » : on lit le texte, puis on tente de l'interpréter.
      const txt = await r.text();
      let j = {};
      try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { msg: txt.slice(0, 120) }; }
      if (!r.ok) {
        throw new Error((j.error_description || j.msg || "Identifiants refusés.") +
          " (HTTP " + r.status + ")");
      }
      if (!j.access_token) {
        throw new Error("Réponse inattendue de " + url + " — HTTP " + r.status +
          (txt ? "" : ", corps vide") + ". Vérifiez l'adresse du projet.");
      }
      localStorage.setItem(CLE_CFG_A, JSON.stringify({ url, anonKey }));
      localStorage.setItem(CLE_SESSION_A, JSON.stringify(j));
      voile.remove();
      activeAdmin();
      poseCompte();
      charge();
    } catch (e) {
      $("accesMsg").textContent = e.message;
    }
  };
  $("aOk").onclick = tente;
  $("aMdp").onkeydown = (e) => { if (e.key === "Enter"){ e.preventDefault(); tente(); } };
}

/* ------------------------------------------------------------------
   Le compte, une fois la porte franchie
   ------------------------------------------------------------------ */
/** L'adresse est dans le jeton — la demander au serveur serait un aller-retour
 *  de plus pour une donnée que le navigateur tient déjà en main. */
function mailDuJeton(session){
  try {
    const p = String(session?.access_token || "").split(".")[1];
    if (!p) return "";
    return JSON.parse(atob(p.replace(/-/g, "+").replace(/_/g, "/"))).email || "";
  } catch (e) { return ""; }
}

/** « korantin.vey@… » donne « KV » ; à défaut, les deux premières lettres. */
function initialesDe(mail){
  const local = String(mail || "").split("@")[0];
  const mots = local.split(/[.\-_+]+/).filter(Boolean);
  if (mots.length >= 2) return (mots[0][0] + mots[1][0]).toUpperCase();
  return (local.slice(0, 2) || "\u00b7\u00b7").toUpperCase();
}

const themeSombreA = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  return cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};

function poseCompte(){
  const menu = $("menuCompte");
  if (!menu) return;
  const mail = mailDuJeton(litLocal(CLE_SESSION_A));
  $("avatarCompte").textContent = mail ? initialesDe(mail) : "\u00b7\u00b7";
  $("compteMail").textContent = mail || "session inconnue";

  // le libellé annonce où l'on va, pas où l'on est
  menu.addEventListener("toggle", () => {
    if (menu.open) $("btnThemeCompte").textContent = themeSombreA() ? "Thème clair" : "Thème sombre";
  });

  /* Le thème reste réglé par le bouton d'origine, caché mais en place : lui
     seul sait rallumer la couleur d'accent du thème ouvert. */
  $("btnThemeCompte").onclick = () => { $("btnTheme").click(); menu.open = false; };

  /* Sortir, c'est effacer la session du poste — la même que celle de la
     console, qui se retrouvera donc déconnectée elle aussi — puis recharger :
     la page repasse alors d'elle-même par son écran d'accès. */
  $("btnSortir").onclick = () => {
    try { localStorage.removeItem(CLE_SESSION_A); } catch (e) {}
    location.reload();
  };
}

/* Un clic ailleurs, ou Échap, referme le panneau : rien d'autre ne dirait
   comment s'en défaire une fois ouvert au-dessus du plan. */
document.addEventListener("click", (ev) => {
  const m = $("menuCompte");
  if (m && m.open && !m.contains(ev.target)) m.open = false;
});
document.addEventListener("keydown", (ev) => {
  const m = $("menuCompte");
  if (ev.key === "Escape" && m && m.open) m.open = false;
});

(async () => {
  const cfg = configuration();
  const session = litLocal(CLE_SESSION_A);
  if (await sessionValide(cfg, session)){ activeAdmin(); poseCompte(); charge(); }
  else ecranAcces(session ? "Session expirée, reconnectez-vous." : null);
})();

</script>
