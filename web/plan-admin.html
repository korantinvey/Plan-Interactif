    if (v >= VISITE_MIN && v <= VISITE_MAX){ conf("_visite").minutes = v; enregistreConf(); }
  };
  n.onblur = () => { n.value = minutesVisite(); };
  hote.appendChild(duree);
}

/* Le nuancier. Des tons de charte plutôt qu'une roue : choisir une couleur
   principale, c'est choisir celle du salon, pas la nuance exacte d'un dégradé.
   Ils sont rangés par famille — bleus, verts, chauds, rouges, violets,
   neutres — et tous assez soutenus pour porter du texte, blanc ou noir, sans
   qu'il faille le vérifier au cas par cas. La dernière pastille ouvre le
   nuancier du système, pour une charte à l'hexadécimal près. */
const TONS = [
  ["#2F49D1", "Bleu d'encre"], ["#1B5FD9", "Bleu roi"], ["#23356B", "Bleu nuit"],
  ["#0F6F8A", "Bleu canard"], ["#0E8A7D", "Turquoise"], ["#0E7A3C", "Vert prairie"],
  ["#2C5E4A", "Vert forêt"], ["#5C7A1E", "Olive"],
  ["#B07A0B", "Or brûlé"], ["#C06A0B", "Ambre"], ["#C05621", "Terracotta"],
  ["#B4402F", "Brique"], ["#A82437", "Grenat"], ["#8E1F3F", "Cerise"],
  ["#B32A63", "Framboise"], ["#A8318C", "Fuchsia"],
  ["#7A3DBE", "Violet"], ["#5333C4", "Indigo"], ["#6B3A5E", "Prune"],
  ["#7A5230", "Brun"], ["#3F5566", "Ardoise"], ["#25303A", "Anthracite"],
];
const nomDuTon = (h) => (TONS.find(t => t[0].toLowerCase() === String(h).toLowerCase()) || [])[1];

/** De quoi le plan a l'air : sa couleur principale, et l'habillage de ses
 *  quatre panneaux — la liste des exposants, la fiche détail, le parcours de
 *  visite et l'itinéraire. */
function voletApparence(hote){
  const p = document.createElement("p");
  p.textContent = "La couleur principale sert partout : sélection, liens, " +
    "boutons, pastilles, et les modèles s'en habillent. Le modèle décide de " +
    "l'allure de tout l'écran à la fois : le bandeau du haut, la liste des " +
    "exposants, la fiche qui s'ouvre sur un stand, le parcours de visite et " +
    "l'itinéraire.";
  hote.appendChild(p);

  const coul = document.createElement("div");
  coul.className = "reglage-coul";
  coul.innerHTML = '<div class="tete"><span class="eyebrow">Couleur principale</span>' +
    '<span class="val"></span>' +
    '<button type="button" class="raz">Couleur d\'origine</button></div>' +
    '<div class="nuancier"></div>';
  const val = coul.querySelector(".val");
  const nuancier = coul.querySelector(".nuancier");
  const majPastilles = () => {
    const v = (conf("_accent").couleur || "").toLowerCase();
    nuancier.querySelectorAll("button[data-ton]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.ton.toLowerCase() === v)));
    const n = nomDuTon(v);
    val.textContent = v ? (n ? n + " · " + v.toUpperCase() : v.toUpperCase())
                        : "Réglage d'origine";
    const libre = nuancier.querySelector(".perso input");
    if (libre) libre.value = conf("_accent").couleur || jeton("--accent-base") || "#2F49D1";
  };
  const choisit = (v) => {
    conf("_accent").couleur = v;
    enregistreConf(); appliqueAccent(); majPastilles();
  };
  TONS.forEach(([ton, nom]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.ton = ton;
    b.style.background = ton;
    b.title = nom + " · " + ton;
    b.setAttribute("aria-label", nom);
    b.onclick = () => choisit(ton);
    nuancier.appendChild(b);
  });
  /* La pastille de couleur libre. Le sélecteur du système envoie une rafale
     d'événements pendant qu'on glisse : on suit, c'est le seul moyen de voir
     la couleur s'installer sur le plan pendant qu'on la cherche. Rien ne part
     en base pour autant, la publication reste un geste à part. */
  const libre = document.createElement("label");
  libre.className = "perso";
  libre.title = "Couleur libre";
  libre.innerHTML = '<input type="color"><span></span>';
  libre.querySelector("input").oninput = e => choisit(e.target.value);
  nuancier.appendChild(libre);
  coul.querySelector(".raz").onclick = () => {
    delete conf("_accent").couleur;
    enregistreConf(); appliqueAccent(); majPastilles();
  };
  hote.appendChild(coul);
  majPastilles();

  const titre = document.createElement("span");
  titre.className = "eyebrow";
  titre.textContent = "Modèle d'habillage";
  titre.style.display = "block";
  titre.style.margin = "0 0 9px";
  hote.appendChild(titre);

  const grille = document.createElement("div");
  grille.className = "modeles";
  const courant = modeleRetenu();
  // le même contenu pour les onze : c'est en comparant les mêmes liste et
  // fiche à elles-mêmes qu'on choisit leur habillage
  const vu = contenuApercu();
  MODELES.forEach(m => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mod";
    b.setAttribute("aria-pressed", String(m.cle === courant));
    b.innerHTML = '<span class="vue"></span>' +
      '<span class="nom"><span class="t"></span><span class="coche">✓</span></span>' +
      '<span class="resume"></span>';
    b.querySelector(".nom .t").textContent = m.nom;
    b.querySelector(".resume").textContent = m.resume;
    b.querySelector(".vue").appendChild(apercuDuo(m.cle, vu));
    b.onclick = () => {
      conf("_fiche").modele = m.cle;
      enregistreConf(); appliqueModele();
      grille.querySelectorAll(".mod").forEach(x =>
        x.setAttribute("aria-pressed", String(x === b)));
    };
    grille.appendChild(b);
  });
  hote.appendChild(grille);
}

/** Les réglages d'apparence se posent sur le poste, puis montent en base
 *  d'eux-mêmes — le poste n'en est plus que le cache et le refuge. */
const enregistreConf = () => {
  try { localStorage.setItem(CLE_CONF, JSON.stringify(CONF)); } catch (e) {}
  programmePublication();
};

/** Une couleur Klipso « rgb(r,g,b) » vers la notation attendue par le
 *  sélecteur de couleur. */
const rgbHex = (s) => {
  const m = String(s || "").match(/\d+/g);
  if (!m || m.length < 3) return null;
  return "#" + m.slice(0, 3)
    .map((n) => Math.max(0, Math.min(255, +n)).toString(16).padStart(2, "0")).join("");
};

const hexa = (v) => "#" + v.map(c => c.toString(16).padStart(2, "0")).join("");

/** Luminance relative d'un triplet, au sens du calcul de contraste : 0 pour le
 *  noir, 1 pour le blanc, en passant par la courbe de l'œil. */
const luminance = (v) => [0.2126, 0.7152, 0.0722].reduce((a, poids, i) => {
  const s = v[i] / 255;
  return a + poids * (s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4));
}, 0);

/**
 * Écarte une couleur vers le noir ou vers le blanc, du côté où le contraste
 * gagne le plus. Le liseré d'une sélection se déduit ainsi de son aplat et
 * reste lisible dessus, quel que soit le ton choisi.
 *
 * Le sens ne se devine pas à la clarté seule : un bleu franc et un orange sont
 * tous deux à mi-hauteur, et pourtant l'un gagne à s'éclaircir quand l'autre
 * gagne à s'assombrir. On calcule les deux et on garde le meilleur.
 */
const ecarte = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return hex;
  const n = parseInt(m[1], 16), v = [n >> 16 & 255, n >> 8 & 255, n & 255];
  /* 0,7 plutôt qu'une demi-teinte : le liseré borde l'aplat, mais le numéro du
     stand s'écrit dessus dans la même couleur, et un rapport de contraste de
     trois pour un ne se lit pas en petit. */
  const vers = (but) => v.map(c => Math.round(c + (but - c) * 0.7));
  const base = luminance(v) + 0.05;
  const contraste = (w) => { const a = luminance(w) + 0.05; return a > base ? a / base : base / a; };
  const sombre = vers(0), clair = vers(255);
  return hexa(contraste(sombre) >= contraste(clair) ? sombre : clair);
};

/** Nom lisible d'un sous-calque : « 4-PORTE-SECU » devient « Porte secu ». */
const joli = (id) => String(id)
  .replace(/^[0-9]+-/, "").replace(/[_-]+/g, " ").toLowerCase()
  .replace(/^./, (c) => c.toUpperCase());

/* ============================================================
   10. Mode administration
   Il n'existe que dans la page dédiée, et seulement une fois l'utilisateur
   authentifié. La page publique ne l'active jamais et retire ses commandes
   du document. Un raccourci clavier ne serait pas une frontière.
   ============================================================ */
let ADMIN = false;

/**
 * Page publique : les commandes d'administration sont neutralisées.
 * On les masque et on les vide plutôt que de les supprimer — le montage du
 * plan y touche encore, et ADMIN restant faux, rien ne peut les activer.
 */
function retireAdmin(){
  ["btnLayers", "btnReglages", "menuCompte"].forEach(id => { const b = $(id); if (b) b.remove(); });
  ["panel", "outils", "elemSel", "libReg"].forEach(id => {
    const e = $(id);
    if (!e) return;
    e.hidden = true;
    e.classList.remove("open");
    e.setAttribute("aria-hidden", "true");
    if (id !== "outils") e.innerHTML = "";
  });
}

/** Ouvre le mode administration, une fois l'identité vérifiée. */
function activeAdmin(){
  if (ADMIN) return;
  ADMIN = true;
  // l'outil de départ est la sélection : les dessins deviennent cliquables
  racine.classList.add("mode-edition");
  const b = $("btnLayers");
  if (b){
    b.hidden = false;
    b.onclick = () => {
      const o = $("panel").classList.toggle("open");
      b.setAttribute("aria-pressed", o);
    };
  }
  /* Le compte prend la place du bouton de thème plutôt que de s'ajouter à
     côté : il porte le même réglage dans son panneau, et deux commandes d'une
     même chose dans la même barre ne disent pas laquelle écoute. */
  const c = $("menuCompte");
  if (c){
    c.hidden = false;
    const th = $("btnTheme");
    if (th) th.hidden = true;
  }
  const r = $("btnReglages");
  /* Sans la lambda, le gestionnaire passe l'événement de clic en premier
     argument — soit, pour « ouvreReglages », le nom du volet à ouvrir. Aucun
     onglet ne s'appelant « [object PointerEvent] », la fenêtre s'ouvrait sur
     rien : ni onglet actif, ni contenu. */
  if (r){ r.hidden = false; r.onclick = () => ouvreReglages(); }
  const barre = document.createElement("div");
  barre.className = "adminbar";
  /* Copier et importer une configuration servaient à la transporter d'un poste
     à l'autre, faute de mieux. Maintenant qu'elle s'enregistre, ils n'ajoutent
     qu'un chemin de plus pour arriver au même endroit. Rétablir les valeurs
     d'origine est parti pour l'inverse : un clic effaçait sans confirmation
     tout le travail de calques et de libellés, pour un besoin qui ne se
     présente jamais.

     Ce qui reste dit où en est l'enregistrement — il se fait tout seul — et
     permet de le relancer quand il a échoué. « majAttente » l'habille. */
  barre.innerHTML = '<button class="reset fort" id="pousseConf"></button>';
  $("panel").appendChild(barre);
  $("pousseConf").onclick = () => pousseConfiguration();
  /* Le plan a pu être monté avant que l'identité soit vérifiée : une page à
     données figées démarre sans rien attendre. Le panneau des calques n'a
     alors pas été construit — montePlan() n'en bâtit qu'en administration —
     et les dessins ne sont pas cliquables. C'est à cela que sert ce drapeau,
     qui jusqu'ici ne servait à rien. */
  if (MONTE){ dessineDessins(); construitPanneau(); }
  majAttente();
}


/* ============================================================
   La fiche d'une zone organisateur
   Une zone tire son nom de Klipso, ou des textes posés sur le plan. Quand ni
   l'un ni l'autre ne donne rien — les vingt-deux zones de Franchise Expo
   s'affichent « Zone sans nom » — il faut pouvoir le saisir.

   Et le nom est souvent tout ce qu'elle a : la source ne dit rien d'autre
   d'un espace de restauration, d'une agora ou d'une halte-garderie, qui ont
   pourtant des horaires, un contenu, une page où s'inscrire. Une zone est donc
   la seule chose du plan dont la fiche s'écrit à la main : un libellé, une
   description mise en forme, un lien.

   Le même formulaire s'ouvre de deux endroits — du crayon posé sur la fiche,
   et de la liste des zones dans les réglages, quand on les reprend l'une après
   l'autre sans avoir à les retrouver sur le plan.

   La fiche est enregistrée sur l'événement, pas dans le navigateur : c'est le
   visiteur qui doit la lire. Et elle s'applique à la lecture, si bien qu'elle
   paraît sans attendre la prochaine synchronisation.
   ============================================================ */

/**
 * Un champ du formulaire : son intitulé, ce qu'on y saisit, et la ligne d'aide
 * qui dit ce qu'il devient. Les trois vont ensemble — un champ sans son aide
 * se remplit au jugé.
 */
function champZone(hote, titre, dedans, aide){
  const bloc = document.createElement("div");
  bloc.className = "champZ";
  const l = document.createElement("span");
  l.className = "tZ";
  l.textContent = titre;
  bloc.appendChild(l);
  bloc.appendChild(dedans);
  if (aide){
    const a = document.createElement("span");
    a.className = "aideZ";
    a.textContent = aide;
    bloc.appendChild(a);
  }
  hote.appendChild(bloc);
  return dedans;
}

/**
 * Les champs d'une zone, posés dans « hote ».
 *
 * Rend de quoi les relire au moment d'enregistrer, plutôt que d'écrire à
 * chaque frappe : une description se rédige, et la sauver en cours de phrase
 * la publierait à moitié faite.
 */
function champsZone(hote, o){
  const libelle = champZone(hote, "Libellé", document.createElement("input"),
    "Le nom de la zone, sur le plan comme sur sa fiche. Laissez vide pour " +
    "revenir au nom d'origine, s'il y en a un.");
  libelle.type = "text";
  libelle.value = (DATA.nomsZones || {})[o.id] || o.nom || "";
  libelle.placeholder = "Agora, Halte-garderie, Pitch Retail…";

  /* Le type ne décrit pas la zone, il dit à quoi elle sert : c'est ce qu'un
     visiteur cherche quand il cherche où déjeuner, et ce qu'aucun intitulé de
     salon ne dit — « Atmosphère Mobilité » ne se devine pas. */
  const type = champZone(hote, "Type", document.createElement("select"),
    "Ouvre l'entrée correspondante dans le cartouche des points d'intérêt, au " +
    "bas du plan : le visiteur y retrouve d'un geste toutes les zones du même " +
    "type. Sans type, la zone reste sur le plan comme aujourd'hui.");
  type.innerHTML = TYPES_ZONE.map(t =>
    '<option value="' + esc(t.v) + '">' + esc(t.nom) + "</option>").join("");
  type.value = (typeZone(o) || {}).v || "";

  const salles = champSalles(hote, o);

  const logo = champLogo(hote, o);

  const riche = editeurRiche(o.description || "");
  champZone(hote, "Description", riche.cadre,
    "Ce qu'on trouve dans cette zone, ses horaires, ses conditions d'accès. " +
    "Le libellé « Description » ne paraît sur la fiche que si vous en écrivez une.");

  const lienZ = champZone(hote, "Lien", document.createElement("input"),
    "Une page où en savoir plus. Elle s'ouvre dans un nouvel onglet, et " +
    "n'apparaît sur la fiche que si vous en donnez une.");
  lienZ.type = "url";
  lienZ.placeholder = "https://…";
  lienZ.value = o.lien || "";

  return () => ({ libelle: libelle.value, type: type.value, logo: logo(),
                  description: riche.lit(), lien: lienZ.value,
                  salles: salles ? salles() : null });
}

/**
 * Les salles de conférence que cette zone abrite.
 *
 * Une salle du programme s'appelle « Agora (P160) » : le code entre
 * parenthèses est un emplacement du plan, et la synchronisation retrouve la
 * zone qui le contient — dix fois sur onze sur Franchise Expo. La onzième
 * porte un code absent du plan, et rien ne le devinera : elle se désigne ici,
 * à la main, sur la zone qui l'accueille.
 *
 * Tout le programme est montré, et pas seulement ce qui revient déjà à cette
 * zone : c'est de là qu'on voit ce qui n'est encore nulle part. La liste est
 * courte — une dizaine de salles pour un salon qui en a.
 *
 * Une salle n'est que dans une zone à la fois : la cocher ici la retire de là
 * où elle était, ce que sa ligne disait avant qu'on ne la coche.
 */
function champSalles(hote, o){
  const salles = DATA.salles || {};
  /* Sans nom, une salle ne se distingue pas de la suivante ; l'ordre est celui
     du programme, et il ne bouge pas quand on coche — une liste qui se
     réordonne sous le doigt fait cocher la voisine. */
  const ids = Object.keys(salles).sort((a, b) =>
    String(salles[a].nom || "").localeCompare(String(salles[b].nom || ""), "fr"));
  // sans programme, il n'y a rien à rattacher : le champ n'aurait qu'un vide
  if (!ids.length) return null;

  const liste = document.createElement("div");
  liste.className = "sallesZ";
  const coches = new Map();

  ids.forEach(id => {
    const s = salles[id];
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span class="nS"></span>' +
                  '<span class="cS"></span><span class="eS"></span>';
    const c = l.querySelector("input");
    c.checked = s.zone === o.id;
    l.querySelector(".nS").textContent = s.nom || id;
    l.querySelector(".cS").textContent = s.code || "";
    const etat = l.querySelector(".eS");
    /* Ce que la ligne dit d'elle-même : d'où vient ce qui est coché, et où est
       partie une salle qui ne l'est pas. « Trouvée automatiquement » se lit de
       la proposition et non de la marque « manuel » : une salle qu'on a cochée
       là où la synchronisation la mettait est au même endroit qu'elle. */
    const dis = () => {
      const ailleurs = !c.checked && s.zone && s.zone !== o.id;
      etat.textContent = c.checked
        ? (s.auto === o.id ? "trouvée automatiquement" : "choisie à la main")
        : ailleurs ? "rattachée à " + nomDeZone(s.zone)
        : "à situer";
      etat.dataset.genre = c.checked ? (s.auto === o.id ? "auto" : "manuel")
        : ailleurs ? "libre" : "manque";
    };
    dis();
    c.onchange = dis;
    coches.set(id, c);
    liste.appendChild(l);
  });

  champZone(hote, "Salles de conférence", liste,
    "Le programme du salon, salle par salle. Cochez celles qui se tiennent " +
    "dans cette zone : leurs conférences paraissent aussitôt sur sa fiche. " +
    "Un rattachement choisi ici n'est plus modifié par les synchronisations " +
    "suivantes.");
  return () => ids.filter(id => coches.get(id).checked);
}

/** Le nom d'une zone, pour le dire ailleurs que sur elle-même. */
function nomDeZone(id){
  const z = parId.get(id);
  // une zone que le plan n'a plus : le rattachement lui survit, et le dire
  // vaut mieux que de laisser croire à une zone qu'on pourrait aller voir
  if (!z) return "une zone absente du plan";
  return z.nom || "une zone sans nom";
}


/* Les tailles successives auxquelles on tente de ramener un logo, de la plus
   confortable à la plus modeste : on garde la première qui tient dans le poids
   qu'on s'autorise. Le logo paraît à peu près 240 points de large sur la
   fiche ; 480 pixels le gardent net sur un écran qui en double la densité.

   Le poids n'est pas une coquetterie : la fiche part avec le plan, à chaque
   visiteur et pour chaque zone. Cent kilo-octets par logo, sur les vingt-deux
   zones d'un salon comme Franchise Expo, sont déjà deux mégaoctets de plan. */
const PALIERS_LOGO = [[480, .85], [480, .7], [380, .7], [300, .62], [220, .6]];
const POIDS_LOGO = 92000;

/**
 * Le fichier choisi, ramené à ce qu'une fiche affiche.
 *
 * Le logo est enregistré dans la fiche elle-même, en data-URI, et non déposé
 * sur un hébergement de fichiers : c'est déjà ainsi que voyagent les images du
 * dessin, une page publiée ne peut charger aucune ressource externe, et un lien
 * vers un fichier ailleurs meurt le jour où l'ailleurs change. Le prix est le
 * poids, payé par chaque visiteur : d'où la réduction, et le refus au-delà.
 *
 * Le format d'arrivée ne dépend pas de celui du fichier : webp là où le
 * navigateur sait l'écrire, png ailleurs — il y répond en png sans rien dire,
 * et le résultat reste affichable. Les deux gardent la transparence, qu'un logo
 * a presque toujours et qu'un jpeg aurait remplie de blanc.
 */
function reduitLogo(fichier){
  return new Promise((tenu, rompu) => {
    if (!fichier || String(fichier.type).indexOf("image/") !== 0)
      return rompu(new Error("ce fichier n'est pas une image"));
    const fr = new FileReader();
    fr.onerror = () => rompu(new Error("fichier illisible"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rompu(new Error("image illisible"));
      img.onload = () => {
        /* Un svg sans dimensions intrinsèques se dessine à rien : on lui en
           prête plutôt que de rendre une image vide. */
        const l0 = img.naturalWidth || 480, h0 = img.naturalHeight || 480;
        for (const [max, q] of PALIERS_LOGO){
          const k = Math.min(1, max / Math.max(l0, h0));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(l0 * k));
          c.height = Math.max(1, Math.round(h0 * k));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          const src = c.toDataURL("image/webp", q);
          if (src.length <= POIDS_LOGO) return tenu(src);
        }
        rompu(new Error("image trop lourde, même réduite — un logo, pas une photo"));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(fichier);
  });
}

/**
 * Le champ du logo : le choisir, le voir, le retirer.
 *
 * Il se lit comme les autres champs de la fiche — on le remplit, on quitte, il
 * part — d'où la même forme : ce qu'il rend est relu à la sortie, et non écrit
 * au moment du choix. Une image posée puis retirée sans quitter la fiche n'aura
 * donc rien écrit du tout.
 *
 * La vignette est aussi la cible du glisser-déposer : c'est le geste qu'on fait
 * devant elle, et il évite la boîte de dialogue du système.
 */
function champLogo(hote, o){
  let logo = imageSure(o.logo);

  const cadre = document.createElement("div");
  cadre.className = "logoZ";
  const vue = document.createElement("div");
  vue.className = "vue";
  const actes = document.createElement("div");
  actes.className = "actes";
  const choisir = document.createElement("button");
  choisir.type = "button";
  const oter = document.createElement("button");
  oter.type = "button";
  oter.textContent = "Retirer";
  const dit = document.createElement("span");
  dit.className = "ditZ";
  const fichier = document.createElement("input");
  fichier.type = "file";
  fichier.accept = "image/*";
  fichier.hidden = true;
  actes.appendChild(choisir);
  actes.appendChild(oter);
  actes.appendChild(dit);
  cadre.appendChild(vue);
  cadre.appendChild(actes);
  cadre.appendChild(fichier);

  /* Le poids annoncé est celui du data-URI, non celui du fichier d'origine :
     c'est lui qui part chez le visiteur, et il pèse un tiers de plus — quatre
     caractères de base64 pour trois octets, d'où le diviseur. */
  const peint = (mot) => {
    vue.innerHTML = logo ? '<img alt="">' : '<span>Aucun logo</span>';
    if (logo) vue.querySelector("img").src = logo;
    choisir.textContent = logo ? "Remplacer…" : "Choisir un fichier…";
    oter.hidden = !logo;
    dit.dataset.mal = "false";
    dit.textContent = mot !== undefined ? mot
      : logo ? Math.round(logo.length / 1365) + " Ko" : "";
  };

  const prend = (f) => {
    if (!f) return;
    peint("Lecture…");
    reduitLogo(f).then(src => { logo = src; peint(); }).catch(e => {
      dit.textContent = "Échec : " + e.message;
      dit.dataset.mal = "true";
    });
  };

  choisir.onclick = () => fichier.click();
  fichier.onchange = () => { prend(fichier.files[0]); fichier.value = ""; };
  oter.onclick = () => { logo = ""; peint(); };
  vue.addEventListener("dragover", e => { e.preventDefault(); vue.dataset.survol = "1"; });
  vue.addEventListener("dragleave", () => { delete vue.dataset.survol; });
  vue.addEventListener("drop", e => {
    e.preventDefault();
    delete vue.dataset.survol;
    prend(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  peint();
  champZone(hote, "Logo", cadre,
    "L'image paraît dans l'en-tête de la fiche, au-dessus du type et du nom. " +
    "Elle est " +
    "réduite puis enregistrée dans la fiche : elle part avec le plan, sans " +
    "dépendre d'un fichier hébergé ailleurs. Glissez-la sur la vignette, ou " +
    "choisissez-la.");
  return () => logo;
}

/* Ce que la barre de l'éditeur propose. Rien de plus que de la mise en forme :
   une description de zone est un paragraphe et deux listes, pas une page à
   composer — et tout ce qui n'est pas ici serait de toute façon retiré à
   l'affichage. */
const OUTILS_RICHE = [
  { cmd: "bold", signe: "G", titre: "Gras", style: "font-weight:700" },
  { cmd: "italic", signe: "I", titre: "Italique", style: "font-style:italic" },
  { cmd: "insertUnorderedList", signe: "•", titre: "Liste à puces" },
  { cmd: "insertOrderedList", signe: "1.", titre: "Liste numérotée" },
];

/**
 * L'éditeur de la description.
 *
 * Une zone de saisie ordinaire aurait rendu un bloc de texte : or ce qu'on
 * écrit là — des horaires, ce qu'on y trouve, comment s'y inscrire — se lit
 * en paragraphes et en listes. D'où un éditeur, réduit à ce que la fiche sait
 * afficher : gras, italique, listes, liens.
 *
 * Il s'appuie sur « execCommand », que les navigateurs disent déprécié depuis
 * dix ans et qu'aucun n'a retiré : c'est cela, ou réécrire à la main la mise en
 * forme d'une sélection, pour un champ que l'exploitant remplit trois fois.
 *
 * Ce qui est collé arrive en texte nu : coller depuis un traitement de texte
 * apportait sa feuille de style entière, dont il ne restait rien après relecture
 * — l'éditeur montrait alors une mise en forme que la fiche n'affichait pas.
 */
function editeurRiche(html){
  const cadre = document.createElement("div");
  cadre.className = "edrich";
  const barre = document.createElement("div");
  barre.className = "barre";
  const zone = document.createElement("div");
  zone.className = "zone";
  zone.contentEditable = "true";
  zone.setAttribute("role", "textbox");
  zone.setAttribute("aria-multiline", "true");
  zone.setAttribute("aria-label", "Description de la zone");
  zone.dataset.vide = "Ce qu'on trouve dans cette zone, ses horaires…";
  zone.innerHTML = assainitRiche(html);

  /* Chrome sépare les lignes par des « div », Firefox par des « br » : sans
     cette demande, deux navigateurs produisent deux balisages pour le même
     texte. Elle échoue silencieusement là où elle n'est pas comprise, et la
     relecture ramène de toute façon les deux au paragraphe. */
  try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) {}

  const marques = [];
  const majMarques = () => marques.forEach(m => {
    let on = false;
    try { on = document.queryCommandState(m.cmd); } catch (e) {}
    m.el.setAttribute("aria-pressed", String(on));
  });

  const bouton = (signe, titre) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = signe;
    b.title = titre;
    b.setAttribute("aria-label", titre);
    /* Un bouton qui prend le focus emporte la sélection avec lui : la commande
       s'appliquerait alors à rien. On lui refuse le focus plutôt que de
       relever et reposer la sélection à chaque clic. */
    b.onmousedown = e => e.preventDefault();
    barre.appendChild(b);
    return b;
  };

  OUTILS_RICHE.forEach(t => {
    const b = bouton(t.signe, t.titre);
    if (t.style) b.style.cssText = t.style;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      zone.focus();
      try { document.execCommand(t.cmd, false, null); } catch (e) {}
      majMarques();
    };
    marques.push({ cmd: t.cmd, el: b });
  });

  /* Poser un lien demande une adresse, qu'il faut bien saisir quelque part :
     une seconde fenêtre par-dessus celle des réglages fermerait la première —
     la page n'en tient qu'une — d'où cette rangée, qui se déplie sous la barre
     et rend la main au texte. */
  const rangee = document.createElement("div");
  rangee.className = "lienbarre";
  rangee.hidden = true;
  const url = document.createElement("input");
  url.type = "url";
  url.placeholder = "https://…";
  rangee.appendChild(url);
  let plage = null;

  /* La sélection du moment, mise de côté : le temps de taper une adresse, le
     focus a quitté le texte, et avec lui ce sur quoi le lien devait porter. */
  const retientPlage = () => {
    const s = getSelection();
    plage = s && s.rangeCount && zone.contains(s.getRangeAt(0).commonAncestorContainer)
      ? s.getRangeAt(0).cloneRange() : null;
  };
  const reposePlage = () => {
    zone.focus();
    if (!plage) return;
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(plage);
  };

  const poser = document.createElement("button");
  poser.type = "button";
  poser.className = "ok";
  poser.textContent = "Poser";
  poser.onclick = () => {
    const u = adresseSure(url.value);
    if (!u){ url.focus(); url.select(); return; }
    reposePlage();
    const s = getSelection();
    try {
      /* Un lien posé sans rien avoir sélectionné n'aurait pas de texte à
         porter : c'est l'adresse elle-même qui en tient lieu. */
      if (s && s.isCollapsed) document.execCommand("insertHTML", false,
        '<a href="' + esc(u) + '">' + esc(u.replace(/^https?:\/\//i, "")) + "</a>");
      else document.execCommand("createLink", false, u);
    } catch (e) {}
    rangee.hidden = true;
    url.value = "";
  };
  rangee.appendChild(poser);

  const retirer = document.createElement("button");
  retirer.type = "button";
  retirer.textContent = "Retirer";
  retirer.onclick = () => {
    reposePlage();
    try { document.execCommand("unlink", false, null); } catch (e) {}
    rangee.hidden = true;
  };
  rangee.appendChild(retirer);

  const bLien = bouton("Lien", "Poser un lien sur le texte choisi");
  bLien.className = "lg";
  bLien.onclick = () => {
    retientPlage();
    rangee.hidden = !rangee.hidden;
    if (!rangee.hidden) setTimeout(() => url.focus(), 20);
  };

  zone.addEventListener("paste", e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text/plain");
    try { document.execCommand("insertText", false, t); } catch (err) {}
  });
  ["keyup", "mouseup", "focus"].forEach(ev => zone.addEventListener(ev, majMarques));

  cadre.appendChild(barre);
  cadre.appendChild(rangee);
  cadre.appendChild(zone);

  return {
    cadre: cadre,
    /* Ce qui sera enregistré : relu ici comme il le sera à l'affichage, et
       ramené à rien s'il ne reste que le paragraphe vide qu'un éditeur vidé
       laisse derrière lui — sans quoi la fiche annoncerait une description
       qui ne dit rien. */
    lit: () => {
      const h = assainitRiche(zone.innerHTML);
      const d = document.createElement("div");
      d.innerHTML = h;
      return d.textContent.trim() ? h : "";
    },
  };
}

/* La fiche de zone en cours de saisie, et ce qu'elle valait en arrivant.
 *
 * Elle n'a pas de bouton d'enregistrement : on ne valide pas une fiche qu'on
 * est en train d'écrire, on la quitte — en passant à une autre zone, à un autre
 * onglet, ou en fermant la fenêtre par où l'on veut. Reste à savoir ce qui a
 * changé, sinon chaque zone seulement regardée serait réécrite : d'où l'état
 * de départ, relevé par le même chemin que celui qu'on comparera. */
let ficheZoneEnCours = null;

/* Les salles cochées se comparent telles quelles : ce sont deux listes des
   mêmes identifiants, dans l'ordre du programme, qui ne bouge pas. */
const memeFicheZone = (a, b) => Boolean(a && b && a.libelle === b.libelle &&
  a.type === b.type && a.description === b.description && a.lien === b.lien &&
  a.logo === b.logo && String(a.salles) === String(b.salles));

/** Suit la fiche qui vient de paraître : c'est elle qu'on versera en sortant. */
function suitFicheZone(o, valeurs, etat, apres){
  ficheZoneEnCours = { o, valeurs, etat, apres, depart: valeurs() };
  /* La fenêtre peut se fermer de quatre façons, et par une cinquième quand une
     autre prend sa place : toutes passent par « verseModale ». */
  avantFermeture = () => { verseFicheZone(); ficheZoneEnCours = null; };
}

/** Enregistre la fiche ouverte, si et seulement si elle a changé. */
function verseFicheZone(){
  const f = ficheZoneEnCours;
  if (!f) return;
  const v = f.valeurs();
  if (memeFicheZone(v, f.depart)) return;
  /* Ce qui part devient l'état de départ tout de suite : la fenêtre se ferme
     avant que la base ait répondu, et deux sorties ne doivent pas envoyer deux
     fois la même chose. Un échec le remet en jeu. */
  const depart = f.depart;
  f.depart = v;
  if (f.etat){ f.etat.textContent = "Enregistrement…"; f.etat.dataset.mal = "false"; }
  enregistreZone(f.o, v, depart).then(() => {
    if (f.etat) f.etat.textContent = "Enregistré.";
    if (f.apres) f.apres();
  }).catch(e => {
    if (f.etat){ f.etat.textContent = "Échec : " + e.message; f.etat.dataset.mal = "true"; }
    /* Fenêtre fermée, la ligne d'état est partie avec elle : l'échec se dit
       alors sur le plan, seul endroit encore sous les yeux. */
    if (!$("modale").classList.contains("open"))
      annonce("Enregistrement de la zone impossible : " + e.message, true);
    // ce qui n'est pas passé reste à écrire : la prochaine sortie réessaiera
    if (f.depart === v) f.depart = null;
  });
}

/** La fiche d'une zone, ouverte du crayon posé sur la fiche du plan. */
function ficheZone(o){
  ouvreModale(o.nom || "Zone sans nom", corps => {
    const valeurs = champsZone(corps, o);
    const etat = document.createElement("p");
    etat.className = "etatZ seul";
    corps.appendChild(etat);
    suitFicheZone(o, valeurs, etat);
  }, [{ libelle: "Fermer" }], "large");
}

/**
 * Enregistrer la fiche d'une zone.
 *
 * Le libellé et le reste ne vivent pas dans la même colonne — le premier
 * s'applique au plan, où il nomme la forme, les autres n'existent que sur la
 * fiche — mais ils se saisissent ensemble : ils partent donc en une seule
 * écriture, sans quoi un enregistrement à moitié passé laisserait le nom
 * changé et la description perdue.
 *
 * « depart » dit ce que la fiche valait en s'ouvrant. Le champ du libellé
 * arrive rempli du nom en place, qui vient souvent de la source : l'écrire
 * sans y avoir touché le figerait en nom choisi, et une zone renommée chez
 * l'organisateur garderait ici son ancien nom pour toujours. Un champ qu'on
 * n'a pas touché ne touche donc pas à sa colonne.
 */
async function enregistreZone(o, v, depart){
  const nom = String(v.libelle || "").trim();
  const description = String(v.description || "");
  // un type que la page ne connaît pas n'ouvrirait aucune entrée au cartouche
  const genre = TYPES_ZONE.some(t => t.v && t.v === v.type) ? v.type : "";
  // ce qui n'est pas une adresse tenable n'est pas enregistré : la fiche
  // n'aurait qu'un lien mort à montrer
  const adresse = adresseSure(v.lien);
  /* Le logo est relu avant de partir comme il le sera avant de paraître : ce
     qui n'est pas une image fabriquée ici n'a rien à faire dans la colonne. */
  const blason = imageSure(v.logo);
  const renomme = !depart || String(depart.libelle || "").trim() !== nom;
  /* Les salles cochées. Leur colonne n'est pas indexée par zone mais par
     salle, et c'est la zone qu'on y écrit — d'où le détour. On n'y touche que
     si une coche a bougé : une description corrigée ne doit pas réécrire un
     rattachement qu'un autre poste vient de changer. */
  const salles = Array.isArray(v.salles) ? v.salles : null;
  const rattache = salles && (!depart || String(depart.salles) !== String(salles));
  const rattacheSalles = (t) => Object.keys(t).forEach(id => {
    const s = t[id];
    const ici = salles.indexOf(id) >= 0;
    // une salle qui est déjà où on la veut n'a pas à être réécrite : le choix
    // d'une zone ne touche pas au rattachement des salles des autres
    if (!s || ici === (s.zone === o.id)) return;
    s.zone = ici ? o.id : null;
    /* « manuel » protège du prochain rattachement automatique. Retirer d'ici
       une salle que la synchronisation y avait posée est un choix comme un
       autre : sans cette marque, elle y reviendrait à la synchronisation
       suivante. */
    s.manuel = ici ? s.zone !== s.auto : Boolean(s.auto);
  });
  /* La fiche de la zone suivante s'ouvre avant que la base ait répondu, et le
     plan se redessine dans la foulée : tous deux doivent lire le rattachement
     qu'on vient de choisir, pas celui d'avant. L'écriture dira le dernier mot,
     et « rattacheSalles » ne fait rien deux fois. */
  if (rattache){ rattacheSalles(DATA.salles); rangeConferences(); }
  const tables = await ecritTablesZones([
    ...(renomme ? [{ colonne: "zones", secours: DATA.nomsZones, change: t => {
        if (nom) t[o.id] = nom; else delete t[o.id];
      } }] : []),
    { colonne: "zones_fiches", secours: DATA.fichesZones, change: t => {
        const fiche = {};
        if (genre) fiche.type = genre;
        if (blason) fiche.logo = blason;
        if (description) fiche.description = description;
        if (adresse) fiche.lien = adresse;
        // une fiche vidée sort de la table plutôt que d'y rester en creux
        if (Object.keys(fiche).length) t[o.id] = fiche; else delete t[o.id];
      } },
    ...(rattache
      ? [{ colonne: "salles", secours: DATA.salles, change: rattacheSalles }]
      : []),
  ]);
  if (tables.zones) DATA.nomsZones = tables.zones;
  DATA.fichesZones = tables.zones_fiches;
  /* Le programme d'une zone se lit d'un index rangé au chargement : la salle
     qu'on vient de lui rattacher n'y est pas, et attendre la synchronisation
     pour la voir arriver ferait douter du clic. */
  if (tables.salles){ DATA.salles = tables.salles; rangeConferences(); }
  if (renomme){
    // le nom d'origine n'est pas perdu : on le garde pour pouvoir y revenir
    if (o.origine === undefined) o.origine = o.nom;
    o.nom = nom || o.origine || null;
  }
  o.description = description;
  o.lien = adresse;
  o.logo = blason;
  o.type = genre;
  // le nom se lit aussi sur le plan et dans la liste, où on le cherche
  o.rech = String(o.nom || "").toLowerCase();
  libelles(); liste();
  // le cartouche gagne ou perd une entrée selon le type qu'on vient de poser
  cartouchePoi();
  // la fiche ouverte sur cette zone montre déjà l'ancienne version
  if (state.sel === o.id) ouvre(o, null);
}


/* ============================================================
   Masquer une zone organisateur
   Toutes les zones que Klipso renvoie ne s'adressent pas au visiteur : un
   local technique, une réserve, un quai de livraison occupent le plan sans
   rien lui apprendre. L'exploitant les éteint une par une depuis leur fiche.

   Une zone éteinte ne part plus dans le plan public ; en administration elle
   reste, en teinte pâlie, car c'est de là qu'on revient sur son choix. Le
   masquage est enregistré sur l'événement, et s'applique à la lecture : il
   paraît sans attendre la prochaine synchronisation.
   ============================================================ */
async function basculeAffichageZone(o){
  const masquer = !o.masquee;
  try {
    const masques = await ecritTableZones("zones_masquees", DATA.zonesMasquees, t => {
      if (masquer) t[o.id] = true; else delete t[o.id];
    });
    DATA.zonesMasquees = masques;
    o.masquee = masquer || undefined;
    marqueZonesMasquees();
    libelles();
    ouvre(o, null);
  } catch (e) {
    annonce("Changement impossible : " + e.message, true);
  }
}

/** La teinte pâlie des zones éteintes, reposée sur le plan en place. */
function marqueZonesMasquees(){
  document.querySelectorAll("#zones g").forEach(g => {
    const z = parId.get(g.dataset.id);
    g.classList.toggle("masquee", !!z && !!z.masquee);
  });
}


/**
 * Réécrire les tables de l'événement indexées par zone — les noms, les
 * masquages, les fiches. Chacune tient dans une seule colonne : la renvoyer
 * telle que la page l'avait chargée effacerait ce qu'un autre poste y a mis
 * depuis. On repart donc de ce que la base contient à l'instant, et « change »
 * n'y touche que la zone concernée.
 *
 * Plusieurs colonnes à la fois quand elles se saisissent ensemble : la fiche
 * d'une zone tient à la fois du nom, qui s'écrit sur le plan, et du reste, qui
 * n'existe que sur la fiche. Deux écritures les auraient dissociées à la
 * première qui échoue.
 */
async function ecritTablesZones(travaux){
  let cfg = null, ses = null;
  try {
    cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    ses = JSON.parse(localStorage.getItem("console-session") || "null");
  } catch (e) {}
  if (!cfg?.url || !ses?.access_token) throw new Error("session absente, reconnectez-vous");

  const entetes = { "apikey": cfg.anonKey, "Authorization": "Bearer " + ses.access_token };
  const colonnes = travaux.map(t => t.colonne).join(",");
  const enBase = await fetch(cfg.url + "/rest/v1/evenement?select=" + colonnes + "&slug=eq." +
    encodeURIComponent(DATA.slug), { headers: entetes })
    .then(r => r.ok ? r.json() : []).catch(() => []);

  const tables = {}, corps = { modifie_le: new Date().toISOString() };
  travaux.forEach(t => {
    const table = { ...(enBase[0]?.[t.colonne] || t.secours || {}) };
    t.change(table);
    tables[t.colonne] = corps[t.colonne] = table;
  });

  const r = await fetch(cfg.url + "/rest/v1/evenement?slug=eq." + encodeURIComponent(DATA.slug), {
    method: "PATCH",
    headers: { ...entetes, "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify(corps),
  });
  if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120));
  return tables;
}

/** La même chose pour une seule colonne, qui est le cas courant. */
const ecritTableZones = (colonne, secours, change) =>
  ecritTablesZones([{ colonne, secours, change }]).then(t => t[colonne]);


/* ============================================================
   Placer un libellé à la main

   Le nom d'un stand est posé automatiquement : au milieu de l'emplacement, à
   la taille que la place autorise. C'est juste pour un rectangle, et ce l'est
   moins dès que le plan sort du cas d'école — un stand en L dont le nom tombe
   sur la découpe, deux enseignes voisines dont les noms se touchent, une zone
   organisateur dont l'intitulé traverse une allée. L'exploitant voit ces
   cas-là, le calcul non : il lui faut pouvoir déplacer et agrandir un libellé.

   Le réglage se range dans l'apparence du salon, avec les couleurs et l'ordre
   des calques, et part aux visiteurs à la publication.

   Il porte avec lui l'empreinte de ce dont il dépend : ce qui s'écrit, et la
   forme qui le porte. Une synchronisation qui n'y touche pas le laisse en
   place — c'est tout l'objet — mais une qui renomme l'exposant, déplace le
   stand ou le redimensionne le périme : le décalage ne décrit plus rien, et
   laisser le nom flotter à côté serait pire que de le replacer tout seul.
   Le réglage n'est pas effacé pour autant, il cesse de s'appliquer : si la
   forme revient telle qu'elle était, il revient avec elle.
   ============================================================ */
const cleLibelle = (id) => "_lab:" + id;

/* Le mode est transitoire : on y entre pour retoucher, on en sort. Il ne se
   retient pas d'une session à l'autre — ce n'est pas un réglage du salon. */
let PLACE_LIBELLES = false;
let libSel = null;      // l'objet dont on retouche le libellé
let glisseLib = null;   // le geste en cours

/**
 * Ce dont dépend le placement d'un libellé : ce qui s'y écrit, et la forme qui
 * le porte — son ancrage et la place dont il dispose autour.
 *
 * Le nom retenu est celui qui s'affiche, y compris quand l'exploitant l'a
 * choisi lui-même sur une zone : renommer, c'est écrire autre chose, et cet
 * autre chose n'a pas de raison de tenir à la même taille au même endroit.
 */
function empreinteLibelle(o){
  const a = ancre(o) || [0, 0], p = place(o) || [0, 0];
  return [o.nom || "", o.code || "",
          (+a[0]).toFixed(2), (+a[1]).toFixed(2),
          (+p[0]).toFixed(2), (+p[1]).toFixed(2)].join("|");
}

/** Le placement réglé à la main, s'il décrit encore ce qui est sur le plan. */
function placementLibelle(o){
  const r = CONF[cleLibelle(o.id)];
  return r && r.e === empreinteLibelle(o) ? r : null;
}

/**
 * Poser un placement, sans l'écrire sur le poste : un glisser en produit un
 * par image, et enregistrer à chaque fois sérialiserait toute la configuration
 * soixante fois par seconde. C'est la fin du geste qui enregistre.
 */
function posePlacement(o, change){
  const r = placementLibelle(o);
  const n = { dx: r ? r.dx || 0 : 0, dy: r ? r.dy || 0 : 0, k: r && r.k > 0 ? r.k : 1,
              e: empreinteLibelle(o) };
  change(n);
  n.dx = +(+n.dx).toFixed(2);
  n.dy = +(+n.dy).toFixed(2);
  n.k = Math.max(.4, Math.min(3, +n.k || 1));
  /* Un placement qui ne déplace ni n'agrandit rien n'est pas un réglage : il
     sort de la configuration plutôt que d'y peser et d'y vieillir. */
  if (!n.dx && !n.dy && Math.abs(n.k - 1) < .001) delete CONF[cleLibelle(o.id)];
  else CONF[cleLibelle(o.id)] = n;
  libelles();
  majPaletteLibelle();
}

/** Rendre un libellé à son placement automatique. */
function libelleAutomatique(){
  const o = libSel && parId.get(libSel);
  if (!o) return;
  delete CONF[cleLibelle(o.id)];
  enregistreConf();
  libelles();
  majPaletteLibelle();
}

function modePlacementLibelles(on){
  PLACE_LIBELLES = !!on && ADMIN;
  racine.classList.toggle("mode-libelles", PLACE_LIBELLES);
  /* Le placement et le dessin se disputeraient le glisser : entrer dans l'un
     referme l'autre, plutôt que de laisser deux gestes viser le même pointeur. */
  if (PLACE_LIBELLES && calqueActif) activeCalque(calqueActif);
  if (!PLACE_LIBELLES){ libSel = null; glisseLib = null; }
  /* On sort d'ici par quatre chemins — le crayon, la croix de la palette, la
     touche d'échappement, l'ouverture d'un calque de dessin. Le crayon se
     rallume ou s'éteint donc ici, une fois pour tous, plutôt que dans chacun. */
  const crayon = document.querySelector("#pile .rlib");
  if (crayon) crayon.setAttribute("aria-pressed", PLACE_LIBELLES);
  majPaletteLibelle();
  libelles();
}

/** La palette du libellé retouché : sa taille, et de quoi y renoncer. */
function majPaletteLibelle(){
  const z = $("libReg");
  if (!z || !ADMIN || !$("libNom")) return;
  const o = libSel && parId.get(libSel);
  z.classList.toggle("open", !!(PLACE_LIBELLES && o));
  if (!(PLACE_LIBELLES && o)) return;
  const r = placementLibelle(o);
  $("libNom").textContent = o.nom || o.code ||
    (o.kind === "zone" ? "Zone sans nom" : "Stand");
  $("libTaille").value = r && r.k ? r.k : 1;
  $("libAuto").disabled = !r;
  $("libAide").textContent = r
    ? "Glissez le libellé, ou ajustez-le aux flèches du clavier."
    : "Glissez ce libellé pour le déplacer, ou tirez la taille.";
}

/** Choisir le libellé qu'on retouche — au clic, ou en le glissant. */
function choisitLibelle(id){
  libSel = id;
  libelles();
  majPaletteLibelle();
}

/** Le pas du clavier : un quart de mètre, un mètre touche majuscule tenue. */
function pousseLibelle(dx, dy){
  const o = libSel && parId.get(libSel);
  if (!o) return;
  posePlacement(o, n => { n.dx += dx; n.dy += dy; });
  enregistreConf();
}

/* --- le geste ; renvoie vrai si l'événement est consommé --- */
function libellePointerDown(e){
  if (!PLACE_LIBELLES) return false;
  const g = e.target.closest("#labels .lbl");
  if (!g) return false;
  const o = parId.get(g.dataset.lbl);
  if (!o) return false;
  e.preventDefault();
  choisitLibelle(o.id);
  const r = placementLibelle(o);
  glisseLib = { o: o, depart: versPlan(e.clientX, e.clientY),
                dx: r ? r.dx || 0 : 0, dy: r ? r.dy || 0 : 0 };
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  return true;
}

function libellePointerMove(e){
  if (!glisseLib) return false;
  const p = versPlan(e.clientX, e.clientY);
  const dx = glisseLib.dx + p[0] - glisseLib.depart[0];
  const dy = glisseLib.dy + p[1] - glisseLib.depart[1];
  posePlacement(glisseLib.o, n => { n.dx = dx; n.dy = dy; });
  return true;
}

function libellePointerUp(e){
  if (!glisseLib) return false;
  glisseLib = null;
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  enregistreConf();
  return true;
}

if ($("libFerme")) $("libFerme").onclick = () => modePlacementLibelles(false);
if ($("libAuto")) $("libAuto").onclick = libelleAutomatique;
if ($("libTaille")){
  $("libTaille").oninput = e => {
    const o = libSel && parId.get(libSel);
    if (o) posePlacement(o, n => { n.k = +e.target.value; });
  };
  $("libTaille").onchange = enregistreConf;
}

/* ============================================================
   11. Calques de dessin
   Des calques créés par l'exploitant, propres à un pavillon, sur lesquels
   il trace rectangles, polygones, lignes et textes. Le tracé est enregistré
   en mètres dans le repère du plan : il suit le zoom comme le reste.
   ============================================================ */
const CLE_DESSINS = "plan-dessins";
let DESSINS = {};
try { DESSINS = JSON.parse(localStorage.getItem(CLE_DESSINS) || "{}"); } catch (e) {}

/* Ce qui n'est pas encore parti en base.
   Les dessins vivent à deux endroits : la base, qui fait foi pour les
   visiteurs, et le poste, où l'exploitant travaille. Au chargement, la base
   écrasait le poste sans rien demander — un calque tracé puis non publié
   disparaissait au premier rechargement, alors qu'il était encore dans le
   stockage local. Il ne se perdait pas : il devenait invisible, puis
   l'enregistrement suivant l'effaçait pour de bon.

   On retient donc, pavillon par pavillon, qu'un dessin a bougé depuis la
   dernière publication. Ce travail-là l'emporte sur la base tant qu'il n'y est
   pas parti — lui seul n'existe nulle part ailleurs. */
const CLE_ATTENTE = "plan-dessins-attente";
let ATTENTE = {};
try { ATTENTE = JSON.parse(localStorage.getItem(CLE_ATTENTE) || "{}"); } catch (e) {}

/** Le pavillon a-t-il des dessins que la base ne connaît pas encore ? */
const enAttente = (id) => !!ATTENTE[id];

/* L'instant du geste plutôt qu'un simple « oui » : l'envoi relève la marque
   avant d'écrire et ne l'efface qu'inchangée, faute de quoi un trait tracé
   pendant l'envoi se croyait publié — et le chargement suivant l'écrasait par
   ce que la base, qui ne l'avait pas reçu, en disait. */
function marqueAttente(id, oui){
  if (oui) ATTENTE[id] = Date.now(); else delete ATTENTE[id];
  try { localStorage.setItem(CLE_ATTENTE, JSON.stringify(ATTENTE)); } catch (e) {}
  majAttente();
}

/** Les calques de dessin du pavillon courant. Ceux du service ont été repris
 *  au chargement ; il ne reste qu'à ouvrir la liste si elle manque. */
const mesCalques = () => (DESSINS[P().id] = DESSINS[P().id] || []);
const enregistreDessins = () => {
  /* Les repères et les formes dessinées entrent dans le calcul d'itinéraire :
     la grille de marche qui les ignore n'a plus cours, et l'annuaire des
     passages non plus. On attend la fin du geste — dessiner en referait une à
     chaque image, ce qui serait insoutenable. */
  oublieGrilles();
  oublieLiaisons();
  // les formes posées servent d'aimants aux suivantes : le relevé a vieilli
  oublieAimants();
  // un repère vient peut-être d'être posé, renommé ou retiré de la recherche
  oublieReperes();
  rafraichitApercu();
  /* Le geste vient d'écarter le poste de ce que la base contient : c'est vrai
     dès la première forme tracée, et non au moment où l'on pense à publier. */
  marqueAttente(P().id, true);
  try { localStorage.setItem(CLE_DESSINS, JSON.stringify(DESSINS)); }
  catch (e) {
    // les images sont encodées dans le document : le quota se remplit vite
    if ($("outilsAide")) $("outilsAide").textContent =
      "Mémoire du navigateur pleine : allégez ou supprimez une image.";
  }
  /* Et en base, dès que le geste s'arrête : le poste n'est qu'un cache, et
     c'est justement quand son quota déborde que la base doit avoir le dessin. */
  programmePublication();
};

let calqueActif = null;   // id du calque en cours d'édition
let outil = "main";
let enCours = null;       // tracé en construction

/* Historique des dessins. L'instantané ne copie que les calques et leurs
   tableaux de formes : les formes elles-mêmes, images comprises, sont
   partagées par référence — mémoriser reste donc quasi gratuit. */
const HIST = [], REFAIRE = [];
const instantane = () => mesCalques().map(c => Object.assign({}, c, { formes: c.formes.slice() }));
function memorise(){
  HIST.push(instantane());
  if (HIST.length > 50) HIST.shift();
  REFAIRE.length = 0;
}
function restaure(source, autre){
  if (!source.length) return false;
  autre.push(instantane());
  DESSINS[P().id] = source.pop();
  if (calqueActif && !trouveCalque(calqueActif)) activeCalque(null);
  enregistreDessins(); dessineDessins();
  if (ADMIN) construitPanneau();
  return true;
}
function annule(){
  // pendant un tracé, on retire le dernier sommet plutôt que l'action entière
  if (enCours && enCours.pts.length > 1){
    enCours.pts.pop();
    apercu(cheminForme({ t: "ligne", pts: enCours.pts }));
    apercuGuide(null);
    aide();
    return;
  }
  if (enCours){ termineTrace(false); return; }
  if (!restaure(HIST, REFAIRE)) $("outilsAide").textContent = "Rien à annuler.";
}
function refais(){ restaure(REFAIRE, HIST); }

const trouveCalque = id => mesCalques().find(c => c.id === id);
const nouvelId = () => "d" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

/* --- rendu --- */

/**
 * Le tracé d'une suite de sommets, coins abattus d'un rayon donné.
 *
 * Un relevé de bureau d'études décrit un bâtiment ; un plan de visiteur décrit
 * un lieu. Le second veut des murs francs et des angles doux, là où le premier
 * détaille chaque battant de porte. D'où ce rayon : il tient en mètres, comme
 * le reste du tracé, et suit donc le zoom au lieu de s'épaissir avec lui.
 *
 * Le rayon demandé n'est qu'un maximum. Un angle serré entre deux murs courts
 * n'a pas la place de l'accueillir : la coupe s'arrête alors à la moitié du
 * plus court des deux côtés, et l'arrondi se resserre d'autant. Sans cette
 * limite, deux coins voisins se mangeraient l'un l'autre et le contour se
 * retournerait.
 */
function cheminArrondi(pts, r, ferme){
  const n = pts.length;
  const droit = "M" + pts.map(p => p[0] + " " + p[1]).join("L") + (ferme ? "Z" : "");
  if (!(r > 0) || n < 3) return droit;
  const cm = (x) => +x.toFixed(2);

  /* Les extrémités d'une ligne ouverte restent vives : il n'y a rien à
     raccorder au-delà. */
  const coins = new Array(n).fill(null);
  for (let i = ferme ? 0 : 1; i <= (ferme ? n - 1 : n - 2); i++){
    const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
    const lu = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const lv = Math.hypot(c[0] - b[0], c[1] - b[1]);
    if (!lu || !lv) continue;
    const u = [(a[0] - b[0]) / lu, (a[1] - b[1]) / lu];
    const v = [(c[0] - b[0]) / lv, (c[1] - b[1]) / lv];
    // un sommet aligné ou replié sur lui-même n'a pas d'angle à adoucir
    const theta = Math.acos(Math.max(-1, Math.min(1, u[0] * v[0] + u[1] * v[1])));
    if (theta < .05 || Math.PI - theta < .05) continue;
    const t = Math.min(r / Math.tan(theta / 2), lu / 2, lv / 2);
    // le sens de l'arc suit celui du virage ; l'axe des ordonnées descend,
    // un produit vectoriel positif tourne donc dans le sens des aiguilles
    const sens = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]) > 0 ? 1 : 0;
    coins[i] = { e: [cm(b[0] + u[0] * t), cm(b[1] + u[1] * t)],
                 s: [cm(b[0] + v[0] * t), cm(b[1] + v[1] * t)],
                 r: cm(t * Math.tan(theta / 2)), sens };
  }
  if (coins.every(c => !c)) return droit;

  const point = (p) => p[0] + " " + p[1];
  const depart = ferme && coins[0] ? coins[0].s : pts[0];
  let d = "M" + point(depart);
  for (let k = 1; k <= (ferme ? n : n - 1); k++){
    const co = coins[k % n];
    d += co ? "L" + point(co.e) + "A" + co.r + " " + co.r + " 0 0 " + co.sens + " " + point(co.s)
            : "L" + point(pts[k % n]);
  }
  return d + (ferme ? "Z" : "");
}

/* Rectangle, image, stand dessiné : trois formes que deux coins opposés
   suffisent à tenir. Le tracé, les poignées et le redimensionnement les
   traitent donc ensemble. */
const estCadre = (f) => f.t === "rect" || f.t === "image" || f.t === "stand";

function cheminForme(f){
  if (estCadre(f)){
    const [a, b] = f.pts;
    const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
    const w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    // une image porte son propre cadrage : l'arrondir rognerait le visuel
    if (f.t !== "image" && f.r > 0)
      return cheminArrondi([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], f.r, true);
    return "M" + x + " " + y + "h" + w + "v" + h + "h" + (-w) + "Z";
  }
  return cheminArrondi(f.pts, f.r || 0, f.t !== "ligne");
}
/* --- épaisseur et style du trait ---
   Le trait des calques ne grossit pas avec le zoom : son épaisseur se compte
   en pixels d'écran, et l'espacement des points avec elle. Rien n'est écrit
   tant que la forme ne demande rien — la feuille de style garde alors la main,
   et le pointillé qui signale un rôle d'itinéraire pendant l'édition reste
   lisible sur les tracés qu'on n'a pas réglés. */
const EPAISSEUR_TRAIT = 2;

function styleTrait(f){
  const ep = f.ep > 0 ? f.ep : EPAISSEUR_TRAIT;
  const css = [];
  if (ep !== EPAISSEUR_TRAIT) css.push("stroke-width:" + ep);
  /* Des points ronds plutôt que des tirets : les bouts arrondis du trait les
     dessinent d'eux-mêmes dès que la portion tracée est quasi nulle. */
  if (f.pointille) css.push("stroke-dasharray:.01 " + +(ep * 2.2).toFixed(2));
  return css.length ? ' style="' + css.join(";") + '"' : "";
}

/** Ce que la palette règle, posé sur la ligne qui vient d'être tracée. On ne
 *  retient que l'écart au trait ordinaire : une ligne sans réglage suit son
 *  calque, aujourd'hui comme le jour où il changera d'allure. */
function poseTrait(f){
  const e = $("traitEpaisseur"), s = $("traitStyle");
  const ep = e ? parseFloat(e.value) : NaN;
  if (isFinite(ep) && ep > 0 && ep !== EPAISSEUR_TRAIT) f.ep = ep;
  if (s && s.value === "pointille") f.pointille = true;
}

function dessineDessins(){
  const c = $("couches");
  c.querySelectorAll(".dcal").forEach(g => g.remove());
  for (const cal of mesCalques()){
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const role = roleIti(cal);
    g.setAttribute("class", "dcal" + (cal.rempli ? " plein" : "") +
                            (role ? " role " + role : "") +
                            (cal.id === calqueActif && ADMIN ? " editable" : ""));
    g.dataset.dcal = cal.id;
    g.style.color = cal.couleur || "var(--accent)";
    g.style.display = cal.visible === false ? "none" : "";
    g.innerHTML = cal.formes.map(f => f.t === "image"
      // Le clic sur le plan cherche l'ancêtre porteur d'un data-id : une image
      // liée à un stand ouvre donc sa fiche sans code supplémentaire. C'est
      // ainsi qu'on pose le logo d'un exposant sur son emplacement.
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") +
        (f.stand && parId.has(f.stand) ? " lie" : "") + '" data-f="' + f.id + '"' +
        (f.stand && parId.has(f.stand) ? ' data-id="' + esc(f.stand) + '"' : "") +
        '><image href="' + f.src + '" x="' + f.pts[0][0] +
        '" y="' + f.pts[0][1] + '" width="' + (f.pts[1][0] - f.pts[0][0]) +
        '" height="' + (f.pts[1][1] - f.pts[0][1]) +
        '" preserveAspectRatio="xMidYMid meet"/></g>'
      : f.t === "repere"
      ? traceRepere(f)
      : f.t === "stand"
      ? traceStandDessine(f)
      : f.t === "texte"
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id + '"><text x="' + f.pts[0][0] + '" y="' + f.pts[0][1] +
        '" font-size="' + (f.taille || 2) + '">' + esc(f.txt) + '</text></g>'
      : '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id +
        '"><path' + styleTrait(f) + ' d="' + cheminForme(f) + '"/></g>').join("");
    c.appendChild(g);
  }
  ordonneDom();
  cartouchePoi();
  /* Les stands dessinés viennent de renaître : la teinte de leur secteur et le
     fondu du filtre se posent sur des nœuds qui n'existaient pas encore. */
  rafraichitStandsDessines();
}

/* --- conversion écran → repère du plan --- */
function versPlan(clientX, clientY){
  const r = cadrePlan();
  return [ +(view.x + (clientX - r.left) / r.width * view.w).toFixed(2),
           +(view.y + (clientY - r.top) / r.height * view.h).toFixed(2) ];
}

function apercu(d){
  let el = $("apercu");
  if (!d){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.id = "apercu";
    svg.appendChild(el);
  }
  el.setAttribute("d", d);
}

/** Le trait fin qui montre sur quoi le point vient de s'aligner. */
function apercuGuide(d){
  let el = $("apercuGuide");
  if (!d){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.id = "apercuGuide";
    svg.appendChild(el);
  }
  el.setAttribute("d", d);
}

/* ------------------------------------------------------------
   Aide au tracé d'un contour de hall
   ------------------------------------------------------------
   Le fond de plan vient d'un relevé technique : il porte l'épaisseur des
   murs, le battant de chaque porte, le moindre décrochement de poteau. Un
   visiteur n'a que faire de tout cela — il lui faut la silhouette du
   pavillon, franche, pour savoir où il est. On la retrace donc par-dessus,
   et deux choses suffisent à la rendre nette : des segments redressés, et
   des angles adoucis. Les portes disparaissent d'elles-mêmes, puisqu'on ne
   les suit pas.
   ------------------------------------------------------------ */

/** Ce que la main sait viser : douze pixels d'écran, convertis en mètres. */
function toleranceTrace(){
  const r = cadrePlan();
  return r.width ? view.w / r.width * 12 : .3;
}

const aimanteContour = () =>
  !$("contourAimant") || $("contourAimant").checked;

const rayonContour = () => {
  const v = parseFloat($("contourRayon") ? $("contourRayon").value : "");
  return isFinite(v) && v > 0 ? v : 0;
};

/**
 * Le prochain sommet, redressé.
 *
 * Deux corrections, dans cet ordre. La direction d'abord : elle bascule sur
 * le huitième de tour le plus proche, ce qui donne des murs d'équerre et des
 * pans coupés à quarante-cinq degrés sans viser. La longueur ensuite : si le
 * point tombe près de la verticale ou de l'horizontale d'un sommet déjà posé,
 * il s'y accroche. C'est ce second réglage qui fait qu'un contour se referme
 * exactement là où il a commencé, au lieu de laisser un décalage d'un
 * dixième de mètre que le zoom finit toujours par montrer.
 *
 * `guide` reçoit le sommet servi de référence, s'il y en a un : l'appelant en
 * tire le trait qui l'explique.
 */
function redresseTrace(p, pts, guide){
  if (guide) guide.q = null;
  if (!pts.length || !aimanteContour()) return p;
  const tol = toleranceTrace();
  const b = pts[pts.length - 1];
  const dx = p[0] - b[0], dy = p[1] - b[1];
  const l = Math.hypot(dx, dy);
  if (l < 1e-6) return p;
  const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
  const ux = Math.cos(a), uy = Math.sin(a);
  let x = b[0] + ux * l, y = b[1] + uy * l, meilleur = null;
  for (const q of pts){
    /* On cherche la longueur qui met le point sur l'abscisse — ou l'ordonnée
       — du sommet q. Une direction presque parallèle à l'axe visé donnerait
       une longueur démesurée pour un gain nul : on l'écarte. */
    for (const axe of [0, 1]){
      const c = axe ? uy : ux;
      if (Math.abs(c) < .3) continue;
      const l2 = (q[axe] - b[axe]) / c;
      if (l2 < tol) continue;              // derrière soi, ou sur soi
      const px = b[0] + ux * l2, py = b[1] + uy * l2;
      const ecart = Math.hypot(px - x, py - y);
      if (ecart < tol && (!meilleur || ecart < meilleur.ecart))
        meilleur = { x: px, y: py, ecart, q, axe };
    }
  }
  if (meilleur){
    x = meilleur.x; y = meilleur.y;
    if (guide) guide.q = meilleur;
  }
  return [+x.toFixed(2), +y.toFixed(2)];
}

/** Le trait pointillé qui relie le sommet de référence au point accroché. */
function traceGuide(g, p){
  if (!g || !g.q){ apercuGuide(null); return; }
  const q = g.q.q;
  apercuGuide("M" + q[0] + " " + q[1] + "L" + p[0] + " " + p[1]);
}

/** Le contour se referme quand on revient sur son premier sommet. */
function fermeIci(p, pts){
  if (pts.length < 3) return false;
  return Math.hypot(p[0] - pts[0][0], p[1] - pts[0][1]) < toleranceTrace() * 1.5;
}

function ajouteForme(f){
  const c = trouveCalque(calqueActif);
  if (!c) return;
  memorise();
  f.id = nouvelId();
  c.formes.push(f);
  enregistreDessins();
  dessineDessins();
  aide();
  return f.id;
}
