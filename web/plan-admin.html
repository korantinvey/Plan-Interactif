<!doctype html>
<html lang="fr" data-role="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan du salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="config.js"></script>

<style>
:root{
  --ground:#E9EAE4; --surface:#FBFBF8; --surface-2:#F1F2EC;
  --line:#D2D5CB; --line-strong:#B4B9AC;
  --ink:#15181A; --ink-2:#4A4F52; --ink-3:#7C8285;
  --accent:#2F49D1; --accent-soft:#DCE1FA;
  --zone:#C98A06; --zone-soft:#F7EAC6;
  --stand:#FFFFFF; --stand-line:#9AA095; --libre:#E3E5DD;
  --plan-line:#A8AEA1; --plan-ink:#8A9082;
  --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px -12px rgba(20,24,26,.18);
  --radius:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427;
    --line:#2A3034; --line-strong:#3B4348;
    --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
    --accent:#7A8CFF; --accent-soft:#232C55;
    --zone:#F0B429; --zone-soft:#3A2F12;
    --stand:#252C30; --stand-line:#4C555A; --libre:#1C2124;
    --plan-line:#3E474C; --plan-ink:#5A6469;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427;
  --line:#2A3034; --line-strong:#3B4348;
  --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
  --accent:#7A8CFF; --accent-soft:#232C55;
  --zone:#F0B429; --zone-soft:#3A2F12;
  --stand:#252C30; --stand-line:#4C555A; --libre:#1C2124;
  --plan-line:#3E474C; --plan-ink:#5A6469;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
input,textarea,.detail-bd{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* `100vh` vaut, sur un navigateur mobile, la hauteur barre d'outils masquée :
   le bas de la page tombe sous l'écran, et tout ce qui s'y ancre — cartouche
   des points d'intérêt, boutons de zoom, échelle — descend avec lui. Le tiroir,
   lui, est `position:fixed` et se cale sur le bas réellement visible. Les deux
   se manquaient de la hauteur exacte de la barre du navigateur, si bien que le
   cartouche recouvrait la recherche et que le bouton « ajuster » passait
   dessous. `100dvh` suit cette barre et remet tout le monde d'accord. */
.app{user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:330px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh;min-height:560px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;height:60px;
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand .sub{color:var(--ink-3);font-size:12px;white-space:nowrap}
.stats{display:flex;gap:18px;margin-left:auto;font-size:12px;color:var(--ink-3)}
@media (max-width:1150px){.stats{display:none}}
.stats b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.2}
.halls{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--radius)}
.halls button{padding:5px 13px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.halls button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.halls button .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-left:6px}
.row .hall{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  padding:1px 5px;border-radius:3px;background:var(--surface-2);color:var(--ink-3);margin-left:6px;vertical-align:1px}
.tools{display:flex;gap:6px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-2);background:var(--surface)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.iconbtn svg{width:15px;height:15px}

.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* La poignée du tiroir : sur écran étroit la liste se hisse par-dessus le
   plan, et cette barre est la prise qu'on saisit. Sur grand écran la liste a
   sa colonne, il n'y a pas de tiroir, donc pas de prise. */
.poignee{display:none}
.search{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.search-field{position:relative}
.search-field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.search input{width:100%;padding:9px 10px 9px 32px;background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--radius)}
.search input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.filters{display:flex;gap:5px;margin-top:10px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.count{padding:9px 16px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;width:100%;text-align:left;
  padding:9px 16px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row .code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;padding:3px 0;
  text-align:center;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-2)}
.row[aria-current="true"] .code{border-color:var(--accent);color:var(--accent)}
.row.z .code{border-style:dashed;border-color:var(--zone);color:var(--zone)}
.row.l .code{opacity:.5}
/* Le second bloc d'une ligne doit pouvoir rétrécir sous la largeur de son
   texte : sans cela il s'étire à la taille du nom, et l'ellipse annoncée plus
   bas ne se déclenche jamais — le nom se coupait net au bord de l'écran. */
.row>span{min-width:0}
/* `overflow` ne s'applique pas à une boîte en ligne : tant que ces deux-là
   étaient de simples `span`, l'ellipse annoncée ici ne se déclenchait jamais
   et les noms longs se coupaient net. Les passer en bloc la rend effective —
   le retour à la ligne qui les séparait devient alors inutile. */
.row .nm{display:block;font-weight:500;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px}

.stage{position:relative;overflow:hidden;background:var(--ground)}
.stage svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage svg.dragging{cursor:grabbing}

/* Chaque sous-calque garde sa teinte Klipso, portée par `color` ; les tracés
   noirs d'origine héritent de la couleur du thème et suivent clair / sombre. */
#couches .cal{color:var(--plan-line)}
#couches .cal path,#couches .cal polyline,#couches .cal circle{stroke-width:.7;vector-effect:non-scaling-stroke}
/* Le groupe d'un calque porte stroke: currentColor pour ses tracés. Un texte
   en hérite aussi, avec l'épaisseur par défaut d'une unité — soit un mètre ici,
   trois fois la hauteur des glyphes : les mots devenaient des taches. Un texte
   se peint, il ne se contourne pas. */
#couches .cal text{fill:currentColor;stroke:none;font-family:"Instrument Sans",sans-serif}

/* Une zone se peignait à 22 % de la couleur choisie, quand un stand la prend
   telle quelle : le nuancier annonçait un ocre franc et le plan rendait un
   beige. La moitié rapproche les deux sans écraser le nom posé par-dessus, qui
   se lit sur le fond de la zone. */
/* Une image liée à un stand s'ouvre au clic comme le stand lui-même. */
/* Les calques de dessin laissent passer le clic vers le plan. Une image liée à
   un stand est l'exception : elle doit s'ouvrir comme lui, y compris sur la
   page publique où le mode édition n'existe pas. */
.dcal .forme.lie{cursor:pointer;pointer-events:auto}
.dcal .forme.lie image{pointer-events:all}
.zone path{fill:var(--c-zone,var(--zone));fill-opacity:.5;
  stroke:var(--c-zone,var(--zone));stroke-width:1.2;
  vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
.stand path{fill:var(--c-stand,var(--stand));stroke:var(--stand-line);
  stroke-width:1;vector-effect:non-scaling-stroke}
.stand:hover path,.zone:hover path{fill:var(--accent-soft)}
.stand.sel path,.zone.sel path{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.stand,.zone{cursor:pointer}
.dim{opacity:.22}

/* le contour de focus par défaut dessine un gros rectangle noir autour du
   groupe SVG : on le remplace par un renforcement du tracé du stand */
.stage svg{-webkit-tap-highlight-color:transparent}
.stand:focus,.zone:focus{outline:none}
.stand:focus-visible,.zone:focus-visible{outline:none}
.stand:focus-visible path,.zone:focus-visible path{stroke:var(--accent);stroke-width:3}

#labels text{pointer-events:none;text-anchor:middle;fill:var(--c-lab-stand,var(--ink-2));
  font-family:"IBM Plex Mono",monospace;font-weight:500}
#labels text.nm{font-family:"Instrument Sans",sans-serif;font-weight:600;fill:var(--c-lab-stand,var(--ink))}
#labels text.zn{font-family:"Instrument Sans",sans-serif;font-weight:600;fill:var(--c-lab-zone,var(--zone))}
#labels text.sel{fill:var(--accent);font-weight:700}
.sans-lab-stand #labels text:not(.zn){display:none}
.sans-lab-zone #labels text.zn{display:none}

/* --- calques de dessin --- */
.dcal{pointer-events:none}
.dcal path{fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;stroke-linecap:round}
.dcal.plein path{fill:currentColor;fill-opacity:.25}
.dcal text{fill:currentColor;font-family:"Instrument Sans",sans-serif;font-weight:600;text-anchor:middle}
.dcal.editable{pointer-events:auto}
/* En mode sélection, tous les calques de dessin répondent, pas seulement celui
   qu'on modifie : cliquer une forme d'un autre calque l'active. Sans cela, une
   image posée sur un calque inactif restait sourde et rien ne le disait. */
html.mode-edition .dcal{pointer-events:auto}
html.mode-edition .dcal path,html.mode-edition .dcal image,
html.mode-edition .dcal text,html.mode-edition .dcal rect{pointer-events:all}
/* une forme en contour seul doit rester attrapable par son intérieur */
.dcal.editable path,.dcal.editable image,.dcal.editable text{pointer-events:all}
.dcal .forme{cursor:pointer}
.dcal.editable .forme.pick{cursor:move}
@keyframes halo{0%{opacity:.15}35%{opacity:1}100%{opacity:1}}
.dcal .forme.neuve{animation:halo .5s ease-out 2}
.dcal .forme.neuve path,.dcal .forme.neuve image,.dcal .forme.neuve text{
  outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dcal .forme.neuve{animation:none}}

#apercu{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-dasharray:6 4;pointer-events:none}

.outils{position:absolute;top:12px;left:12px;z-index:6;display:none;flex-direction:column;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:10px 12px;width:212px}
.outils.open{display:flex}
.outilsTete{display:flex;align-items:center;justify-content:space-between;gap:8px}
.outilsActs{display:flex;align-items:center;gap:2px}
.outilsTete button{color:var(--ink-3);font-size:17px;line-height:1;padding:0 3px}
#renommeOutils{font-size:12px}
.outilsTete button:hover{color:var(--ink)}
.outilsBtns{display:flex;gap:4px}
.outilsBtns button{flex:1;height:28px;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-2);font-size:13px;display:grid;place-items:center}
.outilsBtns button:hover{border-color:var(--line-strong);color:var(--ink)}
.outilsBtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.outils input{width:100%;padding:6px 8px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.outils input:focus{border-color:var(--accent);outline:none}
.outils .choix{display:none;width:100%;padding:7px;border:1px solid var(--accent);
  border-radius:var(--radius);font-size:12.5px;color:var(--accent);background:var(--surface)}
.outils .choix:hover{background:var(--accent);color:#fff}
.outils.mode-image .choix{display:block}
.outils #texteADessiner{display:none}
.outils.mode-texte #texteADessiner{display:block}
#vignette{display:none;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.outils.mode-image #vignette[data-prete]{display:flex}
#vignette img{width:40px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
.dcal image{pointer-events:none}
.dcal.editable image{pointer-events:auto}
.elem{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;
  border-top:1px solid var(--line)}
.elem[hidden]{display:none}
/* Un repère matérialise ce que le plan ne nomme pas : sanitaires, entrées,
   accueil. Une pastille dans la couleur du calque, un libellé court dedans. */
#repereChoix,#repereTexte{display:none}
.outils.mode-repere #repereChoix,.outils.mode-repere #repereTexte{display:block}
#repereChoix,#repereTexte{width:100%;padding:6px 8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px}
.dcal .repere > rect{fill:currentColor;stroke:none}
/* même raison : le pictogramme posé sur le plan tient ses dimensions de ses
   attributs, que « .stage svg » écraserait */
.dcal svg.glyphe{width:auto;height:auto}
.dcal .repere .glyphe path{fill:var(--surface);stroke:none}
.dcal .repere text{fill:var(--surface);font-weight:700;text-anchor:middle}
.elemTete{display:flex;align-items:center;justify-content:space-between}
.elemChamp{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
.elemChamp input{flex:1;min-width:0}
.elemChamp[hidden]{display:none}
.btnSup{color:var(--ink-3);font-size:13px;line-height:1;padding:1px 3px}
.btnSup:hover{color:#C2372B}
.elem input{width:100%;padding:6px 8px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.elem input:focus{border-color:var(--accent);outline:none}

#poignees{pointer-events:none}
#poignees .cadreSel{fill:none;stroke:var(--accent);stroke-width:1;
  stroke-dasharray:5 4;vector-effect:non-scaling-stroke;opacity:.8}
#poignees .pgn{fill:var(--surface);stroke:var(--accent);stroke-width:1.6;
  vector-effect:non-scaling-stroke;pointer-events:auto}
#poignees .pgn:hover{fill:var(--accent-soft)}
.outilsPied{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-3)}
.calq .mv{width:15px;height:18px;border:none;color:var(--ink-3);font-size:11px;line-height:1;padding:0}
.calq .mv:hover{color:var(--ink)}
.calq .mv[disabled]{opacity:.25;cursor:default}
.calq .ren{width:18px;height:18px;border:none;color:var(--ink-3);font-size:11px;line-height:1}
.calq .ren:hover{color:var(--accent)}
.calq .ren[aria-pressed="true"]{color:var(--accent)}
.mcorps input.nomcalque{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-2);color:var(--ink)}
.mcorps input.nomcalque:focus{border-color:var(--accent);outline:none}
.calq .sup{width:18px;height:18px;border:none;color:var(--ink-3);font-size:14px;line-height:1}
.calq .sup:hover{color:#C2372B}
.calq.perso label span{font-weight:600}
.calq .renom{width:100%;font-size:12.5px;padding:2px 5px;border:1px solid var(--accent);
  border-radius:3px;background:var(--surface-2);color:var(--ink)}
.calq.actif{background:var(--accent-soft);border-radius:3px;margin:0 -4px;padding:2px 4px}
.panel .ajout{width:100%;margin-top:6px;padding:6px;border:1px dashed var(--line-strong);
  border-radius:var(--radius);font-size:12px;color:var(--ink-2)}
.panel .ajout:hover{border-color:var(--accent);color:var(--accent)}

/* `display:flex` ci-dessous l'emporte sur la règle du navigateur qui masque un
   élément portant « hidden » : sans cette ligne, l'attribut ne masque rien. */
.zoombar[hidden]{display:none}
.zoombar{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.zoombar button{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.zoombar button+button{border-top:1px solid var(--line)}
.zoombar button:hover{color:var(--ink);background:var(--surface-2)}
.zoombar svg{width:14px;height:14px}
/* Cartouche des points d'intérêt, au bas du plan. Il ne paraît que s'il y a
   des repères, et se retire de l'échelle pour ne pas la masquer. */
/* Centré par des marges automatiques, et non par « left:50% » : un élément
   absolu ancré au milieu ne peut s'étendre que vers la droite, si bien que sa
   largeur était plafonnée à la moitié de l'écran. Le cartouche passait à la
   ligne pour deux pixels manquants, et le « max-width » annoncé plus bas ne
   servait à rien. Ancré des deux côtés, il dispose enfin de toute la largeur. */
.poi{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;bottom:16px;z-index:12;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(760px,72%);
  padding:7px 9px;background:var(--surface);border:1px solid var(--line);
  /* le rayon commun vaut 3 px : des angles presque vifs autour de pastilles
     entièrement rondes, et posés sur un tiroir aux coins adoucis */
  border-radius:12px;box-shadow:var(--shadow)}
.poi[hidden]{display:none}
.poiBtn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  font-size:12px;cursor:pointer}
.poiBtn:hover{border-color:var(--line-strong);color:var(--ink)}
.poiBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.poiBtn i{font-style:normal;font-size:10.5px;opacity:.7}
/* « .stage svg » impose 100 % à tout SVG du plan : il faut une règle plus
   précise pour que le pictogramme du cartouche garde sa taille. */
.poi .poiPicto{width:17px;height:17px;flex:none}
.poi .poiPicto path{fill:currentColor}
/* Mise en avant : tout le plan s'efface sauf les repères retenus, qui gagnent
   un liseré et un halo battant. Faire pulser le repère lui-même le rendait
   invisible une fois sur deux — c'est l'inverse de l'effet recherché. */
html.poi-actif #stands,html.poi-actif #zones,html.poi-actif #labels,
html.poi-actif #couches .cal,
html.poi-actif .dcal .forme:not(.phare){opacity:.55}
.dcal .repere.phare > rect{stroke:var(--surface);stroke-width:.5;paint-order:stroke}
.dcal .repere.phare{animation:pulsePoi 1.4s ease-in-out infinite}
@keyframes pulsePoi{
  0%,100%{filter:drop-shadow(0 0 .3px var(--accent))}
  50%{filter:drop-shadow(0 0 2.4px var(--accent))}
}
@media (prefers-reduced-motion:reduce){
  .dcal .repere.phare{animation:none;filter:drop-shadow(0 0 1.6px var(--accent))}
}
@media (max-width:760px){.poi{max-width:88%;bottom:12px}}

.scalebar{position:absolute;left:60px;bottom:18px;font-size:11px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;gap:7px}
.scalebar i{display:block;height:6px;border:1px solid var(--ink-3);border-top:none}

.crayon{border:none;background:none;color:var(--ink-3);font-size:14px;line-height:1;

.prog .jour{position:sticky;top:-16px;z-index:1;
  margin:4px 0 3px;padding:16px 0 6px;background:var(--surface);

.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:var(--radius);font-size:12.5px;font-weight:500;border:1px solid var(--line)}
.btn:hover{border-color:var(--line-strong)}

.panel{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--line);

/* Un réglage qui ne porte sur aucun calque se range à part, sous la pile :
   aligné dedans, on le prendrait pour une couche du plan. */
.reglages{margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.reglages label{display:flex;align-items:center;gap:8px;font-size:13px;

.calq .opts{display:flex;align-items:center;gap:6px}
.fillbtn{width:20px;height:18px;border:1px solid var(--line-strong);border-radius:3px;

.fillbtn[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink)}
.fillbtn[aria-pressed="true"] svg rect{fill:currentColor}
.modale{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:none;
  place-items:center;padding:20px}
.modale.open{display:grid}
.mfen{background:var(--surface);border:1px solid var(--line);border-radius:8px;

.ordre{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}

   travail visible aux visiteurs. Il se distingue des liens qui l'entourent. */
.panel .reset.fort{display:block;width:100%;margin-bottom:8px;padding:7px 10px;

.voile{position:fixed;inset:0;background:rgba(8,10,12,.55);z-index:14;
  opacity:0;pointer-events:none;transition:opacity .2s;display:none}

@media (max-width:900px){
  /* `1fr` ne borne pas : un élément de grille garde `min-width:auto`, et la
     barre de titre — nom de l'événement et pavillons, tous en `nowrap` —
     imposait sa largeur incompressible à toute la colonne. Sur un écran de
     412 px la page s'étalait sur 579, et le plan sortait par la droite.
     `minmax(0,1fr)` autorise la colonne à rétrécir ; encore faut-il que son
     contenu l'accepte, d'où les `min-width:0` qui suivent. */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar,.brand{min-width:0}
  .topbar{gap:10px}
  .brand h1{overflow:hidden;text-overflow:ellipsis}
  /* Les pavillons défilent latéralement plutôt que de pousser les murs. C'est
     donc à eux de céder la place en premier : ils restent atteignables au
     doigt, là où un titre tronqué à trois lettres ne se retrouve pas. */
  .brand{flex:0 1 auto;max-width:40%}
  .halls{flex:1 1 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .halls::-webkit-scrollbar{display:none}
  .stats,.brand .sub{display:none}

  /* Le plan est ce qu'on vient voir : il prend toute la hauteur restante, et
     la liste se replie en tiroir posé par-dessus. Elle occupait auparavant une
     bande figée de 216 px dont la recherche et le compteur mangeaient la plus
     grande part : il restait 71 px de liste — une ligne et demie pour cinq
     cents résultats. */
  /* Trois crans plutôt que deux. Le cran du milieu est celui qui sert le
     plus : on lit la liste sans perdre le plan de vue, et c'est là qu'on
     répond à « qu'y a-t-il près de l'entrée ». Tout ou rien obligeait à
     choisir entre les deux. */
  .side{
    position:fixed;left:0;right:0;bottom:0;z-index:12;
    height:82vh;height:82dvh;
    border-right:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    transform:translateY(calc(100% - var(--replie,164px)));
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .side[data-cran="demi"]{transform:translateY(calc(100% - 46dvh))}
  .side[data-cran="plein"]{transform:translateY(0)}
  /* Pendant le geste c'est la main qui mène, pas la transition. */
  .side.glisse{transition:none}

  .poignee{display:block;width:100%;padding:10px 0 6px;background:transparent;
    touch-action:none;cursor:grab}
  .poignee::before{content:"";display:block;width:38px;height:4px;margin:0 auto;
    border-radius:999px;background:var(--line-strong)}

  /* Les commandes du plan se posent au-dessus du tiroir replié : ancrées en
     bas comme elles l'étaient, il les recouvrait. */
  .zoombar{bottom:calc(var(--replie,150px) + 14px)}
  .scalebar{bottom:calc(var(--replie,150px) + 18px)}
  .poi{bottom:calc(var(--replie,150px) + 12px)}
  .panel{top:auto;bottom:calc(var(--replie,150px) + 12px);right:12px}

  /* La fiche devient un tiroir elle aussi. En fenêtre centrée sur voile, elle
     masquait le plan au moment précis où l'on venait d'y désigner un stand :
     on perdait de vue ce qu'on regardait. Posée en bas, elle laisse le plan
     visible et manipulable derrière — c'est pour cela qu'il n'y a plus de
     voile, qui interceptait aussi les gestes. */
  .voile{display:none}
  .detail{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:56dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    /* au-dessus du tiroir de la liste, qui se replie quand elle s'ouvre */
    z-index:13;
    transform:translateY(100%);opacity:1;pointer-events:none;
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .detail.open{transform:translateY(0);pointer-events:auto}
  .detail-hd{padding:16px 16px 13px}
  /* seul le corps défile : le nom et le code restent sous les yeux */
  .detail-bd{padding:14px 16px 18px;overflow-y:auto}
}

/* Le fond de plan arrive après les stands : un fondu vaut mieux qu'une
   apparition brutale sous le curseur. */
#couches .cal{animation:parait .25s ease-out}
@keyframes parait{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#couches .cal{animation:none}}

<script data-api="/api/plan" data-slug="smcl-2026">
/* Sans viewport, un mobile rend la page dans un viewport virtuel de 980 px :
   les requêtes média ne se déclenchent pas et tout est réduit à la loupe. */
if (!document.querySelector('meta[name="viewport"]')){
  const mv = document.createElement("meta");
  mv.name = "viewport";
  mv.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}

const $ = id => document.getElementById(id);
const svg = $("plan");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Deux origines possibles pour les données : figées dans la page, ou
   servies par l'API. La page est la même, seul le démarrage diffère. */
const API = document.currentScript?.dataset.api || "";
const SLUG = new URLSearchParams(location.search).get("plan") || document.currentScript?.dataset.slug || "";

let DATA = null, TOUS = [], parId = new Map();
const state = { q: "", filtre: null, sel: null, plan: 0 };
const P = () => DATA.plans[state.plan];
let view, emp;

/* ============================================================
   1. Index global — la recherche porte sur tous les pavillons
   ============================================================ */
function indexe(d){
  DATA = d;
  DATA.plans.forEach((p, i) => {
    p.i = i;
    p.court = String(p.libelle).replace(/^Pavillons*/i, "");
    p.zones = p.zones || [];
    p.stands = p.stands || [];
    p.fond = p.fond || [];
    p.conferences = p.conferences || [];
    // le programme d'une zone se lit d'un coup, et il est déjà chronologique
    p.parZone = new Map();
    p.conferences.forEach(c => {
      if (!c.zone) return;
      if (!p.parZone.has(c.zone)) p.parZone.set(c.zone, []);
      p.parZone.get(c.zone).push(c);
    });
    p.parZone.forEach(l => l.sort((a, b) =>
      String(a.debutLocal || a.debut || "").localeCompare(String(b.debutLocal || b.debut || ""))));
    p.zones.forEach(z => { z.kind = "zone"; z.p = i; });
    p.stands.forEach(s => { s.kind = "stand"; s.p = i; });
  });
  /* L'habillage choisi par l'exploitant vient du service et l'emporte sur ce
     que garde le poste : c'est lui que les visiteurs doivent voir, et un
     téléphone n'a rien dans son stockage local. Le poste ne sert plus que de
     cache, et de refuge si un enregistrement a échoué. */
  DATA.plans.forEach(p => {
    const a = p.apparence || {};
    if (a.reglages && Object.keys(a.reglages).length) Object.assign(CONF, a.reglages);
    if (Array.isArray(a.pile) && a.pile.length) CONF["_pile:" + p.id] = a.pile;
    if (Array.isArray(p.dessins) && p.dessins.length){
      DESSINS[p.id] = p.dessins.map(c => ({ ...c, formes: (c.formes || []).slice() }));
    }
  });

  TOUS = DATA.plans.flatMap(p => [...p.zones, ...p.stands]);
  parId = new Map(TOUS.map(o => [o.id, o]));

  const nom = DATA.evenement || "Plan du salon";
  $("titre").textContent = nom;
  // l'onglet porte le nom de l'événement chargé, pas celui du premier salon
  document.title = (document.documentElement.dataset.role === "admin"
    ? "Administration — " : "") + nom;
  $("sub").textContent = DATA.plans.length + (DATA.plans.length > 1 ? " pavillons" : " pavillon");
  $("nStands").textContent = TOUS.filter(o => o.kind === "stand").length;
  $("nExpo").textContent = TOUS.filter(o => o.kind === "stand" && o.nom).length;
  $("nZones").textContent = TOUS.filter(o => o.kind === "zone").length;
}

/* ============================================================
   2. Mesure de texte — largeur réelle dans la police de rendu
   ============================================================ */
const _cvs = document.createElement("canvas").getContext("2d");
const _lg = new Map();
function largeur(txt, police){
  const k = police[0] + police[1] + "|" + txt;
  let v = _lg.get(k);
  if (v === undefined){
    _cvs.font = police[0] + " 100px " + police[1];
    v = _cvs.measureText(txt).width / 100;
    if (!(v > 0)) v = txt.length * .55;
    _lg.set(k, v);
  }
  return v;
}
const P_NOM = ["600", '"Instrument Sans", sans-serif'];
const P_CODE = ["500", '"IBM Plex Mono", monospace'];

function decoupe(txt, n){
  if (n === 1) return [txt];
  const mots = txt.split(/\s+/);
  if (mots.length < n) return null;
  const cible = Math.ceil(txt.length / n);
  const out = [""];
  for (const m of mots){
    const cur = out[out.length - 1];
    if (cur && (cur + " " + m).length > cible && out.length < n) out.push(m);
    else out[out.length - 1] = cur ? cur + " " + m : m;
  }
  return out.length === n ? out : null;
}
function habille(txt, w, h, maxPolice, police){
  let best = null;
  for (let n = 1; n <= 3; n++){
    const lignes = decoupe(txt, n);
    if (!lignes) continue;
    const plusLarge = Math.max(...lignes.map(l => largeur(l, police)));
    const f = Math.min(w / plusLarge, h / (lignes.length * 1.18), maxPolice);
    if (!best || f > best.f) best = { f, lignes };
  }
  return best;
}
function lignesSvg(lignes, f, x, yCentre, cls){
  const dep = yCentre - ((lignes.length - 1) * f * 1.18) / 2 + f * .33;
  return lignes.map((t, i) =>
    '<text class="' + cls + '" x="' + x + '" y="' + (dep + i * f * 1.18).toFixed(2) +
    '" font-size="' + f.toFixed(2) + '">' + esc(t) + '</text>').join("");
}

/* ============================================================
   3. Rendu du pavillon courant
   ============================================================ */
/* Les calques d'habillage sont recréés à l'arrivée sur un pavillon ; ensuite
   ordonneDom() ne fait que déplacer les nœuds, ce qui rend le réordonnancement
   instantané malgré le poids du fond de plan. */
function monteHabillage(){
  const c = $("couches");
  c.querySelectorAll(".cal").forEach(g => g.remove());
  P().fond.forEach(f => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "cal");
    g.dataset.cle = f.cle;
    g.innerHTML = f.svg || "";
    c.appendChild(g);
  });
}

/* Le panneau des calques ne peut se construire qu'une fois le plan monté.
   L'identité de l'exploitant, elle, peut être vérifiée avant ou après :
   ce drapeau permet aux deux ordres d'arrivée d'aboutir. */
let MONTE = false;

function montePlan(){
  const p = P();
  $("zones").innerHTML = p.zones.map(z =>
    '<g class="zone" data-id="' + z.id + '" tabindex="0" role="button" aria-label="' +
    esc(z.nom || "zone") + '"><path d="' + z.d + '"/></g>').join("");
  $("stands").innerHTML = p.stands.map(s =>
    '<g class="stand" data-id="' + s.id + '" tabindex="0" role="button" aria-label="' +
    esc(s.nom || ("Stand " + (s.code || ""))) + '"><path d="' + s.d + '"/></g>').join("");
  emp = p.emprise;
  calqueActif = null;
  HIST.length = REFAIRE.length = 0;
  { const o = $("outils"); if (o) o.classList.remove("open"); }
  monteHabillage();
  dessineDessins();          // crée les calques de dessin puis ordonne la pile
  appliqueApparence();
  MONTE = true;
  if (ADMIN) construitPanneau();
  onglets();
}

function onglets(){
  $("halls").innerHTML = DATA.plans.map((p, i) =>
    '<button data-p="' + i + '" aria-pressed="' + (i === state.plan) + '">' +
    esc(p.libelle) + '<span class="n">' + p.stands.length + '</span></button>').join("");
  $("halls").querySelectorAll("button").forEach(b => b.onclick = () => changePlan(+b.dataset.p));
}

function changePlan(i){
  if (i === state.plan) return;
  state.plan = i;
  ferme();
  montePlan(); fit(); liste();
  chargeFond(i);
}

/* ============================================================
   4. Libellés — le nom de l'exposant prime sur le numéro
   ============================================================ */
/* Où écrire le nom, et de quelle place on dispose.
   Sur une forme découpée — un L, un U, un stand à redent — le centre de la
   boîte englobante tombe hors de la forme et cette boîte promet une largeur
   qui n'existe pas. La synchronisation calcule alors un ancrage intérieur et
   la place réellement libre autour de lui ; un rectangle n'en a pas besoin. */
const ancre = o => o.lc || o.c;
const place = o => o.lb || o.bb;

function libelles(){
  const l = $("labels"), p = P();
  const r = svg.getBoundingClientRect();
  const pxParM = (r.width || 1) / view.w;
  const dansVue = o => o.c[0] > view.x - 25 && o.c[0] < view.x + view.w + 25 &&
                       o.c[1] > view.y - 25 && o.c[1] < view.y + view.h + 25;
  let out = "";

  for (const z of p.zones){
    const sel = z.id === state.sel;
    if (!z.nom || (!sel && (!visible(z) || !dansVue(z)))) continue;
    const pz = place(z), az = ancre(z);
    const a = habille(z.nom, pz[0] * .88, pz[1] * .7, 3.4, P_NOM);
    if (!a || (!sel && a.f * pxParM < 6.5)) continue;
    out += lignesSvg(a.lignes, a.f, az[0], az[1], "zn" + (sel ? " sel" : ""));
  }

  for (const s of p.stands){
    const sel = s.id === state.sel;
    if (!sel && (!visible(s) || !dansVue(s))) continue;
    if (!s.code && !s.nom) continue;
    const ps = place(s), as = ancre(s);
    const w = ps[0], h = ps[1];

    const nom = s.nom ? habille(s.nom, w * .9, h * .62, 2.4, P_NOM) : null;
    const nomLisible = nom && (sel || nom.f * pxParM >= 4.5);
    const maxCode = s.nom ? Math.min(nom ? nom.f * .78 : 1.2, h * .22) : h * .34;
    const fc = s.code ? Math.min(maxCode, (w * .9) / largeur(s.code, P_CODE), 1.9) : 0;
    const codeLisible = fc && (sel || fc * pxParM >= (nomLisible ? 5 : 6));
    if (!codeLisible && !nomLisible) continue;

    const c = sel ? " sel" : "";
    const hNom = nomLisible ? nom.lignes.length * nom.f * 1.18 : 0;
    const hCode = codeLisible ? fc * 1.25 : 0;
    let y = as[1] - (hNom + hCode) / 2;
    if (nomLisible){ out += lignesSvg(nom.lignes, nom.f, as[0], y + hNom / 2, "nm" + c); y += hNom; }
    if (codeLisible)
      out += '<text class="' + c.trim() + '" x="' + as[0] + '" y="' + (y + fc * .92).toFixed(2) +
             '" font-size="' + fc.toFixed(2) + '">' + esc(s.code) + '</text>';
  }
  l.innerHTML = out;
}

/* ============================================================
   5. Recherche — sans mot-clé on reste sur le pavillon affiché,
      dès qu'on cherche on balaie les trois
   ============================================================ */
function visible(o){
  const q = state.q.trim().toLowerCase();
  if (state.filtre && o.kind !== state.filtre) return false;
  if (!q) return true;
  /* On ne cherche qu'un exposant : les zones organisateur — restauration,
     accueil, animations — encombreraient les résultats sans qu'on les ait
     demandées. Elles restent listées tant qu'aucun mot-clé n'est saisi. */
  if (o.kind !== "stand") return false;
  return ((o.nom || "") + " " + (o.code || "") + " " + (o.plan || "")).toLowerCase().includes(q);
}

function appliqueFiltre(){
  document.querySelectorAll("#stands g, #zones g").forEach(g => {
    const o = parId.get(g.dataset.id);
    g.classList.toggle("dim", !!o && !visible(o));
  });
  libelles(); liste();
}

function liste(){
  const box = $("list");
  const q = state.q.trim();
  const portee = q ? TOUS : [...P().zones, ...P().stands];
  const vus = portee.filter(visible).sort((a, b) =>
    (a.p - b.p) ||
    (a.kind === b.kind ? 0 : a.kind === "zone" ? -1 : 1) ||
    ((a.nom ? 0 : 1) - (b.nom ? 0 : 1)) ||
    String(a.nom || a.code || "").localeCompare(String(b.nom || b.code || ""), "fr", { numeric: true }));

  $("countTxt").textContent = vus.length + (vus.length > 1 ? " résultats" : " résultat") +
    (q ? " · tous pavillons" : " · " + P().libelle);

  box.innerHTML = vus.length ? vus.slice(0, 500).map(o => {
    const sous = o.kind === "zone" ? "Zone organisateur"
      : o.m2 + " m²" + (o.angles ? " · " + o.angles + " angle" + (o.angles > 1 ? "s" : "") : "");
    const badge = o.p !== state.plan
      ? '<span class="hall">' + esc(DATA.plans[o.p].court) + '</span>' : "";
    return '<button class="row ' + (o.kind === "zone" ? "z" : "") + '" data-id="' + o.id +
      '" aria-current="' + (state.sel === o.id) + '">' +
      '<span class="code">' + esc(o.code || (o.kind === "zone" ? "ZOD" : "—")) + '</span>' +
      '<span><span class="nm">' + esc(o.nom || o.plan ||
        (o.kind === "zone" ? "Zone sans nom" : ("Stand " + (o.code || "")).trim())) + '</span>' +
      '<span class="s">' + sous + badge + '</span></span></button>';
  }).join("")
    : '<div class="empty">Aucun résultat dans les ' + DATA.plans.length + ' pavillons.</div>';
  box.querySelectorAll(".row").forEach(b => b.onclick = () => select(b.dataset.id, true));
}

/* ============================================================
   6. Vue
   ============================================================ */
const appliqueVue = () => {
  svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
  if (typeof dessinePoignees === "function") dessinePoignees();
};
/* Rafraîchir la vue coûte deux choses de nature très différente. Poser le
   « viewBox » est immédiat. Recalculer les libellés parcourt les cinq cents
   objets du pavillon et mesure chaque texte pour décider s'il tient et s'il
   reste lisible : près de six millisecondes sur un poste de bureau, bien
   davantage sur un téléphone, là où une image n'en a que seize.

   Pendant un geste on ne fait donc que le premier, et une seule fois par
   image — un écran tactile échantillonne souvent deux fois plus vite qu'il
   n'affiche, et le travail était fait deux fois pour rien. Les libellés
   attendent : leur taille étant exprimée en mètres, ils grandissent avec le
   plan sans qu'on y touche. Seul leur tri par lisibilité patiente, jusqu'à la
   fin du geste ou une pause de la main. */
let imageDemandee = null, libellesEnAttente = null;

/** Pendant un geste : le strict nécessaire, une fois par image. */
function rafraichitVue(){
  if (!imageDemandee){
    imageDemandee = requestAnimationFrame(() => {
      imageDemandee = null;
      appliqueVue(); echelle();
    });
  }
  clearTimeout(libellesEnAttente);
  libellesEnAttente = setTimeout(() => { libellesEnAttente = null; libelles(); }, 150);
}

/** À la fin d'un geste, ou pour un saut de vue : tout, sans attendre. */
function poseVue(){
  if (imageDemandee){ cancelAnimationFrame(imageDemandee); imageDemandee = null; }
  clearTimeout(libellesEnAttente); libellesEnAttente = null;
  appliqueVue(); echelle(); libelles();
}

/**
 * Hauteur, en pixels, de ce que le tiroir ou la fiche cachent en bas du plan.
 *
 * Le cadre du plan occupe tout l'écran sur mobile, mais on n'en voit pas tout :
 * cadrer sur le cadre entier pousse une partie du plan sous le tiroir. Toute
 * mise en vue passe donc par cette mesure — l'ajustement comme le centrage sur
 * un stand, y compris celui déclenché par le cartouche des points d'intérêt.
 *
 * On raisonne sur les hauteurs au repos, jamais sur la position d'un élément en
 * cours de glissement : `offsetHeight` ignore la transformation, et la fiche
 * qui s'ouvre replie le tiroir sous elle.
 */
function masque(){
  if (!ETROIT()) return 0;
  const r = svg.getBoundingClientRect();
  const fiche = $("detail"), tiroir = $("side");
  const ficheOuverte = !!fiche && fiche.classList.contains("open");
  let bas = ficheOuverte ? fiche.offsetHeight : 0;
  if (tiroir){
    bas = Math.max(bas, ficheOuverte
      ? parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--replie")) || 164
      : r.bottom - tiroir.getBoundingClientRect().top);
  }
  // au-delà, il ne resterait plus assez de plan pour que le cadrage ait un sens
  return Math.max(0, Math.min(r.height * .6, bas));
}

function fit(){
  const r = svg.getBoundingClientRect();
  const cache = masque();
  const hUtile = Math.max(60, r.height - cache);
  const w = emp.x1 - emp.x0, h = emp.y1 - emp.y0;
  const k = Math.max(w / (r.width || 1), h / hUtile);
  view = { x: emp.x0 + w / 2 - (k * r.width) / 2,
           // le plan se centre dans la bande visible, pas dans le cadre entier
           y: emp.y0 + h / 2 - (k * r.height) / 2 + (k * cache) / 2,
           w: k * r.width, h: k * r.height };
  poseVue();
}
function zoom(f, cx, cy){
  const nw = Math.min((emp.x1 - emp.x0) * 2.5, Math.max(6, view.w * f)), k = nw / view.w;
  view = { x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k, w: nw, h: view.h * k };
  rafraichitVue();
}
function echelle(){
  const r = svg.getBoundingClientRect();
  const mParPx = view.w / (r.width || 1);
  const pas = [1, 2, 5, 10, 20, 50, 100, 200].find(p => p >= mParPx * 90) || 200;
  $("scaleBar").style.width = (pas / mParPx) + "px";
  $("scaleTxt").textContent = pas + " m";
}

/* ============================================================
   7. Sélection et fiche
   ============================================================ */
const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null;
/** Écran étroit : la liste et la fiche sont des tiroirs, pas des panneaux. */
const ETROIT = () => matchMedia("(max-width:900px)").matches;

function anime(rect, sens){
  const p = $("detail");
  if (anim){ anim.cancel(); anim = null; }
  /* Sur mobile la fiche glisse depuis le bas : une mise à l'échelle depuis la
     forme cliquée se battrait avec ce glissement. La transition CSS suffit. */
  if (REDUIT || !rect || ETROIT()){ if (sens < 0) p.classList.remove("open"); return; }
  const b = p.getBoundingClientRect();
  p.style.transformOrigin = (rect.left + rect.width / 2 - b.left) + "px " +
                            (rect.top + rect.height / 2 - b.top) + "px";
  const seed = { transform: "scale(" + Math.max(.05, rect.width / b.width) + "," +
                            Math.max(.03, rect.height / b.height) + ")", opacity: 0 };
  const plein = { transform: "none", opacity: 1 };
  anim = p.animate(sens > 0 ? [seed, plein] : [plein, seed],
    { duration: sens > 0 ? 340 : 200,
      easing: sens > 0 ? "cubic-bezier(.16,.84,.3,1)" : "cubic-bezier(.4,0,.75,.2)" });
  if (sens < 0) anim.finished.then(() => p.classList.remove("open"), () => {});
}
const noeud = id => svg.querySelector('[data-id="' + CSS.escape(id) + '"]');

function select(id, recentrer){
  const o = parId.get(id);
  if (!o) return;
  if (o.p !== state.plan){          // l'objet vit dans un autre pavillon
    state.plan = o.p; montePlan(); fit();
  }
  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  state.sel = id;
  const n = noeud(id); if (n) n.classList.add("sel");
  if (recentrer && !ETROIT()) centre(o);
  liste(); libelles();
  ouvre(o, n ? n.getBoundingClientRect() : null);
  /* Sur mobile on ne cadre qu'une fois la fiche ouverte : c'est elle qui
     décide de la hauteur masquée, et la mesurer avant reviendrait à cadrer
     sur une géométrie déjà périmée. Sur grand écran l'ordre inverse tient,
     car l'animation de la fiche part de la forme telle qu'elle est cadrée. */
  if (recentrer && ETROIT()) centre(o);
}
function centre(o){
  const w = Math.min(view.w, 55), h = w * (view.h / view.w);
  /* Centrer au milieu du cadre placerait la cible derrière le tiroir ou la
     fiche. On la remonte au milieu de ce qui reste visible — d'après la
     hauteur réellement masquée, et non une proportion supposée. */
  const r = svg.getBoundingClientRect();
  const decale = r.height ? (h * masque()) / (2 * r.height) : 0;
  view = { x: o.c[0] - w / 2, y: o.c[1] - h / 2 + decale, w: w, h: h };
  poseVue();
}
/**
 * Un champ paraît-il sur la fiche ? L'exploitant en décide depuis la console.
 * Une entrée absente vaut « affiché », pour qu'un champ ajouté plus tard ne
 * disparaisse pas des salons déjà réglés.
 */
function montre(type, cle){
  const r = DATA && DATA.fiche && DATA.fiche[type];
  return !r || r[cle] !== false;
}

/**
 * Une adresse en lien cliquable, affichée sans son protocole.
 *
 * Les champs de réseaux sociaux sont saisis à la main : tantôt une adresse
 * complète, tantôt un simple nom de compte. On complète ce qui manque plutôt
 * que d'afficher un lien mort.
 */
/**
 * Le programme d'une zone, en vignettes chronologiques.
 *
 * L'heure vient d'Eventmaker sous sa forme locale — « 03/14/2026 10:30 » — ce
 * qui évite de deviner le fuseau du salon depuis le navigateur d'un visiteur
 * qui peut être ailleurs. On la relit telle quelle plutôt que d'en faire une
 * date, dont le rendu dépendrait justement du fuseau.
 */
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
              "août", "septembre", "octobre", "novembre", "décembre"];

/**
 * L'heure d'une conférence, dans le fuseau du salon.
 *
 * Eventmaker donne deux formes. « 03/14/2026 10:30 » est l'heure locale du
 * salon : on la relit telle quelle, c'est la seule qui ne demande rien. La
 * forme ISO, elle, porte un décalage — souvent Z — qu'il faut ramener au
 * fuseau de l'événement, sans quoi un visiteur d'un autre pays lirait des
 * horaires faux.
 */
function momentLocal(v, fuseau){
  const t = String(v || "");
  const m = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/.exec(t);
  if (m){
    return { jour: +m[2], mois: +m[1], an: +m[3], h: m[4].padStart(2, "0"), min: m[5],
             cle: m[3] + m[1] + m[2] };
  }
  const d = new Date(t);
  if (isNaN(d)) return null;
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", {
      timeZone: fuseau || undefined, year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(d).map(x => [x.type, x.value]));
    return { jour: +p.day, mois: +p.month, an: +p.year,
             h: String(p.hour).padStart(2, "0"), min: p.minute,
             cle: p.year + p.month + p.day };
  } catch (e) {
    return null;   // fuseau inconnu : mieux vaut taire l'heure que la fausser
  }
}

function programme(o){
  const l = (P().parZone && P().parZone.get(o.id)) || [];
  if (!l.length) return "";
  let out = '<div class="field"><span class="eyebrow">Programme</span><div class="prog">';
  let jourCourant = null;
  for (const c of l){
    const fz = DATA.fuseau;
    const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
    const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);
    if (d && d.cle !== jourCourant){
      jourCourant = d.cle;
      const dt = new Date(d.an, d.mois - 1, d.jour);
      out += '<div class="jour">' + esc(JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1]) + '</div>';
    }
    const heure = d ? d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "") : "";
    out += '<button type="button" class="conf" data-conf="' + esc(c.id) + '"' +
      (c.couleur ? ' style="--tc:' + esc(c.couleur) + '"' : "") + '>' +
      (heure ? '<span class="h">' + esc(heure) + '</span>' : "") +
      '<span class="t">' + esc(c.nom) + '</span>' +
      (c.type ? '<span class="ty">' + esc(c.type) + '</span>' : "") +
      '</button>';
  }
  return out + '</div></div>';
}

/** Une date écrite en toutes lettres : « samedi 14 mars 2026 ». */
function jourLong(d){
  if (!d) return "";
  const dt = new Date(d.an, d.mois - 1, d.jour);
  return JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1] + " " + d.an;
}

/**
 * La fiche d'une conférence. Le programme d'une zone ne montre que l'essentiel
 * — l'heure et le titre — parce qu'il en aligne parfois vingt ; le reste,
 * description comprise, tient ici.
 */
function ficheConf(id){
  const c = (P().conferences || []).find(x => String(x.id) === String(id));
  if (!c) return;
  const fz = DATA.fuseau;
  const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
  const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);

  ouvreModale(c.nom, corps => {
    const bloc = (l, v, cls) => {
      if (!v) return;
      const w = document.createElement("div");
      w.className = "field" + (cls ? " " + cls : "");
      w.innerHTML = '<span class="eyebrow"></span><span class="v"></span>';
      w.querySelector(".eyebrow").textContent = l;
      w.querySelector(".v").textContent = v;
      corps.appendChild(w);
    };
    if (c.type){
      const t = document.createElement("div");
      t.className = "conf-type";
      if (c.couleur) t.style.setProperty("--tc", c.couleur);
      t.textContent = c.type;
      corps.appendChild(t);
    }
    bloc("Quand", d
      ? jourLong(d) + " · " + d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "")
      : "");
    bloc("Où", c.salle);
    bloc("Thématique", c.theme);
    bloc("Présentation", c.texte, "large");
  }, [{ libelle: "Fermer", genre: "primaire" }]);
}

function lien(v){
  let u = String(v == null ? "" : v).trim().replace(/\\/g, "");
  if (!u) return "";
  if (!/^https?:/i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' +
         esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, "")) + '</a>';
}

/* ============================================================
   8. Interactions du plan
   ============================================================ */
let drag = null;

/* ------------------------------------------------------------------
   Pincement à deux doigts.

   Le plan interdit au navigateur de gérer le toucher — « touch-action: none »
   — parce qu'il déplace la vue lui-même. Il lui revient donc aussi de gérer le
   pincement, sinon il n'existe pas : c'est ce qui manquait sur téléphone.

   On garde le point du plan qui était sous le milieu des deux doigts, et on
   le maintient dessous. L'écartement donne l'échelle, le déplacement du milieu
   donne la translation : les deux gestes se font d'un seul mouvement, comme on
   s'y attend.
   ------------------------------------------------------------------ */
const doigts = new Map();
let pince = null;

const milieu = () => {
  const l = [...doigts.values()];
  return { x: (l[0].x + l[1].x) / 2, y: (l[0].y + l[1].y) / 2,
           d: Math.hypot(l[0].x - l[1].x, l[0].y - l[1].y) };
};

function commencePince(){
  const m = milieu();
  const r = svg.getBoundingClientRect();
  pince = {
    d: Math.max(1, m.d),
    w: view.w, h: view.h,
    // le point du plan sous le milieu, celui qui ne doit pas bouger
    ancre: [view.x + (m.x - r.left) / r.width * view.w,
            view.y + (m.y - r.top) / r.height * view.h],
  };
  drag = null;
  svg.classList.remove("dragging");
}

function suitPince(){
  const m = milieu();
  const r = svg.getBoundingClientRect();
  const large = emp ? (emp.x1 - emp.x0) * 2.5 : pince.w * 8;
  const nw = Math.min(large, Math.max(6, pince.w * pince.d / Math.max(1, m.d)));
  const nh = pince.h * (nw / pince.w);
  view = {
    x: pince.ancre[0] - (m.x - r.left) / r.width * nw,
    y: pince.ancre[1] - (m.y - r.top) / r.height * nh,
    w: nw, h: nh,
  };
  rafraichitVue();
}

svg.addEventListener("pointerdown", e => {
  dernierAppuiTactile = e.pointerType === "touch" || e.pointerType === "pen";
  /* Un « pointerup » se perd parfois — la main sort de l'écran, le navigateur
     passe la main à un geste système. Le doigt restait alors inscrit, et
     l'appui suivant passait pour le second d'un pincement : plus rien ne
     répondait. Le premier doigt d'un geste ouvre donc une table vierge. */
  if (e.isPrimary) doigts.clear();
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 2){ commencePince(); return; }
  if (doigts.size > 2) return;
  if (dessinPointerDown(e)) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, bouge: false,
           cible: e.target.closest("[data-id]") };
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (doigts.has(e.pointerId)) doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pince && doigts.size >= 2){ e.preventDefault(); suitPince(); return; }
  if (dessinPointerMove(e)) return;
  if (!drag) return;
  const r = svg.getBoundingClientRect(), k = view.w / r.width;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.bouge = true;
  view.x = drag.vx - dx; view.y = drag.vy - dy; rafraichitVue();
});
/* La capture de pointeur redirige le clic vers le <svg> : on retient la cible
   au pointerdown et on tranche au pointerup. */
svg.addEventListener("pointerup", e => {
  doigts.delete(e.pointerId);
  // un doigt levé met fin au pincement ; celui qui reste ne reprend pas la
  // main sur le déplacement, sans quoi la vue sauterait
  if (pince){ if (doigts.size < 2){ pince = null; drag = null; poseVue(); } return; }
  if (dessinPointerUp(e)) return;
  const d = drag; drag = null; svg.classList.remove("dragging");
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  if (d && d.bouge){ poseVue(); return; }
  if (!d) return;
  if (d.cible) select(d.cible.dataset.id, false); else ferme();
});
svg.addEventListener("pointercancel", e => {
  doigts.delete(e.pointerId);
  if (doigts.size < 2) pince = null;
  drag = null;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoom(e.deltaY > 0 ? 1.18 : .85,
       view.x + (e.clientX - r.left) / r.width * view.w,
       view.y + (e.clientY - r.top) / r.height * view.h);
}, { passive: false });
svg.addEventListener("keydown", e => {
  const g = e.target.closest("[data-id]");
  if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); select(g.dataset.id, false); }
});
document.addEventListener("keydown", e => {
  const saisie = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (ADMIN && !saisie && (e.ctrlKey || e.metaKey)){
    const t = e.key.toLowerCase();
    if (t === "z" && !e.shiftKey){ e.preventDefault(); annule(); return; }
    if (t === "y" || (t === "z" && e.shiftKey)){ e.preventDefault(); refais(); return; }
  }
  if (ADMIN && !saisie && (e.key === "Delete" || e.key === "Backspace") && formeSel){
    e.preventDefault(); supprimeForme(); return;

  if (e.key === "Escape"){

    if (calqueActif){ activeCalque(calqueActif); return; }

  if (e.key === "Enter" && e.target.id !== "q" && e.target.id !== "texteADessiner") termineTrace(true);
});

/* ============================================================
   Le tiroir de la liste — écrans étroits

   Côte à côte, plan et liste ne tiennent pas sur un téléphone. La liste se
   replie donc en tiroir : seules la recherche et le compteur dépassent, le
   reste se hisse d'une pression ou d'un glissement. Choisir un résultat le
   referme — c'est le plan qu'on voulait voir, et la fiche s'ouvre par-dessus.
   ============================================================ */
(function tiroirListe(){
  const tiroir = $("side"), prise = $("poignee");
  if (!tiroir || !prise) return;
  const etroit = ETROIT;

  /* La hauteur repliée ne peut pas être une constante : elle dépend de la
     police servie, du retour à la ligne des puces, de la longueur du nom de
     pavillon dans le compteur. On la mesure, et on la redonne au CSS, qui s'en
     sert aussi pour poser les commandes du plan au-dessus du tiroir. */
  function mesure(){
    if (!etroit()) return;
    const part = s => { const n = tiroir.querySelector(s); return n ? n.offsetHeight : 0; };
    const h = prise.offsetHeight + part(".search") + part(".count");
    if (h > 0) document.documentElement.style.setProperty("--replie", h + "px");
  }

  /* Trois crans, du plus bas au plus haut. Le milieu est le cran utile : la
     liste se lit sans que le plan disparaisse. */
  const CRANS = ["replie", "demi", "plein"];
  const cran = () => tiroir.dataset.cran || "replie";
  function pose(nom){
    tiroir.dataset.cran = nom;
    prise.setAttribute("aria-expanded", nom === "replie" ? "false" : "true");
  }
  const replie = () => pose("replie");
  /* Une pression fait le tour des crans : on les atteint tous sans rien
     connaître du glissement, et on revient au plan par la même touche. */
  const bascule = () => pose(CRANS[(CRANS.indexOf(cran()) + 1) % CRANS.length]);

  const replieePx = () =>
    parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--replie")) || 164;

  /* Hauteur visible du tiroir à un cran donné, en pixels. Le milieu suit la
     règle du CSS — 46 % de la hauteur d'écran. */
  function hauteur(nom){
    if (nom === "plein") return tiroir.offsetHeight;
    if (nom === "demi")  return Math.round(innerHeight * .46);
    return replieePx();
  }

  /* --- le glissement ------------------------------------------------------
     Le doigt mène le tiroir entre le cran le plus bas et le plus haut, puis on
     s'accroche au cran le plus proche de l'endroit où il a lâché. Un seuil de
     distance ne suffirait plus : avec trois crans, c'est la position d'arrivée
     qui décide, pas la longueur du geste. */
  let depart = null, aGlisse = false;

  prise.addEventListener("pointerdown", e => {
    if (!etroit()) return;
    depart = { y: e.clientY, vu: hauteur(cran()) };
    aGlisse = false;
    tiroir.classList.add("glisse");
    prise.setPointerCapture(e.pointerId);
  });

  /** Hauteur visible pendant le geste, bornée aux deux crans extrêmes. */
  const suit = e =>
    Math.min(hauteur("plein"), Math.max(hauteur("replie"), depart.vu - (e.clientY - depart.y)));

  prise.addEventListener("pointermove", e => {
    if (!depart) return;
    if (Math.abs(e.clientY - depart.y) > 6) aGlisse = true;
    tiroir.style.transform = "translateY(" + (tiroir.offsetHeight - suit(e)) + "px)";
  });

  function relache(e){
    if (!depart) return;
    const vu = suit(e);
    tiroir.classList.remove("glisse");
    tiroir.style.transform = "";
    if (aGlisse){
      let choix = CRANS[0], ecart = Infinity;
      for (const c of CRANS){
        const d = Math.abs(hauteur(c) - vu);
        if (d < ecart){ ecart = d; choix = c; }
      }
      pose(choix);
    }
    depart = null;
  }
  prise.addEventListener("pointerup", relache);
  prise.addEventListener("pointercancel", relache);

  /* Une pression bascule. Le clic sert aussi le clavier — la poignée est un
     bouton — mais il suit tout glissement : on l'ignore dans ce cas. */
  prise.addEventListener("click", () => {
    if (aGlisse){ aGlisse = false; return; }
    bascule();
  });

  /* Chercher, c'est vouloir la liste ; choisir, c'est vouloir le plan. Au cran
     plein pour la recherche : le clavier va manger le bas de l'écran, autant
     que la liste occupe tout ce qui reste. */
  $("q").addEventListener("focus", () => { if (etroit()) pose("plein"); });
  $("list").addEventListener("click", () => { if (etroit()) replie(); });

  /* La fiche occupe le bas de l'écran quand elle s'ouvre — depuis la liste
     comme depuis le plan. Le tiroir se retire sous elle plutôt que de lutter
     pour la même place. */
  const fiche = $("detail");
  if (fiche) new MutationObserver(() => {
    if (etroit() && fiche.classList.contains("open")) replie();
  }).observe(fiche, { attributes: true, attributeFilter: ["class"] });
  addEventListener("keydown", e => { if (e.key === "Escape" && etroit()) replie(); });

  /* Au retour vers un grand écran, la liste reprend sa colonne : ni classe
     d'ouverture ni transformation résiduelle, qui s'y appliqueraient encore. */
  addEventListener("resize", () => {
    if (!etroit()){ tiroir.style.transform = ""; replie(); }
    else mesure();
  });

  mesure();
  // les polices arrivent après le premier calcul et changent la hauteur mesurée
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesure);
  addEventListener("load", mesure);
})();

/* ============================================================
   9. Apparence des calques
   Les réglages vivent dans CONF, partagés par les trois pavillons :
   changer la couleur du bâtiment une fois vaut pour tous.
   ============================================================ */
const CLE_CONF = "plan-conf";
const DEFAUTS = { "INFOPRO_FIL_JAUNE": { rempli: true } };
let CONF = JSON.parse(JSON.stringify(DEFAUTS));
try { Object.assign(CONF, JSON.parse(localStorage.getItem(CLE_CONF) || "{}")); } catch (e) {}
const conf = c => (CONF[c] = CONF[c] || {});
const jeton = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888888";
const sousCle = (cle, id) => cle + "/" + id;

function styleFond(cle){
  const c = conf(cle);
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  if (!g) return;
  g.style.display = c.visible === false ? "none" : "";
  g.querySelectorAll("g[data-s]").forEach(sub => {
    const sc = CONF[sousCle(cle, sub.id)] || {};
    const src = sub.dataset.s || "";
    const noir = !src || src === "rgb(0,0,0)";
    sub.style.display = sc.visible === false ? "none" : "";
    sub.style.color = sc.couleur || c.couleur || (noir ? "" : src);
    const rempli = sc.rempli !== undefined ? sc.rempli : c.rempli;
    if (rempli){
      sub.setAttribute("fill", "currentColor");
      sub.setAttribute("stroke", "none");
    } else {
      sub.setAttribute("fill", sub.dataset.f || "none");
      sub.setAttribute("stroke", "currentColor");
    }
  });
}
function sousCalques(cle){
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  return g ? [...g.querySelectorAll("g[data-s]")].map(s => ({ id: s.id, src: s.dataset.s })) : [];
}

const racine = document.documentElement;

/* Les couches de données n'ont pas de SVG propre : leur visibilité joue sur
   l'affichage du groupe, leur couleur sur une variable CSS. */
function styleDataGroupe(nom, on){ $(nom).style.display = on ? "" : "none"; }

function appliqueCouleursData(){

function styleData(cle){

function appliqueApparence(){
  P().fond.forEach(f => {
    // Un calque absent de la configuration est montré. La règle disait
    // l'inverse — masquer tout ce qui n'était pas explicitement marqué visible
    // — et convenait aux données figées, qui portaient ce drapeau. La charge
    // utile servie par l'API n'en porte pas : tout le fond de plan
    // disparaissait, sans que rien ne le signale.
    if (CONF[f.cle] === undefined && f.visible === false) conf(f.cle).visible = false;
    styleFond(f.cle);
  });
  ["zones", "stands", "labels"].forEach(n =>
    styleDataGroupe(n, conf("data:" + n).visible !== false));
  ["labStand", "labZone"].forEach(k =>
    racine.classList.toggle(k === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                            conf(k).visible === false));
  appliqueCouleursData();
  appliqueZoom();
}

/**
 * Les boutons de zoom, montrés ou non.
 *
 * Le pincement les rend superflus sur un écran tactile, mais il demande deux
 * doigts : dans une allée de salon, sac à la main, on n'en a souvent qu'un.
 * L'arbitrage dépend du public et du terrain, donc il revient à l'exploitant.
 * Montrés par défaut : un réglage absent ne doit rien retirer à un salon déjà
 * en place.
 */
function appliqueZoom(){
  const z = document.querySelector(".zoombar");
  if (z) z.hidden = conf("_zoom").visible === false;
}

/** Les réglages d'apparence vivent sur le poste tant qu'ils ne sont pas
 *  remontés vers la base. */
const enregistreConf = () => {
  try { localStorage.setItem(CLE_CONF, JSON.stringify(CONF)); } catch (e) {}
};

/** Une couleur Klipso « rgb(r,g,b) » vers la notation attendue par le
 *  sélecteur de couleur. */
const rgbHex = (s) => {
  const m = String(s || "").match(/\d+/g);
  if (!m || m.length < 3) return null;
  return "#" + m.slice(0, 3)
    .map((n) => Math.max(0, Math.min(255, +n)).toString(16).padStart(2, "0")).join("");
};

/** Nom lisible d'un sous-calque : « 4-PORTE-SECU » devient « Porte secu ». */
const joli = (id) => String(id)
  .replace(/^[0-9]+-/, "").replace(/[_-]+/g, " ").toLowerCase()
  .replace(/^./, (c) => c.toUpperCase());

/* ============================================================
   10. Mode administration
   Il n'existe que dans la page dédiée, et seulement une fois l'utilisateur
   authentifié. La page publique ne l'active jamais et retire ses commandes
   du document. Un raccourci clavier ne serait pas une frontière.
   ============================================================ */
let ADMIN = false;

/**
 * Page publique : les commandes d'administration sont neutralisées.
 * On les masque et on les vide plutôt que de les supprimer — le montage du
 * plan y touche encore, et ADMIN restant faux, rien ne peut les activer.
 */
function retireAdmin(){
  const b = $("btnLayers"); if (b) b.remove();
  ["panel", "outils", "elemSel"].forEach(id => {
    const e = $(id);
    if (!e) return;
    e.hidden = true;
    e.classList.remove("open");
    e.setAttribute("aria-hidden", "true");
    if (id !== "outils") e.innerHTML = "";
  });
}

/** Ouvre le mode administration, une fois l'identité vérifiée. */
function activeAdmin(){
  if (ADMIN) return;
  ADMIN = true;
  // l'outil de départ est la sélection : les dessins deviennent cliquables
  racine.classList.add("mode-edition");
  const b = $("btnLayers");
  if (b){
    b.hidden = false;
    b.onclick = () => {
      const o = $("panel").classList.toggle("open");
      b.setAttribute("aria-pressed", o);
    };
  }
  const barre = document.createElement("div");
  barre.className = "adminbar";
  /* Copier et importer une configuration servaient à la transporter d'un poste
     à l'autre, faute de mieux. Maintenant qu'elle se publie, ils n'ajoutent
     qu'un chemin de plus pour arriver au même endroit. */
  barre.innerHTML = '<button class="reset fort" id="pousseConf">Pousser la configuration</button>' +
                    '<button class="reset" id="razConf">Rétablir les valeurs d\'origine</button>';
  $("panel").appendChild(barre);
  $("razConf").onclick = () => {
    CONF = JSON.parse(JSON.stringify(DEFAUTS));
    try { localStorage.removeItem(CLE_CONF); } catch (e) {}
    appliqueApparence(); construitPanneau();
  };
  $("pousseConf").onclick = e => pousseConfiguration(e.target);
}


/* ============================================================
   Renommer une zone organisateur
   Une zone tire son nom de Klipso, ou des textes posés sur le plan. Quand ni
   l'un ni l'autre ne donne rien — les vingt-deux zones de Franchise Expo
   s'affichent « Zone sans nom » — il faut pouvoir le saisir.

   Le nom est enregistré sur l'événement, pas dans le navigateur : c'est le
   visiteur qui doit le lire. Et il s'applique à la lecture, si bien qu'il
   paraît sans attendre la prochaine synchronisation.
   ============================================================ */
function renommeZone(o){
  let champ;
  ouvreModale("Renommer la zone", corps => {
    const l = document.createElement("label");
    l.innerHTML = "<span>Nom de la zone</span><input>";
    champ = l.querySelector("input");
    champ.value = (DATA.nomsZones || {})[o.id] || o.nom || "";
    champ.placeholder = "Agora, Halte-garderie, Pitch Retail…";
    corps.appendChild(l);
    const aide = document.createElement("p");
    aide.className = "aide";
    aide.textContent = "Laissez vide pour revenir au nom d'origine, s'il y en a un.";
    corps.appendChild(aide);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); enregistreNomZone(o, champ.value); fermeModale(); }
    };
  }, [
    { libelle: "Annuler" },
    { libelle: "Enregistrer", genre: "primaire",
      action: () => enregistreNomZone(o, champ.value) },
  ]);
}

async function enregistreNomZone(o, valeur){
  const nom = String(valeur || "").trim();

  let cfg = null, ses = null;
  try {
    cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    ses = JSON.parse(localStorage.getItem("console-session") || "null");
  } catch (e) {}
  if (!cfg?.url || !ses?.access_token){
    annonce("Session absente : reconnectez-vous pour renommer.", true);
    return;
  }

  try {
    /* Les noms tiennent dans une seule colonne : l'enregistrement la réécrit
       entière. La renvoyer telle que la page l'avait chargée effacerait tout
       renommage survenu depuis — d'un autre poste, ou d'un onglet resté
       ouvert. On repart donc de ce que la base contient à l'instant, et on
       n'y touche que la zone concernée. */
    const enBase = await fetch(cfg.url + "/rest/v1/evenement?select=zones&slug=eq." +
      encodeURIComponent(DATA.slug), {
      headers: { "apikey": cfg.anonKey, "Authorization": "Bearer " + ses.access_token },
    }).then(r => r.ok ? r.json() : []).catch(() => []);
    const noms = { ...(enBase[0]?.zones || DATA.nomsZones || {}) };
    if (nom) noms[o.id] = nom; else delete noms[o.id];

    const r = await fetch(cfg.url + "/rest/v1/evenement?slug=eq." + encodeURIComponent(DATA.slug), {
      method: "PATCH",
      headers: {
        "apikey": cfg.anonKey,
        "Authorization": "Bearer " + ses.access_token,
        "Content-Type": "application/json",
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({ zones: noms, modifie_le: new Date().toISOString() }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120));

    DATA.nomsZones = noms;
    // le nom d'origine n'est pas perdu : on le garde pour pouvoir y revenir
    if (o.origine === undefined) o.origine = o.nom;
    o.nom = nom || o.origine || null;
    libelles(); liste();
    ouvre(o, null);
  } catch (e) {
    annonce("Renommage impossible : " + e.message, true);
  }
}

/* ============================================================
   11. Calques de dessin
   Des calques créés par l'exploitant, propres à un pavillon, sur lesquels
   il trace rectangles, polygones, lignes et textes. Le tracé est enregistré
   en mètres dans le repère du plan : il suit le zoom comme le reste.
   ============================================================ */
const CLE_DESSINS = "plan-dessins";
let DESSINS = {};
try { DESSINS = JSON.parse(localStorage.getItem(CLE_DESSINS) || "{}"); } catch (e) {}

/** Les calques de dessin du pavillon courant. Ceux du service ont été repris
 *  au chargement ; il ne reste qu'à ouvrir la liste si elle manque. */
const mesCalques = () => (DESSINS[P().id] = DESSINS[P().id] || []);
const enregistreDessins = () => {
  try { localStorage.setItem(CLE_DESSINS, JSON.stringify(DESSINS)); }
  catch (e) {
    // les images sont encodées dans le document : le quota se remplit vite
    if ($("outilsAide")) $("outilsAide").textContent =
      "Mémoire du navigateur pleine : allégez ou supprimez une image.";
  }
};

let calqueActif = null;   // id du calque en cours d'édition
let outil = "main";
let enCours = null;       // tracé en construction

/* Historique des dessins. L'instantané ne copie que les calques et leurs
   tableaux de formes : les formes elles-mêmes, images comprises, sont
   partagées par référence — mémoriser reste donc quasi gratuit. */
const HIST = [], REFAIRE = [];
const instantane = () => mesCalques().map(c => Object.assign({}, c, { formes: c.formes.slice() }));
function memorise(){
  HIST.push(instantane());
  if (HIST.length > 50) HIST.shift();
  REFAIRE.length = 0;
}
function restaure(source, autre){
  if (!source.length) return false;
  autre.push(instantane());
  DESSINS[P().id] = source.pop();
  if (calqueActif && !trouveCalque(calqueActif)) activeCalque(null);
  enregistreDessins(); dessineDessins();
  if (ADMIN) construitPanneau();
  return true;
}
function annule(){
  // pendant un tracé, on retire le dernier sommet plutôt que l'action entière
  if (enCours && enCours.pts.length > 1){
    enCours.pts.pop();
    apercu(cheminForme({ t: "ligne", pts: enCours.pts }));
    aide();
    return;
  }
  if (enCours){ termineTrace(false); return; }
  if (!restaure(HIST, REFAIRE)) $("outilsAide").textContent = "Rien à annuler.";
}
function refais(){ restaure(REFAIRE, HIST); }

const trouveCalque = id => mesCalques().find(c => c.id === id);
const nouvelId = () => "d" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

/* --- rendu --- */
function cheminForme(f){
  if (f.t === "rect" || f.t === "image"){
    const [a, b] = f.pts;
    const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
    const w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    return "M" + x + " " + y + "h" + w + "v" + h + "h" + (-w) + "Z";
  }
  const d = "M" + f.pts.map(p => p[0] + " " + p[1]).join("L");
  return f.t === "ligne" ? d : d + "Z";
}
function dessineDessins(){
  const c = $("couches");
  c.querySelectorAll(".dcal").forEach(g => g.remove());
  for (const cal of mesCalques()){
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "dcal" + (cal.rempli ? " plein" : "") +
                            (cal.id === calqueActif && ADMIN ? " editable" : ""));
    g.dataset.dcal = cal.id;
    g.style.color = cal.couleur || "var(--accent)";
    g.style.display = cal.visible === false ? "none" : "";
    g.innerHTML = cal.formes.map(f => f.t === "image"
      // Le clic sur le plan cherche l'ancêtre porteur d'un data-id : une image
      // liée à un stand ouvre donc sa fiche sans code supplémentaire. C'est
      // ainsi qu'on pose le logo d'un exposant sur son emplacement.
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") +
        (f.stand && parId.has(f.stand) ? " lie" : "") + '" data-f="' + f.id + '"' +
        (f.stand && parId.has(f.stand) ? ' data-id="' + esc(f.stand) + '"' : "") +
        '><image href="' + f.src + '" x="' + f.pts[0][0] +
        '" y="' + f.pts[0][1] + '" width="' + (f.pts[1][0] - f.pts[0][0]) +
        '" height="' + (f.pts[1][1] - f.pts[0][1]) +
        '" preserveAspectRatio="xMidYMid meet"/></g>'
      : f.t === "repere"
      ? traceRepere(f)
      : f.t === "texte"
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id + '"><text x="' + f.pts[0][0] + '" y="' + f.pts[0][1] +
        '" font-size="' + (f.taille || 2) + '">' + esc(f.txt) + '</text></g>'
      : '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id +
        '"><path d="' + cheminForme(f) + '"/></g>').join("");
    c.appendChild(g);
  }
  ordonneDom();
  cartouchePoi();
}

/* --- conversion écran → repère du plan --- */
function versPlan(clientX, clientY){
  const r = svg.getBoundingClientRect();
  return [ +(view.x + (clientX - r.left) / r.width * view.w).toFixed(2),
           +(view.y + (clientY - r.top) / r.height * view.h).toFixed(2) ];
}

function apercu(d){
  let el = $("apercu");
  if (!d){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.id = "apercu";
    svg.appendChild(el);
  }
  el.setAttribute("d", d);
}

function ajouteForme(f){
  const c = trouveCalque(calqueActif);
  if (!c) return;
  memorise();
  f.id = nouvelId();
  c.formes.push(f);
  enregistreDessins();
  dessineDessins();
  aide();
  return f.id;
}
