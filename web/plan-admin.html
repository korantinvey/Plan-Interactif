  { cle: "nu", nom: "Nu",
    resume: "Ni cadre ni libellés : la hiérarchie typographique seule." },
];
const modeleFiche = () => {
  const c = (CONF["_fiche"] || {}).modele;
  return MODELES_FICHE.some(m => m.cle === c) ? c : "sobre";
};

/** Pose l'habillage retenu sur la fiche. Une seule classe à la fois : les
 *  modèles se recouvrent, et deux ensemble ne veulent rien dire. */
function appliqueFiche(){
  const d = $("detail");
  if (!d) return;
  const cle = modeleFiche();
  MODELES_FICHE.forEach(m => d.classList.toggle("modele-" + m.cle, m.cle === cle));
}

/* ------------------------------------------------------------------
   L'exposant des aperçus

   Les onze vignettes montrent la même fiche sous onze habillages : c'est en la
   comparant à elle-même qu'on choisit. Mais elle ne peut pas être une fiche
   inventée — un salon qui a retiré l'adresse et remonté sa nomenclature
   choisirait son modèle sur des champs qu'il n'affiche pas, dans un ordre qui
   n'est pas le sien.

   Les vignettes portent donc les champs retenus, dans l'ordre réglé depuis la
   console, et les valeurs d'un vrai stand.
   ------------------------------------------------------------------ */

/* Comment lire chaque champ du corps sur un stand. Les mêmes sources que la
   fiche : ce que le plan porte reste au stand, le reste vient de la société. */
const LECTURE_CORPS = {
  raison: o => o.plan && o.plan !== o.nom ? o.plan : "",
  secteur: o => o.sect,
  adresse: o => o.adr,
  ville: o => o.ville,
  pays: o => o.pays,
  niveaux: o => o.niveaux > 1 ? String(o.niveaux) : "",
  telephone: o => o.tel,
  site: o => o.site,
  facebook: o => o.fb,
  linkedin: o => o.li,
  instagram: o => o.ig,
  nomenclature: o => o.nomencl,
  thematiques: o => o.themes,
};

/* Les champs qui tiennent en un mot s'apparient deux par deux sur écran
   étroit : la vignette le montre, comme la fiche le fait. */
const COURTS_CORPS = ["ville", "pays", "niveaux", "telephone"];

/* De quoi remplir un champ qu'aucun stand ne renseigne. Le taire ferait
   choisir un modèle sur une fiche plus courte que la vraie, et laisserait
   croire le champ retiré. */
const EXEMPLES_CORPS = {
  nom: "Ateliers Ligneron", code: "D14", hall: "Hall 2",
  raison: "Ligneron & Fils SARL", secteur: "Aménagement & second œuvre",
  adresse: "8 rue de la Filature", ville: "Nantes", pays: "France",
  niveaux: "2", telephone: "02 40 00 00 00", site: "ateliers-ligneron.fr",
  facebook: "facebook.com/ligneron", linkedin: "linkedin.com/company/ligneron",
  instagram: "instagram.com/ligneron",
  nomenclature: "Menuiserie;Agencement de boutique",
  thematiques: "Réemploi;Bois de pays",
};

/** Ce qu'un stand porte pour un champ du corps, en une chaîne. */
function texteCorps(o, cle){
  if (cle.indexOf(PREFIXE_PERSO) === 0){
    return separeValeurs((o.perso || {})[cle.slice(PREFIXE_PERSO.length)]).join(";");
  }
  const l = LECTURE_CORPS[cle];
  return l ? separeValeurs(l(o)).join(";") : "";
}

/**
 * Le stand qui remplit le mieux les champs retenus.
 *
 * Le premier venu n'irait pas : il peut n'avoir ni adresse, ni thématique, ni
 * nomenclature — c'est-à-dire rien de ce que les modèles habillent — et on
 * choisirait un habillage sur une fiche vide.
 */
function standApercu(cles){
  let mieux = null, hall = "", score = 0, neuf = false;
  Object.values(DATA.plans || {}).forEach(pl => (pl.stands || []).forEach(o => {
    if (!o.nom) return;
    neuf = neuf || Boolean(o.neuf);
    const n = cles.reduce((s, c) => s + (texteCorps(o, c) ? 1 : 0), 0);
    if (n > score){ score = n; mieux = o; hall = pl.libelle || ""; }
  }));
  return { stand: mieux, hall, neuf };
}

/**
 * Ce que les onze vignettes montrent : relevé une fois, elles s'en partagent.
 *
 * Un champ propre au salon qu'aucun stand ne renseigne n'a pas d'exemple à
 * prêter — le code ne connaît pas son sujet — d'où la mention en clair plutôt
 * qu'une valeur inventée qui passerait pour une vraie.
 */
function contenuApercu(){
  const persos = (DATA.fiche && DATA.fiche.perso) || [];
  const cles = ordreCorps(persos.map(c => PREFIXE_PERSO + c.cle))
    .filter(c => montre("stand", c));
  const { stand, hall, neuf } = standApercu(cles);
  const vals = {};
  cles.forEach(c => {
    vals[c] = (stand && texteCorps(stand, c)) || EXEMPLES_CORPS[c] ||
      (c.indexOf(PREFIXE_PERSO) === 0 ? "Valeur d'exemple" : "");
  });
  return {
    cles: cles.filter(c => vals[c]), vals,
    nom: (stand && stand.nom) || EXEMPLES_CORPS.nom,
    code: (stand && stand.code) || EXEMPLES_CORPS.code,
    hall: hall || EXEMPLES_CORPS.hall,
    /* La pastille ne paraît que là où le salon distingue ses nouveaux venus :
       le réglage seul la ferait voir sur des salons dont aucune fiche ne porte
       le champ, et plusieurs modèles l'habillent — on choisirait sur une
       marque qu'on n'aura jamais. */
    neuf: neuf && montre("stand", "nouveau"),
  };
}

function apercuFiche(cle, vu){
  const d = document.createElement("div");
  d.className = "apercu modele-" + cle;
  // l'aperçu se regarde, il ne se manipule pas
  d.inert = true;
  const champ = (l, v, c) => '<div class="field' + (c ? " " + c : "") + '">' +
    '<span class="eyebrow">' + esc(l) + '</span><span class="v">' + v + '</span></div>';
  /* Une adresse web s'affiche en lien sur la fiche : la vignette le montre
     aussi, plusieurs modèles n'habillant que les liens. */
  const LIENS = ["site", "facebook", "linkedin", "instagram"];
  const corps = vu.cles.map(c => {
    const l = separeValeurs(vu.vals[c]);
    const v = l.length > 1
      ? l.map(x => '<span class="ligne">' + esc(x) + '</span>').join("")
      : LIENS.indexOf(c) >= 0 ? '<a href="#">' + esc(l[0]) + '</a>' : esc(l[0]);
    return champ(libelleCorps(c), v, COURTS_CORPS.indexOf(c) >= 0 ? "court" : "");
  }).join("");
  /* Le programme reste celui de l'exemple, quand tout le reste vient du salon :
     le stand qui remplit le mieux la fiche ne tient pas forcément de
     conférence, et le modèle qui déroule une ligne de temps n'aurait rien à
     montrer. */
  const confs = montre("stand", "conferences")
    ? '<div class="field prog-bloc"><span class="eyebrow">Conférences</span><div class="prog">' +
        '<div class="confRang"><span class="conf"><span class="h">10h30 – 11h15</span>' +
        '<span class="t">Le bois de pays dans la commande publique</span>' +
        '<span class="ty">Table ronde</span></span></div>' +
        '<div class="confRang"><span class="conf"><span class="h">16h00 – 16h45</span>' +
        '<span class="t">Agencer une boutique en réemploi</span>' +
        '<span class="ty">Démonstration</span></span></div>' +
      '</div></div>'
    : "";
  const code = montre("stand", "code") ? vu.code : "";
  d.innerHTML =
    '<div class="detail-hd" data-code="' + esc(code) + '">' +
      /* Des balises neutres plutôt que des boutons : l'aperçu vit dans un
         bouton — celui qui choisit le modèle — et un bouton n'en contient pas
         un autre. Les classes suffisent à l'habillage. */
      '<div class="hdActs"><span class="marque">' +
      '<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>' +
      '</span><span class="close">&times;</span></div>' +
      '<span class="eyebrow">Stand</span><h2>' + esc(vu.nom) + '</h2>' +
      '<span class="badge">' + esc(vu.hall + (code ? " · " + code : "")) + '</span>' +
      (vu.neuf ? '<span class="badge neuf">Nouvel exposant</span>' : "") +
    '</div>' +
    '<div class="detail-bd">' + corps + confs +
      '<div class="acts"><span class="btn">Centrer sur le plan</span>' +
      '<span class="btn itin">Itinéraire</span></div>' +
    '</div>';
  return d;
}

/**
 * Réglages généraux du plan.
 *
 * Ils ne portent sur aucun calque : dans la pile ils alourdissaient une liste
 * déjà longue, et se lisaient comme une couche de plus. Une fenêtre à part les
 * range, et laisse la place à celles qui viendront.
 *
 * Deux volets : ce que le plan montre, et de quoi il a l'air. Le second est
 * une planche d'aperçus — empilé sous le premier, il l'aurait poussé hors de
 * l'écran.
 */
function ouvreReglages(){
  ouvreModale("Réglages du plan", corps => {
    const barre = document.createElement("div");
    barre.className = "ongReg";
    corps.appendChild(barre);
    const boutons = [], volets = [];
    const volet = (titre) => {
      const i = boutons.length;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = titre;
      b.setAttribute("aria-pressed", String(i === 0));
      b.onclick = () => {
        boutons.forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
        volets.forEach((x, j) => { x.hidden = j !== i; });
      };
      barre.appendChild(b);
      boutons.push(b);
      const v = document.createElement("div");
      v.hidden = i > 0;
      corps.appendChild(v);
      volets.push(v);
      return v;
    };
    voletPlan(volet("Plan"));
    voletApparence(volet("Apparence"));
  }, [{ libelle: "Fermer" }], "large");
}

/** Ce que les visiteurs voient sur le plan : les commandes, les secteurs, et
 *  le temps qu'on passe sur un stand. */
function voletPlan(hote){
  const p = document.createElement("p");
  p.textContent = "Ce que les visiteurs voient sur le plan. " +
    "Publiez la configuration pour que le changement leur parvienne.";
  hote.appendChild(p);

  const bloc = document.createElement("div");
  bloc.className = "reglages";
  COMMANDES.forEach(cmd => {
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent = cmd.libelle;
    const c = l.querySelector("input");
    c.checked = conf(cmd.cle).visible !== false;
    c.onchange = e => {
      conf(cmd.cle).visible = e.target.checked;
      enregistreConf(); appliqueCommandes();
      // la couleur du parcours vit dans la pile : elle suit le réglage
      if (ADMIN) construitPanneau();
    };
    bloc.appendChild(l);
  });

  /* Le coloriage par secteur reste hors de COMMANDES : celles-ci montrent ou
     retirent une commande du plan, celui-ci change ce que le plan donne à
     voir. Il ne s'offre que sur un salon sectorisé — ailleurs la case
     promettrait des couleurs qu'aucune donnée ne porte. */
  if (SECTEURS.size){
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent = "Montrer les secteurs — couleurs et filtre";
    const c = l.querySelector("input");
    c.checked = conf("_secteurs").visible !== false;
    c.onchange = e => {
      conf("_secteurs").visible = e.target.checked;
      enregistreConf(); appliqueSecteurs(); appliqueFiltre();
      // les couleurs des secteurs vivent dans la pile : elles suivent
      if (ADMIN) construitPanneau();
    };
    bloc.appendChild(l);
  }

  /* Sur quoi l'itinéraire se règle. Le hall d'un seul tenant se traverse
     mieux d'équerre, le hall arrondi mieux allée par allée, et le plan seul
     dit lequel des deux il est — d'où la case, plutôt qu'une règle qu'on
     aurait devinée de loin. */
  {
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector("span").textContent =
      "Suivre les allées une à une — pour un hall arrondi ou aux rangées désaccordées";
    const c = l.querySelector("input");
    c.checked = conf("_guidage").allees === true;
    c.onchange = e => {
      conf("_guidage").allees = e.target.checked;
      enregistreConf();
      // le trait affiché a été calculé avec l'autre réglage : il se refait
      if (typeof relance === "function") relance();
    };
    bloc.appendChild(l);
  }

  /* Les stands partagés, comme les secteurs, ne se règlent que là où il y en
     a : sur un salon d'un exposant par emplacement, ces deux cases ne
     promettraient qu'un plan déjà tel quel. */
  if (salonPartage()){
    [{ cle: "_coexNombre",
       libelle: "Compter les co-exposants sur le plan",
       // le compte fait partie du libellé du stand : il se redessine avec lui
       apres: () => libelles() },
     { cle: "_coexChoix",
       libelle: "Afficher la liste des co-exposants au clic sur le stand" }
    ].forEach(r => {
      const l = document.createElement("label");
      l.innerHTML = '<input type="checkbox"><span></span>';
      l.querySelector("span").textContent = r.libelle;
      const c = l.querySelector("input");
      c.checked = conf(r.cle).visible !== false;
      c.onchange = e => {
        conf(r.cle).visible = e.target.checked;
        enregistreConf();
        if (r.apres) r.apres();
      };
      bloc.appendChild(l);
    });
  }

  hote.appendChild(bloc);

  const duree = document.createElement("div");
  duree.className = "reglage-nb";
  duree.innerHTML = '<label><span class="l"></span>' +
    '<input type="number" min="' + VISITE_MIN + '" max="' + VISITE_MAX + '" step="5">' +
    '<span class="u">min</span></label><span class="aide"></span>';
  duree.querySelector(".l").textContent = "Temps de visite par stand";
  duree.querySelector(".aide").textContent =
    "Sert à organiser la journée d'un visiteur depuis son parcours : c'est ce " +
    "qui décide combien de stands tiennent entre deux conférences.";
  const n = duree.querySelector("input");
  n.value = minutesVisite();
  /* Un champ vidé le temps de retaper ne doit rien écrire : on ne retient
     que ce qui tient dans les bornes, et le champ se remet d'aplomb quand
     on le quitte. */
  n.oninput = e => {
    const v = Math.round(+e.target.value);
    if (v >= VISITE_MIN && v <= VISITE_MAX){ conf("_visite").minutes = v; enregistreConf(); }
  };
  n.onblur = () => { n.value = minutesVisite(); };
  hote.appendChild(duree);
}

/* Le nuancier. Des tons de charte plutôt qu'une roue : choisir une couleur
   principale, c'est choisir celle du salon, pas la nuance exacte d'un dégradé.
   Ils sont rangés par famille — bleus, verts, chauds, rouges, violets,
   neutres — et tous assez soutenus pour porter du texte, blanc ou noir, sans
   qu'il faille le vérifier au cas par cas. La dernière pastille ouvre le
   nuancier du système, pour une charte à l'hexadécimal près. */
const TONS = [
  ["#2F49D1", "Bleu d'encre"], ["#1B5FD9", "Bleu roi"], ["#23356B", "Bleu nuit"],
  ["#0F6F8A", "Bleu canard"], ["#0E8A7D", "Turquoise"], ["#0E7A3C", "Vert prairie"],
  ["#2C5E4A", "Vert forêt"], ["#5C7A1E", "Olive"],
  ["#B07A0B", "Or brûlé"], ["#C06A0B", "Ambre"], ["#C05621", "Terracotta"],
  ["#B4402F", "Brique"], ["#A82437", "Grenat"], ["#8E1F3F", "Cerise"],
  ["#B32A63", "Framboise"], ["#A8318C", "Fuchsia"],
  ["#7A3DBE", "Violet"], ["#5333C4", "Indigo"], ["#6B3A5E", "Prune"],
  ["#7A5230", "Brun"], ["#3F5566", "Ardoise"], ["#25303A", "Anthracite"],
];
const nomDuTon = (h) => (TONS.find(t => t[0].toLowerCase() === String(h).toLowerCase()) || [])[1];

/** De quoi le plan a l'air : sa couleur principale, et l'habillage de sa
 *  fiche détail. */
function voletApparence(hote){
  const p = document.createElement("p");
  p.textContent = "La couleur principale sert partout : sélection, liens, " +
    "boutons, pastilles, et les modèles de fiche s'en habillent. Le modèle " +
    "décide de l'allure du panneau qui s'ouvre sur un stand.";
  hote.appendChild(p);

  const coul = document.createElement("div");
  coul.className = "reglage-coul";
  coul.innerHTML = '<div class="tete"><span class="eyebrow">Couleur principale</span>' +
    '<span class="val"></span>' +
    '<button type="button" class="raz">Couleur d\'origine</button></div>' +
    '<div class="nuancier"></div>';
  const val = coul.querySelector(".val");
  const nuancier = coul.querySelector(".nuancier");
  const majPastilles = () => {
    const v = (conf("_accent").couleur || "").toLowerCase();
    nuancier.querySelectorAll("button[data-ton]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.ton.toLowerCase() === v)));
    const n = nomDuTon(v);
    val.textContent = v ? (n ? n + " · " + v.toUpperCase() : v.toUpperCase())
                        : "Réglage d'origine";
    const libre = nuancier.querySelector(".perso input");
    if (libre) libre.value = conf("_accent").couleur || jeton("--accent-base") || "#2F49D1";
  };
  const choisit = (v) => {
    conf("_accent").couleur = v;
    enregistreConf(); appliqueAccent(); majPastilles();
  };
  TONS.forEach(([ton, nom]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.ton = ton;
    b.style.background = ton;
    b.title = nom + " · " + ton;
    b.setAttribute("aria-label", nom);
    b.onclick = () => choisit(ton);
    nuancier.appendChild(b);
  });
  /* La pastille de couleur libre. Le sélecteur du système envoie une rafale
     d'événements pendant qu'on glisse : on suit, c'est le seul moyen de voir
     la couleur s'installer sur le plan pendant qu'on la cherche. Rien ne part
     en base pour autant, la publication reste un geste à part. */
  const libre = document.createElement("label");
  libre.className = "perso";
  libre.title = "Couleur libre";
  libre.innerHTML = '<input type="color"><span></span>';
  libre.querySelector("input").oninput = e => choisit(e.target.value);
  nuancier.appendChild(libre);
  coul.querySelector(".raz").onclick = () => {
    delete conf("_accent").couleur;
    enregistreConf(); appliqueAccent(); majPastilles();
  };
  hote.appendChild(coul);
  majPastilles();

  const titre = document.createElement("span");
  titre.className = "eyebrow";
  titre.textContent = "Modèle de fiche";
  titre.style.display = "block";
  titre.style.margin = "0 0 9px";
  hote.appendChild(titre);

  const grille = document.createElement("div");
  grille.className = "modeles";
  const courant = modeleFiche();
  // le même contenu pour les onze : c'est en comparant la même fiche à
  // elle-même qu'on choisit son habillage
  const vu = contenuApercu();
  MODELES_FICHE.forEach(m => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mod";
    b.setAttribute("aria-pressed", String(m.cle === courant));
    b.innerHTML = '<span class="vue"></span>' +
      '<span class="nom"><span class="t"></span><span class="coche">✓</span></span>' +
      '<span class="resume"></span>';
    b.querySelector(".nom .t").textContent = m.nom;
    b.querySelector(".resume").textContent = m.resume;
    b.querySelector(".vue").appendChild(apercuFiche(m.cle, vu));
    b.onclick = () => {
      conf("_fiche").modele = m.cle;
      enregistreConf(); appliqueFiche();
      grille.querySelectorAll(".mod").forEach(x =>
        x.setAttribute("aria-pressed", String(x === b)));
    };
    grille.appendChild(b);
  });
  hote.appendChild(grille);
}

/** Les réglages d'apparence vivent sur le poste tant qu'ils ne sont pas
 *  remontés vers la base. */
const enregistreConf = () => {
  try { localStorage.setItem(CLE_CONF, JSON.stringify(CONF)); } catch (e) {}
};

/** Une couleur Klipso « rgb(r,g,b) » vers la notation attendue par le
 *  sélecteur de couleur. */
const rgbHex = (s) => {
  const m = String(s || "").match(/\d+/g);
  if (!m || m.length < 3) return null;
  return "#" + m.slice(0, 3)
    .map((n) => Math.max(0, Math.min(255, +n)).toString(16).padStart(2, "0")).join("");
};

const hexa = (v) => "#" + v.map(c => c.toString(16).padStart(2, "0")).join("");

/** Luminance relative d'un triplet, au sens du calcul de contraste : 0 pour le
 *  noir, 1 pour le blanc, en passant par la courbe de l'œil. */
const luminance = (v) => [0.2126, 0.7152, 0.0722].reduce((a, poids, i) => {
  const s = v[i] / 255;
  return a + poids * (s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4));
}, 0);

/**
 * Écarte une couleur vers le noir ou vers le blanc, du côté où le contraste
 * gagne le plus. Le liseré d'une sélection se déduit ainsi de son aplat et
 * reste lisible dessus, quel que soit le ton choisi.
 *
 * Le sens ne se devine pas à la clarté seule : un bleu franc et un orange sont
 * tous deux à mi-hauteur, et pourtant l'un gagne à s'éclaircir quand l'autre
 * gagne à s'assombrir. On calcule les deux et on garde le meilleur.
 */
const ecarte = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return hex;
  const n = parseInt(m[1], 16), v = [n >> 16 & 255, n >> 8 & 255, n & 255];
  /* 0,7 plutôt qu'une demi-teinte : le liseré borde l'aplat, mais le numéro du
     stand s'écrit dessus dans la même couleur, et un rapport de contraste de
     trois pour un ne se lit pas en petit. */
  const vers = (but) => v.map(c => Math.round(c + (but - c) * 0.7));
  const base = luminance(v) + 0.05;
  const contraste = (w) => { const a = luminance(w) + 0.05; return a > base ? a / base : base / a; };
  const sombre = vers(0), clair = vers(255);
  return hexa(contraste(sombre) >= contraste(clair) ? sombre : clair);
};

/** Nom lisible d'un sous-calque : « 4-PORTE-SECU » devient « Porte secu ». */
const joli = (id) => String(id)
  .replace(/^[0-9]+-/, "").replace(/[_-]+/g, " ").toLowerCase()
  .replace(/^./, (c) => c.toUpperCase());

/* ============================================================
   10. Mode administration
   Il n'existe que dans la page dédiée, et seulement une fois l'utilisateur
   authentifié. La page publique ne l'active jamais et retire ses commandes
   du document. Un raccourci clavier ne serait pas une frontière.
   ============================================================ */
let ADMIN = false;

/**
 * Page publique : les commandes d'administration sont neutralisées.
 * On les masque et on les vide plutôt que de les supprimer — le montage du
 * plan y touche encore, et ADMIN restant faux, rien ne peut les activer.
 */
function retireAdmin(){
  ["btnLayers", "btnReglages", "btnChaleur"].forEach(id => { const b = $(id); if (b) b.remove(); });
  ["panel", "outils", "elemSel", "libReg"].forEach(id => {
    const e = $(id);
    if (!e) return;
    e.hidden = true;
    e.classList.remove("open");
    e.setAttribute("aria-hidden", "true");
    if (id !== "outils") e.innerHTML = "";
  });
}

/** Ouvre le mode administration, une fois l'identité vérifiée. */
function activeAdmin(){
  if (ADMIN) return;
  ADMIN = true;
  // l'outil de départ est la sélection : les dessins deviennent cliquables
  racine.classList.add("mode-edition");
  const b = $("btnLayers");
  if (b){
    b.hidden = false;
    b.onclick = () => {
      const o = $("panel").classList.toggle("open");
      b.setAttribute("aria-pressed", o);
      // même coin, au-dessus du tiroir : un seul panneau sur un écran étroit
      if (o && ETROIT()) fermeChaleur();
    };
  }
  const r = $("btnReglages");
  if (r){ r.hidden = false; r.onclick = ouvreReglages; }
  /* La fréquentation se lit sur le plan lui-même, et non depuis la console :
     c'est ici qu'on redessine les allées, et c'est ici qu'il faut savoir
     lesquelles ont servi. */
  const ch = $("btnChaleur");
  if (ch){ ch.hidden = false; ch.onclick = basculeChaleur; }
  const barre = document.createElement("div");
  barre.className = "adminbar";
  /* Copier et importer une configuration servaient à la transporter d'un poste
     à l'autre, faute de mieux. Maintenant qu'elle se publie, ils n'ajoutent
     qu'un chemin de plus pour arriver au même endroit. */
  barre.innerHTML = '<button class="reset fort" id="pousseConf">Pousser la configuration</button>' +
                    '<button class="reset" id="razConf">Rétablir les valeurs d\'origine</button>';
  $("panel").appendChild(barre);
  $("razConf").onclick = () => {
    CONF = JSON.parse(JSON.stringify(DEFAUTS));
    try { localStorage.removeItem(CLE_CONF); } catch (e) {}
    // les placements de libellés vivent dans CONF : ils repartent avec elle
    appliqueApparence(); libelles(); construitPanneau();
  };
  $("pousseConf").onclick = e => pousseConfiguration(e.target);
  /* Le plan a pu être monté avant que l'identité soit vérifiée : une page à
     données figées démarre sans rien attendre. Le panneau des calques n'a
     alors pas été construit — montePlan() n'en bâtit qu'en administration —
     et les dessins ne sont pas cliquables. C'est à cela que sert ce drapeau,
     qui jusqu'ici ne servait à rien. */
  if (MONTE){ dessineDessins(); construitPanneau(); }
  majAttente();
}


/* ============================================================
   Renommer une zone organisateur
   Une zone tire son nom de Klipso, ou des textes posés sur le plan. Quand ni
   l'un ni l'autre ne donne rien — les vingt-deux zones de Franchise Expo
   s'affichent « Zone sans nom » — il faut pouvoir le saisir.

   Le nom est enregistré sur l'événement, pas dans le navigateur : c'est le
   visiteur qui doit le lire. Et il s'applique à la lecture, si bien qu'il
   paraît sans attendre la prochaine synchronisation.
   ============================================================ */
function renommeZone(o){
  let champ;
  ouvreModale("Renommer la zone", corps => {
    const l = document.createElement("label");
    l.innerHTML = "<span>Nom de la zone</span><input>";
    champ = l.querySelector("input");
    champ.value = (DATA.nomsZones || {})[o.id] || o.nom || "";
    champ.placeholder = "Agora, Halte-garderie, Pitch Retail…";
    corps.appendChild(l);
    const aide = document.createElement("p");
    aide.className = "aide";
    aide.textContent = "Laissez vide pour revenir au nom d'origine, s'il y en a un.";
    corps.appendChild(aide);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); enregistreNomZone(o, champ.value); fermeModale(); }
    };
  }, [
    { libelle: "Annuler" },
    { libelle: "Enregistrer", genre: "primaire",
      action: () => enregistreNomZone(o, champ.value) },
  ]);
}

async function enregistreNomZone(o, valeur){
  const nom = String(valeur || "").trim();
  try {
    const noms = await ecritTableZones("zones", DATA.nomsZones, t => {
      if (nom) t[o.id] = nom; else delete t[o.id];
    });
    DATA.nomsZones = noms;
    // le nom d'origine n'est pas perdu : on le garde pour pouvoir y revenir
    if (o.origine === undefined) o.origine = o.nom;
    o.nom = nom || o.origine || null;
    libelles(); liste();
    ouvre(o, null);
  } catch (e) {
    annonce("Renommage impossible : " + e.message, true);
  }
}


/* ============================================================
   Masquer une zone organisateur
   Toutes les zones que Klipso renvoie ne s'adressent pas au visiteur : un
   local technique, une réserve, un quai de livraison occupent le plan sans
   rien lui apprendre. L'exploitant les éteint une par une depuis leur fiche.

   Une zone éteinte ne part plus dans le plan public ; en administration elle
   reste, en teinte pâlie, car c'est de là qu'on revient sur son choix. Le
   masquage est enregistré sur l'événement, et s'applique à la lecture : il
   paraît sans attendre la prochaine synchronisation.
   ============================================================ */
async function basculeAffichageZone(o){
  const masquer = !o.masquee;
  try {
    const masques = await ecritTableZones("zones_masquees", DATA.zonesMasquees, t => {
      if (masquer) t[o.id] = true; else delete t[o.id];
    });
    DATA.zonesMasquees = masques;
    o.masquee = masquer || undefined;
    marqueZonesMasquees();
    libelles();
    ouvre(o, null);
  } catch (e) {
    annonce("Changement impossible : " + e.message, true);
  }
}

/** La teinte pâlie des zones éteintes, reposée sur le plan en place. */
function marqueZonesMasquees(){
  document.querySelectorAll("#zones g").forEach(g => {
    const z = parId.get(g.dataset.id);
    g.classList.toggle("masquee", !!z && !!z.masquee);
  });
}


/**
 * Réécrire une des tables de l'événement indexées par zone — les noms, les
 * masquages. Chacune tient dans une seule colonne : la renvoyer telle que la
 * page l'avait chargée effacerait ce qu'un autre poste y a mis depuis. On
 * repart donc de ce que la base contient à l'instant, et « change » n'y touche
 * que la zone concernée.
 */
async function ecritTableZones(colonne, secours, change){
  let cfg = null, ses = null;
  try {
    cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    ses = JSON.parse(localStorage.getItem("console-session") || "null");
  } catch (e) {}
  if (!cfg?.url || !ses?.access_token) throw new Error("session absente, reconnectez-vous");

  const entetes = { "apikey": cfg.anonKey, "Authorization": "Bearer " + ses.access_token };
  const enBase = await fetch(cfg.url + "/rest/v1/evenement?select=" + colonne + "&slug=eq." +
    encodeURIComponent(DATA.slug), { headers: entetes })
    .then(r => r.ok ? r.json() : []).catch(() => []);
  const table = { ...(enBase[0]?.[colonne] || secours || {}) };
  change(table);

  const r = await fetch(cfg.url + "/rest/v1/evenement?slug=eq." + encodeURIComponent(DATA.slug), {
    method: "PATCH",
    headers: { ...entetes, "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify({ [colonne]: table, modifie_le: new Date().toISOString() }),
  });
  if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120));
  return table;
}


/* ============================================================
   Placer un libellé à la main

   Le nom d'un stand est posé automatiquement : au milieu de l'emplacement, à
   la taille que la place autorise. C'est juste pour un rectangle, et ce l'est
   moins dès que le plan sort du cas d'école — un stand en L dont le nom tombe
   sur la découpe, deux enseignes voisines dont les noms se touchent, une zone
   organisateur dont l'intitulé traverse une allée. L'exploitant voit ces
   cas-là, le calcul non : il lui faut pouvoir déplacer et agrandir un libellé.

   Le réglage se range dans l'apparence du salon, avec les couleurs et l'ordre
   des calques, et part aux visiteurs à la publication.

   Il porte avec lui l'empreinte de ce dont il dépend : ce qui s'écrit, et la
   forme qui le porte. Une synchronisation qui n'y touche pas le laisse en
   place — c'est tout l'objet — mais une qui renomme l'exposant, déplace le
   stand ou le redimensionne le périme : le décalage ne décrit plus rien, et
   laisser le nom flotter à côté serait pire que de le replacer tout seul.
   Le réglage n'est pas effacé pour autant, il cesse de s'appliquer : si la
   forme revient telle qu'elle était, il revient avec elle.
   ============================================================ */
const cleLibelle = (id) => "_lab:" + id;

/* Le mode est transitoire : on y entre pour retoucher, on en sort. Il ne se
   retient pas d'une session à l'autre — ce n'est pas un réglage du salon. */
let PLACE_LIBELLES = false;
let libSel = null;      // l'objet dont on retouche le libellé
let glisseLib = null;   // le geste en cours

/**
 * Ce dont dépend le placement d'un libellé : ce qui s'y écrit, et la forme qui
 * le porte — son ancrage et la place dont il dispose autour.
 *
 * Le nom retenu est celui qui s'affiche, y compris quand l'exploitant l'a
 * choisi lui-même sur une zone : renommer, c'est écrire autre chose, et cet
 * autre chose n'a pas de raison de tenir à la même taille au même endroit.
 */
function empreinteLibelle(o){
  const a = ancre(o) || [0, 0], p = place(o) || [0, 0];
  return [o.nom || "", o.code || "",
          (+a[0]).toFixed(2), (+a[1]).toFixed(2),
          (+p[0]).toFixed(2), (+p[1]).toFixed(2)].join("|");
}

/** Le placement réglé à la main, s'il décrit encore ce qui est sur le plan. */
function placementLibelle(o){
  const r = CONF[cleLibelle(o.id)];
  return r && r.e === empreinteLibelle(o) ? r : null;
}

/**
 * Poser un placement, sans l'écrire sur le poste : un glisser en produit un
 * par image, et enregistrer à chaque fois sérialiserait toute la configuration
 * soixante fois par seconde. C'est la fin du geste qui enregistre.
 */
function posePlacement(o, change){
  const r = placementLibelle(o);
  const n = { dx: r ? r.dx || 0 : 0, dy: r ? r.dy || 0 : 0, k: r && r.k > 0 ? r.k : 1,
              e: empreinteLibelle(o) };
  change(n);
  n.dx = +(+n.dx).toFixed(2);
  n.dy = +(+n.dy).toFixed(2);
  n.k = Math.max(.4, Math.min(3, +n.k || 1));
  /* Un placement qui ne déplace ni n'agrandit rien n'est pas un réglage : il
     sort de la configuration plutôt que d'y peser et d'y vieillir. */
  if (!n.dx && !n.dy && Math.abs(n.k - 1) < .001) delete CONF[cleLibelle(o.id)];
  else CONF[cleLibelle(o.id)] = n;
  libelles();
  majPaletteLibelle();
}

/** Rendre un libellé à son placement automatique. */
function libelleAutomatique(){
  const o = libSel && parId.get(libSel);
  if (!o) return;
  delete CONF[cleLibelle(o.id)];
  enregistreConf();
  libelles();
  majPaletteLibelle();
}

function modePlacementLibelles(on){
  PLACE_LIBELLES = !!on && ADMIN;
  racine.classList.toggle("mode-libelles", PLACE_LIBELLES);
  /* Le placement et le dessin se disputeraient le glisser : entrer dans l'un
     referme l'autre, plutôt que de laisser deux gestes viser le même pointeur. */
  if (PLACE_LIBELLES && calqueActif) activeCalque(calqueActif);
  if (!PLACE_LIBELLES){ libSel = null; glisseLib = null; }
  majPaletteLibelle();
  libelles();
}

/** La palette du libellé retouché : sa taille, et de quoi y renoncer. */
function majPaletteLibelle(){
  const z = $("libReg");
  if (!z || !ADMIN || !$("libNom")) return;
  const o = libSel && parId.get(libSel);
  z.classList.toggle("open", !!(PLACE_LIBELLES && o));
  if (!(PLACE_LIBELLES && o)) return;
  const r = placementLibelle(o);
  $("libNom").textContent = o.nom || o.code ||
    (o.kind === "zone" ? "Zone sans nom" : "Stand");
  $("libTaille").value = r && r.k ? r.k : 1;
  $("libAuto").disabled = !r;
  $("libAide").textContent = r
    ? "Glissez le libellé, ou ajustez-le aux flèches du clavier."
    : "Glissez ce libellé pour le déplacer, ou tirez la taille.";
}

/** Choisir le libellé qu'on retouche — au clic, ou en le glissant. */
function choisitLibelle(id){
  libSel = id;
  libelles();
  majPaletteLibelle();
}

/** Le pas du clavier : un quart de mètre, un mètre touche majuscule tenue. */
function pousseLibelle(dx, dy){
  const o = libSel && parId.get(libSel);
  if (!o) return;
  posePlacement(o, n => { n.dx += dx; n.dy += dy; });
  enregistreConf();
}

/* --- le geste ; renvoie vrai si l'événement est consommé --- */
function libellePointerDown(e){
  if (!PLACE_LIBELLES) return false;
  const g = e.target.closest("#labels .lbl");
  if (!g) return false;
  const o = parId.get(g.dataset.lbl);
  if (!o) return false;
  e.preventDefault();
  choisitLibelle(o.id);
  const r = placementLibelle(o);
  glisseLib = { o: o, depart: versPlan(e.clientX, e.clientY),
                dx: r ? r.dx || 0 : 0, dy: r ? r.dy || 0 : 0 };
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  return true;
}

function libellePointerMove(e){
  if (!glisseLib) return false;
  const p = versPlan(e.clientX, e.clientY);
  const dx = glisseLib.dx + p[0] - glisseLib.depart[0];
  const dy = glisseLib.dy + p[1] - glisseLib.depart[1];
  posePlacement(glisseLib.o, n => { n.dx = dx; n.dy = dy; });
  return true;
}

function libellePointerUp(e){
  if (!glisseLib) return false;
  glisseLib = null;
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  enregistreConf();
  return true;
}

/* Sortir par la croix doit décocher la case du panneau, qui dit le contraire :
   on le relit. La case elle-même n'en a pas besoin — elle vient d'être
   cochée — et le refaire remplacerait le nœud en pleine gestion de son
   propre événement. */
if ($("libFerme")) $("libFerme").onclick = () => {
  modePlacementLibelles(false);
  construitPanneau();
};
if ($("libAuto")) $("libAuto").onclick = libelleAutomatique;
if ($("libTaille")){
  $("libTaille").oninput = e => {
    const o = libSel && parId.get(libSel);
    if (o) posePlacement(o, n => { n.k = +e.target.value; });
  };
  $("libTaille").onchange = enregistreConf;
}

/* ============================================================
   11. Calques de dessin
   Des calques créés par l'exploitant, propres à un pavillon, sur lesquels
   il trace rectangles, polygones, lignes et textes. Le tracé est enregistré
   en mètres dans le repère du plan : il suit le zoom comme le reste.
   ============================================================ */
const CLE_DESSINS = "plan-dessins";
let DESSINS = {};
try { DESSINS = JSON.parse(localStorage.getItem(CLE_DESSINS) || "{}"); } catch (e) {}

/* Ce qui n'est pas encore parti en base.
   Les dessins vivent à deux endroits : la base, qui fait foi pour les
   visiteurs, et le poste, où l'exploitant travaille. Au chargement, la base
   écrasait le poste sans rien demander — un calque tracé puis non publié
   disparaissait au premier rechargement, alors qu'il était encore dans le
   stockage local. Il ne se perdait pas : il devenait invisible, puis
   l'enregistrement suivant l'effaçait pour de bon.

   On retient donc, pavillon par pavillon, qu'un dessin a bougé depuis la
   dernière publication. Ce travail-là l'emporte sur la base tant qu'il n'y est
   pas parti — lui seul n'existe nulle part ailleurs. */
const CLE_ATTENTE = "plan-dessins-attente";
let ATTENTE = {};
try { ATTENTE = JSON.parse(localStorage.getItem(CLE_ATTENTE) || "{}"); } catch (e) {}

/** Le pavillon a-t-il des dessins que la base ne connaît pas encore ? */
const enAttente = (id) => ATTENTE[id] === true;

function marqueAttente(id, oui){
  if (oui) ATTENTE[id] = true; else delete ATTENTE[id];
  try { localStorage.setItem(CLE_ATTENTE, JSON.stringify(ATTENTE)); } catch (e) {}
  majAttente();
}

/** Les calques de dessin du pavillon courant. Ceux du service ont été repris
 *  au chargement ; il ne reste qu'à ouvrir la liste si elle manque. */
const mesCalques = () => (DESSINS[P().id] = DESSINS[P().id] || []);
const enregistreDessins = () => {
  /* Les repères et les formes dessinées entrent dans le calcul d'itinéraire :
     la grille de marche qui les ignore n'a plus cours, et l'annuaire des
     passages non plus. On attend la fin du geste — dessiner en referait une à
     chaque image, ce qui serait insoutenable. */
  oublieGrilles();
  oublieLiaisons();
  // les formes posées servent d'aimants aux suivantes : le relevé a vieilli
  oublieAimants();
  rafraichitApercu();
  /* Le geste vient d'écarter le poste de ce que la base contient : c'est vrai
     dès la première forme tracée, et non au moment où l'on pense à publier. */
  marqueAttente(P().id, true);
  try { localStorage.setItem(CLE_DESSINS, JSON.stringify(DESSINS)); }
  catch (e) {
    // les images sont encodées dans le document : le quota se remplit vite
    if ($("outilsAide")) $("outilsAide").textContent =
      "Mémoire du navigateur pleine : allégez ou supprimez une image.";
  }
};

let calqueActif = null;   // id du calque en cours d'édition
let outil = "main";
let enCours = null;       // tracé en construction

/* Historique des dessins. L'instantané ne copie que les calques et leurs
   tableaux de formes : les formes elles-mêmes, images comprises, sont
   partagées par référence — mémoriser reste donc quasi gratuit. */
const HIST = [], REFAIRE = [];
const instantane = () => mesCalques().map(c => Object.assign({}, c, { formes: c.formes.slice() }));
function memorise(){
  HIST.push(instantane());
  if (HIST.length > 50) HIST.shift();
  REFAIRE.length = 0;
}
function restaure(source, autre){
  if (!source.length) return false;
  autre.push(instantane());
  DESSINS[P().id] = source.pop();
  if (calqueActif && !trouveCalque(calqueActif)) activeCalque(null);
  enregistreDessins(); dessineDessins();
  if (ADMIN) construitPanneau();
  return true;
}
function annule(){
  // pendant un tracé, on retire le dernier sommet plutôt que l'action entière
  if (enCours && enCours.pts.length > 1){
    enCours.pts.pop();
    apercu(cheminForme({ t: "ligne", pts: enCours.pts }));
    apercuGuide(null);
    aide();
    return;
  }
  if (enCours){ termineTrace(false); return; }
  if (!restaure(HIST, REFAIRE)) $("outilsAide").textContent = "Rien à annuler.";
}
function refais(){ restaure(REFAIRE, HIST); }

const trouveCalque = id => mesCalques().find(c => c.id === id);
const nouvelId = () => "d" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

/* --- rendu --- */

/**
 * Le tracé d'une suite de sommets, coins abattus d'un rayon donné.
 *
 * Un relevé de bureau d'études décrit un bâtiment ; un plan de visiteur décrit
 * un lieu. Le second veut des murs francs et des angles doux, là où le premier
 * détaille chaque battant de porte. D'où ce rayon : il tient en mètres, comme
 * le reste du tracé, et suit donc le zoom au lieu de s'épaissir avec lui.
 *
 * Le rayon demandé n'est qu'un maximum. Un angle serré entre deux murs courts
 * n'a pas la place de l'accueillir : la coupe s'arrête alors à la moitié du
 * plus court des deux côtés, et l'arrondi se resserre d'autant. Sans cette
 * limite, deux coins voisins se mangeraient l'un l'autre et le contour se
 * retournerait.
 */
function cheminArrondi(pts, r, ferme){
  const n = pts.length;
  const droit = "M" + pts.map(p => p[0] + " " + p[1]).join("L") + (ferme ? "Z" : "");
  if (!(r > 0) || n < 3) return droit;
  const cm = (x) => +x.toFixed(2);

  /* Les extrémités d'une ligne ouverte restent vives : il n'y a rien à
     raccorder au-delà. */
  const coins = new Array(n).fill(null);
  for (let i = ferme ? 0 : 1; i <= (ferme ? n - 1 : n - 2); i++){
    const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
    const lu = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const lv = Math.hypot(c[0] - b[0], c[1] - b[1]);
    if (!lu || !lv) continue;
    const u = [(a[0] - b[0]) / lu, (a[1] - b[1]) / lu];
    const v = [(c[0] - b[0]) / lv, (c[1] - b[1]) / lv];
    // un sommet aligné ou replié sur lui-même n'a pas d'angle à adoucir
    const theta = Math.acos(Math.max(-1, Math.min(1, u[0] * v[0] + u[1] * v[1])));
    if (theta < .05 || Math.PI - theta < .05) continue;
    const t = Math.min(r / Math.tan(theta / 2), lu / 2, lv / 2);
    // le sens de l'arc suit celui du virage ; l'axe des ordonnées descend,
    // un produit vectoriel positif tourne donc dans le sens des aiguilles
    const sens = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]) > 0 ? 1 : 0;
    coins[i] = { e: [cm(b[0] + u[0] * t), cm(b[1] + u[1] * t)],
                 s: [cm(b[0] + v[0] * t), cm(b[1] + v[1] * t)],
                 r: cm(t * Math.tan(theta / 2)), sens };
  }
  if (coins.every(c => !c)) return droit;

  const point = (p) => p[0] + " " + p[1];
  const depart = ferme && coins[0] ? coins[0].s : pts[0];
  let d = "M" + point(depart);
  for (let k = 1; k <= (ferme ? n : n - 1); k++){
    const co = coins[k % n];
    d += co ? "L" + point(co.e) + "A" + co.r + " " + co.r + " 0 0 " + co.sens + " " + point(co.s)
            : "L" + point(pts[k % n]);
  }
  return d + (ferme ? "Z" : "");
}

/* Rectangle, image, stand dessiné : trois formes que deux coins opposés
   suffisent à tenir. Le tracé, les poignées et le redimensionnement les
   traitent donc ensemble. */
const estCadre = (f) => f.t === "rect" || f.t === "image" || f.t === "stand";

function cheminForme(f){
  if (estCadre(f)){
    const [a, b] = f.pts;
    const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
    const w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    // une image porte son propre cadrage : l'arrondir rognerait le visuel
    if (f.t !== "image" && f.r > 0)
      return cheminArrondi([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], f.r, true);
    return "M" + x + " " + y + "h" + w + "v" + h + "h" + (-w) + "Z";
  }
  return cheminArrondi(f.pts, f.r || 0, f.t !== "ligne");
}
function dessineDessins(){
  const c = $("couches");
  c.querySelectorAll(".dcal").forEach(g => g.remove());
  for (const cal of mesCalques()){
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const role = roleIti(cal);
    g.setAttribute("class", "dcal" + (cal.rempli ? " plein" : "") +
                            (role ? " role " + role : "") +
                            (cal.id === calqueActif && ADMIN ? " editable" : ""));
    g.dataset.dcal = cal.id;
    g.style.color = cal.couleur || "var(--accent)";
    g.style.display = cal.visible === false ? "none" : "";
    g.innerHTML = cal.formes.map(f => f.t === "image"
      // Le clic sur le plan cherche l'ancêtre porteur d'un data-id : une image
      // liée à un stand ouvre donc sa fiche sans code supplémentaire. C'est
      // ainsi qu'on pose le logo d'un exposant sur son emplacement.
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") +
        (f.stand && parId.has(f.stand) ? " lie" : "") + '" data-f="' + f.id + '"' +
        (f.stand && parId.has(f.stand) ? ' data-id="' + esc(f.stand) + '"' : "") +
        '><image href="' + f.src + '" x="' + f.pts[0][0] +
        '" y="' + f.pts[0][1] + '" width="' + (f.pts[1][0] - f.pts[0][0]) +
        '" height="' + (f.pts[1][1] - f.pts[0][1]) +
        '" preserveAspectRatio="xMidYMid meet"/></g>'
      : f.t === "repere"
      ? traceRepere(f)
      : f.t === "stand"
      ? traceStandDessine(f)
      : f.t === "texte"
      ? '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id + '"><text x="' + f.pts[0][0] + '" y="' + f.pts[0][1] +
        '" font-size="' + (f.taille || 2) + '">' + esc(f.txt) + '</text></g>'
      : '<g class="forme' + (f.id === formeSel ? " pick" : "") + '" data-f="' + f.id +
        '"><path d="' + cheminForme(f) + '"/></g>').join("");
    c.appendChild(g);
  }
  ordonneDom();
  cartouchePoi();
  /* Les stands dessinés viennent de renaître : la teinte de leur secteur et le
     fondu du filtre se posent sur des nœuds qui n'existaient pas encore. */
  rafraichitStandsDessines();
}

/* --- conversion écran → repère du plan --- */
function versPlan(clientX, clientY){
  const r = svg.getBoundingClientRect();
  return [ +(view.x + (clientX - r.left) / r.width * view.w).toFixed(2),
           +(view.y + (clientY - r.top) / r.height * view.h).toFixed(2) ];
}

function apercu(d){
  let el = $("apercu");
  if (!d){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.id = "apercu";
    svg.appendChild(el);
  }
  el.setAttribute("d", d);
}

/** Le trait fin qui montre sur quoi le point vient de s'aligner. */
function apercuGuide(d){
  let el = $("apercuGuide");
  if (!d){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.id = "apercuGuide";
    svg.appendChild(el);
  }
  el.setAttribute("d", d);
}

/* ------------------------------------------------------------
   Aide au tracé d'un contour de hall
   ------------------------------------------------------------
   Le fond de plan vient d'un relevé technique : il porte l'épaisseur des
   murs, le battant de chaque porte, le moindre décrochement de poteau. Un
   visiteur n'a que faire de tout cela — il lui faut la silhouette du
   pavillon, franche, pour savoir où il est. On la retrace donc par-dessus,
   et deux choses suffisent à la rendre nette : des segments redressés, et
   des angles adoucis. Les portes disparaissent d'elles-mêmes, puisqu'on ne
   les suit pas.
   ------------------------------------------------------------ */

/** Ce que la main sait viser : douze pixels d'écran, convertis en mètres. */
function toleranceTrace(){
  const r = svg.getBoundingClientRect();
  return r.width ? view.w / r.width * 12 : .3;
}

const aimanteContour = () =>
  !$("contourAimant") || $("contourAimant").checked;

const rayonContour = () => {
  const v = parseFloat($("contourRayon") ? $("contourRayon").value : "");
  return isFinite(v) && v > 0 ? v : 0;
};

/**
 * Le prochain sommet, redressé.
 *
 * Deux corrections, dans cet ordre. La direction d'abord : elle bascule sur
 * le huitième de tour le plus proche, ce qui donne des murs d'équerre et des
 * pans coupés à quarante-cinq degrés sans viser. La longueur ensuite : si le
 * point tombe près de la verticale ou de l'horizontale d'un sommet déjà posé,
 * il s'y accroche. C'est ce second réglage qui fait qu'un contour se referme
 * exactement là où il a commencé, au lieu de laisser un décalage d'un
 * dixième de mètre que le zoom finit toujours par montrer.
 *
 * `guide` reçoit le sommet servi de référence, s'il y en a un : l'appelant en
 * tire le trait qui l'explique.
 */
function redresseTrace(p, pts, guide){
  if (guide) guide.q = null;
  if (!pts.length || !aimanteContour()) return p;
  const tol = toleranceTrace();
  const b = pts[pts.length - 1];
  const dx = p[0] - b[0], dy = p[1] - b[1];
  const l = Math.hypot(dx, dy);
  if (l < 1e-6) return p;
  const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
  const ux = Math.cos(a), uy = Math.sin(a);
  let x = b[0] + ux * l, y = b[1] + uy * l, meilleur = null;
  for (const q of pts){
    /* On cherche la longueur qui met le point sur l'abscisse — ou l'ordonnée
       — du sommet q. Une direction presque parallèle à l'axe visé donnerait
       une longueur démesurée pour un gain nul : on l'écarte. */
    for (const axe of [0, 1]){
      const c = axe ? uy : ux;
      if (Math.abs(c) < .3) continue;
      const l2 = (q[axe] - b[axe]) / c;
      if (l2 < tol) continue;              // derrière soi, ou sur soi
      const px = b[0] + ux * l2, py = b[1] + uy * l2;
      const ecart = Math.hypot(px - x, py - y);
      if (ecart < tol && (!meilleur || ecart < meilleur.ecart))
        meilleur = { x: px, y: py, ecart, q, axe };
    }
  }
  if (meilleur){
    x = meilleur.x; y = meilleur.y;
    if (guide) guide.q = meilleur;
  }
  return [+x.toFixed(2), +y.toFixed(2)];
}

/** Le trait pointillé qui relie le sommet de référence au point accroché. */
function traceGuide(g, p){
  if (!g || !g.q){ apercuGuide(null); return; }
  const q = g.q.q;
  apercuGuide("M" + q[0] + " " + q[1] + "L" + p[0] + " " + p[1]);
}

/** Le contour se referme quand on revient sur son premier sommet. */
function fermeIci(p, pts){
  if (pts.length < 3) return false;
  return Math.hypot(p[0] - pts[0][0], p[1] - pts[0][1]) < toleranceTrace() * 1.5;
}

function ajouteForme(f){
  const c = trouveCalque(calqueActif);
  if (!c) return;
  memorise();
  f.id = nouvelId();
  c.formes.push(f);
  enregistreDessins();
  dessineDessins();
  aide();
  return f.id;
}

 * moyen de nommer deux escaliers sans les déclasser tous les deux.
 *
 * Le type et le libellé sont donc deux choses. Le type porte les propriétés —
 * le pictogramme, l'obstacle en fauteuil, la qualité de porte par où passe un
 * trajet entre pavillons — et se choisit dans une liste. Le libellé ne sert
 * qu'à distinguer un exemplaire d'un autre, et s'écrit librement.
 *
 * Un repère posé avant cette séparation n'a que son libellé : on continue de
 * le deviner pour lui, et son plan s'affiche comme il le faisait. Le type
 * s'écrit dès qu'on y touche.
 */
const TYPES_REPERE = [
  { v: "",             nom: "Sans pictogramme" },
  { v: "entree",       nom: "Entrée/Sortie" },
  { v: "wc",           nom: "WC" },
  { v: "accueil",      nom: "Accueil" },
  { v: "info",         nom: "Information" },
  { v: "restauration", nom: "Restauration" },
  { v: "cafe",         nom: "Café" },
  { v: "vestiaire",    nom: "Vestiaire" },
  { v: "ascenseur",    nom: "Ascenseur" },
  { v: "escalier",     nom: "Escalier" },
  { v: "escalator",    nom: "Escalator" },
  { v: "secours",      nom: "Secours" },
  { v: "pmr",          nom: "Accessibilité" },
  { v: "parking",      nom: "Parking" },
  { v: "distributeur", nom: "Distributeur" },
  { v: "reunion",      nom: "Salle de réunion" },
];
const nomTypeRepere = (v) => (TYPES_REPERE.find(t => t.v === v) || TYPES_REPERE[0]).nom;

/* « Entrée » et « Sortie » ont longtemps fait deux pictogrammes ; ils n'en font
   plus qu'un, une porte de hall étant les deux à la fois. */
const PICTO_ALIAS = { sortie: "entree" };

/**
 * Le type d'un repère : celui qu'on lui a donné, ou celui que son libellé
 * laisse deviner s'il est d'avant la séparation. Une chaîne vide est un choix
 * — « sans pictogramme » — et non une absence : elle ne se redevine pas.
 */
function pictoForme(f){
  const p = f.picto === undefined ? pictoDe(f.txt) : f.picto;
  return PICTO_ALIAS[p] || p;
}

/* Taille de naissance d'un repère, en mètres. Un texte libre en fait deux ;
   un repère doit se repérer de loin, sans qu'on le cherche. */
const TAILLE_REPERE = 4;

/**
 * Un repère : une pastille dans la couleur du calque, son libellé dedans.
 *
 * La largeur suit le texte, mesurée dans la police de rendu — une pastille
 * taillée au jugé serait trop courte sur « Restauration » et trop longue sur
 * « WC ». Tout est en mètres, comme le reste du plan : le repère grandit donc
 * avec le zoom, à l'inverse d'une épingle d'interface.
 */
function traceRepere(f){
  const t = f.taille || 2;
  /* Le repère répond au clic comme un stand : le plan ne montre plus que le
     pictogramme, et c'est la fiche qui dit son nom. Le rôle et le libellé
     partent avec lui, pour qui lit le plan au clavier ou à la synthèse
     vocale. */
  const dit = String(f.txt || "").trim();
  const type = pictoForme(f);
  const nom = dit || (type ? nomTypeRepere(type) : "Repère");
  const tete = '<g class="forme repere' + (f.id === formeSel ? " pick" : "") +
               '" data-f="' + f.id + '" data-poi="' + esc(f.id) +
               '" tabindex="0" role="button" aria-label="' +
               esc(nom + (type && dit ? " — " + nomTypeRepere(type) : "")) + '">';

  /* Un pictogramme se pose dans un <svg> imbriqué : il porte sa propre grille,
     et le navigateur se charge du cadrage — plus sûr qu'une transformation
     calculée à la main. */
  const g = PICTOS[type];
  if (g){
    /* La pastille ne porte que le pictogramme.
     *
     * Le libellé s'écrivait à côté dès qu'il disait autre chose que lui —
     * « Entrée Nord » avait besoin de son nord. Mais un nom écrit à la taille
     * du plan ne se lit qu'en zoomant, et la pastille s'allongeait de tout ce
     * texte en travers de l'allée qu'elle désigne. Le pictogramme dit ce que
     * c'est, ce qui est la question qu'on se pose de loin ; le nom se demande
     * de près, et c'est la fiche qui le donne. Le cartouche des points
     * d'intérêt, lui, continue de les nommer tous.
     */
    const cote = t * 2.4, m = cote * .15, k = cote - 2 * m;
    const x = f.pts[0][0] - cote / 2, y = f.pts[0][1] - cote / 2;
    return tete +
      '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + cote.toFixed(2) +
      '" height="' + cote.toFixed(2) + '" rx="' + (cote * .2).toFixed(2) + '"/>' +
      '<svg class="glyphe" x="' + (x + m).toFixed(2) + '" y="' + (y + m).toFixed(2) +
      '" width="' + k.toFixed(2) + '" height="' + k.toFixed(2) +
      '" viewBox="' + g.vb + '">' + g.d + '</svg></g>';
  }

  /* Sans pictogramme, le libellé est tout ce que le repère a à montrer : le
     retirer laisserait une pastille muette. */
  const l = largeur(nom, P_NOM) * t;
  const w = l + t * 1.1, ht = t * 1.65;
  const x = f.pts[0][0] - w / 2, y = f.pts[0][1] - ht / 2;
  return tete +
    '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) +
    '" height="' + ht.toFixed(2) + '" rx="' + (ht / 2).toFixed(2) + '"/>' +
    '<text x="' + f.pts[0][0] + '" y="' + (f.pts[0][1] + t * .35).toFixed(2) +
    '" font-size="' + t.toFixed(2) + '">' + esc(nom) + '</text></g>';
}

/* ------------------------------------------------------------
   Les stands dessinés à la main
   ------------------------------------------------------------
   La synchronisation ne rend qu'une forme par dossier : un stand loué à
   plusieurs n'en a donc qu'une, et les sociétés qui s'y installent n'existent
   que dans une liste. Sur le plan elles ne sont nulle part, et le visiteur qui
   cherche l'une d'elles lit le nom d'une autre peint sur la cloison.

   L'exploitant les matérialise donc lui-même : il découpe le stand en autant
   de rectangles qu'il y a d'enseignes, et rattache chacun à la société qu'il
   désigne. Ce n'est pas un dessin de plus — la forme se lit comme un stand,
   même aplat et même libellé, s'ouvre au clic sur la fiche complète de sa
   société, et renvoie l'itinéraire vers le stand qui la porte : on ne marche
   pas jusqu'à un co-exposant, on marche jusqu'à son hôte.
   ------------------------------------------------------------ */

/** L'étiquette sous laquelle une société se désigne : « G55 — SMC2 ». */
const etiquetteSociete = (code, nom) => [code, nom].filter(Boolean).join(" — ");

/** Le nom d'une société tel qu'il s'écrit sur le plan — vide s'il n'y en a
 *  pas, là où la fiche se rabat sur « Sans nom ». */
const nomSurLePlan = (soc) => soc.nom || soc.plan || "";

/**
 * Ce qu'un stand dessiné désigne : l'emplacement, le rang de la société, la
 * société elle-même. Rien, si le lien ne mène plus nulle part — un stand
 * disparu du salon, un co-exposant que la synchronisation d'hier a retiré.
 *
 * On ne se rabat pas alors sur le titulaire : ce serait donner à une enseigne
 * la place d'une autre. La forme reste sur le plan, muette et sans clic, et le
 * panneau d'édition invite à la rattacher de nouveau.
 */
function societeDeForme(f){
  if (!f || f.t !== "stand" || !f.stand) return null;
  const o = parId.get(f.stand);
  if (!o || o.kind !== "stand") return null;
  const i = Number.isInteger(f.soc) ? f.soc : -1;
  const soc = i < 0 ? o : (o.coex || [])[i];
  return soc ? { o: o, i: i, soc: soc } : null;
}

/** Les sociétés du pavillon courant, titulaires et hébergées mêlées : c'est
 *  parmi elles que se choisit ce qu'un stand dessiné matérialise. */
function societesDuPlan(){
  const out = [];
  P().stands.forEach(s => societes(s).forEach(x => {
    const nom = nomSurLePlan(x.soc);
    if (!s.code && !nom) return;
    out.push({ o: s, i: x.i, soc: x.soc,
               etiquette: etiquetteSociete(s.code, nom) || s.id });
  }));
  return out;
}

function remplitListeSocietes(){
  const l = $("listeSoc");
  if (!l) return;
  l.innerHTML = societesDuPlan()
    .map(x => '<option value="' + esc(x.etiquette) + '">').join("");
}

/** Retrouve la société désignée par ce qui a été saisi. */
function societeSaisie(txt){
  const v = String(txt || "").trim().toLowerCase();
  if (!v) return null;
  const l = societesDuPlan();
  return l.find(x => x.etiquette.toLowerCase() === v)
      || l.find(x => nomSurLePlan(x.soc).toLowerCase() === v)
      || null;
}

/**
 * Un stand dessiné, tracé comme le stand qu'il découpe.
 *
 * Il porte l'identifiant de son hôte et le rang de la société qu'on vient y
 * voir : le reste de la page n'a alors rien de nouveau à apprendre — le clic,
 * la sélection, la fiche et l'itinéraire lisent déjà ces deux-là.
 */
function traceStandDessine(f){
  const l = societeDeForme(f);
  const sel = l && l.o.id === state.sel && l.i === state.selSoc;
  const nom = l ? nomSurLePlan(l.soc) : "";
  return '<g class="forme sdes' + (f.id === formeSel ? " pick" : "") +
    (l ? " lie" : "") + (sel ? " sel" : "") + '" data-f="' + f.id + '"' +
    (l ? ' data-id="' + esc(l.o.id) + '" data-soc="' + l.i +
         '" tabindex="0" role="button" aria-label="' +
         esc(nom || ("Stand " + (l.o.code || "")).trim()) + '"' : "") +
    '><path d="' + cheminForme(f) + '"/><g class="lab"></g></g>';
}

/**
 * Le libellé d'un stand dessiné : le nom de sa société, le numéro de
 * l'emplacement dessous — exactement ce qu'un stand du plan écrit.
 *
 * Il vit dans la forme et non dans « #labels », où vivent ceux du plan. Un
 * calque de dessin peut être empilé par-dessus le calque des textes, et son
 * aplat recouvrait alors le nom qu'il était censé porter. Attaché à sa forme,
 * le libellé la suit jusque dans l'ordre des couches.
 *
 * Il se relit à chaque changement de vue, comme les autres : c'est la taille
 * du texte à l'écran qui décide s'il est lisible ou s'il vaut mieux se taire.
 */
function texteStandDessine(f, pxParM){
  const l = societeDeForme(f);
  if (!l) return "";
  const nom = nomSurLePlan(l.soc);
  if (!nom && !l.o.code) return "";
  const b = boite(f);
  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  const sel = l.o.id === state.sel && l.i === state.selSoc;
  if (!sel && (!visibleSociete(l.o, l.i) ||
               cx < view.x - 25 || cx > view.x + view.w + 25 ||
               cy < view.y - 25 || cy > view.y + view.h + 25)) return "";
  return libelleEmplacement({ nom: nom, code: l.o.code }, [cx, cy],
                            b[2] - b[0], b[3] - b[1], sel, pxParM);
}

/** Les libellés de tous les stands dessinés du pavillon, posés dans leurs
 *  formes. Le pavillon en compte quelques dizaines au plus : on les relit
 *  tous plutôt que de tenir à jour ce qui a bougé. */
function poseLibellesDessines(pxParM){
  const z = $("couches");
  for (const cal of mesCalques()){
    for (const f of cal.formes){
      if (f.t !== "stand") continue;
      const lab = z.querySelector('.sdes[data-f="' + CSS.escape(f.id) + '"] .lab');
      if (lab) lab.innerHTML = texteStandDessine(f, pxParM);
    }
  }
}

/**
 * Le découpage qui matérialise une société sur un emplacement, s'il a été
 * dessiné.
 *
 * Un stand dessiné porte l'identifiant de son hôte : c'est ce qui lui donne le
 * clic, la fiche et l'itinéraire sans rien apprendre de neuf au reste de la
 * page. Mais quand deux enseignes se partagent un emplacement, allumer l'hôte
 * allumerait du même coup la voisine, qu'on n'a pas demandée. La sélection
 * s'arrête donc au découpage dès qu'il en existe un pour la société choisie.
 */
function decoupeStand(id, iSoc){
  const z = (id === null || id === undefined) ? null : $("couches");
  return (z && z.querySelector('.dcal .sdes[data-id="' + CSS.escape(String(id)) +
                               '"][data-soc="' + Number(iSoc) + '"]')) || null;
}

/**
 * La sélection des stands dessinés, posée sans retracer les calques : relire
 * un calque réanalyse ses images, ce qui est cher pour un liseré qui change à
 * chaque clic. La classe se pose donc à la main, comme le fait déjà la
 * sélection d'édition.
 */
function marqueStandsDessines(){
  $("couches").querySelectorAll(".dcal .sdes").forEach(g => {
    g.classList.toggle("sel", g.dataset.id === state.sel &&
                              Number(g.dataset.soc) === state.selSoc);
  });
}

/**
 * Ce qu'un stand dessiné reçoit une fois tracé : la teinte de son secteur, le
 * fondu que le filtre pose sur ce qu'il écarte, et son libellé.
 *
 * Rien de tout cela ne tient dans le gabarit de la forme : les deux premiers
 * se lisent dans les réglages du salon, le troisième dans la vue courante — et
 * le premier montage a lieu avant qu'il y en ait une.
 */
function rafraichitStandsDessines(){
  if (!DATA || !view) return;
  coloreSecteurs();
  $("couches").querySelectorAll(".dcal .sdes[data-id]").forEach(g => {
    const o = parId.get(g.dataset.id);
    g.classList.toggle("dim", !!o && !visibleSociete(o, Number(g.dataset.soc)));
  });
  const r = svg.getBoundingClientRect();
  poseLibellesDessines((r.width || 1) / view.w);
}

/**
 * Cartouche des points d'intérêt.
 *
 * Les repères posés sur un plan se répètent — plusieurs sanitaires, plusieurs
 * entrées — et se cherchent à l'œil. Le cartouche les récapitule par libellé ;
 * en choisir un met en avant tous ceux qui le portent, où qu'ils soient.
 */
let poiChoisi = null;

function cartouchePoi(){
  const z = $("poi");
  if (!z) return;
  const parNom = new Map();
  for (const cal of mesCalques()){
    if (cal.visible === false) continue;
    for (const f of cal.formes){
      if (f.t !== "repere" || !f.txt) continue;
      const cle = f.txt.trim();
      if (!parNom.has(cle)) parNom.set(cle, { n: 0, picto: pictoForme(f) });
      parNom.get(cle).n++;
    }
  }
  z.hidden = parNom.size === 0;
  if (z.hidden){ poiChoisi = null; eclairePoi(); mesureCartouche(); return; }

  z.innerHTML = "";
  [...parNom.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "fr"))
    .forEach(([nom, o]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "poiBtn";
      b.setAttribute("aria-pressed", nom === poiChoisi);
      const g = PICTOS[o.picto];
      // largeur et hauteur en attributs : un <svg> sans dimension explicite
      // s'étale à la place disponible, et le cartouche y perdait sa mise en page
      b.innerHTML = (g
        ? '<svg class="poiPicto" width="17" height="17" viewBox="' + g.vb +
          '" aria-hidden="true">' + g.d + '</svg>'
        : "") + '<span></span>' + (o.n > 1 ? '<i>' + o.n + '</i>' : "");
      b.querySelector("span").textContent = nom;
      b.onclick = () => {
        const choisit = poiChoisi !== nom;
        poiChoisi = choisit ? nom : null;
        /* Les repères d'un même type sont dispersés dans le hall. Les mettre
           en avant sans reculer ne montrerait que ceux déjà à l'écran, et
           l'exploitant conclurait qu'il n'y en a pas d'autres. On revient donc
           sur le plan entier, où ils se comptent d'un coup d'œil. */
        if (choisit) fit();
        cartouchePoi();
      };
      z.appendChild(b);
    });
  eclairePoi();
  mesureCartouche();
}

/**
 * La fiche d'un repère.
 *
 * Le plan ne montre plus que le pictogramme ; le nom n'est pas perdu pour
 * autant, il est ce que le clic donne — comme une forme de stand donne la
 * fiche de son exposant. On y lit ce que le repère est, comment il s'appelle,
 * et, quand c'est un passage, ce qu'il dessert : un escalier qui monte à deux
 * étages le dit ici, et nulle part ailleurs.
 *
 * La fiche est celle des stands, remplie autrement : elle partage la même
 * bande que le parcours et l'itinéraire, et deux fiches ouvertes en même
 * temps ne se liraient pas.
 */
function ouvrePoi(id, rect){
  const cible = formeParId(id);
  if (!cible || cible.f.t !== "repere") return;
  const f = cible.f, p = P();
  fermeParcours(); fermeItineraire();

  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  const noeudPoi = $("couches").querySelector('.repere[data-poi="' + CSS.escape(id) + '"]');
  if (noeudPoi) noeudPoi.classList.add("sel");

  const type = pictoForme(f);
  const dit = String(f.txt || "").trim();
  $("dKind").hidden = false;
  $("dKind").textContent = type ? nomTypeRepere(type) : "Repère";
  $("dName").textContent = dit || (type ? nomTypeRepere(type) : "Repère");
  $("dCode").textContent = p.libelle;
  $("dNeuf").hidden = true;
  $("dPartage").hidden = true;
  /* Un repère ne se retient pas dans un parcours : on ne visite pas un
     escalier, on le prend. */
  const sig = $("dMarque");
  sig.hidden = true;
  delete sig.dataset.mg; delete sig.dataset.mi;
  if ($("dRen")) $("dRen").hidden = true;
  $("dOnglets").hidden = true;
  $("detail").classList.remove("deux");
  onglet("detail");

  /* Ce qu'un passage dessert, avec le temps qu'il demande : c'est ce qui
     distingue deux escaliers voisins, et ce qu'un visiteur cherche à savoir
     avant de s'y engager. */
  const liens = typeLiaison(f) ? liensDe(f) : [];
  const dessert = liens.length
    ? '<div class="field"><span class="eyebrow">Mène à</span><span class="v">' +
      liens.map(x => '<span class="ligne">' +
        esc(x.o.p.libelle + " · " + nomRepere(x.o.f)) + " — " +
        esc(ecritMinutes(x.min == null ? typeLiaison(f).min : x.min)) +
        '</span>').join("") + "</span></div>"
    : "";

  $("dBody").innerHTML = '<div class="cInfos" id="dPaneInfos">' + dessert + "</div>" +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  $("dGo").onclick = () => centrePoint(f.pts[0]);
  // « j'y vais » : l'arrivée est ce repère, le départ reste à dire
  $("dItin").onclick = () => versItineraireDe(pointRepere(f, p));

  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  anime(rect, 1);
}

/**
 * Hauteur du cartouche, donnée au CSS.
 *
 * Sur un écran étroit le cartouche est assez large pour recouvrir l'échelle,
 * qui vit dans le même coin bas. Le commentaire de la feuille de style
 * affirmait qu'il « se retire de l'échelle » : c'était vrai sur un grand
 * écran, où il n'atteignait pas la marge gauche. À 412 pixels il la traverse.
 * L'échelle se pose donc au-dessus de lui, d'après sa hauteur réelle — nulle
 * quand il est absent, auquel cas rien ne bouge.
 */
function mesureCartouche(){
  const z = $("poi");
  const h = z && !z.hidden ? z.offsetHeight + 8 : 0;
  document.documentElement.style.setProperty("--cartouche", h + "px");
}

/** Met en avant les repères du type choisi. */
function eclairePoi(){
  $("couches").querySelectorAll(".dcal .repere").forEach(g => {
    const f = formeParId(g.dataset.f);
    const on = poiChoisi && f && String(f.f.txt || "").trim() === poiChoisi;
    g.classList.toggle("phare", !!on);
  });
  racine.classList.toggle("poi-actif", !!poiChoisi);
}

/* Un bref halo, réservé à l'image posée automatiquement : sans lui on la
   cherche, et on croit qu'il reste un bouton à valider. */
function signale(id){
  const g = $("couches").querySelector('.forme[data-f="' + CSS.escape(id) + '"]');
  if (!g || REDUIT) return;
  g.classList.add("neuve");
  setTimeout(() => g.classList.remove("neuve"), 1300);
}

/* --- import d'image ---
   L'image est réduite et convertie en data-URI : une page publiée ne peut
   charger aucune ressource externe, tout doit vivre dans le document.   */
let imageEnAttente = null;
const MAX_PX = 1400;

/* On ne refuse plus une image faute de calque actif : on en ouvre un. */
function calquePourImage(){
  if (calqueActif && trouveCalque(calqueActif)) return trouveCalque(calqueActif);
  const l = mesCalques();
  if (l.length){ activeCalque(l[l.length - 1].id); return trouveCalque(calqueActif); }
  memorise();
  const c = { id: nouvelId(), nom: "Images", couleur: "#2F49D1",
              rempli: false, visible: true, formes: [] };
  l.push(c); enregistreDessins(); construitPanneau(); activeCalque(c.id);
  return c;
}

/* Pose l'image autour d'un point, à une taille lisible au zoom courant.
   Plus besoin de tracer un cadre : on ajuste ensuite si besoin. */
function poseImage(centre){
  if (!imageEnAttente) return;
  calquePourImage();
  const l = Math.max(4, view.w * .28);
  const ht = l / imageEnAttente.ratio;
  const c = centre || [view.x + view.w / 2, view.y + view.h / 2];
  const id = ajouteForme({ t: "image", src: imageEnAttente.src,
    pts: [[+(c[0] - l / 2).toFixed(2), +(c[1] - ht / 2).toFixed(2)],
          [+(c[0] + l / 2).toFixed(2), +(c[1] + ht / 2).toFixed(2)]] });
  signale(id);   // l'emplacement n'a pas été choisi : il faut le montrer
  $("outilsAide").textContent = "Image posée au centre de la vue. Glissez sur le plan pour en poser une autre.";
}

function importeImage(fichier, centre){
  if (!fichier || fichier.type.indexOf("image/") !== 0) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const type = fichier.type === "image/jpeg" ? "image/jpeg" : "image/webp";
      imageEnAttente = { src: c.toDataURL(type, .85), ratio: img.width / img.height };
      const v = $("vignette");
      v.innerHTML = '<img alt=""><span></span>';
      v.querySelector("img").src = imageEnAttente.src;
      v.querySelector("span").textContent =
        Math.round(imageEnAttente.src.length / 1365) + " Ko";
      v.dataset.prete = "1";
      choisitOutil("image");
      poseImage(centre);
    };
    img.onerror = () => { $("outilsAide").textContent = "Image illisible."; };
    img.src = fr.result;
  };
  fr.readAsDataURL(fichier);
}
