     sans stands. */
  const montree = n => { const g = $(n); return !g || g.style.display !== "none"; };
  const vu = { stands: montree("stands"), zones: montree("zones") };
  let parc = "", sel = "";
  document.querySelectorAll("#stands > g, #zones > g").forEach(g => {
    if (!vu[g.parentNode.id]) return;
    const p = g.querySelector("path");
    if (!p) return;
    /* Une zone garde son trait discontinu jusque dans sa sélection — c'est ce
       qui la distingue d'un stand. Le parcours, lui, se veut continu partout :
       il dit qu'on a retenu l'endroit, pas ce qu'il est. */
    const d = ' d="' + p.getAttribute("d") + '"/>';
    if (g.classList.contains("enparcours")) parc += '<path class="parc"' + d;
    if (g.classList.contains("sel"))
      sel += '<path class="sel' + (g.parentNode.id === "zones" ? " zn" : "") + '"' + d;
  });
  // la sélection en dernier : c'est elle qu'on vient de désigner
  calqueMarques().innerHTML = parc + sel;
}

/**
 * Ce qu'un visiteur a retenu, marqué sur le plan.
 *
 * Une zone y entre par les conférences qu'elle abrite : c'est là qu'il faudra
 * se rendre à l'heure dite, la conférence n'ayant pas de forme propre.
 */
function marqueParcours(){
  if (!DATA) return;
  const zones = new Set();
  PARCOURS.confs.forEach(id => {
    const c = CONFS.get(id);
    if (c && c.zone) zones.add(String(c.zone));
  });
  document.querySelectorAll("#stands > g, #zones > g").forEach(g => {
    g.classList.toggle("enparcours",
      PARCOURS.stands.indexOf(g.dataset.id) >= 0 || zones.has(g.dataset.id));
  });
  dessineMarques();
}

function rafraichitParcours(){
  const n = PARCOURS.stands.length + PARCOURS.confs.length;
  const c = $("nParcours");
  if (c){ c.textContent = n; c.hidden = n === 0; }
  /* Rien à organiser tant que rien n'est retenu : le bouton reste, éteint,
     plutôt que d'apparaître au premier signet — sa présence dit ce à quoi la
     liste servira. */
  const org = $("btnJournee");
  if (org) org.disabled = n === 0;
  /* Une journée calculée sur une autre liste ne vaut plus : on ne la refait
     pas dans le dos du visiteur, on le lui dit. */
  perimeJournee();
  marqueParcours();
  /* Une même conférence se voit à deux endroits — le programme de sa zone et
     sa propre fiche — et le tiroir en montre une troisième. Toutes les marques
     affichées doivent dire la même chose, d'où qu'on ait touché. */
  document.querySelectorAll("[data-mg]").forEach(rafraichitMarque);
  if ($("parcours").classList.contains("open")) remplitParcours();
}

/* ------------------------------------------------------------
   Le tiroir
   ------------------------------------------------------------ */
/** De quoi ranger deux conférences dans l'ordre où on les vivra. */
function instantConf(c){
  const fz = DATA.fuseau;
  return momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
}
const cleTemps = c => {
  const d = instantConf(c);
  // sans heure lisible, la conférence se range en fin de liste plutôt que de
  // s'intercaler n'importe où
  return d ? d.cle + d.h + d.min : "999999999999";
};
const jourCourt = d => d
  ? JOURS[new Date(d.an, d.mois - 1, d.jour).getDay()] + " " + d.jour + " " + MOIS[d.mois - 1]
  : "";

function rangParcours(hote, r){
  const d = document.createElement("div");
  d.className = "pRang";
  d.innerHTML = '<button type="button" class="pOuvre">' +
    (r.dessus ? '<span class="ps"></span><span class="pt"></span>'
              : '<span class="pt"></span><span class="ps"></span>') +
    '</button><button type="button" class="pOte" title="Retirer du parcours" ' +
    'aria-label="Retirer du parcours">&times;</button>';
  d.querySelector(".pt").textContent = r.titre;
  d.querySelector(".ps").textContent = r.detail || "";
  if (r.couleur) d.querySelector(".pOuvre").style.setProperty("--tc", r.couleur);
  d.querySelector(".pOuvre").onclick = r.ouvre;
  d.querySelector(".pOte").onclick = () => basculeParcours(r.genre, r.id);
  hote.appendChild(d);
}

function groupeParcours(hote, titre){
  const g = document.createElement("div");
  g.className = "pGroupe";
  g.innerHTML = '<span class="eyebrow"></span>';
  g.querySelector(".eyebrow").textContent = titre;
  hote.appendChild(g);
  return g;
}

function remplitParcours(){
  const hote = $("pCorps");
  hote.innerHTML = "";
  const stands = PARCOURS.stands.map(id => parId.get(id)).filter(Boolean);
  const confs = PARCOURS.confs.map(id => CONFS.get(id)).filter(Boolean)
    .sort((a, b) => cleTemps(a).localeCompare(cleTemps(b)));

  const pluriel = (n, mot) => n + " " + mot + (n > 1 ? "s" : "");
  $("pResume").textContent = stands.length + confs.length
    ? [stands.length ? pluriel(stands.length, "exposant") : "",
       confs.length ? pluriel(confs.length, "conférence") : ""].filter(Boolean).join(" · ")
    : "rien pour l'instant";
  $("videParcours").hidden = !(stands.length + confs.length);

  if (!stands.length && !confs.length){
    const v = document.createElement("p");
    v.className = "pVide";
    v.textContent = "Ouvrez la fiche d'un exposant, ou le programme d'une zone, " +
      "et touchez le signet pour l'ajouter ici. Votre parcours reste sur cet " +
      "appareil et vous y retrouverez tout à votre prochaine visite.";
    hote.appendChild(v);
    return;
  }

  /* Les conférences d'abord : elles ont une heure, et c'est autour d'elles que
     le reste de la journée se range. */
  if (confs.length){
    const g = groupeParcours(hote, "Conférences");
    let jour = null;
    confs.forEach(c => {
      const d = instantConf(c);
      const f = momentLocal(c.finLocal, DATA.fuseau) || momentLocal(c.fin, DATA.fuseau);
      if (d && d.cle !== jour){
        jour = d.cle;
        const t = document.createElement("div");
        t.className = "jour";
        t.textContent = jourCourt(d);
        g.appendChild(t);
      }
      rangParcours(g, {
        genre: "conf", id: c.id, couleur: c.couleur, dessus: true,
        titre: c.nom,
        detail: (d ? d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "") : "") +
                (c.salle ? " · " + c.salle : ""),
        ouvre: () => ficheConf(c.id, "parcours"),
      });
    });
  }

  if (stands.length){
    const g = groupeParcours(hote, "Exposants");
    stands.forEach(o => rangParcours(g, {
      genre: "stand", id: o.id, dessus: false,
      titre: o.nom || o.plan || ("Stand " + (o.code || "")).trim(),
      detail: DATA.plans[o.p].libelle + (o.code ? " · " + o.code : ""),
      // choisir un rang, c'est vouloir le voir sur le plan : la fiche s'ouvre
      // et le tiroir se retire, puisqu'ils occupent la même bande
      ouvre: () => select(o.id, true, "parcours"),
    }));
  }
}

function ouvreParcours(){
  // la fiche et l'itinéraire occupent la même bande : ils cèdent la place
  // plutôt que de s'y superposer
  if ($("detail").classList.contains("open")) ferme();
  fermeItineraire();
  remplitParcours();
  /* Le tiroir se rouvre sur ce qu'on y regardait : consulter une fiche depuis
     la journée organisée ne doit pas la faire disparaître. */
  appliqueVueParcours();
  $("parcours").classList.add("open");
  $("btnParcours").setAttribute("aria-pressed", "true");
}
function fermeParcours(){
  const t = $("parcours");
  if (!t || !t.classList.contains("open")) return;
  t.classList.remove("open");
  $("btnParcours").setAttribute("aria-pressed", "false");
}

$("btnParcours").onclick = () =>
  $("parcours").classList.contains("open") ? fermeParcours() : ouvreParcours();
$("closeParcours").onclick = fermeParcours;
$("videParcours").onclick = () => confirme("Vider le parcours",
  "Les exposants et les conférences retenus seront oubliés. Ils ne sont " +
  "enregistrés que sur cet appareil : rien ne permettra de les retrouver.",
  "Vider",
  () => {
    PARCOURS = { stands: [], confs: [] };
    /* La journée n'était que cette liste, mise en heures : elle s'en va avec
       elle, et son tracé avec elle — mais pas un itinéraire demandé à côté,
       qui ne doit rien au parcours. */
    if (JOURNEE && TRACE === JOURNEE.dessin){
      TRACE = null;
      dessineItineraire();
    }
    JOURNEE = null; vueJournee = false;
    enregistreParcours();
    appliqueVueParcours();
  });

/* Échap ferme d'abord ce qui est au-dessus : une fenêtre modale se referme sur
   le tiroir, pas avec lui. */
addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modale").classList.contains("open")) fermeParcours();
});
/* ============================================================
   11 ter. Itinéraire — d'un point du salon à un autre
   ============================================================ */
/**
 * Un visiteur cherche le G77 ; il est devant le E10 et n'a aucune idée du
 * chemin. Son téléphone ne l'aidera pas : sous une charpente métallique le
 * GPS ne situe rien, et poser des balises dans les allées demanderait un
 * budget et une pose que personne n'a. On ne lui demande donc pas où il est —
 * il désigne son départ comme il désigne son arrivée, dans la même liste que
 * la recherche.
 *
 * Reste à trouver le chemin. Les données ne décrivent aucune allée : elles ne
 * donnent que des emplacements. L'allée, c'est ce qui reste — le vide entre
 * les stands. On la calcule donc en creux : le hall est pavé de cases d'un
 * demi-mètre, on noircit ce que les stands occupent, et on cherche la suite
 * de cases blanches la plus courte entre deux points.
 *
 * Ce détour par la grille a un mérite qui vaut à lui seul le calcul : le mode
 * PMR y devient presque gratuit. Un escalier, une pente, un passage trop
 * étroit se noircissent comme un stand, et la même recherche rend un autre
 * chemin — ou dit franchement qu'il n'y en a pas.
 */

/* Un demi-mètre par case : plus fin, la grille d'un pavillon dépasse le
   million de cases pour un tracé qui ne change plus ; plus grossier, une
   allée de deux mètres se referme. */
const PAS_GRILLE = .5;

/* Ce qu'on écarte des stands. Le chemin est calculé pour un point sans
   épaisseur : on épaissit donc les obstacles de la moitié du passage
   nécessaire. Quatre-vingt-dix centimètres pour un marcheur ; un mètre
   quarante en mode accessible, la largeur qu'exige un fauteuil roulant pour
   circuler et se croiser. Un couloir plus étroit disparaît de la grille, et
   le trajet passe ailleurs — c'est l'essentiel de ce que « PMR » change. */
const DEGAGEMENT = .45;
const DEGAGEMENT_PMR = .70;

/* Allure de salon, arrêts non compris : on marche moins vite entre deux
   allées pleines que sur un trottoir. */
const ALLURE = 1.1;        // m/s
const ALLURE_PMR = .8;

/**
 * Ce que coûte un virage, en cases.
 *
 * Entre deux points d'une allée, une grille offre des milliers de chemins de
 * même longueur : tout escalier de marches horizontales et verticales vaut la
 * diagonale qu'il approche. Sans prix du virage, A* en choisit un au hasard,
 * et le trajet traverse l'allée en biais au lieu de la suivre. À quatre cases
 * — deux mètres — un crochet ne se justifie plus que s'il fait gagner
 * davantage, et les tronçons redeviennent de longues lignes droites.
 */
const TOURNANT = 4;

/**
 * De quoi préférer le milieu de l'allée à ses bords.
 *
 * La pénalité s'éteint à deux mètres du mur le plus proche : au-delà — dans
 * une aire dégagée, une entrée, un carrefour — aucun « milieu » n'a de sens,
 * et vouloir le tenir ferait faire des détours pour rien.
 */
const PORTEE_CENTRE = 4;   // cases
/* Deux plutôt qu'une demie. Le prix du virage est de quatre cases : passer du
   bord au milieu en coûte deux, et il faut donc que la traversée se rembourse
   sur une longueur raisonnable d'allée. À une demie, l'écart entre le bord et
   le milieu valait un quart de case, soit seize mètres de ligne droite avant
   d'être rentable — le trait longeait les stands d'un bout à l'autre du hall.
   À deux, quatre mètres suffisent. */
const POIDS_CENTRE = 2;

/* ------------------------------------------------------------
   L'enveloppe du hall
   ------------------------------------------------------------ */
/**
 * L'emprise d'un pavillon est une boîte : elle déborde d'une douzaine de
 * mètres autour des stands, et rien n'y empêcherait un trajet de contourner
 * le hall par l'extérieur — derrière les stands de périphérie, là où il n'y a
 * que le mur. On borne donc la marche à l'enveloppe convexe des emplacements
 * eux-mêmes : les stands du pourtour en dessinent le bord, et on ne passe
 * plus derrière eux.
 *
 * Le fond de plan porterait les vrais murs, mais mêlés aux cotes, aux
 * hachures et au mobilier : les lire découperait le hall en morceaux au lieu
 * de le fermer.
 */
function sommets(o){
  const n = String(o.d).match(/-?\d*\.?\d+/g) || [];
  const l = [];
  for (let i = 0; i + 1 < n.length; i += 2) l.push([+n[i], +n[i + 1]]);
  return l;
}

/** Enveloppe convexe, parcours monotone d'Andrew. */
const ENVELOPPES = new Map();
function enveloppe(p){
  const garde = ENVELOPPES.get(p.id);
  if (garde) return garde;
  const pts = [];
  for (const o of p.stands) pts.push(...sommets(o));
  for (const o of p.zones) pts.push(...sommets(o));
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cote = (suite) => {
    const r = [];
    for (const q of suite){
      while (r.length > 1){
        const a = r[r.length - 2], b = r[r.length - 1];
        if ((b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]) > 0) break;
        r.pop();
      }
      r.push(q);
    }
    r.pop();
    return r;
  };
  let bord = pts.length < 3 ? [] : cote(pts).concat(cote(pts.slice().reverse()));
  /* Un pavillon sans emplacement — cela existe, le temps d'une première
     synchronisation — n'a pas d'enveloppe : on retombe sur son emprise, à
     défaut de mieux. */
  if (bord.length < 3){
    const e = p.emprise;
    bord = [[e.x0, e.y0], [e.x1, e.y0], [e.x1, e.y1], [e.x0, e.y1]];
  }
  const t = new Path2D();
  bord.forEach((q, i) => i ? t.lineTo(q[0], q[1]) : t.moveTo(q[0], q[1]));
  t.closePath();
  ENVELOPPES.set(p.id, t);
  return t;
}

/* ------------------------------------------------------------
   La grille de marche
   ------------------------------------------------------------ */
/* Une grille par pavillon et par mode : elle ne dépend que des emplacements
   et des obstacles dessinés, qui ne bougent qu'en administration. */
const GRILLES = new Map();
/* Les distances de marche et les façades s'en déduisent : ce qui périme l'une
   périme les autres. */
function oublieGrilles(){ GRILLES.clear(); BALAYAGES.clear(); ANGLES.clear(); oublieFaces(); }

/** Les calques de dessin d'un pavillon quelconque, pas seulement l'affiché. */
const calquesDe = (p) => (typeof DESSINS === "object" && DESSINS[p.id]) || [];

/** Les repères posés sur les calques montrés d'un pavillon.
 *  Un calque masqué ne compte pas : le trajet doit s'expliquer par ce qu'on
 *  voit, et contourner un obstacle invisible passerait pour un bogue. */
function reperesDe(p){
  const l = [];
  for (const c of calquesDe(p)){
    if (c.visible === false) continue;
    for (const f of c.formes || []) if (f.t === "repere" && f.txt) l.push(f);
  }
  return l;
}

/* ------------------------------------------------------------
   Ce que l'exploitant déclare : où l'on marche, ce qui barre
   ------------------------------------------------------------ */
/**
 * Un bloc sanitaire, un local technique, une estrade : rien de cela n'est un
 * stand, et rien n'en ressort des données. Cela vit dans le fond de plan, que
 * le calcul ignore — d'où des trajets qui traversaient les WC.
 *
 * On a d'abord voulu lire ce fond. Il est bien rangé en sous-calques nommés —
 * « 5-SANITAIRES », « INFOPRO_SURFACE_POTEAUX » — mais ces noms sont ceux du
 * bureau d'études qui a produit le DWG, et ils changent d'un salon à l'autre :
 * ce qui marche pour trois pavillons ne s'industrialise pas. Le dessin est un
 * export de traits, où murs, cotes et hachures se ressemblent ; deviner y
 * revient à parier.
 *
 * On demande donc, plutôt que de deviner. Un calque de dessin reçoit un rôle,
 * et tout ce qu'on y trace le porte :
 *
 *   obstacle     ce qui est dessiné barre le passage à tout le monde
 *   pmr          il ne le barre qu'en itinéraire accessible
 *   circulation  ce qui est dessiné dit où l'on peut marcher ; tout le reste
 *                du pavillon devient infranchissable
 *
 * Les deux bouts par lesquels on peut prendre le problème, donc. Barrer est
 * presque toujours le plus court — un bloc sanitaire fait un rectangle, une
 * allée en fait cinquante — et c'est ce que la liste propose en premier. La
 * circulation reste là pour le hall dont le vide n'est, dans l'ensemble, pas
 * praticable ; elle coûte alors une après-midi de tracé, et il faut le savoir
 * avant de s'y mettre.
 *
 * Le rôle vit dans CONF, comme l'ordre de la pile : les colonnes de
 * `calque_dessin` sont fixées, celles des réglages ne le sont pas — et les
 * réglages partent aux visiteurs à la publication, ce qui est exactement ce
 * qu'on veut.
 */
const ROLES_ITI = [
  { v: "", nom: "Aucun" },
  { v: "obstacle", nom: "Infranchissable" },
  { v: "pmr", nom: "Infranchissable en fauteuil" },
  { v: "circulation", nom: "Où l'on peut marcher" },
];
const cleRoleIti = (id) => "_iti:" + id;
const roleIti = (c) => (CONF[cleRoleIti(c.id)] || {}).role || "";
const nomRoleIti = (r) => (ROLES_ITI.find(x => x.v === r) || ROLES_ITI[0]).nom;

/**
 * Les formes d'un pavillon portant un rôle donné.
 *
 * La visibilité du calque n'entre pas en compte, à la différence des repères :
 * un mur reste un mur quand on l'éteint. Un calque de rôle ne décrit pas ce
 * qu'on montre mais le terrain — les sanitaires, la rampe, les allées — et
 * l'exploitant l'éteint précisément parce que le visiteur n'a pas à le voir.
 * L'oublier alors faisait traverser un local par le trajet, ce qui est un
 * bogue plus grand que le détour inexpliqué qu'on cherchait à éviter.
 * Une ligne n'a pas de surface — elle barre par son trait, et ne saurait
 * délimiter une circulation. Un stand dessiné en a une, comme le rectangle
 * dont il est un cas particulier : posé hors de l'emplacement qu'il découpe,
 * il barre le passage aussi sûrement qu'une cloison.
 */
function formesRole(p, role){
  const l = [];
  for (const c of calquesDe(p)){
    if (roleIti(c) !== role) continue;
    for (const f of c.formes || []){
      if (f.t === "rect" || f.t === "poly" || f.t === "stand")
        l.push({ d: cheminForme(f), trait: false });
      else if (f.t === "ligne" && role !== "circulation")
        l.push({ d: cheminForme(f), trait: true });
    }
  }
  return l;
}

/**
 * Ce qui barre la route à un fauteuil, et à lui seul./**
 * Ce qui barre la route à un fauteuil, et à lui seul.
 *
 * Deux sources, parce qu'un salon en a deux. Les escaliers et les escalators
 * sont déjà signalés par un repère, et leur pastille est posée dessus : on
 * reprend son emprise telle qu'elle est dessinée — ce qu'on voit est ce qui
 * est évité. Les pentes, les emmarchements, les estrades n'ont pas de
 * pictogramme et n'en auront pas : l'exploitant les entoure d'un rectangle ou
 * d'un polygone, et coche « obstacle pour les PMR » sur la forme.
 */
function obstaclesPmr(p){
  const l = formesRole(p, "pmr");
  /* Les escaliers et les escalators sont déjà signalés par un repère, posé sur
     eux : leur pastille dit où ils sont, on la reprend telle quelle. Ce qu'on
     voit est ce qui est évité, sans rien redessiner. */
  for (const c of calquesDe(p)){
    if (c.visible === false) continue;
    for (const f of c.formes || []){
      if (f.t !== "repere") continue;
      const pic = pictoForme(f);
      if (pic !== "escalier" && pic !== "escalator") continue;
      const cote = (f.taille || 2) * 2.4;
      const x = f.pts[0][0] - cote / 2, y = f.pts[0][1] - cote / 2;
      l.push({ d: "M" + x + " " + y + "h" + cote + "v" + cote + "h" + (-cote) + "Z" });
    }
  }
  return l;
}

/**
 * L'angle des allées, en radians.
 *
 * Les cases de la grille sont carrées et le trajet n'y avance que d'équerre :
 * tant qu'elle est posée sur les axes du plan, un pavillon dessiné de travers
 * — un hall arrondi, un bâtiment qui ne regarde pas le nord — voit ses allées
 * descendues en escalier, marche après marche, au lieu d'être suivies. On
 * tourne donc la grille avec le hall : l'escalier redevient la ligne droite
 * qu'un visiteur marche, et les virages retombent aux carrefours.
 *
 * L'angle se lit dans les emplacements eux-mêmes, rangés le long des allées
 * qu'ils bordent : leurs façades en donnent la direction. À un quart de tour
 * près, puisqu'un rectangle a deux directions et qu'elles se valent ici. On
 * cherche le pic plutôt que la moyenne — un hall a toujours quelques stands
 * posés de biais, et il ne faut pas qu'ils entraînent tous les autres — puis
 * on l'affine sur les degrés voisins, l'allée méritant mieux qu'un degré près.
 */
const ANGLES = new Map();
function anglePlan(p){
  const garde = ANGLES.get(p.id);
  if (garde !== undefined) return garde;

  /* Un bac par degré pour trouver le pic ; à côté, la somme des directions
     elles-mêmes, pour ne pas rendre ensuite le milieu du bac à la place de
     l'angle qu'on y a rangé. Les directions s'ajoutent quadruplées : au quart
     de tour près, un angle fait alors le tour entier, et 89° se moyenne avec
     1° sans tomber au milieu, à 45°. */
  const bacs = new Float64Array(90), vc = new Float64Array(90), vs = new Float64Array(90);
  for (const o of p.stands.concat(p.zones)){
    const s = sommets(o);
    for (let i = 0; i + 1 < s.length; i++){
      const dx = s[i + 1][0] - s[i][0], dy = s[i + 1][1] - s[i][1];
      const l = Math.hypot(dx, dy);
      if (l < .8) continue;              // un chanfrein ne dit rien de l'allée
      const a = Math.atan2(dy, dx);
      const b = Math.floor((((a * 180 / Math.PI) % 90) + 90) % 90);
      bacs[b] += l; vc[b] += l * Math.cos(4 * a); vs[b] += l * Math.sin(4 * a);
    }
  }
  let pic = 0;
  for (let i = 1; i < 90; i++) if (bacs[i] > bacs[pic]) pic = i;
  // le pic et ses voisins : l'allée mérite mieux qu'un degré près
  let sc = 0, ss = 0;
  for (let k = -2; k <= 2; k++){
    const i = (pic + k + 90) % 90;
    sc += vc[i]; ss += vs[i];
  }
  let t = (sc || ss) ? Math.atan2(ss, sc) / 4 : 0;
  // un pavillon d'équerre le reste : un quart de degré ne se voit pas, et la
  // grille droite se raisonne mieux quand il faut y revenir
  if (Math.abs(t) < .004) t = 0;
  ANGLES.set(p.id, t);
  return t;
}

/** Du plan à la grille tournée, et retour. Une rotation pure : appliquée à un
 *  vecteur — la normale d'une façade — elle vaut aussi bien que sur un point. */
const dansGrille = (g, q) => [q[0] * g.co + q[1] * g.si, -q[0] * g.si + q[1] * g.co];
const horsGrille = (g, q) => [q[0] * g.co - q[1] * g.si, q[0] * g.si + q[1] * g.co];

/**
 * Le hall en noir et blanc.
 *
 * Le canevas fait le gros du travail : il sait remplir un contour et
 * l'épaissir d'un trait, ce qui donne l'écart au mur sans une ligne de
 * géométrie. On peint donc tout en mur, on creuse l'enveloppe, on y replante
 * les stands, et on relit les pixels.
 */
function grille(p, pmr){
  const cle = p.id + (pmr ? "|pmr" : "");
  const garde = GRILLES.get(cle);
  if (garde) return garde;

  const angle = anglePlan(p), co = Math.cos(angle), si = Math.sin(angle);
  /* L'emprise est celle du plan, à l'équerre ; la grille, elle, est tournée.
     On encadre donc les quatre coins tournés : un peu large aux angles, ce
     qui ne coûte que des cases de mur. */
  const e = p.emprise;
  let X0 = Infinity, Y0 = Infinity, X1 = -Infinity, Y1 = -Infinity;
  for (const q of [[e.x0, e.y0], [e.x1, e.y0], [e.x1, e.y1], [e.x0, e.y1]]){
    const [X, Y] = dansGrille({ co: co, si: si }, q);
    X0 = Math.min(X0, X); X1 = Math.max(X1, X);
    Y0 = Math.min(Y0, Y); Y1 = Math.max(Y1, Y);
  }
  // une case pour un demi-mètre, décalée d'une case pour garder une marge
  const x0 = X0 - PAS_GRILLE, y0 = Y0 - PAS_GRILLE;
  const w = Math.ceil((X1 - X0) / PAS_GRILLE) + 2;
  const h = Math.ceil((Y1 - Y0) / PAS_GRILLE) + 2;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.setTransform(co / PAS_GRILLE, -si / PAS_GRILLE, si / PAS_GRILLE, co / PAS_GRILLE,
                   -x0 / PAS_GRILLE, -y0 / PAS_GRILLE);
  ctx.lineJoin = ctx.lineCap = "round";
  ctx.lineWidth = 2 * (pmr ? DEGAGEMENT_PMR : DEGAGEMENT);
  ctx.fillStyle = ctx.strokeStyle = "#000";

  const barre = (d, trait) => {
    const t = new Path2D(d);
    if (!trait) ctx.fill(t);
    ctx.stroke(t);
  };

  /* Tout est mur avant qu'on ne creuse. On peint en cases plutôt qu'en
     mètres : la grille tournée déborde l'emprise du plan par ses coins, et
     un rectangle posé à l'équerre les laisserait blancs. */
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
  /* On creuse ce qui est praticable. Si l'exploitant a dessiné la circulation,
     c'est elle qui fait foi, et rien d'autre du pavillon n'est ouvert. Sinon
     on retombe sur l'enveloppe des emplacements, qui vaut mieux que rien mais
     ignore tout ce que le fond de plan est seul à savoir. */
  const circulation = formesRole(p, "circulation").map(o => new Path2D(o.d));
  const ouvert = circulation.length ? circulation : [enveloppe(p)];
  ctx.globalCompositeOperation = "destination-out";
  ouvert.forEach(t => ctx.fill(t));
  ctx.globalCompositeOperation = "source-over";
  // le bord d'une circulation est un mur comme un autre : on s'en écarte
  ouvert.forEach(t => ctx.stroke(t));
  for (const o of p.stands) barre(o.d);
  for (const o of p.zones) barre(o.d);
  formesRole(p, "obstacle").forEach(o => barre(o.d, o.trait));
  if (pmr) obstaclesPmr(p).forEach(o => barre(o.d, o.trait));

  const px = ctx.getImageData(0, 0, w, h).data;
  const mur = new Uint8Array(w * h);
  // le lissage du canevas laisse des bords à demi peints : au-delà de la
  // moitié, la case est du côté du mur
  for (let i = 0; i < mur.length; i++) mur[i] = px[i * 4 + 3] > 128 ? 1 : 0;

  const g = { x0: x0, y0: y0, w: w, h: h, mur: mur, pmr: pmr, co: co, si: si };
  g.marge = distanceAuMur(g);
  g.nappe = nappePrincipale(g);
  GRILLES.set(cle, g);
  return g;
}

/**
 * À combien de cases chaque case est-elle du mur le plus proche ?
 *
 * C'est ce qui permet de tenir le milieu d'une allée plutôt que d'en raser un
 * bord. Deux balayages suffisent — un descendant, un remontant, chacun ne
 * regardant que les voisins déjà vus : la distance se propage de proche en
 * proche. On la plafonne bas, seuls les premiers mètres nous intéressent.
 */
function distanceAuMur(g){
  const n = g.w * g.h, PLAFOND = 30;
  const d = new Uint8Array(n);
  const D = Math.SQRT2;
  const met = (i, v) => { d[i] = v > PLAFOND ? PLAFOND : Math.round(v); };
  const lu = new Float32Array(n);
  for (let i = 0; i < n; i++) lu[i] = g.mur[i] ? 0 : 1e6;
  for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++){
    const i = y * g.w + x;
    if (lu[i] === 0) continue;
    let m = lu[i];
    if (x > 0) m = Math.min(m, lu[i - 1] + 1);
    if (y > 0) m = Math.min(m, lu[i - g.w] + 1);
    if (x > 0 && y > 0) m = Math.min(m, lu[i - g.w - 1] + D);
    if (x < g.w - 1 && y > 0) m = Math.min(m, lu[i - g.w + 1] + D);
    lu[i] = m;
  }
  for (let y = g.h - 1; y >= 0; y--) for (let x = g.w - 1; x >= 0; x--){
    const i = y * g.w + x;
    if (lu[i] === 0) continue;
    let m = lu[i];
    if (x < g.w - 1) m = Math.min(m, lu[i + 1] + 1);
    if (y < g.h - 1) m = Math.min(m, lu[i + g.w] + 1);
    if (x < g.w - 1 && y < g.h - 1) m = Math.min(m, lu[i + g.w + 1] + D);
    if (x > 0 && y < g.h - 1) m = Math.min(m, lu[i + g.w - 1] + D);
    lu[i] = m;
    met(i, m);
  }
  return d;
}

/**
 * La nappe où l'on marche vraiment.
 *
 * Le vide d'un hall n'est pas d'un seul tenant : quatre stands mitoyens
 * laissent entre eux des poches fermées de deux ou trois cases, et une cour
 * intérieure peut n'avoir aucune issue. S'accrocher à l'une d'elles rendait
 * une vingtaine d'emplacements du pavillon 7.2 injoignables, alors que leur
 * allée était à quatre mètres. On repère donc une fois pour toutes la plus
 * grande nappe — les allées du hall — et c'est à elle que les points
 * s'accrochent.
 */
function nappePrincipale(g){
  const n = g.w * g.h;
  const marque = new Int32Array(n).fill(-1);
  const file = new Int32Array(n);
  const tailles = [];
  for (let d = 0; d < n; d++){
    if (g.mur[d] || marque[d] >= 0) continue;
    const id = tailles.length;
    let fin = 0, tete = 0;
    file[fin++] = d; marque[d] = id;
    while (tete < fin){
      const i = file[tete++];
      const cx = i % g.w, cy = (i - cx) / g.w;
      // quatre voisins, comme le trajet : deux cases en diagonale ne
      // communiquent pas plus ici qu'on ne passe entre deux angles de stand
      for (let k = 0; k < 4; k++){
        const nx = cx + VX[k], ny = cy + VY[k];
        if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h) continue;
        const j = ny * g.w + nx;
        if (g.mur[j] || marque[j] >= 0) continue;
        marque[j] = id;
        file[fin++] = j;
      }
    }
    tailles.push(fin);
  }
  let gagnante = -1, mieux = 0;
  tailles.forEach((t, i) => { if (t > mieux){ mieux = t; gagnante = i; } });
  const nappe = new Uint8Array(n);
  for (let i = 0; i < n; i++) if (marque[i] === gagnante) nappe[i] = 1;
  return nappe;
}

/** La case où tombe un point du plan, débordements compris : c'est à l'appelant
 *  de décider ce qu'il fait d'une colonne hors grille. */
function celluleDe(g, x, y){
  const q = dansGrille(g, [x, y]);
  return [Math.floor((q[0] - g.x0) / PAS_GRILLE), Math.floor((q[1] - g.y0) / PAS_GRILLE)];
}
function caseDe(g, x, y){
  const [cx, cy] = celluleDe(g, x, y);
  if (cx < 0 || cy < 0 || cx >= g.w || cy >= g.h) return -1;
  return cy * g.w + cx;
}
function centreCase(g, i){
  const cx = i % g.w, cy = (i - cx) / g.w;
  return horsGrille(g, [g.x0 + (cx + .5) * PAS_GRILLE, g.y0 + (cy + .5) * PAS_GRILLE]);
}

/* Jusqu'où l'on accepte de chercher l'allée d'un point : douze mètres, la
   profondeur d'un très grand stand. Au-delà, on ne s'écarte plus — un point
   qu'aucune allée n'atteint doit rester injoignable, sinon le mode accessible
   tracerait des trajets vers des stands qu'il vient précisément d'exclure. */
const PORTEE_ACCROCHE = 24;

/**
 * Les cases qu'un emplacement occupe en propre, son dégagement compris.
 *
 * Peinte comme la grille l'a été — même pas, même épaisseur de trait — pour
 * que les deux se recouvrent exactement : ce qui est mur à cause de ce stand
 * est ici marqué sien, ce qui l'est à cause d'un autre ne l'est pas.
 *
 * On ne peint qu'une fenêtre autour du point, de la taille de ce qu'on
 * accepte de fouiller : un pavillon entier repeint pour chaque accroche
 * coûterait plus que toutes les recherches réunies.
 */
function empriseDe(g, d, cx0, cy0, cote){
  const cv = document.createElement("canvas");
  cv.width = cote; cv.height = cote;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.setTransform(g.co / PAS_GRILLE, -g.si / PAS_GRILLE, g.si / PAS_GRILLE, g.co / PAS_GRILLE,
                   -g.x0 / PAS_GRILLE - cx0, -g.y0 / PAS_GRILLE - cy0);
  ctx.lineJoin = ctx.lineCap = "round";
  ctx.lineWidth = 2 * (g.pmr ? DEGAGEMENT_PMR : DEGAGEMENT);
  ctx.fillStyle = ctx.strokeStyle = "#000";
  const t = new Path2D(d);
  ctx.fill(t); ctx.stroke(t);
  const px = ctx.getImageData(0, 0, cote, cote).data;
  const m = new Uint8Array(cote * cote);
  for (let i = 0; i < m.length; i++) m[i] = px[i * 4 + 3] > 128 ? 1 : 0;
  return m;
}

/**
 * La case de la nappe principale la plus proche d'un point.
 *
 * Le centre d'un stand tombe dans le mur — c'est bien lui qu'on désigne, mais
 * c'est l'allée devant lui qu'on emprunte. On s'écarte donc en anneaux
 * jusqu'à toucher les allées : la façade la plus proche est atteinte la
 * première, sans qu'on ait eu à la chercher.
 *
 * Encore faut-il que ce soit la sienne. On traversait les murs sans distinguer
 * à qui ils étaient, si bien qu'un stand serré entre deux voisins s'accrochait
 * à l'allée d'en face, à travers le stand du voisin : le trait entrait par une
 * façade qui n'était pas la sienne, et l'amorce dessinait un crochet au milieu
 * de l'emplacement traversé. On ne franchit donc que son propre emplacement —
 * on n'entre pas chez quelqu'un pour aller chez soi.
 */
function accrocheDepuis(g, xy, chez){
  let d = caseDe(g, xy[0], xy[1]);
  if (d < 0){
    const [gx, gy] = celluleDe(g, xy[0], xy[1]);
    const cx = Math.min(g.w - 1, Math.max(0, gx));
    const cy = Math.min(g.h - 1, Math.max(0, gy));
    d = cy * g.w + cx;
  }
  if (g.nappe[d]) return d;

  const dx0 = d % g.w, dy0 = (d - dx0) / g.w;
  const cote = 2 * PORTEE_ACCROCHE + 1;
  const cx0 = dx0 - PORTEE_ACCROCHE, cy0 = dy0 - PORTEE_ACCROCHE;
  const sien = chez ? empriseDe(g, chez, cx0, cy0, cote) : null;
  const chezSoi = (nx, ny) => {
    if (!sien) return true;
    const px = nx - cx0, py = ny - cy0;
    return px >= 0 && py >= 0 && px < cote && py < cote && sien[py * cote + px] === 1;
  };

  const vu = new Uint8Array(g.w * g.h);
  const file = [d];
  vu[d] = 1;
  let repli = -1;
  for (let k = 0; k < file.length; k++){
    const i = file[k], cx = i % g.w, cy = (i - cx) / g.w;
    // en huit voisins, le rang de l'anneau se lit sur les coordonnées
    if (Math.max(Math.abs(cx - dx0), Math.abs(cy - dy0)) > PORTEE_ACCROCHE) break;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h) continue;
      const j = ny * g.w + nx;
      if (vu[j]) continue;
      vu[j] = 1;
      if (g.nappe[j]) return j;
      // le mur d'un autre ne se franchit pas : c'est là toute la règle
      if (g.mur[j] && !chezSoi(nx, ny)) continue;
      // une poche fermée ne mène nulle part : on la traverse sans s'y arrêter
      if (repli < 0 && !g.mur[j]) repli = j;
      file.push(j);
    }
  }
  return repli;
}

/**
 * Du bord de l'allée à son milieu.
 *
 * L'anneau rend la première case d'allée rencontrée : celle qui touche la
 * façade, au ras du mur. Le trajet démarrait donc collé aux stands, et il
 * fallait deux virages pour rejoindre le milieu — que le calcul ne payait
 * qu'à contrecœur, si bien que le trait longeait les emplacements d'un bout à
 * l'autre. On remonte donc la pente : on s'éloigne du mur tant qu'un voisin
 * est plus au large, sans dépasser la portée au-delà de laquelle un « milieu »
 * n'a plus de sens. Quelques pas suffisent, l'allée n'ayant que sa largeur.
 */
function versLeMilieu(g, i){
  let cur = i;
  for (let pas = 0; pas < PORTEE_CENTRE; pas++){
    if (g.marge[cur] >= PORTEE_CENTRE) break;
    const cx = cur % g.w, cy = (cur - cx) / g.w;
    let mieux = cur;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h) continue;
      const j = ny * g.w + nx;
      if (g.nappe[j] && g.marge[j] > g.marge[mieux]) mieux = j;
    }
    if (mieux === cur) break;
    cur = mieux;
  }
  return cur;
}

/**
 * L'accroche, et son garde-fou.
 *
 * Un emplacement qu'aucune allée ne borde — enclavé au milieu d'un îlot, ou
 * dont le dégagement mange le seul passage — n'a pas de façade à offrir. Le
 * laisser injoignable serait pire que le défaut qu'on corrige : on relâche
 * alors la règle plutôt que de rendre la main, quitte à retrouver un trait qui
 * coupe par le voisin. Ce qui se voit, au moins, se comprend.
 */
function accroche(g, xy, chez){
  let r = accrocheDepuis(g, xy, chez);
  if (chez && !(r >= 0 && g.nappe[r])){
    const large = accrocheDepuis(g, xy, null);
    if (large >= 0 && g.nappe[large]) r = large;
  }
  return r >= 0 && g.nappe[r] ? versLeMilieu(g, r) : r;
}

/* ------------------------------------------------------------
   A*
   ------------------------------------------------------------ */
/* Un tas binaire sur deux tableaux parallèles. C'est le seul endroit où un A*
   écrit naïvement s'effondre : chercher le minimum d'une liste à chaque tour
   coûte plus que tout le reste du calcul réuni. */
function Tas(){ this.f = []; this.i = []; }
Tas.prototype.pousse = function (f, i){
  const F = this.f, I = this.i;
  let k = F.length;
  F.push(f); I.push(i);
  while (k > 0){
    const p = (k - 1) >> 1;
    if (F[p] <= F[k]) break;
    const a = F[p]; F[p] = F[k]; F[k] = a;
    const b = I[p]; I[p] = I[k]; I[k] = b;
    k = p;
  }
};
Tas.prototype.tire = function (){
  const F = this.f, I = this.i;
  const tete = I[0], n = F.length - 1;
  F[0] = F[n]; I[0] = I[n]; F.pop(); I.pop();
  let k = 0;
  for (;;){
    const g = 2 * k + 1, d = g + 1;
    let m = k;
    if (g < F.length && F[g] < F[m]) m = g;
    if (d < F.length && F[d] < F[m]) m = d;
    if (m === k) break;
    const a = F[m]; F[m] = F[k]; F[k] = a;
    const b = I[m]; I[m] = I[k]; I[k] = b;
    k = m;
  }
  return tete;
};

/* Les quatre directions, dans cet ordre : est, ouest, sud, nord. */
const VX = [1, -1, 0, 0];
const VY = [0, 0, 1, -1];

/**
 * Les tableaux de travail de la recherche, alloués une fois pour toutes.
 *
 * Un état n'est pas une case mais une case abordée dans une direction : il y
 * en a donc quatre fois plus, et les réallouer à chaque trajet coûterait plus
 * que la recherche. Un compteur de tour évite de les remettre à zéro : un état
 * dont le tampon n'est pas celui du tour n'a jamais été visité.
 */
let TRAVAIL = null;
function travail(taille){
  if (!TRAVAIL || TRAVAIL.cout.length < taille){
    TRAVAIL = { cout: new Float32Array(taille), pere: new Int32Array(taille),
                etat: new Int32Array(taille), tour: 0 };
  }
  return TRAVAIL;
}

/**
 * Le plus court chemin de case à case, ou null s'il n'en existe aucun.
 *
 * Quatre voisins, jamais huit : une diagonale de grille n'a pas d'équivalent
 * dans une allée, et c'est elle qui faisait traverser les allées en biais.
 * Reste que mille escaliers valent la même longueur — d'où le prix du virage,
 * qui tranche en faveur des longues lignes droites, et le prix du bord, qui
 * tient le trait au milieu du passage. L'état porte donc la direction d'où
 * l'on vient, sans quoi un virage ne se verrait pas.
 */
function cherche(g, depart, arrivee){
  if (depart === arrivee) return [depart];
  const m = travail(g.w * g.h * 4);
  const tour = ++m.tour;
  const ax = arrivee % g.w, ay = (arrivee - ax) / g.w;
  // Manhattan : sur quatre voisins et au pas d'une case, elle ne surestime
  // jamais le trajet — condition pour qu'A* rende bien le plus court
  const reste = (i) => {
    const x = i % g.w, y = (i - x) / g.w;
    return Math.abs(x - ax) + Math.abs(y - ay);
  };
  const bord = (i) => {
    const l = g.marge[i];
    return l >= PORTEE_CENTRE ? 0 : POIDS_CENTRE * (PORTEE_CENTRE - l) / PORTEE_CENTRE;
  };

  const tas = new Tas();
  /* Les quatre directions de départ coûtent zéro : le premier pas ne paie
     aucun virage, on n'arrivait de nulle part. */
  for (let d = 0; d < 4; d++){
    const s = depart * 4 + d;
    m.etat[s] = tour; m.cout[s] = 0; m.pere[s] = -1;
    tas.pousse(reste(depart), s);
  }

  let dernier = -1;
  while (tas.f.length){
    const s = tas.tire();
    if (m.etat[s] === -tour) continue;      // déjà close
    const i = (s / 4) | 0, d = s & 3;
    if (i === arrivee){ dernier = s; break; }
    m.etat[s] = -tour;
    const cx = i % g.w, cy = (i - cx) / g.w;
    for (let k = 0; k < 4; k++){
      const nx = cx + VX[k], ny = cy + VY[k];
      if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h) continue;
      const j = ny * g.w + nx;
      if (g.mur[j]) continue;
      const s2 = j * 4 + k;
      if (m.etat[s2] === -tour) continue;
      const c = m.cout[s] + 1 + bord(j) + (k === d ? 0 : TOURNANT);
      if (m.etat[s2] !== tour || c < m.cout[s2]){
        m.etat[s2] = tour; m.cout[s2] = c; m.pere[s2] = s;
        tas.pousse(c + reste(j), s2);
      }
    }
  }
  if (dernier < 0) return null;
  const suite = [];
  for (let s = dernier; s >= 0; s = m.pere[s]) suite.push((s / 4) | 0);
  return suite.reverse();
}

/**
 * Les distances d'une case à toutes les autres, en cases.
 *
 * Organiser une journée ne demande pas un trajet mais une matrice : vingt
 * arrêts en font quatre cents paires, et autant d'A* prendraient plusieurs
 * secondes sur un téléphone de salon. Un balayage en largeur depuis un seul
 * arrêt les donne toutes d'un coup — un pavillon entier coûte moins qu'un A*
 * isolé — au prix d'une longueur sans prix du virage ni du bord : c'est la
 * longueur du couloir, ce qui suffit à comparer deux ordres de visite. Le
 * tracé montré au visiteur, lui, reste celui de `troncon`.
 *
 * Rend -1 pour les cases hors de la nappe, ou qu'aucune allée ne relie.
 */
function distancesDepuis(g, depart){ return distancesMulti(g, [depart]).d; }

/**
 * Le même balayage, mais depuis plusieurs cases à la fois.
 *
 * Un stand n'a pas une entrée mais autant que de faces libres, et la plus
 * courte des deux extrémités ne se sait qu'une fois les deux essayées. Partir
 * de toutes les arrivées d'un coup donne, pour chaque départ possible, la
 * distance à la plus proche d'entre elles — le meilleur couple sort d'un seul
 * balayage, là où seize A* le paieraient au prix fort.
 *
 * `src` retient de laquelle chaque case est le plus proche : c'est ce qui
 * permet de retrouver la porte à l'autre bout.
 */
function distancesMulti(g, departs){
  const n = g.w * g.h;
  const d = new Int32Array(n).fill(-1);
  const src = new Int32Array(n).fill(-1);
  const file = new Int32Array(n);
  let tete = 0, queue = 0;
  departs.forEach((c, k) => {
    if (c < 0 || !g.nappe[c] || d[c] >= 0) return;
    d[c] = 0; src[c] = k; file[queue++] = c;
  });
  while (tete < queue){
    const i = file[tete++], cx = i % g.w, cy = (i - cx) / g.w;
    for (let v = 0; v < 4; v++){
      const nx = cx + VX[v], ny = cy + VY[v];
      if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h) continue;
      const j = ny * g.w + nx;
      if (d[j] >= 0 || !g.nappe[j]) continue;
      d[j] = d[i] + 1; src[j] = src[i];
      file[queue++] = j;
    }
  }
  return { d: d, src: src };
}

/* ------------------------------------------------------------
   Du chemin en cases au trait qu'on suit
   ------------------------------------------------------------ */
/**
 * Le chemin, réduit à ses tournants.
 *
 * Les cases alignées se fondent en un segment, et rien d'autre n'est touché :
 * pas de fil tendu entre deux angles. C'était la version précédente, et c'est
 * elle qui produisait les diagonales — un fil tendu coupe les coins par
 * définition, y compris au milieu d'une allée qu'il fallait suivre droit.
 */
function reduit(g, suite){
  const pts = [];
  for (let k = 0; k < suite.length; k++){
    const i = suite[k];
    // une case dont les deux voisines sont symétriques n'est pas un tournant
    if (k > 0 && k < suite.length - 1 && suite[k - 1] + suite[k + 1] === 2 * i) continue;
    pts.push(centreCase(g, i));
  }
  return pts;
}

/* Ce qu'on accepte entre le trait montré et le trajet calculé. Un peu plus
   d'une case : en deçà, l'escalier ne se laisse pas redresser ; au-delà, on
   raboterait des détours que le trajet fait pour de bonnes raisons. */
const LISSAGE = .5;   // mètres

/* Jusqu'où l'on va chercher le bord de l'allée, de part et d'autre du trait.
   Au-delà ce n'est plus une allée mais une esplanade, et son milieu ne veut
   plus rien dire — on laisse alors le trajet où il passe. */
const DEMI_ALLEE = 4;   // mètres

/**
 * Sur quoi le trait se règle : l'inclinaison du hall, ou les allées.
 *
 * Les deux répondent à la même question par des bouts différents, et aucune
 * ne gagne partout. L'inclinaison du hall est une droite : le trajet en sort
 * net, d'équerre, avec le moins de sommets possible — c'est ce qu'on veut
 * partout où le pavillon est d'une seule venue, ce qui est le cas courant.
 * Les allées, elles, se suivent une à une : un hall arrondi, ou dont les
 * rangées ne s'accordent pas, y gagne un trait qui reste entre ses bordures,
 * au prix de quelques sommets de plus et d'un tracé parfois moins net.
 *
 * D'où le réglage plutôt qu'une règle : l'exploitant voit son plan, nous non.
 * Le hall par défaut — il convient à la majorité des salons, et c'est le
 * comportement que les plans déjà publiés connaissent.
 */
const guidageAllees = () => (CONF["_guidage"] || {}).allees === true;

/**
 * Le trait ramené entre les bordures qui l'encadrent.
 *
 * La grille suit une orientation, une seule, et l'A* préfère les longues
 * lignes droites : dans un hall arrondi, dont les allées tournent d'un bout à
 * l'autre, il traverse donc l'allée en écharpe plutôt que de la suivre —
 * quarante mètres d'un trait qui entre par le milieu et ressort contre une
 * façade. Aucun redressement n'y peut rien : il n'y a pas d'escalier à
 * effacer, le trait est déjà droit, et c'est précisément le reproche.
 *
 * On le mesure donc là où le visiteur le mesure : entre les deux bordures. À
 * chaque demi-mètre on cherche le mur à droite et à gauche, en travers du
 * trait, et on pose le point à mi-distance. Les stands qui bordent l'allée
 * dictent ainsi le tracé, et un segment redevient parallèle à l'allée sans
 * qu'on ait eu à lui calculer d'angle : le milieu de deux façades parallèles
 * leur est parallèle.
 *
 * Trois réserves, qui sont les trois façons de n'être pas dans une allée. Il
 * faut un mur des deux côtés : un seul ne fait pas un milieu, et s'en écarter
 * pousserait le trait vers le large sans raison. Le décalage se lit ensuite
 * sur quelques mètres et non point par point — entre deux stands d'une même
 * rangée, la façade s'interrompt, un bord part à quatre mètres et le trait
 * partirait le rejoindre pour revenir aussitôt ; la médiane sur une longueur
 * de stand ignore ce trou sans rien perdre de la courbure, qui est lente. Et
 * un point ne se déplace que là où il reste praticable, ce que la grille seule
 * décide.
 */
function recentre(g, pts){
  if (pts.length < 2) return pts;
  const pas = PAS_GRILLE / 2;
  const libre = (x, y) => { const i = caseDe(g, x, y); return i >= 0 && !g.mur[i]; };
  /* Jusqu'où le mur est-il, dans cette direction ? On avance par demi-cases :
     la grille ne connaît pas de bord plus fin que ça. */
  const jusquAuMur = (q, vx, vy) => {
    for (let d = pas; d <= DEMI_ALLEE; d += pas)
      if (!libre(q[0] + vx * d, q[1] + vy * d)) return d - pas;
    return DEMI_ALLEE;
  };

  // le trait échantillonné à la case, chacun avec la normale de son segment
  const ech = [], norm = [], brut = [];
  for (let i = 0; i + 1 < pts.length; i++){
    const A = pts[i], B = pts[i + 1];
    const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy);
    if (!l) continue;
    const nx = -dy / l, ny = dx / l;
    const n = Math.max(1, Math.round(l / PAS_GRILLE));
    for (let k = 0; k < n; k++){
      const u = k / n;
      const q = [A[0] + dx * u, A[1] + dy * u];
      const dp = jusquAuMur(q, nx, ny), dm = jusquAuMur(q, -nx, -ny);
      ech.push(q); norm.push([nx, ny]);
      // sans deux bords, il n'y a pas de milieu : on ne bouge pas
      brut.push(dp >= DEMI_ALLEE || dm >= DEMI_ALLEE ? 0 : (dp - dm) / 2);
    }
  }
  if (!ech.length) return pts;

  /* La médiane glissante sur une longueur de stand : assez large pour enjamber
     une façade interrompue, assez courte pour suivre une allée qui tourne. */
  const demi = Math.round(3 / PAS_GRILLE);
  const out = [];
  for (let i = 0; i < ech.length; i++){
    const f = brut.slice(Math.max(0, i - demi), i + demi + 1).sort((a, b) => a - b);
    const e = f[f.length >> 1];
    const q = ech[i], n = norm[i];
    const r = [q[0] + n[0] * e, q[1] + n[1] * e];
    out.push(e && libre(r[0], r[1]) ? r : q);
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}

/** Le segment tient-il dans le passage ? On l'échantillonne à la demi-case :
 *  plus fin ne dirait rien de plus, la grille n'en sait pas davantage. */
function passable(g, A, B){
  const l = Math.hypot(B[0] - A[0], B[1] - A[1]);
  const n = Math.max(1, Math.ceil(l / (PAS_GRILLE / 2)));
  for (let k = 0; k <= n; k++){
    const u = k / n;
    const i = caseDe(g, A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u);
    if (i < 0 || g.mur[i]) return false;
  }
  return true;
}

/**
 * L'escalier redressé en la droite qu'il dessinait.
 *
 * La grille suit l'orientation dominante du pavillon, ce qui suffit tant que
 * toutes les allées la partagent. Un hall arrondi n'en a pas : ses allées
 * tournent, et celles qui s'écartent de la dominante se descendent de nouveau
 * en marches d'une demi-case. Ces marches ne sont pas un trajet, ce sont les
 * arrondis de la grille — on les efface.
 *
 * On garde donc un sommet seulement quand le supprimer écarterait le trait de
 * plus d'une case du trajet calculé : les marches, qui tiennent dans cette
 * tolérance, se fondent en la droite que le visiteur marche vraiment, et le
 * virage d'un vrai carrefour, qui la dépasse de loin, reste. C'est ce qui
 * distingue ce redressement du fil tendu qu'on tirait autrefois : le fil
 * regardait la longueur et coupait donc les coins, celui-ci regarde l'écart
 * et n'en coupe aucun.
 *
 * La tolérance seule ne suffit pourtant pas à garantir qu'on passe : une allée
 * qui se rétrécit, un poteau au milieu, et la corde traverse ce que les
 * marches contournaient. Chaque raccourci est donc essayé sur la grille avant
 * d'être retenu.
 */
function lisse(g, pts){
  if (pts.length < 3) return pts;
  const garde = new Uint8Array(pts.length);
  garde[0] = garde[pts.length - 1] = 1;
  // en pile plutôt qu'en récursion : un pavillon traversé fait des milliers
  // de sommets, et la pile d'appels n'est pas faite pour ça
  const restes = [[0, pts.length - 1]];
  while (restes.length){
    const [i, j] = restes.pop();
    if (j <= i + 1) continue;
    const A = pts[i], B = pts[j];
    const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy);
    let pire = -1, k = i + 1;
    for (let m = i + 1; m < j; m++){
      const e = l ? Math.abs((pts[m][0] - A[0]) * dy - (pts[m][1] - A[1]) * dx) / l
                  : Math.hypot(pts[m][0] - A[0], pts[m][1] - A[1]);
      if (e > pire){ pire = e; k = m; }
    }
    if (pire <= LISSAGE && passable(g, A, B)) continue;
    garde[k] = 1;
    restes.push([i, k], [k, j]);
  }
  return pts.filter((q, i) => garde[i]);
}

const longueur = (pts) => pts.reduce((s, q, i) =>
  i ? s + Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1]) : 0, 0);

/**
 * Ce qu'on marche vraiment, l'intérieur des emplacements déduit.
 *
 * Le trait part du centre du stand, parce que c'est lui qu'on montre — mais
 * personne ne traverse un stand de son milieu à sa façade pour en sortir : on
 * y est déjà. Compter ces mètres gonflait chaque tronçon de la demi-profondeur
 * de ses deux emplacements, soit une dizaine de mètres par arrêt, et autant de
 * minutes de marche annoncées pour rien sur une journée de vingt visites.
 *
 * On retranche donc les deux amorces, chacune tant qu'elle reste chez elle.
 * On ne balaie que les extrémités : entre les deux, le trait est dans les
 * allées, et l'y chercher coûterait plus que ce qu'on en retirerait.
 */
function longueurDehors(pts, chezD, chezA){
  let m = longueur(pts);
  if (!chezD && !chezA) return m;
  const ctx = document.createElement("canvas").getContext("2d");
  const dedans = (t, q) => ctx.isPointInPath(t, q[0], q[1]);
  /* Depuis un bout, on avance par petits pas et on décompte tant qu'on est
     dans l'emplacement. Le premier pas dehors arrête le décompte : un trait
     qui y rentrerait de nouveau plus loin serait un trajet, pas une amorce. */
  const rogne = (suite, d) => {
    if (!d) return 0;
    const t = new Path2D(d);
    let ote = 0;
    for (let i = 0; i + 1 < suite.length; i++){
      const A = suite[i], B = suite[i + 1];
      const l = Math.hypot(B[0] - A[0], B[1] - A[1]);
      const n = Math.max(1, Math.ceil(l / (PAS_GRILLE / 2)));
      for (let k = 0; k < n; k++){
        const u = (k + .5) / n;
        if (!dedans(t, [A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u])) return ote;
        ote += l / n;
      }
    }
    return ote;
  };
  m -= rogne(pts, chezD);
  m -= rogne(pts.slice().reverse(), chezA);
  return Math.max(0, m);
}

/**
 * Deux sommets à cinq centimètres l'un de l'autre ne sont qu'un — et un
 * sommet sur lequel le trait rebrousse chemin n'en est pas un.
 *
 * Le coude de l'amorce se pose au droit du stand ; le trajet, lui, touche
 * l'allée là où la façade s'ouvre, et les deux tombent rarement au même
 * endroit. Le trait remontait donc l'allée jusqu'au bout du trajet, puis
 * revenait sur ses pas jusqu'au coude : le retour se superpose à l'aller et
 * ne se voit pas, mais le dépassement, lui, se voit — un petit T au bout de
 * l'itinéraire. On retire donc le sommet sur lequel on rebrousse : le trait
 * s'arrête là où il tourne, et le compte des mètres cesse de payer deux fois
 * un aller-retour que personne ne marche.
 */
function nettoie(pts){
  const out = [];
  for (const q of pts){
    const p = out[out.length - 1];
    if (!p || Math.hypot(q[0] - p[0], q[1] - p[1]) > .05) out.push(q);
  }
  for (let i = 1; i + 1 < out.length; i++){
    const a = out[i - 1], b = out[i], c = out[i + 1];
    const ux = b[0] - a[0], uy = b[1] - a[1], vx = c[0] - b[0], vy = c[1] - b[1];
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
    if (!lu || !lv) continue;
    /* Franchement rebroussé, et pas seulement pointu : un demi-tour d'allée à
       allée garde toujours la largeur de l'allée entre l'aller et le retour,
       et ce n'est pas de lui qu'on parle. */
    if ((ux * vx + uy * vy) / (lu * lv) > -.999) continue;
    out.splice(i, 1);
    i = Math.max(0, i - 2);
  }
  return out;
}

/**
 * Les faces libres d'un emplacement : celles qu'aucun voisin ne borde.
 *
 * Un stand de rangée est mitoyen sur trois côtés et n'ouvre que sur le
 * quatrième. Le déduire du pavage ne marchait qu'à moitié : entre deux stands
 * serrés, le dégagement des deux se rejoint et tout devient mur, si bien qu'on
 * ne distinguait plus une façade fermée d'un passage trop étroit. On lit donc
 * la géométrie plutôt que la grille — on échantillonne juste devant chaque
 * côté, et un côté sur lequel un autre emplacement se referme est mitoyen.
 *
 * Le résultat se garde : une emprise ne bouge qu'en administration, et une
 * journée de vingt arrêts redemanderait vingt fois les mêmes façades.
 */
const FACES = new Map();
function oublieFaces(){ FACES.clear(); }

function facesLibres(p, o){
  const cle = p.id + "|" + o.id;
  const garde = FACES.get(cle);
  if (garde) return garde;

  const s = sommets(o);
  const ctx = document.createElement("canvas").getContext("2d");
  const moi = new Path2D(o.d);
  /* On ne compare qu'au voisinage : cinq cents emprises passées en revue pour
     chaque façade coûteraient plus que tout le reste du tronçon. */
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  s.forEach(q => { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]);
                   y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
  const pres = [];
  for (const v of p.stands.concat(p.zones)){
    if (v === o || v.id === o.id || !v.d) continue;
    const c = v.lc || v.c;
    if (!c || c[0] < x0 - 40 || c[0] > x1 + 40 || c[1] < y0 - 40 || c[1] > y1 + 40) continue;
    pres.push(new Path2D(v.d));
  }

  const out = [];
  for (let i = 0; i + 1 < s.length; i++){
    const A = s[i], B = s[i + 1];
    const l = Math.hypot(B[0] - A[0], B[1] - A[1]);
    if (l < .8) continue;                    // un chanfrein n'est pas une façade
    // la normale qui sort : celle dont un pas ne retombe pas dans l'emprise
    let ux = -(B[1] - A[1]) / l, uy = (B[0] - A[0]) / l;
    const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
    if (ctx.isPointInPath(moi, mx + ux * .05, my + uy * .05)){ ux = -ux; uy = -uy; }
    let libre = true;
    for (let k = 1; k <= 5 && libre; k++){
      const u = k / 6;
      const x = A[0] + (B[0] - A[0]) * u + ux * .3, y = A[1] + (B[1] - A[1]) * u + uy * .3;
      if (pres.some(t => ctx.isPointInPath(t, x, y))) libre = false;
    }
    if (libre) out.push({ mid: [mx, my], u: [ux, uy], l: l });
  }
  FACES.set(cle, out);
  return out;
}

/* Au-delà, l'amorce n'est plus un pas hors du stand mais un trajet en soi :
   la relier d'un trait reste alors plus lisible que de la couder. */
const AMORCE_MAX = 20;   // mètres

/**
 * L'amorce : du stand à l'allée.
 *
 * Le trajet part du centre du stand désigné — c'est lui qu'on montre — et
 * rejoint l'allée. Relier les deux d'un trait donnait une oblique, seul trait
 * de travers d'un tracé par ailleurs d'équerre. On la coude donc.
 *
 * Reste à savoir dans quel ordre. On sortait d'abord parallèlement à l'allée,
 * puis on la rejoignait de biais : c'est-à-dire qu'on longeait l'intérieur du
 * stand sur toute sa profondeur avant d'en franchir la façade. Quand le point
 * d'accroche tombait au-delà de l'emplacement — ce qui est le cas ordinaire
 * d'un stand d'angle — le trait dessinait un crochet au milieu de la surface,
 * puis ressortait par le côté.
 *
 * On fait donc l'inverse, qui est aussi ce qu'un visiteur fait : on quitte
 * l'emplacement **droit par sa face la plus proche**, perpendiculairement, et
 * c'est une fois dans l'allée qu'on la remonte. Un seul coude, dehors, et le
 * trait n'entre jamais de travers.
 *
 * Où poser le coude, en revanche, ne se devine pas : c'est là où la façade du
 * stand rencontre l'allée. On croise donc les deux droites — celle qui part du
 * centre en franchissant la façade, celle que suit le trajet — et le coude est
 * leur intersection. Un quart de tour ne s'y suppose nulle part, ce qui vaut
 * mieux : l'allée d'un hall arrondi n'en fait pas.
 *
 * Rend le coude à insérer, ou rien s'il n'y a pas lieu d'en poser un.
 */
function amorce(pts, ancre, sortie){
  if (pts.length < 2) return [];
  const a = pts[0], b = pts[1];
  const lu = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (!lu) return [];
  const u = [(b[0] - a[0]) / lu, (b[1] - a[1]) / lu];
  /* À défaut de face libre connue — un repère, un point désigné du doigt — on
     retombe sur l'orientation de l'allée : on en sort par le travers. */
  const f = sortie || [-u[1], u[0]];
  const den = f[0] * u[1] - f[1] * u[0];
  // on sort dans l'axe de l'allée : il n'y a alors pas de coude à poser
  if (Math.abs(den) < 1e-6) return [];
  const t = ((a[0] - ancre[0]) * u[1] - (a[1] - ancre[1]) * u[0]) / den;
  // l'allée est derrière la façade par laquelle on sort : le coude serait un
  // crochet de l'autre côté du stand, mieux vaut le trait direct
  if (t < 0) return [];
  const coude = [ancre[0] + f[0] * t, ancre[1] + f[1] * t];
  const l1 = Math.hypot(coude[0] - ancre[0], coude[1] - ancre[1]);
  const l2 = Math.hypot(a[0] - coude[0], a[1] - coude[1]);
  if (l1 > AMORCE_MAX || l2 > AMORCE_MAX) return [];
  return [coude];
}

/**
 * Par quelle face on quitte un emplacement.
 *
 * Celle qui n'est pas mitoyenne — et, s'il y en a plusieurs, la plus proche de
 * l'allée qu'on rejoint. C'est ce qui fait sortir un stand de rangée par son
 * unique côté ouvert, et non par le voisin qui se trouvait dans l'axe. Rend la
 * normale par laquelle on s'en va — telle quelle, sans la ramener à un quart
 * de tour : c'est elle qui donne son angle au coude de l'amorce, et un stand
 * de hall arrondi n'est pas posé d'équerre. Rien si l'emplacement n'ouvre
 * nulle part : l'accroche a alors déjà dû s'autoriser à passer par le voisin,
 * et l'amorce n'a plus de face à respecter.
 */
function faceDeSortie(p, obj, ancre){
  if (!obj || !obj.d) return null;
  const libres = facesLibres(p, obj);
  let mieux = null, d = Infinity;
  for (const f of libres){
    const q = Math.hypot(f.mid[0] - ancre[0], f.mid[1] - ancre[1]);
    if (q < d){ d = q; mieux = f; }
  }
  return mieux ? mieux.u.slice() : null;
}

/**
 * Par où l'on entre dans un emplacement, et par où l'on en sort.
 *
 * On s'accrochait au centre du stand : l'anneau rendait la première allée
 * rencontrée en s'écartant du milieu, c'est-à-dire la face la plus proche du
 * barycentre — pas celle par laquelle on arrive. Un stand plus large que
 * profond, abordé par l'allée qui longe son petit côté, se voyait ainsi
 * entrer par le haut, quitte à contourner tout l'emplacement pour cela.
 *
 * On énumère donc les entrées plutôt qu'on n'en devine une : le milieu de
 * chaque face non mitoyenne — c'est là qu'un visiteur franchit un stand
 * ouvert — décalé d'un pas dans l'allée pour tomber hors du dégagement. Le
 * choix entre elles ne se fait pas ici : il revient au trajet, qui garde la
 * plus courte (`troncon`).
 *
 * Un emplacement sans face libre — enclavé, ou dont le dégagement mange le
 * seul passage — retombe sur l'accroche depuis son centre, qui sait relâcher
 * la règle plutôt que de rendre la main.
 */
function accesDe(g, p, obj, xy){
  const d = obj && obj.d;
  const out = [];
  const vus = new Set();
  if (p && d){
    const pas = PAS_GRILLE + (g.pmr ? DEGAGEMENT_PMR : DEGAGEMENT);
    for (const f of facesLibres(p, obj)){
      const c = accroche(g, [f.mid[0] + f.u[0] * pas, f.mid[1] + f.u[1] * pas], d);
      if (c >= 0 && g.nappe[c] && !vus.has(c)){ vus.add(c); out.push(c); }
    }
  }
  if (!out.length){
    const c = accroche(g, xy, d);
    if (c >= 0) out.push(c);
  }
  return out;
}

/* Combien de couples d'entrées on trace avant de trancher. Le balayage les
   classe sur la longueur d'allée seule ; l'A*, lui, paie aussi les virages et
   le milieu de l'allée, et peut préférer un détour droit à un zigzag plus
   court. Les deux ne s'accordent donc pas toujours, et le premier couple
   n'est pas toujours celui qui rend le trait le plus court. Trois suffisent :
   au-delà, on retrace des façades que le balayage a déjà mises loin derrière. */
const ESSAIS_ACCES = 3;

/**
 * Les couples entrée-sortie à essayer, du plus prometteur au moins.
 *
 * Tracer chaque entrée contre chaque sortie ferait jusqu'à seize A* pour un
 * seul tronçon. Un balayage depuis toutes les sorties à la fois donne, pour
 * chaque entrée, la distance à la plus proche d'entre elles — et laquelle :
 * le classement des couples se lit alors d'un seul parcours du pavillon, et
 * l'A* n'est payé que sur les premiers.
 */
function couplesAcces(g, A, B){
  if (A.length === 1 && B.length === 1) return [[A[0], B[0]]];
  const bal = distancesMulti(g, B);
  return A
    .filter(c => c >= 0 && bal.d[c] >= 0)
    .sort((x, y) => bal.d[x] - bal.d[y])
    .slice(0, ESSAIS_ACCES)
    .map(c => [c, B[bal.src[c]]]);
}

/**
 * Un tronçon dans un pavillon, de point à point.
 *
 * Les vrais points sont raccrochés aux extrémités : le trait doit partir du
 * stand, pas de l'allée devant lui, sinon il paraît commencer à côté.
 *
 * Des couples d'entrées proposés on garde celui dont le trait, une fois tracé
 * et les amorces posées, est le plus court : c'est la seule mesure qui soit
 * celle du visiteur.
 */
function troncon(p, pmr, depart, arrivee, objD, objA){
  const g = grille(p, pmr);
  const dD = objD && objD.d, dA = objA && objA.d;
  const A = accesDe(g, p, objD, depart), B = accesDe(g, p, objA, arrivee);
  if (!A.length || !B.length) return null;
  let mieux = null;
  for (const [a, b] of couplesAcces(g, A, B)){
    const suite = cherche(g, a, b);
    if (!suite) continue;
    const brut = reduit(g, suite);
    const chemin = lisse(g, guidageAllees() ? recentre(g, brut) : brut);
    const envers = chemin.slice().reverse();
    const pts = nettoie([depart.slice()]
      .concat(amorce(chemin, depart, faceDeSortie(p, objD, chemin[0])), chemin,
              amorce(envers, arrivee, faceDeSortie(p, objA, envers[0])),
              [arrivee.slice()]));
    const m = longueurDehors(pts, dD, dA);
    if (!mieux || m < mieux.m) mieux = { genre: "marche", p: p.i, pts: pts, m: m };
  }
  return mieux;
}

/* ------------------------------------------------------------
   Les points qu'on peut désigner
   ------------------------------------------------------------ */
/**
 * Un stand, une zone ou un repère : trois choses différentes sur le plan, un
 * seul genre de point ici — un pavillon et une position.
 *
 * Les repères comptent autant que les stands, et c'est voulu : sans
 * géolocalisation, le départ le plus probable d'un visiteur qui arrive, c'est
 * l'entrée du hall.
 */
function pointObjet(o){
  const pl = DATA.plans[o.p];
  return { cle: "o:" + o.id, id: o.id, genre: "objet", p: o.p,
           xy: (o.lc || o.c).slice(), d: o.d, obj: o,
           nom: o.nom || o.plan || (o.kind === "zone" ? "Zone" : "Stand " + (o.code || "")).trim(),
           detail: pl.libelle + (o.code ? " · " + o.code : "") };
}
function pointRepere(f, p){
  const type = pictoForme(f);
  return { cle: "r:" + f.id, id: f.id, genre: "repere", p: p.i,
           xy: f.pts[0].slice(), nom: nomRepere(f),
           detail: p.libelle + " · " + (type ? nomTypeRepere(type).toLowerCase() : "repère") };
}

/** Les points proposés pour une saisie. Sans mot-clé, les repères seuls : mille
 *  stands en vrac n'aideraient personne, une entrée si. */
function candidats(q){
  const v = q.trim().toLowerCase();
  const out = [];
  DATA.plans.forEach(p => reperesDe(p).forEach(f => {
    if (!v || String(f.txt).toLowerCase().indexOf(v) >= 0) out.push(pointRepere(f, p));
  }));
  if (!v) return out.slice(0, 12);

  const notes = [];
  for (const o of TOUS){
    if (o.kind === "zone" && !o.nom) continue;
    const code = String(o.code || "").toLowerCase();
    const nom = String(o.nom || o.plan || "").toLowerCase();
    let r = -1;
    if (code === v) r = 0;
    else if (code.indexOf(v) === 0) r = 1;
    else if (nom.indexOf(v) === 0) r = 2;
    else if (nom.indexOf(v) >= 0) r = 3;
    if (r >= 0) notes.push({ r: r, o: o });
  }
  notes.sort((a, b) => a.r - b.r || a.o.p - b.o.p ||
    COLLATION.compare(String(a.o.nom || a.o.code || ""), String(b.o.nom || b.o.code || "")));
  return out.concat(notes.slice(0, 12).map(x => pointObjet(x.o))).slice(0, 14);
}

/** Ce que désigne une saisie laissée telle quelle, si c'est sans ambiguïté. */
function pointSaisi(txt){
  const l = candidats(txt);
  const v = txt.trim().toLowerCase();
  return l.find(x => x.nom.toLowerCase() === v) || (l.length === 1 ? l[0] : null);
}

/* ------------------------------------------------------------
   Le trajet complet
   ------------------------------------------------------------ */
let ITI = { a: null, b: null, pmr: false };
let ROUTE = null;

const CLE_PMR = "plan-itineraire-pmr";
try { ITI.pmr = localStorage.getItem(CLE_PMR) === "1"; } catch (e) {}

/** Les portes d'un pavillon : ce par quoi on y entre et on en sort — c'est le
 *  même repère, les deux pictogrammes n'en faisant plus qu'un. */
function portesDe(p){
  return reperesDe(p).filter(f => pictoForme(f) === "entree");
}

/** Le meilleur tronçon entre un point et l'une des portes du pavillon. */
function versPorte(p, pmr, xy, entrant, chez){
  const portes = portesDe(p);
  if (!portes.length) return null;
  /* Le plus court se juge à l'arrivée, pas à vol d'oiseau : une porte proche
     peut être derrière une rangée de stands. On ne calcule cependant pas
     douze trajets pour rien — les quatre plus proches suffisent à trancher. */
  const proches = portes
    .map(f => ({ f: f, d: Math.hypot(f.pts[0][0] - xy[0], f.pts[0][1] - xy[1]) }))
    .sort((a, b) => a.d - b.d).slice(0, 4);
  let mieux = null;
  for (const q of proches){
    const t = entrant ? troncon(p, pmr, q.f.pts[0], xy, null, chez)
                      : troncon(p, pmr, xy, q.f.pts[0], chez, null);
    if (t && (!mieux || t.m < mieux.m)) mieux = t;
  }
  return mieux;
}

/* ------------------------------------------------------------
   Les liaisons — ce qui relie un plan à un autre
   ------------------------------------------------------------ */
/**
 * Un salon ne tient pas dans un plan.
 *
 * Un hall a deux niveaux, et le premier étage est un plan à part ; deux halls
 * voisins communiquent par une porte, et chacun est un plan. Dans les deux
 * cas le calcul s'arrêtait au bord : le trajet se coupait, et le visiteur
 * lisait « rejoignez le pavillon 7.2 » sans savoir par où. C'était honnête —
 * les données ne disent rien de ce qui relie deux plans — mais cela laissait
 * le visiteur seul à l'endroit précis où il hésite.
 *
 * Ce que les données ne disent pas, l'exploitant le sait : cet escalier-ci
 * monte à celui-là, cette porte-ci donne sur celle-là. Il le déclare donc,
 * d'un repère à l'autre, et le calcul enchaîne alors les plans comme il
 * enchaîne les allées — on marche jusqu'à l'escalier, on le prend, on repart
 * de son jumeau à l'étage.
 *
 * Seuls les repères qui sont un passage peuvent en porter une : une porte, un
 * escalier, un escalator, un ascenseur. Un WC ne relie rien, et pouvoir le
 * relier ne ferait qu'ouvrir la porte aux erreurs de saisie.
 */
const TYPES_LIAISON = {
  /* Le coût est en mètres, l'unité de la recherche : ce que l'on accepte de
     marcher en plus pour éviter ce passage. Une porte ne se paie presque
     rien ; un ascenseur s'attend, et deux étages à pied lui restent parfois
     préférables. La durée, elle, s'ajoute à celle de la marche. */
  entree:    { nom: "porte",     art: "la porte",     accessible: true,  cout: 15, min: 1 },
  escalier:  { nom: "escalier",  art: "l'escalier",   accessible: false, cout: 30, min: 1 },
  escalator: { nom: "escalator", art: "l'escalator",  accessible: false, cout: 25, min: 1 },
  /* Le seul passage vertical qu'un fauteuil emprunte : sans lui, un étage
     relié par ses seuls escaliers est simplement hors d'atteinte. */
  ascenseur: { nom: "ascenseur", art: "l'ascenseur",  accessible: true,  cout: 45, min: 2 },
};

/** Ce qu'un repère vaut comme passage, ou rien s'il n'en est pas un. */
const typeLiaison = (f) =>
  f && f.t === "repere" ? TYPES_LIAISON[pictoForme(f)] || null : null;

/** Le nom sous lequel un repère se cherche des yeux : son libellé, et à
 *  défaut le nom de ce qu'il est — une pastille de WC sans libellé s'appelle
 *  « WC », et non rien. */
const nomRepere = (f) => String(f.txt || "").trim() ||
  nomTypeRepere(pictoForme(f));

/**
 * L'annuaire des passages : chacun d'eux, et ceux qu'il rejoint.
 *
 * Une liaison s'écrit des deux côtés — on la pose d'un repère, elle apparaît
 * sur l'autre — mais on lit l'union plutôt que l'intersection : une seule des
 * deux écritures suffit à la déclarer. Un dessin repris d'un salon précédent,
 * un côté effacé par mégarde, et le passage existe toujours dans le hall :
 * le refuser au visiteur au nom d'une écriture manquante serait le punir d'un
 * détail qu'il ne voit pas.
 *
 * Les repères des calques masqués figurent dans l'annuaire — l'administration
 * doit pouvoir nommer ce qu'elle relie — mais pas dans le calcul, qui s'en
 * tient à ce que le visiteur voit.
 */
let LIAISONS = null;
function oublieLiaisons(){ LIAISONS = null; }

/**
 * Ce qu'un repère déclare rejoindre, tel qu'on le relit.
 *
 * Un repère en relie autant qu'il en dessert : l'escalier du rez-de-chaussée
 * monte au premier et au second, et ce sont deux passages, chacun avec son
 * temps. La liaison s'est d'abord écrite comme un simple identifiant ; elle
 * porte maintenant sa durée, et les deux formes se lisent — un plan
 * enregistré avant n'a rien à reprendre et retombe sur le temps ordinaire de
 * son type.
 */
function lienEcrits(f){
  return ((f && f.liens) || []).map(l => typeof l === "string"
    ? { id: l, min: null }
    : { id: l && l.id, min: l && l.min == null ? null : +l.min })
    .filter(l => l.id);
}

/* On réécrit la forme courte quand aucune durée n'est fixée : un plan qui ne
   s'en sert pas garde un enregistrement inchangé. */
function ecritLiens(f, l){
  if (!l.length) delete f.liens;
  else f.liens = l.map(x => x.min == null ? x.id : { id: x.id, min: x.min });
}

function annuaireLiaisons(){
  if (LIAISONS) return LIAISONS;
  const par = new Map();      // id du repère → { f, p, visible }
  for (const p of (DATA && DATA.plans) || []){
    for (const c of calquesDe(p)){
      for (const f of c.formes || []){
        if (typeLiaison(f)) par.set(f.id, { f: f, p: p, visible: c.visible !== false });
      }
    }
  }
  // id → (id rejoint → temps déclaré, ou rien), dans les deux sens
  const vers = new Map();
  const relie = (a, b, min) => {
    if (a === b || !par.has(a) || !par.has(b)) return;
    if (!vers.has(a)) vers.set(a, new Map());
    const m = vers.get(a);
    /* Les deux côtés portent la même durée, écrite d'un seul geste. S'ils
       divergent — une annulation qui n'a défait qu'un côté — on garde la plus
       longue : un passage annoncé trop court se paie sur place. */
    const vu = m.get(b);
    m.set(b, min == null ? (vu == null ? null : vu)
                         : (vu == null ? min : Math.max(vu, min)));
  };
  par.forEach((o, id) => lienEcrits(o.f).forEach(l => {
    relie(id, l.id, l.min); relie(l.id, id, l.min);
  }));
  LIAISONS = { par: par, vers: vers };
  return LIAISONS;
}

/** Ce qu'un repère rejoint, du point de vue de l'administration : les deux
 *  sens confondus, calques masqués compris, chacun avec son temps déclaré. */
function liensDe(f){
  const an = annuaireLiaisons();
  const out = [];
  (an.vers.get(f.id) || new Map()).forEach((min, id) => {
    const o = an.par.get(id);
    if (o) out.push({ o: o, min: min });
  });
  return out;
}

/**
 * Ce que coûte un passage dans la recherche, en mètres.
 *
 * Le forfait de son type, augmenté de ce que le temps déclaré ajoute au temps
 * ordinaire, converti en mètres au pas de marche. Un ascenseur déclaré à cinq
 * minutes devient donc aussi cher qu'un long détour, et le trajet préfère
 * l'escalier — ce qui est exactement ce qu'on veut dire en le déclarant. Le
 * prix reste positif : un passage annoncé instantané ne doit pas devenir un
 * raccourci qu'on emprunte pour rien.
 */
function coutLiaison(t, min, pmr){
  const sup = (min == null ? 0 : min - t.min) * (pmr ? ALLURE_PMR : ALLURE) * 60;
  return Math.max(5, t.cout + sup);
}

/** Un passage praticable : montré au visiteur, relié à un autre, et permis
 *  dans ce mode — un escalier n'en est pas un pour un fauteuil. */
function passagePraticable(an, id, pmr){
  const o = an.par.get(id);
  if (!o || !o.visible || !an.vers.has(id)) return null;
  const t = typeLiaison(o.f);
  return pmr && !t.accessible ? null : o;
}

/** Les passages praticables d'un plan. */
function passagesDe(p, pmr){
  const an = annuaireLiaisons(), l = [];
  an.par.forEach((o, id) => {
    if (o.p.i === p.i && passagePraticable(an, id, pmr)) l.push(o.f);
  });
  return l;
}

/** Par où l'on quitte un plan : ses portes, et les passages déclarés — un
 *  étage se quitte par son escalier, et non par la porte du hall d'en bas. */
function sortiesDe(p, pmr){
  const l = portesDe(p);
  for (const f of passagesDe(p, pmr)) if (l.indexOf(f) < 0) l.push(f);
  return l;
}

/** Les couples de plans qu'un passage joint directement, pour qui n'a besoin
 *  que de savoir s'ils le sont. */
function plansRelies(pmr){
  const an = annuaireLiaisons(), out = new Set();
  an.vers.forEach((suite, id) => {
    const o = passagePraticable(an, id, pmr);
    if (!o) return;
    suite.forEach((min, idv) => {
      const v = passagePraticable(an, idv, pmr);
      if (v) out.add(o.p.i + "|" + v.p.i);
    });
  });
  return out;
}

/* ------------------------------------------------------------
   Le chemin qui passe d'un plan à l'autre
   ------------------------------------------------------------ */
/**
 * La distance de marche depuis un point vers tout le reste du pavillon.
 *
 * Un balayage en largeur, comme pour la journée : chercher un A* par couple
 * de passages coûterait davantage pour un chiffre qu'on ne fait que comparer.
 * Le tracé montré au visiteur, lui, reste celui de `troncon`.
 */
const BALAYAGES = new Map();
function balayage(p, pmr, xy, chez){
  const cle = p.id + (pmr ? "|pmr" : "") + "|" + xy[0].toFixed(2) + "," + xy[1].toFixed(2);
  const garde = BALAYAGES.get(cle);
  if (garde) return garde;
  const g = grille(p, pmr);
  /* On ne sort pas d'un emplacement en traversant son voisin : l'accroche s'en
     tient à l'emprise du sien, quand on sait laquelle c'est. */
  const c = accroche(g, xy, chez);
  const b = { g: g, d: c >= 0 ? distancesDepuis(g, c) : null };
  BALAYAGES.set(cle, b);
  return b;
}

/** Rend -1 quand aucune allée ne mène au point demandé. */
function distanceDepuis(bal, xy, chez){
  if (!bal.d) return -1;
  const c = accroche(bal.g, xy, chez);
  if (c < 0) return -1;
  return bal.d[c] >= 0 ? bal.d[c] * PAS_GRILLE : -1;
}

/* Ce qu'on s'autorise de balayages pour un trajet. Chacun parcourt un
   pavillon entier case par case — quelques dizaines de millisecondes, plus
   sur un téléphone. Une vingtaine couvre tout salon réel ; la borne n'est là
   que pour l'exploitant qui relierait tout à tout, et le trajet reste alors
   le meilleur de ceux qu'on a eu le temps d'examiner. */
const LIMITE_BALAYAGES = 20;

/**
 * Le chemin le plus court d'un point à un autre, passages compris.
 *
 * Dijkstra sur un graphe minuscule : les deux bouts du trajet et les passages
 * praticables. Une arête de marche coûte les mètres d'allée qui séparent deux
 * points d'un même plan ; une arête de passage coûte le forfait de son type.
 * Les distances de marche ne se calculent qu'au moment où un nœud est retenu,
 * et jamais deux fois : un salon dont les plans ne se relient pas ne fait
 * donc qu'un balayage avant de rendre les armes.
 *
 * Rend la suite des sauts, ou rien si les liaisons déclarées ne mènent pas de
 * l'un à l'autre.
 */
function cheminLiaisons(a, b, pmr){
  const an = annuaireLiaisons();
  if (!an.vers.size) return null;

  /* Les deux bouts du trajet peuvent être des emplacements : ils gardent leur
     emprise et leur objet, dont dépendent l'accroche à l'allée et l'amorce. Un
     passage, lui, n'est qu'un point. */
  const noeuds = [{ ip: a.p, xy: a.xy.slice(), d: a.d, obj: a.obj },
                  { ip: b.p, xy: b.xy.slice(), d: b.d, obj: b.obj }];
  const rang = new Map();
  /* Un escalier ne relie rien pour un fauteuil : le mode accessible retire le
     passage du graphe plutôt que de le pénaliser, faute de quoi il finirait
     par le proposer là où il n'y a rien d'autre. */
  an.par.forEach((o, id) => {
    if (!passagePraticable(an, id, pmr)) return;
    rang.set(id, noeuds.length);
    noeuds.push({ ip: o.p.i, xy: o.f.pts[0].slice(), id: id, f: o.f, t: typeLiaison(o.f) });
  });
  if (noeuds.length < 4) return null;   // il faut au moins les deux bouts d'un passage

  const n = noeuds.length;
  const D = new Float64Array(n).fill(Infinity);
  const vient = new Array(n).fill(null);
  const vu = new Uint8Array(n);
  D[0] = 0;
  let balayages = 0;

  for (;;){
    let u = -1;
    for (let i = 0; i < n; i++) if (!vu[i] && D[i] < Infinity && (u < 0 || D[i] < D[u])) u = i;
    if (u < 0 || u === 1) break;        // plus rien à ouvrir, ou l'arrivée est arrêtée
    vu[u] = 1;

    /* Emprunter le passage : son prix est celui du passage, et non d'un
       chemin — on ne marche pas dans un escalier, on le monte. */
    const suite = noeuds[u].id ? an.vers.get(noeuds[u].id) : null;
    if (suite) suite.forEach((dit, idv) => {
      const v = rang.get(idv);
      /* Un passage joint deux plans. Deux repères du même plan reliés l'un à
         l'autre — ce que l'administration ne propose pas, mais qu'une reprise
         de données peut porter — feraient un raccourci que personne ne peut
         emprunter : on l'ignore plutôt que de tracer un trajet impossible. */
      if (v === undefined || vu[v] || noeuds[v].ip === noeuds[u].ip) return;
      /* Le temps du passage est celui fixé pour ce couple-ci, et à défaut
         celui de son type : le même escalier met une minute au premier étage
         et davantage au second. */
      const min = dit == null ? noeuds[u].t.min : dit;
