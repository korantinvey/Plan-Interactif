  if (!filtre()) return true;
  return dansCriteres(o) &&
    (!state.qn || (o.rech || "").includes(state.qn));
}

/* Les stands qu'une société hébergée éclaire. Le plan doit rester allumé sur
   le stand où l'on va la trouver, alors qu'il porte le nom d'un autre : c'est
   le seul endroit où une enseigne répond pour son hôte. Le relevé se refait à
   chaque changement de filtre, et non à chaque stand dessiné. */
let HOTES = new Set();
const releveHotes = () => {
  HOTES = new Set(HEBERGES.filter(visible).map(x => x.id));
};

/**
 * Ce que le plan garde allumé : ce que la liste retient, plus les stands qui
 * hébergent une société retenue.
 */
function visibleSurPlan(o){
  return visible(o) || (filtre() && o.kind === "stand" && HOTES.has(o.id));
}

/**
 * Ce qu'un stand dessiné suit : le filtre de la société qu'il désigne, et non
 * celui de l'emplacement. Une hébergée écartée par un critère doit s'éteindre
 * quand bien même son hôte reste allumé — c'est justement pour la distinguer
 * de lui qu'on l'a dessinée.
 */
function visibleSociete(o, i){
  if (!(i >= 0)) return visibleSurPlan(o);
  const h = PAR_HEBERGE.get(o.id + "#" + i);
  return h ? visible(h) : visibleSurPlan(o);
}

function appliqueFiltre(){
  releveHotes();
  document.querySelectorAll("#stands g, #zones g").forEach(g => {
    const o = parId.get(g.dataset.id);
    g.classList.toggle("dim", !!o && !visibleSurPlan(o));
  });
  document.querySelectorAll("#couches .dcal .sdes[data-id]").forEach(g => {
    const o = parId.get(g.dataset.id);
    g.classList.toggle("dim", !!o && !visibleSociete(o, Number(g.dataset.soc)));
  });
  libelles(); liste();
}

/* L'ordre des sortes dans les résultats. On cherche un exposant neuf fois sur
   dix : les stands passent devant, puis les endroits du salon, puis le
   programme — le plus nombreux, et le moins souvent visé. Une hébergée se range
   avec les stands, c'est un exposant comme un autre. Ce rang prime sur le
   pavillon : trois sortes entremêlées par pavillon ne se lisaient plus. */
const RANGS = { stand: 0, coex: 0, zone: 1, conf: 2 };
const rangSorte = (o) => RANGS[o.kind] || 0;

/** Combien de lignes d'une même sorte la liste veut bien poser. Au-delà, on
 *  n'a plus une liste mais un annuaire : c'est le mot-clé qu'il faut préciser,
 *  et le compte au-dessus le dit. */
const PLAFOND_SORTE = 500;

/* Le premier bloc d'une ligne porte le numéro de stand ; une zone et une
   conférence n'en ont pas, et laisser la case vide effaçait justement ce qui
   les distingue d'un stand sans numéro. Elle dit alors la sorte. */
const CASE_SORTE = { zone: "Zone", conf: "Conf" };

/**
 * Ce que la case affiche.
 *
 * Deux emplacements réunis arrivent séparés par un tiret entouré d'espaces —
 * « D70 - E71 ». Ces espaces sont les seuls endroits où le numéro accepte de
 * se couper : dans une case étroite, il s'y coupait, et la liste alignait des
 * numéros en deux morceaux empilés. Le tiret dit déjà la réunion, les espaces
 * n'y ajoutent rien.
 */
const codeCase = (o) => CASE_SORTE[o.kind] ||
  String(o.code || "").replace(/\s*([-–—\/])\s*/g, "$1").trim() || "—";

/**
 * La case du numéro, de même largeur sur toutes les lignes.
 *
 * Une case taillée ligne à ligne mettrait les noms en escalier ; la case fixe
 * qu'elle remplace coupait les numéros doubles. C'est donc le plus long numéro
 * du salon qui la règle — et non le plus long des résultats affichés, qui
 * ferait sauter la colonne des noms à chaque frappe.
 *
 * Un plafond garde au nom la place qui lui revient sur un téléphone : passé
 * lui, c'est la police du numéro qui cède, plutôt que la case. Elle a son
 * propre plancher, sans quoi un numéro aberrant — il en arrive — rendrait
 * illisibles les huit cents autres pour tenir tout entier.
 */
const CASE_MIN = 48, CASE_MAX = 92, CASE_CADRE = 10, CASE_POLICE = 11.5;
function caseNumero(){
  let w = 0;
  for (const o of TOUS)
    if (o.kind === "stand" && o.code) w = Math.max(w, largeur(codeCase(o), P_CODE));
  w *= CASE_POLICE;
  const place = CASE_MAX - CASE_CADRE;
  return {
    l: Math.round(Math.min(Math.max(w + CASE_CADRE, CASE_MIN), CASE_MAX)),
    f: w > place ? Math.max(9, CASE_POLICE * place / w) : CASE_POLICE,
  };
}

/**
 * Ce que la seconde ligne ajoute : pour une conférence, quand et où.
 *
 * Un titre seul ne distingue pas deux sessions d'un programme qui en compte
 * trois cents, et « quand » est la première question qu'on se pose en en
 * trouvant une : le jour s'abrège pour tenir sur la ligne, la fiche l'écrit en
 * toutes lettres.
 */
function sousLigne(o){
  if (o.kind !== "conf") return "";
  const d = momentLocal(o.debutLocal, DATA.fuseau) || momentLocal(o.debut, DATA.fuseau);
  const quand = d
    ? JOURS[new Date(d.an, d.mois - 1, d.jour).getDay()].slice(0, 3) + ". " +
      d.jour + " · " + d.h + "h" + d.min
    : "";
  return [quand, o.salle].filter(Boolean).join(" · ");
}

function liste(){
  const box = $("list");
  const q = state.qn;
  // un critère retenu déborde le pavillon affiché, comme un mot-clé
  const tout = filtre();
  /* Les sociétés hébergées rejoignent la liste dès qu'on cherche une société,
     et non un emplacement : par son nom, par ce qu'elle vient faire là, ou par
     l'un des champs que l'exploitant propose en critère. Ceux-là sont à elle,
     pas à son hôte — l'en écarter la rendrait introuvable justement là où on la
     cherche. Le secteur fait exception : porté par l'emplacement seul, il ne
     les fait pas paraître. Sans rien de tout cela, la liste reste le sommaire
     des emplacements, et son compte celui qu'annonce l'en-tête. */
  const parSociete = Boolean(q) || critParSociete();
  /* Le programme ne rejoint la liste que sur un mot-clé. Un critère ne dit rien
     d'une conférence, et le sommaire d'un pavillon est celui de ses
     emplacements : ajouter là trois cents sessions noierait les stands qu'on
     est venu parcourir. */
  const portee = (parSociete ? TOUS.concat(HEBERGES) : tout ? TOUS : P().stands)
    .concat(q ? CONFERENCES : []);
  const vus = portee.filter(visible).sort((a, b) =>
    (rangSorte(a) - rangSorte(b)) ||
    (a.p - b.p) ||
    ((a.nom ? 0 : 1) - (b.nom ? 0 : 1)) ||
    COLLATION.compare(String(a.nom || a.code || ""), String(b.nom || b.code || "")));

  $("countTxt").textContent = vus.length + (vus.length > 1 ? " résultats" : " résultat") +
    (tout ? " · tous pavillons" : " · " + P().libelle);

  /* Le plafond se compte par sorte, et non sur la liste entière : les stands
     passant devant, une recherche large le remplissait à eux seuls et les
     zones comme le programme, rangés derrière, disparaissaient sans que rien
     ne le dise — alors que le compte annoncé, lui, les avait comptés. */
  const tenus = new Map();
  const montres = vus.filter(o => {
    const r = rangSorte(o), n = (tenus.get(r) || 0) + 1;
    tenus.set(r, n);
    return n <= PLAFOND_SORTE;
  });

  const boite = caseNumero();
  box.style.setProperty("--caseL", boite.l + "px");
  box.style.setProperty("--caseF", boite.f.toFixed(2) + "px");

  box.innerHTML = montres.length ? montres.map(o => {
    const heberge = o.kind === "coex";
    /* La liste ne porte que ce qui aide à retrouver quelqu'un : son numéro de
       stand et son nom. La surface louée et les angles ouverts regardent la
       commercialisation, jamais le visiteur : ils ne s'affichent nulle part. */
    const conf = o.kind === "conf";
    // une conférence que rien ne situe encore n'est dans aucun pavillon : celui
    // qui l'a remontée n'en dit rien au visiteur
    const badge = o.p !== state.plan && !(conf && !o.situee)
      ? '<span class="hall">' + esc(DATA.plans[o.p].court) + '</span>' : "";
    const rang = heberge ? o.i : -1;
    const sous = sousLigne(o);
    return '<button class="row" data-id="' + esc(o.id) +
      '" data-sorte="' + o.kind + '" data-soc="' + rang +
      // une conférence n'est pas un objet du plan : rien ne peut la désigner
      '" aria-current="' + (!conf && state.sel === o.id && state.selSoc === rang) + '">' +
      '<span class="code">' + esc(codeCase(o)) + '</span>' +
      '<span><span class="nm">' + esc(o.nom || o.plan ||
        (o.kind === "zone" ? "Zone sans nom" : ("Stand " + (o.code || "")).trim())) + '</span>' +
      '<span class="s">' + esc(sous) + badge + '</span></span></button>';
  }).join("")
    : '<div class="empty">Aucun résultat dans les ' + DATA.plans.length + ' pavillons.</div>';
  /* Le canal dit d'où vient l'ouverture : la même liste sert de résultat de
     recherche quand un mot-clé est saisi, et de sommaire du pavillon sinon.

     Un rang part avec l'identifiant, et la fiche s'ouvre droit sur la société
     du rang cliqué : la liste vient de la nommer, redemander laquelle on veut
     serait une question dont on a déjà la réponse.

     Une conférence n'est pas un emplacement : `select` ne saurait pas la
     cadrer, et c'est sa fiche qu'on ouvre — d'où elle offre de situer sa
     salle sur le plan. */
  box.querySelectorAll(".row").forEach(b => b.onclick = () => {
    if (b.dataset.sorte === "conf"){ ficheConf(b.dataset.id, "recherche"); return; }
    select(b.dataset.id, true, parSociete ? "recherche" : "liste",
           Number(b.dataset.soc));
  });
}

/* ============================================================
   6. Vue
   ============================================================ */
const appliqueVue = () => {
  svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
  if (typeof dessinePoignees === "function") dessinePoignees();
  // le trait de l'itinéraire garde son épaisseur ; ses pastilles, non
  if (typeof rafraichitBouts === "function") rafraichitBouts();
};
/* Rafraîchir la vue coûte deux choses de nature très différente. Poser le
   « viewBox » est immédiat. Recalculer les libellés parcourt les cinq cents
   objets du pavillon et mesure chaque texte pour décider s'il tient et s'il
   reste lisible : près de six millisecondes sur un poste de bureau, bien
   davantage sur un téléphone, là où une image n'en a que seize.

   Pendant un geste on ne fait donc que le premier, et une seule fois par
   image — un écran tactile échantillonne souvent deux fois plus vite qu'il
   n'affiche, et le travail était fait deux fois pour rien. Les libellés
   attendent : leur taille étant exprimée en mètres, ils grandissent avec le
   plan sans qu'on y touche. Seul leur tri par lisibilité patiente, jusqu'à la
   fin du geste ou une pause de la main. */
let imageDemandee = null, libellesEnAttente = null;

/** Pendant un geste : le strict nécessaire, une fois par image. */
function rafraichitVue(){
  if (!imageDemandee){
    imageDemandee = requestAnimationFrame(() => {
      imageDemandee = null;
      appliqueVue(); echelle();
    });
  }
  clearTimeout(libellesEnAttente);
  libellesEnAttente = setTimeout(() => { libellesEnAttente = null; libelles(); }, 150);
}

/** À la fin d'un geste, ou pour un saut de vue : tout, sans attendre. */
function poseVue(){
  if (imageDemandee){ cancelAnimationFrame(imageDemandee); imageDemandee = null; }
  clearTimeout(libellesEnAttente); libellesEnAttente = null;
  appliqueVue(); echelle(); libelles();
}

/**
 * Hauteur, en pixels, de ce que le tiroir ou la fiche cachent en bas du plan.
 *
 * Le cadre du plan occupe tout l'écran sur mobile, mais on n'en voit pas tout :
 * cadrer sur le cadre entier pousse une partie du plan sous le tiroir. Toute
 * mise en vue passe donc par cette mesure — l'ajustement comme le centrage sur
 * un stand, y compris celui déclenché par le cartouche des points d'intérêt.
 *
 * On raisonne sur les hauteurs au repos, jamais sur la position d'un élément en
 * cours de glissement : `offsetHeight` ignore la transformation, et la fiche
 * qui s'ouvre replie le tiroir sous elle.
 */
function masque(){
  if (!ETROIT()) return 0;
  const r = svg.getBoundingClientRect();
  const fiche = $("detail"), tiroir = $("side");
  const ficheOuverte = !!fiche && fiche.classList.contains("open");
  let bas = ficheOuverte ? fiche.offsetHeight : 0;
  /* L'itinéraire occupe la même bande, et c'est en l'ouvrant qu'on demande à
     cadrer sur le trajet : l'oublier ici reviendrait à le tracer sous lui. */
  const iti = $("itineraire");
  if (iti && iti.classList.contains("open")) bas = Math.max(bas, iti.offsetHeight);
  if (tiroir){
    bas = Math.max(bas, ficheOuverte
      ? parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--replie")) || 164
      : r.bottom - tiroir.getBoundingClientRect().top);
  }
  // au-delà, il ne resterait plus assez de plan pour que le cadrage ait un sens
  return Math.max(0, Math.min(r.height * .6, bas));
}

function fit(){
  const r = svg.getBoundingClientRect();
  const cache = masque();
  const hUtile = Math.max(60, r.height - cache);
  const w = emp.x1 - emp.x0, h = emp.y1 - emp.y0;
  const k = Math.max(w / (r.width || 1), h / hUtile);
  view = { x: emp.x0 + w / 2 - (k * r.width) / 2,
           // le plan se centre dans la bande visible, pas dans le cadre entier
           y: emp.y0 + h / 2 - (k * r.height) / 2 + (k * cache) / 2,
           w: k * r.width, h: k * r.height };
  poseVue();
}
function zoom(f, cx, cy){
  const nw = Math.min((emp.x1 - emp.x0) * 2.5, Math.max(6, view.w * f)), k = nw / view.w;
  view = { x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k, w: nw, h: view.h * k };
  rafraichitVue();
}
function echelle(){
  const r = svg.getBoundingClientRect();
  const mParPx = view.w / (r.width || 1);
  const pas = [1, 2, 5, 10, 20, 50, 100, 200].find(p => p >= mParPx * 90) || 200;
  $("scaleBar").style.width = (pas / mParPx) + "px";
  $("scaleTxt").textContent = pas + " m";
}

/* ============================================================
   7. Sélection et fiche
   ============================================================ */
const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null;
/** Écran étroit : la liste et la fiche sont des tiroirs, pas des panneaux. */
const ETROIT = () => matchMedia("(max-width:900px)").matches;

function anime(rect, sens){
  const p = $("detail");
  if (anim){ anim.cancel(); anim = null; }
  /* Sur mobile la fiche glisse depuis le bas : une mise à l'échelle depuis la
     forme cliquée se battrait avec ce glissement. La transition CSS suffit. */
  if (REDUIT || !rect || ETROIT()){ if (sens < 0) p.classList.remove("open"); return; }
  const b = p.getBoundingClientRect();
  p.style.transformOrigin = (rect.left + rect.width / 2 - b.left) + "px " +
                            (rect.top + rect.height / 2 - b.top) + "px";
  const seed = { transform: "scale(" + Math.max(.05, rect.width / b.width) + "," +
                            Math.max(.03, rect.height / b.height) + ")", opacity: 0 };
  const plein = { transform: "none", opacity: 1 };
  anim = p.animate(sens > 0 ? [seed, plein] : [plein, seed],
    { duration: sens > 0 ? 340 : 200,
      easing: sens > 0 ? "cubic-bezier(.16,.84,.3,1)" : "cubic-bezier(.4,0,.75,.2)" });
  if (sens < 0) anim.finished.then(() => p.classList.remove("open"), () => {});
}
/* La forme de l'emplacement, et non ce qu'un calque a posé dessus : un logo
   ou un stand dessiné porte le même identifiant, et c'est bien le stand qu'on
   veut allumer, cadrer et animer.

   Sauf quand un découpage matérialise justement la société choisie : lui et
   son hôte portent alors le même identifiant, et allumer les deux donnerait à
   voir un grand stand allumé pour désigner le petit qui est dedans. */
function noeud(id, iSoc){
  const d = decoupeStand(id, iSoc);
  if (d) return d;
  const q = '[data-id="' + CSS.escape(id) + '"]';
  return svg.querySelector("#zones " + q + ", #stands " + q) || svg.querySelector(q);
}

/* Trois façons d'atteindre un stand depuis le plan : sa forme, le logo que
   l'exploitant a posé dessus, ou le découpage qu'il y a dessiné. Le logo seul
   fait un chemin à part — les deux autres sont le plan tel qu'on le voit. */
function canalPlan(cible){
  if (!cible || !cible.dataset.f) return "plan";
  const c = formeParId(cible.dataset.f);
  return c && c.f.t === "image" ? "image" : "plan";
}

/** Le rang de la société désignée par un nœud du plan, s'il en désigne une :
 *  un stand dessiné nomme la sienne, une forme d'emplacement ne le fait pas. */
const rangSociete = (el) =>
  el && el.dataset.soc !== undefined ? Number(el.dataset.soc) : undefined;

/**
 * `iSoc` désigne la société qu'on vient voir sur un stand partagé. Absent, la
 * fiche demandera laquelle : c'est le cas d'un clic sur le plan, où l'on a
 * désigné une forme et non un nom. La liste, elle, le passe — elle vient de
 * nommer celle qu'on a choisie.
 */
function select(id, recentrer, canal, iSoc){
  const o = parId.get(id);
  if (!o) return;
  if (o.p !== state.plan){          // l'objet vit dans un autre pavillon
    state.plan = o.p; montePlan(); fit();
  }
  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  state.sel = id;
  state.selSoc = iSoc === undefined ? -1 : iSoc;
  const n = noeud(id, state.selSoc); if (n) n.classList.add("sel");
  dessineMarques();
  marqueStandsDessines();
  if (recentrer && !ETROIT()) centre(o);
  liste(); libelles();
  ouvre(o, n ? n.getBoundingClientRect() : null, canal, iSoc);
  /* Sur mobile on ne cadre qu'une fois la fiche ouverte : c'est elle qui
     décide de la hauteur masquée, et la mesurer avant reviendrait à cadrer
     sur une géométrie déjà périmée. Sur grand écran l'ordre inverse tient,
     car l'animation de la fiche part de la forme telle qu'elle est cadrée. */
  if (recentrer && ETROIT()) centre(o);
}
const centre = (o) => centrePoint(o.c);

/* Un repère n'est pas un objet du plan et n'a pas de centre à lui : il n'a
   qu'un point. C'est tout ce qu'il faut pour cadrer. */
function centrePoint(xy){
  const w = Math.min(view.w, 55), h = w * (view.h / view.w);
  /* Centrer au milieu du cadre placerait la cible derrière le tiroir ou la
     fiche. On la remonte au milieu de ce qui reste visible — d'après la
     hauteur réellement masquée, et non une proportion supposée. */
  const r = svg.getBoundingClientRect();
  const decale = r.height ? (h * masque()) / (2 * r.height) : 0;
  view = { x: xy[0] - w / 2, y: xy[1] - h / 2 + decale, w: w, h: h };
  poseVue();
}
/**
 * Un champ paraît-il sur la fiche ? L'exploitant en décide depuis la console.
 * Une entrée absente vaut « affiché », pour qu'un champ ajouté plus tard ne
 * disparaisse pas des salons déjà réglés.
 */
function montre(type, cle){
  const r = DATA && DATA.fiche && DATA.fiche[type];
  return !r || r[cle] !== false;
}

/* L'ordre de lecture du corps d'une fiche de stand, tel qu'il vaut tant que
   l'exploitant n'y a pas touché.

   Le même tableau vit dans la console — « ORDRE_FICHE_DEFAUT » de
   « _console-js.html » — qui propose de le remanier : les deux se suivent.
   N'y figure que le corps ; le numéro de stand et la pastille des nouveaux
   venus tiennent dans l'en-tête, les conférences ont leur propre volet, et
   rien de tout cela ne se déplace. */
const ORDRE_CORPS_FICHE = ["raison", "secteur", "adresse", "ville", "pays",
  "niveaux", "telephone", "site", "facebook", "linkedin", "instagram",
  "nomenclature", "thematiques"];

/* Les intitulés du corps de la fiche. Ils vivent dans une table plutôt qu'en
   toutes lettres à leur ligne parce qu'ils s'écrivent à deux endroits : sur la
   fiche, et dans l'aperçu des modèles du panneau d'apparence. Un aperçu qui ne
   nommerait pas les champs comme la fiche ne montrerait pas la fiche. */
const LIBELLE_CORPS = {
  raison: "Raison sociale", secteur: "Secteur", adresse: "Adresse",
  ville: "Ville", pays: "Pays", niveaux: "Niveaux", telephone: "Téléphone",
  site: "Site web", facebook: "Facebook", linkedin: "LinkedIn",
  instagram: "Instagram", nomenclature: "Nomenclature", thematiques: "Thématiques",
};

/** L'intitulé d'un champ du corps — un champ propre au salon porte le sien. */
const libelleCorps = cle => cle.indexOf(PREFIXE_PERSO) === 0
  ? libelleCritere(cle) : (LIBELLE_CORPS[cle] || cle);

/**
 * L'ordre réglé par l'exploitant, complété de ce qu'il ne connaît pas encore.
 *
 * Un champ ajouté après coup — au code, ou par le salon — ne figure pas dans
 * la liste enregistrée. L'oublier le ferait disparaître de la fiche, et le
 * rejeter à la fin le sortirait de son voisinage sans qu'on l'ait demandé : il
 * reprend donc la place que le défaut lui donne, derrière le champ qu'il y
 * suit.
 */
function ordreCorps(persos){
  const defaut = ORDRE_CORPS_FICHE.concat(persos || []);
  const regle = ((DATA && DATA.fiche && DATA.fiche.ordre) || [])
    .filter(c => defaut.indexOf(c) >= 0);
  if (!regle.length) return defaut;
  const sortie = regle.slice();
  defaut.forEach((c, i) => {
    if (sortie.indexOf(c) >= 0) return;
    // le premier voisin de gauche que le réglage connaît donne le point d'entrée
    let j = -1;
    for (let k = i - 1; k >= 0 && j < 0; k--) j = sortie.indexOf(defaut[k]);
    sortie.splice(j + 1, 0, c);
  });
  return sortie;
}

/**
 * Le programme d'une zone, en vignettes chronologiques.
 *
 * L'heure vient d'Eventmaker sous sa forme locale — « 03/14/2026 10:30 » — ce
 * qui évite de deviner le fuseau du salon depuis le navigateur d'un visiteur
 * qui peut être ailleurs. On la relit telle quelle plutôt que d'en faire une
 * date, dont le rendu dépendrait justement du fuseau.
 */
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
              "août", "septembre", "octobre", "novembre", "décembre"];

/**
 * L'heure d'une conférence, dans le fuseau du salon.
 *
 * Eventmaker donne deux formes. « 03/14/2026 10:30 » est l'heure locale du
 * salon : on la relit telle quelle, c'est la seule qui ne demande rien. La
 * forme ISO, elle, porte un décalage — souvent Z — qu'il faut ramener au
 * fuseau de l'événement, sans quoi un visiteur d'un autre pays lirait des
 * horaires faux.
 */
function momentLocal(v, fuseau){
  const t = String(v || "");
  const m = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/.exec(t);
  if (m){
    return { jour: +m[2], mois: +m[1], an: +m[3], h: m[4].padStart(2, "0"), min: m[5],
             cle: m[3] + m[1] + m[2] };
  }
  const d = new Date(t);
  if (isNaN(d)) return null;
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", {
      timeZone: fuseau || undefined, year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(d).map(x => [x.type, x.value]));
    return { jour: +p.day, mois: +p.month, an: +p.year,
             h: String(p.hour).padStart(2, "0"), min: p.minute,
             cle: p.year + p.month + p.day };
  } catch (e) {
    return null;   // fuseau inconnu : mieux vaut taire l'heure que la fausser
  }
}

/** Le programme d'une zone, ou celui d'un exposant : la même liste, rendue. */
function programme(l, titre){
  l = l || [];
  if (!l.length) return "";
  /* La classe nomme le bloc du programme : deux modèles de fiche le traitent
     à part — l'un le déroule en ligne de temps, l'autre lui laisse son libellé
     quand il efface tous les autres. */
  let out = '<div class="field prog-bloc"><span class="eyebrow">' + esc(titre || "Programme") +
    '</span><div class="prog">';
  let jourCourant = null;
  for (const c of l){
    const fz = DATA.fuseau;
    const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
    const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);
    if (d && d.cle !== jourCourant){
      jourCourant = d.cle;
      const dt = new Date(d.an, d.mois - 1, d.jour);
      out += '<div class="jour">' + esc(JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1]) + '</div>';
    }
    const heure = d ? d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "") : "";
    /* Le signet se pose à côté de la vignette et non dedans : un bouton n'en
       contient pas un autre, et l'appui doit choisir entre lire et retenir. */
    out += '<div class="confRang">' +
      '<button type="button" class="conf" data-conf="' + esc(c.id) + '"' +
      (c.couleur ? ' style="--tc:' + esc(c.couleur) + '"' : "") + '>' +
      (heure ? '<span class="h">' + esc(heure) + '</span>' : "") +
      '<span class="t">' + esc(c.nom) + '</span>' +
      (c.type ? '<span class="ty">' + esc(c.type) + '</span>' : "") +
      '</button>' + signetParcours("conf", c.id) + '</div>';
  }
  return out + '</div></div>';
}

/** Une date écrite en toutes lettres : « samedi 14 mars 2026 ». */
function jourLong(d){
  if (!d) return "";
  const dt = new Date(d.an, d.mois - 1, d.jour);
  return JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1] + " " + d.an;
}

/**
 * La fiche d'une conférence. Le programme d'une zone ne montre que l'essentiel
 * — l'heure et le titre — parce qu'il en aligne parfois vingt ; le reste,
 * description comprise, tient ici.
 */
function ficheConf(id, canal){
  // l'index est global : une conférence retenue peut se tenir dans un autre
  // pavillon que celui qu'on regarde
  const c = CONFS.get(String(id));
  if (!c) return;
  mesure("fiche_conf", canal, String(id));
  const fz = DATA.fuseau;
  const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
  const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);

  ouvreModale(c.nom, corps => {
    const bloc = (l, v, cls) => {
      if (!v) return;
      const w = document.createElement("div");
      w.className = "field" + (cls ? " " + cls : "");
      w.innerHTML = '<span class="eyebrow"></span><span class="v"></span>';
      w.querySelector(".eyebrow").textContent = l;
      w.querySelector(".v").textContent = v;
      corps.appendChild(w);
    };
    if (c.type){
      const t = document.createElement("div");
      t.className = "conf-type";
      if (c.couleur) t.style.setProperty("--tc", c.couleur);
      t.textContent = c.type;
      corps.appendChild(t);
    }
    bloc("Quand", d
      ? jourLong(d) + " · " + d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "")
      : "");
    bloc("Où", c.salle);
    /* Qui la tient, et où le trouver : le numéro de stand situe l'exposant et
       sa fiche s'ouvre d'un appui — c'est souvent pour lui qu'on lisait le
       programme. Ils peuvent être plusieurs, y compris depuis deux pavillons,
       d'où la liste plutôt qu'une ligne. */
    const tenue = (EXPOSANTS.get(String(id)) || [])
      .map(e => ({ e: e, o: parId.get(e.stand) }))
      .filter(x => x.o || x.e.nom);
    if (tenue.length){
      const w = document.createElement("div");
      w.className = "field";
      w.innerHTML = '<span class="eyebrow"></span><div class="expos"></div>';
      w.querySelector(".eyebrow").textContent = "Organisée par";
      const hote = w.querySelector(".expos");
      tenue.forEach(x => {
        const o = x.o;
        const code = o && montre("stand", "code") && o.code ? o.code : "";
        // le pavillon n'apprend rien tant que c'est celui qu'on regarde
        const ou = [o && o.p !== state.plan ? DATA.plans[o.p].libelle : "", code]
          .filter(Boolean).join(" · ");
        // un stand absent du plan — filtré, ou d'un pavillon non publié — se
        // lit quand même, il ne se clique pas
        const el = document.createElement(o ? "button" : "div");
        el.className = "expo" + (o ? "" : " statique");
        if (o) el.type = "button";
        el.innerHTML = '<span class="n"></span><span class="c"></span>';
        el.querySelector(".n").textContent =
          (o && (o.nom || o.plan)) || x.e.nom || ("Stand " + code).trim();
        el.querySelector(".c").textContent = ou;
        /* La fiche de l'exposant prend la place de celle de la conférence, et
           le plan se recentre sur son stand — au besoin en changeant de
           pavillon, ce dont `select` se charge. */
        if (o) el.onclick = () => { fermeModale(); select(o.id, true, "conference"); };
        hote.appendChild(el);
      });
      corps.appendChild(w);
    }
    bloc("Thématique", c.theme);
    bloc("Présentation", c.texte, "large");
    const acts = document.createElement("div");
    acts.className = "acts";
    acts.innerHTML = boutonParcours("conf", c.id);
    /* « Où » nomme la salle ; encore faut-il la trouver. La zone qui l'abrite
       est le seul point du plan que la conférence désigne — et elle peut se
       tenir dans un autre pavillon que celui qu'on regarde. */
    if (c.zone && parId.has(String(c.zone))){
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = "Situer sur le plan";
      b.onclick = () => { fermeModale(); select(String(c.zone), true); };
      acts.appendChild(b);
    }
    corps.appendChild(acts);
    brancheParcours(corps);
  }, [{ libelle: "Fermer", genre: "primaire" }]);
}

/**
 * Une adresse en lien cliquable, affichée sans son protocole.
 *
 * Les champs de réseaux sociaux sont saisis à la main : tantôt une adresse
 * complète, tantôt un simple nom de compte. On complète ce qui manque plutôt
 * que d'afficher un lien mort.
 */
function lien(v){
  let u = String(v == null ? "" : v).trim().replace(/\\/g, "");
  if (!u) return "";
  if (!/^https?:/i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' +
         esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, "")) + '</a>';
}

/* Un appui tactile produit, quelque trois cents millisecondes plus tard, un
   clic de compatibilité aux mêmes coordonnées. La fiche venant d'apparaître
   sous le doigt, ce clic fantôme la refermait aussitôt — d'où l'impression
   d'un double clic — ou suivait un lien qu'elle contient. On la rend
   insensible le temps qu'il passe, et seulement après un appui : à la souris,
   rien ne justifierait ce temps mort. */
let dernierAppuiTactile = false;
let degel = null;

function ecarteClicFantome(){
  if (!dernierAppuiTactile) return;
  const zones = [$("detail"), $("voile"), $("modale")].filter(Boolean);
  zones.forEach(z => { z.style.pointerEvents = "none"; });
  clearTimeout(degel);
  degel = setTimeout(() => zones.forEach(z => { z.style.pointerEvents = ""; }), 450);
}

/** Le nom sous lequel une société se présente sur un stand. */
const nomSociete = (x) => x.nom || x.plan || "Sans nom";

/**
 * Les sociétés d'un stand, celle qui le loue en tête.
 *
 * Elle est le stand lui-même : c'est son dossier qui l'a désignée à la
 * synchronisation, et ses champs sont posés à plat sur lui. Les autres vivent
 * dans « coex », dans l'ordre où la source les a rendues.
 *
 * Le rang les distingue, la liste ne le dit pas : qui loue et qui est hébergé
 * relève du contrat entre l'organisateur et ses exposants. Un visiteur cherche
 * une enseigne, pas sa place dans un bail.
 */
function societes(o){
  return [{ soc: o, i: -1 }].concat((o.coex || []).map((x, i) => ({ soc: x, i: i })));
}

/**
 * Le choix, quand plusieurs sociétés se partagent un stand.
 *
 * Ouvrir d'office la fiche du titulaire donnerait le stand à lui seul,
 * alors qu'un stand de restauration en héberge jusqu'à onze. On demande donc
 * qui l'on vient voir, plutôt que de le supposer.
 */
function choisitExposant(o, rect, canal){
  const tous = societes(o);
  ouvreModale(("Stand " + (o.code || "")).trim(), corps => {
    const p = document.createElement("p");
    p.textContent = tous.length + " sociétés occupent ce stand.";
    const ul = document.createElement("ul");
    ul.className = "expos";
    tous.forEach(x => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const n = document.createElement("span");
      n.className = "nom";
      n.textContent = nomSociete(x.soc);
      b.appendChild(n);
      b.onclick = () => {
        fermeModale();
        // la liste marque la société ouverte, d'où qu'on l'ait choisie ; le
        // plan, lui, ne bouge pas — il nomme le titulaire quoi qu'on lise
        state.selSoc = x.i; liste();
        ouvre(o, rect, canal, x.i);
      };
      li.appendChild(b);
      ul.appendChild(li);
    });
    corps.appendChild(p); corps.appendChild(ul);
  }, [{ libelle: "Fermer" }]);
  ecarteClicFantome();
}

/**
 * La fiche d'un stand ou d'une zone.
 *
 * `iSoc` désigne la société regardée sur un stand partagé : absent, on demande
 * laquelle ; -1, le titulaire ; sinon le rang du co-exposant. L'emplacement,
 * lui, ne change pas — c'est le même stand qu'on regarde par deux entrées.
 */
function ouvre(o, rect, canal, iSoc){
  const zone = o.kind === "zone";
  const heberges = (!zone && o.coex) || [];
  /* Le choix retiré, le stand mène droit à son titulaire — c'est lui qui loue
     l'emplacement, et c'est son nom qui est peint sur la cloison. Les sociétés
     qu'il héberge restent atteignables par la liste : le réglage allège le
     plan, il ne retire personne du salon. */
  const plusieurs = heberges.length > 0 && coexChoisit();
  if (plusieurs && iSoc === undefined){ choisitExposant(o, rect, canal); return; }
  /* Un stand sans co-exposant n'a pas de rang à passer : il n'en a qu'un, et
     c'est le titulaire. Le ramener ici évite d'avoir à distinguer « absent »
     de « titulaire » dans tout ce qui suit. */
  const iS = iSoc === undefined ? -1 : iSoc;
  /* La société affichée. Le titulaire porte ses champs à plat sur le stand :
     c'est le stand lui-même qui fait office de fiche. */
  const soc = iS >= 0 ? heberges[iS] : o;
  // la fiche, le parcours et l'itinéraire se partagent la même bande, à
  // droite comme en bas
  fermeParcours(); fermeItineraire();
  const t = zone ? "zone" : "stand";
  const ok = (cle, v) => montre(t, cle) ? v : "";
  // « Zone organisateur » n'apprenait rien : la forme et la couleur le disent
  $("dKind").textContent = zone ? "" : "Stand";
  $("dKind").hidden = zone;
  const titre = soc.nom || soc.plan ||
    (zone ? "Zone sans nom" : ("Stand " + (o.code || "")).trim());
  $("dName").textContent = titre;
  const pl = DATA.plans[o.p] || P();
  $("dCode").textContent = pl.libelle +
    (ok("code", o.code) ? " · " + o.code : "");
  /* Les modèles de fiche qui impriment le numéro du stand en grand le lisent
     sur l'en-tête : la pastille, elle, porte aussi le pavillon — trop long
     pour un filigrane, et une zone n'a pas de numéro du tout. */
  $("dCode").parentNode.dataset.code = !zone && o.code ? String(o.code) : "";
  /* De quoi revenir au choix sans refermer la fiche : sur un stand partagé, on
     compare souvent deux enseignes voisines. */
  const part = $("dPartage");
  part.hidden = !plusieurs;
  if (plusieurs){
    part.textContent = (heberges.length + 1) + " exposants ici";
    part.onclick = () => choisitExposant(o, null, canal);
  }
  /* La pastille des nouveaux venus. Elle ne paraît que si la synchronisation
     l'a posée — le champ qui la porte n'existe pas sur tous les salons — et
     que l'exploitant la laisse voir. Une zone organisateur n'est jamais
     nouvelle : elle n'est pas un exposant. */
  $("dNeuf").hidden = zone || !soc.neuf || !montre("stand", "nouveau");
  /* La classe « court » marque les champs qui tiennent en un mot : sur mobile
     ils se rangent deux par deux au lieu d'allonger la fiche d'autant de
     lignes. */
  const f = (l, v, cls) => v ? '<div class="field' + (cls ? " " + cls : "") +
                          '"><span class="eyebrow">' + l +
                          '</span><span class="v">' + v + '</span></div>' : "";
  // sur une zone, le programme qu'elle accueille ; sur un stand, les
  // conférences que son exposant tient, où qu'elles se tiennent
  /* Le programme est rattaché au stand par le dossier de son titulaire : la
     source ne dit pas quelle conférence revient à une société hébergée, et la
     lui prêter serait une invention. */
  const sien = (!zone && iS < 0 && pl.parStand && pl.parStand.get(o.id)) || [];
  const confs = ok("conferences", zone
    ? programme(P().parZone && P().parZone.get(o.id))
    : programme(sien, "Conférences"));
  /* Le corps de la fiche, champ par champ sous sa clé plutôt que d'un seul
     tenant : l'ordre de lecture n'est pas le même d'un salon à l'autre — ici
     la nomenclature prime, là l'adresse — et c'est l'exploitant qui le règle
     depuis la console. Le rangement vient après, une fois tout écrit.

     Ni la surface, ni les angles ouverts, ni l'état de commercialisation
     n'apprennent quoi que ce soit au visiteur : ils n'y figurent pas. */
  const corps = {};
  // la raison sociale n'apprend rien quand elle est déjà le titre
  corps.raison = ok("raison", !zone && soc.plan && soc.plan !== titre
    ? f(LIBELLE_CORPS.raison, esc(soc.plan)) : "");
  /* Le secteur décrit l'emplacement, pas son occupant : il reste au stand,
     quelle que soit la société qu'on y regarde. Son libellé est résolu à la
     synchronisation, la page l'affiche tel quel. */
  corps.secteur = ok("secteur", f(LIBELLE_CORPS.secteur, o.sect ? esc(o.sect) : ""));
  corps.adresse = ok("adresse", f(LIBELLE_CORPS.adresse, soc.adr ? esc(soc.adr) : ""));
  /* Les champs courts s'apparient deux par deux sur mobile : l'ordre réglé
     décide donc aussi de qui se retrouve à côté de qui, et un champ long
     glissé au milieu d'eux y laisse une demi-ligne vide. */
  corps.ville = ok("ville", f(LIBELLE_CORPS.ville, soc.ville ? esc(soc.ville) : "", "court"));
  corps.pays = ok("pays", f(LIBELLE_CORPS.pays, soc.pays ? esc(soc.pays) : "", "court"));
  /* Les niveaux décrivent l'emplacement, pas son occupant : ils restent au
     stand, quelle que soit la société qu'on y regarde. */
  corps.niveaux = ok("niveaux", f(LIBELLE_CORPS.niveaux, o.niveaux > 1 ? String(o.niveaux) : "", "court"));
  // le téléphone reste appelable d'un mobile, où le plan est le plus consulté
  corps.telephone = ok("telephone", f(LIBELLE_CORPS.telephone, soc.tel
    ? '<a href="tel:' + esc(String(soc.tel).replace(/[^+\d]/g, "")) + '">' + esc(soc.tel) + '</a>'
    : "", "court"));
  corps.site = ok("site", f(LIBELLE_CORPS.site, lien(soc.site)));
  corps.facebook = ok("facebook", f(LIBELLE_CORPS.facebook, lien(soc.fb)));
  corps.linkedin = ok("linkedin", f(LIBELLE_CORPS.linkedin, lien(soc.li)));
  corps.instagram = ok("instagram", f(LIBELLE_CORPS.instagram, lien(soc.ig)));
  // le libellé est résolu à la synchronisation : la page l'affiche tel quel
  corps.nomenclature = ok("nomenclature", soc.nomencl && soc.nomencl.length
    ? f(LIBELLE_CORPS.nomenclature, soc.nomencl
        .map(n => '<span class="ligne">' + esc(String(n)) + '</span>').join(""))
    : "");
  /* Les thématiques disent ce que l'exposant vient faire là, quand la
     nomenclature dit ce qu'il vend ; un salon qui n'en tient pas ne reçoit pas
     la clé du tout.

     Chacune mène aux exposants qui la partagent — mais seulement là où
     l'exploitant en a fait un critère : ailleurs, rien ne saurait dresser la
     liste promise, et une thématique qui ne mène nulle part vaut mieux en
     texte qu'en lien mort. */
  corps.thematiques = ok("thematiques", soc.themes && soc.themes.length
    ? f(LIBELLE_CORPS.thematiques, soc.themes
        .map(n => themeFiltrable(n)
          ? '<button type="button" class="ligne theme" data-t="' +
            esc(String(n)) + '">' + esc(String(n)) + '</button>'
          : '<span class="ligne">' + esc(String(n)) + '</span>').join(""))
    : "");
  /* Les champs que ce salon-ci s'est ajoutés : l'ordre par défaut les range
     derrière ce que toutes les fiches ont en commun — ils lui sont propres,
     ils ne passent pas d'office devant l'adresse — sans empêcher l'exploitant
     de les faire remonter. */
  const perso = (!zone && DATA.fiche && DATA.fiche.perso) || [];
  perso.forEach(c => {
    const v = (soc.perso || {})[c.cle];
    if (v === undefined || v === null || v === "") return;
    // le point-virgule sépare les valeurs d'un champ à choix : la fiche les
    // montre l'une sous l'autre plutôt qu'en une ligne à rallonge
    const l = separeValeurs(v);
    if (!l.length) return;
    corps[PREFIXE_PERSO + c.cle] = ok(PREFIXE_PERSO + c.cle,
      f(esc(c.libelle), l.length > 1
        ? l.map(x => '<span class="ligne">' + esc(x) + '</span>').join("")
        : esc(l[0])));
  });
  const infos = ordreCorps(perso.map(c => PREFIXE_PERSO + c.cle))
    .map(c => corps[c] || "").join("");
  /* Un stand se lit dans cet ordre : qui est l'exposant, puis ce qu'il
     anime — ses conférences peuvent être nombreuses, et repoussaient
     l'adresse et les contacts hors de l'écran. Une zone, elle, n'a rien à
     dire d'autre que son programme : il reste en tête. */
  const bloc2 = (cls, id, h) =>
    '<div class="' + cls + '" id="' + id + '" role="tabpanel">' + h + '</div>';
  /* Ce qu'est l'exposant et ce qu'il anime se partagent la fiche dès qu'il y
     a les deux — un stand sans conférence n'a rien à mettre en face, une zone
     n'a pas de fiche. La largeur décide ensuite de la forme : deux colonnes
     au large, deux onglets à l'étroit. */
  const partage = !zone && !!confs && !!infos;
  $("detail").classList.toggle("deux", partage);
  $("dOnglets").hidden = !partage;
  $("dOngNb").textContent = partage && sien.length ? sien.length : "";
  // une fiche s'ouvre sur le détail : c'est ce qu'on est venu y lire
  onglet("detail");
  $("dBody").innerHTML = (zone
      ? bloc2("cConf", "dPaneConf", confs) + bloc2("cInfos", "dPaneInfos", infos)
      : bloc2("cInfos", "dPaneInfos", infos) + bloc2("cConf", "dPaneConf", confs)) +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  /* Une conférence ouverte d'ici vient soit du programme d'une salle, soit
     de la fiche de l'exposant qui la tient : ce n'est pas le même chemin. */
  const canalConf = zone ? "salle" : "exposant";
  $("dBody").querySelectorAll("[data-conf]").forEach(b =>
    b.onclick = () => ficheConf(b.dataset.conf, canalConf));
  /* Le signet du parcours vit en haut, à côté de la croix : retenir un
     exposant porte sur la fiche entière. Une zone organisateur ne se retient
     pas elle-même — ce sont ses conférences qu'on ajoute, chacune à son heure. */
  const sig = $("dMarque");
  sig.hidden = zone;
  if (zone) { delete sig.dataset.mg; delete sig.dataset.mi; }
  else { sig.dataset.mg = "stand"; sig.dataset.mi = o.id; }
  // un seul branchement pour le signet de tête et ceux du programme
  brancheParcours($("detail"));
  /* Une thématique lue sur une fiche est une porte vers les autres exposants
     qui la partagent : c'est le chemin qu'on prend quand on a trouvé à peu
     près ce qu'on cherchait, et qu'on veut voir le reste. */
  $("dBody").querySelectorAll(".theme").forEach(b =>
    b.onclick = () => filtreTheme(b.dataset.t));
  $("dGo").onclick = () => centre(o);
  // « j'y vais » : l'arrivée est celle qu'on lit, le départ reste à dire
  $("dItin").onclick = () => versItineraire(o);
  // le crayon vit dans l'en-tête, à côté du nom, et non parmi les actions
  const cr = $("dRen");
  if (cr){
    cr.hidden = !(ADMIN && zone);
    cr.onclick = () => renommeZone(o);
  }
  /* Une zone technique — réserve, quai de livraison — n'apprend rien au
     visiteur. L'exploitant l'éteint d'ici, et la pastille dit l'état avant
     d'être un bouton : elle ne paraît qu'en administration, seule vue où une
     zone éteinte soit encore là. */
  const vis = $("dVis");
  if (vis){
    vis.hidden = !(ADMIN && zone);
    if (!vis.hidden){
      const affichee = !o.masquee;
      vis.textContent = "Affiché : " + (affichee ? "oui" : "non");
      vis.setAttribute("aria-pressed", affichee ? "true" : "false");
      vis.title = affichee
        ? "Retirer cette zone du plan public"
        : "Remettre cette zone sur le plan public";
      vis.onclick = () => basculeAffichageZone(o);
    }
  }
  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  anime(rect, 1);
  // une zone organisateur n'est pas un exposant : elle ne compte pas ici
  if (!zone) mesure("fiche_stand", canal, o.id);
}
function ferme(){
  const id = state.sel, ouvert = $("detail").classList.contains("open");
  /* La forme d'où la fiche est partie, relevée tant que la sélection tient
     encore : c'est elle qui dit si l'on repliait vers un emplacement ou vers
     le découpage qu'il héberge. */
  const n = ouvert && id ? noeud(id, state.selSoc) : null;
  const rect = n ? n.getBoundingClientRect() : null;
  document.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
  state.sel = null; state.selSoc = -1;
  dessineMarques();
  marqueStandsDessines();
  liste(); libelles(); $("voile").classList.remove("on");
  if (ouvert) anime(rect, -1);
}
/* Les onglets ne font que choisir ce qu'on regarde : la fiche est construite
   entière, et la bascule ne relit rien. */
function onglet(n){
  $("detail").dataset.onglet = n;
  $("dOngInfo").setAttribute("aria-selected", String(n !== "prog"));
  $("dOngProg").setAttribute("aria-selected", String(n === "prog"));
}
$("dOngInfo").onclick = () => onglet("detail");
$("dOngProg").onclick = () => onglet("prog");
$("closeDetail").onclick = ferme;
$("voile").onclick = ferme;

/* ============================================================
   8. Interactions du plan
   ============================================================ */
let drag = null;

/* ------------------------------------------------------------------
   Pincement à deux doigts.

   Le plan interdit au navigateur de gérer le toucher — « touch-action: none »
   — parce qu'il déplace la vue lui-même. Il lui revient donc aussi de gérer le
   pincement, sinon il n'existe pas : c'est ce qui manquait sur téléphone.

   On garde le point du plan qui était sous le milieu des deux doigts, et on
   le maintient dessous. L'écartement donne l'échelle, le déplacement du milieu
   donne la translation : les deux gestes se font d'un seul mouvement, comme on
   s'y attend.
   ------------------------------------------------------------------ */
const doigts = new Map();
let pince = null;

const milieu = () => {
  const l = [...doigts.values()];
  return { x: (l[0].x + l[1].x) / 2, y: (l[0].y + l[1].y) / 2,
           d: Math.hypot(l[0].x - l[1].x, l[0].y - l[1].y) };
};

function commencePince(){
  const m = milieu();
  const r = svg.getBoundingClientRect();
  pince = {
    d: Math.max(1, m.d),
    w: view.w, h: view.h,
    // le point du plan sous le milieu, celui qui ne doit pas bouger
    ancre: [view.x + (m.x - r.left) / r.width * view.w,
            view.y + (m.y - r.top) / r.height * view.h],
  };
  drag = null;
  svg.classList.remove("dragging");
}

function suitPince(){
  const m = milieu();
  const r = svg.getBoundingClientRect();
  const large = emp ? (emp.x1 - emp.x0) * 2.5 : pince.w * 8;
  const nw = Math.min(large, Math.max(6, pince.w * pince.d / Math.max(1, m.d)));
  const nh = pince.h * (nw / pince.w);
  view = {
    x: pince.ancre[0] - (m.x - r.left) / r.width * nw,
    y: pince.ancre[1] - (m.y - r.top) / r.height * nh,
    w: nw, h: nh,
  };
  rafraichitVue();
}

svg.addEventListener("pointerdown", e => {
  dernierAppuiTactile = e.pointerType === "touch" || e.pointerType === "pen";
  /* Un « pointerup » se perd parfois — la main sort de l'écran, le navigateur
     passe la main à un geste système. Le doigt restait alors inscrit, et
     l'appui suivant passait pour le second d'un pincement : plus rien ne
     répondait. Le premier doigt d'un geste ouvre donc une table vierge. */
  if (e.isPrimary) doigts.clear();
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 2){ commencePince(); return; }
  if (doigts.size > 2) return;
  /* Placer un libellé passe avant tout le reste : le geste vise un nom, pas
     l'emplacement qui est dessous ni la vue qu'on déplacerait. */
  if (libellePointerDown(e)) return;
  if (dessinPointerDown(e)) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, bouge: false,
           cible: e.target.closest("[data-id],[data-poi]") };
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (doigts.has(e.pointerId)) doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pince && doigts.size >= 2){ e.preventDefault(); suitPince(); return; }
  if (libellePointerMove(e)) return;
  if (dessinPointerMove(e)) return;
  if (!drag) return;
  const r = svg.getBoundingClientRect(), k = view.w / r.width;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.bouge = true;
  view.x = drag.vx - dx; view.y = drag.vy - dy; rafraichitVue();
});
/* La capture de pointeur redirige le clic vers le <svg> : on retient la cible
   au pointerdown et on tranche au pointerup. */
svg.addEventListener("pointerup", e => {
  doigts.delete(e.pointerId);
  // un doigt levé met fin au pincement ; celui qui reste ne reprend pas la
  // main sur le déplacement, sans quoi la vue sauterait
  if (pince){ if (doigts.size < 2){ pince = null; drag = null; poseVue(); } return; }
  if (libellePointerUp(e)) return;
  if (dessinPointerUp(e)) return;
  const d = drag; drag = null; svg.classList.remove("dragging");
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  if (d && d.bouge){ poseVue(); return; }
  if (!d) return;
  /* Une visée d'itinéraire en cours prend le clic avant la fiche : c'est un
     point qu'on désigne, pas un exposant qu'on veut lire. */
  if (d.cible){
    /* Un repère n'est pas un objet du plan : il n'a pas de fiche d'exposant,
       mais il a un nom, et c'est ce qu'on vient lui demander. */
    if (!d.cible.dataset.id){
      if (visePoi(d.cible.dataset.poi)) return;
      ouvrePoi(d.cible.dataset.poi, d.cible.getBoundingClientRect());
      return;
    }
    if (viseItineraire(d.cible.dataset.id)) return;
    select(d.cible.dataset.id, false, canalPlan(d.cible), rangSociete(d.cible));
  } else { ferme(); finVisee(); }
});
svg.addEventListener("pointercancel", e => {
  doigts.delete(e.pointerId);
  if (doigts.size < 2) pince = null;
  glisseLib = null;
  drag = null;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoom(e.deltaY > 0 ? 1.18 : .85,
       view.x + (e.clientX - r.left) / r.width * view.w,
       view.y + (e.clientY - r.top) / r.height * view.h);
}, { passive: false });
svg.addEventListener("keydown", e => {
  const g = e.target.closest("[data-id],[data-poi]");
  if (g && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    // le plan se parcourt aussi au clavier : la visée doit y répondre pareil
    if (!g.dataset.id){
      if (!visePoi(g.dataset.poi)) ouvrePoi(g.dataset.poi, g.getBoundingClientRect());
      return;
    }
    if (!viseItineraire(g.dataset.id))
      select(g.dataset.id, false, canalPlan(g), rangSociete(g));
  }
});
document.addEventListener("keydown", e => {
  const saisie = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (ADMIN && !saisie && (e.ctrlKey || e.metaKey)){
    const t = e.key.toLowerCase();
    if (t === "z" && !e.shiftKey){ e.preventDefault(); annule(); return; }
    if (t === "y" || (t === "z" && e.shiftKey)){ e.preventDefault(); refais(); return; }
    /* Répéter plutôt que redessiner : c'est ainsi qu'une rangée de stands
       identiques se déroule, la copie prenant la place de la sélection. */
    if (t === "d" && formeSel){ e.preventDefault(); dupliqueForme(); return; }
  }
  if (ADMIN && !saisie && (e.key === "Delete" || e.key === "Backspace") && formeSel){
    e.preventDefault(); supprimeForme(); return;
  }
  /* Le clavier ajuste au quart de mètre ce que la main pose approximativement,
     et au mètre touche majuscule tenue : c'est la finition d'un placement,
     après le glisser qui l'a amené à peu près là. */
  if (PLACE_LIBELLES && libSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseLibelle(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                  e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  /* Une forme choisie se règle du même pas : l'aimant l'a posée contre sa
     voisine, le clavier lui donne l'allée qui les sépare. */
  if (ADMIN && formeSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseForme(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  if (e.key === "Escape"){
    if (PLACE_LIBELLES){ modePlacementLibelles(false); construitPanneau(); return; }
    if (enCours){ termineTrace(false); return; }
    if (formeSel){ choisitForme(null); return; }
    if (calqueActif){ activeCalque(calqueActif); return; }
    ferme();
    if ($("panel")) $("panel").classList.remove("open");
  }
  if (e.key === "Enter" && e.target.id !== "q" && e.target.id !== "texteADessiner") termineTrace(true);
});

/* ============================================================
   Le tiroir de la liste — écrans étroits

   Côte à côte, plan et liste ne tiennent pas sur un téléphone. La liste se
   replie donc en tiroir : seules la recherche et le compteur dépassent, le
   reste se hisse d'une pression ou d'un glissement. Choisir un résultat le
   referme — c'est le plan qu'on voulait voir, et la fiche s'ouvre par-dessus.
   ============================================================ */
/* La mesure du tiroir appartient à ce module, mais les bandes qui dépassent —
   les secteurs, les critères retenus — paraissent et disparaissent ailleurs :
   on leur laisse de quoi la redemander. */
let mesureTiroir = () => {};
/* De même, une thématique retenue depuis une fiche doit faire monter le tiroir :
   sur téléphone la liste qui vient de changer est sous le plan. */
let montreTiroir = () => {};

(function tiroirListe(){
  const tiroir = $("side"), prise = $("poignee");
  if (!tiroir || !prise) return;
  const etroit = ETROIT;

  /* La hauteur repliée ne peut pas être une constante : elle dépend de la
     police servie, du retour à la ligne des puces, de la longueur du nom de
     pavillon dans le compteur. On la mesure, et on la redonne au CSS, qui s'en
     sert aussi pour poser les commandes du plan au-dessus du tiroir. */
  function mesure(){
    if (!etroit()) return;
    const part = s => { const n = tiroir.querySelector(s); return n ? n.offsetHeight : 0; };
    const h = prise.offsetHeight + part(".search") + part(".actifs") +
              part(".count");
    if (h > 0) document.documentElement.style.setProperty("--replie", h + "px");
  }

  /* Trois crans, du plus bas au plus haut. Le milieu est le cran utile : la
     liste se lit sans que le plan disparaisse. */
  const CRANS = ["replie", "demi", "plein"];
  const cran = () => tiroir.dataset.cran || "replie";
  function pose(nom){
    tiroir.dataset.cran = nom;
    prise.setAttribute("aria-expanded", nom === "replie" ? "false" : "true");
  }
  const replie = () => pose("replie");
  /* Une pression fait le tour des crans : on les atteint tous sans rien
     connaître du glissement, et on revient au plan par la même touche. */
  const bascule = () => pose(CRANS[(CRANS.indexOf(cran()) + 1) % CRANS.length]);

  const replieePx = () =>
    parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--replie")) || 164;

  /* Hauteur visible du tiroir à un cran donné, en pixels. Le milieu suit la
     règle du CSS — 46 % de la hauteur d'écran. */
  function hauteur(nom){
    if (nom === "plein") return tiroir.offsetHeight;
    if (nom === "demi")  return Math.round(innerHeight * .46);
    return replieePx();
  }

  /* --- le glissement ------------------------------------------------------
     Le doigt mène le tiroir entre le cran le plus bas et le plus haut, puis on
     s'accroche au cran le plus proche de l'endroit où il a lâché. Un seuil de
     distance ne suffirait plus : avec trois crans, c'est la position d'arrivée
     qui décide, pas la longueur du geste. */
  let depart = null, aGlisse = false;

  prise.addEventListener("pointerdown", e => {
    if (!etroit()) return;
    depart = { y: e.clientY, vu: hauteur(cran()) };
    aGlisse = false;
    tiroir.classList.add("glisse");
    prise.setPointerCapture(e.pointerId);
  });

  /** Hauteur visible pendant le geste, bornée aux deux crans extrêmes. */
  const suit = e =>
    Math.min(hauteur("plein"), Math.max(hauteur("replie"), depart.vu - (e.clientY - depart.y)));

  prise.addEventListener("pointermove", e => {
    if (!depart) return;
    if (Math.abs(e.clientY - depart.y) > 6) aGlisse = true;
    tiroir.style.transform = "translateY(" + (tiroir.offsetHeight - suit(e)) + "px)";
  });

  function relache(e){
    if (!depart) return;
    const vu = suit(e);
    tiroir.classList.remove("glisse");
    tiroir.style.transform = "";
    if (aGlisse){
      let choix = CRANS[0], ecart = Infinity;
      for (const c of CRANS){
        const d = Math.abs(hauteur(c) - vu);
        if (d < ecart){ ecart = d; choix = c; }
      }
      pose(choix);
    }
    depart = null;
  }
  prise.addEventListener("pointerup", relache);
  prise.addEventListener("pointercancel", relache);

  /* Une pression bascule. Le clic sert aussi le clavier — la poignée est un
     bouton — mais il suit tout glissement : on l'ignore dans ce cas. */
  prise.addEventListener("click", () => {
    if (aGlisse){ aGlisse = false; return; }
    bascule();
  });

  /* Chercher, c'est vouloir la liste ; choisir, c'est vouloir le plan. Au cran
     plein pour la recherche : le clavier va manger le bas de l'écran, autant
     que la liste occupe tout ce qui reste. */
  $("q").addEventListener("focus", () => { if (etroit()) pose("plein"); });
  $("list").addEventListener("click", () => { if (etroit()) replie(); });

  /* La fiche occupe le bas de l'écran quand elle s'ouvre — depuis la liste
     comme depuis le plan ; le parcours prend la même bande. Le tiroir se
     retire sous eux plutôt que de lutter pour la même place. */
  const bandes = [$("detail"), $("parcours")].filter(Boolean);
  const guette = new MutationObserver(() => {
    if (etroit() && bandes.some(n => n.classList.contains("open"))) replie();
  });
  bandes.forEach(n => guette.observe(n, { attributes: true, attributeFilter: ["class"] }));
  addEventListener("keydown", e => { if (e.key === "Escape" && etroit()) replie(); });

  /* Au retour vers un grand écran, la liste reprend sa colonne : ni classe
     d'ouverture ni transformation résiduelle, qui s'y appliqueraient encore. */
  addEventListener("resize", () => {
    if (!etroit()){ tiroir.style.transform = ""; replie(); }
    else mesure();
  });

  mesureTiroir = mesure;
  /* Le cran du milieu, pas le plein écran : on vient de retenir une
     thématique depuis le plan, et on veut voir la liste sans perdre de vue
     l'endroit d'où l'on part. */
  montreTiroir = () => { if (etroit() && cran() === "replie") pose("demi"); };
  mesure();
  // les polices arrivent après le premier calcul et changent la hauteur mesurée
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesure);
  addEventListener("load", mesure);
})();

/* thème */
const CLE_THEME = "plan-theme";
try { const t = localStorage.getItem(CLE_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("btnTheme").onclick = () => {

  const sombre = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;

};

/* ============================================================
   9. Apparence des calques
   Les réglages vivent dans CONF, partagés par les trois pavillons :
   changer la couleur du bâtiment une fois vaut pour tous.
   ============================================================ */
const DEFAUTS = { "INFOPRO_FIL_JAUNE": { rempli: true } };
let CONF = JSON.parse(JSON.stringify(DEFAUTS));

/* Un rangement par salon, et non plus un seul pour tous.
   Les calques sortent tous du même bureau d'études : « Batiment », « RIA »,
   « Caniveaux » et leurs sous-calques portent les mêmes noms d'un salon à
   l'autre. Rangés sous ce seul nom, les réglages suivaient l'exploitant :
   masquer une gaine chez l'un la masquait chez le suivant, sans que rien ne
   l'annonce dans son panneau — et la publication emportait le mélange en
   base. Le salon ouvert nomme donc sa clé. */
const cleConf = d => "plan-conf:" +
  ((d && d.slug) || SLUG || (d && d.evenement) || "sans-salon");
let CLE_CONF = cleConf(null);

/** Ouvre les réglages du salon qu'on vient de charger. */
function ouvreConf(d){
  CLE_CONF = cleConf(d);
  CONF = JSON.parse(JSON.stringify(DEFAUTS));
  try { Object.assign(CONF, JSON.parse(localStorage.getItem(CLE_CONF) || "{}")); } catch (e) {}
  /* L'ancien rangement commun ne peut que rejouer le mélange, et la base fait
     foi de toute façon : on le retire plutôt que de le laisser traîner. */
  try { localStorage.removeItem("plan-conf"); } catch (e) {}
}

/**
 * Les réglages qui parlent du salon ouvert : ceux de ses calques et de leurs
 * sous-calques, plus les réglages généraux — commandes, couches de données,
 * étiquettes. Tout le reste vient d'un salon voisin ouvert sur le même poste,
 * et ne désigne rien ici.
 *
 * Le filtre s'applique aux deux bouts : ce qu'on lit de la base, et ce qu'on y
 * renvoie. Un enregistrement déjà mélangé se nettoie donc à la publication
 * suivante, sans qu'il faille y toucher à la main.
 */
function reglagesDuSalon(source){
  const calques = new Set((DATA?.plans || []).flatMap(p => (p.fond || []).map(c => c.cle)));
  const sortie = {};
  Object.keys(source || {}).forEach(k => {
    if (k.indexOf("_pile:") === 0) return;          // rangé par pavillon, à part
    const general = k[0] === "_" || k.indexOf("data:") === 0 ||
                    k === "labStand" || k === "labZone" || k === "selection" ||
                    k === "parcours";
    /* Une couleur de secteur nomme un secteur de ce salon-ci : elle se retient
       comme un calque, au nom près. Celle d'un salon voisin ne désigne rien
       ici, et n'a rien à faire dans ce qu'on publie. */
    const dUnSecteur = k.indexOf("secteur:") === 0 && SECTEURS.has(k.slice(8));
    /* « calque/sous-calque », mais l'un comme l'autre peut porter une barre
       oblique : on retient la clé dès qu'une de ses têtes nomme un calque. */
    const dUnCalque = calques.has(k) ||
      k.split("/").some((_, i, t) => i && calques.has(t.slice(0, i).join("/")));
    if (general || dUnCalque || dUnSecteur) sortie[k] = source[k];
  });
  return sortie;
}

const conf = c => (CONF[c] = CONF[c] || {});
const jeton = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888888";
const sousCle = (cle, id) => cle + "/" + id;

function styleFond(cle){
  const c = conf(cle);
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  if (!g) return;
  g.style.display = c.visible === false ? "none" : "";
  g.querySelectorAll("g[data-s]").forEach(sub => {
    const sc = CONF[sousCle(cle, sub.id)] || {};
    const src = sub.dataset.s || "";
    const noir = !src || src === "rgb(0,0,0)";
    sub.style.display = sc.visible === false ? "none" : "";
    sub.style.color = sc.couleur || c.couleur || (noir ? "" : src);
    const rempli = sc.rempli !== undefined ? sc.rempli : c.rempli;
    if (rempli){
      sub.setAttribute("fill", "currentColor");
      sub.setAttribute("stroke", "none");
    } else {
      sub.setAttribute("fill", sub.dataset.f || "none");
      sub.setAttribute("stroke", "currentColor");
    }
  });
}
function sousCalques(cle){
  const g = $("couches").querySelector('.cal[data-cle="' + CSS.escape(cle) + '"]');
  return g ? [...g.querySelectorAll("g[data-s]")].map(s => ({ id: s.id, src: s.dataset.s })) : [];
}

const racine = document.documentElement;

/* Les couches de données n'ont pas de SVG propre : leur visibilité joue sur
   l'affichage du groupe, leur couleur sur une variable CSS. */
function styleDataGroupe(nom, on){
  $(nom).style.display = on ? "" : "none";
  // le liseré du parcours est tracé hors des couches : il ne suit pas tout seul
  if (nom === "stands" || nom === "zones") marqueParcours();
}

function appliqueCouleursData(){
  const pose = (v, n) => v ? racine.style.setProperty(n, v) : racine.style.removeProperty(n);
  pose(conf("data:stands").couleur, "--c-stand");
  pose(conf("data:zones").couleur, "--c-zone");
  const general = conf("data:labels").couleur;
  pose(conf("labStand").couleur || general, "--c-lab-stand");
  pose(conf("labZone").couleur || general, "--c-lab-zone");
  /* Un stand sélectionné prend deux couleurs — l'aplat et son liseré — et
     l'exploitant n'en règle qu'une : celle qu'il voit. Le liseré s'en déduit,
     sans quoi il faudrait accorder deux nuanciers à la main pour que le second
     reste visible sur le premier. */
  const sel = conf("selection").couleur;
  pose(sel, "--c-sel");
  pose(sel && ecarte(sel), "--c-sel-trait");
  /* Le parcours n'a qu'un liseré, sans aplat : il double le contour d'un stand
     qui garde par ailleurs sa teinte. Une seule couleur suffit donc, et elle
     se règle à part de la sélection — les deux marques se croisent sur le même
     plan, et se confondraient si l'exploitant ne pouvait les écarter. */
  pose(conf("parcours").couleur, "--c-parc");
}

function styleData(cle){
  racine.classList.toggle(cle === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                          conf(cle).visible === false);
  appliqueCouleursData();
}

function appliqueApparence(){
  P().fond.forEach(f => {
    // Un calque absent de la configuration est montré. La règle disait
    // l'inverse — masquer tout ce qui n'était pas explicitement marqué visible
    // — et convenait aux données figées, qui portaient ce drapeau. La charge
    // utile servie par l'API n'en porte pas : tout le fond de plan
    // disparaissait, sans que rien ne le signale.
    if (CONF[f.cle] === undefined && f.visible === false) conf(f.cle).visible = false;
    styleFond(f.cle);
  });
  ["zones", "stands", "labels"].forEach(n =>
    styleDataGroupe(n, conf("data:" + n).visible !== false));
  ["labStand", "labZone"].forEach(k =>
    racine.classList.toggle(k === "labStand" ? "sans-lab-stand" : "sans-lab-zone",
                            conf(k).visible === false));
  appliqueCouleursData();
  appliqueCommandes();
  appliqueSecteurs();
  appliqueAccent();
  appliqueFiche();
}

/**
 * Les commandes posées sur le plan, montrées ou non.
 *
 * Le pincement rend les boutons de zoom superflus sur un écran tactile, mais
 * il demande deux doigts : dans une allée de salon, sac à la main, on n'en a
 * souvent qu'un. L'échelle, elle, sert à qui mesure une distance et encombre
 * qui ne la lit pas. Ni l'un ni l'autre ne se tranche par une règle générale :
 * cela dépend du public et du terrain, donc cela revient à l'exploitant.
 *
 * Le parcours de visite se range ici pour la même raison : il vaut pour un
 * salon qu'on parcourt une journée durant, moins pour une exposition d'une
 * heure. Le retirer ne touche pas aux listes déjà constituées sur les
 * téléphones — il masque ce qui y mène, et le réglage peut se rouvrir.
 *
 * Montrées par défaut : un réglage absent ne doit rien retirer à un salon déjà
 * en place.
 *
 * « classe » marque celles dont le retrait déborde de leur propre coin : elle
 * est posée sur la racine, d'où la feuille de style tire le reste.
 */
const COMMANDES = [
  { cle: "_zoom",     sel: ".zoombar",     libelle: "Afficher les icônes de zoom",
    /* L'échelle s'écartait de la marge pour laisser passer les boutons de
       zoom. Sans eux, ce décalage n'a plus d'objet et laisse un vide. */
    classe: "sans-zoom" },
  { cle: "_echelle",  sel: ".scalebar",    libelle: "Afficher l'échelle" },
  { cle: "_parcours", sel: "#btnParcours", libelle: "Proposer le parcours de visite",
    // les signets des fiches et du programme suivent le bouton de la barre
    classe: "sans-parcours" },
  /* L'itinéraire se calcule sur ce que les données disent du hall : les
     emplacements, et les obstacles que l'exploitant a bien voulu dessiner.
     Sur un plan resté nu, le trajet reste juste mais n'évite que les stands —
     à lui de juger si cela suffit à son salon. */
  { cle: "_itineraire", sel: "#btnItineraire", libelle: "Proposer le calcul d'itinéraire",
    // le bouton « Itinéraire » des fiches suit celui de la barre
    classe: "sans-itineraire" },
];

function appliqueCommandes(){
  COMMANDES.forEach(c => {
    const retire = conf(c.cle).visible === false;
    const n = document.querySelector(c.sel);
    if (n) n.hidden = retire;
    if (c.classe) racine.classList.toggle(c.classe, retire);
  });
  // un tiroir ouvert sur une fonction qu'on vient de retirer n'aurait plus de
  // bouton pour se refermer
  if (conf("_parcours").visible === false) fermeParcours();
  if (conf("_itineraire").visible === false) fermeItineraire();
}

/**
 * Combien de temps on passe sur un stand.
 *
 * Ce n'est pas un réglage d'affichage : c'est ce qui décide combien de
 * visites tiennent entre deux conférences quand le visiteur demande qu'on
 * organise sa journée. Le mettre trop bas remplit un programme intenable ;
 * trop haut, il laisse des stands de côté sans raison.
 *
 * Vingt minutes est ce qu'on observe sur un salon professionnel — le temps
 * d'une poignée de main, d'une démonstration et d'une carte de visite. Un
 * salon grand public tourne plus vite, un salon d'affaires beaucoup moins :
 * cela ne se devine pas depuis le plan, d'où le réglage.
 */
const VISITE_DEFAUT = 20;      // minutes
const VISITE_MIN = 5, VISITE_MAX = 120;
function minutesVisite(){
  const v = Math.round(+(CONF["_visite"] || {}).minutes);
  return v >= VISITE_MIN && v <= VISITE_MAX ? v : VISITE_DEFAUT;
}

/** Ce salon héberge-t-il des sociétés sur le stand d'une autre ? La question
 *  se pose sur les trois pavillons : un seul stand partagé suffit. */
const salonPartage = () => (DATA?.plans || [])
  .some(p => (p.stands || []).some(s => (s.coex || []).length));

/* ------------------------------------------------------------
   Couleur principale et modèle de fiche

   Deux réglages d'apparence qui ne portent sur aucun calque : la teinte dont
   le plan se sert partout — sélection, liens, boutons pleins — et l'habillage
   de la fiche détail. Ils vivent dans CONF sous une clé préfixée, donc ils
   partent aux visiteurs avec le reste de la configuration.
   ------------------------------------------------------------ */

/** Les trois composantes d'une couleur écrite « #rrggbb ». */
const trio = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
};

/** Deux couleurs mêlées, `t` disant combien on va de la première vers la
 *  seconde. Sert à décliner l'accent sans demander cinq teintes à
 *  l'exploitant : il en choisit une, le reste s'en déduit. */
const melange = (a, b, t) => {
  const x = trio(a), y = trio(b);
  return x && y ? hexa(x.map((c, i) => Math.round(c + (y[i] - c) * t))) : a;
};

/** Le thème effectivement peint : celui qu'on a choisi, sinon celui du
 *  système. La couleur principale s'y adapte — un bleu d'imprimerie s'éteint
 *  sur un fond noir, et le même ton ne peut pas servir des deux côtés. */
const themeSombre = () => {
  const t = racine.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};

/**
 * Pose la couleur principale et ses déclinaisons sur la racine.
 *
 * L'exploitant n'en règle qu'une, celle qu'il voit : l'aplat doux des
 * pastilles, l'encre qui s'écrit sur un bouton plein et les deux nuances dont
 * les modèles de fiche composent leurs fonds s'en déduisent. Sans réglage, on
 * retire les variables plutôt que d'en réécrire : la feuille de style reprend
 * la main, et avec elle le bleu d'origine — qui a déjà ses deux versions.
 */
function appliqueAccent(){
  const noms = ["--accent", "--accent-base", "--accent-soft", "--accent-ink",
                "--accent-clair", "--accent-fort"];
  const choisie = trio(conf("_accent").couleur) ? conf("_accent").couleur : null;
  if (!choisie){ noms.forEach(n => racine.style.removeProperty(n)); return; }
  const sombre = themeSombre();
  /* Sur fond sombre, un ton franc s'éteint : on l'éclaircit d'un tiers, comme
     le thème le fait de son propre bleu. */
  const base = sombre ? melange(choisie, "#FFFFFF", 0.34) : choisie;
  const pose = (n, v) => racine.style.setProperty(n, v);
  pose("--accent", base);
  pose("--accent-base", base);
  pose("--accent-soft", melange(base, sombre ? "#0E1113" : "#FFFFFF", sombre ? 0.76 : 0.86));
  // le texte d'un bouton plein : noir sur un jaune, blanc sur un bleu
  pose("--accent-ink", luminance(trio(base)) > 0.42 ? "#0E1113" : "#FFFFFF");
  pose("--accent-clair", melange(base, "#FFFFFF", 0.34));
  pose("--accent-fort", melange(base, "#000000", 0.42));
}
/* Le thème peut basculer sans qu'on rouvre les réglages : la couleur suit. */
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", appliqueAccent); } catch (e) {}

/* Les habillages de la fiche détail. Le premier n'a pas de classe : c'est la
   fiche telle que la feuille de style la dessine, et le point de départ de
   tous les autres. */
const MODELES_FICHE = [

    resume: "Le rendu d'origine : un seul rythme du haut en bas." },
  { cle: "grille", nom: "Grille",
    resume: "En-tête à l'encre pleine, numéro du stand en filigrane, champs entre filets." },
  { cle: "console", nom: "Console",
    resume: "Chasse fixe et invites de commande, sur un phosphore à la couleur du salon." },
  { cle: "billet", nom: "Billet",
    resume: "Bandeau d'accent, numéro en gros caractères, ligne perforée." },
  { cle: "magazine", nom: "Magazine",
    resume: "Serif à fort contraste et libellés en italique, comme un catalogue." },
  { cle: "brut", nom: "Brut",
    resume: "Trait épais, ombre dure, aplat franc. Papier et noir dans les deux thèmes." },
  { cle: "verre", nom: "Verre",
    resume: "Un bloc de la couleur du salon, les champs en panneaux translucides." },
  { cle: "kraft", nom: "Kraft",

  { cle: "signal", nom: "Signalétique",
