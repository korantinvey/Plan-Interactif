/* Les libellés qui déclenchent un pictogramme. Un libellé libre reste
   possible : il donne alors une pastille de texte. */
const PICTO_MOTS = {
  "wc": "wc",
  "toilettes": "wc",
  "sanitaires": "wc",
  "entrée": "entree",
  "entree": "entree",
  "accès": "entree",
  "acces": "entree",
  "sortie": "entree",
  "issue": "entree",
  "entrée/sortie": "entree",
  "entree/sortie": "entree",
  "accueil": "accueil",
  "réception": "accueil",
  "reception": "accueil",
  "information": "info",
  "informations": "info",
  "info": "info",
  "restauration": "restauration",
  "restaurant": "restauration",
  "café": "cafe",
  "cafe": "cafe",
  "bar": "cafe",
  "vestiaire": "vestiaire",
  "consigne": "vestiaire",
  "ascenseur": "ascenseur",
  "escalier": "escalier",
  "escaliers": "escalier",
  "escalator": "escalator",
  "escalier mécanique": "escalator",
  "escalier mecanique": "escalator",
  "secours": "secours",
  "infirmerie": "secours",
  "premiers secours": "secours",
  "pmr": "pmr",
  "accessibilité": "pmr",
  "accessibilite": "pmr",
  "accessible": "pmr",
  "parking": "parking",
  "stationnement": "parking",
  "distributeur": "distributeur",
  "dab": "distributeur",
  "salle de réunion": "reunion",
  "salle de reunion": "reunion",
  "réunion": "reunion",
  "reunion": "reunion",
};

/** Le pictogramme que suggère un libellé, s'il en existe un. */
const pictoDe = (txt) => PICTO_MOTS[String(txt || "").trim().toLowerCase()] || null;

/**
 * Ce qu'un repère est, et ce qu'il s'appelle.
 *
 * Les deux se confondaient : le pictogramme était deviné depuis le libellé, si
 * bien qu'un repère nommé « Entrée Nord » n'était plus une entrée — ni pour le
 * dessin, ni pour l'itinéraire, ni pour la liste des départs. Un hall qui
 * nomme ses portes perdait donc ce qui les rendait utiles, et il n'y avait pas
 * moyen de nommer deux escaliers sans les déclasser tous les deux.
 *
 * Le type et le libellé sont donc deux choses. Le type porte les propriétés —
 * le pictogramme, l'obstacle en fauteuil, la qualité de porte par où passe un
 * trajet entre pavillons — et se choisit dans une liste. Le libellé ne sert
 * qu'à distinguer un exemplaire d'un autre, et s'écrit librement.
 *
 * Un repère posé avant cette séparation n'a que son libellé : on continue de
 * le deviner pour lui, et son plan s'affiche comme il le faisait. Le type
 * s'écrit dès qu'on y touche.
 *
 * La liste se lit dans l'ordre alphabétique : dix-sept lignes se parcourent à
 * l'œil, et c'est le seul ordre où l'on sait d'avance où regarder. Le tri est
 * fait ici plutôt que laissé à la main, pour qu'un type de plus se range de
 * lui-même. « Sans pictogramme » reste en tête, hors du tri : ce n'est pas un
 * type mais l'absence de choix, et c'est là que `nomTypeRepere` se replie.
 */
const TYPES_REPERE = [{ v: "", nom: "Sans pictogramme" }].concat([
  { v: "pmr",          nom: "Accessibilité" },
  { v: "accueil",      nom: "Accueil" },
  { v: "ascenseur",    nom: "Ascenseur" },
  { v: "cafe",         nom: "Café" },
  { v: "distributeur", nom: "Distributeur" },
  { v: "entree_seule", nom: "Entrée" },
  { v: "entree",       nom: "Entrée/Sortie" },
  { v: "escalator",    nom: "Escalator" },
  { v: "escalier",     nom: "Escalier" },
  { v: "info",         nom: "Information" },
  { v: "parking",      nom: "Parking" },
  { v: "restauration", nom: "Restauration" },
  { v: "reunion",      nom: "Salle de réunion" },
  { v: "secours",      nom: "Secours" },
  { v: "sortie",       nom: "Sortie" },
  { v: "vestiaire",    nom: "Vestiaire" },
  { v: "wc",           nom: "WC" },
].sort((a, b) => a.nom.localeCompare(b.nom, "fr")));
const nomTypeRepere = (v) => (TYPES_REPERE.find(t => t.v === v) || TYPES_REPERE[0]).nom;

/**
 * Ce qu'une zone organisateur est, quand elle est quelque chose de connu.
 *
 * Un visiteur qui cherche où déjeuner, où déposer son manteau ou où se tient
 * la prochaine conférence ne cherche pas un nom : il cherche une fonction. La
 * source n'en dit rien — une zone n'a qu'un contour et parfois un intitulé,
 * « Atmosphère Mobilité » ou « LA SERRE », d'où l'on ne devine pas ce qu'on y
 * fait — et c'est l'exploitant qui la donne, zone par zone, depuis sa fiche.
 *
 * Le type ne change rien au dessin du plan : il ouvre l'entrée du cartouche
 * des points d'intérêt, d'où l'on retrouve d'un geste toutes les zones qui le
 * portent. Ce sont donc les pictogrammes des repères qui le figurent — un
 * visiteur ne distingue pas ce que l'exploitant a dessiné de ce que le salon a
 * fourni, et n'a aucune raison de le faire.
 */
const TYPES_ZONE = [
  { v: "",             nom: "Sans type" },
  { v: "restauration", nom: "Restauration", picto: "restauration" },
  { v: "conferences",  nom: "Conférences",  picto: "reunion" },
  { v: "vestiaire",    nom: "Vestiaire",    picto: "vestiaire" },
  { v: "accueil",      nom: "Accueil",      picto: "accueil" },
];

/** Le type d'une zone, s'il lui en a été donné un. */
const typeZone = (z) => TYPES_ZONE.find(t => t.v && z && t.v === z.type) || null;

/**
 * Le type d'un repère : celui qu'on lui a donné, ou celui que son libellé
 * laisse deviner s'il est d'avant la séparation. Une chaîne vide est un choix
 * — « sans pictogramme » — et non une absence : elle ne se redevine pas.
 */
function pictoForme(f){
  return f.picto === undefined ? pictoDe(f.txt) : f.picto;
}

/**
 * Les trois portes, et ce qu'on en fait.
 *
 * Une porte de hall sert le plus souvent dans les deux sens, et c'est
 * « Entrée/Sortie » qui la dit. Certains salons séparent pourtant les flux —
 * on entre par le parvis, on ressort côté parking — et le trajet qui l'ignore
 * fait sortir le visiteur par où personne ne sort. D'où les deux types à sens
 * unique, et ces trois lectures : ce qui est une porte, ce par quoi on entre,
 * ce par quoi on sort.
 *
 * Un libellé, lui, ne dit jamais le sens : « Sortie » sur un repère d'avant
 * les types reste une porte des deux côtés, faute de savoir si l'on y entre.
 * Seul le type choisi dans la liste tranche — y compris celui d'un repère
 * désigné « Sortie » avant la fusion des deux pictogrammes, qui retrouve ici
 * ce que l'exploitant en avait dit.
 */
const estPorte     = (p) => p === "entree" || p === "entree_seule" || p === "sortie";
const ouvreEntrant = (p) => p === "entree" || p === "entree_seule";
const ouvreSortant = (p) => p === "entree" || p === "sortie";

/* Taille de naissance d'un repère, en mètres. Un texte libre en fait deux ;
   un repère doit se repérer de loin, sans qu'on le cherche. */
const TAILLE_REPERE = 4;

/**
 * Un repère : une pastille dans la couleur du calque, son libellé dedans.
 *
 * La largeur suit le texte, mesurée dans la police de rendu — une pastille
 * taillée au jugé serait trop courte sur « Restauration » et trop longue sur
 * « WC ». Tout est en mètres, comme le reste du plan : le repère grandit donc
 * avec le zoom, à l'inverse d'une épingle d'interface.
 */
function traceRepere(f){
  const t = f.taille || 2;
  /* Le repère répond au clic comme un stand : le plan ne montre plus que le
     pictogramme, et c'est la fiche qui dit son nom. Le rôle et le libellé
     partent avec lui, pour qui lit le plan au clavier ou à la synthèse
     vocale. */
  const dit = String(f.txt || "").trim();
  const type = pictoForme(f);
  const nom = dit || (type ? nomTypeRepere(type) : "Repère");
  const tete = '<g class="forme repere' + (f.id === formeSel ? " pick" : "") +
               '" data-f="' + f.id + '" data-poi="' + esc(f.id) +
               '" tabindex="0" role="button" aria-label="' +
               esc(nom + (type && dit ? " — " + nomTypeRepere(type) : "")) + '">';

  /* Un pictogramme se pose dans un <svg> imbriqué : il porte sa propre grille,
     et le navigateur se charge du cadrage — plus sûr qu'une transformation
     calculée à la main. */
  const g = PICTOS[type];
  if (g){
    /* La pastille ne porte que le pictogramme.
     *
     * Le libellé s'écrivait à côté dès qu'il disait autre chose que lui —
     * « Entrée Nord » avait besoin de son nord. Mais un nom écrit à la taille
     * du plan ne se lit qu'en zoomant, et la pastille s'allongeait de tout ce
     * texte en travers de l'allée qu'elle désigne. Le pictogramme dit ce que
     * c'est, ce qui est la question qu'on se pose de loin ; le nom se demande
     * de près, et c'est la fiche qui le donne. Le cartouche des points
     * d'intérêt, lui, continue de les nommer tous.
     */
    const cote = t * 2.4, m = cote * .15, k = cote - 2 * m;
    const x = f.pts[0][0] - cote / 2, y = f.pts[0][1] - cote / 2;
    return tete +
      '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + cote.toFixed(2) +
      '" height="' + cote.toFixed(2) + '" rx="' + (cote * .2).toFixed(2) + '"/>' +
      '<svg class="glyphe" x="' + (x + m).toFixed(2) + '" y="' + (y + m).toFixed(2) +
      '" width="' + k.toFixed(2) + '" height="' + k.toFixed(2) +
      '" viewBox="' + g.vb + '">' + g.d + '</svg></g>';
  }

  /* Sans pictogramme, le libellé est tout ce que le repère a à montrer : le
     retirer laisserait une pastille muette. */
  const l = largeur(nom, P_NOM) * t;
  const w = l + t * 1.1, ht = t * 1.65;
  const x = f.pts[0][0] - w / 2, y = f.pts[0][1] - ht / 2;
  return tete +
    '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) +
    '" height="' + ht.toFixed(2) + '" rx="' + (ht / 2).toFixed(2) + '"/>' +
    '<text x="' + f.pts[0][0] + '" y="' + (f.pts[0][1] + t * .35).toFixed(2) +
    '" font-size="' + t.toFixed(2) + '">' + esc(nom) + '</text></g>';
}

/* ------------------------------------------------------------
   Les stands dessinés à la main
   ------------------------------------------------------------
   La synchronisation ne rend qu'une forme par dossier : un stand loué à
   plusieurs n'en a donc qu'une, et les sociétés qui s'y installent n'existent
   que dans une liste. Sur le plan elles ne sont nulle part, et le visiteur qui
   cherche l'une d'elles lit le nom d'une autre peint sur la cloison.

   L'exploitant les matérialise donc lui-même : il découpe le stand en autant
   de rectangles qu'il y a d'enseignes, et rattache chacun à la société qu'il
   désigne. Ce n'est pas un dessin de plus — la forme se lit comme un stand,
   même aplat et même libellé, s'ouvre au clic sur la fiche complète de sa
   société, et renvoie l'itinéraire vers le stand qui la porte : on ne marche
   pas jusqu'à un co-exposant, on marche jusqu'à son hôte.
   ------------------------------------------------------------ */

/** L'étiquette sous laquelle une société se désigne : « G55 — SMC2 ». */
const etiquetteSociete = (code, nom) => [code, nom].filter(Boolean).join(" — ");

/** Le nom d'une société tel qu'il s'écrit sur le plan — vide s'il n'y en a
 *  pas, là où la fiche se rabat sur « Sans nom ». */
const nomSurLePlan = (soc) => soc.nom || soc.plan || "";

/**
 * Ce qu'un stand dessiné désigne : l'emplacement, le rang de la société, la
 * société elle-même. Rien, si le lien ne mène plus nulle part — un stand
 * disparu du salon, un co-exposant que la synchronisation d'hier a retiré.
 *
 * On ne se rabat pas alors sur le titulaire : ce serait donner à une enseigne
 * la place d'une autre. La forme reste sur le plan, muette et sans clic, et le
 * panneau d'édition invite à la rattacher de nouveau.
 */
function societeDeForme(f){
  if (!f || f.t !== "stand" || !f.stand) return null;
  const o = parId.get(f.stand);
  if (!o || o.kind !== "stand") return null;
  const i = Number.isInteger(f.soc) ? f.soc : -1;
  const soc = i < 0 ? o : (o.coex || [])[i];
  return soc ? { o: o, i: i, soc: soc } : null;
}

/** Les sociétés du pavillon courant, titulaires et hébergées mêlées : c'est
 *  parmi elles que se choisit ce qu'un stand dessiné matérialise. */
function societesDuPlan(){
  const out = [];
  P().stands.forEach(s => societes(s).forEach(x => {
    const nom = nomSurLePlan(x.soc);
    if (!s.code && !nom) return;
    out.push({ o: s, i: x.i, soc: x.soc,
               etiquette: etiquetteSociete(s.code, nom) || s.id });
  }));
  return out;
}

function remplitListeSocietes(){
  const l = $("listeSoc");
  if (!l) return;
  l.innerHTML = societesDuPlan()
    .map(x => '<option value="' + esc(x.etiquette) + '">').join("");
}

/** Retrouve la société désignée par ce qui a été saisi. */
function societeSaisie(txt){
  const v = String(txt || "").trim().toLowerCase();
  if (!v) return null;
  const l = societesDuPlan();
  return l.find(x => x.etiquette.toLowerCase() === v)
      || l.find(x => nomSurLePlan(x.soc).toLowerCase() === v)
      || null;
}

/**
 * Un stand dessiné, tracé comme le stand qu'il découpe.
 *
 * Il porte l'identifiant de son hôte et le rang de la société qu'on vient y
 * voir : le reste de la page n'a alors rien de nouveau à apprendre — le clic,
 * la sélection, la fiche et l'itinéraire lisent déjà ces deux-là.
 */
function traceStandDessine(f){
  const l = societeDeForme(f);
  const sel = l && l.o.id === state.sel && l.i === state.selSoc;
  const nom = l ? nomSurLePlan(l.soc) : "";
  return '<g class="forme sdes' + (f.id === formeSel ? " pick" : "") +
    (l ? " lie" : "") + (sel ? " sel" : "") + '" data-f="' + f.id + '"' +
    (l ? ' data-id="' + esc(l.o.id) + '" data-soc="' + l.i +
         '" tabindex="0" role="button" aria-label="' +
         esc(nom || ("Stand " + (l.o.code || "")).trim()) + '"' : "") +
    '><path d="' + cheminForme(f) + '"/><g class="lab"></g></g>';
}

/**
 * Le libellé d'un stand dessiné : le nom de sa société, le numéro de
 * l'emplacement dessous — exactement ce qu'un stand du plan écrit.
 *
 * Il vit dans la forme et non dans « #labels », où vivent ceux du plan. Un
 * calque de dessin peut être empilé par-dessus le calque des textes, et son
 * aplat recouvrait alors le nom qu'il était censé porter. Attaché à sa forme,
 * le libellé la suit jusque dans l'ordre des couches.
 *
 * Il se relit à chaque changement de vue, comme les autres : c'est la taille
 * du texte à l'écran qui décide s'il est lisible ou s'il vaut mieux se taire.
 */
function texteStandDessine(f, pxParM){
  const l = societeDeForme(f);
  if (!l) return "";
  const nom = nomSurLePlan(l.soc);
  if (!nom && !l.o.code) return "";
  const b = boite(f);
  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  const sel = l.o.id === state.sel && l.i === state.selSoc;
  if (!sel && (!visibleSociete(l.o, l.i) ||
               cx < view.x - 25 || cx > view.x + view.w + 25 ||
               cy < view.y - 25 || cy > view.y + view.h + 25)) return "";
  return libelleEmplacement({ nom: nom, code: l.o.code }, [cx, cy],
                            b[2] - b[0], b[3] - b[1], sel, pxParM);
}

/** Les libellés de tous les stands dessinés du pavillon, posés dans leurs
 *  formes. Le pavillon en compte quelques dizaines au plus : on les relit
 *  tous plutôt que de tenir à jour ce qui a bougé. */
function poseLibellesDessines(pxParM){
  const z = $("couches");
  for (const cal of mesCalques()){
    for (const f of cal.formes){
      if (f.t !== "stand") continue;
      const lab = z.querySelector('.sdes[data-f="' + CSS.escape(f.id) + '"] .lab');
      if (lab) lab.innerHTML = texteStandDessine(f, pxParM);
    }
  }
}

/**
 * Le découpage qui matérialise une société sur un emplacement, s'il a été
 * dessiné.
 *
 * Un stand dessiné porte l'identifiant de son hôte : c'est ce qui lui donne le
 * clic, la fiche et l'itinéraire sans rien apprendre de neuf au reste de la
 * page. Mais quand deux enseignes se partagent un emplacement, allumer l'hôte
 * allumerait du même coup la voisine, qu'on n'a pas demandée. La sélection
 * s'arrête donc au découpage dès qu'il en existe un pour la société choisie.
 */
function decoupeStand(id, iSoc){
  const z = (id === null || id === undefined) ? null : $("couches");
  return (z && z.querySelector('.dcal .sdes[data-id="' + CSS.escape(String(id)) +
                               '"][data-soc="' + Number(iSoc) + '"]')) || null;
}

/**
 * La sélection des stands dessinés, posée sans retracer les calques : relire
 * un calque réanalyse ses images, ce qui est cher pour un liseré qui change à
 * chaque clic. La classe se pose donc à la main, comme le fait déjà la
 * sélection d'édition.
 */
function marqueStandsDessines(){
  $("couches").querySelectorAll(".dcal .sdes").forEach(g => {
    g.classList.toggle("sel", g.dataset.id === state.sel &&
                              Number(g.dataset.soc) === state.selSoc);

/**
 * Ce qu'un stand dessiné reçoit une fois tracé : la teinte de son secteur, le
 * fondu que le filtre pose sur ce qu'il écarte, et son libellé.
 *
 * Rien de tout cela ne tient dans le gabarit de la forme : les deux premiers
 * se lisent dans les réglages du salon, le troisième dans la vue courante — et
 * le premier montage a lieu avant qu'il y en ait une.
 */
function rafraichitStandsDessines(){
  if (!DATA || !view) return;
  coloreSecteurs();
  $("couches").querySelectorAll(".dcal .sdes[data-id]").forEach(g => {
    const o = parId.get(g.dataset.id);
    g.classList.toggle("dim", !!o && !visibleSociete(o, Number(g.dataset.soc)));
  });
  const r = cadrePlan();
  poseLibellesDessines((r.width || 1) / view.w);
}

/**
 * Les repères, en objets de recherche.
 *
 * Un visiteur qui tape « vestiaire » ou « parking » cherche un endroit du
 * salon, exactement comme il tape le nom d'une enseigne. Le cartouche du bas
 * les récapitule déjà, mais il faut savoir qu'il existe et le parcourir des
 * yeux : la recherche y mène en trois lettres.
 *
 * Ils sont relevés sur les trois pavillons, comme les stands : le sanitaire
 * le plus proche n'est pas forcément dans celui qu'on regarde. Un calque
 * éteint n'en donne aucun — ses repères ne sont pas sur le plan, et la liste
 * promettrait un escalier que le visiteur ne trouverait pas.
 *
 * Le relevé se retient : la recherche le redemande à chaque frappe, et les
 * dessins ne changent qu'entre deux gestes d'édition. « oublieReperes » le
 * jette, aux mêmes endroits que les grilles d'itinéraire.
 */
let REPERES = null;

function oublieReperes(){ REPERES = null; }

function reperesCherchables(){
  if (REPERES) return REPERES;
  REPERES = [];
  (DATA?.plans || []).forEach((p, i) => {
    (DESSINS[p.id] || []).forEach(cal => {
      if (cal.visible === false) return;
      (cal.formes || []).forEach(f => {
        if (f.t !== "repere") return;
        const nom = nomRepere(f);
        /* Le type ne compte que s'il ajoute quelque chose au libellé, et il
           compte alors pour les deux : ce qu'on tape et ce que la ligne
           montre. « Hall Sud » gagne à s'annoncer comme une entrée ; un repère
           sans libellé s'appelle déjà « WC » et n'a rien à gagner d'un « WC »
           en dessous, ni d'un second dans sa chaîne de recherche. Une chaîne
           vide, elle, est un choix — « sans pictogramme » — et ne nomme rien
           qu'on irait taper. */
        const picto = pictoForme(f);
        const type = picto ? nomTypeRepere(picto) : "";
        const ajout = type === nom ? "" : type;
        REPERES.push({
          kind: "poi", id: f.id, p: i, nom: nom, type: ajout,
          rech: (nom + " " + ajout).toLowerCase(),
        });
      });
    });
  });
  return REPERES;
}

/**
 * Un repère ouvert depuis la liste des résultats.
 *
 * Il peut vivre dans un autre pavillon que celui qu'on regarde — la recherche
 * les balaie tous les trois — et sa fiche se lit sur le plan où il est posé.
 * On y passe par « changePlan », qui est le chemin des onglets : il remonte le
 * plan et va chercher le fond du pavillon qu'on n'avait pas encore ouvert. Le
 * montage recrée les calques de dessin, d'où la pastille est relue après lui —
 * pour que la fiche s'anime depuis elle, et non depuis rien.
 *
 * Le dernier argument demande que le plan vienne sur le repère ; la fiche s'en
 * charge une fois posée. Sans lui elle s'ouvrait sur un escalier que rien ne
 * montrait, et il restait à trouver le bouton « Centrer sur le plan » pour voir
 * où il est — le clic dans la liste disait pourtant déjà qu'on y allait.
 */
function vaAuRepere(id, p){
  changePlan(p);
  ouvrePoi(id, $("couches").querySelector('.repere[data-poi="' + CSS.escape(id) + '"]'),
           true);
}

/**
 * Cartouche des points d'intérêt.
 *
 * Les repères posés sur un plan se répètent — plusieurs sanitaires, plusieurs
 * entrées — et se cherchent à l'œil. Le cartouche les récapitule par libellé ;
 * en choisir un met en avant tous ceux qui le portent, où qu'ils soient.
 *
 * Les zones organisateur auxquelles l'exploitant a donné un type y entrent de
 * la même façon, et sous la même clé : ce qui s'appelle « Restauration » d'un
 * côté et de l'autre est la même chose pour qui cherche à déjeuner, et deux
 * pastilles identiques n'auraient rien appris. Ce que l'une a été dessinée et
 * l'autre fournie par le salon ne regarde pas le visiteur.
 */
let poiChoisi = null;

function cartouchePoi(){
  const z = $("poi");
  if (!z) return;
  const parNom = new Map();
  const entree = (nom, picto) => {
    if (!parNom.has(nom)) parNom.set(nom, { n: 0, picto: picto || null });
    const e = parNom.get(nom);
    // le premier qui en porte un le donne : un repère sans pictogramme et une
    // zone typée sous le même nom ne doivent pas faire une pastille muette
    if (!e.picto && picto) e.picto = picto;
    return e;
  };

  for (const cal of mesCalques()){
    if (cal.visible === false) continue;
    for (const f of cal.formes){
      if (f.t !== "repere" || !f.txt) continue;
      entree(f.txt.trim(), pictoForme(f)).n++;
    }
  }
  /* Une zone que l'exploitant a éteinte, ou tout un calque de zones retiré du
     plan, ne comptent pas : le cartouche promettrait une restauration que le
     visiteur ne trouverait nulle part. */
  if (conf("data:zones").visible !== false){
    for (const zo of P().zones){
      const t = typeZone(zo);
      if (t && !zo.masquee) entree(t.nom, t.picto).n++;
    }
  }

  z.hidden = parNom.size === 0;
  /* Le pavillon d'à côté n'a pas les mêmes points d'intérêt : ce qui n'y est
     plus ne peut pas rester choisi, sans quoi le plan resterait en retrait
     sans que rien n'y soit mis en avant. */
  if (poiChoisi && !parNom.has(poiChoisi)) poiChoisi = null;
  if (z.hidden){ poiChoisi = null; eclairePoi(); mesureCartouche(); return; }

  z.innerHTML = "";
  [...parNom.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "fr"))
    .forEach(([nom, o]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "poiBtn";
      b.setAttribute("aria-pressed", nom === poiChoisi);
      const g = PICTOS[o.picto];
      // largeur et hauteur en attributs : un <svg> sans dimension explicite
      // s'étale à la place disponible, et le cartouche y perdait sa mise en page
      b.innerHTML = (g
        ? '<svg class="poiPicto" width="17" height="17" viewBox="' + g.vb +
          '" aria-hidden="true">' + g.d + '</svg>'
        : "") + '<span></span>' + (o.n > 1 ? '<i>' + o.n + '</i>' : "");
      b.querySelector("span").textContent = nom;
      b.onclick = () => {
        const choisit = poiChoisi !== nom;
        poiChoisi = choisit ? nom : null;
        /* Les repères d'un même type sont dispersés dans le hall. Les mettre
           en avant sans reculer ne montrerait que ceux déjà à l'écran, et
           l'exploitant conclurait qu'il n'y en a pas d'autres. On revient donc
           sur le plan entier, où ils se comptent d'un coup d'œil. */
        if (choisit) fit();
        cartouchePoi();
      };
      z.appendChild(b);
    });
  eclairePoi();
  mesureCartouche();
}

/**
 * La fiche d'un repère.
 *
 * Le plan ne montre plus que le pictogramme ; le nom n'est pas perdu pour
 * autant, il est ce que le clic donne — comme une forme de stand donne la
 * fiche de son exposant. On y lit ce que le repère est, comment il s'appelle,
 * et, quand c'est un passage, ce qu'il dessert : un escalier qui monte à deux
 * étages le dit ici, et nulle part ailleurs.
 *
 * La fiche est celle des stands, remplie autrement : elle partage la même
 * bande que le parcours et l'itinéraire, et deux fiches ouvertes en même
 * temps ne se liraient pas. Elle en reprend donc le contrat : « depuis » est
 * la pastille d'où la fiche s'étire — le nœud, mesuré à la fin — et
 * « recentrer » demande que le plan vienne sur le repère, ce qui n'a de sens
 * qu'une fois la fiche posée, seule à savoir ce qu'elle masque.
 */
function ouvrePoi(id, depuis, recentrer){
  const cible = formeParId(id);
  if (!cible || cible.f.t !== "repere") return;
  const f = cible.f, p = P();
  fermeParcours(); fermeItineraire();

  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  const noeudPoi = $("couches").querySelector('.repere[data-poi="' + CSS.escape(id) + '"]');
  if (noeudPoi) noeudPoi.classList.add("sel");

  const type = pictoForme(f);
  const dit = String(f.txt || "").trim();
  $("dKind").hidden = false;
  $("dKind").textContent = type ? nomTypeRepere(type) : "Repère";
  $("dName").textContent = dit || (type ? nomTypeRepere(type) : "Repère");
  /* Ni numéro ni filigrane : un repère n'en a pas, et sans cette remise à zéro
     la fiche portait celui du stand consulté juste avant. */
  poseCode(p, "", "");
  /* Un repère porte un picto, jamais un logo : sans cet effacement, la fiche
     d'un escalier gardait la marque du stand consulté juste avant. */
  poseMarque("");
  $("dNeuf").hidden = true;
  $("dPartage").hidden = true;
  /* « Affiché : oui/non » gouverne une zone organisateur, pas un repère. Restée
     visible, elle basculait encore la visibilité de la zone d'avant. */
  if ($("dVis")) $("dVis").hidden = true;
  /* Un repère ne se retient pas dans un parcours : on ne visite pas un
     escalier, on le prend. */
  const sig = $("dMarque");
  sig.hidden = true;
  delete sig.dataset.mg; delete sig.dataset.mi;
  if ($("dRen")) $("dRen").hidden = true;
  $("dOnglets").hidden = true;
  $("detail").classList.remove("deux");
  onglet("detail");

  /* Ce qu'un passage dessert, avec le temps qu'il demande : c'est ce qui
     distingue deux escaliers voisins, et ce qu'un visiteur cherche à savoir
     avant de s'y engager. */
  const liens = typeLiaison(f) ? liensDe(f) : [];
  const dessert = liens.length
    ? '<div class="field"><span class="eyebrow">Mène à</span><span class="v">' +
      liens.map(x => '<span class="ligne">' +
        esc(x.o.p.libelle + " · " + nomRepere(x.o.f)) + " — " +
        esc(ecritMinutes(x.min == null ? typeLiaison(f).min : x.min)) +
        '</span>').join("") + "</span></div>"
    : "";

  $("dBody").innerHTML = '<div class="cInfos" id="dPaneInfos">' + dessert + "</div>" +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  $("dGo").onclick = () => centrePoint(f.pts[0]);
  // « j'y vais » : l'arrivée est ce repère, le départ reste à dire
  $("dItin").onclick = () => versItineraireDe(pointRepere(f, p));

  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  if (recentrer) centrePoint(f.pts[0]);
  anime(rectVisee(depuis), 1);
}

/**
 * Hauteur du cartouche, donnée au CSS.
 *
 * Sur un écran étroit le cartouche est assez large pour recouvrir l'échelle,
 * qui vit dans le même coin bas. Le commentaire de la feuille de style
 * affirmait qu'il « se retire de l'échelle » : c'était vrai sur un grand
 * écran, où il n'atteignait pas la marge gauche. À 412 pixels il la traverse.
 * L'échelle se pose donc au-dessus de lui, d'après sa hauteur réelle — nulle
 * quand il est absent, auquel cas rien ne bouge.
 */
function mesureCartouche(){
  const z = $("poi");
  const h = z && !z.hidden ? z.offsetHeight + 8 : 0;
  document.documentElement.style.setProperty("--cartouche", h + "px");
}

/** Ce qu'un point d'intérêt choisi met en avant : repères et zones à la fois. */
const phareRepere = (f) => Boolean(poiChoisi && f && String(f.txt || "").trim() === poiChoisi);
const phareZone = (o) => Boolean(poiChoisi && o && o.kind === "zone" &&
  (typeZone(o) || {}).nom === poiChoisi);

/** Met en avant les repères et les zones du point d'intérêt choisi. */
function eclairePoi(){
  $("couches").querySelectorAll(".dcal .repere").forEach(g => {
    const f = formeParId(g.dataset.f);
    g.classList.toggle("phare", phareRepere(f && f.f));
  });
  $("zones").querySelectorAll("g").forEach(g =>
    g.classList.toggle("phare", phareZone(parId.get(g.dataset.id))));
  /* Le libellé d'une zone mise en avant est ce qui la nomme : le laisser en
     retrait avec le reste du plan aurait effacé la seule chose qui distingue
     deux restaurations. Il se réécrit à chaque déplacement de la vue, et
     reprend donc sa marque dans « libelles() ». */
  $("labels").querySelectorAll(".lbl").forEach(g =>
    g.classList.toggle("phare", phareZone(parId.get(g.dataset.lbl))));
  racine.classList.toggle("poi-actif", !!poiChoisi);
}

/**
 * Le retrait ne survit pas au geste qui l'ignore.
 *
 * Le cartouche met une famille de repères en avant et recule tout le reste à
 * seize pour cent. Ce retrait est une réponse à une question posée — « où
 * mange-t-on ? » — et il n'a plus rien à dire dès que le visiteur en pose une
 * autre. Or rien sur le plan ne le levait : ouvrir la fiche d'un stand éteint,
 * ou taper le fond pour refermer, laissaient le plan délavé et la pastille
 * allumée. Il fallait retrouver celle-ci dans le cartouche et la rappuyer, ce
 * que personne ne devine.
 *
 * Un repère ou une zone déjà mis en avant font exception : les ouvrir, c'est
 * se servir de la mise en avant, pas en sortir. On reconnaît les uns et les
 * autres à la marque qu'« eclairePoi » leur a posée — la même qui les tient
 * en pleine lumière.
 */
function oublieChoixPoi(cible){
  if (!poiChoisi) return;
  if (cible && cible.classList.contains("phare")) return;
  poiChoisi = null;
  cartouchePoi();
}

/* Un bref halo, réservé à l'image posée automatiquement : sans lui on la
   cherche, et on croit qu'il reste un bouton à valider. */
function signale(id){
  const g = $("couches").querySelector('.forme[data-f="' + CSS.escape(id) + '"]');
  if (!g || REDUIT) return;
  g.classList.add("neuve");
  setTimeout(() => g.classList.remove("neuve"), 1300);
}

/* --- import d'image ---
   L'image est réduite et convertie en data-URI : une page publiée ne peut
   charger aucune ressource externe, tout doit vivre dans le document.   */
let imageEnAttente = null;
const MAX_PX = 1400;

/* On ne refuse plus une image faute de calque actif : on en ouvre un. */
function calquePourImage(){
  if (calqueActif && trouveCalque(calqueActif)) return trouveCalque(calqueActif);
  /* Le dernier calque s'ouvre d'office, mais pas s'il est verrouillé : l'image
     glissée sur le plan est le seul tracé qui n'ait pas eu à choisir son
     calque, et elle se poserait donc sur celui qu'on protège. Tous fermés, on
     en ouvre un neuf plutôt que de refuser l'image. */
  const libres = mesCalques().filter(c => !verrouille(c));
  if (libres.length){ activeCalque(libres[libres.length - 1].id); return trouveCalque(calqueActif); }
  memorise();
  const c = { id: nouvelId(), nom: "Images", couleur: "#2F49D1",
              rempli: false, visible: true, formes: [] };
  mesCalques().push(c); enregistreDessins(); construitPanneau(); activeCalque(c.id);
  return c;
}

/* Pose l'image autour d'un point, à une taille lisible au zoom courant.
   Plus besoin de tracer un cadre : on ajuste ensuite si besoin. */
function poseImage(centre){
  if (!imageEnAttente) return;
  calquePourImage();
  const l = Math.max(4, view.w * .28);
  const ht = l / imageEnAttente.ratio;
  const c = centre || [view.x + view.w / 2, view.y + view.h / 2];
  const id = ajouteForme({ t: "image", src: imageEnAttente.src,
    pts: [[+(c[0] - l / 2).toFixed(2), +(c[1] - ht / 2).toFixed(2)],
          [+(c[0] + l / 2).toFixed(2), +(c[1] + ht / 2).toFixed(2)]] });
  signale(id);   // l'emplacement n'a pas été choisi : il faut le montrer
  $("outilsAide").textContent = "Image posée au centre de la vue. Glissez sur le plan pour en poser une autre.";
}

function importeImage(fichier, centre){
  if (!fichier || fichier.type.indexOf("image/") !== 0) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const type = fichier.type === "image/jpeg" ? "image/jpeg" : "image/webp";
      imageEnAttente = { src: c.toDataURL(type, .85), ratio: img.width / img.height };
      const v = $("vignette");
      v.innerHTML = '<img alt=""><span></span>';
      v.querySelector("img").src = imageEnAttente.src;
      v.querySelector("span").textContent =
        Math.round(imageEnAttente.src.length / 1365) + " Ko";
      v.dataset.prete = "1";
      choisitOutil("image");
      poseImage(centre);
    };
    img.onerror = () => { $("outilsAide").textContent = "Image illisible."; };
    img.src = fr.result;
  };
  fr.readAsDataURL(fichier);
}

$("fichierImage").onchange = e => { importeImage(e.target.files[0]); e.target.value = ""; };
$("choisirImage").onclick = () => $("fichierImage").click();

/* glisser-déposer sur le plan, et collage clavier : deux chemins qui ne
   dépendent pas de la boîte de dialogue système */
// le pointeur sorti du plan ne vise plus rien : les points d'accrochage s'effacent
svg.addEventListener("pointerleave", () => { if (!enCours && !geste) montreAimants(null); });

svg.addEventListener("dragover", e => { if (ADMIN) e.preventDefault(); });
svg.addEventListener("drop", e => {
  if (!ADMIN) return;
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) importeImage(f, versPlan(e.clientX, e.clientY));
});
addEventListener("paste", e => {
  if (!ADMIN) return;
  const it = [...(e.clipboardData ? e.clipboardData.items : [])]
    .find(x => x.type.indexOf("image/") === 0);
  if (it) importeImage(it.getAsFile());
});

/* --- gestion du geste de dessin ; renvoie true si l'événement est consommé --- */
function dessinPointerDown(e){
  if (editionPointerDown(e)) return true;
  if (!ADMIN || !calqueActif || outil === "main") return false;
  // sans cela le navigateur démarre une sélection de texte et le
  // relâchement du pointeur ne revient jamais
  e.preventDefault();
  if (outil === "rect" || outil === "image" || outil === "stand"){
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  }
  /* Le contour de hall garde son propre redressement : deux aimantations qui
     tirent le même point chacune de son côté ne se corrigeraient pas, elles
     se disputeraient. */
  const brut = versPlan(e.clientX, e.clientY);
  const p = outil === "contour" ? brut : aimante(brut, { alt: e.altKey });
  if (outil === "texte"){
    const txt = $("texteADessiner").value.trim();
    if (!txt){ $("texteADessiner").focus(); return true; }
    ajouteForme({ t: "texte", pts: [p], txt: txt, taille: 2 });
    return true;
  }
  if (outil === "repere"){
    const type = $("repereType").value;
    /* Le libellé peut rester vide quand le pictogramme se suffit : c'est le
       cas ordinaire d'un WC. Sans type ni libellé, en revanche, il n'y aurait
       rien à poser. */
    const txt = $("repereTexte").value.trim() || (type ? nomTypeRepere(type) : "");
    if (!txt){ $("repereTexte").focus(); return true; }
    // un repère se lit de loin : il naît deux fois plus grand qu'un texte
    ajouteForme({ t: "repere", pts: [p], txt: txt, picto: type, taille: TAILLE_REPERE });
    return true;
  }
  if (outil === "rect"){ enCours = { t: "rect", pts: [p, p] }; return true; }
  /* Un stand dessiné ne vaut que par la société qu'il désigne : sans elle on
     poserait un rectangle muet, invisible pour le visiteur puisqu'il n'ouvre
     aucune fiche. On demande donc l'exposant avant le tracé, comme on demande
     son libellé à un repère. */
  if (outil === "stand"){
    const l = societeSaisie($("standSoc").value);
    if (!l){
      $("outilsAide").textContent = "Choisissez d'abord l'exposant à matérialiser.";
      $("standSoc").focus(); $("standSoc").select();
      return true;
    }
    enCours = { t: "stand", pts: [p, p], stand: l.o.id, soc: l.i };
    return true;
  }
  if (outil === "image"){
    if (!imageEnAttente){ $("outilsAide").textContent = "Choisissez d’abord une image."; return true; }
    enCours = { t: "image", pts: [p, p] };
    return true;
  }
  /* Le contour est un polygone, tracé la main tenue : chaque sommet est
     redressé sur celui d'avant, et revenir sur le premier referme la
     silhouette — c'est le geste que l'on cherche en arrivant là. */
  if (outil === "contour"){
    if (!enCours) enCours = { t: "poly", pts: [p] };
    else {
      const g = {};
      const q = redresseTrace(p, enCours.pts, g);
      if (fermeIci(q, enCours.pts) || fermeIci(p, enCours.pts)){ termineTrace(true); return true; }
      enCours.pts.push(q);
    }
    apercuGuide(null);
    apercu(cheminForme({ t: "ligne", pts: enCours.pts }));
    aide();
    return true;
  }
  // polygone et ligne : un clic par sommet
  if (!enCours) enCours = { t: outil, pts: [p] };
  else enCours.pts.push(p);
  apercu(cheminForme({ ...enCours, t: "ligne" }));
  aide();
  return true;
}
function dessinPointerMove(e){
  if (editionPointerMove(e)) return true;
  if (!enCours){
    /* Sans tracé commencé on ne consomme rien — la vue doit rester déplaçable
       — mais on montre déjà ce que l'outil pourrait viser : c'est en
       approchant du stand voisin qu'on veut savoir si son coin se saisit. */
    if (ADMIN && calqueActif && outil !== "main" && outil !== "contour")
      montreAimants([versPlan(e.clientX, e.clientY)], { alt: e.altKey });
    return false;
  }
  const brut = versPlan(e.clientX, e.clientY);
  const p = outil === "contour" ? brut : aimante(brut, { alt: e.altKey });
  if (estCadre(enCours)){
    enCours.pts[1] = p;
    if (enCours.t === "image"){    // on respecte les proportions de l'image
      const l = enCours.pts[1][0] - enCours.pts[0][0];
      enCours.pts[1][1] = +(enCours.pts[0][1] + Math.abs(l) / imageEnAttente.ratio).toFixed(2);
    }
    apercu(cheminForme(enCours));
    montreCote(coteCadre(enCours.pts[0], enCours.pts[1]), enCours.pts[1]);
  } else {
    let q = p;
    if (outil === "contour"){
      const g = {};
      q = redresseTrace(p, enCours.pts, g);
      // de retour sur le premier sommet : montrer la boucle telle qu'elle
      // se fermerait, plutôt qu'un segment qui passe à côté
      if (fermeIci(q, enCours.pts) || fermeIci(p, enCours.pts)){ q = enCours.pts[0]; g.q = null; }
      traceGuide(g, q);
    }
    apercu(cheminForme({ t: "ligne", pts: [...enCours.pts, q] }));
    /* Sur un tracé, la cote est celle du segment qu'on est en train de poser :
       c'est la longueur du mur, ou du côté, qu'on cherche à faire juste. */
    const b = enCours.pts[enCours.pts.length - 1];
    montreCote(ecritMetres(Math.hypot(q[0] - b[0], q[1] - b[1])) + " m", q);
  }
  return true;
}
function dessinPointerUp(e){
  if (editionPointerUp(e)) return true;
  if (!enCours) return false;
  if (e && e.pointerId != null){
    try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  if (estCadre(enCours)){
    const tracee = () => Math.abs(enCours.pts[1][0] - enCours.pts[0][0]) > .3 &&
                         Math.abs(enCours.pts[1][1] - enCours.pts[0][1]) > .3;
    /* Un clic sans glisser n'est pas un geste manqué : c'est la demande de
       reposer la taille précédente, une fois qu'on l'a trouvée. Le coin
       cliqué, que l'aimant vient de poser juste, en devient l'origine. */
    if (!tracee()) reprendTaille(enCours);
    const pose = tracee() ? enCours : null;
    if (pose){
      const a = pose.pts[0], b = pose.pts[1];
      if (pose.t === "image"){
        pose.pts = [[Math.min(a[0], b[0]), Math.min(a[1], b[1])],
                    [Math.max(a[0], b[0]), Math.max(a[1], b[1])]];
        pose.src = imageEnAttente.src;
      }
      retientTaille(pose);
      ajouteForme(pose);
    }
    enCours = null; apercu(null); apercuGuide(null); montreCote(null);
    /* Le curseur n'a pas bougé : les points d'accrochage se recentrent sur
       lui, plutôt que de rester autour du coin d'où partait le tracé. */
    montreAimants(e ? [versPlan(e.clientX, e.clientY)] : null, { alt: e && e.altKey });
    /* Un stand loué à cinq se découpe en cinq : on enchaîne, et le champ redit
       lequel vient d'être posé plutôt que de se vider en silence. Le reste
       reprend la palette, qui annonce alors la taille qu'un clic reposerait —
       appelée avant, elle aurait décrit un tracé qui n'existe plus. */
    if (pose && pose.t === "stand") enchaineStand(pose); else aide();
  }
  return true;   // polygone et ligne restent ouverts jusqu'à Entrée
}
function termineTrace(valider){
  if (!enCours) return;
  const mini = enCours.t === "ligne" ? 2 : 3;
  // l'arrondi se lit à la validation : on peut le régler le tracé commencé
  if (outil === "contour" && rayonContour() > 0) enCours.r = rayonContour();
  // l'épaisseur et le style se lisent de même, à la fin du tracé
  if (outil === "ligne" && enCours.t === "ligne") poseTrait(enCours);
  if (valider && enCours.pts.length >= mini) ajouteForme(enCours);
  enCours = null; apercu(null); apercuGuide(null); montreCote(null);
  montreAimants(null); aide();
}

function aide(){
  if (!$("outilsAide")) return;
  const t = { main: formeSel ? "Glissez pour déplacer, les carrés pour redimensionner."
                             : "Cliquez une forme de ce calque pour la modifier.",
              rect: "Cliquez-glissez pour tracer un rectangle.",
              poly: "Un clic par sommet, Entrée pour fermer, Échap pour annuler.",
              contour: "Un clic par angle du hall. Revenez sur le premier point, " +
                       "ou Entrée, pour fermer le contour.",
              ligne: "Un clic par point, Entrée pour terminer, Échap pour annuler.",
              texte: "Saisissez le texte, puis cliquez à l'emplacement voulu.",
              repere: "Choisissez ou saisissez un libellé, puis cliquez à l'emplacement.",
              stand: "Choisissez l'exposant, puis cliquez-glissez sur sa part du stand.",
              image: imageEnAttente ? "Glissez sur le plan pour poser une autre copie."
                                    : "Choisissez une image, ou déposez le fichier sur le plan.",
              _: "" };
  const n = enCours ? " (" + enCours.pts.length + " point" + (enCours.pts.length > 1 ? "s" : "") + ")" : "";
  /* Ce qu'un simple clic reposerait, dit avec ses mesures : une taille qu'on
     ne voit pas annoncée est une taille qu'on retrace à la main. */
  const d = DERNIERE[outil];
  const bis = d && !enCours
    ? " Un clic simple repose " + ecritMetres(d[0]) + " × " + ecritMetres(d[1]) + " m." : "";
  $("outilsAide").textContent = t[outil] + n + bis;
}

/* --- suppression au clic en mode sélection --- */
function choisitOutil(o){
  termineTrace(false);
  // les points visés par l'outil qu'on quitte n'ont plus lieu d'être montrés
  montreAimants(null);

  b.classList.toggle("mode-texte", o === "texte");
  b.classList.toggle("mode-contour", o === "contour");
  b.classList.toggle("mode-ligne", o === "ligne");
  b.classList.toggle("mode-repere", o === "repere");
  b.classList.toggle("mode-stand", o === "stand");
  racine.classList.toggle("mode-edition", ADMIN && o === "main");
  if (o === "texte") $("texteADessiner").focus();
  if (o === "repere") $("repereTexte").focus();
  if (o === "stand"){ remplitListeSocietes(); $("standSoc").focus(); }

}

/** Le stand posé nomme sa société, et rend la main pour la suivante. */
function enchaineStand(f){

$("annuleDernier").onclick = annule;
/* Changer le pas, ou couper l'accrochage, se voit tout de suite : les points

if ($("aimantPas")) $("aimantPas").onchange = () => montreAimants(null);

$("elemStand").onblur = appliqueLiaison;

function activeCalque(id){
  /* Un calque verrouillé ne s'ouvre pas : tous les gestes d'édition — tracer,
     saisir une forme, la déplacer, l'effacer — passent par le calque ouvert, et
     le verrou n'a donc rien d'autre à retenir. Le panneau éteint déjà son
     crayon ; restent les chemins de traverse, comme l'image déposée sur le
     plan, qui aboutissent tous ici. */
  const vise = trouveCalque(id);
  if (vise && verrouille(vise)) return;
  calqueActif = calqueActif === id ? null : id;
  /* Les deux crayons du panneau — celui d'un calque, celui des textes — ne
     peuvent pas être allumés ensemble : leurs glissers viseraient le même
     pointeur. Entrer dans le placement des libellés referme déjà le dessin ;
     l'inverse manquait, et le crayon des textes serait resté allumé pour un
     mode qu'on venait de quitter. */
  if (calqueActif && PLACE_LIBELLES) modePlacementLibelles(false);
  formeSel = null;
  termineTrace(false);
  montreAimants(null);
  const c = trouveCalque(calqueActif);
  { const o = $("outils"); if (o) o.classList.toggle("open", !!c); }
  if (c && $("outilsCalque")) $("outilsCalque").textContent = "Dessin · " + c.nom;
  montreRoleIti(c);
  rafraichitApercu();
  dessineDessins();   // la couche active redevient cliquable
  dessinePoignees(); majElement();
  /* Les lignes des calques de dessin seules : le crayon des textes porte le
     même bouton sans être un calque, et se règle de son côté. */
  document.querySelectorAll("#pile .calq[data-dcal]").forEach(d => {
    const actif = d.dataset.dcal === calqueActif;
    d.classList.toggle("actif", actif);
    const cr = d.querySelector(".ren");
    if (cr) cr.setAttribute("aria-pressed", actif);
  });
  aide();
}

/* ------------------------------------------------------------
   Le verrou d'un calque
   Un plan finit par porter un calque qu'on ne retouche plus : le contour du
   hall, les murs qui barrent les trajets, le repérage posé une fois pour
   toutes. Il reste pourtant à un clic du crayon, et une forme y part à la
   dérive sans qu'on s'en aperçoive — on croyait dessiner sur le calque d'à
   côté. Le cadenas de sa ligne le ferme : il ne s'ouvre plus au dessin, et ne
   se supprime ni ne se renomme.

   Ce qu'il laisse passer, il le laisse exprès. La coche qui le masque et sa
   couleur ne touchent pas à ce qui est dessiné, et c'est justement en les
   réglant qu'on travaille autour d'un calque qu'on protège ; son rang dans la
   pile non plus — il se reprend d'un geste, et se voit.

   Le verrou se range dans les réglages du salon, comme le rôle d'un calque
   dans les itinéraires : la table des calques n'a pas de colonne pour lui, et
   il part ainsi aux autres postes avec eux, tout seul. Ouvert, sa clé disparaît
   plutôt que de valoir « non » : un calque supprimé ne laisse alors rien
   derrière lui.
   ------------------------------------------------------------ */
const cleVerrou = (id) => "_verrou:" + id;
const verrouille = (c) => !!c && !!(CONF[cleVerrou(c.id)] || {}).verrou;

function basculeVerrou(c){
  const cle = cleVerrou(c.id);
  if (verrouille(c)) delete CONF[cle];
  else {
    conf(cle).verrou = true;
    /* On ferme parfois le calque sur lequel on vient de dessiner : les outils
       se replient avec lui, sans quoi le crayon resterait armé sur un calque
       qu'on vient de protéger. */
    if (calqueActif === c.id) activeCalque(null);
  }
  enregistreConf();
  construitPanneau();
}

/** Le dessin du cadenas. Fermé, l'anse retombe sur le boîtier ; ouvert, elle
 *  se relève d'un côté — à douze pixels, c'est la seule différence qui se
 *  voie encore, là où deux teintes du même tracé se confondraient. */
const pictoVerrou = (ferme) =>
  '<svg class="pictoVerrou" viewBox="0 0 12 12" aria-hidden="true">' +
  '<rect x="2.3" y="5.4" width="7.4" height="5.2" rx="1.1"/>' +
  '<path d="' + (ferme ? "M4.3 5.4V3.8a1.7 1.7 0 0 1 3.4 0v1.6"
                       : "M4.3 5.4V3.8a1.7 1.7 0 0 1 3.4 0") + '"/></svg>';

/* ------------------------------------------------------------
   Le rôle du calque dans les itinéraires
   ------------------------------------------------------------ */
/** Ce que le rôle change, en une phrase — sans quoi on le règle au hasard. */
const AIDE_ROLE = {
  "": "Ce calque n'entre pas dans le calcul des trajets.",
  obstacle: "Ce qui est dessiné ici barre le passage à tout le monde : " +
    "entourez les sanitaires, les locaux, les réserves. C'est le plus court chemin — " +
    "quelques rectangles au lieu de toutes les allées.",
  pmr: "Ce qui est dessiné ici n'est contourné qu'en itinéraire accessible : " +
    "pentes, emmarchements, estrades.",
  circulation: "Les trajets ne sortiront plus de ce qui est dessiné ici, et il faudra " +
    "donc tracer toutes les allées. Faites-les telles qu'elles sont : le dégagement " +
    "au bord est retiré tout seul.",
  "circulation-pmr": "Ce qui est dessiné ici ne s'ouvre qu'en itinéraire accessible, " +
    "et reste fermé aux autres : le couloir qui mène à l'ascenseur, la rampe qui " +
    "contourne les marches. Faites-le mordre d'un bon mètre sur l'allée qu'il rejoint, " +
    "sans quoi il débouche sur un mur — cette morsure se ferme aux autres comme le " +
    "reste, ne barrez donc pas l'allée en travers.",
};

/* Un calque de rôle décrit le terrain, pas ce qu'on montre : l'éteindre le
   retire de l'écran sans le retirer du calcul. C'est ce qu'on attend d'un mur,
   et c'est assez surprenant pour être écrit sous la liste. */
const AIDE_ROLE_MASQUE = " Masquer le calque ne change rien au calcul : " +
  "le dessin disparaît de l'écran, pas du terrain.";

function montreRoleIti(c){
  const sel = $("roleIti");
  if (!sel) return;
  // la liste se remplit au premier passage : les rôles vivent dans un module
  // assemblé après celui-ci
  if (!sel.options.length)
    sel.innerHTML = ROLES_ITI.map(r =>
      '<option value="' + r.v + '">' + esc(r.nom) + '</option>').join("");
  const r = c ? roleIti(c) : "";
  sel.value = r;
  $("roleAide").textContent = (AIDE_ROLE[r] || "") + (r ? AIDE_ROLE_MASQUE : "");
}

$("roleIti").onchange = e => {
  const c = trouveCalque(calqueActif);
  if (!c) return;
  const v = e.target.value;
  const cle = cleRoleIti(c.id);
  if (v) conf(cle).role = v; else delete CONF[cle];
  enregistreConf();
  oublieGrilles();
  montreRoleIti(c);
  dessineDessins();
  construitPanneau();
  rafraichitApercu();
  // le trajet affiché doit obéir sur-le-champ : c'est le seul retour visible
  relance();
};

$("voirNappe").onchange = e => { voirNappe = e.target.checked; rafraichitApercu(); };

function creeCalque(){
  demandeNom("Nouveau calque", "Calque " + (mesCalques().length + 1), nom => {
    memorise();
    const c = { id: nouvelId(), nom: nom, couleur: "#2F49D1",
                rempli: false, visible: true, formes: [] };
    mesCalques().push(c);
    enregistreDessins();
    construitPanneau();
    activeCalque(c.id);
  });
}

/* saisie du nom dans une fenêtre : plus visible qu'un double-clic */
function demandeNom(titre, valeur, suite){
  let champ;
  ouvreModale(titre, corps => {
    champ = document.createElement("input");
    champ.className = "nomcalque";
    champ.value = valeur;
    champ.setAttribute("aria-label", "Nom du calque");
    corps.appendChild(champ);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); valide(); }
    };
  }, [
    { libelle: "Annuler" },
    { libelle: "Valider", action: () => suite((champ.value || valeur).trim() || valeur) },
  ]);
  function valide(){ const v = (champ.value || valeur).trim() || valeur; fermeModale(); suite(v); }
}

function renommeCalque(c, apres){
  demandeNom("Renommer le calque", c.nom, nom => {
    memorise();
    c.nom = nom;
    enregistreDessins();
    construitPanneau();
    if (calqueActif === c.id) $("outilsCalque").textContent = "Dessin · " + c.nom;
    if (apres) apres();
  });
}


/* ============================================================
   Édition des formes existantes
   En mode Sélection : un clic choisit, un glisser déplace, les poignées
   redimensionnent ou déplacent les sommets. Les poignées sont recalculées
   à chaque changement de vue pour garder une taille constante à l'écran.
   ============================================================ */
let formeSel = null;
let geste = null;

function formeParId(id){
  for (const c of mesCalques()){
    const f = c.formes.find(x => x.id === id);
    if (f) return { c: c, f: f };
  }
  return null;
}

function boite(f){
  const xs = f.pts.map(p => p[0]), ys = f.pts.map(p => p[1]);
  return [Math.min.apply(null, xs), Math.min.apply(null, ys),
          Math.max.apply(null, xs), Math.max.apply(null, ys)];
}

/* Le curseur annonce ce que fera la poignée. Sur un rectangle les coins
   sont diagonaux ; sur un polygone chaque sommet se déplace librement. */
function curseurPoignee(f, i){
  if (estCadre(f)) return ["nwse-resize", "nesw-resize", "nwse-resize", "nesw-resize"][i];
  return "move";
}

function poignees(f){
  if (estCadre(f)){
    const b = boite(f);
    return [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
  }
  if (f.t === "texte") return [f.pts[0]];
  return f.pts;
}

function dessinePoignees(){
  let g = $("poignees");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "poignees";
    svg.appendChild(g);
  }
  const cible = formeSel && formeParId(formeSel);
  if (!cible || !ADMIN || outil !== "main" || !calqueActif){ g.innerHTML = ""; return; }
  const f = cible.f;
  const r = cadrePlan();
  const t = Math.max(.15, view.w / (r.width || 1) * 5);   // demi-côté, en mètres
  const b = boite(f);
  const marge = t;
  g.innerHTML =
    '<rect class="cadreSel" x="' + (b[0] - marge) + '" y="' + (b[1] - marge) +
    '" width="' + (b[2] - b[0] + 2 * marge) + '" height="' + (b[3] - b[1] + 2 * marge) + '"/>' +
    poignees(f).map((p, i) =>
      '<rect class="pgn" data-i="' + i + '" style="cursor:' + curseurPoignee(f, i) + '"' +
      ' x="' + (p[0] - t) + '" y="' + (p[1] - t) +
      '" width="' + (2 * t) + '" height="' + (2 * t) + '"/>').join("");
}

function choisitForme(id){
  formeSel = id;
  // on bascule la classe plutôt que de tout retracer : inutile de réanalyser
  // les images à chaque changement de sélection
  $("couches").querySelectorAll(".dcal .forme")
    .forEach(g => g.classList.toggle("pick", g.dataset.f === id));
  dessinePoignees();
  majElement();
}

/* --- panneau de la forme choisie --- */
function majElement(){
  const z = $("elemSel");
  if (!z) return;
  const cible = formeSel && formeParId(formeSel);
  if (!cible || outil !== "main"){ z.hidden = true; return; }
  z.hidden = false;
  const f = cible.f;
  const NOMS = { rect: "Rectangle", poly: "Polygone", ligne: "Ligne",
                 texte: "Texte", image: "Image", repere: "Repère",
                 stand: "Stand dessiné" };
  $("elemType").textContent = NOMS[f.t] || f.t;
  /* La largeur et la hauteur en toutes lettres : c'est là qu'on rattrape un
     cadre tracé à peu près, et qu'on en obtient deux fois le même. */
  ecritDimensions(f);
  // un repère porte lui aussi un libellé et une taille
  const estTexte = f.t === "texte" || f.t === "repere";
  $("elemTexte").hidden = !estTexte;
  $("elemTailleBloc").hidden = !estTexte;
  if (estTexte){
    $("elemTexte").value = f.txt || "";
    $("elemTaille").value = f.taille || 2;
  }

  /* L'arrondi se règle après coup, et sur n'importe quel tracé : un contour
     posé d'équerre s'adoucit sans être redessiné, et un rectangle de réserve
     se fond dans un plan aux angles ronds. Il ne déplace aucun sommet — le
     calcul d'itinéraire, qui les lit, ne bouge pas d'un pouce. */
  const arrondissable = f.t === "poly" || f.t === "rect" || f.t === "ligne" ||
                        f.t === "stand";
  const br = $("elemRayonBloc");
  if (br){
    br.hidden = !arrondissable;
    if (arrondissable) $("elemRayon").value = f.r || 0;
  }

  /* Une ligne posée se relit : un trait fin fait une limite, un trait épais
     fait un mur, et le pointillé un passage qui n'en est pas tout à fait un.
     Cela se juge sur le plan, une fois le tracé en place. */
  const bt = $("elemTraitReg");
  if (bt){
    bt.hidden = f.t !== "ligne";
    if (f.t === "ligne"){
      $("elemEpaisseur").value = String(f.ep > 0 ? f.ep : EPAISSEUR_TRAIT);
      $("elemStyle").value = f.pointille ? "pointille" : "plein";
    }
  }

  /* Le type d'un repère se change après coup : une porte mal typée ne se voit
     qu'en essayant un trajet, et il serait absurde de la redessiner pour
     cela. Un repère d'avant la séparation du type et du libellé n'en porte
     pas : la liste s'ouvre sur celui que son libellé laisse deviner, et le
     choix s'écrit dès qu'on y touche. */
  const cp = $("elemPicto");
  if (cp){
    const estRepere = f.t === "repere";
    cp.hidden = !estRepere;
    if (estRepere){
      if (!cp.options.length)
        cp.innerHTML = TYPES_REPERE
          .map(t => '<option value="' + esc(t.v) + '">' + esc(t.nom) + '</option>').join("");
      cp.value = pictoForme(f) || "";
    }
  }

  majLiens(f.t === "repere" ? f : null);

  /* Une image peut désigner un stand : le logo d'un exposant posé sur son
     emplacement ouvre sa fiche au clic. */
  const estImage = f.t === "image";
  const ch = $("elemStand");
  if (ch){
    ch.hidden = !estImage;
    if (estImage){
      remplitListeStands();
      const s = f.stand && parId.get(f.stand);
      ch.value = s ? etiquetteStand(s) : "";
    }
  }

  /* Un stand dessiné, lui, désigne une société et non un emplacement : c'est
     tout l'objet du découpage, deux enseignes se partageant le même numéro. */
  const cs = $("elemSoc");
  if (cs){
    const estStandDessine = f.t === "stand";
    cs.hidden = !estStandDessine;
    if (estStandDessine){
      remplitListeSocietes();
      const l = societeDeForme(f);
      cs.value = l ? etiquetteSociete(l.o.code, nomSurLePlan(l.soc)) : "";
    }
  }
}

/* ------------------------------------------------------------
   Ce qu'un passage rejoint
   ------------------------------------------------------------ */
/**
 * Les passages qu'un repère peut rejoindre.
 *
 * Ceux des autres plans, et eux seuls : relier deux escaliers du même hall ne
 * décrirait rien qu'une allée ne dise déjà, et deux portes d'un même pavillon
 * feraient un raccourci que personne ne peut emprunter. Ce qui reste est
 * exactement ce dont on a besoin — le palier à l'étage, la porte d'en face.
 *
 * Un repère en relie autant qu'il en dessert : la liste reste ouverte tant
 * qu'il demeure des passages à joindre, parce qu'un escalier de
 * rez-de-chaussée monte au premier comme au second.
 */
function candidatsLiaison(f){
  const an = annuaireLiaisons();
  const deja = an.vers.get(f.id) || new Map();
  const ici = P().id;
  const out = [];
  an.par.forEach((o, id) => {
    if (id === f.id || deja.has(id) || o.p.id === ici) return;
    out.push(o);
  });
  return out.sort((a, b) => a.p.i - b.p.i ||
    COLLATION.compare(nomRepere(a.f), nomRepere(b.f)));
}

/**
 * Écrire une liaison sur les deux repères qu'elle joint.
 *
 * Un passage n'a pas de sens : on descend l'escalier qu'on a monté. Il
 * s'écrit donc des deux côtés, et le second vit dans un autre plan — hors de
 * l'historique d'annulation, qui ne connaît que le plan ouvert. Le calcul lit
 * de toute façon l'union des deux écritures : une annulation qui ne défait
 * qu'un côté laisse le passage en place plutôt qu'un lien boiteux.
 */
function ecritDesDeuxCotes(idAutre, change){
  const cible = formeSel && formeParId(formeSel);
  const autre = annuaireLiaisons().par.get(idAutre);
  if (!cible || !autre || !typeLiaison(cible.f)) return;
  memorise();
  ecritLiens(cible.f, change(lienEcrits(cible.f), idAutre));
  ecritLiens(autre.f, change(lienEcrits(autre.f), cible.f.id));
  enregistreDessins();
  majElement();
}

/** Poser ou retirer un passage. */
function changeLien(idAutre, ajoute){
  ecritDesDeuxCotes(idAutre, (l, id) => {
    const reste = l.filter(x => x.id !== id);
    if (ajoute) reste.push({ id: id, min: null });
    return reste;
  });
}

/**
 * Fixer le temps d'un passage, ou le rendre à celui de son type.
 *
 * Il se règle par couple, et non par repère : le même escalier met une minute
 * au premier étage et davantage au second, et c'est bien deux passages
 * distincts qu'on a déclarés. Le champ vide n'est pas zéro — c'est « le temps
 * ordinaire de ce type de passage », celui qu'affiche son invite.
 */
function changeDureeLien(idAutre, txt){
  const brut = String(txt == null ? "" : txt).trim();
  const v = brut === "" ? null : Math.max(0, Math.min(120, Math.round(+brut) || 0));
  ecritDesDeuxCotes(idAutre, (l, id) => {
    const x = l.find(y => y.id === id);
    if (x) x.min = v; else l.push({ id: id, min: v });
    return l;
  });
}

/**
 * Le panneau des passages du repère choisi.
 *
 * Il n'apparaît que pour ce qui est un passage — une porte, un escalier, un
 * escalator, un ascenseur. Sur un WC il n'aurait rien à relier, et proposer
 * de le faire inviterait à des trajets qui traversent les murs.
 */
function majLiens(f){
  const z = $("elemLiens");
  if (!z) return;
  const t = f && typeLiaison(f);
  z.hidden = !t;
  if (!t) return;

  const liste = $("elemLiensListe");
  liste.innerHTML = "";
  const liens = liensDe(f);
  liens.forEach(x => {
    const d = document.createElement("div");
    d.className = "lien";
    d.innerHTML = '<span></span><input class="lienMin" type="number" min="0" max="120" ' +
      'step="1" title="Temps de passage, en minutes"><b>min</b>' +
      '<button class="btnSup" title="Retirer ce passage">&times;</button>';
    d.querySelector("span").textContent = x.o.p.libelle + " · " + nomRepere(x.o.f) +
      (x.o.visible ? "" : " (calque masqué)");
    const ch = d.querySelector(".lienMin");
    ch.value = x.min == null ? "" : x.min;
    ch.placeholder = t.min;
    ch.onchange = () => changeDureeLien(x.o.f.id, ch.value);
    d.querySelector("button").onclick = () => changeLien(x.o.f.id, false);
    liste.appendChild(d);
  });

  const sel = $("elemLienAjout");
  const dispo = candidatsLiaison(f);
  sel.innerHTML = '<option value="">' +
    (dispo.length ? "Relier à…" : "Aucun autre passage sur les autres plans") + "</option>" +
    dispo.map(o => '<option value="' + esc(o.f.id) + '">' + esc(o.p.libelle) + " · " +
      esc(nomRepere(o.f)) + " (" + esc(nomTypeRepere(pictoForme(o.f))) + ")</option>").join("");
  sel.disabled = !dispo.length;

  $("elemLienAide").textContent = liens.length
    ? "Un trajet qui arrive ici continue de l'autre côté. Le temps de chaque " +
      "passage s'ajoute à celui de la marche ; laissé vide, il vaut " +
      ecritMinutes(t.min) + "."
    : "Reliez ce " + t.nom + " à ce qu'il dessert sur les autres plans — un escalier " +
      "monte souvent à deux étages, et chacun est un passage — et les itinéraires " +
      "enchaîneront les plans au lieu de s'arrêter là.";
}

/** « G55 — SMC2 », ou le seul des deux qui existe. */
const etiquetteStand = (s) =>
  [s.code, s.nom].filter(Boolean).join(" — ") || s.id;

/** La liste de choix suit le pavillon courant : un stand d'un autre pavillon
 *  ne pourrait pas porter une image posée ici. */
function remplitListeStands(){
  const l = $("listeStands");
  if (!l) return;
  l.innerHTML = P().stands
    .filter(s => s.code || s.nom)
    .map(s => '<option value="' + esc(etiquetteStand(s)) + '">').join("");
}

/** Retrouve le stand désigné par ce qui a été saisi. */
function standSaisi(txt){
  const v = String(txt || "").trim().toLowerCase();
  if (!v) return null;
  const st = P().stands;
  return st.find(s => etiquetteStand(s).toLowerCase() === v)
      || st.find(s => String(s.code || "").toLowerCase() === v)
      || st.find(s => String(s.nom || "").toLowerCase() === v)
      || null;
}

function appliqueLiaison(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "image") return;
  const ch = $("elemStand");
  const s = standSaisi(ch.value);
  memorise();
  if (s){ cible.f.stand = s.id; ch.value = etiquetteStand(s); }
  else { delete cible.f.stand; ch.value = ""; }
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

/**
 * Rattacher un stand dessiné à une société, ou l'en détacher.
 *
 * Détaché, il reste sur le plan — il a été tracé, on ne l'efface pas dans le
 * dos de qui vient de mal saisir un nom — mais il n'ouvre plus rien et perd
 * son libellé : le plan dit ainsi qu'il attend encore son exposant.
 */
function appliqueSociete(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "stand") return;
  const ch = $("elemSoc");
  const l = societeSaisie(ch.value);
  memorise();
  if (l){
    cible.f.stand = l.o.id; cible.f.soc = l.i;
    ch.value = etiquetteSociete(l.o.code, nomSurLePlan(l.soc));
  } else {
    delete cible.f.stand; delete cible.f.soc;
    ch.value = "";
  }
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

function appliqueTexte(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || (cible.f.t !== "texte" && cible.f.t !== "repere")) return;
  memorise();
  cible.f.txt = $("elemTexte").value;
  cible.f.taille = Math.max(.3, Math.min(30, +$("elemTaille").value || 2));
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

/** L'arrondi des coins de la forme choisie. */
function appliqueRayon(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible) return;
  memorise();
  cible.f.r = Math.max(0, Math.min(10, +$("elemRayon").value || 0));
  enregistreDessins(); dessineDessins();
}

/** L'épaisseur et le style du trait de la ligne choisie. Le trait ordinaire ne
 *  s'écrit pas : la forme revient alors à l'allure de son calque. */
function appliqueTrait(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "ligne") return;
  memorise();
  const ep = parseFloat($("elemEpaisseur").value);
  if (isFinite(ep) && ep > 0 && ep !== EPAISSEUR_TRAIT) cible.f.ep = ep;
  else delete cible.f.ep;
  if ($("elemStyle").value === "pointille") cible.f.pointille = true;
  else delete cible.f.pointille;
  enregistreDessins(); dessineDessins();
}

/** Changer ce qu'un repère est : son pictogramme suit, et avec lui ce qu'il
 *  vaut pour l'itinéraire — une porte, un escalier à contourner en fauteuil. */
function appliquePicto(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "repere") return;
  memorise();
  cible.f.picto = $("elemPicto").value;
  /* Un repère qui cesse d'être un passage garde ses liaisons écrites : elles
     ne désignent plus rien, et l'annuaire les ignore déjà — mais les retirer
     ici punirait une fausse manœuvre d'une perte qu'on ne peut pas défaire. */
  enregistreDessins();
  /* Le pavage des allées tient compte des escaliers et des escalators : en
     désigner un, ou cesser de le faire, change les trajets accessibles. */
  oublieGrilles();
  /* Devenir un escalier, ou cesser de l'être, ouvre ou ferme le panneau des
     passages : le panneau se relit donc, comme après tout changement de ce
     qu'un repère est. */
  dessineDessins(); dessinePoignees(); majElement();
}

function supprimeForme(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible) return;
  memorise();
  cible.c.formes = cible.c.formes.filter(x => x.id !== formeSel);
  formeSel = null;
  enregistreDessins(); dessineDessins(); dessinePoignees(); majElement();
}

/* --- gestes d'édition ; renvoient true si l'événement est consommé --- */
function editionPointerDown(e){
  if (!ADMIN || outil !== "main") return false;
  const p = versPlan(e.clientX, e.clientY);

  const pgn = e.target.closest(".pgn");
  if (pgn && formeSel){
    const cible = formeParId(formeSel);
    if (cible){
      memorise();
      geste = { type: "poignee", i: +pgn.dataset.i, depart: p,
                pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = curseurPoignee(cible.f, geste.i);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      return true;
    }
  }

  const g = e.target.closest(".dcal .forme");
  if (g){
    const id = g.dataset.f;
    const cible = formeParId(id);
    const sienne = cible && cible.c.id === calqueActif;

    /* Seul le calque ouvert par l'exploitant se laisse retoucher. Une forme
       d'un autre calque n'est ni sélectionnée ni déplacée : trop de dessins
       partaient à la dérive sur un clic destiné à la vue. Pour la reprendre,
       il faut ouvrir son calque depuis le panneau. Une image liée à un stand
       reste l'exception : elle ouvre sa fiche, comme pour un visiteur ; le
       reste laisse passer le geste vers le plan, qui se déplace. */
    if (!sienne) return false;

    if (id !== formeSel) choisitForme(id);
    if (cible){
      memorise();
      geste = { type: "deplace", depart: p, pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = "move";
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    }
    return true;
  }

  if (formeSel){ choisitForme(null); return true; }
  return false;    // rien sous le pointeur : on laisse le déplacement de la vue
}

function editionPointerMove(e){
  if (!geste) return false;
  const p = versPlan(e.clientX, e.clientY);
  let dx = p[0] - geste.depart[0], dy = p[1] - geste.depart[1];
  const f = geste.f;
  // une forme ne s'accroche pas à elle-même : elle ne bougerait plus
  const acc = { alt: e.altKey, sauf: f.id };

  if (geste.type === "deplace"){
    /* Le déplacement s'accroche par ses quatre coins, et retient la plus
       petite correction : glisser un stand contre son voisin le range par
       celui de ses bords qui arrive le premier. */
    const c = correction(coinsGeste(geste.pts, estCadre(f)).map(q => [q[0] + dx, q[1] + dy]), acc);
    dx += c[0]; dy += c[1];
    f.pts = geste.pts.map(q => [+(q[0] + dx).toFixed(2), +(q[1] + dy).toFixed(2)]);
  } else if (estCadre(f)){
    // la poignée opposée reste fixe ; l'image garde ses proportions
    const b = [Math.min(geste.pts[0][0], geste.pts[1][0]), Math.min(geste.pts[0][1], geste.pts[1][1]),
               Math.max(geste.pts[0][0], geste.pts[1][0]), Math.max(geste.pts[0][1], geste.pts[1][1])];
    const coins = [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
    const fixe = coins[(geste.i + 2) % 4];
    let mx = coins[geste.i][0] + dx, my = coins[geste.i][1] + dy;
    if (f.t === "image" && f.pts.length === 2){
      /* Seule la largeur s'accroche : la hauteur est commandée par les
         proportions de l'image, et un aimant qui la tirerait les casserait. */
      acc.axes = "x";
      mx += correction([[mx, my]], acc)[0];
      const ratio = (b[2] - b[0]) / Math.max(.01, b[3] - b[1]);
      const l = Math.abs(mx - fixe[0]);
      my = fixe[1] + Math.sign(my - fixe[1] || 1) * (l / ratio);
    } else {
      const c = correction([[mx, my]], acc);
      mx += c[0]; my += c[1];
    }
    f.pts = [[+Math.min(fixe[0], mx).toFixed(2), +Math.min(fixe[1], my).toFixed(2)],
             [+Math.max(fixe[0], mx).toFixed(2), +Math.max(fixe[1], my).toFixed(2)]];
  } else {
    const q = geste.pts.map(x => x.slice());
    q[geste.i] = aimante([+(q[geste.i][0] + dx).toFixed(2), +(q[geste.i][1] + dy).toFixed(2)], acc);
    f.pts = q;
  }
  dessineDessins(); dessinePoignees();
  /* La cote et les champs suivent le geste : c'est en le retenant qu'on
     s'arrête sur douze mètres, pas en le vérifiant après coup. */
  if (estCadre(f)){
    const b = boite(f);
    montreCote(coteCadre([b[0], b[1]], [b[2], b[3]]), [b[2], b[3]]);
  }
  ecritDimensions(f);
  return true;
}

function editionPointerUp(e){
  if (!geste) return false;
  const f = geste.f;
  geste = null;
  svg.style.cursor = "";
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  apercuGuide(null); montreCote(null); montreAimants(null);
  retientTaille(f);
  enregistreDessins();
  return true;
}

/* ============================================================
   11 quater. Dessiner juste — cote, aimants, répétition
   ============================================================
   Un geste à main levée donne des stands de 3,47 × 2,08 m : la main sait
   viser un endroit, pas une dimension. Trois secours, qui se complètent.
   La cote dit ce qu'on trace pendant qu'on le trace. Les aimants accrochent
   le geste à la géométrie déjà posée, qui elle est juste au centimètre. Et
   la répétition redonne une taille trouvée au lieu de la faire retrouver.
   ============================================================ */

/* --- ce que le geste mesure --- */

/** Un nombre de mètres écrit en français, sans zéros inutiles : « 12 », « 6,5 ». */
const ecritMetres = (v) =>
  (Math.round(Math.abs(v) * 100) / 100).toFixed(2).replace(/\.?0+$/, "").replace(".", ",");

/** « 12 × 6 m » — ce que deux coins opposés mesurent. */
const coteCadre = (a, b) =>
  ecritMetres(b[0] - a[0]) + " × " + ecritMetres(b[1] - a[1]) + " m";

/**
 * La cote du geste en cours, écrite sur le plan près du point qu'on déplace.
 *
 * Sur le plan, et non dans la palette : l'œil suit la forme qu'il trace, et
 * une taille qu'il faut aller chercher du regard ne corrige rien — on s'en
 * aperçoit une fois le stand posé, ce qui est trop tard. Le texte est
 * dimensionné en mètres, comme les poignées : il garde donc sa taille à
 * l'écran quel que soit le zoom.
 */
function montreCote(txt, p){
  let el = $("cote");
  if (!txt || !p){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElementNS("http://www.w3.org/2000/svg", "text");
    el.id = "cote";
    svg.appendChild(el);
  }
  const r = cadrePlan();
  const u = view.w / (r.width || 1);          // un pixel d'écran, en mètres
  el.setAttribute("font-size", +(13 * u).toFixed(3));
  el.setAttribute("x", +(p[0] + 12 * u).toFixed(2));
  el.setAttribute("y", +(p[1] - 12 * u).toFixed(2));
  el.textContent = txt;
}

/* ------------------------------------------------------------
   Les aimants
   ------------------------------------------------------------
   Un plan de salon n'est pas quadrillé : il est fait d'emplacements dont on
   connaît les coins au centimètre, tenus par la synchronisation. C'est donc
   à eux que le geste s'accroche, et non à une grille qu'on aurait inventée —
   s'aligner sur une grille reviendrait ici à manquer le seul repère qui
   existe vraiment. S'y ajoutent les formes déjà dessinées : un stand loué à
   cinq se découpe en cinq parts qui se touchent, et la deuxième part doit
   pouvoir se poser contre la première.
   ------------------------------------------------------------ */

const aimantsActifs = () => !$("aimants") || $("aimants").checked;

/** Les abscisses — ou les ordonnées — distinctes d'un relevé. Une rangée de
 *  stands partage les siennes : les dédoubler allège d'autant le balayage. */
const axesDe = (pts, i) => [...new Set(pts.map(q => q[i]))];

/** Les points d'un contour qui servent d'aimant : ses sommets, et son centre.
 *  Le centre parce qu'un logo se pose au milieu de l'emplacement qu'il
 *  désigne, et que viser ce milieu à l'œil ne donne jamais deux fois le même. */
function pointsAimants(pts){
  if (!pts.length) return pts;
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const cx = +((Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2).toFixed(2);
  const cy = +((Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2).toFixed(2);
  return pts.concat([[cx, cy]]);
}

/**
 * Les sommets des emplacements et des zones du pavillon.
 *
 * Ils ne bougent qu'à la synchronisation, laquelle recharge la page : on les
 * relève une fois par pavillon et on n'y revient pas.
 */
const AIMANTS_FOND = new Map();
function aimantsDuPlan(){
  const p = P();
  let a = AIMANTS_FOND.get(p.id);
  if (a) return a;
  const pts = [], emprises = [];
  const releve = (o) => {
    const s = sommets(o);
    if (!s.length) return;
    pts.push(...pointsAimants(s));
    const xs = s.map(q => q[0]), ys = s.map(q => q[1]);
    emprises.push([Math.min.apply(null, xs), Math.min.apply(null, ys),
                   Math.max.apply(null, xs), Math.max.apply(null, ys)]);
  };
  for (const o of p.stands) releve(o);
  for (const o of p.zones) releve(o);
  a = { pts: pts, xs: axesDe(pts, 0), ys: axesDe(pts, 1), emprises: emprises };
  AIMANTS_FOND.set(p.id, a);
  return a;
}

/* ------------------------------------------------------------
   La grille propre à chaque emplacement
   ------------------------------------------------------------
   Une grille par stand, née de son propre coin — et non une trame unique
   posée sur le pavillon. Deux stands voisins que le relevé ne pose pas au
   même centimètre ont donc chacun la sienne, ce qui est exactement ce qu'on
   veut : on découpe un stand par rapport à lui-même, on ne l'aligne pas sur
   une origine qui ne veut rien dire pour lui.
   ------------------------------------------------------------ */

/** Le pas demandé, en mètres. */
const pasAimant = () => {
  const v = parseFloat($("aimantPas") ? $("aimantPas").value : "");
  return isFinite(v) && v > 0 ? v : .5;
};

/** Une coordonnée ramenée sur les crans d'une emprise. Le bord est un cran
 *  comme un autre : une largeur qui n'est pas un multiple du pas garde son
 *  coin plutôt que de voir sa grille déborder. */
const cale = (v, a, b, s) =>
  +Math.max(a, Math.min(b, a + Math.round((v - a) / s) * s)).toFixed(2);

/** L'emprise sous le geste tient la grille qui compte : hors d'un stand, il
 *  n'y a rien à caler dessus. La marge laisse accrocher depuis le bord. */
const sousLeGeste = (c, e, tol) =>
  c[0] >= e[0] - tol && c[0] <= e[2] + tol && c[1] >= e[1] - tol && c[1] <= e[3] + tol;

/**
 * Le meilleur cran de grille pour un axe, parmi les points du geste.
 *
 * Par axe, et non par point : au pas de soixante-quinze centimètres, une
 * abscisse peut tomber à un doigt d'un cran quand l'ordonnée en est loin.
 * Exiger les deux à la fois ne rattraperait alors ni l'une ni l'autre, là où
 * chacune séparément range ce qu'elle peut.
 */
function cranGrille(coins, i, tol){
  const s = pasAimant();
  let m = null;
  for (const c of coins)
    for (const e of aimantsDuPlan().emprises){
      if (!sousLeGeste(c, e, tol)) continue;
      const v = cale(c[i], e[i], e[i + 2], s);
      const d = Math.abs(v - c[i]);
      if (d < tol && (!m || d < m.d)) m = { d: d, v: v, dep: c[i] };
    }
  return m;
}

/* Les formes dessinées, elles, changent à chaque geste. Le relevé se refait
   donc dès qu'un dessin est enregistré — c'est-à-dire entre deux gestes, et
   jamais pendant l'un d'eux. */
let AIMANTS_DES = null, AIMANTS_SAUF = null, AIMANTS_PLAN = null;
const oublieAimants = () => { AIMANTS_DES = null; };

function aimantsDessines(sauf){
  if (AIMANTS_DES && AIMANTS_SAUF === sauf && AIMANTS_PLAN === P().id) return AIMANTS_DES;
  const pts = [];
  for (const c of mesCalques()){
    if (c.visible === false) continue;
    for (const f of c.formes){
      /* Une forme ne s'accroche pas à elle-même : ses propres bords la
         retiendraient sur place à chaque tentative de la déplacer. */
      if (f.id === sauf || f.t === "texte") continue;
      if (estCadre(f)){
        const b = boite(f);
        pts.push(...pointsAimants([[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]]));
      } else pts.push(...pointsAimants(f.pts));
    }
  }
  AIMANTS_SAUF = sauf;
  AIMANTS_PLAN = P().id;
  AIMANTS_DES = { pts: pts, xs: axesDe(pts, 0), ys: axesDe(pts, 1) };
  return AIMANTS_DES;
}

/** Les points d'un geste autorisés à s'accrocher : les quatre coins d'un
