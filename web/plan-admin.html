/* Le champ de départ, l'inversion, le champ d'arrivée : trois lignes d'une
   même grille, la flèche à cheval sur les deux champs qu'elle échange. */
.iChamps{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:end}
/* Le champ porte sa liste : elle se déroule sous lui, et non sous les deux.
   Posée en dessous du bloc, elle paraissait appartenir à l'arrivée alors qu'on
   tapait le départ. */
.iChamp{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.iChamp input{width:100%;padding:8px 36px 8px 9px;font-size:13.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.iChamp input:focus{border-color:var(--accent);outline:none}
/* Le viseur vit au bord du champ qu'il remplit : c'est la même action que la
   saisie, dite autrement. */
.iVise{position:absolute;right:3px;bottom:3px;width:28px;height:28px;display:grid;
  place-items:center;border-radius:var(--radius);color:var(--ink-3)}
.iVise:hover{color:var(--ink);background:var(--line)}
.iVise[aria-pressed="true"]{color:#fff;background:var(--accent)}
.iVise svg{width:15px;height:15px}
.iEchange{grid-column:2;grid-row:1/3;align-self:center;width:34px;height:34px;
  display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3)}
.iEchange:hover{border-color:var(--line-strong);color:var(--ink)}
.iEchange svg{width:15px;height:15px}
/* La liste sert les deux champs à tour de rôle : elle se déplace dans celui
   qu'on remplit plutôt que d'exister en double. */
.iSugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;
  display:flex;flex-direction:column;gap:2px;max-height:210px;overflow-y:auto;
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px;
  background:var(--surface);box-shadow:var(--shadow)}
.iSugg[hidden]{display:none}
.iSug{display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 8px;
  border-radius:var(--radius);width:100%}
.iSug:hover,.iSug.vis{background:var(--line)}
.iSug .n{font-size:13px;color:var(--ink);line-height:1.3}
.iSug .s{font-size:11.5px;color:var(--ink-3)}
/* Un repère n'est pas un exposant : le liseré le dit sans un mot de plus. */
.iSug.rep{border-left:2px solid var(--accent)}
.iRien{margin:0;padding:6px 8px;font-size:12.5px;color:var(--ink-3)}
.iPmr{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);
  line-height:1.45;cursor:pointer}
.iPmr input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent)}
.iPmr b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.iResultat{display:flex;flex-direction:column;gap:12px}
.iBilan{display:flex;flex-direction:column;gap:2px;padding:11px 12px;
  background:var(--accent-soft);border-radius:var(--radius)}
.iBilan b{font-family:"Archivo",sans-serif;font-size:20px;letter-spacing:-.02em}
.iBilan span{font-size:12.5px;color:var(--ink-2)}
.iNote{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.iAlerte{margin:0;font-size:12.5px;line-height:1.6;color:#C2372B}
.iEtapes{display:flex;flex-direction:column;gap:7px}
.iEtape{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--surface-2);
  border-radius:var(--radius);border-left:2px solid var(--accent)}
.iEtape.transfert{border-left-style:dashed;border-left-color:var(--line-strong)}
/* Une étape qui se déroule dans un pavillon qu'on ne regarde pas s'y rend
   d'un clic : c'est un bouton, mais il garde l'aspect des autres étapes —
   c'est la même liste, et seul le survol le distingue. */
.iEtape.ailleurs{width:100%;text-align:left}
.iEtape.ailleurs:hover{background:var(--accent-soft)}
.iEtape .t{font-size:13px;color:var(--ink)}
.iEtape .s{font-size:11.5px;color:var(--ink-3)}

/* Pendant la visée, le plan devient une liste de choix : le curseur le dit à
   la souris, le bandeau le dit à tout le monde. */
.viseur{position:absolute;top:12px;left:0;right:0;margin-inline:auto;width:fit-content;
  max-width:92%;z-index:14;display:flex;align-items:center;gap:12px;
  padding:7px 12px 7px 14px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:999px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink)}
.viseur[hidden]{display:none}
.viseur button{font-size:12px;color:var(--accent);text-decoration:underline;padding:2px}
html.vise-plan #plan{cursor:crosshair}

/* Le tracé. Son épaisseur est donnée en pixels et ne suit pas le zoom : un
   trait qui grossit avec le plan finit par masquer les stands qu'il longe,
   et disparaît quand on recule pour voir le trajet entier. */
#itin{pointer-events:none}
#itin path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#itin .iHalo{stroke:var(--surface);stroke-width:8;opacity:.9}
#itin .iTrait{stroke:var(--accent);stroke-width:3.5}
/* Des pointillés qui défilent : ils disent le sens du trajet, ce qu'un trait
   plein ne fait pas, et sans ajouter de flèches qui se chevaucheraient dans
   les virages.

   Ils avancent par sauts d'un point, et non d'un glissement continu : le
   décalage d'un tracé ne se délègue pas au compositeur — même piège que le
   halo des points d'intérêt — et chaque valeur nouvelle repeint le plan sous
   le trajet, qui traverse le salon entier. Douze paliers par tour valent onze
   repeints par seconde au lieu de soixante, sans qu'on lise le sens moins
   bien. */
#itin .iSens{stroke:var(--accent-ink);stroke-width:1.6;stroke-dasharray:1 11;opacity:.85;
  animation:defile 1.1s steps(12) infinite}
@keyframes defile{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){#itin .iSens{animation:none}}
#itin .iBout{fill:var(--accent);stroke:var(--surface);stroke-width:2.5;
  vector-effect:non-scaling-stroke}
#itin .iBout.fin{fill:var(--surface);stroke:var(--accent)}
/* La pastille d'une conférence se distingue de celle d'un stand : l'heure y
   est imposée, et c'est autour d'elle que le reste de la journée s'est rangé. */
#itin .iBout.conf{fill:var(--surface);stroke-width:3.5}
#itin .iNum{fill:var(--surface);text-anchor:middle;dominant-baseline:central;
  font-family:"IBM Plex Mono",monospace;font-weight:600}
#itin .iNum.conf{fill:var(--accent)}
/* Comme le parcours et les icônes de zoom : ce que l'exploitant retire doit
   disparaître partout, y compris le bouton posé sur les fiches. Organiser sa
   journée, c'est calculer un itinéraire : sans le moteur, le bouton du
   parcours n'aurait rien à quoi s'adresser. */
html.sans-itineraire .btn.itin,html.sans-itineraire #btnJournee{display:none}

/* L'exploitant peut retirer le parcours : il disparaît alors partout à la
   fois — la barre du haut, les fiches, le programme d'une zone — sans quoi il
   resterait des signets sans destination. Ce que le visiteur avait retenu
   n'est pas effacé pour autant : le réglage peut se rouvrir. */
html.sans-parcours .marque,html.sans-parcours .btn.parc{display:none}
/* « .iconbtn » déclare « display:grid » : sans cette règle, « hidden » n'y
   masquerait rien — le même piège que la barre de zoom et l'échelle. */
.iconbtn[hidden]{display:none}

.panel{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;z-index:3;display:none;
  max-height:min(74vh,600px);overflow-y:auto}
.panel.open{display:block}
.panel .eyebrow{display:block;margin-bottom:8px}

/* Le cartouche de la carte de chaleur.
   Le plan porte les couleurs ; il reste à dire ce qu'elles valent, sur quelle
   période, et lesquels des neuf cents emplacements sont en tête — dix stands
   voisins tous rouges se ressemblent, et le premier ne se distingue pas du
   dixième. En bas à droite : le seul coin que ni le zoom, ni l'échelle, ni la
   pile des calques n'occupent. */
.chalbar{position:absolute;right:12px;bottom:12px;z-index:6;width:272px;
  display:flex;flex-direction:column;gap:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;
  max-height:calc(100% - 24px);overflow-y:auto}
.chalbar[hidden]{display:none}
.chalTete{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chalTete button{color:var(--ink-3);font-size:17px;line-height:1;padding:0 3px}
.chalTete button:hover{color:var(--ink)}
.chalPer{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chalPer button{min-width:0;height:26px;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-2);font-size:11.5px}
.chalPer button:hover{border-color:var(--line-strong);color:var(--ink)}
.chalPer button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chalEch[hidden]{display:none}
.chalEch i{display:block;height:8px;border-radius:3px;border:1px solid var(--line)}
/* Les bornes portent des nombres et non des parts : l'échelle est
   logarithmique, et une bande graduée en pourcentages mentirait sur l'écart
   entre son milieu et son bout. */
.chalEch .bornes{display:grid;grid-template-columns:1fr auto 1fr;margin-top:3px;
  font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chalEch .bornes span:nth-child(2){text-align:center}
.chalEch .bornes span:last-child{text-align:right}
.chalEtat{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.45}
.chalEtat.err{color:var(--rouge,#C2372B)}
.chalTop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chalTop button{display:flex;width:100%;align-items:baseline;gap:7px;text-align:left;
  padding:4px 6px;border:1px solid transparent;border-radius:4px;
  font-size:12px;color:var(--ink)}
.chalTop button:hover{border-color:var(--line-strong);background:var(--surface-2)}
.chalTop button[disabled]{color:var(--ink-3);cursor:default}
.chalTop button[disabled]:hover{border-color:transparent;background:none}
.chalTop .rang,.chalTop .code,.chalTop .n{font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--ink-3);flex:0 0 auto}
.chalTop .n{font-size:11px;color:var(--ink-2)}
.chalTop .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Ce qui n'appartient pas à la pile s'en détache par un trait, comme la barre
   d'administration au bas du panneau. Le libellé n'a pas de case à cocher
   devant lui, et rien à ouvrir : le curseur ne promet donc rien. */
.apart{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.apart .calq label{cursor:default}
.calq.sous{padding-left:15px}
.calq.sous label{font-size:12px;color:var(--ink-2)}
.calq.sous .cc,.calq.sous .fillbtn{transform:scale(.88)}
.calq{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:2px 0}
.calq label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-width:0}
.calq label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Réglages généraux, dans leur fenêtre : une case à cocher par ligne, avec de
   quoi viser au doigt sans effleurer la voisine. */
/* Un réglage qui se chiffre, sous ceux qui se cochent : même famille, autre
   geste. L'unité est écrite à côté du champ plutôt que dans son libellé, où
   elle se lirait comme faisant partie de la question. */
.reglage-nb{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:5px}
.reglage-nb label{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink)}
.reglage-nb .l{flex:1;min-width:0}
.reglage-nb input{width:74px;padding:6px 8px;font-size:13.5px;text-align:right;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink);font-family:"IBM Plex Mono",monospace}
.reglage-nb input:focus{border-color:var(--accent);outline:none}
.reglage-nb .u{flex:none;font-size:12.5px;color:var(--ink-3)}
.reglage-nb .aide{font-size:12px;color:var(--ink-3);line-height:1.5}

/* Les réglages tiennent en deux volets : ce que le plan montre, et de quoi il
   a l'air. Séparés par des onglets plutôt qu'empilés — le second est une
   planche d'aperçus, et poussait le premier hors de l'écran. */
.ongReg{display:flex;gap:3px;margin:0 0 14px;padding:3px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px}
.ongReg button{flex:1;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--ink-2)}
.ongReg button:hover{color:var(--ink)}
.ongReg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* La couleur principale. Un nuancier de tons de charte plutôt qu'une roue :
   on choisit la couleur d'un salon, pas la nuance exacte d'un dégradé. La
   dernière pastille ouvre le nuancier du système pour ceux qui ont un
   hexadécimal à respecter. */
.reglage-coul{margin:2px 0 18px}
.reglage-coul .tete{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.reglage-coul .val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.reglage-coul .raz{margin-left:auto;font-size:12px;color:var(--ink-3);text-decoration:underline}
.reglage-coul .raz:hover{color:var(--ink)}
.nuancier{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;max-width:352px}
.nuancier button,.nuancier .perso{position:relative;display:block;width:100%;aspect-ratio:1;
  padding:0;border:1px solid rgba(0,0,0,.18);border-radius:6px}
/* Le ton retenu se cerne d'un anneau posé à l'extérieur : un liseré pris sur
   la pastille aurait mangé la couleur qu'on est en train de juger. */
.nuancier button[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;
  border:2px solid var(--ink);border-radius:9px}
.nuancier .perso{display:grid;place-items:center;cursor:pointer;overflow:hidden;
  background:conic-gradient(#E4574B,#E4B14B,#5FBE6A,#4BB6E4,#6B5FE4,#D45FC0,#E4574B)}
.nuancier .perso input{position:absolute;inset:0;width:100%;height:100%;padding:0;
  border:none;opacity:0;cursor:pointer}
.nuancier .perso span{position:relative;width:11px;height:11px;border-radius:50%;
  background:var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
/* Un habillage ne se décrit pas, il se regarde : chaque modèle se choisit sur
   sa propre fiche, réduite, remplie d'un exposant d'exemple. Le bas s'efface
   plutôt que de se couper net — l'aperçu montre le haut de la fiche, qui est
   ce qui la distingue. */
.modeles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.mod{display:block;width:100%;padding:0;text-align:left;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mod:hover{border-color:var(--line-strong)}
.mod[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mod .vue{display:block;position:relative;height:198px;overflow:hidden;background:var(--ground);
  -webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.mod .nom{display:flex;align-items:center;gap:7px;padding:9px 11px;font-size:12.5px;
  font-weight:600;border-top:1px solid var(--line)}
.mod .nom .coche{margin-left:auto;color:var(--accent);font-size:13px;visibility:hidden}
.mod[aria-pressed="true"] .nom .coche{visibility:visible}
.mod .resume{display:block;padding:0 11px 10px;font-size:11.5px;line-height:1.45;color:var(--ink-3)}
/* L'aperçu porte les mêmes classes que la fiche du plan : c'est la même
   feuille de style qui l'habille, à l'échelle près. */
.apercu{--reduc:.59;position:absolute;top:0;left:0;width:calc(100% / var(--reduc));
  transform:scale(var(--reduc));transform-origin:top left;
  /* « background-color » et non le raccourci : celui-ci effacerait le fond
     que les modèles peignent — le dégradé du verre, le grain du kraft — car
     cette règle vient après la leur. */
  background-color:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;
  pointer-events:none}
.modale[data-genre="large"] .mfen{width:min(760px,100%)}
.reglages{margin-top:10px}
.reglages label{display:flex;align-items:center;gap:9px;font-size:14px;
  cursor:pointer;padding:7px 0}
.reglages input{width:16px;height:16px;flex:none;accent-color:var(--accent)}
.cc{width:24px;height:18px;padding:0;border:1px solid var(--line-strong);border-radius:3px;
  background:none;cursor:pointer;flex:none}
.cc::-webkit-color-swatch-wrapper{padding:1px}
.cc::-webkit-color-swatch{border:none;border-radius:2px}
.calq .opts{display:flex;align-items:center;gap:6px}
.fillbtn{width:20px;height:18px;border:1px solid var(--line-strong);border-radius:3px;
  color:var(--ink-3);display:grid;place-items:center;padding:0}
.fillbtn:hover{border-color:var(--ink-2);color:var(--ink-2)}
.fillbtn svg{width:11px;height:11px;display:block}
.fillbtn svg rect{fill:none;stroke:currentColor;stroke-width:1.5}
.fillbtn[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink)}
.fillbtn[aria-pressed="true"] svg rect{fill:currentColor}
.modale{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:none;
  place-items:center;padding:20px}
.modale.open{display:grid}
/* La fenêtre des critères se regarde en même temps que le plan : on coche, et
   les stands s'éteignent derrière. Elle se range donc à gauche, du côté de la
   liste dont elle décide, et laisse le plan à sa couleur — un voile gris sur ce
   qu'on est venu voir aurait rendu le filtre invisible au moment même où il
   agit. La surface reste cliquable et referme : toucher le plan, c'est en avoir
   fini avec les filtres. */
.modale[data-genre="cote"]{background:none;place-items:center start}
.modale[data-genre="cote"] .mfen{box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
.mfen{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.6);width:min(430px,100%);max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden}
.mfen header{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.mfen h2{font-family:"Archivo",sans-serif;font-size:16px;margin:0;letter-spacing:-.01em}
.mfen header button{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}
.mfen header button:hover{color:var(--ink)}
.mcorps{padding:12px 14px;overflow-y:auto;flex:1}
.mcorps p{margin:0 0 4px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mfen footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;
  border-top:1px solid var(--line)}
.mfen footer .btn.danger{background:#C2372B;border-color:#C2372B;color:#fff}
.mfen footer .btn.danger:hover{filter:brightness(1.1)}

/* Le panneau des critères. Chaque groupe porte son intitulé et ses valeurs en
   puces : elles se touchent du pouce, se lisent d'un coup d'œil, et portent le
   nombre de fiches que chacune retient — sans lui, on coche à l'aveugle. Le
   titre du groupe, lui, ne dit que ce qui y est retenu. */
.grp-crit{padding:0;border-top:1px solid var(--line)}
.grp-crit:first-child{border-top:none}
/* Le titre est la prise : replié, un critère tient sur une ligne, et la
   fenêtre montre tous les critères plutôt qu'un seul déplié. */
.grp-crit > summary{display:flex;align-items:center;gap:9px;padding:11px 2px;
  cursor:pointer;list-style:none}
.grp-crit > summary::-webkit-details-marker{display:none}
.grp-crit > summary::after{content:"";width:7px;height:7px;margin-left:auto;
  border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.grp-crit[open] > summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.grp-crit > summary .t{font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2)}
.grp-crit > summary .r{font-size:11.5px;color:var(--ink-3)}
.grp-crit > summary .r[data-on="true"]{color:var(--accent);font-weight:600}
/* Un critère réglé mais que rien ne renseigne : seul l'exploitant le voit, et
   il doit le voir comme un manque, pas comme un filtre parmi d'autres. */
.grp-crit > summary .r[data-manque="true"]{color:var(--rouge,#C2372B)}
.vide-crit{margin:0 0 10px;font-size:12px;color:var(--ink-3);line-height:1.5}
.grp-crit > *:last-child{margin-bottom:10px}
.grp-crit .tamis{width:100%;margin-bottom:8px;padding:6px 10px;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.grp-crit .tamis:focus{border-color:var(--accent);background:var(--surface);outline:none}
/* Un critère à cent valeurs ne pousse pas le pied de la fenêtre hors de vue :
   il défile dans son propre cadre, et le tamis au-dessus le raccourcit. */
.puces-crit{display:flex;flex-wrap:wrap;gap:6px;max-height:38dvh;overflow-y:auto}
.puce-crit{display:inline-flex;align-items:center;gap:6px;max-width:100%;
  padding:6px 10px;font-size:12.5px;color:var(--ink-2);text-align:left;
  background:var(--surface-2);border:1px solid transparent;border-radius:999px}
.puce-crit:hover{border-color:var(--line-strong)}
.puce-crit[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--ink);font-weight:600}
.puce-crit .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce-crit .n{font-size:11px;color:var(--ink-3);flex:0 0 auto}
.puce-crit[aria-pressed="true"] .n{color:var(--accent)}
.puces-crit .aucune{font-size:12px;color:var(--ink-3)}
.compte-crit{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3)}

/* liste réordonnable : le premier rang est le plus en avant */
.ordre{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ordre li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  padding:7px 9px;border:1px solid transparent;border-radius:4px;background:var(--surface-2);
  font-size:13px;cursor:grab}
.ordre li:hover{border-color:var(--line-strong)}
.ordre li.drag{opacity:.4}
.ordre li.avant{box-shadow:inset 0 2px 0 var(--accent)}
.ordre li.apres{box-shadow:inset 0 -2px 0 var(--accent)}
.ordre .poignee{color:var(--ink-3);font-size:13px;line-height:1;cursor:grab}
.ordre .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordre .genre{font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;
  border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:6px}
.ordre .bouts{display:flex;gap:2px}
.ordre .bouts button{width:22px;height:20px;border:1px solid var(--line);border-radius:3px;
  color:var(--ink-3);font-size:11px;line-height:1}
.ordre .bouts button:hover{border-color:var(--accent);color:var(--accent)}
.reorg{width:100%;margin-bottom:8px;padding:6px;border:1px solid var(--line);
  border-radius:var(--radius);font-size:12px;color:var(--ink-2)}
.reorg:hover{border-color:var(--accent);color:var(--accent)}

.importzone{display:flex;flex-direction:column;gap:6px;margin-top:8px}

/* Publier n'est pas un réglage parmi d'autres : c'est le geste qui rend le
   travail visible aux visiteurs. Il se distingue des liens qui l'entourent. */

  opacity:0;pointer-events:none;transition:opacity .2s;display:none}

@media (max-width:900px){
  /* `1fr` ne borne pas : un élément de grille garde `min-width:auto`, et la
     barre de titre — nom de l'événement et pavillons, tous en `nowrap` —
     imposait sa largeur incompressible à toute la colonne. Sur un écran de
     412 px la page s'étalait sur 579, et le plan sortait par la droite.
     `minmax(0,1fr)` autorise la colonne à rétrécir ; encore faut-il que son
     contenu l'accepte, d'où les `min-width:0` qui suivent. */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar,.brand{min-width:0}
  .topbar{gap:10px}
  .brand h1{overflow:hidden;text-overflow:ellipsis}
  /* Les pavillons défilent latéralement plutôt que de pousser les murs. C'est
     donc à eux de céder la place en premier : ils restent atteignables au
     doigt, là où un titre tronqué à trois lettres ne se retrouve pas. */
  .brand{flex:0 1 auto;max-width:40%}
  .halls{flex:1 1 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .halls::-webkit-scrollbar{display:none}
  .stats,.brand .sub{display:none}

  /* Le plan est ce qu'on vient voir : il prend toute la hauteur restante, et
     la liste se replie en tiroir posé par-dessus. Elle occupait auparavant une
     bande figée de 216 px dont la recherche et le compteur mangeaient la plus
     grande part : il restait 71 px de liste — une ligne et demie pour cinq
     cents résultats. */
  /* Trois crans plutôt que deux. Le cran du milieu est celui qui sert le
     plus : on lit la liste sans perdre le plan de vue, et c'est là qu'on
     répond à « qu'y a-t-il près de l'entrée ». Tout ou rien obligeait à
     choisir entre les deux. */
  .side{
    position:fixed;left:0;right:0;bottom:0;z-index:12;
    height:82vh;height:82dvh;
    border-right:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    transform:translateY(calc(100% - var(--replie,164px)));
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .side[data-cran="demi"]{transform:translateY(calc(100% - 46dvh))}
  .side[data-cran="plein"]{transform:translateY(0)}
  /* Pendant le geste c'est la main qui mène, pas la transition. */
  .side.glisse{transition:none}

  /* En tiroir, la hauteur se paie sur le plan : les bandes redeviennent une
     seule ligne qui défile, et ce qu'elles montrent déborde par le côté. */
  .actifs{flex-wrap:nowrap;overflow-x:auto}
  /* Le panneau des critères s'ouvre en bas, à portée du pouce, et non centré
     sur un écran qu'il occuperait tout entier. */
  .modale{padding:0;place-items:end stretch}
  .mfen{width:100%;max-height:88dvh;border-radius:14px 14px 0 0;border-bottom:none}
  /* Au pouce, une puce se vise : elle gagne la hauteur que la souris n'exige pas. */
  .puce-crit{padding:8px 12px}
  /* En tiroir, le bas de l'écran est déjà pris par la liste : la fenêtre des
     critères monte donc en haut plutôt qu'au milieu, et le plan garde entre
     les deux une bande d'un seul tenant, où l'on voit le filtre agir. */
  .modale[data-genre="cote"]{place-items:start start}
  .grp-crit > summary{padding:13px 2px}

  .poignee{display:block;width:100%;padding:10px 0 6px;background:transparent;
    touch-action:none;cursor:grab}
  .poignee::before{content:"";display:block;width:38px;height:4px;margin:0 auto;
    border-radius:999px;background:var(--line-strong)}

  /* Les commandes du plan se posent au-dessus du tiroir replié : ancrées en
     bas comme elles l'étaient, il les recouvrait. */
  .zoombar{bottom:calc(var(--replie,150px) + 14px)}
  /* L'échelle passe au-dessus du cartouche, qui sur un écran étroit est assez
     large pour la traverser. Sa hauteur est mesurée, et vaut zéro en l'absence
     de repères : l'échelle reprend alors sa place. */
  .scalebar{bottom:calc(var(--replie,164px) + var(--cartouche,0px) + 18px)}
  /* sans les boutons de zoom à contourner, l'échelle retrouve la marge */
  .sans-zoom .scalebar{left:14px}
  .poi{bottom:calc(var(--replie,150px) + 12px)}
  .panel{top:auto;bottom:calc(var(--replie,150px) + 12px);right:12px}
  /* Le cartouche prend toute la largeur restante : à 272 px il laissait une
     colonne vide sans rien y gagner, et son palmarès se coupait au milieu des
     enseignes. Il partage ce coin avec la pile des calques, qui se referme
     quand il s'ouvre. */
  .chalbar{bottom:calc(var(--replie,150px) + 12px);left:12px;width:auto;max-height:50dvh}

  /* La fiche devient un tiroir elle aussi. En fenêtre centrée sur voile, elle
     masquait le plan au moment précis où l'on venait d'y désigner un stand :
     on perdait de vue ce qu'on regardait. Posée en bas, elle laisse le plan
     visible et manipulable derrière — c'est pour cela qu'il n'y a plus de
     voile, qui interceptait aussi les gestes. */
  .voile{display:none}
  .detail{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:56dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    /* au-dessus du tiroir de la liste, qui se replie quand elle s'ouvre */
    z-index:13;
    transform:translateY(100%);opacity:1;pointer-events:none;
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .detail.open{transform:translateY(0);pointer-events:auto}
  .detail-hd{padding:16px 16px 13px}
  .onglets{margin:10px 16px 0}
  .detail-hd h2{font-size:17px;margin:6px 0 5px}
  /* seul le corps défile : le nom et le code restent sous les yeux */
  .detail-bd{padding:14px 16px 18px;overflow-y:auto}
  /* La fiche n'a plus qu'une demi-hauteur d'écran : elle se resserre. Les
     champs qui tiennent en un mot — niveaux, ville, pays, téléphone, réseaux —
     se rangent deux par deux au lieu d'empiler autant de lignes qu'il faut
     faire défiler une à une ; l'adresse, le site et le programme gardent la
     largeur entière. */
  .detail-bd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px 14px;align-content:start}
  .detail-bd .field,.detail-bd .acts{grid-column:1/-1;min-width:0}
  .detail-bd .field.court{grid-column:auto}
  /* Une adresse web n'a pas de césure naturelle : sans cela elle déborde de
     sa colonne au lieu de revenir à la ligne. */
  .field .v{font-size:13.5px;overflow-wrap:anywhere}
  /* Le libellé du jour se colle en haut du corps, dont la marge vaut ici
     quatorze pixels et non seize. */
  .prog{gap:6px}
  .prog .jour{top:-14px;padding-top:14px}
  /* Une vignette tenait trois lignes pour deux informations utiles : l'heure
     et le type partagent la première, le titre prend la seconde. */
  .prog .conf{flex-flow:row wrap;align-items:baseline;column-gap:8px;padding:6px 8px}
  .prog .conf .ty{order:1}
  .prog .conf .t{order:2;flex:0 0 100%}

  /* Le parcours suit la fiche : même bande basse, même glissement. Il monte
     un peu plus haut — c'est une liste qu'on parcourt, pas une fiche qu'on
     lit — sans masquer le plan pour autant. */
  .parcours{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:68dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    z-index:13;
    transform:translateY(100%);pointer-events:none;
  }
  .parcours.open{transform:translateY(0);pointer-events:auto}
  .pCorps{padding:14px 16px}
  .pPied{padding:10px 16px 18px}

  /* L'itinéraire suit les deux autres, en un peu plus haut : deux champs, un
     clavier qui monte, et le résultat qui doit rester lisible au-dessus. */
  .itineraire{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    max-height:76dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -20px 45px -22px rgba(0,0,0,.45);
    z-index:13;
    transform:translateY(100%);pointer-events:none;
  }
  .itineraire.open{transform:translateY(0);pointer-events:auto}
  .iCorps{padding:14px 16px}
  .iSugg{max-height:160px}
}

/* Le fond de plan arrive après les stands : un fondu vaut mieux qu'une
   apparition brutale sous le curseur. */
#couches .cal{animation:parait .25s ease-out}
@keyframes parait{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#couches .cal{animation:none}}

<script data-api="/api/plan" data-slug="smcl-2026">

const $ = id => document.getElementById(id);
const svg = $("plan");

const SLUG = new URLSearchParams(location.search).get("plan") || document.currentScript?.dataset.slug || "";

let DATA = null, TOUS = [], parId = new Map(), CONFS = new Map(), EXPOSANTS = new Map();
/* Les sociétés hébergées sur le stand d'un autre. Elles n'ont ni forme ni
   identifiant — c'est le stand de leur hôte qu'on va voir — et ne peuvent donc
   pas vivre dans « TOUS », que la carte indexe. Elles ont leur liste, que la

   n'a pas à balayer la liste pour savoir si le filtre les retient. */
let PAR_HEBERGE = new Map();

   par objet, c'est la même chose en mille fois moins.

   titulaire, sinon le rang de l'hébergé. Sans lui, la liste marquerait comme
   courants tous les rangs d'un même stand. */

/* ============================================================
   1. Index global — la recherche porte sur tous les pavillons
   ============================================================ */
function indexe(d){
  DATA = d;
  DATA.plans.forEach((p, i) => {
    p.i = i;
    p.court = String(p.libelle).replace(/^Pavillons*/i, "");
    p.zones = p.zones || [];
    p.stands = p.stands || [];
    p.fond = p.fond || [];
    p.conferences = p.conferences || [];
    // le programme d'une zone se lit d'un coup, et il est déjà chronologique
    p.parZone = new Map();
    p.conferences.forEach(c => {
      if (!c.zone) return;
      if (!p.parZone.has(c.zone)) p.parZone.set(c.zone, []);
      p.parZone.get(c.zone).push(c);
    });
    /* Une conférence tient aussi à l'exposant qui l'anime, dont le stand peut
       être ailleurs que sa salle — et qui reste son seul point d'accroche quand
       la salle n'est rattachée à aucune zone. */
    p.parStand = new Map();
    p.conferences.forEach(c => {
      (c.exposants || []).forEach(e => {
        if (!e || !e.stand) return;
        if (!p.parStand.has(e.stand)) p.parStand.set(e.stand, []);
        p.parStand.get(e.stand).push(c);
      });
    });
    [p.parZone, p.parStand].forEach(m => m.forEach(l => l.sort((a, b) =>
      String(a.debutLocal || a.debut || "").localeCompare(String(b.debutLocal || b.debut || "")))));
    /* Une zone organisateur n'a que son nom, et c'est bien lui qu'on tape pour
       la trouver : « accueil », « restauration », « village start-up » sont des
       endroits du salon au même titre qu'un stand. */
    p.zones.forEach(z => {
      z.kind = "zone"; z.p = i;
      z.rech = String(z.nom || "").toLowerCase();
    });
    /* Ce sur quoi porte la recherche, assemblé et abaissé ici une fois pour
       toutes. Chaque frappe balaie tout le salon — un millier d'objets — et
       reconstruisait jusqu'ici la même chaîne pour chacun d'eux. */
    p.stands.forEach(s => {
      s.kind = "stand"; s.p = i;
      /* Les thématiques y entrent comme le reste — un visiteur qui tape
         « robotique » n'a pas à savoir que c'est un rangement d'exposants et
         non un nom d'enseigne — et les champs retenus comme critères de même :
         un exploitant qui désigne « Gamme de produits » comme critère veut
         qu'on trouve « bio » en le tapant, pas seulement en dépliant un
         filtre. Les thématiques y entrent qu'elles soient un critère ou non :
         dès lors qu'elles paraissent sur la fiche, ce qu'on y lit doit se
         retrouver en le tapant. Elles s'y répètent quand elles en sont un,
         ce dont une recherche par sous-chaîne ne s'aperçoit pas. */
      s.rech = ((s.nom || "") + " " + (s.code || "") + " " + (s.plan || "") +
                " " + (s.sect || "") + " " + (s.themes || []).join(" ") +
                " " + texteCriteres(s)).toLowerCase();
    });
  });
  /* Les secteurs se relèvent avant les réglages, et non après : c'est la liste
     des secteurs de ce salon qui dit lesquelles de leurs couleurs, rangées
     dans la configuration, parlent bien de lui. */
  indexeSecteurs();

  /* L'habillage choisi par l'exploitant vient du service et l'emporte sur ce
     que garde le poste : c'est lui que les visiteurs doivent voir, et un
     téléphone n'a rien dans son stockage local. Le poste ne sert plus que de
     cache, et de refuge si un enregistrement a échoué — celui de ce salon-ci,
     que la clé de rangement désigne maintenant. */
  ouvreConf(d);
  DATA.plans.forEach(p => {
    const a = p.apparence || {};
    // un enregistrement d'avant le cloisonnement porte les calques d'autres
    // salons : ils ne désignent rien ici, et fausseraient la publication
    if (a.reglages && Object.keys(a.reglages).length)
      Object.assign(CONF, reglagesDuSalon(a.reglages));
    if (Array.isArray(a.pile) && a.pile.length) CONF["_pile:" + p.id] = a.pile;
    /* Les dessins de la base font foi, jusqu'à l'effacement d'un calque retiré
       ailleurs — sauf sur ce qui n'a pas encore été publié depuis ce poste :
       cela n'existe nulle part ailleurs, et l'écraser le perdait. Une page à
       données figées n'en porte pas du tout : on n'y touche à rien. */
    if (Array.isArray(p.dessins) && !(ADMIN && enAttente(p.id))){
      DESSINS[p.id] = p.dessins.map(c => ({ ...c, formes: (c.formes || []).slice() }));
    }
  });
  /* Les dessins viennent de changer sous les pieds du calcul d'itinéraire :
     ce qu'il en avait retenu — les allées, les passages d'un plan à l'autre —
     ne décrit plus rien. */
  oublieGrilles();
  oublieLiaisons();

  TOUS = DATA.plans.flatMap(p => [...p.zones, ...p.stands]);
  parId = new Map(TOUS.map(o => [o.id, o]));
  /* Un rang de recherche par société hébergée. Il emprunte à son hôte tout ce
     qui décrit l'emplacement — identifiant, numéro, pavillon — et n'a en
     propre que son nom et son rang, par lequel la fiche la retrouvera. */
  HEBERGES = DATA.plans.flatMap((p, i) => p.stands.flatMap(s =>
    (s.coex || []).map((x, k) => {
      /* Une hébergée répond pour elle-même : ses thématiques, sa ville, ses
         rubriques, ses champs propres sont les siens et non ceux de son hôte,
         et un filtre doit la retenir pour ce qu'elle est. Elle n'emprunte à
         l'emplacement que ce qui le décrit — numéro, pavillon, secteur. */
      const h = {
        kind: "coex", id: s.id, i: k, p: i, code: s.code, sect: s.sect,
        nom: x.nom, plan: x.plan, ville: x.ville, pays: x.pays,
        nomencl: x.nomencl, themes: x.themes, perso: x.perso, neuf: x.neuf,
      };
      h.rech = ((x.nom || "") + " " + (s.code || "") + " " + (x.plan || "") +
                " " + (s.sect || "") + " " + (x.themes || []).join(" ") +
                " " + texteCriteres(h)).toLowerCase();
      return h;
    })));
  PAR_HEBERGE = new Map(HEBERGES.map(x => [x.id + "#" + x.i, x]));
  indexeCriteres();
  /* Le programme d'une zone se lit pavillon par pavillon, mais un parcours de
     visite mêle les trois : la conférence retenue hier peut se tenir ailleurs
     que là où l'on se trouve. L'index des conférences est donc global, comme
     celui des stands. */
  CONFS = new Map();
  DATA.plans.forEach((p, i) => p.conferences.forEach(c => {
    c.kind = "conf"; c.p = i;
    CONFS.set(String(c.id), c);
  }));
  /* Une même conférence est remontée dans chaque pavillon qui la porte, et
     chacun n'y cite que les exposants qu'il héberge : leur liste complète se
     recompose ici, sinon la fiche n'afficherait que ceux du dernier pavillon
     lu. */
  EXPOSANTS = new Map();
  DATA.plans.forEach(p => p.conferences.forEach(c => {
    const k = String(c.id);
    if (!EXPOSANTS.has(k)) EXPOSANTS.set(k, []);
    const l = EXPOSANTS.get(k);
    (c.exposants || []).forEach(e => {
      if (e && e.stand && !l.some(x => x.stand === e.stand)) l.push(e);
    });
  }));
  /* Ce qu'on tape pour retrouver une conférence : son titre d'abord, puis ce
     qui la fait reconnaître quand on ne l'a pas en tête — sa salle, son type,
     sa thématique, et l'exposant qui la tient, souvent le seul nom dont on se
     souvienne. Sa présentation n'y entre pas : un paragraphe entier ferait
     répondre la moitié du programme au premier mot courant venu. */
  CONFERENCES = [...CONFS.values()];
  CONFERENCES.forEach(c => {
    const tenue = EXPOSANTS.get(String(c.id)) || [];
    /* Une conférence n'appartient pas au pavillon qui l'a remontée — elle est
       remontée par tous ceux qui la touchent — mais à celui où on la trouve :
       la zone de sa salle, ou à défaut le stand de celui qui l'anime. Sans ni
       l'une ni l'autre, elle n'est encore située nulle part et le pavillon que
       porterait sa ligne serait un hasard de synchronisation : elle se cherche
       et se lit, elle ne se rattache à rien tant que la console ne l'a pas
       fait. */
    const ou = (c.zone && parId.get(String(c.zone))) ||
               tenue.map(e => parId.get(e.stand)).find(Boolean);
    c.situee = Boolean(ou);
    if (ou) c.p = ou.p;
    /* L'exposant se cherche par le nom que la fiche lui donne, et c'est celui
       de son stand qui prime : le programme cite parfois une raison sociale là
       où le salon connaît une enseigne. */
    c.rech = ((c.nom || "") + " " + (c.salle || "") + " " + (c.type || "") +
              " " + (c.theme || "") + " " +
              tenue.map(e => (parId.get(e.stand) || {}).nom || e.nom || "").join(" ")
             ).toLowerCase();
  });

  const nom = DATA.evenement || "Plan du salon";
  $("titre").textContent = nom;
  $("titre").classList.remove("attente");   // ce n'est plus un intitulé d'attente
  // l'onglet porte le nom de l'événement chargé, pas celui du premier salon
  document.title = (document.documentElement.dataset.role === "admin"
    ? "Administration — " : "") + nom;
  $("sub").textContent = DATA.plans.length + (DATA.plans.length > 1 ? " pavillons" : " pavillon");
  $("nStands").textContent = TOUS.filter(o => o.kind === "stand").length;
  $("nExpo").textContent = TOUS.filter(o => o.kind === "stand" && o.nom).length +
    HEBERGES.filter(o => o.nom).length;
  $("nZones").textContent = TOUS.filter(o => o.kind === "zone").length;
  chargeParcours();

/* ============================================================
   2. Mesure de texte — largeur réelle dans la police de rendu
   ============================================================ */
const _cvs = document.createElement("canvas").getContext("2d");
const _lg = new Map();
function largeur(txt, police){
  const k = police[0] + police[1] + "|" + txt;
  let v = _lg.get(k);
  if (v === undefined){
    _cvs.font = police[0] + " 100px " + police[1];
    v = _cvs.measureText(txt).width / 100;
    if (!(v > 0)) v = txt.length * .55;
    _lg.set(k, v);
  }
  return v;
}
/* Comparer deux noms selon les règles du français demande un comparateur.
   `localeCompare` avec des options en rebâtit un à chaque appel : sur les
   milliers de comparaisons d'un tri, c'est lui qu'on paie, pas le tri. */
const COLLATION = new Intl.Collator("fr", { numeric: true });

const P_NOM = ["600", '"Instrument Sans", sans-serif'];
const P_CODE = ["500", '"IBM Plex Mono", monospace'];

function decoupe(txt, n){
  if (n === 1) return [txt];
  const mots = txt.split(/\s+/);
  if (mots.length < n) return null;
  const cible = Math.ceil(txt.length / n);
  const out = [""];
  for (const m of mots){
    const cur = out[out.length - 1];
    if (cur && (cur + " " + m).length > cible && out.length < n) out.push(m);
    else out[out.length - 1] = cur ? cur + " " + m : m;
  }
  return out.length === n ? out : null;
}
function habille(txt, w, h, maxPolice, police){
  let best = null;
  for (let n = 1; n <= 3; n++){
    const lignes = decoupe(txt, n);
    if (!lignes) continue;
    const plusLarge = Math.max(...lignes.map(l => largeur(l, police)));
    const f = Math.min(w / plusLarge, h / (lignes.length * 1.18), maxPolice);
    if (!best || f > best.f) best = { f, lignes };
  }
  return best;
}
function lignesSvg(lignes, f, x, yCentre, cls){
  const dep = yCentre - ((lignes.length - 1) * f * 1.18) / 2 + f * .33;
  return lignes.map((t, i) =>
    '<text class="' + cls + '" x="' + x + '" y="' + (dep + i * f * 1.18).toFixed(2) +
    '" font-size="' + f.toFixed(2) + '">' + esc(t) + '</text>').join("");
}

/**
 * Ce que le plan dit des stands partagés, et que l'exploitant peut retirer.
 *
 * Deux réglages, parce que les deux gênes ne sont pas la même : la pastille
 * charge le plan d'un chiffre de plus, la fenêtre de choix ajoute un clic
 * avant toute fiche. Un salon où deux stands seulement sont partagés veut
 * souvent se passer de la seconde sans renoncer à la première.
 *
 * Rien retiré par défaut : un réglage absent laisse le salon tel qu'il était.
 */
const coexComptes = () => conf("_coexNombre").visible !== false;
const coexChoisit = () => conf("_coexChoix").visible !== false;

/**
 * La ligne du numéro de stand, et le compte des sociétés qu'il héberge.
 *
 * Un stand partagé garde le nom de son titulaire — c'est le sien, c'est lui
 * qui loue l'emplacement — et une pastille dit combien d'autres l'y
 * accompagnent : « +2 » sous « Airbnb » en annonce deux de plus, que la fiche
 * nomme. Le nombre est celui des hébergés, pas le total : c'est ce que « + »
 * veut dire partout ailleurs.
 *
 * Le couple reste centré sur l'ancre, la pastille poussant le numéro vers la
 * gauche : déborder à droite mènerait sur la cloison du voisin. Faute de
 * place, le numéro reste seul — une pastille hors du stand désignerait
 * quelqu'un d'autre.

function ligneCode(s, xc, yBase, f, wMax, cls){
  const texte = (x, c, txt) =>
    '<text class="' + c + '" x="' + x.toFixed(2) + '" y="' + yBase.toFixed(2) +
    '" font-size="' + f.toFixed(2) + '">' + esc(txt) + '</text>';
  const n = coexComptes() ? (s.coex || []).length : 0;
  const wCode = largeur(s.code, P_CODE) * f;
  const compte = "+" + n;
  const marge = f * .34, ecart = f * .42;
  const wPast = largeur(compte, P_CODE) * f + marge * 2;
  if (!n || wCode + ecart + wPast > wMax) return texte(xc, cls, s.code);
  const g = xc - (wCode + ecart + wPast) / 2;
  const xp = g + wCode + ecart, hp = f * 1.16;
  return texte(g + wCode / 2, cls, s.code) +
    '<rect class="coexPast' + (cls ? " " + cls : "") + '" x="' + xp.toFixed(2) +
    '" y="' + (yBase - f * .84).toFixed(2) +
    '" width="' + wPast.toFixed(2) + '" height="' + hp.toFixed(2) +
    '" rx="' + (hp / 2).toFixed(2) + '"/>' +
    /* Le nombre porte lui aussi la marque de la sélection : c'est elle qui
       décide de sa couleur, comme pour le numéro du stand. */
    texte(xp + wPast / 2, "coexN" + cls, compte);
}

/* ============================================================
   3. Rendu du pavillon courant
   ============================================================ */
/* Les calques d'habillage sont recréés à l'arrivée sur un pavillon ; ensuite
   ordonneDom() ne fait que déplacer les nœuds, ce qui rend le réordonnancement
   instantané malgré le poids du fond de plan. */
function monteHabillage(){
  const c = $("couches");
  c.querySelectorAll(".cal").forEach(g => g.remove());
  P().fond.forEach(f => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "cal");
    g.dataset.cle = f.cle;
    g.innerHTML = f.svg || "";
    c.appendChild(g);
  });
}

/* Le panneau des calques ne peut se construire qu'une fois le plan monté.
   L'identité de l'exploitant, elle, peut être vérifiée avant ou après :
   ce drapeau permet aux deux ordres d'arrivée d'aboutir. */
let MONTE = false;

function montePlan(){
  const p = P();
  /* Une zone que l'exploitant a éteinte ne parvient jamais au visiteur : si
     elle est là, c'est qu'on administre, et la teinte pâlie dit qu'elle ne
     sera pas sur le plan public. */
  $("zones").innerHTML = p.zones.map(z =>
    '<g class="zone' + (z.masquee ? ' masquee' : '') + '" data-id="' + z.id +
    '" tabindex="0" role="button" aria-label="' +
    esc(z.nom || "zone") + '"><path d="' + z.d + '"/></g>').join("");
  $("stands").innerHTML = p.stands.map(s =>
    '<g class="stand" data-id="' + s.id + '" tabindex="0" role="button" aria-label="' +
    esc(s.nom || ("Stand " + (s.code || ""))) + '"><path d="' + s.d + '"/></g>').join("");
  emp = p.emprise;
  calqueActif = null;
  HIST.length = REFAIRE.length = 0;
  { const o = $("outils"); if (o) o.classList.remove("open"); }
  monteHabillage();
  dessineDessins();          // crée les calques de dessin puis ordonne la pile
  appliqueApparence();
  marqueParcours();
  // le trajet vit hors des calques : il survit au montage, mais son tronçon
  // n'est pas celui du pavillon qu'on vient d'ouvrir
  dessineItineraire();
  rafraichitApercu();
  MONTE = true;
  if (ADMIN) construitPanneau();
  onglets();
}

function onglets(){
  $("halls").innerHTML = DATA.plans.map((p, i) =>
    '<button data-p="' + i + '" aria-pressed="' + (i === state.plan) + '">' +
    esc(p.libelle) + '<span class="n">' + p.stands.length + '</span></button>').join("");
  $("halls").querySelectorAll("button").forEach(b => b.onclick = () => changePlan(+b.dataset.p));
}

function changePlan(i){
  if (i === state.plan) return;
  state.plan = i;
  ferme();
  montePlan(); fit(); liste();
  chargeFond(i);
}

/* ============================================================
   4. Libellés — le nom de l'exposant prime sur le numéro
   ============================================================ */
/* Où écrire le nom, et de quelle place on dispose.
   Sur une forme découpée — un L, un U, un stand à redent — le centre de la
   boîte englobante tombe hors de la forme et cette boîte promet une largeur
   qui n'existe pas. La synchronisation calcule alors un ancrage intérieur et
   la place réellement libre autour de lui ; un rectangle n'en a pas besoin. */
const ancre = o => o.lc || o.c;
const place = o => o.lb || o.bb;

function libelles(){
  const l = $("labels"), p = P();
  const r = svg.getBoundingClientRect();
  const pxParM = (r.width || 1) / view.w;
  const dansVue = o => o.c[0] > view.x - 25 && o.c[0] < view.x + view.w + 25 &&
                       o.c[1] > view.y - 25 && o.c[1] < view.y + view.h + 25;
  let out = "";

  /* Chaque libellé dans son propre groupe, sous l'identifiant de ce qu'il
     nomme : c'est ce qui permet de l'attraper pour le placer à la main. Le nom
     de l'attribut n'est pas « data-id » à dessein — ce groupe n'est pas
     l'emplacement, et le clic qui ouvre une fiche ne doit pas le confondre
     avec lui. */
  const groupe = (o, h) => h
    ? '<g class="lbl' + (o.id === libSel ? " pick" : "") +
      '" data-lbl="' + esc(o.id) + '">' + h + '</g>'
    : "";

  for (const z of p.zones){
    const sel = z.id === state.sel;
    if (!z.nom || (!sel && (!visibleSurPlan(z) || !dansVue(z)))) continue;
    const pz = place(z);
    out += groupe(z, libelleZone(z, ancre(z), pz[0], pz[1], sel, pxParM,
                                 placementLibelle(z)));
  }

  /* Quand la sélection s'est arrêtée à un découpage, l'emplacement qui
     l'héberge n'est pas ce qu'on a choisi : son libellé reste celui d'un stand
     ordinaire, et c'est le découpage qui écrit le sien en évidence. */
  const decoupe = Boolean(state.sel && decoupeStand(state.sel, state.selSoc));

  for (const s of p.stands){
    const sel = s.id === state.sel && !decoupe;
    if (!sel && (!visibleSurPlan(s) || !dansVue(s))) continue;
    /* Le stand garde le nom de son titulaire, quelle que soit la fiche
       ouverte : c'est lui qui loue l'emplacement, et c'est ce nom-là qui est
       peint sur la cloison. Les sociétés qu'il héberge se comptent à côté. */
    if (!s.code && !s.nom) continue;
    const ps = place(s);
    out += groupe(s, libelleEmplacement(s, ancre(s), ps[0], ps[1], sel, pxParM,
                                        placementLibelle(s)));
  }

  l.innerHTML = out;
  /* Les stands dessinés à la main écrivent le leur dans leur propre forme, et
     non ici : un calque posé par-dessus celui des textes recouvrirait sinon le
     nom qu'il porte. La règle de lisibilité, elle, est la même — d'où cet
     appel au même endroit. */
  poseLibellesDessines(pxParM);
}

/* ------------------------------------------------------------
 * Le placement réglé à la main, appliqué à ce que le calcul propose : un
 * décalage en mètres, et un facteur de taille.
 *
 * Le facteur multiplie ce que le calcul a trouvé au lieu de le remplacer :
 * l'enseigne garde ainsi le découpage en lignes que sa place lui donnait, et
 * l'agrandir ne la recompose pas d'un coup en travers du stand.
 *
 * En mode placement, un libellé réglé s'affiche quelle que soit sa taille à
 * l'écran. Sans cela, le réduire au point de le faire disparaître le rendrait
 * inatteignable — et le réglage, impossible à défaire.
 * ------------------------------------------------------------ */
const decaleLibelle = (xy, reg) => reg ? [xy[0] + (reg.dx || 0), xy[1] + (reg.dy || 0)] : xy;
const facteurLibelle = (reg) => reg && reg.k > 0 ? reg.k : 1;
const libelleForce = (reg) => Boolean(reg && PLACE_LIBELLES);

/** Le libellé d'une zone organisateur : son nom, en grand, sur son ancrage. */
function libelleZone(z, az, w, h, sel, pxParM, reg){
  const a = habille(z.nom, w * .88, h * .7, 3.4, P_NOM);
  if (!a) return "";
  const f = a.f * facteurLibelle(reg);
  if (!sel && !libelleForce(reg) && f * pxParM < 6.5) return "";
  const xy = decaleLibelle(az, reg);
  return lignesSvg(a.lignes, f, xy[0], xy[1],
    "zn" + (sel ? " sel" : "") + (z.masquee ? " masquee" : ""));
}

/**
 * Le libellé d'un emplacement : le nom de l'enseigne, son numéro dessous.
 *
 * Il s'écrit pour deux choses que rien d'autre ne rapproche — le stand rendu
 * par la synchronisation, qui tient son ancrage et sa place de la source, et
 * le stand dessiné à la main, qui les tient de son rectangle. Le rendu doit
 * être le même : c'est tout l'intérêt de dessiner un stand plutôt qu'une
 * forme quelconque.
 */
function libelleEmplacement(s, as, w, h, sel, pxParM, reg){
  const k = facteurLibelle(reg), force = libelleForce(reg);
  const nom = s.nom ? habille(s.nom, w * .9, h * .62, 2.4, P_NOM) : null;
  const fn = nom ? nom.f * k : 0;
  const nomLisible = nom && (sel || force || fn * pxParM >= 4.5);
  const maxCode = s.nom ? Math.min(nom ? nom.f * .78 : 1.2, h * .22) : h * .34;
  const fc = (s.code ? Math.min(maxCode, (w * .9) / largeur(s.code, P_CODE), 1.9) : 0) * k;
  const codeLisible = fc && (sel || force || fc * pxParM >= (nomLisible ? 5 : 6));
  if (!codeLisible && !nomLisible) return "";

  const c = sel ? " sel" : "";
  const xy = decaleLibelle(as, reg);
  const hNom = nomLisible ? nom.lignes.length * fn * 1.18 : 0;
  const hCode = codeLisible ? fc * 1.25 : 0;
  let y = xy[1] - (hNom + hCode) / 2, out = "";
  if (nomLisible){ out += lignesSvg(nom.lignes, fn, xy[0], y + hNom / 2, "nm" + c); y += hNom; }
  if (codeLisible) out += ligneCode(s, xy[0], y + fc * .92, fc, w * .9 * k, c);
  return out;
}

/* ============================================================
   5. Recherche et secteurs — sans mot-clé ni critère retenu on reste sur le
      pavillon affiché, dès qu'on filtre on balaie les trois

   On ne cherche qu'un exposant. Les zones organisateur — restauration,
   accueil, animations — ne se retiennent pas par leur nom : on les repère
   sur le plan à leur forme et à leur couleur, et le tiroir des calques les
   montre ou les cache. Elles ne paraissent donc plus dans la liste, ni sous
   mot-clé ni sans. Sur le plan, rien ne change : elles gardent leur libellé,
   leur fiche et leur programme.
   ============================================================ */
/* Les secteurs, et la teinte de chacun.

   Les teintes tournent sur une roue plutôt que de se tirer d'une palette
   nommée : un salon découpe en cinq secteurs, un autre en dix-huit, et une
   palette finie redonnerait deux fois la même couleur sans qu'on l'ait voulu.
   L'ordre est celui des noms, jamais celui des stands : le même secteur garde
   sa couleur d'un pavillon à l'autre, et d'une synchronisation à la suivante. */
const TEINTES = [212, 28, 145, 340, 262, 42, 190, 8, 100, 310, 172, 62];
let SECTEURS = new Map();

function indexeSecteurs(){
  const noms = [...new Set(DATA.plans.flatMap(p => p.stands.map(s => s.sect)))]
    .filter(Boolean).sort(COLLATION.compare);
  SECTEURS = new Map(noms.map((n, i) => [n, TEINTES[i % TEINTES.length]]));
}

/**
 * Les secteurs se montrent-ils ?
 *
 * Un salon qui ne sectorise pas n'a rien à montrer ; ailleurs c'est un réglage,
 * car un plan déjà réglé au blanc ou à la couleur maison de l'exploitant ne
 * doit pas se retrouver bariolé sans qu'il l'ait demandé.
 */
const secteursMontres = () => SECTEURS.size > 0 && conf("_secteurs").visible !== false;

/* La configuration voyage par la base et finit dans un attribut de style : on
   n'accepte d'elle que la forme hexadécimale, celle que rend le sélecteur. */
const couleurConf = v => /^#[0-9A-Fa-f]{3,8}$/.test(String(v || "")) ? String(v) : null;

/** Une teinte du cercle chromatique en hexadécimal, pour un sélecteur de
 *  couleur — qui ne connaît que cette notation. */
function hslHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 *
    (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return "#" + [f(0), f(8), f(4)]
    .map(v => v.toString(16).padStart(2, "0")).join("");
}

/**
 * La couleur d'un secteur, telle que le plan la montre.
 *
 * Celle que l'exploitant a choisie s'il l'a fait ; sinon la teinte automatique,
 * résolue dans le thème courant — c'est bien la couleur qu'on voit à l'écran
 * que le sélecteur doit présenter, et non celle d'un thème qu'on ne regarde
 * pas.
 */
function couleurSecteur(nom){
  return couleurConf(conf("secteur:" + nom).couleur) ||
    hslHex(SECTEURS.get(nom) || 0,
           parseFloat(jeton("--sect-s")) || 58, parseFloat(jeton("--sect-l")) || 87);
}

/* Les bandes qui défilent, et ce qui le fait voir.

   En tiroir — sur téléphone — les critères retenus tiennent sur une ligne
   unique qui déborde par le côté : la hauteur s'y paie sur le plan, et deux
   lignes de puces le mangeraient. Mais une puce coupée net au bord de l'écran
   ne se lit pas comme une invitation à pousser du doigt : elle se lit comme un
   défaut de cadrage, et le reste du salon n'est jamais visité.

   On marque donc le bord par lequel il reste quelque chose, et lui seul ; le
   CSS l'estompe et y pose une flèche, qui le dit et le fait. Arrivé au bout, plus rien ne s'efface — c'est ainsi qu'on sait
   qu'on a tout vu. Sur grand écran les bandes se replient sur plusieurs lignes
   et ne défilent pas : rien ne déborde, rien ne se marque, la règle ne
   s'applique nulle part sans qu'on ait à la conditionner à la largeur. */
const BANDES = () => [...document.querySelectorAll(".bande")];

/**
 * Marquer, sur chaque cadre, le bord par lequel il reste quelque chose.
 *
 * Le cadre plutôt que la bande : c'est lui qui porte les flèches, et le CSS ne
 * sait pas remonter d'un enfant à son voisin.
 */
function majFondus(){
  BANDES().forEach(b => {
    const n = b.querySelector(".defile");
    if (!n) return;
    /* Le défilement est fractionnaire — zoom du navigateur, densité d'écran —
       et n'atteint jamais le bout au pixel près : un pixel de marge, sinon le
       fondu de droite ne s'éteint pas là où il n'y a plus rien. */
    const reste = n.scrollWidth - n.clientWidth - n.scrollLeft;
    b.toggleAttribute("data-gauche", n.scrollLeft > 1);
    b.toggleAttribute("data-droite", reste > 1);
  });
}

BANDES().forEach(b => {
  const n = b.querySelector(".defile");
  if (n) n.addEventListener("scroll", majFondus, { passive: true });
  /* Une pression avance d'un écran, moins une puce : celle qu'on avait sous
     les yeux reste en vue, et l'on garde le fil de ce qu'on parcourt. Le
     défilement doux fait défiler les événements, qui remarquent les bords. */
  b.querySelectorAll(".fleche").forEach(f => f.onclick = () => {
    if (!n) return;
    n.scrollBy({ left: Number(f.dataset.vers) * n.clientWidth * .8, behavior: "smooth" });
  });
});
/* La bascule tiroir / colonne change tout : ce qui défilait ne défile plus, et
   les puces se replient. Les polices, elles, arrivent après le premier calcul
   et changent la largeur mesurée. */
addEventListener("resize", majFondus);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(majFondus);

/**
 * La pastille d'un secteur, telle qu'une puce de critère la porte.
 *
 * Le secteur a rejoint les critères de recherche, où rien d'autre n'est
 * coloré : sa teinte n'y est plus une décoration mais ce qui rattache le nom
 * qu'on coche aux stands qu'on voit sur le plan. Elle vient donc avec lui,
 * là où la bande la portait.
 */
function pastilleSecteur(nom){
  const h = SECTEURS.get(nom);
  if (h === undefined) return "";
  const c = couleurConf(conf("secteur:" + nom).couleur);
  return '<i class="pastille" style="--sect-h:' + h +
    (c ? ";--sect-c:" + c : "") + '"></i>';
}

/**
 * La teinte du secteur, posée sur le groupe du stand plutôt que sur son tracé :
 * la feuille de style la lit de là, et garde la main sur le survol et la
 * sélection, qui doivent l'emporter sur elle.
 */
function coloreSecteurs(){
  /* Le coloriage éteint, le stand perd sa marque de secteur : la feuille de
     style n'a plus de teinte à poser, sans qu'on ait à la lui interdire.

     Les stands dessinés à la main la reçoivent aussi : ils découpent un
     emplacement, et un découpage qui ne prendrait pas sa couleur trouerait le
     secteur d'un blanc que rien n'expliquerait. */
  const on = secteursMontres();
  document.querySelectorAll("#stands g, #couches .dcal .sdes[data-id]").forEach(g => {
    const o = parId.get(g.dataset.id);
    const nom = on && o ? o.sect : null;
    const h = nom ? SECTEURS.get(nom) : undefined;
    if (h === undefined){
      g.removeAttribute("data-sect");
      g.style.removeProperty("--sect-h");
      g.style.removeProperty("--sect-c");
    } else {
      g.setAttribute("data-sect", "");
      g.style.setProperty("--sect-h", h);
      /* Une couleur choisie remplace la teinte au lieu de s'y ajouter : elle
         vaut pour les deux thèmes, comme celle des autres couches, et ne se
         laisse donc pas ternir par la clarté du thème courant. */
      const c = couleurConf(conf("secteur:" + nom).couleur);
      if (c) g.style.setProperty("--sect-c", c);
      else g.style.removeProperty("--sect-c");
    }
  });
  /* La carte de chaleur se pose sur les mêmes formes et par-dessus la même
     teinte. Elle suit donc ici : c'est le seul point que traversent tous les
     chemins qui rebâtissent les stands — changement de pavillon, arrivée du
     fond, rafraîchissement des découpages dessinés. Elle ne fait rien tant
     qu'on ne l'a pas ouverte, ce qui n'arrive qu'en administration. */
  coloreChaleur();
}

/* Le secteur n'est offert comme critère que là où le plan sectorise et le
   montre : le réglage qui l'éteint doit donc retirer le filtre avec les
   couleurs, et non le laisser retrancher des stands sans que rien ne le dise.
   Un simple changement de couleur, lui, ne rebâtit pas l'index — on le relève
   à chaque glissement du sélecteur. */
let _secteursOfferts = null;

/** Les couleurs du plan et le critère suivent le même réglage. */
function appliqueSecteurs(){
  coloreSecteurs();
  const offert = secteursMontres();
  if (offert !== _secteursOfferts){ _secteursOfferts = offert; indexeCriteres(); }
}

/**
 * Retenir une seule thématique, celle qu'on vient de lire sur une fiche.
 *
 * C'est l'autre porte d'entrée : de l'exposant vers ses semblables, quand on a
 * trouvé à peu près ce qu'on cherchait et qu'on veut voir le reste. Elle passe
 * par le critère « Thématiques », comme la fenêtre des critères — c'est le même
 * filtre, atteint par un autre chemin.
 *
 * On repart à neuf : mot-clé et autres critères effacés, sinon la liste
 * répondrait à une question qu'on ne pose plus, et paraîtrait vide sans raison.
 */
function filtreTheme(n){
  if (!themeFiltrable(n)) return;
  state.crit.clear();
  state.crit.set(CLE_THEMES, new Set([n]));
  state.q = ""; state.qn = "";
  if ($("q")) $("q").value = "";
  ferme();
  majCriteres();
  appliqueFiltre();
  // sur téléphone la liste est repliée : le filtre n'aurait rien à montrer
  montreTiroir();
}

/**
 * Ce que la liste retient : une société répond pour elle-même, jamais pour son
 * voisin. Un critère retenu porte, comme un mot-clé, sur tout le salon — un
 * exposant du secteur cherché peut être dans un autre pavillon que celui qu'on
 * regarde — et les deux se cumulent : le mot-clé cherche parmi ce que les
 * critères ont retenu, et non à côté.
 */
/* ------------------------------------------------------------
   Les critères de recherche

   Chercher par mot-clé suppose de savoir quoi taper. Un visiteur qui veut
   « les enseignes de restauration présentes en Auvergne-Rhône-Alpes » ne sait
   pas sous quel intitulé le salon range cela — mais l'exploitant, lui, le
   sait : il désigne depuis la console les champs qui font des critères, et
   c'est de la donnée elle-même que les valeurs proposées sont tirées.

   Rien n'est offert d'office. Un plan qui déplierait douze filtres sur un
   téléphone n'aurait plus de plan : les critères tiennent derrière un seul
   bouton, et ce qui est retenu se relit d'un coup d'œil sous la recherche.
   ------------------------------------------------------------ */
const PREFIXE_PERSO = "perso:";

/* Ce qu'un critère lit sur une fiche. Les champs propres au salon vivent dans
   « perso » ; les autres sont posés à plat, chacun sous le nom que la
   synchronisation lui donne — ce ne sont pas les mêmes que les cibles de la
   console, d'où cette table. */
const LECTURE_CRITERE = {
  secteur: o => [o.sect],
  ville: o => [o.ville],
  pays: o => [o.pays],
  nomenclature: o => o.nomencl,
  thematiques: o => o.themes,
  // un oui/non n'a qu'une valeur à cocher : le champ lui-même
  nouveau: o => o.neuf ? ["Oui"] : [],
};
const OUI_NON = { nouveau: true };
const LIBELLE_CRITERE = {
  secteur: "Secteur", ville: "Ville", pays: "Pays", nomenclature: "Nomenclature",
  thematiques: "Thématiques", nouveau: "Nouvel exposant",
};
/* Thématiques et secteurs ont eu chacun leur bande de puces sous la recherche.
   Elles prenaient la place de deux lignes de résultats — un salon range parfois
   trente thématiques — et rangeaient à part des filtres qui font le même
   travail que la ville ou la nomenclature. Tout tient donc ici.

   Le secteur y garde sa couleur : ailleurs elle serait une décoration, ici elle
   rattache le nom qu'on coche aux stands qu'on voit sur le plan, dont il reste
   la seule légende.

   Une cible absente de cette table ne rend aucune valeur, donc aucun critère —
   un réglage ancien qui la désignerait encore reste sans effet. */
const CLE_THEMES = "thematiques";
const CLE_SECTEUR = "secteur";

/* Le secteur décrit l'emplacement, pas la société qui l'occupe : le retenir ne
   fait donc pas paraître les sociétés hébergées, qui n'en ont pas en propre —
   elles empruntent celui de leur hôte, et la liste dirait deux fois le même
   emplacement. C'est ce qui le sépare de tous les autres critères. */
const CRITERES_EMPLACEMENT = new Set([CLE_SECTEUR]);

/** Une thématique lue sur une fiche mène-t-elle quelque part ? Seulement si
 *  l'exploitant a fait des thématiques un critère, et si celle-ci en est une
 *  valeur — sinon le lien promettrait une liste qu'on ne saurait pas dresser. */
const themeFiltrable = (n) => CRITERES.some(c => c.cle === CLE_THEMES &&
  c.valeurs.some(x => x.v === String(n).trim()));

/* Sur le plan d'administration, un critère encore vide se montre et s'explique ;
   sur le plan public, il n'existe pas. */
const PLAN_ADMIN = document.documentElement.dataset.role === "admin";

/**
 * Les champs retenus comme critères, dans l'ordre où la console les range.
 *
 * Le secteur ouvre la marche et ne se coche pas : il ne vient d'aucun champ de
 * fiche à associer mais du plan lui-même, où il est là ou n'est pas. Le
 * réglage qui l'éteint est celui des couleurs, et il l'éteint des deux côtés.
 * C'est aussi le découpage le plus large du salon : le poser en tête range les
 * critères du plus grossier au plus fin.
 */
function clesCriteres(){
  const r = (DATA && DATA.fiche && DATA.fiche.criteres) || {};
  const cochees = Object.keys(r).filter(k => r[k] === true);
  return secteursMontres() ? [CLE_SECTEUR].concat(cochees) : cochees;
}

/** L'intitulé d'un critère : celui du salon pour un champ qu'il s'est ajouté. */
function libelleCritere(cle){
  if (cle.indexOf(PREFIXE_PERSO) !== 0) return LIBELLE_CRITERE[cle] || cle;
  const c = ((DATA && DATA.fiche && DATA.fiche.perso) || [])
    .find(x => x && PREFIXE_PERSO + x.cle === cle);
  return (c && c.libelle) || cle.slice(PREFIXE_PERSO.length);
}

/** Les valeurs d'un champ à choix, une par entrée, points-virgules défaits. */
const separeValeurs = v => [].concat(v)
  .filter(x => x !== null && x !== undefined)
  .flatMap(x => String(x).split(";"))
  .map(x => x.trim()).filter(Boolean);

/**
 * Les valeurs d'une fiche pour un critère, toujours une liste de textes.
 *
 * Un champ à choix multiple ne descend pas en liste : la source joint ses
 * valeurs par un point-virgule — « Devenir master-franchisé;Adhérent FFF ».
 * Prise telle quelle, la chaîne entière ferait une valeur à part, et un
 * exposant qui en porte deux ne se retrouverait avec personne : il y aurait
 * autant de valeurs à cocher que de combinaisons. On les sépare donc ici
 * aussi, et pas seulement à la synchronisation — les fiches déjà relevées
 * portent encore la chaîne entière, et n'attendent pas le prochain passage
 * pour se laisser filtrer.
 */
function valeursCritere(o, cle){
  const brut = cle.indexOf(PREFIXE_PERSO) === 0
    ? (o.perso || {})[cle.slice(PREFIXE_PERSO.length)]
    : (LECTURE_CRITERE[cle] ? LECTURE_CRITERE[cle](o) : null);
  if (brut === null || brut === undefined || brut === "") return [];
  /* Une liste peut porter des trous — une société hébergée sans ville en a un
     là où les autres ont la leur — et « undefined » deviendrait une valeur à
     cocher si on la traduisait en texte avant de l'écarter. */
  return separeValeurs(brut);
}


/** Tout ce qu'une fiche porte de critères, pour la recherche plein texte. */
function texteCriteres(o){
  return clesCriteres().flatMap(c => valeursCritere(o, c)).join(" ");
}

/**
 * Les critères et leurs valeurs, relevés dans le salon entier.
 *
 * Les valeurs viennent des fiches, jamais d'une liste tenue à part : un filtre
 * qui proposerait une ville où personne n'expose ne rendrait que des listes
 * vides. Elles sont comptées, et rangées de la plus portée à la moins portée —
 * c'est l'ordre dans lequel on les cherche.
 */
let CRITERES = [];
function indexeCriteres(){
  const fiches = TOUS.filter(o => o.kind === "stand").concat(HEBERGES);
  CRITERES = clesCriteres().map(cle => {
    const n = new Map();
    fiches.forEach(o => valeursCritere(o, cle)
      .forEach(v => n.set(v, (n.get(v) || 0) + 1)));
    const valeurs = [...n].sort((a, b) => (b[1] - a[1]) || COLLATION.compare(a[0], b[0]))
      .map(([v, k]) => ({ v, n: k }));
    return {
      cle, libelle: libelleCritere(cle), ouiNon: OUI_NON[cle] === true,
      valeurs, vide: !valeurs.length,
    };
  /* Un critère que rien ne renseigne ne rendrait rien : le visiteur ne le voit
     pas. L'exploitant, lui, le voit et lit pourquoi — sans quoi un champ tout
     juste réglé semble n'avoir servi à rien, alors qu'il attend seulement la
     synchronisation qui relèvera ses valeurs. */
  }).filter(c => !c.vide || PLAN_ADMIN);
  /* Un critère retenu avant un rechargement peut avoir disparu du réglage, ou
     n'avoir plus aucune valeur : il resterait sinon à retrancher des fiches
     sans que rien ne le montre. */
  [...state.crit.keys()].forEach(k => {
    if (!CRITERES.some(c => c.cle === k)) state.crit.delete(k);
  });
  majCriteres();
}

/** Ce que la liste retient d'un critère : une valeur cochée suffit. */
function dansCriteres(o){
  for (const [cle, choisies] of state.crit){
    const v = valeursCritere(o, cle);
    if (!v.some(x => choisies.has(x))) return false;
  }
  return true;
}

const critereActif = (cle, v) => state.crit.has(cle) && state.crit.get(cle).has(v);

function basculeCritere(cle, v){
  const l = state.crit.get(cle) || new Set();
  if (l.has(v)) l.delete(v); else l.add(v);
  if (l.size) state.crit.set(cle, l); else state.crit.delete(cle);
  majCriteres();
  appliqueFiltre();
}

function videCriteres(){
  state.crit.clear();
  majCriteres();
  appliqueFiltre();
}

/** Le nombre de valeurs retenues, tous critères confondus. */
const nCriteres = () => [...state.crit.values()].reduce((a, l) => a + l.size, 0);

/**
 * La barre : le bouton qui ouvre les critères, et ce qui est retenu.
 *
 * Les valeurs retenues restent sous les yeux, chacune sur une puce qui la
 * retire d'une pression. Sans elles, on ne saurait plus pourquoi la liste est
 * si courte — et sur un téléphone, le panneau qui les porte est fermé.
 */
function majCriteres(){
  const btn = $("btnFiltres"), barre = $("actifs");
  if (!btn || !barre) return;
  btn.hidden = !CRITERES.length;
  // un panneau qui n'offrirait que des critères vides n'a rien à filtrer : il
  // ne s'ouvre que pour dire ce qui manque, et le bouton le dit aussi
  btn.classList.toggle("vide", CRITERES.every(c => c.vide));
  const n = nCriteres();
  const jeton = $("nFiltres");
  jeton.hidden = !n;
  jeton.textContent = n;
  btn.setAttribute("aria-pressed", String(n > 0));

  barre.hidden = !n;
  barre.innerHTML = "";
  if (!n) { mesureTiroir(); return; }
  state.crit.forEach((valeurs, cle) => {
    const lib = libelleCritere(cle);
    valeurs.forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "actif";
      b.title = "Retirer ce critère";
      b.innerHTML = (cle === CLE_SECTEUR ? pastilleSecteur(v) : "") +
        '<span class="k"></span><span class="v"></span>' +
        '<span class="x" aria-hidden="true">×</span>';
      b.querySelector(".k").textContent = lib;
      b.querySelector(".v").textContent = OUI_NON[cle] ? "" : v;
      b.setAttribute("aria-label", "Retirer le critère " + lib + " " + v);
      b.onclick = () => basculeCritere(cle, v);
      barre.appendChild(b);
    });
  });
  if (n > 1){
    const t = document.createElement("button");
    t.type = "button";
    t.className = "actif vider";
    t.textContent = "Tout effacer";
    t.onclick = videCriteres;
    barre.appendChild(t);
  }
  // la barre fait partie de ce qui dépasse du tiroir replié : sa hauteur change
  mesureTiroir();
  majFondus();
}

/* Au-delà d'une douzaine de valeurs, on ne les parcourt plus des yeux : une
   ligne de saisie les tamise sur place. */
const VALEURS_TAMIS = 12;

/**
 * Le panneau des critères.
 *
 * Une fenêtre plutôt qu'un dépliant sous la recherche : sur un téléphone elle
 * occupe l'écran qu'il faut sans pousser la liste hors de vue, et le pouce y
 * atteint tout. Chaque groupe se replie une fois choisi — on ne règle pas
 * douze critères d'affilée — et le pied dit combien de fiches restent.
 */
function ouvreCriteres(){
  ouvreModale("Critères de recherche", corps => {
    const compte = document.createElement("p");
    compte.className = "compte-crit";
    const dis = () => {
      const n = TOUS.concat(HEBERGES).filter(o => o.kind !== "zone" && visible(o)).length;
      compte.textContent = n + (n > 1 ? " exposants retenus" : " exposant retenu");
    };

    CRITERES.forEach(c => {
      /* Un critère replié par défaut, sauf s'il est le seul et qu'il tient à
         l'écran : cent trente-neuf rubriques dépliées d'office repoussaient
         les autres critères et le pied de la fenêtre hors de vue, sur
         téléphone comme ailleurs. Le titre dit ce qui est retenu dedans, de
         sorte qu'un critère replié ne cache jamais un choix fait. */
      const g = document.createElement("details");
      g.className = "grp-crit";
      g.open = CRITERES.length === 1 && c.valeurs.length <= VALEURS_TAMIS;
      const h = document.createElement("summary");
      h.innerHTML = '<span class="t"></span><span class="r"></span>';
      h.querySelector(".t").textContent = c.libelle;
      const retenu = h.querySelector(".r");
      /* Le titre ne dit que ce qui est retenu dedans. Compter les valeurs
         offertes n'aidait pas à choisir — on ne coche pas un critère parce
         qu'il en propose quinze — et cette ligne-là devait rester libre pour
         la seule chose qu'un critère replié ne doit jamais cacher. */
      const disRetenu = () => {
        const n = (state.crit.get(c.cle) || new Set()).size;
        retenu.textContent = c.vide ? "aucune valeur relevée"
          : !n ? ""
          : c.ouiNon ? "retenu" : n + " retenue" + (n > 1 ? "s" : "");
        retenu.dataset.on = String(n > 0);
        retenu.dataset.manque = String(Boolean(c.vide));
      };
      disRetenu();
      g.appendChild(h);

      const puces = document.createElement("div");
      puces.className = "puces-crit";

      /* Rien à cocher, mais quelque chose à dire : le champ est bien réglé
         comme critère, ses valeurs se relèvent sur les fiches, et aucune n'y
         a été trouvée. */
      if (c.vide){
        g.open = true;
        const rien = document.createElement("p");
        rien.className = "vide-crit";
        rien.textContent = "Aucune valeur sur les fiches. Vérifiez le champ " +
          "d'origine de ce champ dans la console, puis lancez une " +
          "synchronisation : les valeurs proposées ici viennent d'elle.";
        g.appendChild(rien);
        corps.appendChild(g);
        return;
      }

      /* Un oui/non n'a pas de valeurs à choisir : il est lui-même la valeur,
         et deux puces « oui » et « non » diraient deux fois la même chose. */
      const offertes = c.ouiNon ? [c.valeurs[0]] : c.valeurs;

      const dessine = (tamis) => {
        puces.innerHTML = "";
        const t = (tamis || "").trim().toLowerCase();
        const vues = t ? offertes.filter(x => x.v.toLowerCase().includes(t)) : offertes;
        if (!vues.length){
          const vide = document.createElement("span");
          vide.className = "aucune";
          vide.textContent = "Aucune valeur ne correspond.";
          puces.appendChild(vide);
          return;
        }
        vues.forEach(x => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "puce-crit";
          b.setAttribute("aria-pressed", String(critereActif(c.cle, x.v)));
          b.innerHTML = (c.cle === CLE_SECTEUR ? pastilleSecteur(x.v) : "") +
            '<span class="l"></span><span class="n"></span>';
          b.querySelector(".l").textContent = c.ouiNon ? c.libelle : x.v;
          b.querySelector(".n").textContent = x.n;
          b.onclick = () => {
            basculeCritere(c.cle, x.v);
            b.setAttribute("aria-pressed", String(critereActif(c.cle, x.v)));
            disRetenu();
            dis();
          };
          puces.appendChild(b);
        });
      };

      if (!c.ouiNon && offertes.length > VALEURS_TAMIS){
        const ch = document.createElement("input");
        ch.type = "search";
        ch.className = "tamis";
        ch.placeholder = "Filtrer " + c.libelle.toLowerCase() + "…";
        ch.autocomplete = "off";
        ch.oninput = () => dessine(ch.value);
        g.appendChild(ch);
      }
      dessine("");
      g.appendChild(puces);
      corps.appendChild(g);
    });

    dis();
    corps.appendChild(compte);
  }, [
    { libelle: "Tout effacer", action: videCriteres },
    { libelle: "Voir les résultats", genre: "primaire" },
  ], "cote");
}

/** Quelque chose retranche-t-il de la liste ? Le mot-clé et les critères se
 *  cumulent, aucun ne prime. */
const filtre = () => Boolean(state.qn) || state.crit.size > 0;

/* Un critère qui parle de la société fait paraître les hébergées ; le secteur,
   qui parle de l'emplacement, non. */
const critParSociete = () =>
  [...state.crit.keys()].some(k => !CRITERES_EMPLACEMENT.has(k));

/* Une zone et une conférence répondent au mot-clé, jamais aux critères : ceux-ci
   décrivent une société — sa ville, ses rubriques — et rien de tout cela n'est
   d'elles. `dansCriteres` les écarte de lui-même, faute de valeur à opposer aux
   cases cochées ; c'est l'effet voulu, et non un oubli à rattraper : qui filtre
   par « gamme de produits » cherche des exposants. */
function visible(o){
