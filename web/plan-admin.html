/** Le pictogramme correspondant à un libellé, s'il en existe un. */
const pictoDe = (txt) => PICTO_MOTS[String(txt || "").trim().toLowerCase()] || null;

/* Taille de naissance d'un repère, en mètres. Un texte libre en fait deux ;
   un repère doit se repérer de loin, sans qu'on le cherche. */
const TAILLE_REPERE = 4;

const REPERES = ["WC", "Entrée", "Sortie", "Accueil", "Information",
                 "Restauration", "Café", "Vestiaire", "Ascenseur", "Escalier",
                 "Escalator", "Secours", "PMR", "Parking", "Distributeur",
                 "Salle de réunion"];

/**
 * Un repère : une pastille dans la couleur du calque, son libellé dedans.
 *
 * La largeur suit le texte, mesurée dans la police de rendu — une pastille
 * taillée au jugé serait trop courte sur « Restauration » et trop longue sur
 * « WC ». Tout est en mètres, comme le reste du plan : le repère grandit donc
 * avec le zoom, à l'inverse d'une épingle d'interface.
 */
function traceRepere(f){
  const t = f.taille || 2;
  const tete = '<g class="forme repere' + (f.id === formeSel ? " pick" : "") +
               '" data-f="' + f.id + '">';

  /* Un pictogramme se pose dans un <svg> imbriqué : il porte sa propre grille,
     et le navigateur se charge du cadrage — plus sûr qu'une transformation
     calculée à la main. */
  const g = PICTOS[f.picto || pictoDe(f.txt)];
  if (g){
    const cote = t * 2.4, m = cote * .15, k = cote - 2 * m;
    const x = f.pts[0][0] - cote / 2, y = f.pts[0][1] - cote / 2;
    return tete +
      '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + cote.toFixed(2) +
      '" height="' + cote.toFixed(2) + '" rx="' + (cote * .2).toFixed(2) + '"/>' +
      '<svg class="glyphe" x="' + (x + m).toFixed(2) + '" y="' + (y + m).toFixed(2) +
      '" width="' + k.toFixed(2) + '" height="' + k.toFixed(2) +
      '" viewBox="' + g.vb + '">' + g.d + '</svg></g>';
  }

  const l = largeur(f.txt || "", P_NOM) * t;
  const w = l + t * 1.1, ht = t * 1.65;
  const x = f.pts[0][0] - w / 2, y = f.pts[0][1] - ht / 2;
  return tete +
    '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) +
    '" height="' + ht.toFixed(2) + '" rx="' + (ht / 2).toFixed(2) + '"/>' +
    '<text x="' + f.pts[0][0] + '" y="' + (f.pts[0][1] + t * .35).toFixed(2) +
    '" font-size="' + t.toFixed(2) + '">' + esc(f.txt || "") + '</text></g>';
}

/**
 * Cartouche des points d'intérêt.
 *
 * Les repères posés sur un plan se répètent — plusieurs sanitaires, plusieurs
 * entrées — et se cherchent à l'œil. Le cartouche les récapitule par libellé ;
 * en choisir un met en avant tous ceux qui le portent, où qu'ils soient.
 */
let poiChoisi = null;

function cartouchePoi(){
  const z = $("poi");
  if (!z) return;
  const parNom = new Map();
  for (const cal of mesCalques()){
    if (cal.visible === false) continue;
    for (const f of cal.formes){
      if (f.t !== "repere" || !f.txt) continue;
      const cle = f.txt.trim();
      if (!parNom.has(cle)) parNom.set(cle, { n: 0, picto: f.picto || pictoDe(cle) });
      parNom.get(cle).n++;
    }
  }
  z.hidden = parNom.size === 0;
  if (z.hidden){ poiChoisi = null; eclairePoi(); return; }

  z.innerHTML = "";
  [...parNom.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "fr"))
    .forEach(([nom, o]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "poiBtn";
      b.setAttribute("aria-pressed", nom === poiChoisi);
      const g = PICTOS[o.picto];
      // largeur et hauteur en attributs : un <svg> sans dimension explicite
      // s'étale à la place disponible, et le cartouche y perdait sa mise en page
      b.innerHTML = (g
        ? '<svg class="poiPicto" width="17" height="17" viewBox="' + g.vb +
          '" aria-hidden="true">' + g.d + '</svg>'
        : "") + '<span></span>' + (o.n > 1 ? '<i>' + o.n + '</i>' : "");
      b.querySelector("span").textContent = nom;
      b.onclick = () => {
        const choisit = poiChoisi !== nom;
        poiChoisi = choisit ? nom : null;
        /* Les repères d'un même type sont dispersés dans le hall. Les mettre
           en avant sans reculer ne montrerait que ceux déjà à l'écran, et
           l'exploitant conclurait qu'il n'y en a pas d'autres. On revient donc
           sur le plan entier, où ils se comptent d'un coup d'œil. */
        if (choisit) fit();
        cartouchePoi();
      };
      z.appendChild(b);
    });
  eclairePoi();
}

/** Met en avant les repères du type choisi. */
function eclairePoi(){
  $("couches").querySelectorAll(".dcal .repere").forEach(g => {
    const f = formeParId(g.dataset.f);
    const on = poiChoisi && f && String(f.f.txt || "").trim() === poiChoisi;
    g.classList.toggle("phare", !!on);
  });
  racine.classList.toggle("poi-actif", !!poiChoisi);
}

/* Un bref halo, réservé à l'image posée automatiquement : sans lui on la
   cherche, et on croit qu'il reste un bouton à valider. */
function signale(id){
  const g = $("couches").querySelector('.forme[data-f="' + CSS.escape(id) + '"]');
  if (!g || REDUIT) return;
  g.classList.add("neuve");
  setTimeout(() => g.classList.remove("neuve"), 1300);
}

/* --- import d'image ---
   L'image est réduite et convertie en data-URI : une page publiée ne peut
   charger aucune ressource externe, tout doit vivre dans le document.   */
let imageEnAttente = null;
const MAX_PX = 1400;

/* On ne refuse plus une image faute de calque actif : on en ouvre un. */
function calquePourImage(){
  if (calqueActif && trouveCalque(calqueActif)) return trouveCalque(calqueActif);
  const l = mesCalques();
  if (l.length){ activeCalque(l[l.length - 1].id); return trouveCalque(calqueActif); }
  memorise();
  const c = { id: nouvelId(), nom: "Images", couleur: "#2F49D1",
              rempli: false, visible: true, formes: [] };
  l.push(c); enregistreDessins(); construitPanneau(); activeCalque(c.id);
  return c;
}

/* Pose l'image autour d'un point, à une taille lisible au zoom courant.
   Plus besoin de tracer un cadre : on ajuste ensuite si besoin. */
function poseImage(centre){
  if (!imageEnAttente) return;
  calquePourImage();
  const l = Math.max(4, view.w * .28);
  const ht = l / imageEnAttente.ratio;
  const c = centre || [view.x + view.w / 2, view.y + view.h / 2];
  const id = ajouteForme({ t: "image", src: imageEnAttente.src,
    pts: [[+(c[0] - l / 2).toFixed(2), +(c[1] - ht / 2).toFixed(2)],
          [+(c[0] + l / 2).toFixed(2), +(c[1] + ht / 2).toFixed(2)]] });
  signale(id);   // l'emplacement n'a pas été choisi : il faut le montrer
  $("outilsAide").textContent = "Image posée au centre de la vue. Glissez sur le plan pour en poser une autre.";
}

function importeImage(fichier, centre){
  if (!fichier || fichier.type.indexOf("image/") !== 0) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const type = fichier.type === "image/jpeg" ? "image/jpeg" : "image/webp";
      imageEnAttente = { src: c.toDataURL(type, .85), ratio: img.width / img.height };
      const v = $("vignette");
      v.innerHTML = '<img alt=""><span></span>';
      v.querySelector("img").src = imageEnAttente.src;
      v.querySelector("span").textContent =
        Math.round(imageEnAttente.src.length / 1365) + " Ko";
      v.dataset.prete = "1";
      choisitOutil("image");
      poseImage(centre);
    };
    img.onerror = () => { $("outilsAide").textContent = "Image illisible."; };
    img.src = fr.result;
  };
  fr.readAsDataURL(fichier);
}

$("fichierImage").onchange = e => { importeImage(e.target.files[0]); e.target.value = ""; };
$("choisirImage").onclick = () => $("fichierImage").click();

/* glisser-déposer sur le plan, et collage clavier : deux chemins qui ne
   dépendent pas de la boîte de dialogue système */
svg.addEventListener("dragover", e => { if (ADMIN) e.preventDefault(); });
svg.addEventListener("drop", e => {
  if (!ADMIN) return;
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) importeImage(f, versPlan(e.clientX, e.clientY));
});
addEventListener("paste", e => {
  if (!ADMIN) return;
  const it = [...(e.clipboardData ? e.clipboardData.items : [])]
    .find(x => x.type.indexOf("image/") === 0);
  if (it) importeImage(it.getAsFile());
});

/* --- gestion du geste de dessin ; renvoie true si l'événement est consommé --- */
function dessinPointerDown(e){
  if (editionPointerDown(e)) return true;
  if (!ADMIN || !calqueActif || outil === "main") return false;
  // sans cela le navigateur démarre une sélection de texte et le
  // relâchement du pointeur ne revient jamais
  e.preventDefault();
  if (outil === "rect" || outil === "image"){
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  }
  const p = versPlan(e.clientX, e.clientY);
  if (outil === "texte"){
    const txt = $("texteADessiner").value.trim();
    if (!txt){ $("texteADessiner").focus(); return true; }
    ajouteForme({ t: "texte", pts: [p], txt: txt, taille: 2 });
    return true;
  }
  if (outil === "repere"){
    const txt = $("repereTexte").value.trim();
    if (!txt){ $("repereTexte").focus(); return true; }
    // un repère se lit de loin : il naît deux fois plus grand qu'un texte
    ajouteForme({ t: "repere", pts: [p], txt: txt, taille: TAILLE_REPERE });
    return true;
  }
  if (outil === "rect"){ enCours = { t: "rect", pts: [p, p] }; return true; }
  if (outil === "image"){
    if (!imageEnAttente){ $("outilsAide").textContent = "Choisissez d’abord une image."; return true; }
    enCours = { t: "image", pts: [p, p] };
    return true;
  }
  // polygone et ligne : un clic par sommet
  if (!enCours) enCours = { t: outil, pts: [p] };
  else enCours.pts.push(p);
  apercu(cheminForme({ ...enCours, t: "ligne" }));
  aide();
  return true;
}
function dessinPointerMove(e){
  if (editionPointerMove(e)) return true;
  if (!enCours) return false;
  const p = versPlan(e.clientX, e.clientY);
  if (enCours.t === "rect" || enCours.t === "image"){
    enCours.pts[1] = p;
    if (enCours.t === "image"){    // on respecte les proportions de l'image
      const l = enCours.pts[1][0] - enCours.pts[0][0];
      enCours.pts[1][1] = +(enCours.pts[0][1] + Math.abs(l) / imageEnAttente.ratio).toFixed(2);
    }
    apercu(cheminForme(enCours));
  } else {
    apercu(cheminForme({ t: "ligne", pts: [...enCours.pts, p] }));
  }
  return true;
}
function dessinPointerUp(e){
  if (editionPointerUp(e)) return true;
  if (!enCours) return false;
  if (e && e.pointerId != null){
    try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  if (enCours.t === "rect" || enCours.t === "image"){
    const a = enCours.pts[0], b = enCours.pts[1];
    if (Math.abs(b[0] - a[0]) > .3 && Math.abs(b[1] - a[1]) > .3){
      if (enCours.t === "image"){
        enCours.pts = [[Math.min(a[0], b[0]), Math.min(a[1], b[1])],
                       [Math.max(a[0], b[0]), Math.max(a[1], b[1])]];
        enCours.src = imageEnAttente.src;
      }
      ajouteForme(enCours);
    }
    enCours = null; apercu(null);
  }
  return true;   // polygone et ligne restent ouverts jusqu'à Entrée
}
function termineTrace(valider){
  if (!enCours) return;
  const mini = enCours.t === "ligne" ? 2 : 3;
  if (valider && enCours.pts.length >= mini) ajouteForme(enCours);
  enCours = null; apercu(null); aide();
}

function aide(){
  if (!$("outilsAide")) return;
  const t = { main: formeSel ? "Glissez pour déplacer, les carrés pour redimensionner."
                             : "Cliquez une forme pour la modifier.",
              rect: "Cliquez-glissez pour tracer un rectangle.",
              poly: "Un clic par sommet, Entrée pour fermer, Échap pour annuler.",
              ligne: "Un clic par point, Entrée pour terminer, Échap pour annuler.",
              texte: "Saisissez le texte, puis cliquez à l'emplacement voulu.",
              repere: "Choisissez ou saisissez un libellé, puis cliquez à l'emplacement.",
              image: imageEnAttente ? "Glissez sur le plan pour poser une autre copie."
                                    : "Choisissez une image, ou déposez le fichier sur le plan.",
              _: "" };
  const n = enCours ? " (" + enCours.pts.length + " point" + (enCours.pts.length > 1 ? "s" : "") + ")" : "";
  $("outilsAide").textContent = t[outil] + n;
}

/* saisie du nom dans une fenêtre : plus visible qu'un double-clic */
function demandeNom(titre, valeur, suite){
  let champ;
  ouvreModale(titre, corps => {
    champ = document.createElement("input");
    champ.className = "nomcalque";
    champ.value = valeur;
    champ.setAttribute("aria-label", "Nom du calque");
    corps.appendChild(champ);
    setTimeout(() => { champ.focus(); champ.select(); }, 30);
    champ.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); valide(); }
    };
  }, [
    { libelle: "Annuler" },
    { libelle: "Valider", action: () => suite((champ.value || valeur).trim() || valeur) },
  ]);
  function valide(){ const v = (champ.value || valeur).trim() || valeur; fermeModale(); suite(v); }
}

function renommeCalque(c, apres){

    if (calqueActif === c.id) $("outilsCalque").textContent = "Dessin · " + c.nom;
    if (apres) apres();

/* ============================================================
   Édition des formes existantes
   En mode Sélection : un clic choisit, un glisser déplace, les poignées
   redimensionnent ou déplacent les sommets. Les poignées sont recalculées
   à chaque changement de vue pour garder une taille constante à l'écran.
   ============================================================ */
let formeSel = null;
let geste = null;

function formeParId(id){
  for (const c of mesCalques()){
    const f = c.formes.find(x => x.id === id);
    if (f) return { c: c, f: f };
  }
  return null;
}

function boite(f){
  const xs = f.pts.map(p => p[0]), ys = f.pts.map(p => p[1]);
  return [Math.min.apply(null, xs), Math.min.apply(null, ys),
          Math.max.apply(null, xs), Math.max.apply(null, ys)];
}

/* Le curseur annonce ce que fera la poignée. Sur un rectangle les coins
   sont diagonaux ; sur un polygone chaque sommet se déplace librement. */
function curseurPoignee(f, i){
  if (f.t === "rect" || f.t === "image") return ["nwse-resize", "nesw-resize", "nwse-resize", "nesw-resize"][i];
  return "move";
}

function poignees(f){
  if (f.t === "rect" || f.t === "image"){
    const b = boite(f);
    return [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
  }
  if (f.t === "texte") return [f.pts[0]];
  return f.pts;
}

function dessinePoignees(){
  let g = $("poignees");
  if (!g){
    g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.id = "poignees";
    svg.appendChild(g);
  }
  const cible = formeSel && formeParId(formeSel);
  if (!cible || !ADMIN || outil !== "main" || !calqueActif){ g.innerHTML = ""; return; }
  const f = cible.f;
  const r = svg.getBoundingClientRect();
  const t = Math.max(.15, view.w / (r.width || 1) * 5);   // demi-côté, en mètres
  const b = boite(f);
  const marge = t;
  g.innerHTML =
    '<rect class="cadreSel" x="' + (b[0] - marge) + '" y="' + (b[1] - marge) +
    '" width="' + (b[2] - b[0] + 2 * marge) + '" height="' + (b[3] - b[1] + 2 * marge) + '"/>' +
    poignees(f).map((p, i) =>
      '<rect class="pgn" data-i="' + i + '" style="cursor:' + curseurPoignee(f, i) + '"' +
      ' x="' + (p[0] - t) + '" y="' + (p[1] - t) +
      '" width="' + (2 * t) + '" height="' + (2 * t) + '"/>').join("");
}

function choisitForme(id){
  formeSel = id;
  // on bascule la classe plutôt que de tout retracer : inutile de réanalyser
  // les images à chaque changement de sélection
  $("couches").querySelectorAll(".dcal .forme")
    .forEach(g => g.classList.toggle("pick", g.dataset.f === id));
  dessinePoignees();
  majElement();
}

/* --- panneau de la forme choisie --- */
function majElement(){
  const z = $("elemSel");
  if (!z) return;
  const cible = formeSel && formeParId(formeSel);
  if (!cible || outil !== "main"){ z.hidden = true; return; }
  z.hidden = false;
  const f = cible.f;
  const NOMS = { rect: "Rectangle", poly: "Polygone", ligne: "Ligne",
                 texte: "Texte", image: "Image", repere: "Repère" };
  $("elemType").textContent = NOMS[f.t] || f.t;
  // un repère porte lui aussi un libellé et une taille
  const estTexte = f.t === "texte" || f.t === "repere";
  $("elemTexte").hidden = !estTexte;
  $("elemTailleBloc").hidden = !estTexte;
  if (estTexte){
    $("elemTexte").value = f.txt || "";
    $("elemTaille").value = f.taille || 2;
  }

  /* Une image peut désigner un stand : le logo d'un exposant posé sur son
     emplacement ouvre sa fiche au clic. */
  const estImage = f.t === "image";
  const ch = $("elemStand");
  if (ch){
    ch.hidden = !estImage;
    if (estImage){
      remplitListeStands();
      const s = f.stand && parId.get(f.stand);
      ch.value = s ? etiquetteStand(s) : "";
    }
  }
}

/** « G55 — SMC2 », ou le seul des deux qui existe. */
const etiquetteStand = (s) =>
  [s.code, s.nom].filter(Boolean).join(" — ") || s.id;

/** La liste de choix suit le pavillon courant : un stand d'un autre pavillon
 *  ne pourrait pas porter une image posée ici. */
function remplitListeStands(){
  const l = $("listeStands");
  if (!l) return;
  l.innerHTML = P().stands
    .filter(s => s.code || s.nom)
    .map(s => '<option value="' + esc(etiquetteStand(s)) + '">').join("");
}

/** Retrouve le stand désigné par ce qui a été saisi. */
function standSaisi(txt){
  const v = String(txt || "").trim().toLowerCase();
  if (!v) return null;
  const st = P().stands;
  return st.find(s => etiquetteStand(s).toLowerCase() === v)
      || st.find(s => String(s.code || "").toLowerCase() === v)
      || st.find(s => String(s.nom || "").toLowerCase() === v)
      || null;
}

function appliqueLiaison(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || cible.f.t !== "image") return;
  const ch = $("elemStand");
  const s = standSaisi(ch.value);
  memorise();
  if (s){ cible.f.stand = s.id; ch.value = etiquetteStand(s); }
  else { delete cible.f.stand; ch.value = ""; }
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

function appliqueTexte(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible || (cible.f.t !== "texte" && cible.f.t !== "repere")) return;
  memorise();
  cible.f.txt = $("elemTexte").value;
  cible.f.taille = Math.max(.3, Math.min(30, +$("elemTaille").value || 2));
  enregistreDessins(); dessineDessins(); dessinePoignees();
}

function supprimeForme(){
  const cible = formeSel && formeParId(formeSel);
  if (!cible) return;
  memorise();
  cible.c.formes = cible.c.formes.filter(x => x.id !== formeSel);
  formeSel = null;
  enregistreDessins(); dessineDessins(); dessinePoignees(); majElement();
}

/* --- gestes d'édition ; renvoient true si l'événement est consommé --- */
function editionPointerDown(e){
  if (!ADMIN || outil !== "main") return false;
  const p = versPlan(e.clientX, e.clientY);

  const pgn = e.target.closest(".pgn");
  if (pgn && formeSel){
    const cible = formeParId(formeSel);
    if (cible){
      memorise();
      geste = { type: "poignee", i: +pgn.dataset.i, depart: p,
                pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = curseurPoignee(cible.f, geste.i);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      return true;
    }
  }

  const g = e.target.closest(".dcal .forme");
  if (g){
    const id = g.dataset.f;
    const cible = formeParId(id);
    const sienne = cible && cible.c.id === calqueActif;

    /* Une image liée à un stand ouvre sa fiche, comme pour un visiteur — sauf
       sur le calque qu'on est en train de modifier, où le clic sert à la
       déplacer. Le calque actif est donc l'atelier, les autres la vitrine. */
    if (!sienne && g.dataset.id) return false;

    // cliquer une forme d'un autre calque l'ouvre : c'est le geste qu'on
    // attend, plutôt que de devoir d'abord le désigner dans le panneau
    if (!sienne) activeCalque(cible.c.id);
    if (id !== formeSel) choisitForme(id);
    if (cible){
      memorise();
      geste = { type: "deplace", depart: p, pts: cible.f.pts.map(q => q.slice()), f: cible.f };
      svg.style.cursor = "move";
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    }
    return true;
  }

  if (formeSel){ choisitForme(null); return true; }
  return false;    // rien sous le pointeur : on laisse le déplacement de la vue
}

function editionPointerMove(e){
  if (!geste) return false;
  const p = versPlan(e.clientX, e.clientY);
  const dx = p[0] - geste.depart[0], dy = p[1] - geste.depart[1];
  const f = geste.f;

  if (geste.type === "deplace"){
    f.pts = geste.pts.map(q => [+(q[0] + dx).toFixed(2), +(q[1] + dy).toFixed(2)]);
  } else if (f.t === "rect" || f.t === "image"){
    // la poignée opposée reste fixe ; l'image garde ses proportions
    const b = [Math.min(geste.pts[0][0], geste.pts[1][0]), Math.min(geste.pts[0][1], geste.pts[1][1]),
               Math.max(geste.pts[0][0], geste.pts[1][0]), Math.max(geste.pts[0][1], geste.pts[1][1])];
    const coins = [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
    const fixe = coins[(geste.i + 2) % 4];
    let mx = coins[geste.i][0] + dx, my = coins[geste.i][1] + dy;
    if (f.t === "image" && f.pts.length === 2){
      const ratio = (b[2] - b[0]) / Math.max(.01, b[3] - b[1]);
      const l = Math.abs(mx - fixe[0]);
      my = fixe[1] + Math.sign(my - fixe[1] || 1) * (l / ratio);
    }
    f.pts = [[+Math.min(fixe[0], mx).toFixed(2), +Math.min(fixe[1], my).toFixed(2)],
             [+Math.max(fixe[0], mx).toFixed(2), +Math.max(fixe[1], my).toFixed(2)]];
  } else {
    const q = geste.pts.map(x => x.slice());
    q[geste.i] = [+(q[geste.i][0] + dx).toFixed(2), +(q[geste.i][1] + dy).toFixed(2)];
    f.pts = q;
  }
  dessineDessins(); dessinePoignees();
  return true;
}

function editionPointerUp(e){
  if (!geste) return false;
  geste = null;
  svg.style.cursor = "";
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  enregistreDessins();
  return true;
}

/* ============================================================
   Pile des calques
   Habillage Klipso, zones, stands, textes et calques de dessin vivent dans
   un seul empilement : n'importe lequel peut se glisser entre deux autres.
   L'ordre de la liste est l'ordre de tracé — le premier est derrière.
   ============================================================ */
const clePile = () => "_pile:" + P().id;

function entrees(){
  const e = [];
  P().fond.forEach(f => e.push({ k: "fond:" + f.cle, t: "fond", nom: f.nom, ref: f }));
  e.push({ k: "data:zones",  t: "data", nom: "Zones organisateur", ref: "zones" });
  e.push({ k: "data:stands", t: "data", nom: "Stands",             ref: "stands" });
  e.push({ k: "data:labels", t: "data", nom: "Textes",             ref: "labels" });
  mesCalques().forEach(c => e.push({ k: "dessin:" + c.id, t: "dessin", nom: c.nom, ref: c }));
  return e;
}

/* ordre effectif : celui qui a été choisi, complété par les nouveautés */
function pile(){
  const enregistre = CONF[clePile()];
  const e = entrees();
  const defaut = e.map(x => x.k);
  if (!Array.isArray(enregistre)) return e;
  const rang = x => {
    const i = enregistre.indexOf(x.k);
    return i >= 0 ? i : 10000 + defaut.indexOf(x.k);   // les nouvelles couches à la fin
  };
  return e.slice().sort((a, b) => rang(a) - rang(b));
}

function groupe(k){
  const c = $("couches");
  if (k.indexOf("fond:") === 0)   return c.querySelector('.cal[data-cle="' + CSS.escape(k.slice(5)) + '"]');
  if (k.indexOf("dessin:") === 0) return c.querySelector('.dcal[data-dcal="' + CSS.escape(k.slice(7)) + '"]');
  return $(k.slice(5));
}

/* déplacer les nœuds plutôt que tout reconstruire : réordonner est instantané */
function ordonneDom(){
  const c = $("couches");
  pile().forEach(x => { const g = groupe(x.k); if (g) c.appendChild(g); });
}

function deplaceCouche(k, dir){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k), j = i + dir;
  if (i < 0 || j < 0 || j >= liste.length) return;
  liste[i] = liste[j]; liste[j] = k;
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom();
  construitPanneau();
}

/* ============================================================
   Panneau : une seule liste, tous types confondus
   ============================================================ */
function construitPanneau(){
  const hote = $("pile");
  hote.innerHTML = "";
  const reorg = document.createElement("button");
  reorg.className = "reorg";
  reorg.textContent = "⇅ Réorganiser les calques";
  reorg.onclick = ouvreOrdre;
  hote.appendChild(reorg);
  const liste = pile().slice().reverse();   // premier plan en tête

  liste.forEach((x, i) => {
    const d = document.createElement("div");
    d.className = "calq" + (x.t === "dessin" ? " perso" : "") +
                  (x.t === "dessin" && x.ref.id === calqueActif ? " actif" : "");
    if (x.t === "dessin") d.dataset.dcal = x.ref.id;

    const c = x.t === "dessin" ? x.ref : conf(x.t === "fond" ? x.k.slice(5) : x.k);
    const coche = c.visible === false ? "" : " checked";
    d.innerHTML = '<label><input type="checkbox"' + coche + '><span></span></label>' +
      '<span class="opts">' +
      (x.t === "data" ? "" : '<button class="fillbtn" title="Contour seul ou surface remplie"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.2"/></svg></button>') +
      '<input type="color" class="cc">' +
      (x.t === "dessin" ? '<button class="ren" title="Dessiner sur ce calque">&#9998;</button>' +
                          '<button class="sup" title="Supprimer le calque">&times;</button>' : "") +
      '</span>';

    const nom = d.querySelector("label span");
    nom.textContent = x.nom;

    /* visibilité */
    d.querySelector('input[type="checkbox"]').onchange = ev => {
      const on = ev.target.checked;
      if (x.t === "dessin"){ x.ref.visible = on; enregistreDessins(); dessineDessins(); }
      else { c.visible = on; enregistreConf();
             x.t === "fond" ? styleFond(x.k.slice(5)) : styleDataGroupe(x.k.slice(5), on); }
    };

    /* couleur */
    const cc = d.querySelector(".cc");
    cc.value = (x.t === "dessin" ? x.ref.couleur : c.couleur) || defautCouleur(x);
    cc.oninput = ev => {
      if (x.t === "dessin"){ x.ref.couleur = ev.target.value; enregistreDessins(); dessineDessins(); }
      else { c.couleur = ev.target.value; enregistreConf();
             x.t === "fond" ? styleFond(x.k.slice(5)) : appliqueCouleursData(); }
    };

    /* trait ou aplat */
    const fb = d.querySelector(".fillbtn");
    if (fb){
      fb.setAttribute("aria-pressed", !!c.rempli);
      fb.onclick = () => {
        c.rempli = !c.rempli;
        fb.setAttribute("aria-pressed", !!c.rempli);
        if (x.t === "dessin"){ enregistreDessins(); dessineDessins(); }
        else { enregistreConf(); styleFond(x.k.slice(5)); }
      };
    }

    /* propre aux calques de dessin */
    if (x.t === "dessin"){
      nom.title = "Cliquez pour dessiner dessus";
      // Le crayon ouvre les outils de dessin sur ce calque. Le renommage vit
      // dans la fenêtre de réorganisation, où l'on voit tous les calques.
      const cr = d.querySelector(".ren");
      cr.setAttribute("aria-pressed", x.ref.id === calqueActif);
      cr.onclick = ev => { ev.stopPropagation(); activeCalque(x.ref.id); };
      d.querySelector("label").onclick = ev => {
        if (ev.target.tagName !== "INPUT"){ ev.preventDefault(); activeCalque(x.ref.id); }
      };
      d.querySelector(".sup").onclick = () => {
        const n = x.ref.formes.length;
        confirme("Supprimer le calque ?",
          "« " + x.ref.nom + " » et " +
          (n ? "ses " + n + " forme" + (n > 1 ? "s" : "") : "son contenu") +
          " seront définitivement perdus.",
          "Supprimer", () => {
            memorise();
            DESSINS[P().id] = mesCalques().filter(y => y.id !== x.ref.id);
            if (calqueActif === x.ref.id) activeCalque(null);
            enregistreDessins(); dessineDessins(); construitPanneau();
          });
      };
    }

    hote.appendChild(d);

    /* sous-calques de l'habillage : couleur et visibilité, pas d'ordre */
    if (x.t === "fond"){
      const sous = sousCalques(x.k.slice(5));
      if (sous.length > 1) sous.forEach(sc =>
        rangSous(hote, sousCle(x.k.slice(5), sc.id), joli(sc.id),
                 () => rgbHex(sc.src) || jeton("--plan-line"), () => styleFond(x.k.slice(5))));
    }
    /* les deux couleurs de texte se règlent sous la couche Textes */
    if (x.k === "data:labels"){
      rangSous(hote, "labStand", "Textes des stands", () => jeton("--ink"), () => styleData("labStand"));
      rangSous(hote, "labZone", "Textes des zones", () => jeton("--zone"), () => styleData("labZone"));
    }
  });

  const plus = document.createElement("button");
  plus.className = "ajout";
  plus.textContent = "+ Nouveau calque de dessin";
  plus.onclick = creeCalque;
  hote.appendChild(plus);

  /* Réglages généraux — ils ne portent sur aucun calque, d'où le trait qui les
     sépare de la pile. Comme le reste de CONF, ils partent aux visiteurs à la
     publication : c'est bien l'exploitant qui décide de ce qu'ils voient. */
  const reg = document.createElement("div");
  reg.className = "reglages";
  reg.innerHTML = '<span class="eyebrow">Affichage</span>' +
    '<label><input type="checkbox"><span></span></label>';
  reg.querySelector("label span").textContent = "Afficher les icônes de zoom";
  const cz = reg.querySelector('input[type="checkbox"]');
  cz.checked = conf("_zoom").visible !== false;
  cz.onchange = e => {
    conf("_zoom").visible = e.target.checked;
    enregistreConf(); appliqueZoom();
  };
  hote.appendChild(reg);
}

/* ligne secondaire : visibilité et couleur seulement */
function rangSous(hote, cle, libelle, defaut, applique){
  const c = conf(cle);
  const d = document.createElement("div");
  d.className = "calq sous";
  d.innerHTML = '<label><input type="checkbox"' + (c.visible === false ? "" : " checked") +
    '><span></span></label><span class="opts">' +
    '<button class="fillbtn" title="Contour seul ou surface remplie"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1.2"/></svg></button>' +
    '<input type="color" class="cc"></span>';
  d.querySelector("label span").textContent = libelle;
  d.querySelector('input[type="checkbox"]').onchange = e => {
    c.visible = e.target.checked; enregistreConf(); applique();
  };
  const cc = d.querySelector(".cc");
  cc.value = c.couleur || defaut();
  cc.oninput = e => { c.couleur = e.target.value; enregistreConf(); applique(); };
  const fb = d.querySelector(".fillbtn");
  fb.setAttribute("aria-pressed", !!c.rempli);
  fb.onclick = () => { c.rempli = !c.rempli; fb.setAttribute("aria-pressed", !!c.rempli);
                       enregistreConf(); applique(); };
  hote.appendChild(d);
}

function defautCouleur(x){
  if (x.t === "dessin") return "#2F49D1";
  if (x.t === "fond") return jeton("--plan-line");
  return jeton(x.k === "data:zones" ? "--zone" : x.k === "data:stands" ? "--stand" : "--ink");
}

/* ============================================================
   Pousser la configuration
   Les couleurs, la visibilité, l'ordre des calques et les dessins vivaient
   dans le navigateur de celui qui les réglait. Un visiteur ne voyait donc
   rien, et l'exploitant retrouvait un plan nu depuis un autre poste ou depuis
   son téléphone.

   Un bouton les envoie en base, d'où le service les rend à tout le monde.
   Explicite plutôt qu'automatique : régler une couleur au sélecteur produit
   une rafale d'événements, et l'exploitant doit pouvoir essayer sans publier.
   ============================================================ */

/** Session et projet, tels que la console les a laissés sur le poste. */
function accesBase(){
  try {
    const cfg = JSON.parse(localStorage.getItem("console-config") || "null") || window.PLAN_CONFIG;
    const ses = JSON.parse(localStorage.getItem("console-session") || "null");
    if (cfg?.url && cfg?.anonKey && ses?.access_token) return { cfg, ses };
  } catch (e) {}
  return null;
}

async function base(acces, chemin, options = {}){
  const r = await fetch(acces.cfg.url + "/rest/v1/" + chemin, {
    ...options,
    headers: {
      "apikey": acces.cfg.anonKey,
      "Authorization": "Bearer " + acces.ses.access_token,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  const txt = await r.text();
  if (!r.ok) throw new Error("HTTP " + r.status + " · " + txt.slice(0, 160));
  return txt ? JSON.parse(txt) : null;
}

/** Les réglages d'apparence, sans les ordres de pile qui sont par pavillon. */
function reglagesSeuls(){
  const out = {};
  Object.keys(CONF).forEach(k => { if (k.indexOf("_pile:") !== 0) out[k] = CONF[k]; });
  return out;
}

async function pousseConfiguration(bouton){
  const acces = accesBase();
  if (!acces){
    annonce("Session absente : reconnectez-vous pour publier.", true);
    return;
  }
  const dit = (t) => { if (bouton) bouton.textContent = t; };
  dit("Publication…");

  try {
    /* Le plan connaît les pavillons par leur identifiant Klipso ; la base par
       le sien. Une seule requête suffit à faire le lien. */
    const evt = await base(acces,
      "evenement?select=id&slug=eq." + encodeURIComponent(DATA.slug));
    if (!evt.length) throw new Error("Événement introuvable.");
    const plans = await base(acces,
      "plan?select=id,id_klipso&evenement_id=eq." + evt[0].id);
    const parKlipso = Object.fromEntries(plans.map(p => [p.id_klipso, p.id]));

    const reglages = reglagesSeuls();
    let calques = 0;

    for (const p of DATA.plans){
      const planId = parKlipso[p.id];
      if (!planId) continue;

      await base(acces, "apparence?on_conflict=plan_id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([{
          plan_id: planId,
          pile: CONF["_pile:" + p.id] || [],
          reglages: reglages,
          modifie_le: new Date().toISOString(),
        }]),
      });

      const liste = DESSINS[p.id] || [];
      if (liste.length){
        await base(acces, "calque_dessin?on_conflict=plan_id,cle", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(liste.map((c, i) => ({
            plan_id: planId, cle: c.id, nom: c.nom || "Calque",
            couleur: c.couleur || "#2F49D1", rempli: !!c.rempli,
            visible: c.visible !== false, rang: i,
            formes: c.formes || [], modifie_le: new Date().toISOString(),
          }))),
        });
        calques += liste.length;
      }

      /* Ce qui a disparu de la page disparaît de la base. On retire après
         avoir écrit, jamais avant : un échec en cours de route laisse alors
         l'ancienne version en place plutôt qu'un plan vide. */
      const gardes = liste.map(c => '"' + String(c.id).replace(/"/g, "") + '"').join(",");
      await base(acces,
        "calque_dessin?plan_id=eq." + planId +
        (gardes ? "&cle=not.in.(" + encodeURIComponent(gardes) + ")" : ""),
        { method: "DELETE", headers: { "Prefer": "return=minimal" } });
    }

    dit("Configuration publiée");
    annonce("Configuration publiée : " + DATA.plans.length +
      (DATA.plans.length > 1 ? " pavillons" : " pavillon") +
      (calques ? ", " + calques + " calque" + (calques > 1 ? "s" : "") + " de dessin" : "") + ".");
  } catch (e) {
    dit("Publication impossible");
    annonce("Publication impossible : " + e.message, true);
  }
  setTimeout(() => dit("Pousser la configuration"), 2600);
}

/* ============================================================
   Fenêtres modales : confirmation et réorganisation des calques
   ============================================================ */
function ouvreModale(titre, remplitCorps, boutons){
  $("mTitre").textContent = titre;
  $("mCorps").innerHTML = "";
  remplitCorps($("mCorps"));
  $("mPied").innerHTML = "";
  boutons.forEach(b => {
    const el = document.createElement("button");
    el.className = "btn" + (b.genre ? " " + b.genre : "");
    el.textContent = b.libelle;
    el.onclick = () => { if (b.action) b.action(); if (b.ferme !== false) fermeModale(); };
    $("mPied").appendChild(el);
  });
  $("modale").classList.add("open");
}
function fermeModale(){ $("modale").classList.remove("open"); }
$("mFermer").onclick = fermeModale;
$("modale").addEventListener("click", e => { if (e.target === $("modale")) fermeModale(); });
addEventListener("keydown", e => {
  if (e.key === "Escape" && $("modale").classList.contains("open")) fermeModale();
});

function confirme(titre, message, libelleOui, action){
  ouvreModale(titre, corps => {
    const p = document.createElement("p");
    p.textContent = message;
    corps.appendChild(p);
  }, [
    { libelle: "Annuler" },
    { libelle: libelleOui, genre: "danger", action: action },
  ]);
}

/* ------------------------------------------------------------
   Réorganisation : le premier rang de la liste est le calque le
   plus en avant, comme dans n'importe quel gestionnaire de calques.
   ------------------------------------------------------------ */
const GENRE = { fond: "plan", data: "données", dessin: "dessin" };
let tireK = null;

function deplaceVers(k, cible, apres){
  const liste = pile().map(x => x.k);
  const i = liste.indexOf(k);
  if (i < 0) return;
  liste.splice(i, 1);
  let j = liste.indexOf(cible);
  if (j < 0) j = liste.length - 1;
  liste.splice(apres ? j + 1 : j, 0, k);
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom(); construitPanneau(); remplitOrdre();
}
function versExtremite(k, devant){
  const liste = pile().map(x => x.k).filter(x => x !== k);
  devant ? liste.push(k) : liste.unshift(k);   // fin de tableau = premier plan
  CONF[clePile()] = liste;
  enregistreConf();
  ordonneDom(); construitPanneau(); remplitOrdre();
}

function remplitOrdre(hote){
  const ul = hote || $("mCorps").querySelector(".ordre");
  if (!ul) return;
  ul.innerHTML = "";
  // affichage du premier plan vers l'arrière-plan
  pile().slice().reverse().forEach(x => {
    const li = document.createElement("li");
    li.draggable = true;
    li.dataset.k = x.k;
    li.innerHTML = '<span class="poignee" aria-hidden="true">&#8942;&#8942;</span>' +
      '<span class="nom"></span>' +
      '<span class="bouts">' +
      // seul un calque de dessin nous appartient : les autres portent le nom
      // que Klipso leur donne, et le renommer ici mentirait sur leur origine
      (x.t === "dessin"
        ? '<button class="crayon" data-ren="1" title="Renommer">&#9998;</button>' : "") +
      '<button data-h="1" title="Mettre au premier plan">&#8607;</button>' +
      '<button data-h="0" title="Mettre à l’arrière-plan">&#8609;</button></span>';
    const nom = li.querySelector(".nom");
    nom.textContent = x.nom;
    const g = document.createElement("span");
    g.className = "genre"; g.textContent = GENRE[x.t];
    nom.appendChild(g);

    li.querySelectorAll(".bouts button[data-h]").forEach(b =>
      b.onclick = ev => { ev.stopPropagation(); versExtremite(x.k, b.dataset.h === "1"); });
    const cr = li.querySelector("[data-ren]");
    if (cr){
      cr.onclick = ev => {
        ev.stopPropagation();
        // la fenêtre de renommage remplace celle-ci, puis on revient
        renommeCalque(x.ref, () => ouvreOrdre());
      };
    }

    li.ondragstart = ev => { tireK = x.k; li.classList.add("drag");
                             ev.dataTransfer.effectAllowed = "move";
                             try { ev.dataTransfer.setData("text/plain", x.k); } catch (e) {} };
    li.ondragend = () => { tireK = null; li.classList.remove("drag");
                           ul.querySelectorAll("li").forEach(n => n.classList.remove("avant", "apres")); };
    li.ondragover = ev => {
      if (!tireK || tireK === x.k) return;
      ev.preventDefault();
      const r = li.getBoundingClientRect();
      const bas = ev.clientY > r.top + r.height / 2;
      li.classList.toggle("apres", bas);
      li.classList.toggle("avant", !bas);
    };
    li.ondragleave = () => li.classList.remove("avant", "apres");
    li.ondrop = ev => {
      if (!tireK || tireK === x.k) return;
      ev.preventDefault();
      const r = li.getBoundingClientRect();
      const bas = ev.clientY > r.top + r.height / 2;
      // la liste est inversée : « en dessous » à l'écran = plus en arrière
      deplaceVers(tireK, x.k, !bas);
      tireK = null;
    };
    ul.appendChild(li);
  });
}

function ouvreOrdre(){
  ouvreModale("Ordre des calques", corps => {
    const p = document.createElement("p");
    p.textContent = "Glissez pour réordonner. Le premier de la liste est au premier plan.";
    const ul = document.createElement("ul");
    ul.className = "ordre";
    corps.appendChild(p); corps.appendChild(ul);
    remplitOrdre(ul);
  }, [{ libelle: "Terminé" }]);
}
/* ============================================================
   12. Démarrage
   ============================================================ */
/* ------------------------------------------------------------------
   Démarrage : données figées si elles sont dans la page, sinon appel
   à l'API. Une panne du réseau doit se voir, pas laisser un écran vide.
   ------------------------------------------------------------------ */
function demarre(d){
  indexe(d);
  montePlan();
  fit();
  liste();
  // le plan est manipulable : le fond peut arriver derrière
  chargeFond(state.plan);
  const v = decodeURIComponent((location.hash || "").slice(1)).toLowerCase();
  if (v && v !== "admin"){
    const cible = TOUS.find(o => String(o.code || "").toLowerCase() === v);
    if (cible) setTimeout(() => select(cible.id, true), 80);
  }
}

function annonce(txt, erreur){
  const l = $("list");
  l.innerHTML = '<div class="empty"></div>';
  l.querySelector(".empty").textContent = txt;
  if (erreur) l.querySelector(".empty").style.color = "var(--rouge, #C2372B)";
  $("countTxt").textContent = erreur ? "Indisponible" : "Chargement…";
}

/**
 * Charge le plan. Les en-têtes sont lus à l'appel, pas au démarrage : en
 * administration la session n'existe qu'une fois l'identité vérifiée, et
 * c'est elle qui donne accès aux événements encore en brouillon.
 */
/**
 * En-têtes de l'appel. En administration on présente sa session : c'est elle
 * qui donne accès aux événements encore en brouillon. Ils sont lus à chaque
 * appel, pas au démarrage : la session n'existe qu'une fois l'identité vérifiée.
 */
function entetesApi(){
  const e = {};
  if (document.documentElement.dataset.role !== "admin") return e;
  try {
    const cfg = JSON.parse(localStorage.getItem("console-config") || "null")
                || window.PLAN_CONFIG || null;
    const ses = JSON.parse(localStorage.getItem("console-session") || "null");
    if (cfg?.anonKey && ses?.access_token){
      e["apikey"] = cfg.anonKey;
      e["Authorization"] = "Bearer " + ses.access_token;
    }
  } catch (err) {}
  return e;
}

/**
 * Le fond d'un pavillon : cinquante fois le poids des stands, et purement
 * décoratif. On le charge après coup, une seule fois par pavillon, et on
 * l'injecte s'il concerne encore celui qu'on regarde. Son adresse porte
 * l'horodatage de la dernière synchronisation : le navigateur le garde
 * indéfiniment et ne le redemande qu'après une mise à jour du plan.
 */
const _fonds = new Map();
function chargeFond(i){
  const p = DATA?.plans?.[i];
  if (!p || !API) return Promise.resolve();
  if (p.fond.length === 0 || p.fond.every(c => c.svg !== undefined)) return Promise.resolve();
  if (_fonds.has(p.id)) return _fonds.get(p.id);

  const q = API + "?slug=" + encodeURIComponent(SLUG) +
            "&fond=" + encodeURIComponent(p.id) +
            "&v=" + encodeURIComponent(DATA.genereLe || "0");
  const promesse = fetch(q, { headers: entetesApi() })
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(d => {
      const par = new Map((d.calques || []).map(c => [c.cle, c.svg]));
      p.fond.forEach(c => { c.svg = par.get(c.cle) || ""; });
      // le pavillon a pu changer pendant le chargement
      if (state.plan === i){ monteHabillage(); ordonneDom(); appliqueApparence(); }
    })
    .catch(e => {
      _fonds.delete(p.id);          // une panne réseau ne doit pas être définitive
      console.warn("Fond de plan indisponible :", e.message);
    });
  _fonds.set(p.id, promesse);
  return promesse;
}

function charge(){
  annonce("Chargement du plan…");
  const entetes = entetesApi();
  // La demande a pu partir dès l'en-tête de la page, avant même que le reste
  // soit lu : on la récupère plutôt que d'en lancer une seconde. En
  // administration elle n'existe pas — il faut y présenter sa session.
  const depart = (!entetes.Authorization && window.__plan) || fetch(
    API + "?slug=" + encodeURIComponent(SLUG),
    // un brouillon ne doit pas rester dans le cache du navigateur
    { headers: entetes, cache: entetes.Authorization ? "no-store" : "default" });
  window.__plan = null;
  return depart
    .then(r => {
      // session périmée : on repasse par l'écran de connexion plutôt que
      // d'afficher une erreur dans laquelle l'exploitant ne peut rien faire
      if (r.status === 401 && typeof ecranAcces === "function"){
        try { localStorage.removeItem("console-session"); } catch (e) {}
        ecranAcces("Session expirée, reconnectez-vous.");
        return Promise.reject(new Error("Session expirée."));
      }
      return r.ok ? r.json()
                  : r.json().then(j => Promise.reject(new Error(j.erreur || ("HTTP " + r.status))));
    })
    .then(d => {
      if (!d.plans?.length) throw new Error("Aucun pavillon : lancez une synchronisation depuis la console.");
      demarre(d);
    })
    .catch(e => annonce("Plan indisponible : " + e.message, true));
}

const fige = document.getElementById("data").textContent.trim();
if (fige && fige.indexOf("__DATA__") < 0) demarre(JSON.parse(fige));
else if (!API) annonce("Aucune source de données configurée.", true);
// en administration, on attend la session : sans elle les brouillons sont invisibles
else if (document.documentElement.dataset.role === "admin") annonce("Vérification de l'identité…");
else charge();

// les mesures de texte dépendent des polices : on retrace une fois chargées
// les polices peuvent arriver avant les données : on ne retrace que si
// quelque chose est déjà affiché
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { if (DATA && view){ _lg.clear(); libelles(); } });

addEventListener("resize", () => { if (DATA && view) fit(); });



/* ============================================================
   Accès à l'administration du plan
   Cette page n'existe que pour l'exploitant. On réutilise la session ouverte
   dans la console : même projet, même compte, mêmes clés locales.
   ============================================================ */
const CLE_CFG_A = "console-config";
const CLE_SESSION_A = "console-session";

function litLocal(cle){
  try { return JSON.parse(localStorage.getItem(cle) || "null"); } catch (e) { return null; }
}

/** Réglage du poste s'il existe, configuration livrée sinon. */
function configuration(){
  return litLocal(CLE_CFG_A) || window.PLAN_CONFIG || null;
}

function normaliseUrlA(saisie){
  let u = String(saisie || "").trim();
  while (u.length && u[u.length - 1] === "/") u = u.slice(0, -1);
  if (!u) return "";
  const marque = "supabase.com/dashboard/project/";
  const i = u.toLowerCase().indexOf(marque);
  if (i >= 0){
    const ref = u.slice(i + marque.length).split("/")[0].split("?")[0];
    if (ref) return "https://" + ref + ".supabase.co";
  }
  if (u.indexOf(".") < 0 && u.indexOf(":") < 0) return "https://" + u + ".supabase.co";
  if (u.slice(0, 4).toLowerCase() !== "http") u = "https://" + u;
  return u;
}

/** Le jeton est-il encore valable ? On le vérifie auprès du serveur. */
async function sessionValide(cfg, session){
  if (!cfg?.url || !cfg?.anonKey || !session?.access_token) return false;
  try {
    const r = await fetch(cfg.url + "/auth/v1/user", {
      headers: { "apikey": cfg.anonKey, "Authorization": "Bearer " + session.access_token },
    });
    return r.ok;
  } catch (e) { return false; }
}

function ecranAcces(message){
  const cfg = configuration() || {};
  const voile = document.createElement("div");
  voile.className = "modale open";
  voile.id = "acces";
  voile.innerHTML =
    '<div class="mfen" role="dialog" aria-modal="true">' +
    '<header><h2>Administration du plan</h2></header>' +
    '<div class="mcorps">' +
    '<p class="astuce" id="accesMsg"></p>' +
    '<label><span>Adresse du projet</span><input id="aUrl" placeholder="https://xxxx.supabase.co"></label>' +
    '<label><span>Clé publique (anon)</span><input id="aCle" placeholder="eyJhbGciOi…"></label>' +
    '<label><span>Adresse e-mail</span><input id="aMail" type="email" autocomplete="username"></label>' +
    '<label><span>Mot de passe</span><input id="aMdp" type="password" autocomplete="current-password"></label>' +
    '</div>' +
    '<footer><a class="btn" id="aPublic">Voir le plan public</a>' +
    '<button class="btn primaire" id="aOk">Se connecter</button></footer></div>';
  document.body.appendChild(voile);

  $("aUrl").value = cfg.url || "";
  $("aCle").value = cfg.anonKey || "";
  // la configuration est livrée avec les pages : on ne la redemande pas
  if (cfg.url && cfg.anonKey){
    $("aUrl").closest("label").hidden = true;
    $("aCle").closest("label").hidden = true;
  }
  $("accesMsg").textContent = message || "Cette page est réservée à l'exploitant.";
  $("aPublic").href = "plan" + location.search;
  setTimeout(() => ($("aUrl").value ? $("aMail") : $("aUrl")).focus(), 40);

  const tente = async () => {
    const url = normaliseUrlA($("aUrl").value);
    const anonKey = $("aCle").value.trim();
    $("aUrl").value = url;
    if (!url || !anonKey){ $("accesMsg").textContent = "Adresse et clé publique sont nécessaires."; return; }
    $("accesMsg").textContent = "Connexion…";
    try {
      const r = await fetch(url + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("aMail").value.trim(), password: $("aMdp").value }),
      });
      // Une réponse vide ne doit pas ressortir en « Unexpected end of JSON
      // input » : on lit le texte, puis on tente de l'interpréter.
      const txt = await r.text();
      let j = {};
      try { j = txt ? JSON.parse(txt) : {}; } catch (e) { j = { msg: txt.slice(0, 120) }; }
      if (!r.ok) {
        throw new Error((j.error_description || j.msg || "Identifiants refusés.") +
          " (HTTP " + r.status + ")");
      }
      if (!j.access_token) {
        throw new Error("Réponse inattendue de " + url + " — HTTP " + r.status +
          (txt ? "" : ", corps vide") + ". Vérifiez l'adresse du projet.");
      }
      localStorage.setItem(CLE_CFG_A, JSON.stringify({ url, anonKey }));
      localStorage.setItem(CLE_SESSION_A, JSON.stringify(j));
      voile.remove();
      activeAdmin();
      charge();
    } catch (e) {
      $("accesMsg").textContent = e.message;
    }
  };
  $("aOk").onclick = tente;
  $("aMdp").onkeydown = (e) => { if (e.key === "Enter"){ e.preventDefault(); tente(); } };
}

(async () => {
  const cfg = configuration();
  const session = litLocal(CLE_SESSION_A);
  if (await sessionValide(cfg, session)){ activeAdmin(); charge(); }
  else ecranAcces(session ? "Session expirée, reconnectez-vous." : null);
})();
