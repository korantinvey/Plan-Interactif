<title>Console des plans de salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="config.js"></script>

<style>
:root{
  --ground:#E9EAE4; --surface:#FBFBF8; --surface-2:#F1F2EC; --surface-3:#E4E6DE;
  --line:#D2D5CB; --line-strong:#B4B9AC;
  --ink:#15181A; --ink-2:#4A4F52; --ink-3:#7C8285;
  --accent:#2F49D1; --accent-soft:#DCE1FA;
  --vert:#17876B; --vert-soft:#D8EDE6;
  --ambre:#C98A06; --ambre-soft:#F7EAC6;
  --rouge:#C2372B; --rouge-soft:#F6DDDA;
  --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px -12px rgba(20,24,26,.18);
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --surface-3:#272D31;
    --line:#2A3034; --line-strong:#3B4348;
    --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
    --accent:#7A8CFF; --accent-soft:#232C55;
    --vert:#3FBF9B; --vert-soft:#12332B;
    --ambre:#F0B429; --ambre-soft:#3A2F12;
    --rouge:#FF8B7E; --rouge-soft:#3B1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --surface-3:#272D31;
  --line:#2A3034; --line-strong:#3B4348;
  --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
  --accent:#7A8CFF; --accent-soft:#232C55;
  --vert:#3FBF9B; --vert-soft:#12332B;
  --ambre:#F0B429; --ambre-soft:#3A2F12;
  --rouge:#FF8B7E; --rouge-soft:#3B1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;
  height:100vh;min-height:600px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 18px;height:58px;
  background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.topbar h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;
  letter-spacing:-.02em;white-space:nowrap}
.topbar .sous{font-size:12px;color:var(--ink-3);white-space:nowrap}
.statut{margin-left:auto;font-size:12.5px;color:var(--ink-3);max-width:46%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statut.err{color:var(--rouge)}
.statut.ok{color:var(--vert)}
.topbar .droite{margin-left:12px;display:flex;gap:7px;align-items:center}

.btn{padding:8px 14px;border-radius:var(--radius);font-size:13.5px;font-weight:500;
  border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primaire{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primaire:hover{filter:brightness(1.08)}
.btn.danger{color:var(--rouge);border-color:var(--line)}
.btn.danger:hover{background:var(--rouge-soft);border-color:var(--rouge)}
.btn.petit{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
a.btn.inactif{opacity:.45;pointer-events:none}
.lien{font-size:12.5px;color:var(--ink-3);text-decoration:underline}
.lien:hover{color:var(--ink)}

/* ---------- colonne des événements ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.rail header{padding:13px 16px 11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.railActs{display:flex;align-items:center;gap:6px}
.icone{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-2);background:var(--surface)}
.icone:hover{border-color:var(--line-strong);color:var(--ink)}
.icone svg{width:14px;height:14px}
.icone[disabled]{opacity:.5;cursor:default}
@keyframes tourne{to{transform:rotate(360deg)}}
.icone.occupe svg{animation:tourne .9s linear infinite}
@media (prefers-reduced-motion:reduce){.icone.occupe svg{animation:none}}
.rail .liste{overflow-y:auto;flex:1;min-height:0}
.evt{display:block;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line)}
.evt:hover{background:var(--surface-2)}
.evt[aria-current="true"]{background:var(--accent-soft)}
.evt .nom{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.evt .meta{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.vide{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.6}

.etat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:2px 7px;border-radius:999px;letter-spacing:.02em;
  background:var(--surface-3);color:var(--ink-2)}
.etat.publie{background:var(--vert-soft);color:var(--vert)}
.etat.brouillon{background:var(--ambre-soft);color:var(--ambre)}
.etat::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}

/* ---------- panneau de droite ---------- */
.fiche{overflow-y:auto;padding:22px 26px 60px}
.fiche .entete{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.fiche h2{font-family:"Archivo",sans-serif;font-size:21px;letter-spacing:-.02em;margin:2px 0 5px}
.fiche .entete .droite{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}

.bloc{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:16px 18px;margin-bottom:14px}
.bloc > .eyebrow{display:block;margin-bottom:12px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.source-inerte{opacity:.62}
.reglage-ligne{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-top:1px solid var(--line)}
.reglage-ligne:first-of-type{border-top:none;padding-top:2px}
.reglage-ligne .rt{font-size:13px;color:var(--ink);flex:0 0 auto}
.reglage-ligne .rv{flex:1;min-width:0;font-size:12px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){
  .reglage-ligne{flex-wrap:wrap}
  .reglage-ligne .rv{flex:1 0 100%;order:3;white-space:normal}
}
.mcorps > p.aide{margin:14px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.onglets{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.onglets button{padding:7px 12px;background:none;border:none;border-bottom:2px solid transparent;
  margin-bottom:-1px;font-size:12.5px;color:var(--ink-3);cursor:pointer}
.onglets button:hover{color:var(--ink)}
.onglets button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.colonne-cases{display:flex;flex-direction:column;gap:9px;min-width:0}
.colonne-cases > .eyebrow{margin-bottom:2px}
label.case{display:grid;grid-template-columns:auto 1fr;align-items:center;
  gap:4px 8px;color:var(--ink);cursor:pointer}
label.case input{width:15px;height:15px;padding:0;accent-color:var(--accent);cursor:pointer}
label.case .aide{grid-column:2}
.bloc > p.aide{margin:12px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
label input,label select,label textarea{padding:8px 10px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);width:100%}
label input:focus,label select:focus,label textarea:focus{border-color:var(--accent);
  background:var(--surface);outline:none}
label .aide{font-size:11px;color:var(--ink-3);line-height:1.45}
label.large{grid-column:1/-1}
textarea{resize:vertical;min-height:72px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding:0 10px 7px;font-family:"Archivo",sans-serif}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
tr.eteint td{opacity:.45}
.coche{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

.astuce{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0}
.astuce code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--surface-2);padding:1px 5px;border-radius:3px}
.etat-ligne{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);
  margin-top:10px;flex-wrap:wrap}
.etat-ligne .err{color:var(--rouge)}
.etat-ligne .ok{color:var(--vert)}

.integration{display:flex;gap:8px;align-items:flex-start}
.integration textarea{flex:1;min-height:60px}

/* ---------- fenêtres ---------- */
.modale{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:none;
  place-items:center;padding:20px}
.modale.open{display:grid}
.mfen{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.6);width:min(440px,100%);max-height:84vh;
  display:flex;flex-direction:column;overflow:hidden}
.mfen header{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.mfen h3{font-family:"Archivo",sans-serif;font-size:16px;margin:0;letter-spacing:-.01em}
.mfen header button{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 5px}
.mcorps{padding:15px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.mcorps p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mfen footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;
  border-top:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .rail{border-right:none;border-bottom:1px solid var(--line);max-height:190px}
  .fiche{padding:16px}
  .topbar .sous{display:none}
}
</style>

<div class="app">
  <header class="topbar">
    <h1>Console des plans</h1>
    <span class="sous" id="sousTitre"></span>
    <span class="statut" id="statut" role="status" aria-live="polite"></span>
    <div class="droite">
      <button class="btn petit" id="btnImport">Importer</button>
      <button class="btn petit" id="btnExport">Exporter</button>
      <button class="btn petit" id="btnTheme" aria-label="Thème">◐</button>
    </div>
  </header>

  <aside class="rail">
    <header>
      <span class="eyebrow">Événements</span>
      <span class="railActs">
        <button class="icone" id="btnRecharger" title="Recharger depuis le serveur" aria-label="Recharger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="btn petit primaire" id="btnNouveau">Nouveau</button>
      </span>
    </header>
    <div class="liste" id="listeEvts"></div>
  </aside>

  <main class="fiche" id="fiche"></main>
</div>

<div class="modale" id="modale">
  <div class="mfen" role="dialog" aria-modal="true">
    <header><h3 id="mTitre"></h3><button id="mFermer" aria-label="Fermer">&times;</button></header>
    <div class="mcorps" id="mCorps"></div>
    <footer id="mPied"></footer>
  </div>
</div>
