<title>Console des plans de salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script src="config.js"></script>

<link rel="stylesheet" href="console.css">

<div class="app">
  <header class="topbar">
    <h1>Console des plans</h1>
    <!-- Le salon se choisit ici, comme sur la page de rapport. La liste ne
         porte que les salons auxquels le compte a droit : c'est la base qui la
         borne — `acces_salon()` — et non cette page, qui ne fait qu'afficher
         ce qu'elle reçoit. -->
    <select id="choixEvt" aria-label="Salon"></select>
    <span class="etat" id="etatEvt" hidden></span>
    <button class="icone" id="btnRecharger" title="Recharger depuis le serveur" aria-label="Recharger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <!-- Créer un salon est le fait de l'administrateur : le bouton part caché
         et ne paraît qu'une fois le profil lu. -->
    <button class="btn petit primaire" id="btnNouveau" hidden>Nouveau</button>
    <span class="statut" id="statut" role="status" aria-live="polite"></span>
    <!-- Tout ce qui commande vit dans cette barre, salon et console mêlés :
         une seconde rangée de boutons en tête de fiche faisait deux endroits
         où chercher, et deux lignes là où une suffit. Les deux sorties vers le
         plan restent à découvert — ce sont elles qu'on vient chercher — et le
         reste se déplie. -->
    <div class="droite">
      <a class="btn petit" id="lienPublic" target="_blank" rel="noopener" hidden>Plan public<span class="ext" aria-hidden="true">↗</span></a>
      <a class="btn petit" id="lienAdmin" target="_blank" rel="noopener" hidden>Administration<span class="ext" aria-hidden="true">↗</span></a>
      <details class="menu">
        <summary class="btn petit">Actions</summary>
        <div class="menu-pan">
          <a class="mitem" id="lienRapport" data-portee="salon">Rapport d'utilisation</a>
          <button class="mitem" id="btnSources" data-portee="salon">Sources de données</button>
          <button class="mitem" id="btnEtat" data-portee="salon"></button>
          <button class="mitem" id="btnDupliquer" data-portee="salon">Dupliquer l'événement</button>
          <button class="mitem danger" id="btnSupprimer" data-portee="salon">Supprimer l'événement</button>
          <hr id="sepActions">
          <button class="mitem" id="btnComptes" hidden>Comptes et accès</button>
          <button class="mitem" id="btnProjet">Adresse du projet…</button>
          <button class="mitem" id="btnExport">Copier les données (JSON)</button>
        </div>
      </details>
      <button class="icone" id="btnTheme" title="Thème clair ou sombre" aria-label="Thème">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="fiche" id="fiche"></main>
</div>
