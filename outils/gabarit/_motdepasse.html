<title>Mot de passe — Plan interactif</title>
<!--__POLICES__-->

<script src="config.js"></script>

<link rel="stylesheet" href="console.css">

<style>
/* Une page à une seule décision : elle n'a ni colonne ni barre d'outils, et
   se contente d'une carte au milieu. */
.seule{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);padding:26px 26px 22px;width:min(420px,100%)}
.carte .marqueE2M{width:64px;height:64px;margin:0 0 14px}
.carte h1{font-family:"Archivo",sans-serif;font-size:19px;letter-spacing:-.02em;margin:0 0 6px}
.carte p.intro{margin:0 0 18px;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.carte label + label{margin-top:12px}
.carte .pied{display:flex;align-items:center;gap:10px;margin-top:18px}
.carte .pied .btn{flex:0 0 auto}
.carte .msg{margin:14px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.carte .msg.err{color:var(--rouge)}
.carte .msg.ok{color:var(--vert)}
/* La langue se choisit dans le coin de la carte : on arrive ici depuis un
   courriel, souvent avant d'avoir jamais vu la console ni son bouton. */
.carte{position:relative}
.carte .langue{position:absolute;top:14px;right:14px}
</style>

<div class="seule">
  <div class="carte">
    <button class="icone langue" type="button" data-langue></button>
    <!-- On arrive ici depuis un courriel, souvent sans avoir jamais vu la
         console : la marque dit de quel produit vient le lien. -->
    <span class="marqueE2M"><!--__MARQUE__--></span>
    <h1 id="titre">Mot de passe</h1>
    <p class="intro" id="intro">Vérification du lien…</p>

    <div id="formMdp" hidden>
      <label><span>Nouveau mot de passe</span>
        <input id="mdp1" type="password" autocomplete="new-password">
        <span class="aide">Huit caractères au moins.</span></label>
      <label><span>Confirmation</span>
        <input id="mdp2" type="password" autocomplete="new-password"></label>
      <div class="pied"><button class="btn primaire" id="poser">Enregistrer</button></div>
    </div>

    <div id="formMail" hidden>
      <label><span>Adresse e-mail</span>
        <input id="mail" type="email" autocomplete="username"></label>
      <div class="pied"><button class="btn primaire" id="envoyer">Recevoir un lien</button></div>
    </div>

    <p class="msg" id="msg"></p>
    <div class="pied" id="apres" hidden>
      <a class="btn" id="versConsole" href="admin-plans">Ouvrir la console</a>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Poser un mot de passe — le branchement

   Le code de la page vit dans `modules/mot-de-passe.mjs`. Il se branche ici,
   à la place qu'il tenait, après le balisage : ses deux formulaires se posent
   et le lien se lit au même rang qu'avant.
   ============================================================ */
brancheMotDePasse();
</script>
