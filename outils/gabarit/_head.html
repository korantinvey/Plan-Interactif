<title>Plan du salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Courier+Prime:wght@400;700&display=swap">

<script src="config.js"></script>

<style>
:root{
  --ground:#E9EAE4; --surface:#FBFBF8; --surface-2:#F1F2EC;
  --line:#D2D5CB; --line-strong:#B4B9AC;
  --ink:#15181A; --ink-2:#4A4F52; --ink-3:#7C8285;
  --accent:#2F49D1; --accent-soft:#DCE1FA; --accent-ink:#FFFFFF;
  /* Ce qui alerte — un rendez-vous manqué, un retrait — porté par un jeton et
     non par un ton en dur : les modèles peignent les tiroirs sur des fonds
     qu'ils choisissent, et un rouge d'imprimerie disparaît sur du noir. Même
     paire que la console, pour que les deux écrans parlent du même rouge. */
  --rouge:#C2372B;
  /* L'accent décliné : les modèles de fiche s'en servent pour composer un
     dégradé ou un aplat sans avoir à deviner la couleur choisie. « base »
     reste l'accent tel qu'il est peint, même là où un modèle redéfinit
     « --accent » pour son propre usage. */
  --accent-base:#2F49D1; --accent-clair:#6A80EE; --accent-fort:#1B2A8E;
  --zone:#C98A06; --zone-soft:#F7EAC6;
  --stand:#FFFFFF; --stand-line:#9AA095; --libre:#E3E5DD;
  /* Un secteur n'a qu'une teinte : la saturation et la clarté viennent du
     thème, sans quoi le libellé du stand — écrit à l'encre du texte —
     deviendrait illisible sur l'un des deux. */
  --sect-s:58%; --sect-l:87%; --sect-dot-l:40%;
  --plan-line:#A8AEA1; --plan-ink:#8A9082;
  --shadow:0 1px 2px rgba(20,24,26,.06), 0 8px 24px -12px rgba(20,24,26,.18);
  --radius:3px;
  /* La pile du sans, écrite une fois. Elle l'était à deux endroits — la page
     entière d'un côté, les libellés du plan de l'autre — et les deux ne
     disaient pas la même chose : « Segoe UI, system-ui » ici, rien là. Tant
     qu'Instrument Sans arrive, personne ne s'en aperçoit ; dès qu'il manque —
     un salon derrière un filtre, un hall sans réseau, une page publiée qui
     n'appelle rien au dehors — l'interface passait à la police du système et
     le plan à celle du navigateur. Deux polices sur un écran, pour le même
     nom d'exposant lu deux fois. */
  --sans:"Instrument Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427;
    --line:#2A3034; --line-strong:#3B4348;
    --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
    --accent:#7A8CFF; --accent-soft:#232C55; --accent-ink:#0E1113;
    --accent-base:#7A8CFF; --accent-clair:#A9B5FF; --accent-fort:#3F4E9E;
    --rouge:#FF8B7E;
    --zone:#F0B429; --zone-soft:#3A2F12;
    --stand:#252C30; --stand-line:#4C555A; --libre:#1C2124;
    --sect-s:32%; --sect-l:26%; --sect-dot-l:64%;
    --plan-line:#3E474C; --plan-ink:#5A6469;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427;
  --line:#2A3034; --line-strong:#3B4348;
  --ink:#EDEFEC; --ink-2:#A8AEB0; --ink-3:#767D80;
  --accent:#7A8CFF; --accent-soft:#232C55; --accent-ink:#0E1113;
  --accent-base:#7A8CFF; --accent-clair:#A9B5FF; --accent-fort:#3F4E9E;
  --rouge:#FF8B7E;
  --zone:#F0B429; --zone-soft:#3A2F12;
  --stand:#252C30; --stand-line:#4C555A; --libre:#1C2124;
  --sect-s:32%; --sect-l:26%; --sect-dot-l:64%;
  --plan-line:#3E474C; --plan-ink:#5A6469;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
input,textarea,.detail-bd{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:none;border:none}
/* « hidden » ne masque rien tant qu'une règle d'auteur pose un display : la
   nôtre l'emporte sur la feuille du navigateur, et l'élément reste peint. La
   pastille « Nouvel exposant » paraissait ainsi sur toutes les fiches, la
   condition qui la pilote n'ayant jamais eu le dernier mot. On tranche ici
   plutôt qu'un sélecteur à la fois, comme il avait fallu le faire pour les
   onglets. */
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* `100vh` vaut, sur un navigateur mobile, la hauteur barre d'outils masquée :
   le bas de la page tombe sous l'écran, et tout ce qui s'y ancre — cartouche
   des points d'intérêt, boutons de zoom, échelle — descend avec lui. Le tiroir,
   lui, est `position:fixed` et se cale sur le bas réellement visible. Les deux
   se manquaient de la hauteur exacte de la barre du navigateur, si bien que le
   cartouche recouvrait la recherche et que le bouton « ajuster » passait
   dessous. `100dvh` suit cette barre et remet tout le monde d'accord. */
.app{user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:330px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh;min-height:560px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;height:60px;
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand h1.attente{color:var(--ink-3)}
.brand .sub{color:var(--ink-3);font-size:12px;white-space:nowrap}
.stats{display:flex;gap:18px;margin-left:auto;font-size:12px;color:var(--ink-3)}
@media (max-width:1150px){.stats{display:none}}
.stats b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.2}
.halls{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--radius)}
.halls button{padding:5px 13px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.halls button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.halls button .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-left:6px}
.row .hall{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  padding:1px 5px;border-radius:3px;background:var(--surface-2);color:var(--ink-3);margin-left:6px;vertical-align:1px}
.tools{display:flex;gap:6px}
.iconbtn{position:relative;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-2);background:var(--surface)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.iconbtn svg{width:15px;height:15px}

/* Le compte de l'exploitant, en bout de barre. Il n'existe qu'en
   administration — la page publique n'a pas de session à montrer, et
   `retireAdmin` le retire du document. Le panneau se décrit ici en entier :
   cette page ne charge pas `console.css`, où vivent les menus de la console. */
.compte{position:relative}
.compte > summary{list-style:none;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;user-select:none;
  background:var(--accent-soft);color:var(--accent);border:1px solid transparent;
  font-family:"Archivo",sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase}
.compte > summary::-webkit-details-marker{display:none}
.compte > summary:hover,.compte[open] > summary{border-color:var(--accent)}
.compte-pan{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:220px;
  padding:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column}
.compte-pan .qui{padding:7px 10px 9px;font-size:12.5px;color:var(--ink-2);
  overflow-wrap:anywhere;border-bottom:1px solid var(--line);margin-bottom:5px}
.compte-pan button{display:block;width:100%;text-align:left;padding:8px 10px;
  font-size:13px;border-radius:var(--radius);color:var(--ink);white-space:nowrap}
.compte-pan button:hover{background:var(--surface-2)}
.compte-pan button.sortie{color:var(--rouge)}

.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* La poignée du tiroir : sur écran étroit la liste se hisse par-dessus le
   plan, et cette barre est la prise qu'on saisit. Sur grand écran la liste a
   sa colonne, il n'y a pas de tiroir, donc pas de prise. */
.poignee{display:none}
.search{padding:14px 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
/* La recherche prend la place, le bouton des critères ce qu'il faut : sur un
   téléphone les deux tiennent sur la même ligne, et le tiroir replié ne perd
   pas une ligne de plus. */
.search-field{position:relative;flex:1;min-width:0}
.crit-btn{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;width:34px;height:34px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-2);color:var(--ink-2)}
.crit-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.crit-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--ink)}
.crit-btn svg{width:15px;height:15px}
/* Rien à filtrer encore : le bouton reste, en retrait, pour dire ce qui manque
   — il n'est montré qu'en administration dans ce cas. */
.crit-btn.vide{color:var(--ink-3);border-style:dashed}
.crit-btn .compteur{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;
  padding:0 3px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:10px;font-weight:600;line-height:15px;text-align:center}
/* Les critères retenus : une ligne qui défile à l'étroit, plusieurs qui se
   replient au large, et rien du tout tant qu'il n'y a rien à montrer. */
.actifs{display:flex;flex-wrap:wrap;gap:6px;padding:9px 16px;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.actifs::-webkit-scrollbar{display:none}
.actifs .actif{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  max-width:100%;padding:4px 8px 4px 10px;font-size:12px;color:var(--ink);
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px}
.actifs .actif .k{color:var(--ink-3);font-size:11px;flex:0 0 auto}
.actifs .actif .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actifs .actif .v:empty{display:none}
.actifs .actif .x{color:var(--ink-3);font-size:13px;line-height:1;flex:0 0 auto}
.actifs .actif:hover .x{color:var(--ink)}
.actifs .vider{background:var(--surface-2);border-color:transparent;color:var(--ink-3)}
.actifs .vider:hover{border-color:var(--line-strong);color:var(--ink)}
.search-field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.search :is(input,.champ){width:100%;padding:9px 10px 9px 32px;background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--radius)}
.search input:focus{border-color:var(--accent);background:var(--surface);outline:none}
/* Le champ de la vignette des modèles. Un <input> ne peut pas vivre dans le
   bouton qui choisit le modèle — pas plus qu'un bouton n'en contient un autre
   — et l'habillage se joue pourtant sur la boîte de recherche : elle est donc
   rejouée par une balise neutre, que les modèles habillent avec la vraie. */
.search .champ{display:block;color:var(--ink-3);font-size:13px;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* La pastille d'un secteur, sur la puce qui le coche et sur celle qui le dit
   retenu. Un liseré la borde : une couleur pâle, choisie pour un aplat,
   disparaîtrait sinon sur le fond clair du panneau. */
.pastille{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  border:1px solid var(--line-strong);
  background:var(--sect-c,hsl(var(--sect-h) 60% var(--sect-dot-l)))}
/* Une bande qui défile ne le dit pas d'elle-même.

   En tiroir, les critères retenus tiennent sur une ligne qui déborde par le
   côté : une puce coupée net au bord de l'écran ressemble à un défaut de
   cadrage, pas à une invitation à pousser du doigt. Le bord par lequel il reste
   quelque chose s'estompe donc, et lui seul — arrivé au bout, plus rien ne
   s'efface, et l'on sait qu'on a tout vu.

   Un masque plutôt qu'un dégradé de couleur : il découpe au lieu de teindre, et
   tient donc dans les deux thèmes sans avoir à être décliné, par-dessus le fond
   du tiroir comme par-dessus celui de la bande. */
.bande{position:relative;--fondu:44px}
.bande[data-gauche] .defile,.bande[data-droite] .defile{
  -webkit-mask-image:var(--masque);mask-image:var(--masque)}
.bande[data-droite]{
  --masque:linear-gradient(to right,#000 calc(100% - var(--fondu)),transparent)}
.bande[data-gauche]{
  --masque:linear-gradient(to right,transparent,#000 var(--fondu))}
.bande[data-gauche][data-droite]{
  --masque:linear-gradient(to right,transparent,#000 var(--fondu),
    #000 calc(100% - var(--fondu)),transparent)}
/* La flèche, posée sur le fondu du côté où il reste quelque chose.

   Le fondu seul ne suffisait pas : il dit qu'on n'a pas tout vu, il ne dit pas
   comment voir le reste, et le geste ne vient pas de lui-même sur une bande
   large de trois puces. La flèche le dit, et le fait — une pression avance
   d'un écran, sans qu'on ait à pousser du doigt. Elle est hors de la bande,
   sinon le masque l'effacerait avec les puces qu'elle surmonte.

   Elle ne paraît jamais au large : les bandes s'y replient sur plusieurs
   lignes, rien ne déborde, et aucun bord ne se marque. */
.bande .fleche{display:none;position:absolute;top:50%;z-index:2;
  width:27px;height:27px;margin-top:-13px;border-radius:50%;
  align-items:center;justify-content:center;
  background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line-strong);box-shadow:0 1px 5px rgba(0,0,0,.16)}
.bande .fleche svg{width:15px;height:15px}
.bande .fleche:active{background:var(--surface-2)}
.bande[data-gauche] .fleche[data-vers="-1"]{display:flex;left:5px}
.bande[data-droite] .fleche[data-vers="1"]{display:flex;right:5px}
.count{padding:9px 16px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:var(--caseL,48px) 1fr;gap:10px;align-items:center;width:100%;text-align:left;
  padding:9px 16px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
/* Le numéro tient sur une ligne : c'est un tout, et l'empiler en deux morceaux
   le donnait à lire comme deux numéros. La case s'élargit plutôt, jusqu'au
   plafond que `caseNumero` lui fixe. */
.row .code{font-family:"IBM Plex Mono",monospace;font-size:var(--caseF,11.5px);font-weight:500;
  padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-2)}
.row[aria-current="true"] .code{border-color:var(--accent);color:var(--accent)}
/* Une zone et une conférence n'ont pas de numéro : leur case dit la sorte. En
   lettres, et sans le cadre — celui-ci cite un numéro peint sur une cloison,
   et l'emprunter pour un mot ferait lire « Zone » comme un emplacement. */
.row[data-sorte="zone"] .code,.row[data-sorte="conf"] .code{
  font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;border-color:transparent;background:var(--surface-2);color:var(--ink-3)}
.row.l .code{opacity:.5}
/* Le second bloc d'une ligne doit pouvoir rétrécir sous la largeur de son
   texte : sans cela il s'étire à la taille du nom, et l'ellipse annoncée plus
   bas ne se déclenche jamais — le nom se coupait net au bord de l'écran. */
.row>span{min-width:0}
/* `overflow` ne s'applique pas à une boîte en ligne : tant que ces deux-là
   étaient de simples `span`, l'ellipse annoncée ici ne se déclenchait jamais
   et les noms longs se coupaient net. Les passer en bloc la rend effective —
   le retour à la ligne qui les séparait devient alors inutile. */
.row .nm{display:block;font-weight:500;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px}

/* Les tiroirs fermés sont garés à `translateX(100%)`, soit 340 px au-delà du
   bord droit : la scène a donc toujours de quoi défiler. Or `hidden` cache la
   barre sans interdire le défilement par programme — mettre le curseur dans un
   tiroir encore en transition, donc hors champ, faisait glisser toute la scène
   pour l'amener sous les yeux, et rien ne la ramenait. On y voyait alors les
   tiroirs fermés exposés à droite, et il fallait recharger la page. `clip`
   refuse ce défilement ; `hidden` reste pour qui ne connaît pas `clip`. */
/* Le fond du plan se règle : le gris du thème convient à la plupart des
   salons, pas à celui qui tient sa charte. Comme les autres couleurs réglées
   au panneau, la teinte choisie vaut pour les deux thèmes ; sans réglage, le
   jeton reste absent et le fond de la page reprend la main. */
.stage{position:relative;overflow:hidden;overflow:clip;background:var(--c-fond,var(--ground))}
/* Le plan lui-même, et lui seul : « .stage svg » atteignait aussi les <svg>
   imbriqués des pictogrammes de repère, qu'il étirait à la taille de la scène
   — la pastille se voyait, son glyphe partait hors du cadre, et le repère
   n'était plus qu'un carré de couleur. Un <svg> imbriqué tient ses dimensions
   de ses attributs, qu'aucune valeur CSS ne sait rendre après coup : il faut
   donc que la règle ne le touche pas. */
.stage > svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage svg.dragging{cursor:grabbing}

/* Chaque sous-calque garde sa teinte Klipso, portée par `color` ; les tracés
   noirs d'origine héritent de la couleur du thème et suivent clair / sombre. */
#couches .cal{color:var(--plan-line)}
#couches .cal path,#couches .cal polyline,#couches .cal circle{stroke-width:.7;vector-effect:non-scaling-stroke}
/* Le groupe d'un calque porte stroke: currentColor pour ses tracés. Un texte
   en hérite aussi, avec l'épaisseur par défaut d'une unité — soit un mètre ici,
   trois fois la hauteur des glyphes : les mots devenaient des taches. Un texte
   se peint, il ne se contourne pas. */
#couches .cal text{fill:currentColor;stroke:none;font-family:var(--sans)}

/* Une zone se peignait à 22 % de la couleur choisie, quand un stand la prend
   telle quelle : le nuancier annonçait un ocre franc et le plan rendait un
   beige. La moitié rapproche les deux sans écraser le nom posé par-dessus, qui
   se lit sur le fond de la zone. */
/* Une image liée à un stand s'ouvre au clic comme le stand lui-même. */
/* Les calques de dessin laissent passer le clic vers le plan. Une image liée à
   un stand est l'exception : elle doit s'ouvrir comme lui, y compris sur la
   page publique où le mode édition n'existe pas. */
.dcal .forme.lie{cursor:pointer;pointer-events:auto}
.dcal .forme.lie image{pointer-events:all}
.zone path{fill:var(--c-zone,var(--zone));fill-opacity:.5;
  stroke:var(--c-zone,var(--zone));stroke-width:1.2;
  vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
/* Une zone éteinte par l'exploitant : présente en administration, absente du
   plan public. La teinte pâlie le dit sans la faire disparaître — c'est de sa
   fiche qu'on revient sur le choix, encore faut-il pouvoir la désigner. */
.zone.masquee path{fill-opacity:.14;stroke-opacity:.4}
.stand path{fill:var(--c-stand,var(--stand));stroke:var(--stand-line);
  stroke-width:1;vector-effect:non-scaling-stroke}
/* La teinte du secteur est posée sur le groupe par la page. La règle vient
   avant le survol et la sélection, à spécificité égale, pour leur laisser la
   main : un stand qu'on désigne doit se voir plus que son secteur. */
.stand[data-sect] path{fill:var(--sect-c,hsl(var(--sect-h) var(--sect-s) var(--sect-l)))}
/* La carte de chaleur, en administration. Elle vient après le secteur — c'est
   la même question posée autrement, et on ne lit pas les deux à la fois — mais
   avant le survol et la sélection, qui gardent la main sur elle. */
.stand[data-chaleur] path{fill:var(--chal-c)}
/* Les deux liserés que le plan pose sur un stand — celui de la sélection,
   celui du parcours — se tracent dans « #marques », un calque à part posé
   au-dessus des couches, et non sur le stand lui-même : une cloison mitoyenne
   appartient aux deux stands qu'elle sépare, et le second tracé y effaçait le
   liseré du premier. Le calque ne reçoit aucun clic — c'est le stand qu'on
   désigne, pas sa marque.

   Le parcours reste le plus discret des deux : ce qu'on a retenu doit se
   retrouver sur le plan sans le relire, sans pour autant se confondre avec ce
   qu'on vient de désigner. Une zone y entre par ses conférences. */
#marques{pointer-events:none}
#marques path{fill:none;stroke-dasharray:none;vector-effect:non-scaling-stroke}
#marques .parc{stroke:var(--c-parc,var(--accent));stroke-width:2}
#marques .sel{stroke:var(--c-sel-trait,var(--accent));stroke-width:3}
/* le trait discontinu est ce qui distingue une zone d'un stand : sa sélection
   le garde */
#marques .sel.zn{stroke-dasharray:5 4}
html.sans-parcours #marques .parc{display:none}
/* Le parcours est tracé hors des couches, dans « #marques » : le retrait du
   plan ne l'atteignait donc pas, et ses liserés restaient seuls à pleine force
   au milieu d'un hall effacé — on les prenait pour ce que le cartouche venait
   de désigner. Le temps d'une mise en avant, ils s'effacent tout à fait : ce
   qu'on a retenu se retrouve en refermant le cartouche. */
html.poi-actif #marques .parc{display:none}
.stand:hover path,.zone:hover path{fill:var(--accent-soft)}
/* La sélection ne tient pas dans une seule couleur : un aplat, et le liseré
   qui le borde. L'exploitant n'en choisit qu'une — l'aplat, celle qu'on voit —
   et « appliqueCouleursData » en tire le liseré, assez écarté pour se lire
   par-dessus. Sans réglage, l'accent d'origine.

   Seul l'aplat se pose ici : le liseré monte dans « #marques », hors d'atteinte
   des stands voisins. */
.stand.sel path,.zone.sel path{fill:var(--c-sel,var(--accent-soft))}
.stand,.zone{cursor:pointer}
.dim{opacity:.22}

/* le contour de focus par défaut dessine un gros rectangle noir autour du
   groupe SVG : on le remplace par un renforcement du tracé du stand */
.stage > svg{-webkit-tap-highlight-color:transparent}
.stand:focus,.zone:focus{outline:none}
.stand:focus-visible,.zone:focus-visible{outline:none}
.stand:focus-visible path,.zone:focus-visible path{stroke:var(--accent);stroke-width:3}

/* Deux endroits écrivent le même libellé : « #labels », qui porte ceux du
   plan, et « .lab » — le libellé qu'un stand dessiné garde dans sa propre
   forme, faute de pouvoir compter sur l'ordre des couches. Les règles valent
   pour les deux, et le second sélecteur passe par « .dcal » pour l'emporter
   sur l'habillage du calque, qui teinte tout ce qu'il porte. */
#labels text,.dcal .lab text{pointer-events:none;text-anchor:middle;
  fill:var(--c-lab-stand,var(--ink-2));
  font-family:var(--police-lab-code,"IBM Plex Mono",monospace);
  font-weight:var(--graisse-lab-code,500)}
#labels text.nm,.dcal .lab text.nm{font-family:var(--police-lab-nom,var(--sans));
  font-weight:var(--graisse-lab-nom,600);fill:var(--c-lab-stand,var(--ink))}
#labels text.zn{font-family:var(--police-lab-nom,var(--sans));
  font-weight:var(--graisse-lab-nom,600);fill:var(--c-lab-zone,var(--zone))}
#labels text.zn.masquee{opacity:.45}
/* La couleur d'un élément sélectionné se règle depuis la pile ; le numéro du
   stand, écrit par-dessus l'aplat, suit le liseré qui en est tiré. */
#labels text.sel,.dcal .lab text.sel{fill:var(--c-sel-trait,var(--accent));font-weight:700}
/* Sur la carte de chaleur, l'emplacement ne porte plus la couleur du thème
   mais sa température, la même de jour comme de nuit. Aucune encre unique ne
   tient sur toute la rampe : noire, elle se perd sur le bleu ; blanche, sur le
   jaune. Le liseré la porte des deux côtés — c'est la solution des cartes
   posées sur photo, et elle dit au passage que le plan est en lecture.
   Le liseré se mesure en « em » et non en pixels : le plan a son propre
   repère, où un pixel vaut d'autant plus de mètres qu'on a dézoomé — posé en
   dur, il noyait les enseignes dès qu'on prenait du recul, au moment précis où
   l'on regarde la carte en entier.
   La couleur que l'exploitant a pu choisir pour ses libellés est écartée le
   temps de cette lecture : elle avait été accordée à ses stands, pas à une
   caméra thermique. La sélection et les pastilles de coexposants gardent la
   leur — ce sont des marques, pas des noms peints sur une cloison. */
html.mode-chaleur #labels text:not(.zn):not(.sel):not(.coexN),
html.mode-chaleur .dcal .lab text:not(.sel){
  fill:#0F1316;paint-order:stroke;stroke:rgba(255,255,255,.82);stroke-width:.15em;
  stroke-linejoin:round;stroke-linecap:round}
/* Le compte des sociétés hébergées, à côté du numéro. Il reprend l'accent de
   la page, comme la pastille des nouveaux venus sur la fiche : c'est une
   distinction, pas une alerte, et le plan a déjà le langage des zones. */
#labels .coexPast{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;
  vector-effect:non-scaling-stroke;pointer-events:none}
/* Un stand sélectionné se remplit de cette même teinte douce : la pastille y
   fondait dans le fond. Elle prend alors celui de la page, et son trait la
   tient. Ce trait et le nombre suivent la sélection : sur un salon qui a
   choisi sa couleur, l'accent d'origine détonnerait au milieu du stand. */
#labels .coexPast.sel{fill:var(--surface);stroke:var(--c-sel-trait,var(--accent))}
#labels text.coexN{fill:var(--accent);font-weight:700}
#labels text.coexN.sel{fill:var(--c-sel-trait,var(--accent))}
/* Le réglage qui masque les libellés de stand emporte la pastille : elle en
   fait partie, et la laisser flotter seule ne se comprendrait pas. Il emporte
   aussi ceux des stands dessinés : ce sont des libellés de stand. */
.sans-lab-stand #labels text:not(.zn),.sans-lab-stand #labels .coexPast,
.sans-lab-stand .dcal .lab{display:none}
.sans-lab-zone #labels text.zn{display:none}
/* Placer un libellé à la main.
   Hors de ce mode un libellé ne reçoit aucun clic : c'est le stand qui est
   dessous qu'on désigne à travers lui, et c'est sa fiche qu'on veut. Dedans,
   c'est le nom lui-même qu'on attrape — d'où le pointeur, et la teinte
   d'accent qui dit lequel répondra. */
html.mode-libelles #labels .lbl{cursor:move}
html.mode-libelles #labels .lbl text,
html.mode-libelles #labels .lbl .coexPast{pointer-events:all}
html.mode-libelles #labels .lbl:hover text,
html.mode-libelles #labels .lbl.pick text{fill:var(--accent)}

/* --- calques de dessin --- */
.dcal{pointer-events:none}
.dcal path{fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;stroke-linecap:round}
.dcal.plein path{fill:currentColor;fill-opacity:.25}
.dcal text{fill:currentColor;text-anchor:middle;
  font-family:var(--police-lab-nom,var(--sans));
  font-weight:var(--graisse-lab-nom,600)}
.dcal.editable{pointer-events:auto}
/* Seuls les tracés du calque ouvert répondent au pointeur. Ceux des autres
   calques restent sourds : leur clic appartient à la vue, sans quoi un geste
   destiné au plan emportait un dessin voisin. L'image liée à un stand fait
   exception plus haut — elle ouvre sa fiche, comme pour un visiteur. */
/* une forme en contour seul doit rester attrapable par son intérieur */
.dcal.editable path,.dcal.editable image,
.dcal.editable text,.dcal.editable rect{pointer-events:all}
.dcal.editable .forme{cursor:pointer}
.dcal.editable .forme.pick{cursor:move}
@keyframes halo{0%{opacity:.15}35%{opacity:1}100%{opacity:1}}
/* Une forme déclarée infranchissable pour les PMR ne change rien pour le
   visiteur — c'est le trajet qui en tient compte, pas le dessin. L'exploitant,
   lui, doit la reconnaître pendant qu'il édite, sans quoi il la coche deux
   fois ou l'oublie. */
/* Un calque qui porte un rôle ne change rien pour le visiteur — c'est le
   trajet qui en tient compte, pas le dessin. L'exploitant, lui, doit le
   reconnaître pendant qu'il édite, sans quoi il le règle deux fois. */
html.mode-edition .dcal.role path{stroke-dasharray:5 3}
html.mode-edition .dcal.circulation path{stroke-dasharray:none;fill:currentColor;
  fill-opacity:.12}
/* Un stand dessiné à la main découpe un emplacement : il doit se lire comme
   lui et non comme un dessin. Il passe donc outre l'habillage de son calque —
   la couleur, le remplissage, le pointillé du rôle — que rien ici ne concerne.
   Le sélecteur porte « html » pour tenir devant celui du rôle « circulation »,
   plus spécifique, qui repeindrait le découpage en allée. */
html .dcal .forme.sdes path{fill:var(--c-stand,var(--stand));stroke:var(--stand-line);
  stroke-width:1;stroke-dasharray:none;fill-opacity:1}
html .dcal .forme.sdes[data-sect] path{fill:var(--sect-c,hsl(var(--sect-h) var(--sect-s) var(--sect-l)))}
html .dcal .forme.sdes[data-chaleur] path{fill:var(--chal-c)}
/* Rattaché — « lie », comme une image liée — il répond au pointeur par son
   tracé, y compris sur la page publique où le mode édition n'existe pas.
   Détaché, il attend son exposant : rien à ouvrir, donc rien à cliquer. */
.dcal .forme.sdes.lie path{pointer-events:all}
html .dcal .forme.sdes.lie:hover path{fill:var(--accent-soft)}
/* Le liseré de la sélection reste sur la forme : « #marques » recopie les
   tracés des couches de données, et un stand dessiné n'en est pas une. Il n'a
   pas de cloison mitoyenne à ménager — il est posé sur son hôte. */
html .dcal .forme.sdes.sel path{fill:var(--c-sel,var(--accent-soft));
  stroke:var(--c-sel-trait,var(--accent));stroke-width:3}
.dcal .forme.sdes:focus{outline:none}
html .dcal .forme.sdes:focus-visible path{stroke:var(--accent);stroke-width:3}
.dcal .forme.neuve{animation:halo .5s ease-out 2}
.dcal .forme.neuve path,.dcal .forme.neuve image,.dcal .forme.neuve text{
  outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dcal .forme.neuve{animation:none}}

#apercu{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-dasharray:6 4;pointer-events:none}
/* Le repère d'alignement dit d'où vient la ligne sur laquelle le point vient
   de s'accrocher : sans lui, l'accrochage passe pour une main qui tremble. */
#apercuGuide{fill:none;stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke;
  stroke-dasharray:2 5;opacity:.55;pointer-events:none}
/* Les points d'accrochage à portée du geste. Discrets : ils annoncent une
   possibilité, ils ne désignent rien — c'est la croix du repère d'alignement
   qui dit lequel a pris. */
#aimantsVus{pointer-events:none}
#aimantsVus circle{fill:var(--accent);fill-opacity:.6;stroke:var(--surface);
  stroke-width:1px;vector-effect:non-scaling-stroke}
/* Un cran de grille n'est qu'une graduation : il se voit sans disputer au
   coin du stand le regard qu'on lui porte. */
#aimantsVus .cran{fill-opacity:.3;stroke:none}
/* La cote se lit par-dessus le fond de plan, qui porte déjà ses propres
   cotes et ses hachures : le liseré de la couleur du fond la détache sans
   qu'il faille lui poser un cartouche. */
#cote{fill:var(--accent);stroke:var(--surface);stroke-width:3px;paint-order:stroke;
  stroke-linejoin:round;vector-effect:non-scaling-stroke;font-weight:600;
  pointer-events:none;user-select:none}

/* On travaille longtemps dans cette palette : elle est assez large pour que les
   libellés tiennent sur une ligne, et bornée en hauteur pour ne jamais sortir
   du plan sur un écran bas — elle défile alors plutôt que de déborder. */
.outils{position:absolute;top:12px;left:12px;z-index:6;display:none;flex-direction:column;gap:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;width:264px;
  max-height:calc(100% - 24px);overflow-y:auto}
.outils.open{display:flex}
.outilsTete{display:flex;align-items:center;justify-content:space-between;gap:8px}
.outilsActs{display:flex;align-items:center;gap:2px}
.outilsTete button{color:var(--ink-3);font-size:17px;line-height:1;padding:0 3px}
#renommeOutils{font-size:12px}
.outilsTete button:hover{color:var(--ink)}
/* Neuf outils ne tiennent pas sur une rangée : la grille les range par cinq,
   plutôt que de laisser les derniers déborder de la palette. */
.outilsBtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.outilsBtns button{min-width:0;height:34px;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-2);font-size:15px;display:grid;place-items:center}
.outilsBtns button:hover{border-color:var(--line-strong);color:var(--ink)}
.outilsBtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.outils input{width:100%;padding:7px 9px;font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.outils input:focus{border-color:var(--accent);outline:none}
.outils .choix{display:none;width:100%;padding:7px;border:1px solid var(--accent);
  border-radius:var(--radius);font-size:12.5px;color:var(--accent);background:var(--surface)}
.outils .choix:hover{background:var(--accent);color:#fff}
.outils.mode-image .choix{display:block}
.outils #texteADessiner{display:none}
.outils.mode-texte #texteADessiner{display:block}
#contourReg{display:none;flex-direction:column;gap:6px}
.outils.mode-contour #contourReg{display:flex}
#vignette{display:none;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.outils.mode-image #vignette[data-prete]{display:flex}
#vignette img{width:40px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
/* La palette de placement emprunte l'allure de la barre de dessin — même
   coin, même cadre — parce qu'elle joue le même rôle : elle règle ce qu'on est
   en train de retoucher sur le plan. Les deux ne s'ouvrent jamais ensemble,
   entrer en placement referme le dessin. */
.libreg input[type="range"]{padding:0;border:none;background:none;accent-color:var(--accent)}
.libreg .auto{width:100%;padding:7px;border:1px solid var(--line);border-radius:var(--radius);
  font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.libreg .auto:hover:not([disabled]){border-color:var(--line-strong);color:var(--ink)}
.libreg .auto[disabled]{opacity:.4;cursor:default}
.dcal image{pointer-events:none}
.dcal.editable image{pointer-events:auto}
.elem{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;
  border-top:1px solid var(--line)}
.elem[hidden]{display:none}
/* Un repère matérialise ce que le plan ne nomme pas : sanitaires, entrées,
   accueil. Une pastille dans la couleur du calque, un libellé court dedans. */
#repereType,#repereTexte{display:none}
.outils.mode-repere #repereType,.outils.mode-repere #repereTexte{display:block}
#repereType,#repereTexte,#elemPicto{width:100%;padding:6px 8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px}
/* Le stand dessiné se choisit avant d'être tracé : sans société à désigner, il
   n'ouvrirait aucune fiche et ne serait qu'un rectangle de plus. */
.outils #standSoc{display:none}
.outils.mode-stand #standSoc{display:block}
#elemPicto[hidden]{display:none}
.dcal .repere > rect{fill:currentColor;stroke:none}
.dcal .repere .glyphe path{fill:var(--surface);stroke:none}
.dcal .repere text{fill:var(--surface);font-weight:700;text-anchor:middle}
/* Un repère se lit de loin par son pictogramme, et s'ouvre au clic pour dire
   son nom : sa pastille répond donc au pointeur, sur un calque qui, lui,
   n'y répond pas. */
.dcal .repere{pointer-events:auto;cursor:pointer}
.dcal .repere *{pointer-events:all}
/* Le repère ouvert se marque comme le fait le cartouche : un liseré clair
   autour de la pastille. Le contour du navigateur, lui, est retiré — il
   dessine un carré noir autour d'un groupe SVG, à côté de la forme qu'il
   entoure — et remplacé au clavier par le même liseré, en encre. */
.dcal .repere.sel > rect{stroke:var(--surface);stroke-width:.6;paint-order:stroke}
.dcal .repere:focus{outline:none}
.dcal .repere:focus-visible > rect{stroke:var(--ink);stroke-width:.5;paint-order:stroke}
/* Ce qu'un passage rejoint sur un autre plan : un escalier son palier à
   l'étage, une porte celle du hall d'en face. La liste se lit d'un coup
   d'œil, chaque ligne se retire d'une croix. */
.elemLiens{display:flex;flex-direction:column;gap:5px}
.elemLiens[hidden]{display:none}
.elemLiens select{width:100%;padding:7px 9px;font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.elemLiens select:focus{border-color:var(--accent);outline:none}
.elemLiens i{font-style:normal;font-size:11px;line-height:1.4;color:var(--ink-3)}
.elemLiens i:empty{display:none}
.lienListe{display:flex;flex-direction:column;gap:4px}
.lienListe:empty{display:none}
.lienListe .lien{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  padding:4px 4px 4px 7px;background:var(--surface-2);border-radius:var(--radius);
  border-left:2px solid var(--accent)}
.lienListe .lien span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Le temps du passage : un champ étroit, son unité collée, et l'invite qui
   montre le temps ordinaire du type — vide ne veut pas dire zéro. */
.elem .lienListe .lien input{width:44px;flex:none;padding:2px 4px;font-size:11.5px;
  text-align:right;background:var(--surface);border:1px solid var(--line)}
.lienListe .lien b{font-weight:400;font-size:10.5px;color:var(--ink-3)}
.elemTete{display:flex;align-items:center;justify-content:space-between}
.elemChamp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.elemChamp input{flex:1;min-width:0}
.elemChamp select{flex:1;min-width:0;padding:7px 9px;font-size:13px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.elemChamp select:focus{border-color:var(--accent);outline:none}
.elemChamp[hidden]{display:none}
#elemDim{display:flex;flex-direction:column;gap:6px}
#elemDim[hidden]{display:none}
/* Le rôle du calque dans les itinéraires : on le règle là où l'on dessine,
   puisque c'est en dessinant qu'on le décide. */
.outilsRole{display:flex;flex-direction:column;gap:3px}
.outilsRole select{width:100%;padding:7px 9px;font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.outilsRole select:focus{border-color:var(--accent);outline:none}
.outilsRole i{font-style:normal;font-size:11.5px;line-height:1.45;color:var(--ink-3)}
.outilsRole i:empty{display:none}
.outilsVoir{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);
  cursor:pointer}
.outils .outilsVoir input{width:15px;height:15px;flex:none;padding:0;accent-color:var(--accent)}
#nappe{pointer-events:none;image-rendering:pixelated;opacity:.55}
.calq .rle{font-style:normal;font-size:10px;padding:1px 5px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.btnSup{color:var(--ink-3);font-size:13px;line-height:1;padding:1px 3px}
.btnSup:hover{color:#C2372B}
.elem input{width:100%;padding:7px 9px;font-size:13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.elem input:focus{border-color:var(--accent);outline:none}

#poignees{pointer-events:none}
#poignees .cadreSel{fill:none;stroke:var(--accent);stroke-width:1;
  stroke-dasharray:5 4;vector-effect:non-scaling-stroke;opacity:.8}
#poignees .pgn{fill:var(--surface);stroke:var(--accent);stroke-width:1.6;
  vector-effect:non-scaling-stroke;pointer-events:auto}
#poignees .pgn:hover{fill:var(--accent-soft)}
.outilsPied{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-3)}
.calq .mv{width:15px;height:18px;border:none;color:var(--ink-3);font-size:11px;line-height:1;padding:0}
.calq .mv:hover{color:var(--ink)}
.calq .mv[disabled]{opacity:.25;cursor:default}
.calq .ren{width:18px;height:18px;border:none;color:var(--ink-3);font-size:11px;line-height:1}
.calq .ren:hover{color:var(--accent)}
.calq .ren[aria-pressed="true"]{color:var(--accent)}
.mcorps input.nomcalque{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface-2);color:var(--ink)}
.mcorps input.nomcalque:focus{border-color:var(--accent);outline:none}
.calq .sup{width:18px;height:18px;border:none;color:var(--ink-3);font-size:14px;line-height:1}
.calq .sup:hover{color:#C2372B}
.calq.perso label span{font-weight:600}
.calq .renom{width:100%;font-size:12.5px;padding:2px 5px;border:1px solid var(--accent);
  border-radius:3px;background:var(--surface-2);color:var(--ink)}
.calq.actif{background:var(--accent-soft);border-radius:3px;margin:0 -4px;padding:2px 4px}
.panel .ajout{width:100%;margin-top:6px;padding:6px;border:1px dashed var(--line-strong);
  border-radius:var(--radius);font-size:12px;color:var(--ink-2)}
.panel .ajout:hover{border-color:var(--accent);color:var(--accent)}

/* Ces deux-là déclarent « display:flex », qui l'emporte sur la règle du
   navigateur masquant un élément porteur de « hidden » : sans ces lignes,
   l'attribut ne masque rien. Le piège s'est déjà refermé une fois sur la barre
   de zoom, et il vaut pour tout ce qui se cache par attribut dans cette page. */
.zoombar[hidden],.scalebar[hidden]{display:none}
.zoombar{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.zoombar button{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.zoombar button+button{border-top:1px solid var(--line)}
.zoombar button:hover{color:var(--ink);background:var(--surface-2)}
.zoombar svg{width:14px;height:14px}
/* Cartouche des points d'intérêt, au bas du plan. Il ne paraît que s'il y a
   des repères, et se retire de l'échelle pour ne pas la masquer. */
/* Centré par des marges automatiques, et non par « left:50% » : un élément
   absolu ancré au milieu ne peut s'étendre que vers la droite, si bien que sa
   largeur était plafonnée à la moitié de l'écran. Le cartouche passait à la
   ligne pour deux pixels manquants, et le « max-width » annoncé plus bas ne
   servait à rien. Ancré des deux côtés, il dispose enfin de toute la largeur. */
.poi{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;bottom:16px;z-index:12;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(760px,72%);
  padding:7px 9px;background:var(--surface);border:1px solid var(--line);
  /* le rayon commun vaut 3 px : des angles presque vifs autour de pastilles
     entièrement rondes, et posés sur un tiroir aux coins adoucis */
  border-radius:12px;box-shadow:var(--shadow)}
.poi[hidden]{display:none}
.poiBtn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  font-size:12px;cursor:pointer}
.poiBtn:hover{border-color:var(--line-strong);color:var(--ink)}
/* La couleur des points d'intérêt se règle à part de l'accent : le
   cartouche et la mise en avant vont ensemble, et l'exploitant qui veut
   distinguer « où déjeuner » du reste du plan ne peut pas le faire en
   déplaçant la couleur principale, qui peint la moitié de l'écran. Sans
   réglage, c'est l'accent — le plan d'origine ne bouge pas. */
.poiBtn[aria-pressed="true"]{background:var(--c-poi,var(--accent));
  border-color:var(--c-poi,var(--accent));color:var(--c-poi-ink,#fff)}
.poiBtn i{font-style:normal;font-size:10.5px;opacity:.7}
/* « .stage svg » impose 100 % à tout SVG du plan : il faut une règle plus
   précise pour que le pictogramme du cartouche garde sa taille. */
.poi .poiPicto{width:17px;height:17px;flex:none}
.poi .poiPicto path{fill:currentColor}
/* Mise en avant : tout le plan s'efface sauf les repères retenus, qui gagnent
   un liseré, un halo et un battement. Faire pulser l'opacité du repère
   lui-même le rendait invisible une fois sur deux — c'est l'inverse de
   l'effet recherché. */
/* Le retrait est franc : à demi effacé, le plan se lisait encore, et l'œil
   hésitait entre ce qu'on lui montrait et tout le reste. Assez pour que le
   hall reste reconnaissable, trop peu pour qu'on y cherche un nom.

   Les zones et leurs libellés s'effacent un par un et non par calque entier :
   depuis qu'une zone typée répond au cartouche, ce calque-là porte à la fois
   ce qu'on met en avant et ce qu'on met en retrait. */
html.poi-actif #stands,
html.poi-actif #couches .cal,
html.poi-actif #zones g:not(.phare),
html.poi-actif #labels .lbl:not(.phare),
html.poi-actif .dcal .forme:not(.phare){opacity:.16}
.dcal .repere.phare > rect{stroke:var(--surface);stroke-width:.5;paint-order:stroke}
/* Une zone ne peut pas battre comme un repère : celui-ci est une pastille de
   quatre mètres qu'on grossit sans gêner personne, une zone tient parfois le
   quart du hall et grandirait par-dessus ses voisines. C'est donc sa présence
   qui bat, et non sa taille — « opacity », comme « transform », est animée par
   le compositeur sans repeindre le plan.

   Elle gagne en même temps sa pleine teinte et un liseré d'accent : sur un plan
   passé au blanc, une zone à demi transparente ne ressortait pas de ce qu'elle
   recouvre. Le liseré continu la distingue aussi des zones ordinaires, que le
   trait discontinu marque. */
html.poi-actif #zones g.phare path{fill-opacity:.92;
  stroke:var(--c-poi,var(--accent));stroke-width:3;stroke-dasharray:none}
/* Le halo est un « drop-shadow » posé une fois — c'est l'animer qui coûtait le
   repaint du plan entier, pas le porter — et c'est l'opacité du groupe, seule
   animée, qui le fait battre avec la zone. Deux passes plutôt qu'une : la
   première cerne, la seconde diffuse. Les longueurs sont en unités du plan,
   c'est-à-dire en mètres : le halo garde donc sa proportion au zoom. */
#zones g.phare{filter:drop-shadow(0 0 2px var(--c-poi,var(--accent)))
    drop-shadow(0 0 7px var(--c-poi,var(--accent)));
  animation:pulseZone 1.5s ease-in-out infinite}
@keyframes pulseZone{0%,100%{opacity:1}50%{opacity:.58}}
/* Le nom de la zone est écrit dans la couche des libellés, pas dans la zone :
   il ne bat donc pas avec elle, et restait d'une seule couleur sur un aplat qui
   passe du plein au pâle — noyé dans la teinte à un bout du battement.

   Il bat maintenant lui aussi, de l'encre à l'accent, et se détache du fond
   quoi qu'il arrive : le halo clair posé derrière les lettres le tient sur
   l'aplat le plus vif comme sur le plus effacé. C'est la même parade que sur la
   carte de chaleur, à la même mesure — « .15em », qui suit la taille du texte
   plutôt que le zoom. */
#labels .lbl.phare text{fill:#0F1316;paint-order:stroke;stroke:rgba(255,255,255,.85);
  stroke-width:.15em;stroke-linejoin:round;stroke-linecap:round;
  animation:titrePhare 1.5s ease-in-out infinite}
@keyframes titrePhare{0%,100%{fill:#0F1316}50%{fill:var(--c-poi,var(--accent))}}
/* Le battement passe par « transform », et non par « filter ».
   Le halo battait en animant le flou d'un « drop-shadow » : un filtre ne se
   délègue pas au compositeur, si bien que le navigateur recalculait les styles
   et repeignait le plan entier — cinq cents stands et leurs libellés — à
   chaque image, tant qu'un point d'intérêt restait mis en avant. Le plan et
   l'interface partagent une seule couche : sur un téléphone, tout l'écran
   tremblait avec lui, à commencer par le bandeau du haut. « transform » et
   « opacity » sont les deux propriétés que le compositeur anime seul, sans
   rien repeindre ; le halo reste donc posé une fois pour toutes, et c'est la
   taille du repère qui bat. */
.dcal .repere.phare{filter:drop-shadow(0 0 1.2px var(--c-poi,var(--accent)))
    drop-shadow(0 0 3.5px var(--c-poi,var(--accent)));
  transform-box:fill-box;transform-origin:center;
  animation:pulsePoi 1.4s ease-in-out infinite}
@keyframes pulsePoi{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){
  .dcal .repere.phare,#zones g.phare,#labels .lbl.phare text{animation:none}
}
@media (max-width:760px){.poi{max-width:88%;bottom:12px}}

.scalebar{position:absolute;left:60px;bottom:18px;font-size:11px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;gap:7px}
.scalebar i{display:block;height:6px;border:1px solid var(--ink-3);border-top:none}

.detail{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--surface);
  border-left:1px solid var(--line);transform:translateX(100%);display:flex;flex-direction:column;z-index:4;
  box-shadow:-16px 0 40px -26px rgba(10,14,18,.55);will-change:transform,opacity}
.detail.open{transform:none}
.detail-hd{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative}
/* Un crayon accolé au nom : c'est la marque du renommage partout dans la
   page — sur un calque de dessin comme sur une zone. */
.crayon{border:none;background:none;color:var(--ink-3);font-size:14px;line-height:1;
  padding:2px 4px;border-radius:var(--radius);vertical-align:middle;cursor:pointer}
.crayon:hover{color:var(--accent);background:var(--surface-2)}
/* Dans l'en-tête, le crayon est *dans* le titre, à la suite du dernier mot :
   posé après le bloc, il retombait sur la ligne des pastilles et semblait
   proposer de renommer le pavillon. Il n'hérite pas de la graisse du titre —
   un modèle de fiche peut le vouloir gras et large, une icône reste une
   icône. */
.detail-hd h2 .crayon{margin-left:6px;font-weight:400;letter-spacing:normal}
.detail-hd .close{position:absolute;top:14px;right:14px;color:var(--ink-3);font-size:18px;line-height:1;padding:4px}
/* Le nom d'une fiche et la marque qui l'accompagne tiennent sur une ligne, et
   se séparent en deux quand le nom prend toute la place : c'est le seul
   arbitrage à rendre, et le retour à la ligne du flex le rend tout seul — il
   décide sur la largeur naturelle du nom, avant de la comprimer. Un nom court
   garde donc son logo à côté de lui, un nom long le passe en dessous.

   La réserve de droite quitte le titre pour la ligne entière : elle tient le
   texte à l'écart du coin des actions, et la marque n'a pas plus à y aller. */
.detail-hd .hdNom{display:flex;flex-wrap:wrap;align-items:center;
  column-gap:12px;row-gap:2px;padding-right:26px}
.detail-hd .hdNom h2{padding-right:0;margin-right:auto}
/* Le logo — celui qu'on dépose sur une zone, celui qu'un stand tient de sa
   source. Sans cadre ni fond : l'image porte le sien quand elle en a un, et un
   blanc plaqué sur l'en-tête coloré d'un modèle y faisait une étiquette
   rapportée. Contenu plutôt que découpé — un logo tronqué n'est plus le logo.

   La hauteur est celle d'une vignette qu'on regarde, et non d'une puce posée
   à côté d'un mot : un logo se lit, et le premier essai, haut comme deux
   lignes de titre, ne le donnait pas à lire. Un logo en largeur ne tient donc
   plus à côté d'un nom un peu long — il rejoint alors la ligne du numéro, où
   la page le pose et le borne, faute pour la feuille de connaître la longueur
   d'un numéro de stand. */
.detail-hd .logoZone{width:auto;height:auto;object-fit:contain;
  max-width:min(300px,100%);max-height:72px}
/* Sur la ligne du nom, la marque est un élément de la ligne flex, qui la
   replie sous le nom quand elle n'y tient pas — c'est ce repli que la page
   guette pour la déménager. Le « :not » de chaque règle laisse l'attribut
   « hidden » faire son office quel que soit l'ordre de la feuille.

   Elle s'y pose au milieu de ce que le nom laisse, plutôt que collée contre lui
   avec un vide à droite : un nom court lui donnait l'air d'un mot de plus
   accroché au titre. Le centrage tient à deux marges automatiques — celle que
   le nom porte à sa droite, celle que la marque porte à la sienne — qui se
   partagent à parts égales ce qui reste de la ligne. */
.detail-hd .hdNom > .logoZone:not([hidden]){display:block;margin:0 auto 0 0}
/* Sur la ligne du numéro, elle suit les pastilles dans le fil du texte, alignée
   sur leur milieu : la ligne s'ouvre à sa hauteur plutôt que de s'en ajouter
   une. Pas de marge automatique ici — elle se range derrière le numéro, et non
   au milieu de ce qu'il laisse. */
.detail-hd .hdBadges > .logoZone:not([hidden]){display:inline-block;
  vertical-align:middle;margin:0 0 0 10px}
/* La taille du nom vit en variable sur l'en-tête, et non sur le titre : le
   numéro de stand s'y accorde, et il n'est pas dans le titre. Chaque modèle de
   fiche redéfinit la variable au lieu de la taille — sur le titre seul, le
   numéro n'en aurait rien su. */
.detail-hd{--titre:19px}
.detail-hd h2{font-family:"Archivo",sans-serif;font-size:var(--titre);letter-spacing:-.02em;
  margin:8px 0 6px;text-wrap:balance;padding-right:26px}
.badge{display:inline-flex;gap:6px;font-size:11px;padding:3px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
/* Le numéro de stand se lit de loin : c'est par lui qu'on se repère sur le
   plan, et onze pixels le rendaient plus discret que la mention qui
   l'accompagne. Il vaut quatre cinquièmes du nom, sur tous les modèles — d'où
   le poids de ce sélecteur, qui doit passer devant ceux qui règlent la taille
   des pastilles modèle par modèle. */
.detail-hd .hdBadges .badge.code{font-size:calc(var(--titre) * .8)}
/* Un nouvel exposant se signale à côté de son emplacement. La pastille reprend
   l'accent de la page plutôt qu'une couleur à elle : c'est une distinction, pas
   une alerte, et une teinte de plus ferait un troisième langage sur le plan
   après celui des zones. Le texte est de la fonte du corps — un numéro de stand
   se lit en mono, une mention se lit comme une phrase. */
.badge.neuf{background:var(--accent-soft);color:var(--accent);font-family:inherit;
  font-weight:600;margin-left:6px}
/* Le retour vers la liste des sociétés d'un stand partagé. Une pastille et non
   un bouton d'action : elle dit d'abord un fait — on en regarde une parmi
   plusieurs — et le clic n'est que la suite logique. */
.badge.part{font-family:inherit;margin-left:6px;cursor:pointer;
  border:1px solid var(--line-strong)}
.badge.part:hover{color:var(--ink);border-color:var(--ink-3)}
/* « Affiché : oui/non » — l'interrupteur d'une zone organisateur, en
   administration seulement. Une pastille comme les autres, car c'est d'abord
   un état qu'on lit ; la puce qui la précède en donne la réponse de loin, sans
   relire le mot. */
.badge.bascule{font-family:inherit;margin-left:6px;cursor:pointer;
  align-items:center;border:1px solid var(--line-strong)}
.badge.bascule::before{content:"";width:7px;height:7px;border-radius:50%;
  background:var(--accent)}
.badge.bascule[aria-pressed="false"]{color:var(--ink-3)}
.badge.bascule[aria-pressed="false"]::before{background:var(--ink-3)}
.badge.bascule:hover{color:var(--ink);border-color:var(--ink-3)}
/* Les sociétés d'un stand partagé, dans la fenêtre de choix. Un rang par
   société — jusqu'à une douzaine sur les plus peuplés — et rien d'autre que
   leur nom : celle qui loue le stand vient en tête, ce qui la dit assez. */
.expos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.expos button{display:flex;width:100%;align-items:baseline;gap:9px;text-align:left;
  padding:9px 11px;border:1px solid transparent;border-radius:5px;
  background:var(--surface-2);font-size:13.5px;color:var(--ink)}
.expos button:hover{border-color:var(--line-strong)}
.expos .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-bd{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:15px}
/* Les deux moitiés de la fiche — ce qu'est l'exposant, ce qu'il anime — ne
   sont des blocs que là où elles se rangent côte à côte. Partout ailleurs
   elles s'effacent, et leurs champs se suivent comme s'ils étaient seuls. */
.cInfos,.cConf{display:contents}
/* Deux onglets quand la fiche est trop étroite pour tout montrer d'un coup :
   ce qu'est l'exposant, puis ce qu'il anime. Ils ne paraissent que s'il y a
   les deux, et s'effacent dès que la fiche s'élargit — deux colonnes disent
   alors la même chose sans faire choisir. */
/* Deux libellés posés côte à côte ne se donnaient pas pour un bouton : on les
   lisait comme un titre, et le programme restait derrière un onglet que
   personne n'appuyait. D'où l'interrupteur — une piste creuse, la moitié
   active en relief — que tout le monde reconnaît, et le nombre en pastille
   d'accent qui dit qu'il y a quelque chose à voir de ce côté. */
.onglets{display:flex;gap:3px;margin:12px 18px 0;padding:3px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px}
.onglets[hidden]{display:none}
.ong{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.ong:hover{color:var(--ink)}
.ong[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);
  box-shadow:0 2px 10px -4px var(--accent)}
/* La pastille est pleine, pas teintée : c'est elle qui doit attraper l'œil
   depuis l'onglet qu'on ne regarde pas. Sur l'onglet actif, où elle se
   poserait sur son propre aplat, elle s'inverse. */
.ong .n{min-width:19px;padding:1px 6px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-align:center}
.ong[aria-selected="true"] .n{background:var(--accent-ink);color:var(--accent)}
@media (max-width:1099.98px){
  /* le trait de l'en-tête passerait juste au-dessus des onglets */
  .detail.deux .detail-hd{border-bottom:none}
  .detail.deux[data-onglet="prog"] .cInfos{display:none}
  .detail.deux:not([data-onglet="prog"]) .cConf{display:none}
  /* l'onglet nomme déjà le programme, le libellé du champ ferait doublon */
  .detail.deux[data-onglet="prog"] .cConf > .field > .eyebrow{display:none}
}
/* Un exposant qui tient cinq conférences repoussait son adresse et ses
   contacts loin sous la ligne de flottaison. Quand il en tient, la fiche
   s'élargit et les met en regard : l'exposant à gauche, son programme à
   droite. Elle n'y consent qu'au-delà de 1100 px — plus étroite, elle
   mangerait le plan qu'elle sert, et les onglets prennent le relais. */
@media (min-width:1100px){
  .onglets{display:none}
  .detail.deux{width:min(640px,56vw)}
  .detail.deux .detail-bd{display:grid;align-content:start;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px 20px}
  .detail.deux .cInfos{grid-column:1;display:flex;flex-direction:column;gap:15px}
  .detail.deux .cConf{grid-column:2;display:flex;flex-direction:column}
  .detail.deux .acts{grid-column:1/-1}
}
/* Une fiche a deux blocs — ce qu'elle décrit, ce qu'elle programme — et l'un
   des deux est souvent vide : une zone sans description, un stand sans
   conférence. Vide, il reste un élément de la colonne, et l'écart qui le
   sépare du suivant se lisait comme une marge de trop en haut de la fiche. */
.detail-bd > .cInfos:empty,.detail-bd > .cConf:empty{display:none}
.field{display:flex;flex-direction:column;gap:3px}
.field .v{font-size:14px;line-height:1.45}
.field .v a{color:var(--accent)}
/* Une valeur multiple s'écrit en lignes. Les pastilles convenaient à des codes
   de trois caractères ; les libellés sont des phrases. */
.field .v .ligne{display:block}
.field .v .ligne + .ligne{margin-top:3px}
/* Une thématique de la fiche mène aux exposants qui la partagent : elle se
   souligne au survol pour le dire, mais garde la graisse et l'alignement des
   autres valeurs — c'en est une, pas un bouton posé dans la fiche. */
.field .v .ligne.theme{width:100%;text-align:left;color:var(--accent)}
.field .v .ligne.theme:hover{text-decoration:underline}
/* La description d'une zone, écrite dans un éditeur : elle porte ses propres
   paragraphes et ses propres listes, là où tous les autres champs tiennent en
   une ligne. Ses marges extérieures reviennent au champ, qui espace déjà. */
.field .v .riche > *:first-child{margin-top:0}
.field .v .riche > *:last-child{margin-bottom:0}
.field .v .riche p{margin:0 0 .55em}
.field .v .riche ul,.field .v .riche ol{margin:0 0 .55em;padding-left:1.25em}
.field .v .riche li{margin:0 0 .2em}
/* Programme d'une zone : une vignette par conférence, l'heure d'abord puisque
   c'est par elle qu'on se repère, et un filet de la couleur de son type. */
.prog{display:flex;flex-direction:column;gap:7px;margin-top:2px}
/* Le jour reste collé en haut pendant qu'on parcourt le programme : une zone
   en aligne parfois vingt-trois sur trois jours, et savoir lequel on lit
   compte autant que l'heure. */
/* Le fond doit couvrir aussi la marge haute du conteneur — seize pixels —
   sans quoi la vignette suivante transparaît au-dessus du libellé collé. */
.prog .jour{position:sticky;top:-16px;z-index:1;
  margin:4px 0 3px;padding:16px 0 6px;background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line-strong)}
.prog .jour:first-child{margin-top:-10px}
.prog .conf{display:flex;flex-direction:column;gap:2px;padding:7px 9px;width:100%;
  text-align:left;background:var(--surface-2);border:none;
  border-radius:var(--radius);border-left:2px solid var(--tc,var(--line-strong));
  cursor:pointer;transition:background .15s}
.prog .conf:hover{background:var(--line)}
.prog .conf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* le type d'une conférence, dans sa couleur Eventmaker */
.conf-type{display:inline-block;margin-bottom:4px;padding:3px 9px;border-radius:999px;
  font-size:11px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--tc,var(--ink-2));border:1px solid var(--tc,var(--line))}
.prog .h{font-size:11.5px;font-weight:600;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace}
.prog .t{font-size:13px;line-height:1.35;color:var(--ink)}
.prog .ty{font-size:11px;color:var(--ink-3)}
/* Les exposants qui tiennent une conférence. Le nom d'abord, son emplacement
   au bout : c'est un rang qu'on lit, puis qu'on suit jusqu'à la fiche. */
.expos{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.expo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  width:100%;padding:7px 9px;text-align:left;background:var(--surface-2);
  border-radius:var(--radius);transition:background .15s}
button.expo:hover{background:var(--line)}
.expo .n{font-size:13px;line-height:1.35;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.expo .c{flex:none;font-size:11px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace}
/* Un stand hors du plan se lit, mais ne mène nulle part : rien ne doit le
   faire passer pour un bouton. */
.expo.statique{background:none;padding:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:var(--radius);font-size:12.5px;font-weight:500;border:1px solid var(--line)}
.btn:hover{border-color:var(--line-strong)}

/* ------------------------------------------------------------
   Modèles de fiche

   Une même fiche, plusieurs écritures : l'exploitant choisit depuis les
   réglages celle qui va à son salon, et le choix part aux visiteurs avec le
   reste de la configuration.

   Un modèle redéfinit d'abord les jetons de couleur sur la fiche elle-même —
   le reste de la feuille les lit déjà, si bien qu'une pastille, un bouton ou
   une vignette de conférence suivent sans qu'on les nomme — puis n'écrit à la
   main que sa signature : un filigrane, une perforation, un rail.

   Les sélecteurs partent de la classe et non de « #detail » : le même
   habillage sert à la fiche du plan et à son aperçu dans les réglages, qui
   porte les mêmes classes en réduction.
   ------------------------------------------------------------ */

/* Grille — l'en-tête est un aplat de la couleur du salon, le numéro du stand y
   est peint en grand derrière le nom, et les champs se rangent entre des
   filets pleins plutôt que dans du vide.

   L'aplat était d'encre, et le modèle ne bougeait pas d'un ton à l'autre : on
   choisissait une couleur au nuancier sans que rien ne s'en ressente. L'encre
   reste ce qui trace — filets, cadres, ligne retournée — et la couleur prend
   ce qui s'emplit. « --accent-ink » suit l'aplat : noir sur un jaune, blanc
   sur un bleu. */
.modele-grille{--radius:0;border-left:2px solid var(--ink)}
.modele-grille .detail-hd{background:var(--accent-base);border-bottom:none;overflow:hidden}
.modele-grille .detail-hd::after{content:attr(data-code);position:absolute;right:-6px;bottom:-26px;
  font-family:"Archivo",sans-serif;font-weight:700;font-size:78px;line-height:1;
  letter-spacing:-.06em;color:var(--accent-ink);opacity:.16;pointer-events:none}
/* Le contenu passe devant le filigrane. Ce qui se cale sur un coin de
   l'en-tête en est excepté : le bloc des commandes de la fiche, et la croix
   seule des deux tiroirs, qui n'ont pas de bloc. Une position relative les
   renvoyait dans le fil du texte, par-dessus l'intitulé. */
.modele-grille .detail-hd > *:not(.hdActs,.close){position:relative;z-index:1}
.modele-grille .detail-hd :is(.hdActs,.close){z-index:2}
.modele-grille .detail-hd{--titre:22px}
.modele-grille .detail-hd h2{color:var(--accent-ink);font-weight:700;
  text-transform:uppercase;line-height:1.1}
.modele-grille .detail-hd .eyebrow{color:var(--accent-ink);opacity:.65}
.modele-grille .marque,.modele-grille .close,.modele-grille .crayon{color:var(--accent-ink);
  border-color:color-mix(in srgb,var(--accent-ink) 38%,transparent);background:none}
.modele-grille .detail-hd .badge{border-radius:0;background:var(--accent-ink);
  color:var(--accent-base);font-weight:600}
/* Le nouvel exposant ne peut pas reprendre la couleur du salon : il la porte
   déjà sous lui. C'est l'encre des filets qui le marque. */
.modele-grille .detail-hd .badge.neuf{background:var(--ink);color:var(--surface)}
.modele-grille .detail-bd{gap:0}
.modele-grille .field{padding:11px 0;border-bottom:1px solid var(--ink);gap:5px}
.modele-grille .field .eyebrow{color:var(--ink);font-weight:700}
.modele-grille .prog .conf{background:none;border-radius:0;border-left:3px solid var(--ink);padding-left:10px}
.modele-grille .acts{padding-top:15px}
.modele-grille .btn{border:2px solid var(--ink);border-radius:0;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.07em;padding:9px 12px}

/* Console — le salon vu depuis la régie : chasse fixe, libellés en invite de
   commande, balayage d'écran en fond. Le phosphore n'a pas de couleur à lui :
   il prend celle du salon, et un plan bleu donne une console bleue. */
.modele-console{color:var(--ink);
  --nuit:#04070A;
  --surface:color-mix(in srgb,var(--accent-base) 9%,var(--nuit));
  --surface-2:color-mix(in srgb,var(--accent-base) 16%,var(--nuit));
  --line:color-mix(in srgb,var(--accent-base) 26%,var(--nuit));
  --line-strong:color-mix(in srgb,var(--accent-base) 42%,var(--nuit));
  --ink:color-mix(in srgb,var(--accent-clair) 80%,#FFFFFF);
  --ink-2:color-mix(in srgb,var(--accent-clair) 72%,var(--nuit));
  --ink-3:color-mix(in srgb,var(--accent-clair) 48%,var(--nuit));
  --accent:var(--accent-clair);
  --accent-soft:color-mix(in srgb,var(--accent-base) 30%,var(--nuit));
  --accent-ink:var(--nuit);--radius:0;
  font-family:"IBM Plex Mono",monospace;
  background-image:repeating-linear-gradient(180deg,
    color-mix(in srgb,var(--accent-clair) 20%,transparent) 0 1px,transparent 1px 4px)}
.modele-console .detail-hd{border-bottom-style:dashed}
.modele-console .detail-hd{--titre:17px}
.modele-console .detail-hd h2{font-family:"IBM Plex Mono",monospace;font-weight:600;
  letter-spacing:-.01em}
.modele-console .detail-hd h2::before{content:"▍";color:var(--accent);margin-right:7px}
.modele-console .eyebrow{font-family:"IBM Plex Mono",monospace;letter-spacing:.1em}
.modele-console .field .eyebrow::before{content:"$ ";color:var(--accent)}
.modele-console .field .v{font-size:13px}
.modele-console .btn{color:var(--accent)}
.modele-console .acts .btn:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Billet — le stand comme une place réservée : bandeau d'accent, numéro en
   gros caractères comptables, et la ligne perforée du talon qu'on détache. */
.modele-billet{overflow:hidden}
.detail.modele-billet{border-radius:16px 0 0 16px}
.modele-billet .detail-hd{background:var(--accent);border-bottom:none}
.modele-billet .detail-hd h2{color:var(--accent-ink)}
/* La place du numéro ne se réserve que là où il y en a un : une zone n'en
   porte pas, le parcours et l'itinéraire non plus, et la ligne du nom y
   laissait cent dix-huit pixels de vide à droite. Elle porte sur la ligne
   entière, marque comprise : sur le seul titre, la marque serait allée se
   ranger sous le numéro. */
.modele-billet .detail-hd[data-code]:not([data-code=""]) :is(.hdNom,.hdBadges){padding-right:118px}
.modele-billet .detail-hd .eyebrow{color:var(--accent-ink);opacity:.72}
.modele-billet .detail-hd::after{content:attr(data-code);position:absolute;right:18px;bottom:12px;
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:26px;letter-spacing:-.02em;
  color:var(--accent-ink);pointer-events:none}
.modele-billet .marque,.modele-billet .close,.modele-billet .crayon{color:var(--accent-ink);
  border-color:rgba(255,255,255,.4);background:none}
.modele-billet .detail-hd .badge{background:rgba(255,255,255,.2);color:var(--accent-ink)}
.modele-billet .detail-hd .badge.neuf{background:var(--accent-ink);color:var(--accent)}
.modele-billet .detail-bd{border-top:2px dashed var(--line-strong);padding-top:20px}
.modele-billet .field .v{font-family:"IBM Plex Mono",monospace;font-size:13px}
.modele-billet .btn{border-radius:999px;padding:8px 14px}
.modele-billet .acts .btn:first-child{background:var(--accent);color:var(--accent-ink);
  border-color:transparent;font-weight:600}

/* Magazine — le catalogue papier du salon : serif à fort contraste, libellés
   en italique, le numéro du stand en chiffre d'ouverture, des filets à la
   place des aplats. */
.modele-magazine .detail-hd{padding:28px 22px 18px;border-bottom:none}
.modele-magazine .detail-hd::before{content:attr(data-code);position:absolute;top:2px;right:14px;
  font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:66px;line-height:1;
  color:var(--surface-2);pointer-events:none}
/* Le contenu passe devant le filigrane. Ce qui se cale sur un coin de
   l'en-tête en est excepté : le bloc des commandes de la fiche, et la croix
   seule des deux tiroirs, qui n'ont pas de bloc. Une position relative les
   renvoyait dans le fil du texte, par-dessus l'intitulé. */
.modele-magazine .detail-hd > *:not(.hdActs,.close){position:relative;z-index:1}
.modele-magazine .detail-hd :is(.hdActs,.close){z-index:2}
.modele-magazine .detail-hd{--titre:30px}
.modele-magazine .detail-hd h2{font-family:"Fraunces",Georgia,serif;font-weight:600;
  line-height:1.06;letter-spacing:-.02em;margin:14px 0 12px}
.modele-magazine .detail-hd .eyebrow{letter-spacing:.32em}
.modele-magazine .detail-hd .badge{background:none;padding:0;font-family:"Fraunces",Georgia,serif;
  font-style:italic;font-size:13px;color:var(--ink-2)}
.modele-magazine .detail-hd .badge.neuf{background:none;color:var(--accent);margin-left:12px}
.modele-magazine .detail-bd{padding:4px 22px 24px;gap:18px}
.modele-magazine .detail-bd::before{content:"";display:block;flex:none;grid-column:1/-1;
  width:52px;height:3px;background:var(--ink)}
.modele-magazine .field .eyebrow{font-family:"Fraunces",Georgia,serif;font-style:italic;
  font-size:12.5px;letter-spacing:0;text-transform:none}
.modele-magazine .field .v{font-size:15px;line-height:1.55}
.modele-magazine .prog .conf{background:none;border-left:none;border-top:1px solid var(--line);
  border-radius:0;padding:9px 0 3px}
.modele-magazine .prog .conf .t{font-family:"Fraunces",Georgia,serif;font-size:14.5px;line-height:1.3}
.modele-magazine .acts{gap:20px}
.modele-magazine .btn{border:none;border-bottom:2px solid var(--ink);border-radius:0;padding:5px 0;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}

/* Brut — trait de trois pixels, ombre portée dure, aplat franc. Elle ne se
   fond dans rien : le noir et le papier ne bougent pas d'un thème à l'autre,
   et l'aplat de l'en-tête est la couleur du salon, prise telle quelle. */
.modele-brut{color:var(--ink);
  --surface:#FFFDF5;--surface-2:#F1EEE0;--line:#111111;--line-strong:#111111;
  --ink:#111111;--ink-2:#3A3A34;--ink-3:#57574D;
  --accent:var(--accent-base);
  --accent-soft:color-mix(in srgb,var(--accent-base) 15%,#FFFDF5);
  --radius:0;border-left:3px solid #111}
.modele-brut .detail-hd{background:var(--accent-base);border-bottom:3px solid #111;
  color:var(--accent-ink)}
.modele-brut .detail-hd{--titre:22px}
.modele-brut .detail-hd h2{color:var(--accent-ink);font-weight:700;
  text-transform:uppercase;line-height:1.08}
.modele-brut .detail-hd .eyebrow{color:var(--accent-ink);opacity:.75}
.modele-brut .marque,.modele-brut .close,.modele-brut .crayon{border:2px solid #111;border-radius:0;
  color:#111;background:#FFFDF5}
.modele-brut .detail-hd .badge{background:#111;color:#FFFDF5;border-radius:0;font-weight:600}
.modele-brut .detail-hd .badge.neuf{background:#FFFDF5;color:#111;border:2px solid #111;
  text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.modele-brut .field .eyebrow{align-self:flex-start;background:#111;color:#FFFDF5;padding:3px 7px}
.modele-brut .prog .conf{background:var(--accent-soft);border:2px solid #111;
  border-left:7px solid var(--accent-base);border-radius:0}
.modele-brut .prog .jour{border-bottom-width:2px}
.modele-brut .btn{border:3px solid #111;border-radius:0;background:#fff;color:#111;font-weight:700;
  text-transform:uppercase;font-size:11px;letter-spacing:.05em;box-shadow:3px 3px 0 #111}
.modele-brut .acts .btn:first-child{background:var(--accent-base);color:var(--accent-ink)}

/* Verre — la fiche cesse d'être une feuille posée sur le plan : elle devient
   un bloc de la couleur du salon, et chaque champ un panneau qui laisse
   passer le fond. Le dégradé se compose des déclinaisons de l'accent, donc de
   la couleur choisie dans les réglages. */
.modele-verre{color:var(--ink);--surface:rgba(255,255,255,.1);--surface-2:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.2);--line-strong:rgba(255,255,255,.34);
  --ink:#FFFFFF;--ink-2:rgba(255,255,255,.84);--ink-3:rgba(255,255,255,.62);
  --accent:#FFFFFF;--accent-soft:rgba(255,255,255,.22);--accent-ink:var(--accent-fort);
  border-left-color:rgba(255,255,255,.28);
  background-image:radial-gradient(125% 95% at 10% 0%,var(--accent-clair) 0%,
    var(--accent-base) 46%,var(--accent-fort) 100%)}
.detail.modele-verre{border-radius:20px 0 0 20px}
.modele-verre .detail-hd{border-bottom-color:rgba(255,255,255,.22)}
.modele-verre .detail-hd h2{font-weight:700;letter-spacing:-.025em}
.modele-verre .marque,.modele-verre .close,.modele-verre .crayon{background:rgba(255,255,255,.14)}
.modele-verre .detail-hd .badge.neuf{background:#fff;color:var(--accent-fort)}
.modele-verre .detail-bd{gap:9px}
.modele-verre .field{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);
  border-radius:13px;padding:11px 14px;gap:4px}
.modele-verre .prog .conf{border-left-color:rgba(255,255,255,.5);border-radius:10px}
.modele-verre .prog .jour{background:none;border-bottom-color:rgba(255,255,255,.4)}
.modele-verre .btn{border-radius:999px;border-color:rgba(255,255,255,.45);padding:8px 15px}
.modele-verre .acts .btn:first-child{background:#fff;color:var(--accent-fort);
  border-color:transparent;font-weight:700}

/* Kraft — la fiche d'exposant telle qu'on la remplissait avant : carton
   recyclé, machine à écrire, et la mention « nouvel exposant » tamponnée de
   travers. Le papier est le papier ; l'encre du tampon et celle des filets
   sont la couleur du salon, assombrie de ce qu'il faut pour tenir dessus. */
.modele-kraft{color:var(--ink);
  --papier:#E7DBC2;
  --surface:var(--papier);--surface-2:#DBCEB0;--line:#C3B18C;--line-strong:#A9946A;
  --ink:#3B3022;--ink-2:#6B5B3F;--ink-3:#7A6849;
  --encre:color-mix(in srgb,var(--accent-fort) 86%,#3B3022);
  --accent:var(--encre);--accent-soft:#D3CBB1;--accent-ink:#F6F1E3;--radius:2px;
  background-image:repeating-linear-gradient(180deg,rgba(120,95,60,.055) 0 1px,transparent 1px 5px)}
.modele-kraft .detail-hd{--titre:19px}
.modele-kraft .detail-hd h2{font-family:"Courier Prime",monospace;font-weight:700;
  text-transform:uppercase;letter-spacing:.01em}
.modele-kraft .eyebrow{font-family:"Courier Prime",monospace;letter-spacing:.16em}
.modele-kraft .field .v{font-family:"Courier Prime",monospace;font-size:13px}
.modele-kraft .detail-hd .badge{font-family:"Courier Prime",monospace;border-radius:0;
  background:none;border:1px solid var(--line-strong);color:var(--ink-2)}
.modele-kraft .detail-hd .badge.neuf{background:none;border:2px solid var(--encre);color:var(--encre);
  border-radius:2px;font-family:"Courier Prime",monospace;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;transform:rotate(-5deg);margin-left:10px}
.modele-kraft .prog .conf{background:rgba(255,252,244,.55);border-left:3px solid var(--encre);border-radius:0}
.modele-kraft .btn{border:1px dashed var(--line-strong);border-radius:0;
  font-family:"Courier Prime",monospace;font-weight:700}
.modele-kraft .acts .btn:first-child{background:var(--encre);color:var(--papier);border-style:solid}

/* Signalétique — le panneau du hall posé dans la fiche : aplat franc,
   capitales, flèche, et le gros filet qui souligne un panneau de direction. La
   couleur du salon est celle du panneau — on lit un stand comme on lit une
   direction, de loin et vite. */
.modele-signal{color:var(--ink);
  --surface:#12171B;--surface-2:#1A2128;--line:#232B32;--line-strong:#3A444D;
  --ink:#F2F5F7;--ink-2:#B7C0C7;--ink-3:#8A959E;
  --accent:var(--accent-clair);
  --accent-soft:color-mix(in srgb,var(--accent-base) 30%,#12171B);
  /* « --accent-ink » reste celui de la page : c'est l'encre qui s'écrit sur
     l'aplat du panneau, et elle vire au clair ou au sombre selon le ton
     choisi. La figer ici rendait un panneau jaune illisible. */
  --radius:2px}
.modele-signal .detail-hd{background:var(--accent-base);
  border-bottom:4px solid var(--accent-fort);color:var(--accent-ink)}
.modele-signal .detail-hd{--titre:20px}
.modele-signal .detail-hd h2{color:var(--accent-ink);font-weight:700;
  text-transform:uppercase;line-height:1.12}
.modele-signal .detail-hd h2::before{content:"→ ";font-weight:500}
.modele-signal .detail-hd .eyebrow{color:var(--accent-ink);opacity:.78}
.modele-signal .marque,.modele-signal .close,.modele-signal .crayon{color:var(--accent-ink);
