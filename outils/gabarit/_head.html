  border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent);background:none}
.modele-signal .detail-hd .badge{background:var(--accent-ink);color:var(--accent-base);font-weight:600}
.modele-signal .detail-hd .badge.neuf{background:var(--accent-clair);color:var(--accent-ink);
  text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.modele-signal .detail-bd{gap:0}
.modele-signal .field{padding:11px 0;border-bottom:1px solid var(--line);gap:4px}
.modele-signal .field.court .v{text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.modele-signal .prog .conf{border-left:4px solid var(--accent-clair)}
.modele-signal .prog .conf .h{color:var(--accent-clair)}
.modele-signal .acts{padding-top:15px}
.modele-signal .btn{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.modele-signal .acts .btn:first-child{background:var(--ink);color:#12171B;border-color:var(--ink)}

/* Chronologie — un exposant qui tient cinq conférences a une journée, pas une
   liste : les heures se suivent le long d'un rail, et le reste de la fiche se
   range en colonne pour leur laisser la vedette. */
.modele-chrono .detail-hd{border-bottom:none}
.modele-chrono .detail-hd h2{font-weight:700;letter-spacing:-.025em}
.modele-chrono .detail-bd{gap:11px}
.modele-chrono .field{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:baseline}
.modele-chrono .field .eyebrow{font-family:"IBM Plex Mono",monospace;letter-spacing:.05em;text-align:right}
.modele-chrono .field.prog-bloc{display:block;margin-top:6px;padding-top:14px;
  border-top:1px solid var(--line)}
.modele-chrono .prog{position:relative;padding-left:22px;gap:0;margin-top:10px}
.modele-chrono .prog::before{content:"";position:absolute;left:5px;top:8px;bottom:12px;width:2px;
  background:linear-gradient(var(--accent),var(--line))}
.modele-chrono .confRang{position:relative;padding-bottom:14px}
.modele-chrono .confRang::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;
  border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.modele-chrono .prog .conf{background:none;border-left:none;border-radius:0;padding:0}
.modele-chrono .prog .conf:hover{background:none;color:var(--accent)}
.modele-chrono .prog .conf .h{color:var(--accent)}
.modele-chrono .prog .jour{margin-left:-22px}
.modele-chrono .btn{border-radius:999px;padding:8px 15px}
.modele-chrono .acts .btn:first-child{background:var(--accent);color:var(--accent-ink);
  border-color:transparent;font-weight:600}

/* Nu — ni cadre, ni fond, ni libellés : une adresse se reconnaît sans qu'on
   écrive « adresse », et ce qui reste — la hiérarchie et le blanc — suffit à
   lire la fiche. Le programme garde le sien : lui seul ne se devine pas. */
.modele-nu{box-shadow:none;border-left-color:transparent}
.modele-nu .detail-hd{border-bottom:none;padding:30px 24px 4px}
.modele-nu .detail-hd .eyebrow{display:none}
.modele-nu .detail-hd{--titre:28px}
.modele-nu .detail-hd h2{font-weight:700;letter-spacing:-.035em;line-height:1.06;
  margin:0 0 12px}
.modele-nu .detail-hd .badge{background:none;padding:0;color:var(--ink-3);font-size:12.5px}
.modele-nu .detail-hd .badge.neuf{background:none;color:var(--accent);padding:0;margin-left:12px}
.modele-nu .detail-bd{padding:14px 24px 26px;gap:9px}
.modele-nu .field .eyebrow{display:none}
.modele-nu .field .v{color:var(--ink-2)}
.modele-nu .field.prog-bloc{margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.modele-nu .field.prog-bloc .eyebrow{display:block;margin-bottom:6px}
.modele-nu .prog .conf{background:none;border-left:none;border-radius:0;padding:0 0 8px}
.modele-nu .acts{gap:20px;margin-top:10px}
.modele-nu .btn{border:none;padding:0;color:var(--accent);font-weight:600;
  text-decoration:underline;text-underline-offset:5px}

/* ------------------------------------------------------------
   Modèles de liste

   Le modèle choisi ne s'arrête pas à la fiche. La liste des exposants est
   l'autre moitié de ce qu'on regarde, et souvent la première : un panneau de
   recherche ordinaire posé contre une fiche console ne fait pas un salon, il
   en fait deux. Chaque habillage a donc ici son pendant — même police, mêmes
   jetons de couleur, même parti pris — et la classe part sur le panneau en
   même temps que celle de la fiche.

   Même méthode que pour la fiche : on redéfinit d'abord les jetons sur le
   panneau — le reste de la feuille les lit déjà, si bien que la recherche, le
   compteur et les puces de critère suivent sans qu'on les nomme — puis on
   n'écrit à la main que la signature du modèle.

   « Sobre » n'a pas de classe : c'est la liste telle que la feuille la
   dessine, et le point de départ de tous les autres.

   Les sélecteurs partent de la classe et non de « #side » : la vignette des
   réglages porte les mêmes classes en réduction.
   ------------------------------------------------------------ */

/* Grille — l'aplat d'encre de la fiche devient ici le filet plein qui sépare
   deux lignes, et le stand retenu se retourne en négatif : le numéro peint
   sur la cloison, en clair sur le noir. */
.liste-grille{--radius:0;border-right-width:2px;border-right-color:var(--ink)}
/* La recherche est l'en-tête de la liste : elle prend l'aplat de couleur que
   la fiche prend en tête, et le champ s'y pose comme une case imprimée sur un
   bandeau — blanc, cerclé d'encre. */
.liste-grille .search{background:var(--accent-base);border-bottom:2px solid var(--ink);
  color:var(--accent-ink)}
.liste-grille .search :is(input,.champ){background:var(--surface);border-color:var(--ink);
  color:var(--ink)}
.liste-grille .search-field svg{color:var(--ink-3)}
.liste-grille .crit-btn{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.liste-grille .count{border-bottom:2px solid var(--ink);color:var(--ink);
  font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase}
.liste-grille .row{border-bottom:1px solid var(--ink)}
.liste-grille .row .code{border:1px solid var(--ink);border-radius:0;color:var(--ink);font-weight:600}
.liste-grille .row .nm{font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;
  text-transform:uppercase;letter-spacing:.01em}
.liste-grille .row[aria-current="true"]{background:var(--ink)}
.liste-grille .row[aria-current="true"] :is(.nm,.s,.hall){color:var(--surface)}
.liste-grille .row[aria-current="true"] .code{background:var(--surface);color:var(--ink);
  border-color:var(--surface)}
/* La ligne courante se lit en négatif : la puce du pavillon, qui s'appuyait
   sur un fond clair, n'a plus qu'un filet pour se tenir. */
.liste-grille .row[aria-current="true"] .hall{background:none;border:1px solid var(--surface)}
.liste-grille :is(.row .hall,.actifs .actif,.actifs .vider){border-radius:0}

/* Console — le sommaire lu depuis la régie : le phosphore du salon, la chasse
   fixe partout, et le curseur de bloc qui marque la ligne courante. */
.liste-console{color:var(--ink);
  --nuit:#04070A;
  --surface:color-mix(in srgb,var(--accent-base) 9%,var(--nuit));
  --surface-2:color-mix(in srgb,var(--accent-base) 16%,var(--nuit));
  --line:color-mix(in srgb,var(--accent-base) 26%,var(--nuit));
  --line-strong:color-mix(in srgb,var(--accent-base) 42%,var(--nuit));
  --ink:color-mix(in srgb,var(--accent-clair) 80%,#FFFFFF);
  --ink-2:color-mix(in srgb,var(--accent-clair) 72%,var(--nuit));
  --ink-3:color-mix(in srgb,var(--accent-clair) 48%,var(--nuit));
  --accent:var(--accent-clair);
  --accent-soft:color-mix(in srgb,var(--accent-base) 30%,var(--nuit));
  --accent-ink:var(--nuit);--radius:0;
  font-family:"IBM Plex Mono",monospace;
  background-image:repeating-linear-gradient(180deg,
    color-mix(in srgb,var(--accent-clair) 20%,transparent) 0 1px,transparent 1px 4px)}
.liste-console .search{border-bottom-style:dashed}
.liste-console .search :is(input,.champ){background:var(--surface-2);border-color:var(--line)}
/* Le gris de repos du thème s'éteint sur le noir de la régie : le compteur y
   reprend l'encre secondaire, qui, elle, tient. */
.liste-console .count{color:var(--ink-2);letter-spacing:.04em}
.liste-console .count::before{content:"› ";color:var(--accent)}
.liste-console .row{border-bottom-style:dashed}
.liste-console .row .nm{font-size:12.5px;font-weight:500}
/* La ligne courante ne se peint pas, elle se pointe : un curseur de bloc,
   comme celui qui précède le nom sur la fiche. */
.liste-console .row[aria-current="true"] .nm::before{content:"▍";color:var(--accent);margin-right:5px}
.liste-console :is(.row .hall,.actifs .actif,.actifs .vider){border-radius:0}

/* Billet — la recherche prend le bandeau d'accent du talon, et les lignes se
   détachent les unes des autres sur une perforation. */
.liste-billet .search{background:var(--accent);border-bottom:none;color:var(--accent-ink)}
.liste-billet .search :is(input,.champ){background:rgba(255,255,255,.2);border-color:transparent;
  border-radius:999px;color:var(--accent-ink)}
.liste-billet .search input::placeholder{color:var(--accent-ink);opacity:.7}
.liste-billet .search .champ{color:var(--accent-ink);opacity:.75}
.liste-billet .search-field svg{color:var(--accent-ink);opacity:.8}
.liste-billet .crit-btn{background:rgba(255,255,255,.2);border-color:transparent;
  border-radius:999px;color:var(--accent-ink)}
.liste-billet .count{border-bottom:2px dashed var(--line-strong);
  font-family:"IBM Plex Mono",monospace;font-size:11px}
.liste-billet .row{border-bottom:1px dashed var(--line-strong)}
.liste-billet .row .code{border-radius:999px;border-color:var(--line-strong);font-weight:600}
.liste-billet .row[aria-current="true"] .code{background:var(--accent);color:var(--accent-ink);
  border-color:var(--accent)}
.liste-billet .row .hall{border-radius:999px}

/* Magazine — le sommaire du catalogue : le numéro de stand en chiffre
   d'appel, séparé du nom par un filet, et pas un aplat pour marquer la page
   ouverte — un simple trait dans la marge. */
.liste-magazine .search{border-bottom:2px solid var(--ink)}
.liste-magazine .search :is(input,.champ){background:none;border-color:var(--line);border-radius:0}
.liste-magazine .count{border-bottom:1px solid var(--line);color:var(--ink-2);
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:12.5px}
.liste-magazine .row{padding:11px 16px}
.liste-magazine .row .code{border:none;border-right:1px solid var(--line);border-radius:0;
  background:none;padding:2px 7px 2px 0;text-align:left;color:var(--ink-3);
  font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:0;
  /* La case se taille sur la police du modèle — celle-ci — et sur son corps :
     le chiffre d'appel s'y tient, plutôt que de la déborder sur un salon aux
     numéros longs. L'approche resserre ce que le serif prend de plus que la
     chasse fixe, sans quoi la colonne des noms partirait vers la droite. */
  font-size:var(--caseF,11.5px);letter-spacing:-.02em}
.liste-magazine .row .nm{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:15px;
  line-height:1.15;letter-spacing:-.01em}
.liste-magazine .row .s{font-style:italic}
.liste-magazine .row[aria-current="true"]{background:none;box-shadow:inset 3px 0 0 var(--accent)}
.liste-magazine .row[aria-current="true"] .code{color:var(--accent)}
.liste-magazine .row .hall{background:none;font-family:"Fraunces",Georgia,serif;
  font-style:italic;font-size:11px}

/* Brut — le même trait de trois pixels, le même papier et le même noir que la
   fiche : la liste ne se fond pas davantage qu'elle dans le thème. */
.liste-brut{color:var(--ink);
  --surface:#FFFDF5;--surface-2:#F1EEE0;--line:#111111;--line-strong:#111111;
  --ink:#111111;--ink-2:#3A3A34;--ink-3:#57574D;
  --accent:var(--accent-base);
  --accent-soft:color-mix(in srgb,var(--accent-base) 15%,#FFFDF5);
  --radius:0;border-right:3px solid #111}
.liste-brut .search{background:var(--accent-base);border-bottom:3px solid #111}
.liste-brut .search :is(input,.champ){background:#FFFDF5;border:2px solid #111;color:#111}
.liste-brut .search-field svg{color:#111}
.liste-brut .crit-btn{background:#FFFDF5;border:2px solid #111;color:#111}
.liste-brut .count{border-bottom:3px solid #111;color:#111;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
.liste-brut .row{border-bottom:2px solid #111}
.liste-brut .row .code{border:2px solid #111;color:#111;font-weight:700}
.liste-brut .row .nm{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.01em}
.liste-brut .row[aria-current="true"]{background:var(--accent-base)}
.liste-brut .row[aria-current="true"] :is(.nm,.s){color:var(--accent-ink)}
.liste-brut .row[aria-current="true"] .code{background:#FFFDF5;color:#111;border-color:#111}
.liste-brut .row .hall{background:none;border:1px solid #111;border-radius:0}
.liste-brut .row[aria-current="true"] .hall{color:var(--accent-ink);border-color:var(--accent-ink)}
.liste-brut :is(.actifs .actif,.actifs .vider){border:2px solid #111;border-radius:0}

/* Verre — le panneau cesse d'être une colonne posée à côté du plan : il
   devient le même bloc de couleur que la fiche, et chaque ligne un carreau qui
   laisse passer le fond. */
.liste-verre{color:var(--ink);--surface:rgba(255,255,255,.1);--surface-2:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.2);--line-strong:rgba(255,255,255,.34);
  --ink:#FFFFFF;--ink-2:rgba(255,255,255,.84);--ink-3:rgba(255,255,255,.62);
  --accent:#FFFFFF;--accent-soft:rgba(255,255,255,.22);--accent-ink:var(--accent-fort);
  border-right-color:rgba(255,255,255,.28);
  background-image:radial-gradient(105% 60% at 10% 0%,var(--accent-clair) 0%,
    var(--accent-base) 46%,var(--accent-fort) 100%)}
.liste-verre .search :is(input,.champ){background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.2);border-radius:999px;color:#fff}
.liste-verre .search input::placeholder{color:rgba(255,255,255,.62)}
.liste-verre .crit-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);
  border-radius:999px;color:#fff}
/* Un carreau, et non une ligne : il lui faut de l'air autour. La marge se
   prend sur la liste et non sur la ligne — un bouton dont on desserre la
   largeur se rétracte sur son texte, et les carreaux se rangeaient en escalier
   au lieu de s'aligner. */
.liste-verre .list{padding:0 10px}
.liste-verre .row{margin:5px 0;padding:9px 12px;border-bottom:none;
  border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(255,255,255,.11)}
.liste-verre .row:hover{background:rgba(255,255,255,.2)}
.liste-verre .row[aria-current="true"]{background:rgba(255,255,255,.26);
  border-color:rgba(255,255,255,.5)}
.liste-verre .row .code{border-color:rgba(255,255,255,.4);border-radius:999px;color:#fff}
.liste-verre .row[aria-current="true"] .code{background:#fff;color:var(--accent-fort);
  border-color:transparent}
.liste-verre .row .hall{background:rgba(255,255,255,.18);border-radius:999px;color:#fff}

/* Kraft — le sommaire tapé à la machine sur le même carton que la fiche, les
   lignes séparées d'un pointillé de perforation. */
.liste-kraft{color:var(--ink);
  --papier:#E7DBC2;
  --surface:var(--papier);--surface-2:#DBCEB0;--line:#C3B18C;--line-strong:#A9946A;
  --ink:#3B3022;--ink-2:#6B5B3F;--ink-3:#7A6849;
  --encre:color-mix(in srgb,var(--accent-fort) 86%,#3B3022);
  --accent:var(--encre);--accent-soft:#D3CBB1;--accent-ink:#F6F1E3;--radius:2px;
  font-family:"Courier Prime",monospace;
  background-image:repeating-linear-gradient(180deg,rgba(120,95,60,.055) 0 1px,transparent 1px 5px)}
.liste-kraft .search{border-bottom:1px dashed var(--line-strong)}
.liste-kraft .search :is(input,.champ){background:rgba(255,252,244,.55);
  border-color:var(--line-strong);border-radius:0}
.liste-kraft .count{border-bottom:1px dashed var(--line-strong);
  font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.liste-kraft .row{border-bottom:1px dashed var(--line)}
.liste-kraft .row .code{border-color:var(--line-strong);border-radius:0;
  font-family:"Courier Prime",monospace;font-weight:700}
.liste-kraft .row .nm{font-family:"Courier Prime",monospace;font-size:12.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.01em}
.liste-kraft .row[aria-current="true"]{background:rgba(255,252,244,.55);
  box-shadow:inset 3px 0 0 var(--encre)}
.liste-kraft .row .hall{border-radius:0;font-family:"Courier Prime",monospace}

/* Signalétique — la liste devient le tableau de direction du hall : fond
   sombre, bandeau de couleur en tête, capitales et flèche devant chaque nom.
   On y lit un stand comme on lit une sortie. */
.liste-signal{color:var(--ink);
  --surface:#12171B;--surface-2:#1A2128;--line:#232B32;--line-strong:#3A444D;
  --ink:#F2F5F7;--ink-2:#B7C0C7;--ink-3:#8A959E;
  --accent:var(--accent-clair);
  --accent-soft:color-mix(in srgb,var(--accent-base) 30%,#12171B);
  --radius:2px}
.liste-signal .search{background:var(--accent-base);border-bottom:4px solid var(--accent-fort);
  color:var(--accent-ink)}
.liste-signal .search :is(input,.champ){color:var(--accent-ink);
  background:color-mix(in srgb,var(--accent-ink) 18%,transparent);
  border-color:color-mix(in srgb,var(--accent-ink) 34%,transparent)}
.liste-signal .search input::placeholder{color:var(--accent-ink);opacity:.7}
.liste-signal .search .champ{color:var(--accent-ink);opacity:.75}
.liste-signal .search-field svg{color:var(--accent-ink);opacity:.8}
.liste-signal .crit-btn{color:var(--accent-ink);
  background:color-mix(in srgb,var(--accent-ink) 18%,transparent);
  border-color:color-mix(in srgb,var(--accent-ink) 34%,transparent)}
.liste-signal .count{color:var(--ink-2);font-size:10.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase}
.liste-signal .row .code{background:var(--surface-2);border-color:var(--line-strong);
  border-radius:2px;color:var(--ink);font-weight:600}
.liste-signal .row .nm{font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.liste-signal .row .nm::before{content:"→ ";color:var(--accent-clair);font-weight:500}
.liste-signal .row[aria-current="true"]{box-shadow:inset 4px 0 0 var(--accent-base)}
.liste-signal .row[aria-current="true"] .code{background:var(--accent-base);color:var(--accent-ink);
  border-color:transparent}

/* Chronologie — le rail de la fiche traverse la liste : les numéros de stand
   s'alignent à droite comme des heures, chacun marqué d'un point sur la ligne
   de temps, et la ligne courante s'y allume plutôt que de se peindre. */
.liste-chrono .search{border-bottom:none}
.liste-chrono .row{position:relative;border-bottom:none;padding:8px 16px}
/* Le rail se reprend d'une ligne à l'autre plutôt que de courir sur la liste
   entière : tracé sur le cadre qui défile, il serait resté en place et aurait
   quitté l'écran dès la deuxième page de résultats. Seule la première ligne
   porte le dégradé qui l'allume, comme sur la fiche. */
.liste-chrono .row::after{content:"";position:absolute;top:0;bottom:0;width:2px;
  left:calc(16px + var(--caseL,48px) + 4px);background:var(--line)}
.liste-chrono .row:first-child::after{background:linear-gradient(var(--accent),var(--line))}
/* Le rail court dans la gouttière, entre la case du numéro et le nom : sa
   position se déduit donc de la case, dont la largeur se règle sur le plus
   long numéro du salon. Figée à 48 px, elle traversait les numéros doubles. */
.liste-chrono .row::before{content:"";position:absolute;top:50%;z-index:1;
  left:calc(16px + var(--caseL,48px) - 1px);
  width:12px;height:12px;margin-top:-6px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-strong)}
.liste-chrono .row:hover::before{border-color:var(--accent)}
.liste-chrono .row[aria-current="true"]::before{background:var(--accent);border-color:var(--accent)}
.liste-chrono .row .code{background:none;border:none;border-radius:0;padding:0 2px 0 0;
  color:var(--ink-3);letter-spacing:.05em;text-align:right}
/* Le point empiète sur la gouttière : le nom se décale de sa largeur, sinon
   il commencerait dessous. */
.liste-chrono .row > span:last-child{padding-left:18px}
.liste-chrono .row .nm{font-weight:600;letter-spacing:-.02em}
.liste-chrono .row[aria-current="true"]{background:none}
.liste-chrono .row[aria-current="true"] .nm{color:var(--accent)}
.liste-chrono :is(.row .hall,.actifs .actif,.actifs .vider){border-radius:999px}

/* Nu — ni cadre, ni case, ni aplat : un nom se reconnaît sans qu'on l'encadre.
   Le numéro reste — c'est ce qu'on est venu chercher — mais rangé au bout de
   la ligne, à sa place de référence plutôt que d'étiquette. */
.liste-nu{border-right-color:transparent}
.liste-nu .search{border-bottom:none;padding:16px 20px 10px}
.liste-nu .search :is(input,.champ){background:none;border-width:0 0 1px;
  border-color:var(--line);border-radius:0;padding-left:30px}
.liste-nu .count{border-bottom:none;padding:4px 20px 10px}
.liste-nu .row{grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;
  padding:11px 20px;border-bottom:none}
.liste-nu .row > span:last-child{order:1;min-width:0}
.liste-nu .row .code{order:2;background:none;border:none;border-radius:0;padding:0;
  color:var(--ink-3);font-size:11px;letter-spacing:.04em;text-align:right}
.liste-nu .row .nm{font-size:15px;font-weight:600;letter-spacing:-.02em}
.liste-nu .row:hover{background:none}
.liste-nu .row:hover .nm{text-decoration:underline;text-underline-offset:4px}
.liste-nu .row[aria-current="true"]{background:none}
.liste-nu .row[aria-current="true"] :is(.nm,.code){color:var(--accent)}

/* ------------------------------------------------------------
   Parcours de visite

   Le visiteur retient des exposants et des conférences en circulant, puis
   relit sa liste sur place. La marque est la même partout — un signet creux
   tant que la chose n'y est pas, plein dès qu'elle y entre — pour qu'on la
   reconnaisse aussi bien dans le programme d'une zone que sur une fiche.
   ------------------------------------------------------------ */
.marque{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3);display:grid;place-items:center;background:var(--surface)}
.marque svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.marque:hover{border-color:var(--line-strong);color:var(--ink)}
.marque[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.marque[aria-pressed="true"] svg{fill:currentColor}
.btn.parc{display:inline-flex;align-items:center;gap:7px}
.btn.parc svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.btn.parc[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.parc[aria-pressed="true"] svg{fill:currentColor}
/* Dans une fenêtre modale, les champs n'ont pas l'écartement que leur donne le
   corps de la fiche : le bouton se collerait au dernier paragraphe. */
.mcorps .acts{margin-top:13px}
/* La vignette d'une conférence garde toute la largeur qu'elle peut : le
   signet se pose à côté, hors du bouton — un bouton n'en contient pas un autre. */
.confRang{display:flex;align-items:center;gap:6px}
.confRang .conf{flex:1;min-width:0}

/* Le nombre porté par le bouton de la barre : sans lui, rien ne dirait qu'un
   parcours a été commencé lors d'une visite précédente. */
.compteur{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;display:grid;place-items:center;line-height:1;
  border:1.5px solid var(--surface)}
.compteur[hidden]{display:none}

/* Le tiroir occupe la place de la fiche — à droite sur grand écran, en bas sur
   téléphone : c'est le même geste, regarder une liste à côté du plan. Les deux
   ne s'ouvrent jamais ensemble, ils se disputeraient la même bande. */
/* « background-color » ici et sur l'itinéraire, et non « background » :
   plusieurs modèles posent un fond tramé ou un dégradé sur le panneau, et la
   forme courte, écrite après eux dans la feuille, l'effacerait. La fiche, elle,
   vient avant les modèles et peut garder la forme courte. */
.parcours{position:absolute;top:0;right:0;bottom:0;width:340px;background-color:var(--surface);
  border-left:1px solid var(--line);transform:translateX(100%);display:flex;flex-direction:column;
  z-index:4;box-shadow:-16px 0 40px -26px rgba(10,14,18,.55);
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
.parcours.open{transform:none}
.parcours .detail-hd h2{margin:0 0 4px}
.pCorps{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.pPied{padding:10px 18px 14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.pPied[hidden]{display:none}
.pPied .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 12px;font-size:13px}
.pPied .btn svg{width:15px;height:15px;flex:none}
/* Organiser sa journée n'est pas une action de rangement comme les autres :
   c'est ce pour quoi la liste a été faite, et le bouton le dit. */
.pPied .jOrg{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pPied .jOrg:hover{border-color:var(--accent)}
.pPied .jOrg[disabled]{opacity:.45;background:var(--surface-2);border-color:var(--line);
  color:var(--ink-3);cursor:default}
.pPied .vider{font-size:12px;color:var(--ink-3);text-decoration:underline}
.pPied .vider:hover{color:var(--rouge)}
/* Revenir en arrière n'efface rien : le rouge du survol s'y lirait comme une
   menace sur la liste qu'on retrouve. */
.pPied .vider.retour:hover{color:var(--ink)}
.pGroupe{display:flex;flex-direction:column;gap:7px}
/* Le jour sépare les conférences comme il le fait dans le programme d'une
   zone : sans lui, « 10h30 » ne dit pas de quelle matinée il parle. */
.pGroupe .jour{margin:5px 0 1px;padding-bottom:5px;font-size:13.5px;font-weight:600;
  color:var(--ink);border-bottom:1px solid var(--line-strong)}
.pRang{display:flex;align-items:center;gap:6px}
.pRang .pOuvre{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;
  padding:8px 10px;background:var(--surface-2);border-radius:var(--radius);
  border-left:2px solid var(--tc,var(--line-strong));transition:background .15s}
.pRang .pOuvre:hover{background:var(--line)}
.pRang .pt{font-size:13px;line-height:1.35;color:var(--ink)}
.pRang .ps{font-size:11.5px;color:var(--ink-3)}
.pRang .pOte{width:28px;height:28px;flex:none;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3);font-size:15px;line-height:1}
.pRang .pOte:hover{border-color:var(--rouge);color:var(--rouge)}
.pVide{font-size:13px;color:var(--ink-3);line-height:1.6}
/* ------------------------------------------------------------
   La journée organisée

   Le même tiroir, une autre vue : la liste qu'on a composée devient un
   déroulé d'heures. Les deux ne s'affichent jamais ensemble — c'est la même
   journée, lue avant puis après le calcul.
   ------------------------------------------------------------ */
.jBilan{display:flex;flex-direction:column;gap:2px;padding:11px 12px;
  background:var(--accent-soft);border-radius:var(--radius)}
.jBilan b{font-family:"Archivo",sans-serif;font-size:20px;letter-spacing:-.02em}
.jBilan span{font-size:12.5px;color:var(--ink-2)}
.jFil{display:flex;flex-direction:column;gap:3px}
.jRang{display:flex;gap:9px;align-items:flex-start}
/* L'heure tient une colonne à elle : alignée à droite, les minutes se lisent
   les unes sous les autres et la journée se parcourt d'un regard. */
.jH{flex:none;width:38px;padding-top:9px;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
/* Ce qui relie deux arrêts — la marche, l'attente, le changement de pavillon
   — n'est pas un arrêt : le trait pointillé le dit sans un mot de plus. */
.jRang.lien .jH{padding-top:1px}
.jL{flex:1;min-width:0;margin-left:8px;padding:1px 0 5px 14px;
  border-left:1px dashed var(--line-strong);
  font-size:11.5px;color:var(--ink-3);line-height:1.5}
.jArret{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;
  padding:8px 10px;background:var(--surface-2);border-radius:var(--radius);
  border-left:2px solid var(--tc,var(--accent));transition:background .15s}
.jArret:hover{background:var(--line)}
/* Le rang de l'arrêt, le même que la pastille posée sur le plan : c'est par
   lui qu'on passe de la liste au trait, et du trait à la liste. */
.jN{flex:none;width:20px;height:20px;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);font-size:10.5px;font-weight:600;font-family:"IBM Plex Mono",monospace;
  display:grid;place-items:center;line-height:1}
.jArret.conf .jN{background:var(--surface);color:var(--accent);
  box-shadow:inset 0 0 0 1.5px var(--accent)}
/* Un rendez-vous qu'on n'atteint pas garde sa place et son heure, mais cesse
   de se donner pour acquis : c'est au visiteur d'arbitrer. */
.jArret.tard{border-left-color:var(--rouge)}
.jArret.tard .jS{color:var(--rouge)}
.jTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.jT{font-size:13px;line-height:1.35;color:var(--ink)}
.jS{font-size:11.5px;color:var(--ink-3)}
.jD{flex:none;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
/* Ce qui n'a pas trouvé sa place dans la journée : on le montre plutôt que de
   le laisser disparaître sans un mot. */
.jReste{display:flex;flex-direction:column;gap:7px}
.jReste .pRang .pOuvre{opacity:.72}

/* Les trois questions posées avant le calcul. Elles tiennent dans la fenêtre
   modale, où rien d'autre ne se règle par un champ. */
.jForm{display:flex;flex-direction:column;gap:12px;margin-top:13px}
.jForm label{display:flex;flex-direction:column;gap:4px}
.jForm select,.jForm input{width:100%;padding:8px 9px;font-size:13.5px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink)}
.jForm select:focus,.jForm input:focus{border-color:var(--accent);outline:none}
.jSansPorte{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* Le signet rejoint la croix en haut de la fiche : il porte sur la fiche
   entière, et non sur ce qui suit les champs comme « Centrer sur le plan ». */
.hdActs{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px}
.hdActs .close{position:static;top:auto;right:auto}
.hdActs .marque{width:28px;height:28px}
.hdActs .marque[hidden]{display:none}

/* ------------------------------------------------------------
   Itinéraire : le tiroir, et le trait sur le plan
   ------------------------------------------------------------ */
/* Troisième occupant de la même bande que la fiche et le parcours — à droite
   au large, en bas sur téléphone. Les trois ne s'ouvrent jamais ensemble. */
.itineraire{position:absolute;top:0;right:0;bottom:0;width:340px;background-color:var(--surface);
  border-left:1px solid var(--line);transform:translateX(100%);display:flex;flex-direction:column;
  z-index:4;box-shadow:-16px 0 40px -26px rgba(10,14,18,.55);
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
.itineraire.open{transform:none}
.itineraire .detail-hd h2{margin:0 0 4px}
.iCorps{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
/* Le champ de départ, l'inversion, le champ d'arrivée : trois lignes d'une
   même grille, la flèche à cheval sur les deux champs qu'elle échange. */
.iChamps{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:end}
/* Le champ porte sa liste : elle se déroule sous lui, et non sous les deux.
   Posée en dessous du bloc, elle paraissait appartenir à l'arrivée alors qu'on
   tapait le départ. */
.iChamp{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.iChamp input{width:100%;padding:8px 36px 8px 9px;font-size:13.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.iChamp input:focus{border-color:var(--accent);outline:none}
/* L'invite prend l'encre tertiaire plutôt que le gris du navigateur, qui ne
   sait rien du fond : sur le bloc de couleur du modèle « Verre », elle s'y
   perdait. */
.iChamp input::placeholder{color:var(--ink-3);opacity:1}
/* Le viseur vit au bord du champ qu'il remplit : c'est la même action que la
   saisie, dite autrement. */
.iVise{position:absolute;right:3px;bottom:3px;width:28px;height:28px;display:grid;
  place-items:center;border-radius:var(--radius);color:var(--ink-3)}
.iVise:hover{color:var(--ink);background:var(--line)}
.iVise[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent)}
.iVise svg{width:15px;height:15px}
.iEchange{grid-column:2;grid-row:1/3;align-self:center;width:34px;height:34px;
  display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-3)}
.iEchange:hover{border-color:var(--line-strong);color:var(--ink)}
.iEchange svg{width:15px;height:15px}
/* La liste sert les deux champs à tour de rôle : elle se déplace dans celui
   qu'on remplit plutôt que d'exister en double. */
.iSugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;
  display:flex;flex-direction:column;gap:2px;max-height:210px;overflow-y:auto;
  border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px;
  background:var(--surface);box-shadow:var(--shadow)}
.iSugg[hidden]{display:none}
.iSug{display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 8px;
  border-radius:var(--radius);width:100%}
.iSug:hover,.iSug.vis{background:var(--line)}
.iSug .n{font-size:13px;color:var(--ink);line-height:1.3}
.iSug .s{font-size:11.5px;color:var(--ink-3)}
/* Un repère n'est pas un exposant : le liseré le dit sans un mot de plus. */
.iSug.rep{border-left:2px solid var(--accent)}
.iRien{margin:0;padding:6px 8px;font-size:12.5px;color:var(--ink-3)}
.iPmr{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);
  line-height:1.45;cursor:pointer}
.iPmr input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent)}
.iPmr b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.iResultat{display:flex;flex-direction:column;gap:12px}
.iBilan{display:flex;flex-direction:column;gap:2px;padding:11px 12px;
  background:var(--accent-soft);border-radius:var(--radius)}
.iBilan b{font-family:"Archivo",sans-serif;font-size:20px;letter-spacing:-.02em}
.iBilan span{font-size:12.5px;color:var(--ink-2)}
/* Effacer, c'est défaire les deux champs juste au-dessus : le lien se range
   sous le bilan qu'il annule, et non au pied d'un volet que le trajet laisse
   aux trois quarts vide — il y tombait si bas qu'on le cherchait. */
.iVider{align-self:flex-start;font-size:12px;color:var(--ink-3);text-decoration:underline}
.iVider:hover{color:var(--rouge)}
.iNote{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.iAlerte{margin:0;font-size:12.5px;line-height:1.6;color:var(--rouge)}
.iEtapes{display:flex;flex-direction:column;gap:7px}
.iEtape{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--surface-2);
  border-radius:var(--radius);border-left:2px solid var(--accent)}
.iEtape.transfert{border-left-style:dashed;border-left-color:var(--line-strong)}
/* Une étape qui se déroule dans un pavillon qu'on ne regarde pas s'y rend
   d'un clic : c'est un bouton, mais il garde l'aspect des autres étapes —
   c'est la même liste, et seul le survol le distingue. */
.iEtape.ailleurs{width:100%;text-align:left}
.iEtape.ailleurs:hover{background:var(--accent-soft)}
.iEtape .t{font-size:13px;color:var(--ink)}
.iEtape .s{font-size:11.5px;color:var(--ink-3)}

/* Pendant la visée, le plan devient une liste de choix : le curseur le dit à
   la souris, le bandeau le dit à tout le monde. */
.viseur{position:absolute;top:12px;left:0;right:0;margin-inline:auto;width:fit-content;
  max-width:92%;z-index:14;display:flex;align-items:center;gap:12px;
  padding:7px 12px 7px 14px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:999px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink)}
.viseur[hidden]{display:none}
.viseur button{font-size:12px;color:var(--accent);text-decoration:underline;padding:2px}
html.vise-plan #plan{cursor:crosshair}

/* Le tracé. Son épaisseur est donnée en pixels et ne suit pas le zoom : un
   trait qui grossit avec le plan finit par masquer les stands qu'il longe,
   et disparaît quand on recule pour voir le trajet entier. */
#itin{pointer-events:none}
#itin path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#itin .iHalo{stroke:var(--surface);stroke-width:8;opacity:.9}
#itin .iTrait{stroke:var(--accent);stroke-width:3.5}
/* Des pointillés qui défilent : ils disent le sens du trajet, ce qu'un trait
   plein ne fait pas, et sans ajouter de flèches qui se chevaucheraient dans
   les virages.

   Ils avancent par sauts d'un point, et non d'un glissement continu : le
   décalage d'un tracé ne se délègue pas au compositeur — même piège que le
   halo des points d'intérêt — et chaque valeur nouvelle repeint le plan sous
   le trajet, qui traverse le salon entier. Douze paliers par tour valent onze
   repeints par seconde au lieu de soixante, sans qu'on lise le sens moins
   bien. */
#itin .iSens{stroke:var(--accent-ink);stroke-width:1.6;stroke-dasharray:1 11;opacity:.85;
  animation:defile 1.1s steps(12) infinite}
@keyframes defile{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){#itin .iSens{animation:none}}
@media (prefers-reduced-motion:reduce){.chalTete button svg{transition:none}}
#itin .iBout{fill:var(--accent);stroke:var(--surface);stroke-width:2.5;
  vector-effect:non-scaling-stroke}
#itin .iBout.fin{fill:var(--surface);stroke:var(--accent)}
/* La pastille d'une conférence se distingue de celle d'un stand : l'heure y
   est imposée, et c'est autour d'elle que le reste de la journée s'est rangé. */
#itin .iBout.conf{fill:var(--surface);stroke-width:3.5}
#itin .iNum{fill:var(--surface);text-anchor:middle;dominant-baseline:central;
  font-family:"IBM Plex Mono",monospace;font-weight:600}
#itin .iNum.conf{fill:var(--accent)}
/* Comme le parcours et les icônes de zoom : ce que l'exploitant retire doit
   disparaître partout, y compris le bouton posé sur les fiches. Organiser sa
   journée, c'est calculer un itinéraire : sans le moteur, le bouton du
   parcours n'aurait rien à quoi s'adresser. */
html.sans-itineraire .btn.itin,html.sans-itineraire #btnJournee{display:none}

/* L'exploitant peut retirer le parcours : il disparaît alors partout à la
   fois — la barre du haut, les fiches, le programme d'une zone — sans quoi il
   resterait des signets sans destination. Ce que le visiteur avait retenu
   n'est pas effacé pour autant : le réglage peut se rouvrir. */
html.sans-parcours .marque,html.sans-parcours .btn.parc{display:none}
/* « .iconbtn » déclare « display:grid » : sans cette règle, « hidden » n'y
   masquerait rien — le même piège que la barre de zoom et l'échelle. */
.iconbtn[hidden]{display:none}

/* ------------------------------------------------------------
   Modèles — le parcours de visite et l'itinéraire

   Les deux tiroirs prennent l'habillage choisi comme la fiche. Ils occupent la
   même bande de l'écran, s'ouvrent depuis la fiche et y ramènent : un parcours
   resté au rendu d'origine contre une fiche kraft ne faisait pas un salon, il
   en faisait deux. « appliqueModele » pose donc la même classe sur les trois.

   Le gros du travail se fait tout seul. Un modèle redéfinit ses jetons de
   couleur sur le panneau, et tout ce qui s'y peint les lit déjà — l'en-tête,
   les pastilles, les boutons, les filets. Ne restent ici que les pièces
   propres aux tiroirs, celles que la fiche n'a pas.

   Trois formes y reviennent, et se traitent ensemble : la vignette — un stand
   retenu, un arrêt de la journée, une étape du trajet —, le bilan qui chiffre
   la durée, et le champ de saisie.

   Ces règles suivent « .parcours » et « .itineraire » dans la feuille plutôt
   que de rester avec les autres modèles : écrites plus haut, leur bord et leur
   fond se seraient fait recouvrir par les deux panneaux.
   ------------------------------------------------------------ */

/* Cinq modèles imposent leur fond sans regarder le thème de la page : trois
   dans le noir, deux sur un papier clair. Le rouge des alertes suit le fond
   qu'on lui donne, et non celui de la page. */
.modele-console,.modele-signal,.modele-verre{--rouge:#FF8B7E}
.modele-brut,.modele-kraft{--rouge:#C2372B}

/* Le bord gauche et l'ombre du tiroir, que les modèles redessinent pour la
   fiche avant que les panneaux ne posent les leurs. */
:is(.parcours,.itineraire).modele-grille{border-left:2px solid var(--ink)}
:is(.parcours,.itineraire).modele-brut{border-left:3px solid #111}
:is(.parcours,.itineraire).modele-verre{border-left-color:rgba(255,255,255,.28);
  border-radius:20px 0 0 20px}
:is(.parcours,.itineraire).modele-billet{border-radius:16px 0 0 16px}
:is(.parcours,.itineraire).modele-nu{box-shadow:none;border-left-color:transparent}

/* Grille — les filets francs de la fiche traversent les tiroirs : une étape,
   un arrêt, un stand retenu se séparent d'un trait plein plutôt que de flotter
   sur un aplat. Le liseré de gauche reste : il porte la couleur du type de
   conférence, un retard, une correspondance — ce qu'un fond gris ne dit pas. */
.modele-grille :is(.pRang .pOuvre,.jArret,.iEtape){background:none;
  border-bottom:1px solid var(--ink);padding:10px 0 10px 10px}
.modele-grille .pGroupe .jour{border-bottom:2px solid var(--ink);
  font-family:"Archivo",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase}
.modele-grille :is(.jBilan,.iBilan){background:var(--accent-base);color:var(--accent-ink)}
.modele-grille :is(.jBilan span,.iBilan span){color:var(--accent-ink);opacity:.75}
.modele-grille :is(.iChamp input,.iSugg){border-color:var(--ink)}
.modele-grille .pPied{border-top:2px solid var(--ink)}

/* Console — la police de la régie descend du panneau sur tout ce qu'il porte ;
   restent l'invite des libellés, que la fiche réserve à ses champs, et les
   filets qui passent au pointillé. */
.modele-console .iChamp .eyebrow::before{content:"$ ";color:var(--accent)}
.modele-console :is(.jBilan b,.iBilan b){font-family:"IBM Plex Mono",monospace;font-size:18px}
.modele-console :is(.pRang .pOuvre,.jArret,.iEtape){border-left-style:dashed}
.modele-console .pGroupe .jour{border-bottom-style:dashed}
.modele-console .pPied{border-top-style:dashed}

/* Billet — la perforation du talon sépare ici les jours, les listes et le
   pied ; les champs prennent l'arrondi plein des boutons. */
.modele-billet .pGroupe .jour{border-bottom:2px dashed var(--line-strong)}
.modele-billet .pPied{border-top:2px dashed var(--line-strong)}
.modele-billet :is(.pRang .pOuvre,.jArret,.iEtape){border-left-style:dashed}
.modele-billet :is(.iChamp input,.pRang .pOte,.iVise,.iEchange){border-radius:999px}
.modele-billet :is(.pRang .ps,.iEtape .s,.jS){font-family:"IBM Plex Mono",monospace;font-size:11px}

/* Magazine — le sommaire du catalogue : serif à fort contraste, italiques pour
   ce qui commente, et le filet posé au-dessus de chaque entrée plutôt qu'un
   aplat sous elle. Le liseré de gauche s'y refait en filet du haut : la
   couleur qu'il portait reste celle du trait. */
.modele-magazine :is(.pRang .pOuvre,.jArret,.iEtape){background:none;
  border-left:none;border-top:1px solid var(--line);border-radius:0;padding:10px 0}
.modele-magazine .iEtape.transfert{border-top-style:dashed}
.modele-magazine :is(.pRang .pt,.iEtape .t,.jT){font-family:"Fraunces",Georgia,serif;
  font-size:14.5px;line-height:1.25}
.modele-magazine :is(.pRang .ps,.iEtape .s,.jS,.pVide,.iNote){font-style:italic}
.modele-magazine .pGroupe .jour{font-family:"Fraunces",Georgia,serif;font-style:italic;
  font-weight:600;font-size:15px;border-bottom-color:var(--ink)}
.modele-magazine :is(.jBilan b,.iBilan b){font-family:"Fraunces",Georgia,serif;font-weight:600}
.modele-magazine .iChamp .eyebrow{font-family:"Fraunces",Georgia,serif;font-style:italic;
  font-size:12.5px;letter-spacing:0;text-transform:none}

/* Brut — le trait de deux pixels et l'ombre dure : chaque vignette est une
   caisse posée sur le papier, et le liseré de gauche s'épaissit d'autant. */
.modele-brut :is(.pRang .pOuvre,.jArret,.iEtape){border:2px solid #111;
  border-left-width:5px;border-left-color:var(--tc,var(--accent))}
.modele-brut :is(.jBilan,.iBilan,.iChamp input,.iSugg,
  .pRang .pOte,.iEchange){border:2px solid #111}
.modele-brut .iEtape.transfert{border-left-style:dashed;border-left-color:#111}
.modele-brut .jN{border:2px solid #111}
.modele-brut .pGroupe .jour{border-bottom:3px solid #111;font-weight:700;
  font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.modele-brut .pPied{border-top:3px solid #111}

/* Verre — chaque vignette devient un carreau translucide sur le bloc de
   couleur, comme les champs de la fiche et les lignes de la liste. */
.modele-verre :is(.pRang .pOuvre,.jArret,.iEtape,.jBilan,.iBilan){
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:13px}
.modele-verre :is(.pRang .pOuvre:hover,.jArret:hover,.iEtape.ailleurs:hover){
  background:rgba(255,255,255,.2)}
.modele-verre .iChamp input{background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.2);border-radius:999px}
/* La liste de suggestions se pose sur le plan, hors du bloc : le carreau
   translucide des autres panneaux la rendrait illisible, elle reprend donc le
   fond plein du dégradé. */
.modele-verre .iSugg{background:var(--accent-fort);border-color:rgba(255,255,255,.3);
  border-radius:14px}
.modele-verre .iEtape.transfert{border-left:3px dashed rgba(255,255,255,.5)}
.modele-verre :is(.pRang .pOte,.iEchange,.iVise){border-radius:999px}
.modele-verre .jArret.conf .jN{background:rgba(255,255,255,.24);color:#fff}

/* Kraft — le carton, la machine à écrire et le pointillé de perforation. */
.modele-kraft :is(.pRang .pt,.iEtape .t,.jT,.pGroupe .jour){font-family:"Courier Prime",monospace}
.modele-kraft :is(.pRang .pOuvre,.jArret,.iEtape,.jBilan,.iBilan,
  .iChamp input){background:rgba(255,252,244,.55)}
.modele-kraft .iChamp input{border-color:var(--line-strong)}
.modele-kraft :is(.jBilan b,.iBilan b){font-family:"Courier Prime",monospace;font-size:18px}
.modele-kraft .pGroupe .jour{border-bottom:1px dashed var(--line-strong);
  font-weight:700;font-size:12.5px;text-transform:uppercase}
.modele-kraft .pPied{border-top:1px dashed var(--line-strong)}

/* Signalétique — capitales, flèche et gros filet : un arrêt se lit comme une
   direction de hall, ce qui va de soi pour deux panneaux qui ne parlent que
   de se rendre quelque part. */
.modele-signal :is(.pRang .pt,.iEtape .t,.jT){font-weight:700;font-size:12.5px;
  letter-spacing:.02em;text-transform:uppercase}
.modele-signal :is(.pRang .pt,.iEtape .t,.jT)::before{content:"→ ";
  color:var(--accent-clair);font-weight:500}
.modele-signal :is(.pRang .pOuvre,.jArret,.iEtape){border-left-width:4px}
.modele-signal .pGroupe .jour{border-bottom:2px solid var(--accent-fort);
  font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* Chronologie — le rail de la fiche court dans les deux tiroirs, qui sont
   déjà des suites : ce qu'on a retenu, puis les étapes du trajet. La journée
   organisée garde le sien, elle en avait un avant les modèles. */
.modele-chrono :is(.pGroupe,.iEtapes){position:relative;padding-left:22px;gap:0}
.modele-chrono :is(.pGroupe,.iEtapes)::before{content:"";position:absolute;
  left:5px;top:8px;bottom:10px;width:2px;background:linear-gradient(var(--accent),var(--line))}
.modele-chrono :is(.pRang,.iEtape){position:relative;padding-bottom:14px}
.modele-chrono :is(.pRang,.iEtape)::before{content:"";position:absolute;left:-22px;
  width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.modele-chrono .pRang::before{top:14px}
.modele-chrono .iEtape::before{top:5px}
/* Le rail a pris la place du liseré : la correspondance se dit alors par son
   point, creusé comme la vignette qu'il remplace. */
.modele-chrono .iEtape.transfert::before{border-style:dashed}
.modele-chrono .pGroupe .jour{margin-left:-22px}
.modele-chrono :is(.pRang .pOuvre,.iEtape){background:none;border-left:none;padding-left:0}
.modele-chrono :is(.jBilan,.iBilan){border-radius:16px}

/* Nu — ni cadre, ni fond, ni case : un arrêt se reconnaît à son heure et à son
   nom. Le survol, qui n'a plus d'aplat où se dire, souligne. */
.modele-nu :is(.pRang .pOuvre,.jArret,.iEtape,.jBilan,.iBilan){background:none;
  border-left:none;border-radius:0;padding:6px 0}
.modele-nu :is(.pRang .pOuvre:hover,.jArret:hover,.iEtape.ailleurs:hover){background:none}
.modele-nu :is(.pRang .pOuvre:hover .pt,.jArret:hover .jT,
  .iEtape.ailleurs:hover .t){text-decoration:underline;text-underline-offset:4px}
.modele-nu :is(.pRang .pt,.iEtape .t,.jT){font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.modele-nu .pGroupe .jour{border-bottom:none;font-size:15px;font-weight:700;letter-spacing:-.02em}
.modele-nu .iChamp input{background:none;
  border-width:0 0 1px;border-radius:0;padding-left:0}
.modele-nu :is(.pRang .pOte,.iEchange){border-color:transparent}
.modele-nu .pPied{border-top:none}

.panel{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;z-index:3;display:none;
  max-height:min(74vh,600px,100% - 24px - var(--chalh,0px));overflow-y:auto}
.panel.open{display:block}
.panel .eyebrow{display:block;margin-bottom:8px}

/* Le cartouche de la carte de chaleur.
   Le plan porte les couleurs ; il reste à dire ce qu'elles valent, sur quelle
   période, et lesquels des neuf cents emplacements sont en tête — dix stands
   voisins tous rouges se ressemblent, et le premier ne se distingue pas du
   dixième. En bas à droite : le seul coin que ni le zoom, ni l'échelle, ni la
   pile des calques n'occupent. */
.chalbar{position:absolute;right:12px;bottom:12px;z-index:6;width:272px;
  display:flex;flex-direction:column;gap:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;
  max-height:calc(100% - 24px);overflow-y:auto}
.chalbar[hidden]{display:none}
.chalTete{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chalTete button{color:var(--ink-3);line-height:0;padding:2px 3px}
.chalTete button:hover{color:var(--ink)}
.chalTete button svg{width:14px;height:14px;display:block;transition:transform .15s}
.chalTete button[aria-expanded="false"] svg{transform:rotate(180deg)}
/* Replié sur sa légende. C'est l'échelle qu'on garde et non le titre seul : sur
   une rampe thermique, la couleur ne dit pas seule ce qu'elle vaut, et le
   cartouche replié reste la carte de la carte. */
.chalbar.reduit{width:auto;max-width:272px}
.chalbar.reduit .chalPer,.chalbar.reduit .chalEtat,.chalbar.reduit .chalTop{display:none}
.chalPer{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chalPer button{min-width:0;height:26px;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-2);font-size:11.5px}
.chalPer button:hover{border-color:var(--line-strong);color:var(--ink)}
.chalPer button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chalEch[hidden]{display:none}
.chalEch i{display:block;height:8px;border-radius:3px;border:1px solid var(--line)}
/* Les bornes portent des nombres et non des parts : l'échelle est
   logarithmique, et une bande graduée en pourcentages mentirait sur l'écart
   entre son milieu et son bout. */
.chalEch .bornes{display:grid;grid-template-columns:1fr auto 1fr;margin-top:3px;
  font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chalEch .bornes span:nth-child(2){text-align:center}
.chalEch .bornes span:last-child{text-align:right}
.chalEtat{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.45}
.chalEtat.err{color:var(--rouge,#C2372B)}
.chalTop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chalTop button{display:flex;width:100%;align-items:baseline;gap:7px;text-align:left;
  padding:4px 6px;border:1px solid transparent;border-radius:4px;
  font-size:12px;color:var(--ink)}
.chalTop button:hover{border-color:var(--line-strong);background:var(--surface-2)}
.chalTop button[disabled]{color:var(--ink-3);cursor:default}
.chalTop button[disabled]:hover{border-color:transparent;background:none}
.chalTop .rang,.chalTop .code,.chalTop .n{font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--ink-3);flex:0 0 auto}
.chalTop .n{font-size:11px;color:var(--ink-2)}
.chalTop .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Ce qui n'appartient pas à la pile s'en détache par un trait, comme la barre
   d'administration au bas du panneau. Le libellé n'a pas de case à cocher
   devant lui, et rien à ouvrir : le curseur ne promet donc rien. */
.apart{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
/* Ce que le salon fournit et ce que l'exploitant a dessiné se suivent dans la
   même pile : un trait et un intertitre disent où l'une finit et l'autre
   commence. Le premier de la liste vient sous le bouton de réorganisation, qui
   le sépare déjà — inutile d'y ajouter un trait. */
.panel .secpile{margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--line)}
.panel .reorg + .secpile{margin-top:0;padding-top:0;border-top:none}
.apart .calq label{cursor:default}
.calq.sous{padding-left:15px}
.calq.sous label{font-size:12px;color:var(--ink-2)}
.calq.sous .cc,.calq.sous .fillbtn{transform:scale(.88)}
.calq{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:2px 0}
.calq label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-width:0}
.calq label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Réglages généraux, dans leur fenêtre : une case à cocher par ligne, avec de
   quoi viser au doigt sans effleurer la voisine. */
/* Un réglage qui se chiffre, sous ceux qui se cochent : même famille, autre
   geste. L'unité est écrite à côté du champ plutôt que dans son libellé, où
   elle se lirait comme faisant partie de la question. */
.reglage-nb{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:5px}
.reglage-nb label{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink)}
.reglage-nb .l{flex:1;min-width:0}
.reglage-nb input{width:74px;padding:6px 8px;font-size:13.5px;text-align:right;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink);font-family:"IBM Plex Mono",monospace}
.reglage-nb input:focus{border-color:var(--accent);outline:none}
.reglage-nb .u{flex:none;font-size:12.5px;color:var(--ink-3)}
.reglage-nb .aide{font-size:12px;color:var(--ink-3);line-height:1.5}

/* Les réglages tiennent en volets : ce que le plan montre, ce que la recherche
   remonte, de quoi le plan a l'air, ses zones, sa mesure. Séparés par des
   onglets plutôt qu'empilés — l'apparence est une planche d'aperçus, et
   poussait tout le reste hors de l'écran. */
.ongReg{display:flex;gap:3px;margin:0 0 14px;padding:3px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px}
.ongReg button{flex:1;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--ink-2);transition:background-color .18s ease,color .18s ease}
.ongReg button:hover{color:var(--ink)}
.ongReg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Changer d'onglet remplaçait un panneau par un autre d'un seul coup, et sur
   la hauteur de ces fenêtres — une planche d'aperçus, une liste de zones — on
   ne voyait pas ce qui avait bougé. Le volet qui paraît monte donc d'un pas.
   Une animation, et non une transition : le panneau sortant est retiré du flux
   par « hidden », et deux volets en fondu croisé demanderaient de tenir les
   deux hauteurs à la fois. Elle repart à chaque fois que le volet redevient
   visible — un élément en « display:none » n'anime rien, et reprend au
   début quand il reparaît. */
.voletReg{animation:entreVolet .18s ease-out}
@keyframes entreVolet{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .voletReg{animation:none}
  .ongReg button{transition:none}
}
/* Les onglets étaient quatre, ils sont cinq : sur un téléphone, « Apparence »
   et « Recherche » ne tiennent plus côte à côte à cette taille. L'intitulé
   resserre d'abord — c'est ce qui se voit le moins — et la barre défile pour
   ce qui dépasse encore, plutôt que d'écraser les mots. Les boutons y perdent
   leur « flex:1 » : à largeur égale, le plus long serait coupé quand les
   autres gardent du vide. */
@media (max-width:640px){
  .ongReg{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .ongReg::-webkit-scrollbar{display:none}
  .ongReg button{flex:none;padding:8px 10px;font-size:12.5px;scroll-snap-align:center}
}
/* La couleur principale. Un nuancier de tons de charte plutôt qu'une roue :
   on choisit la couleur d'un salon, pas la nuance exacte d'un dégradé. La
   dernière pastille ouvre le nuancier du système pour ceux qui ont un
   hexadécimal à respecter. */
.reglage-coul{margin:2px 0 18px}
.reglage-coul .tete{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.reglage-coul .val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.reglage-coul .raz{margin-left:auto;font-size:12px;color:var(--ink-3);text-decoration:underline}
.reglage-coul .raz:hover{color:var(--ink)}
.nuancier{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;max-width:352px}
.nuancier button,.nuancier .perso{position:relative;display:block;width:100%;aspect-ratio:1;
  padding:0;border:1px solid rgba(0,0,0,.18);border-radius:6px}
/* Le ton retenu se cerne d'un anneau posé à l'extérieur : un liseré pris sur
   la pastille aurait mangé la couleur qu'on est en train de juger. */
.nuancier button[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;
  border:2px solid var(--ink);border-radius:9px}
.nuancier .perso{display:grid;place-items:center;cursor:pointer;overflow:hidden;
  background:conic-gradient(#E4574B,#E4B14B,#5FBE6A,#4BB6E4,#6B5FE4,#D45FC0,#E4574B)}
.nuancier .perso input{position:absolute;inset:0;width:100%;height:100%;padding:0;
  border:none;opacity:0;cursor:pointer}
.nuancier .perso span{position:relative;width:11px;height:11px;border-radius:50%;
  background:var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
/* Le même nuancier dans le panneau des calques, où il n'a pas la largeur d'une
   fenêtre de réglages : les pastilles se serrent au lieu de pousser le panneau
   par-dessus le plan qu'on est en train de repeindre. Le titre et le retour à
   l'origine tiennent sur une ligne, comme la tête du nuancier d'accent. */
.fondp .tete{display:flex;align-items:baseline;gap:10px}
.fondp .tete .eyebrow{margin-bottom:0}
.fondp .tete .reset{margin-left:auto}
.fondp .nuancier{gap:6px;max-width:none;margin-top:8px}
/* Un habillage ne se décrit pas, il se regarde : chaque modèle se choisit sur
   ses propres liste et fiche, réduites, remplies d'un exposant d'exemple. Le
   bas s'efface plutôt que de se couper net — l'aperçu montre le haut des deux,
   qui est ce qui les distingue.

   Les deux côte à côte, dans l'ordre de l'écran : c'est ensemble qu'ils font
   l'habillage, et un modèle se choisit sur l'accord des deux. La vignette est
   donc plus large qu'au temps où elle ne montrait que la fiche. */
.modeles{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.mod{display:block;width:100%;padding:0;text-align:left;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mod:hover{border-color:var(--line-strong)}
.mod[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mod .vue{display:block;position:relative;height:198px;overflow:hidden;background:var(--ground);
  -webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.mod .nom{display:flex;align-items:center;gap:7px;padding:9px 11px;font-size:12.5px;
  font-weight:600;border-top:1px solid var(--line)}
.mod .nom .coche{margin-left:auto;color:var(--accent);font-size:13px;visibility:hidden}
.mod[aria-pressed="true"] .nom .coche{visibility:visible}
.mod .resume{display:block;padding:0 11px 10px;font-size:11.5px;line-height:1.45;color:var(--ink-3)}
/* L'aperçu porte les mêmes classes que la liste et la fiche du plan : c'est la
   même feuille de style qui l'habille, à l'échelle près. La réduction est
   posée une fois sur le couple, sans quoi les deux moitiés ne seraient pas au
   même format. */
.duo{--reduc:.58;position:absolute;top:0;left:0;
  width:calc(100% / var(--reduc));height:calc(100% / var(--reduc));
  transform:scale(var(--reduc));transform-origin:top left;
  display:flex;pointer-events:none}
/* La liste garde une largeur fixe : proportionnelle, elle se serait resserrée
   au point de couper les noms sur la vignette la plus étroite. */
.apercu-liste{flex:0 0 152px}
.apercu{flex:1 1 auto}
.apercu,.apercu-liste{min-width:0;overflow:hidden;
  /* « background-color » et non le raccourci : celui-ci effacerait le fond
     que les modèles peignent — le dégradé du verre, le grain du kraft — car
     cette règle vient après la leur. */
  background-color:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
/* La liste de l'aperçu ne défile pas : ce qui dépasse la vignette s'efface
   avec le reste, sous le fondu du bas. */
.apercu-liste .list{overflow:hidden}
/* La vignette est trois fois plus étroite que le vrai panneau : le compteur y
   passait à la ligne, et l'on jugeait un habillage sur un défaut de largeur
   qu'aucun visiteur ne verra. Il se coupe, comme un nom trop long. */
.apercu-liste .count span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Les zones organisateur dans les réglages : la liste d'un côté, la fiche de
   celle qu'on a choisie de l'autre. Un exploitant les reprend l'une après
   l'autre, et doit voir en même temps ce qu'il écrit et ce qui reste à
   écrire. */
.zonesReg{display:grid;grid-template-columns:minmax(0,208px) minmax(0,1fr);
  gap:14px;align-items:start;margin-top:12px}
/* La liste défile pour elle seule : vingt-deux zones auraient poussé le bouton
   d'enregistrement hors de la fenêtre. */
.listeZ{display:flex;flex-direction:column;gap:2px;max-height:46dvh;
  overflow-y:auto;padding-right:2px}
.listeZ button{display:flex;align-items:baseline;gap:7px;width:100%;padding:7px 9px;
  font-size:13px;text-align:left;color:var(--ink-2);background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--radius)}
.listeZ button:hover{border-color:var(--line-strong);color:var(--ink)}
.listeZ button[aria-pressed="true"]{background:var(--accent-soft);
  border-color:var(--accent);color:var(--ink);font-weight:600}
.listeZ .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listeZ .etat{flex:none;font-size:10.5px;color:var(--ink-3);
  letter-spacing:.03em;text-transform:uppercase}
.detailZ{min-width:0}
.ouZ{margin:0 0 10px;font-size:11.5px;color:var(--ink-3)}
.champZ{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.champZ .tZ{font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2)}
.champZ input,.champZ select{width:100%;padding:8px 10px;font-size:14px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.champZ input:focus,.champZ select:focus{border-color:var(--accent);outline:none}
.champZ .aideZ{font-size:12px;line-height:1.5;color:var(--ink-3)}
/* Le champ du logo : la vignette à gauche, ce qu'on en fait à droite. La
   vignette est aussi la cible du glisser-déposer, d'où le trait discontinu —
   il dit qu'on peut y déposer quelque chose avant qu'on ait rien à y voir. */
.champZ .logoZ{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.champZ .logoZ .vue{flex:none;display:flex;align-items:center;justify-content:center;
  width:106px;height:74px;padding:6px;border:1px dashed var(--line-strong);
  border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.champZ .logoZ .vue[data-survol]{border-color:var(--accent);background:var(--accent-soft)}
.champZ .logoZ .vue img{max-width:100%;max-height:100%;object-fit:contain}
.champZ .logoZ .vue span{font-size:11.5px;line-height:1.4;text-align:center;color:var(--ink-3)}
.champZ .logoZ .actes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.champZ .logoZ .actes button{padding:6px 11px;font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.champZ .logoZ .actes button:hover{border-color:var(--line-strong);color:var(--ink)}
/* Le poids du logo tel qu'il partira, et l'échec quand il n'a pas pu être lu :
   la même ligne, pour que rien ne saute en passant de l'un à l'autre. */
.ditZ{font-size:12px;color:var(--ink-3)}
.ditZ[data-mal="true"]{color:#C2372B}
/* La fiche n'a pas de bouton : elle s'enregistre quand on la quitte. Reste à
   le dire, et à dire ensuite ce qu'il en est advenu — au même endroit, pour que
   la ligne ne fasse pas sauter la mise en page en changeant de texte. */
.etatZ{font-size:12px;color:var(--ink-3)}
.etatZ.seul{margin:2px 0 0}
.etatZ[data-mal="true"]{color:#C2372B}

/* L'éditeur de la description. Sa barre ne propose que ce que la fiche sait
   afficher : proposer un titre ou une couleur montrerait une mise en forme
   que la relecture retire à l'affichage. */
.edrich{border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface-2);overflow:hidden}
.edrich:focus-within{border-color:var(--accent)}
.edrich .barre{display:flex;flex-wrap:wrap;gap:2px;padding:4px;
  border-bottom:1px solid var(--line)}
.edrich .barre button{min-width:27px;height:26px;padding:0 7px;font-size:12.5px;
  line-height:1;color:var(--ink-2);border-radius:3px}
.edrich .barre button.lg{font-size:11.5px}
.edrich .barre button:hover{background:var(--line);color:var(--ink)}
.edrich .barre button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.edrich .lienbarre{display:flex;gap:6px;padding:6px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.edrich .lienbarre[hidden]{display:none}
.edrich .lienbarre input{flex:1;min-width:0;padding:5px 8px;font-size:12.5px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius)}
.edrich .lienbarre input:focus{border-color:var(--accent);outline:none}
.edrich .lienbarre button{flex:none;padding:5px 10px;font-size:12px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.edrich .lienbarre button:hover{border-color:var(--line-strong);color:var(--ink)}
.edrich .lienbarre button.ok{color:var(--accent);border-color:var(--accent)}
.edrich .zone{min-height:118px;max-height:32dvh;overflow-y:auto;padding:9px 10px;
  font-size:14px;line-height:1.5;color:var(--ink)}
.edrich .zone:focus{outline:none}
.edrich .zone > *:first-child{margin-top:0}
.edrich .zone p{margin:0 0 .55em}
.edrich .zone ul,.edrich .zone ol{margin:0 0 .55em;padding-left:1.25em}
.edrich .zone a{color:var(--accent)}
/* Un éditeur vide ne dit pas ce qu'on y met : la consigne s'efface à la
   première frappe, comme dans un champ ordinaire. */
.edrich .zone:empty::before{content:attr(data-vide);color:var(--ink-3)}
/* Sur un écran étroit la fenêtre n'a plus deux colonnes à donner : la liste
   passe au-dessus de la fiche, raccourcie pour ne pas la repousser. */
@media (max-width:640px){
  .zonesReg{grid-template-columns:minmax(0,1fr)}
  .listeZ{max-height:26dvh}
}
/* Une fenêtre à onglets ne garde pas la même hauteur d'un volet à l'autre :
   centrée, elle remontait et redescendait à chaque clic, et la barre d'onglets
   fuyait sous le curseur qui venait de la viser. Elle s'accroche donc par le
   haut, à distance fixe du bord : c'est le bas qui bouge, là où l'on ne
   regarde pas — et « glisseFenetre » y mène en glissant. */
.modale[data-genre="large"]{align-items:start;padding-block-start:min(7vh,54px)}
.modale[data-genre="large"] .mfen{width:min(760px,100%);
  /* le haut mange sa part de l'écran : la hauteur maximale la lui rend, sans
     quoi le pied de la fenêtre sortirait par le bas sur un écran court */
  max-height:calc(100dvh - min(7vh,54px) - 20px)}
.reglages{margin-top:10px}
.reglages label{display:flex;align-items:center;gap:9px;font-size:14px;
  cursor:pointer;padding:7px 0}
.reglages input{width:16px;height:16px;flex:none;accent-color:var(--accent)}
/* Ce qu'une case promet, en une ligne. « Produits » ou « Points d'intérêt »
   ne se devinent pas depuis leur intitulé, et un réglage qu'on ne comprend
   pas ne se touche pas. L'alignement reprend la case et son écart, pour que
   l'aide parte sous l'intitulé et non sous la coche. */
.reglages .aideR{margin:-5px 0 7px 25px;font-size:12px;line-height:1.5;color:var(--ink-3)}
/* Une sorte que rien n'alimente garde son rang, éteinte : l'exploitant qui
   cherche « Produits » doit lire pourquoi la case ne répond pas, plutôt que
   de se demander où elle est passée. */
.reglages label.eteint{cursor:default}
.reglages label.eteint span{color:var(--ink-3)}
.cc{width:24px;height:18px;padding:0;border:1px solid var(--line-strong);border-radius:3px;
  background:none;cursor:pointer;flex:none}
.cc::-webkit-color-swatch-wrapper{padding:1px}
.cc::-webkit-color-swatch{border:none;border-radius:2px}
.calq .opts{display:flex;align-items:center;gap:6px}
.fillbtn{width:20px;height:18px;border:1px solid var(--line-strong);border-radius:3px;
  color:var(--ink-3);display:grid;place-items:center;padding:0}
.fillbtn:hover{border-color:var(--ink-2);color:var(--ink-2)}
.fillbtn svg{width:11px;height:11px;display:block}
.fillbtn svg rect{fill:none;stroke:currentColor;stroke-width:1.5}
.fillbtn[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink)}
.fillbtn[aria-pressed="true"] svg rect{fill:currentColor}
.modale{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:none;
  place-items:center;padding:20px}
.modale.open{display:grid}
/* La fenêtre des critères se regarde en même temps que le plan : on coche, et
   les stands s'éteignent derrière. Elle se range donc à gauche, du côté de la
   liste dont elle décide, et laisse le plan à sa couleur — un voile gris sur ce
   qu'on est venu voir aurait rendu le filtre invisible au moment même où il
   agit. La surface reste cliquable et referme : toucher le plan, c'est en avoir
   fini avec les filtres. */
.modale[data-genre="cote"]{background:none;place-items:center start}
.modale[data-genre="cote"] .mfen{box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
.mfen{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.6);width:min(430px,100%);max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden}
.mfen header{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.mfen h2{font-family:"Archivo",sans-serif;font-size:16px;margin:0;letter-spacing:-.01em}
/* La fenêtre a son propre titre, et sa règle passait devant celle de la fiche
   dans l'aperçu des modèles — qui vit dans une fenêtre. Le nom y prenait seize
   pixels quel que soit le modèle, et le numéro, qui suit la variable, cessait
   de lui être proportionnel. L'aperçu doit montrer la fiche, pas la fenêtre. */
.mfen .detail-hd h2{font-size:var(--titre)}
.mfen header button{color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}
.mfen header button:hover{color:var(--ink)}
.mcorps{padding:12px 14px;overflow-y:auto;flex:1}
.mcorps p{margin:0 0 4px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mfen footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;
  border-top:1px solid var(--line)}
.mfen footer .btn.danger{background:#C2372B;border-color:#C2372B;color:#fff}
.mfen footer .btn.danger:hover{filter:brightness(1.1)}
/* Un bouton qui détruit et qu'on n'a pas encore le droit de cliquer. Il reste
   visible et rouge — c'est bien ce qu'il fera — mais éteint : le retirer
   laisserait croire qu'il n'y a rien à faire, le griser en gris le rangerait
   parmi les commandes ordinaires. */
.mfen footer .btn[disabled]{opacity:.4;cursor:default;filter:none}

/* La remise à zéro des compteurs.
   La phrase qui dit « sans retour » ne peut pas se lire comme les autres :
   c'est la seule que l'on regrette de ne pas avoir lue. */
.mcorps p.alerte{color:#C2372B;font-weight:500}
.mcorps p.etatRaz{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;
  color:var(--ink-3);line-height:1.5}
.mcorps p.etatRaz.err{color:#C2372B}
.mcorps .razMot{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:13px}
.mcorps .razMot span{color:var(--ink-2)}

/* Le panneau des critères. Chaque groupe porte son intitulé et ses valeurs en
   puces : elles se touchent du pouce, se lisent d'un coup d'œil, et portent le
   nombre de fiches que chacune retient — sans lui, on coche à l'aveugle. Le
   titre du groupe, lui, ne dit que ce qui y est retenu. */
.grp-crit{padding:0;border-top:1px solid var(--line)}
.grp-crit:first-child{border-top:none}
/* Le titre est la prise : replié, un critère tient sur une ligne, et la
   fenêtre montre tous les critères plutôt qu'un seul déplié. */
.grp-crit > summary{display:flex;align-items:center;gap:9px;padding:11px 2px;
  cursor:pointer;list-style:none}
.grp-crit > summary::-webkit-details-marker{display:none}
.grp-crit > summary::after{content:"";width:7px;height:7px;margin-left:auto;
  border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.grp-crit[open] > summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.grp-crit > summary .t{font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2)}
.grp-crit > summary .r{font-size:11.5px;color:var(--ink-3)}
.grp-crit > summary .r[data-on="true"]{color:var(--accent);font-weight:600}
/* Un critère réglé mais que rien ne renseigne : seul l'exploitant le voit, et
   il doit le voir comme un manque, pas comme un filtre parmi d'autres. */
.grp-crit > summary .r[data-manque="true"]{color:var(--rouge,#C2372B)}
.vide-crit{margin:0 0 10px;font-size:12px;color:var(--ink-3);line-height:1.5}
.grp-crit > *:last-child{margin-bottom:10px}
.grp-crit .tamis{width:100%;margin-bottom:8px;padding:6px 10px;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.grp-crit .tamis:focus{border-color:var(--accent);background:var(--surface);outline:none}
/* Un critère à cent valeurs ne pousse pas le pied de la fenêtre hors de vue :
   il défile dans son propre cadre, et le tamis au-dessus le raccourcit. */
.puces-crit{display:flex;flex-wrap:wrap;gap:6px;max-height:38dvh;overflow-y:auto}
.puce-crit{display:inline-flex;align-items:center;gap:6px;max-width:100%;
  padding:6px 10px;font-size:12.5px;color:var(--ink-2);text-align:left;
  background:var(--surface-2);border:1px solid transparent;border-radius:999px}
.puce-crit:hover{border-color:var(--line-strong)}
.puce-crit[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--ink);font-weight:600}
.puce-crit .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce-crit .n{font-size:11px;color:var(--ink-3);flex:0 0 auto}
.puce-crit[aria-pressed="true"] .n{color:var(--accent)}
.puces-crit .aucune{font-size:12px;color:var(--ink-3)}
.compte-crit{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3)}

/* liste réordonnable : le premier rang est le plus en avant */
.ordre{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ordre li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  padding:7px 9px;border:1px solid transparent;border-radius:4px;background:var(--surface-2);
  font-size:13px;cursor:grab}
.ordre li:hover{border-color:var(--line-strong)}
.ordre li.drag{opacity:.4}
.ordre li.avant{box-shadow:inset 0 2px 0 var(--accent)}
.ordre li.apres{box-shadow:inset 0 -2px 0 var(--accent)}
.ordre .poignee{color:var(--ink-3);font-size:13px;line-height:1;cursor:grab}
.ordre .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordre .genre{font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;
  border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:6px}
.ordre .bouts{display:flex;gap:2px}
.ordre .bouts button{width:22px;height:20px;border:1px solid var(--line);border-radius:3px;
  color:var(--ink-3);font-size:11px;line-height:1}
.ordre .bouts button:hover{border-color:var(--accent);color:var(--accent)}
.reorg{width:100%;margin-bottom:8px;padding:6px;border:1px solid var(--line);
  border-radius:var(--radius);font-size:12px;color:var(--ink-2)}
.reorg:hover{border-color:var(--accent);color:var(--accent)}

.importzone{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.importzone textarea{width:100%;height:76px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  padding:6px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface-2);color:var(--ink);resize:vertical}
.importzone textarea:focus{border-color:var(--accent);outline:none}
.importzone .rangee{display:flex;gap:10px}
.adminbar{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--line)}
.panel .reset{font-size:12px;color:var(--ink-3);text-decoration:underline}
/* Publier n'est pas un réglage parmi d'autres : c'est le geste qui rend le
   travail visible aux visiteurs. Il se distingue des liens qui l'entourent. */
.panel .reset.fort{display:block;width:100%;padding:7px 10px;
  text-decoration:none;text-align:center;color:#fff;background:var(--accent);
  border-radius:var(--radius);font-weight:500}
.panel .reset.fort:hover{opacity:.9;color:#fff}
.panel .reset:hover{color:var(--ink)}

.voile{position:fixed;inset:0;background:rgba(8,10,12,.55);z-index:14;
  opacity:0;pointer-events:none;transition:opacity .2s;display:none}

@media (max-width:900px){
  /* `1fr` ne borne pas : un élément de grille garde `min-width:auto`, et la
     barre de titre — nom de l'événement et pavillons, tous en `nowrap` —
     imposait sa largeur incompressible à toute la colonne. Sur un écran de
     412 px la page s'étalait sur 579, et le plan sortait par la droite.
     `minmax(0,1fr)` autorise la colonne à rétrécir ; encore faut-il que son
     contenu l'accepte, d'où les `min-width:0` qui suivent. */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar,.brand{min-width:0}
  .topbar{gap:10px}
  .brand h1{overflow:hidden;text-overflow:ellipsis}
  /* Les pavillons défilent latéralement plutôt que de pousser les murs. C'est
     donc à eux de céder la place en premier : ils restent atteignables au
     doigt, là où un titre tronqué à trois lettres ne se retrouve pas. */
  .brand{flex:0 1 auto;max-width:40%}
  .halls{flex:1 1 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
