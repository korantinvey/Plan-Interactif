 * Où se range la marque de la fiche.
 *
 * Le flex sait replier une ligne, il ne sait pas changer de ligne d'accueil :
 * une marque qui ne tient pas à côté du nom se retrouvait seule sur une ligne
 * à elle, entre le nom et le numéro, et coûtait une bande pour ne rien dire de
 * plus. Elle rejoint donc la ligne du numéro, derrière lui.
 *
 * Ce qui tient n'est pas calculé, il est demandé : la marque est posée à côté
 * du nom, on regarde où le navigateur l'a mise, et on la déménage si elle est
 * tombée dessous. Le pli dépend de la fonte, du modèle de fiche et de la
 * largeur du panneau — trois choses qu'un calcul aurait fallu refaire à chaque
 * fois qu'elles changent.
 *
 * Sur la ligne du numéro, sa largeur est bornée à ce qui reste : sans borne
 * elle repartirait à la ligne, et le déménagement n'aurait fait que déplacer
 * la bande perdue.
 */
function rangeMarque(){
  const marque = $("dLogo");
  // rien à ranger tant qu'elle n'est qu'une place tenue : sa largeur décidera
  if (!marque || marque.hidden || marque.dataset.attend !== undefined) return;
  const nom = $("detail").querySelector(".hdNom"), bas = $("dBadges");
  const titre = nom && nom.querySelector("h2");
  if (!titre || !bas) return;
  // remise à l'essai avant de mesurer : la fiche d'avant a pu la déménager
  marque.style.maxWidth = "";
  if (marque.parentNode !== nom) nom.appendChild(marque);
  // elle tient à côté du nom dès que les deux boîtes se croisent en hauteur
  if (marque.getBoundingClientRect().top < titre.getBoundingClientRect().bottom - 2) return;

  /* Tombée dessous, elle tiendrait encore à côté du nom en y rétrécissant. Un
     logo en largeur, une fois ses marges retirées, réclame ses trois cents
     pixels et ne tient plus jamais à côté du nom — alors que, sous le numéro,
     la pastille lui en prend la moitié. On la garde donc là où elle reste la
     plus grande. La place à côté du nom se mesure maintenant, pendant que la
     marque y est encore et que la réserve du coin est donc la sienne. */
  const n = nom.getBoundingClientRect(), sn = getComputedStyle(nom);
  const aCote = Math.floor(n.right - (parseFloat(sn.paddingRight) || 0) -
    titre.getBoundingClientRect().right - (parseFloat(sn.columnGap) || 0)) - 1;

  bas.appendChild(marque);
  /* Ce qui reste sur la ligne du numéro : du bord droit de la dernière
     pastille au bord intérieur du bloc — celui-ci recule là où un modèle de
     fiche réserve la place d'un numéro géant. */
  const r = bas.getBoundingClientRect(), st = getComputedStyle(bas);
  const pastilles = [...bas.children].filter(e => e !== marque && !e.hidden);
  const derniere = pastilles[pastilles.length - 1];
  const gauche = derniere ? derniere.getBoundingClientRect().right
                          : r.left + (parseFloat(st.paddingLeft) || 0);
  const droite = r.right - (parseFloat(st.paddingRight) || 0);
  const dessous = droite - gauche - 10;
  if (aCote >= 90 && aCote > dessous){
    nom.appendChild(marque);
    marque.style.maxWidth = aCote + "px";
    return;
  }
  // réduite à un trait elle ne se lit plus : mieux vaut alors la laisser passer
  marque.style.maxWidth = Math.max(90, dessous) + "px";
}

/* Le panneau ne fait pas la même largeur en colonne et en tiroir, et le pli
   suit : une marque rangée sous le numéro à l'étroit remonte à côté du nom au
   large. Une image seule à mesurer, on ne diffère pas. */
addEventListener("resize", () => {
  if ($("detail") && $("detail").classList.contains("open")) rangeMarque();
});

/**
 * La fiche d'un stand ou d'une zone.
 *
 * `iSoc` désigne la société regardée sur un stand partagé : absent, on demande
 * laquelle ; -1, le titulaire ; sinon le rang du co-exposant. L'emplacement,
 * lui, ne change pas — c'est le même stand qu'on regarde par deux entrées.
 *
 * `depuis` est la forme du plan d'où la fiche s'étire — le nœud, et non sa
 * place à l'écran : celle-ci ne se mesure qu'à la fin, quand la fiche est
 * posée et le plan cadré. `recentrer` dit s'il faut amener le plan sur
 * l'emplacement ; c'est ici que cela se fait, et pas plus tôt, la fiche étant
 * seule à savoir ce qu'elle masque.
 */
function ouvre(o, depuis, canal, iSoc, recentrer){
  const zone = o.kind === "zone";
  const heberges = (!zone && o.coex) || [];
  /* Le choix retiré, le stand mène droit à son titulaire — c'est lui qui loue
     l'emplacement, et c'est son nom qui est peint sur la cloison. Les sociétés
     qu'il héberge restent atteignables par la liste : le réglage allège le
     plan, il ne retire personne du salon. */
  const plusieurs = heberges.length > 0 && coexChoisit();
  if (plusieurs && iSoc === undefined){ choisitExposant(o, depuis, canal, recentrer); return; }
  /* Un stand sans co-exposant n'a pas de rang à passer : il n'en a qu'un, et
     c'est le titulaire. Le ramener ici évite d'avoir à distinguer « absent »
     de « titulaire » dans tout ce qui suit. */
  const iS = iSoc === undefined ? -1 : iSoc;
  /* La société affichée. Le titulaire porte ses champs à plat sur le stand :
     c'est le stand lui-même qui fait office de fiche. */
  const soc = iS >= 0 ? heberges[iS] : o;
  // la fiche, le parcours et l'itinéraire se partagent la même bande, à
  // droite comme en bas
  fermeParcours(); fermeItineraire();
  const t = zone ? "zone" : "stand";
  const ok = (cle, v) => montre(t, cle) ? v : "";
  /* « Zone organisateur » n'apprenait rien : la forme et la couleur le disent.
     Le type, lui, apprend quelque chose — c'est même tout ce qu'une zone dit
     de sa fonction, et ce qui la fait répondre au cartouche. */
  const genre = zone ? typeZone(o) : null;
  $("dKind").textContent = zone ? (genre ? genre.nom : "") : "Stand";
  $("dKind").hidden = zone && !genre;
  const titre = (zone ? nomDeLaZone(o) : soc.nom) || soc.plan ||
    (zone ? "Zone sans nom" : ("Stand " + (o.code || "")).trim());
  $("dName").textContent = titre;
  /* Le logo, dans l'en-tête avec le type et le nom : c'est une marque, elle se
     lit avec ce qu'elle nomme et non parmi les champs. Sans intitulé au-dessus
     d'elle — une image se reconnaît sans qu'on la nomme.

     Deux origines, une seule place. Sur une zone, c'est ce que l'exploitant y a
     déposé, qui voyage dans la fiche et se relit comme la description — il
     vient du même endroit, et finit au même endroit. Sur un stand, c'est le
     logo de l'enseigne lu chez la source, et il suit la société qu'on regarde
     plutôt que l'emplacement : sur un stand partagé, chaque hébergée montre le
     sien. Celui-là ne se charge qu'à l'ouverture de la fiche, ce qui le garde
     ici et hors de la liste — les cinq cents logos d'un salon comme Franchise
     Expo pèsent soixante-dix mégaoctets, quand une fiche n'en charge qu'un. */
  /* La vignette d'abord : fabriquée à la synchronisation, elle arrive recadrée
     et légère, et se garde d'une visite à l'autre. L'adresse d'origine reste
     le recours — un logo que la synchronisation n'a pas encore vu, ou dont la
     source a refusé de se laisser lire, se charge chez elle comme avant. */
  poseMarque(ok("logo", zone ? imageSure(o.logo)
                             : adresseVignette(soc.vignette) || adresseImage(soc.logo)));
  const pl = DATA.plans[o.p] || P();
  poseCode(pl, ok("code", o.code) ? String(o.code) : "",
           !zone && o.code ? String(o.code) : "", !zone ? o.hall : "");
  /* De quoi revenir au choix sans refermer la fiche : sur un stand partagé, on
     compare souvent deux enseignes voisines. */
  const part = $("dPartage");
  part.hidden = !plusieurs;
  if (plusieurs){
    part.textContent = (heberges.length + 1) + " exposants ici";
    part.onclick = () => choisitExposant(o, null, canal, false);
  }
  /* La pastille des nouveaux venus. Elle ne paraît que si la synchronisation
     l'a posée — le champ qui la porte n'existe pas sur tous les salons — et
     que l'exploitant la laisse voir. Une zone organisateur n'est jamais
     nouvelle : elle n'est pas un exposant. */
  $("dNeuf").hidden = zone || !soc.neuf || !montre("stand", "nouveau");
  // sur une zone, le programme qu'elle accueille ; sur un stand, les
  // conférences que son exposant tient, où qu'elles se tiennent
  /* Le programme est rattaché au stand par le dossier de son titulaire : la
     source ne dit pas quelle conférence revient à une société hébergée, et la
     lui prêter serait une invention. */
  const sien = (!zone && iS < 0 && pl.parStand && pl.parStand.get(o.id)) || [];
  const confs = ok("conferences", zone
    ? programme(P().parZone && P().parZone.get(o.id))
    : programme(sien, "Conférences"));
  /* Le corps de la fiche, champ par champ sous sa clé plutôt que d'un seul
     tenant : l'ordre de lecture n'est pas le même d'un salon à l'autre — ici
     la nomenclature prime, là l'adresse — et c'est l'exploitant qui le règle
     depuis les réglages du plan. Le rangement vient après, une fois tout
     écrit, et réunit sous un même titre les champs qu'il a groupés.

     Ni la surface, ni les angles ouverts, ni l'état de commercialisation
     n'apprennent quoi que ce soit au visiteur : ils n'y figurent pas. */
  const corps = {};
  /**
   * Pose un champ du corps sous sa clé : son intitulé, sa valeur, et la classe
   * qui le range. Un champ que le salon n'affiche pas, ou qui ne porte rien, ne
   * se pose pas du tout — c'est cette absence que le rangement lit ensuite.
   *
   * La valeur est une chaîne quand le champ n'en porte qu'une, un tableau de
   * lignes déjà habillées quand il en porte plusieurs : réunie dans un groupe,
   * la première devient une ligne à son tour, et les secondes s'y versent
   * telles quelles.
   *
   * La classe « court » marque les champs qui tiennent en un mot : sur mobile
   * ils se rangent deux par deux au lieu d'allonger la fiche d'autant de
   * lignes.
   *
   * La clé voyage avec le champ : c'est elle qui dit si son intitulé paraît,
   * et le rangement la perdrait de vue une fois les champs réunis en groupes.
   */
  const met = (cle, libelle, valeur, classe) => {
    const v = Array.isArray(valeur) ? valeur.filter(Boolean) : valeur;
    if (!v || !v.length || !montre(t, cle)) return;
    corps[cle] = { cle: cle, libelle: libelle, valeur: v, classe: classe || "" };
  };
  // la raison sociale n'apprend rien quand elle est déjà le titre
  if (!zone && soc.plan && soc.plan !== titre) met("raison", LIBELLE_CORPS.raison, esc(soc.plan));
  /* Le secteur décrit l'emplacement, pas son occupant : il reste au stand,
     quelle que soit la société qu'on y regarde. Son libellé est résolu à la
     synchronisation, la page l'affiche tel quel. */
  met("secteur", LIBELLE_CORPS.secteur, o.sect ? esc(o.sect) : "");
  met("adresse", LIBELLE_CORPS.adresse, soc.adr ? esc(soc.adr) : "");
  /* Les champs courts s'apparient deux par deux sur mobile : l'ordre réglé
     décide donc aussi de qui se retrouve à côté de qui, et un champ long
     glissé au milieu d'eux y laisse une demi-ligne vide. */
  /* Le code postal n'a pas de ligne à lui : il se pose devant la ville, comme
     sur une enveloppe. Il reste à part jusqu'ici pour que le filtre « Ville »
     coche des villes et non des codes postaux. */
  met("ville", LIBELLE_CORPS.ville,
    esc([soc.cp, soc.ville].filter(Boolean).join(" ")), "court");
  met("pays", LIBELLE_CORPS.pays, soc.pays ? esc(soc.pays) : "", "court");
  /* Les niveaux décrivent l'emplacement, pas son occupant : ils restent au
     stand, quelle que soit la société qu'on y regarde. */
  met("niveaux", LIBELLE_CORPS.niveaux, o.niveaux > 1 ? String(o.niveaux) : "", "court");
  // le téléphone reste appelable d'un mobile, où le plan est le plus consulté
  met("telephone", LIBELLE_CORPS.telephone, soc.tel
    ? '<a href="tel:' + esc(String(soc.tel).replace(/[^+\d]/g, "")) + '">' + esc(soc.tel) + '</a>'
    : "", "court");
  met("site", LIBELLE_CORPS.site, lien(soc.site));
  met("facebook", LIBELLE_CORPS.facebook, pictoRS("facebook", soc.fb));
  met("linkedin", LIBELLE_CORPS.linkedin, pictoRS("linkedin", soc.li));
  met("instagram", LIBELLE_CORPS.instagram, pictoRS("instagram", soc.ig));
  // le libellé est résolu à la synchronisation : la page l'affiche tel quel
  met("nomenclature", LIBELLE_CORPS.nomenclature, (soc.nomencl || [])
    .map(n => '<span class="ligne">' + esc(String(n)) + '</span>'));
  /* Les thématiques disent ce que l'exposant vient faire là, quand la
     nomenclature dit ce qu'il vend ; un salon qui n'en tient pas ne reçoit pas
     la clé du tout.

     Chacune mène aux exposants qui la partagent — mais seulement là où
     l'exploitant en a fait un critère : ailleurs, rien ne saurait dresser la
     liste promise, et une thématique qui ne mène nulle part vaut mieux en
     texte qu'en lien mort. */
  met("thematiques", LIBELLE_CORPS.thematiques, (soc.themes || [])
    .map(n => themeFiltrable(n)
      ? '<button type="button" class="ligne theme" data-t="' +
        esc(String(n)) + '">' + esc(String(n)) + '</button>'
      : '<span class="ligne">' + esc(String(n)) + '</span>'));
  /* Les champs que ce salon-ci s'est ajoutés : l'ordre par défaut les range
     derrière ce que toutes les fiches ont en commun — ils lui sont propres,
     ils ne passent pas d'office devant l'adresse — sans empêcher l'exploitant
     de les faire remonter. */
  const perso = (!zone && DATA.fiche && DATA.fiche.perso) || [];
  perso.forEach(c => {
    // le point-virgule sépare les valeurs d'un champ à choix : la fiche les
    // montre l'une sous l'autre plutôt qu'en une ligne à rallonge
    const fr = separeValeurs((soc.perso || {})[c.cle]);
    const en = separeValeurs((soc.perso_en || {})[c.cle]);
    if (!fr.length && !en.length) return;
    /* Deux versions quand l'exploitant a désigné une origine anglaise : les
       deux sont posées, et la langue de la page dit laquelle se voit — la
       bascule n'a ainsi rien à redessiner, comme pour la description d'une
       zone. Ce qui vient de la source ne passe pas par le dictionnaire : un
       champ à choix y trouve l'anglais de ses valeurs, un texte libre n'y
       trouverait rien. Une seule version sert aux deux langues.

       Le marqueur va sur un bloc qui les réunit, et non sur chaque ligne : la
       règle qui cache l'autre langue est moins spécifique que celle qui fait
       des lignes des blocs, et une ligne marquée restait visible. Le bloc,
       lui, n'a rien qui lui dispute son affichage — et les lignes d'une
       langue gardent entre elles l'écart qu'elles ont ailleurs. */
    const lignes = (l) => l.map(x => '<span class="ligne">' + esc(x) + '</span>');
    const bloc = (l, lg) => '<div data-lg="' + lg + '" translate="no">' +
      lignes(l).join("") + '</div>';
    const seule = fr.length ? fr : en;
    met(PREFIXE_PERSO + c.cle, esc(c.libelle),
      fr.length && en.length ? [bloc(fr, "fr"), bloc(en, "en")]
      : seule.length > 1 ? lignes(seule)
      : esc(seule[0]));
  });
  /* Ce que l'exploitant a écrit sur une zone, depuis les réglages du plan.
     C'est tout ce qu'une zone a en propre : Klipso ne lui donne qu'un nom et
     un contour, et le reste de ce corps décrit un exposant qu'elle n'a pas.

     La description porte du balisage, puisqu'elle s'écrit dans un éditeur :
     elle est relue avant d'être posée dans la fiche. Le libellé du champ ne
     paraît qu'avec lui — une zone sans description n'a pas à annoncer qu'elle
     n'en a pas. */
  if (zone){
    /* Deux descriptions quand l'exploitant a écrit l'anglaise : les deux sont
       posées, et la langue de la page dit laquelle se voit — la bascule n'a
       ainsi rien à redessiner. Ce que l'exploitant a écrit dans une langue ne
       passe pas par le dictionnaire. Sans version anglaise, la française sert
       aux deux. */
    const riche = (h, lg) => '<div class="riche"' + (lg ? ' data-lg="' + lg + '" translate="no"' : "") +
      '>' + assainitRiche(h) + '</div>';
    met("description", LIBELLE_CORPS.description, !o.description && !o.description_en ? ""
      : o.description && o.description_en ? riche(o.description, "fr") + riche(o.description_en, "en")
      : riche(o.description || o.description_en));
    met("lien", LIBELLE_CORPS.lien, lien(o.lien));
  }
  /* Une zone ne se range pas dans l'ordre réglé pour les fiches : celui-ci
     range des champs d'exposant, qu'elle n'a pas, et les deux siens se lisent
     dans le seul ordre qui leur convienne — ce qu'elle est, puis où en savoir
     plus. */
  const infos = zone
    ? [corps.description, corps.lien].filter(Boolean).map(champCorps).join("")
    : corpsRange(ordreCorps(perso.map(c => PREFIXE_PERSO + c.cle)), corps);
  /* Un stand se lit dans cet ordre : qui est l'exposant, puis ce qu'il
     anime — ses conférences peuvent être nombreuses, et repoussaient
     l'adresse et les contacts hors de l'écran. Une zone se présente d'abord —
     ce qu'on y trouve — et déroule son programme ensuite. */
  const bloc2 = (cls, id, h) =>
    '<div class="' + cls + '" id="' + id + '" role="tabpanel">' + h + '</div>';
  /* Ce qu'est l'exposant et ce qu'il anime se partagent la fiche dès qu'il y
     a les deux — un stand sans conférence n'a rien à mettre en face, une zone
     n'a pas de fiche. La largeur décide ensuite de la forme : deux colonnes
     au large, deux onglets à l'étroit. */
  const partage = !zone && !!confs && !!infos;
  $("detail").classList.toggle("deux", partage);
  $("dOnglets").hidden = !partage;
  $("dOngNb").textContent = partage && sien.length ? sien.length : "";
  // une fiche s'ouvre sur le détail : c'est ce qu'on est venu y lire
  onglet("detail");
  $("dBody").innerHTML = bloc2("cInfos", "dPaneInfos", infos) +
    bloc2("cConf", "dPaneConf", confs) +
    '<div class="acts"><button class="btn" id="dGo">Centrer sur le plan</button>' +
    '<button class="btn itin" id="dItin">Itinéraire</button></div>';
  /* Une conférence ouverte d'ici vient soit du programme d'une salle, soit
     de la fiche de l'exposant qui la tient : ce n'est pas le même chemin. */
  const canalConf = zone ? "salle" : "exposant";
  $("dBody").querySelectorAll("[data-conf]").forEach(b =>
    b.onclick = () => ficheConf(b.dataset.conf, canalConf));
  /* Le signet du parcours vit en haut, à côté de la croix : retenir un
     exposant porte sur la fiche entière. Une zone organisateur ne se retient
     pas elle-même — ce sont ses conférences qu'on ajoute, chacune à son heure. */
  const sig = $("dMarque");
  sig.hidden = zone;
  if (zone) { delete sig.dataset.mg; delete sig.dataset.mi; }
  else { sig.dataset.mg = "stand"; sig.dataset.mi = o.id; }
  // un seul branchement pour le signet de tête et ceux du programme
  brancheParcours($("detail"));
  /* Une thématique lue sur une fiche est une porte vers les autres exposants
     qui la partagent : c'est le chemin qu'on prend quand on a trouvé à peu
     près ce qu'on cherchait, et qu'on veut voir le reste. */
  $("dBody").querySelectorAll(".theme").forEach(b =>
    b.onclick = () => filtreTheme(b.dataset.t));
  $("dGo").onclick = () => centre(o);
  // « j'y vais » : l'arrivée est celle qu'on lit, le départ reste à dire
  $("dItin").onclick = () => versItineraire(o);
  // le crayon vit dans l'en-tête, à côté du nom, et non parmi les actions
  const cr = $("dRen");
  if (cr){
    cr.hidden = !(ADMIN && zone);
    cr.onclick = () => ficheZone(o);
  }
  /* Une zone technique — réserve, quai de livraison — n'apprend rien au
     visiteur. L'exploitant l'éteint d'ici, et la pastille dit l'état avant
     d'être un bouton : elle ne paraît qu'en administration, seule vue où une
     zone éteinte soit encore là. */
  const vis = $("dVis");
  if (vis){
    vis.hidden = !(ADMIN && zone);
    if (!vis.hidden){
      const affichee = !o.masquee;
      vis.textContent = "Affiché : " + (affichee ? "oui" : "non");
      vis.setAttribute("aria-pressed", affichee ? "true" : "false");
      vis.title = affichee
        ? "Retirer cette zone du plan public"
        : "Remettre cette zone sur le plan public";
      vis.onclick = () => basculeAffichageZone(o);
    }
  }
  /* La marque se range une fois l'en-tête entièrement écrit : c'est la largeur
     des pastilles qui décide de la sienne, et elles viennent d'être posées.
     Une image encore en vol se rangera à son tour, à son « load ». */
  rangeMarque();
  $("detail").classList.add("open");
  $("voile").classList.add("on");
  ecarteClicFantome();
  /* Le plan vient sur l'emplacement maintenant, et non avant d'ouvrir : la
     fiche est posée, et sa largeur — une ou deux colonnes, on ne le sait
     qu'après l'avoir remplie — dit enfin au cadrage ce qu'elle couvre. Un seul
     ordre pour les deux écrans, là où il en fallait un par écran. */
  if (recentrer) centre(o);
  anime(() => rectVisee(depuis), 1);
  // une zone organisateur n'est pas un exposant : elle ne compte pas ici
  if (!zone) mesure("fiche_stand", canal, o.id);
}
function ferme(){
  const id = state.sel, ouvert = $("detail").classList.contains("open");
  /* La forme d'où la fiche est partie, relevée tant que la sélection tient
     encore : c'est elle qui dit si l'on repliait vers un emplacement ou vers
     le découpage qu'il héberge. Sa boîte, elle, se mesure plus bas et
     seulement si l'on anime — la classe « sel » qu'on retire ici ne change
     qu'un remplissage, jamais le contour qui la donne. */
  const n = ouvert && id ? noeud(id, state.selSoc) : null;
  document.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
  state.sel = null; state.selSoc = -1;
  dessineMarques();
  marqueStandsDessines();
  // fermer ne change que la ligne marquée : la liste reste ce qu'elle montrait
  marqueChoisie(); libelles(); $("voile").classList.remove("on");
  if (ouvert) anime(() => n && (GL.actif ? rectEcranWebgl(n) : n.getBoundingClientRect()), -1);
}
/* Les onglets ne font que choisir ce qu'on regarde : la fiche est construite
   entière, et la bascule ne relit rien. */
function onglet(n){
  $("detail").dataset.onglet = n;
  $("dOngInfo").setAttribute("aria-selected", String(n !== "prog"));
  $("dOngProg").setAttribute("aria-selected", String(n === "prog"));
}
$("dOngInfo").onclick = () => onglet("detail");
$("dOngProg").onclick = () => onglet("prog");
$("closeDetail").onclick = ferme;
$("voile").onclick = ferme;

/* ============================================================
   8. Interactions du plan
   ============================================================ */
let drag = null;

/* ------------------------------------------------------------------
   Pincement à deux doigts.

   Le plan interdit au navigateur de gérer le toucher — « touch-action: none »
   — parce qu'il déplace la vue lui-même. Il lui revient donc aussi de gérer le
   pincement, sinon il n'existe pas : c'est ce qui manquait sur téléphone.

   On garde le point du plan qui était sous le milieu des deux doigts, et on
   le maintient dessous. L'écartement donne l'échelle, le déplacement du milieu
   donne la translation : les deux gestes se font d'un seul mouvement, comme on
   s'y attend.
   ------------------------------------------------------------------ */
const doigts = new Map();
let pince = null;

const milieu = () => {
  const l = [...doigts.values()];
  return { x: (l[0].x + l[1].x) / 2, y: (l[0].y + l[1].y) / 2,
           d: Math.hypot(l[0].x - l[1].x, l[0].y - l[1].y) };
};

function commencePince(){
  const m = milieu();
  const r = cadrePlan();
  pince = {
    d: Math.max(1, m.d),
    w: view.w, h: view.h,
    // le point du plan sous le milieu, celui qui ne doit pas bouger
    ancre: [view.x + (m.x - r.left) / r.width * view.w,
            view.y + (m.y - r.top) / r.height * view.h],
  };
  drag = null;
  saisitPlan(false);
}

function suitPince(){
  const m = milieu();
  const r = cadrePlan();
  // le pincement change l'échelle : mêmes économies que la molette
  figeTextes();
  plieLesBandes(true);
  const large = emp ? (emp.x1 - emp.x0) * recul() : pince.w * 8;
  const nw = Math.min(large, Math.max(6, pince.w * pince.d / Math.max(1, m.d)));
  const nh = pince.h * (nw / pince.w);
  view = {
    x: pince.ancre[0] - (m.x - r.left) / r.width * nw,
    y: pince.ancre[1] - (m.y - r.top) / r.height * nh,
    w: nw, h: nh,
  };
  rafraichitVue();
}

/**
 * La main qui tient le plan, ou qui le lâche.
 *
 * Le curseur ne change que pour une souris, parce qu'il s'hérite : le poser
 * sur le plan remet en cause le style de ses sept mille nœuds — cent cinquante
 * millisecondes, au doigt posé, puis autant au doigt levé. Sur un écran
 * tactile, ces trois cents millisecondes étaient dépensées pour un curseur que
 * personne ne voit ; elles retardaient tout le reste, et la fiche du stand
 * suivant semblait attendre une animation qui n'a pas lieu.
 *
 * Lâcher écrit quand même, quelle que soit la main : une souris qui a saisi le
 * plan avant qu'un doigt s'y pose doit retrouver son curseur. Réécrire la
 * valeur qui est déjà là ne coûte rien — c'est la changer qui coûte.
 *
 * Il vit en style en ligne plutôt qu'en classe pour la même raison : une règle
 * qui parle de « cursor » ferait le même travail, sans qu'on puisse choisir
 * quand.
 */
/* Les deux bandes s'effacent le temps qu'on manipule le plan.

   Celle du haut porte le salon, celle du bas la recherche ; ensemble elles
   prennent près de deux cents points d'un écran de téléphone, et ce sont
   exactement ceux qu'on veut voir quand on fait glisser un hall ou qu'on
   l'agrandit. Elles se retirent donc le temps du geste et reviennent au doigt
   levé — la barre par-dessus la scène, le tiroir sous le bord de l'écran, l'un
   et l'autre sans que rien ne soit remis en page : le plan ne change pas de
   taille, il se découvre.

   Pas au doigt posé : un appui qui ouvre un stand les ferait clignoter pour
   rien. C'est le mouvement qui les plie — le glissement une fois passé le
   seuil des deux points, le pincement dès la première image.

   Un filet, comme pour les textes du plan : tous les chemins ne mènent pas à
   un doigt levé — un `pointercancel` du système, une main qui sort de l'écran
   — et elles resteraient pliées sur un plan qu'on ne manipule plus. */
let bandesPliees = false, filetBandes = null;
function plieLesBandes(oui){
  const b = $("bandeau"), tiroir = $("side");
  if (!b || !ETROIT() || document.documentElement.classList.contains("mode-admin")) return;
  clearTimeout(filetBandes);
  filetBandes = oui ? setTimeout(() => plieLesBandes(false), 1200) : null;
  if (bandesPliees === oui) return;
  bandesPliees = oui;
  b.classList.toggle("pliee", oui);
  /* Le tiroir retrouve son cran en remontant : c'est une classe de plus sur
     lui, non un cran de moins — celui qu'il avait est écrit dans son attribut,
     et personne n'y touche ici. */
  if (tiroir) tiroir.classList.toggle("pliee", oui);
}

const saisitPlan = (tenu) => {
  // la main lâche : les bandes reviennent, quelle que soit la façon dont le geste finit
  if (!tenu) plieLesBandes(false);
  if (tenu && dernierAppuiTactile) return;
  svg.style.cursor = tenu ? "grabbing" : "";
};

svg.addEventListener("pointerdown", e => {
  dernierAppuiTactile = e.pointerType === "touch" || e.pointerType === "pen";
  // la main posée l'emporte sur la molette : un glissement qui finissait sa
  // course tirerait la vue sous le doigt qui vient de la saisir
  stoppeZoom();
  /* Un « pointerup » se perd parfois — la main sort de l'écran, le navigateur
     passe la main à un geste système. Le doigt restait alors inscrit, et
     l'appui suivant passait pour le second d'un pincement : plus rien ne
     répondait. Le premier doigt d'un geste ouvre donc une table vierge. */
  if (e.isPrimary) doigts.clear();
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 2){ commencePince(); return; }
  if (doigts.size > 2) return;
  /* Placer un libellé passe avant tout le reste : le geste vise un nom, pas
     l'emplacement qui est dessous ni la vue qu'on déplacerait. */
  /* Caler la carte passe avant tout : tant qu'un mode est armé, la main saisit
     le fond et non le plan — c'est le seul geste que la palette attend. */
  if (typeof cartePointerDown === "function" && cartePointerDown(e)) return;
  if (libellePointerDown(e)) return;
  /* Reprendre la forme d'un emplacement passe avant sa fiche : le geste vise
     la géométrie, pas l'exposant qui la loue. */
  if (geometriePointerDown(e)) return;
  // le contour d'un bâtiment qu'on cale se saisit avant ce qui est dessous
  if (calagePointerDown(e)) return;
  if (dessinPointerDown(e)) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, bouge: false,
           // le SVG caché ne sait plus où tombent ses formes : on demande au dessin
           cible: GL.actif ? cibleWebgl(e.clientX, e.clientY)
                           : e.target.closest("[data-id],[data-poi]") };
  svg.setPointerCapture(e.pointerId); saisitPlan(true);
});
svg.addEventListener("pointermove", e => {
  if (doigts.has(e.pointerId)) doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pince && doigts.size >= 2){ e.preventDefault(); suitPince(); return; }
  if (typeof cartePointerMove === "function" && cartePointerMove(e)) return;
  if (libellePointerMove(e)) return;
  if (geometriePointerMove(e)) return;
  if (calagePointerMove(e)) return;
  if (dessinPointerMove(e)) return;
  if (!drag) return;
  const r = cadrePlan(), k = view.w / r.width;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2){ drag.bouge = true; plieLesBandes(true); }
  view.x = drag.vx - dx; view.y = drag.vy - dy; rafraichitVue();
});
/* ------------------------------------------------------------------
   Le doigt vise plus large que la souris.

   Un stand que la recherche éclaire est parfois un rectangle de quelques
   pixels dans un hall dézoomé : le doigt le couvre entier et tombe à côté une
   fois sur deux — sur le fond, ou sur le voisin éteint. Le résultat se voit,
   et ne s'ouvre pas : c'est le geste même auquel la recherche appelle qui
   échoue.

   Ce qu'elle a retenu déborde donc de sa forme, et lui seul, de juste ce qu'il
   faut pour atteindre la taille d'un doigt. La marge disparaît dès que la forme
   est assez grande, c'est-à-dire dès qu'on a zoomé : elle n'existe que là où
   la précision est impossible, et ne prend jamais la place d'une cible qu'on
   pouvait viser. Le voisin éteint reste ainsi ouvrable — et c'est lui qui lève
   le retrait.

   Les boîtes sont lues sur le rendu plutôt que calculées : stands du salon,
   zones et stands dessinés s'y présentent tous pareil, chacun à l'échelle où
   il est vu. Les repères n'y entrent pas : rien ne les met en retrait, et les
   élargir tous reviendrait à les préférer au reste pendant toute recherche.
   ------------------------------------------------------------------ */
/* La plus petite cible qu'un doigt atteint sans s'y reprendre. Bien en dessous
   des quarante-huit points que recommandent les systèmes : la marge est prise
   sur les stands voisins, qu'il faut pouvoir ouvrir aussi — c'est le rattrapage
   d'un geste imprécis, pas un bouton qu'on dessine. */
const DOIGT = 32;
/* Au-delà, la recherche n'a rien resserré — ses résultats couvrent le hall, et
   leurs marges se chevauchent plus qu'elles n'aident. */
const MAX_ELARGIS = 150;

function cibleElargie(x, y){
  if (!dernierAppuiTactile || !filtre() || retraitLeve) return null;
  if (GL.actif) return cibleWebgl(x, y, DOIGT / 2);
  const allumes = svg.querySelectorAll("#stands g:not(.dim), #zones g:not(.dim)," +
    " #couches .dcal .sdes[data-id]:not(.dim)");
  if (!allumes.length || allumes.length > MAX_ELARGIS) return null;
  let choix = null, mieux = Infinity;
  allumes.forEach(g => {
    const b = g.getBoundingClientRect();
    const mx = (DOIGT - b.width) / 2, my = (DOIGT - b.height) / 2;
    if (mx <= 0 && my <= 0) return;              // déjà à portée du doigt
    const dx = Math.max(b.left - Math.max(mx, 0) - x, x - b.right - Math.max(mx, 0));
    const dy = Math.max(b.top - Math.max(my, 0) - y, y - b.bottom - Math.max(my, 0));
    if (dx > 0 || dy > 0) return;                // hors de la boîte élargie
    // entre deux marges qui se recouvrent, la plus profonde : c'est celle dont
    // on est le plus près du centre
    const d = Math.max(dx, dy);
    if (d < mieux){ mieux = d; choix = g; }
  });
  return choix;
}

/* La capture de pointeur redirige le clic vers le <svg> : on retient la cible
   au pointerdown et on tranche au pointerup. */
svg.addEventListener("pointerup", e => {
  doigts.delete(e.pointerId);
  // un doigt levé met fin au pincement ; celui qui reste ne reprend pas la
  // main sur le déplacement, sans quoi la vue sauterait
  if (pince){ if (doigts.size < 2){ pince = null; drag = null; poseVue(); } return; }
  if (typeof cartePointerUp === "function" && cartePointerUp(e)) return;
  if (libellePointerUp(e)) return;
  if (geometriePointerUp(e)) return;
  if (dessinPointerUp(e)) return;
  if (calagePointerUp(e)) return;
  const d = drag; drag = null; saisitPlan(false);
  try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
  if (d && d.bouge){ poseVue(); return; }
  if (!d) return;
  /* Ce que l'appui désigne. Un appui qui porte sur un objet allumé garde le
     sien — il a touché ce qu'il visait ; les autres reviennent au résultat de
     recherche dont ils débordent la marge, s'il y en a un. */
  const cible = d.cible && !d.cible.classList.contains("dim")
    ? d.cible : (cibleElargie(d.x, d.y) || d.cible);
  /* Le clic dit ce qu'on regarde maintenant : il lève donc la mise en avant
     du cartouche, sauf s'il porte justement sur ce qu'elle éclaire. */
  oublieChoixPoi(cible);
  // et de même le retrait de la recherche, qu'un objet éteint fait tomber
  oublieRetrait(cible);
  /* Poser une borne prend le clic avant tout le reste : ce n'est ni une fiche
     qu'on ouvre ni un bout de trajet qu'on désigne, et l'endroit compte même
     là où il n'y a rien (voir « _borne.html »). */
  if (poseBorneIci(d.x, d.y, cible)) return;
  /* Désigner l'endroit d'un code « Vous êtes ici » se tranche au même rang, et
     pour la même raison : l'endroit compte même là où il n'y a rien, et ce
     n'est pas une fiche qu'on ouvre (voir « _ici.html »). */
  if (codeIciAuPoint(d.x, d.y, cible)) return;
  /* Une visée d'itinéraire en cours prend le clic avant la fiche : c'est un
     point qu'on désigne, pas un exposant qu'on veut lire. */
  if (cible){
    /* Un repère n'est pas un objet du plan : il n'a pas de fiche d'exposant,
       mais il a un nom, et c'est ce qu'on vient lui demander. */
    if (!cible.dataset.id){
      if (visePoi(cible.dataset.poi)) return;
      ouvrePoi(cible.dataset.poi, cible);
      return;
    }
    if (viseItineraire(cible.dataset.id)) return;
    select(cible.dataset.id, false, canalPlan(cible), rangSociete(cible));
  } else { ferme(); finVisee(); }
});
svg.addEventListener("pointercancel", e => {
  doigts.delete(e.pointerId);
  if (doigts.size < 2) pince = null;
  glisseLib = null;
  glisseGeo = null;
  drag = null;
  saisitPlan(false);
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cadrePlan();
  /* Les navigateurs ne comptent pas dans la même unité — pixels, lignes ou
     pages — et un pavé tactile envoie des dixièmes de cran là où une molette
     en envoie un entier. On ramène tout en pixels, puis on en fait un facteur
     exponentiel : deux petits mouvements valent alors exactement un grand,
     et un tour de molette garde les dix-huit pour cent qu'il avait. */
  const px = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? r.height : 1);
  zoom(Math.exp(Math.max(-400, Math.min(400, px)) / 600),
       (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
}, { passive: false });
svg.addEventListener("keydown", e => {
  const g = e.target.closest("[data-id],[data-poi]");
  if (g && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    // le plan se parcourt aussi au clavier : la visée, la mise en avant et le
    // retrait doivent y répondre pareil
    oublieChoixPoi(g);
    oublieRetrait(g);
    if (!g.dataset.id){
      if (!visePoi(g.dataset.poi)) ouvrePoi(g.dataset.poi, g);
      return;
    }
    if (!viseItineraire(g.dataset.id))
      select(g.dataset.id, false, canalPlan(g), rangSociete(g));
  }
});
document.addEventListener("keydown", e => {
  const saisie = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (ADMIN && !saisie && (e.ctrlKey || e.metaKey)){
    const t = e.key.toLowerCase();
    if (t === "z" && !e.shiftKey){ e.preventDefault(); annule(); return; }
    if (t === "y" || (t === "z" && e.shiftKey)){ e.preventDefault(); refais(); return; }
    /* Répéter plutôt que redessiner : c'est ainsi qu'une rangée de stands
       identiques se déroule, la copie prenant la place de la sélection. */
    if (t === "d" && formeSel){ e.preventDefault(); dupliqueForme(); return; }
  }
  if (ADMIN && !saisie && (e.key === "Delete" || e.key === "Backspace") && formeSel){
    e.preventDefault(); supprimeForme(); return;
  }
  /* Le clavier ajuste au quart de mètre ce que la main pose approximativement,
     et au mètre touche majuscule tenue : c'est la finition d'un placement,
     après le glisser qui l'a amené à peu près là. */
  if (PLACE_LIBELLES && libSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseLibelle(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                  e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  /* Un emplacement repris se règle du même pas, pour la même raison : la main
     l'a posé à peu près, le clavier l'ajuste. */
  if (SORTE_GEO && geoSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseGeometrie(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                    e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  /* Une forme choisie se règle du même pas : l'aimant l'a posée contre sa
     voisine, le clavier lui donne l'allée qui les sépare. */
  if (ADMIN && formeSel && !saisie && e.key.indexOf("Arrow") === 0){
    e.preventDefault();
    const pas = e.shiftKey ? 1 : .25;
    pousseForme(e.key === "ArrowLeft" ? -pas : e.key === "ArrowRight" ? pas : 0,
                e.key === "ArrowUp" ? -pas : e.key === "ArrowDown" ? pas : 0);
    return;
  }
  if (e.key === "Escape"){
    if (PLACE_LIBELLES){ modePlacementLibelles(false); return; }
    /* Une forme choisie se relâche d'abord, le mode ensuite : deux crans pour
       une même touche, comme ailleurs sur le plan. */
    if (SORTE_GEO && geoSel){ choisitGeo(null); return; }
    if (SORTE_GEO){ modeGeometrie(null); return; }
    if (enCours){ termineTrace(false); return; }
    if (formeSel){ choisitForme(null); return; }
    if (calqueActif){ activeCalque(calqueActif); return; }
    ferme();
    if ($("panel")) $("panel").classList.remove("open");
  }
  /* Entrée ferme le tracé, et s'arrête là : le bouton qui garde le focus — un
     outil de la palette, « Annuler » — s'activerait sinon dans la foulée, et
     défairait la forme à l'instant posée. */
  if (e.key === "Enter" && !saisie && enCours){ e.preventDefault(); termineTrace(true); }
});

$("btnFiltres").onclick = basculeCriteres;
/* « Tout effacer » ne referme pas : on efface pour recommencer, et le panneau
   resté ouvert montre justement les critères redevenus libres. « Voir les
   résultats » referme, lui — c'est la liste qu'on veut voir. */
$("critVider").onclick = videCriteres;
$("critVoir").onclick = fermeCriteres;
$("zIn").onclick = () => zoom(.75, .5, .5);
$("zOut").onclick = () => zoom(1.33, .5, .5);
$("zFit").onclick = fit;
/* Une recherche n'est pas une frappe. On attend que la main s'arrête, et on
   ne compte pas deux fois le même mot-clé — retirer une lettre puis la
   remettre reste la même recherche. */
let _rechAttente = null, _rechDerniere = "";
/* La lettre d'abord, le filtrage ensuite.
 *
 * Filtrer réécrit les six cents lignes de la liste et repeint le plan — les
 * emplacements retenus s'y allument. Fait dans le gestionnaire de frappe, tout
 * cela passait avant que le navigateur ne peigne le caractère qu'on venait de
 * taper : trois cent trente millisecondes sur la première lettre, où la liste
 * est encore entière. On voyait la touche s'enfoncer, puis la lettre venir.
 *
 * Un « requestAnimationFrame » ne suffirait pas : il s'exécute dans la trame
 * qui précède l'affichage, donc encore avant la lettre. C'est le délai posé
 * depuis cette trame qui rend la main — le même geste que « planifieWebgl ».
 *
 * Rien n'est perdu à attendre : le filtrage coûte ce qu'il coûte, il ne le
 * fait plus payer à ce qu'on regarde. Et une frappe rapide n'en programme
 * qu'un : seul le dernier état du champ compte, et il est déjà écrit dans
 * « state » quand le report s'exécute. */
let _filtreAttendu = 0;
function planifieFiltre(){
  if (_filtreAttendu) return;
  _filtreAttendu = requestAnimationFrame(() => setTimeout(() => {
    _filtreAttendu = 0;
    reposeRetrait();
    appliqueFiltre();
  }, 0));
}
$("q").addEventListener("input", e => {
  state.q = e.target.value;
  state.qn = state.q.trim().toLowerCase();
  majVideQ();
  planifieFiltre();
  clearTimeout(_rechAttente);
  _rechAttente = setTimeout(() => {
    const q = state.qn;
    if (q.length < 2 || q === _rechDerniere) return;
    _rechDerniere = q;
    mesure("recherche");
  }, 900);
});

$("videQ").onclick = videRecherche;
/* Échap dans le champ défait la recherche, et rien d'autre : la même touche
   ferme la fiche et le tiroir plus loin, et les trois d'un coup emporteraient
   ce qu'on regardait. Le champ vide, elle repart vers eux. */
$("q").addEventListener("keydown", e => {
  if (e.key !== "Escape" || !state.q) return;
  e.stopPropagation();
  videRecherche();
});

/* Revenir au menu de recherche repose le retrait du plan : le champ, le bouton
   des critères, les puces de ce qui est retenu, la liste, la poignée du tiroir.
   Le geste d'avant l'avait levé pour regarder le hall ; celui-ci rouvre la
   question, et le plan redit ce qu'elle retient.

   Un écouteur sur le panneau entier plutôt qu'un par commande : les puces et
   les lignes de la liste naissent et meurent à chaque frappe, et aucune n'aurait
   gardé le sien. Le clavier compte autant que le doigt — on revient au champ
   par tabulation. */
["pointerdown", "focusin"].forEach(t =>
  $("side").addEventListener(t, reprendRecherche));

/* ============================================================
   Ce que les tiroirs lisent d'un geste

   Deux sortes de tiroirs se manœuvrent au doigt — celui de la liste, qui
   glisse, et ceux que la hauteur mène. Ils partagent la façon de lire le
   geste, faute de quoi le même appui ne donnerait pas la même chose selon le
   tiroir touché.
   ============================================================ */
/* Ce qu'un pouce dérive en appuyant. Six pixels ne suffisaient pas : au-delà
   du seuil le geste passait pour un glissement, lequel, n'ayant pas atteint le
   cran suivant, reposait celui d'où il venait — l'appui restait sans effet. */
const GESTE_SEUIL = 10;
/* Au-delà d'un demi-pixel par milliseconde, c'est la direction qui décide et
   non l'endroit où le doigt s'est arrêté : un coup sec part vite et lâche tôt,
   et jugé à l'arrivée il n'avait pas parcouru la moitié du chemin. */
const GESTE_VIF = .5;

/**
 * Le suivi d'un geste, pour en tirer une vitesse.
 *
 * Elle se prend sur les cent dernières millisecondes, et non entre le dernier
 * déplacement et le lâcher : le navigateur livre souvent les deux au même
 * endroit, et tout coup sec comptait alors pour nul.
 */
function traceurDeGeste(){
  const FENETRE = 100;
  let trace = [];
  return {
    repart(){ trace = []; },
    note(y){
      const t = performance.now();
      trace.push({ y: y, t: t });
      while (trace.length > 1 && t - trace[0].t > FENETRE) trace.shift();
    },
    vitesse(){
      if (trace.length < 2) return 0;
      const a = trace[0], b = trace[trace.length - 1];
      return b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0;
    },
  };
}

/** Le cran d'à côté, vers le haut (+1) ou vers le bas (-1). */
const cranVoisin = (crans, nom, sens) =>
  crans[Math.min(crans.length - 1, Math.max(0, crans.indexOf(nom) + sens))];

/* ============================================================
   Le tiroir de la liste — écrans étroits

   Côte à côte, plan et liste ne tiennent pas sur un téléphone. La liste se
   replie donc en tiroir : seules la recherche et le compteur dépassent, le
   reste se hisse d'une pression ou d'un glissement. Choisir un résultat le
   referme — c'est le plan qu'on voulait voir, et la fiche s'ouvre par-dessus.
   ============================================================ */
/* La bande que le système garde au bas de l'écran — la poignée de gestes, la
   barre d'accueil.

   Les tiroirs descendent leur fond jusqu'au bord de l'écran, une bande de gris
   sous un tiroir de couleur se voyant de loin, mais ils remontent ce qu'ils
   portent d'autant : leur part visible au cran le plus bas vaut donc ce qu'ils
   montrent, plus cette bande. Le geste qui les mène doit compter pareil — il
   posait sinon, au premier millimètre parcouru par le doigt, une hauteur
   amputée de la bande, et le tiroir sautait avant de suivre.

   Mesurée sur une sonde, et non lue : `env(safe-area-inset-bottom)` appartient
   au moteur de style, et rien de `window` ne la donne. Gardée ensuite, parce
   que le glissement la redemande à chaque image : elle ne change qu'avec
   l'écran, et c'est ce que dit le `resize`. */
let _retraitBas = null;
function retraitBas(){
  if (_retraitBas !== null) return _retraitBas;
  const sonde = document.createElement("i");
  sonde.style.cssText = "position:fixed;left:0;bottom:0;width:0;height:var(--sys-bas)";
  document.body.appendChild(sonde);
  _retraitBas = sonde.getBoundingClientRect().height;
  sonde.remove();
  return _retraitBas;
}
addEventListener("resize", () => { _retraitBas = null; });

/* La mesure du tiroir appartient à ce module, mais les bandes qui dépassent —
   les secteurs, les critères retenus — paraissent et disparaissent ailleurs :
   on leur laisse de quoi la redemander. */
let mesureTiroir = () => {};
/* De même, une thématique retenue depuis une fiche doit faire monter le tiroir :
   sur téléphone la liste qui vient de changer est sous le plan. */
let montreTiroir = () => {};
/* Et le panneau des critères, qui se déplie dans le tiroir, le veut tout en
   haut : déplié dans la bande qui dépasse, il y prendrait la place de ce
   qu'elle doit montrer. */
let hisseTiroir = () => {};

(function tiroirListe(){
  const tiroir = $("side"), prise = $("poignee");
  if (!tiroir || !prise) return;
  const etroit = ETROIT;

  /* La hauteur repliée ne peut pas être une constante : elle dépend de la
     police servie, du retour à la ligne des puces, de la longueur du nom de
     pavillon dans le compteur. On la mesure, et on la redonne au CSS, qui s'en
     sert aussi pour poser les commandes du plan au-dessus du tiroir. */
  function mesure(){
    if (!etroit()) return;
    const part = s => { const n = tiroir.querySelector(s); return n ? n.offsetHeight : 0; };
    const h = prise.offsetHeight + part(".search") + part(".actifs") +
              part(".count");
    /* Sur le corps, pour la même raison que « --cartouche » : posée sur la
       racine, cette hauteur faisait repeindre les six cents stands chaque fois
       que le tiroir replié changeait de taille — l'apparition de la ligne des
       résultats, par exemple, au premier mot tapé dans la recherche. */
    const px = h + "px";
    if (h > 0 && document.body.style.getPropertyValue("--replie") !== px)
      document.body.style.setProperty("--replie", px);
  }

  /* Trois crans, du plus bas au plus haut. Le milieu est le cran utile : la
     liste se lit sans que le plan disparaisse. */
  const CRANS = ["replie", "demi", "plein"];
  const cran = () => tiroir.dataset.cran || "replie";
  function pose(nom){
    tiroir.dataset.cran = nom;
    annonce(nom);
    prise.setAttribute("aria-expanded", nom === "replie" ? "false" : "true");
    /* Redescendu, le tiroir ne montre plus que la recherche, ce qui est retenu
       et le compte : un panneau de critères resté déplié occuperait cette bande
       à lui seul, et pousserait les trois sous le bord de l'écran. */
    if (nom === "replie" && etroit()) fermeCriteres();
  }

  /* Ce qui flotte au-dessus du plan — le cartouche des points d'intérêt, les
     commandes de zoom, l'échelle — est ancré sur la hauteur repliée du tiroir.
     Le tiroir qui monte passe donc dessous sans les déplacer, et ils restaient
     à désigner un plan qu'on ne voyait plus. Le cran vit sur la racine pour que
     la feuille de style les atteigne depuis l'autre bout de la page. */
  const annonce = nom => { document.documentElement.dataset.tiroir = nom; };
  const replie = () => pose("replie");
  /* Une pression fait le tour des crans : on les atteint tous sans rien
     connaître du glissement, et on revient au plan par la même touche. */
  const bascule = () => pose(CRANS[(CRANS.indexOf(cran()) + 1) % CRANS.length]);

  /* Sur le corps, là où « mesure » l'a posée : lue sur la racine, elle revenait
     vide et le repli de 164 px tenait lieu de mesure. Le tiroir sautait alors
     de l'écart au premier millimètre du glissement — soixante-quinze pixels
     pour une bande repliée qui en fait quatre-vingt-dix. */
  const replieePx = () =>
    parseFloat(getComputedStyle(document.body).getPropertyValue("--replie")) || 164;

  /* Hauteur visible du tiroir à un cran donné, en pixels. Le milieu suit la
     règle du CSS — 46 % de la hauteur d'écran. Le plus bas montre ce qui a été
     mesuré, posé au-dessus de la bande rendue au système. */
  function hauteur(nom){
    if (nom === "plein") return tiroir.offsetHeight;
    if (nom === "demi")  return Math.round(innerHeight * .46);
    return replieePx() + retraitBas();
  }

  /* --- le glissement ------------------------------------------------------
     Le doigt mène le tiroir entre le cran le plus bas et le plus haut, puis on
     s'accroche au cran le plus proche de l'endroit où il a lâché. Un seuil de
     distance ne suffirait plus : avec trois crans, c'est la position d'arrivée
     qui décide, pas la longueur du geste. */
  let depart = null, aGlisse = false;

  const geste = traceurDeGeste();

  prise.addEventListener("pointerdown", e => {
    if (!etroit()) return;
    depart = { y: e.clientY, vu: hauteur(cran()), cran: cran() };
    geste.repart();
    geste.note(e.clientY);
    aGlisse = false;
    tiroir.classList.add("glisse");
    prise.setPointerCapture(e.pointerId);
  });

  /** Hauteur visible pendant le geste, bornée aux deux crans extrêmes. */
  const suit = e =>
    Math.min(hauteur("plein"), Math.max(hauteur("replie"), depart.vu - (e.clientY - depart.y)));

  /** Le cran dont la hauteur visible est la plus proche de celle atteinte. */
  function proche(vu){
    let choix = CRANS[0], ecart = Infinity;
    for (const c of CRANS){
      const d = Math.abs(hauteur(c) - vu);
      if (d < ecart){ ecart = d; choix = c; }
    }
    return choix;
  }

  prise.addEventListener("pointermove", e => {
    if (!depart) return;
    if (Math.abs(e.clientY - depart.y) > GESTE_SEUIL) aGlisse = true;
    geste.note(e.clientY);
    const vu = suit(e);
    tiroir.style.transform = "translateY(" + (tiroir.offsetHeight - vu) + "px)";
    /* Le doigt tient encore le tiroir : ce qui flotte s'efface au cran où il
       s'arrêterait, sans attendre qu'il lâche. */
    annonce(proche(vu));
  });

  function relache(e){
    if (!depart) return;
    const vu = suit(e);
    tiroir.classList.remove("glisse");
    tiroir.style.transform = "";
    geste.note(e.clientY);
    const v = geste.vitesse();
    // un geste avorté laisse le cran d'avant, que le glissement avait annoncé
    pose(!aGlisse ? cran()
       : Math.abs(v) > GESTE_VIF ? cranVoisin(CRANS, depart.cran, v < 0 ? 1 : -1)
       : proche(vu));
    depart = null;
  }
  prise.addEventListener("pointerup", relache);
  prise.addEventListener("pointercancel", relache);

  /* Une pression bascule. Le clic sert aussi le clavier — la poignée est un
     bouton — mais il suit tout glissement : on l'ignore dans ce cas. */
  prise.addEventListener("click", () => {
    if (aGlisse){ aGlisse = false; return; }
    bascule();
  });

  /* Chercher, c'est vouloir la liste ; choisir, c'est vouloir le plan. Au cran
     plein pour la recherche : le clavier va manger le bas de l'écran, autant
     que la liste occupe tout ce qui reste. */
  $("q").addEventListener("focus", () => { if (etroit()) pose("plein"); });
  $("list").addEventListener("click", () => { if (etroit()) replie(); });

  /* La fiche occupe le bas de l'écran quand elle s'ouvre — depuis la liste
     comme depuis le plan ; le parcours et l'itinéraire prennent la même bande.
     Le tiroir se retire sous eux plutôt que de lutter pour la même place, et
     s'efface entièrement : replié il garde sa bande de recherche, laquelle
     dépassait derrière l'itinéraire descendu à son cran le plus bas — celui-ci
     est plus court qu'elle. */
  const bandes = [$("detail"), $("parcours"), $("itineraire")].filter(Boolean);
  function cede(){
    const pris = etroit() && bandes.some(n => n.classList.contains("open"));
    if (pris) replie();
    tiroir.classList.toggle("cede", pris);
  }
  const guette = new MutationObserver(cede);
  bandes.forEach(n => guette.observe(n, { attributes: true, attributeFilter: ["class"] }));
  addEventListener("keydown", e => { if (e.key === "Escape" && etroit()) replie(); });

  /* Au retour vers un grand écran, la liste reprend sa colonne : ni classe
     d'ouverture ni transformation résiduelle, qui s'y appliqueraient encore. */
  addEventListener("resize", () => {
    if (!etroit()){ tiroir.style.transform = ""; replie(); }
    else mesure();
    cede();
  });

  mesureTiroir = mesure;
  /* Le cran du milieu, pas le plein écran : on vient de retenir une
     thématique depuis le plan, et on veut voir la liste sans perdre de vue
     l'endroit d'où l'on part. */
  montreTiroir = () => { if (etroit() && cran() === "replie") pose("demi"); };
  /* Le plein écran, et non le cran du milieu : régler ses critères, c'est
     vouloir la liste — comme entrer dans le champ de recherche, qui hisse le
     tiroir de la même façon. */
  hisseTiroir = () => { if (etroit()) pose("plein"); };
  mesure();
  // les polices arrivent après le premier calcul et changent la hauteur mesurée
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesure);
  addEventListener("load", mesure);
})();

/* ============================================================
   Les tiroirs menés par la hauteur — écrans étroits

   Trois bandes basses partagent le pied de l'écran avec la liste, et toutes
   trois tenaient sur une hauteur fixe. La fiche : un peu plus de la moitié de
   l'écran, quoi qu'elle porte — bien remplie, champs, programme et actions s'y
   lisaient par une fente, en faisant défiler son corps trois écrans durant. Le
   parcours retenu et la journée organisée avaient le défaut inverse : les deux
   tiers de l'écran pour trois exposants, et le plan qu'on venait y chercher
   restait derrière. L'itinéraire, enfin, recouvrait de sa moitié d'écran le
   trajet qu'il venait d'y tracer — celui-là même qu'on lui demandait.

   Les trois prennent donc la prise de la liste et ses trois crans. Le cran ne
   les fait pas glisser sous le bord de l'écran comme la liste, mais change
   leur hauteur : c'est leur corps qui défile, et un tiroir descendu aurait
   poussé sa fin hors de vue. Au cran le plus bas ne reste que l'en-tête —
   assez pour savoir de quel stand, de quelle journée ou de quel trajet il
   s'agit tout en regardant le plan derrière.
   ============================================================ */
/**
 * Pose les trois crans sur un tiroir mené par la hauteur.
 *
 * @param panneau le tiroir — son en-tête est ce qui reste au cran le plus bas
 * @param prise   la poignée qui le hisse
 * @param cle     la variable CSS où déposer la hauteur repliée mesurée
 * @param demi    la part de l'écran qu'il occupe au cran du milieu
 */
function tiroirCrante({ panneau, prise, cle, demi }){
  const tiroir = $(panneau), poignee = $(prise);
  if (!tiroir || !poignee) return;
  const etroit = ETROIT;
  const CRANS = ["replie", "demi", "plein"];
  /* Le cran du milieu est celui d'avant les crans : un tiroir qu'on ouvre sans
     rien demander occupe la place qu'il a toujours occupée. */
  const cran = () => tiroir.dataset.cran || "demi";

  /* La hauteur repliée se mesure : l'en-tête de la fiche tient une ligne pour
     un numéro de stand, trois pour une enseigne longue suivie de ses
     pastilles, davantage quand la zone porte un logo ; celui du parcours
     change de titre selon qu'on y lit sa liste ou sa journée. */
  function mesure(){
    if (!etroit()) return;
    const hd = tiroir.querySelector(".detail-hd");
    const h = poignee.offsetHeight + (hd ? hd.offsetHeight : 0);
    /* Sur le tiroir, et non sur la racine. Une variable posée sur la racine est
       offerte à toute la page en héritage : le navigateur remet alors en cause
       le style de ses sept mille nœuds — cent quatre-vingts millisecondes dès
       que la valeur change, c'est-à-dire chaque fois qu'un nom de stand tient
       sur un nombre de lignes différent. Seul le tiroir lit celle-ci. */
    if (h > 0) tiroir.style.setProperty(cle, h + "px");
  }

  function pose(nom){
    tiroir.dataset.cran = nom;
    poignee.setAttribute("aria-expanded", nom === "replie" ? "false" : "true");
  }
  const bascule = () => pose(CRANS[(CRANS.indexOf(cran()) + 1) % CRANS.length]);

  /* Le nombre n'est qu'un garde-fou : `mesure` pose la variable à la
     construction et à chaque ouverture, si bien qu'elle est toujours lue
     mesurée. La hauteur d'avant la première mesure, elle, est celle que la
     feuille de style donne en secours à `var()`, tiroir par tiroir. */
  const replieePx = () =>
    parseFloat(getComputedStyle(tiroir).getPropertyValue(cle)) || 132;

  /** Hauteur du tiroir à un cran donné, en pixels — les parts du CSS. */
  function hauteur(nom){
    if (nom === "plein") return Math.round(innerHeight * .92);
    if (nom === "demi")  return Math.round(innerHeight * demi);
    // l'en-tête mesuré, plus la bande que le tiroir rend au système sous lui
    return replieePx() + retraitBas();
  }

  /* --- le glissement ------------------------------------------------------
     Même geste que sur la liste, à ceci près que le doigt mène une hauteur et
     non une position : on s'accroche au cran le plus proche de celle atteinte.

     La prise ne se limite pas à la pastille. Elle mesure seize pixels de haut
     quand le pouce en demande quarante : on visait, on manquait, et le tiroir
     ne bougeait pas — ce qui se lit comme une panne, pas comme un geste raté.
     L'en-tête qu'elle surmonte se saisit donc aussi, ce qui est de toute façon
     l'endroit que la main vise. Ce qu'il porte de cliquable — fermer, renommer,
     une pastille qui bascule — garde ses appuis. */
  const INERTE = "button,a,input,select,textarea,label,[role=tab]";
  const entete = tiroir.querySelector(".detail-hd");
  const prises = [poignee, entete].filter(Boolean);
  let depart = null, aGlisse = false;

  const geste = traceurDeGeste();

  function saisit(e){
    if (!etroit()) return;
    /* La poignée est elle-même un bouton : le garde-fou ne vaut que pour
       l'en-tête, où il protège les commandes qu'on y a posées. */
    if (e.currentTarget !== poignee && e.target.closest(INERTE)) return;
    depart = { y: e.clientY, vu: hauteur(cran()), cran: cran() };
    geste.repart();
    geste.note(e.clientY);
    aGlisse = false;
    tiroir.classList.add("glisse");
    e.currentTarget.setPointerCapture(e.pointerId);
  }

  /** Hauteur pendant le geste, bornée aux deux crans extrêmes. */
  const suit = e =>
    Math.min(hauteur("plein"), Math.max(hauteur("replie"), depart.vu - (e.clientY - depart.y)));

  /** Le cran dont la hauteur est la plus proche de celle atteinte. */
  function proche(vu){
    let choix = CRANS[0], ecart = Infinity;
    for (const c of CRANS){
      const d = Math.abs(hauteur(c) - vu);
      if (d < ecart){ ecart = d; choix = c; }
    }
    return choix;
  }

  function bouge(e){
    if (!depart) return;
    if (Math.abs(e.clientY - depart.y) > GESTE_SEUIL) aGlisse = true;
    geste.note(e.clientY);
    tiroir.style.maxHeight = suit(e) + "px";
  }

  function relache(e){
    if (!depart) return;
    const vu = suit(e);
    tiroir.classList.remove("glisse");
    /* La hauteur repasse au CSS, qui la tient du cran : gardée en ligne, elle
       aurait survécu à la fermeture et figé le tiroir suivant. */
    tiroir.style.maxHeight = "";
    geste.note(e.clientY);
    const v = geste.vitesse();
    // un geste avorté laisse le cran d'avant ; le clic qui suit fera le tour
    pose(!aGlisse ? cran()
       : Math.abs(v) > GESTE_VIF ? cranVoisin(CRANS, depart.cran, v < 0 ? 1 : -1)
       : proche(vu));
    depart = null;
  }

  /* Une pression fait le tour des crans — sur la pastille comme sur l'en-tête,
     puisque c'est la même prise. Le clic sert aussi le clavier, la poignée
     étant un bouton, mais il suit tout glissement : on l'ignore alors. */
  function presse(e){
    if (aGlisse){ aGlisse = false; return; }
    /* Au large, l'en-tête n'est qu'un en-tête : la poignée y est masquée et le
       tiroir reprend sa colonne, mais l'en-tête, lui, reste cliquable — sans
       ce garde-fou, cliquer un nom de stand posait un cran dans son dos. */
    if (!etroit()) return;
    if (e.currentTarget !== poignee && e.target.closest(INERTE)) return;
    bascule();
  }

  prises.forEach(n => {
    n.addEventListener("pointerdown", saisit);
    n.addEventListener("pointermove", bouge);
    n.addEventListener("pointerup", relache);
    n.addEventListener("pointercancel", relache);
    n.addEventListener("click", presse);
  });

  /* Chaque ouverture repart du cran du milieu : le stand d'avant a pu demander
     toute la hauteur, celui-ci tient peut-être en trois lignes, et le plan
     qu'on vient de désigner doit rester en vue. Le tiroir s'ouvre depuis
     plusieurs endroits — un stand, un repère de dessin, le bouton du
     parcours — d'où la classe guettée plutôt qu'un appel posé dans chacun. */
  let ouvert = tiroir.classList.contains("open");
  new MutationObserver(() => {
    const o = tiroir.classList.contains("open");
    if (o && !ouvert){ pose("demi"); mesure(); }
    ouvert = o;
  }).observe(tiroir, { attributes: true, attributeFilter: ["class"] });

  /* L'en-tête change de hauteur sans que le tiroir se rouvre : un logo qui
     arrive, les polices qui se posent, la bascule vers l'anglais, la journée
     organisée qui prend la place de la liste retenue. Le cran le plus bas vaut
     ce qu'il mesure alors. */
  if (window.ResizeObserver){
    const hd = tiroir.querySelector(".detail-hd");
    if (hd) new ResizeObserver(mesure).observe(hd);
  }

  /* Au retour vers un grand écran, le tiroir reprend sa colonne : ni hauteur
     posée en ligne ni cran, qui s'y appliqueraient encore. */
  addEventListener("resize", () => {
    if (!etroit()){ tiroir.style.maxHeight = ""; pose("demi"); }
    else mesure();
  });

  mesure();
}

tiroirCrante({ panneau: "detail", prise: "poigneeFiche", cle: "--fiche-replie", demi: .56 });
/* Le parcours monte plus haut au cran du milieu, et la feuille de style dit la
   même part : une liste de rangs se parcourt du regard, quand une fiche se lit
   ligne à ligne. */
tiroirCrante({ panneau: "parcours", prise: "poigneeParcours", cle: "--parc-replie", demi: .68 });
/* L'itinéraire s'arrête plus bas que les deux autres : la moitié de l'écran,
   parce qu'on le remplit en regardant le plan. Les crans ne lui retirent pas
   cette mesure — ils la lui rendent, le temps d'un geste. */
tiroirCrante({ panneau: "itineraire", prise: "poigneeItineraire", cle: "--itin-replie", demi: .5 });

/* langue — la bascule appartient à `_langue.js`, qui récrit ce qui est à
   l'écran sans recharger la page. Restent ce que le plan a mesuré ou relevé
   dans la langue d'avant : les libellés taillés à leur largeur, les repères
   dessinés autour de leur nom, ceux que la recherche balaie. */
addEventListener("langue", () => {
  if (!DATA || !view) return;
  oublieReperes();
  _lg.clear();
  dessineDessins();
  libelles();
  liste();
  // la fiche ouverte sur une zone porte son nom dans la langue d'avant
  const o = state.sel && parId.get(state.sel);
  if (o && o.kind === "zone" && $("dName")) $("dName").textContent = nomDeLaZone(o) || "Zone sans nom";
});

</script>
