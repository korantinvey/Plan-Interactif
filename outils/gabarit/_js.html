 * du salon qui la règle — et non le plus long des résultats affichés, qui
 * ferait sauter la colonne des noms à chaque frappe.
 *
 * Un plafond garde au nom la place qui lui revient sur un téléphone : passé
 * lui, c'est la police du numéro qui cède, plutôt que la case. Elle a son
 * propre plancher, sans quoi un numéro aberrant — il en arrive — rendrait
 * illisibles les huit cents autres pour tenir tout entier.
 */
const CASE_MIN = 48, CASE_MAX = 92, CASE_CADRE = 10, CASE_POLICE = 11.5;
function caseNumero(){
  let w = 0;
  for (const o of TOUS)
    if (o.kind === "stand" && o.code) w = Math.max(w, largeur(codeCase(o), P_CODE));
  w *= CASE_POLICE;
  const place = CASE_MAX - CASE_CADRE;
  return {
    l: Math.round(Math.min(Math.max(w + CASE_CADRE, CASE_MIN), CASE_MAX)),
    f: w > place ? Math.max(9, CASE_POLICE * place / w) : CASE_POLICE,
  };
}

/**
 * Ce que la seconde ligne ajoute : pour une conférence, quand et où.
 *
 * Un titre seul ne distingue pas deux sessions d'un programme qui en compte
 * trois cents, et « quand » est la première question qu'on se pose en en
 * trouvant une : le jour s'abrège pour tenir sur la ligne, la fiche l'écrit en
 * toutes lettres.
 */
function sousLigne(o){
  /* Un repère dit ce qu'il est, quand son libellé ne le dit pas déjà : entre
     deux lignes « Hall Sud » et « Hall Nord », savoir qu'il s'agit d'entrées
     est ce qui les rattache à ce qu'on cherchait. */
  if (o.kind === "poi") return o.type || "";
  if (o.kind !== "conf") return "";
  const d = momentLocal(o.debutLocal, DATA.fuseau) || momentLocal(o.debut, DATA.fuseau);
  const quand = d
    ? JOURS[new Date(d.an, d.mois - 1, d.jour).getDay()].slice(0, 3) + ". " +
      d.jour + " · " + d.h + "h" + d.min
    : "";
  return [quand, o.salle].filter(Boolean).join(" · ");
}

function liste(){
  const box = $("list");
  const q = state.qn;
  // un critère retenu déborde le pavillon affiché, comme un mot-clé
  const tout = filtre();
  /* Les sociétés hébergées rejoignent la liste dès qu'on cherche une société,
     et non un emplacement : par son nom, par ce qu'elle vient faire là, ou par
     l'un des champs que l'exploitant propose en critère. Ceux-là sont à elle,
     pas à son hôte — l'en écarter la rendrait introuvable justement là où on la
     cherche. Le secteur fait exception : porté par l'emplacement seul, il ne
     les fait pas paraître. Sans rien de tout cela, la liste reste le sommaire
     des emplacements, et son compte celui qu'annonce l'en-tête. */
  const parSociete = Boolean(q) || critParSociete();
  /* Le programme ne rejoint la liste que sur un mot-clé. Un critère ne dit rien
     d'une conférence, et le sommaire d'un pavillon est celui de ses
     emplacements : ajouter là trois cents sessions noierait les stands qu'on
     est venu parcourir. */
  const portee = (parSociete ? TOUS.concat(HEBERGES) : tout ? TOUS : P().stands)
    .concat(q ? CONFERENCES : [])
    /* Les repères rejoignent la liste comme le programme, sur un mot-clé seul :
       un critère décrit une société, et un escalier n'en est pas une. */
    .concat(q ? reperesCherchables() : []);
  const vus = portee.filter(visible).sort((a, b) =>
    (rangSorte(a) - rangSorte(b)) ||
    (a.p - b.p) ||
    ((a.nom ? 0 : 1) - (b.nom ? 0 : 1)) ||
    COLLATION.compare(String(a.nom || a.code || ""), String(b.nom || b.code || "")));

  /* Sans mot-clé ni critère, la liste n'est pas un résultat mais le sommaire
     du pavillon : « 404 résultats · Franchise Expo Paris » répond alors à une
     question que personne n'a posée, et redit le salon que l'en-tête nomme
     déjà. Le compte ne paraît donc qu'une fois la recherche commencée — et
     celle-ci portant sur tout le salon, il n'a plus qu'une portée à dire. */
  const compte = $("count");
  if (compte.hidden === tout){
    compte.hidden = !tout;
    // le compte fait partie de ce qui dépasse du tiroir replié : sa disparition
    // comme son retour changent la hauteur à laquelle s'ancrent les commandes
    mesureTiroir();
  }
  $("countTxt").textContent = vus.length + (vus.length > 1 ? " résultats" : " résultat") +
    " · tous pavillons";

  /* Le plafond se compte par sorte, et non sur la liste entière : les stands
     passant devant, une recherche large le remplissait à eux seuls et les
     zones comme le programme, rangés derrière, disparaissaient sans que rien
     ne le dise — alors que le compte annoncé, lui, les avait comptés. */
  const tenus = new Map();
  const montres = vus.filter(o => {
    const r = rangSorte(o), n = (tenus.get(r) || 0) + 1;
    tenus.set(r, n);
    return n <= PLAFOND_SORTE;
  });

  const boite = caseNumero();
  box.style.setProperty("--caseL", boite.l + "px");
  box.style.setProperty("--caseF", boite.f.toFixed(2) + "px");

  box.innerHTML = montres.length ? montres.map(o => {
    const heberge = o.kind === "coex";
    /* La liste ne porte que ce qui aide à retrouver quelqu'un : son numéro de
       stand et son nom. La surface louée et les angles ouverts regardent la
       commercialisation, jamais le visiteur : ils ne s'affichent nulle part. */
    const conf = o.kind === "conf";
    /* Ni une conférence ni un repère n'est un emplacement : la sélection du
       plan ne les désigne pas, et le clic ne passe pas par « select ». */
    const emplacement = !conf && o.kind !== "poi";
    // une conférence que rien ne situe encore n'est dans aucun pavillon : celui
    // qui l'a remontée n'en dit rien au visiteur
    const badge = o.p !== state.plan && !(conf && !o.situee)
      ? '<span class="hall">' + esc(DATA.plans[o.p].court) + '</span>' : "";
    const rang = heberge ? o.i : -1;
    const sous = sousLigne(o);
    /* Le pavillon part avec la ligne. Un repère ne vit pas dans « parId » —
       c'est une forme dessinée, pas un objet du plan — et son identifiant seul
       ne dirait pas où aller le chercher. */
    return '<button class="row" data-id="' + esc(o.id) +
      '" data-sorte="' + o.kind + '" data-soc="' + rang + '" data-p="' + o.p +
      '" aria-current="' + (emplacement && state.sel === o.id && state.selSoc === rang) + '">' +
      '<span class="code">' + esc(codeCase(o)) + '</span>' +
      '<span><span class="nm">' + esc((o.kind === "zone" ? nomDeLaZone(o) : o.nom) || o.plan ||
        (o.kind === "zone" ? "Zone sans nom" : ("Stand " + (o.code || "")).trim())) + '</span>' +
      '<span class="s">' + esc(sous) + badge + '</span></span></button>';
  }).join("")
    : '<div class="empty">Aucun résultat dans les ' + DATA.plans.length + ' pavillons.</div>';
  /* Le canal dit d'où vient l'ouverture : la même liste sert de résultat de
     recherche quand un mot-clé est saisi, et de sommaire du pavillon sinon.

     Un rang part avec l'identifiant, et la fiche s'ouvre droit sur la société
     du rang cliqué : la liste vient de la nommer, redemander laquelle on veut
     serait une question dont on a déjà la réponse.

     Une conférence n'est pas un emplacement : `select` ne saurait pas la
     cadrer, et c'est sa fiche qu'on ouvre — d'où elle offre de situer sa
     salle sur le plan. */
  box.querySelectorAll(".row").forEach(b => b.onclick = () => {
    if (b.dataset.sorte === "conf"){ ficheConf(b.dataset.id, "recherche"); return; }
    // un repère s'ouvre sur son plan, et depuis sa pastille : ce n'est pas un
    // emplacement, et « select » n'aurait rien à cadrer
    if (b.dataset.sorte === "poi"){ vaAuRepere(b.dataset.id, +b.dataset.p); return; }
    select(b.dataset.id, true, parSociete ? "recherche" : "liste",
           Number(b.dataset.soc));
  });
}

/**
 * La ligne de la liste qui porte la fiche ouverte.
 *
 * Ouvrir une fiche ne change rien à ce que la liste montre : mêmes résultats,
 * même ordre, même compte — seule la ligne marquée change. La reconstruire
 * entière pour déplacer cette marque coûtait pourtant neuf millisecondes sur
 * un salon de mille stands, cinq cents lignes réécrites et autant de clics
 * rebranchés, à chaque ouverture comme à chaque fermeture. On repose donc
 * l'attribut là où il est.
 *
 * Ce qui, lui, change vraiment la liste passe toujours par « liste » : un
 * mot-clé, un critère, et le pavillon — celui-ci décidant de la pastille de
 * hall que portent les lignes d'ailleurs.
 */
function marqueChoisie(){
  $("list").querySelectorAll(".row").forEach(b => {
    /* Une conférence et un repère ne sont pas des emplacements : la sélection
       du plan ne les désigne pas, et « liste » ne les marque jamais. */
    const emplacement = b.dataset.sorte !== "conf" && b.dataset.sorte !== "poi";
    b.setAttribute("aria-current", String(emplacement && b.dataset.id === state.sel &&
      Number(b.dataset.soc) === state.selSoc));
  });
}

/**
 * Le logo d'un exposant, mis en route quand la main se pose sur sa ligne.
 *
 * Il ne se charge qu'à l'ouverture de la fiche — les cinq cents logos d'un
 * salon comme Franchise Expo pèsent soixante-dix mégaoctets, et la liste n'en
 * montre aucun. Mais entre le doigt qui se pose et la fiche qui s'ouvre il se
 * passe le temps d'une pression, et c'est autant de trajet réseau qu'on peut
 * avoir déjà fait. Le recadrage garde son résultat par adresse : demandé ici,
 * il est trouvé fait, ou en route, quand la fiche le réclame — jamais deux
 * fois.
 *
 * Une pression sur une ligne est une ouverture : on ne relève pas la liste du
 * doigt sans rien choisir. Le plan, lui, ne s'y prête pas — un déplacement y
 * commence aussi par un doigt posé sur un stand, et chargerait un logo qu'on
 * ne regardera pas.
 */
function prechargeMarque(id, iSoc){
  const o = parId.get(id);
  if (!o || o.kind === "zone" || !montre("stand", "logo")) return;
  const soc = iSoc >= 0 ? (o.coex || [])[iSoc] : o;
  const url = soc && (adresseVignette(soc.vignette) || adresseImage(soc.logo));
  if (!url) return;
  /* Une vignette déjà reçue par lot porte ses octets : il n'y a rien à mettre
     en route. Celle qu'on n'a pas encore n'a rien à préparer non plus — elle
     arrive prête — mais la demander ici fait le trajet réseau d'avance, et le
     navigateur l'aura quand la fiche s'ouvrira. */
  if (url.indexOf("data:") === 0) return;
  if (url.indexOf("vignette=") >= 0) new Image().src = url;
  else recadreMarque(url);
}

/**
 * Les vignettes du salon, chargées en silence une fois le plan affiché.
 *
 * Une vignette pèse trois kilo-octets et vient de notre propre origine : les
 * deux cent dix d'un salon comme Franchise Expo font six cents kilo-octets,
 * une fois. Toute fiche ouverte ensuite trouve son logo déjà là.
 *
 * Ce n'était pas possible avant qu'elles existent : les mêmes logos pris chez
 * leur source pèsent soixante-dix mégaoctets, et les précharger aurait ralenti
 * ce qu'on voulait accélérer.
 *
 * Elles se demandent groupées, et c'est tout le sujet. Une par une, c'étaient
 * deux cent dix allers-retours jusqu'au relais — six en vol à la fois, donc
 * trente-cinq vagues, et sur le réseau d'un salon une vague coûte plus que ce
 * qu'elle rapporte. Le relais, lui, payait une lecture de son stockage par
 * vignette, et le quota d'une journée entière y passait. Par lots, il en reste
 * trois, et trois lectures.
 *
 * Quatre-vingt-seize par lot : deux demandes pour un salon comme Franchise
 * Expo, une adresse de deux kilo-octets et demi — la chaîne en accepte cinq
 * fois plus avant de rompre, la mesure a été faite — et quatre cents
 * kilo-octets, un lot qu'on peut encore abandonner en route sans avoir tout
 * perdu. Tout demander d'un coup tiendrait aussi, jusqu'au salon qui passe les
 * trois cents exposants ; on garde la marge.
 *
 * Trois retenues, parce que ce chargement n'est demandé par personne :
 *
 * — il attend que le plan soit à l'écran et la main immobile ;
 * — il renonce sur un réseau que le navigateur dit lent ou mesuré, où six
 *   cents kilo-octets non réclamés ne se prennent pas ;
 * — il y va deux lots à la fois, pour ne pas disputer la bande passante au
 *   fond de plan, qui pèse cinquante fois plus et qu'on regarde déjà.
 */
const VIGNETTES_PAR_LOT = 96;
const LOTS_A_LA_FOIS = 2;

/* Ce qui est arrivé, par clé : l'image elle-même, prête à poser. Le lot qui
   l'a apportée reste, lui, dans le cache du navigateur et du service — son
   adresse ne porte que des empreintes, il ne peut pas se périmer — si bien
   que la visite d'après ne redemande rien. */
const VIGNETTES = new Map();

function prechargeLesVignettes(){
  if (!API) return;
  /* Ce que le navigateur sait du réseau. Rien n'oblige à le dire : en
     l'absence de réponse on charge, comme on le faisait avant de demander. */
  const res = navigator.connection || {};
  if (res.saveData) return;
  if (/(^|-)2g$/.test(res.effectiveType || "")) return;

  const cles = [];
  const vues = new Set();
  for (const o of TOUS){
    if (o.kind !== "stand") continue;
    for (const soc of [o].concat(o.coex || [])){
      const c = soc && soc.vignette;
      if (c && !vues.has(c) && !VIGNETTES.has(c)){ vues.add(c); cles.push(c); }
    }
  }
  if (!cles.length) return;

  /* Triées, et coupées toujours au même endroit : deux visites demandent alors
     les mêmes lots, et celui que le navigateur garde d'hier n'a rien à
     redemander. Dans l'ordre du plan, un stand déplacé suffisait à fabriquer
     des adresses neuves — donc à tout retélécharger. */
  cles.sort();
  const lots = [];
  for (let i = 0; i < cles.length; i += VIGNETTES_PAR_LOT){
    lots.push(cles.slice(i, i + VIGNETTES_PAR_LOT));
  }

  let i = 0;
  const suivant = () => {
    if (i >= lots.length) return Promise.resolve();
    return chargeUnLot(lots[i++]).then(suivant);
  };
  for (let n = 0; n < LOTS_A_LA_FOIS; n++) suivant();
}

/**
 * Un lot demandé, et rangé.
 *
 * Ce qui revient est du texte reçu du réseau et finit dans une image de fiche :
 * on ne garde donc que ce qu'on reconnaît — une clé qu'on a demandée, et une
 * image que la page sait avoir fabriquée elle-même. Un lot qui n'aboutit pas
 * ne se plaint pas : la fiche redemandera la vignette qui lui manque, une par
 * une, comme avant.
 */
function chargeUnLot(lot){
  return fetch(API + "?vignettes=" + lot.join(","), { priority: "low" })
    .then(r => r.ok ? r.json() : null)
    .then(recu => {
      const attendues = new Set(lot);
      for (const cle of Object.keys(recu || {})){
        if (!attendues.has(cle)) continue;
        const src = "data:image/webp;base64," + recu[cle];
        if (!IMAGE_SURE.test(src)) continue;
        VIGNETTES.set(cle, src);
        /* Elle arrive déjà recadrée et à la taille : le dire évite à la fiche
           de la relire pour n'y rien trouver à retirer. Sans cela, une
           vignette qui ne porte plus « vignette= » dans son adresse — elle
           porte ses octets — passerait pour un logo lu chez sa source. */
        marquePrete(src);
      }
    })
    .catch(() => {});
}

/* Un seul écouteur pour toutes les lignes : elles naissent et meurent à chaque
   frappe, et aucune ne garderait le sien. */
$("list").addEventListener("pointerdown", e => {
  const b = e.target.closest && e.target.closest(".row");
  if (b && (b.dataset.sorte === "stand" || b.dataset.sorte === "coex"))
    prechargeMarque(b.dataset.id, Number(b.dataset.soc));
});

/* ============================================================
   6. Vue
   ============================================================ */
/* Mesurer le cadre force le navigateur à remettre en page tout le SVG — sept
   mille éléments — et on le mesurait juste après avoir posé la « viewBox »,
   qui vient précisément de tout salir : quatre-vingt-cinq millisecondes, à
   chaque image, pour lire une largeur qui n'avait pas bougé. Car le cadre ne
   dépend pas de la « viewBox » : c'est le CSS qui le pose.

   On le mesure donc une fois, et on l'oublie quand la mise en page change.
   Un « ResizeObserver » couvre tout ce qui peut le changer, d'où qu'il vienne,
   sans rien mesurer lui-même ; le « resize » de la fenêtre s'y ajoute parce
   qu'il se déclenche avant lui, et que le recadrage qui l'écoute mesurerait
   sinon l'ancien cadre. */
let _cadre = null;
const cadrePlan = () => _cadre || (_cadre = svg.getBoundingClientRect());
const oublieCadre = () => { _cadre = null; };
addEventListener("resize", oublieCadre);
addEventListener("scroll", oublieCadre, true);
if (window.ResizeObserver) new ResizeObserver(oublieCadre).observe(svg);

/* Pendant un changement d'échelle, le plan se passe de ses textes : eux seuls
   coûtent quatre-vingts des quatre-vingt-huit millisecondes que réclame la
   remise en page du SVG à chaque image (voir « #plan.fige » dans la feuille de
   style). Le geste fini, « poseVue » les rend — recalculés une seule fois. */
/* Le dégel a un filet. Un geste finit normalement par « poseVue », qui rend
   les textes en même temps qu'il retrie les libellés ; mais tous les chemins
   n'y mènent pas — un doigt posé sur le plan pendant qu'une glissade finit sa
   course, un « pointercancel » du système. Le plan resterait muet. La minuterie
   est donc réarmée à chaque image du geste : elle ne se déclenche jamais tant
   qu'il dure, et toujours quand il s'interrompt sans se poser. */
let filetTextes = null;
function figeTextes(){
  // en WebGL les noms restent au dessin : il n'y a rien à taire
  if (GL.actif) return;
  detacheLibelles();
  svg.classList.add("fige");
  clearTimeout(filetTextes);
  filetTextes = setTimeout(rendTextes, 300);
}
function rendTextes(){
  clearTimeout(filetTextes); filetTextes = null;
  rattacheLibelles();
  svg.classList.remove("fige");
}

/* Les libellés, eux, restent à l'écran pendant le geste.

   Se taire avec le reste du plan les faisait disparaître au moment même où
   l'on zoome pour lire un nom. Mais les garder dans le SVG coûtait une image
   sur cinq, et ce n'était plus leur mise en page : c'était leur
   rastérisation, reprise à chaque image pour une taille de glyphe neuve. Rien
   ne l'évite tant qu'ils changent d'échelle dans le plan.

   Ils le quittent donc le temps du geste, pour un calque promu que le
   compositeur étire sans le repeindre — c'est « will-change » qui l'y
   autorise ; sans lui, le navigateur re-rastérise à chaque image, et l'on
   perd tout. Le groupe « #labels » déménage tel quel : ses règles de style
   tiennent à son identifiant et le suivent, et « libelles » l'écrit où qu'il
   soit. À la pose, il reprend sa place dans la pile, et s'y retrie comme
   avant.

   Deux prix, assumés. Une image étirée s'adoucit en zoom avant — jusqu'à la
   pose, ou une pause de la main, qui repeignent le calque net. Et le calque
   passe au-dessus de tout le plan : l'itinéraire, la sélection, un calque de
   dessin rangé plus haut dans la pile repassent sous les noms le temps du
   geste. */
const calqueLib = $("calqueLibelles"), svgLib = calqueLib.firstElementChild;
/* La vue pour laquelle le calque a été peint, tant que les libellés y sont ;
   et le voisin devant lequel ils reprendront leur place dans la pile. */
let libPeints = null, libAvant = null;
/* La dernière vue écrite dans la « viewBox », c'est-à-dire celle que l'écran
   montre. Pas « view » : le pincement la devance d'une image. */
let vueEcrite = null;

/** Où une vue tombe dans le cadre : « meet » garde ses proportions et la centre. */
function cadrage(v, r){
  const s = Math.min(r.width / v.w, r.height / v.h);
  return { s, x: (r.width - v.w * s) / 2, y: (r.height - v.h * s) / 2 };
}

function peintLibelles(v){
  libPeints = v;
  svgLib.setAttribute("viewBox", v.x + " " + v.y + " " + v.w + " " + v.h);
  calqueLib.style.transform = "";
}

function detacheLibelles(){
  // appelée à chaque image du geste : une fois partis, rien à refaire
  if (libPeints || !vueEcrite) return;
  const g = $("labels");
  // une couche masquée, ou vide à cette échelle, n'a rien à porter
  if (!g.firstChild || g.style.display === "none") return;
  libAvant = g.nextSibling;
  peintLibelles(vueEcrite);
  svgLib.appendChild(g);
  calqueLib.hidden = false;
}

function rattacheLibelles(){
  if (!libPeints) return;
  const g = $("labels"), c = $("couches");
  /* La pile a pu se réordonner pendant le geste : elle a alors déjà remis le
     groupe chez elle, ou retiré le voisin devant lequel il devait revenir.
     Seul ce dernier cas la fait rejouer : elle déplace tout le plan, fond
     compris, et la pose en coûterait le double. Sans voisin, les textes
     fermaient la pile — ils y reviennent en dernier. */
  if (g.parentNode !== c){
    if (!libAvant || libAvant.parentNode === c) c.insertBefore(g, libAvant);
    else { c.appendChild(g); ordonneDom(); }
  }
  calqueLib.hidden = true;
  calqueLib.style.transform = "";
  libPeints = libAvant = null;
}

/** Amène ce que le calque a peint pour « libPeints » sur la vue écrite. */
function etireLibelles(){
  const r = cadrePlan();
  const a = cadrage(libPeints, r), b = cadrage(vueEcrite, r), k = b.s / a.s;
  calqueLib.style.transform =
    "translate(" + ((libPeints.x - vueEcrite.x) * b.s + b.x - a.x * k) + "px," +
    ((libPeints.y - vueEcrite.y) * b.s + b.y - a.y * k) + "px) scale(" + k + ")";
}

const appliqueVue = () => {
  /* Le fond de carte, avant toute chose : il ne dépend que de la vue, et le
     chemin du rendu par la carte graphique sort plus bas sans passer par la
     « viewBox ». Posé là, il suit la vue quel que soit le rendu du plan. */
  if (typeof dessineFondCarte === "function") dessineFondCarte();
  /* Le plan peint par la carte graphique ne lit pas la « viewBox » : la vue
     part vers elle, et le SVG caché garde sa géométrie figée. */
  if (RENDU_WEBGL && !GL.actif) monteWebgl();
  if (GL.actif){
    vueWebgl();
    majEditionWebgl();
    // les poignées d'une forme choisie gardent leur taille à l'écran pendant le zoom
    if (enEdition() && typeof dessinePoignees === "function") dessinePoignees();
    if (enEdition() && typeof dessinePoigneesGeo === "function") dessinePoigneesGeo();
    // tant que la première image n'est pas dessinée, le SVG montre le plan et suit la vue
    if (GL.pret) return;
  }
  svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
  vueEcrite = { x: view.x, y: view.y, w: view.w, h: view.h };
  if (libPeints) etireLibelles();
  if (typeof dessinePoignees === "function") dessinePoignees();
  if (typeof dessinePoigneesGeo === "function") dessinePoigneesGeo();
  // le trait de l'itinéraire garde son épaisseur ; ses pastilles, non
  if (typeof rafraichitBouts === "function") rafraichitBouts();
  // et la pointe des lignes fléchées, pas davantage
  if (typeof rafraichitFleches === "function") rafraichitFleches();
  // le point de la borne, pas davantage non plus
  if (typeof rafraichitBorne === "function") rafraichitBorne();
};
/* Rafraîchir la vue coûte deux choses de nature très différente. Poser le
   « viewBox » est immédiat. Recalculer les libellés parcourt les cinq cents
   objets du pavillon et mesure chaque texte pour décider s'il tient et s'il
   reste lisible : près de six millisecondes sur un poste de bureau, bien
   davantage sur un téléphone, là où une image n'en a que seize.

   Pendant un geste on ne fait donc que le premier, et une seule fois par
   image — un écran tactile échantillonne souvent deux fois plus vite qu'il
   n'affiche, et le travail était fait deux fois pour rien. Les libellés
   attendent : leur taille étant exprimée en mètres, ils grandissent avec le
   plan sans qu'on y touche. Seul leur tri par lisibilité patiente, jusqu'à la
   fin du geste ou une pause de la main. */
let imageDemandee = null, libellesEnAttente = null;

/** Pendant un geste : le strict nécessaire, une fois par image. */
function rafraichitVue(){
  if (!imageDemandee){
    imageDemandee = requestAnimationFrame(() => {
      imageDemandee = null;
      appliqueVue(); echelle();
      // la poignée du calage se mesure en pixels : elle suit la vue
      if (CALAGE) dessineCalage();
    });
  }
  clearTimeout(libellesEnAttente);
  libellesEnAttente = setTimeout(() => { libellesEnAttente = null; libelles(); }, 150);
}

/** À la fin d'un geste, ou pour un saut de vue : tout, sans attendre. */
function poseVue(){
  stoppeZoom();
  if (imageDemandee){ cancelAnimationFrame(imageDemandee); imageDemandee = null; }
  clearTimeout(libellesEnAttente); libellesEnAttente = null;
  appliqueVue(); echelle(); libelles();
  if (CALAGE) dessineCalage();
}

/**
 * Hauteur, en pixels, de ce que le tiroir ou la fiche cachent en bas du plan.
 *
 * Le cadre du plan occupe tout l'écran sur mobile, mais on n'en voit pas tout :
 * cadrer sur le cadre entier pousse une partie du plan sous le tiroir. Toute
 * mise en vue passe donc par cette mesure — l'ajustement comme le centrage sur
 * un stand, y compris celui déclenché par le cartouche des points d'intérêt.
 *
 * On raisonne sur les hauteurs au repos, jamais sur la position d'un élément en
 * cours de glissement : `offsetHeight` ignore la transformation, et la fiche
 * qui s'ouvre replie le tiroir sous elle.
 */
/* La hauteur de la barre du salon, redonnée à la feuille de style.

   Sur écran étroit elle se pose par-dessus le plan : ce qui s'ancre en haut de
   la scène — le bandeau de visée, le rappel « Vous êtes ici » — doit se ranger
   dessous, et personne d'autre qu'elle ne sait ce qu'elle mesure. Un nom de
   salon qui passe à la ligne la fait grandir, et la mesure suit.

   Sur le corps, pour la même raison que « --replie » : posée sur la racine,
   elle ferait repasser le style des sept mille nœuds du plan à chaque fois. */
function mesureBarre(){
  const b = $("bandeau");
  if (!b) return;
  const px = Math.round(b.getBoundingClientRect().height) + "px";
  if (document.body.style.getPropertyValue("--barre") !== px)
    document.body.style.setProperty("--barre", px);
}
mesureBarre();
addEventListener("resize", mesureBarre);
if (window.ResizeObserver && $("bandeau"))
  new ResizeObserver(mesureBarre).observe($("bandeau"));

/**
 * Ce que la barre du salon cache du plan, en pixels.
 *
 * Sur écran étroit elle ne prend plus son rang dans la grille : elle se pose
 * par-dessus la scène, qui occupe toute la hauteur. Le haut du plan passe donc
 * dessous, et un cadrage qui l'ignorerait poserait derrière elle le stand
 * qu'on vient d'ouvrir — la même faute que celle du tiroir en bas, dans
 * l'autre sens.
 *
 * Ailleurs elle garde son rang et ne cache rien : écran large, administration,
 * où la bande de l'outil tient le premier rang.
 */
function masqueHaut(){
  const b = $("bandeau");
  if (!ETROIT() || !b || document.documentElement.classList.contains("mode-admin")) return 0;
  // au-delà, il ne resterait plus assez de plan pour que le cadrage ait un sens
  return Math.max(0, Math.min(cadrePlan().height * .4, b.getBoundingClientRect().height));
}

function masque(){
  if (!ETROIT()) return 0;
  const r = cadrePlan();
  const fiche = $("detail"), tiroir = $("side");
  const ficheOuverte = !!fiche && fiche.classList.contains("open");
  let bas = ficheOuverte ? fiche.offsetHeight : 0;
  /* L'itinéraire occupe la même bande, et c'est en l'ouvrant qu'on demande à
     cadrer sur le trajet : l'oublier ici reviendrait à le tracer sous lui. */
  const iti = $("itineraire");
  if (iti && iti.classList.contains("open")) bas = Math.max(bas, iti.offsetHeight);
  if (tiroir){
    bas = Math.max(bas, ficheOuverte
      ? parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--replie")) || 164
      : r.bottom - tiroir.getBoundingClientRect().top);
  }
  // au-delà, il ne resterait plus assez de plan pour que le cadrage ait un sens
  return Math.max(0, Math.min(r.height * .6, bas));
}

/**
 * Largeur, en pixels, de ce que le volet de droite cache du plan.
 *
 * Sur un écran large la fiche, le parcours et l'itinéraire ne partagent pas la
 * place : ils se posent par-dessus le plan, le long du bord droit. Cadrer sur
 * la largeur entière pousse donc le bord droit du tracé sous le volet — et
 * c'est là que se trouve l'arrivée d'un itinéraire demandé depuis une fiche.
 *
 * On mesure la largeur au repos plutôt que la position à l'écran : le volet
 * arrive en glissant, et un cadrage demandé pendant la transition mesurerait
 * un volet encore à moitié dehors.
 */
function masqueDroite(){
  if (ETROIT()) return 0;
  const r = cadrePlan();
  let cote = 0;
  ["detail", "parcours", "itineraire"].forEach(id => {
    const v = $(id);
    if (v && v.classList.contains("open")) cote = Math.max(cote, v.offsetWidth);
  });
  return Math.max(0, Math.min(r.width * .6, cote));
}

function fit(){
  const r = cadrePlan();
  const cache = masque(), haut = masqueHaut();
  const hUtile = Math.max(60, r.height - cache - haut);
  const w = emp.x1 - emp.x0, h = emp.y1 - emp.y0;
  const k = Math.max(w / (r.width || 1), h / hUtile);
  view = { x: emp.x0 + w / 2 - (k * r.width) / 2,
           /* Le plan se centre dans la bande visible, pas dans le cadre
              entier : le tiroir en mange le bas, la barre du salon le haut
              depuis qu'elle se pose dessus, et le décalage est la différence
              des deux. */
           y: emp.y0 + h / 2 - (k * r.height) / 2 + (k * (cache - haut)) / 2,
           w: k * r.width, h: k * r.height };
  poseVue();
}
/* Le zoom par crans, et la saccade qu'il donnait.

   Une molette envoie des crans, un pavé tactile une pluie de petits
   mouvements. Appliquer à chacun le même facteur fixe ratait les deux : la
   souris sautait de dix-huit pour cent d'un coup, sans rien entre les deux
   images ; le pavé, qui envoie plusieurs événements par image, les
   multipliait entre eux — le plan bondissait au lieu de glisser.

   Deux corrections, donc, et elles vont ensemble. Le facteur suit l'ampleur
   du geste au lieu d'être constant (voir l'écouteur « wheel »), et la vue
   qu'on vise se distingue de celle qu'on montre : un cran pousse la première,
   chaque image rapproche la seconde d'une fraction de ce qui les sépare.

   L'interpolation porte sur les quatre nombres à la fois et reste linéaire :
   le point visé se retrouve alors exactement sous le curseur à chaque image
   du trajet, et non seulement à l'arrivée. */
let vise = null, imageZoom = null;

function stoppeZoom(){
  if (imageZoom){ cancelAnimationFrame(imageZoom); imageZoom = null; }
  vise = null;
  rendTextes();
}

function glisseVersVise(){
  if (imageZoom) return;
  let precedent = performance.now();
  const pas = maintenant => {
    imageZoom = null;
    if (!vise) return;
    /* Le rapprochement se compte en millisecondes, non en images : sans quoi
       un écran à 120 Hz arriverait deux fois plus vite qu'un écran à 60. */
    const dt = Math.min(64, maintenant - precedent) || 16;
    precedent = maintenant;
    figeTextes();
    const k = 1 - Math.pow(.5, dt / 45);
    const but = vise;
    view = { x: view.x + (but.x - view.x) * k, y: view.y + (but.y - view.y) * k,
             w: view.w + (but.w - view.w) * k, h: view.h + (but.h - view.h) * k };
    /* Assez près pour que l'œil n'y voie rien : on s'y pose, et les libellés
       se retrient enfin — c'est la fin du geste.

       Les quatre nombres comptent, et non la seule largeur. Un cran de molette
       la fait toujours varier, si bien qu'elle suffisait à dire où l'on en
       était ; aller sur un point du plan ne la change pas forcément — on s'y
       déplace sans s'en approcher — et le trajet s'arrêtait alors à sa
       première image, juste avant de commencer. */
    const reste = Math.max(Math.abs(but.x - view.x), Math.abs(but.y - view.y),
                           Math.abs(but.w - view.w), Math.abs(but.h - view.h));
    if (reste < but.w * .002){
      view = but; vise = null; poseVue(); return;
    }
    appliqueVue(); echelle();
    imageZoom = requestAnimationFrame(pas);
  };
  imageZoom = requestAnimationFrame(pas);
}

/**
 * Viser une vue, et y aller en glissant.
 *
 * Le seul chemin pour déplacer la vue autrement que d'un coup : le zoom par
 * crans s'en sert, le centrage sur un stand ou sur un repère aussi. Qui refuse
 * les animations s'y pose tout de suite — « poseVue » arrête au passage le
 * trajet qui serait en cours.
 */
function glisseVers(but){
  if (REDUIT){ view = but; poseVue(); return; }
  vise = but;
  /* Le trajet change l'échelle — un cran de molette, un centrage qui
     rapproche — et c'est ce qui coûte : le plan se tait le temps qu'il dure. */
  figeTextes();
  glisseVersVise();
}

/**
 * Où un nœud du plan se trouvera quand la vue aura fini son trajet.
 *
 * La fiche s'ouvre en s'étirant depuis la forme qu'on a choisie, et il faut
 * pour cela sa place à l'écran. Elle l'avait tant que le centrage se faisait
 * d'un coup : la forme était déjà arrivée. Elle glisse maintenant, et la
 * mesurer en chemin ferait partir la fiche d'un point de passage — le plus
 * souvent hors du cadre, la forme venant à peine d'y entrer.
 *
 * La vue visée est donc posée le temps de la mesure, puis retirée. Deux
 * écritures de « viewBox » de plus, et la géométrie est celle du navigateur
 * plutôt qu'un calcul refait à la main pour chaque sorte de forme.
 */
function rectVisee(n){
  if (!n) return null;
  if (GL.actif) return rectEcranWebgl(n, vise || view);
  if (!vise) return n.getBoundingClientRect();
  const avant = view;
  view = vise; appliqueVue();
  const r = n.getBoundingClientRect();
  view = avant; appliqueVue();
  return r;
}

/**
 * Zoom d'un facteur `f` autour d'un point du cadre donné en fraction de sa
 * largeur et de sa hauteur — `.5, .5` pour le centre, la position du curseur
 * pour la molette.
 *
 * Les crans s'enchaînent sur la vue visée, non sur la vue affichée : deux
 * tours de molette rapides comptent double, sans que le second reparte du
 * trajet que le premier n'avait pas fini de parcourir.
 */
function zoom(f, fx, fy){
  const base = vise || view;
  /* Jusqu'où l'on recule : `recul()` ouvre la limite quand le quartier a été
     dessiné autour du pavillon, et la garde serrée quand il n'y a rien à voir
     au-delà des murs. */
  const nw = Math.min((emp.x1 - emp.x0) * recul(), Math.max(6, base.w * f)), k = nw / base.w;
  glisseVers({ x: base.x + fx * (base.w - nw), y: base.y + fy * base.h * (1 - k),
               w: nw, h: base.h * k });
}
function echelle(){
  const r = cadrePlan();
  const mParPx = view.w / (r.width || 1);
  const pas = [1, 2, 5, 10, 20, 50, 100, 200].find(p => p >= mParPx * 90) || 200;
  $("scaleBar").style.width = (pas / mParPx) + "px";
  $("scaleTxt").textContent = pas + " m";
}

/* ============================================================
   7. Sélection et fiche
   ============================================================ */
const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null;
/** Écran étroit : la liste et la fiche sont des tiroirs, pas des panneaux. */
const ETROIT = () => matchMedia("(max-width:900px)").matches;

/**
 * L'étirement de la fiche depuis la forme qu'on a choisie.
 *
 * `mesure` est une fonction, et non le rectangle qu'elle rend : la mesure
 * coûte, et l'étirement n'a pas toujours lieu. Sur un téléphone la fiche glisse
 * depuis le bas — une mise à l'échelle depuis la forme cliquée se battrait avec
 * ce glissement, et la transition CSS suffit ; on n'y mesurait donc rien, mais
 * on le mesurait quand même, à l'appel. C'était les trois quarts du temps
 * d'ouverture d'une fiche : soixante millisecondes sur un salon de mille
 * stands, parce que lire la boîte d'une forme oblige le navigateur à remettre
 * en page le plan entier — que les libellés, réécrits juste avant, viennent de
 * salir. La fiche s'ouvrait avec un temps de retard, sur l'écran même où elle
 * n'en avait aucun usage.
 */
function anime(mesure, sens){
  const p = $("detail");
  if (anim){ anim.cancel(); anim = null; }
  if (REDUIT || ETROIT()){ if (sens < 0) p.classList.remove("open"); return; }
  const rect = mesure();
  if (!rect){ if (sens < 0) p.classList.remove("open"); return; }
  const b = p.getBoundingClientRect();
  p.style.transformOrigin = (rect.left + rect.width / 2 - b.left) + "px " +
                            (rect.top + rect.height / 2 - b.top) + "px";
  const seed = { transform: "scale(" + Math.max(.05, rect.width / b.width) + "," +
                            Math.max(.03, rect.height / b.height) + ")", opacity: 0 };
  const plein = { transform: "none", opacity: 1 };
  anim = p.animate(sens > 0 ? [seed, plein] : [plein, seed],
    { duration: sens > 0 ? 340 : 200,
      easing: sens > 0 ? "cubic-bezier(.16,.84,.3,1)" : "cubic-bezier(.4,0,.75,.2)" });
  if (sens < 0) anim.finished.then(() => p.classList.remove("open"), () => {});
}
/* La forme de l'emplacement, et non ce qu'un calque a posé dessus : un logo
   ou un stand dessiné porte le même identifiant, et c'est bien le stand qu'on
   veut allumer, cadrer et animer.

   Sauf quand un découpage matérialise justement la société choisie : lui et
   son hôte portent alors le même identifiant, et allumer les deux donnerait à
   voir un grand stand allumé pour désigner le petit qui est dedans. */
function noeud(id, iSoc){
  const d = decoupeStand(id, iSoc);
  if (d) return d;
  const q = '[data-id="' + CSS.escape(id) + '"]';
  return svg.querySelector("#zones " + q + ", #stands " + q) || svg.querySelector(q);
}

/* Trois façons d'atteindre un stand depuis le plan : sa forme, le logo que
   l'exploitant a posé dessus, ou le découpage qu'il y a dessiné. Le logo seul
   fait un chemin à part — les deux autres sont le plan tel qu'on le voit. */
function canalPlan(cible){
  if (!cible || !cible.dataset.f) return "plan";
  const c = formeParId(cible.dataset.f);
  return c && c.f.t === "image" ? "image" : "plan";
}

/** Le rang de la société désignée par un nœud du plan, s'il en désigne une :
 *  un stand dessiné nomme la sienne, une forme d'emplacement ne le fait pas. */
const rangSociete = (el) =>
  el && el.dataset.soc !== undefined ? Number(el.dataset.soc) : undefined;

/**
 * `iSoc` désigne la société qu'on vient voir sur un stand partagé. Absent, la
 * fiche demandera laquelle : c'est le cas d'un clic sur le plan, où l'on a
 * désigné une forme et non un nom. La liste, elle, le passe — elle vient de
 * nommer celle qu'on a choisie.
 */
function select(id, recentrer, canal, iSoc){
  const o = parId.get(id);
  if (!o) return;
  /* Changer de pavillon change la liste elle-même — son sommaire est celui du
     pavillon ouvert, et les lignes d'ailleurs portent une pastille de hall :
     elle se refait alors, quand une simple sélection se contente de déplacer
     sa marque. */
  const ailleurs = o.p !== state.plan;
  if (ailleurs){
    state.plan = o.p; montePlan(); fit();
  }
  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  state.sel = id;
  state.selSoc = iSoc === undefined ? -1 : iSoc;
  const n = noeud(id, state.selSoc); if (n) n.classList.add("sel");
  dessineMarques();
  marqueStandsDessines();
  if (ailleurs) liste(); else marqueChoisie();
  libelles();
  /* Le cadrage est passé dans « ouvre » plutôt que de l'encadrer ici : il
     demandait deux ordres — après la fiche sur un téléphone, avant elle sur un
     grand écran — et l'un des deux cadrait toujours sur une géométrie qu'il ne
     connaissait pas encore. */
  ouvre(o, n, canal, iSoc, recentrer);
}
const centre = (o) => centrePoint(o.c);

/* Un repère n'est pas un objet du plan et n'a pas de centre à lui : il n'a
   qu'un point. C'est tout ce qu'il faut pour cadrer. */
function centrePoint(xy){
  /* Le trajet part de la vue qu'on vise quand il y en a une : un centrage
     demandé pendant qu'un cran de molette finit de glisser s'enchaîne sur son
     arrivée, et non sur le point de passage où il l'a trouvé. */
  const base = vise || view;
  const w = Math.min(base.w, 55), h = w * (base.h / base.w);
  /* Centrer au milieu du cadre placerait la cible derrière le tiroir ou la
     fiche. On la pose au milieu de ce qui reste visible — d'après ce qui est
     réellement masqué, et non une proportion supposée.

     Les deux côtés comptent, et c'est ce qui manquait : la hauteur du tiroir
     en bas sur un téléphone, la largeur de la fiche à droite sur un grand
     écran. Faute du second, un cadre de mille pixels posait le stand à six
     cent soixante-cinq — c'est-à-dire pile sous la fiche, qui commence à six
     cent soixante. On arrivait sur ce qu'on venait voir, et il était caché.
     Ces deux mesures ne valent qu'une fois la fiche posée : c'est « ouvre »
     qui appelle le cadrage, et non l'inverse. */
  const r = cadrePlan();
  const decale = r.height ? (h * (masque() - masqueHaut())) / (2 * r.height) : 0;
  const decaleX = r.width ? (w * masqueDroite()) / (2 * r.width) : 0;
  /* On y va en glissant plutôt que d'un bond. Le plan sautait à l'autre bout
     du hall sans rien montrer du chemin : on y arrivait sans savoir d'où, et
     il fallait retrouver dans quel coin du salon on venait d'être posé. Le
     trajet le dit de lui-même, et le zoom qu'il resserre au passage montre le
     point s'approcher. L'ajustement au pavillon reste un bond, lui : il n'y a
     pas de chemin à montrer entre deux plans, qui ne partagent aucun repère. */
  glisseVers({ x: xy[0] - w / 2 + decaleX, y: xy[1] - h / 2 + decale, w: w, h: h });
}
/* Les champs qui se taisent tant qu'on ne les a pas demandés — l'inverse de la
   règle générale, et pour la raison qui la fonde. Un champ absent du réglage
   paraît parce qu'il paraissait déjà avant que le réglage existe ; le hall,
   lui, n'a jamais paru, et Klipso y porte parfois le code du dossier plutôt
   qu'un nom de hall — « SMCL26_P71 ». S'afficher de lui-même le publierait
   d'un coup sur tous les salons déjà en ligne.

   Le même tableau vit dans la console — « FICHE_MASQUEE_PAR_DEFAUT » de
   « _console-js.html », qui décide de l'état des cases. */
const MASQUE_PAR_DEFAUT = { hall: true };

/**
 * Un champ paraît-il sur la fiche ? L'exploitant en décide depuis la console.
 * Une entrée absente vaut « affiché », pour qu'un champ ajouté plus tard ne
 * disparaisse pas des salons déjà réglés — sauf ceux que le tableau ci-dessus
 * réserve, qui attendent d'être cochés.
 */
function montre(type, cle){
  const r = (DATA && DATA.fiche && DATA.fiche[type]) || {};
  return MASQUE_PAR_DEFAUT[cle] ? r[cle] === true : r[cle] !== false;
}

/* L'ordre de lecture du corps d'une fiche de stand, tel qu'il vaut tant que
   l'exploitant n'y a pas touché.

   N'y figure que le corps ; le numéro de stand et la pastille des nouveaux
   venus tiennent dans l'en-tête, les conférences ont leur propre volet, et
   rien de tout cela ne se déplace — le volet qui propose de le remanier,
   « voletOrdre » de « _admin1.html », le dit à l'exploitant. */
const ORDRE_CORPS_FICHE = ["raison", "secteur", "adresse", "ville", "pays",
  "niveaux", "telephone", "site", "facebook", "linkedin", "instagram",
  "nomenclature", "thematiques"];

/* Les intitulés du corps de la fiche. Ils vivent dans une table plutôt qu'en
   toutes lettres à leur ligne parce qu'ils s'écrivent à deux endroits : sur la
   fiche, et dans l'aperçu des modèles du panneau d'apparence. Un aperçu qui ne
   nommerait pas les champs comme la fiche ne montrerait pas la fiche. */
const LIBELLE_CORPS = {
  raison: "Raison sociale", secteur: "Secteur", adresse: "Adresse",
  ville: "Ville", pays: "Pays", niveaux: "Niveaux", telephone: "Téléphone",
  site: "Site web", facebook: "Facebook", linkedin: "LinkedIn",
  instagram: "Instagram", nomenclature: "Nomenclature", thematiques: "Thématiques",
  /* Les deux champs qu'une zone organisateur porte en propre : ils ne viennent
     pas d'une fiche d'exposant mais de la main de l'exploitant, et ne
     s'écrivent donc jamais sur un stand. */
  description: "Description", lien: "Lien",
};

/** L'intitulé d'un champ du corps — un champ propre au salon porte le sien. */
const libelleCorps = cle => cle.indexOf(PREFIXE_PERSO) === 0
  ? libelleCritere(cle) : (LIBELLE_CORPS[cle] || cle);

/**
 * L'ordre réglé par l'exploitant, complété de ce qu'il ne connaît pas encore.
 *
 * Un champ ajouté après coup — au code, ou par le salon — ne figure pas dans
 * la liste enregistrée. L'oublier le ferait disparaître de la fiche, et le
 * rejeter à la fin le sortirait de son voisinage sans qu'on l'ait demandé : il
 * reprend donc la place que le défaut lui donne, derrière le champ qu'il y
 * suit.
 *
 * Un champ que le salon n'affiche pas n'est pas non plus dans la liste réglée
 * — elle ne range que ce qui paraît — et revient par le même chemin le jour
 * où on le rallume : à la place que le défaut lui donne, à moins qu'on ne
 * l'ait déposé ailleurs, ce qui l'y inscrit.
 */
function ordreCorps(persos){
  const defaut = ORDRE_CORPS_FICHE.concat(persos || []);
  const regle = ((DATA && DATA.fiche && DATA.fiche.ordre) || [])
    .filter(c => defaut.indexOf(c) >= 0);
  if (!regle.length) return defaut;
  const sortie = regle.slice();
  defaut.forEach((c, i) => {
    if (sortie.indexOf(c) >= 0) return;
    // le premier voisin de gauche que le réglage connaît donne le point d'entrée
    let j = -1;
    for (let k = i - 1; k >= 0 && j < 0; k--) j = sortie.indexOf(defaut[k]);
    sortie.splice(j + 1, 0, c);
  });
  return sortie;
}

/* ------------------------------------------------------------------
   Les groupes de champs

   Trois lignes qui se suivent — l'adresse, la ville, le pays — portaient trois
   intitulés pour une seule information, et la fiche s'allongeait d'autant. Un
   groupe les réunit sous un titre que l'exploitant écrit depuis les réglages
   du plan : les intitulés de ses membres s'effacent, et leurs valeurs se
   lisent l'une sous l'autre, comme les valeurs multiples d'un même champ.

   Les onze modèles n'ont rien à en apprendre : un groupe est un champ de plus,
   avec son intitulé et ses lignes. Ils l'habillent donc comme le reste sans
   qu'aucun ait à le connaître.
   ------------------------------------------------------------------ */

/** Les groupes réglés pour ce salon — ceux qui réunissent vraiment quelque
 *  chose : un groupe vidé de ses membres n'est plus un groupe. */
const groupesFiche = () => ((DATA && DATA.fiche && DATA.fiche.groupes) || [])
  .filter(g => g && Array.isArray(g.cles) && g.cles.length);

/**
 * L'intitulé d'un champ paraît-il devant sa valeur ?
 *
 * L'exploitant en décide champ par champ, depuis les réglages du plan. Ce qui
 * n'est pas réglé suit l'usage : un champ seul annonce ce qu'il porte, un
 * champ réuni sous un titre ne le répète pas — c'est même ce qui fait un
 * groupe. La case existe parce que l'usage se dément : une adresse web ou un
 * picto de réseau social se reconnaissent sans qu'on les nomme, et trois
 * lignes réunies sous « Contact » ne disent plus laquelle est le téléphone.
 */
const montreIntitule = (cle, enGroupe) => {
  const r = (DATA && DATA.fiche && DATA.fiche.intitules) || {};
  return typeof r[cle] === "boolean" ? r[cle] : !enGroupe;
};

/**
 * La valeur d'un champ du corps, prête à poser dans la fiche.
 *
 * Une valeur unique s'écrit telle quelle, sur la ligne où l'intitulé l'attend.
 * Plusieurs valeurs arrivent déjà découpées — c'est le champ qui sait comment
 * les siennes se lisent, une thématique étant un bouton là où une ligne de
 * nomenclature n'est que du texte. Dans un groupe, la valeur unique devient
 * une ligne à son tour : elle n'est plus seule sous l'intitulé, elle en côtoie
 * d'autres.
 *
 * Un membre qui garde son intitulé le pose devant sa valeur, sur la même
 * ligne : au-dessus, il ferait un second titre sous celui du groupe. Quand il
 * porte plusieurs valeurs, elles ont déjà leurs lignes et l'intitulé prend la
 * sienne.
 */
const valeurCorps = (c, enGroupe) => {
  if (!enGroupe) return Array.isArray(c.valeur) ? c.valeur.join("") : c.valeur;
  const lib = montreIntitule(c.cle, true)
    ? '<span class="lib">' + c.libelle + '</span>' : "";
  if (Array.isArray(c.valeur)){
    return (lib ? '<span class="ligne">' + lib + '</span>' : "") + c.valeur.join("");
  }
  return '<span class="ligne">' + lib + c.valeur + '</span>';
};

/* Un champ du corps : son intitulé, puis sa valeur. Sans intitulé, il ne reste
   que la valeur — et la classe, que les habillages qui rangent l'intitulé dans
   une colonne à lui ont besoin de lire pour rendre la place. */
const champCorps = c => {
  const dit = montreIntitule(c.cle, false);
  return '<div class="field' + (c.classe ? " " + c.classe : "") +
    (dit ? "" : " muet") + '">' +
    (dit ? '<span class="eyebrow">' + c.libelle + '</span>' : "") +
    '<span class="v">' + valeurCorps(c) + '</span></div>';
};

/* Un groupe sans titre reprend l'intitulé de son premier membre : il vaut
   mieux le nom d'un des champs réunis qu'un intitulé vide au-dessus de trois
   lignes. L'intitulé d'un membre est déjà échappé, le titre saisi ne l'est
   pas. */
const groupeCorps = (titre, membres) => '<div class="field groupe">' +
  '<span class="eyebrow">' + (titre ? esc(titre) : membres[0].libelle) + '</span>' +
  '<span class="v">' + membres.map(c => valeurCorps(c, true)).join("") + '</span></div>';

/**
 * Le corps rangé : les champs dans l'ordre réglé, ceux d'un groupe réunis sous
 * son titre à la place du premier d'entre eux.
 *
 * Les membres se lisent dans l'ordre du corps et non dans celui du groupe :
 * c'est la liste rangée qui fait foi. Un membre masqué ou vide n'a pas de
 * ligne à donner, et un groupe dont aucun membre n'en donne ne paraît pas —
 * un titre seul n'annoncerait rien.
 */
function corpsRange(ordre, champs){
  const groupes = groupesFiche();
  const faits = [];
  return ordre.map(cle => {
    const i = groupes.findIndex(g => g.cles.indexOf(cle) >= 0);
    if (i < 0) return champs[cle] ? champCorps(champs[cle]) : "";
    if (faits.indexOf(i) >= 0) return "";
    faits.push(i);
    const membres = ordre.filter(c => groupes[i].cles.indexOf(c) >= 0 && champs[c])
      .map(c => champs[c]);
    return membres.length ? groupeCorps(groupes[i].titre, membres) : "";
  }).join("");
}

/**
 * Le programme d'une zone, en vignettes chronologiques.
 *
 * L'heure vient d'Eventmaker sous sa forme locale — « 03/14/2026 10:30 » — ce
 * qui évite de deviner le fuseau du salon depuis le navigateur d'un visiteur
 * qui peut être ailleurs. On la relit telle quelle plutôt que d'en faire une
 * date, dont le rendu dépendrait justement du fuseau.
 */
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
              "août", "septembre", "octobre", "novembre", "décembre"];

/**
 * L'heure d'une conférence, dans le fuseau du salon.
 *
 * Eventmaker donne deux formes. « 03/14/2026 10:30 » est l'heure locale du
 * salon : on la relit telle quelle, c'est la seule qui ne demande rien. La
 * forme ISO, elle, porte un décalage — souvent Z — qu'il faut ramener au
 * fuseau de l'événement, sans quoi un visiteur d'un autre pays lirait des
 * horaires faux.
 */
function momentLocal(v, fuseau){
  const t = String(v || "");
  const m = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/.exec(t);
  if (m){
    return { jour: +m[2], mois: +m[1], an: +m[3], h: m[4].padStart(2, "0"), min: m[5],
             cle: m[3] + m[1] + m[2] };
  }
  const d = new Date(t);
  if (isNaN(d)) return null;
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", {
      timeZone: fuseau || undefined, year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(d).map(x => [x.type, x.value]));
    return { jour: +p.day, mois: +p.month, an: +p.year,
             h: String(p.hour).padStart(2, "0"), min: p.minute,
             cle: p.year + p.month + p.day };
  } catch (e) {
    return null;   // fuseau inconnu : mieux vaut taire l'heure que la fausser
  }
}

/** Le programme d'une zone, ou celui d'un exposant : la même liste, rendue. */
function programme(l, titre){
  l = l || [];
  if (!l.length) return "";
  /* La classe nomme le bloc du programme : deux modèles de fiche le traitent
     à part — l'un le déroule en ligne de temps, l'autre lui laisse son libellé
     quand il efface tous les autres. */
  let out = '<div class="field prog-bloc"><span class="eyebrow">' + esc(titre || "Programme") +
    '</span><div class="prog">';
  let jourCourant = null;
  for (const c of l){
    const fz = DATA.fuseau;
    const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
    const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);
    if (d && d.cle !== jourCourant){
      jourCourant = d.cle;
      const dt = new Date(d.an, d.mois - 1, d.jour);
      out += '<div class="jour">' + esc(JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1]) + '</div>';
    }
    const heure = d ? d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "") : "";
    /* Le signet se pose à côté de la vignette et non dedans : un bouton n'en
       contient pas un autre, et l'appui doit choisir entre lire et retenir. */
    out += '<div class="confRang">' +
      '<button type="button" class="conf" data-conf="' + esc(c.id) + '"' +
      (c.couleur ? ' style="--tc:' + esc(c.couleur) + '"' : "") + '>' +
      (heure ? '<span class="h">' + esc(heure) + '</span>' : "") +
      '<span class="t">' + esc(c.nom) + '</span>' +
      (c.type ? '<span class="ty">' + esc(c.type) + '</span>' : "") +
      '</button>' + signetParcours("conf", c.id) + '</div>';
  }
  return out + '</div></div>';
}

/** Une date écrite en toutes lettres : « samedi 14 mars 2026 ». */
function jourLong(d){
  if (!d) return "";
  const dt = new Date(d.an, d.mois - 1, d.jour);
  return JOURS[dt.getDay()] + " " + d.jour + " " + MOIS[d.mois - 1] + " " + d.an;
}

/**
 * La fiche d'une conférence. Le programme d'une zone ne montre que l'essentiel
 * — l'heure et le titre — parce qu'il en aligne parfois vingt ; le reste,
 * description comprise, tient ici.
 */
function ficheConf(id, canal){
  // l'index est global : une conférence retenue peut se tenir dans un autre
  // pavillon que celui qu'on regarde
  const c = CONFS.get(String(id));
  if (!c) return;
  mesure("fiche_conf", canal, String(id));
  const fz = DATA.fuseau;
  const d = momentLocal(c.debutLocal, fz) || momentLocal(c.debut, fz);
  const f = momentLocal(c.finLocal, fz) || momentLocal(c.fin, fz);

  ouvreModale(c.nom, corps => {
    const bloc = (l, v, cls) => {
      if (!v) return;
      const w = document.createElement("div");
      w.className = "field" + (cls ? " " + cls : "");
      w.innerHTML = '<span class="eyebrow"></span><span class="v"></span>';
      w.querySelector(".eyebrow").textContent = l;
      w.querySelector(".v").textContent = v;
      corps.appendChild(w);
    };
    if (c.type){
      const t = document.createElement("div");
      t.className = "conf-type";
      if (c.couleur) t.style.setProperty("--tc", c.couleur);
      t.textContent = c.type;
      corps.appendChild(t);
    }
    bloc("Quand", d
      ? jourLong(d) + " · " + d.h + "h" + d.min + (f ? " – " + f.h + "h" + f.min : "")
      : "");
    bloc("Où", c.salle);
    /* Qui la tient, et où le trouver : le numéro de stand situe l'exposant et
       sa fiche s'ouvre d'un appui — c'est souvent pour lui qu'on lisait le
       programme. Ils peuvent être plusieurs, y compris depuis deux pavillons,
       d'où la liste plutôt qu'une ligne. */
    const tenue = (EXPOSANTS.get(String(id)) || [])
      .map(e => ({ e: e, o: parId.get(e.stand) }))
      .filter(x => x.o || x.e.nom);
    if (tenue.length){
      const w = document.createElement("div");
      w.className = "field";
      w.innerHTML = '<span class="eyebrow"></span><div class="expos"></div>';
      w.querySelector(".eyebrow").textContent = "Organisée par";
      const hote = w.querySelector(".expos");
      tenue.forEach(x => {
        const o = x.o;
        const code = o && montre("stand", "code") && o.code ? o.code : "";
        // le pavillon n'apprend rien tant que c'est celui qu'on regarde
        const ou = [o && o.p !== state.plan ? DATA.plans[o.p].libelle : "", code]
          .filter(Boolean).join(" · ");
        // un stand absent du plan — filtré, ou d'un pavillon non publié — se
        // lit quand même, il ne se clique pas
        const el = document.createElement(o ? "button" : "div");
        el.className = "expo" + (o ? "" : " statique");
        if (o) el.type = "button";
        el.innerHTML = '<span class="n"></span><span class="c"></span>';
        el.querySelector(".n").textContent =
          (o && (o.nom || o.plan)) || x.e.nom || ("Stand " + code).trim();
        el.querySelector(".c").textContent = ou;
        /* La fiche de l'exposant prend la place de celle de la conférence, et
           le plan se recentre sur son stand — au besoin en changeant de
           pavillon, ce dont `select` se charge. */
        if (o) el.onclick = () => { fermeModale(); select(o.id, true, "conference"); };
        hote.appendChild(el);
      });
      corps.appendChild(w);
    }
    /* Qui parle, et qui anime. Aucun des deux ne tient de stand — c'est ce qui
       les sépare d'un exposant : on les lit, on ne les suit nulle part. Ils
       prennent donc son rang, en plus sobre : une ligne par personne, le nom
       puis l'enseigne au bout.

       La fonction n'y paraît pas, et c'est délibéré : elle doublait la hauteur
       du bloc — sept intervenants faisaient quatorze lignes, qui repoussaient la
       présentation hors de l'écran — pour ce que « Franchisé », cinquante-sept
       fois sur un même programme, apprend de chacun. L'enseigne, elle, est ce
       qui rattache la personne au salon.

       Les deux rôles tiennent un seul bloc : un intitulé de plus coûtait deux
       lignes sur la moitié des fiches, quand l'animation se dit d'un mot. */
    const gens = [];
    (c.intervenants || []).forEach(p => gens.push({ p: p, role: "" }));
    (c.animateurs || []).forEach(p => {
      // la même personne peut parler et animer : elle ne paraît qu'une fois, et
      // c'est l'animation qu'on retient, puisque c'est ce qui la distingue
      const deja = gens.find(g => g.p.nom === p.nom);
      if (deja) deja.role = "animation"; else gens.push({ p: p, role: "animation" });
    });
    if (gens.length){
      const w = document.createElement("div");
      w.className = "field";
      w.innerHTML = '<span class="eyebrow"></span><div class="expos gens"></div>';
      // une conférence peut n'avoir qu'un animateur : l'appeler intervenant
      // serait le seul endroit de la fiche à nommer quelqu'un de travers
      w.querySelector(".eyebrow").textContent =
        (c.intervenants || []).length ? "Intervenants" : "Animée par";
      const hote = w.querySelector(".gens");
      gens.forEach(g => {
        const el = document.createElement("div");
        el.className = "expo statique";
        /* Le nom et sa mention sont deux cellules, non un texte suivi : c'est
           ce qui garde la seconde sur la ligne de la première quand la place
           manque — seule sous le nom, elle passait pour un intitulé. */
        el.innerHTML = '<span class="n"><span class="nm"></span></span><span class="c"></span>';
        el.querySelector(".nm").textContent = g.p.nom;
        if (g.role && (c.intervenants || []).length){
          const r = document.createElement("span");
          r.className = "r";
          r.textContent = g.role;
          el.querySelector(".n").appendChild(r);
        }
        const ens = el.querySelector(".c");
        ens.textContent = g.p.societe || "";
        // coupée par une ellipse faute de place : elle se lit en entier ici
        if (g.p.societe) ens.title = g.p.societe;
        hote.appendChild(el);
      });
      corps.appendChild(w);
    }
    bloc("Thématique", c.theme);
    bloc("Présentation", c.texte, "large");
    const acts = document.createElement("div");
    acts.className = "acts";
    acts.innerHTML = boutonParcours("conf", c.id);
    /* « Où » nomme la salle ; encore faut-il la trouver. La zone qui l'abrite
       est le seul point du plan que la conférence désigne — et elle peut se
       tenir dans un autre pavillon que celui qu'on regarde. */
    if (c.zone && parId.has(String(c.zone))){
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = "Situer sur le plan";
      b.onclick = () => { fermeModale(); select(String(c.zone), true); };
      acts.appendChild(b);
    }
    corps.appendChild(acts);
    brancheParcours(corps);
    // « fiche » espace les blocs comme le fait celle d'un stand
  }, [{ libelle: "Fermer", genre: "primaire" }], "fiche");
}

/**
 * Une adresse en lien cliquable, affichée sans son protocole.
 *
 * Les champs de réseaux sociaux sont saisis à la main : tantôt une adresse
 * complète, tantôt un simple nom de compte. On complète ce qui manque plutôt
 * que d'afficher un lien mort.
 */
function lien(v){
  const u = adresseWeb(v);
  if (!u) return "";
  return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' +
         esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, "")) + '</a>';
}

/** Une adresse saisie à la main, ramenée à une adresse web complète. */
function adresseWeb(v){
  const u = String(v == null ? "" : v).trim().replace(/\\/g, "");
  if (!u) return "";
  return /^https?:/i.test(u) ? u : "https://" + u.replace(/^\/+/, "");
}

/* Les pictos des réseaux sociaux.

   Une adresse de réseau social n'apprend rien qu'on ne sache déjà : elle
   redit le nom du réseau puis celui de l'exposant, sur une ligne assez longue
   pour revenir à la ligne. Le logo le dit plus vite, et trois logos tiennent
   sur la ligne que prenait une seule adresse.

   Ils sont tracés dans la couleur du texte plutôt que dans celle de la
   marque : la fiche est habillée par l'exploitant, et trois aplats de marque
   posés côte à côte lui prendraient sa page. */
const PICTO_RS = {
  facebook: '<path d="M24 12.07C24 5.44 18.63.07 12 .07S0 5.44 0 12.07c0 5.99 4.39' +
    ' 10.95 10.13 11.86v-8.39H7.08v-3.47h3.05V9.43c0-3.01 1.79-4.67 4.53-4.67 1.31 0' +
    ' 2.69.24 2.69.24v2.95h-1.51c-1.49 0-1.96.93-1.96 1.88v2.25h3.33l-.53' +
    ' 3.47h-2.8v8.39C19.61 23.02 24 18.06 24 12.07Z"/>',
  linkedin: '<path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85' +
    ' 0-2.13 1.44-2.13 2.94v5.66H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6' +
    ' 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0' +
    ' 4.13Zm1.78 13.02H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0' +
    ' 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/>',
  instagram: '<rect x="2.2" y="2.2" width="19.6" height="19.6" rx="5.6" fill="none"' +
    ' stroke="currentColor" stroke-width="2.1"/>' +
    '<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.1"/>' +
    '<circle cx="17.5" cy="6.5" r="1.45"/>',
};

/**
 * Un réseau social, en picto cliquable.
 *
 * La valeur sort déjà sous forme de ligne — ce que la fiche fait d'un champ
 * qui en porte plusieurs — pour que le picto s'affiche pareil seul sous son
 * intitulé ou réuni avec les autres sous un titre commun : c'est la ligne que
 * la feuille de style aligne horizontalement.
 *
 * Un réseau dont on n'a pas le logo ne perd pas son adresse pour autant : il
 * retombe sur le lien écrit en toutes lettres.
 */
function pictoRS(cle, v){
  const u = adresseWeb(v);
  if (!u) return [];
  if (!PICTO_RS[cle]) return ['<span class="ligne">' + lien(v) + '</span>'];
  const nom = LIBELLE_CORPS[cle] || cle;
  return ['<span class="ligne rs"><a class="rs" href="' + esc(u) +
    '" target="_blank" rel="noopener" title="' + esc(nom) +
    '" aria-label="' + esc(nom) + '">' +
    '<svg viewBox="0 0 24 24" aria-hidden="true">' + PICTO_RS[cle] + '</svg></a></span>'];
}

/**
 * Une adresse dont on peut faire un lien.
 *
 * Tout ce qui n'est pas une page, un courriel ou un numéro est écarté :
 * « javascript: » et « data: » sont des adresses valides pour le navigateur,
 * et exécuteraient ce qu'on aurait posé dedans.
 */
function adresseSure(v){
  const u = String(v == null ? "" : v).trim().replace(/[\u0000-\u001F]/g, "");
  if (!u) return "";
  if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
  // une adresse écrite sans protocole est une page web : c'est le cas courant
  if (/^[\w.-]+\.[a-z]{2,}(\/|$|\?|#)/i.test(u)) return "https://" + u.replace(/^\/+/, "");
  return "";
}

/* Ce qu'un logo de zone a le droit d'être : une image que la page a fabriquée
   elle-même, et rien d'autre.

   Le « svg » n'y figure pas, et c'est délibéré : il porte du script, que le
   navigateur exécute dès qu'on le pose autrement que dans une image. Le
   convertisseur n'en produit de toute façon jamais — il rend ce que la toile
   sait écrire, webp là où c'est possible, png partout. */
const IMAGE_SURE = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+=*$/;

/**
 * L'adresse d'une vignette fabriquée à la synchronisation.
 *
 * Elle est servie par notre propre API, nommée par l'empreinte de l'adresse
 * d'origine — donc immuable, gardée sans limite par le relais, le navigateur
 * et le service worker. Le préchargement l'a le plus souvent déjà reçue par
 * lot : on rend alors ses octets, et il n'y a plus d'adresse du tout. Recadrée et réduite là-bas, elle pèse trois
 * kilo-octets au lieu de cent cinquante, et n'a plus rien à faire décoder ni
 * analyser ici.
 *
 * Elle ne dit rien de plus que le logo public qu'elle montre : aucun slug ne
 * l'accompagne, et la même vignette sert les salons qui partagent l'enseigne.
 */
const adresseVignette = (cle) =>
  /* Déjà reçue par lot : ce sont ses octets qu'on rend, et la fiche n'a plus
     rien à demander. Sinon son adresse, qui vaut pour celle qu'on n'a pas
     encore — le lot peut n'être pas arrivé, ou ne jamais partir. */
  VIGNETTES.get(cle) ||
  (API && /^[0-9a-f]{8,64}$/.test(String(cle || ""))
    ? API + "?vignette=" + cle
    : "");

/**
 * Le logo d'une société, relu avant d'être affiché.
 *
 * Celui-ci n'est pas déposé mais lu chez la source — l'avatar d'une fiche
 * Eventmaker — et c'est donc une adresse, quand celui d'une zone est une image
 * embarquée. La synchronisation applique déjà la règle ; la page ne s'en remet
 * pas à elle pour autant : « data: » et « javascript: » sont des adresses
 * valides, et cette fiche-là est posée chez tous les visiteurs.
 */
function adresseImage(v){
  const u = String(v == null ? "" : v).trim().replace(/[\u0000-\u001F]/g, "");
  return /^https?:\/\//i.test(u) ? u : "";
}

/**
 * Le logo d'une zone, relu avant d'être affiché.
 *
 * Il suit le chemin de la description — saisi par un exploitant authentifié,
 * enregistré en base, renvoyé par l'API, posé dans la fiche de tous les
 * visiteurs — et mérite donc la même méfiance : ce n'est pas parce qu'il est
 * arrivé par l'éditeur qu'il en vient.
 */
function imageSure(v){
  const u = String(v == null ? "" : v).trim();
  return IMAGE_SURE.test(u) ? u : "";
}

/* Ce qu'une description écrite dans l'éditeur a le droit de contenir, et sous
   quel nom elle le garde : de la mise en forme, rien d'autre. Les balises que
   les navigateurs produisent pour dire la même chose — « b », « i », « div » —
   sont ramenées à celle qu'on garde, pour n'avoir qu'un balisage à habiller. */
const RICHE_BALISES = { P: "p", DIV: "p", BR: "br", STRONG: "strong", B: "strong",
  EM: "em", I: "em", U: "u", UL: "ul", OL: "ol", LI: "li", A: "a" };
/* Celles dont le contenu part avec elles : le texte d'un script n'est pas du
   texte, et le déplier reviendrait à l'écrire dans la fiche. */
const RICHE_MUETTES = { SCRIPT: 1, STYLE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1,
  TEMPLATE: 1, NOSCRIPT: 1, SVG: 1, MATH: 1, LINK: 1, META: 1, FORM: 1 };

/**
 * La description d'une zone, relue avant d'être affichée.
 *
 * Elle est écrite par un exploitant authentifié, dans un éditeur qui ne produit
 * que de la mise en forme — mais elle passe par la base, revient par l'API, et
 * finit dans la fiche de tous les visiteurs. Un balisage arrivé par un autre
 * chemin que l'éditeur ne doit pas s'y exécuter : on ne filtre donc pas ce
 * qu'on refuse, on ne garde que ce qu'on reconnaît.
 *
 * Une balise inconnue mais inoffensive — un titre, une police — laisse son
 * texte derrière elle : perdre la mise en forme vaut mieux que perdre la
 * phrase.
 */
function assainitRiche(html){
  const brut = String(html == null ? "" : html);
  if (!brut) return "";
  const lu = new DOMParser().parseFromString("<body>" + brut + "</body>", "text/html").body;
  const sortie = document.createElement("div");
  const copie = (de, vers) => {
    de.childNodes.forEach(n => {
      if (n.nodeType === 3){ vers.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      if (RICHE_MUETTES[n.tagName]) return;
      const nom = RICHE_BALISES[n.tagName];
      // inconnue : on la déplie, son contenu reste
      if (!nom){ copie(n, vers); return; }
      const e = document.createElement(nom);
      if (nom === "a"){
        const u = adresseSure(n.getAttribute("href"));
        // un lien sans adresse tenable n'est plus qu'un bout de phrase
        if (!u){ copie(n, vers); return; }
        e.setAttribute("href", u);
        e.setAttribute("target", "_blank");
        e.setAttribute("rel", "noopener");
      }
      copie(n, e);
      vers.appendChild(e);
    });
  };
  copie(lu, sortie);
  rangeRiche(sortie);
  return sortie.innerHTML;
}

/* Ce que le balisage doit être en sortie : des blocs au premier rang, du texte
   dedans. Un éditeur laisse rarement les choses ainsi — une liste mise en forme
   reste dans le paragraphe qui la portait, une première ligne n'en a jamais eu.
   Or « p » n'accepte pas de bloc : le navigateur qui relit la fiche referme
   alors le paragraphe devant la liste, et laisse un blanc là où on ne l'attend
   pas. Autant ranger ici, où l'on tient encore l'arbre. */
const BLOCS_RICHE = { P: 1, UL: 1, OL: 1 };

/** Une suite de nœuds rangée en blocs : chaque passage de texte prend un « p ». */
function enBlocs(noeuds){
  const frag = document.createDocumentFragment();
  let par = null;
  [...noeuds].forEach(n => {
    if (n.nodeType === 1 && BLOCS_RICHE[n.tagName]){ par = null; frag.appendChild(n); return; }
    // un blanc entre deux blocs n'ouvre pas un paragraphe pour lui seul
    if (!par && n.nodeType === 3 && !n.nodeValue.trim()) return;
    if (!par){ par = document.createElement("p"); frag.appendChild(par); }
    par.appendChild(n);
  });
  return frag;
}

function rangeRiche(hote){
  // les blocs glissés dans un paragraphe en sortent, avec ce qui les entoure
  for (let tour = 0; tour < 8; tour++){
    const dedans = [...hote.querySelectorAll("p")]
      .filter(e => [...e.children].some(c => BLOCS_RICHE[c.tagName]));
    if (!dedans.length) break;
    dedans.forEach(e => e.replaceWith(enBlocs(e.childNodes)));
  }
  // et ce qui traîne au premier rang sans paragraphe en prend un
  if ([...hote.childNodes].some(n => !(n.nodeType === 1 && BLOCS_RICHE[n.tagName])))
    hote.replaceChildren(enBlocs(hote.childNodes));
  /* Refermer un paragraphe devant une liste en sème un vide de part et
     d'autre : c'est la ponctuation du navigateur, pas une ligne blanche que
     quelqu'un aurait voulue — celle-là porte un « br ». */
  hote.querySelectorAll("p").forEach(e => {
    if (!e.textContent.trim() && !e.querySelector("br")) e.remove();
  });
}

/* Un appui tactile produit, quelque trois cents millisecondes plus tard, un
   clic de compatibilité aux mêmes coordonnées. La fiche venant d'apparaître
   sous le doigt, ce clic fantôme la refermait aussitôt — d'où l'impression
   d'un double clic — ou suivait un lien qu'elle contient. On la rend
   insensible le temps qu'il passe, et seulement après un appui : à la souris,
   rien ne justifierait ce temps mort. */
let dernierAppuiTactile = false;
let degel = null;

function ecarteClicFantome(){
  if (!dernierAppuiTactile) return;
  const zones = [$("detail"), $("voile"), $("modale")].filter(Boolean);
  zones.forEach(z => { z.style.pointerEvents = "none"; });
  clearTimeout(degel);
  degel = setTimeout(() => zones.forEach(z => { z.style.pointerEvents = ""; }), 450);
}

/** Le nom sous lequel une société se présente sur un stand. */
const nomSociete = (x) => x.nom || x.plan || "Sans nom";

/**
 * Les sociétés d'un stand, celle qui le loue en tête.
 *
 * Elle est le stand lui-même : c'est son dossier qui l'a désignée à la
 * synchronisation, et ses champs sont posés à plat sur lui. Les autres vivent
 * dans « coex », dans l'ordre où la source les a rendues.
 *
 * Le rang les distingue, la liste ne le dit pas : qui loue et qui est hébergé
 * relève du contrat entre l'organisateur et ses exposants. Un visiteur cherche
 * une enseigne, pas sa place dans un bail.
 */
function societes(o){
  return [{ soc: o, i: -1 }].concat((o.coex || []).map((x, i) => ({ soc: x, i: i })));
}

/**
 * Le choix, quand plusieurs sociétés se partagent un stand.
 *
 * Ouvrir d'office la fiche du titulaire donnerait le stand à lui seul,
 * alors qu'un stand de restauration en héberge jusqu'à onze. On demande donc
 * qui l'on vient voir, plutôt que de le supposer.
 */
function choisitExposant(o, depuis, canal, recentrer){
  const tous = societes(o);
  ouvreModale(("Stand " + (o.code || "")).trim(), corps => {
    const p = document.createElement("p");
    p.textContent = tous.length + " sociétés occupent ce stand.";
    const ul = document.createElement("ul");
    ul.className = "expos";
    tous.forEach(x => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const n = document.createElement("span");
      n.className = "nom";
      n.textContent = nomSociete(x.soc);
      b.appendChild(n);
      b.onclick = () => {
        fermeModale();
        // la liste marque la société ouverte, d'où qu'on l'ait choisie ; le
        // plan, lui, ne bouge pas — il nomme le titulaire quoi qu'on lise
        state.selSoc = x.i; liste();
        ouvre(o, depuis, canal, x.i, recentrer);
      };
      li.appendChild(b);
      ul.appendChild(li);
    });
    corps.appendChild(p); corps.appendChild(ul);
  }, [{ libelle: "Fermer" }]);
  ecarteClicFantome();
}

/**
 * La marque en tête de fiche : le logo d'une enseigne, ou celui que
 * l'exploitant a déposé sur une zone. Une fiche sans marque n'en montre aucune.
 *
 * Elle vit ici pour la même raison que `poseCode` : deux fiches écrivent cette
 * image — celle d'un stand ou d'une zone, et celle d'un repère, qui n'en a
 * jamais et doit donc l'effacer. La seconde ne le faisait pas, et la marque du
 * stand d'avant restait en tête de la fiche d'un escalier.
 */
function poseMarque(blason){
  const marque = $("dLogo");
  if (!marque) return;
  /* Un logo lu chez la source peut n'y être plus : celui qui ne se charge pas
     s'efface, plutôt que de laisser une vignette brisée en tête de fiche.
     Celui d'une zone voyage dans la fiche et ne connaît pas ce sort ; la même
     ligne les couvre tous les deux. */
  marque.onerror = () => { marque.hidden = true; delete marque.dataset.attend; };
  /* Où elle se range dépend de sa largeur, qu'on ne connaît qu'une fois
     l'image tenue : le rangement suit donc l'apparition, jamais avant. */
  marque.onload = () => { marque.hidden = false; delete marque.dataset.attend; rangeMarque(); };
  if (!blason){
    marque.hidden = true;
    delete marque.dataset.attend;
    marqueDemandee = "";
    /* L'adresse est retirée avec l'image cachée, sinon la fiche suivante
       montrerait la marque de la précédente le temps que la sienne arrive. */
    marque.removeAttribute("src");
    return;
  }
  /* La même marque rouverte : posée, ou en route vers sa place. Une image
     déjà tenue par le cache est complète et ne donnera aucun événement — elle
     n'a pas à en attendre un pour paraître, et celle qui a déjà manqué n'en
     attend pas non plus pour s'effacer. */
  if (blason === marqueDemandee){
    if (marque.getAttribute("src") && marque.complete) montreMarque(marque);
    return;
  }
  /* Changer `src` ne retire pas l'image déjà peinte : le navigateur garde la
     précédente à l'écran jusqu'à ce que la nouvelle soit décodée. La fiche
     qu'on vient d'ouvrir portait donc la marque de celle d'avant pendant tout
     le trajet — invisible sur un bureau, très visible sur le réseau d'un
     salon. On la cache donc le temps du trajet, et `onload` la ramène. */
  marqueDemandee = blason;
  /* Elle tient sa place au lieu de disparaître : l'en-tête garde la hauteur
     qu'il aura, et ce qu'on lit dessous ne saute plus à son arrivée. Voir
     « logoZone[data-attend] » dans la feuille de style.

     Sur la ligne du numéro, et non là où la fiche d'avant l'avait laissée :
     une place tenue au hasard n'en est pas une. C'est aussi là que la plupart
     des marques finissent — un logo en largeur, une fois ses marges retirées,
     ne tient plus à côté d'un nom. */
  marque.hidden = false;
  marque.dataset.attend = "";
  const bas = $("dBadges");
  if (bas && marque.parentNode !== bas) bas.appendChild(marque);
  marque.style.maxWidth = "";
  marque.removeAttribute("src");
  recadreMarque(blason).then(src => {
    // une autre fiche a pu s'ouvrir pendant le recadrage : sa marque l'emporte
    if (blason !== marqueDemandee) return;
    marque.src = src;
    if (marque.complete) montreMarque(marque);
  });
}

/* La marque que la fiche attend, telle que la source la donne : c'est elle
   qu'on compare, l'adresse posée sur l'image étant celle du recadrage. */
let marqueDemandee = "";

function montreMarque(marque){
  marque.hidden = !marque.naturalWidth;
  delete marque.dataset.attend;
  if (!marque.hidden) rangeMarque();
}

/**
 * La pastille de situation, et le filigrane que les modèles de fiche lisent
 * sous elle.
 *
 * Le pavillon ne situe la fiche que s'il y en a plusieurs : sur un salon qui
 * tient sur un seul plan, il ne distingue rien, il porte souvent le nom du
 * salon — déjà en tête de la page — et l'onglet des pavillons le nomme de
 * toute façon. Il tombe aussi quand il redit ce nom-là, fût-ce parmi d'autres.
 * La pastille disparaît avec lui s'il ne reste aucun numéro derrière : une
 * zone n'en a jamais, un repère non plus.
 *
 * Elle vit ici parce que deux fiches l'écrivent — celle d'un stand ou d'une
 * zone, et celle d'un repère (`ouvrePoi`, _dessin.html). La seconde la
 * recopiait, et un second écrivain oublie une remise à zéro par champ ajouté :
 * le filigrane gardait le numéro du stand consulté juste avant, et la pastille
 * restait invisible pour avoir été cachée par la fiche d'une zone.
 */
function poseCode(pl, num, filigrane, salle){
  const memeNom = String(pl.libelle || "").trim().toLowerCase() ===
                  String(DATA.evenement || "").trim().toLowerCase();
  const pav = DATA.plans.length > 1 && !memeNom ? pl.libelle : "";
  /* Le hall tient à l'emplacement, pas au pavillon : un même plan peut en
     couvrir deux, et c'est le stand qui dit lequel. Il se glisse entre le
     pavillon et le numéro — l'ordre dans lequel on cherche un stand sur place,
     le hall puis l'allée.

     Il ne tombe pas, lui, quand le salon n'a qu'un pavillon : le pavillon ne
     distingue alors rien, tandis que le hall reste la porte par laquelle on
     entre. Il reste au contraire muet tant qu'on ne l'a pas coché, et un
     repère n'en a pas — il n'est sur aucun stand. */
  const hall = montre("stand", "hall") ? (salle || "") : "";
  $("dCode").textContent = [pav, hall, num].filter(Boolean).join(" · ");
  $("dCode").hidden = !$("dCode").textContent;
  /* Les modèles de fiche qui impriment le numéro du stand en grand le lisent
     sur l'en-tête : la pastille, elle, porte aussi le pavillon — trop long
     pour un filigrane, et ni une zone ni un repère n'ont de numéro. */
  // la pastille vit désormais dans un bloc à elle : c'est l'en-tête qu'on vise
  $("dCode").closest(".detail-hd").dataset.code = filigrane || "";
}

/**
